            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [FM-VLA: Force-based Memory for Vision-Language-Action Models in Contact-Rich Manipulation] (FM-VLA：用于接触丰富操作中视觉-语言-动作模型的基于力的记忆机制)
- **研究机构**: `清华大学、Microsoft Research`
- **Arxiv ID**: `2607.18231` | [点击跳转](https://arxiv.org/abs/2607.18231)

**0. 论文标题**
- **英文标题**: FM-VLA: Force-based Memory for Vision-Language-Action Models in Contact-Rich Manipulation
- **中文标题**: FM-VLA：用于接触丰富操作中视觉-语言-动作模型的基于力的记忆机制
- **研究机构**: 清华大学、Microsoft Research

**1. 整体逻辑**
- **研究任务**: 解决 VLA 模型在需要长程记忆的接触丰富（contact-rich）操作任务中的决策问题（例如：按指定次数按钮、擦指定次数碗、找隐藏积木）。
- **研究动机**: 现有的 VLA 大多是马尔可夫的，只看当前观测，缺乏历史记忆。虽然有基于视觉记忆的 VLA，但在视觉变化微小或被遮挡时（比如按按钮时视觉几乎没变化），视觉记忆不仅不可靠，而且计算开销大。现有的力觉 VLA 只利用短期力信号做即时修正，无法利用长程力信号来追踪交互进度（比如记住已经按了多少次）。
- **本质改动**: 引入基于力/扭矩传感器的长程记忆。用预训练的 VAE 将长程、高频的力信号压缩成少量紧凑的 token，结合短期关节状态 token，注入到动作生成模块中，让模型能“记住”过去的接触事件。
- **技术溯源**: 基于 $\pi_{0.5}$ 架构（底层 VLM 为 PaliGemma，动作生成采用 Flow-Matching）。

**2. 技术拆解**
- **重点改进**: 将长程力历史（wrench history）和短期本体感受历史（state history）编码为额外的条件 token，拼接到 Flow-Matching 动作专家的噪声动作 token 之后，作为动作生成的条件。
- **架构细节**: 
  - **输入**: 当前图像、语言指令、长程 6 轴力/扭矩序列（100Hz）、短期关节状态序列（最近 1 秒）。
  - **力历史处理**: 先做一阶 EMA 平滑去噪；训练时随机添加低幅高斯噪声前缀，防止模型通过序列长度“作弊”而忽略信号本身的内容。
  - **Force-VAE**: 采用 Perceiver-IO 架构，将变长的力序列压缩为固定的 $K$ 个 latent tokens（消融实验证明 $K=8$ 效果最好）。
  - **短期状态**: 取最近 1 秒的关节状态，展平后通过一个零初始化的线性层投影为 1 个 token，提供短期的空间运动感知。
  - **注入位置**: 在动作专家内部，序列排列为 `[噪声动作 tokens] + [K个力记忆 tokens] + [1个状态 tokens]`。
- **核心 Loss**: 
  - **阶段一（Force-VAE 预训练）**: 使用 Masked-ELBO Loss（重建 Loss + 带有 free-bits 正则化的 KL 散度），任务是重构力时间序列，学习通用的力信号表征。
  - **阶段二（VLA 微调）**: 使用 Flow-Matching Loss（预测去噪的恒定速度），冻结 VAE 编码器，仅使用其后验均值，端到端微调 VLM、动作专家及投影层。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 使用 AgiBot G1 双臂机器人采集的 3 个非马尔可夫任务（找杯子下的积木、按按钮 N 次、擦碗 N 次），共 750 条遥操作数据。
  - **Baselines**: $\pi_{0.5}$（无记忆基线）、TA-VLA（仅用短期力窗口）、$\pi$-MEM（SOTA 视觉记忆方法）。
- **评价指标**: 任务成功率（Success Rate），以及推理延迟（Latency）。
- **实验结果**: 
  - **成功率**: FM-VLA 平均成功率达到 83.3%，大幅领先无记忆的 $\pi_{0.5}$（27.8%）、短期力觉 TA-VLA（22.2%）和视觉记忆 $\pi$-MEM（53.7%）。
  - **优势场景**: 在极度依赖力觉计数的“按按钮”和“擦碗”任务上，FM-VLA 成功率（72.2%, 77.8%）远超视觉记忆 $\pi$-MEM（33.3%, 50.0%），证明视觉记忆在缺乏明显视觉变化时失效。
  - **推理效率**: FM-VLA 相比基线仅增加 3.3ms 延迟，而视觉记忆（16帧）增加了 129.3ms 延迟，做到了轻量且高效。
  - **消融结论**: VAE 架构在压缩长程力信号时优于 GRU 和 Q-Former；力记忆与短期状态记忆缺一不可（单用力记忆会导致接触前的动作乱飘）。

### 2. 🔥 [UniETP: Unifying Environments for Generalizable Embodied Task Planning] (UniETP：统一环境以实现可泛化的具身任务规划)
- **研究机构**: `北京大学 (Peking University)`
- **Arxiv ID**: `2607.18062` | [点击跳转](https://arxiv.org/abs/2607.18062)

**0. 论文标题**
- **英文标题**: UniETP: Unifying Environments for Generalizable Embodied Task Planning
- **中文标题**: UniETP：统一环境以实现可泛化的具身任务规划
- **研究机构**: 北京大学 (Peking University)

**1. 整体逻辑**
- **研究任务**: 具身任务规划（Embodied Task Planning）。即让智能体理解自然语言指令，在3D交互环境中规划并执行一系列动作来完成复杂任务。
- **研究动机**: 现有的具身模拟器（如AI2-THOR、Habitat等）和评测集各自为战，观察格式、动作定义和评估标准完全不统一。这导致在一个环境里训练的模型很难迁移到另一个环境，数据规模和任务多样性受限，无法全面评估和提升模型的真实泛化能力。
- **本质改动**: 构建了一个“大一统”的评测框架和中间件接口。底层将4个主流模拟器封装成统一的观察和动作空间，上层设计了一套自动化的任务生成流水线，生成了包含复杂逻辑、实例级定位和复杂指令的多样化任务数据集。
- **技术溯源**: 任务生成和自然语言指令生成依赖大语言模型（LLM）与常识知识库，评测对象为当前主流的视觉语言模型（VLMs）。

**2. 技术拆解**
- **重点改进**: 
  1. **环境层（Environment Layer）统一**：解耦了智能体与特定模拟器。定义了统一的观察空间（局部视角+全局信息+动作反馈）和参数化的动作空间（导航+操作）。引入了“统一场景图（USG）”作为环境抽象，并建立了一套基于一阶逻辑的评估系统，支持复杂任务目标的严格判定。
  2. **任务层（Task Layer）自动生成**：设计了138种任务模板，结合各模拟器的常识知识库（AKB）和LLM，自动生成了500多个任务实例。任务细分为五个评测维度：原子任务、组合任务、复杂逻辑（如时序约束、全称量词）、复杂语言理解和实例级定位（Instance Grounding）。
- **架构细节**: 
  - **输入**：自然语言指令、局部RGB图像（可选带bbox）、全局场景信息（房间/静态物体/可移动物体列表）、上一步动作的执行反馈。
  - **输出**：参数化动作（动作类型 + 目标物体/房间的ID或bbox）。
  - **难度分级**：设计了M1、M2、M3三个评估模式。M1提供全知视角和高级复合动作；M2提供部分先验和基础动作；M3最接近真实未知环境，仅提供房间先验，智能体必须主动探索并通过输出bbox来精准定位物体。
- **核心 Loss**: 本文提出的是Benchmark和评测框架，不涉及模型训练的Loss。评估依赖任务成功率，通过统一场景图（USG）和预定义的逻辑公式（包含一阶谓词、布尔逻辑、时序算子等）来严格判定任务目标是否达成。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：作者构建的UniETP benchmark（包含536个任务实例，跨越AI2-THOR、VirtualHome、Habitat、BEHAVIOR四个模拟器，涵盖170个场景布局）。
  - **Baseline**：近期主流的视觉语言模型（VLMs）。（注：提供的原文文本在实验具体数据展示前截断，未列出具体对比的模型名称）。
- **评价指标**: 任务成功率（Success Rate）。通过统一场景图和逻辑公式进行自动化的严格判定，而非简单的最终状态匹配。
- **实验结果**: （注：原文文本在实验结果具体数值部分截断，未提供具体的提升百分比）。从实验设计和分析维度来看，该Benchmark主要揭示了当前VLM在复杂逻辑推理、实例级视觉定位和长视野规划上的性能瓶颈。随着环境先验减少和感知要求提高（评估模式从M1向M3递进），模型的规划成功率会面临显著挑战，证明了该统一框架在评估智能体泛化能力上的有效性。

### 3. 🔥 [RynnBrain 1.1: Towards More Capable and Generalizable Embodied Foundation Model] (RynnBrain 1.1：迈向更强大、更具泛化能力的具身基础模型)
- **研究机构**: `阿里达摩院 (DAMO Academy, Alibaba Group)、湖畔实验室 (Hupan Lab)`
- **Arxiv ID**: `2607.17977` | [点击跳转](https://arxiv.org/abs/2607.17977)

**0. 论文标题**
- **英文标题**: RynnBrain 1.1: Towards More Capable and Generalizable Embodied Foundation Model
- **中文标题**: RynnBrain 1.1：迈向更强大、更具泛化能力的具身基础模型
- **研究机构**: 阿里达摩院 (DAMO Academy, Alibaba Group)、湖畔实验室 (Hupan Lab)

**1. 整体逻辑**
- **研究任务**: 具身多模态大模型的预训练与 VLA（视觉-语言-动作）后训练，涵盖具身感知、空间推理、3D定位和动作规划。
- **研究动机**: 上一代 RynnBrain 1.0 存在两个痛点：一是其输出的 2D 抓取矩形框与真实机器人的物理操作（如夹爪接触点）不够对齐；二是不同机器人本体的动作空间差异大，难以在同一个 VLA 策略中进行联合训练。
- **本质改动**: 
  1. 预训练阶段：用“接触点预测”替换原有的抓取框检测，并引入“原生 3D 定位”任务，让模型输出直接对齐物理操作。
  2. 后训练阶段：设计了“统一的跨本体动作空间”和“本体专属掩码”，让不同机器人的数据可以放在一个模型里联合训练。
- **技术溯源**: 基于 Qwen3.5 系列（包含 2B、9B 和 122B-A10B MoE 版本）作为 LLM 基座，采用 Decoder-only 的视觉-语言架构。

**2. 技术拆解**
- **重点改进**: 
  1. **接触点预测**：抛弃了 1.0 版本中预测抓取矩形框四个角点的方法（因为矩形框尺寸依赖特定夹爪且存在冗余），改为预测抓取中心点坐标和平面旋转角 $(x, y, \theta)$，直接输出对下游策略更有用的空间锚点和姿态。
  2. **原生 3D 定位**：在 2B 和 9B 模型中引入 3D 包围盒预测。输入单张图像和相机内参，直接输出相机坐标系下的 9 维物理参数（中心点、尺寸、姿态），将 2D 视觉理解直接映射到 3D 物理空间。
  3. **跨本体统一动作空间**：将不同机器人的动作按语义（如身体部位）进行分组对齐。在联合训练时，通过“本体专属掩码（embodiment-specific masking）”只激活当前机器人可用的动作维度，避免了不同动作空间之间的强行对齐和冲突。
- **架构细节**: 
  - **模型结构**：视觉编码器 + 视觉-语言投影层 + LLM (Qwen3.5)。引入了 DeepStack 和 Interleaved MRoPE 以支持长上下文的时空建模。
  - **模型规模**：2B、9B（Dense 架构），122B-A10B（MoE 架构）。
  - **统一输出空间**：将文本、2D 框、点、轨迹、3D 框、接触点全部离散化为 token（连续坐标映射到 0-1000 的整数），在同一个自回归接口下生成，不引入额外的任务特定 Decoder。
- **核心 Loss**: 
  - **主 Loss**：标准的因果自回归交叉熵损失（Next-token prediction）。所有任务（包括 3D 定位、接触点预测和动作生成）均转化为序列生成任务，统一计算文本和空间/动作 token 的负对数似然，没有额外的辅助 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **预训练数据**：混合了通用 MLLM 数据、多维认知数据、时空定位数据、3D 定位数据（WildDet3D, FoundationPose 等）、接触点数据（GraspNet 等）和规划数据。
  - **Baseline**：各类闭源大模型、开源多模态模型、基于 Qwen 初始化的 VLA 策略，以及代表性的通用 VLA 模型。
  - **真机平台**：Unitree G1（人形）、Astribot-S1（双臂）、Tianji-Wuji（灵巧手）。
- **评价指标**: 
  - **认知与定位**：VSI-Bench, MMSI, RefSpatial-Bench 等基准测试得分。
  - **真机操作**：任务成功率 (Success Rate) 和 过程分数 (Process Score)。
- **实验结果**: 
  - **基准测试**：能力随参数量增加呈现明显的 Scaling Law。122B-A10B 模型在 VSI-Bench、MMSI 和 RefSpatial-Bench 上超越了所有参与评估的闭源和开源模型。2B 和 9B 模型在加入 3D 监督后，语言条件下的 3D 定位能力显著提升。
  - **真机实验**：基于 RynnBrain 1.1 初始化的 VLA 策略，在 Astribot 和 Tianji-Wuji 上的表现优于基于 Qwen 的 VLA 和主流通用 VLA。
  - **联合训练收益**：多任务、多本体的联合训练（Joint training）比单独微调单任务策略，带来了更高的平均过程分数和最终成功率，证明了统一动作空间和联合训练的有效性。

### 4. 🔥 [Reasoning as a Double-Edged Sword: Architecture and Cross-Stage Robustness in Vision-Language-Action Models] (推理是一把双刃剑：视觉-语言-动作模型中的架构与跨阶段鲁棒性)
- **研究机构**: `墨尔本大学 (University of Melbourne)`
- **Arxiv ID**: `2607.17786` | [点击跳转](https://arxiv.org/abs/2607.17786)

**0. 论文标题**
- **英文标题**: Reasoning as a Double-Edged Sword: Architecture and Cross-Stage Robustness in Vision-Language-Action Models
- **中文标题**: 推理是一把双刃剑：视觉-语言-动作模型中的架构与跨阶段鲁棒性
- **研究机构**: 墨尔本大学 (University of Melbourne)

**1. 整体逻辑**
- **研究任务**: 评估VLA（视觉-语言-动作）模型中不同“推理”架构（无推理、文本思维链CoT、隐式迭代推理）在面对各阶段扰动时的鲁棒性，以及利用推理输出做运行时安全监控的有效性。
- **研究动机**: 业界有个直觉：“先推理再行动”能更好地吸收输入扰动，让模型更鲁棒。但以前大家测鲁棒性都是把VLA当黑盒，没把“推理”这一步单独拆出来看。没人说得清推理到底是吸收了扰动、放行了扰动，还是放大了扰动。
- **本质改动**: 本文没有提出新模型，而是构建了一个“跨阶段攻击矩阵”，在视觉、推理、动作三个阶段分别注入噪声和对抗攻击，对比了三种主流推理架构的VLA。同时从机制上解释了隐式迭代推理为什么脆弱，并证伪了基于文本CoT的一致性防御在自适应攻击下的有效性。
- **技术溯源**: 基于 OpenVLA-OFT（无推理，约7B参数）、DeepThinkVLA（文本CoT，约3B参数）、RD-VLA（隐式迭代推理，0.5B参数）这三个开源VLA基座进行微调和分析。

**2. 技术拆解**
- **重点改进**: 
  1. 提出跨阶段攻击矩阵：在视觉层加高斯噪声或PGD对抗攻击，在推理层做文本实体替换（仅针对CoT），在动作层加高斯噪声，以此隔离不同阶段的敏感度。
  2. 机制溯源分析：通过改变RD-VLA的迭代深度K（K-sweep），证伪了“误差随迭代次数乘性累积”的假设，证明隐式迭代模型的脆弱性是结构性的（由编码器和不动点输出决定），而不是因为迭代次数多累积出来的。
  3. 防御上限测试：设计了“计划-动作一致性探针”来监控文本CoT输出，并在自适应攻击（Adaptive attack）下测试这种防御手段的真实上限。
- **架构细节**: 
  - 对比了三种架构：OpenVLA-OFT（单次前向，Prismatic视觉骨干 + MLPResNet动作头），DeepThinkVLA（文本CoT，PaliGemma骨干 + 离散动作token），RD-VLA（隐式迭代，K=12权重共享循环，Prismatic骨干 + 线性动作投影）。
  - 输入是图像和文本指令，输出是7自由度（7-DOF）动作。
- **核心 Loss**: 
  - 本文是评估论文，没有训练Loss。攻击阶段使用的是标准的对抗攻击Loss（如PGD-10优化视觉扰动的交叉熵或动作偏差Loss）。
  - 防御阶段使用的是推理时的监控打分函数（非反向传播Loss）：对CoT文本中的实体匹配、方向匹配、夹爪状态和语法解析进行加权求和，用来判断推理计划和最终动作是否一致。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO（4个场景共40个任务）、SimplerEnv（Google-Robot任务）以及 LIBERO-Plus（自然扰动测试）。
  - Baseline：三种模型互为Baseline（无推理 vs 文本CoT vs 隐式迭代）。
- **评价指标**: 
  - 任务成功率（Success Rate, SR）。
  - 扰动放大率（Amplification ratio, ρ），衡量输入扰动被放大的倍数。
  - 防御探针的AUC（ROC曲线下面积）和匹配假阳性率（matched-FPR）下的防御成功率。
- **实验结果**: 
  1. **隐式迭代模型最脆弱**：在视觉高斯噪声（σ=0.2）下，RD-VLA成功率直接暴跌到14.8%（下降74.3%），而文本CoT（92.7%）和无推理（89.0%）几乎不受影响。在白盒PGD-10攻击下，RD-VLA成功率为0%，文本CoT为49.8%，无推理为18.2%。
  2. **脆弱性是结构性的，不是累积的**：对RD-VLA做迭代深度K-sweep（K=4,8,12），发现扰动放大率ρ几乎不随K变化（ρ(12)/ρ(8)=1.005）。这直接推翻了误差随深度乘性放大的假设，说明放大器在于编码器结构和循环的不动点本身。
  3. **基于推理的防御在自适应攻击下失效**：基于文本CoT的“计划-动作一致性探针”在朴素评估下AUC高达0.996，看起来完美，但在自适应攻击下骤降到0.493（等同于瞎猜）。把这个探针和动作异常探针融合，在严格控制假阳性率的情况下，防御后的成功率依然无法超过不加防御的裸模型。

### 5. 🔥 [Foresight Residual RL for Long-Horizon Robot Manipulation with Vision-Language-Action Models] (面向VLA模型长视野机器人操作的前瞻性残差强化学习)
- **研究机构**: `Rutgers University (罗格斯大学)`
- **Arxiv ID**: `2607.16506` | [点击跳转](https://arxiv.org/abs/2607.16506)

**0. 论文标题**
- **英文标题**: Foresight Residual RL for Long-Horizon Robot Manipulation with Vision-Language-Action Models
- **中文标题**: 面向VLA模型长视野机器人操作的前瞻性残差强化学习
- **研究机构**: Rutgers University (罗格斯大学)

**1. 整体逻辑**
- **研究任务**: 长视野（Long-Horizon）机器人操作任务，特别是包含多个因果耦合子任务的接触密集型装配任务（如用扳手拧螺母）。
- **研究动机**: 现有方法在拆分长视野任务时，通常独立训练各个子任务并给予固定的稀疏成功奖励。这会导致一个典型问题：当前子任务虽然在几何上判定为成功，但留给下一个子任务的终止状态可能很脆弱或不友好（例如扳手抓得不稳，后续一插就掉）。这种子任务间的耦合导致单独看成功率很高，但串联执行时整体成功率很低。
- **本质改动**: 提出“前瞻性残差强化学习（Foresight Residual RL）”。在训练当前子任务的残差策略时，不再给固定的成功奖励，而是将奖励乘以一个“前瞻价值”——即当前子任务的终止状态能让下一个子任务成功的概率。通过从后往前逆向训练，并离线训练一个视觉前瞻预测器来实现这一机制。
- **技术溯源**: 基于 VLA 基座模型（文中具体使用了 $\pi_0$ 模型），结合 PPO 算法进行残差强化学习（Residual RL）。

**2. 技术拆解**
- **重点改进**: 
  1. **奖励重塑**：将子任务的稀疏成功奖励乘上前瞻预测器输出的下游成功概率，引导策略生成对后续任务更友好的终止状态。
  2. **逆向归纳训练**：从最后一个子任务开始，从后往前依次训练残差策略，确保训练当前子任务时，下游策略已经固定。
  3. **离线前瞻预测器**：用冻结的基础策略跑出终止状态，用下游策略进行多次 rollout 统计成功率，离线训练一个视觉网络来预测该成功率。
- **架构细节**: 
  - **输入**：2张 256×256 的 RGB 图像（全局第三人称视角和腕部相机视角）+ 8维本体感受（末端位姿和夹爪状态）。
  - **输出**：7维操作空间控制增量（3D位置、3D轴角旋转、1D夹爪命令）。
  - **模型结构**：冻结的 VLA 基础策略 + 小权重的残差策略（$a_t = \pi^0(o_t) + \alpha \cdot \pi^{res}(o_t)$）。前瞻预测器是一个视觉网络，输入终止状态图像，输出 0 到 1 之间的概率值。
- **核心 Loss**: 
  - **残差策略 Loss**：使用 PPO 的标准策略损失，Reward 设为 $r_t = \beta_k(s_{t+1}) \cdot p_\phi(o_{t+1})$（当前子任务成功指示器 × 前瞻预测器概率）。
  - **前瞻预测器 Loss**：二项分布负对数似然损失（Binomial NLL），直接拟合多次 rollout 得到的成功次数，而不是简单的 MSE 回归，以保证概率校准。

**3. 实验结果**
- **数据集和baseline**: 
  - **环境/数据集**：NVIDIA Isaac Gym 中的扳手-螺母装配任务（包含抓取、移动插入、旋转三个强耦合阶段）。
  - **Baseline**：标准子任务残差 RL（Standard subtask residual RL）、原始 VLA 基线策略。
- **评价指标**: 
  - 整体任务成功率（Full-task success rate，即三个子任务全部成功）。
  - 单个子任务成功率（Per-subtask success rate）。
- **实验结果**: 
  - 整体任务成功率达到 85.6%，相比标准子任务残差 RL 的 54.5% 绝对提升了 31.1%。
  - 单个子任务的成功率与 baseline 相比没有显著变化。这直接证明了该方法优化的是“产生哪种成功状态（交接质量）”，而不是单纯提高单步子任务的成功率。

### 6. 🔥 [Test-Time Scaling for World Action Models via Zero-Shot Geometric Verification] (基于零样本几何验证的世界动作模型测试时计算扩展)
- **研究机构**: `密歇根大学 (University of Michigan), 英伟达 (NVIDIA)`
- **Arxiv ID**: `2607.17454` | [点击跳转](https://arxiv.org/abs/2607.17454)

**0. 论文标题**
- **英文标题**: Test-Time Scaling for World Action Models via Zero-Shot Geometric Verification
- **中文标题**: 基于零样本几何验证的世界动作模型测试时计算扩展
- **研究机构**: 密歇根大学 (University of Michigan), 英伟达 (NVIDIA)

**1. 整体逻辑**
- **研究任务**: 世界动作模型（WAM）的推理优化与动作选择。WAM 能同时输出动作序列和预测的未来图像，任务是如何在推理时利用这些预测图像来选出最优动作。
- **研究动机**: 现有的测试时计算扩展（如 Best-of-N 采样）要么在每个决策步都固定采样 N 次（计算太慢、浪费算力），要么依赖需要额外训练的奖励模型或特定模型内部的置信度。需要一种免训练、且能自适应决定“何时需要额外采样”和“如何挑选最优动作”的方法。
- **本质改动**: 提出免训练的两阶段一致性框架 Gated GeoBoN。先用低成本的光流和动作投影一致性做“门控”，判断初始动作靠不靠谱；不靠谱时再触发多次采样，并用冻结的几何基础模型计算跨视角深度重投影误差，以此作为免训练的 reward 来挑选最优动作。
- **技术溯源**: 基于现有的开源 WAM 基座（Cosmos Policy, X-WAM, LingBotVA, Motus），以及冻结的几何基础模型 VGGT-Ω。

**2. 技术拆解**
- **重点改进**: 
  1. 动作-未来门控（Action-Future Gate）：通过对比图像光流和末端执行器运动投影，低成本判断初始生成的 rollout 是否内部一致，决定是否需要额外采样。
  2. 跨视角几何评估器（GeoBoN）：利用多视角几何一致性作为免训练的评估信号，对采样的多个未来预测进行 Best-of-N 排序。
- **架构细节**: 
  - 输入为多视角当前图像、本体感觉和语言指令，WAM 输出动作序列及预测的未来主视角和腕部视角图像。
  - 门控阶段：计算当前主视角与预测未来主视角的稠密光流，与末端执行器通过正运动学计算的投影位移求余弦相似度。低于阈值则触发额外采样。
  - 选择阶段：将预测的主、腕视角图像输入冻结的 VGGT-Ω 获取深度和相机位姿。将腕部视角的 3D 点云投影到主视角，计算深度重投影误差，选误差最小的 rollout 执行。
- **核心 Loss**: 本文是纯推理时（test-time）方法，无训练 Loss。核心是推理时的**打分函数**：
  - 门控打分：光流与动作投影位移的余弦相似度。
  - 选择打分：跨视角深度重投影不一致性得分（预测主视角深度与腕部视角投影深度的对数比值的绝对值平均）。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：RoboCasa, LIBERO Long, RoboTwin 2.0。
  - Baseline：单次采样 Baseline、固定预算 GeoBoN、基于 VGGT 置信度的选择器、基于未来共识（Consensus）的选择器、以及 Cosmos Policy 自带的 Value Head。
- **评价指标**: 任务成功率（Success Rate）、平均推理延迟（Avg. Latency）、额外采样触发率（BoN Trigger %）。
- **实验结果**: 
  - 固定预算 GeoBoN (N=8) 在所有设置下均提升成功率。例如 RoboCasa 上 Cosmos Policy 从 66.3% 升至 68.4%，X-WAM 从 80.8% 升至 82.5%；LIBERO Long 上 Cosmos Policy 从 97.5% 升至 99.3%。
  - Gated GeoBoN 在仅触发 14.2%~34.5% 额外采样的情况下，恢复了固定预算方法 63.6%~85.7% 的成功率增益，同时延迟降至固定预算的约三分之一（如 RoboCasa/Cosmos 延迟从 3.65s 降至 1.29s）。
  - 消融实验证明跨视角重投影比置信度或共识选择器更稳定，且 GeoBoN 持续优于 Cosmos Policy 自带的训练好的 Value Head。失败分析指出 N 过大（如 N=16）时，评估器对视觉相似样本的几何误判会导致成功率饱和或下降，证明了适度采样加门控的必要性。

### 7. 🔥 [Depth-Regularized JEPA World Models Learn More Transferable Representations from Real Outdoor Robot Data] (深度正则化的JEPA世界模型从真实户外机器人数据中学习更具迁移性的表征)
- **研究机构**: `Aigen (一家农业机器人公司)`
- **Arxiv ID**: `2607.16314` | [点击跳转](https://arxiv.org/abs/2607.16314)

**0. 论文标题**
- **英文标题**: Depth-Regularized JEPA World Models Learn More Transferable Representations from Real Outdoor Robot Data
- **中文标题**: 深度正则化的JEPA世界模型从真实户外机器人数据中学习更具迁移性的表征
- **研究机构**: Aigen (一家农业机器人公司)

**1. 整体逻辑**
- **研究任务**: 基于JEPA（联合嵌入预测架构）的视觉世界模型，通过预测未来状态的潜在表征（Latent representations）来学习环境动态，服务于机器人的下游规划与控制。
- **研究动机**: 现有的紧凑型JEPA模型（如LeWM）在简单的模拟环境中表现不错，但在视觉复杂的真实户外环境（如农业场景中的光照剧变、阴影、植被遮挡）中，纯靠最大化特征熵（SIGReg）来防止表征坍塌，会导致模型学不到真实的3D物理和几何结构，域外（OOD）泛化能力较差。
- **本质改动**: 引入“仅在训练时使用”的深度（Depth）正则化和预测器过参数化。训练时用深度图监督RGB特征，注入3D几何先验；推理时只用RGB，不增加任何推理计算负担。
- **技术溯源**: 基于 LeWorldModel (LeWM) 架构，视觉编码器采用 ViT-Tiny。

**2. 技术拆解**
- **重点改进**: 
  1. **训练时深度对齐**：将RGB图像和对应的深度图输入同一个编码器，用余弦相似度让RGB特征去对齐深度特征（深度分支截断梯度），从而把几何结构先验“蒸馏”到RGB表征中。
  2. **训练时预测器过参数化**：在预测器的MLP层加入低秩分支（RepLinear），提升训练时的拟合能力，防止预测器容量瓶颈限制编码器学习复杂的几何特征。训练结束后将低秩分支权重代数融合回主干，推理时网络结构不变。
- **架构细节**: 
  - **模型规模**：18M参数的紧凑型模型。
  - **输入输出**：输入为3帧224×224的RGB历史图像、动作和本体感受信息；输出为下一帧的潜在表征（维度192）。训练时额外输入深度图（转为3通道灰度图）。
  - **模型结构**：ViT-Tiny 作为共享编码器，后接一个6层的 Predictor（预测器）进行潜空间自回归预测。
- **核心 Loss**: 
  - 主Loss由三部分组成：$\mathcal{L} = \mathcal{L}_{pred} + 0.09 \mathcal{L}_{sigreg} + 0.1 \mathcal{L}_{depth}$。
  - $\mathcal{L}_{pred}$ 是潜空间预测损失。
  - $\mathcal{L}_{sigreg}$ 是LeWM原有的SIGReg正则项，强制特征分布各向同性以防止表征坍塌。
  - $\mathcal{L}_{depth}$ 是深度对齐损失，计算公式为 $1 - \cos(f(x_{RGB}), \text{stop\_grad}(f(x_{depth})))$。
  - 没有像素级重建或视频重建等辅助任务，纯潜空间预测。

**3. 实验结果**
- **数据集和baseline**: 
  - **训练/验证集**：Aigen农业机器人在真实户外采集的数据（约3.1万帧，85个episodes）。
  - **OOD测试集**：TartanGround 基准测试（包含不同机器人平台、不同环境和sim-to-real gap，约1.5万帧）。
  - **Baseline**：Vanilla LeWM（无深度正则化的原版模型）和 Frozen DINOv2（作为单帧表征的参考基线）。
- **评价指标**: 
  1. **视觉里程计（VO）线性探针**：冻结表征，用线性层回归自车运动（ego-motion），评估MSE。
  2. **Surprise 检测（预测误差分析）**：给模型输入物理合理和不合理（如瞬移、时间反转、亮度突变、颜色交换）的视频片段，计算预测误差（Surprise score），重点看合理与不合理片段的**分数差值（Separation）**，差值越大说明模型对物理违规越敏感。
  3. **多步推演保真度（Rollout fidelity）**：给定真实动作，自回归预测未来10步和20步的表征，计算与真实表征的余弦相似度（目标相似度和轨迹相似度）。
- **实验结果**: 
  - **表征质量**：VO探针的MSE从0.0022降至0.0015（相对降低33%），且优于DINOv2（0.0029），说明学到的特征包含了更好的运动几何信息。
  - **物理理解（Surprise 检测）**：在域内验证集上，Surprise分数差值从0.067提升到0.120；在OOD测试集上从0.035大幅提升至0.099（近3倍）。不仅对几何扰动（瞬移）更敏感，对非几何的物理扰动（亮度突变、颜色交换）的识别能力也显著增强。
  - **多步推演与泛化**：在域内数据上，10步推演的目标相似度略低于原版（0.890 vs 0.903），但在OOD数据上全面反超，且步长越长优势越大（20步目标相似度从0.458提升至0.537）。说明模型牺牲了轻微的域内过拟合，换来了显著更强的域外泛化能力。
