            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [TEMPO: Semantic-Action Decoupled RL Post-Training for Vision-Language-Action Models] (TEMPO：面向视觉-语言-动作模型的语义-动作解耦强化学习后训练)
- **研究机构**: `浙江工商大学、瑞典皇家理工学院 (KTH)`
- **Arxiv ID**: `2608.07314` | [点击跳转](https://arxiv.org/abs/2608.07314)

**0. 论文标题**
- **英文标题**: TEMPO: Semantic-Action Decoupled RL Post-Training for Vision-Language-Action Models
- **中文标题**: TEMPO：面向视觉-语言-动作模型的语义-动作解耦强化学习后训练
- **研究机构**: 浙江工商大学、瑞典皇家理工学院 (KTH)

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的在线强化学习（RL）后训练，用于提升机器人在长程操作任务中的表现。
- **研究动机**: 现有的RL后训练方法通常用同一个更新频率去更新VLA的所有可训练模块。但实际上，语义层需要保持稳定以防特征漂移，而动作层需要高频更新来快速吸收环境交互的控制反馈。统一频率更新会导致语义表示不稳定，进而阻碍动作策略的学习。
- **本质改动**: 提出双时间尺度的RL后训练框架。冻结VLM主干，把语义投影层和动作专家的RL更新频率解耦：语义层低频更新以保持潜在动作空间稳定，动作层高频更新以快速学习控制策略。
- **技术溯源**: 基于 FLOWER（一个基于流匹配的VLA模型）作为基座，强化学习算法基于 TD3。

**2. 技术拆解**
- **重点改进**: 将原本单一的RL更新循环拆分为两个独立的模块级TD3循环，并引入更新频率比参数（动作层更新频率 / 语义层更新频率 > 1），让动作专家的更新频率高于语义投影层。
- **架构细节**: 
  - 输入为视觉图像和语言指令。
  - 模型分为三部分：冻结的VLM主干提取语义特征；语义投影层将语义特征映射为潜在动作；动作专家将潜在动作映射为最终的机器人动作块。
  - 构建两个独立的TD3循环，各自拥有独立的重放缓冲区、双Critic网络和目标网络。语义层的状态是语义特征，动作是潜在动作；动作层的状态是潜在动作，动作是机器人动作块。在更新动作专家时，对输入的潜在动作使用停止梯度（stop-gradient）操作，切断梯度向语义层的回传。
- **核心 Loss**: 
  - 使用环境交互得到的稀疏奖励（任务成功为1，失败为0）。
  - 语义层：Critic最小化TD误差，Actor（语义投影层）最大化Critic输出的Q值。
  - 动作层：Critic最小化TD误差，Actor（动作专家）最大化Critic输出的Q值。无其他辅助Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：CALVIN ABC->D 仿真基准（长程语言条件操作），以及两个真实世界任务（推积木入抽屉、从抽屉取小车）。
  - Baseline：对比了 RT-1、OpenVLA、$\pi_0$、FLOWER 等主流VLA模型，以及 FLOWER-RL（单循环统一更新的RL后训练基线）。
- **评价指标**: 
  - 仿真：完成5个连续指令链中前k个任务的成功率（SR1-SR5），以及平均连续完成的任务数（Avg. Len.）。
  - 真机：在线训练过程中的评估奖励（Reward）。
- **实验结果**: 
  - 在CALVIN上，TEMPO的SR5达到81.7%，平均连续完成4.59个任务。相比基座FLOWER（SR5 77.8%）提升了3.9个百分点，相比单循环RL基线FLOWER-RL（SR5 78.4%）提升了3.3个百分点。
  - 在真机实验中，TEMPO能获得更高且更稳定的奖励，而基线方法容易出现在逻辑上犯错（例如不打开抽屉直接去推积木）导致任务失败。

### 2. 🔥 [Decoupling Intention from Trajectory: A Representational Deduction Framework for World Action Models] (解耦意图与轨迹：一种用于世界动作模型的表示演绎框架)
- **研究机构**: `南京大学 (NJU)、京东 (JD)、香港科技大学 (HKUST) 等`
- **Arxiv ID**: `2608.06994` | [点击跳转](https://arxiv.org/abs/2608.06994)

**0. 论文标题**
- **英文标题**: Decoupling Intention from Trajectory: A Representational Deduction Framework for World Action Models
- **中文标题**: 解耦意图与轨迹：一种用于世界动作模型的表示演绎框架
- **研究机构**: 南京大学 (NJU)、京东 (JD)、香港科技大学 (HKUST) 等

**1. 整体逻辑**
- **研究任务**: 机器人操作中的世界动作模型（WAM），即根据视觉观测和语言指令理解世界状态演变，并生成动作轨迹。
- **研究动机**: 现有的WAM通常通过预测未来视觉帧来指导动作生成。但这导致模型将计算资源消耗在像素级重建上，且高层运动意图（想做什么）和底层动作轨迹（具体怎么做）在特征表示上发生纠缠。这不仅削弱了模型对物理状态转移的理解，还导致推理时因为要先生成视频再反推动作，速度非常慢。
- **本质改动**: 提出PILOT框架，引入“表示演绎（RD）”机制。把高层运动意图（Motion CoT）从底层轨迹中剥离出来。用可学习的token专门提取运动语义，并在特征空间（而非像素空间）预测未来状态来监督这些token。推理时直接用这些语义token指导动作生成，完全省去耗时的未来帧生成步骤。
- **技术溯源**: 基于 Wan2.2（视频扩散模型作为世界模型基座）、VJEPA2-AC（提取物理状态特征）、Flow-Matching（动作解码）以及 Perceiver/DiT 架构。

**2. 技术拆解**
- **重点改进**: 
  1. 引入因果解耦注意力机制：用64个可学习查询token从视觉-语言上下文中提取运动语义（Motion CoT），在注意力计算时阻断动作扩散噪声的反向传播，保证语义token的纯粹性。
  2. 引入表示演绎（RD）监督：不监督像素，而是用冻结的VJEPA2-AC提取当前和未来帧的物理状态特征，训练一个因果动力学引擎（CDE），让CDE根据提取出的运动语义去预测未来状态特征。这逼迫模型学到真正的物理状态转移，而不是单纯拟合像素画面。
- **架构细节**: 
  模型包含三个分支，总参数量5.4B。
  1) 世界模型分支：基于Wan2.2，编码当前图像和指令，并在训练时辅助预测未来帧的潜变量。
  2) 动作模型分支：基于Perceiver和DiT，用可学习query提取语义后，通过4步Flow-matching去噪生成动作块（action chunk）。
  3) RD分支：冻结的VJEPA2-AC编码器 + 轻量级CDE，仅在训练时工作。
  输入为当前RGB、语言指令、本体状态（训练时额外输入未来RGB）；输出为动作块。
- **核心 Loss**: 
  总Loss由三部分组成：
  1) L_act：动作生成的Flow-matching速度损失。
  2) L_wm：世界模型分支的未来帧潜空间预测损失（辅助任务）。
  3) L_RD：表示演绎损失，即CDE预测的未来特征与VJEPA提取的真实未来特征之间的SmoothL1损失，用于监督运动语义token。

**3. 实验结果**
- **数据集和baseline**: 
  仿真数据集：LIBERO, LIBERO-Plus, RoboCasa-GR1。
  真机数据集：Agibot-G1人形机器人（标准任务、泛化迁移、少样本微调）。
  对比方法：π0.5, OpenVLA-OFT, UniVLA, VLA-JEPA, Motus 等主流VLA、LAM和WAM模型。
- **评价指标**: 任务成功率（Success Rate）、推理延迟（Inference Latency）。
- **实验结果**: 
  1) 仿真成功率：在LIBERO上达到97.9%（SOTA），超过Motus (97.7%) 和 π0.5 (96.2%)；在RoboCasa-GR1上达到62.6%。
  2) 真机成功率：平均达到83.1%，在泛化和少样本微调任务上表现出更好的鲁棒性。
  3) 推理速度：因为推理时跳过了“预测未来帧再反推动作”的流程，直接用Motion-CoT指导动作生成，推理延迟降低了90%。

### 3. 🔥 [Cross-View Action Consistency for Camera-Robust Vision-Language-Action Policies] (面向相机鲁棒视觉-语言-动作策略的跨视角动作一致性)
- **研究机构**: `清华大学, 阿姆斯特丹大学, 阿姆斯特丹自由大学`
- **Arxiv ID**: `2608.06965` | [点击跳转](https://arxiv.org/abs/2608.06965)

**0. 论文标题**
- **英文标题**: Cross-View Action Consistency for Camera-Robust Vision-Language-Action Policies
- **中文标题**: 面向相机鲁棒视觉-语言-动作策略的跨视角动作一致性
- **研究机构**: 清华大学, 阿姆斯特丹大学, 阿姆斯特丹自由大学

**1. 整体逻辑**
- **研究任务**: 提升 VLA（视觉-语言-动作）模型在场景相机位置或角度发生改变时的鲁棒性。
- **研究动机**: 现有的 VLA 模型在固定相机下微调后，相机稍微被碰一下或挪个位置就容易失效。以前的解法通常要加深度图、点云或者相机内外参，这改变了推理时的硬件和输入要求。本文想在不增加任何额外传感器（只用单张场景 RGB、语言和关节状态）的前提下，纯靠改训练目标来解决这个问题。
- **本质改动**: 在训练时引入“跨视角动作流一致性”约束。给模型看同一物理状态下不同相机视角的两张图，强迫模型在这两个视角下预测的“动作速度场”完全一致，从而让模型学会忽略视角变化，只关注物理状态。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_{0.5}$ 模型基座，以及 Flow Matching（流匹配）动作生成范式。

**2. 技术拆解**
- **重点改进**: 放弃了传统的“特征级”对齐，直接做“动作速度场”级别的对齐。作者发现中间特征一致不代表最终生成的动作一致，直接约束生成动作的积分变量（速度场）更直接有效。
- **架构细节**: 
  - **输入输出**：输入为单张场景 RGB 图、语言指令、机器人本体状态，输出为连续动作块。为了做严格的控制变量，实验全程屏蔽了腕部相机（wrist camera），防止模型偷懒依赖不受场景视角影响的腕部图像。
  - **数据构建**：仿真里通过重置 MuJoCo 状态并重新渲染，生成“动作等价视图对”；真机里通过多相机同步录制生成。
  - **模型结构**：沿用 $\pi_{0.5}$ 的视觉编码器 + Transformer + Flow Matching 动作头架构。
- **核心 Loss**: 
  - **主 Loss**：标准的 Flow Matching Loss ($\mathcal{L}_{FM}$)，让两个视角的预测速度场都去拟合真实的动作目标。
  - **辅助 Loss**：跨视角一致性 Loss ($\mathcal{L}_{CV}$)，计算两个视角在相同噪声和时间步下预测的速度场的 L2 距离。总 Loss 为两者加权求和（$\mathcal{L} = \mathcal{L}_{FM} + \lambda_{CV} \mathcal{L}_{CV}$）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真使用 LIBERO-Plus（相机扰动赛道），真机使用 3 个桌面操作任务（抓取放置、合笔记本、取耳机）。
  - **Baseline**：仅在原始视角训练的基线（Nominal-only）、朴素混合视角 SFT、以及在相同配对数据上只跑 Flow Matching 的基线（FM-only）。
- **评价指标**: 任务成功率（Success Rate），通过多次 rollout 统计。
- **实验结果**: 
  - **仿真端**：在 LIBERO-Plus 相机扰动测试中，本文方法成功率达 87.2%，比使用相同配对数据的 FM-only 基线（79.8%）高 7.4 个百分点，比朴素混合视角 SFT（74.7%）高 12.5 个百分点。原始视角的成功率保持在 95.0% 没掉。如果把配对数据打乱（Shuffled-pair 对照组），成功率直接暴跌到 25.8%，证明提升确实来自“同状态跨视角”的约束，而不是单纯的正则化平滑。
  - **真机端**：在训练时未见过的相机视角（held-out camera）下，成功率从 FM-only 的 53.3% 提升到 74.4%。在训练时见过的视角下，两者表现差不多（都在 88% 左右）。

### 4. 🔥 [Is Forward Prediction Enough? Physical State Grounding for JEPA World Models] (仅靠前向预测足够吗？面向JEPA世界模型的物理状态接地)
- **研究机构**: `香港科技大学（广州）, COCO Matrix`
- **Arxiv ID**: `2608.06799` | [点击跳转](https://arxiv.org/abs/2608.06799)

**0. 论文标题**
- **英文标题**: Is Forward Prediction Enough? Physical State Grounding for JEPA World Models
- **中文标题**: 仅靠前向预测足够吗？面向JEPA世界模型的物理状态接地
- **研究机构**: 香港科技大学（广州）, COCO Matrix

**1. 整体逻辑**
- **研究任务**: 机器人视觉世界模型（World Models）的表征学习，具体是基于JEPA架构的潜在动态预测。
- **研究动机**: 现有的JEPA世界模型（如LeWM）只靠“预测下一帧特征”来训练。作者发现，这种纯前向预测训练出来的特征，很难直接从中解码出机器人的物理状态（比如末端姿态）和状态变化（比如关节速度）。这导致下游的规划器和策略网络学起来很费劲，需要大量数据去对齐视觉和动作。
- **本质改动**: 在训练阶段加了两个辅助的“接地（Grounding）”任务：一是让单个特征能还原机器人的本体状态（关节角、末端位姿等）；二是让两个时间步的特征对能还原它们之间的关节角变化。这两个辅助网络只在训练时用，推理时直接扔掉，不增加推理负担。
- **技术溯源**: 基于 JEPA (Joint Embedding Predictive Architecture) 和 LeWM (Latent World Model) 架构。

**2. 技术拆解**
- **重点改进**: 在纯前向预测的JEPA目标之外，引入了静态状态接地（Static State Grounding）和动态转移接地（Dynamic Transition Grounding）。利用机器人自带的本体感受数据（proprioception）作为监督信号，强制视觉特征包含精确的物理状态信息。
- **架构细节**: 
  - **输入输出**：输入是图像观测序列和动作序列，输出是预测的未来图像特征（latent）。
  - **模型结构**：主干是图像编码器（Encoder）和动作条件预测器（Predictor）。新增两个轻量级MLP头：状态头（State Head）接收单个特征输出本体状态；转移头（Transition Head）接收两个时间步的特征对，输出多步关节角变化。
  - **模型规模**：与LeWM保持完全一致的主干规模，仅在训练时增加极小参数量的预测头。
- **核心 Loss**: 
  - **主 Loss**：前向预测特征的MSE损失 + SIGReg防坍缩正则化损失。
  - **辅助 Loss**：状态头预测本体状态的MSE损失 + 转移头预测多步关节角变化的MSE损失。总Loss为主辅Loss的加权和（辅助Loss权重设为0.1）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：OGBench (Cube和Scene)、LIBERO-Goal 仿真环境，以及真实机械臂任务。
  - **Baseline**：LeWM（同主干纯前向预测）、LeWMActionIDM（加了逆动力学动作预测的LeWM）、DINOv2（冻结的视觉大模型特征）。
- **评价指标**: 
  - **物理可识别性**：用线性/MLP探针（Probes）从冻结特征中恢复物理量的皮尔逊相关系数（Pearson r）。
  - **目标条件规划**：使用GC-IDM规划器在冻结特征上的目标到达成功率。
  - **策略学习**：下游策略网络在仿真和真机上的任务成功率。
- **实验结果**: 
  - **可识别性**：PSG-JEPA从单个特征恢复末端偏航角（EE-yaw）的相关系数从LeWM的0.11大幅提升到0.98；恢复夹爪速度等状态变化也显著优于baseline。
  - **规划效率**：在OGBench上，规划器只训练5个epoch时，PSG-JEPA成功率达95.0%，而LeWM只有80.7%；在只用5%演示数据时，PSG-JEPA能达到LeWM使用全量数据相近的效果。
  - **策略与预测**：在LIBERO和真机任务中成功率全面领先；开环长程特征预测的MSE误差比LeWM降低了39%到67%。证明加物理接地不仅没破坏预测能力，反而让特征在下游任务中更好用。

### 5. 🔥 [AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models] (AtlasVLA：用于视觉-语言-动作模型的持久化世界-自我状态建模)
- **研究机构**: `中国科学院自动化研究所（根据作者信息推断）`
- **Arxiv ID**: `2608.06729` | [点击跳转](https://arxiv.org/abs/2608.06729)

**0. 论文标题**
- **英文标题**: AtlasVLA: Persistent World-Ego State Modeling for Vision-Language-Action Models
- **中文标题**: AtlasVLA：用于视觉-语言-动作模型的持久化世界-自我状态建模
- **研究机构**: 中国科学院自动化研究所（根据作者信息推断）

**1. 整体逻辑**
- **研究任务**: 基于单腕部相机（wrist-only）的机器人长程（long-horizon）操作任务。
- **研究动机**: 现有的VLA模型大多是“条件反射”式的，只依赖当前帧输入。在只有腕部相机的设定下存在两个致命问题：一是物体一旦离开视野，模型就忘了它的空间位置（感知遗忘）；二是任务步骤一多，模型就忘了当前做到哪一步了（任务进度遗忘）。
- **本质改动**: 把“看一帧动一下”的反应式VLA，改成了带“全局空间地图”和“任务进度备忘录”的主动推理VLA，通过双记忆架构弥补单视角的物理局限。
- **技术溯源**: 基于 7B 参数的 LLM 基座、Depth Anything v3（单目深度估计）以及 DiT（Diffusion Transformer，用于动作生成）。

**2. 技术拆解**
- **重点改进**: 引入了双记忆模块。1）**4D世界状态记忆**：利用深度估计将2D视觉特征反投影到3D空间，通过体素哈希（voxel-hashing）进行空间融合，拼出全局地图，解决视野盲区；2）**自我工作状态记忆**：利用可学习的意图 query 提取并压缩历史状态，记录任务进度，防止长程任务中的意图漂移。
- **架构细节**: 
  - **输入/输出**：输入为单张 224×224 腕部 RGB 图像、7维本体状态和文本指令；输出为 7-DoF 末端执行器动作块（action chunk）。
  - **模型结构**：视觉特征经 Depth Anything v3 升维到 3D 并加入时空位置编码。世界记忆库通过滑动窗口和体素融合持续更新（保留第一帧作为全局锚点）。动作生成部分使用 DiT，通过交叉注意力机制，将“自我状态”和“检索到的世界状态”逐步（step-wise）注入到去噪过程中。
  - **模型规模**：LLM 基座 7B 参数，DiT 动作专家约 300M 参数。
- **核心 Loss**: 主要是 DiT 的标准扩散去噪 Loss（如 MSE），文中未提及额外的辅助任务（如视频或图像重建 Loss）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO（仿真，5个子集）、RLBench（仿真）、真实世界 Franka 机械臂任务（包含通用操作和长程任务）。
  - **Baseline**：OpenVLA、π0、4D-VLA、CogACT、MemoryVLA、GE-ACT 等主流 VLA 模型。
- **评价指标**: 任务成功率（Success Rate, %），LIBERO 每个任务评估 50 次，RLBench 评估 20 次。
- **实验结果**: 
  - **LIBERO**：在严格的单腕部相机设定下，平均成功率达到 97.6%，不仅高于其他单视角 baseline，还超过了使用多视角的 π0（94.2%）。在长程任务（LIBERO-Long）上达到 94.6%，比单视角的 MemoryVLA 高出 7.0%。
  - **RLBench**：单腕部相机平均成功率 70.8%，大幅领先 MemoryVLA（55.0%）和 CogACT（34.2%）。
  - **真实世界**：在长程任务中，相比 baseline 绝对成功率提升了 17.5%，在极端遮挡和长视野测试中表现出很强的鲁棒性。

### 6. 🔥 [Fast and Accurate: An Adaptive VLA Inference Framework through Environment-aware Model Selection] (又快又准：一种基于环境感知模型选择的自适应 VLA 推理框架)
- **研究机构**: `原文未明确标注（作者信息仅保留上标，推测为国内高校或研究机构）`
- **Arxiv ID**: `2608.06434` | [点击跳转](https://arxiv.org/abs/2608.06434)

**0. 论文标题**
- **英文标题**: Fast and Accurate: An Adaptive VLA Inference Framework through Environment-aware Model Selection
- **中文标题**: 又快又准：一种基于环境感知模型选择的自适应 VLA 推理框架
- **研究机构**: 原文未明确标注（作者信息仅保留上标，推测为国内高校或研究机构）

**1. 整体逻辑**
- **研究任务**: 机器人操作任务中 VLA（视觉-语言-动作）模型的推理加速与高频闭环控制。
- **研究动机**: 现有的大 VLA 模型推理太慢（比如 OpenVLA 只有 6.3Hz），做不到高频闭环控制。之前的一些“快慢双系统”方案虽然引入了小模型来加速，但把小模型和大模型的中间特征层绑死了，必须端到端联合训练。这导致系统没法灵活替换、独立升级，也做不到根据环境随时切换。
- **本质改动**: 把快慢系统彻底解耦，两者只在“动作输出”层面交互。同时加了一个基于强化学习的轻量级“切换开关”，根据当前机器人状态，动态决定这一步是调大模型（慢）还是小模型（快）。
- **技术溯源**: 基于主流 VLA 开源基座（如 OpenVLA、PI0 等作为慢系统候选），结合经典强化学习算法（DQN 用于在线训练，IQL 用于离线训练）。

**2. 技术拆解**
- **重点改进**: 
  1. **完全解耦**：快慢系统独立进行端到端推理，不共享中间特征，支持即插即用。
  2. **动态切换**：把系统选择建模为一个两动作的 MDP（马尔可夫决策过程），用 RL 训练一个轻量级网络来做决策。
  3. **动作融合（Action Fusion）**：在快慢系统切换的边界，把两个系统输出的动作做个平均，防止动作突变导致机器人抖动。
- **架构细节**: 
  - **慢系统 (System 2)**：大参数 VLA 模型，推理频率约 10Hz，负责长程推理和全局规划，输出动作序列（action chunk）。
  - **快系统 (System 1)**：轻量级反应式策略，推理频率约 100Hz，负责高频闭环控制，输出单步或短动作序列。
  - **切换模块**：一个浅层全连接网络（MLP），输入仅为机器人本体状态（不看图像和语言，为了快），输出离散动作（0 代表用快系统，1 代表用慢系统）。
- **核心 Loss**: 训练分三个阶段：
  - **Stage I (慢系统微调)**：用遥操作数据做模仿学习（BC Loss）。
  - **Stage II (快系统蒸馏)**：用微调后的慢系统跑出成功轨迹，再用这些轨迹对快系统做模仿学习（BC Loss），对齐两者的动作分布。
  - **Stage III (切换模块 RL)**：在线训练用 DQN 的 TD-error Loss（结合了 Double Q、Dueling 和 NoisyNet）；离线训练用 IQL（隐式 Q 学习）的 Q 函数、V 函数和策略 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO 仿真基准（包含 Object, Spatial, Goal, 10 四个子任务集），以及 Realman 仿真和真实世界双臂操作任务。
  - **Baseline**：BCTransformer, BCVILT, OpenVLA, PI0，以及一个固定频率切换的基线（Fixed Switching）。
- **评价指标**: 任务成功率（S.R.）、有效动作频率（Hz）、慢系统调用比例、真实世界任务完成时间。
- **实验结果**: 
  - 在 LIBERO 仿真中，EMS 的平均成功率达到 92.4%，与 PI0 这种大模型相当（94.15%），远超 OpenVLA（76.5%）。
  - 速度提升显著：EMS 的有效动作频率达到了 93.37 Hz（OpenVLA 仅 6.3 Hz，PI0 为 50 Hz）。
  - 资源消耗低：慢系统的调用比例仅为 15.3%，说明大部分时间都在用快系统跑，只在关键节点（如初始规划、抓取、纠错）才调用大模型，实现了“大模型的成功率 + 小模型的速度”。在真实世界双臂任务中也验证了能缩短任务完成时间且保持鲁棒性。
