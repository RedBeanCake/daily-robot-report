            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model] (Dynin-Robotics：全模态统一扩散视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.13053` | [点击跳转](https://arxiv.org/abs/2609.13053)

**0. 论文标题**
- **英文标题**: Dynin-Robotics: Omnimodal Unified Diffusion Vision-Language-Action Model
- **中文标题**: Dynin-Robotics：全模态统一扩散视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出基于掩码扩散的统一VLA模型Dynin-Robotics，将语言、视觉、动作和目标状态统一在共享的离散token序列中，通过条件去噪实现多任务联合建模，并支持推理时的组合缩放与高效并行解码。

**1. 整体逻辑**
- **研究任务**: 构建统一的视觉-语言-动作（VLA）基础模型，用于根据自然语言指令和视觉观察进行机器人连续控制，同时兼顾视觉状态预测（世界模型/目标状态）和任务理解。
- **研究动机**: 现有VLA模型多采用自回归生成或分离的专家网络，难以灵活利用双向上下文，且动作预测与视觉预测/理解往往割裂。作者的诊断实验表明，不同架构的策略（如$\pi_{0.5}$和Mimic-Video）对语言指令的敏感度和任务表现差异显著，这motivate将语言条件和视觉预测在同一个共享策略模型中进行统一研究。
- **本质改动**: 抛弃自回归和分离架构，把机器人轨迹（指令、观察、目标、动作、传感器）全塞进一个共享的离散token序列里，利用双向Transformer和掩码扩散（Masked Diffusion）进行联合建模，靠改变掩码布局（目标条件掩码）来切换不同的预测任务。
- **技术溯源**: 基于 Dynin-Omni（一个全模态掩码扩散模型）骨干，继承其文本、视觉（MAGViT-v2）和语音tokenizer；动作空间采用确定性均匀分箱（uniform binning）进行离散化；推理加速结合了 dInfer 优化栈。

**2. 技术拆解**
- **核心方法**: 
  1. **统一轨迹建模**：将多模态数据映射到共享离散token空间，连续动作通过均匀量化离散化为token。
  2. **多目标条件去噪**：定义Policy（预测动作）、World Modeling（预测下一帧）、Goal-State Prediction（预测终端目标）、Task Understanding（从轨迹帧重建指令）四个目标。通过输入特定的Objective token和掩码模式，在同一个模型中训练和推理这些任务。
  3. **推理组合与加速**：支持6种推理组合（如仅动作解码、目标引导、联合去噪、世界模型重排等）以实现test-time scaling；采用块并行掩码解码（Block-parallel masked decoding）加速动作chunk的生成。
- **关键细节**: 
  - **输入输出**：输入为RGB图像和文本指令，输出为离散化的动作token（经逆量化转为连续控制），或预测的视觉/文本token。
  - **模型结构**：共享双向Transformer骨干，统一的分类预测头（推理时按目标模态切片词表）。
  - **规模与设置**：Stage-1在大规模机器人轨迹（含OXE、DROID等）上预训练220k步；Stage-2在特定benchmark数据上后训练（如70k步）。动作分箱数Stage-1为256，Stage-2根据任务调整为更细的粒度（如32）。
- **训练/优化目标**: 
  - **目标条件掩码扩散损失**：对掩码位置计算交叉熵，并按掩码概率和目标长度进行归一化，防止不同掩码率带来的权重偏差。
  - **Policy辅助损失**：计算预测动作bin的期望值与真实归一化动作的L1误差，辅助连续动作的回归。
  - **混合损失**：按调度比例和权重结合上述各目标的损失进行联合优化。

**3. 实验结果**
- **实验设置**: 
  - **数据集与Benchmark**：LIBERO, LIBERO-Plus, VLABench (SelectFruit, InsertFlower), DROID (用于视觉/动作预测评估), 以及真实世界 Franka Research 3 机器人平台。
  - **对比对象 (Baseline)**：$\pi_{0.5}$, Mimic-Video, OpenVLA, OpenVLA-OFT, Cosmos Policy, MMaDA-VLA, ABot-M0 等。
- **评价指标**: 
  - **策略**：Success Rate (ID, OOD, Gap)。
  - **视觉/动作预测**：PSNR, SSIM, LPIPS, Action Acc @0.1, Action MAE。
  - **系统加速**：Effective TPS (每秒动作输出吞吐量), Query latency。
- **主要结果**: 
  - **策略性能**：在LIBERO上平均成功率达98.1%（与X-VLA持平）；在真实世界Franka平台上平均成功率78.4%，超越$\pi_{0.5}$ (76.9%)，在带顺序约束的堆叠任务中优势明显（68.5% vs 64.0%）。在VLABench上对指令偏移的鲁棒性较好。
  - **预测能力**：在DROID上，其动作条件世界模型（World Modeling）的PSNR和SSIM优于MMaDA-VLA等统一模型，且动作预测MAE最低。
  - **加速效果**：结合dInfer和BL35配置，动作解码吞吐量提升高达29.15倍（达268.834 TPS），且策略成功率仅微降0.6%。
  - **消融结论**：Stage-1的机器人预训练大幅提升下游适应性；全目标混合训练将ID与OOD的Gap从13.27%大幅缩小至2.33%；推理时组合“目标引导”与“联合去噪”能显著提升OOD成功率，验证了统一接口在test-time scaling中的价值。

### 2. 🔥 [IMPLY: Physically Anchored Consistency for World-Model Rollouts] (IMPLY：基于物理锚定的世界模型推演一致性评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.12441` | [点击跳转](https://arxiv.org/abs/2609.12441)

**0. 论文标题**
- **英文标题**: IMPLY: Physically Anchored Consistency for World-Model Rollouts
- **中文标题**: IMPLY：基于物理锚定的世界模型推演一致性评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于物理属性反推和真实观察锚定的世界模型推演（rollout）评估方法，解决了现有自洽性指标无法识别“忽略物理对象只预测典型结果”的幻觉问题。

**1. 整体逻辑**
- **研究任务**: 评估和筛选世界模型（World-Action Models）生成的未来推演（rollouts）的可靠性，用于在规划时选择最可信的未来。
- **研究动机**: 现有的评估指标主要依赖“自洽性（self-consistency）”（如动作与帧是否匹配、多个样本是否一致）。但这有个致命盲区：如果模型完全忽略了当前的物理对象，每次都预测一个“典型的”推动结果（即 object-blind 幻觉），它的自洽性得分依然很高，因为它的输出内部是完全一致的。自洽性无法区分“内部一致的正确答案”和“内部一致的错误答案”。
- **本质改动**: 将一致性的定义从“输出间的相互一致”改为“输出所暗示的物理属性的一致性”，并引入两次真实的校准推动作为物理锚点（evidence），强制推演结果不仅要自洽，还必须符合真实观察到的物体行为。
- **技术溯源**: 基于 CALIPER 环境（用于物理参数反推和控制实验），并在 V-JEPA 2-AC 上进行了真实世界模型的验证。

**2. 技术拆解**
- **核心方法**: 提出 IMPLY 方法。首先通过反转模拟器（inverting a simulator），从推演的位移中反推物体的物理参数（质量 $m$ 和摩擦系数 $\mu$）。计算多次推演拟合单一物理参数的残差（self-disagreement）。然后，将模型观察到的两次真实校准推动的位移数据加入拟合过程，计算锚定不一致性（anchored disagreement）。
- **关键细节**: 
  - **物理反推**：在预计算的 $(v, m, \mu) \to \log d$ 查找表上进行网格搜索，拟合最优的 $(m, \mu)$。
  - **位移读取**：对于隐空间模型（如 V-JEPA），使用岭回归读头（ridge readout）从特征映射到位移；对于像素模型，使用帧差分计算位移。
  - **输入输出**：输入为多次不同速度下的推演位移，以及两次真实校准推动的位移；输出为一个标量得分（残差），得分越低说明推演越符合单一物理对象且与真实证据一致。
- **训练/优化目标**: 非学习类评估指标。核心机制是最小化推演位移与物理模拟器预测位移之间的对数残差平方和（包含推演数据和校准数据），通过网格搜索求解最优物理参数。

**3. 实验结果**
- **实验设置**: 
  - **控制实验**：在 CALIPER 环境中构建 4 个替身模型（真实物理 Oracle、物理漂移 Jitter、忽略物体的模式匹配器 Object-blind、背景坍塌 Collapse）。
  - **真实模型实验**：在 V-JEPA 2-AC 上进行微调，对比提供正确校准上下文、错误校准上下文和无校准上下文的情况。
- **评价指标**: AUROC（区分替身模型与 Oracle 的能力）、推演误差的对数相关性（corr. with error）、选择正确 rollout 集合的命中率及中位误差（median miss）。
- **主要结果**: 
  - **控制实验**：自洽性指标无法区分真实模型和忽略物体的模型（AUROC 0.70），因为忽略物体的模型每次预测都一样，自洽性极高。加入物理锚定后，AUROC 达到 1.00，完美暴露该缺陷，并在 98% 的情况下选出正确推演。
  - **真实模型实验**：自洽性指标无法区分给对证据和给错证据的情况（52% 猜中率，等同于随机）。锚定指标在 73% 的情况下偏好正确证据，且与真实误差的相关性高达 0.92-0.99。
  - **选择效果**：在选择推演集合时，锚定指标选出的结果距离全知 Oracle 仅差 0.003，远优于自洽性指标和共识选择。

### 3. 🔥 [Beyond the Query: Do Retrieval Signals Improve Adaptive Multimodal RAG Routing?] (超越查询：检索信号能改善自适应多模态RAG路由吗？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.12437` | [点击跳转](https://arxiv.org/abs/2609.12437)

**0. 论文标题**
- **英文标题**: Beyond the Query: Do Retrieval Signals Improve Adaptive Multimodal RAG Routing?
- **中文标题**: 超越查询：检索信号能改善自适应多模态RAG路由吗？
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过严格的受控输入消融实验证明，在自适应多模态RAG中，初始检索产生的状态信号在已知查询的前提下，并不能为“是否执行后续步骤”的路由决策带来可靠的增量价值。

**1. 整体逻辑**
- **研究任务**: 评估在自适应多模态RAG系统中，检索阶段产生的状态信号（如检索分数、证据统计等）在已知用户查询（query）的前提下，是否能为路由决策（RUN/SKIP，即是否执行下一步检索、重排或多模态处理）提供额外的增量价值。
- **研究动机**: 现有自适应RAG通常利用初始检索的信号来决定是否增加计算量。直觉上这些信号能反映后续步骤的收益。但由于检索状态本身就是由查询生成的（query-conditioned），一个困难的查询既会导致异常的检索分数，又更需要后续步骤。因此，检索信号可能与未来收益相关，但并没有提供超出查询本身已有的信息，其实际路由价值可能被高估了。
- **本质改动**: 提出一种严格的输入消融框架，在保持可选动作、路由器模型家族、训练过程和评估协议完全一致的情况下，直接对比“仅使用查询特征”与“使用查询特征+检索状态特征”的路由器，以隔离并量化检索信号的增量路由价值。
- **技术溯源**: 基于现有的自适应RAG概念（如SAGE, X-Router等），底层多模态生成器采用 Qwen2.5-Omni-7B，文档视觉检索涉及 CLIP 及多向量视觉检索器。

**2. 技术拆解**
- **核心方法**: 设计并对比两个匹配的路由器（Matched routers）。Query-only 路由器仅接收查询特征；Query+retrieval 路由器接收相同的查询特征加上当前检索状态特征。两者均通过预测执行下一步可选RAG步骤带来的答案质量变化（$\Delta Q$），结合预设的相对成本，来决定是执行（RUN）还是跳过（SKIP）该步骤。
- **关键细节**: 
  - **输入输出**：输入为查询特征或查询+检索状态特征，输出为RUN/SKIP决策（或预测的质量变化值）。
  - **模型结构**：核心路由器采用直方图梯度提升模型（histogram gradient-boosting model）。作者还测试了多种变体（如直接分类、两阶段预测、直接预测带符号质量变化等）。
  - **多模态设置**：涵盖文档、音频、视频三种模态。文档模态测试了三种可选视觉步骤：DOC_CLIP（基于CLIP的整页视觉检索）、Tile D2（分块视觉检索，易丢失上下文）、Whole-page D2（保留上下文的整页视觉检索）。
- **训练/优化目标**: 优化目标是准确预测执行下一步后的答案质量变化（$\Delta Q$）。在开发阶段，使用“鲁棒遗憾（robust regret）”作为模型选择指标，直接预测带符号的质量变化效果最佳。路由决策基于效用函数 $\hat{U} = \widehat{\Delta Q} - \lambda C_{policy}$ 进行。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：文档使用 DocVQA，音频使用 Clotho-AQA，视频使用 NExT-QA。
  - **对比对象（baseline）**：Query-only router（仅查询特征路由器）。
  - **评估划分**：开发集715个query，最终held-out评估集720个query（每模态240个，严格未参与训练和模型选择）。
- **评价指标**: 
  - **路由得分（Routing score）**：衡量在给定相对成本下的路由决策综合质量。
  - **增量路由价值（$G_m$）**：Query+retrieval 与 Query-only 路由得分的差值。
  - **辅助诊断指标**：Spearman秩相关系数（$\rho$，衡量预测收益与实际收益的相关性）、最佳情况增益（Best-case gain，即完美路由器的理论上限）。
- **主要结果**: 
  - 在开发集上，加入检索信号使路由得分提升了 +0.01621；但在 held-out 最终评估集上，提升仅为 +0.00288，且 95% 置信区间包含 0（[-0.00726, 0.01107]），统计上不显著。表明测试的检索信号未能带来可靠的路由提升。
  - 辅助诊断揭示了具体原因：文档步骤中，DOC_CLIP 预测信号弱且延迟收益有限；Tile D2 会破坏上下文导致质量下降；Whole-page D2 有益案例极少且难以预测。
  - 在音视频模态中，检索信号与实际收益虽呈正相关（具备预测性），但加入检索信号后的路由得分并未优于仅用查询（Audio差异 -0.0835，Video差异 -0.0006）。
  - **核心结论**：信号的“可预测性”不等于“增量路由价值”。评估自适应RAG时，必须引入匹配的“仅查询”基线，不能想当然地赋予检索状态特征路由价值。

### 4. 🔥 [Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models] (打破视觉-动作捷径：用于可泛化机器人基础模型的潜在接口训练)
- **研究机构**: `National University of Singapore (NUS)`
- **Arxiv ID**: `2609.12641` | [点击跳转](https://arxiv.org/abs/2609.12641)

**0. 论文标题**
- **英文标题**: Breaking the Vision-Action Shortcut: Latent Interface Training for Generalizable Robotics Foundation Models
- **中文标题**: 打破视觉-动作捷径：用于可泛化机器人基础模型的潜在接口训练
- **研究机构**: National University of Singapore (NUS)
- **一句话总结**: 提出一种两阶段训练策略（LIT），通过无图像的动作预训练和位姿监督的潜在接口，阻断机器人基础模型对无关视觉线索的依赖（视觉-动作捷径），大幅提升视觉分布偏移下的零样本泛化能力。

**1. 整体逻辑**
- **研究任务**: 提升机器人基础模型（VLA和WAM）在视觉分布偏移（如视角、光照、背景、传感器噪声等变化）下的零样本泛化能力。
- **研究动机**: 现有模型在训练时容易利用与任务无关但与动作相关的视觉线索（即“视觉-动作捷径”），导致在视觉分布偏移时性能崩溃。现有的表征增强或分阶段预训练方法，要么没有直接约束动作专家如何使用视觉信息，要么在引入视觉条件时缺乏显式的空间目标约束，依然容易陷入捷径。
- **本质改动**: 切断视觉特征到动作专家的直连通道，改为通过一个“受位姿监督的潜在接口”进行信息传递；并在第一阶段先让动作专家在完全没有图像输入的情况下，学习基于空间目标的动作先验。
- **技术溯源**: 基于预训练的视觉-语言模型（VLM）或视频/世界模型骨干，具体适配了四种架构：VLA架构（$\pi_{0.5}$, MolmoAct2）和WAM架构（FAST-WAM, ImageWAM）。动作生成采用流匹配（Flow-matching）目标。

**2. 技术拆解**
- **核心方法**: 提出与框架无关的潜在接口训练（Latent Interface Training, LIT），分为两个阶段：
  1. **阶段一（无图像空间目标条件动作预训练）**：冻结视觉骨干，仅使用语言、机器人状态和每个动作块的终端SE(3)末端执行器位姿作为条件，从头训练动作专家（Action Expert）生成动作，学习空间目标条件动作先验。
  2. **阶段二（视觉-动作接口学习）**：引入可学习的潜在token（Latent tokens）作为中间层，通过自注意力和交叉注意力聚合骨干的视觉和语义表征，作为动作专家**唯一**的视觉条件输入。使用位姿重建损失监督这些token，强制其保留生成动作所需的目标空间信息。
- **关键细节**: 
  - 目标位姿包含世界坐标系下的末端位置、轴角方向和夹爪状态（8维）。
  - 潜在接口包含100个可学习的latent tokens，通过层间交叉注意力与骨干表征交互，每 $m$ 层共享接口注意力参数以节省计算。
  - 推理时，移除阶段一的位姿编码器和阶段二的位姿解码器，仅保留潜在接口，输入仅需视觉、语言和机器人状态。
- **训练/优化目标**: 
  - **阶段一**：动作流匹配损失（Action flow-matching loss），仅更新动作专家和SE(3)编码器参数。
  - **阶段二**：动作损失 + 位姿重建损失（权重 $\lambda_{pose}=0.3$）。联合优化骨干、动作专家、潜在token、接口注意力模块和MLP解码器。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（40个任务，评估分布内性能）和 LIBERO-Plus（10030个扰动实例，评估7种分布偏移下的零样本泛化）。真实世界评估包含3个操作任务（Keep LEGOs, Wipe trash, Transfer egg）。
  - **对比对象**：四种架构的原始 Baseline（$\pi_{0.5}$, MolmoAct2, FAST-WAM, ImageWAM）。
- **评价指标**: 任务成功率（Task success rate, %）。
- **主要结果**: 
  - **分布内（LIBERO）**：LIT 在所有4种架构上均保持或提升了平均成功率（如 $\pi_{0.5}$ 从 87.75% 提升至 91.80%）。
  - **分布外（LIBERO-Plus）**：LIT 显著提升了整体零样本泛化成功率，提升幅度在 3.87% 到 10.70% 之间（如 $\pi_{0.5}$ 整体提升 10.70%，FAST-WAM 提升 9.19%）。在相机视角偏移和传感器噪声下提升尤为显著（最高提升超20%）。
  - **真实世界**：在3种OOD条件（光照、相机、干扰物）下，聚合成功率提升了 13.3% 到 16.7%（如 Wipe trash 任务在 Camera OOD 下从 10.0% 提升至 80.0%）。
  - **消融实验**证实：阶段一的动作先验、位姿监督、以及限制视觉通路（仅通过潜在接口）是消除捷径、提升泛化的核心原因。

### 5. 🔥 [DATAFARM: Distribution-Aligned Task and Motion Planning for Fine-Tuning Vision-Language-Action Models] (DATAFARM：用于微调视觉-语言-动作模型的分布对齐任务与运动规划)
- **研究机构**: `Princeton University`
- **Arxiv ID**: `2609.12316` | [点击跳转](https://arxiv.org/abs/2609.12316)

**0. 论文标题**
- **英文标题**: DATAFARM: Distribution-Aligned Task and Motion Planning for Fine-Tuning Vision-Language-Action Models
- **中文标题**: DATAFARM：用于微调视觉-语言-动作模型的分布对齐任务与运动规划
- **研究机构**: Princeton University
- **一句话总结**: 提出 DATAFARM 方法，将 VLA 预训练数据的分布先验（关节构型、运动风格、执行时序）作为优化目标引入任务与运动规划（TAMP）中，解决了规划器生成的数据因分布偏移导致微调 VLA 效果极差的问题。

**1. 整体逻辑**
- **研究任务**: 为预训练的视觉-语言-动作（VLA）模型自动生成高质量的微调数据，以扩展其处理长序列和几何约束任务的能力，同时保留其原有的泛化能力。
- **研究动机**: 现有的任务与运动规划（TAMP）虽然能成功执行任务，但其生成的轨迹在关节构型、运动风格和执行速度上，与 VLA 预训练数据存在严重的行为分布不匹配。实验发现，直接用这些“任务成功”的原始 TAMP 轨迹微调 VLA 收益极低（成功率仅从 1.7% 提升至 8.3%）。
- **本质改动**: 改变 TAMP 仅追求“任务成功”和“运动学可行”的单一目标，将 VLA 预训练数据的行为分布作为先验，直接嵌入到 TAMP 的轨迹优化目标中，强制规划器生成与预训练数据分布对齐的轨迹。
- **技术溯源**: 基于 VLA 模型 $\pi_{0.5}$-DROID、TAMP 系统 TiPToP，以及 DROID 数据集（作为预训练分布的参考来源）。

**2. 技术拆解**
- **核心方法**: DATAFARM 在 TAMP 的端点选择、路径优化和重定时（Retiming）三个阶段引入分布对齐代价（Cost）：
  1. **关节构型对齐**：用预训练数据拟合关节角的高斯混合模型（GMM）。在逆运动学（IK）求解出多个候选构型时，选择处于高概率分布区的构型作为路径端点。
  2. **运动风格与时序对齐**：训练一个自监督的轨迹编码器，将轨迹映射到隐空间并拟合高斯分布。在路径优化和重定时阶段，计算候选轨迹在隐空间中与参考分布的马氏距离作为惩罚项，通过梯度反传优化中间路点和时间参数。
- **关键细节**: 
  - **轨迹编码器**：输入为 15Hz 采样的关节位置、速度、加速度和加加速度（jerk），输出 16 维隐向量。训练时采用辅助预测任务（预测 113 维运动描述符）和 VAE 式的 KL 散度正则化，使其隐空间能反映真实的运动学特征。
  - **重定时（Retiming）**：将几何路径分为 64 个等弧长区间，优化每个区间的时间分配比例和总时长。同时加入边界速度惩罚，以匹配人类遥操作在抓取/放置时的低速特性。
- **训练/优化目标**: 
  - **编码器训练**：预测运动描述符的加权 MSE 损失 + 隐变量到标准正态分布的 KL 散度。
  - **规划优化目标**：在 cuRobo 原有的平滑度、碰撞和关节限制惩罚基础上，增加隐空间马氏距离代价（$c_{traj}$）和边界速度惩罚（$c_{boundary}$），使用 Adam 优化器进行梯度下降求解。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基座**：参考分布来自 DROID 数据集；基座模型为 $\pi_{0.5}$-DROID。
  - **对比对象（Baseline）**：无微调的 $\pi_{0.5}$-DROID、使用原始 TiPToP (Raw TAMP) 数据微调的模型、人类遥操作数据微调模型 (Human teleop, oracle)。
  - **测试任务**：3个桌面操作任务（几何约束、多步推理、语义推理）和 1个超出规划器能力的 OOD 任务（可变形物体操作/折布）。
- **评价指标**: 任务成功率（Success rate，完成所有子目标）和任务进度（Task progress，完成子目标的比例）。
- **主要结果**: 
  - **目标任务微调效果**：DATAFARM 微调后的平均成功率达到 56.7%，远高于 Raw TAMP 的 8.3%，接近人类遥操作的 61.7%。
  - **灾难性遗忘控制**：在 OOD 任务（折布）上，DATAFARM 微调后的模型保留了 85% 的成功率（预训练模型为 90%），证明分布对齐有效防止了模型原有能力的退化。
  - **消融实验**：移除时序对齐（w/o timing）影响最大，成功率降至 0%；移除关节空间对齐（w/o joint space）降至 23.3%；移除风格对齐（w/o style）降至 15.0%。证明三个对齐模块均不可或缺。

### 6. 🔥 [STAR: Sparse Tactile Representation Learning in Vision-Tactile-Language-Action Models for Dexterous Manipulation] (STAR：面向灵巧操作的视觉-触觉-语言-动作模型中的稀疏触觉表征学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.12549` | [点击跳转](https://arxiv.org/abs/2609.12549)

**0. 论文标题**
- **英文标题**: STAR: Sparse Tactile Representation Learning in Vision-Tactile-Language-Action Models for Dexterous Manipulation
- **中文标题**: STAR：面向灵巧操作的视觉-触觉-语言-动作模型中的稀疏触觉表征学习
- **研究机构**: 原文未提及
- **一句话总结**: 针对灵巧手操作中触觉信号严重稀疏的问题，构建了一个200小时的真实世界双臂灵巧手数据集，并提出了一套包含视觉-触觉联合预训练、稀疏-全局触觉Token表示和未来触觉预测的集成训练配方（STAR），大幅提升了VTLA大模型的灵巧操作成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉-触觉-语言-动作（VTLA）大模型的机器人双臂灵巧手操作（Dexterous Manipulation）。
- **研究动机**: 1) 缺乏大规模带触觉的真实世界灵巧手操作数据；2) 灵巧手触觉信号存在严重的三重稀疏性：空间稀疏（大部分传感器未激活）、时间稀疏（大量时间无接触）、信息稀疏（仅有局部接触缺乏全局上下文）。现有方法只解决单一稀疏性，且缺乏适合大模型学习的强归纳偏置。
- **本质改动**: 提出了一套系统解决触觉三重稀疏性的集成训练配方（STAR），通过联合预训练防过拟合、稀疏-全局Token设计去冗余并补全上下文、稀疏未来预测建模接触动态，从而让VTLA模型真正用好触觉模态。
- **技术溯源**: 策略模型基座基于 $\pi_{0.5}$（包含 PaliGemma Gemma-2B 视觉语言骨干和 Gemma-300M 动作专家）；预训练方法参考了 M2VTP（视觉-触觉联合预训练）；遥操作运动学求解基于 DexPilot 算法改进。

**2. 技术拆解**
- **核心方法**: STAR 训练配方，包含三个核心模块：1) 视觉-触觉联合预训练 (VTP)；2) 稀疏-全局触觉 Token 表示 (SGTTR)；3) 稀疏未来触觉预测 (SFTP)。
- **关键细节**: 
  - **数据与硬件**: 采用10自由度灵巧手+268维压阻式触觉传感器。采集了200小时数据（10576条轨迹，65个任务，69.5%需多指协同）。
  - **VTP**: 将触觉信号转为图像，与RGB图像拼接，进行75%的联合掩码预测（MAE架构），防止触觉编码器因空间稀疏过拟合全零信号，促进跨模态对齐。
  - **SGTTR**: 触觉编码器输出196个空间patch token和1个可学习的全局token。通过接触门控（contact gate）只保留激活的空间token（去冗余），保留全局token（提供全局上下文）。在VLM中采用非对称注意力：全局token不attend其他模态，但其他模态可以attend它。
  - **SFTP**: 在策略训练时加入辅助任务，在动作视界（$H=50$）内均匀选取5个未来时间步（10, 20, 30, 40, 50）预测触觉信号，建模长程接触动态。
  - **动作生成**: 采用条件流匹配（Conditional Flow Matching），将动作生成建模为从先验噪声到目标动作分布的速度场学习，推理时用10步前向欧拉法积分。
- **训练/优化目标**: 
  - VTP：Patch级别的归一化均方误差损失（$\mathcal{L}_{joint}$）。
  - 策略主任务：条件流匹配的速度场回归损失（$\mathcal{L}_{FM}$）。
  - SFTP辅助任务：未来触觉Patch的均方误差损失（$\mathcal{L}_{future}$）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 自采的200小时真实世界灵巧手数据集。
  - **对比对象（Baseline）**: GR00T N1.7, LDA-1B, $\pi_{0.5}$ 及其在自采数据集上的微调版本（如 $\pi_{0.5}$-Dex w/o STAR）。所有模型均使用每个任务100条轨迹进行后训练（post-training）。
  - **测试任务**: 4个真实世界灵巧操作任务（Earbud flipping, Stacked-book retrieval, Postcard retrieval, Multi-object grasping）。
- **评价指标**: 成功率（SR，成功试验比例）和任务完成率（TCR，完成子任务比例）。
- **主要结果**: 
  - 本文方法（Ours）在4个任务上平均 SR 达到 61%，TCR 达到 79%，显著优于所有 baseline（如 $\pi_{0.5}$ 平均 SR 28%，LDA-1B 仅 5%，GR00T N1.7 为 0%）。
  - 消融实验证明 STAR 的三个组件缺一不可：去掉 VTP 会导致触觉表征退化；去掉 SGTTR 中的稀疏或全局设计会引入冗余或丢失上下文；SFTP 比密集预测（DFTP）效果更好，说明在动作视界内均匀分布预测目标比集中在近期更有效。
  - 触觉模态分析表明，在依赖指尖接触的任务（如翻耳机）中触觉提升巨大，但在依赖视觉和几何规划的任务中提升有限，且受限于当前传感器未覆盖手指边缘的物理局限。

### 7. 🔥 [Pelican-Sim 1.0: A General World Model Simulator for Embodied Intelligence] (Pelican-Sim 1.0：面向具身智能的通用世界模型模拟器)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.12036` | [点击跳转](https://arxiv.org/abs/2609.12036)

**0. 论文标题**
- **英文标题**: Pelican-Sim 1.0: A General World Model Simulator for Embodied Intelligence
- **中文标题**: Pelican-Sim 1.0：面向具身智能的通用世界模型模拟器
- **研究机构**: 原文未提及
- **一句话总结**: [领域：具身智能/机器人学；类型：方法创新与系统工程] 提出了一个兼容异构机器人的通用世界模型，通过统一数值与视觉骨架的双分支动作注入和稀疏MoE架构，实现了高保真、可控的未来视频预测，并通过因果蒸馏支持高效的下游策略闭环。

**1. 整体逻辑**
- **研究任务**: 构建一个通用的动作条件世界模型模拟器，根据初始视觉上下文和机器人动作序列预测未来观测，以支持下游的数据生成、策略评估、动作选择和策略改进。
- **研究动机**: 现有动作条件世界模型在处理异构机器人时存在妥协：纯数值动作缺乏图像空间的运动引导，而纯视觉动作（如掩码或末端地图）会丢失精确的关节配置信息。单一模态难以在统一接口下兼顾精确配置与跨具身的几何引导。
- **本质改动**: 将精确的28维统一数值动作与基于URDF渲染的相机对齐骨架视频结合，交替注入同一个Video DiT中，并引入稀疏MoE处理异构动力学，同时通过因果蒸馏将采样步数从35步压缩至4步。
- **技术溯源**: 视频生成基座采用 Cosmos-Predict 2.5 (Video DiT)；下游策略评估采用 Qwen3-VL-2B-Instruct；下游策略优化基座采用 OpenVLA-OFT。

**2. 技术拆解**
- **核心方法**: 
  1. **统一动作表示**：设计28维动作空间（左右各14维：7维手臂关节+1维夹爪+6维灵巧手），兼容单/双臂及不同末端执行器。
  2. **动作-视觉注入**：利用机器人URDF和相机内参，将数值动作渲染为对齐的骨架视频。在Video DiT中，奇数块注入数值动作（Scale-and-Shift调制），偶数块通过Context Blocks注入视觉动作残差。
  3. **稀疏MoE层**：替换DiT的FFN，采用1个共享专家和8个路由专家（Top-2路由），增强对异构机器人动力学的建模能力并减少模态冲突。
  4. **高效采样**：通过因果注意力适应和少步分布匹配蒸馏，将35步自回归采样加速至4步。
- **关键细节**: 
  - **输入输出**：输入为首帧RGB图像、任务指令、28维动作序列、骨架视频序列；输出为预测的未来视频帧。
  - **模型结构**：28层Video DiT，交替注入双分支动作条件。
  - **规模**：在约100万条真实与模拟轨迹（总计8000小时交互数据）上训练。
  - **推理效率**：4步因果采样，生成21帧视频仅需2.2秒，相比35步模型实现5.67倍加速。
- **训练/优化目标**: 
  - **主损失**：Flow-matching目标（预测目标潜变量在流匹配路径上的速度场）。
  - **辅助损失**：MoE负载均衡损失（平衡路由专家的分配比例和路由亲和力）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：AgiBotWorld Beta, RoboMIND, RoboTwin（使用各自的保留测试集）。
  - **对比对象（Baseline）**：IRASim, Ctrl-World, EnerVerse-AC, OSCAR, Wan-Move。
  - **下游测试环境**：RoboTwin（用于数据生成、策略评估、动作选择、策略改进的闭环测试）。
- **评价指标**: 
  - **视频质量**：PSNR, SSIM, LPIPS, FID, FVD。
  - **动作与语义**：Adapted EWMBench (包含DYN, HSD, nDTW, BLEU, CLIP, SceneC等子项)。
  - **下游指标**：策略成功率、Pearson/Spearman相关性、动作选择成功率、GRPO优化后的成功率。
- **主要结果**: 
  - **视频预测**：在AgiBotWorld Beta、RoboMIND、RoboTwin上，PSNR分别比最强baseline提升4.636、2.080、10.343；在RoboTwin上，FVD从Ctrl-World的26.60大幅降至4.98。
  - **数据生成**：在RoboTwin中，50个真实demo加上500个生成轨迹，将策略成功率从70%提升至93%。
  - **策略评估**：结合VLM评估器，对5个策略checkpoint的评估结果与真实模拟器结果的Pearson相关性达到0.994。
  - **动作选择与策略改进**：动作选择的相对成功率提升47.7%；基于世界模型闭环rollout和VLM奖励的GRPO策略改进，相对成功率提升20.3%（从62.7%提升至75.4%）。

                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise();
                    }
                }
                function copySources() { /* 原代码保持不变 */ }
            </script>
