            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [RoVLA: Multi-Consistency Constraints for Robust Vision-Language-Action Models] (RoVLA：用于鲁棒视觉 - 语言 - 动作模型的多一致性约束)
- **研究机构**: `Sun Yat-sen University (中山大学), Peng Cheng Laboratory (鹏城实验室)`
- **Arxiv ID**: `2605.19678` | [点击跳转](https://arxiv.org/abs/2605.19678)

**0. 论文标题**
- **英文标题**: RoVLA: Multi-Consistency Constraints for Robust Vision-Language-Action Models
- **中文标题**: RoVLA：用于鲁棒视觉 - 语言 - 动作模型的多一致性约束
- **研究机构**: Sun Yat-sen University (中山大学), Peng Cheng Laboratory (鹏城实验室)

**1. 整体逻辑**
- **研究任务**: 具身操作中的视觉 - 语言 - 动作（VLA）策略学习，重点解决模型在分布外场景下的鲁棒性问题。
- **研究动机**: 现有 VLA 模型在训练分布内表现尚可，但对视觉观测变化（视角、光照）、指令 paraphrase（同义改写）及复合扰动非常敏感。本质是模型学到了浅层相关性，而非任务语义与环境状态间的稳定耦合。
- **本质改动**: 不在模型架构上做大幅改动，而是在端到端训练目标中显式引入三种一致性约束（指令、动作演化、观测），强制策略学习不变性特征。
- **技术溯源**: 基于双系统架构（Dual-system），语义提取使用 InternVL3.5-2B，动作生成使用 DiT（Diffusion Transformer）配合 Flow Matching，参考了 GR00T-N1.6 的设计。

**2. 技术拆解**
- **重点改进**: 提出了 RoVLA 框架，核心是三个一致性约束模块：
    1.  **指令一致性 (IC)**：数据层面改进。用 Qwen3-8B 为每条轨迹生成多个同义指令，训练时随机采样，不增加额外 Loss，强制模型忽略表面措辞差异。
    2.  **演化一致性 (EC)**：模型层面改进。在 Flow Matching 的去噪过程中，采样两个不同时间步 $\tau_1, \tau_2$，约束其预测的速度场向量一致，保证动作意图在生成过程中的稳定性。
    3.  **观测一致性 (OC)**：鲁棒性改进。基于 EC Loss 对视觉特征 $v_t$ 和机器人状态 $q_t$ 计算梯度，生成对抗扰动，约束扰动前后的速度场预测一致。
- **架构细节**:
    -   **输入**: 多视角 RGB 图像、自然语言指令、机器人本体状态。
    -   ** backbone**: VLM (InternVL3.5-2B) 取第 16 层隐藏状态作为语义特征；动作生成器为 32 层 DiT，通过 AdaLN 注入去噪时间步。
    -   **输出**: 未来动作块的速度场 (Velocity Field)，通过积分生成动作。
- **核心 Loss**:
    -   主任务 Loss $\mathcal{L}_{SFT}$：标准的 Flow Matching 回归 Loss（干净输入 + 扰动输入）。
    -   一致性正则项 $\mathcal{L}_{C}$：包含 $\mathcal{L}_{EC}$ (不同时间步速度场一致性) 和 $\mathcal{L}_{OC}$ (扰动前后速度场一致性)。
    -   总 Loss：$\mathcal{L}_{total} = \mathcal{L}_{SFT} + \lambda_j \mathcal{L}_{C}$，其中 $\lambda_j$ 随训练动态调整，初期侧重主任务，后期侧重一致性。

**3. 实验结果**
- **数据集和 baseline**:
    -   **数据集**: LIBERO-Plus (含 7 种扰动维度)、RoboTwin 2.0 (双臂操作)、真机任务 (Franka 机械臂，5 个桌面操作任务)。
    -   **Baseline**: 对比了现有的强基准方法（文中提及 OpenVLA, $\pi_0$, GR00T 等系列作为背景，实验部分对比了强 baseline）。
- **评价指标**: 任务成功率 (Success Rate)，重点评估在零-shot 扰动泛化和扰动暴露泛化 setting 下的表现。
- **实验结果**:
    -   在 LIBERO-Plus 和 RoboTwin 2.0 上，RoVLA  consistently 优于 baseline。
    -   在视觉变化、指令改写及复合扰动下，成功率下降幅度显著小于对比方法。
    -   真机实验验证了 sim-to-real 的迁移能力，在未见过的扰动组合下仍保持较高鲁棒性。

### 2. 🔥 [PAPO-VLA: Planning-Aware Policy Optimization for Vision-Language-Action Models] (PAPO-VLA：面向视觉 - 语言 - 动作模型的规划感知策略优化)
- **研究机构**: `中科院软件所 (Institute of Software Chinese Academy of Sciences), 国科大 (University of Chinese Academy of Sciences)`
- **Arxiv ID**: `2605.19580` | [点击跳转](https://arxiv.org/abs/2605.19580)

**0. 论文标题**
- **英文标题**: PAPO-VLA: Planning-Aware Policy Optimization for Vision-Language-Action Models
- **中文标题**: PAPO-VLA：面向视觉 - 语言 - 动作模型的规划感知策略优化
- **研究机构**: 中科院软件所 (Institute of Software Chinese Academy of Sciences), 国科大 (University of Chinese Academy of Sciences)

**1. 整体逻辑**
- **研究任务**: 针对语言引导的机器人操作任务，对预训练的 VLA 模型进行强化学习微调（Post-training），提升策略可靠性。
- **研究动机**: 现有的 GRPO 类微调方法把轨迹里所有动作一视同仁，只用轨迹级奖励。但实际上 VLA 策略兼具“规划者”（决定任务方向，如抓取瞬间）和“执行者”（连续运动）双重角色。规划动作一旦出错（如抓取姿态不对），后续执行再好也没用，需要重点优化。
- **本质改动**: 在 GRPO 的优势估计（Advantage Estimation）中，显式识别出关键的“规划动作”，并根据其因果重要性赋予更高权重，让模型更关注决定任务成败的关键步骤。
- **技术溯源**: 基于 GRPO (Group Relative Policy Optimization) 框架，基座模型参考 OpenVLA 等主流 VLA 架构。

**2. 技术拆解**
- **重点改进**:
    1.  **规划动作识别**: 结合“动作变化幅度”和“轨迹最终回报”。动作变化大且轨迹回报高的步，被认定为规划动作。
    2.  **因果重要性评估**: 对识别出的规划动作计算因果充分性（保留该动作是否促进成功）和因果必要性（扰动该动作是否导致失败），两者结合得到重要性分数。
    3.  **优势函数修正**: 将重要性分数加权到 GRPO 的 Advantage 中，使关键动作的梯度更新更强。
- **架构细节**:
    -   **输入**: 视觉观测序列 + 语言指令。
    -   **输出**: 机器人动作序列。
    -   **流程**:  rollout 多条轨迹 -> 计算轨迹奖励 -> 识别规划动作 -> 计算因果重要性 -> 修正 Advantage -> 更新策略。
    -   **规模**: 文中未明确参数量，沿用主流 VLA 设置。
- **核心 Loss**: 基于 GRPO 的 Policy Loss。主 Loss 为 clipped surrogate objective，其中 Advantage 项被替换为规划感知的 Advantage ($\widehat{A}_{i,t} = A_{i,t} + \eta \cdot C_{i,t}^{\mathrm{plan}}$)，包含 KL 散度约束。无额外的视频重建等辅助任务。

**3. 实验结果**
- **数据集和 baseline**: 在多个机器人操作 Benchmark 上测试。对比方法包括原始 OpenVLA、标准 GRPO 微调方法（如 TGRPO）等。
- **评价指标**: 任务成功率 (Task Success Rate)、轨迹级奖励 (Trajectory-level Reward)。
- **实验结果**: 相比标准 GRPO 和基座模型，PAPO-VLA 在任务成功率上有提升。可视化显示模型能更准确地在关键决策步（如抓取、释放）收敛，减少了因规划失误导致的任务失败。消融实验证明因果重要性评估和规划动作识别模块均有效。

### 3. 🔥 [DEFLECT: Delay-Robust Execution via Flow-matching Likelihood-Estimated Counterfactual Tuning for VLA Policies] (DEFLECT：基于流匹配似然估计反事实微调的 VLA 策略延迟鲁棒执行)
- **研究机构**: `香港科技大学（广州）, 中山大学`
- **Arxiv ID**: `2605.19294` | [点击跳转](https://arxiv.org/abs/2605.19294)

**0. 论文标题**
- **英文标题**: DEFLECT: Delay-Robust Execution via Flow-matching Likelihood-Estimated Counterfactual Tuning for VLA Policies
- **中文标题**: DEFLECT：基于流匹配似然估计反事实微调的 VLA 策略延迟鲁棒执行
- **研究机构**: 香港科技大学（广州）, 中山大学

**1. 整体逻辑**
- **研究任务**: 解决 VLA 策略在异步推理（Asynchronous Inference）部署下，因推理延迟导致“预测观测”与“执行状态”不匹配的问题。
- **研究动机**: 异步部署中，模型基于旧观测预测动作，但执行时物理状态已变化。高延迟下（如 5-7 控制步），Naive Async 成功率从 89% 跌至 1% 以下。现有微调方法（如 SFT）仅最小化重构损失，无法区分不同延迟下的动作优劣，缺乏偏好信号。
- **本质改动**: 将推理延迟本身转化为无标签的偏好信号。利用冻结的参考策略生成“新鲜观测”与“滞后观测”下的反事实动作对，并在部署时的混合上下文下进行 DPO 优化。
- **技术溯源**: 基于 Flow-matching VLA 架构（具体基于 VLASH 异步栈），结合 DPO 偏好优化思想。

**2. 技术拆解**
- **重点改进**: 提出完全离线的后训练微调方法。无需人类标签、奖励模型或在线 rollout。核心是构造延迟感知的偏好对，并用流匹配损失近似似然比进行 DPO 训练。
- **架构细节**:
    - **输入**: 部署时的混合上下文 $c^{mix}$（未来本体感知 + 过去视觉观测），匹配实际测试时的条件分布。
    - **生成**: 用冻结参考策略 $\pi_{ref}$ 在同一噪声下，分别基于 $c^{fresh}$（未来对齐）和 $c^{stale}$（过去对齐）生成优选动作 $A^+$ 和 拒选动作 $A^-$。
    - **评分**: 在 $c^{mix}$ 下计算两个动作的流匹配损失，作为隐式似然代理（因流匹配无解析密度）。
- **核心 Loss**: 总损失 = SFT 锚点损失（防止坍塌） + $\lambda_{DPO}$ * DPO 损失。DPO 部分使用流匹配损失作为负对数似然 surrogate，计算参考校准的偏好边界。

**3. 实验结果**
- **数据集和 baseline**: Kinetix（12 任务模拟）、LIBERO（4 套件模拟）、真机（双臂传送带、打地鼠）。Baseline 包括 VLASH、PFM、Naive Async、RTC、BID。
- **评价指标**: 任务成功率（Success Rate）、真机任务完成数。
- **实验结果**:
    - **Kinetix 高延迟区（d=5-7）**：成功率比 VLASH 高 6.4%（73.5% vs 67.1%），比 PFM 高 8.0%。
    - **LIBERO 最大延迟（d=7）**：比 VLASH 高 4.6%。
    - **真机**：传送带任务 II 成功率 90.0%（VLASH 83.3%）；打地鼠任务 30 秒内击中数 13.6（VLASH 10.4）。
    - **推理开销**：无额外开销，直接替换策略权重， inference 流程与基座一致。

### 4. 🔥 [ContextFlow: Hierarchical Task-State Alignment for Long-Horizon Embodied Agents] (ContextFlow：面向长程具身智能体的分层任务 - 状态对齐框架)
- **研究机构**: `清华大学 (Tsinghua University)`
- **Arxiv ID**: `2605.19314` | [点击跳转](https://arxiv.org/abs/2605.19314)

**0. 论文标题**
- **英文标题**: ContextFlow: Hierarchical Task-State Alignment for Long-Horizon Embodied Agents
- **中文标题**: ContextFlow：面向长程具身智能体的分层任务 - 状态对齐框架
- **研究机构**: 清华大学 (Tsinghua University)

**1. 整体逻辑**
- **研究任务**: 长程具身任务执行（主要是视觉语言导航 VLN），解决多阶段任务中的状态不一致问题。
- **研究动机**: 现有具身智能体的局部执行器（如导航、搜索）能力虽强，但规划器、记忆、运行时证据和执行器之间常出现“任务 - 状态不对齐”。例如：证据已显示目标可见，规划器仍停留在搜索阶段；或执行器已失效，任务阶段却未转移。这导致不必要的重规划或任务卡死。
- **本质改动**: 不再仅依赖执行器终止信号来推进任务，而是引入一个“对齐层”。将任务阶段定义为显式契约（Contract），将运行时观测封装为证据包（Evidence Packets），通过对比两者决定五种 scoped updates（继续、细化、转移、提升、修复）。
- **技术溯源**: 基于现有执行器（AO-Planner, ApexNav）和本地大模型（Qwen3.5-9B）构建框架，非端到端训练新模型。

**2. 技术拆解**
- **重点改进**: 设计了 ContextFlow 对齐框架。核心是将“任务状态”显式化，通过异步监控器收集证据，规划器根据证据与阶段契约的匹配程度做细粒度决策，而非全盘重规划。
- **架构细节**:
    - **输入**: 用户指令转化为阶段契约（包含目标、交接条件、预期证据、适用执行器）。
    - **运行时**: 记忆模块存储短期观测和长期历史；监控器将观测、执行器状态、不确定性打包为证据包。
    - **决策**: 规划器对比契约与证据包，输出 5 种更新操作之一。
    - **可视化**: 提供“可见对齐板”，实时显示当前阶段、预期证据、 live 证据、执行器状态及决策理由。
- **核心 Loss**: 系统框架论文，无端到端训练 Loss。核心逻辑基于 LLM 推理与规则判断，通过运行时决策质量（如是否成功推进阶段）来评估。

**3. 实验结果**
- **数据集和 baseline**:
    - 数据集：R2R-CE（连续视觉语言导航基准），构建了一个 30 episode 的子集，包含原生指令和机制敏感的压力测试指令。
    - Baseline：BUMBLE, MoMa-LLM。
    - 执行器配置：AO-Planner（路线导航）, ApexNav（局部搜索）, Qwen3.5-9B（规划端点）。
- **评价指标**: 成功率 (SR),  oracle 成功率 (OSR), 路径长度加权成功率 (SPL), 导航误差 (NE)，以及终止诊断（早停率、错停率）。
- **实验结果**:
    - **原生任务**: ContextFlow SR 达到 40.00%，显著高于 BUMBLE (16.67%) 和 MoMa-LLM (3.33%)；SPL 从 5.48% 提升至 24.65%。
    - **终止控制**: 早停率从 Baseline 的 53%-83% 降低至 30%，说明对齐机制有效避免了证据不足时的盲目停止。
    - **压力测试**: 在针对“ unsupported handoff", "stage lock" 等四种不对齐现象构建的敏感测试集中，ContextFlow 能通过对应的 scoped updates 有效修复错误，证明了对齐机制的有效性。

### 5. 🔥 [World-Ego Modeling for Long-Horizon Evolution in Hybrid Embodied Tasks] (面向混合具身任务长时段演化的世界 - 自我建模)
- **研究机构**: `多机构合作 (原文片段未包含具体单位列表，作者涉及编号 1-5)`
- **Arxiv ID**: `2605.19957` | [点击跳转](https://arxiv.org/abs/2605.19957)

**0. 论文标题**
- **英文标题**: World-Ego Modeling for Long-Horizon Evolution in Hybrid Embodied Tasks
- **中文标题**: 面向混合具身任务长时段演化的世界 - 自我建模
- **研究机构**: 多机构合作 (原文片段未包含具体单位列表，作者涉及编号 1-5)

**1. 整体逻辑**
- **研究任务**: 长时段、多轮次的具身视频生成，特别是包含“导航 + 操作”混合任务的场景演化预测。
- **研究动机**: 现有世界模型将“场景持久性规律”（World）与“机器人指令驱动行为”（Ego）混在单一流中预测。在长时段混合任务中，这种纠缠导致场景一致性下降（如导航时背景漂移）和指令对齐弱（如操作时物理 dynamics 不准）。
- **本质改动**: 提出“世界 - 自我建模”（World-Ego Modeling）范式，将未来演化显式分解为 World 状态（场景不变性）和 Ego 状态（交互动态），并在模型架构中进行解耦处理。
- **技术溯源**: 基于 **Qwen3-VL-2B-Instruct** (状态预测器) 和 **Wan2.2-TI2V-5B** (视频扩散生成器) 进行改造。

**2. 技术拆解**
- **重点改进**:
    1.  **状态预测器**: 引入角色条件注意力（Role-Conditioned Attention, RCA）。World 查询只关注历史视觉和过往指令，Ego 查询只关注当前指令和近期历史，从源头隔离信息流。
    2.  **生成器**: 采用级联并行混合专家（CP-MoE）结构。前级专家（Preceding Expert）融合双状态并预测“世界 - 自我”语义掩码；后级专家（World/Ego Experts）根据掩码路由 token 分别处理，最后解路由重组。
- **架构细节**:
    -   **输入**: 初始帧、历史视频块、多轮指令序列。
    -   **输出**: 下一段视频块 latent。
    -   **规模**: 预测器 2B 参数，生成器 5B 参数。采用非对称查询预算（World 192  queries, Ego 64 queries）。
    -   **解耦策略**: 实验对比了运动、语义、意图三种边界定义，最终采用**语义_based 视图 + 全解耦（Full Disentanglement）**效果最好。
- **核心 Loss**: 
    -   主 Loss: 流匹配 Loss ($\mathcal{L}_{\text{flow}}$)，用于视频生成质量。
    -   辅助 Loss: 掩码预测 Loss ($\mathcal{L}_{\text{mask}}$)，包含 BCE 和 Dice 项，监督语义头预测的 World-Ego 掩码。

**3. 实验结果**
- **数据集和 baseline**:
    -   **数据集**: 自建 **HTEWorld** Benchmark（基于 BEHAVIOR-1K），含 12.5 万视频 clips（450 万帧），300 条多轮评估轨迹（2000+ 指令），专门针对长时段混合任务。
    -   **Baseline**: Cosmos-Predict 2.5 (2B/14B), WoW-7B。均在 HTEWorld 上微调 4 epoch。
- **评价指标**: 采用 WorldArena 的 16 项 EWMScore， plus 6 项 HTEWorld 特有指标（如多轮连续性 RCBD、导航 - 操作相位一致性 FPHS 等）。
- **实验结果**: 
    -   在 HTEWorld 长时段混合任务上取得 **SOTA**，显著优于 Cosmos 和 WoW。
    -   在现有的纯操作任务 Benchmark 上保持竞争力，证明分解建模未损害短期操作性能。
    -   消融实验证实“语义视图”和“全解耦”架构对长时段一致性贡献最大。

### 6. 🔥 [Probing Embodied LLMs: When Higher Observation Fidelity Hurts Problem Solving] (探究具身大模型：为何更高的观察保真度反而损害问题解决能力)
- **研究机构**: `Technische Universität Berlin (柏林工业大学)`
- **Arxiv ID**: `2605.20072` | [点击跳转](https://arxiv.org/abs/2605.20072)

**0. 论文标题**
- **英文标题**: Probing Embodied LLMs: When Higher Observation Fidelity Hurts Problem Solving
- **中文标题**: 探究具身大模型：为何更高的观察保真度反而损害问题解决能力
- **研究机构**: Technische Universität Berlin (柏林工业大学)

**1. 整体逻辑**
- **研究任务**: 具身 LLM 智能体在闭环环境中解决顺序机械谜题（Lockbox）任务。
- **研究动机**: 仅靠成功率无法解释 LLM 在具身任务中成功或失败的根本原因。默认“感知越准越好”的假设可能不成立，需要探究感知误差与推理失败之间的耦合机制。
- **本质改动**: 未改进模型结构，而是将“观察保真度”作为干预变量。通过对比不同输入模态（RGB vs. 真值）及在仿真中注入可控噪声，探测行为模式变化。
- **技术溯源**: 基于 OpenAI GPT-o1（物理实验）和 GPT-4o（仿真实验），任务平台为 Lockbox 机械谜题。

**2. 技术拆解**
- **重点改进**: 提出一种行为探测方法。在仿真中通过随机翻转状态反馈（State Flip）引入观测噪声，模拟感知误差，观察其对推理过程的影响。
- **架构细节**: 物理端使用 Franka Panda 机械臂 + RGB-D 相机；输入分为 RGB、RGB-D、符号化真值三类。仿真端保留锁盒逻辑，仅输入符号状态，支持按比例翻转动作结果反馈。
- **核心 Loss**: 无训练 Loss。核心评价指标为任务成功率、步数效率、状态误读率（Misinterpretation Rate）及重复动作循环概率（Action Loop Probability）。

**3. 实验结果**
- **数据集和 baseline**: 物理 Lockbox 装置 + 仿真环境。Baseline 为无噪声的真值输入及人类启发式策略。
- **评价指标**: 累积成功率随步数变化曲线、状态翻转概率与成功率的关系、动作循环与成功率的相关性。
- **实验结果**:
    1.  **反直觉现象**: 物理实验中，RGB 输入表现最好（11 步达 80% 成功率），真值输入表现最差（15 步达 80% 成功率）。
    2.  **噪声收益**: 仿真中，40% 的状态翻转概率使成功率比无噪声基线提升 2.85 倍。
    3.  **机制解释**: 适度噪声显著减少了“重复动作循环”（Action Loops），而完美反馈反而容易让模型陷入死循环。
