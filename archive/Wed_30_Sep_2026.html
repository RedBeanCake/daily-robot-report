            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [MM-ABC: Towards Generalist Mobile Manipulation via Seeing, Coordinating and Imagining] (MM-ABC：通过视觉、协调与想象实现通用移动操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.35652` | [点击跳转](https://arxiv.org/abs/2609.35652)

**0. 论文标题**
- **英文标题**: MM-ABC: Towards Generalist Mobile Manipulation via Seeing, Coordinating and Imagining
- **中文标题**: MM-ABC：通过视觉、协调与想象实现通用移动操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个移动操作基础模型MM-ABC，通过稀疏多层VLM特征感知、仅训练时的未来几何想象监督，以及双流掩码联合注意力的干净动作预测，实现了高效的臂-基座协同，在多个仿真和真实世界基准上取得SOTA。

**1. 整体逻辑**
- **研究任务**: 移动操作（Mobile Manipulation），即控制移动底盘和机械臂在动态变化的工作空间中进行物体交互。
- **研究动机**: 移动操作面临两大挑战：1）连续自我运动下的动态空间感知；2）底盘（大尺度移动）和机械臂（细粒度交互）的异构动作协同。现有方法要么解耦两者但缺乏跨流协作，要么依赖显式3D表示或推理时的世界模型，导致计算和推理成本过高。
- **本质改动**: 不依赖推理时的世界模型，而是将“世界想象”作为纯训练时的额外监督信号来增强感知；在动作生成上，采用双流架构，并从理论和实验上证明在有限网络宽度下，“干净动作预测（clean-action x-prediction）”比传统的“速度预测（velocity v-prediction）”能更好地降低噪声并实现臂-基座任务分配。
- **技术溯源**: 基于 Qwen3-VL-4B（视觉语言骨干）、VGGT-Omega（几何教师模型）、Rectified Flow（动作生成框架）以及 DeepStack（多层特征注入机制）。

**2. 技术拆解**
- **核心方法**: 围绕“看（Seeing）、想（Imagining）、协同（Coordinating）”三个原则设计：
  1. **看**：稀疏多层VLM特征注入（Sparse DeepStack）。提取Qwen3-VL中间层特征，通过门控残差注入动作专家，保留多尺度视觉信息。
  2. **想**：仅训练时的未来分支。用可学习的查询预测未来几何特征，受冻结的几何教师监督，推理时直接切除，零推理开销。
  3. **协同**：MM-APT双流动作Transformer。机械臂和底盘动作流独立处理，通过掩码联合注意力交互（近处动作不看远处，远处看近处），并采用干净动作预测。
- **关键细节**: 
  - **输入输出**：输入为多视角图像、语言指令、80维归一化机器人状态（含有效性掩码）；输出为64步动作块（58维操作 + 22维底盘运动）。
  - **模型结构**：MM-APT包含16个Transformer块（宽度1024，16个头，FFN宽度4096）。
  - **数据规模**：预训练数据包含5000+小时、40万+ episodes、12个数据集、17种机器人形态（embodiments），并自采了MM-30数据集（30+小时，40+任务）。
- **训练/优化目标**: 
  - **动作损失**：基于Rectified Flow的掩码端点MSE损失（带逆平方权重），直接预测干净动作 $x$。
  - **未来监督损失**：未来查询输出与冻结教师特征的稳定余弦相似度对齐损失。
  - **总损失**：$\mathcal{L} = 1.0 \mathcal{L}_{action} + 0.05 \mathcal{L}_{future}$。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：EBench, RoboCasa365, ManiSkill-HAB, LIBERO, LIBERO-Plus，以及5个真实世界移动操作任务。
  - **对比对象（baseline）**：$\pi_{0.5}$, ABot-M0.5, GR00T-N1.5, Fast-WAM, LingBot-VA, OpenVLA, StarVLA-GR00T 等主流VLA和WAM模型。
- **评价指标**: 任务成功率（Success rate），阶段进度分数（Progress score）。
- **主要结果**: 
  - **仿真基准**：EBench成功率44.71%（超 $\pi_{0.5}$ 3.3%）；RoboCasa365加权平均61.2%（超 ABot-M0.5 7.0%）；ManiSkill-HAB三个套件均取得最高平均成功率。
  - **固定基座泛化**：LIBERO成功率99.1%；在LIBERO-Plus（无扰动训练）上达到82.8%（SOTA）。
  - **真实世界**：5个长程任务平均成功率83%（超 $\pi_{0.5}$ 12%，超 StarVLA-GR00T 29%）。
  - **消融实验（RoboCasa365 composite-seen）**：用速度预测替换干净动作预测，成功率从32.8%降至29.2%；移除未来监督降至24.9%；使用最后一层特征或交错条件注入分别降至25.6%和22.0%，验证了各核心组件的有效性。

### 2. 🔥 [Rethinking Causal Action Tokenization with Conditional Annealing in Flow Matching] (在Flow Matching中利用条件退火重新思考因果动作Token化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.35469` | [点击跳转](https://arxiv.org/abs/2609.35469)

**0. 论文标题**
- **英文标题**: Rethinking Causal Action Tokenization with Conditional Annealing in Flow Matching
- **中文标题**: 在Flow Matching中利用条件退火重新思考因果动作Token化
- **研究机构**: 原文未提及
- **一句话总结**: 提出CATok，利用Flow Matching的条件退火机制将连续动作离散化为具有从粗到细因果结构的Token序列，使其与自回归VLA模型的生成语义对齐，显著提升了机器人操作任务的成功率和训练效率。

**1. 整体逻辑**
- **研究任务**: 为纯自回归视觉-语言-动作（VLA）模型设计连续机器人动作的离散化（Tokenization）方法。
- **研究动机**: 现有动作Tokenizer（如基于DCT的FAST或基于VQ的OAT）仅将Token化视为压缩问题，忽略了动作生成的因果结构。这导致离散Token序列与自回归模型从左到右的生成语义不对齐，限制了长时序任务的表现和训练效率。
- **本质改动**: 将动作Token化从单纯的“压缩问题”重构为“因果生成问题”。利用Flow Matching去噪过程的自然层次，让前面的Token负责粗粒度全局结构，后面的Token负责细粒度残差修正，从而让离散Token序列的生成语义与自回归模型从左到右的预测逻辑结构对齐。
- **技术溯源**: Flow Matching (Rectified Flow), Multimodal Diffusion Transformer (MMDiT), ViT-VQGAN (Factorized VQ设计), Qwen3-VL / Qwen3.5-VL。

**2. 技术拆解**
- **核心方法**: 提出CATok（Causal Action Tokenizer）。包含双流动作编码器、瓶颈向量量化器（Bottleneck VQ）和带条件退火的Flow-Matching解码器。核心在于条件退火机制：在Flow Matching解码时，根据时间步 $t$ 逐步掩码前面的Token，强制模型在不同去噪阶段依赖不同的Token子集，从而在Token空间中诱导出因果顺序。
- **关键细节**: 
  - **编码器**：使用2D CNN提取动作的时空特征，结合可学习2D位置编码，通过MMDiT风格的对称多模态Transformer与 $K$ 个可学习Query进行交叉注意力交互。
  - **量化器**：采用ViT-VQGAN的分解码本设计（Factorized codes），将Query降维后映射到有限码本，解耦码本维度与隐藏层维度，提升码本利用率。
  - **解码器**：基于MMDiT的Flow-Matching速度网络。条件退火调度为 $\kappa(t) = \lfloor tK \rfloor$，在时间步 $t$ 只使用第 $\kappa(t)+1$ 到 $K$ 的Token作为条件输入。
  - **规模与超参**：Token序列长度 $K$ 通常为16（LIBERO/SimplerEnv）或32（RoboTwin 2.0）；码本大小4096；VQ降维维度16。
- **训练/优化目标**: 
  - **Tokenizer训练**：结合Flow Matching时域L1重建损失、DCT频域平滑损失（促进时序一致性）和标准VQ承诺损失（Commitment loss）。码本使用EMA更新，并定期重初始化低频条目以防坍塌。
  - **VLA训练**：冻结Tokenizer和解码器，VLA骨干网络使用交叉熵损失进行Teacher-forced的Next-token预测。离散Token作为唯一接口，阻断动作梯度回传，保护VLM的预训练知识。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真基准包括 LIBERO（4个suite，40个任务）、SimplerEnv（WidowX平台，Bridge数据集训练）、RoboTwin 2.0（50个任务，双机械臂ALOHA）。真实世界基准：Franka机械臂，3个任务套件（Pick-Spatial, Pick-Color, Stack-Long）。
  - **对比对象（Baseline）**：BIN（均匀分箱）、FAST（DCT+BPE）、OAT（带前缀掩码的VQ-VAE）。VLA骨干使用 $\pi_0$-FAST-base (LIBERO) 或 Qwen3-VL-4B-Instruct (SimplerEnv/RoboTwin 2.0)。
- **评价指标**: 
  - **任务表现**：成功率（Success Rate）。
  - **Tokenizer内在属性**：有效重建率（VRR）、压缩率（CR）、VRR×CR（保真度-压缩权衡）、编码/解码延迟。
  - **效率**：训练步数（达到相同性能所需的步数）、端到端推理延迟。
- **主要结果**: 
  - **任务表现**：在三个仿真基准中全面超越Baseline，尤其在长时序任务（如SimplerEnv的StackGreenCubeOnYellowCube）上，成功率相对最强Baseline提升超16.7%。真实世界任务中，相比FAST在三个套件上均稳定提升20个百分点。
  - **效率**：训练效率大幅提升，达到FAST最佳性能仅需约50%的训练步数；端到端推理延迟在所有方法中接近最小。
  - **内在属性**：在相同Token预算下，VRR×CR达到16.85，显著优于Baseline，实现最佳的保真度-压缩权衡；编解码延迟低于FAST。
  - **因果语义验证**：通过Next-token熵测试、t-SNE几何可视化、前缀重建以及Token替换/移除干预实验，直接证实了Token序列具有明确的从粗到细的因果生成语义（前面的Token控制粗粒度结构，后面的Token控制细粒度残差）。

### 3. 🔥 [Revision, Not Restart: Revisable Visual Plans for Closed-Loop World-Action Models] (修订而非重启：用于闭环世界-动作模型的可修订视觉规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.35439` | [点击跳转](https://arxiv.org/abs/2609.35439)

**0. 论文标题**
- **英文标题**: Revision, Not Restart: Revisable Visual Plans for Closed-Loop World-Action Models
- **中文标题**: 修订而非重启：用于闭环世界-动作模型的可修订视觉规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种针对世界-动作模型（WAM）的闭环规划修订机制（RTP），通过保存和修正视觉生成的中间去噪状态来适应执行反馈，避免了从头重新生成的高昂计算成本，显著提升了机器人任务成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作（VLA）/世界-动作（WAM）模型的机器人闭环控制与长程任务规划。
- **研究动机**: WAM在控制时会将预测的未来视觉状态作为动作条件。但在实际执行中，物理反馈（如接触延迟）往往与预测不符。直接复用原预测会累积时间误差，而从噪声完全重新生成（fresh replanning）计算成本高，且丢弃了原预测中依然合理的部分。
- **本质改动**: 将视觉预测视为可持久化并修订的条件。不从头重新生成，而是保存扩散/流匹配生成过程中的中间去噪状态（checkpoints），当新观测到来时，通过学习一个“修订桥（revision bridge）”从中间状态继续生成，以最小计算代价修正视觉计划。
- **技术溯源**: 基于 LingBot-VA（世界-动作模型基座），采用 Flow matching / Diffusion transformers 的视觉与动作联合生成范式。

**2. 技术拆解**
- **核心方法**: 提出 Revisable Temporal Planning (RTP) 框架。包含三个核心机制：1) **时间感知历史（Time-Aware History）**：使用时间金字塔采样维护多尺度的事实观测历史；2) **反馈条件修订桥（Feedback-Conditioned Revision Bridge）**：计算预测与当前观测的差异特征，通过学习的残差网络修正冻结的视觉速度场，从保存的中间状态继续去噪；3) **自适应更新策略（Adaptive Updates）**：训练差异估计器，根据预测与反馈的偏差，动态决定是直接复用、部分修订（Bridge-5/10）还是完全重新生成。
- **关键细节**: 
  - **输入输出**：输入为多视角图像、本体感觉、历史动作和语言指令；输出为连续的机器人动作。
  - **模型结构**：基座 LingBot-VA 冻结，额外训练一个 MLP（DiffEncode）提取反馈差异特征，以及一个残差网络（velocity correction）修正视觉速度场。
  - **规模与超参**：视觉计划窗口 $H=4$ 组，每次执行消耗 $H_c=1$ 组。生成过程分 $N=20$ 个 Euler 区间，系统保存第 10 和 15 步的 checkpoint（对应 Bridge-10 和 Bridge-5 两种修订深度）。
- **训练/优化目标**: 训练分三阶段。Stage A 微调基座适配时间历史；Stage B 冻结基座，用视觉和动作的方差缩放均方误差（MSE），加上与全新生成结果的正则化项（fresh consistency regularization）来训练修订桥；Stage C 训练一个异方差绝对误差目标（heteroscedastic absolute-error objective）的差异估计器，用于评估修订与重新生成的差异并设定自适应阈值。

**3. 实验结果**
- **实验设置**: 在 RoboMME（16个任务）和 RMBench（9个双臂任务）上评估。对比的 Baselines 包括 VLA 模型（$\pi_{0.5}$, MME-VLA, MemER, X-VLA, Mem-0）和 WAM 模型（Fast-WAM, LingBot-VA, MemoryWAM）。
- **评价指标**: 任务平均成功率（Task-averaged success rate, %），以及控制器调用的计算成本（平均视觉生成步数 / Mean call time）。
- **主要结果**: 
  - **成功率提升**：在 RoboMME 上，RTP 达到 48.6%，比同基座使用 fresh replanning 的 LingBot-VA (time-aware, 40.4%) 提升 8.2 个百分点，且优于 MME-VLA (44.5%)。在 RMBench 上，RTP 达到 84.8%，优于 MemoryWAM (83.0%) 和 LingBot-VA (78.2%)。
  - **计算效率优化**：相比于固定使用 Bridge-10 的策略，RTP 的自适应选择将平均视觉生成步数从 12.33 降至 7.78（减少 36.9%），在提升成功率的同时大幅降低了推理计算开销。

### 4. 🔥 [Spatial Grafting: Grounding 3D Features for Flow-Matching Robot Policies] (空间嫁接：为流匹配机器人策略锚定3D特征)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.35249` | [点击跳转](https://arxiv.org/abs/2609.35249)

**0. 论文标题**
- **英文标题**: Spatial Grafting: Grounding 3D Features for Flow-Matching Robot Policies
- **中文标题**: 空间嫁接：为流匹配机器人策略锚定3D特征
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种轻量级即插即用模块，将冻结的3D重建特征锚定到度量空间和机器人相对坐标系，通过交叉注意力注入流匹配动作专家的末端层，在不改动主感知通路的前提下大幅提升VLA和WAM策略的接触级操作精度。

**1. 整体逻辑**
- **研究任务**: 为预训练的机器人操作策略（VLA和WAM）补充操作相关的3D空间几何信息，解决策略在接触级（contact-level）抓取和放置时精度不足的问题。
- **研究动机**: 现有的VLA和WAM仅将场景视为2D像素，缺乏度量尺度和表面相对于夹爪的位置信息，导致策略“能选对物体和动作序列，但抓不准”。现有的空间动作模型要么依赖部署时不具备的特权信息（如深度传感器、场景地图、实例标签），要么只针对单一策略家族从头训练，未能将3D重建模型的潜在特征（latent features）有效、通用地传递给预训练的流匹配动作专家。
- **本质改动**: 不修改主机的感知通路，而是构建“空间银行（spatial bank）”，将冻结的3D重建特征在网格级别绑定到绝对度量坐标和末端执行器相对偏移，然后通过仅依赖银行的交叉注意力（bank-only cross-attention）将特征作为残差注入到动作专家的末端Transformer块中。
- **技术溯源**: 基于预训练的流匹配动作专家（VLA: $\pi_{0.5}$, X-VLA; WAM: Fast-WAM, LingBot-VA）和冻结的3D空间重建基础模型（Depth Anything 3 (DA3), VGGT-$\Omega$）。

**2. 技术拆解**
- **核心方法**: Spatial Grafting（空间嫁接）模块，包含空间银行构建和嫁接注入两步。1) 空间银行构建：从冻结的3D重建模型提取多层特征，利用相机标定和度量深度图反投影计算3D点，计算绝对坐标和相对于末端执行器（腕部相机光心）的相对坐标，通过傅里叶编码和FiLM调制将几何位置信息与潜在特征绑定，生成空间银行。2) 嫁接注入：在动作专家的最后几个Transformer块中，动作token先通过交叉注意力查询主视角（全局相机）的空间银行，更新后的状态再查询辅助视角（腕部相机）的空间银行，最后通过无偏置线性投影融合辅助视角的输出并加回动作状态。
- **关键细节**: 
  - **输入输出**: 输入为RGB图像、相机内外参、度量深度图（测量或预测）和末端执行器锚点，无需分割或地图；输出为修正后的动作token状态。
  - **模型结构**: 冻结的DA3提取4层特征映射到统一网格（如18x24）。嫁接模块包含主视角交叉注意力、辅助视角查询投影、辅助视角交叉注意力和无偏置融合层。
  - **规模**: 嫁接模块增加的参数量仅占主机的4.4%~5.4%（如为3.3B的$\pi_{0.5}$增加约147M参数）。
  - **关键设计**: 仅注入动作专家的最后M个块（VLA为最后6块，WAM为最后10块）；采用无偏置投影和仅尺度归一化，确保当空间银行为零时，嫁接模块的输出残差严格为零（Bank-only invariant）。
- **训练/优化目标**: 保持主机原有的流匹配（Flow-Matching）速度场预测损失不变，仅将空间银行作为额外的条件输入。无辅助几何监督损失。训练时采用短暂的warmup（冻结主机）和whole-graft dropout策略。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO（短视界，近饱和），RoboTwin 2.0（双臂，Clean和Randomized场景），RoboPRO（包含障碍物和碰撞惩罚），BEHAVIOR-1K (B1K)（长视界移动双臂），以及3个真实机器人平台（单臂UR5e，双臂Piper，人形R1Pro）。
  - **对比对象**: 各主机的Base版本，以及已发布的3D条件策略（WAM4D, Spatial Forcing, GLaD, GeoVLA, SpatialVLA, SERF等）。
- **评价指标**: 成功率（SR, %），B1K使用Q-score（平均任务进度），RoboPRO使用Easy/Hard标准。
- **主要结果**: 
  - **RoboTwin 2.0**: 嫁接后的$\pi_{0.5}$在Clean和Randomized下分别达94.0%和92.4%，超越最强3D策略WAM4D（93.8%和89.9%）。4个主机均获显著提升（平均Clean +7.5%，Randomized +8.2%）。
  - **B1K**: 嫁接后的$\pi_{0.5}$-RLC在6个任务中的5个上超越2025年挑战赛冠军，最高提升0.47 Q-score，且在抓取困难的任务上提升最大。
  - **RoboPRO**: 在杂乱场景下，所有主机的Easy和Hard指标均提升，有效减少碰撞。
  - **真实机器人**: 6个任务成功率提升20%~50%，证明在真实深度噪声和标定误差下的泛化能力。
  - **消融实验**: 证明性能提升源于锚定的几何内容而非单纯增加的参数（关闭或打乱bank会导致性能低于base）；晚期注入优于全层注入；更换3D重建骨干（如VGGT-$\Omega$）依然有效。

### 5. 🔥 [EMPIRIC: Experiment-Driven Learning of Residual World Models for Robot Planning] (EMPIRIC：用于机器人规划的实验驱动残差世界模型学习)
- **研究机构**: `Princeton University（正文致谢中提及，未列出完整机构列表）`
- **Arxiv ID**: `2609.35047` | [点击跳转](https://arxiv.org/abs/2609.35047)

**0. 论文标题**
- **英文标题**: EMPIRIC: Experiment-Driven Learning of Residual World Models for Robot Planning
- **中文标题**: EMPIRIC：用于机器人规划的实验驱动残差世界模型学习
- **研究机构**: Princeton University（正文致谢中提及，未列出完整机构列表）
- **一句话总结**: 提出 EMPIRIC，让机器人通过编写 Python 代码将缺失的物理机制（如风力、胶水）作为“残差”挂载到基础物理引擎上，结合贝叶斯推断处理不确定性，从而在少量带噪交互中实现高效的任务规划。

**1. 整体逻辑**
- **研究任务**: 在部分可观测的持续操作环境中，让机器人通过少量带噪交互学习缺失的物理机制（如胶水固化、风力、加热），推断隐藏状态和参数，并用于任务与运动规划。
- **研究动机**: 现有物理引擎缺乏对复杂现实机制（如流体、热力、特殊粘合）的先验知识；Real-to-sim 方法只能重建几何结构，无法发现“开风扇产生风”等因果机制；机器人需要处理隐藏状态（如胶水固化进度）和传感器噪声，并在不确定性下进行安全规划。
- **本质改动**: 不从头训练黑盒神经网络或完全重写物理引擎，而是利用 LLM 智能体编写 Python 代码，作为“残差（Residual）”动态挂载到基础刚体物理引擎上，补充缺失的物理机制，并结合贝叶斯推断联合估计参数与隐藏状态。
- **技术溯源**: 基础物理引擎（如 PyBullet）、LLM 代码智能体（基于 Claude Opus 5）、程序合成与代码世界模型（如 WorldCoder）。

**2. 技术拆解**
- **核心方法**: EMPIRIC 框架包含四个核心循环：1) **编写残差代码**：继承基础模拟器，添加新力、约束和循环隐藏状态（如接触时间）；2) **贝叶斯推断**：从 replay buffer 和带噪历史中推断参数后验和基础状态；3) **规划与信息获取**：通过蒙特卡洛采样评估计划成功率，或利用互信息选择主动实验以消除不确定性；4) **执行监控与修正**：检查谓词是否满足，失败则修改代码或重新推断。
- **关键细节**: 
  - **输入输出**：输入为带噪的对象特征、图像和自然语言目标；输出为技能序列（如 Pick, Place, Push）。
  - **模型结构**：基础模拟器 $F_{base}$ + 智能体编写的残差程序 $P$。残差程序维护隐藏状态 $x_{res}$。
  - **推断细节**：使用 mean-field 近似参数后验，基础状态仅依赖近期观测（模块化近似），隐藏状态由程序根据参数和历史确定性计算。
  - **规模/超参**：仿真中 LLM 使用 Claude Opus 5 (high effort)；规划时采样 K=16（仿真）或 K=24（真机）次联合 draws。
- **训练/优化目标**: 
  - **优化目标**：最小化回放损失（Replay loss），即模拟轨迹与观测特征的标准化平方误差，结合 Huber loss 和温度参数 $\lambda$ 计算广义后验。
  - **规划目标**：最大化计划成功的期望奖励；**信息获取目标**：最大化参数与谓词观测之间的互信息。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：5个 PyBullet 仿真域（Domino, Bridge, Balloons, Boil, Fan），1个真实机器人物理域（Fan-Domino）。
  - **对比对象 (Baselines)**：Direct agent（无模拟器）、Direct + scene（有场景资产）、Standalone sim.（从头写模型）、Oracle dynamics（提供真实动力学）、No harness fitting（消融：去掉拟合参数信念）、No explicit uncertainty（消融：去掉显式不确定性处理）。
- **评价指标**: 
  - **任务成功率**（Run success rate，所有训练和测试任务均解决的比例）。
  - **环境交互步数**（Environment steps，衡量样本效率）。
- **主要结果**: 
  - EMPIRIC 在 5 个仿真域的 25 个 run 中实现 100% 成功率（25/25），显著优于 Direct agent (16/25)、Direct + scene (14/25) 和 Standalone sim. (16/25)。
  - 交互效率更高：在多数域中，EMPIRIC 达到 60% 解决率所需的交互步数少于所有 baseline。
  - 与 Oracle dynamics 相比，成功率持平，但在 Fan 域步数更少，在 Boil 域因需学习机制步数多 74%。
  - 消融实验表明，参数推断和显式不确定性处理在不可逆动作（如 Balloons 中防止气球碰天花板爆裂）中起决定性作用。
  - 真实机器人实验：在 Fan-Domino 任务中，仅通过两次吹风实验推断出风力衰减和骨牌质量，成功规划出双骨牌级联任务，预测滑动距离（10.1±2.3 cm）与实际（9.9 cm）高度吻合。

### 6. 🔥 [Learning to Act under Visual Interruptions with Vision-Language-Action Models] (视觉-语言-动作模型在视觉输入中断下的动作学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.35003` | [点击跳转](https://arxiv.org/abs/2609.35003)

**0. 论文标题**
- **英文标题**: Learning to Act under Visual Interruptions with Vision-Language-Action Models
- **中文标题**: 视觉-语言-动作模型在视觉输入中断下的动作学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出评估VLA模型在相机流中断时表现的基准MAIL-Bench，并提出MINT方法，通过缺失视觉训练与推理时选择性视觉预测及可靠性门控，显著提升模型在相机丢失下的操作成功率。

**1. 整体逻辑**
- **研究任务**: 评估和提升视觉-语言-动作（VLA）模型在机器人闭环操作任务中，应对部分或全部相机输入流中断（丢失）的鲁棒性。
- **研究动机**: 现有VLA评估通常假设相机流全程可用，或仅测试图像外观/位姿扰动。实际部署中相机可能完全断流（hard missing），导致模型失去特定视角信息，现有基准缺乏对此类“视觉流完全丢失”场景的评估和应对方案。
- **本质改动**: 将“视觉流完全丢失”作为核心评估条件构建新基准，并提出MINT框架：训练时通过注意力掩码让模型学会在部分视觉缺失下依靠剩余输入动作；推理时利用光流或世界模型预测缺失视角，并通过可靠性门控在预测失效时自动回退到缺失状态。
- **技术溯源**: 基于 RoboCasa365 仿真环境构建基准；基座模型为 $\pi_{0.5}$ 和 GR00T N1.5；视觉预测采用 Farnebäck 光流和 PersistWorld（动作条件世界模型）。

**2. 技术拆解**
- **核心方法**: 
  1. MAIL-Bench 基准：在任务执行中途（30%, 45%, 60%进度）切断特定视觉角色（腕部、第三人称、全视觉）的输入，评估模型在条件成功下的能力保留率。
  2. MINT 框架：
     - 缺失视觉训练：引入相机可用性课程，随机掩盖部分相机的视觉token，让模型学会在部分视觉缺失下依靠剩余输入动作。
     - 选择性视觉预测：腕部/全视觉丢失使用光流外推；第三人称丢失使用动作条件世界模型。
     - 可靠性门控回退：持续监控预测路由的可靠性（如光流置信度、世界模型预测的辅助腕部图像与真实腕部图像的一致性），一旦预测不可靠则立即撤回，回退到缺失输入状态。
- **关键细节**: 
  - 输入输出：输入为多视角图像、本体感觉、语言指令，输出为动作chunk。
  - 模型结构：不修改底层VLA架构，仅在输入端增加可用性标志（availability flag），通过 attention mask（$\log 0 = -\infty$）将缺失相机的视觉token权重置零。
  - 规模/超参：微调30k步。光流路线最小置信度0.05/0.08；世界模型路线最大腕部一致性误差0.20，生成上限8 blocks（64步）。
- **训练/优化目标**: 
  - 训练目标：与原始VLA基座的动作预测损失函数一致，仅在输入端对缺失相机的token进行mask。
  - 推理机制：通过可靠性诊断计算路由可靠性 $\rho$，递归更新接受状态 $c$，一旦拒绝则不可逆地撤回预测。

**3. 实验结果**
- **实验设置**: 
  - 数据集：MAIL-Bench（基于RoboCasa365，18个Atomic-Seen任务，900个固定场景）。
  - 对比对象：原始 $\pi_{0.5}$ 和 GR00T N1.5 模型，以及消融实验中的 Clean FT + prediction（仅预测不缺失训练）和 Missing-view FT（仅缺失训练不预测）。
  - 真机环境：AgiBot G2 机器人，4个桌面操作任务。
- **评价指标**: 
  - 仿真：$S_{MAIL}$ 指标。先计算健康状态下的成功率 $H_j$，再计算在中断条件下保留的条件成功率 $M_{c,j}$，最后加权平均。
  - 真机：各任务在健康及不同中断条件下的成功试验次数（每条件10次试验）。
- **主要结果**: 
  - MINT 在两个基座模型上均显著提升了中断条件下的成功率。GR00T N1.5 的 $S_{MAIL}$ 从 0.246 提升至 0.462（$\Delta = +0.216$）；$\pi_{0.5}$ 从 0.257 提升至 0.349（$\Delta = +0.092$）。
  - 在健康（无中断）设置下，MINT 无性能下降甚至有所提升（如 GR00T N1.5 小家电任务从 0.290 升至 0.450），说明缺失视觉训练减少了模型对特定视角的过度依赖。
  - 消融实验表明，缺失视觉训练主要防止早期丢失视角导致的性能崩溃，而视觉预测主要在早期第三人称视角丢失时提供显著增益。
  - 真机实验中，MINT 在所有缺失输入设置下均优于基线模型，且在健康设置下无性能退化。

### 7. 🔥 [RoboFL: Federated Expert Assembly for World Action Models] (RoboFL：面向世界动作模型的联邦专家组装)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34968` | [点击跳转](https://arxiv.org/abs/2609.34968)

**0. 论文标题**
- **英文标题**: RoboFL: Federated Expert Assembly for World Action Models
- **中文标题**: RoboFL：面向世界动作模型的联邦专家组装
- **研究机构**: 原文未提及
- **一句话总结**: 提出RoboFL框架，通过服务器端MoE组装客户端LoRA适配器，并结合跨路径路由蒸馏与共识聚合，在数据孤岛和任务异构场景下大幅提升联邦世界动作模型的性能与通信效率。

**1. 整体逻辑**
- **研究任务**: 在数据孤岛（隐私/所有权限制）和任务高度异构（non-IID）的机器人操作场景下，通过联邦学习训练视觉-语言-动作（VLA）或世界动作（WAM）模型。
- **研究动机**: 机器人交互数据稀缺且受隐私限制，难以集中，联邦学习是自然选择。但直接聚合参数（如FedAvg）会混淆不兼容的更新；而在客户端训练MoE并在联邦中聚合，会导致专家特化被稀释、路由选择不稳定。
- **本质改动**: 将“本地专家特化”与“全局路由学习”解耦。客户端仅训练并上传单LoRA适配器，服务器端将其直接作为MoE的固定专家槽位，在服务器端联合优化路由器和专家，最后通过跨路径共识将专家更新压缩为全局适配器下发。
- **技术溯源**: 基于 InternVLA-A1-3B（预训练VLA/WAM基座），结合 LoRA（参数高效微调）、MoE（混合专家模型）、Flow-Matching（动作生成）、Cosmos（未来帧预测）。

**2. 技术拆解**
- **核心方法**: 提出 MoSAIC（Mixture of Slotted Adapters）机制，包含三个核心组件：1) 适配器插槽与路由专家集成；2) FARD（前瞻到动作的路由蒸馏）；3) PCEA（路径共识专家聚合）。
- **关键细节**: 
  - 模型架构采用三路WAM（理解U、生成G、动作A），通过统一的掩码自注意力耦合。
  - MoSAIC：客户端上传的LoRA直接覆盖服务器端对应的专家槽位（无平均操作），服务器端使用Top-k路由。
  - FARD：利用理解路径和生成路径的路由共识（几何平均+可靠性权重），通过JS散度蒸馏指导动作路径的路由器。
  - PCEA：利用U/G/A三路的路由共识（Hellinger重心）对服务器端精炼后的完整专家更新进行加权，通过SVD/QR分解重构为秩受限的全局LoRA适配器，再与客户端专家混合后下发。
- **训练/优化目标**: 
  - 动作路径：Flow-Matching的MSE损失。
  - 生成路径：预测未来Cosmos latents的MSE损失。
  - 辅助损失：模块级负载均衡损失。
  - FARD损失：带可靠性权重的JS散度蒸馏损失。
  - 总损失：动作损失 + 生成损失 + 辅助损失 + FARD损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集与场景：RoboTwin 2.0 (50 tasks), RLBench (8 tasks), 真实世界Franka机械臂 (6 tasks)。
  - 对比对象（Baseline）：集中式PEFT（InternVLA-A1, Motus），联邦学习方法（FedAvg, FedMoE, ForgeVLA, FedVLA）。
- **评价指标**: 任务成功率（Success Rate, %），客户端单轮通信开销（Communication MiB），峰值显存占用（Memory GiB）。
- **主要结果**: 
  - RoboTwin 2.0：RoboFL整体成功率83.12%，比FedAvg高4.20%，甚至超过集中式InternVLA-A1 (81.60%)。
  - 真实Franka：整体成功率59.17%，比集中式InternVLA (46.94%) 高12.23%。
  - 通信与资源：客户端通信量与单适配器FedAvg持平（311.63 MiB），相比基于MoE的联邦基线（如FedVLA）减少了高达86.81%的通信量，显存从15.59 GiB降至8.33 GiB。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34684` | [点击跳转](https://arxiv.org/abs/2609.34684)

**0. 论文标题**
- **英文标题**: Natural State-Prediction Accuracy can Hide Weak Controlled Responsiveness in VLA Readouts
- **中文标题**: 自然状态预测准确率会掩盖VLA读出器中微弱的受控响应能力
- **研究机构**: 原文未提及
- **一句话总结**: 提出一套交叉干预评估框架，证明VLA模型在自然轨迹上极高的状态预测准确率，实际上掩盖了其内部表征对物理状态变化缺乏真实响应的问题，并证明引入受控诊断指标能更有效预测下游策略失败。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作（VLA）模型内部表征对物理状态（如物体位置、关节角度）的解码质量，并探究其与下游策略行为的真实关联。
- **研究动机**: 现有工作仅通过自然轨迹上的低预测误差（Natural MAE）来证明VLA表征包含了状态信息。但在自然数据中，目标状态与机器人位姿、遮挡、任务进度高度耦合，模型可能只是利用了上下文捷径（contextual cues），而非真正对目标物理状态的变化敏感。
- **本质改动**: 将单一的“自然预测准确率”拆解为三个独立维度：自然预测准确率、目标状态响应度（固定上下文下对状态变化的响应）和上下文稳定性（固定状态下对上下文变化的鲁棒性），通过物理仿真中的交叉干预实验将“预测准”和“真响应”彻底解耦。
- **技术溯源**: 基于冻结的VLA模型（SmolVLA, OpenVLA, $\pi_0$ base, GR00T N1.6）以及非VLA视觉编码器（SigLIP 2, VC-1, R3M, DINOv3），在Meta-World和LIBERO仿真环境中进行验证。

**2. 技术拆解**
- **核心方法**: 构建物理验证的交叉对比网格（Crossed comparisons）。在仿真中固定机器人上下文（位姿/外观），改变目标物理坐标以评估“响应度”；固定目标物理坐标，改变机器人上下文以评估“稳定性”。在冻结的VLA特征上拟合读出器（Readout），并计算对应的解耦诊断指标。
- **关键细节**: 
  - **输入输出**：输入为VLA冻结的视觉/多模态特征，输出为单一连续物理坐标（如抽屉位移、水龙头旋转角）。
  - **模型结构**：特征提取器完全冻结，使用Ridge回归、RBF或MLP作为Readout。
  - **关键指标**：自然/受控MAE；端点增益 $G$（预测变化量与真实变化量之比，理想值为1）；增益误差 $E_G$；上下文敏感度 $R$（不同上下文下预测值的极差）。
- **训练/优化目标**: Readout的训练目标是最小化加权平方误差（Ridge）或均方误差（MLP）。评估阶段不更新VLA参数，且Readout的预测结果不反馈给策略（开环诊断），确保评估的是表征本身的信息量而非闭环控制效果。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：Meta-World（Drawer抽屉、Faucet水龙头任务）用于主要表征分析；LIBERO用于行为策略评估。
  - **对比对象（Baseline）**：仅使用自然轨迹训练的Readout，以及仅使用初始状态误差和物理变量的失败预测器（$M_0$）。测试了SmolVLA, OpenVLA, $\pi_0$, GR00T N1.6及多种视觉编码器。
- **评价指标**: 自然MAE、受控MAE、端点增益 $G$、增益误差 $E_G$、上下文敏感度 $R$；下游任务中策略失败的Brier score和Log loss。
- **主要结果**: 
  - **高自然准确率与弱受控响应共存**：在SmolVLA和OpenVLA上，Drawer任务自然MAE低至3.8-5.5mm，但受控MAE高达74-75mm，端点增益 $G$ 仅为0.15-0.18（远小于1）。这证明Readout在自然分布上“猜得准”，但在受控干预下对物理状态变化极不敏感。该解耦现象在多种模型和Readout中普遍存在。
  - **受控诊断指标具有额外预测价值**：将受控诊断指标（$E_G, R$ 或受控MAE）加入失败预测器后，相比仅用初始误差的Baseline（$M_0$），显著降低了策略失败预测的Brier score和Log loss（例如 $M_{GR}$ 相比 $M_0$ 的Brier score从0.1815降至0.1713）。这证明这些解耦指标能提供超越初始误差的真实物理状态信息，有助于更好地诊断策略行为。

### 9. 🔥 [Efficient World Action Model Inference with Adaptive Intermediate States] (通过自适应中间状态实现高效的世界动作模型推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34608` | [点击跳转](https://arxiv.org/abs/2609.34608)

**领域与类型判断**：本文属于具身智能（Embodied AI）与机器人控制领域，是一篇**方法创新/系统工程**类工作。核心在于通过系统级的推理时状态复用，解决生成式世界模型在闭环控制中的延迟瓶颈。

**0. 论文标题**
- **英文标题**: Efficient World Action Model Inference with Adaptive Intermediate States
- **中文标题**: 通过自适应中间状态实现高效的世界动作模型推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出免训练推理加速框架 WAMachine，通过在重规划、去噪步骤和 Transformer 层间保留并自适应复用中间状态，大幅降低世界动作模型（WAMs）的闭环控制推理延迟。

**1. 整体逻辑**
- **研究任务**: 加速具身智能中世界动作模型（WAMs）的闭环推理，降低 observation-to-action (O2A) 延迟和 GPU 推理时间。
- **研究动机**: WAMs 依赖迭代扩散或流匹配生成器，在闭环控制的重规划、去噪和 Transformer 前向传播中存在大量重复计算。现有加速方法（如 RTI-DP, RTC, DiCache）仅在推理管道的孤立环节复用状态，忽略了推理状态随任务上下文和计算过程连续演变的特性（state continuity）。
- **本质改动**: 将闭环 WAM 推理视为持续演化的有状态过程（stateful process），提出 WAMachine 框架，跨重规划、去噪步骤和 Transformer 层统一保留并自适应调整中间状态，把孤立的复用机会变成统一的加速框架。
- **技术溯源**: 基于 Diffusion Transformer (DiT) 架构，具体评估了 Cosmos Policy、Fast-WAM-IDM 和 Motus 三种代表性 WAM 架构。

**2. 技术拆解**
- **核心方法**: WAMachine 包含三个核心机制：1) 跨重规划的轨迹重映射（Trajectory Remapping）；2) 跨去噪步骤的观测重绑定（Observation Rebinding）；3) 跨 Transformer 层的残差重缩放（Residual Rescaling）。
- **关键细节**: 
  - **Trajectory Remapping**: 提取上一次重规划的去噪终点和归一化去噪方向，通过时间坐标对齐映射到新规划上下文，作为下一次重规划的初始化，减少从纯噪声开始的探索。
  - **Observation Rebinding**: 在物理动作执行期间，利用预测的未来观测进行有界的提前推理（anticipatory inference）。当真实观测到达时，计算预测与真实观测的加权 RMSE 进行一致性检查。若通过，则将保留的去噪状态绑定到真实观测继续推理；否则从 remapped 初始化重新开始。
  - **Residual Rescaling**: 将 DiT 分为 head、shallow probe、middle layers 和 tail。保留 middle layers 的累积残差。在后续去噪步骤中，通过 shallow probe 计算当前残差，用最小二乘法拟合缩放因子。若满足余弦相似度和拟合误差阈值，则缩放保留的残差并跳过 middle layers 计算；否则执行全量计算并刷新保留的状态。
- **训练/优化目标**: 这是一个免训练（training-free）的推理时加速框架，无需额外的损失函数。核心机制依赖于启发式的一致性检查（如 RMSE 阈值、余弦相似度阈值）来决定状态的复用或刷新。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**: LIBERO (Spatial, Object, Goal, Long suites) 和 RoboTwin 2.0 (Clean, Randomized settings)。
  - **对比对象 (baseline)**: Native runtime (原生推理), RTI-DP, RTC, VLA-Cache, BAC。
  - **测试环境**: NVIDIA A100 80GB GPU（Motus 额外使用一块渲染 GPU）。
- **评价指标**: 每次重规划的 GPU 推理时间（仅计 DiT 计算）、Observation-to-action (O2A) 延迟（端到端控制延迟）、任务成功率。
- **主要结果**: 
  - 在三种 WAM 架构上，WAMachine 实现了 1.47–3.05 倍的 O2A 延迟加速，以及 2.23–3.27 倍的每次重规划 GPU 推理时间加速。
  - 在大规模样本评估中，WAMachine 保留了原生 WAM 96.69%–99.54% 的任务成功率（例如在 LIBERO 上的成功率仅下降 1% 左右）。
  - 消融实验表明，三个机制和 CUDA Graphs 均对降低延迟有贡献：Trajectory Remapping 和 Residual Rescaling 主要降低 GPU 推理时间，Observation Rebinding 主要降低 O2A 延迟。

### 10. 🔥 [Where Memory Belongs: Ledger, an Object Ledger for Memory-Augmented VLAs] (记忆该放在哪：面向记忆增强VLA的物体账本 Ledger)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34554` | [点击跳转](https://arxiv.org/abs/2609.34554)

**0. 论文标题**
- **英文标题**: Where Memory Belongs: Ledger, an Object Ledger for Memory-Augmented VLAs
- **中文标题**: 记忆该放在哪：面向记忆增强VLA的物体账本 Ledger
- **研究机构**: 原文未提及
- **一句话总结**: 提出将VLA的记忆拆分为策略内的短期感知记忆和策略外的长期物体账本（Ledger），并通过LLM在运行时动态路由，在RoboMME基准上大幅刷新了长视野机器人操作的成功率。

**1. 整体逻辑**
- **研究任务**: 解决长视野、部分可观测环境下的机器人操作任务（如记住物体被谁盖住、动作循环了几次、物体之前放在哪）。
- **研究动机**: 现有的VLA模型把记忆全塞在策略网络内部（in-policy），但没有任何单一机制能cover住所有时空维度的记忆需求，导致在RoboMME等基准上表现远不及提供完美子目标的Oracle方法。核心瓶颈在于“策略不知道该记住什么、去哪找记忆”，而不是底层执行能力不行。
- **本质改动**: 核心思路是“记忆分类存放”：短期感知记忆（如动作次数、轨迹）留在策略内部，长期物体记忆（如物体位置、遮挡历史）抽出来放在策略外部，做成一个显式的账本（Ledger）。用一个高层LLM在运行时根据指令和账本动态决定用哪种记忆，不需要预先训练任务路由器。
- **技术溯源**: 基于 $\pi_{0.5}$ VLA模型（PaliGemma-2B骨干 + Flow-matching动作专家），结合 SAM3（目标追踪）、Qwen3-VL-30B（视频理解）和 Claude Sonnet 5（LLM规划器）。

**2. 技术拆解**
- **核心方法**: 
  1. 外部长期记忆（Ledger）：用SAM3追踪物体位置、静止区间和遮挡事件，用VLM生成动作转录，通过几何共置规则（co-location）统一表示空间状态。
  2. 内部短期记忆：在 $\pi_{0.5}$ 的动作专家中，通过均匀采样历史帧并进行交叉注意力特征调制，保留近期视觉和运动特征。
  3. 运行时决策：LLM Planner在步骤边界（由本体感觉确认）读取Ledger和当前帧，决定是输出带具体坐标的子目标（调用长期记忆），还是输出空子目标让策略自己用短期记忆执行。
- **关键细节**: 
  - 输入输出：输入多视角RGB、本体感觉、语言指令；输出动作块（action chunk）。
  - 系统架构：低层策略（$\pi_{0.5}$）负责底层控制，高层策略（Claude Sonnet 5）负责规划。
  - 关键超参：低层策略微调80k步，batch size 64；短期记忆保留32帧；子目标dropout概率在时间/程序任务设为0.9，空间/物体任务设为0.15。
- **训练/优化目标**: 
  - 低层策略：使用标准的Flow-matching损失函数。引入子目标dropout课程学习，强制策略在丢弃子目标时学会依赖内部短期记忆，在保留子目标时学会依赖外部坐标，确保两种模式在部署时都在数据分布内。
  - 高层策略：纯Prompting，无额外训练。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboMME（包含16个任务，分为Counting、Permanence、Reference、Imitation 4个记忆套件）。
  - 对比对象（baseline）：FrameSamp+Modul（纯策略内记忆）、MemER（分层策略）、Tracker-only（仅追踪无历史记录）、Oracle（完美子目标）、QwenVL（VLM生成子目标）。
- **评价指标**: 任务成功率（Success rate, %），每个任务跑50个episode，3个随机种子取平均。
- **主要结果**: 
  - Ledger在RoboMME上取得4套件平均最高成功率 64.3%，大幅领先最强baseline FrameSamp+Modul的 45.9%。
  - 在需要长期记忆的Permanence（86.7% vs 56.2%）和Reference（60.7% vs 40.3%）套件上优势巨大。
  - 在依赖短期记忆的Counting和Imitation套件上，Ledger通过运行时动态路由（选择空子目标），性能与专用的FrameSamp+Modul基本持平（66.8% vs 69.2%，43.0% vs 51.3%），证明了单一权重和运行时路由的有效性。

### 11. 🔥 [Gaze Prompts: Temporally Dense Human Attention for Vision-Language-Action Fine-Tuning] (凝视提示：用于视觉-语言-动作微调的时间密集型人类注意力)
- **研究机构**: `原文未提及具体高校名称，主要合作单位包括 LingYu Robotics（灵宇机器人）等`
- **Arxiv ID**: `2609.34550` | [点击跳转](https://arxiv.org/abs/2609.34550)

**0. 论文标题**
- **英文标题**: Gaze Prompts: Temporally Dense Human Attention for Vision-Language-Action Fine-Tuning
- **中文标题**: 凝视提示：用于视觉-语言-动作微调的时间密集型人类注意力
- **研究机构**: 原文未提及具体高校名称，主要合作单位包括 LingYu Robotics（灵宇机器人）等
- **一句话总结**: 利用 VR 遥操作时采集的人类眼动轨迹作为帧级视觉监督信号，通过渲染十字准星和训练轻量级预测器，在不改动 VLA 模型架构的前提下大幅提升双臂操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的微调，具体为根据文本指令和视觉输入生成机器人双臂操作动作。
- **研究动机**: VLA 微调时，动作监督是帧级的，但语言指令只是任务级的，缺乏帧级的视觉相关性指导。这导致模型容易走视觉捷径，语言驱动作用减弱。现有方法注入的空间线索多是工程构造或模型推导的，没有直接利用演示者真实的注意力。
- **本质改动**: 把 VR 遥操作时记录的人类眼动（gaze）作为时间密集的视觉提示，训练时直接渲染成十字准星贴在头相机图像上；部署时用一个轻量级预测器从图像和指令预测眼动位置并渲染准星。全程不改动策略网络架构，直接走现有的视觉通路。
- **技术溯源**: 基于 $\pi_0$ (PaliGemma VLM + 300M action expert) 基座模型，视觉和文本编码器使用冻结的 CLIP ViT-B/16。

**2. 技术拆解**
- **核心方法**: 系统包含三个独立训练的组件：1) 轻量级凝视预测器，从最近 3 帧头相机图像和语言指令预测当前视角的凝视热力图；2) 视觉提示渲染器，将凝视坐标渲染为头相机图像上的十字准星（腕部相机视图不变）；3) VLA 策略，在带有准星的图像上微调，部署时消费预测器生成的准星图像。
- **关键细节**: 
  - 预测器：约 2.9M 可训练参数。输入 N=3 帧 224x224 图像和指令。通过交叉注意力融合文本，2 层 Transformer 进行时间融合，最后上采样输出 224x224 热力图。推理时对峰值坐标做 soft-argmax 和因果 EMA 平滑。
  - 渲染：在头相机视图上绘制固定几何和颜色（青色）的十字准星，不携带任务特定的语义信息，仅提供空间位置线索。
- **训练/优化目标**: 
  - 预测器：逐帧交叉熵损失，目标为高斯平滑的真实凝视热力图（使用任务平衡采样器）。
  - 策略：标准的行为克隆（动作目标为原始演示动作），输入为渲染了真实（训练时）或预测（推理时）凝视准星的图像。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自建的 GazeMani 数据集（1200 条双臂遥操作轨迹，带同步眼动数据，约 6.4 小时）。
  - 任务：6 个真实世界双臂操作任务（如叠碗、按序叠方块、收拾桌子、叠毛巾、插卫生纸、接滚动的球）。
  - 机器人平台：TeleAvatar（灵宇机器人的双臂移动操作平台，使用 Pico 4 Enterprise VR 头显采集数据）。
  - 对比对象（baseline）：Vanilla $\pi_0$（无凝视信号），Aux-loss $\pi_0$（使用凝视作为辅助 KL 损失正则化注意力，仅在训练时可用）。
- **评价指标**: 任务成功率（Success rate，每个任务 50 次 rollout）。
- **主要结果**: 
  - 单任务微调下，Gaze-prompt $\pi_0$ 平均成功率从 Vanilla 的 26.3% 提升至 56.0%（+29.7%），全面优于 Aux-loss 的 33.3%。在需要精确接触或动态拦截的任务上提升最显著。
  - 多任务统一训练下，Gaze-prompt 的 pooled 成功率达 49.2%，远超 Vanilla 的 20.8% 和 Aux-loss 的 29.2%。
  - 机制分析：推理时移除准星会导致成功率从 72% 降至 58%，证明推理时视觉提示的有效性；指令交换实验表明凝视提示能显著增强策略对语言指令的注意力转移；在动态拦截任务中，预测人类凝视（52%）优于卡尔曼滤波预测未来位置（38%）和当前位置检测（12%），证明人类凝视具有提前预判未来任务相关位置的能力。

### 12. 🔥 [From World Models to World Action Models: Rethinking Next-State Prediction] (从世界模型到世界-动作模型：重新思考下一状态预测)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34414` | [点击跳转](https://arxiv.org/abs/2609.34414)

领域与类型判断：本文属于具身智能/机器人学习领域，是一篇**方法创新**工作。

**0. 论文标题**
- **英文标题**: From World Models to World Action Models: Rethinking Next-State Prediction
- **中文标题**: 从世界模型到世界-动作模型：重新思考下一状态预测
- **研究机构**: 原文未提及
- **一句话总结**: 提出 CF-WAM 框架，将世界-动作模型中固定的下一状态预测改为训练时动态采样多种状态投影（视觉、语义、几何、交互）进行监督，从而提升控制性能并有效利用非配对的人-机器人数据进行跨具身迁移。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（基于世界-动作模型预测未来状态并生成动作）。
- **研究动机**: 现有的世界-动作模型（WAMs）在训练前将下一状态固定为单一表示（如 RGB 或单一隐变量），限制了动作学习只能利用特定表示保留的归纳偏置。单一表示无法同时兼顾动作相关的视觉、语义、几何和交互信息；且在联合学习人和机器人数据时，固定的视觉表示容易被具身特有的外观差异主导，导致迁移困难。而静态组合多种目标又会增加计算量，并导致不同模态特征竞争有限的注意力容量。
- **本质改动**: 将下一状态的表示从“训练前固定的单一模态”转变为“训练时动态采样的同一未来流形的多种投影”，用统一的生成模型学习不同坐标系下的状态转移，固定的是动力学模型，而不是描述未来的坐标系。
- **技术溯源**: 基于 Mixture-of-Transformers (MoT) 架构、预训练的视频扩散 Transformer (Video Diffusion Transformer)、Flow-matching (流匹配)、VAE 以及 DINOv3。

**2. 技术拆解**
- **核心方法**: 提出 Confluent Foresight WAM (CF-WAM)。核心是动态下一状态预测框架：在训练时，对同一个未来状态流形，随机采样视觉、语义、几何或交互四种投影之一作为监督目标，统一转化为视频形式，通过拼接投影特定的条件 token 让统一的 WAM 进行预测。同时支持非配对的人-机器人数据联合训练，将动作空间解耦为跨具身的末端执行器 (EE) 空间和机器人特定的关节空间，利用掩码机制处理人类数据缺失的关节维度。
- **关键细节**: 
  - 模型结构：采用 MoT 架构，包含独立参数化的世界专家（World expert）和动作专家（Action expert），通过非对称掩码进行混合注意力计算以交换信息。
  - 输入输出：输入当前 RGB 观察、语言指令和投影条件；输出 VAE 编码后的未来状态隐变量和动作轨迹。
  - 四种投影：RGB 视频（视觉）、DINOv3 语义视频（语义）、深度视频（几何）、手-物体分割视频（交互）。所有投影的首帧均严格对齐为当前 RGB 帧。
- **训练/优化目标**: 动态生成学习目标。每个训练步采样一个投影 $k$ 和数据来源 $d$（人或机器人），使用 Flow-matching 损失分别优化世界预测（VAE 隐空间的速度预测）和动作生成（动作空间的速度预测）。通过源相关的动作掩码矩阵区分人类和机器人数据的动作损失，人类数据仅监督 EE 空间，机器人数据监督 EE 和关节空间。

**3. 实验结果**
- **实验设置**: 
  - 数据集：仿真基准 RoboCasa-GR1（24 个人形机器人桌面操作任务），OOD 泛化测试集 LIBERO-Plus，真实机器人数据集（6 个操作任务），人类经验数据集 EgoDex（pick-and-place 子集）。
  - 对比对象（baseline）：RoboCasa-GR1 上对比 CoRE-VLA, WALA, FastWAM 等 9 个方法；LIBERO-Plus 上对比 GWM-VLA, FoMoVLA, GaussianWAM 等；真实世界对比 $\pi_{0.5}$, GR00T-N1.6, FastWAM, LingBot-VA。
  - 硬件环境：RoboCasa-GR1 训练使用 4 节点共 32 张 NVIDIA B200 GPU，100K steps；LIBERO 训练使用单节点 8 张 B200 GPU，80K steps。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - RoboCasa-GR1：平均成功率 82.50%，比最强 baseline WALA (75.17%) 高 7.33 个百分点；在新颖 pick-and-place 任务上达 85.00%（超 WALA 11.55 个百分点）。
  - 消融实验：动态状态监督（79.00%）显著优于静态多状态联合预测（68.75%）和单一状态（最高 76.25%）。加入非配对人类数据后进一步提升至 82.50%。
  - LIBERO-Plus：平均成功率 82.65%，超越 FoMoVLA (80.50%) 和 GaussianWAM (77.30%)。
  - 真实世界：Interaction 投影平均成功率达 84.00%，全面超越 $\pi_{0.5}$ (62.33%) 等 baseline；若为每个任务选择最佳投影（Oracle），平均可达 87.00%。

### 13. 🔥 [RoboIRGBench: Benchmarking Implicit Referential Grounding in Vision-Language-Action Models] (RoboIRGBench：视觉-语言-动作模型中隐式指代接地的基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34384` | [点击跳转](https://arxiv.org/abs/2609.34384)

**0. 论文标题**
- **英文标题**: RoboIRGBench: Benchmarking Implicit Referential Grounding in Vision-Language-Action Models
- **中文标题**: RoboIRGBench：视觉-语言-动作模型中隐式指代接地的基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出了 RoboIRG-Bench，通过构建隐式指代指令来评估 VLA 模型在机器人操作中的上下文理解与目标接地能力，揭示了现有模型在隐式指代下存在显著的鲁棒性缺陷。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作（VLA）模型在机器人操作任务中解析隐式指代（Implicit Referential Grounding, IRG）的能力，即从语言或视觉上下文中恢复未显式指明的任务目标。
- **研究动机**: 现有的机器人操作 benchmark 大多假设指令是显式的，这不符合人类自然交互中频繁使用代词或隐式表达（如“把它放那”、“那个红色的”）的习惯。模型在显式指令下表现好，不代表能处理需要上下文推理的隐式指代。
- **本质改动**: 构建了一个新的 benchmark，在保持底层操作目标不变的前提下，将显式指令系统性地改写为隐式指代，从而隔离并量化评估模型从上下文中恢复目标实体的能力。
- **技术溯源**: 基准测试基于 RoboMME 构建；评估的 VLA 模型基座主要为 $\pi_{0.5}$，并对比了 MemER 以及结合了外部 VLM（如 Qwen-VL, Gemini 3.1 Pro）的变体。

**2. 技术拆解**
- **核心方法**: 构建 RoboIRG-Bench，设计了四种隐式指代接地挑战：直接指代（Direct，恢复前文提到的目标）、推理中介指代（Reasoning-Mediated，通过颜色排除、数量推导等逻辑推理目标）、空间指代（Spatial，依赖空间地标接地）和上下文指代（Contextual，在长上下文和干扰信息中恢复目标）。
- **关键细节**: 包含从 RoboMME 的 11 个操作任务中衍生出的 40 个任务变体，分为三个难度级别。使用基于规则的指令模板生成隐式表达。真实世界实验使用 Franka Research 3 机械臂，配备 Intel RealSense 435IF 相机。
- **训练/优化目标**: 本文为基准测试与评估工作，无特定训练目标。核心机制是通过控制变量法，保持操作目标和上下文不变，仅改变目标信息的表达方式（显式 vs. 隐式），以评估模型的指代解析能力。

**3. 实验结果**
- **实验设置**: 数据集为 RoboIRG-Bench。对比的 baseline 包括 vanilla $\pi_{0.5}$、MemER，以及基于 $\pi_{0.5}$ 构建的 GroundSG-QwenVL、FrameS-Modul 和 TTT-Expert。真实世界实验在 Franka Research 3 机械臂上进行，测试 PutInBox 和 PickByCount 任务。
- **评价指标**: 任务成功率（Success Rate, SR）。
- **主要结果**: 
  1. 存在显著的“指代鲁棒性差距”：在显式指令下表现优异的模型（如 FrameS-Modul），在隐式指代下成功率大幅下降。
  2. 推理中介指代（Reasoning-Mediated）对所有模型来说都是最困难的挑战。
  3. 具有外部 VLM 或显式记忆机制的模型（如 GroundSG-QwenVL, MemER）在隐式指代下表现相对更好，说明显式的中间语言推理有助于隐式指代接地，但仍有明显失败。
  4. 将外部 VLM 替换为更强的 Gemini 3.1 Pro 能提升性能，但无法消除指代鲁棒性差距，尤其是空间指代依然极具挑战。
  5. 真实世界实验证实了该差距在物理执行中依然存在，失败原因包括错误的目标接地和下游执行错误。

### 14. 🔥 [FutureDuet: Decoupling Observation Access from Future Supervision in World Action Models] (FutureDuet：在世界动作模型中解耦观测访问与未来监督)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34362` | [点击跳转](https://arxiv.org/abs/2609.34362)

**0. 论文标题**
- **英文标题**: FutureDuet: Decoupling Observation Access from Future Supervision in World Action Models
- **中文标题**: FutureDuet：在世界动作模型中解耦观测访问与未来监督
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FutureDuet，通过为主相机和腕部相机分别设计不同的未来视觉预测目标（主相机预测RGB/掩码/骨架，腕部相机预测隐变量），在推理零开销的前提下显著提升了机器人策略在复杂交互任务中的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人动作生成（属于视觉-语言-动作策略/世界动作模型领域的方法创新）。具体为根据语言指令、本体感觉和双视角（主相机+腕部相机）历史图像，生成机器人动作序列。
- **研究动机**: 现有世界动作模型（WAMs）通常将主相机和腕部相机的观测融合到一个视觉流中，并强制使用相同的“未来视频预测”目标进行训练。但这两个相机的物理动态完全不同：主相机视角稳定，反映场景级的任务演变；腕部相机随末端执行器移动，混合了局部交互变化和剧烈的视角偏移/自遮挡。用同一个预测目标强行拟合两者，无法兼顾各自的信息特性。
- **本质改动**: 解耦了“观测访问”与“未来监督”。不再把双视角画面拼在一起用同一个目标去训练，而是保留双视角用于动作生成，但为两个视觉流分别定制不同的未来预测任务（主视角侧重场景与结构，腕部视角侧重局部隐式交互）。
- **技术溯源**: 基于世界动作模型（WAMs）框架，具体基座包括 VideoDiT 和 ActionDiT，并引入了 V-JEPA 2.1（用于腕部隐变量提取）和 SAM 3（用于生成掩码目标）。

**2. 技术拆解**
- **核心方法**: 
  1. **主视角流（Task State）**：使用未来 RGB 预测（基于 Flow Matching）建模场景演变，并引入交互掩码（interaction masks）和机器人骨架（robot skeletons）作为辅助监督，迫使特征聚焦于任务对象和机器人运动。
  2. **腕部视角流（Interaction State）**：使用未来隐变量预测（基于冻结的 V-JEPA 2.1 提取目标）建模短视距交互变化，避免像素级重建带来的视角偏移和自遮挡干扰。
  3. **动作生成**：通过 Duet Interface 融合两个状态，输入 ActionDiT 结合主视角 K/V 特征生成动作。所有辅助预测模块仅在训练时存在，推理时直接剪枝。
- **关键细节**: 
  - **输入输出**：输入为语言指令、本体感觉、主/腕部相机历史帧；输出为动作块（action chunk）。
  - **模型结构**：VideoDiT 提取主视角特征，轻量级在线编码器提取腕部特征。使用 Learned-query adapters 将特征压缩为 Task State 和 Interaction State。
  - **规模/超参**：模型具体参数量原文未提及；推理延迟保持在约 200ms。
- **训练/优化目标**: 
  联合优化多项损失：动作生成损失（Flow matching）、主视角 RGB 预测损失（Flow matching）、掩码预测损失（focal-Tversky）、骨架预测损失（focal-Dice）、腕部隐变量预测损失（MAE）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboTwin 2.0（RoboTwin50，50个双臂任务，含 clean 和 randomized 设置），LIBERO（4个单臂任务套件）。
  - **对比对象（Baseline）**：$\pi_0$, GR00T-N1, $\pi_{0.5}$, OpenVLA-OFT, Motus, Fast-WAM, MaskWAM, LingBot-VA, X-WAM, UWM 等。
- **评价指标**: 任务成功率（Success Rate, SR, %）。
- **主要结果**: 
  - 在 LIBERO 上平均成功率达 99.2%，在多个子集上取得最优。
  - 在 RoboTwin50 上，Clean 和 Randomized 设置下成功率分别为 94.2% 和 94.1%，比 Fast-WAM 整体提升 2.3%。
  - 在 6 个需要精确交互的困难任务上提升最显著，比 Fast-WAM 分别提升 9.2%（Clean）和 12.8%（Randomized）。
  - 消融实验证明：分离腕部通路比统一通路提升明显（+13.9%）；腕部使用隐变量预测优于 RGB 预测；主视角加入掩码和骨架监督能互补提升注意力聚焦和最终成功率。且所有改进在推理时零开销。

### 15. 🔥 [WAM-OPD: Sharpening World Action Models via On-Policy Distillation] (通过在线策略蒸馏锐化世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34250` | [点击跳转](https://arxiv.org/abs/2609.34250)

**0. 论文标题**
- **英文标题**: WAM-OPD: Sharpening World Action Models via On-Policy Distillation
- **中文标题**: 通过在线策略蒸馏锐化世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 WAM-OPD 框架，通过引入前缀加权轨迹回放（PWTR）机制，在不增加额外环境交互的前提下，利用在线策略蒸馏提升预训练世界动作模型在特定任务上的表现，同时有效避免灾难性遗忘。

**1. 整体逻辑**
- **研究任务**: 提升预训练世界动作模型（WAMs）在特定机器人操作任务上的执行成功率，同时保留其在其他未训练任务上的通用操作技能。
- **研究动机**: 现有的监督微调（SFT）和强化学习（RL）在提升目标任务性能时容易导致预训练技能遗忘；而在线 RL 或直接的在线策略蒸馏（Online OPD）需要频繁进行环境交互（rollouts）来收集新数据，在真实机器人上成本高昂且难以实现。
- **本质改动**: 将大模型领域的在线策略蒸馏（OPD）引入闭环机器人控制，并设计了前缀加权轨迹回放（PWTR）机制。通过复用固定的历史轨迹池，并利用基于前缀兼容性的代理重要性权重来补偿策略更新带来的观察历史分布偏移，从而免除了蒸馏阶段的环境交互。
- **技术溯源**: 基于预训练的世界动作模型（World Action Models, WAMs），具体基座为 Fast-WAM；技术路线借鉴了扩散/流匹配模型中的在线策略蒸馏（如 Flow-OPD）以及离线强化学习中的重要性采样（如 V-trace）。

**2. 技术拆解**
- **核心方法**: WAM-OPD 框架，核心是前缀加权轨迹回放（PWTR）。在蒸馏时，构建一个由“初始学生轨迹”和“任务教师轨迹”组成的固定轨迹池。学生模型基于池中的历史观察生成新的去噪路径，冻结的教师模型在这些路径上提供密集的速度监督。为了解决固定历史与当前学生策略诱导分布（induced distribution）之间的分布偏移，PWTR 计算前缀分数（对比学生快照、初始学生和教师在历史决策点上的去噪路径兼容性），生成代理重要性权重来重新加权每个决策点的蒸馏损失。
- **关键细节**: 
  - 输入输出：输入为观察历史（observation histories），输出为动作块（action chunks）。模型预测速度场（velocity fields）。
  - 模型结构：基于 Fast-WAM，优化所有 MoT（Mixture of Transformers）参数。
  - 规模与超参：学习率 1e-6，AdamW 优化器，96 步更新。去噪步数 10，预测 horizon 32，执行最多 24 步。时间子采样 n=16。
- **训练/优化目标**: 速度匹配损失（Velocity-matching objective）。计算当前学生速度场与冻结教师速度场在低噪声查询状态下的均方误差（MSE），并使用 PWTR 计算的前缀权重（prefix weights）对每个决策点的损失进行加权平均。视频分支无直接蒸馏损失。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：RoboTwin 2.0。目标任务：Stapler 和 Microwave。保留任务（评估遗忘）：Switch, Mug, Laptop, Pillbottle, Dual Bottles, Handover。
  - 真实环境：双臂 UR5e 机器人平台。目标任务：Corn, Block, Button。
  - Baselines：Initial student, 两个 Task-specific SFT teachers, $\pi$ RL, STEAM, 以及需要额外环境交互的 Online OPD。
- **评价指标**: 任务成功率（Success rates），分为目标任务平均成功率和保留任务平均成功率。
- **主要结果**: 
  - 仿真中：WAM-OPD 将目标任务平均成功率从 56.50% 提升至 69.75%（+13.25%），保留任务平均成功率维持在 86.92%（仅下降 0.25%）。性能媲美需要额外环境交互的 Online OPD（70.25%），且远优于会导致严重遗忘的 SFT 和 RL 基线。
  - 消融实验：混合轨迹池（Mixed Pool）结合前缀加权效果最佳（69.75%），打乱权重对应关系（M-Shuffle）会导致性能下降至 65.50%，证明了历史-权重对应关系的关键作用。
  - 真实机器人：在 Corn, Block, Button 三个任务上均提升了基础学生的成功率，且整个蒸馏过程无需额外的机器人物理交互。

### 16. 🔥 [WB-WAM: Heterogeneous Body-Hand Pre-training for Humanoid Loco-Manipulation] (WB-WAM：面向人形机器人移动操作的异构身体-手部预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34199` | [点击跳转](https://arxiv.org/abs/2609.34199)

**0. 论文标题**
- **英文标题**: WB-WAM: Heterogeneous Body-Hand Pre-training for Humanoid Loco-Manipulation
- **中文标题**: WB-WAM：面向人形机器人移动操作的异构身体-手部预训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出WB-WAM模型，通过构建72维共享物理动作空间，将显式全身动作监督引入生成式视频预训练，并结合人类动作中间训练，大幅降低真机数据需求，实现高效的人形机器人移动操作。

**1. 整体逻辑**
- **研究任务**: 人形机器人的移动操作（loco-manipulation），即需要底盘移动、躯干姿态调整与灵巧手操作协同的全身控制任务。
- **研究动机**: 现有机器人预训练数据多针对单/双臂或轮式底盘，缺乏对人形全身协同动作的直接监督；同时，大规模视频数据缺动作标签，而运动捕捉数据缺视频，如何低成本利用这些互补的异构数据来训练人形机器人是个痛点。
- **本质改动**: 设计了一个72维的共享物理动作空间（涵盖身体关节、根节点和灵巧手），在World Action Model (WAM) 的生成式视频预训练中直接加入显式的全身动作监督，并通过掩码机制兼容部分标注的异构数据。
- **技术溯源**: 基于 Fast-WAM（多模态流匹配框架）、Wan2.2（视频生成基座）、SONIC（全身控制器/编码器）、MINT（手部关键点重建）和 GMR（通用运动重定向）。

**2. 技术拆解**
- **核心方法**: 提出三阶段训练范式：
  1. 异构预训练 (Stage I)：在1880.2小时的异构视频和运动数据上，联合训练视频和动作专家。利用二进制掩码处理缺失的动作标签，实现视频与动作的联合流匹配。
  2. PICO中间训练 (Stage II)：使用22小时的第一人称人类演示（PICO采集）进行中间训练，将人类动作重定向到共享物理空间，提供运动学监督。
  3. 真机后训练 (Stage III)：针对具体任务，使用少量真机遥操作数据微调，并引入可微正向运动学（FK）损失约束身体几何。
- **关键细节**: 
  - 动作空间：72维向量（29维G1身体关节 + 3维根节点角速度 + 20维左手 + 20维右手）。
  - 模型结构：Mixture-of-Transformers (MoT) 骨干，包含视频专家和动作专家。视频专家由Wan2.2初始化，动作专家为降维的DiT。
  - 部署架构：模型预测32步动作块，前20步以20Hz执行。身体和根节点参考通过冻结的SONIC编码器转为64维控制隐变量，手部参考直接下发关节指令。
- **训练/优化目标**: 
  - Stage I & II：视频与动作的联合流匹配损失（Flow matching loss），通过掩码对未标注和填充维度分配零目标速度。
  - Stage III：联合流匹配损失 + 辅助的可微正向运动学（FK）损失（惩罚骨盆坐标系下特定连杆的位置和朝向误差）。

**3. 实验结果**
- **实验设置**: 
  - 仿真：HumanoidArena 基准（7个任务），对比各任务历史最强baseline。
  - 真机：Unitree G1 + Wuji灵巧手。5个日常任务（擦桌子、关窗帘、整理床、移动枕头、整理衣服），对比 ACT, π0.5, GR00T N1.6, Fast-WAM, DiT4DiT, OpenWAM，每个任务约100条真机演示。
  - 数据效率：4个任务，对比直接后训练（30/100条数据）与加入PICO中间训练（30条数据）。
- **评价指标**: 成功率（Success Rate, SR）和任务进度（Task Progress, TP，包含接近、接触、移动等里程碑的平均完成率）。
- **主要结果**: 
  - 仿真：在HumanoidArena上平均成功率达81.9%，全面超越所有7个任务的最佳baseline（如ACT的45.5%、π0.5的51.2%等）。
  - 真机（5个任务）：平均成功率84.0%，平均TP 86.67%，超越最强baseline OpenWAM（80.0% SR, 82% TP）。
  - 数据效率：使用PICO中间训练+30条真机数据，平均成功率达73.8%，显著超越直接使用100条真机数据微调的65.0%（同等30条数据直接微调仅48.8%），减少了70%的真机数据需求。
  - 扩展能力：验证了基于语言指令的目标选择（挑水果）和未见视觉条件下的泛化能力。

### 17. 🔥 [Unified Visual-Tactile-Action Modeling from Human Demonstrations for Dexterous Manipulation] (基于人类演示的统一视觉-触觉-动作建模用于灵巧操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34182` | [点击跳转](https://arxiv.org/abs/2609.34182)

**0. 论文标题**
- **英文标题**: Unified Visual-Tactile-Action Modeling from Human Demonstrations for Dexterous Manipulation
- **中文标题**: 基于人类演示的统一视觉-触觉-动作建模用于灵巧操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种跨具身的统一视觉-触觉-动作模型，通过穿戴式动捕系统收集人类触觉数据来监督接触感知表征学习，从而利用海量人类演示显著提升机器人接触密集型灵巧操作的成功率。

**1. 整体逻辑**
- **研究任务**: 解决接触密集型灵巧操作（contact-rich dexterous manipulation）中机器人触觉数据难以规模化收集的瓶颈，利用人类触觉演示数据提升机器人策略性能。
- **研究动机**: 机器人灵巧手遥操作收集触觉数据成本高、难扩展，且操作者缺乏触觉反馈；人类演示数据易扩展且包含丰富的物理交互模式。但人手与机器人在形态和动作空间上存在具身鸿沟，且纯视觉无法捕捉局部接触动力学（如接触 onset、压力、形变和滑动）。
- **本质改动**: 核心前提是“手可以变，但交互的底层物理规律不变”。通过构建统一模型将人类和机器人轨迹映射到对齐的触觉和动作表征空间，利用人类数据监督接触感知表征的学习，而在部署时仅执行机器人动作预测。
- **技术溯源**: 基于 Transformer (ViT-S/8) 进行视觉编码，结合 Diffusion Policy (1-D U-Net) 进行动作生成，以及 MLP 进行触觉轨迹回归。

**2. 技术拆解**
- **核心方法**: 
  1. 构建穿戴式触觉动捕系统（包含 FSR 触觉传感器、VIVE Tracker 和腕部相机），同步采集人类视觉、触觉和手部运动数据。
  2. 提出统一视觉-触觉-动作模型（UVTA），通过 VTPM（Visual-Tactile-to-Piezoresistive Taxel Mapping）将异构触觉信号对齐为统一的 20 维压阻触觉 token。
  3. 采用联合训练目标，同时预测未来动作序列和未来触觉轨迹，让人类数据参与共享表征的学习。
- **关键细节**: 
  - **输入输出**：输入为 224x224 腕部 RGB 图像和 20 维触觉 token，拼接为 404 维交互表征。输出为 16 步的动作 chunk（31维：9维相对腕部位姿 + 22维绝对手指关节角）和 16 步的未来触觉轨迹（20维）。
  - **模型结构**：视觉编码器为从头训练的 ViT-S/8（输出 384 维）；动作头为 FiLM 条件化的 1-D U-Net（通道 256/512/1024）；触觉头为两层 MLP（404->512->320）。
  - **推理部署**：使用 DDIM 进行 16 步反向采样，实际执行前 8 步动作，随后重新获取视觉-触觉反馈进行重规划。
- **训练/优化目标**: 
  - 联合损失函数：$\mathcal{L} = \mathcal{L}_{action} + \lambda \mathcal{L}_{tactile}$（$\lambda=0.2$）。
  - **动作损失** $\mathcal{L}_{action}$：Diffusion 的 MSE 损失。对腕部（9维）和手部（22维）误差分别求均值后等权相加，防止手部维度主导优化。
  - **触觉损失** $\mathcal{L}_{tactile}$：未来 16 步触觉轨迹的 MSE 回归损失。该损失通过共享视觉编码器更新表征，但不参与动作生成的迭代去噪过程。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 UVTA 数据集，包含 5 个接触密集型任务（翻书、拧灯泡、拨开关、球体分类、滴管液体转移），每个任务 1000 条人类演示和 150 条机器人遥操作演示。
  - **硬件平台**：固定基座的 North 机器人，配备两个 22-DoF Sharpa Wave 灵巧手。
  - **对比基线**：ViTacFormer, RDP (Reactive Diffusion Policy), T-Rex。
- **评价指标**: 阶段性成功率（Stage-wise success rate）。每个任务 10 次真实机器人 rollout，根据达成的里程碑（如翻书任务中分离书页 0.3，翻多页 0.7，精准翻一页 1.0）计算得分，而非简单的 0/1 二元成功率。
- **主要结果**: 
  - 本文方法在 5 个任务上的平均阶段性成功率达到 70%，显著优于最强视觉-触觉基线 T-Rex（29%）和消融模型（42%）。
  - 在拨开关（88% vs 24%）和拧灯泡（80% vs 26%）等高度依赖接触事件的任务上提升尤为明显。
  - 数据缩放实验表明，在固定 150 条机器人数据的情况下，随着人类数据从 0 增加到 1000 条，平均成功率从 0% 单调上升至 84%，且未见饱和趋势。
  - 消融实验证明，去掉未来触觉预测头会导致成功率从 70% 降至 42%，证明触觉预测对学习物理交互后果至关重要。

### 18. 🔥 [FailPatch: Failure Residual Patching for Vision-Language-Action Models] (FailPatch：用于视觉-语言-动作模型的失败残差补丁)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34175` | [点击跳转](https://arxiv.org/abs/2609.34175)

**0. 论文标题**
- **英文标题**: FailPatch: Failure Residual Patching for Vision-Language-Action Models
- **中文标题**: FailPatch：用于视觉-语言-动作模型的失败残差补丁
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FailPatch 框架，在冻结的 VLA 策略动作隐藏空间插入轻量级残差专家库，通过解耦动作监督与执行可靠性监督，利用少量部署失败轨迹以极低的参数成本大幅提升机器人策略的部署鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的部署鲁棒性，特别是解决长视野任务中因误差累积导致策略进入未知/失败状态的问题。
- **研究动机**: 现有的 VLA 策略通常只用成功演示进行监督微调（SFT），无法覆盖部署时容易出错的偏离状态。而基于部署经验的强化学习（RL）方法需要奖励估计、反复的环境交互或人工纠正，成本高昂。现有的处理失败的方法要么依赖运行时的故障检测/恢复模块，要么需要失败轨迹的纠正动作标注，难以在缺乏纠正标签时高效利用失败经验。
- **本质改动**: 将“动作监督”与“执行可靠性监督”解耦。用成功演示来学习“怎么修正（可执行的残差补丁）”，用部署失败轨迹来指示“何时修正（保留原策略还是应用补丁）”，直接在冻结 VLA 的动作隐藏空间进行轻量级残差干预。
- **技术溯源**: 基于预训练的视觉-语言-动作模型 $\pi_{0.5}$（OpenPI 实现），以及离线视觉-语言模型（GPT-5.5）进行轨迹的故障起点标注。

**2. 技术拆解**
- **核心方法**: 提出 FailPatch 框架。在冻结的 VLA 主干和动作头之间插入一个“空门控残差专家库（Null-gated Residual Expert Bank, REB）”。包含一个 Null 专家（保持原表示）和 K 个残差专家（生成残差补丁）。通过离线 VLM 对部署轨迹进行分块级别的可靠性标注和故障起点定位，构建局部成功原型，从而指导残差补丁的学习和路由。
- **关键细节**: 
  - **输入输出与干预位置**：输入视觉观测和语言指令，输出连续动作。干预发生在动作隐藏表示空间（action hidden space，维度 1024，经 mean-pooling 得到 chunk 级表示），该空间既编码了执行可靠性，又直接决定后续动作。
  - **模型结构**：REB 包含 1 个无参数的 Null 专家和 8 个 SwiGLU 瓶颈 MLP 残差专家（瓶颈宽度 704）。推理时使用稀疏 Top-1 路由。
  - **规模与超参**：可训练参数仅 17.3M（占 VLA 的 0.52%）。K_nn=20 个最近邻用于构建局部成功原型。
- **训练/优化目标**: 统一的 Preserve–Redirect–Trust 目标函数，分离了补丁学习与干预监督：
  1. **Demonstration（动作监督）**：用成功演示计算候选动作损失，训练残差专家使其具备可执行动作语义；同时训练路由器。
  2. **Preserve（保留）**：对可靠状态（成功轨迹和失败轨迹的故障前部分），惩罚残差能量，强制路由到 Null 专家，保持原策略不被破坏。
  3. **Redirect（重定向）**：对故障关联状态（故障起点及之后），计算候选补丁向“局部成功原型”靠近的效用，引导路由器选择能减小与成功原型距离的专家，并施加最小进度约束。
  4. **Trust（信任）**：限制补丁的幅度（L2 正则），防止隐藏空间偏移过大导致动作失控。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：仿真环境使用 RoboTwin 的 4 个长视野任务（Blocks Ranking, Stack Bowls, Put Object Cabinet, Place Bread Basket）；真实世界使用双机械臂平台的 3 个任务（Blocks Ranking, Stack Bowls, Fold Dishcloth）。
  - **对比对象（baseline）**：50-Task Base（原始预训练模型）, LoRA SFT, Full SFT, Demo-Only REB, Outcome-Prompt SFT (Episode/Chunk), PPO（强化学习）。
  - **基座模型**：$\pi_{0.5}$。
- **评价指标**: 任务成功率（Success rates, %），包括干净环境评估（clean evaluation）和干净到随机环境的泛化评估（clean-to-random generalization）。
- **主要结果**: 
  - **仿真干净评估**：FailPatch 平均成功率从基线的 49.50% 提升至 60.50%（绝对提升 11.0 个百分点），全面优于所有 SFT 和 PPO baseline。
  - **仿真泛化评估**：在 clean-to-random 设置下，平均成功率达到 37.50%，比基线提升 9.5 个百分点。
  - **真实世界实验**：平均成功率从 41.1% 提升至 57.8%（绝对提升 16.7 个百分点），在刚性物体、接触丰富和可变形物体任务上均有显著改善。
  - **效率优势**：仅训练 0.52% 的参数（17.3M），训练时间约 3 小时（4 张 H20 GPU）。相比 PPO，参数量少 40.1 倍，训练快 6 倍，且无需在线环境交互。

### 19. 🔥 [RAVEL: Asynchronous Rolling Inference for Flow-Based Vision-Language-Action Models] (RAVEL：面向基于流匹配的视觉-语言-动作模型的异步滚动推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34170` | [点击跳转](https://arxiv.org/abs/2609.34170)

**0. 论文标题**
- **英文标题**: RAVEL: Asynchronous Rolling Inference for Flow-Based Vision-Language-Action Models
- **中文标题**: RAVEL：面向基于流匹配的视觉-语言-动作模型的异步滚动推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RAVEL 异步推理框架，通过解耦 VLM 编码与动作生成、引入滚动动作缓冲区和快速观察路径，大幅降低了基于 Flow 的 VLA 模型的推理延迟，提升了机器人在动态环境下的响应速度和控制平滑度。

**1. 整体逻辑**
- **研究任务**: 降低基于流匹配（Flow-based）的视觉-语言-动作（VLA）模型在机器人控制中的推理延迟，提升动态环境下的实时响应与闭环控制能力。
- **研究动机**: 现有 Flow-based VLA 模型（如 $\pi_{0.5}$、X-VLA）依赖昂贵的 VLM 编码和多步迭代去噪来生成动作，导致推理延迟极高。在动态环境中，高延迟使机器人无法及时响应；且传统同步推理会导致机器人在动作块（action chunk）执行间停顿，而简单的异步推理又会导致动作块切换时出现状态不连续。
- **本质改动**: 将 VLM 编码与动作生成解耦为异步双线程，并设计滚动动作缓冲区（Rolling Buffer），让近期动作只需单步去噪即可执行；同时引入时间偏移条件（Temporal-offset conditioning）和轻量级快速观察路径（FOP）来补偿计算延迟并保持对最新视觉反馈的响应。
- **技术溯源**: 基于预训练的 Flow-based VLA 模型（如 $\pi_{0.5}$、X-VLA、DynamicVLA）。

**2. 技术拆解**
- **核心方法**: 
  1. 异步滚动去噪（Offset-Aware Rolling Flow Denoising）：维护一个长度为 K 的滚动动作缓冲区，每个控制步对缓冲区整体进行一次去噪，释放首个动作并追加新的噪声动作，使近期动作仅需单步去噪即可执行。引入归一化时间偏移作为条件信号，让模型感知 VLM 上下文的“年龄”（即延迟步数）。
  2. 异步上下文更新与快速观察路径（FOP）：VLM 编码与动作生成异步运行，动作专家使用最新可用的 VLM 上下文持续去噪。FOP 使用轻量级图像编码器提取当前视觉和本体感觉特征，通过门控交叉注意力直接注入动作专家，无需等待 VLM 编码完成即可响应最新观察。
  3. 流式对齐训练（Streaming-Aligned Training）：在训练时模拟推理时的噪声分布和时间偏移，训练动作专家根据给定的 VLM 上下文和时间偏移，生成对应控制步的动作。
- **关键细节**: 
  - 缓冲区长度 K=10，每个槽位包含 h 个底层动作。
  - 时间偏移 $\delta_p = p/K$，其中 p 是观察采集到动作执行的控制步延迟。
  - FOP 包含 ConvNeXt-Base 图像编码器、视觉/状态投影层以及门控交叉注意力适配器。
  - 训练时冻结 VLM 骨干网络，仅微调动作专家及相关投影层。对于相对动作（如相对关节角），在缓冲区内存储归一化的绝对目标，在每次更新前转换为相对动作，以保证滚动更新时的坐标一致性。
- **训练/优化目标**: 流匹配（Flow-matching）损失函数。优化目标是让动作专家预测每个槽位的流速（velocity），使其与目标动作和初始噪声的差值最小化（L2 损失）。

**3. 实验结果**
- **实验设置**: 
  - 同步仿真：LIBERO 和 RoboTwin 2.0 数据集，对比基线为同步推理的 $\pi_{0.5}$ 和 X-VLA。
  - 异步仿真：Dynamic Object Manipulation (DOM) 基准，对比基线为 DynamicVLA (Sync)、CI & LAAS、VLASH 和 FASTER。
  - 真实世界：乒乓球回击和网球抓取任务（使用 xArm7 机器人），对比基线为 Sync、Naive Async、RTC、VLASH 和 FASTER。
- **评价指标**: 
  - 仿真：任务成功率、首动作延迟（First-action latency）、平均任务完成时间。
  - 真实世界：任务成功率、观察年龄（Observation age，即图像接收至动作下发的延迟，看 P50 和 P95）、高频残差功率（$E_{HF}$，衡量轨迹振荡）、TCP 加加速度均方根（TCP jerk RMS，衡量运动平滑度）。
- **主要结果**: 
  - 同步仿真：RAVEL 保持了基线 VLA 的任务成功率（相当或略高）。首动作延迟大幅降低，X-VLA 加速 2.59 倍（142.58ms 降至 54.97ms），$\pi_{0.5}$ 加速 2.92 倍（272.86ms 降至 93.45ms）。
  - 异步仿真 (DOM)：RAVEL 整体成功率达 44.06%（比 CI & LAAS 高 8.56%），加入 FOP 后提升至 46.94%。平均任务完成时间缩短至 6.04 秒，比 DynamicVLA 减少 23.0%。
  - 真实世界：乒乓球回击成功率达 90%（FASTER/VLASH 仅为 25%），中位观察年龄降至 121.76ms（P95 为 132.20ms），均为最优。网球抓取成功率与基线相当（45%），但轨迹高频振荡（$E_{HF}$）和加加速度（jerk RMS）最低，运动最平滑。

### 20. 🔥 [Quantile Head for Vision-Language-Action Models] (面向视觉-语言-动作模型的分位数动作头)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34061` | [点击跳转](https://arxiv.org/abs/2609.34061)

**0. 论文标题**
- **英文标题**: Quantile Head for Vision-Language-Action Models
- **中文标题**: 面向视觉-语言-动作模型的分位数动作头
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种分位数动作头，通过单次前向传播预测中位数和正间隙来构建有序动作分位数，在保持回归模型单次推理速度的同时实现了动作分布建模，在LIBERO及真机任务上取得SOTA性能。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型中的机器人控制，即根据视觉观察和语言指令生成机器人动作序列。
- **研究动机**: 现有的动作头（Action heads）存在两难：点回归（Point regression）只能输出点估计，无法显式表示条件动作分布；流匹配（Flow matching）能建模分布，但需要多次迭代采样和模型评估，推理成本高昂。
- **本质改动**: 将回归和流匹配统一到一个共享目标下并推导出分位数目标。设计了一个分位数头，在单次前向传播中直接预测中位数和正间隙，生成有序的边缘动作分位数，从而兼顾单次推理的速度与分布建模的能力。
- **技术溯源**: 基于预训练的视觉-语言模型（VLM），具体实现基于 $\pi_{0.5}$ 架构，冻结 VLM 并使用 SigLIP 提取视觉特征。

**2. 技术拆解**
- **核心方法**: 理论上，证明积分 pinball loss 等价于 CDF 监督，且联合分位数监督能降低中位数更新的方差。架构上，在冻结的 VLM 后插入可学习 prompt 提取上下文，动作专家（Action expert）输出特征后，通过两个线性投影分别预测中位数和原始间隙。将原始间隙通过 softplus 映射为正间隙，累积加减到中位数上，生成 $K=21$ 个有序分位数。
- **关键细节**: 输入包含 SigLIP 图像嵌入、任务文本嵌入和离散化（256 bins）的机器人状态；动作查询为全零向量。使用 16 个可学习 prompt token，通过 block self-attention 融合特征。分位数级别设为 $\tau_k = 0.025 + 0.95k/20$（共21级），间隙缩放参数 $\delta_0 = 0.02$。推理时默认使用确定性中位数解码，也支持可选的分位数采样。
- **训练/优化目标**: 使用掩码弹珠损失（Masked pinball loss）。对每个动作坐标的 21 个分位数计算 pinball loss。为防止过拟合，训练时随机丢弃 10% 的有效动作坐标标签（mask 在该坐标的所有分位数间共享）。

**3. 实验结果**
- **实验设置**: 仿真基准包括 LIBERO（Spatial/Object/Goal/Long）、LIBERO-Plus 和 LIBERO-Pro；真机任务包括苹果放置和方块移除。对比基线包括 Diffusion Policy, OpenVLA, OpenVLA-OFT, $\pi_0$, $\pi_{0.5}$, VLANeXt, SimVLA 等。消融实验对比了 L1/L2 回归、Flow Matching 以及仅监督中位数（Median-Only）等匹配设置。
- **评价指标**: 任务成功率（Success rates, %）和平均回合时间（Mean episode time, s）。
- **主要结果**: 在 LIBERO 上平均成功率达 99.3%（超最强基线 0.4%），平均回合时间 5.88s（比 L1 回归降低 27.7%）。在 LIBERO-Plus 零样本/微调成功率分别为 87.1%/89.1%，LIBERO-Pro 达 60.2%（超 $\pi_{0.5}$ 6.9%）。真机任务平均成功率 75.0%（超 $\pi_{0.5}$ 16.5%）。消融实验表明，联合分位数监督（99.3%）显著优于仅中位数监督（97.5%），验证了辅助分位数降低中位数更新方差的理论分析。

### 21. 🔥 [ReSync: Re-Aligning the Two Clocks of Asynchronous World-Action Models] (ReSync：重新对齐异步世界-动作模型的两个时钟)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33944` | [点击跳转](https://arxiv.org/abs/2609.33944)

**0. 论文标题**
- **英文标题**: ReSync: Re-Aligning the Two Clocks of Asynchronous World-Action Models
- **中文标题**: ReSync：重新对齐异步世界-动作模型的两个时钟
- **研究机构**: 原文未提及
- **一句话总结**: 提出ReSync推理调度策略，通过在异步世界-动作模型中暂停动作去噪并提前推进世界预测，解决动作决策与世界证据不同步的问题，以极小的计算代价显著提升机器人操作成功率。

**1. 整体逻辑**
- **研究任务**: 优化异步世界-动作模型（World-Action Models, WAMs）在机器人操作任务中的推理调度与测试时计算分配。
- **研究动机**: 现有的异步WAM（如X-WAM）为了降低控制延迟，动作去噪步数远少于世界预测步数（如10步对50步）。这导致动作在“承诺时钟”上已可执行时，“证据时钟”上的世界预测还没解析完（即承诺-证据差距）。此时动作决策缺乏充分的世界证据支持，而单纯增加总计算量或强行同步去噪效果不佳。
- **本质改动**: 不修改模型参数，仅在推理阶段动态调整计算分配：在动作去噪的特定安全节点暂停动作更新，仅推进世界预测的去噪（world-only computation），待世界证据更充分后再恢复动作去噪，确保动作能在其剩余步数内吸收新的世界证据。
- **技术溯源**: 基于 X-WAM 和 Cosmos Policy 等异步世界-动作模型，以及 RoboCasa、RoboTwin 2.0 等机器人操作基准。

**2. 技术拆解**
- **核心方法**: ReSync（推理期世界证据推进算子）。通过三个约束确定安全插入点：1) 必须在原生动作执行状态上暂停；2) 暂停后必须保留至少 $R_{min}=3$ 步原生动作去噪用于吸收新证据（动作恢复约束）；3) 推进后的世界与动作时间步必须满足训练时的联合时间步支持范围（$t_O \ge t_a$）。在满足约束的最晚安全点，缓存动作状态，执行 $M$ 步纯世界去噪，然后恢复动作去噪。
- **关键细节**: 以X-WAM（10步动作，50步世界）为例，原生在第10步提交。ReSync选择在第6步后（保留4步，满足 $R_{min}=3$）暂停动作，执行24步纯世界去噪（此时世界进度达到34/50），然后恢复剩余动作去噪。总计算量变为 3.40× 原生计算量。
- **训练/优化目标**: 无需重新训练或优化模型参数。核心机制是基于原生调度表和联合时间步约束，在推理期进行确定性的计算重分配（Test-time compute reallocation）。

**3. 实验结果**
- **实验设置**: 数据集与基准：RoboCasa（960次rollout，24个任务，冻结聚类配对面板）、RoboTwin 2.0（300次rollout）、Cosmos Policy（320次rollout），以及Mobile ALOHA真机实验。对比对象：原生X-WAM/Cosmos，以及同等计算预算（3.40×）下的5种替代方案（单纯等待、重采样候选、延长动作去噪、完全同步流、世界预热），还有超预算的完全同步方案（Sync-50, 5.00×）。
- **评价指标**: 任务成功率（Success Rate, SR），以及聚类自举置信区间（Clustered bootstrap CI）和 Rescue/Break 统计。
- **主要结果**: 
  1. 在RoboCasa上，ReSync将X-WAM的成功率从80.31%提升至84.79%（+4.48 pp），计算量仅增加3.40倍。
  2. 同等计算量（3.40×）下，其他5种替代方案成功率仅在80.52%到82.92%之间；即使是5.00×计算量的完全同步方案（Sync-50）也仅达83.23%，证明“计算花在哪里”比“花多少”更重要。
  3. 世界去噪推进步数 $M$ 存在内部最优值（$M=24$），超出训练支持边界后性能下降，证明并非世界预测越清晰越好，而是要在动作能吸收的时间窗口内提供证据。
  4. 泛化性：冻结规则直接迁移到未见过的调度对（8/40, 12/60）以及RoboTwin 2.0（+2.67 pp）和Cosmos Policy（+4.38 pp）上均取得显著提升。真机Mobile ALOHA实验成功率从63.3%提升至73.3%。

### 22. 🔥 [AnyStep-WAM: Budget-Aligned Distillation and Adaptive Inference for World Action Models] (AnyStep-WAM：面向世界动作模型的预算对齐蒸馏与自适应推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33748` | [点击跳转](https://arxiv.org/abs/2609.33748)

**0. 论文标题**
- **英文标题**: AnyStep-WAM: Budget-Aligned Distillation and Adaptive Inference for World Action Models
- **中文标题**: AnyStep-WAM：面向世界动作模型的预算对齐蒸馏与自适应推理
- **研究机构**: 原文未提及
- **一句话总结**: [领域：具身智能/机器人学习；类型：方法创新/系统工程] 提出了一种针对机器人世界动作模型（WAMs）的灵活步数蒸馏与自适应推理框架，通过冻结教师轨迹积分蒸馏和轻量级风险收益调度器，在保持操作成功率的同时大幅减少去噪步数和推理延迟。

**1. 整体逻辑**
- **研究任务**: 加速机器人世界动作模型（WAMs）的推理过程，解决固定去噪步数导致的计算浪费或精度不足问题。
- **研究动机**: WAMs依赖迭代去噪生成动作，延迟高。固定步数无法适应不同动作块对误差的敏感度差异（如接触敏感动作需多步，简单动作需少步）；而现有的变步数方法（如AnyFlow）依赖学生模型的有限差分或导数监督，训练不稳定且少步数下成功率极低。
- **本质改动**: 抛弃依赖学生模型动态的导数监督，改用冻结教师轨迹的有限区间位移作为监督信号进行流图蒸馏，并引入基于单步预览的轻量级调度器来动态分配去噪步数。
- **技术溯源**: Flow Matching / Flow Maps, LoRA (Low-Rank Adaptation), 预训练的世界动作模型 (Motus, FastWAM, LingBotVA)。

**2. 技术拆解**
- **核心方法**: 
  1. 预算对齐的积分流图蒸馏：抛弃以往依赖学生模型求导的变步数方法，直接提取冻结教师模型在候选推理时间表上的有限时间区间位移作为监督目标。通过训练共享LoRA适配器，让单一模型学会预测任意区间的平均速度，从而支持从1步到多步的灵活生成。
  2. 风险收益自适应推理：训练一个轻量级调度器，仅依赖单步预览的特征，预测当前动作块的教师轨迹难度（风险）和特定步数下的师生保真度（收益），从而动态选择满足保真度阈值的最小去噪步数。
  3. 预览复用机制：将单步预览生成的结果直接作为所选多步轨迹的起点，避免了额外的去噪传递、在线教师评估或候选轨迹 rollout，实现零额外前向传播开销。
- **关键细节**: 
  - 模型结构：冻结预训练WAM主干，仅训练共享的LoRA适配器（Rank=128）。调度器是一个4层Transformer，输入为单步预览特征、指令和机器人状态。
  - 训练目标：学生模型损失包含区间监督、局部流匹配、端点监督和回收状态恢复四项；调度器使用Smooth L1损失拟合离线的风险和保真度标签。
  - 调度器标签构造：风险由教师轨迹的速度方向差异和相对变化率计算；收益由学生执行速度与教师重启轨迹速度的相似度计算。
- **训练/优化目标**: 学生模型使用维度归一化的回归损失（MSE变体）拟合教师区间平均速度；调度器使用Smooth L1损失拟合离线的风险（难度）和保真度（收益）标签。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboTwin 2.0 仿真平台（50个双臂操作任务，含clean和randomized设置）；真实世界环境（Unitree G1D双臂机器人，6个操作任务）。
  - 对比对象（Baselines）：原始固定步数的 Motus, FastWAM, LingBotVA；单步基线 Flash-WAM；无训练的启发式门控方法 AnyStep+Gate；以及基于有限差分的 AnyFlow。
- **评价指标**: 任务成功率（Success Rate, SR）、平均去噪步数（Mean denoising steps）、单次推理延迟（Latency）。
- **主要结果**: 
  - 仿真中，自适应推理在平均成功率与全步数 baseline 相差不到 0.24% 的情况下，将 Motus、FastWAM、LingBotVA 的平均去噪步数分别减少了 60.2%、49.8%、85.28%。
  - 在严格的 1 步去噪预算下，AnyStep 蒸馏使三个基座模型的 1 步成功率分别提升了 7.07%、12.08%、8.94%，且显著优于 Flash-WAM 和 AnyFlow（AnyFlow在少步数下性能崩溃且训练不稳定）。
  - 真实世界中，推理延迟分别降低至原来的 1/1.67、1/2.30、1/6.14（即加速 1.67x - 6.14x），且平均成功率持平或更高。调度器带来的额外计算开销仅为几毫秒。

### 23. 🔥 [InfraVLA: Extending Vision-Language-Action Navigation with Infrastructure Cameras] (InfraVLA：利用基础设施摄像头扩展视觉-语言-动作导航)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33647` | [点击跳转](https://arxiv.org/abs/2609.33647)

**0. 论文标题**
- **英文标题**: InfraVLA: Extending Vision-Language-Action Navigation with Infrastructure Cameras
- **中文标题**: InfraVLA：利用基础设施摄像头扩展视觉-语言-动作导航

- **一句话总结**: 提出了一种端到端方法，将室内现有的监控摄像头视角引入预训练的视觉-语言-动作（VLA）模型，并设计了两阶段训练策略解决模型忽略外部视角的捷径学习问题，大幅提升了机器人在复杂室内环境中的导航成功率。

**1. 整体逻辑**
- **研究任务**: 室内机器人导航（具体包括：根据语言指令寻找视线外的特定物体，以及在通道受阻时重新规划路线）。
- **研究动机**: 现有的VLA导航模型仅依赖机器人本体摄像头（on-board cameras），无法利用室内环境中已广泛部署的静态监控摄像头（CCTV）所提供的全局和遮挡区域信息。这导致机器人在需要全局视野（如找特定物体、避开死胡同）时，只能盲目搜索或走入死胡同。
- **本质改动**: 在预训练VLA模型中端到端地接入静态CCTV视角，并针对“模型倾向于忽略CCTV信息走捷径（shortcut learning）”的问题，提出基于反事实数据上采样和恢复数据的两阶段训练策略，强迫模型学会利用外部视角。
- **技术溯源**: 基于 OmniVLA（衍生自 OpenVLA），视觉编码器使用 DINOv2 和 SigLIP，语言/动作骨干网络使用 LLaMA 2 7B。

**2. 技术拆解**
- **核心方法**: 
  1. 架构扩展：增加专用的CCTV编码器，将外部视角图像编码为token，经平均池化降采样后，作为额外token插入到LLM骨干网络的输入序列中。
  2. 两阶段训练策略：
     - 阶段一（反事实数据上采样）：构建起点相同但指令或场景配置不同的轨迹对，提取路径分叉处的“反事实片段（counterfactual snippets）”并上采样。这增加了模型利用CCTV信息的优化压力，防止其只靠本体视角走捷径。
     - 阶段二（恢复数据）：在阶段一模型易出错的片段区域进行 rollout，当偏离轨迹时由监督者（仿真中为A*，真实中为人类）接管并记录恢复轨迹，打破模型的模仿捷径行为（copycat behavior）。
- **关键细节**: 
  - 输入输出：输入为本体图像、N个CCTV图像、目标（语言/图像/位姿）；输出为未来8个路点（waypoints，每个包含x, y, cos, sin）。
  - 模型结构：CCTV编码器与本体编码器结构相同（共享初始化），每个CCTV视角的256个token通过2x2平均池化降至64个token。CCTV token插入在本体和目标图像token之后。所有线性层使用 LoRA (rank 16, α=8) 微调。
  - 规模/超参：LLM骨干为 LLaMA 2 7B；预测步长 H=8；平滑损失权重 λ=0.1。
- **训练/优化目标**: 路点回归损失（预测值与真实值的L2距离）加上辅助的轨迹平滑损失（相邻预测路点间的L2距离）。去除了原OmniVLA中的语言跟随损失以避免末端路点产生伪影。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：Isaac Sim 仿真仓库环境（语义任务：找特定物体；空间任务：绕开被叉车堵死的通道）；真实环境（Boston Dynamics Spot 机器人在实验室找特定物体）。
  - 对比对象（baseline）：未接入CCTV输入的相同微调OmniVLA模型（On-board-only baseline）。
- **评价指标**: 任务成功率（Success Rate, SR），空间任务中的最短路径选择比例（Route share），以及语义任务中离货架的平均安全距离（Clearance）。
- **主要结果**: 
  - 仿真语义任务：InfraVLA 成功率达 100%，baseline 为 34.0%；平均安全距离从 0.67m 提升至 1.27m。
  - 仿真空间任务：InfraVLA 成功率达 100%（baseline 73.6%），最短路径选择比例达 95.8%（baseline 55.6%）。
  - 真实机器人实验：使用不到10分钟的演示数据微调，InfraVLA 成功率达 83.3%（24次中成功20次），baseline 为 29.2%（24次中成功7次），且定性验证了模型保留了预训练的避障能力。
  - 泛化能力：在未见过的物体摆放和通道阻塞配置（OOD测试）中，成功率分别达到 88.2% 和 88.9%。

### 24. 🔥 [SLIP-VLA: Single-Step Latent Imagination for Policy Learning in Vision-Language-Action Models] (SLIP-VLA：用于视觉-语言-动作模型策略学习的单步潜在想象)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33575` | [点击跳转](https://arxiv.org/abs/2609.33575)

**0. 论文标题**
- **英文标题**: SLIP-VLA: Single-Step Latent Imagination for Policy Learning in Vision-Language-Action Models
- **中文标题**: SLIP-VLA：用于视觉-语言-动作模型策略学习的单步潜在想象
- **研究机构**: 原文未提及
- **一句话总结**: 提出SLIP-VLA框架，通过几何/语义对齐和动力学约束来“塑造”单步去噪的未来潜在表示，在推理仅需12ms的情况下实现了SOTA的机器人操作性能。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的策略学习（根据当前多视角观测和语言指令预测机器人动作）。
- **研究动机**: 现有VLA大多直接从当前观测预测动作，缺乏对未来场景演变的显式建模；而引入未来预测的世界动作模型（WAMs）依赖昂贵的多步迭代去噪，直接截断的单步去噪方案又因为潜在表示缺乏足够的几何、语义和动作条件信息，导致性能大幅缩水。
- **本质改动**: 放弃多步迭代去噪生成未来视频帧，改为以当前观测为锚点进行单步去噪，并通过感知（对齐预训练视觉特征）和控制（约束前向/逆向动力学）双重辅助目标来“塑造”这个单步潜在表示，使其信息密度足以直接条件化动作生成。
- **技术溯源**: 基于 Vision-Language-Action (VLA) 范式、World Action Models (WAMs)、Diffusion/Flow Matching 去噪模型（DiT架构），以及预训练视觉编码器（VGGT-$\Omega$, DINOv3）和潜在世界模型/逆向动力学模型。基座语言模型使用了 Qwen3.5-2B。

**2. 技术拆解**
- **核心方法**: 
  1) **单步潜在想象**: 将当前观测编码为潜在向量并重复K次，加入少量高斯噪声作为源，通过World DiT进行单步去噪，得到K个未来时间步的密集潜在表示。
  2) **感知充分性塑造**: 在World DiT的浅层对齐冻结的VGGT-$\Omega$几何特征（保留空间布局和边界），在深层对齐冻结的DINOv3语义特征（保留任务相关的物体和状态语义）。
  3) **控制充分性塑造**: 在更深层引入轻量级的前向动力学模型（根据当前状态和动作预测下一状态）和逆向动力学模型（根据连续状态转移预测动作），并设计排序损失确保潜在转移与动作严格耦合。
- **关键细节**: 
  - 模型规模：VLM采用Qwen3.5-2B，World DiT为12层，Action DiT为24层。
  - 输入输出：输入多视角图像和语言指令，输出16步的动作块（action chunk）。
  - 未来槽设置：K=4个动作对齐的未来时间步，噪声比例$\eta=0.2$。
  - 推理效率：所有辅助对齐和动力学模块仅在训练时使用，推理时全部移除；World DiT单步前向传播仅需12ms。
- **训练/优化目标**: 
  联合优化动作生成损失（条件流匹配）、视频预测损失（随机时间步和首步分支），以及感知对齐损失（几何角度/尺度回归+语义余弦相似度）和控制动力学损失（前向/逆向预测误差+排序/对比惩罚项）。

**3. 实验结果**
- **实验设置**: 
  - 仿真基准：LIBERO（标准多任务）、LIBERO-Plus（分布偏移/零样本鲁棒性）、RoboTwin 2.0（复杂双臂操作）。
  - 真实世界平台：AgileX COBOT Magic 双臂移动操作平台（玉米入盘及长程任务）。
  - 对比对象（Baseline）：OpenVLA系列、$\pi_0$系列、CoT-VLA、FlowVLA、WorldVLA、LaMP、Motus、Fast-WAM系列等。
- **评价指标**: 任务成功率（Success Rate, %），以及潜在表示的几何/语义探针评估指标（Pearson, AbsRel, mIoU, Dice）和动力学评估指标（预测距离、动作恢复误差）。
- **主要结果**: 
  - 仿真SOTA：在LIBERO平均成功率达98.9%；在LIBERO-Plus分布偏移下平均达83.2%（超最强对比方法3.9%，超最佳WAM 14.4%）；在RoboTwin 2.0达91.8%（匹配SOTA）。
  - 真实世界表现：在6个真实世界条件（包含分布偏移和长程任务）下均显著优于$\pi_0$（绝对提升12-16%），In-D任务成功率86%，长程三步任务达74%。
  - 效率与消融：验证了单步去噪在合理塑造后性能不降反升，推理仅需12ms；消融实验证实感知和控制双重塑造对提升分布偏移下的鲁棒性至关重要，且以当前观测为锚点的初始化优于纯高斯噪声。

### 25. 🔥 [VIDEAS: Distilling Explicit Action Semantics from Demonstration Videos for World Models via Prior-Guided Simulation] (VIDEAS：通过先验引导模拟从演示视频中蒸馏显式动作语义以构建世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33464` | [点击跳转](https://arxiv.org/abs/2609.33464)

**0. 论文标题**
- **英文标题**: VIDEAS: Distilling Explicit Action Semantics from Demonstration Videos for World Models via Prior-Guided Simulation
- **中文标题**: VIDEAS：通过先验引导模拟从演示视频中蒸馏显式动作语义以构建世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出VIDEAS数据蒸馏框架，将机器人操作视频转化为显式的动作前提条件与状态转移语义，并训练出8B/9B参数规模的VIDEAS-WM世界模型，在高层具身动作推理和物理一致性评估上达到当前最优水平。

**1. 整体逻辑**
- **研究任务**: 构建能够显式理解动作前提条件（preconditions）和预测状态转移（effects）的高层具身世界模型，用于机器人行为仿真与长序列规划。
- **研究动机**: 现有世界模型（如基于LLM提示、视频生成或隐空间的方法）往往只关注未来状态预测的准确性，忽略了动作执行的因果依赖；在长序列预测中容易产生物理不一致（幻觉），且缺乏对动作是否可行（即前提条件是否满足）的显式评估能力。
- **本质改动**: 将连续的物理动态视频蒸馏为结构化的显式动作语义，并引入基于文本环境的先验引导轨迹模拟机制来验证物理一致性，同时构造负样本轨迹以补全前提条件知识，使模型具备判断动作不可行的能力。
- **技术溯源**: 基于VLM（如Gemini 3.1 Pro作为教师模型）、开源LLM（Llama-3.1-8B, Qwen3-8B, Qwen3.5-9B作为基座模型）、AgiBot-World数据集，以及LogicEnvGen和BeSimulator等现有框架。

**2. 技术拆解**
- **核心方法**: 
  1. 文本环境生成：将视频首帧通过VLM和LogicEnvGen转化为JSON格式的文本环境，包含实体属性及空间/非空间关系。
  2. 先验引导轨迹模拟：在文本环境中，通过consider（提取前提条件）、decide（判断条件是否满足）、transfer（预测状态转移）三阶段模拟动作。利用成功轨迹的先验进行动作级和轨迹级的迭代验证，纠正VLM幻觉。
  3. 负轨迹整合：基于动作依赖关系删除前置动作，构造因前提条件不满足而失败的负样本轨迹，丰富模型对动作不可行情况的认知。
- **关键细节**: 
  - 数据规模：从AgiBot-World数据集中过滤去重，最终构建包含34K高质量样本的语料库。
  - 模型结构：基于8B/9B参数规模的LLM，使用LoRA微调（rank=32, alpha=64），其中Qwen3.5-9B保留冻结的视觉编码器作为VLM。
  - 关键超参：训练3个epoch，学习率1e-4，batch size 4，最大序列长度4096，精度bfloat16。
- **训练/优化目标**: 采用标准的自回归语言建模损失函数（Autoregressive objective），优化模型在给定当前状态和动作下，生成前提条件集合、判断条件真值（grounding）以及预测状态转移的能力。

**3. 实验结果**
- **实验设置**: 
  - 数据集：AgiBot-World（用于数据蒸馏），以及BTSIMBENCH、LogicEnvEval、WorldPrediction-WM（用于评估）。
  - 对比对象（baseline）：闭源模型（Gemini 3.1 Pro, Gemini 3 Flash），开源模型（DeepSeek-V4-Pro/Flash, Gemma4-31B, Llama3.3-70B, Qwen系列, InternVL3.5系列, MiniMax-M2.7等）。
- **评价指标**: 
  - BTSIMBENCH：交付率（delivery rate）和仿真准确率（simulation accuracy，分Good, Counterfactuals, Unreachable等类别）。
  - LogicEnvEval：仿真准确率（simulation accuracy，分Good, Counterfactuals, Unreachable, LackBranch等类别）。
  - WorldPrediction-WM：整体准确率（Overall accuracy）。
- **主要结果**: 
  - 在BTSIMBENCH和LogicEnvEval上，VIDEAS-WM-9B分别取得94.67%和95.00%的平均准确率，比最强开源基线Gemma4-31B分别高出14.67%和7.00%。
  - 在WorldPrediction-WM跨场景泛化任务中，VIDEAS-WM-9B在VLMs类别达到58.33%，VIDEAS-WM-Q8B在Socratic LLMs类别达到63.42%，超越了DeepSeek-V4-Pro等更大参数规模的模型。
  - 消融实验表明，先验引导轨迹模拟机制比朴素蒸馏平均提升22.67%至30.67%的准确率；引入负轨迹整合显著提升了模型在Counterfactuals（反事实/不可行）类别下的判断能力，避免了盲目预测成功的认知偏差。

### 26. 🔥 [Q-WAM: 4-Bit Quantization of World Action Models with Action-Subspace Protection] (Q-WAM：具有动作子空间保护的世界动作模型4位量化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33269` | [点击跳转](https://arxiv.org/abs/2609.33269)

**0. 论文标题**
- **英文标题**: Q-WAM: 4-Bit Quantization of World Action Models with Action-Subspace Protection
- **中文标题**: Q-WAM：具有动作子空间保护的世界动作模型4位量化
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于最终动作敏感性的 W4A4 后训练量化方法，通过计算动作可观测格拉姆矩阵定位关键激活子空间并保留高精度，在大幅降低内存的同时维持了世界动作模型的机器人控制成功率。

**1. 整体逻辑**
- **研究任务**: 世界动作模型 (World Action Models, WAMs) 的后训练量化 (PTQ)，具体实现权重和激活均为 4-bit 量化 (W4A4)，以降低大模型在机器人部署中的计算和内存成本。
- **研究动机**: 现有 PTQ 方法（如平滑、旋转或 SVDQuant）仅基于单层局部输出误差来分配精度。但在 WAM 中，视觉世界建模与动作生成通过迭代去噪紧密耦合，单层局部误差无法反映量化误差在后续去噪步骤中对最终生成动作的真实影响，导致动作生成精度严重下降。
- **本质改动**: 摒弃传统的局部重构误差指标，提出基于最终动作敏感性的混合精度量化策略。通过追踪量化误差在完整去噪过程中的传播，定位对动作影响最大的激活子空间，将其保留在 16-bit 低秩分支中，其余部分量化为 4-bit。
- **技术溯源**: 基于世界动作模型（如 Fast-WAM, ImageWAM, LingBot-VA），结合了 SmoothQuant、Hadamard 旋转等基础 PTQ 技术，并针对 Mixture-of-Transformers (MoT) 架构进行了适配。

**2. 技术拆解**
- **核心方法**: 
  1. **动作可观测格拉姆矩阵 (AOG)**：利用无标签的随机探针 (random probes)，通过反向传播估计每层输入舍入误差对最终动作的雅可比矩阵，构建衡量各输入通道组合对最终动作敏感度的矩阵。
  2. **动作子空间保护 (ASP)**：对 AOG 进行特征分解，提取特征值最大的前 $r$ 个特征向量构成动作子空间。将激活投影到该子空间并保留 16-bit 精度，正交补空间部分进行 W4A4 量化。
  3. **专家选择机制**：针对 MoT 架构，通过累加各层 AOG 的迹（即动作质量 action mass），识别出对动作影响最大的专家（如动作专家），仅对其应用 ASP 以控制开销。
- **关键细节**: 
  - 保护子空间的秩 $r=32$，分组量化 group size=32。
  - 校准阶段使用 $P=12$ 个随机探针，相比精确计算雅可比矩阵减少了约 37 倍的计算量。
  - 16-bit 低秩分支和 4-bit 量化分支均被转化为密集矩阵乘法 (GEMM)，以便在 GPU 上高效运行。
- **训练/优化目标**: 最小化量化舍入误差导致的最终动作的期望平方变化（即动作失真 action distortion）。在随机旋转使得量化误差各向同性的假设下，该目标等价于最小化未被保护子空间覆盖的 AOG 特征值之和。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真环境使用 RoboTwin 2.0 benchmark（包含 50 个任务）；真实世界部署使用 Unitree G1 人形机器人和双臂 UR3 机器人（包含 5 个任务）。
  - **对比对象 (Baseline)**：bf16 全精度模型、SmoothQuant、ViDiT-Q、SVDQuant。
- **评价指标**: 任务成功率 (Success rate)、量化块内存占用 (Memory)、每权重比特数 (BPW)、推理延迟 (Latency)。
- **主要结果**: 
  - **仿真表现**：在 RoboTwin 2.0 上，Q-WAM 平均成功率达到 89.6%–93.0%，与 bf16 差距在 1.1 个百分点以内；相比最强 baseline SVDQuant 提升 2.5–8.7 个百分点；量化块内存减少 3.1–3.4 倍（降低 68%–71%）。
  - **真实世界表现**：在 Unitree G1 和 UR3 上，相比 SVDQuant 成功率大幅提升 12.8–17.6 个百分点（例如 ImageWAM 在真实物理任务中从 58.4% 提升至 76.0%）。
  - **效率表现**：量化后的动作 token 处理层相比 bf16 加速 1.06–1.56 倍，且 16-bit 分支带来的额外内存开销极小（仅增加约 1.9% 的量化块内存）。

### 27. 🔥 [TAO-DA: Towards Autonomous Operation--A Dual-Arm Vision-Language-Action Model for Coordinated Manipulation] (TAO-DA：面向自主操作——用于协调操作的双臂视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33197` | [点击跳转](https://arxiv.org/abs/2609.33197)

**0. 论文标题**
- **英文标题**: TAO-DA: Towards Autonomous Operation--A Dual-Arm Vision-Language-Action Model for Coordinated Manipulation
- **中文标题**: TAO-DA：面向自主操作——用于协调操作的双臂视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种解耦双臂状态与意图的VLA模型，通过意图路由和参数独立的双臂专家网络消除非活动臂干扰，显著提升了双臂协调操作在干扰环境下的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 双臂机器人的视觉-语言-动作（VLA）协调操作。
- **研究动机**: 现有的VLA模型通常将双臂放在统一的动作生成器中，这会导致非活动臂的状态和视觉变化对活动臂产生意外的跨臂干扰（cross-arm interference），特别是在只需单臂执行或双臂执行非对称子任务时，这种耦合会严重降低任务成功率。
- **本质改动**: 打破统一动作空间的设定，在共享多模态任务表征的基础上，引入双臂意图路由（DAIR）和参数完全独立的双臂专家动作塔（Dual-Tower DAE），实现臂级动作生成的强解耦。
- **技术溯源**: 基于 SigLIP（视觉编码）、Eagle-2.5-VL（VLM骨干网络）、Flow-matching（流匹配动作生成，类似 $\pi_0$ 和 GR00T 的范式）。

**2. 技术拆解**
- **核心方法**: 
  1. **DAIR（双臂意图路由）**: 两阶段路由机制。第一阶段用规则解析语言指令中的显式臂指向（如“左手”、“双手”）；第二阶段用VLM融合后的多模态特征通过MLP分类器预测左单臂、右单臂或双臂意图。结合任务进度预测模块进行意图保持（hold机制），防止路由在任务执行中频繁跳变。
  2. **Dual-Tower DAE（双臂专家模块）**: 参数独立的双臂动作生成网络。左右臂拥有独立的状态编码器、动作分词器、DiT（Diffusion Transformer）和动作解码器。非活动臂的末端执行器视角图像在输入VLM前会被Mask掉，从视觉和参数双重层面隔离干扰。
  3. **Task-Progress Prediction（任务进度预测模块）**: 用GRU编码DiT时序特征，通过交叉注意力融合VLM表征，回归预测帧级任务完成进度，用于稳定DAIR的路由决策和部署层的任务调度。
- **关键细节**: 
  - **输入输出**: 输入为多视角视觉（1个自我中心视角+2个可选的末端执行器视角）、语言指令、本体感受状态；输出为左右臂的连续动作序列。
  - **架构对比**: 论文对比了三种DAE变体：Single-Tower（统一DiT）、Dual-Mask（共享DiT但加注意力Mask弱解耦）、Dual-Tower（完全独立的DiT分支强解耦）。
- **训练/优化目标**: 
  - **路由分类**: 交叉熵损失（三分类：左、右、双）。
  - **动作生成**: Flow-matching（流匹配）目标。单臂样本只计算活动臂的损失，双臂样本同时计算双臂损失。
  - **进度预测**: 以归一化的轨迹时间为目标进行回归。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 自采的真实世界遥操作数据集，包含 9,080 条轨迹（在 AGIBOT G1 人形机器人上采集，7-DoF双臂，3个RGB-D相机，30Hz），涵盖单臂任务（如抓取、倒茶）和双臂任务（如协作倒茶、桌面整理）。
  - **Baseline**: GR00T N1.5, $\pi_{0.5}$, $\pi_0$, smolVLA, GO-1。
  - **测试环境**: 真实机器人执行，包含标称条件、随机初始状态、以及对非活动臂关节状态注入噪声的持续干扰条件。
- **评价指标**: 任务成功率（%）、离线动作预测均方误差比值（MSE disturbance / MSE clean，越接近1说明抗干扰越强）、意图路由分类准确率（%）。
- **主要结果**: 
  - **任务成功率**: 在单臂任务平均成功率上，TAO-DA (88.4%) 优于 GR00T N1.5 (82.0%) 和 $\pi_{0.5}$ (80.5%)。在双臂任务（协作倒茶、桌面整理）上分别达到 100% 和 95% 的高成功率。
  - **抗干扰鲁棒性**: 在持续干扰非活动臂的真实机器人测试中，Dual-Tower 保持了 95-100% 的成功率，而 Single-Tower 暴跌至 20-60%。离线 MSE 比值显示 Dual-Tower 对干扰完全不敏感（比值约 1.0），证明了强解耦架构的有效性。
  - **意图路由**: 在模糊指令下，左单臂、右单臂、双臂意图的分类准确率分别达到 85.37%、83.31% 和 96.13%，且没有左右混淆错误（错误主要集中在单双臂的区分上）。
  - **技能迁移**: Dual-Tower 展现出初步的技能泛化能力，例如仅用双臂演示训练，能在单臂模式下成功执行；或能直接组合左右臂分别学习的独立技能执行新的双臂任务，无需额外微调。

### 28. 🔥 [DeltaWAM: Change-Centric Visual Foresight via Delta Tokens for an Efficient World-Action Model] (DeltaWAM：通过 Delta Token 实现以变化为中心的视觉前瞻，构建高效的世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33177` | [点击跳转](https://arxiv.org/abs/2609.33177)

**0. 论文标题**
- **英文标题**: DeltaWAM: Change-Centric Visual Foresight via Delta Tokens for an Efficient World-Action Model
- **中文标题**: DeltaWAM：通过 Delta Token 实现以变化为中心的视觉前瞻，构建高效的世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DeltaWAM，将世界模型的未来预测单位从“完整场景”改为压缩帧间变化的“delta token”，在大幅降低计算开销和参数量的同时，显著提升了机器人操作任务中的动态泛化与抗扰动能力。

**1. 整体逻辑**
- **研究任务**: 具身智能中的机器人操作（Robotic Manipulation），具体为结合未来视觉预测与底层动作生成的世界-动作建模（World-Action Modeling）。
- **研究动机**: 现有的世界-动作模型（WAMs）在预测未来时，无论是像素空间还是隐空间，都在逐帧重建完整的场景或隐状态。这导致严重的时空冗余，模型把大量算力浪费在重建任务无关的静态背景上，不仅计算延迟高，还掩盖了对底层控制真正重要的动态变化信息。
- **本质改动**: 改变未来预测的表征粒度。不再预测“未来每一帧长什么样”，而是预测“未来每一帧相对于上一帧发生了什么变化”（即 delta token），将世界建模的核心从“场景重建”转变为“变化预测”。
- **技术溯源**: 基于 DeltaWorld（潜在世界模型）、DINOv3（视觉特征提取）、T5（文本指令编码）、Flow-matching DiT（动作生成专家）。

**2. 技术拆解**
- **核心方法**: 构建以变化为中心的 DeltaWAM 架构。首先用 Delta Tokenizer 将连续帧的 DINOv3 特征差异压缩为单个 1D delta token；然后由任务条件化的 DeltaWorld Predictor 自回归预测未来的 delta token 序列；最后将当前帧的密集 DINO 特征（作为空间锚点提供静态上下文）与预测的 delta token 序列（作为动态子目标提供运动意图）共同输入 Flow-matching Action DiT 生成动作。
- **关键细节**: 
  - **输入输出**：输入多视角 RGB 图像和语言指令，输出 16 步的 7 维动作块（6维关节位置+1维夹爪）。
  - **模型结构**：DINOv3 ViT-B/16 提取 32x32 patch 特征；DeltaTok 将每帧转换压缩为 1 个 768 维 token；DeltaWorld 和 Action DiT 各使用 12 层 Transformer（宽度 768，12 个注意力头）。
  - **规模**：总参数量 0.725B（其中可训练参数 120.3M）。
  - **任务条件化**：通过 Gated AdaLN 将 T5 提取的语言指令嵌入注入 DeltaWorld 的注意力层和 MLP 层，防止无条件预测偏离任务目标。
- **训练/优化目标**: 
  - **阶段一（DeltaWorld 微调）**：采用 Best-of-Many (BoM) 训练范式。并行采样多个高斯查询，选择与 Ground Truth 误差最小的候选分支计算 Smooth-L1 损失进行反向传播，避免多模态未来导致的均值回归，保留生成多样性。
  - **阶段二（Action DiT 训练）**：冻结 DeltaWorld。Action DiT 以 Flow-matching 为目标，条件输入为当前 DINO 特征和 DeltaWorld 采样的未来 delta token（50% 概率用误差最小的 oracle 分支，50% 概率用随机分支）。优化目标是预测流匹配的速度场（velocity）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（Spatial, Object, Goal, Long 四个标准套件），LIBERO-Pro（任务逻辑/目标扰动），LIBERO-Plus（视觉/实体/光照/布局扰动），以及真实世界 PiPER 机械臂抓取数据集。
  - **对比对象（Baseline）**：反应式策略（Diffusion Policy）、VLA 模型（OpenVLA, $\pi_0$, $\pi_{0.5}$, GR00T-N1.6）、WAM 模型（F1, Fast-WAM, Cosmos-Policy, Motus, LingBot-VA, LaWAM）。
  - **测试环境**：仿真环境在 A100 上测延迟，真实世界使用 AgileX PiPER 6-DoF 机械臂。
- **评价指标**: 任务成功率（Success Rate）、模型参数量（Size）、单次动作块推理延迟（Latency）、峰值显存（Peak Memory）。
- **主要结果**: 
  - **效率与规模**：总参数仅 0.725B，推理峰值显存 3.86 GB，单次动作块推理延迟 142.1 ms，训练仅需 256 GPU 小时（2张 H100），计算 footprint 远小于其他 WAM 和 VLA 基线。
  - **标准 LIBERO 性能**：平均成功率 92.8%。虽然绝对数值低于 $\pi_{0.5}$ (96.9%) 或 LaWAM (98.6%) 等超大参数模型，但在轻量级模型中表现优异，且没有使用大规模机器人预训练。
  - **泛化与鲁棒性（核心亮点）**：在 LIBERO-Pro 任务扰动下，DeltaWAM 平均成功率达 17.85%，而其他基线（如 $\pi_0$, OpenVLA 等）几乎为 0%。在 LIBERO-Plus 的光照、相机、布局等扰动下也展现出极强的鲁棒性（如光照扰动下 84.2%）。证明 delta token 抓住了任务相关的动态本质，而非死记硬背特定场景轨迹。
  - **消融实验**：仅用当前 DINO 特征成功率为 73.9%，用解码后的完整未来 DINO 特征为 79.0%，使用 delta token 为 92.8%。证明压缩的变化量表征比完整状态表征更紧凑，对动作生成的引导（action-forcing）效果更好。

### 29. 🔥 [TimelyDAgger: Timing-Aware Expert Querying for VLA Policy Improvement] (TimelyDAgger：面向视觉-语言-动作策略改进的时序感知专家查询)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33157` | [点击跳转](https://arxiv.org/abs/2609.33157)

**0. 论文标题**
- **英文标题**: TimelyDAgger: Timing-Aware Expert Querying for VLA Policy Improvement
- **中文标题**: TimelyDAgger：面向视觉-语言-动作策略改进的时序感知专家查询
- **研究机构**: 原文未提及
- **一句话总结**: 提出 TimelyDAgger，通过监控 VLA 模型内部特征并结合专家反馈动态调整接管阈值，优化 Robot-gated DAgger 中的专家接管时机，从而在有限的专家数据预算下提升策略微调效果。

**1. 整体逻辑**
- **研究任务**: 机器人模仿学习中的主动 imitation learning（具体为 Robot-gated DAgger），即在机器人自主执行任务时，自动决定何时请求人类专家接管并提供示范，以收集纠正数据来微调策略。
- **研究动机**: 现有的 Robot-gated DAgger 方法主要关注“是否需要”专家介入（故障检测），而忽略了“何时”接管。接管太早会包含大量策略已掌握的有效动作，浪费专家数据；接管太晚则会错过策略需要学习的错误前缀，导致收集到的示范无法有效弥补能力缺口。
- **本质改动**: 将专家接管时机视为一个数据采集决策问题，通过监控 VLA 模型内部特征触发接管，并利用专家接管后的行为反馈动态调整接管阈值，从而在合适的时机请求接管，提高收集到的专家数据的学习价值。
- **技术溯源**: 基于 DAgger、Robot-gated DAgger，以及视觉-语言-动作（VLA）模型（如 $\pi_{0.5}$、OpenVLA、X-VLA）。

**2. 技术拆解**
- **核心方法**: TimelyDAgger 包含两个核心组件：1) Bridge-PCA：离线拟合成功示范的内部特征主成分，在线计算当前特征的重建残差作为监控分数，超过阈值则触发接管；2) Feedback-guided Threshold Adaptation (FTA)：利用专家接管后前几个动作的反馈（是否纠正了机器人的错误动作、策略与专家动作是否一致）来动态上调或下调接管阈值。
- **关键细节**: 
  - 输入输出：输入为视觉观测和任务指令，输出为机器人动作。监控的是 VLA 模型中视觉语言模块到动作生成模块之间的“Bridge 特征”。
  - 模型结构/规模：基于 VLA 模型（如 $\pi_{0.5}$、OpenVLA、X-VLA）。
  - 关键超参：PCA 的秩 $r$，校准分位数 $1-\alpha$，执行块长度 $\Delta$，FTA 步长 $\beta$。
- **训练/优化目标**: 
  - 离线阶段：通过 PCA 最小化重建误差来拟合参考子空间，通过分位数校准初始阈值。
  - 在线阶段：FTA 通过乘性因子 $\exp(-\beta y)$ 更新阈值（$y \in \{+1, -1, 0\}$ 分别代表提前、推迟或保持阈值）。
  - 策略更新：使用原始同分布（ID）数据和收集的专家后缀数据（纠正示范）进行微调。

**3. 实验结果**
- **实验设置**: 
  - 数据集：在 ManiSkill 仿真环境中构建的 11 个操作任务变体（ID-to-OOD 设计，改变物体位置、姿态或身份）。真实世界任务为电缆抓取、交接和插入。
  - 对比对象（baseline）：
    - 故障检测：FIDeL、CRSAIL、Diff-DAgger、ACC、STAC。
    - 数据收集与策略学习：Offline BC、Human-Gated DAgger、Diff-DAgger。
  - 评估的 VLA 基座：$\pi_{0.5}$、OpenVLA、X-VLA。
- **评价指标**: 
  - 故障检测：AUPRC。
  - 策略改进：微调后策略在 OOD 条件下的成功率（Success Rate）。
  - 监督质量：TASR（Target-Aligned Supervision Ratio），衡量收集的专家示范中有多少比例落在需要纠正的目标操作区间内，无需重新训练即可评估。
- **主要结果**: 
  - 在 15 个任务-基座设置中，TimelyDAgger 在 13 个设置中取得了最高的 AUPRC、TASR 和微调后成功率。
  - 接管时机显著影响策略改进：在 OpenDrawer 任务中，随着接管步骤从立即接管推迟到第 80 步，成功率从 42% 提升至 78%。
  - FTA 消融实验证明，引入专家反馈动态调整阈值能带来更高的 TASR 和成功率。
  - 真实世界实验中，在两种 OOD 条件下，TimelyDAgger 的成功率均高于 Offline BC 和 Human-Gated DAgger。

### 30. 🔥 [VPTwin: Real-Sim-Real Video Prediction for Robotic Manipulation Planning] (VPTwin：用于机器人操作规划的真-仿真-真视频预测)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33104` | [点击跳转](https://arxiv.org/abs/2609.33104)

**0. 论文标题**
- **英文标题**: VPTwin: Real-Sim-Real Video Prediction for Robotic Manipulation Planning
- **中文标题**: VPTwin：用于机器人操作规划的真-仿真-真视频预测
- **研究机构**: 原文未提及
- **一句话总结**: [领域与类型：具身智能/机器人操作，方法创新与系统工程] 提出VPTwin框架，利用VLM构建数字孪生并生成多假设仿真轨迹作为上下文，约束真实域视频预测以消除物理幻觉，并用于机器人操作的双域视觉验证与规划。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的动作条件视频预测，以及基于视觉验证的模型预测控制（MPC）规划。
- **研究动机**: 纯数据驱动的视频预测在长序列推理时容易产生物理幻觉（如物体穿透、悬浮），误导下游规划；而纯物理仿真规划又受限于Sim-to-Real的几何、摩擦和复杂接触差异。
- **本质改动**: 把仿真器生成的多组随机化物理参数的轨迹作为“物理先验上下文”，输入到视频预测模型中，用仿真的物理规律去锚定真实域的视频生成，同时保留真实视频里未建模的复杂接触细节。
- **技术溯源**: VLM (GPT-6 Astra), Isaac Sim, IWS (两阶段视频预测基座), FiLM。

**2. 技术拆解**
- **核心方法**: 
  1. Real-to-Sim 自动孪生与随机化仿真：用VLM从真实演示视频里解析场景并生成USD资产，然后在Isaac Sim里对同一个动作序列跑10组物理参数随机化的前向动力学仿真（rollouts）。
  2. VPTwin-Core 仿真同步视频预测：把这10个时间对齐的仿真轨迹特征拼接起来作为上下文，喂给3D时空动力学模型去预测真实域的视频。同时用仿真器生成失败动作的数据做联合训练，防止模型预测时“盲目乐观”。
  3. 分阶段 Real-Sim-Real 规划闭环：VLM把任务拆成子阶段，提出候选动作后，先在Isaac Sim里仿真，再用VPTwin-Core生成真实视觉预测。两者一起当视觉验证器，不通过就迭代修正。
- **关键细节**: 
  - 输入输出：输入当前真实观测、14-D候选动作、10个时间对齐的仿真rollouts特征；输出未来10帧（H=10）的真实域视频。
  - 模型结构：基于IWS的两阶段架构。Stage 1训练CNN编码器E和一致性解码器D；Stage 2冻结它们，训练3D U-Net动力学模型，用FiLM融合动作特征。
  - 规模与超参：预测视野H=10，分辨率128x128，帧率15Hz；训练10^6步。
- **训练/优化目标**: Stage 1是图像重建损失；Stage 2是终端帧潜变量的均匀MSE损失（只对最后一帧做去噪回归）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：6个桌面操作任务（擦桌子、抓杯子、开抽屉等），分人工测量目录（548 episodes）和VLM自动构建（277 episodes）两种设置。
  - 对比对象（baseline）：视频预测对比 IWS；真实机器人规划对比 SIMPACT 和开环策略 π_0.5。
  - 测试环境：双臂 ALOHA (AgileX Piper arms)，静态第三人称相机。
- **评价指标**: 
  - 视频预测：MSE, LPIPS, FID, FVD, PSNR, SSIM, UIQI。
  - 规划：任务成功率（Success），以及评估验证器准确性的 Precision, Recall, F1-score。
- **主要结果**: 
  - 视频预测：VPTwin全面优于IWS。在VLM构建设置下，PSNR提升3.32 dB（25.64到28.96），LPIPS降低（0.310到0.259），长序列预测的物理幻觉大幅减少。
  - 规划性能：真机部署中，VPTwin在“抓杯子”成功率从SIMPACT的2/7提到3/7，“开合抽屉”达到完美的5/5（SIMPACT为2/5），开环π_0.5全部失败（0/7, 0/5）。
  - 验证器可靠性：SIMPACT纯靠仿真验证，误接受率极高（Precision仅0.33和0.67）；VPTwin的双域验证（仿真+视觉预测）直接消灭误接受，Precision和F1全满（1.00）。

**0. 论文标题**
- **英文标题**: SEES: A Self-Evolving Embodied System via Failure-Guided VLA Policy Adaptation
- **中文标题**: SEES：通过失败引导的VLA策略自适应实现自进化具身系统
- **研究机构**: 原文未提及
- **一句话总结**: 提出SEES框架，让VLA模型在部署后能通过自动统计长视野任务中的失败瓶颈，在仿真中恢复历史状态并利用LLM生成奖励函数进行针对性RL训练，从而无需额外专家演示即可实现策略的持续自进化。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长视野（long-horizon）机器人操作任务中的可靠性与泛化能力。
- **研究动机**: 现有VLA模型的训练数据偏向单阶段任务，导致长视野任务中某个薄弱的原子技能会引发全局失败。现有修复方法依赖专家人工诊断瓶颈并收集新演示数据，成本高昂且在机器人部署后难以持续。
- **本质改动**: 摒弃人工干预和额外演示收集，通过自动统计执行失败来定位瓶颈，利用LLM在仿真中恢复历史状态并生成稀疏奖励函数，通过在线RL联合更新共享的“技能族”适配器来实现自我进化。
- **技术溯源**: 基于现有的VLA基座模型（如 GR00T N1.5, RLDX-1），结合了大语言模型（如 GPT-5.6-Sol 用于生成奖励代码，Gemma 4 31B IT 用于任务分解）、强化学习（PPO）以及低秩自适应（LoRA）技术。

**2. 技术拆解**
- **核心方法**: SEES 包含三个核心闭环模块：1) 执行与瓶颈识别：通过附加的终止头判断子任务完成，统计失败频次定位最频繁的失败阶段作为瓶颈；2) 针对性RL任务构建：恢复该瓶颈发生前的历史仿真状态，用LLM生成稀疏奖励的成功判定函数；3) 技能族级策略进化：使用PPO联合训练共享的族级LoRA适配器，使相关技能共同受益。
- **关键细节**: 
  - 输入输出：输入为长视野指令和视觉观察，输出为原子任务序列及动作。
  - 系统架构：VLM规划器分解任务 -> 语言Agent路由到预定义的技能族 -> 共享VLA适配器执行 -> 终止头监控完成状态并归因失败。
  - 规模与超参：LoRA rank 设为 64 (RoboCasa) 或 8 (LIBERO)；PPO训练每轮分配 40 步（RoboCasa）或 32 步（LIBERO）。
- **训练/优化目标**: 
  - 终止头预训练：带软目标的掩码二元交叉熵（终止预测）和掩码L1回归（进度预测）。
  - RL优化目标：标准PPO截断目标函数 + Value regression + 辅助终止监督（权重0.05）。奖励为LLM生成的成功判定函数触发的稀疏奖励（首次确认完成时给1，否则为0）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboCasa365（包含Atomic, Composite-Seen, Composite-Unseen），LIBERO（Object, Spatial, Goal, Long四个suite）。
  - 对比对象（Baseline）：Base policy（原始SFT模型），SEES (execution only，仅执行无RL更新)，以及SEES经过1、2、3轮进化后的模型。消融实验对比了 Atomic-specific LoRA 和 Family-level LoRA，以及不同的瓶颈选择策略（Random, Highest-success）。
- **评价指标**: 任务成功率（Success rates, %）。原子任务评估单步完成，复合任务评估全流程完成。
- **主要结果**: 
  - RoboCasa365：经过3轮进化，GR00T N1.5 在 Composite-Unseen 上的成功率从 4.7% (exec only) 提升至 6.1%；RLDX-1 从 4.2% 提升至 7.1%。证明了向未见任务的迁移能力。
  - LIBERO：四个suite的平均成功率从 53.1% 提升至 65.4%。且未参与RL训练的“兄弟任务（sibling tasks）”成功率也显著提升，验证了技能族共享带来的正向迁移。
  - 消融实验：Family-level LoRA 整体成功率（76.4%）显著优于 Atomic-specific LoRA（71.2%）；基于失败频率的瓶颈选择策略（64%）远优于随机选择（28%）和选择最高成功率阶段（34%）。

### 32. 🔥 [DS-VLA: A Dendritic-inspired Vision-Language-Action Model for Robust Action Control] (DS-VLA：一种受树突启发的视觉-语言-动作模型，用于鲁棒动作控制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.32253` | [点击跳转](https://arxiv.org/abs/2609.32253)

**0. 论文标题**
- **英文标题**: DS-VLA: A Dendritic-inspired Vision-Language-Action Model for Robust Action Control
- **中文标题**: DS-VLA：一种受树突启发的视觉-语言-动作模型，用于鲁棒动作控制
- **研究机构**: 原文未提及
- **一句话总结**: 将生物神经元的树突计算和抑制性调节机制引入VLA模型的动作头，大幅提升了机器人在动作受到瞬时扰动时的闭环恢复能力和鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提高视觉-语言-动作（VLA）模型在闭环机器人控制中的鲁棒性，特别是当执行动作受到噪声或误差扰动导致物理状态偏离预期轨迹时的恢复能力。
- **研究动机**: 现有VLA模型在标准（无扰动）评估下表现很好，但一旦动作执行出现偏差（如执行器误差、意外接触），后续观测会偏离预期，现有模型往往无法有效调整内部状态并恢复任务，缺乏真正的闭环鲁棒性。
- **本质改动**: 抛弃传统的点神经元或纯Transformer/扩散动作头，借鉴生物神经元的树突区室化计算和抑制性中间神经元机制，设计了一种新的脉冲神经网络（SNN）动作头，通过局部时间积分和自适应抑制门来过滤扰动并保留任务上下文。
- **技术溯源**: 基于通用的视觉-语言基础模型接口（现有VLA框架），动作头部分借鉴了脉冲神经网络（SNN）和树突计算（Dendritic Computation）理论。

**2. 技术拆解**
- **核心方法**: 提出DS-VLA动作头，包含两个核心机制：1) 稀疏树突分支集成：每个躯体神经元配备多个稀疏连接的树突分支，每个分支具有独立学习的时间衰减因子，用于多时间尺度的特征处理；2) 神经元级共享抑制门：在信号进入树突前，为每个神经元计算一个依赖输入的抑制系数，共享给其所有树突分支，用于自适应抑制不可靠的状态更新（如扰动引起的异常），同时保留任务相关的历史信息。
- **关键细节**: 
  - **输入输出**：输入为视觉观察、语言指令和机器人状态历史（通过GRU和FiLM融合），输出为7维连续动作序列。
  - **模型结构**：动作头包含3层树突脉冲层，每层1536个神经元，每个神经元2个树突分支。树突状态汇总到躯体后，通过LIF（漏电积分触发）模型产生脉冲，最终通过膜电位的累积均值解码出连续动作。
  - **规模**：动作头参数量约 17.7M。
- **训练/优化目标**: 端到端优化，使用 L1 动作回归损失（L1 action regression loss）。没有使用额外的辅助门控、发放率或树突正则化损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO 的四个套件（Spatial, Object, Goal, Long），共 2000 个 episode。
  - **对比对象（baseline）**：OpenVLA-OFT, FAST, π0, GR00T。
  - **测试环境**：除了标准名义 rollout，还引入了统一的闭环动作扰动协议（注入高斯噪声、翻转夹爪、强制覆盖平移命令等，分 Difficulty 1/2/3 三个严重程度）。
- **评价指标**: 任务成功率（Success Rate, SR）。
- **主要结果**: 
  - **名义表现**：DS-VLA 平均成功率 91.6%，略低于 OpenVLA-OFT (97.1%) 等，但优于 GR00T (86.5%)，证明其具备合格的常规操作能力。
  - **扰动表现（核心亮点）**：在 Difficulty 1 扰动下，DS-VLA 平均成功率 87.35%，保留了 95.4% 的名义性能；而 OpenVLA-OFT、FAST、π0、GR00T 分别暴跌至 39.45%、23.90%、28.55% 和 30.75%。DS-VLA 比最强 baseline 高出 47.9 个百分点。
  - **消融实验**：移除抑制门后，名义和扰动性能分别下降 18.0 和 20.9 个百分点，证明了抑制机制对鲁棒性的关键贡献。
  - **效率**：动作头参数量和密集 MAC 计算量比 OpenVLA-OFT 少约 57.8%，在理想事件驱动假设下，算术能耗比 OFT 低 5.9 倍。

### 33. 🔥 [Federated Subspace Guided Vision-Language-Action Policy Distillation for Non-IID Multi-Robot Manipulation] (面向非独立同分布多机器人操作的联邦子空间引导视觉-语言-动作策略蒸馏)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.32239` | [点击跳转](https://arxiv.org/abs/2609.32239)

**0. 论文标题**
- **英文标题**: Federated Subspace Guided Vision-Language-Action Policy Distillation for Non-IID Multi-Robot Manipulation
- **中文标题**: 面向非独立同分布多机器人操作的联邦子空间引导视觉-语言-动作策略蒸馏
- **研究机构**: 原文未提及
- **一句话总结**: 提出FedDRMan框架，通过客户端的多模态子空间与动作蒸馏结合服务端的兼容性聚类与谱重平衡，解决了非IID多机器人联邦VLA训练中的表征漂移和更新冲突问题。

**1. 整体逻辑**
- **研究任务**: 在非独立同分布（Non-IID）的多机器人系统中，通过联邦学习协同训练视觉-语言-动作（VLA）操作策略，且不集中原始演示数据。
- **研究动机**: 现有联邦学习方法在处理多机器人VLA时，由于各机器人面临的任务和环境数据异构（Non-IID），本地行为克隆会导致多模态表征漂移（representation drift）；同时，直接聚合不兼容的模型更新会产生破坏性干扰，导致全局策略性能崩溃。
- **本质改动**: 摒弃传统的直接参数平均或简单的近端正则化，在客户端引入冻结教师指导的低秩子空间与动作蒸馏来锁住表征和策略的几何结构，在服务端根据更新方向的兼容性进行聚类，并对聚合后的权重进行谱重平衡以保留弱特征方向。
- **技术溯源**: 基于联邦学习（FL）、视觉-语言-动作（VLA）模型（如RT-2、OpenVLA等概念背景）、知识蒸馏、以及模型合并中的谱分析方法（spectral model-merging）。具体策略架构基于LIBERO基准的ResNet-T。

**2. 技术拆解**
- **核心方法**: FedDRMan（联邦子空间引导VLA策略蒸馏）框架。包含客户端的“子空间引导全局到本地蒸馏”和服务端的“兼容谱联邦聚合”两大模块。
- **关键细节**: 
  - **客户端（本地蒸馏）**: 服务器下发冻结教师模型。本地进行行为克隆（BC）时，加入多模态子空间蒸馏损失（对text, agent, wrist, joint, gripper 5种模态的特征做低秩SVD投影对齐，秩设为48）和动作分布蒸馏损失（KL散度），防止本地特征几何和动作输出偏离全局共享结构。
  - **服务端（兼容谱聚合）**: 
    1) 兼容更新聚合(CUA)：计算客户端从初始模型累积更新的余弦相似度，将更新方向兼容的客户端聚类，每个簇维护一个独立的全局模型，避免跨套件的不兼容更新直接混合。
    2) 谱重平衡(SRB)：对簇内聚合后的二维权重矩阵（如图像投影器、编码器、Transformer和策略头中的线性层）进行SVD，通过累积奇异值阈值（$\beta$ 设为0.85~0.90）截断并放大较弱的奇异值，防止有用的弱更新方向在聚合中被衰减。
- **训练/优化目标**: 客户端损失为 $\mathcal{L}_k = \mathcal{L}_{BC} + \sum \lambda_m \mathcal{L}_{sub}^m + \lambda_{act} \mathcal{L}_{act}$。服务端无显式损失函数，通过CUA聚类和SRB矩阵变换直接更新全局/簇模型参数。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO（包含Spatial, Object, Goal三个套件）。设置了同套件任务Non-IID（Dirichlet分布 $\alpha=0.5$ 划分）和跨套件任务与环境Non-IID（不同套件混合）两种异构场景。
  - **对比对象（Baseline）**: Centralized BC, Local BC, FedAvg, FedProx, FedKD, FedVLA。
  - **系统环境**: 闭环MuJoCo仿真，250步horizon，策略架构统一采用LIBERO ResNet-T（ResNet视觉编码器 + FiLM语言条件 + 时序Transformer + GMM动作头）。
- **评价指标**: 闭环仿真中的任务成功率（Success Rate, SR）。
- **主要结果**: 
  - **同套件Non-IID**: FedDRMan平均SR达到80.7%，比最强联邦基线FedAvg（69.1%）高出11.6个百分点。在Object和Spatial套件上分别达到88.0%和82.0%。
  - **跨套件Non-IID**: 优势极其显著。例如在Object-Goal设置下，Object和Goal的SR分别达到85.0%和70.0%，而FedAvg仅为18.0%和0.0%（直接崩溃）。
  - **消融实验**: 证明子空间对齐和动作蒸馏互补；CUA聚类不可或缺（去掉CUA会导致跨套件性能直接掉到0%）；SRB能在聚类基础上进一步提升性能。通信开销与FedAvg保持一致，无额外payload。

### 34. 🔥 [RecastVLA: From Past Interaction to Future Control with Adaptive Policy States] (RecastVLA：通过自适应策略状态从过往交互实现未来控制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.32155` | [点击跳转](https://arxiv.org/abs/2609.32155)

**0. 论文标题**
- **英文标题**: RecastVLA: From Past Interaction to Future Control with Adaptive Policy States
- **中文标题**: RecastVLA：通过自适应策略状态从过往交互实现未来控制
- **研究机构**: 原文未提及
- **一句话总结**: 在VLA模型的动作生成模块中引入跨层共享的测试时训练（TTT）快权重作为“执行记忆”，让机器人能记住已发生的交互状态，从而在长序列和弱观测任务中显著提升控制成功率。

**1. 整体逻辑**
- **研究任务**: 解决长序列机器人操作中的“执行记忆”问题，即让策略在视觉观测无法直接反映过去交互（如按钮已按下、遮挡、部分完成指令）时，仍能记住历史并指导后续动作。
- **研究动机**: 现有的记忆机制（如检索、压缩上下文）主要解决“提供什么历史信息”，但没解决“动作生成过程本身如何把经验转化为持久状态”。此外，现有的动作侧测试时训练（如RoboTTT）采用逐层局部（layer-local）的快权重，各层独立维护状态，缺乏跨层的信息共享与协同。
- **本质改动**: 把动作侧的测试时训练从“逐层独立维护状态”改成“跨层共享一个全局状态”。在生成动作时，所有网络层读取同一个固定的快权重；动作生成完后，用所有层和流匹配评估的特征共同算一次梯度，更新这个共享状态给下一步用。
- **技术溯源**: 基于 StarVLA/VLAct 代码库，视觉-语言骨干网络使用 Qwen3-VL-4B-Instruct，动作专家采用类似 GR00T 的 DiT-B 架构，结合了测试时训练（TTT）和流匹配（Flow-matching）动作生成机制。

**2. 技术拆解**
- **核心方法**: 
  1. 共享自适应策略状态：在动作专家内部维护一个小型MLP的快权重（fast weights）作为全局共享状态。
  2. 深度特定的读取接口：动作专家的每个交叉注意力层通过特定的线性投影和门控机制，将共享状态读取并注入到该层的潜在槽（latent slots）特征中。
  3. 联合写入与更新：单次策略调用（生成一个动作块）期间状态保持不变。调用结束后，收集所有访问深度和流匹配评估产生的特征，构建键值对，通过最小化拟合损失计算一次梯度下降，更新快权重。
- **关键细节**: 
  - 状态表示：一个两层MLP（256->512->256）的权重和偏置。
  - 读取机制：8个访问深度，每个深度使用32个宽度为768的潜在槽。读取时通过投影矩阵和门控标量将状态残差加到槽特征上。
  - 写入机制：对源特征使用停止梯度（stop-gradient），通过投影矩阵构建键值对。损失函数包含按流时间和访问深度加权的均方误差。
  - 训练与部署：训练时用长度为4的连续观测窗口，后续帧的动作损失通过状态转移反向传播，训练初始化、接口和更新规则。部署时仅更新快权重，无需专家动作标签。
- **训练/优化目标**: 
  - 外部目标：流匹配的动作预测损失（预测速度场），用于训练VLA骨干和动作专家的慢参数，以及通过状态转移训练TTT模块的慢参数。
  - 内部目标（快权重更新）：最小化快权重MLP预测值与源特征投影值之间的均方误差（自监督的测试时训练损失）。

**3. 实验结果**
- **实验设置**: 
  - 仿真基准：LIBERO, RoboTwin (Clean->Clean, Clean->Random), RoboDojo。
  - 真实机器人：12个任务，双臂 SOARM101 平台，55个训练任务（550个演示），评估12个未见过的变体任务。
  - 对比基线：$\pi_{0.5}$, X-VLA, Spatial Forcing, ABot-M0, Fast-WAM, OpenWAM-$\alpha$，以及内部训练的 Matched Base（关闭TTT的同架构基线）和 Layer-local TTT（逐层独立TTT基线）。
- **评价指标**: 任务成功率（Success Rate, %），以及归一化完成步数（Normalized Completion Steps, NCS，越低越好）。
- **主要结果**: 
  - 仿真表现：在RoboTwin Clean->Clean上，RecastVLA比Matched Base高10.68%（72.38% vs 61.7%）。在LIBERO平均提升2.30%，Long提升4.40%。在RoboDojo Memory上提升约5.3%。
  - 状态连续性验证：在RoboTwin上，保留状态比每次重置状态成功率高4.68%；导入相似任务状态比保留状态高2.22%，导入无关任务状态比重置状态低7.3%，证明状态连续性和先验经验的相关性缺一不可。
  - 共享机制验证：在单状态MLP架构下，RecastVLA（共享）比Layer-local TTT（8个独立状态，总容量大8倍）成功率高2.58%（72.38% vs 69.8%），证明共享设计优于局部独立设计。
  - 真实机器人：在12个任务上，RecastVLA平均成功率54.58%，显著优于 $\pi_{0.5}$ (42.50%) 和 Matched Base (30.83%)。特别是在需要弱可观测进度的任务（如按钮顺序按压T1-T3）上，优势极大（66.67% vs 23.33%）。
