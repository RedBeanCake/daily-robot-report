### 35. 🔥 [Find Something You Can't Do: Agentic Real-World Reinforcement Learning for Self-Improving VLA Models] (寻找你做不到的事：用于VLA模型自我改进的代理式真实世界强化学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.32069` | [点击跳转](https://arxiv.org/abs/2609.32069)

**0. 论文标题**
- **英文标题**: Find Something You Can't Do: Agentic Real-World Reinforcement Learning for Self-Improving VLA Models
- **中文标题**: 寻找你做不到的事：用于VLA模型自我改进的代理式真实世界强化学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FIND 框架，让 VLA 模型在真实世界中无需人工重置环境，通过 VLM 自主评估当前场景并挑选薄弱任务进行强化学习，实现低干预的持续自我改进。

**1. 整体逻辑**
- **研究任务**: 真实世界中视觉-语言-动作（VLA）模型的自主持续自我改进（无需人工频繁重置环境和提供奖励标签）。
- **研究动机**: 现有 VLA 模型多为冻结策略，无法从失败中学习；而真实世界强化学习（RL）受限于两大瓶颈：每次交互（rollout）后需人工重置物理环境，以及任务成功与否需要人工评估或特定的奖励设备。
- **本质改动**: 放弃传统的“每次交互后重置环境”思路，将自主练习转化为“场景条件化、性能感知的任务选择问题”。即利用上一次交互后产生的自然场景，让 VLM 判断当前能做什么，并挑出模型最不擅长的任务来练。
- **技术溯源**: 基于 $\pi_{0.5}$ VLA（作为冻结基座策略）、残差离策略强化学习（Residual off-policy RL）、以及视觉语言模型（VLM，如 GPT-5.6 Terra，用于场景理解和结果评估）。

**2. 技术拆解**
- **核心方法**: 提出 FIND 框架，构建了一个闭环的代理式系统，包含三个核心模块：场景条件化任务选择、性能感知课程学习、配对图像自我评估，并结合残差 RL 进行策略更新。
- **关键细节**: 
  - **场景条件化任务选择**：VLM 分析当前工作区视觉观察，从预定义任务库中推断当前场景下物理可行的任务子集。
  - **性能感知课程学习**：维护每个任务的近期成功率历史（滑动窗口 K=20），成功率越低的任务采样权重越高。结合场景可行性进行掩码和归一化，确保机器人只练“当前场景能做且自己不擅长”的任务。
  - **配对图像自我评估**：VLM 接收任务指令及执行前后的配对图像，输出二值成功/失败结果，用于更新课程和作为 RL 的稀疏奖励。
  - **残差 RL 与 Critic 门控**：冻结 $\pi_{0.5}$ VLA，训练轻量级残差策略输出动作修正量。使用 REDQ 风格的集成 Critic（10 个 Q 头），通过计算残差优势（Residual advantage）进行门控：若修正动作的 Q 值提升不大，则回退到基座 VLA 动作，防止策略退化。数据收集与训练异步进行。
- **训练/优化目标**: 残差策略的优化目标为基于混合离线演示和自主收集在线经验的 Actor-Critic 离策略强化学习。Critic 使用集成 Q 值均值进行 Actor 优化和执行门控。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：真实世界桌面环境，Franka Emika Panda 7轴机械臂配平行夹爪，两个 ZED X Mini 相机。包含 8 个可逆操作任务（如方块放入/拿出碗、叠/拆方块、开/关抽屉、挂/摘马克杯）。离线数据集包含 8 个任务各 50 个 episode（共约 6 万次 transition），用于微调基座 VLA 和初始化 replay buffer。
  - **对比对象 (baseline)**：微调后的基座 $\pi_{0.5}$ VLA，以及去除了“性能感知课程”和去除了“Critic 门控”的消融模型。
- **评价指标**: 独立人类评估的成功率（每 20k 步评估一次，每次 20 个 rollout），在线 VLM 评估的滚动成功率，以及自主运行统计（如人工干预次数、最长无干预运行时间）。
- **主要结果**: 
  - 在 8 个真实任务中，独立人类评估的平均成功率从基线的 55% 提升至 71.9%。在线 VLM 评估的滚动成功率达到 70.4%。
  - 在代表性的 6 小时自主交互运行中，完成 456 个 episode，仅需 30 次人工场景恢复干预（干预率 6.58%），最长无干预连续运行 48 分钟，且在线学习期间无需人工提供奖励标签。
  - 消融实验表明，去除性能感知课程或 Critic 门控均会导致性能提升显著变弱，证明自适应数据分配和保守的残差执行对自主真实世界学习的稳定性缺一不可。

- **中文标题**: RoGSW4RLD：用于机器人世界模型推演的前馈4D高斯提升
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种前馈4D高斯重建框架，通过融合机器人关节几何与运动学先验，将多相机同步视频直接重建为统一且时间可查询的度量4D高斯场，解决了多视角独立重建后融合导致的跨视角不一致问题。

**1. 整体逻辑**
- **研究任务**: 将多相机同步的机器人交互视频（真实录制或世界模型生成的推演视频）重建为统一的、时间可查询的度量4D高斯场景。
- **研究动机**: 现有的视频世界模型（如 Cosmos 3）能输出多视角同步视频，但缺乏共享的度量场景。若独立重建每个相机流再进行事后对齐（post-hoc alignment）合并，无法强制跨视角一致性；尤其在结合移动腕部相机和固定外部相机时，会导致几何和运动估计出现表面重复或冲突。
- **本质改动**: 不学习新的几何转移模型，而是直接重建视觉未来；核心在于将机器人特定的空间与运动先验（关节几何、手眼标定、正向运动学）直接集成到4D高斯场的联合形成过程中，替代传统的事后对齐策略。
- **技术溯源**: 基于 MoVieS（Stage 1 骨干网络）、VGGT、ReSplat（Stage 2 细化器）、Cosmos 3（视频世界模型）、DROID（机器人数据集）。

**2. 技术拆解**
- **核心方法**: 两阶段前馈架构。Stage 1 进行运动学条件度量的4D提升，联合多相机观测与机器人网格源锚定及正向运动学（FK）条件变形；Stage 2 进行保持位移不变的渲染反馈细化，利用源视图渲染反馈和跨时间共享的修正来优化几何和外观。
- **关键细节**: 
  - **输入输出**：输入为同步多视角RGB、相机内参与位姿、关节与夹爪状态、铰接机器人网格；输出为时间可查询的4D高斯场。
  - **Stage 1**：基于 MoVieS，用 LoRA 微调。在机器人支撑像素处使用网格深度代替预测深度进行源锚定（Source anchoring）；构建 FK 条件图，通过零初始化的卷积残差分支增强运动头的视觉位移预测。
  - **Stage 2**：基于 ReSplat。计算贡献加权渲染反馈，预测时间共享的位移修正，确保高斯中心在不同查询时间的相对位移严格不变。
  - **规模与超参**：推理时 Stage 2 进行 4 次细化更新；内部长度单位与米采用固定转换（3.5 units/m），无需逐场景缩放。
- **训练/优化目标**: 
  - **Stage 1**：渲染损失（MSE, LPIPS）、度量深度、3D轨迹、机器人 FK 一致性、不透明度覆盖率。
  - **Stage 2**：渲染、度量深度、机器人绝对位置、渲染运动、轨迹保持、覆盖率损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DROID（具体为 ILIAD 和 PennPAL 的 256 个 held-out episodes）。
  - **对比对象**：MoVieS, 4DGT, Shape of Motion (SoM)（这些 baseline 采用单目设置独立重建每个相机流，然后进行校准合并）。
  - **测试环境**：输入包括真实录制的观测和 Cosmos 3 生成的推演视频；评估相机包括左眼（输入）和右眼（新视角）。
- **评价指标**: 源视角和新视角的 PSNR, LPIPS, 深度 AbsRel；机器人位移误差 (Robot EPE, mm)；机器人深度误差 (Robot depth error, mm)；推理时间和显存。
- **主要结果**: 
  - 在真实观测上，相比最优 baseline（MoVieS），新视角 PSNR 提升 2.15 dB（16.08 vs 13.93），深度 AbsRel 降低 47%（0.197 vs 0.373），机器人位移误差降低 61%（8.6 mm vs 22.2 mm）。
  - 在 Cosmos 3 推演视频上同样取得显著提升（新视角 PSNR 15.52 vs 13.69，AbsRel 0.215 vs 0.404）。
  - 推理效率：Stage 1 耗时 0.59s，完整模型（含 4 次 Stage 2 细化）耗时 9.08s，全程使用固定权重前馈推理，无需逐场景优化（per-scene optimization）。

### 37. 🔥 [ActionUNet: Improving Robustness of VLA Models with Efficient Multi-scale Fine-tuning] (ActionUNet：通过高效的多尺度微调提升VLA模型的鲁棒性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34982` | [点击跳转](https://arxiv.org/abs/2609.34982)

**0. 论文标题**
- **英文标题**: ActionUNet: Improving Robustness of VLA Models with Efficient Multi-scale Fine-tuning
- **中文标题**: ActionUNet：通过高效的多尺度微调提升VLA模型的鲁棒性
- **研究机构**: 原文未提及
- **一句话总结**: 提出ActionUNet框架，通过在动作特征空间引入时间U-Net和条件SIREN连续解码器，以极低计算开销为预训练VLA模型注入多尺度时序先验并保证动作平滑性，显著提升机器人在复杂扰动环境下的操作鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的泛化能力，以及在杂乱或存在视觉/物理扰动环境下的执行鲁棒性。
- **研究动机**: 现有VLA模型将粗粒度多模态语义直接映射到细粒度物理动作时，存在“时间尺度不匹配”问题，导致模型过度依赖抽象语义而缺乏抵抗局部扰动的细粒度时序线索。此外，直接引入多尺度表示容易破坏动作的时间连续性，引发机械振荡和高频抖动。
- **本质改动**: 不在原始动作空间做离散的多尺度分解，而是在“时间对齐的动作特征空间”中构建多尺度融合模块，并配合连续隐式解码器强制保证输出轨迹的二阶平滑性。
- **技术溯源**: 基于预训练的VLA模型（如基于Flow-matching的 $\pi_{0.5}$ 和基于Regression的 OpenVLA-OFT），结合了U-Net架构和SIREN（Sinusoidal Representation Networks）隐式神经表示。

**2. 技术拆解**
- **核心方法**: ActionUNet框架。包含两个核心模块：1) 动作特征空间的时间U-Net，用于提取和融合多尺度时序结构先验；2) 条件SIREN连续动作解码器，用于将融合后的特征解码为平滑的连续动作轨迹。
- **关键细节**: 
  - **时间U-Net**：输入为VLA骨干输出的时间对齐动作特征。通过1D卷积进行下采样（降采样率 $r=2$），再通过上采样和Skip Connection恢复分辨率，输出融合多尺度信息的特征。
  - **条件SIREN解码器**：将动作块视为连续时间轴（$\tau \in [-1, 1]$）上的采样。为每个时间步的特征构建局部SIREN场，将归一化时间作为仿射变换的一部分注入到SIREN的每一层（替换静态偏置）。
  - **Matérn核聚合**：使用归一化的Matérn-5/2核函数对局部SIREN场进行加权聚合，强制实现二阶时间平滑（$C^2$ 连续），抑制高频抖动。
- **训练/优化目标**: 冻结预训练VLA骨干，仅微调ActionUNet。兼容两种目标：1) **回归模式**：使用 $\ell_1$ 损失监督预测动作与Ground Truth的偏差；2) **Flow-matching模式**：使用MSE损失预测条件向量场，且训练时采用基于Matérn-5/2核的时间相关噪声（Temporally Correlated Flow Noise）替代白噪声，以匹配解码器的平滑先验。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmark**：RoboTwin 2.0（仿真，12个双机械臂任务，分Easy/Hard设置）、LIBERO及LIBERO-Plus（仿真，包含7种环境扰动）、真实世界双机械臂实验（Realman Gen72平台，3个任务）。
  - **Baseline**：$\pi_{0.5}$、OpenVLA-OFT，以及RDT、$\pi_0$、ACT、DP3、Diffusion Policy、WorldVLA、SmolVLA、UniVLA、VLA-Adapter、OpenVLA、RTC等。
- **评价指标**: 平均成功率（Average Success Rate）。
- **主要结果**: 
  - 在RoboTwin 2.0的Hard设置下，$\pi_{0.5}$ + ActionUNet 相比 $\pi_{0.5}$ 平均成功率绝对提升 9.8%（从29.8%提升至39.6%）。
  - 在LIBERO-Plus（带扰动）上，平均成功率绝对提升 6.1%（从65.8%提升至71.9%）。
  - 在真实世界Hard设置下，平均成功率绝对提升 11.4%（从57.3%提升至68.7%）。
  - **兼容性**：在回归型的 OpenVLA-OFT 骨干上同样取得提升（LIBERO-Plus从60.9%提升至64.6%）。
  - **效率**：推理延迟增加极小，单次策略调用（policy call）延迟仅增加约 3.94 ms（+6.46%）。

**1. 整体逻辑**
- **研究任务**: 提升具身智能中世界动作模型（World Action Models, WAMs）在推理时的泛化能力与计算效率。
- **研究动机**: 现有 WAM 存在两难：显式范式（Explicit，推理时迭代去噪生成未来帧）泛化好但推理成本极高；隐式范式（Latent，推理时不生成未来帧）推理快，但在分布外任务中泛化能力断崖式下跌。推理时是否必须生成清晰的未来帧、以及未来建模究竟如何影响泛化，尚不明确。
- **本质改动**: 发现 WAM 的泛化收益并非来自清晰的未来视频帧，而是来自对纯噪声未来 token 的单次前向传播特征提取。据此摒弃耗时的迭代去噪过程，将推理时的未来条件化简化为单次纯噪声前向传播。
- **技术溯源**: 基于 Fast-WAM 架构，视频骨干网络使用预训练的 Wan2.2-5B（视频 DiT），动作专家由视频 DiT 插值初始化。评估基于 LIBERO、RoboTwin 2.0 和 LIBERO-Plus 等基准。

**2. 技术拆解**
- **核心方法**: 提出 Simple-WAM。推理阶段，视频专家仅对处于纯高斯噪声状态（flow time $\tau=1$）的未来视频 token 执行一次前向传播，提取特征供动作专家条件化，完全跳过迭代去噪。训练阶段，引入混合调度（Mixed Schedule），以概率 $p$ 直接采样 $\tau=1$，强化模型从纯噪声中提取有效时空特征的能力。
- **关键细节**: 
  - **输入输出**：输入当前观测、语言指令和本体状态，输出动作块（action chunk）。
  - **模型结构**：视频专家（Wan2.2-5B DiT）+ 动作专家（1B 参数，由视频 DiT 初始化）。
  - **规模与超参**：动作块 horizon $H=32$，每个块包含 9 帧视频；推理去噪步数 $K=10$，CFG scale=1.0；混合调度概率 $p=0.5$。
- **训练/优化目标**: 联合优化动作和视频的流匹配（Flow Matching）速度场损失（$\mathcal{L} = \mathcal{L}_{\mathrm{act}} + \lambda \mathcal{L}_{\mathrm{vid}}$）。视频损失在混合调度的 $\tau$ 上计算，其余设置与显式范式保持一致。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（分布内及任务泛化）、LIBERO-Plus（环境扰动，包含 7 种变化因素）、RoboTwin 2.0（双臂操作，数据效率与任务泛化），以及真实世界 AgileX Aloha 双臂平台。
  - **对比对象（Baseline）**：VLA 模型（$\pi_{0.5}$, VLA-Adapter），显式 WAM（Lingbot-VA, FastWAM-Joint），隐式 WAM（FastWAM）。
- **评价指标**: 成功率（Success rate, %），重点评估三个泛化维度：环境扰动鲁棒性、数据效率（少样本）、任务泛化（无视频/有动作无关视频）。同时评估单动作块推理延迟（Latency）。
- **主要结果**: 
  - **泛化性能**：Simple-WAM 在环境扰动下平均成功率达 79.5%（Explicit 为 67.7%，Latent 为 53.8%）；在数据效率和任务泛化上也全面优于 Latent，并超越 Explicit（在 8 项指标中 7 项领先）。在真实世界中，面对环境扰动保持 69.2% 成功率（Latent 仅 25.2%），利用无动作视频泛化到新任务达 87.8%（Explicit 为 68.9%）。
  - **效率**：推理延迟为 74.7 ms/chunk，比 Explicit（286.9 ms）快 3.8 倍，仅比 Latent（62.0 ms）慢约 1.2 倍，成功打破了泛化能力与推理效率之间的权衡。

### 39. 🔥 [LRC-JEPA: Disentangling Dynamics and Residual Context for Efficient World Models] (LRC-JEPA：解耦动态与残差上下文以实现高效世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34375` | [点击跳转](https://arxiv.org/abs/2609.34375)

**0. 论文标题**
- **英文标题**: LRC-JEPA: Disentangling Dynamics and Residual Context for Efficient World Models
- **中文标题**: LRC-JEPA：解耦动态与残差上下文以实现高效世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出LRC-JEPA，通过将紧凑的动态预测状态与仅用于重建的残差上下文解耦，解决了紧凑JEPA世界模型中动态与无关外观纠缠的问题，在极小参数量下大幅提升了无奖励视觉规划的性能与推理效率。

**1. 整体逻辑**
- **研究任务**: 在无奖励（reward-free）的离线交互数据中学习视觉世界模型，用于基于图像的潜在空间规划（image-goal latent planning）。
- **研究动机**: 现有的紧凑JEPA世界模型（如LWM）试图用单一低维潜在变量同时编码动作条件动态和可预测的视觉上下文。这种容量竞争会导致可控状态与高秩的无关外观（nuisance appearance）纠缠，随着场景变复杂，规划性能严重退化。
- **本质改动**: 引入功能路由架构，将信息解耦到两个表示中：仅用于动态传播和规划的紧凑预测潜在变量 $\mathbf{z}$，以及仅用于训练时重建的残差上下文嵌入 $\mathbf{u}$，从而让 $\mathbf{z}$ 专注于控制相关的动态，摆脱外观干扰。
- **技术溯源**: 基于JEPA（Joint-Embedding Predictive Architecture，如LeJEPA、LWM）、Vision Transformer (ViT)、最优表示理论（Achille-Soatto criteria）。

**2. 技术拆解**
- **核心方法**: 设计双分支潜在表示与交叉注意力重建解码器。共享ViT编码器提取特征后，通过class token投影得到预测潜在变量 $\mathbf{z}$，通过可学习查询（learned queries）注意力池化所有patch token得到残差上下文 $\mathbf{u}$。$\mathbf{z}$ 输入因果Transformer进行动作条件预测，而 $\mathbf{u}$ 和 $\mathbf{z}$ 共同输入交叉注意力解码器重建图像patch。推理时只加载 $\mathbf{z}$ 相关模块。
- **关键细节**: 
  - **输入输出**: 输入为图像序列和动作，输出为规划用的单帧紧凑潜在状态 $\mathbf{z}$。
  - **模型结构**: ViT-Tiny编码器（12层，隐藏维度192），6层因果Transformer预测器，3层交叉注意力重建解码器。
  - **规模**: 活跃编码器仅 5.5M 参数（推理时不加载 $\mathbf{u}$ 和解码器）。
  - **关键超参**: 残差上下文查询数 $Q$（消融实验中1到16），损失权重 $(\lambda_z, \lambda_u, \lambda_{rec}) = (0.05, 0.05, 0.2)$。
- **训练/优化目标**: 联合优化四个损失：1) 单步潜在预测损失 $\mathcal{L}_{pred}$（MSE）；2) SIGReg防崩溃正则化 $\mathcal{L}_{SIG}$；3) 时间VICReg风格的上下文正则化 $\mathcal{L}_u$（鼓励 $\mathbf{u}$ 轨迹内稳定、轨迹间变化）；4) Patch重建损失 $\mathcal{L}_{rec}$。通过保留 $\mathbf{z}$ 到解码器的可微残差连接（不阻断梯度），迫使 $\mathbf{z}$ 保留互补的动态信息。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 4个模拟控制环境（Push-T, Reacher, TwoRoom, Cube）和真实世界机器人数据集 Bridge-v2。
  - **对比对象（baseline）**: 参数匹配的 LWM (5.5M)，以及更大的预训练模型 V-JEPA2-GAP-AC (303.9M)、DINO-WM (22.1M)、PLDM、C-JEPA、EB-JEPA。
- **评价指标**: 
  - 模拟环境：基于交叉熵方法（CEM）的图像目标规划成功率（Success rate）。
  - Bridge-v2：离线专家动作恢复的 Recall@1/5/10 和专家动作排名百分位（rank percentile，越小越好）。
  - 辅助指标：物理量探测（Probes）的MSE和Pearson相关系数，重建干预的PSNR/SSIM。
- **主要结果**: 
  - **规划性能**: 在4个模拟环境中，比参数匹配的 LWM 平均规划成功率提高 9个百分点（9pp）。在 Bridge-v2 上，Recall@1/5/10 达到 0.38/0.64/0.72，显著优于 V-JEPA2-GAP-AC (0.36/0.54/0.62) 和 DINO-WM (0.34/0.54/0.58)；专家动作排名百分位从 LWM 的 0.286 降至 0.061（控制性能提升38%）。
  - **参数与效率**: 活跃参数仅 5.5M（V-JEPA2为303.9M，DINO-WM为22.1M）。平均完整规划时间 0.45s，比 DINO-WM (57.56s) 快两个数量级，比 V-JEPA2 (0.83s) 也快近一倍。
  - **解耦验证**: 物理量探测证实 $\mathbf{z}$ 更好地预测关节位置/速度等运动学量，$\mathbf{u}$ 更好地预测偏航角等缓慢变化量；重建干预证实打乱 $\mathbf{z}$ 会严重破坏图像结构（PSNR降至17.38），而轨迹内打乱 $\mathbf{u}$ 影响极小，证实了动态与上下文的有效分离。

### 40. 🔥 [Text-Vision Synergistic Token Caching: A Training-Free Framework for Efficient Vision-Language-Action Inference] (文本-视觉协同Token缓存：一种用于高效视觉-语言-动作推理的免训练框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34319` | [点击跳转](https://arxiv.org/abs/2609.34319)

**0. 论文标题**
- **英文标题**: Text-Vision Synergistic Token Caching: A Training-Free Framework for Efficient Vision-Language-Action Inference
- **中文标题**: 文本-视觉协同Token缓存：一种用于高效视觉-语言-动作推理的免训练框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出免训练框架TVCache，利用文本-视觉协同效应过滤注意力头并选择稳定复用层，在极低Token保留率下大幅提升VLA模型的推理效率与任务成功率。

**1. 整体逻辑**
- **研究任务**: 加速视觉-语言-动作（VLA）模型的推理过程（具体为基于Token缓存的推理加速）。
- **研究动机**: 现有VLA Token缓存方法未充分利用“文本引导视觉”的归纳偏置，导致两个问题：1）Token级别：无差别聚合所有注意力头会引入背景噪声，造成任务相关Token选择的空间错位；2）层级别：在不稳定的网络层复用缓存会传播噪声，而在稳定层之后复用又会导致冗余计算（即深度不匹配）。
- **本质改动**: 引入文本-视觉协同先验，在Token级别通过评估注意力头的信息焦点来过滤劣质头以精准定位任务区域，在层级别通过计算跨模态熵差异来选择稳定的网络层进行缓存复用。
- **技术溯源**: 基于现有的VLA模型（如OpenVLA-OFT、BitVLA、π0.5、VLA-Adapter）以及Token缓存范式（如VLA-Cache）。

**2. 技术拆解**
- **核心方法**: 提出TVCache框架，包含两个核心机制：1）文本-视觉信息焦点驱动的注意力头过滤机制（解决Token级空间错位）；2）文本-视觉熵差异引导的复用层选择机制（解决层级深度不匹配）。
- **关键细节**: 
  - **Token级别**：提取文本到视觉的交叉注意力，计算每个注意力头的“语义响应强度”和“注意力熵”。通过线性组合两者对注意力头打分，筛选出高质量头来评估视觉Token的任务相关性，从而剔除任务相关Token，保留静态Token用于缓存。
  - **层级别**：计算每层文本到视觉注意力的Shannon熵，熵越低代表层越稳定。通过带最小间隔约束的贪心算法，选出K个最稳定的层进行缓存复用，并为不同层分配深度感知的保留比例（浅层激进剪枝，深层逐渐恢复至全保留）。
  - **关键超参**：头打分权重α=β=0.5，复用层数K=4，层间最小间隔d_min=2，各层保留比例γ=[0.5, 0.65, 0.8, 1.0]。
- **训练/优化目标**: 本文是免训练（Training-free）方法，无损失函数。核心机制依赖基于注意力分布统计特性的启发式规则（即最大化注意力头选择得分和层稳定性得分）来进行Token和层的筛选。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真基准LIBERO和CALVIN（Split ABC→D设置）；真实机器人任务（Franka Research 3机械臂，4个操作任务）。
  - **对比对象（baseline）**：FastV、SparseVLM、DivPrune、VLA-Cache。
  - **测试模型**：OpenVLA-OFT、BitVLA、π0.5、VLA-Adapter。
  - **测试环境**：NVIDIA RTX 4090 GPU，BF16精度，batch size为1。
- **评价指标**: 任务成功率（%）、计算量（FLOPs, T）、控制频率（Hz）、端到端推理延迟（ms）。
- **主要结果**: 
  - 在相同Token保留率下，TVCache全面优于baseline。在OpenVLA-OFT上，12.5%保留率时，平均成功率从VLA-Cache的69.5%提升至84.0%（提升14.5个百分点），相比全Token推理FLOPs降低2.45倍，延迟从95.87ms降至66.51ms（控制频率从10.43Hz提至15.04Hz）。
  - 在BitVLA上，12.5%保留率下成功率达93.9%，持平全Token基线。
  - 在π0.5和VLA-Adapter上同样表现优异（如VLA-Adapter在25%保留率下成功率从48.35%升至54.40%）。
  - 真实机器人部署中，12.5%保留率下SetKettle任务仍保持87%成功率。
  - 额外开销极低，TVCache引入的固定路由开销仅约2.84-2.89ms。

### 41. 🔥 [Dexterous Tactile World Model] (灵巧触觉世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.34286` | [点击跳转](https://arxiv.org/abs/2609.34286)

**0. 论文标题**
- **英文标题**: Dexterous Tactile World Model
- **中文标题**: 灵巧触觉世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种将双手触觉信号通过空间对齐注入视频扩散Transformer的世界模型，解决了纯视觉预测中手部接触和运动难以准确预测的问题。

**1. 整体逻辑**
- **研究任务**: 根据第一人称视角的历史视频和双手触觉信号，预测未来人类操作过程的视频帧。
- **研究动机**: 纯视觉世界模型在预测操作时，很难看清手部遮挡和接触细节，导致预测的手部经常变形或运动幅度不够。现有的视觉-触觉模型存在“索引不匹配”问题：触觉信号是按皮肤区域索引的，而视频模型是按图像像素索引的，两者没有对齐到图像中手部的实际物理位置。
- **本质改动**: 利用手部骨架计算出每只手在图像中的具体位置，用高斯分布将触觉信号作为残差，精准注入到视频Transformer对应位置的视频token中，实现触觉和视觉的空间对齐。
- **技术溯源**: 基于预训练的 flow-matching 视频扩散 Transformer（Wan2.2-Fun-5B-InP），结合了因果视频自编码器和 umt5-xxl 文本编码器。

**2. 技术拆解**
- **核心方法**: 设计了一个零初始化的触觉残差注入模块。将每只手的触觉信号（压力和手指弯曲）嵌入后，根据手部在图像中的投影位置生成高斯足迹（Gaussian footprint），在 Transformer 的特定层将触觉特征按高斯权重叠加到视频 token 上。
- **关键细节**: 
  - **输入**：13帧历史RGB视频、双手触觉信号（21x21压力网格）、手部3D骨架投影、任务文本指令。
  - **模型结构**：30层 Transformer，隐藏层维度 3072。
  - **注入机制**：在 30 个 block 中的 5 个（0, 6, 12, 18, 24）进行注入。高斯足迹标准差设为 $\sigma=1.8$ 并做归一化，保证注入质量不受 $\sigma$ 影响，且手部未检测到时贡献为零。
  - **因果掩码**：预测帧只能看到历史帧，看不到未来的手部位姿或触觉，符合实际部署场景。
- **训练/优化目标**: 使用 Flow-matching loss。冻结视频自编码器和文本编码器，用 rank-64 的 LoRA 微调 Transformer 主干，全秩训练触觉嵌入和注入模块。在 loss 计算时，对预测帧的手部区域给予更高的空间权重。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：EgoTouch（包含第一人称操作视频和同步的双手压力手套数据）。
  - **Baseline**：1) 架构、参数量和训练完全一致的纯视觉模型（触觉输入置零）；2) 三种现有的视觉-触觉世界模型（TouchWorld, VT-WM, FeelWorld），在相同 backbone 和数据下对比其触觉条件注入机制。
- **评价指标**: LPIPS（全帧和手部裁剪区域），手部轮廓 IoU，光流方向一致性等。
- **主要结果**: 
  - 相比纯视觉 baseline，手部运动低估从 23% 降至 9%，手部区域感知误差（LPIPS_hand）降低 7.4%。
  - 预测优势随时间步增加，后期预测 chunk 的改进幅度是首个 chunk 的约 4.1 倍。
  - 全面优于其他三种视觉-触觉 baseline（LPIPS 降低 1.8% 到 14.7%）。
  - 消融实验表明，触觉信号的压力大小和空间位置缺一不可，退化为二值接触状态会导致误差上升。
  - 即使推理时不提供触觉信号，训练时加入触觉也能提升纯视觉预测的质量。

**1. 整体逻辑**
- **研究任务**: 加速基于视觉世界模型的机器人模型预测控制（MPC）规划，降低推理延迟和显存峰值，使其能部署在资源受限的平台上。
- **研究动机**: 现有的视觉世界模型（如 DINO-WM）在 MPC 中需要密集传播所有视觉 token 并采样大量动作序列，导致计算和显存开销巨大。现有的稀疏加速方法要么盲目丢弃 token 导致丢失关键规划信息，要么引入沉重的辅助模块和繁琐的多阶段训练。
- **本质改动**: 将计算资源从“全局密集”转变为“按需分配”，精准聚焦于“预测相关的潜在区域（前景 token）”和“有希望的动作序列（精英轨迹）”，用轻量级机制替代昂贵的全局交互。
- **技术溯源**: 基于 DINO-WM（使用冻结的 DINOv2 提取 patch 特征）和 CEM（交叉熵方法）规划器。

**2. 技术拆解**
- **核心方法**: 提出三层计算限定（Scoped Computation）机制：1) DRS（蒸馏相关性选择）筛选关键 token；2) FDBU（前景-delta 背景更新）轻量级更新背景 token；3) EB-CEM（精英库 CEM）优化轨迹搜索的采样预算分配。
- **关键细节**: 
  - **DRS (Token级)**：利用全 token 教师模型的梯度乘输入（gradient-times-input）得分作为软目标，蒸馏出一个极轻量的动作条件 MLP 选择器。推理时直接选出 Top-K 个前景 token 进行完整预测。
  - **FDBU (动力学级)**：仅对选出的 K 个前景 token 运行完整的 6 层因果 Transformer 动力学预测。对于剩余的背景 token，计算前景状态和前景变化（delta）的平均池化摘要，通过轻量级 MLP 和门控机制进行残差更新，彻底省去背景与前景之间密集的 token-to-token 注意力计算。
  - **EB-CEM (规划级)**：在初始 MPC 步骤分配较大的采样种群（如 300），将找到的最优动作序列存入持久化的“精英库”；在后续 MPC 步骤减少采样种群（如 100），并抽取部分样本在精英库序列附近进行局部高斯扰动细化，平衡局部开发与全局探索。
  - **规模与超参**：DINOv2 ViT-S/14 提取 196 个 patch token；DRS 选择器仅为 token-wise 小 MLP；FDBU 使用简单的 LN-Linear-GELU/Sigmoid 结构。
- **训练/优化目标**: 极简的两阶段训练。第一阶段：一次性（one-off）蒸馏 DRS 选择器（最小化 KL 散度）。第二阶段：单阶段联合训练稀疏动力学预测器和 FDBU（使用全网格 MSE 损失同时监督前景预测和背景残差更新）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：5 个视觉规划任务（PointMaze, Wall, Push-T, Rope, Granular），使用 DINO-WM 的离线数据集，涵盖导航、刚体操作和柔性/多体动力学。
  - **对比对象 (Baseline)**：Dense DINO-WM, IRIS, DreamerV3, Sparse Imagination。
  - **测试环境**：刚性任务在单张 NVIDIA V100 上评估，柔性任务在单张 RTX 2080 Ti 上评估。
- **评价指标**: 任务成功率 (SR, ↑) 或 Chamfer Distance (CD, ↓)；效率指标包括转移模型 FLOPs、规划时间 (Planning time, ↓) 和峰值 GPU 显存 (Peak GPU memory, ↓)。
- **主要结果**: 
  - 在 Push-T 任务上，Scope-WM (Faster, K=32) 将峰值显存和规划时间分别降至 Dense DINO-WM 的 18.1% 和 14.3%，实现 6.97× 的规划加速，成功率保持在 88%（Dense 为 90%）。
  - Scope-WM (Fast, K=98) 在将显存和规划时间降至 38.4% 和 38.6%（2.59× 加速）的同时，成功率反而提升至 94%。
  - 在 5 个跨任务评估中，Scope-WM 在大幅降低计算开销的同时，保持了与 Dense DINO-WM 相当甚至更好的规划性能（如在 PointMaze 达到 100% SR，在 Granular 上 CD 降至 0.22）。
  - 消融实验证实，DRS 决定了计算分配的上限，FDBU 弥补了背景信息丢失，EB-CEM 则通过复用早期优质轨迹进一步压榨了规划效率，三者缺一不可。

### 43. 🔥 [Train Together or Merge Later? Unifying VLA Experts via a Shared Action Interface] (联合训练还是延后合并？通过共享动作接口统一VLA专家)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.33125` | [点击跳转](https://arxiv.org/abs/2609.33125)

**0. 论文标题**
- **英文标题**: Train Together or Merge Later? Unifying VLA Experts via a Shared Action Interface
- **中文标题**: 联合训练还是延后合并？通过共享动作接口统一VLA专家
- **研究机构**: 原文未提及
- **一句话总结**: 提出 PolicyWeave 方法，通过冻结 VLA 模型的共享动作接口并仅微调隐藏层 LoRA，结合上下文引导的稀疏合并，解决了独立训练的多任务专家在模型合并时因动作接口不一致导致的性能崩溃问题。

**1. 整体逻辑**
- **研究任务**: 将独立进行任务特定后训练（SFT/RL）的多个 VLA（视觉-语言-动作）模型专家，在不进行联合重训练的情况下，合并为一个多任务策略。
- **研究动机**: 现有的模型合并方法直接应用到 VLA 上效果很差。原因是任务特定的后训练会改变“动作接口”（包括动作归一化统计量、动作编码器和解码器）。独立训练的专家会在隐藏层参数中补偿这种接口变化，一旦直接合并参数，这种补偿机制就会被破坏，导致输出动作严重偏离。
- **本质改动**: 强制所有专家在微调时共享基础模型的动作接口（冻结归一化、编码器和解码器），仅更新动作模型隐藏层的 LoRA 参数；并在推理时利用初始视觉-语言上下文进行无梯度的专家打分与稀疏合并。
- **技术溯源**: 基于 GR00T N1.5（VLA 基座模型）、LoRA（参数高效微调），以及现有的模型合并方法（如 WA, TIES, TSV-Merge 等）。

**2. 技术拆解**
- **核心方法**: PolicyWeave 框架，包含两个核心模块：1) 兼容合并的 VLA 后训练协议；2) 上下文引导的稀疏合并机制。
- **关键细节**: 
  - **后训练协议**：冻结 VLM、动作编码器、动作解码器和归一化统计量，仅在动作模型的隐藏层（如 120 个线性模块）训练 rank-8 的 LoRA。这保证了所有专家的输出映射和输入表示完全一致。
  - **稀疏合并机制**：利用初始观察和指令编码的视觉-语言上下文，计算每个专家 LoRA 更新对上下文 Key 投影的响应得分（归一化后的 Frobenius 范数比值）。通过 leave-one-layer-out（留一法）检验排序稳定性，动态决定是选择单一专家还是合并 Top-k 个专家。合并后的参数在整个 episode 中固定。
- **训练/优化目标**: 
  - **SFT 阶段**：Flow-matching 目标。
  - **RL 阶段**：PPO actor-critic 优化，结合 Flow-SDE 动作对数概率。
  - **合并阶段**：无额外训练，基于上下文响应的无梯度打分与加权平均。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：RoboCasa365（18 个原子任务，测试 SFT 和 RL 增益保留），LIBERO-10（10 个长视野任务，测试长序列控制能力），以及真实机器人 AgileX Piper 臂（4 个操作任务）。
  - **对比对象（Baseline）**：Co-training（联合训练），静态合并方法（WA, TIES, ISO-CTS, TSV-Merge, SSR-Merge），以及 MergeVLA 和 CORAL。
- **评价指标**: 任务成功率（Success rate, %）；对于 LIBERO-10 增加了部分成功率（Partial success，即单集内同时满足的目标谓词的最大比例）。
- **主要结果**: 
  - **接口共享的收益**：保持共享动作接口使 4 种静态合并方法的平均成功率从 17.0% 提升至 52.8%。
  - **RoboCasa365**：PolicyWeave 的 SFT 专家合并成功率达 64.7%，SFT+RL 后达 74.1%，优于联合 RL 的 60.7%，且接近独立专家的上限（76.2%），证明独立 RL 的增益能被有效保留。
  - **LIBERO-10**：PolicyWeave 最终成功率 75.4%，部分成功率 86.4%，保留了 93.3% 的独立专家能力（对比 MergeVLA 的 79.0%）。
  - **真机部署**：在 AgileX Piper 臂上，PolicyWeave 平均成功率 67.5%，优于 GR00T N1.5 联合训练的 42.5%。

### 44. 🔥 [Metro-WM: Long-Horizon Latent Planning with Realisable Sub-Goals] (Metro-WM：基于可实现子目标的长视野潜在规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.31868` | [点击跳转](https://arxiv.org/abs/2609.31868)

**0. 论文标题**
- **英文标题**: Metro-WM: Long-Horizon Latent Planning with Realisable Sub-Goals
- **中文标题**: Metro-WM：基于可实现子目标的长视野潜在规划
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作指出基于JEPA的层次化规划中“生成”的潜在子目标在物理上不可实现，于是提出Metro-WM，改用图检索的方式从历史轨迹中直接提取真实帧作为子目标，在长视野任务中大幅提升了成功率并砍掉了宏观规划器的训练成本。

**1. 整体逻辑**
- **研究任务**: 解决基于联合嵌入预测架构（JEPA）的潜在空间模型预测控制（MPC）在长视野（long-horizon）目标到达任务中规划失效的问题。
- **研究动机**: 现有的层次化JEPA方法让宏观规划器在潜在空间里“生成”中间子目标给微观规划器。但作者发现这种无约束的生成有根本缺陷：生成的子目标向量往往落在真实物理状态编码的流形之外（即物理上不可实现），导致微观规划器执行时偏离目标。
- **本质改动**: 放弃在潜在空间里“生成”子目标，改为从离线历史经验（专家演示或随机轨迹）中“检索”真实的观测帧作为子目标。通过构建状态图并跑最短路径搜索，从根本上保证子目标的物理可实现性。
- **技术溯源**: 基于 JEPA 框架，具体使用了开源的 LeWM (LeWorldModel) 和 PLDM 作为冻结的微观规划器基座。

**2. 技术拆解**
- **核心方法**: 提出 Metro-WM 框架。把离线数据集建成一个加权图，顶点是历史观测帧的潜在编码。边分两种：同 episode 内的时间边（代价为1帧），和跨 episode 视觉相似帧的桥接边（代价通过经验分位数换算成帧数）。宏观规划器从目标节点反向跑 Dijkstra 算全局最短路径；在线执行时，把当前观测动态接入图里，沿着最短路径在微观规划器的视野预算（waypoint budget）内，挑最远的节点作为子目标。
- **关键细节**: 
  - 输入输出：输入是离线轨迹数据集、目标观测和当前观测；输出是微观规划器能直接用的物理真实子目标。
  - 模型结构：Metro-WM 的宏观规划器是完全非参数化（non-parametric）且免训练的。微观规划器采用基于 ViT-tiny 编码器（输出192维潜在状态）和自回归 Transformer 预测器的架构。
  - 关键超参：主要超参只有微观规划器的规划步长 $h$ 和宏观的航点预算 $H$。桥接边的搜索半径和分位数被固定，省去了大量调参工作。
- **训练/优化目标**: Metro-WM 本身不需要梯度训练，只需离线预处理（编码数据集、建图、算边权重）。微观规划器使用交叉熵方法（CEM）进行采样优化，目标是最小化预测的潜在状态与给定子目标之间的 L2 距离。

**3. 实验结果**
- **实验设置**: 
  - 数据集：PushT, OGBench-Cube, TwoRoom, Reacher。
  - 对比对象（baseline）：平坦微观规划器（LeWM, PLDM），以及层次化 LeWM 变体（Hi-LeWM, Hi-LeWM-C, Hi-LeWM-C staged）。
  - 测试环境与负载：在4个基准上评估不同目标距离（d=25, 50, 75帧），并对比不同求解器计算预算（T）下的性能。
- **评价指标**: 任务成功率（Success rate）、在线推理延迟（Wall clock latency）、离线计算成本（Offline compute cost），以及作者提出的用于评估子目标物理可实现性的“可实现性残差”（realisability residual）。
- **主要结果**: 
  - 在长视野（d=75）下，Metro-LeWM 比最优层次化 baseline (Hi-LeWM-C) 的成功率最高提升 37.33 个百分点（TwoRoom），同时推理速度快 2.2 到 10.9 倍。
  - 离线成本极低：Metro-WM 建图仅需 9-39 分钟（单GPU），而训练 baseline 的宏观规划器需要 13-56 倍的 GPU 时间。
  - 分析表明，Metro-WM 通过拼接多条轨迹，找到的路径通常比离线专家演示更短（到达率 < 1）；其动态重新进入图（re-entry）的机制能有效抵抗微观规划器的执行误差；在仅使用 1% 轨迹的极稀疏数据下依然保持鲁棒。

### 45. 🔥 [PanoFuse: Panorama-Enhanced Vision-Language-Action Learning with Decoupled Semantic-Geometric Routing] (PanoFuse：基于解耦语义-几何路由的全景增强视觉-语言-动作学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.31717` | [点击跳转](https://arxiv.org/abs/2609.31717)

**0. 论文标题**
- **英文标题**: PanoFuse: Panorama-Enhanced Vision-Language-Action Learning with Decoupled Semantic-Geometric Routing
- **中文标题**: PanoFuse：基于解耦语义-几何路由的全景增强视觉-语言-动作学习
- **研究机构**: 原文未提及
- **一句话总结**: 引入360度全景视觉弥补VLA模型局部视野的缺陷，并设计解耦路由机制分离全局语义与几何特征，显著提升了机器人在遮挡和复杂环境下的操作成功率。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作（根据自然语言指令控制机械臂完成抓取、放置等任务）。
- **研究动机**: 现有VLA模型依赖窄视角相机，只能看到局部工作区。在遇到视觉遮挡、干扰物或跨工作区任务时，容易丢失目标的全局空间上下文，导致操作失败。
- **本质改动**: 用360度全景相机提供全局视野，并设计DSGR（解耦语义-几何路由）机制。把全景特征拆成语义和几何两条独立的信息流，通过结构化注意力机制分别喂给下游的状态和动作模块，避免异构特征直接混合带来的干扰。
- **技术溯源**: 基于预训练的 $\pi_0$ VLA框架（包含PaliGemma和Gemma），全景特征提取基于冻结的 DAP (Depth Any Panoramas) 模型。

**2. 技术拆解**
- **核心方法**: 
  1. **全景表征提取**：用DAP模型从全景RGB图中分别提取语义特征（来自DINO backbone）和几何特征（来自深度解码器中间层），池化后投影到VLM的嵌入空间。
  2. **解耦语义-几何路由 (DSGR)**：将多模态token分为四个功能块（语义上下文、几何上下文、状态上下文、动作上下文）。通过一个固定的块级可见性矩阵（Attention Mask），禁止语义和几何块直接互相Attention，但允许状态和动作块同时访问这两者。
- **关键细节**: 
  - **输入输出**：输入为局部腕部RGB图、360度全景RGB图（等距圆柱投影，1024x512）、机器人本体状态和语言指令；输出为未来50步的连续动作块（6个关节角+1个夹爪控制）。
  - **模型结构**：全景语义特征投影为 64x1024，几何特征投影为 64x256。动作专家使用Gemma-300M，基于Flow Matching生成动作。
  - **规模与超参**：训练20K步，batch size为4，使用bfloat16精度，单张RTX 3090即可训练和推理。
- **训练/优化目标**: 沿用 $\pi_0$ 的条件流匹配（Conditional Flow-Matching）目标。在DSGR的token级注意力掩码下，最小化预测速度（velocity）与真实速度之间的L2距离。全景特征离线预计算并保持冻结，不增加训练开销。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建 PanoFuse-Data，包含4个真实操作任务（前取后放、后取前放、抓取放置、连续杯子插入），200条遥操作轨迹，超10万同步帧。硬件采用 AgileX Piper 机械臂 + Insta360 X5 全景相机 + RealSense 腕部相机。
  - **对比基线**：$\pi_0$-base、$\pi_0$-fast，以及直接输入全景图的 $\pi_0$-base w/ Pano、$\pi_0$-fast w/ Pano。
  - **评估场景**：4个标准任务 + 3个泛化设置（新物体、未见背景、多干扰物）。
- **评价指标**: 真实机器人闭环评估的任务成功率（每个设置10次试验，要求全程无人工干预）。
- **主要结果**: 
  - PanoFuse 在7个设置下的平均成功率达到 52.9%，大幅超越 $\pi_0$-base (28.6%) 和 $\pi_0$-fast (30.0%)。
  - 在3个泛化设置中，所有基线成功率均为0%，而PanoFuse分别达到50.0%、40.0%、40.0%，抗干扰和泛化能力极强。
  - 消融实验证明：直接喂全景原图效果很差（仅12.9%），证明DSGR路由的必要性；只用语义或只用几何特征效果也大打折扣（22.5%和20.0%）；全景视野（FoV）从70度扩大到360度时，泛化性能从6.7%提升至43.3%，验证了全局上下文的价值。
