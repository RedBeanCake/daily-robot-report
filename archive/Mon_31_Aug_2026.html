            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Do Robotic World Models Really Follow Actions? Diagnosing and Aligning Action-Conditioned Generation for Policy Learning] (机器人世界模型真的能跟随动作吗？诊断并对齐用于策略学习的动作条件生成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.24885` | [点击跳转](https://arxiv.org/abs/2608.24885)

**0. 论文标题**
- **英文标题**: Do Robotic World Models Really Follow Actions? Diagnosing and Aligning Action-Conditioned Generation for Policy Learning
- **中文标题**: 机器人世界模型真的能跟随动作吗？诊断并对齐用于策略学习的动作条件生成
- **研究机构**: 原文未提及
- **一句话总结**: 提出了评估机器人世界模型在非专家动作下跟随能力的基准 WorldEcho，并设计了通过扩大动作覆盖、中间表征锚定和干预效应对齐来提升生成忠实度的训练方法 WorldSync。

**1. 整体逻辑**
- **研究任务**: 评估并提升动作条件机器人世界模型（AC-WMs）在策略学习（特别是策略探索和改进）中，对非专家动作（off-expert actions）的忠实跟随与生成能力。
- **研究动机**: 现有 AC-WMs 多在专家演示上训练和评估，但在实际策略改进中，策略会探索大量非专家动作。现有模型在面对这些动作时存在“脱节”：要么生成视觉合理但无视动作的“乐观”未来，要么直接视觉崩溃，导致其作为学习模拟器不可靠。
- **本质改动**: 将评估和训练从单一的“专家动作回放”扩展到“广泛的非专家动作分布”，并通过引入中间特征轨迹解码（AFE）和配对动作干预对齐（IE）来强制模型理解动作与视觉变化的因果对应关系。
- **技术溯源**: 基于 Flow Matching 架构的视频生成基座（如 Cosmos-Predict2.5 / Cosmos3），以及 RoboTwin 仿真基准和 CtrlWorld 等现有机器人世界模型。

**2. 技术拆解**
- **核心方法**: 
  1. **评估基准 WorldEcho**：构建5类动作查询（专家、跨状态重放、局部扰动、策略Rollout、可行空间采样），结合视觉完整性门控和 SE(3) 末端执行器轨迹 NDTW 误差进行联合评估。
  2. **训练方法 WorldSync**：包含三个模块：扩大动作覆盖（混合模拟非专家轨迹与少量真实数据）、动作强制专家（AFE，从中间视频特征解码未来 SE(3) 轨迹以锚定表征）、干预效应监督（IE，对齐同观察不同动作下的预测变化与真实变化）。
- **关键细节**: 
  - **输入输出**：输入为当前多视角观察、语言指令和动作序列；输出为未来多视角视频。
  - **模型结构**：基于 Flow Matching 的视频生成骨干网络。AFE 使用轨迹查询（trajectory queries）通过交叉注意力（cross-attend）读取中间视频特征，推理时移除。
  - **动作空间**：统一使用机器人基坐标系下的相对笛卡尔末端执行器位姿位移（SE(3)）作为共享动作空间，以对齐仿真与真实数据。
- **训练/优化目标**: 联合优化三个损失：Flow Matching 生成损失 ($\mathcal{L}_{FM}$) + AFE 轨迹回归损失 ($\mathcal{L}_{AFE}$，使用 MSE 对齐预测和真实 SE(3) 轨迹) + IE 干预效应对齐损失 ($\mathcal{L}_{IE}$，使用 MSE 对齐预测和真实的潜在空间变化量 $\Delta_\theta$ 和 $\Delta^*$)。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboTwin 仿真基准（50个操作任务用于主实验，4个用于消融），以及真实机器人任务（stacking-cups）。
  - **对比对象 (Baseline)**：CtrlWorld, Cosmos-Predict2.5, Cosmos3, DreamDojo, Motus, LingBotVA。对比了它们使用“专家演示”和“扩展动作覆盖”训练的变体。
- **评价指标**: 
  - **主要指标**：Integrity-gated error（视觉完整性门控误差，视觉不合格直接给固定惩罚 $\kappa$，合格则计算 NDTW 误差）。
  - **辅助指标**：Raw NDTW（原始位姿感知动态时间规整误差）、Visual pass rate（视觉通过率）。下游指标为策略迭代改进的成功率。
- **主要结果**: 
  - **诊断结果**：所有仅用专家数据训练的模型在非专家动作下，integrity-gated error 增加 0.029-0.099m，视觉失败率增加 6.3-28.1%，证明仅看专家动作会严重掩盖模型缺陷。
  - **主实验**：WorldSync 在 50 个 RoboTwin 任务上取得最低的 integrity-gated error (0.0661) 和最高的 visual pass rate (84.51%)，在轨迹对齐和视觉质量间取得了最佳平衡。
  - **下游策略改进**：在 RoboTwin 仿真中，WorldSync 使策略成功率从 51% 提升至 65%（提升 14%），而 baseline (CtrlWorld) 仅提升至 56-57%；在真实机器人叠杯子任务中，WorldSync 使成功率从 48% 提升至 68%（提升 20%），CtrlWorld 仅提升至 56%。证明了更忠实的动作跟随能直接转化为更高效的策略学习。

### 2. 🔥 [Latent Action as Intention Enables Efficient Future Imagination for World Action Models] (将潜在动作作为意图以实现世界动作模型的高效未来想象)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.24882` | [点击跳转](https://arxiv.org/abs/2608.24882)

**领域与类型**：具身智能/机器人操作 | 方法创新

**0. 论文标题**
- **英文标题**: Latent Action as Intention Enables Efficient Future Imagination for World Action Models
- **中文标题**: 将潜在动作作为意图以实现世界动作模型的高效未来想象
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种名为LAWA的世界动作模型，在推理时用紧凑的潜在动作序列代替显式的未来视频生成来进行“未来想象”，在保持高泛化性和成功率的同时，将推理延迟降低了42.9%。

**1. 整体逻辑**
- **研究任务**: 机器人视觉运动策略学习（Visuomotor policy learning），具体为基于世界动作模型（WAM）的机器人操作控制。
- **研究动机**: 现有的世界动作模型（如Joint-WAM）在推理时联合生成未来视频和动作，导致极大的推理延迟；而为了提速去掉未来视频预测的Fast-WAM，在少样本和分布外场景下泛化能力显著下降。如何在保留“未来想象”带来的泛化优势的同时，避免显式生成未来视频的高昂推理成本，是本文的核心痛点。
- **本质改动**: 将“未来想象”从像素级的观测空间转移到紧凑的潜在动作空间。推理时不生成未来视频，而是联合去噪连续的潜在动作序列（作为未来意图）和可执行的动作块。
- **技术溯源**: 基于世界动作模型（WAM）范式（如Fast-WAM、Joint-WAM），底层生成模型采用流匹配（Flow matching），潜在动作分词器借鉴了ViPRA，视觉特征提取使用DINOv2，掩码预测使用SAM 2。

**2. 技术拆解**
- **核心方法**: 
  1. 带有掩码监督和无动作预训练的离散潜在动作分词器（Latent Action Tokenizer）：将帧间视觉转换压缩为离散码本向量，并通过预测手/机械臂掩码使潜在动作聚焦于交互区域。
  2. 多模态联合去噪架构：训练时联合去噪视频、潜在动作和可执行动作；推理时丢弃视频分支，仅联合去噪潜在动作和动作块。
- **关键细节**: 
  - **输入输出**：输入当前观测和语言指令，输出动作块（action chunk）。
  - **模型结构**：包含视频、潜在动作、动作三个专家分支，通过结构化注意力掩码控制信息流，防止动作分支在训练时泄露未来视频信息。
  - **预训练策略**：在无动作的机器人视频和第一人称（egocentric）视频上联合预训练分词器，通过帧采样速度对齐和加权重采样（机器人视频占约20%）来保持机器人领域的接地（grounding）。
- **训练/优化目标**: 
  - **分词器预训练**：L1重建损失 + LPIPS感知损失 + 掩码预测损失（BCE/Dice/IoU）。
  - **策略训练**：采用流匹配（Flow matching），对视频、潜在动作和动作分别独立加噪，最小化预测速度与真实速度的MSE损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboCasa（仿真，24个桌面任务，含few-shot和full-data设置），LIBERO-Plus（仿真，零样本迁移，含多种环境扰动），真实世界任务（UFACTORY xArm7，4个任务）。
  - **对比对象（baseline）**：VLA方法（OpenVLA, UniVLA, DIAL等），WAM方法（Fast-WAM, Joint-WAM, Being-H0.7等）。核心对比的是作者matched implementation的Fast-WAM和Joint-WAM。
- **评价指标**: 任务成功率（Success Rate, SR），端到端推理延迟（Latency, ms）。
- **主要结果**: 
  - **RoboCasa**：LAWA在few-shot和full-data下平均成功率分别达65.6%和80.8%，比matched Fast-WAM分别高9.6和4.5个点，性能与Joint-WAM（64.1%和78.8%）持平。
  - **LIBERO-Plus**：零样本迁移成功率达74.4%，比matched Fast-WAM（60.0%）高14.4个点，比Joint-WAM（70.4%）高4.0个点。
  - **推理延迟**：LAWA延迟为338.5ms，比Joint-WAM（593.1ms）降低42.9%。
  - **真实世界**：仅用25%数据时，LAWA成功率（40.0%）超过Fast-WAM全量数据（33.8%）；全量数据下达到67.5%，远超Fast-WAM的33.8%。

### 3. 🔥 [GaussianWAM: Distilling Geometry and Semantics from 3D Gaussian Fields into World-Action Models] (GaussianWAM：从3D高斯场中蒸馏几何与语义到世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.24714` | [点击跳转](https://arxiv.org/abs/2608.24714)

**0. 论文标题**
- **英文标题**: GaussianWAM: Distilling Geometry and Semantics from 3D Gaussian Fields into World-Action Models
- **中文标题**: GaussianWAM：从3D高斯场中蒸馏几何与语义到世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出GaussianWAM，在训练阶段利用3D高斯场将几何和语义特征统一蒸馏到世界-动作模型（WAM）的视觉表示中，在不增加推理开销的前提下显著提升了机器人在分布偏移下的操作成功率。

**1. 整体逻辑**
- **研究任务**: 提升世界-动作模型（WAMs）在机器人操作任务中的空间理解与动作生成能力，特别是增强模型面对视角、光照、背景等分布偏移时的鲁棒性。
- **研究动机**: 现有WAM主要在2D图像或视频潜在空间进行优化，学到的表示缺乏显式的跨视角3D几何约束，也没有被显式优化以保留空间局部化的物体语义。这导致模型在需要精确空间交互时表现受限。直接蒸馏多个独立教师模型会导致信号在空间上不对齐，而显式构建3D/4D世界模型又会大幅增加推理成本。
- **本质改动**: 引入一个仅在训练阶段使用的3D高斯场作为统一的空间载体，将异构的几何和语义监督信号在3D空间中对齐并绑定，然后蒸馏到WAM的视觉表示中；推理时完全移除这些额外模块，保持原模型的推理效率。
- **技术溯源**: 基于 FastWAM 和 Cosmos Policy 架构，结合冻结的几何基础模型（VGGT-Omega）和视觉基础模型（CLIP ViT-B/16），以及 3D Gaussian Splatting 表示方法。

**2. 技术拆解**
- **核心方法**: 训练时，利用多视角观测提取深度和语义特征，初始化并拟合3D高斯场。渲染出语义、深度和覆盖率（alpha）目标并离线缓存。训练WAM时，挂载轻量级辅助头，将WAM当前观测的视觉token去拟合这些缓存的3D高斯目标。推理时，删掉高斯场、教师模型和辅助头。
- **关键细节**: 
  - 输入：同步的多视角视觉观测（语言和机器人本体状态仅作为策略输入，不参与高斯场构建）。
  - 高斯场构建：在14×14的教师网格上密集初始化高斯基元，每个有效几何位置对应一个基元，包含3D中心、旋转、缩放、不透明度和64维语义特征。
  - 蒸馏目标：渲染出的语义特征图、深度图和累积高斯覆盖率（alpha）图。使用有效性掩码（几何有效且alpha大于阈值）限制监督区域，过滤掉不可靠的空间位置。
  - 架构适配：在FastWAM（双专家MoT）中蒸馏到视频专家的最终层当前观测表示；在Cosmos Policy（统一DiT）中蒸馏到共享骨干的最终层当前观测视觉token。
- **训练/优化目标**: 
  - 高斯场拟合损失：语义特征的余弦距离、深度的L1损失、覆盖率损失以及正则化项。
  - WAM蒸馏损失：在有效掩码区域内，计算预测的语义（掩码余弦距离）、深度（L1）和alpha（L1）与缓存的高斯目标之间的损失。总损失为WAM原始损失加上加权后的蒸馏损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（标准语言条件操作）、LIBERO-Plus（引入相机、机器人、语言、光照、背景、噪声、布局等分布偏移）、RoboTwin（双臂操作，Clean和Random设置）、真实世界双臂机器人操作（UR7e）。
  - 对比对象（Baseline）：FastWAM、Cosmos Policy，以及直接CLIP+VGGT 2D蒸馏基线。同时对比了多种VLA和WAM模型（如UniVLA、π0、OpenVLA-OFT、GeoSem-WAM等）。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - 在LIBERO-Plus上，GaussianWAM将FastWAM的整体成功率从52.05%大幅提升至71.29%（在相机+29.03%、噪声+39.46%等偏移下提升尤为显著）；将Cosmos Policy从71.52%提升至77.30%。
  - 在RoboTwin的Random设置下，Cosmos Policy的成功率从7.10%提升至14.40%。
  - 在真实世界操作中，FastWAM的平均成功率从30.00%提升至40.00%。
  - 消融实验证明，3D高斯场统一表示（70.99%）优于直接2D多教师蒸馏（69.37%），且语义、深度和alpha监督信号缺一不可，蒸馏到Transformer最后一层效果最佳。定性分析表明，增强后的表示具有更清晰的深度结构和更紧凑的语义聚类。

### 4. 🔥 [Gripper-aware Vision Language Action Models] (夹爪感知的视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.24603` | [点击跳转](https://arxiv.org/abs/2608.24603)

**0. 论文标题**
- **英文标题**: Gripper-aware Vision Language Action Models
- **中文标题**: 夹爪感知的视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个包含5种夹爪的10万级多策略数据集 MiGA，并设计了基于三级 Token 和双 MoA 路由的 GVLA 框架，让 VLA 能根据不同夹爪的物理形态生成专属的抓取策略。

**1. 整体逻辑**
- **研究任务**: 训练视觉-语言-动作模型（VLA），使其能根据视觉和语言指令，结合当前使用的夹爪类型，生成可执行的动作序列。
- **研究动机**: 现有 VLA 隐含假设“夹爪不变性”，但不同夹爪（如平行夹爪、吸盘、多指手）完成同一任务需要完全不同的交互策略。此外，现有 VLA 数据集（如 Open X-Embodiment）几乎全是平行夹爪数据，缺乏多夹爪策略差异的显式建模，导致模型学不到夹爪感知的策略。
- **本质改动**: 从“隐式夹爪/单一夹爪”转向“显式多夹爪感知”。在数据端构建多夹爪策略数据集，在模型端引入多层级夹爪 Token 和双 MoA 路由，实现参数共享与策略特化的平衡。
- **技术溯源**: 基于 $\pi_0$ / $\pi_{0.5}$ VLA 架构，结合 Soft Prompt 和 Mixture-of-Adapters (MoA) 技术。

**2. 技术拆解**
- **核心方法**: 
  1. **数据集 MiGA**：收集 5 种夹爪（平行、三指、软体、吸盘、灵巧手）的 10.3 万条轨迹，显式标注同一任务下不同夹爪的策略差异。
  2. **模型 GVLA**：包含多夹爪分词器（用三级 Soft Prompt 编码夹爪形态）和双混合适配器（Dual MoA，通过平台和夹爪双路由动态选择专家网络来调制动作生成）。
- **关键细节**: 
  - **输入输出**：输入包括多视角 RGB-D 图像、本体状态、语言指令，以及拼接在观察 Token 前的三级夹爪 Prompt；输出为动作序列。
  - **模型结构**：基于 $\pi_{0.5}$ 骨干网络。通过 Layer probing 发现 Transformer 最后一层对夹爪类型最敏感，因此将 MoA 插在最后一层。
  - **规模**：MiGA 包含 10.3 万条演示，36 个任务，5 种夹爪。
- **训练/优化目标**: 
  总 Loss = 动作 Loss + 夹爪预测 Loss + 负载均衡 Loss。
  - **动作 Loss**：采用条件流匹配（Conditional Flow Matching），预测向量场将噪声动作还原为真实动作。
  - **夹爪预测 Loss**：辅助分类损失，用视觉特征预测夹爪类型，增强共享嵌入的夹爪判别力。
  - **负载均衡 Loss**：防止 MoA 路由坍塌，惩罚适配器使用分布的方差。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 MiGA 数据集。
  - **对比对象（Baseline）**：传统两阶段方法（AnyGrasp, GraspMAS），VLA 方法（GraspVLA, OpenVLA-OFT），以及 $\pi_0$, $\pi_{0.5}$ 及其变体。
  - **测试环境**：仿真环境（NVIDIA Isaac Lab）和真机环境（UR5 机械臂 + Robotiq 2f-85 夹爪）。
- **评价指标**: 
  - **成功率（SR）**：核心指标。
  - **预测误差（PE）**：预测动作与 GT 的平均偏差。
  - **反事实动作预测散度（CAPD）**：衡量仅改变夹爪身份时动作的改变程度（越高说明策略特化越好）。
  - **线性探测准确率（LPA）**：衡量隐藏层对夹爪类型的区分能力。
  - **夹爪贡献得分（GCS）**：量化夹爪 Token 对特征区分的实际贡献。
- **主要结果**: 
  - 在仿真中，基于 $\pi_{0.5}$ 的 GVLA 平均成功率达到 66.00%，比原版 $\pi_{0.5}$ (58.38%) 提升了 7.62%，全面超越所有 Baseline（传统方法在扁平、堆叠等复杂场景下成功率直接掉到 0）。
  - 在零样本/少样本泛化中表现更好，能更快适应新物体、新任务和新夹爪。
  - 真机验证中，在 UR5 + Robotiq 2f-85 上仅用 10 条演示进行微调，GVLA 在所有任务上的成功率均优于 $\pi_{0.5}$ baseline。

### 5. 🔥 [Zero-WAM: In-Context World-Action Modeling from Human Videos for Open-Ended Task Generalization] (Zero-WAM：基于人类视频的上下文世界-动作建模用于开放式任务泛化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.26103` | [点击跳转](https://arxiv.org/abs/2608.26103)

**0. 论文标题**
- **英文标题**: Zero-WAM: In-Context World-Action Modeling from Human Videos for Open-Ended Task Generalization
- **中文标题**: Zero-WAM：基于人类视频的上下文世界-动作建模用于开放式任务泛化
- **研究机构**: 原文未提及
- **一句话总结**: [领域：机器人学习/具身智能；类型：方法创新+数据集构建] 提出用人类视频作为上下文提示（ICL）指导机器人执行未见任务，通过自动构建大规模人类-机器人配对数据集和防捷径训练目标，实现了显著的零样本跨任务泛化。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的零样本跨任务泛化（Zero-shot cross-task generalization），即让机器人在不微调参数的情况下，仅凭上下文提示执行训练时未见过的操作任务。
- **研究动机**: 1) 现有的视觉-语言-动作（VLA）模型依赖语言作为任务接口，但语言难以充分描述空间约束和时序动态，人类视频能提供更直观的任务演化视觉线索；2) 缺乏大规模、任务丰富的人类-机器人配对数据；3) 模型在训练时容易走捷径（shortcuts），仅依赖机器人历史和文本预测下一步，忽略上下文人类视频，导致在测试（未见任务）时无法利用视频信息。
- **本质改动**: 将大语言模型的上下文学习（ICL）范式引入机器人控制，用人类视频替代或补充语言作为任务规范（Task specification）；同时设计自动数据生成流水线和防捷径的辅助训练目标（IFP），强迫模型真正从人类视频中提取任务动态，而不是靠历史帧“偷懒”。
- **技术溯源**: 基于 Wan-2.2-TI2V-5B（视频生成基座）和 LingBot-VA 的因果视频-动作框架；数据生成使用了 Gemini 3.1 Pro / Qwen3.6-Plus (VLM)、Nano Banana 2 / Qwen-Image-2.0 (图像编辑)、Wan 2.7 / Kling AI 3.0 (视频生成) 等模型。

**2. 技术拆解**
- **核心方法**: 
  1) **自动构建 HumanGen 数据集**：通过VLM分析机器人视频提取任务语义，结合图像编辑和视频生成模型，将机器人轨迹自动转化为语义匹配的人类操作视频，构建大规模人类-机器人ICL配对数据。同时对公开机器人数据进行任务级重采样，构建 Task-diverse VA 数据集。
  2) **Zero-WAM 模型架构**：采用 Mixture-of-Transformers (MoT) 设计，视频Transformer预测未来机器人视频块，动作Transformer作为逆动力学模型解码动作。通过高度轴RoPE偏移区分人类视频和机器人视频token，防止表示混淆。
  3) **上下文未来块预测（IFP）目标**：作为训练时的辅助损失，要求模型从当前视频表示中预测多个带时间步长的未来视频块。IFP模块不直接看人类视频，从而强迫主分支充分编码人类视频中的任务信息，防止模型走捷径。
- **关键细节**: 
  - **模型规模**：视频和动作Transformer隐藏层维度均为3072，视频Transformer 30层。
  - **数据规模**：HumanGen 包含 74.2K 个人类-机器人 ICL 配对，涵盖 8.6K 个任务；Task-diverse VA 包含约 400K 条机器人轨迹，涵盖 6000+ 任务。
  - **IFP细节**：预测 K=4 个未来块，时间步长 s=2，损失权重为 (0.5, 0.25, 0.15, 0.15)。推理时移除 IFP 模块。
  - **输入输出**：输入为人类视频（或语言指令）+ 历史机器人视频/动作；输出为下一个机器人视频块 + 对齐的动作块。
- **训练/优化目标**: 
  - **主目标**：基于 Flow matching 的视频生成损失和动作生成损失。
  - **辅助目标**：IFP 损失（监督多个未来视频块的预测）。
  - **数据混合**：Task-diverse VA 和 HumanGen 数据按采样权重混合（预训练时比例 1:5）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RoboTwin 2.0 环境，50个双臂操作任务，43个用于训练，7个未见任务用于零样本评估。对比基线：WAN-Action（基于Wan-2.2）、LingBot-VA。
  - **真实世界**：双臂 Franka 机器人，评估3个任务族（物体放置、三物体顺序操作、两桌腿插入）。对比基线：LingBot-VA（使用语言指令）。
- **评价指标**: 任务成功率（Task success rate）。
- **主要结果**: 
  - **仿真（7个未见任务）**：Zero-WAM 平均成功率 46.95%，比 LingBot-VA (17.45%) 绝对提升 29.50 个百分点，比 WAN-Action (10.98%) 提升 35.97 个百分点。在长时程任务 `stack blocks three` 上，仅 Zero-WAM 取得非零成功率 (9.00%)。
  - **真实世界**：Zero-WAM（使用人类视频指导）在三类任务上均优于 LingBot-VA（使用语言指令）。例如三物体顺序操作成功率 33.3% vs 10.0%，两桌腿插入 16.7% vs 0.0%。
  - **消融实验**：引入 IFP 目标将平均成功率从 28.55% 提升至 46.95%；任务平衡的预训练数据（Text-only Zero-WAM）比 LingBot-VA 提升 21.99 个百分点，验证了数据构建和防捷径设计的有效性。

### 6. 🔥 [MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization] (MA-VLA：用于协作与组合泛化的多臂视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.25864` | [点击跳转](https://arxiv.org/abs/2608.25864)

**0. 论文标题**
- **英文标题**: MA-VLA: Multi-Arm Vision-Language-Action Model for Collaboration and Compositional Generalization
- **中文标题**: MA-VLA：用于协作与组合泛化的多臂视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出MA-VLA框架，通过将高层指令分解为原子动作并显式分配给各机械臂，结合训练时的Arm Shuffle策略，解决了多臂VLA模型难以泛化到未见协作模式的问题。

**1. 整体逻辑**
- **研究任务**: 多机械臂协作操作（Multi-arm manipulation），具体是基于视觉-语言-动作（VLA）模型的自然语言指令跟随与多臂协同控制。
- **研究动机**: 现有VLA模型通常把语言当成单一全局指令，缺乏显式的任务分解和子任务分配机制。这导致多臂协作时的分工全靠模型隐式从数据中学习，极易过拟合训练时的固定协作模式；一旦测试时的协作模式（如机械臂的角色分配、动作执行顺序）发生变化，模型就会失效。
- **本质改动**: 将单一全局指令拆解为可解释的“原子动作提示（atomic prompts）”，并明确分配给每个机械臂；同时在训练时引入“Arm Shuffle”机制，随机打乱机械臂的身份和输入对应关系，强迫模型学习动作本身的语义，而不是死记硬背“哪个臂做哪个动作”。
- **技术溯源**: VLA执行器基座基于 pi0（flow-matching），VLM规划器使用 GPT-4.1。对比的baseline包括 ACT, DP (Diffusion Policy), DP3, Pi0-FAST。

**2. 技术拆解**
- **核心方法**: 
  1. **VLM规划器（Planner）**：利用GPT-4.1将高层指令和视觉观测拆解为按时间排序的原子动作序列，并明确指定每个阶段每个臂该执行哪个原子动作（如“Arm0: grasp, Arm1: hold”）。
  2. **VLA执行器（Executor）**：基于pi0，将各臂的原子提示拼接成统一指令字符串，连同多视角图像和各臂本体状态一起输入，通过flow-matching一次性输出所有臂的连续控制动作。
  3. **训练期正则化**：引入 Arm Shuffle（随机置换各臂的状态、视角、提示和动作的对应关系）和 View Dropout（随机掩码部分相机视角），打破模型对固定臂身份和特定视角的依赖，提升组合泛化能力。
- **关键细节**: 
  - **输入输出**：输入为多视角RGB/RGB-D图像、各臂本体状态、拼接后的统一指令（如 "Arm0: p0, Arm1: p1..."）；输出为所有臂的联合动作向量。
  - **模型结构**：执行器末端增加了多头投影层（multi-head projection layer），将共享的潜在表示分离成各臂专属的动作头。
  - **规模与超参**：动作预测horizon为50。训练使用2张A800 GPU，batch size 32。不同任务训练步数不同（如RoboFactory 2臂10k步，3-4臂15k步；RoboTwin 30k步）。Arm Shuffle和View Dropout的概率在0.6到1.0之间动态设置。
- **训练/优化目标**: 行为克隆（BC）损失。执行器采用flow-matching，预测去噪向量场将带噪潜在动作映射到真实动作，优化目标是所有机械臂动作级损失（如MSE）的总和。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真使用 RoboFactory（2-4臂协作）和 RoboTwin 2.0 (Hard)（双臂，带强视觉干扰）；真机使用 SO101 双臂平台。
  - **对比对象（Baseline）**：ACT, DP, DP3, Pi0-FAST, 以及原版 Pi0。
  - **评估场景**：分为域内协作（In-domain，同分布但带位姿/视角扰动）和域外组合泛化（Out-of-domain，原子动作见过，但协作顺序/角色分配没见过）。
- **评价指标**: 任务成功率（Success Rate）。仿真每个配置跑100次rollout，真机每个任务跑20次episode。
- **主要结果**: 
  - **域内表现**：MA-VLA全面超越baseline。例如在RoboFactory 2臂任务中平均成功率83.5%（Pi0为80.3%）；在RoboTwin 2.0中平均49.0%（Pi0为41.1%）。
  - **域外组合泛化（核心亮点）**：在未见过的协作模式（如改变堆叠颜色顺序）下，Pi0、DP等baseline成功率直接掉到 0.0%，而MA-VLA取得了 13.0% 的平均成功率，实现了从0到1的突破。
  - **真机表现**：在SO101上，MA-VLA不仅在域内优于Pi0，在域外（如反转堆叠/传递顺序）也实现了非零成功率（如Stack Bowls OOD达到10/20），而Pi0在OOD下全部失败（0/20）。

### 7. 🔥 [ConfAL-WM: Confidence-Guided Active Learning for Action-Conditioned World Models] (ConfAL-WM：面向动作条件世界模型的置信度引导主动学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.25572` | [点击跳转](https://arxiv.org/abs/2608.25572)

**0. 论文标题**
- **英文标题**: ConfAL-WM: Confidence-Guided Active Learning for Action-Conditioned World Models
- **中文标题**: ConfAL-WM：面向动作条件世界模型的置信度引导主动学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于置信度引导的主动学习框架，通过在世界模型UNet解码器上挂载轻量级探针预测密集误差风险，实现任务级数据筛选和帧/补丁级的加权重训练，高效提升世界模型在新场景下的后训练效果。

**1. 整体逻辑**
- **研究任务**: 动作条件具身世界模型（Action-conditioned world models）在新任务、新场景和新机器人形态下的后训练（Post-training）与领域自适应。
- **研究动机**: 世界模型在遇到新分布数据时，预测误差不是全局均匀分布的，而是集中在局部的时空区域（如机械臂、操作物体、接触和遮挡区）。现有的全局数据扩充或基于标量奖励/进度的打分方法，无法提供细粒度的局部预测风险信息，导致后训练效率低，且无法精准修复局部的物理或交互错误。
- **本质改动**: 抛弃全局标量打分，直接在世界模型的UNet解码器特征上挂载一个轻量级“置信度探针（Confidence Probe）”，输出密集的置信度图。把置信度同时用在两个地方：一是算分筛选出难的任务和场景（数据选择），二是算权重让模型在训练时重点优化那些容易出错的帧和图像补丁（局部加权训练）。
- **技术溯源**: 基于 EnerVerse-AC (EVAC) 这个世界模型（基于UNet的潜在扩散模型，预训练于 AgiBot World 数据集）。

**2. 技术拆解**
- **核心方法**: 
  1. **密集置信度探针 (Dense Confidence Probe)**：在EVAC的UNet解码器中间层特征上接一个轻量级网络，预测潜在空间（Latent space）的密集置信度图。采用基于EMA（指数移动平均）自适应校准的随机阈值来生成二值监督目标，训练探针。
  2. **分阶段主动学习流水线 (Staged Active Learning Pipeline)**：
     - *阶段1*：用少量目标域数据微调探针并预热EVAC（得到EVAC-v1）。
     - *阶段2（任务级筛选）*：用探针计算任务级风险（如平均风险 Mean risk），为不同任务分配采样预算，筛选出需要重训练的数据。
     - *阶段3（局部加权重训练）*：对选出的数据再次推理，提取帧级和补丁级风险，将其转化为损失函数的权重，引导EVAC-v2重训练时更关注高风险的局部时空区域。
- **关键细节**: 
  - *输入输出*：探针输入为UNet解码器特征、扩散时间步和阈值嵌入；输出为与潜在空间对齐的密集置信度图（可聚合为patch、frame、task级分数）。
  - *模型规模*：EVAC主干约 2.33B 参数，置信度探针仅约 8.2M 参数。
  - *训练设置*：探针训练时冻结EVAC主干；使用AdamW优化器，学习率 5e-5，fp16混合精度，2张A800 GPU训练4000步。
- **训练/优化目标**: 
  - *探针训练*：二元交叉熵损失（Binary cross-entropy），目标是预测局部潜在重建误差是否低于自适应采样的阈值。
  - *世界模型重训练*：加权的世界模型损失函数（Weighted world-model objective），将置信度图转换为局部损失乘数，高风险帧和补丁获得更大的优化权重。

**3. 实验结果**
- **实验设置**: 
  - *数据集*：预训练用 AgiBot World，后训练与评估用 RoboTwin2.0（包含 Aloha-AgileX 双臂机器人的50个操作任务，共约2.5万个视频）。
  - *对比基线 (Baselines)*：RoboReward, GVL, Robometer-Prog, Robometer-Pref, PRM-as-Judge, LRMs（均为现有的标量奖励、进度或评判打分模型）。
- **评价指标**: 遵循 EWMBench 评估协议。包括重建质量（PSNR, SSIM）、场景一致性（Scene Consistency）、语义与逻辑（Logics, Sem.-CLIP, Sem.-BLEU）、运动与轨迹一致性（Traj-HSD, Traj-Dyn, Traj-nDTW）。
- **主要结果**: 
  - *置信度有效性*：探针预测的风险图与真实误差高度相关（潜空间Spearman相关性达0.54~0.59），能准确定位机械臂、接触点等局部错误，且具备时间稳定性。
  - *主动学习效果*：在相同数据预算下，置信度引导的筛选（Mean risk）在9个细分指标中的8个上取得最佳；进一步结合“帧+补丁”加权重训练后，在重建、语义和运动指标上全面超越所有标量打分基线（如PRM-as-Judge, LRMs等），有效修复了局部物体变形、抓取失败等交互错误。

### 8. 🔥 [RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation] (RA-VLA：用于测试时自适应的检索增强VLA模型)
- **研究机构**: `Samsung Research / Samsung Electronics`
- **Arxiv ID**: `2608.25585` | [点击跳转](https://arxiv.org/abs/2608.25585)

**0. 论文标题**
- **英文标题**: RA-VLA: Retrieval-Augmented VLA for Test-Time Adaptation
- **中文标题**: RA-VLA：用于测试时自适应的检索增强VLA模型
- **研究机构**: Samsung Research / Samsung Electronics
- **一句话总结**: 提出 RA-VLA 框架，通过训练行为对齐的检索器和引入上下文遵循损失，解决了现有上下文模仿学习中“检索不准”和“模型不听指令”的问题，实现了免训练、低延迟的 VLA 测试时自适应。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在未见过的机器人操作任务上的测试时自适应（Test-Time Adaptation），具体属于上下文模仿学习（In-Context Imitation Learning, ICIL）范畴。
- **研究动机**: 现有 VLA 模型遇到新任务容易崩溃。现有的 ICIL 方法（给几个专家演示做上下文）存在三个痛点：1. 检索机制太表面，只看视觉相似度，找来的演示动作意图不对；2. 模型有“行为惯性”，依然依赖预训练先验瞎动，不参考给的演示；3. 把演示直接拼在输入序列里，上下文一长推理延迟就爆炸。
- **本质改动**: 把“看图检索”改成“看动作意图检索”，并加了一个专门的损失函数强迫模型必须参考检索到的上下文来生成动作，同时把上下文编码解耦来保证推理速度。
- **技术溯源**: 基于 Flow-Matching 架构的 VLA 模型（具体实验采用 GR00t N1.5 作为基座），视觉编码器基于 SigLIP 2。

**2. 技术拆解**
- **核心方法**: RA-VLA 框架，包含两个核心模块：1) 行为对齐检索器（Action-Aware Retriever）；2) 上下文接地执行管线（Context-Grounded Execution Pipeline）。
- **关键细节**: 
  - **检索器**: 用动态时间规整（DTW）对齐两条专家轨迹的动作序列来构建正负样本，训练一个轻量级 2 层 Transformer 检索器，让“行为相似”的片段在特征空间靠近，而不是仅仅“视觉相似”。
  - **解耦编码与逐层接地**: 专家片段独立编码并缓存。推理时，检索到的 K 个片段不直接拼在输入里，而是通过交叉注意力机制逐层分配给 Action Head（例如 K=2 时，前4层用片段2，后4层用片段1），避免上下文窗口膨胀。
  - **动作初始化**: Flow-matching 的初始噪声动作不使用标准正态分布，而是用检索到的专家动作片段的经验均值来初始化，加速收敛。
- **训练/优化目标**: 
  - **检索器优化**: 行为对齐损失（Behavioral Alignment Loss），即对比学习损失，拉近 DTW 对齐的正样本，推远负样本。
  - **策略优化**: 上下文遵循损失（Contextual Adherence Loss）。计算使用“检索到的相关上下文”和“随机采样的无关上下文”预测动作的 MSE 差值，强制要求相关上下文的 MSE 比无关上下文小至少一个 margin $m$。总损失是相关上下文 MSE 加上这个遵循损失，以此打破模型的行为惯性。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: LIBERO 仿真基准（4个 suite，留1个 suite 做 zero-shot 测试），真实世界 UR5e 机械臂环境（4个任务，留1个测试）。
  - **对比对象 (Baseline)**: Vanilla VLA（无上下文）, RAEA（直接拼接上下文）, RICL（上下文与生成动作加权融合，分偏向生成的 RICL_G 和偏向检索的 RICL_R）。
- **评价指标**: 任务成功率（Success Rate），推理延迟（Inference Latency），相对上下文敏感度（Relative Contextual Sensitivity，衡量模型输出对上下文的依赖程度）。
- **主要结果**: 
  - **成功率提升**: 在 LIBERO 上，RA-VLA 平均成功率达到 38.45%，比最好的 baseline (RICL_R 的 20.85%) 绝对提升了 17.6%。在真实 UR5e 环境中，平均成功率 56.25%，比 RICL_R (35.42%) 绝对提升了 20.83%。
  - **延迟恒定**: 得益于解耦编码设计，RA-VLA 的推理延迟随检索片段数量 K 的增加几乎保持不变，而 RAEA/RICL 延迟显著上升。
  - **上下文依赖增强**: RA-VLA 的相对上下文敏感度（0.3639）远高于 baseline（如 RICL_R 的 0.0788），证明模型真正“听进去”了上下文指导，而不是固守预训练先验。

### 9. 🔥 [One Policy, Many Embodiments: Unified Camera-Centric Action Geometry Pre-training for Heterogeneous Embodied Manipulation] (一个策略，多种形态：面向异构具身操作的统一相机中心动作几何预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.26058` | [点击跳转](https://arxiv.org/abs/2608.26058)

**0. 论文标题**
- **英文标题**: One Policy, Many Embodiments: Unified Camera-Centric Action Geometry Pre-training for Heterogeneous Embodied Manipulation
- **中文标题**: 一个策略，多种形态：面向异构具身操作的统一相机中心动作几何预训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种以相机坐标系为基准的统一步作表征（UCAG-P），将异构机器人和人类视频数据对齐到共享的几何动作空间，实现了单一VLA大模型在多种机器人形态上的联合预训练与零样本控制。

**1. 整体逻辑**
- **研究任务**: 跨形态（单臂、双臂、人形、人手）和跨数据源（真实机器人、仿真、人类视频）的通用视觉-语言-动作（VLA）策略预训练。
- **研究动机**: 现有VLA模型难以直接联合训练异构数据。不同机器人的底层动作空间（如关节角、末端位姿）不兼容，且人类视频缺乏机器人原生动作标签。现有方法要么为不同机器人设计独立动作头，要么做复杂的人转机器人动作重定向，阻碍了统一策略的规模化。
- **本质改动**: 放弃以“机器人底层控制命令”作为统一动作标签，改为预测“相机坐标系下可观测的锚点（手腕/末端和抓取中心）的3D几何运动”。把“理解任务几何”和“生成特定机器人控制指令”彻底解耦。
- **技术溯源**: 基于 Qwen3-VL-4B-Instruct 视觉语言大模型作为骨干网络。

**2. 技术拆解**
- **核心方法**: 提出 UCAG-P 框架。定义了一个相机中心的共享动作空间，用语义锚点对 $(p_0, p_1)$ 在相机坐标系下的3D位移来表示动作。设计了一个几何条件动作翻译器（Geometry-conditioned translator），利用相机-基座变换和局部雅可比矩阵，将预测的相机坐标系运动转化为目标机器人的原生可执行命令。
- **关键细节**: 
  - **输入输出**：输入多视角RGB（224x224）、语言指令和本体状态；输出30步的动作块（Action chunk）。
  - **模型结构**：Qwen3-VL backbone 提取特征后，接一个共享的相机中心运动头（输出30维几何运动向量），再接一个几何条件动作翻译头（融合VLM特征、相机位姿、雅可比矩阵，输出80维稀疏命令向量）。
  - **数据规模**：整合了11个数据集，超6300小时数据（包含4030小时机器人/仿真数据，以及2340小时通过MediaPipe提取锚点的人类第一视角视频数据）。
- **训练/优化目标**: 采用三阶段训练：1）相机中心特化（训练运动头预测几何轨迹）；2）几何条件动作翻译（用GT轨迹训练翻译器）；3）联合训练（端到端优化）。优化目标为带掩码的 L1 损失（Masked L1 loss），通过掩码机制让不同数据源只监督其拥有的标签（例如人类数据只监督几何运动，不监督机器人关节命令）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 LIBERO, LIBERO-Plus, RoboTwin (Easy/Hard), RoboCasa GR-1 仿真环境，以及真实 Piper 机器人上测试。Baseline 包括 $\pi_0$, $\pi_{0.5}$, OpenVLA, Qwen-VLA, ABot-M0, ZR-0 等（涵盖专用微调模型和通用模型）。
  - **测试条件**：强调使用单一统一 checkpoint，不进行任何 benchmark 特定的微调（Zero-shot）。
- **评价指标**: 闭环任务成功率（Success Rate, %）。
- **主要结果**: 
  - **仿真跨形态**：在 LIBERO 达到 98.3%，RoboTwin Easy/Hard 达到 88.7%/89.2%，RoboCasa GR-1（人形机器人）零样本达到 62.0%。全面超越通用基线 Qwen-VLA，接近甚至持平针对单一任务微调的 Specialist 模型。
  - **鲁棒性**：在 LIBERO-Plus 的7种分布偏移（如相机、光照、背景变化）下，零样本成功率达 82.0%。
  - **真实世界**：在 Piper 机器人上，仅需少量演示，面包抓取（测试人转机器人迁移）成功率 60%，抽屉 90%，叠碗 75%，均显著优于 $\pi_{0.5}$ 基线。

### 10. 🔥 [GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation] (GaussianDream++：用于机器人操作的高效3D高斯世界建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.25659` | [点击跳转](https://arxiv.org/abs/2608.25659)

**0. 论文标题**
- **英文标题**: GaussianDream++: Efficient 3D Gaussian World Modeling for Robotic Manipulation
- **中文标题**: GaussianDream++：用于机器人操作的高效3D高斯世界建模
- **研究机构**: 原文未提及
- **一句话总结**: 把前作庞大且依赖外部几何路径的高斯世界模型，精简成直接嵌入 VLA 骨干的 20 个世界 Token，训练时做密集的 3D 高斯监督，推理时直接丢弃解码器，零额外解码开销大幅提升机器人操作的空间泛化能力。

**1. 整体逻辑**
- **研究任务**: [方法创新 / 机器人学习] 提升视觉-语言-动作（VLA）策略在语言条件下的机器人操作能力，重点解决模型对度量 3D 结构和短期物理演化理解不足的问题。
- **研究动机**: 现有 VLA 靠动作模仿训练，缺乏对 3D 几何和物理演化的显式监督；几何增强方法只管当前场景 grounding，预测方法在 RGB/隐空间建模缺乏度量一致性且部署成本高；前作 GaussianDream 虽引入高斯监督，但依赖庞大的外部几何路径（VGGT/TGE）构建 1024 个 token 的 prefix，推理时仍需额外计算，不够紧凑。
- **本质改动**: 抛弃外部密集的几何 prefix，将“当前状态”和“未来预测”解耦为 20 个原生 World Tokens 直接嵌入 VLA 骨干。训练时通过轻量级 Head 解码为 3D 高斯进行密集监督，推理时直接丢弃 Head 和渲染器，实现非对称的零额外解码开销设计。
- **技术溯源**: PaliGemma / $\pi_{0.5}$ (VLA 骨干), GaussianDream (前作), 3D Gaussian Splatting (3DGS)。

**2. 技术拆解**
- **核心方法**: 
  1. 策略原生的世界表示：在 PaliGemma 前缀中直接插入 16 个 World State Tokens（带空间/射线嵌入）和 4 个 World Prediction Tokens，与视觉/语言 token 联合上下文化，直接供 Action Expert 使用。
  2. 训练时的非对称监督：训练时加一个轻量级 World Representation Head，将 State Tokens 解码为当前高斯世界（Current World），结合 Prediction Tokens 预测未来高斯变化（Coupled Future Prediction）。
  3. 动静解耦（Static-dynamic factorization）：未来预测基于当前高斯模板，只预测中心点残差位移，并通过 gating 机制抑制静态区域的虚假运动。
- **关键细节**: 
  - 输入：多视角观测、语言指令、机器人状态。
  - 输出：动作块（Action chunk）。
  - 模型结构：PaliGemma 骨干 + Flow-matching Action Expert。新增 20 个 World Tokens。
  - 几何-外观解耦：解码当前世界时，几何分支预测深度和非外观属性，外观分支在几何特征 stop-gradient 后预测，防止光度捷径破坏度量结构。
- **训练/优化目标**: 
  总损失为动作损失加上当前世界损失和未来预测损失。
  - 动作损失：基于 flow-matching 的动作目标。
  - 当前世界损失：包含 RGB（光度+结构相似度）、度量深度（仅有效区域）、Alpha 覆盖和正则化。
  - 未来预测损失：包含 RGB、度量深度、3D 场景流（metric 3D flow）和静态一致性惩罚。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（标准任务）和 LIBERO-Plus（7种分布偏移的零样本鲁棒性）。真机测试使用双臂机器人平台。
  - 对比对象：标准 LIBERO 对比 GeoPredict, QDepth-VLA, Spatial Forcing 等；LIBERO-Plus 对比 OpenVLA-OFT, $\pi_{0.5}$, ACoT-VLA 等。同协议直接对比 reproduced $\pi_{0.5}$ 和 GaussianDream。
- **评价指标**: 任务成功率（%）。
- **主要结果**: 
  - 仿真 LIBERO：GaussianDream++ 平均成功率 98.6%，比 GaussianDream 高 0.2%，比 reproduced $\pi_{0.5}$ 高 1.7%。
  - 仿真 LIBERO-Plus：Overall 87.8%，比 GaussianDream 高 0.8%，比 reproduced $\pi_{0.5}$ 高 2.3%。在 Camera 和 Layout 偏移下提升最明显（Camera 提升 6.9% vs $\pi_{0.5}$，2.8% vs GaussianDream）。
  - 真机实验：平均成功率从 reproduced $\pi_{0.5}$ 的 29.2% 提升至 52.5%。在 Layout 和 Camera 偏移下成功率大幅提升。
  - 推理效率：推理时只增加 20 个 token 的处理，延迟从 286 ms 增加到 330 ms（增加 44 ms），彻底去除了 GaussianDream 必须的 VGGT/TGE 路径和在线高斯解码。

### 11. 🔥 [GaussVLA: Geometry-Aware Spatial Reasoning for Vision-Language-Action Model] (GaussVLA：面向视觉-语言-动作模型的几何感知空间推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.24959` | [点击跳转](https://arxiv.org/abs/2608.24959)

**0. 论文标题**
- **英文标题**: GaussVLA: Geometry-Aware Spatial Reasoning for Vision-Language-Action Model
- **中文标题**: GaussVLA：面向视觉-语言-动作模型的几何感知空间推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于 Mamba 的轻量级 VLA 模型 GaussVLA，通过将 2D 视觉特征转化为带置信度的 3D 高斯空间 token，并引入非自回归的深度感知思维链（DA-CoT），在极小参数量下大幅提升了机器人操作的空间推理与几何泛化能力。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作策略学习（Vision-Language-Action modeling）。
- **研究动机**: 现有 VLA 模型将图像编码为扁平的 2D patch token，缺乏显式的 3D 几何结构；即使引入单目深度图，也仅是逐像素的标量，无法表达表面朝向和几何置信度。此外，现有的 CoT 推理多在 2D 空间自回归生成，不仅延迟高，而且与动作解码过程解耦，导致模型在需要精确空间推理的任务中表现受限。
- **本质改动**: 摒弃扁平 2D token 和标量深度拼接，将视觉特征“升维”为带有置信度的 3D 高斯原语（Gaussian primitives），并设计非自回归的 DA-CoT 模块，在动作解码前直接进行结构化的 3D 空间推理。
- **技术溯源**: 序列建模基于 Mamba 架构；视觉特征提取使用冻结的 SigLIP 和 Depth Anything V2；语言编码使用冻结的 CLIP；动作生成采用 Flow-matching 机制。

**2. 技术拆解**
- **核心方法**: 
  1. **高斯空间分词器 (GST)**：将 2D 语义和深度特征反投影并拟合为 3D 高斯原语（包含 3D 均值、对数方差/尺度、不透明度/置信度），随后通过带置信度偏置的空间注意力池化，提取几何显著区域。
  2. **深度感知思维链 (DA-CoT)**：使用少量可学习的推理 query，在语言和 flow-time 条件联合下，对 GST token 进行交叉注意力聚合，生成非自回归的结构化推理 token，直接注入动作解码过程。
- **关键细节**: 
  - 模型总参数量 200M（可训练 179M），主干网络包含 5 层 Mamba blocks。
  - GST 使用 128 个高斯 query，DA-CoT 使用 4 个推理 query。
  - 动作预测采用 Flow-matching，预测 7-DoF 动作，动作块长度 (horizon) $H=10$，使用 10 步 Euler ODE 求解。
  - 端到端推理延迟为 12.97 ms/step（单卡 RTX Pro 6000 Blackwell）。
- **训练/优化目标**: 联合优化三个损失函数：
  1. Flow-matching 损失（预测条件速度场）。
  2. GST 深度一致性损失（带不透明度加权的深度重建 L1 损失，约束高斯均值的 z 坐标与校正深度一致）。
  3. DA-CoT 监督损失（辅助预测目标速度场，强制推理 token 与动作生成目标对齐）。

**3. 实验结果**
- **实验设置**: 
  - 仿真基准：LIBERO（主评测）、LIBERO-PRO（鲁棒性/分布偏移）、Meta-World（难度分层）、CALVIN（长视野序列）。
  - 真实世界：SO-101 机械臂（多任务及 Pick-Place ID/OOD 测试）。
  - 对比 Baseline：DP, MaIL, QueST, OpenVLA, SpatialVLA, ThinkAct, CoT-VLA, Mask2Act, TraceVLA, $\pi_0$, SUREFlow, ACT, GR-1 等。
- **评价指标**: 成功率 (Success Rate, SR)、归一化成功率（LIBERO-PRO）、连续完成任务数及序列平均长度（CALVIN）。
- **主要结果**: 
  - **LIBERO**：平均成功率 93.5%（Spatial 套件达 100.0%），比 SpatialVLA 平均成功率相对提升 19.7%，比 QueST 高 4.9%，且参数量（200M）远小于 3B-7B 级别的 VLA 基线。
  - **Meta-World & CALVIN**：在 Meta-World 中 Easy 难度最优，整体平均排名第二；在 CALVIN 中连续完成 1-4 个任务的表现仅次于 GR-1，平均序列长度达 1.474。
  - **鲁棒性与真机**：LIBERO-PRO 平均 SR 达 0.33（在轻量级模型中表现良好）；真机 SO-101 多任务平均成功率 58.8%，显著优于 SpatialVLA (46.3%) 和 ACT (35.7%)。
  - **消融实验**：证明性能提升主要来自 GST 提供的结构化 3D 几何表示，而非单纯增加模型容量或简单拼接深度图（简单拼接深度反而会导致性能下降）；DA-CoT 提供了互补的推理增益。

### 12. 🔥 [CLAP: Cross-Embodiment Video World Models are Zero-Shot Physical Simulators] (CLAP：跨具身视频世界模型作为零样本物理模拟器)
- **研究机构**: `Princeton University`
- **Arxiv ID**: `2608.27406` | [点击跳转](https://arxiv.org/abs/2608.27406)

**0. 论文标题**
- **英文标题**: CLAP: Cross-Embodiment Video World Models are Zero-Shot Physical Simulators
- **中文标题**: CLAP：跨具身视频世界模型作为零样本物理模拟器
- **研究机构**: Princeton University
- **一句话总结**: 提出CLAP框架，通过融合末端执行器、语言和潜在动作空间，在异构人类与机器人视频上训练跨具身视频世界模型，实现零样本真实世界部署与少样本适配。

**1. 整体逻辑**
- **研究任务**: 训练能够跨不同机器人形态和人类视频的动作条件视频世界模型，用于学习通用物理规律并支持机器人策略的规划与评估。
- **研究动机**: 现有的动作条件视频模型通常局限于单一机器人具身（single embodiment），无法利用包含丰富物理信号的互联网规模异构视频数据；同时，不同机器人的动作空间差异巨大，且海量人类视频缺乏动作标签。
- **本质改动**: 摒弃单一具身限制，通过融合末端执行器、自然语言和潜在动作表示来统一异构动作空间，并采用课程学习策略，先在无标签数据上学习物理先验，再在有标签数据上对齐真实动作空间。
- **技术溯源**: Stable Video Diffusion (SVD) 时空 UNet、CLIP 文本编码器、Open X-Embodiment (OXE) 数据集。

**2. 技术拆解**
- **核心方法**: 提出三种动作空间统一方案（CLAP-EE, CLAP-LANG, CLAP-LAM）及一种课程学习方案（CLAP-CURR）。CLAP-CURR 先用潜在动作（Latent Actions）在无标签视频上预训练视频扩散模型以学习基础物理先验，随后替换动作头为末端执行器动作（End-effector Actions），在有标签视频上微调，从而在不阻碍数据扩展的前提下实现零样本真实世界部署。
- **关键细节**: 
  - **动作表示**：EE动作映射为7维（3平移+3旋转+1夹爪），采用绝对坐标并归一化到[-1, 1]；语言动作通过文本模板映射，采用相对坐标；潜在动作通过VAE从连续视频帧对中提取32维向量。
  - **模型结构**：基于SVD的时空UNet，输入历史帧和当前帧，通过因果交叉注意力融合历史上下文；多视角图像在潜空间垂直拼接输入模型。
  - **规模**：在8张H100/H200 GPU上训练100K步，有效batch size为64。
- **训练/优化目标**: 
  - **潜在动作模型（LAM）**：基于$\beta$-VAE的像素重建损失加KL散度正则化。
  - **视频模型**：基于EDM噪声采样的视频扩散去噪损失（Denosing loss），结合帧级动作条件的交叉注意力机制。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：Open X-Embodiment (OXE) 中的 DROID、Bridge 等子集，以及 EgoDex。
  - **对比对象（Baseline）**：DROID环境下的 Ctrl-World，Bridge环境下的 Bridge-Base，以及 DreamDojo-Human。下游策略对比了 $\pi_{0.5}$ 和 MolmoAct-2。
  - **测试环境**：单臂 Franka (DROID配置)、双臂 YAM 机器人。
- **评价指标**: 视频感知指标包括 SSIM, PSNR, LPIPS, FVD, FID；下游任务评价指标为真实世界操作任务的成功率（Success rates）。
- **主要结果**: 
  - **跨具身 vs 单具身**：跨具身模型（如CLAP-CURR）在DROID等复杂环境下的预测保真度接近或超越单具身 SOTA baseline（Ctrl-World）。
  - **动作空间特性**：在EE动作条件下，绝对坐标优于相对坐标（有效减少长序列累积误差）；在语言动作条件下，相对坐标优于绝对坐标（更适应离散tokenization的有限分辨率）。
  - **零样本泛化**：在推理时通过跨策略规划（结合 $\pi_{0.5}$ 和 MolmoAct-2 的动作提议），在单臂和双臂真实任务中提升了基线策略的成功率（如双臂YAM的Pick Carrot & Apple任务成功率从90%提升至95%）。
  - **少样本适配**：微调后的模型在预训练具身（DROID/Bridge）上全面超越单具身 baseline；在未见过的双臂 YAM（14维）和 G1 人形机器人（26维）上也能实现高保真的未来帧预测。
  - **RL微调**：在视频世界模型中基于RL微调策略，将carrot任务的成功率从80%提升至88%。

### 13. 🔥 [Riemann-1.0: An Embodied World Action Model for Physical AI] (Riemann-1.0：面向物理AI的具身世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.27033` | [点击跳转](https://arxiv.org/abs/2608.27033)

**0. 论文标题**
- **英文标题**: Riemann-1.0: An Embodied World Action Model for Physical AI
- **中文标题**: Riemann-1.0：面向物理AI的具身世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个全因果自回归的世界动作模型（WAM），通过三阶段渐进式预训练将20万小时的人类视频与机器人轨迹统一起来，使单一模型同时具备机器人策略执行与动作条件视觉世界模拟的能力。

**1. 整体逻辑**
- **研究任务**: 构建统一的具身大脑模型，同时支持可执行的机器人策略学习和动作条件的视觉世界模拟，解决大规模异构具身数据（人类视频、手持夹爪演示、机器人轨迹）的统一利用问题。
- **研究动机**: 现有的世界动作模型（WAM）范式存在局限：联合生成法耦合了不同维度的模态导致优化困难，视频优先法引入了推理延迟，解耦建模法丢失了因果一致性。此外，现有预训练策略强依赖机器人轨迹，无法有效利用海量但弱监督的人类视频数据，限制了跨具身形态的知识迁移。
- **本质改动**: 采用“全因果自回归”架构，在自回归展开时先根据历史预测动作，再将动作作为条件生成未来的视觉特征（latent），严格遵循物理世界的因果顺序；同时设计三阶段渐进式预训练，利用潜在动作模型（LAM）将无标签人类视频转化为伪动作，逐步对齐至真实机器人动作空间。
- **技术溯源**: 基于 Flow Matching（流匹配）、Latent Action Model (LAM)、Wan VAE（视觉编码器）、T5（文本编码器）以及 Transformer 架构。

**2. 技术拆解**
- **核心方法**: 
  1. **统一具身数据基建**：将人类视频、手持夹爪演示和机器人轨迹统一清洗、对齐为标准的“动作级视频-状态-动作”格式。
  2. **全因果自回归 WAM**：模型在每一步先预测动作 chunk，随后将该动作作为条件生成对应的视觉 latent。
  3. **渐进式具身预训练**：分三阶段训练。Stage 1 用冻结的 LAM 从人类视频提取伪动作进行预训练；Stage 2 混入 UMI、机器人和 3D 手部轨迹进行多具身动作对齐；Stage 3 纯用高质量机器人数据强化可执行策略。
- **关键细节**: 
  - **数据规模**：200K+ 小时具身经验（含 200K+ 小时人类视频，12K+ 小时手持夹爪，20K+ 小时机器人轨迹）。
  - **模型结构**：共享 Transformer 骨干，但为不同机器人形态（embodiment）保留独立的动作/状态投影层和预测头。视觉通过 Wan VAE 编码，文本通过 T5 编码。
  - **时序对齐**：1 个视觉 latent 对应 16 个底层控制步（action steps）。
  - **推理机制**：在线控制时，动作执行后获取环境真实观测作为下一步的 clean context；进行世界模拟时，将生成的 visual latent 递归反馈给模型。
- **训练/优化目标**: 
  - **联合损失**：基于 Flow Matching 计算 $\mathcal{L} = (1-\lambda)\mathcal{L}_z + \lambda\mathcal{L}_a$。其中 $\mathcal{L}_z$ 为视觉 latent 的速度回归损失，$\mathcal{L}_a$ 为动作的速度回归损失。
  - **渐进权重**：动作损失权重 $\lambda$ 从 Stage 1 的 0.1，逐步增加至 Stage 2 的 0.5、Stage 3 的 0.9，后训练（Post-training）阶段为 0.95。
  - **注意力掩码**：设计 Teacher Forcing Attention Mask，clean tokens 只能 attend 之前的 clean tokens，noisy tokens attend 之前的 clean 和同帧的 noisy，严防未来信息泄露。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：RoboCasa-365, RoboTwin 2.0, LIBERO。
  - **真机环境**：在 Tianji Marvin 双臂机器人上测试 4 个长视野任务（有序方块堆叠、衣服折叠、桌面整理、厨房整理）。
  - **Baselines**：DreamZero*, τ0-WM, LingBot-VLA, π0.5, LingBot-VA, G0.5, GR00T-N1.5, Fast-WAM, ABot-M0.5 等。
- **评价指标**: 
  - **仿真**：任务成功率（Success Rate, SR）。
  - **真机**：成功率（SR）和进度成功率（Progress Success Rate, PSR，衡量中间里程碑完成度）。
- **主要结果**: 
  - **仿真基准**：RoboTwin 2.0 平均 SR 94.3%（SOTA）；LIBERO 平均 SR 99.0%（SOTA）；RoboCasa-365 平均 SR 62.6%（比前最好方法 ABot-M0.5 的 54.2% 提升 8.4%）。
  - **真机表现**：平均 SR 85.0%，平均 PSR 94.4%（比最强开源 baseline G0.5 的 SR 70.0% 提升 15%）。
  - **泛化能力**：在组合泛化和 OOD（分布外）真实世界任务中，平均 SR 达到 75.0%，显著优于 π0.5（47.5%）和 LingBot-VA（22.5%）。
  - **结论验证**：证明了“全因果世界动作建模 + 渐进式预训练”范式，能有效将大规模异构具身经验转化为长视野、可泛化的真机操作能力。

### 14. 🔥 [4DSynth: Controllable Procedural World Synthesis for Dynamic Embodied Simulation] (4DSynth：面向动态具身仿真的可控程序化世界合成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.26947` | [点击跳转](https://arxiv.org/abs/2608.26947)

**0. 论文标题**
- **英文标题**: 4DSynth: Controllable Procedural World Synthesis for Dynamic Embodied Simulation
- **中文标题**: 4DSynth：面向动态具身仿真的可控程序化世界合成
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个统一的程序化4D环境生成系统，能将文本、掩码或单张图片转化为带物理属性、动态角色和相机的可编辑场景，并据此构建了评估具身智能的导航基准。

**1. 整体逻辑**
- **研究任务**: 构建视觉多样、物理可交互且随时间变化的4D具身仿真环境，并评估具身智能体在其中的导航与操作能力。
- **研究动机**: 现有的程序化模拟器、语言引导系统和动态模拟器各自独立，场景表示和创作管线割裂。将用户条件转化为几何、角色运动、相机运动和仿真状态一致的单一可编辑场景仍需大量人工，且难以大规模复用和编辑。
- **本质改动**: 设计了一个统一的程序化创作架构，将四种异构的场景生成路径（原生生成、布局条件、单图重建等）汇聚到一个共享的几何基础表示（Stage）上，实现动画、相机规划和物理导出的统一，并保持全程参数化可编辑。
- **技术溯源**: 基于 Infinigen / Infinigen Indoors（程序化场景生成）、NVIDIA Isaac Sim（物理仿真）、OpenUSD（场景导出），以及现有的单目深度估计、开放词汇分割和3D重建技术。

**2. 技术拆解**
- **核心方法**: 4DSynth 管线分为语义控制、场景实现和几何基础的4D合成。首先通过约束语言模型将用户意图转为4D规范；接着四条场景实现路径最终都映射到统一的 Stage（包含度量支撑网格、可行走区域、碰撞几何等）；然后在 Stage 上进行无碰撞的角色轨迹规划和相机轨迹规划；最后导出物理就绪的 OpenUSD 场景。
- **关键细节**: 
  - **输入**：自然语言描述、蓝图掩码或单张照片。
  - **架构**：两层执行管线。Tier 1 实现场景并固定 Stage；Tier 2 并行进行动画（导入动捕资产并测量物理尺寸）和相机规划。
  - **单图 Real-to-Sim**：结合单目度量深度、开放词汇分割和以对象为中心的3D重建，将观测实例映射到程序化工厂。冻结几何后再进行材质对齐，保证场景完全参数化且可编辑。
  - **室外场景**：采用粗到细的循环，先用粗糙场景规划临时轨迹，再在相机视锥内细化地形和植被，最后基于最终几何重规划。
  - **物理导出**：导出到 Isaac Sim，材质身份直接映射为密度和摩擦，动态角色作为运动学固体障碍物（使用胶囊体作为碰撞代理）。
- **训练/优化目标**: 本文为系统工程与管线设计，无端到端学习损失函数。核心机制基于几何约束、碰撞检测、A*寻路（基于侵蚀后的可行走区域）和物理属性映射，通过启发式规则和约束优化来满足无碰撞、可见性和物理合理性。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：构建了 4DSynth-Nav 基准，包含 122 个物理启用的室内场景（基于 Infinigen Indoors 生成），共 333 个自动验证的导航和拾取放置任务。分为 L1（单阶段，目标初始隐藏）、L2（两阶段，目标初始可见）、L3（两阶段，目标初始隐藏）三个难度。
  - **对比对象**：评估了 Qwen3-VL-30B-A3B-Thinking（开源 MoE VLM）和 Gemini 3.1 Pro（闭源 VLM）。
  - **测试环境**：NVIDIA Isaac Sim 4.5.0。
- **评价指标**: 成功率 (SR)、子任务进度 (SP)、目标距离 (GD)、碰撞次数 (Collisions)、步数 (Steps)。
- **主要结果**: 
  - 两个模型在动态具身导航中表现不佳，远未解决该任务。Qwen3-VL-30B 整体 SR 为 13.2%，SP 为 22.4%；Gemini 3.1 Pro 整体 SR 为 33.3%，SP 为 40.7%。
  - Gemini 在盲起（L1）任务中表现显著优于 Qwen（SR 57.5% vs 16.8%），但在两阶段任务中两者都容易出现子任务完成后卡住或循环的错误（SP 显著高于 SR，说明存在目标搜索、空间记忆和重导航的累积误差）。
  - 验证了 4DSynth-Nav 能有效区分模型能力，且通过程序化控制使得失败可复现、难度轴可独立调节。

### 15. 🔥 [TemporalFlow-VLA: Learning Physically Grounded Execution History for Long-Horizon Robot Manipulation] (TemporalFlow-VLA：学习基于物理落地的执行历史用于长视野机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.26821` | [点击跳转](https://arxiv.org/abs/2608.26821)

**0. 论文标题**
- **英文标题**: TemporalFlow-VLA: Learning Physically Grounded Execution History for Long-Horizon Robot Manipulation
- **中文标题**: TemporalFlow-VLA：学习基于物理落地的执行历史用于长视野机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种利用机器人运动学生成的表面光流作为物理监督信号，训练紧凑时序查询来表征历史执行状态的VLA方法，显著提升了长视野多阶段操作的成功率且推理无额外延迟。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在长视野、多阶段机器人操作中，因视觉相似但物理历史不同导致的动作歧义问题，让模型有效利用历史执行状态。
- **研究动机**: 现有VLA主要依赖当前帧或简单堆叠历史帧，无法可靠捕捉近期的物理变化。诊断实验表明，直接打乱历史帧顺序对离线损失影响极小，说明无约束的baseline对历史时序不敏感，单纯增加帧数无法提供对控制有用的物理演化表征。
- **本质改动**: 摒弃在推理时输入显式运动轨迹或无监督地堆叠历史帧，改为在训练时利用机器人运动学计算“机器人表面时序光流”作为强物理监督信号，逼迫模型学习出两个紧凑的、与动作块对齐的时序查询（Temporal Queries），推理时直接复用这些紧凑特征。
- **技术溯源**: 基于预训练的流匹配VLA基座（如 $\pi_{0.5}$），结合机器人正向运动学（URDF几何、相机标定）。

**2. 技术拆解**
- **核心方法**: 引入并行的时序路径。训练时，利用记录的关节状态、URDF和相机标定，离线计算机器人表面像素的时序光流（Temporal Flow）作为Ground Truth，通过两个时序查询（$Q_8$ 和 $Q_{15}$）去重建这两个时间窗口内的物理运动。推理时，丢弃几何计算和光流重建头，仅保留时序查询，并通过异步特征缓存机制复用历史帧的视觉特征。
- **关键细节**: 
  - **输入**：当前帧、t-8和t-15两帧历史观测、语言指令、机器人状态。
  - **模型结构**：在 $\pi_{0.5}$ 的prefix后拼接历史帧patch和两个可学习的时序查询token。通过有向掩码注意力（Directed masked-attention）让 $Q_8$ 只关注近期历史，$Q_{15}$ 关注 $Q_8$ 和更早历史。动作token只能通过联合掩码注意力读取这两个查询，不能直接读取历史patch。
  - **光流计算**：将历史帧的机器人表面3D点通过正运动学投影到当前帧，计算2D归一化位移，按14x14 patch求均值。
  - **异步缓存**：在机器人执行当前动作块时，后台异步提取并缓存t-8和t-15帧的视觉特征，推理时直接查表，避免重复编码。
- **训练/优化目标**: 联合优化动作流匹配损失（Action flow-matching loss）和时序光流重建损失（Temporal flow reconstruction loss，使用Huber loss，仅在机器人表面有效区域计算）。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：LIBERO（4个suite），RoboTwin 2.0（12个任务，按执行视野H=1,2,3分组）。
  - **对比基线**：$\pi_0$, $\pi_{0.5}$, X-VLA, GigaWorld, GR00T N1.7, CronusVLA, HAMLET, MotionVLA等。
  - **真机环境**：AgiBot A3 机器人，执行三阶段操作任务（三杯堆叠、两瓶装盒）。
- **评价指标**: 任务成功率（Success Rate, SR），服务端策略采样延迟（Server-side policy sampling latency）。
- **主要结果**: 
  - **LIBERO**：平均成功率 97.63%，在 LIBERO Long 上达到 96.60%，比次优方法高 2.1 个点。
  - **RoboTwin 2.0**：Clean/Randomized 平均成功率 85.5% / 84.2%。在长视野任务（H=2, 3）上优势显著，Randomized下H=2和H=3分别比次优高 5.5 和 14.5 个点。
  - **消融实验**：证明动作预测同时依赖历史内容和时序顺序；带光流监督的双查询显著优于无监督的多帧堆叠。
  - **真机表现**：三杯堆叠成功率从 57.8% 提升至 77.8%（+20.0%），两瓶装盒从 86.7% 提升至 97.8%（+11.1%）。
  - **推理效率**：异步缓存使推理延迟从 68.10 ms 降至 62.78 ms，降低 7.8%，维持了单帧级别的采样延迟。

### 16. 🔥 [PredVLA: A Sub-Million-Parameter Predictive-Coding Policy for Robot Manipulation] (PredVLA：一种用于机器人操作的亚百万参数预测编码策略)
- **研究机构**: `原文未提及（致谢中注明受日本JST CREST项目资助）`
- **Arxiv ID**: `2608.26673` | [点击跳转](https://arxiv.org/abs/2608.26673)

**0. 论文标题**
- **英文标题**: PredVLA: A Sub-Million-Parameter Predictive-Coding Policy for Robot Manipulation
- **中文标题**: PredVLA：一种用于机器人操作的亚百万参数预测编码策略
- **研究机构**: 原文未提及（致谢中注明受日本JST CREST项目资助）
- **一句话总结**: 提出了一种基于预测编码的视觉-语言-动作（VLA）策略，仅用0.68M可训练参数且无需机器人数据预训练，通过预测误差驱动的在线隐状态推断，在LIBERO基准上取得了远超同等参数规模Transformer/LSTM基线的操作性能。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作（根据视觉观测和自然语言指令控制机器人完成抓取、放置等任务）。
- **研究动机**: 现有的VLA模型（如RT-2, OpenVLA）参数量高达数十亿，部署成本极高。现有的轻量化尝试（如TinyVLA）仍停留在数亿参数级别，且本质上只是对主流大VLA架构的裁剪。作者想探究：如果不顺着“压缩大VLA”的思路，而是彻底更换控制架构，能否在极小参数预算（<100万）下实现强大的语言条件操作？
- **本质改动**: 抛弃主流VLA将观测直接输入Transformer/LSTM的做法，引入认知科学中的“预测编码（Predictive Coding）”理论。观测不直接参与循环动态的前向传播，而是通过最小化“预测值与真实观测的误差”来在线推断和更新隐状态。
- **技术溯源**: 预测编码循环神经网络（PC-RNN / PV-RNN），多层时间尺度循环动态（Multiple-timescale recurrent dynamics），以及冻结的通用多模态编码器（ResNet18, all-MiniLM-L6-v2）。

**2. 技术拆解**
- **核心方法**: PredVLA由冻结的多模态前端和可训练的分层预测编码循环网络组成。核心机制是“在线误差回归”：在推理时，网络权重冻结，模型根据当前视觉和本体感觉的预测误差，通过梯度下降在一个滑动时间窗口内优化后验隐变量，再由推断出的隐状态解码出动作。
- **关键细节**: 
  - **前端**：冻结的ResNet18（双视角）和all-MiniLM-L6-v2（语言），输出特征经固定PCA降维。
  - **循环网络**：包含4个模块（Top, Visual, A_top, A_bottom），通过赋予不同的时间常数（$\tau$）形成时间分层，处理不同频率的动态。
  - **侧向连接**：包含视觉到动作的瓶颈层，以及动作到视觉的传出副本（传入的是模型自己预测的动作和本体感觉，而非真实观测，保证观测不直接干预前向动态）。
  - **动作输出**：高斯混合模型（GMM）。
  - **规模**：可训练参数仅0.68M（675,732个）。
- **训练/优化目标**: 
  - **训练时**：联合优化网络权重和每个时间步的后验自由变量。损失函数包含视觉预测误差、本体感觉预测误差、动作负对数似然（NLL）以及复杂度惩罚（后验与先验自由变量的差异，即自由能）。
  - **推理时**：冻结权重，仅优化后验自由变量，最小化自由能（预测误差+复杂度）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO基准（包含spatial, goal, object三个短视野套件和long长视野套件）。
  - **对比对象**：使用相同冻结前端、相同演示数据、相同动作解码器和评估协议的参数匹配（约0.68M）的Transformer、LSTM行为克隆策略，以及参数量稍大的Action-chunking Transformer (ACT)。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - PredVLA在三个短视野套件的平均成功率达86.94%，包含长视野的四个套件平均为75.35%。
  - 在严格控制变量的对比中，PredVLA的平均成功率是参数匹配的Transformer（19.73%）的3.7倍，是LSTM（10.26%）的7.4倍。
  - 推理效率：在RTX 5090上，包含在线误差回归的端到端控制延迟为46ms（21.6 Hz）。
  - 消融结论：分层时间常数和在线误差回归对性能至关重要；不同任务对感官误差的依赖不同（如object任务极度依赖本体感觉误差，移除后性能暴跌）。

### 17. 🔥 [WALL-SS: Scaling Long-horizon World Models via Next-Scale Autoregression] (WALL-SS：通过下一尺度自回归扩展长视界世界模型)
- **研究机构**: `X Square Robot team`
- **Arxiv ID**: `2608.26239` | [点击跳转](https://arxiv.org/abs/2608.26239)

**0. 论文标题**
- **英文标题**: WALL-SS: Scaling Long-horizon World Models via Next-Scale Autoregression
- **中文标题**: WALL-SS：通过下一尺度自回归扩展长视界世界模型
- **研究机构**: X Square Robot team
- **一句话总结**: 本文属于具身智能领域的系统与方法创新工作，提出了一种基于“下一尺度自回归”的长视界世界模型 WALL-SS，通过尺度对齐的动作条件、尺度压缩的长时记忆和在策略对齐，实现了高保真、动作可控且支持分钟级流式推理的机器人视觉未来预测。

**1. 整体逻辑**
- **研究任务**: 构建用于机器人长视界仿真、策略评估和学习的动作可控生成式世界模型。
- **研究动机**: 现有的视频世界模型多局限于片段级（clip-level）预测，缺乏将动作与后果显式关联的统一生成范式；且在长视界自回归生成中，误差累积会导致视觉漂移、状态混淆和动作失真（如“隔空吸物”等物理不_consistent_现象）。
- **本质改动**: 摒弃传统的片段级视频扩散，将机器人轨迹建模为观察与动作时间交错的因果序列，采用“从粗到细”的下一尺度自回归（Next-Scale Autoregression）来生成未来，并配套尺度压缩记忆和RL对齐，从根本上解决长视界误差累积和动作不跟随的问题。
- **技术溯源**: 基于 InfinityStar（视觉生成基座）、Transformer 架构、AgiBotWorld-Beta（公开数据集）。

**2. 技术拆解**
- **核心方法**: 
  1) **动作条件的下一尺度预测**：在从粗到细的生成过程中，注入尺度对齐的动作表示，强化动作与状态转移的耦合，支持反事实推理（包括模拟次优和失败动作）。
  2) **尺度压缩的长视界记忆**：复用下一尺度层级管理 KV cache，近期历史保留细粒度，远期历史压缩为粗粒度，实现有界内存下的流式推理；结合尺度梦境强制（Scale-wise dream forcing）缓解自回归的曝光偏差。
  3) **视觉动态的在策略对齐**：将视觉 token 生成视为随机策略，在固定动作条件下，用动作跟随和长期一致性奖励优化采样出的 rollout（采用 GRPO），并用 KL 散度和真实轨迹重放防止视觉先验退化。
- **关键细节**: 
  - **输入输出**：输入为初始多视角观察、任务指令、时间对齐的机器人控制动作；输出为粗到细的视觉 token 序列，解码为多视角未来视频。
  - **动作表示**：将异构控制流投影到图像平面，生成与 RGB 时间戳和空间变换对齐的“动作视频”作为条件。
  - **数据构造**：混合了 AgiBotWorld-Beta、私有 X2-Robot/UMI 数据。特意引入了“策略干预与故障恢复”数据（包含人工接管和回滚重放），防止模型学习成功捷径，使其能真实反映物理接触和失败后果。
- **训练/优化目标**: 
  - **预训练**：平衡的下一尺度负对数似然损失（AR loss）。
  - **长视界适应**：AR loss + 年龄感知损坏上下文损失 + 自生成后缀损失（Dream forcing）。
  - **对齐阶段**：PPO 风格的组相对策略优化（GRPO），奖励为动作跟随和长期一致性，加上 KL 正则和真实轨迹 AR loss。

**3. 实验结果**
- **实验设置**: 
  - **视频生成**：自建具身视频 benchmark（200 个 ID，100 个 OOD 任务），对比 InfinityStar, Wan2.1/2.2, CogVideoX, Cosmos3-Nano。
  - **长视界流式**：60 秒自回归 rollout，对比无 dream forcing、仅保留最近片段、全历史 KV 等变体。
  - **闭环与真机**：在 WALL-SS 和真机上跑相同冻结策略（6 个任务，600 对 rollout）；真机部署共训练的 action expert，对比 $\pi_{0.5}$, LingBot-VA, DreamZero。
- **评价指标**: 
  - **视频**：Interaction Quality, Trajectory Acc., Action Following, Depth Acc. 等。
  - **流式**：末端执行器轨迹误差、跨片段边界误差、持久状态一致性、PSNR/FID/FVD。
  - **闭环**：任务级成功率校准（MAE/Bias）、任务内排序（Spearman $\rho$）、episodes 级一致性。
  - **真机**：Task Progress (0-100)。
- **主要结果**: 
  - **视频生成**：在交互质量、指令跟随、轨迹精度上全面优于基线（如 Action Following 达 0.290，远超 InfinityStar 的 0.251 和 Cosmos3-Nano 的 0.202）。
  - **长视界**：支持 60 秒流式生成，轨迹误差保持在图像对角线的 0.5% 以内，有效抑制了漂移和边界跳变。
  - **RL 对齐**：Action Following 从 0.264 提升至 0.290，跨片段误差从 0.118 降至 0.104，且未牺牲外观质量。
  - **闭环一致性**：生成与真机结果的 Spearman 排序相关性达 0.88，平衡准确率 0.88，证明其能准确评估策略优劣。
  - **真机部署**：平均 Task Progress 达 69.1，显著优于 $\pi_{0.5}$ (49.6)、DreamZero (44.1) 和 LingBot-VA (34.0)。

### 18. 🔥 [SpatialCrafter: Single Image World Modeling with Generative 3D Proxies] (SpatialCrafter：基于生成式3D代理的单图世界建模)
- **研究机构**: `原文未提及（致谢中提及香港科技大学、群核科技等机构支持）`
- **Arxiv ID**: `2608.27073` | [点击跳转](https://arxiv.org/abs/2608.27073)

**0. 论文标题**
- **英文标题**: SpatialCrafter: Single Image World Modeling with Generative 3D Proxies
- **中文标题**: SpatialCrafter：基于生成式3D代理的单图世界建模
- **研究机构**: 原文未提及（致谢中提及香港科技大学、群核科技等机构支持）
- **一句话总结**: 提出一个两阶段框架，用全局生成式3D代理替代不完整的重建式点云来引导视频扩散模型，解决了单图生成可探索场景时的长期漂移和几何不一致问题，并构建了一个115K场景的大规模数据集。

**1. 整体逻辑**
- **研究任务**: 单图到可探索场景生成（Explorable image-to-scene generation），即给定单张图像和任意相机轨迹，生成时空一致的RGB-D视频序列。
- **研究动机**: 现有基于视频扩散模型（VDM）的方法依赖不完整的条件信号（如2D图像记忆或仅从输入视角重建的稀疏点云），导致未见区域只能依赖模型的随机幻觉。这在复杂相机运动下会引发严重的几何畸变、长期漂移（long-term drifts）和3D不一致。
- **本质改动**: 摒弃“重建式3D代理（reconstructive proxies）”，改用“全局生成式3D代理”。先通过原生3D生成器从单图预测完整的全局3D场景结构，再将其作为粗几何先验输入视频扩散模型进行高保真外观细化。
- **技术溯源**: 3D代理生成基于 TRELLIS（SLAT表示）和 3D Gaussian Splatting (3DGS)；视频细化基于 Wan 2.1（视频DiT）和 LoRA 微调。

**2. 技术拆解**
- **核心方法**: 包含两阶段框架与一个数据引擎。阶段一：全局3D代理生成；阶段二：生成式延迟细化（Generative Deferred Refiner）。
- **关键细节**: 
  - **阶段一 (PaSS Flow)**: 将输入图像和深度反投影为稀疏点云作为几何锚点（anchors）。通过 Point-anchored Sparse Structure (PaSS) Flow Matching 模块约束3D稀疏结构生成，强制生成的3D代理与输入视图在空间上严格对齐，最后用3DGS解码出全局3D代理。
  - **阶段二 (细化器)**: 沿相机轨迹渲染粗RGB-D序列。通过 Parallel Geometry Injection 将粗RGB和深度编码后在通道维度拼接注入视频DiT，冻结主干权重只微调LoRA，以注入几何条件而不破坏预训练流形；通过 Proxy-Aware Corruption (PAC) 在训练时对几何条件随机施加退化（自适应高斯模糊、块噪声、部分深度擦除），防止模型对代理伪影过拟合，提升鲁棒性。
  - **数据集构建**: 结合合成室内数据（SpatialGen）和真实视频（RealEstate10K, DL3DV），通过深度和位姿估计重建点云并过滤，构建了包含115K场景的大规模混合数据集。
- **训练/优化目标**: 
  - 阶段一：条件流匹配（Conditional Flow Matching, CFM）损失，预测从噪声到目标稀疏结构的向量场。
  - 阶段二：带几何条件的视频CFM损失，预测从噪声到目标视频latent的向量场。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 合成数据集 SpatialGen-Video，真实数据集 RealEstate10K 和 DL3DV。
  - **对比对象 (Baseline)**: 2D图像记忆类（DFoT, GeometryForcing），重建式3D代理类（ViewCrafter, GEN3C, Voyager）。此外，还在作者构建的数据集上微调了Voyager作为对照（Voyager†）。
- **评价指标**: 视觉质量（FVD, PSNR, SSIM, LPIPS），几何一致性（重投影误差 RPE，重访误差 RVE）。
- **主要结果**: 
  - 在三个数据集上全面超越SOTA。例如在SpatialGen-Video上，FVD降至193.54，RPE降至0.093，有效缓解了长期漂移；在真实数据集（RE10K, DL3DV）上，FVD和PSNR等指标也显著领先。
  - 对比实验证明，即使将基线Voyager在作者的高质量数据集上微调（Voyager†），其几何一致性仍远不如SpatialCrafter，证明性能收益主要来自“全局生成式3D代理”的架构设计，而非单纯的数据提升。
  - 消融实验验证了PaSS-Flow对解决空间不对齐的关键作用，以及PAC对提升鲁棒性和修复伪影（如未观测区域的空洞）的有效性。

### 19. 🔥 [DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA] (DeicticVLA：在单一VLA中统一基于语言和指示手势的指令模式)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.28108` | [点击跳转](https://arxiv.org/abs/2608.28108)

**0. 论文标题**
- **英文标题**: DeicticVLA: Unifying Instruction Modes Based on Language and Deictic Gestures in a Single VLA
- **中文标题**: DeicticVLA：在单一VLA中统一基于语言和指示手势的指令模式
- **研究机构**: 原文未提及
- **一句话总结**: 提出DeicticVLA框架，通过指令规范化和对比多种掩码注入方式，让单一预训练VLA同时支持纯语言、视觉-语言和纯视觉三种指令模式，大幅提升了机器人在歧义场景和未见物体下的操作泛化能力。

**1. 整体逻辑**
- **研究任务**: 解决VLA（视觉-语言-动作模型）在同类或外观相似物体中，仅靠自然语言难以准确指代目标（grounding不可靠）的问题，实现多模态（语言+指示手势/点击）的统一指令输入与机器人操作。
- **研究动机**: 现有VLA处理空间关系或序数词时容易受视觉偏差影响，纯语言指令(LI)描述负担重；而现有支持指示手势（如点击）的工作大多只支持VLI（语言+手势）或VI（纯手势），缺乏在单一策略中统一LI、VLI、VI三种模式的方法。此外，前人工作没有控制变量地系统对比过RGB视觉提示与独立通道掩码提示在不同融合位置的效果。
- **本质改动**: 引入“指令规范化”机制，将用户的三种输入统一转换为“文本提示+指示掩码”的标准表示，并在此基础上系统对比了不同的掩码注入方式（视觉提示 vs 独立通道提示）和两阶段训练策略，从而用单一VLA兼容三种指令模式。
- **技术溯源**: 基于预训练VLA $\pi_0$，使用 SAM 2 进行点击到掩码的分割与跟踪，在 LIBERO 仿真环境和 UR5e 真机上进行验证。

**2. 技术拆解**
- **核心方法**: 
  1. **指令规范化**：将LI、VLI、VI统一为文本+掩码。LI只有文本（掩码置零）；VLI是文本+点击生成的掩码；VI是固定默认文本（"follow visual instruction"）+点击生成的掩码。
  2. **提示方法对比**：对比了将掩码输入VLA的4种方式：2种RGB视觉提示（VP-BBox画红框，VP-Fade背景变暗）和2种独立通道掩码提示（MP-Early在视觉编码器前相加，MP-Late在视觉编码器后相加）。
  3. **两阶段训练策略**：第一阶段仅用LI数据微调VLA以适应任务，第二阶段混合LI、VLI、VI数据联合训练。
- **关键细节**: 
  - **掩码生成**：用户点击图像，SAM 2 生成并跟踪掩码（分为目标Mask-T、放置目标Mask-G、参考物Mask-R）。
  - **独立通道掩码处理**：将掩码和RGB图像分别Patch Embed，MP-Early在输入视觉编码器前逐元素相加，MP-Late在视觉编码器提取特征后、输入LLM前相加。当掩码为全0时，嵌入也为0，不影响LI模式。
  - **训练超参**：全参数微调，AdamW优化器，总步数60k（仿真）或30k（真机），batch size 32。
- **训练/优化目标**: 保持基座VLA（$\pi_0$）的原有动作预测训练目标（行为克隆），不改变输出动作空间。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：LIBERO (Object, Spatial, Goal) 及其 Zero-Shot 变体（打乱物体位置等）。对比4种提示方法和3种训练策略（2S两阶段, 1S单阶段, 2S-NoLI第二阶段无LI数据）。基座模型为 $\pi_0$。
  - **真机**：3个任务（PickBlock, PutBlock, OrganizeToy），使用UR5e机械臂。对比DeicticVLA (采用MP-Late和2S策略) 和 纯LI baseline。测试条件包括分布内(TL1)、分布外组合(TL2)、分布外外推(TL3)、视觉变化(VC-Surface)、新实例(NO-Instance)和新类别(NO-Category)。
- **评价指标**: 任务成功率 (Success Rate, SR)，以及指示掩码对成功率的贡献 ($\Delta$SR = 有掩码时的SR - 无掩码时的SR)。
- **主要结果**: 
  - **仿真**：4种提示方法在分布内成功率相近（~95%）。在Zero-Shot布局下，VP-BBox表现最好，MP-Late在独立通道方法中Zero-Shot最强且对单阶段训练鲁棒。两阶段训练(2S)对Zero-Shot泛化至关重要；第二阶段保留LI数据能防止LI模式性能崩溃，且不损害VLI/VI性能。
  - **真机**：单一策略成功支持三种模式。在未见指令(TL2/TL3)、新物体(NO-Instance/NO-Category)下，VLI和VI大幅领先LI。特别是在未见类别(NO-Category)下，VLI和VI达到100%成功率，而联合训练的LI仅为16.7%。但联合训练后的LI模式在部分任务上不如纯LI baseline，说明小样本真机数据下多模式的数据配比仍需优化。

### 20. 🔥 [PHR-VLA: Planning Horizon Reasoning for Vision-Language-Action Models] (PHR-VLA：视觉-语言-动作模型的规划视野推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.27609` | [点击跳转](https://arxiv.org/abs/2608.27609)

**0. 论文标题**
- **英文标题**: PHR-VLA: Planning Horizon Reasoning for Vision-Language-Action Models
- **中文标题**: PHR-VLA：视觉-语言-动作模型的规划视野推理
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作通过在训练时引入未来观测的特权潜在动态对齐目标，让 VLA 在内部隐式地学习未来规划视野的推理能力，而在推理时完全丢弃辅助模块，实现了零额外延迟的性能提升。

**1. 整体逻辑**
- **研究任务**: 通用机器人操作（根据语言指令和视觉观测直接生成机器人控制动作）。
- **研究动机**: 现有 VLA 主要基于当前帧做反应式预测，缺乏对未来任务动态的显式推理，这在接触丰富的精细操作中是短板。而现有的引入记忆或世界模型的方法，要么需要处理长序列增加推理延迟，要么需要复杂的自回归生成，不适合实时控制。
- **本质改动**: 把“预测未来”作为训练时的特权监督信号（Privileged Supervision），通过一个轻量级辅助头让模型内部特征对齐未来动态，推理时直接扔掉这个头，不增加任何推理负担。
- **技术溯源**: 基于 SmolVLA (0.45B) 作为 VLA 基座，使用 SigLIP 和 V-JEPA 2 作为冻结的视觉编码器来提取潜在动态特征。

**2. 技术拆解**
- **核心方法**: 训练阶段，利用数据集中未来规划视野内的特权帧，通过冻结的视觉编码器提取特征，并计算相邻帧特征的差值作为“潜在动态”目标。VLA 骨干网络输出的动作 token 同时输入给标准动作头和一个轻量级辅助未来头，辅助头负责预测这个潜在动态目标。推理阶段，直接丢弃辅助未来头和冻结编码器，走原版 VLA 的推理流程。
- **关键细节**: 
  - **模型结构**: SmolVLA (0.45B) 骨干 + Flow-matching 动作头 + 轻量级辅助未来头。
  - **潜在动态目标**: 不预测未来的绝对特征，而是预测相邻帧特征的差分（$y_{t:t+H} = s_{t+1:t+H} - s_{t:t+H-1}$），让模型专注学习场景变化而非静态背景。
  - **监督粒度与视角**: 采用 Patch-level（图块级）监督优于全局均值池化；采用 Wrist camera（腕部相机）视角优于第三人称视角，因为腕部相机能捕捉最关键的局部接触动态。
  - **关键超参**: 辅助损失权重 $\lambda = 0.02$。
- **训练/优化目标**: 总损失为标准的 VLA 动作预测对数似然损失（$\mathcal{L}_{VLA}$）加上辅助未来头预测与特权潜在动态之间的均方误差对齐损失（$\mathcal{L}_{Align}$）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO（仿真桌面操作）、Meta-World（仿真操作）、Real-world disassembly tasks（真实世界接触丰富的拆卸任务）。
  - **对比对象 (Baseline)**: ACT, Diffusion Policy, Octo, DiT Policy, OpenVLA, TinyVLA, SmolVLA。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - 在 LIBERO 上，PHR-VLA 将 SmolVLA 的平均成功率从 84.1% 提升至 88.4%，其中长视野任务（LIBERO-Long）提升最显著（+8.4%）。
  - 在 Meta-World 上（环境仅有第三人称相机），成功率从 56.7% 提升至 57.8%。
  - 在真实世界拆卸任务上，成功率从 63.3% 大幅提升至 82.5%。
  - 消融实验证实了核心设计的有效性：监督未来特征的“差分”优于监督“绝对特征”；Patch 级监督优于 Mean 池化；腕部相机监督优于第三人称相机。

### 21. 🔥 [Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models] (超越数据缩放：面向视觉-语言-动作模型的以表征为中心的持续预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.27550` | [点击跳转](https://arxiv.org/abs/2608.27550)

**0. 论文标题**
- **英文标题**: Beyond Data Scaling: Representation-Centric Continued Pre-training for Vision-Language-Action Models
- **中文标题**: 超越数据缩放：面向视觉-语言-动作模型的以表征为中心的持续预训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种以表征为中心的VLA持续预训练方案（VLAct），通过保护VLM先验、多头协同监督和跨具身形态动作空间统一，在有限数据和16卡算力下实现了极强的跨任务与跨具身形态迁移能力。

**1. 整体逻辑**
- **研究任务**: 构建通用的视觉-语言-动作（VLA）模型，解决在有限的机器人数据预算下，如何通过持续预训练学习可迁移的视觉-动作表征，而不是单纯地拟合动作。
- **研究动机**: 机器人轨迹数据难以像图文数据那样海量扩展（需要具身采集且物理世界覆盖稀疏）。现有的VLA持续预训练往往退化为单纯的“大规模动作拟合”，导致三个失败模式：1）端到端微调会破坏VLM原有的通用视觉-语言先验（表征漂移）；2）单一动作头监督会导致骨干网络对该特定头过拟合（表征坍塌）；3）特定于具身形态的输出空间阻碍了跨机器人的动作语义共享。
- **本质改动**: 将VLA持续预训练从“动作拟合”转变为“视觉-动作知识蒸馏”。不单纯追求在预训练分布上的动作预测精度，而是通过冻结浅层、混合图文数据、多头协同监督以及部分统一动作空间，强制骨干网络学习通用、解耦且可复用的动作感知表征。
- **技术溯源**: 基于预训练的 VLM（Qwen3-VL-4B），动作头设计参考了 OFT、PI、GR00T 等现有工作，基于 StarVLA 训练代码库实现。

**2. 技术拆解**
- **核心方法**: 提出 VLAct 持续预训练方案，包含三个核心机制：1）VLM先验保护；2）多头连续动作协同监督；3）跨具身形态部分统一动作空间。
- **关键细节**: 
  - *VLM先验保护*：冻结视觉编码器和LLM的下半部分层，防止窄分布的机器人数据导致底层表征漂移；在预训练数据中混合图像描述（Caption）数据，提供密集的语义监督锚点。
  - *多头协同监督*：在预训练时同时挂载 OFT、PI、GR00T 三个连续动作头，共享同一个隐层表征预测相同的动作，防止表征向单一解码器的几何空间坍塌（即避免 decoder lock-in）。
  - *部分统一动作空间*：共享物理意义相同的维度（如夹爪开合），屏蔽不兼容的维度（如不同机械臂的关节）；对绝对关节角度使用 wrap-aware loss 处理周期性边界问题（如 179° 和 -179° 的物理距离）。
  - *规模与超参*：基座模型为 Qwen3-VL-4B，预训练仅使用 16 张 GPU。
- **训练/优化目标**: 预训练阶段的总损失为：三个连续动作头（OFT, PI, GR00T）的动作损失之和 + 混合图文数据的 VLM 交叉熵损失（权重为0.5） + 周期性关节角度的 wrap-aware loss。

**3. 实验结果**
- **实验设置**: 
  - *数据集*：预训练使用全开源机器人数据（DROID, InternA1, RoboCoin, MolmoAct）及图文描述数据。下游微调使用各基准自带数据。
  - *对比对象 (Baseline)*：OpenVLA, $\pi_0$, $\pi_{0.5}$, Abot-M0, LingBot-VLA, GR00T-N1.6, 以及各类 WAM (World-Action-Model) 模型。
  - *测试环境*：LIBERO-Plus 和 VLA-Arena (单臂Franka), RoboTwin 2.0 和 DOMINO (双臂AgileX), RoboDojo (ARX X5), RoboCasa-GR1 (人形GR-1)，以及真实世界 Franka 机械臂实验。
- **评价指标**: 任务成功率 (Success Rate, SR)、部分进度得分 (Partial-progress score)、操作得分 (Manipulation Score, MS)。
- **主要结果**: 
  - *单臂/双臂仿真*：在 LIBERO-Plus 上达到 82.6% 成功率（超越工业级系统 Abot-M0 的 80.5%）；在 RoboTwin 2.0 上达到 92.5% (Clean) / 90.8% (Random)，超越多个前沿 VLA 系统。
  - *RoboDojo (ARX X5)*：平均分 10.66，成功率 7.60%，在 35 个策略中排名第六，超越所有显式指定的 WAM 模型及多个工业系统。
  - *跨具身形态迁移 (RoboCasa-GR1)*：在预训练未见过的 GR-1 人形机器人上，仅用 20% 下游数据即达到 49.5% 成功率，超越全数据微调的 GR00T-N1.6 baseline (47.6%)。
  - *真实机器人实验*：在单臂短/长视野、双臂协调及 OOD 泛化任务中，全面超越未预训练的 Qwen3VL-OFT baseline（如双臂折叠裤子任务从 40% 提升至 70%）。
  - *结论*：证明了在 modest compute (16 GPU) 和全开源数据下，以表征为中心的持续预训练能带来显著的性能提升，是独立于数据缩放的重要进展。

### 22. 🔥 [AcrossVAM1.0: Particle World Modeling for Text-Assisted Robot Video Prediction] (AcrossVAM1.0：用于文本辅助机器人视频预测的粒子世界建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.28491` | [点击跳转](https://arxiv.org/abs/2608.28491)

**0. 论文标题**
- **英文标题**: AcrossVAM1.0: Particle World Modeling for Text-Assisted Robot Video Prediction
- **中文标题**: AcrossVAM1.0：用于文本辅助机器人视频预测的粒子世界建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出AcrossVAM1.0，将机器人视频预测解耦为低维语义粒子动力学和高频外观合成，在显著提升运动预测准确性的同时，通过残差融合机制保持了静态区域的视觉保真度。

**1. 整体逻辑**
- **研究任务**: 机器人视频预测（根据历史上下文视频帧和自然语言指令，预测未来的视频帧序列）。
- **研究动机**: 现有的全局像素或隐空间模型将运动推理和外观生成耦合在一起。在机器人视频中，大部分像素是静态的，模型很容易通过直接复制最后一帧（persistence）来刷高全局图像指标，从而掩盖了其在关键运动部件预测上的不足。
- **本质改动**: 将视频预测解耦为“以物体为中心的运动”和“密集的外观”两个独立分支。用低维语义粒子表示机器人关键部件的几何运动，用单独的因果外观流从最后一帧恢复高频纹理，文本指令仅通过特征调制注入到运动动力学中，防止未来外观信息泄露。
- **技术溯源**: SAM3-DLP（语义粒子提取）、OpenCLIP（文本编码）、Transformer（时空动力学）、FiLM（特征调制）、粒子/Slot表示（如DDLP等）。

**2. 技术拆解**
- **核心方法**: 
  1) **冻结的语义粒子编解码器**：使用冻结的SAM3-DLP提取机器人整体、机械臂、夹爪3个语义粒子及背景特征，通过匈牙利匹配进行帧间身份对齐。
  2) **文本辅助的粒子动力学**：用小型时空Transformer自回归预测粒子未来状态（位置、尺度等），通过FiLM层注入OpenCLIP提取的文本特征，实现语言对运动的调制。
  3) **因果运动-外观解码器**：粒子渲染出运动结构，另一分支仅从最后一帧提取外观特征。通过残差细化器和学习的混合掩码（delivery mask）融合两者生成最终视频帧。
- **关键细节**: 
  - **输入输出**：4帧上下文（128×128分辨率）+ 文本指令 $\rightarrow$ 5帧未来视频。
  - **模型规模**：动力学核心仅0.28M参数，总可训练参数约9.5M（不含冻结的SAM3-DLP和OpenCLIP基座）。
  - **粒子状态**：包含位置、尺度、深度、存在性和外观特征。
- **训练/优化目标**: 
  - **动力学损失**：单步转移和自回归rollout的L1损失。
  - **外观损失**：L1损失 + (1-SSIM) + LPIPS，并在运动区域进行额外加权。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建VRS (Video Robot Segmentation) 基准，基于DROID风格的真实机器人轨迹构建，包含2746个片段，涵盖Franka、WidowX、Mobile ALOHA等10种机器人。
  - **对比对象**：主要对比Persistence（复制最后一帧基线）及内部变体（如纯粒子生成、固定掩码融合等）。因公开baseline（如FitVid, SlotFormer等）未在相同VRS协议下评测，作者列出了复现计划，当前未提供直接对比数值。
- **评价指标**: 全局 PSNR, SSIM, LPIPS；运动区域 PSNR (Motion PSNR)；粒子轨迹误差 (Trajectory error)。
- **主要结果**: 
  - **运动预测**：粒子动力学使轨迹误差比Persistence基线降低了21.0%；原始粒子生成的Motion PSNR从11.89提升至13.23。
  - **全局图像质量**：AcrossVAM1.0的PSNR从19.97提升至20.573±0.009，SSIM从0.796提升至0.8004±0.0002，证明残差融合有效恢复了静态区域的保真度。
  - **局限性**：LPIPS (0.1304±0.0004) 仍劣于Persistence (0.122)；文本指令变化对轨迹误差的影响极小（仅2.8%–3.1%），语言grounding能力有限；跨机器人泛化表现不一致（在Franka上提升21.1%，在Mobile ALOHA上下降16.1%）。
