            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [DLAM: Distributional Latent Actions with Temporal Constraints] (DLAM：具有时间约束的分布隐动作模型)
- **研究机构**: `多机构联合研究（原文未直接列出具体机构名称，由多位作者联合完成）`
- **Arxiv ID**: `2607.27138` | [点击跳转](https://arxiv.org/abs/2607.27138)

**0. 论文标题**
- **英文标题**: DLAM: Distributional Latent Actions with Temporal Constraints
- **中文标题**: DLAM：具有时间约束的分布隐动作模型
- **研究机构**: 多机构联合研究（原文未直接列出具体机构名称，由多位作者联合完成）

**1. 整体逻辑**
- **研究任务**: 从大量无动作标签的视频中学习“隐动作”（Latent Actions），并将其迁移到下游的机器人视觉-语言-动作（VLA）策略中，缓解机器人带标签动作数据稀缺的问题。
- **研究动机**: 现有的隐动作模型（如 ALAM）虽然引入了时间约束，但把状态转移表示为“确定性的点”。这种点估计在长序列递归组合时，局部的残差误差会不断累积和放大，导致长程预测崩盘，学出来的特征也不适合跟真实的机器人动作做联合生成。
- **本质改动**: 把隐动作的表示从“确定性的点”改成“对角高斯分布”。在预测转移均值的同时预测维度级方差，让时间约束（组合和反转）同时作用于均值和方差，从而提供更丰富的监督信号，压制长序列的误差累积。
- **技术溯源**: 下游策略迁移基于 Physical Intelligence 的 $\pi_0$ 模型（视觉语言主干使用 PaliGemma-2B，动作专家使用 Gemma-300M），采用 Flow Matching 生成框架。

**2. 技术拆解**
- **重点改进**: 
  1. **分布表示**：Encoder 输出隐动作的均值和方差，Decoder 只用均值做图像重建，方差作为辅助训练信号。
  2. **分布的时间约束**：提出针对高斯分布的归一化组合和反转。组合时引入一个轻量级的共享相关系数来计算方差，考虑了相邻转移共享中间帧的依赖性；反转时均值取反，方差不变。
  3. **下游迁移**：冻结预训练的 Encoder，只提取“均值”序列作为辅助目标，和真实的机器人动作一起用 Flow Matching 联合生成，推理时只执行机器人动作，不需要把方差传给策略，也不需要额外的隐动作到真实动作的解码器。
- **架构细节**: 
  - **预训练阶段**：关系编码器（Relational Encoder）处理两帧图像，输出 $K$ 个 token 的均值和 log-variance；源条件解码器（Source-conditioned Decoder）根据源帧和均值重建目标帧。
  - **下游策略阶段**：基于 $\pi_0$ 架构。冻结的 LAM Encoder 提取连续帧的隐动作均值，投影后与机器人动作 token 交错拼接（interleaved）。策略模型同时输出隐动作轨迹和可执行的机器人动作轨迹。
- **核心 Loss**: 
  - **预训练 Loss**：重建 Loss（MSE）、先验 Loss（KL散度）、组合约束 Loss（匹配直接编码和组合后的均值与方差）、反转约束 Loss（匹配正向和反向的均值与方差）。
  - **下游迁移 Loss**：Flow Matching Loss，分为机器人动作流的 Loss 和各个相机视角隐动作均值流的 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **预训练**：11 个无动作标签的视频数据集（主要来自 Open X-Embodiment 和 CALVIN）。
  - **下游评测**：MetaWorld MT50（50个任务，分4个难度）、LIBERO（4个套件）和 4 个真实世界机械臂任务（插圆柱、插立方体、插花、挂杯子）。
  - **对比方法**：纯重建 LAM、确定性 ALAM，以及 RT-2、OpenVLA、$\pi_0$、$\pi_{0.5}$、SmolVLA 等主流 VLA 模型。
- **评价指标**: 
  - **表示与重建**：PSNR、SSIM、LPIPS，以及时间跨度诊断指标（组合残差、反转残差）。
  - **下游控制**：任务成功率（Success Rate）。
- **实验结果**: 
  - **重建与表示**：直接重建 PSNR 提升 3.45 dB，累积重建提升 1.17 dB。在长跨度（3k-10k帧）下，DLAM 的组合和反转残差显著低于 ALAM，长程时间一致性更好，误差没有随跨度增加而明显放大。
  - **下游控制**：在 $\pi_0$ 迁移协议下，MetaWorld MT50 平均成功率达到 87.6%（比 $\pi_0$+ALAM 的 85.0% 和纯 $\pi_0$ 的 47.9% 都有明显提升）；LIBERO 平均成功率 99.0%（baseline 最高 98.1%）；真实世界 4 个任务平均成功率 73.8%。
  - **消融实验**：归一化均值约束对重建提升贡献最大，而学习方差和相关感知组合对下游控制成功率有互补的提升作用。

### 2. 🔥 [RL2-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models] (RL2-VLA：面向视觉-语言-动作模型的自适应强化学习隐空间组合引导与测试时缩放)
- **研究机构**: `新加坡国立大学 (National University of Singapore), 多伦多大学 (University of Toronto), 新科工程 (Singapore Technologies Engineering)`
- **Arxiv ID**: `2607.26991` | [点击跳转](https://arxiv.org/abs/2607.26991)

**0. 论文标题**
- **英文标题**: RL2-VLA: Adaptive RL Latent Compositional Steering with Test-Time Scaling for Vision-Language-Action Models
- **中文标题**: RL2-VLA：面向视觉-语言-动作模型的自适应强化学习隐空间组合引导与测试时缩放
- **研究机构**: 新加坡国立大学 (National University of Singapore), 多伦多大学 (University of Toronto), 新科工程 (Singapore Technologies Engineering)

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在分布外（OOD）和复杂任务中的推理时（测试时）表现。
- **研究动机**: VLA在没见过的任务上性能容易下降。现有的测试时推理方法（如重复采样、改写提示词）生成的动作样本同质化严重，容易陷入相同的失败模式。更致命的是，现有方法不管VLA本来能不能做对，都强行进行干预，导致原本准确的动作被过度扰动反而做错了。
- **本质改动**: 训了一个轻量的RL小模型，用VLA中间层的隐变量（latents）做输入。推理时，把RL模型生成的动作趋势（速度场）和VLA的趋势进行加权融合（组合引导）。同时引入失败检测机制，只有在预测VLA要失败时才开启融合，成功时就让VLA按原策略执行。
- **技术溯源**: 基于 π0 和 OpenVLA 等VLA基座；使用 SAFE 作为失败检测器；使用 QAM (Q-learning with Adjoint Matching) 算法训练 RL 策略。

**2. 技术拆解**
- **重点改进**: 
  1. **如何引导**：用基于VLA隐变量的轻量级离线RL flow-matching策略，通过速度场组合（compositional steering）来引导VLA，既保留了VLA模仿学习的先验，又利用RL引入了跳出示范数据分布的动作多样性。
  2. **何时引导**：发现测试时缩放在成功和失败状态下规律不同（多样性在失败时能救场，在成功时会帮倒忙）。因此改为自适应引导，仅在预测失败时激活。
- **架构细节**: 
  - **输入输出**：输入为观测图像、本体感受和语言指令，输出为动作序列（action chunk）。
  - **模型结构**：主体是冻结的VLA（如π0）。提取VLA动作头前端的隐变量，喂给轻量的 RL flow-matching 策略。RL策略输出引导速度场，与VLA自身的速度场做加权平均。对于自回归VLA（如OpenVLA），则改用高斯扰动进行组合。并行运行的失败检测模块根据隐变量判断是否开启引导。最后通过外部验证器（verifier）从候选动作中选出最优解。
- **核心 Loss**: RL策略训练使用 QAM 的匹配 Loss（$L_{AM}$）。因为直接对 flow-matching 的多步生成过程做反向传播数值不稳定，QAM 通过计算伴随状态（adjoint state）作为时间相关的引导信号，将优化转化为稳定的逐步速度场匹配。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真评估使用 SIMPLER 和 PolaRiS 基准（包含域内和OOD任务）；RL策略训练使用 BridgeV2 和 DROID；真机评估使用 PiperX 机械臂。
  - **Baseline**：Repeated（重复采样）、Rephrase（改写提示词）、RBF（径向基函数排斥），以及多种离线RL引导方法（如直接RL、残差策略、拼接策略等）。
- **评价指标**: 任务成功率（Success Rate），以及归一化均方根误差（NRMSE，用于分析测试时缩放定律）。
- **实验结果**: 
  - 在 SIMPLER 和 PolaRiS 的 OOD 设置中，RL2 比最强 baseline 的成功率最高提升了 **+17.3%**。
  - 在真实机器人实验中，成功率比最强 baseline 平均提升了 **+17.5%**。
  - 消融实验证明，使用VLA隐变量、RL训练以及自适应机制（仅在失败时引导）缺一不可，且该框架引入的额外推理延迟极小。

### 3. 🔥 [Route by Kinematics, Act by Observation: Kinematics-Supervised Expert Routing in MoE-Augmented VLA] (按运动学路由，按观测执行：MoE增强VLA中的运动学监督专家路由)
- **研究机构**: `清华大学 (Tsinghua University)`
- **Arxiv ID**: `2607.26807` | [点击跳转](https://arxiv.org/abs/2607.26807)

**0. 论文标题**
- **英文标题**: Route by Kinematics, Act by Observation: Kinematics-Supervised Expert Routing in MoE-Augmented VLA
- **中文标题**: 按运动学路由，按观测执行：MoE增强VLA中的运动学监督专家路由
- **研究机构**: 清华大学 (Tsinghua University)

**1. 整体逻辑**
- **研究任务**: 机器人操作任务中的视觉-语言-动作（VLA）模型动作生成。
- **研究动机**: 现有的 MoE-VLA 模型通常用视觉和语言特征做隐式路由。但这存在一个物理常识错位：“长得像”不代表“动作像”（比如“拿杯子”和“拧瓶盖”视觉相似但运动学完全不同），“长得不像”可能“动作一样”（比如“推盘子”和“推书”）。这导致推理时路由器经常分错专家。此外，训练时有真实动作，推理时只有观测，存在信息不对称，隐式路由很难学到真正的运动学规律。
- **本质改动**: 提出了一种“运动学监督的显式路由（KinRT）”。训练时，先对动作轨迹做聚类，找出几种典型的“运动学原型”，用聚类 ID 当标签去显式训练路由器；推理时，路由器只看视觉和语言输入来分发专家。相当于把动作空间的运动学规律，非对称地蒸馏到了观测空间。
- **技术溯源**: 视觉语言前缀基于 SigLIP 和 PaliGemma-2B，动作生成后缀基于 Gemma-300M，动作头采用 Flow Matching。对比和借鉴了 OpenVLA、$\pi_0$、$\pi_{0.5}$ 等开源或主流 VLA 基座。

**2. 技术拆解**
- **重点改进**: 把 MoE 里靠梯度自己学的隐式路由，改成了用动作聚类标签监督的显式全局路由（Global Router），并且引入了非对称的信息桥接机制。
- **架构细节**: 
  - **整体架构**: 采用 Mixture-of-Transformers，前缀流处理图文（SigLIP + PaliGemma-2B），后缀流生成动作（Gemma-300M + MoE）。
  - **MoE 设计**: 每个 Transformer block 的 FFN 换成“共享分支 + 路由分支”并联，权重各占 1/2。共享分支保持常开，保证基础能力不丢，专家只学增量特征。
  - **运动学聚类**: 取未来 50 步动作的位置和速度特征（拼接后 1386 维），用 PCA 降到 64 维，然后做 K-means 聚类（实验中聚成 4 类），得到每帧的聚类 ID 作为路由标签。
  - **全局路由**: 把前缀流的输出 token 做 masked mean pooling 得到 2048 维向量，过一个线性层输出 logits，做 Top-1 路由。这个路由决策是全局的，18 层 Transformer 共享同一个路由结果，不逐层路由。
- **核心 Loss**: 
  - **主 Loss**: Flow Matching 的 MSE Loss，目标是预测动作速度场（$v_t = \epsilon - a_0$）。
  - **辅助 Loss**: 路由器的交叉熵 Loss，用运动学聚类 ID 作为 Ground Truth 进行监督。同时引入了样本重采样权重（resampling weight）来缓解聚类类别不平衡的问题。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: RoboTwin（仿真，8个操作任务）和 DIYRobot（实机，作者用 3D 打印搭建的成本不到 2000 美元的 14 自由度双臂平台，5个操作任务）。
  - **Baseline**: Dense 模型（OpenVLA, RDT-1B, $\pi_0$, $\pi_{0.5}$）和 MoE 模型（Hi-MoE, AdaMoE）。
- **评价指标**: 任务成功率（每个任务在仿真测 100 次，实机测 50 次，统计成功次数）。
- **实验结果**: 
  - **RoboTwin 仿真**: KinRT-LoRA 平均成功率达到 40.8%（Clean设置），比最强的 Dense 模型 $\pi_{0.5}$-LoRA（33.1%）相对提升 23.26%。
  - **DIYRobot 实机**: KinRT-Full 平均成功率达到 35.6%，比 $\pi_{0.5}$-Full（29.6%）相对提升 20.27%。
  - **对比结论**: 显式运动学路由（KinRT）明显比隐式观测路由（如 AdaMoE）和纯 Dense 模型表现更好，证明了解决“视觉-运动学不对齐”问题的有效性。

### 4. 🔥 [CheckVLA: Execution-Time Verification with Action-Conditioned World Model for Long-Horizon Mobile Manipulation] (CheckVLA：基于动作条件世界模型的长程移动操作执行时验证)
- **研究机构**: `清华大学（深圳国际研究生院）等`
- **Arxiv ID**: `2607.26789` | [点击跳转](https://arxiv.org/abs/2607.26789)

**0. 论文标题**
- **英文标题**: CheckVLA: Execution-Time Verification with Action-Conditioned World Model for Long-Horizon Mobile Manipulation
- **中文标题**: CheckVLA：基于动作条件世界模型的长程移动操作执行时验证
- **研究机构**: 清华大学（深圳国际研究生院）等

**1. 整体逻辑**
- **研究任务**: 长程移动操作（Long-Horizon Mobile Manipulation），主要解决 VLA 模型在开环执行动作块（action chunks）时的故障检测与纠错问题。
- **研究动机**: 现有的 VLA 模型通常一次性生成一个动作块（如未来 10 步的动作）然后开环执行，期间不更新高层视觉输入。如果执行中发生意外（如物体滑落、底盘打滑），剩余动作会继续执行并放大错误。现有的异常检测大多只看观测，缺乏“动作条件”参考，分不清“预期的环境变化”和“意外故障”；而策略自身的置信度又无法对发出动作后的偏离做出反应。
- **本质改动**: 引入一个独立训练的“动作条件世界模型”作为验证器。在动作块执行期间，实时对比“世界模型预测的未来观测”和“实际观测”，通过统计学校准的阈值判断是否出错。一旦出错，在考虑推理延迟的前提下，重写剩余可执行的动作后缀，并利用关键帧记忆防止修复时遗忘之前的进度。
- **技术溯源**: VLA 策略基于 Physical Intelligence 的 π0.5 (flow-matching 架构)；验证器的视觉特征提取基于 V-JEPA 2-AC。

**2. 技术拆解**
- **重点改进**: 
  1. **动作条件验证**：把开环动作块看作对未来观测的预测。世界模型根据当前观测和剩余动作预测短期未来特征，与实际观测计算差异。
  2. **共形校准触发**：用共形预测（Conformal Prediction）设定风险阈值，在统计上控制“误报率（不必要的首次干预）”低于设定值，以此决定何时打断执行。
  3. **延迟感知后缀重写**：打断后重新规划时，考虑到模型推理需要时间，直接硬截断已经来不及修改的动作前缀，只重写来得及部署的后缀。重写时根据风险超标的程度，自适应地保留原动作的引导。
  4. **事件驱动记忆**：建立一个关键帧特征库，记录已完成的子目标，修复时通过交叉注意力读取，防止模型在纠错时遗忘已完成的子任务。
- **架构细节**: 
  - **策略模型**：基于 π0.5 的 flow-matching VLA，移动（底座）和操作（机械臂）使用解耦的专家网络，通过共享的 VLM 前缀进行自注意力交互。
  - **验证器**：使用冻结的 V-JEPA 2-AC 提取观测特征，动作条件世界模型预测未来 k 步特征。一个因果风险头（Causal Risk Head）聚合多步的差异分数，输出最终风险值。
  - **输入输出**：输入为语言指令、多视角图像、本体感觉和历史关键帧；输出为底座和机械臂的动作序列。
- **核心 Loss**: 
  - **世界模型**：特征空间的预测 Loss（先用 teacher forcing，再用自回归 rollout 训练）。
  - **风险头**：在成功、自然失败和物理扰动数据上训练的分类/回归 Loss，用于区分正常偏差和失败前兆。
  - **策略模型**：常规的 Flow-matching 动作生成 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：RoboCasa365（365个家庭移动操作任务）。训练数据严格限制在 Human300（300个任务，每个100条人类演示）。
  - **Baseline**：对比了 Diffusion Policy, π0, π0.5, GR00T-N1.5/1.6, Qwen-RobotManip 等主流方法；内部对比了周期性重规划（periodic replanning）等执行策略。
- **评价指标**: 
  - **任务成功率**：分为原子任务（A-S）、组合已知任务（C-S）和组合未知任务（C-U）。
  - **误报率（FWER）**：episode 级别的不必要首次干预概率。
  - **及时召回率（Timely recall）**：在可恢复窗口内成功检测并修复故障的比例。
- **实验结果**: 
  - **整体成功率**：在 RoboCasa365 上平均成功率达到 36.1%，在 Human300 预训练设定下达到 SOTA（比 π0.5 高 19.2%，比 Qwen-RobotManip 高 0.2%）。
  - **内部对比**：在相同的模型调用预算下（约 10 次/episode），比周期性重规划（27.6%）高出 8.5 个百分点。
  - **检测性能**：在 5% 的目标误报率下，动作条件验证器的及时召回率达到 77.9%，远高于纯观测验证器（48.6%）和动作打乱验证器（37.9%），证明“动作条件”对区分预期变化和意外故障至关重要。

### 5. 🔥 [ContactFlow: A video action conditioning that transfers across embodiments] (ContactFlow：一种可跨具身迁移的视频动作条件表征)
- **研究机构**: `University of Bonn, Lamarr Institute（波恩大学，拉马尔研究所）`
- **Arxiv ID**: `2607.26579` | [点击跳转](https://arxiv.org/abs/2607.26579)

**0. 论文标题**
- **英文标题**: ContactFlow: A video action conditioning that transfers across embodiments
- **中文标题**: ContactFlow：一种可跨具身迁移的视频动作条件表征
- **研究机构**: University of Bonn, Lamarr Institute（波恩大学，拉马尔研究所）

**1. 整体逻辑**
- **研究任务**: 基于视频的世界模型（Video World Models）在机器人操作中的动作规划与轨迹验证。
- **研究动机**: 现有的视频世界模型难以准确捕捉物理接触约束，且动作条件（如关节角、末端位姿或全身掩码）通常与特定具身（如某款机械臂或人手）强绑定，导致模型无法在人类演示和不同形态的机器人之间迁移。
- **本质改动**: 提出 Contact Flow（接触流），用执行者（人手或夹爪）与目标物体表面的“3D接触点轨迹”作为动作条件。丢弃执行者的外观和运动学特征，只保留接触几何，让人类和不同机器人共享同一种动作表征。
- **技术溯源**: 视频生成基座采用 Wan（Wan2.1-14B / Wan2.2-5B/14B）；控制注入采用 ControlNet 和 VACE；数据处理和推理管线依赖 HaMeR（人手姿态）、HACO（接触估计）、SAM3（分割）、FoundationStereo（深度估计）和 Gemini（VLM验证）。

**2. 技术拆解**
- **重点改进**: 将动作条件从“具身相关的关节/末端状态”或“包含执行者外形的掩码”改为“纯物体视角的3D接触点流”。在推理时，只需将策略生成的末端轨迹结合夹爪几何，投影到物体表面生成 Contact Flow，即可驱动视频模型预测未来，实现跨具身的零样本迁移。
- **架构细节**: 
  - **输入**: 首帧图像 $x_0$ 和 7通道的稀疏 Contact Flow 视频序列 $C_{1:T}$（包含3D位置、3D位移、1个置信度权重）。
  - **模型结构**: 基于 DiT 架构的潜在视频扩散模型。通过 ControlNet（复制编码器分支）或 VACE（Video Condition Unit）将 Contact Flow 注入冻结的生成主干。
  - **推理管线**: 采用 propose-imagine-verify-act 流程。策略模型生成候选轨迹 -> 转换为 Contact Flow -> 视频世界模型生成预测视频 -> VLM (Gemini) 判断视频是否完成任务 -> 验证成功则在真机开环执行。
- **核心 Loss**: 采用 Flow-matching（流匹配）损失函数，在潜在空间预测速度场：$\mathcal{L}_{FM} = \mathbb{E}[\|v_\theta(u_\tau, \tau, z_0, C_{1:T}) - (z_{1:T} - \epsilon)\|_2^2]$。训练时通过掩码剔除执行者（人手/机械臂）区域，强制模型只学习物体和环境的物理动态。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 混合了人类和机器人数据集（DROID, Taste-ROB, TACO, OakInk, LIBERO）。
  - **Baselines**: TesserAct（纯语言条件）、CTRL-World（低维动作嵌入，绑定特定具身）、Kinema4D（4D点云条件，包含完整机器人几何，为主要对比方法）。
- **评价指标**: 
  - **生成质量**（掩码掉执行者区域后计算）：PSNR, SSIM, LPIPS, DreamSim。
  - **全局分布指标**：FID, FVD。
  - **真机表现**：真实机器人任务成功率（基于 VLM 验证的零样本规划）。
- **实验结果**: *（注：提供的文本在实验具体数值处截断，以下为基于实验设置与结论的总结）* Contact Flow 在 DROID 数据集和真实桌面操作任务中，有效提升了视频预测的物理合理性。相比包含完整机器人几何的 Kinema4D 等基线，Contact Flow 凭借与具身解耦的特性，成功实现了从人类演示到不同机器人形态的跨具身迁移，并在未见过的场景和物体上完成了零样本轨迹验证与真机操作。

### 6. 🔥 [Explicit Kinematic Guidance from Analytic Concepts for Vision-Language-Action Models] (基于解析概念的显式运动学引导视觉-语言-动作模型)
- **研究机构**: `浙江大学、上海交通大学、西湖大学、复旦大学、上海创新研究院`
- **Arxiv ID**: `2607.26513` | [点击跳转](https://arxiv.org/abs/2607.26513)

**0. 论文标题**
- **英文标题**: Explicit Kinematic Guidance from Analytic Concepts for Vision-Language-Action Models
- **中文标题**: 基于解析概念的显式运动学引导视觉-语言-动作模型
- **研究机构**: 浙江大学、上海交通大学、西湖大学、复旦大学、上海创新研究院

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的微调，特别是针对涉及铰接物体（如开抽屉、开门）等具有强运动学约束的机器人操作任务。
- **研究动机**: 现有的VLA模型主要依赖2D图像输入，缺乏对3D物理世界结构信息和常识（比如抽屉只能沿轨道平移、门只能绕铰链旋转）的理解。这导致模型在做高精度操作时空间感知差，且微调时需要海量数据去重新摸索这些物理约束，样本效率极低。
- **本质改动**: 给VLA外挂一个“概念专家（Concept Expert）”模块，用“解析概念（Analytic Concepts）”把物体变成显式的3D参数化蓝图。在操作前初始化物体的结构参数，操作中利用VLA自己的特征去实时跟踪物体的运动学状态（比如抽屉拉开了多少），然后把这些物理参数转化成具体的动作方向约束和密集奖励，直接引导VLA输出符合物理规律的动作。
- **技术溯源**: VLA基座主要基于 OpenVLA / OpenVLA-OFT 和 $\pi_0$；3D视觉特征提取依赖视觉基础模型 VGGT 和 SAM；物体结构表示基于预训练的解析概念系统（Analytic Concept annotation system）。

**2. 技术拆解**
- **重点改进**: 
  1. **概念专家模块**：分两步走。$t=0$时，用VGGT和SAM提取3D特征，估计物体的初始结构参数（如轨道方向）和初始运动学参数（如抽屉初始位置）；$t>0$时，把VLA中间层的视觉特征和VGGT特征做对齐，通过一个动态参数头实时跟踪物体的运动学参数变化。
  2. **显式知识注入**：把跟踪到的参数变成两类指导信号。一是算出一个“最优交互方向”（比如抽屉的滑动方向），直接约束VLA输出的平移动作方向；二是算出密集的强化学习奖励（包括任务进度奖励和抓取位姿对齐奖励），解决操作任务中奖励稀疏的问题。
- **架构细节**: 
  - **输入**：多视角RGB图像、机器人本体状态（关节角、末端位姿）、语言指令。
  - **模型结构**：在VLA主网络旁并行一个Concept Expert。Concept Expert包含结构参数头（处理VGGT/SAM特征）和动态参数头（通过Adapter接收VLA中间层特征，结合Cross-Attention更新参数）。VLA的主干输出动作，Concept Expert输出参数用于计算Loss和Reward。
  - **输出**：机器人的6D动作（由Action Expert输出），以及Concept Expert输出的动态参数 $P_k^t$。
- **核心 Loss**: 
  - **总Loss**：$\mathcal{L}_{total} = \mathcal{L}_{task} + \lambda_k \mathcal{L}_{kcs} + \lambda_a \mathcal{L}_{align}$。
  - **主Loss ($\mathcal{L}_{task}$)**：SFT阶段的动作预测Loss（如MSE或交叉熵），或RL阶段的CQL目标。
  - **运动学约束Loss ($\mathcal{L}_{kcs}$)**：计算VLA预测的平移动作方向与概念推导出的最优交互方向（如轨道方向向量）之间的余弦距离，强制动作方向符合物理约束。
  - **特征对齐Loss ($\mathcal{L}_{align}$)**：计算VLA中间层特征（经Adapter映射后）与VGGT提取的3D空间特征之间的余弦相似度差异，逼迫VLA内部学到3D几何感知。
  - **辅助奖励 (RL阶段)**：概念衍生奖励 $\mathcal{R}_{AC}$，包含基于参数变化量的运动学进度奖励 $\phi_{prog}$，和基于末端执行器与目标抓取位姿6D距离的可供性对齐奖励 $\phi_{afford}$。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集/环境**：主要在 SimplerEnv 仿真环境（Google Robot setup）下评估，包含 Pick Coke Can, Move Near, Open/Close Drawer 等任务。
  - **Baseline**：对比了 RT-1-X, Octo-Base, OpenVLA, RoboVLM, SpatialVLA, $\pi_0$, OpenVLA-OFT 等主流VLA模型。
- **评价指标**: 任务成功率（Success Rate），分为 Variant Aggregation（变体聚合）和 Visual Matching（视觉匹配）两种评估设置。
- **实验结果**: 
  - 在 SimplerEnv 上，SAGE 显著提升了基线模型的成功率。以 OpenVLA-OFT 为基座，SAGE-SFT 将平均成功率从 54.3% 提升至 69.0%；引入离线RL的 SAGE-CQL 进一步将平均成功率提升至 71.7%。
  - 在强运动学约束的 Open/Close Drawer（开/关抽屉）任务上提升最明显，Visual Matching 设置下的成功率从基线的 47.2% 涨到了 66.7%。
  - 相比 $\pi_0$（平均 56.8%）和 SpatialVLA（平均 70.6%）等基线，SAGE-CQL（71.7%）也展现出了更好的整体性能。

### 7. 🔥 [RLMM-Flow: A Flow-based Mobile Manipulation Framework with Latent-Space Reinforcement Learning] (RLMM-Flow：基于潜在空间强化学习的流匹配移动操作框架)
- **研究机构**: `中山大学 (Sun Yat-sen University) 及相关合作机构`
- **Arxiv ID**: `2607.26460` | [点击跳转](https://arxiv.org/abs/2607.26460)

**0. 论文标题**
- **英文标题**: RLMM-Flow: A Flow-based Mobile Manipulation Framework with Latent-Space Reinforcement Learning
- **中文标题**: RLMM-Flow：基于潜在空间强化学习的流匹配移动操作框架
- **研究机构**: 中山大学 (Sun Yat-sen University) 及相关合作机构

**1. 整体逻辑**
- **研究任务**: 移动操作（Mobile Manipulation）的全身动作轨迹生成，即同时规划移动底盘和机械臂的联合运动轨迹。
- **研究动机**: 现有的基于Flow或Diffusion的生成策略仅依赖模仿学习，动作质量被专家演示数据的上限卡死，很难进一步满足复杂的避障、运动学约束和轨迹平滑性要求。如果直接给多步生成模型上强化学习（RL），又会面临似然评估难、信用分配难和梯度反向传播不稳定等问题。
- **本质改动**: 提出一种两阶段框架：先用专家数据预训练Flow策略学习全身运动先验；然后冻结Flow策略，在潜在空间（即初始噪声空间）使用离线RL训练一个“潜在引导网络”，通过优化初始噪声来引导生成更高价值的动作轨迹，从而避开直接修改生成模型权重带来的训练不稳定问题。
- **技术溯源**: 基于 Rectified Flow（流匹配生成）、M2Diffuser（机器人视角点云表征）、DSRL（潜在空间RL引导框架）、Point Transformer（点云编码）。

**2. 技术拆解**
- **重点改进**: 
  1. **级联潜在引导**：底盘和机械臂的运动角色不同，引导网络先预测底盘相关的潜在变量，再基于底盘预测机械臂的潜在变量，显式建模全局导航与局部操作的依赖关系。
  2. **动作Critic预热**：先单独训练动作空间的Critic直到稳定，然后再将其价值蒸馏给潜在Critic并更新Actor，解决高维潜在空间联合训练容易崩溃的问题。
  3. **由粗到细的潜在引导**：训练早期通过平均池化压缩时间维度，只优化全局共享的低维潜在变量（学全局趋势）；后期引入高维时间残差（学局部微调），逐步恢复对每一步动作的精细控制。
- **架构细节**: 
  - **输入**：以机器人为中心的3D点云（包含机器人本体、目标、场景点，通过Point Transformer编码），结合当前本体状态、任务目标和Flow时间嵌入。
  - **模型结构**：包含4个核心网络：冻结的Flow策略（基于Transformer）、潜在引导网络（级联Transformer，输出高斯分布的均值和方差）、动作Critic $Q^A$（评估解码后的动作块）、潜在Critic $Q^W$（评估潜在噪声）。
  - **输出**：固定步长（Horizon）的全身动作序列（底盘位姿+机械臂关节角）。
- **核心 Loss**: 
  - **预训练阶段**：Flow Matching Loss（采用logit-normal时间采样策略）。
  - **RL后训练阶段**：包含三个Loss。动作Critic使用标准TD Loss；潜在Critic使用MSE Loss将动作Critic的价值蒸馏过来；Actor Loss则直接最大化潜在Critic的输出值。
  - **Reward设计**：包含5个归一化项：目标到达、底盘运动学约束（如非完整约束）、碰撞惩罚、轨迹平滑度、关节限位惩罚。使用附着在机器人连杆上的碰撞球模型来计算距离和碰撞。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：使用REMANI规划器在仿真室内环境采集的全身运动轨迹。预训练阶段使用纯高质量专家数据，RL后训练阶段混入了一批次优轨迹（混合质量数据）以提供更广的价值分布。评估场景分为训练分布内（Seen）、未见场景（Unseen）和真实世界（Real-world，使用FAST-LIO2重建点云）。
  - **Baseline**：纯模仿学习的Flow策略，以及现有的RL后训练基线方法（如DSRL等）。
- **评价指标**: 任务成功率、无碰撞率（碰撞避免能力）、轨迹质量（平滑度等物理可行性指标）。
- **实验结果**: 相比纯模仿学习的Flow策略和现有的RL后训练方法，RLMM-Flow在任务成功率、避障能力和轨迹质量上均有显著提升，同时保持了Flow模型原有的快速推理速度。在未经过真机微调的真实世界部署中，也展现出了较好的泛化和执行能力。

### 8. 🔥 [TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with <1 GB VRAM] (TurboVLA：在RTX 4090上以32Hz实时运行且显存占用不足1GB的视觉-语言-动作模型)
- **研究机构**: `华中科技大学 (HUST), 华为 (Huawei)`
- **Arxiv ID**: `2607.27205` | [点击跳转](https://arxiv.org/abs/2607.27205)

**0. 论文标题**
- **英文标题**: TurboVLA: Real-Time Vision-Language-Action Model at 32 Hz on an RTX 4090 with <1 GB VRAM
- **中文标题**: TurboVLA：在RTX 4090上以32Hz实时运行且显存占用不足1GB的视觉-语言-动作模型
- **研究机构**: 华中科技大学 (HUST), 华为 (Huawei)

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作策略（根据视觉观测和文本指令生成机器人连续动作）。
- **研究动机**: 现在的VLA模型（像OpenVLA、pi_0等）基本都采用“以LLM为中心”的架构，把视觉和语言全塞进几十亿参数的大语言模型里处理。这导致推理太慢、显存占用太大，根本跑不到30Hz以上的实时控制频率，也没法在算力受限的机器人端侧设备上部署。
- **本质改动**: 把大语言模型这个“中间商”踢掉。将传统的“视觉->LLM->动作”路径，改成了直接的“视觉+语言->动作”映射。用轻量级编码器分别提取特征，直接做跨模态融合，然后输出连续动作。
- **技术溯源**: 视觉编码器基于 DINOv3，文本编码器基于 BERT，跨模态交互借鉴了 Grounding DINO 的双向交叉注意力设计，动作解码器基于 ACT (Action Chunking with Transformers)。

**2. 技术拆解**
- **重点改进**: 不再让视觉特征去对齐LLM的token空间，而是让视觉和语言特征在独立的低维空间（特征维度256）直接通过交叉注意力交换信息，大幅砍掉了计算量和显存开销。
- **架构细节**: 
  - **输入**: 多视角图像、文本指令、机器人当前状态（本体感受）。
  - **编码器**: 图像用 DINOv3（单臂任务用ViT-B，双臂任务用ViT-L），文本用 BERT。机器人状态用轻量级MLP投影。
  - **融合模块**: 6层双向交叉注意力（Bidirectional Cross-Attention），视觉和文本互相做Query，实现细粒度的特征融合。
  - **解码器**: ACT风格的Transformer Decoder。把融合后的多模态特征和机器人状态拼起来，通过可学习的Action Queries一次性并行解码出未来H步的连续动作（如12步或50步）。
  - **模型规模**: 总参数量仅 0.2B（大概是 pi_0.5 的 6%）。
- **核心 Loss**: 纯行为克隆（Behavior Cloning），主Loss就是预测动作和专家动作之间的 L1 Loss。没有加任何辅助的语言建模Loss（如Next-token prediction）或视频重建Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO（单臂操作，4个任务集）、RoboTwin 2.0（双臂操作，50个任务）、真实世界平台（AgileX Piper机械臂，4个操作任务）。
  - **Baseline**: 对比了 OpenVLA、pi_0.5、Octo 等主流VLA模型。
- **评价指标**: 任务成功率（Success Rate）、模型参数量、端到端推理延迟（Latency）、推理显存占用（VRAM）。
- **实验结果**: 
  - **性能**: 在 LIBERO 上取得了 97.7% 的平均成功率，性能匹敌甚至超越参数量大得多的VLA模型。
  - **效率**: 在消费级 RTX 4090 显卡上，端到端推理延迟仅 31.2 ms（控制频率达 32 Hz），推理显存占用仅 0.9 GB。
  - **规模与泛化**: 0.2B 的极小参数量使其非常适合端侧部署，在真实世界用少量遥操作数据微调后，也展现了很好的闭环执行成功率。

### 9. 🔥 [HumanCLAW: Can Vision-Language Models Act Through a Body?] (HumanCLAW：视觉语言模型能通过物理身体行动吗？)
- **研究机构**: `Meta, 南洋理工大学, 华盛顿大学, 布朗大学, 西北大学`
- **Arxiv ID**: `2607.27180` | [点击跳转](https://arxiv.org/abs/2607.27180)

**0. 论文标题**
- **英文标题**: HumanCLAW: Can Vision-Language Models Act Through a Body?
- **中文标题**: HumanCLAW：视觉语言模型能通过物理身体行动吗？
- **研究机构**: Meta, 南洋理工大学, 华盛顿大学, 布朗大学, 西北大学

**1. 整体逻辑**
- **研究任务**: 评估视觉语言模型（VLM）在物理环境中的第一人称全身长程决策与行动能力（寻找-导航-交互任务）。
- **研究动机**: 现有的具身评估存在两极分化：要么把动作抽象成离散指令（忽略了物理执行的真实后果），要么用端到端VLA（决策和底层电机控制强耦合，任务失败时分不清是VLM决策错了，还是底层控制如失去平衡导致的）。需要一种能剥离底层控制失败、纯粹评估VLM“动作智能”的方法。
- **本质改动**: 将高层动作决策与底层运动执行解耦。VLM不直接输出高维关节角度，而是输出带参数的“原子技能”（如走、转、坐），由运动生成器将其转化为连续的全身物理运动，并在半物理模拟器中执行。
- **技术溯源**: 决策端直接调用现成的前沿VLM（如GPT-4o等闭源及开源大模型）；运动生成端基于 DiT (Diffusion Transformer) 架构和 Flow Matching，并结合 ControlNet 机制实现技能控制。

**2. 技术拆解**
- **重点改进**: 
  1. **原子技能接口**：将复杂的全身动作拆解为带有连续物理参数的原子技能（如 `walk(x,z,ψ)`, `sit_in_place(h)`），把长程动作组合的推理压力交给VLM，保证底层运动生成的局部可靠性。
  2. **技能空间验证器（Verifier）**：在VLM输出技能后、执行前，用一个短上下文的验证器检查该动作在当前空间状态下是否安全合理（例如会不会撞墙、是不是离目标还远就提前坐下），并予以纠正，缓解VLM长上下文下的空间幻觉。
- **架构细节**: 
  - **决策端**：VLM接收第一人称RGB图像和紧凑的文本历史，经过“高-中-低”层级推理输出技能JSON。
  - **运动生成端**：Base DiT（38M参数，10层，8头注意力）输入过去5帧干净姿态，预测未来15帧（0.5秒，30fps）的速度场。针对每个原子技能训练一个 ControlNet adapter，通过零初始化的权重注入 Base DiT。Base DiT冻结，只训练Adapter，实现新技能的即插即用。
  - **物理模拟端**：半物理模拟器（Half-physics simulator）处理重力、碰撞和物体位移，但人为排除了平衡和电机跟踪误差，确保失败只归因于决策。
- **核心 Loss**: 运动生成模块（Base DiT 和 ControlNet Adapters）均采用 Flow Matching 的速度场预测 Loss，即最小化预测速度场与真实速度场之间的 L2 距离（$||\hat{v}_\theta - v^*||_2^2$）。无其他辅助任务Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建 HumanCLAW-Bench，包含41个室内场景中的1218个长程“寻找-导航-交互”第一人称任务。
  - **Baseline**：测试了9个当前最前沿的VLM（涵盖头部闭源和开源模型）。
- **评价指标**: 
  - 任务整体成功率（Success Rate）。
  - 阶段性指标：目标可见率（Seeing rate）、到达率、交互成功率。
  - 动作质量（Action quality）和零样本运动保真度。
- **实验结果**: 
  - 没有任何一个模型能可靠解决该基准，最强模型的整体成功率仅为 **16.8%**。
  - **瓶颈分析**：VLM的视觉识别不是瓶颈（看到目标的报告率与客观可见率很接近），核心缺陷在于缺乏“具身自我意识”（Embodied self-awareness）——模型无法追踪自己的身体位置、不知道是否已到达目标、也感知不到身体与环境的碰撞。
  - **消融实验**：技能验证器（Verifier）是决定成败的关键组件；文本历史对动作连贯性必不可少但很快饱和；输入更多的图像帧反而可能损害性能。

### 10. 🔥 [What Can Latent World Models Know? Physical Parameter Identifiability in Multimodal Predictive Representations] (潜在世界模型能知道什么？多模态预测表征中的物理参数可识别性)
- **研究机构**: `New York University, Carnegie Mellon University, Columbia University`
- **Arxiv ID**: `2607.27017` | [点击跳转](https://arxiv.org/abs/2607.27017)

**0. 论文标题**
- **英文标题**: What Can Latent World Models Know? Physical Parameter Identifiability in Multimodal Predictive Representations
- **中文标题**: 潜在世界模型能知道什么？多模态预测表征中的物理参数可识别性
- **研究机构**: New York University, Carnegie Mellon University, Columbia University

**1. 整体逻辑**
- **研究任务**: 探究潜在世界模型（如JEPA）到底能从多模态观测中学到哪些物理参数（如质量、阻力、接触刚度），以及是什么因素决定了模型能否学到这些参数。
- **研究动机**: 领域内一直假设“预测未来能让模型内化环境物理规律”，但实际上没人清楚模型的隐状态里到底装了什么物理量。如果模型学不到接触刚度等关键物理参数，在接触丰富的具身操作任务中就会直接失败。
- **本质改动**: 本文没有提出全新的网络架构，而是提出了一套“证书门控协议”和受控实验环境（PokeWorld）。通过严格控制“输入模态”和“预测目标”的变量，解耦并查明了世界模型学习物理参数的底层机制，并给出了多模态世界模型的具体设计规则。
- **技术溯源**: 基于 LeJEPA / LeWM (Joint-Embedding Predictive Architectures, JEPAs) 以及 V-JEPA/I-JEPA 的无启发式稳定训练配方。

**2. 技术拆解**
- **重点改进**: 
  1. 提出 PokeWorld 环境，物体外观完全一致，但隐藏了质量、阻力、刚度三个物理参数。
  2. 提出证书门控协议（Certificate-Gated Protocol）：先用原始数据训练探针算出一个“可恢复性证书（理论下界）”，再评估世界模型。这能把“环境本身观测不到”和“模型没学好”严格区分开。
  3. 揭示“目标决定内容”机制：把触觉作为输入融合没用，必须把触觉作为预测目标，模型才能学到接触刚度。
  4. 发现并打破“懒惰均衡”：单步纯视觉预测会让模型偷懒忽略可见物体，通过加入跨模态目标或多步动作条件预测头可以解决。
  5. 划定当前预测目标的“盲区”：对于变化慢且非线性的参数（如阻力），当前的确定性预测目标完全学不到。
- **架构细节**: 
  模型家族称为 X-JEPA。输入包括视觉（64x64）、本体感觉和7维触觉（包含子步统计量如峰值力）。结构为每帧编码器 + 动作条件的因果 Transformer 预测器 + 不同时间跨度（Δ=1,4,16）的预测头。模型规模很小，约 5M 参数，单张 RTX 4060 训练不到一小时。
- **核心 Loss**: 
  主 Loss 是 JEPA 的潜在表征预测损失（预测未来的 latent embeddings）。辅助任务通过因子化设计，变化预测目标（仅预测 latent，或增加触觉预测、本体感觉预测）。正则化使用 SIGReg（切片各向同性高斯防坍塌正则化），论文详细分析了其权重 λ 的剂量效应。

**3. 实验结果**
- **数据集和baseline**: 
  数据集：自建的 PokeWorld 仿真环境，以及真实机器人数据集 RH20T（包含两个机械臂实体，最多4258个episodes）。
  Baseline：X-JEPA 的各种消融变体（如仅视觉输入、无触觉目标、单步预测等），以及静态基线（persistence baseline）、自回归 rollout 基线、像素重建世界模型（生成式）、监督学习系统识别头。
- **评价指标**: 
  1. 物理参数可识别性：用线性/非线性探针在冻结的隐状态上读取隐藏参数的 R²。
  2. 预测能力：开环 rollout 误差、直接多步预测误差。
  3. 真实机器人指标：力读出误差、接触发生预测 AUC、留出任务上的预测表现。
- **实验结果**: 
  1. 目标因果性：接触刚度只有在触觉作为预测目标时才能被学到（R² 达 0.40-0.57），仅把触觉作为输入融合时 R² 为 -0.02。
  2. 打破懒惰均衡：单步纯视觉预测连可见的物体位置都学不到（R² 仅 0.04），加入多步动作条件预测头后位置 R² 提升到 0.89。直接预测16步的误差（0.10）比自回归 rollout（0.19）好近一倍。
  3. 盲区验证：阻力参数的原始观测证书高达 0.89，但在所有确定性预测目标下 R² 停滞在 0.13 左右（监督头能达到 0.45，像素重建也学不到）。
  4. 真实机器人（RH20T）：机制完美复现。跨模态目标使 rollout 误差降低 29%，接触预测 AUC 从 0.70 提升到 0.80。数据量增加（800到4258 episodes）只有在目标结构完整时才有用，缺失关键预测目标的模型，数据量再大也学不到力信息（证明数据规模不能替代目标结构的设计）。

### 11. 🔥 [Temporally Centered SIGReg Improves Multi-Task LeWorldModel Learning: From Analysis to Method] (时间中心化SIGReg改善多任务LeWorldModel学习：从分析到方法)
- **研究机构**: `The University of Tokyo (东京大学)`
- **Arxiv ID**: `2607.26924` | [点击跳转](https://arxiv.org/abs/2607.26924)

**0. 论文标题**
- **英文标题**: Temporally Centered SIGReg Improves Multi-Task LeWorldModel Learning: From Analysis to Method
- **中文标题**: 时间中心化SIGReg改善多任务LeWorldModel学习：从分析到方法
- **研究机构**: The University of Tokyo (东京大学)

**1. 整体逻辑**
- **研究任务**: 基于像素的多任务世界模型表征学习，以及下游的行为克隆控制。
- **研究动机**: 现有的 LeWorldModel (LeWM) 使用 SIGReg 对隐变量的边缘分布做高斯正则化来防止表征坍塌。这在单任务中有效，但在多任务联合训练时性能会大幅下降。作者分析发现，强制边缘分布呈各向同性高斯分布会产生“收缩压力”，把不同任务和状态的隐变量聚类中心挤在一起，导致表征混叠，使得下游策略无法区分当前具体的任务和状态。
- **本质改动**: 把 SIGReg 的正则化目标从“隐变量的边缘分布”改成了“局部时间窗口内的中心化残差”。不再强求整个隐空间服从单一高斯分布，而是只约束局部时间变化的高频残差部分。这样既保留了防坍塌的效果，又去除了对多任务隐空间聚类结构的破坏。
- **技术溯源**: 基于 LeWorldModel (LeWM) 架构和 SIGReg (Sketched Isotropic Gaussian Regularizer) 正则化方法。视觉编码器使用了 ViT，下游策略使用了 Flow-matching。

**2. 技术拆解**
- **重点改进**: 提出 TC-LeWM (Temporally Centered LeWorldModel)。将隐变量 $z_t$ 分解为局部时间均值 $\bar{z}_t$ 和残差 $r_t = z_t - \bar{z}_t$。把 SIGReg 作用在残差集合上，而不是原始隐变量上。这在数学上解除了对低频多任务聚类中心的收缩约束；同时，如果隐变量在时间上坍塌（变成常数），残差为0，SIGReg 依然会给出惩罚，从而保留了防坍塌能力。
- **架构细节**: 
  - **输入输出**: 输入为双视角的 RGB 图像和机器人动作，输出为预测的下一步隐变量和最终的机械臂动作。
  - **模型结构**: 共享的 ViT 编码器独立处理两个视角的图像；动作条件隐空间预测器预测下一步隐状态；下游是冻结编码器后的 task-conditioned flow-matching 行为克隆策略（策略输入同时结合了 CLS token 和 patch tokens 以获取更好的空间特征）。
  - **时间窗口**: 计算局部均值的时间窗口大小设为 8 帧（约 1.4 秒）。
- **核心 Loss**: 
  - **主 Loss**: 隐状态预测 Loss ($\mathcal{L}_{pred}$) + 残差 SIGReg Loss ($\lambda \mathcal{L}_{SIGReg}(\mathcal{R})$)。
  - SIGReg 内部使用 Epps-Pulley (EP) 检验准则，对隐变量的一维随机投影做正态性约束。
  - **无辅助任务**: 没有使用像素重建、奖励预测等辅助任务，是纯粹的无重建联合嵌入预测学习。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO 仿真操作基准（包含 Spatial, Object, Goal, Long 4个套件，共 40 个操作任务）。
  - **Baseline**: Raw LeWM（原版方法），以及作为上下文参考的从零训练的 Diffusion Policy、微调的 Octo 和 OpenVLA。
- **评价指标**: 闭环任务成功率（Closed-loop success rate），每个任务跑 50 次 rollout，报告多个训练和评估种子的均值与标准差。
- **实验结果**: 
  - **10任务联合训练（单套件）**: TC-LeWM 平均成功率从 Raw LeWM 的 53.2% 提升到 73.6%。在没有外部预训练的情况下，超过了从零训练的 Diffusion Policy (72.4%)，接近微调的大模型 Octo (75.1%) 和 OpenVLA (76.5%)。
  - **克服负迁移**: 在 Long 套件上，Raw LeWM 从单任务切到 10 任务联合训练时，成功率从 40.0% 暴跌到 29.9%（严重负迁移）；而 TC-LeWM 从 49.6% 提升到了 51.8%，有效克服了多任务联合训练带来的干扰。
  - **40任务统一训练**: 当把所有 40 个任务放在一起训练时，Raw LeWM 成功率掉到 44.4%，而 TC-LeWM 依然稳在 73.5%，比原版高出 29.1 个百分点，证明了该方法在更大规模多任务场景下的扩展性。

### 12. 🔥 [From Passive Video to Editable Experience: Physically Grounded Experience Synthesis for Embodied Intelligence] (从被动视频到可编辑经验：面向具身智能的物理约束经验合成)
- **研究机构**: `未明确标明（独立研究者）`
- **Arxiv ID**: `2607.26903` | [点击跳转](https://arxiv.org/abs/2607.26903)

**0. 论文标题**
- **英文标题**: From Passive Video to Editable Experience: Physically Grounded Experience Synthesis for Embodied Intelligence
- **中文标题**: 从被动视频到可编辑经验：面向具身智能的物理约束经验合成
- **研究机构**: 未明确标明（独立研究者）

**1. 整体逻辑**
- **研究任务**: 将互联网上的人类操作视频转化为机器人可直接学习的操作数据（视频、离散动作或连续轨迹）。
- **研究动机**: 具身智能目前最缺的是数据。真机采集太贵，仿真有 sim-to-real gap。网上人类视频虽然多，但人手和机械臂结构不一样（具身鸿沟），直接拿人类视频训机器人或者做像素级的视频翻译，生成的动作机器人根本执行不了。
- **本质改动**: 放弃像素级的视频到视频硬翻译，改为提取人类视频中的“结构化经验”。把人类视频抽成“任务图”，通过“功能（Affordance）隐空间”对齐，翻译成“机器人规划图”，最后加上物理规则的闭环检查，确保生成的视频和轨迹符合机械臂的运动学。
- **技术溯源**: 视频生成底座用的是阿里的 Wan2.1 (通义万相)，下游策略评估用了 OpenVLA 和 ACT，视觉表征对比了 R3M 和 VIP。

**2. 技术拆解**
- **重点改进**: 
  1. **图结构翻译**：用“任务图 -> 功能图 -> 约束图 -> 规划图”的链式转换，代替简单的文本 prompt 控制视频生成。
  2. **层次化 Affordance 隐空间**：把物体表征从“是什么（物体身份）”变成“能干嘛（物体状态 -> 功能 -> 任务语义）”，解决对未见物体的泛化问题。
  3. **闭环物理验证**：生成的轨迹必须过 IK（逆运动学）、碰撞、关节限位检查，不通过就把误差信号打回重做，把生成问题变成约束满足问题。
- **架构细节**: 
  - **输入**：人类第一人称操作视频。
  - **中间表示**：先用 VLM 提取 Task Graph（节点是子目标/物体/区域，边是时间/因果/空间关系）。然后映射到三层 Affordance Latent。接着通过图算子转成 Robot Planning Graph。
  - **输出**：用 Wan2.1 渲染成 720P、5秒的视频，或者直接输出动作 token 和连续轨迹。
- **核心 Loss**: 
  - **跨具身对齐 Loss**：对比学习损失（Contrastive Loss），让不同形态下做同一任务的人类和机器人数据在 Affordance 隐空间里拉近。
  - **物理验证**：没有神经网络 Loss，而是基于运动学规则计算误差信号 $\epsilon$，反馈给规划模块进行迭代重新生成。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：GTEA Gaze+、EPIC-KITCHENS-100，加上自建的 1000 个互联网操作视频。测试了 Franka、xArm、UR5e、Kinova、SO-ARM101 五种机械臂。
  - **Baseline**：纯文本 prompt 生成、只用真实数据、用 R3M/VIP 提取的人类视频特征。
- **评价指标**: 
  - 不测 FVD/FID 等画质指标。测四个：任务正确性（TC，VLM 和人类打分）、可执行性（EX，算 IK 和碰撞）、状态一致性（SC）、可学习性（LE，训 OpenVLA 和 ACT 看真机成功率）。
- **实验结果**: 
  - **生成质量**：图条件生成比纯文本 prompt，任务正确性高 12.3%，可执行性高 15.7%。
  - **真机效果**：只用生成的数据训 OpenVLA，成功率 55.2%（顶得上 50 个真实 demo 的 84%）；生成数据 + 50 个真实数据，比纯真实数据成功率高 11.3%。
  - **物理合法性**：加了闭环验证（迭代 5 次）后，IK 误差降了 93.5%，碰撞率降了 90.9%，94.1% 的轨迹能直接执行。
  - **零样本泛化**：对没见过的物体（如西瓜），靠 Affordance 隐空间，任务正确率达到 78.5%，比靠物体身份的隐空间高 33.4%。

### 13. 🔥 [Implicit Causal World Models] (隐式因果世界模型)
- **研究机构**: `摘要未提及（主要涉及因果推断与多智能体强化学习交叉领域的研究团队）`
- **Arxiv ID**: `2607.26336` | [点击跳转](https://arxiv.org/abs/2607.26336)

**0. 论文标题**
- **英文标题**: Implicit Causal World Models
- **中文标题**: 隐式因果世界模型
- **研究机构**: 摘要未提及（主要涉及因果推断与多智能体强化学习交叉领域的研究团队）

**1. 整体逻辑**
- **研究任务**: 多智能体系统中的世界模型学习（从离线演示数据中学习环境动态预测）。
- **研究动机**: 现有的世界模型在训练时，很容易把“统计相关性”和真实的“因果机制”搞混。特别是在多智能体场景下，环境的物理状态变化和智能体的策略意图交织在一起，导致世界模型一遇到分布偏移（比如换了策略或环境）就预测失效。
- **本质改动**: 提出“隐式因果世界模型”。不需要人工提前画好因果图，而是通过引入“策略方差”，利用因果推断里的“序列后门条件”，直接从离线数据里把环境的真实因果动态解耦并学出来。
- **技术溯源**: 基于因果推断理论（特别是序列后门准则 Sequential Backdoor Condition）和基于模型的离线强化学习（Model-based Offline RL）。

**2. 技术拆解**
- **重点改进**: 把因果推断的“序列后门条件”引入到世界模型的训练中。通过建模“策略方差”（policy variance），把智能体的主观意图和环境的客观物理转移剥离开，从而在没有预定义因果图的情况下实现因果发现。
- **架构细节**: 输入为多智能体的离线演示轨迹（状态、动作等），输出为环境动态预测（如下一时刻状态）。摘要未透露具体的神经网络 backbone（如 Transformer 或 MLP）和参数规模，核心在于隐式因果表征的学习框架设计。
- **核心 Loss**: 摘要未给出具体公式。主 Loss 应为环境动态的预测损失（如 MSE），同时必然包含满足序列后门条件的约束项或正则项，以迫使模型学习干预下的真实因果转移，而不是简单拟合数据里的相关性。

**3. 实验结果**
- **数据集和baseline**: 实验在多智能体协调任务上进行，包括 Two-Door（双门）、Navigation（导航）和 Giveway（让行）。Baseline 为传统的非因果世界模型或标准 MBRL 方法（摘要中未具体点名）。
- **评价指标**: 模型预测准确率、因果表征的可解释性、在不同干预强度（interventional strength）下的表现，以及在完全可观测和部分可观测（POMDP）条件下的鲁棒性。
- **实验结果**: 在完全和部分可观测 setting 下，模型都能学到具备可解释性的因果表征。最核心的结论是，模型的预测精度与干预强度直接成正比（scaling directly with interventional strength），这证明模型确实学到了底层的因果机制，而不是死记硬背离线数据里的统计相关性。

### 14. 🔥 [World Action Planner: Generalizable Decision-Making with Action-Conditioned World Models] (世界动作规划器：利用动作条件世界模型实现泛化决策)
- **研究机构**: `Harvard University（哈佛大学）`
- **Arxiv ID**: `2607.27599` | [点击跳转](https://arxiv.org/abs/2607.27599)

**0. 论文标题**
- **英文标题**: World Action Planner: Generalizable Decision-Making with Action-Conditioned World Models
- **中文标题**: 世界动作规划器：利用动作条件世界模型实现泛化决策
- **研究机构**: Harvard University（哈佛大学）

**1. 整体逻辑**
- **研究任务**: 机器人操作任务的泛化规划与决策，重点解决新场景、新物体布局、长视野组合任务下的操作问题。
- **研究动机**: 现有的端到端模仿学习策略（如VLA、WAM）太依赖训练数据分布，泛化能力差。比如训练时总是抓某个固定坐标，测试时物体移开了它还是死板地去抓那个坐标；或者只会做单个原子动作，连起来做长任务时做完第一步就卡死。
- **本质改动**: 放弃纯端到端模仿学习，搞了一套“VLM（视觉语言模型） + 世界模型”的规划系统。VLM负责提动作和做判断，世界模型负责在“脑海”里模拟动作后果，通过“想象-反馈-搜索”来迭代修正动作，而不是直接让神经网络盲目输出最终动作。
- **技术溯源**: VLM作为Agent大脑；世界模型基于开源视频生成模型 Wan-T2V-1.3B；底层精细操作复用了 Diffusion Policy（扩散策略）作为工具。

**2. 技术拆解**
- **重点改进**: 
  1. **世界模型的条件注入**：抛弃了以前把低维动作向量通过AdaLN或Cross-attention塞进网络的做法（这种方式对新动作泛化差）。改成“姿态图像条件”：先用正向动力学算出未来关节位置，渲染成骨架图，把骨架图编码后和视频token拼在一起，解耦了物理模拟和神经想象。
  2. **规划框架（WAP）**：把现有策略当工具。分三步走：VLM先提一个粗略的3D目标位姿；然后世界模型模拟轨迹，VLM看模拟视频给反馈做全局修正；最后在目标附近做网格搜索，世界模型模拟多个候选动作，VLM打分选最好的，必要时接Diffusion Policy完成最后抓取。
- **架构细节**: 
  - **世界模型**：基于Wan-T2V-1.3B。输入是4个视角（第三人称+腕部，拼成2x2网格）的历史帧和对应的姿态图，预测未来20帧。
  - **规划器**：VLM看多视角图像输出动作原语（如MOVE），通过多视角三角测量算3D坐标，不需要额外的深度图。底层控制器把目标位姿转成动作块（action chunks）。
- **核心 Loss**: 
  - 世界模型训练使用 Flow-matching loss（流匹配损失）。对历史视频token加独立随机噪声，对未来视频token加均匀噪声，姿态图像token不加噪声作为条件。没有额外的辅助重建任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO (90/Long/Spatial), Robocasa, MimicGen, DexMimicGen。
  - **Baseline**：世界模型对比了WPE、IRA-Sim（用AdaLN注入动作）和Ctrl-World（用Cross-attention注入）。决策规划对比了SOTA的端到端VLA和WAM模型。
- **评价指标**: 
  - **世界模型**：LPIPS（感知相似度，越低越好）和 PSNR（峰值信噪比，越高越好）。
  - **决策规划**：任务成功率（Success Rate）。
- **实验结果**: 
  - **世界模型**：在多个数据集和视角上，姿态图像条件比低维动作注入的baseline表现更好（LPIPS更低，PSNR更高），而且训练步数只要一半（10K vs 20K），跨具身泛化也更好。
  - **决策规划**：在组合任务、新布局、零样本场景中成功率显著高于VLA和WAM。比如长任务中VLA做完第一步就停滞，WAP能通过想象和修正继续完成；物体换位后，模仿学习还在抓老位置，WAP能准确找到并抓取新位置。

### 15. 🔥 [TacWAM: Anchor-Guided World Action Model with Mechanics-Aware Tactile Prediction] (TacWAM：基于锚点引导与力学感知触觉预测的世界动作模型)
- **研究机构**: `文本未具体标明（仅标注了作者附属编号1和2，推测为国内高校与研究机构联合团队）`
- **Arxiv ID**: `2607.28391` | [点击跳转](https://arxiv.org/abs/2607.28391)

**0. 论文标题**
- **英文标题**: TacWAM: Anchor-Guided World Action Model with Mechanics-Aware Tactile Prediction
- **中文标题**: TacWAM：基于锚点引导与力学感知触觉预测的世界动作模型
- **研究机构**: 文本未具体标明（仅标注了作者附属编号1和2，推测为国内高校与研究机构联合团队）

**1. 整体逻辑**
- **研究任务**: 接触密集型机器人操作任务（如易碎物抓取、持续表面接触、动态手内操作）的动作生成与未来状态预测（即世界动作模型 WAM）。
- **研究动机**: 现有的 WAM 主要靠预测未来视觉来辅助动作生成，但视觉看不出“力、形变、滑动”等底层物理信息。如果直接让模型预测未来触觉并把它喂给动作生成网络，会导致训练时模型看到了“未来”，而实际部署时根本拿不到未来触觉，产生信息泄露（训练和部署不一致）。
- **本质改动**: 把“未来触觉预测”纯粹当作训练时的辅助监督信号，用来增强模型对接触物理的理解；同时通过注意力掩码严格隔离，保证动作生成网络只能看到“当前”的视觉和触觉，做到训练和部署的信息绝对一致。
- **技术溯源**: 基于 World Action Models (WAM) 框架，结合了 Flow Matching（流匹配）生成机制。

**2. 技术拆解**
- **重点改进**: 
  1. 提出 SAF（空间对齐融合）触觉编码器：把触觉图像、密集力场、形变流融合到一个共享隐空间，并保留全局力/力矩信息。
  2. 提出 AGT（锚点引导的三模态）注意力机制：通过 Mask 严格规定，动作 token 只能看当前的视觉和触觉锚点，绝对不能看未来的视觉和触觉预测 token，防止模型“作弊”。
  3. 引入触觉历史上下文：用过去的触觉变化趋势来辅助预测未来的触觉状态，帮助模型理解当前处于什么接触阶段。
- **架构细节**: 
  - **输入**: 当前视觉图像、当前触觉（图像+力场+形变）、本体感觉（关节位置）、语言指令，以及历史触觉序列。
  - **结构**: 采用 Mixture-of-Transformers 骨干网络，分为视觉、触觉、动作三个流（stream）。各个流有自己专属的专家网络（experts），通过带 Mask 的混合自注意力进行交互。
  - **输出**: 未来视觉帧、未来触觉隐状态、动作块（Action chunks，即未来的目标关节位置）。
- **核心 Loss**: 
  - **主 Loss**: 基于 Flow Matching 的联合生成损失（包括视频预测 Loss、动作生成 Loss、触觉隐状态预测 Loss）。
  - **辅助 Loss**: SAF 编码器预训练时的重构 Loss（重构力场、全局力/力矩、形变流）；触觉解码的语义一致性正则化 Loss；以及接触事件分类 Loss（判断接触发生、释放或稳定状态）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自采的真实机器人数据集（Agilex Piper 机械臂 + 双侧 Xense 触觉传感器），包含 4 个接触密集任务（薯片抓取、樱桃抓取、白板擦拭、双笔转动），每个任务 300 条轨迹。
  - **Baseline**: π0.5（纯视觉 VLA）、Fast-WAM（纯视觉 WAM）、RDP（视觉-触觉反应式扩散策略）、VT-WAM（视觉-触觉 WAM）。
- **评价指标**: 真实世界中的任务执行成功率（每个任务在物理环境中进行 20 次试验）。
- **实验结果**: TacWAM 在 4 个任务上的平均成功率达到 75.0%，比表现最好的 baseline（VT-WAM，37.5%）高出 37.5 个百分点。其中，易碎物（薯片）抓取成功率从 baseline 最高的 50% 提升到了 90%，白板擦拭从 30% 提升到了 75%，证明了引入力学感知触觉预测且不作弊的有效性。

### 16. 🔥 [RedFlow: Redirect Failure into Action-Level Corrections for Flow-matching VLA Policy] (RedFlow：将失败重定向为Flow-matching VLA策略的动作级纠正)
- **研究机构**: `香港科技大学 (HKUST)`
- **Arxiv ID**: `2607.27782` | [点击跳转](https://arxiv.org/abs/2607.27782)

**0. 论文标题**
- **英文标题**: RedFlow: Redirect Failure into Action-Level Corrections for Flow-matching VLA Policy
- **中文标题**: RedFlow：将失败重定向为Flow-matching VLA策略的动作级纠正
- **研究机构**: 香港科技大学 (HKUST)

**1. 整体逻辑**
- **研究任务**: 基于 Flow-matching 的 VLA（视觉-语言-动作）策略的离线强化学习后训练，提升其在真实机器人操作中的鲁棒性和纠错能力。
- **研究动机**: 现有的 VLA 策略在真机部署时容易因为分布偏移产生累积误差。传统的离线 RL 要么只用成功数据，要么用偏好学习（如 DPO）在“整条轨迹”的粗粒度上处理失败数据。轨迹级的失败标签太粗，无法告诉模型“具体哪一步做错了”以及“应该怎么做”，导致学习效率低，模型学不会从失败中恢复。
- **本质改动**: 把粗粒度的“轨迹级失败”拆解成细粒度的“动作块（action-chunk）级纠正信号”。通过在相似状态下检索成功动作作为“纠正目标”，并设计一套非对称的 Flow-matching 损失函数，让模型在训练时既能强化成功动作、抑制失败动作，又能把可挽回的失败动作“拉”向正确的方向。
- **技术溯源**: 基于 Flow-matching VLA 基座模型 $\pi_0$ (OpenPi)，并结合了预训练的通用奖励模型 (General Reward Model, GRM) 来估计任务进度。

**2. 技术拆解**
- **重点改进**: 
  1. **上下文感知的纠正匹配**：不直接在高维视觉空间聚类，而是用“本体感受状态（关节角等）+ 任务进度”定义执行上下文。用 HDBSCAN 对上下文聚类，如果某个动作块导致失败，就去同一个聚类里找成功的动作块，加权平均后作为“纠正目标”。
  2. **动作级优势估计**：用预训练的 GRM 预测每步的任务进度，结合轨迹最终的成功/失败标签，算出一个替代优势分数（proxy advantage），给每个动作块打上正/负标签，解决失败轨迹中“哪一步该背锅”的问题。
- **架构细节**: 
  - **输入**: 视觉图像、本体感受状态（proprioception）、语言指令。
  - **输出**: 动作块（Action chunk，连续多步的关节控制指令）。
  - **模型结构**: 条件 Flow-matching 模型（从 $\pi_0$ 初始化），通过积分学习到的速度场（velocity field）从噪声生成动作。
  - **上下文特征构建**: $f_t = [\tilde{q}_t; \beta \bar{p}_t]$，即归一化的本体感受状态拼接上平滑后的 GRM 进度分数。
- **核心 Loss**: 总 Loss 由三部分组成（非对称 Flow-matching 目标）：
  1. **质量加权吸引 Loss ($\mathcal{L}_{att}$)**：根据动作的优势分数计算软权重，加权标准的 Flow-matching loss，主要用来模仿和强化高质量的成功动作。
  2. **失败抑制 Loss ($\mathcal{L}_{sup}$)**：一个带 margin 的排斥损失（hinge loss）。如果预测动作离负面（失败）动作太近，就产生排斥力，防止模型生成导致失败的动作。
  3. **目标引导纠正 Loss ($\mathcal{L}_{cor}$)**：对于有对应“纠正目标”的可挽回失败动作，增加一个吸引力，把预测动作往聚类得到的成功动作中心（纠正目标）上拉，告诉模型“别那么做，应该往这边做”。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**: LIBERO benchmark（包含 Spatial, Object, Goal, Long 四个子集）。
  - **真机**: Agilex Cobot Magic 双臂机器人，执行叠衣服、扫地、擦桌子三个任务。
  - **Baseline**: 离线 RL 方法（AWR, DPO 等），以及在线 RL 方法（PPO, GRPO, DDPO）。基座模型为 $\pi_0$。
- **评价指标**: 任务成功率（Success rate），以及样本效率（达到相同性能所需的交互/训练样本量）。
- **实验结果**: 
  - **真机效果**: 在三个真机任务上，成功率从基座模型的 56.7% 提升到了 74.7%。并且涌现出了基座模型没有的恢复行为（比如一只手够不到物体时，会自动换另一只手去拿然后再重试）。
  - **仿真效果**: 在 LIBERO 上全面超越 AWR、DPO 等 SOTA 离线 RL 基线。
  - **样本效率**: 性能追平了 PPO、GRPO 等强大的在线 RL 方法，但使用的训练样本量少了大约一个数量级，证明了这种结构化利用失败数据的方法在样本效率上非常高效，不需要真机反复试错。

### 17. 🔥 [QQWorld (注：摘要未提供完整原标题，以核心方法名代替)] (QQWorld：基于分位数-分位数匹配的隐世界模型)
- **研究机构**: `摘要未提供（需查阅原文确认）`
- **Arxiv ID**: `2607.28415` | [点击跳转](https://arxiv.org/abs/2607.28415)

**0. 论文标题**
- **英文标题**: QQWorld (注：摘要未提供完整原标题，以核心方法名代替)
- **中文标题**: QQWorld：基于分位数-分位数匹配的隐世界模型
- **研究机构**: 摘要未提供（需查阅原文确认）

**1. 整体逻辑**
- **研究任务**: 基于隐空间世界模型（Latent World Models）的未来状态预测与下游规划（Planning）。
- **研究动机**: 现有的 LeWorldModel (LeWM) 使用 Epps-Pulley (EP) 损失将隐变量正则化为标准高斯分布。但作者发现，EP 损失在处理孤立的尾部样本时，修正梯度会迅速消失，导致隐分布出现严重的“重尾”现象（即尾部偏离高斯分布），这会降低隐空间质量并最终影响规划效果。
- **本质改动**: 将 EP 损失替换为分位数-分位数（Quantile-Quantile, QQ）匹配损失，并引入跨批次（cross-batch）机制，确保隐分布的尾部样本也能获得有效的梯度修正，使其更贴近高斯分布。
- **技术溯源**: 基于 LeWorldModel (LeWM) 架构。

**2. 技术拆解**
- **重点改进**: 
  1. **QQ 匹配目标函数**：直接将隐空间样本投影后，与按秩（rank）匹配的高斯分位数进行对齐。这解决了 EP 损失在尾部梯度消失的问题。
  2. **Cross-batch QQ（跨批次 QQ）**：引入历史 batch 的样本（阻断梯度回传）来扩大排序池，让分位数匹配更准确，同时分析了这种做法在偏差和方差上的权衡。
- **架构细节**: 整体架构沿用 LeWM，在紧凑的隐空间（Latent space）进行状态预测。输入当前状态和动作，输出未来状态的隐表示。具体的网络层数、参规模等细节摘要中未提及。
- **核心 Loss**: 世界模型原本的状态预测 Loss + **QQ 匹配 Loss**（用于正则化隐变量分布，直接替代了原有的 EP Loss）。没有提及额外的辅助任务（如像素级重建）。

**3. 实验结果**
- **数据集和baseline**: 在 4 个控制环境（常规的连续控制任务）中进行测试。Baseline 为 LeWorldModel (LeWM)。
- **评价指标**: 平均规划成功率（Planning success rate）、高斯分布对齐程度、隐空间分布的尾部厚度（越薄说明重尾问题越少）。
- **实验结果**: 相比 LeWM，QQWorld 有效提高了平均规划成功率。在隐空间特征上，QQWorld 始终表现出更好的高斯对齐效果，且隐分布的尾部更薄（证明了重尾偏差得到了有效控制）。

### 18. 🔥 [WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning] (WCM：面向视觉-语言-动作强化学习的世界Critic模型)
- **研究机构**: `同济大学、复旦大学、上海创新研究院`
- **Arxiv ID**: `2607.29613` | [点击跳转](https://arxiv.org/abs/2607.29613)

**0. 论文标题**
- **英文标题**: WCM: A World Critic Model for Vision-Language-Action Reinforcement Learning
- **中文标题**: WCM：面向视觉-语言-动作强化学习的世界Critic模型
- **研究机构**: 同济大学、复旦大学、上海创新研究院

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的强化学习（RL）后训练，重点解决基于Critic（评价网络）的VLA-RL方法中的状态估计问题。
- **研究动机**: 机器人控制本质上是部分可观测的（POMDP），但现有的VLA-RL中的Critic通常只看单帧图像来估计Value，丢失了运动、接触等动态信息。如果简单粗暴地把多帧历史图像拼起来输入给Critic，由于标量Value回归的监督信号太弱，Critic学不到时间动态，只会把多帧当成一个更大的静态特征，导致效果提升不明显。
- **本质改动**: 把“世界模型（预测未来）”和“Critic（估计Value）”合二为一。通过让Critic同时预测下一帧的隐状态，强迫它的内部表征去理解环境的时间动态变化，从而给出更准的Value估计。
- **技术溯源**: 基于轻量级的 LeJEPA 架构设计。兼容多种主流VLA基座，包括自回归模型 OpenVLA-OFT 和 Flow-matching 模型 π0、π0.5。语言编码使用了 CLIP。

**2. 技术拆解**
- **重点改进**: 将传统的“单帧/多帧特征 -> 标量Value”的Critic网络，改为“历史观测序列 -> 预测下一帧隐状态 + 估计Value”的联合网络。用预测未来的辅助任务来提供更密集的梯度监督，解决状态近似问题。
- **架构细节**: 
  - **输入**：过去 $K$ 帧的图像（用ViT或VLA自带的VLM backbone编码）、语言指令（CLIP编码后过Adapter映射）。
  - **结构**：包含观测编码器、世界预测器（一个因果Transformer，处理历史视觉序列和语言指令的交叉注意力），以及两个轻量级解码头。一个是Value Head输出标量Value；另一个是World Head，结合当前动作，用门控FiLM残差块预测下一帧的隐状态。
  - **规模**：WCM本身非常轻量，可学习参数约 107.2M。
- **核心 Loss**: 总Loss由三部分组成，端到端联合训练：
  1. **Value Loss**：预测的Value与真实回报（Return，经过min-max归一化到[-1,1]）的L2损失。
  2. **Prediction Loss**：预测的下一帧隐状态与真实下一帧隐状态的L2损失（使用Teacher-forcing）。
  3. **SIGReg Loss**：一种正则化损失，强制隐空间的特征分布符合各向同性高斯分布，防止特征坍塌和模式退化。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：ManiSkill（149个任务，测分布内IND和分布外OOD）、MetaWorld、CALVIN、LIBERO-Plus。对比了SFT基线以及 Flow-SDE、PPO、GRPO、π-stepNFT 等主流RL后训练方法。
  - **真机**：WidowX-250S机械臂上的7个任务（动态抓取、柔性物体操作、长序列、抓取放置）。对比了AWR和RECAP等Off-policy RL方法。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - **仿真表现**：在ManiSkill上全面取得SOTA。例如OpenVLA-OFT结合WCM，IND成功率比SFT基线提升70.9%，甚至在Zero-shot SFT（初始成功率仅0.8%）的极端情况下，RL训练后成功率飙升至98.7%。在LIBERO-Plus泛化测试中，仅用1条demo做SFT初始化，经过WCM的RL训练后，效果超过了用50条demo做Full-SFT的模型。
  - **真机表现**：在7个真实任务中，使用107M参数的WCM作为Critic，全面超越了使用270M参数Gemma模型作为Critic的baseline（AWR/RECAP），在有限数据（每个任务100条SFT轨迹+少量rollout）下实现了更稳定、高效的真机部署。

### 19. 🔥 [FibVLA: An Efficient Temporal Vision-Language-Action Model with Fibonacci Sampling] (FibVLA：一种基于斐波那契采样的高效时序视觉-语言-动作模型)
- **研究机构**: `文本未明确标注（推测为国内相关高校/研究团队）`
- **Arxiv ID**: `2607.29596` | [点击跳转](https://arxiv.org/abs/2607.29596)

**0. 论文标题**
- **英文标题**: FibVLA: An Efficient Temporal Vision-Language-Action Model with Fibonacci Sampling
- **中文标题**: FibVLA：一种基于斐波那契采样的高效时序视觉-语言-动作模型
- **研究机构**: 文本未明确标注（推测为国内相关高校/研究团队）

**1. 整体逻辑**
- **研究任务**: 机器人操作中的长视野（long-horizon）时序视觉-语言-动作（VLA）建模。即结合语言指令、当前视觉/本体感觉以及历史上下文，生成未来的动作序列（action chunk）。
- **研究动机**: 现有的 VLA 在处理长历史上下文时，直接把所有历史帧塞进模型会导致“token爆炸”，推理太慢，达不到实时控制要求。而现有的稀疏采样或固定频率采样，忽略了具身任务信息密度的非均匀性（比如近期动作变化快需要高频采样，远期任务进度变化慢只需低频采样）。
- **本质改动**: 在输入端用“对数尺度”稀疏采样历史帧（近密远疏）；在推理端利用“斐波那契数列”的递推特性，让当前步需要的历史帧刚好是上一步已经算过的，从而直接复用 KV Cache，省去重复编码历史帧的计算开销，把推理速度提上去。
- **技术溯源**: 视觉语言基座基于 PaliGemma，视觉编码器使用 SigLip；动作生成部分抛弃了自回归离散 token，改用 Flow Matching（流匹配）生成连续动作分布。

**2. 技术拆解**
- **重点改进**: 
  1. **对数后见采样**：按对数尺度采样历史视觉帧和本体状态，保留近期高频细节，覆盖远期低频上下文。
  2. **通道级时序编码 (CTE)**：通过帧差法提取运动掩码，过滤静态背景。把近、中、远三个时间尺度的历史特征分别映射到图像的 R、G、B 通道，把时序信息压缩进单张图里，减少 token 数量。
  3. **斐波那契循环推理**：把 action chunk 的长度和斐波那契数列绑定。利用 $k_i = k_{i-1} + k_{i-2}$ 的数学性质，让时间步完美对齐，实现 KV Cache 的无缝复用。
- **架构细节**: 
  - **输入输出**：输入为语言指令、当前多视角 RGB 帧、本体状态，以及经过对数采样和 CTE 处理的历史特征图；输出为连续的 action chunk。
  - **模型结构**：多模态输入转为 token 后输入 PaliGemma backbone。动作专家（Action Expert）基于 Flow Matching 输出动作分布，而不是直接回归确定性的动作序列。
  - **推理机制**：动态绑定 action chunk 长度 $L = k_{i-2}$。这样当前时刻 $t'$ 需要的历史帧 $t'-k_i$ 刚好等于上一时刻 $t$ 已经处理过的 $t-k_{i-1}$，直接复用历史 token，不用重新过一遍视觉编码器。
- **核心 Loss**: 主要是 Flow Matching 的动作生成损失（如预测速度场或噪声的 MSE loss），用于拟合连续动作分布。文中未提及额外的辅助任务（如视频重建或对比学习）Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真端用了 LIBERO、MIKASA-Robo、SimplerEnv (Fractal 和 Bridge)；真机端用自建数据集（Piper 机械臂，600k 帧，15 个单/双臂及长/短视野任务）。
  - **Baseline**：对比了 RT-1/2-X、OpenVLA、Octo、π0、CogACT、TraceVLA、4D-VLA 等主流 VLA 模型。
- **评价指标**: 任务成功率（Success Rate, SR），以及推理效率（实时响应延迟/计算开销）。
- **实验结果**: 
  - **LIBERO**：平均成功率 96.8%。在长视野任务（LIBERO-Long）上达到 95.2%，比第二名（CogACT）高出 7.21%，长程任务优势明显。
  - **SimplerEnv-Fractal**：平均成功率 72.1%，比第二名 CogACT 提升 5.87%。在视觉干扰极大的 Visual Aggregation 设置下依然保持 65.5% 的稳定成功率，说明模型没有死记硬背背景。
  - **SimplerEnv-Bridge**：平均成功率 67.3%，比 CogACT 提升 3.12%，比 π0 提升 20.9%。
  - **效率表现**：得益于斐波那契推理复用 KV Cache，大幅降低了长上下文带来的计算负担，在真机实验中展现出比基于视频的 baseline 更好的实时响应能力，动作也更平滑。

### 20. 🔥 [Boundless World Model (BWM)] (无界世界模型：一种用于机器人操作的开源、低成本、高保真世界模拟器)

**0. 论文标题**
- **英文标题**: Boundless World Model (BWM) 
- **中文标题**: 无界世界模型：一种用于机器人操作的开源、低成本、高保真世界模拟器
- **研究机构**: 摘要未明确提及具体单位（推测为参与 WorldArena Challenge 的顶尖AI/机器人团队，已开源完整代码和权重生态）

**1. 整体逻辑**

- **本质改动**: 提出了一种动作条件化的自回归世界模型。把初始环境画面、历史动态画面和按时间对齐的机器人动作结合起来预测未来画面，并设计了一套专门构建“动作-视频”严格对齐训练数据的方法。
- **技术溯源**: 基于自回归视频生成架构（摘要未指明具体的开源基座，但明确采用了自回归预测范式来替代传统物理引擎）。

**2. 技术拆解**
- **重点改进**: 
  1. **动作条件化机制**：融合初始环境引导、动态视觉历史和时间对齐的动作序列，让模型能根据具体动作精准预测下一步画面。
  2. **训练数据构建**：通过轨迹重放（trajectory replay）、重叠片段采样（overlapping clip sampling）和初始观测增强，构建出动作和画面严格对齐的训练视频片段。
  3. **双重下游应用**：不仅能当“数据引擎”（生成 rollout 数据增强模仿学习），还能当“策略评估器”（做闭环评估、风险预测和策略排序）。
- **架构细节**: 
  - **输入**：初始环境观测（初始状态画面）、动态视觉历史（过去的观测画面）、时间对齐的机器人动作序列。
  - **输出**：未来观测画面的自回归预测序列。
  - **结构**：有状态的自回归预测模型（Stateful autoregressive model），强调对历史动态状态的保持。
- **核心 Loss**: 摘要未提供具体公式。推测主 Loss 为自回归视频生成的标准预测 Loss（如 Next-token 交叉熵损失或扩散重建 Loss），配合动作条件对齐的约束。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集/Benchmark**：WorldArena benchmark，以及真实物理机器人测试。
  - **Baseline**：传统的物理模拟器和现有的视频生成模型（摘要未列出具体对比的模型名称）。
- **评价指标**: 
  - **模拟器保真度**（Simulator fidelity）：生成的画面与真实物理世界演化的吻合程度。

### 21. 🔥 [SAGP: Semantic Affordance-Guided Grasp Planning via Coarse-Zone VLM Reasoning] (SAGP：基于粗粒度区域VLM推理的语义可供性引导抓取规划)
- **研究机构**: `Khalifa University（哈利法大学）`
- **Arxiv ID**: `2607.29374` | [点击跳转](https://arxiv.org/abs/2607.29374)

**0. 论文标题**
- **英文标题**: SAGP: Semantic Affordance-Guided Grasp Planning via Coarse-Zone VLM Reasoning
- **中文标题**: SAGP：基于粗粒度区域VLM推理的语义可供性引导抓取规划
- **研究机构**: Khalifa University（哈利法大学）

**1. 整体逻辑**
- **研究任务**: 机器人的语义/任务导向抓取规划。不仅要“抓得起”物体，还要抓在符合后续任务需求的功能部位（比如抓杯子的把手而不是杯口，抓刀柄而不是刀刃）。
- **研究动机**: 纯几何的抓取算法只管物理上的力闭合和无碰撞，不管功能语义，经常抓错位置；而现有的VLM（视觉语言模型）抓取方法，要么依赖需要大量标注的细粒度部件分割，要么直接让VLM输出3D抓取坐标，后者会导致严重的空间幻觉（坐标根本不准）。
- **本质改动**: 引入“粗粒度区域（Coarse-Zone）”抽象层。不让VLM直接预测精确坐标，而是先用传统算法把物体点云切成几个粗粒度的语义区域（如顶部、中部、底部、把手等），让VLM对这些区域进行零样本打分（好、可接受、差、危险），最后用这个语义分数去重排传统的几何抓取候选。
- **技术溯源**: 视觉语言模型基于开源的 Qwen-VL；点云处理和几何采样基于 Open3D 以及传统的对跖点（Antipodal）采样策略。整个Pipeline是免训练（training-free）的。

**2. 技术拆解**
- **重点改进**: 提出了 Coarse-Zone Decomposition（粗粒度区域分解）机制。将VLM的强项（理解“把手”、“杯口”等高层概念）和几何规划器的强项（精确计算3D坐标和碰撞检测）解耦，用区域打分代替坐标预测，解决了VLM的空间幻觉问题。
- **架构细节**: 
  - **输入输出**: 输入RGB-D图像，输出6-DOF抓取位姿。
  - **区域分解**: 用PCA对齐点云主轴，按垂直方向三等分（顶、中、底），用DBSCAN聚类距离质心较远的点作为“突出部”（识别把手等结构）。
  - **VLM推理**: 把裁剪后的RGB图喂给 Qwen-VL，用结构化Prompt让它输出JSON，包含各区域的评级、偏好区域、避开区域以及抓取方向约束。
  - **候选生成与重排**: 采样5000个点生成对跖点抓取候选，过滤碰撞后保留最多200个。根据候选点所在的区域，应用VLM的打分进行重排序。
- **核心 Loss**: 本文是免训练的推理框架，没有神经网络训练的Loss。核心是一个**五组件融合打分函数（Scoring Function）**：$S(g) = \alpha S_{geom} + \beta S_{reach} + \gamma S_{afford} - \delta S_{avoid} + \epsilon S_{task}$。包含几何质量（对跖点法向夹角）、运动学可达性（IK裕度）、区域可供性（VLM打分）、避开惩罚（VLM标记的危险区）和任务对齐（VLM建议的抓取方向和姿态约束）。权重（0.3, 0.1, 0.3, 0.2, 0.1）通过小规模验证集微调确定。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集/环境**: PyBullet仿真环境，Franka Panda机械臂，14个YCB物体（分为非对称带把手物体和近对称物体）。设计了稳定抓取、功能抓取、杂乱场景抓取三个任务。
  - **Baseline**: Geometry-Only (GO，纯几何打分) 和 VLM-Direct (VD，直接把Top-20几何候选丢给VLM让它直接排序，无区域抽象)。
- **评价指标**: 抓取成功率 (GSR)、偏好区域准确率 (PZA，成功抓取落在VLM推荐区域的比例)、避开合规率 (AC)、姿态保持率 (OP，抓取后物体姿态变化在15度以内的比例)、平均规划时间 (MPT)。
- **实验结果**: 
  - SAGP 和 GO 的抓取成功率 (GSR) 都超过 90%，说明加入语义重排没有牺牲物理抓取的成功率。
  - 在语义指标上，SAGP 的偏好区域准确率 (PZA) 超过 60%，而 GO 仅相当于随机概率；姿态保持率 (OP) 也显著提升。
  - 对于非对称/带把手物体（如马克杯、电钻），SAGP 能稳定抓住把手，而 GO 会随机抓在物体表面；对于近对称物体（如罐头），两者表现一致（因为随便抓都行，符合预期）。
  - VLM-Direct (VD) 表现最差，证明直接让VLM对具体坐标排序会产生幻觉，必须依赖粗粒度区域抽象。
  - 规划时间方面，由于采用了缓存机制，SAGP 的平均耗时与 GO 相当（首次查询VLM需1-3秒，后续极快）。

### 22. 🔥 [ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts] (ST-WAM：面向视觉分布偏移下鲁棒操作的语义-时序世界动作模型)
- **研究机构**: `清华大学 (Tsinghua University) 等`
- **Arxiv ID**: `2607.28993` | [点击跳转](https://arxiv.org/abs/2607.28993)

**0. 论文标题**
- **英文标题**: ST-WAM: Semantic-Temporal World Action Model for Robust Manipulation under Visual Distribution Shifts
- **中文标题**: ST-WAM：面向视觉分布偏移下鲁棒操作的语义-时序世界动作模型
- **研究机构**: 清华大学 (Tsinghua University) 等

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习，重点解决视觉分布偏移（如背景、光照、视角变化）下的鲁棒性问题。
- **研究动机**: 现有的视频生成式世界动作模型（WAMs）在遇到没见过的视觉干扰时，会出现“训练分布幻觉”——预测的未来视频会退化回训练集的样子，而不是反映真实的物理状态变化，导致动作预测失败。作者诊断发现，VAE隐空间对视觉变化太敏感，而DINOv3特征在视觉变化下更稳定，且能很好地区分不同的任务状态。
- **本质改动**: 不直接去修正幻觉视频，而是引入DINOv3语义特征打辅助。训练时同时预测VAE隐变量和DINO特征（双空间），并在生成动作时利用当前语义去检索历史DINO特征（意图检索），让动作生成更关注任务状态本身。推理时不生成未来，保证部署速度。
- **技术溯源**: 基于 Wan2.2 (视频生成DiT和VAE)、DINOv3 (视觉特征提取)、Qwen3-VL (多模态特征提取) 和 T5 (文本编码) 等开源基座。

**2. 技术拆解**
- **重点改进**: 
  1. 双空间未来专家 (DSFE)：用三个分支的Transformer混合架构，同时预测未来VAE隐变量、未来DINO特征和动作，让细粒度的视觉动态和稳定的语义状态互相补充。
  2. 当前锚定意图检索 (CAIR)：用当前帧和语言指令提取语义Query，去检索历史帧的DINO特征，提取出短期意图Token注入到动作生成中，帮助模型在视觉干扰下找回正确的任务进度。
- **架构细节**: 
  - **输入输出**: 输入当前多视角图像、本体状态、语言指令和4帧历史图像；输出未来32步的动作块（Action Chunk）。
  - **模型结构**: 包含三个DiT分支：视觉未来（5B参数）、语义未来（1B参数）和动作（1B参数）。设计了非对称注意力掩码：当前特征作为锚点，未来特征可以互相交互但不能看动作，动作特征只能看当前和历史意图，不能看未来。这样训练时能互相促进，推理时可以直接砍掉未来分支，不增加推理耗时。
  - **模型规模**: 主干DiT参数量约 7B（5B+1B+1B），Wan2.2 VAE、DINOv3、Qwen3-VL和T5等编码器在训练中保持冻结。
- **核心 Loss**: 
  - **主 Loss 构成**: 联合 Flow-Matching 损失。包含视觉未来、语义未来和动作三个分支的 Flow Matching 速度预测 MSE Loss，权重配比为 1.0 : 0.02 : 1.0。
  - **辅助任务**: 没有传统的像素重建或语义分割等辅助任务。监督信号直接来自冻结的 VAE 和 DINOv3 提取的特征，端到端优化。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO（4个子集）、LIBERO-Plus（包含7种视觉扰动的零样本测试集）、RoboTwin 2.0（双臂操作）以及5个真实世界单臂任务。
  - **Baseline**: 对比了 π0、π0.5 等VLA模型，Fast-WAM、Motus 等视频生成WAM，以及 LaWAM 等其他未来表示方法。
- **评价指标**: 任务成功率 (Success Rate, %)。
- **实验结果**: 
  - 在 LIBERO 上达到 98.7% 的最高成功率（无需大规模具身预训练）。
  - 在 RoboTwin 2.0 上达到 92.77% 的最高成功率。
  - 在 LIBERO-Plus 零样本泛化测试中，成功率达到 72.8%，比 Fast-WAM (51.5%) 提升了 21.3 个百分点。
  - 在真实世界视觉偏移测试中，成功率从 Fast-WAM 的 25.8% 大幅提升至 61.5%，翻了一倍多。
