            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [GAP: Geometric Anchor Pre-training for Data-Efficient Visuomotor Learning of Manipulation Tasks] (GAP：用于高效操作任务视觉运动学习的几何锚点预训练)
- **研究机构**: `都灵理工大学 (Polytechnic University of Turin)`
- **Arxiv ID**: `2605.15836` | [点击跳转](https://arxiv.org/abs/2605.15836)

**0. 论文标题**
- **英文标题**: GAP: Geometric Anchor Pre-training for Data-Efficient Visuomotor Learning of Manipulation Tasks
- **中文标题**: GAP：用于高效操作任务视觉运动学习的几何锚点预训练
- **研究机构**: 都灵理工大学 (Polytechnic University of Turin)

**1. 整体逻辑**
- **研究任务**: 小样本（≤50条演示）下的机器人视觉运动模仿学习。核心是将冻结视觉骨干输出的高维特征，压缩为控制所需的稀疏空间坐标。
- **研究动机**: 演示数据极少时，轻量级空间池化层（Adapter）极易发生“瓶颈塌陷”。由于下游动作回归Loss提供的空间监督太弱，Adapter会过拟合背景纹理等捷径特征，而非学习物体几何，导致策略对场景扰动极度脆弱。
- **本质改动**: 在下游策略训练前，插入一个“无动作标签”的轻量级预训练阶段。利用代理任务的物体掩码显式约束Adapter，强制其输出稳定、覆盖物体、分布均匀的关键点，再将其作为坐标接口喂给下游策略。
- **技术溯源**: 策略端基于 Diffusion Policy；视觉端采用冻结的预训练视觉骨干（R3M, DINOv2, VC-1 或 ResNet50）+ Spatial Softmax (SS) 池化架构。

**2. 技术拆解**
- **重点改进**: 将“语义特征提取”与“几何坐标映射”解耦。放弃依赖下游动作Loss的隐式监督，改用零成本Mask进行显式几何监督，用低参数、强结构约束的池化器替代高容量注意力池化器，防止少样本下的表征坍缩。
- **架构细节**: 
  - 输入：VFM输出的密集特征图（如 $C \times H \times W$）。
  - 处理流：浅层CNN（3×3 + 1×1卷积）投影为 $K$ 个通道激活图 → Spatial Softmax 计算期望值 → 输出 $K$ 个2D关键点坐标 $(x,y)$。
  - 规模与开销：Adapter仅约200万参数。预训练阶段用100条简单抓取轨迹，单张消费级GPU约40分钟，与下游任务完全解耦。
- **核心 Loss**: 预训练阶段使用掩码监督的三项组合Loss，形成“拉向物体、推开覆盖、彼此分散”的推拉动态：
  - **质心对齐 $\mathcal{L}_{center}$**: 关键点平均位置逼近掩码质心，确保锚点落在物体上。
  - **几何散布 $\mathcal{L}_{spread}$**: 关键点分布方差匹配由掩码面积推算的目标尺度，防止所有点坍缩至中心，强制覆盖物体范围。
  - **多样性 $\mathcal{L}_{div}$**: 强制关键点间保持最小间距，鼓励网络寻找物体不同边缘/极值点，提升结构信息量。
  - 实际按场景实体数量对 $K$ 个点分组独立计算，多物体解耦。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：Robomimic (Can, Square, Tool Hang) 和 ManiSkill3 (StackCube)。策略训练仅用 15/20/30/50 条演示。
  - Baseline：ResNet50端到端微调、R3M/DINOv2/VC-1冻结骨干+SS、AFA（注意力特征聚合）。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 在极端少样本和跨仿真域（预训练用Robomimic，测试用ManiSkill）下全面占优。
  - Can (15条): GAP 成功率62%，较AFA提升16%，较端到端提升7%。
  - Tool Hang (50条, 长程高精度): GAP 达63%，较最优Baseline (R3M+SS) 提升13%。
  - StackCube (30条, 跨域): GAP 达61%，较端到端微调提升11%。
  - 关键结论：性能提升主要来自几何约束Loss，仅增加代理数据而不加几何Loss会导致负迁移；预训练得到的锚点初始化具有强泛化性，可跨任务、跨仿真器零成本复用。

### 2. 🔥 [Feedback World Model Enables Precise Guidance of Diffusion Policy] (反馈世界模型实现扩散策略的精确引导)
- **研究机构**: `南洋理工大学 (Nanyang Technological University)`
- **Arxiv ID**: `2605.15705` | [点击跳转](https://arxiv.org/abs/2605.15705)

**0. 论文标题**
- **英文标题**: Feedback World Model Enables Precise Guidance of Diffusion Policy
- **中文标题**: 反馈世界模型实现扩散策略的精确引导
- **研究机构**: 南洋理工大学 (Nanyang Technological University)

**1. 整体逻辑**
- **研究任务**: 在初始位姿偏移等分布外（OOD）场景下，提升基于世界模型引导的扩散策略（Diffusion Policy）的在线执行成功率。
- **研究动机**: 现有推理时引导方法将世界模型当作静态开环预测器。遇到OOD状态时，预测误差会随步数累积，导致引导信号失真。传统解法依赖采集更多Rollout数据微调或扩大模型，数据成本高且部署慢。作者发现机器人执行后获得的真实观测天然包含“预测与实际”的偏差，该信号在现有框架中被忽略。
- **本质改动**: 在推理阶段构建“预测-观测”闭环，用实时观测误差在线修正世界模型的潜在状态预测；同时引入动作敏感度权重，使引导信号只聚焦机器人能实际控制的状态维度，过滤无关干扰。
- **技术溯源**: 基于标准动作条件潜在世界模型（Latent World Model）与扩散策略框架，继承并改造了现有“预测状态匹配专家潜在空间”的引导范式。

**2. 技术拆解**
- **重点改进**: 
  1) **反馈世界模型**：冻结预训练权重，维护一个轻量级辅助内部状态。计算真实观测与辅助状态的差值，通过固定增益在线补偿模型预测速度，实时抵消累积误差。论文给出了该反馈过程在温和条件下的收敛性证明。
  2) **动作感知引导**：用反事实方差评估潜在空间中各维度对动作扰动的响应程度。在构建引导目标时，按响应程度对各维度加权，放大机械臂能直接控制的几何/位姿维度，压低背景/光照等弱可控维度。
- **架构细节**: 
  - **输入输出**：输入当前观测编码的潜在状态 $z_t$ 与扩散去噪第 $\tau$ 步的候选动作序列 $A_t^{(\tau)}$；输出经反馈修正后的下一时刻潜在状态预测 $z_{t+1}^{fb}$。
  - **运行机制**：将世界模型预测转为速度形式 $\hat{v}_t$。维护辅助状态 $\bar{z}_t$，计算残差 $e_t = z_t - \bar{z}_t$。修正预测速度为 $\hat{v}_t^{corr} = \hat{v}_t + L e_t$（$L$为固定正定增益矩阵），进而得到 $z_{t+1}^{fb}$。动作执行后，环境返回新观测更新 $\bar{z}_{t+1}$ 和 $e_{t+1}$，形成推理外环。全程不更新任何网络参数。
  - **专家库**：预存专家演示的潜在状态集合。每步将 $z_{t+1}^{fb}$ 匹配至欧氏距离最近的专家状态，作为优化目标。
- **核心 Loss**: 
  - 策略训练：标准扩散模型Score Matching Loss。
  - **推理引导能量**：$E_{ctrl} = \sum_{j=1}^D w_j^{(\beta)} (z_{t+1,j}^{fb} - z_{i^*,j}^E)^2$。即带可控性权重的加权MSE。对其求关于候选动作的梯度，乘以引导系数 $\lambda$ 后直接叠加到扩散策略的Score函数上，指导去噪过程。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：Robomimic (Square, Tool-Hang, Transport)、LIBERO-Plus (4个Kitchen/LivingRoom任务)、真实机械臂 (Peach-P&P抓取、Drawer-Open开抽屉)。所有实验均通过扰动机器人初始位姿构造OOD测试集。采用低数据设定（仿真用20%演示，实物仅50-65条轨迹）。
  - **Baseline**：基础扩散策略、混合BC、过滤BC、标准世界模型引导(Std. Guid.)、额外采集Rollout数据微调的增强引导(Rollout Guid.)。
- **评价指标**: 潜在空间预测MSE（衡量世界模型在线预测精度）、任务成功率（衡量策略最终执行效果）。
- **实验结果**: 
  - **预测精度**：反馈机制使世界模型在线预测误差最高降低 76.4%（仿真任务降 73.3%，真实任务降 65.4%~76.4%）。PCA可视化显示，反馈修正后的预测轨迹能紧贴真实流形，有效抑制了开环预测的长期漂移。
  - **策略性能**：结合动作加权后，OOD场景下仿真平均成功率从最佳Baseline的 45% 提升至 52%。文中总结在部分任务中OOD成功率相对提升达 30%。该方法无需额外采集训练数据，在线计算开销极小，且稳定优于依赖Rollout数据训练的基线，真实场景部署验证通过。

### 3. 🔥 [FLASH: Efficient Visuomotor Policy via Sparse Sampling] (FLASH：基于稀疏采样的高效视觉运动策略)
- **研究机构**: `南洋理工大学 (NTU), MARS Lab`
- **Arxiv ID**: `2605.15492` | [点击跳转](https://arxiv.org/abs/2605.15492)

**0. 论文标题**
- **英文标题**: FLASH: Efficient Visuomotor Policy via Sparse Sampling
- **中文标题**: FLASH：基于稀疏采样的高效视觉运动策略
- **研究机构**: 南洋理工大学 (NTU), MARS Lab

**1. 整体逻辑**
- **研究任务**: 机器人模仿学习中的视觉-运动策略生成（根据多视角图像流与历史本体感知，输出未来连续动作轨迹）。
- **研究动机**: 现有生成式策略（Diffusion/Flow Matching）严重依赖多步迭代去噪或ODE求解，推理延迟高，难以满足机器人实时控制；若直接拉长离散动作预测窗口以拉长推理间隔，会遭遇维度灾难并导致块间拼接抖动。需要一种能用低频推理覆盖高频控制、且不增加模型复杂度的方法。
- **本质改动**: 将离散动作块生成替换为连续 Legendre 多项式轨迹表示。通过“稀疏时序采样”拟合多项式系数，使单次推理覆盖超长物理时间窗口；同时将流匹配的起点从高斯噪声改为历史动作拟合系数，大幅缩短传输距离，实现高精度单步推理。
- **技术溯源**: 基于流匹配（Flow Matching）理论框架，视觉编码采用 ResNet-18，策略主干采用 DiT（Diffusion Transformer）架构。未依赖 LLM/CLIP 等大型多模态基座，属于轻量级专用策略网络。

**2. 技术拆解**
- **重点改进**: 
  1) **稀疏参数化**：用大步长($k$)从专家演示中稀疏采样，闭式最小二乘拟合 Legendre 多项式系数。输出维度仅与多项式阶数相关，与物理时间窗口长度解耦。
  2) **历史锚定流**：用带 Tikhonov 正则的历史观测数据拟合出历史多项式系数 $\mathbf{C}_h$ 作为流起点（替代标准高斯先验），使分布传输路径极短。
  3) **跨窗口 C1 连续性**：拟合时引入重叠窗口与精确运动学锚点，通过 KKT 投影修正系数，强制相邻多项式块在拼接处的位置与速度连续。
  4) **解析速度前馈**：利用多项式可微特性直接求导得到精确速度指令，无需数值差分即可输入底层力矩控制器，显著降低跟踪误差。
- **架构细节**: 输入端将多视角图像（ResNet-18 提取特征）与历史本体感知拼接展平作为条件；DiT Flow Transformer 在系数空间预测恒定传输速度场；推理时仅执行 1 步欧拉更新得到未来系数，再通过时序上采样（改变评估步长 $k_{eval}$）在任意高频网格上解析出动作位置与速度。训练阶段的所有拟合矩阵、连续性修正矩阵均预计算并冻结，不参与梯度更新。
- **核心 Loss**: $\mathcal{L}_{total} = \mathcal{L}_{FM} + \lambda_{cons}\mathcal{L}_{cons}$。$\mathcal{L}_{FM}$ 为标准流匹配损失，监督任意插值时刻的速度场；$\mathcal{L}_{cons}$ 为多项式一致性损失，强制网络在 $\tau=0$ 处的一步更新结果直接逼近目标系数，是保障 NFE=1 推理精度的核心。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：Roboverse 平台 5 个仿真任务 + Franka 机械臂 2 个真实操作任务。
  - Baseline：9 个 SOTA 方法，包括 DDPM/DDIM/Flow Matching 的 UNet/DiT 变体、ACT、VITA、A2A-Noise，以及本文对照 FLASH-G（起点改用纯高斯噪声）。
- **评价指标**: 任务成功率（50次独立 rollout）、单集推理耗时（ms/episode）、训练收敛速度（optimizer steps）、控制器跟踪误差（IAE/时序误差）、函数调用步数（NFE）。
- **实验结果**: 
  1) **精度**：单步推理（NFE=1）下全任务成功率 ≥92%，优于最强单步基线 A2A-Noise 平均 4.8pp；历史锚定机制使成功率较 FLASH-G 平均提升 17.6pp。
  2) **速度**：单集推理耗时 31.40ms，比 Diffusion Policy 快 175 倍，比现有 Flow Matching 快 18 倍。
  3) **训练**：收敛速度比 ACT 快 4 倍。
  4) **控制与泛化**：跟踪误差较离散动作基线降低 5~7 倍；推理时仅修改上采样步长 $k_{eval}$ 即可在不重训的情况下实现任务执行速度的在线加减速（后验时序缩放），满足安全/精细子任务的不同时效需求。

### 4. 🔥 [Diffusion Policy for Coordinated Control of a Nonholonomic Mobile Base and Dual Arms in Door Opening and Passing] (基于扩散策略的非完整移动底盘与双臂协调开门及穿越控制)
- **研究机构**: `University of Massachusetts Amherst, alpha-z`
- **Arxiv ID**: `2605.15352` | [点击跳转](https://arxiv.org/abs/2605.15352)

**0. 论文标题**
- **英文标题**: Diffusion Policy for Coordinated Control of a Nonholonomic Mobile Base and Dual Arms in Door Opening and Passing
- **中文标题**: 基于扩散策略的非完整移动底盘与双臂协调开门及穿越控制
- **研究机构**: University of Massachusetts Amherst, alpha-z

**1. 整体逻辑**
- **研究任务**: 让带非完整移动底盘和双臂的移动操作机器人，仅凭多视角RGB图像和关节/位姿状态，完成拉开带阻尼自闭合门并安全穿越的长视野任务。
- **研究动机**: 传统方法依赖人工编写的有限状态机和分步规划，泛化差且遇扰动易卡死；现有模仿学习基线（如ACT）在加入视觉域随机化后容易过拟合到主导特征，且Transformer架构难以稳定生成多模态协调动作。
- **本质改动**: 用单端到端扩散策略替代多阶段状态机，直接建立“视觉+本体状态”到“双臂+底盘联合连续动作序列”的映射，利用扩散模型迭代去噪的特性处理长程时序协调与抗扰动恢复。
- **技术溯源**: 基于 Diffusion Policy (Chi et al.) 范式，视觉主干为预训练 ResNet-18，动作预测网络为 1D U-Net，条件注入采用 FiLM 机制。

**2. 技术拆解**
- **重点改进**:
  1. **轨迹数据生成**：仿真中用 IK 求解双臂目标关节角 + MPC 规划底盘轨迹，通过任务空间调度器平滑过渡生成类人轨迹；加入光照、门体/把手颜色的强域随机化防止策略死记硬背。
  2. **视觉编码策略**：弃用多相机权重共享的统一编码器，改为 3 个独立 ResNet-18 分别编码各相机视角，解决不同视角下几何/尺度差异导致的特征平均化（Domain Shift）。
  3. **推理延迟优化**：训练阶段用 100 步扩散保证优化稳定，推理时截断至 10 步去噪；结合 LoRA 微调、权重量化及硬件电源策略解锁，压平控制延迟以满足底盘实时闭环要求。
- **架构细节**:
  - 输入：堆叠最近 3 帧观测（3 路 180×240 RGB + 本体状态向量）。
  - 网络结构：3 路独立视觉特征与状态拼接 -> 1D U-Net (FiLM 条件) -> 预测未来 16 步动作序列。
  - 执行逻辑：采用 Receding Horizon 机制，每次仅执行序列的前 8 步，随后用最新观测重新规划。
- **核心 Loss**: 标准扩散模型噪声预测 MSE Loss（$\mathcal{L}=MSE(\epsilon_k, \hat{\epsilon}_k)$）。无逆动力学、图像重建或接触力估计等辅助任务。

**3. 实验结果**
- **数据集和baseline**: 100 条演示轨迹（仿真自动规划生成 + 真机主从遥操采集，含机器人起始位姿随机化）。对比基线：ACT、SmolVLA。消融项：共享 vs 独立视觉编码器、不同扩散去噪步数。
- **评价指标**: 固定测试场景下进行 10 次完整 Rollout，统计任务最高成功率。
- **实验结果**:
  - **主结果**：独立编码器扩散策略成功率 10/10；ACT 在视觉随机化下过拟合降至 8/10；SmolVLA 因预训练数据偏向桌面小机械臂，在双臂移动底盘上无法收敛（0/10）。共享编码器的扩散策略同样失败（0/10），验证了多视角独立编码的必要性。
  - **效率与部署**：扩散步数降至 30 性能无损；实际部署用 10 步去噪+LoRA量化，在不损失成功率的前提下显著降低推理延迟。
  - **抗扰动能力**：真机测试中人为在开门中途强行将门推回关闭，策略通过实时视觉反馈检测到状态突变，立即停止当前错误延伸，重新抓取并执行开门流程。证明该策略具备环境异常时的自主恢复能力，优于依赖固定时间轴或状态机的传统方法。

### 5. 🔥 [Learn Where Outcomes Diverge: Efficient VLA RL via Probabilistic Chunk Masking] (聚焦结果分叉处：基于概率块掩码的高效VLA强化学习微调)
- **研究机构**: `印度马德拉斯理工学院 (IIT Madras)`
- **Arxiv ID**: `2605.16154` | [点击跳转](https://arxiv.org/abs/2605.16154)

**0. 论文标题**
- **英文标题**: Learn Where Outcomes Diverge: Efficient VLA RL via Probabilistic Chunk Masking
- **中文标题**: 聚焦结果分叉处：基于概率块掩码的高效VLA强化学习微调
- **研究机构**: 印度马德拉斯理工学院 (IIT Madras)

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的强化学习（RL）微调，提升策略在复杂操纵任务中的最终成功率。
- **研究动机**: 业界优化VLA RL时默认瓶颈在数据采集（rollout），但作者实测发现梯度计算（反向传播）占了单步训练约78%的墙钟时间。现有GRPO把同一个优势值均匀分摊给轨迹里所有动作块（chunk），导致大量算力浪费在策略已经掌握、对任务成败影响极小的阶段上。
- **本质改动**: 将梯度计算视为固定预算，不再对整条轨迹做反向传播。通过计算成功与失败轨迹在各语义阶段的行为差异（方差），动态筛选出真正决定任务成败的“关键块”，仅对这些块执行梯度计算，其余块在计算图中直接物理剔除。
- **技术溯源**: 基于 OpenVLA-OFT (7B) 开源基座，使用 verl / SimpleVLA-RL 框架中的 chunk-level GRPO 流程，结合 LoRA 进行参数高效微调。

**2. 技术拆解**
- **重点改进**: 提出 Probabilistic Chunk Masking (PCM)。理论证明阶段级梯度方差 $V_c$ 决定该阶段的学习信号强度，并推导出 Neyman 最优分配公式（预算正比于 $N_c\sqrt{V_c}$）。因直接算 $V_c$ 开销大，作者提出用 rollout 自带的“成功/失败轨迹动作均值差” $C_c$ 作为 $V_c$ 的下界代理，实现零额外开销的信号评估。
- **架构细节**:
  - **轨迹切分与阶段划分**：动作序列按 chunk 长度 $L=8$ 切分。根据夹爪开合状态（硬规则）将每条轨迹划分为5个语义阶段（接近、预抓取、紧抓持、释放、尾部）。
  - **在线概率估计**：每步计算各阶段 $C_c$，存入长度为5的滑动窗口。窗口满后进行共享归一化和最大归一化，得到阶段保留概率 $p_c$（设下限0.1防止阶段性漏选）。
  - **固定预算采样**：每条轨迹固定分配预算 $B$（默认12个chunk）。按 $p_c$ 加权、无放回抽样选出具体chunk索引。
  - **物理裁剪**：未被选中的chunk在Actor反向传播前直接从batch tensor中移除，不参与前向激活保留与反向传播。
- **核心 Loss**: 主 Loss 为裁剪后的 GRPO 目标：$\mathcal{L}_{\mathrm{PCM}} = -\mathbb{E}[\sum_{k \in \mathcal{K}_i} A_i \log \pi_\theta(a_{i,k}|s_{i,k})]$。**未使用重要性加权（Importance Weighting）**，接受有偏估计。理论证明：被掩码的块本身 $V_c$ 极小、梯度趋近于0，因此偏差可忽略；同时有偏估计的方差显著低于无偏加权版本，反而能加速SGD收敛。无额外辅助任务Loss。

**3. 实验结果**
- **数据集和baseline**: LIBERO 三大操纵基准（Object, Spatial, Goal）。Baseline 为相同配置下的完整轨迹 GRPO（全量chunk反向传播，同SFT初始化、同reward与advantage计算）。
- **评价指标**: 最终成功率（Success Rate）、达到98%目标成功率所需的墙钟时间（小时）、单步梯度更新时间、GPU峰值激活显存（Activation Memory）。
- **实验结果**:
  - **性能对齐**：PCM（$B=12$）与完整 GRPO 的逐步学习曲线和最终成功率完全重合，证明关键信息无丢失。
  - **墙钟加速**：达到98%成功率平均提速 **2.38×**（从约49小时降至约20.5小时）。
  - **算力与显存优化**：单步梯度更新速度提升 **4.8×**；峰值激活显存下降 **60%**；全程仅对不到 **20%** 的轨迹chunk执行了反向传播。
  - **机制验证**：方差感知采样显著优于“随机掩码”或“仅选最高方差阶段”，且对预算 $B$ 在合理范围内表现稳定。

### 6. 🔥 [Mind Dreamer: Untethering Imagination via Active Latent Intervention on Latent Manifolds] (Mind Dreamer：通过隐空间流形上的主动潜变量干预解绑想象力)
- **研究机构**: `[未在提供文本中明确标注]`
- **Arxiv ID**: `2605.16030` | [点击跳转](https://arxiv.org/abs/2605.16030)

**0. 论文标题**
- **英文标题**: Mind Dreamer: Untethering Imagination via Active Latent Intervention on Latent Manifolds
- **中文标题**: Mind Dreamer：通过隐空间流形上的主动潜变量干预解绑想象力
- **研究机构**: [未在提供文本中明确标注]

**1. 整体逻辑**
- **研究任务**: 基于模型的强化学习（MBRL）中的样本高效策略学习与探索。
- **研究动机**: 现有 MBRL（如 DreamerV3）的“隐空间想象”存在“历史轨迹绑定”（Historical Tethering）问题：rollout 只能从 replay buffer 里的真实观测开始。这导致世界模型的流形结构学得快，但策略在稀疏奖励下学得慢，两者出现学习速率不对称。智能体遇到未探索的分布外（OOD）区域时只能随机游走，无法主动利用已学物理先验进行定向探索。
- **本质改动**: 将世界模型从“被动模拟器”改为“主动对抗生成器”。不再依赖历史 buffer 采样初始状态，而是训练生成器在隐空间进行非连续的“跳跃”，直接采样到知识盲区或前沿区域；同时推导“中继势场”函数，解决跨跳跃点的信用分配断裂问题。
- **技术溯源**: 算法架构基于 DreamerV3 的 RSSM（循环状态空间模型）；理论推导深度依赖主动推理（Active Inference）框架中的预期自由能（EFE）分解。

**2. 技术拆解**
- **重点改进**: 
  1. **主动潜变量干预 (ALI)**：在想象阶段引入参数化生成器 $\mathcal{G}_\theta$，从学习到的分布 $p_{gen}$ 中采样起始状态，实现跨区域的“隐空间跳跃”，直接瞄准世界模型转移熵高（结构模糊）或价值曲率大（策略未收敛）的区域。
  2. **中继势场 (Relay Potentials)**：针对跳跃打破的马尔可夫连续性，推导了两个递归贝尔曼代理函数：中继价值函数 RVF（负责目标/实用价值传播）和中继不确定性函数 RUF（负责信息增益/认知价值传播），将非连续跳跃转化为可优化的势能场。
- **架构细节**: 
  - **输入输出**：输入来自经验池的状态 $s$；生成器输出跳跃锚点 $s'$。策略和价值网络仍基于 RSSM 的隐状态进行标准 rollout。全过程在想象阶段完成，不增加真实环境交互成本。
  - **模型结构**：在标准 RSSM 基座上并行接入一个隐状态生成网络 $\mathcal{G}_\theta$，以及 RVF 和 RUF 两个独立的 Critic 网络。使用准静态目标网络（Target Potential Networks）稳定自举更新，防止流形上的值估计发散。世界模型更新频率低于生成器，提供相对平稳的动力学环境。
- **核心 Loss**:
  - **生成器主 Loss**：$\max_\theta \mathbb{E}[\eta V_{RVF} + \beta V_{RUF} - \lambda \mathcal{L}_{mf}]$。实际训练中采用 InfoNCE 对比损失替代直接梯度上升，强制生成状态的势能显著高于历史基线，防止模式崩溃。
  - **流形约束 $\mathcal{L}_{mf}$**：① 动力学一致性（惩罚高转移熵，防止生成器钻世界模型的预测漏洞）；② 循环一致性（$Enc(Dec(s')) \approx s'$，保证跳跃状态落在可重构的流形内）。二者共同构成“悲观信任域”，控制幻觉。
  - **RUF 特殊设定**：信息增益项强制使用二次折扣 $\gamma^2$（理论证明为收敛必要条件），划定“认知视界”，防止不确定性在远距离跳跃中指数级放大。

**3. 实验结果**
- **数据集和baseline**: DeepMind Control Suite (DMC Vision) 视觉控制任务。主要对比基线为 DreamerV3，并对比了部分依赖轨迹重标记或内在奖励的传统探索方法。
- **评价指标**: 样本效率（达到固定性能阈值所需的训练步数/环境交互步数）与最终收敛回报。重点考察稀疏奖励设置和存在狭窄通道的瓶颈任务。
- **实验结果**: 相比 DreamerV3，Mind Dreamer 在 DMC 视觉任务集上平均样本效率提升 1.67 倍；在稀疏奖励或关键瓶颈任务中，加速比最高达 8.8 倍。消融实验验证了 RUF（$\gamma^2$ 折扣防幻觉）和 RVF 的独立贡献，移除流形约束会导致生成器产生无效 OOD 状态并显著拖慢收敛。

### 7. 🔥 [Learning Bilevel Policies over Symbolic World Models for Long-Horizon Planning] (基于符号世界模型的双层策略学习用于长视距规划)
- **研究机构**: `Vector Institute, University of Toronto, LAAS-CNRS/图卢兹大学, RWTH亚琛工业大学`
- **Arxiv ID**: `2605.15975` | [点击跳转](https://arxiv.org/abs/2605.15975)

**0. 论文标题**
- **英文标题**: Learning Bilevel Policies over Symbolic World Models for Long-Horizon Planning
- **中文标题**: 基于符号世界模型的双层策略学习用于长视距规划
- **研究机构**: Vector Institute, University of Toronto, LAAS-CNRS/图卢兹大学, RWTH亚琛工业大学

**1. 整体逻辑**
- **研究任务**: 在连续状态空间、物体数量可变的具身环境中，根据高层符号目标进行长视距规划与底层动作生成。
- **研究动机**: 纯底层（LL）模仿学习或 VLA 方法难以高效处理超长步骤任务，且容易陷入局部次优；纯高层（HL）符号规划虽擅长长程推理，但难以建模复杂底层动力学与部分可观测环境。两者割裂导致现有方法在开放世界长视距任务中表现不佳。
- **本质改动**: 摒弃在线符号搜索或端到端黑盒训练，改为从底层演示数据中“离线提炼”高层策略。通过状态标注将底层轨迹抽象为符号序列，利用**目标回归（Goal Regression）**反推条件-动作规则，再经**归纳泛化**得到一阶逻辑符号策略；底层则直接学习如何执行高层下发的离散指令。
- **技术溯源**: 不依赖 LLM/VLA 等大模型基座。底层基于传统行为克隆（Imitation Learning）+ 图神经网络（GNN）；高层基于经典符号规划（STRIPS/PDDL 范式的谓词与动作模板）与逻辑归纳算法。

**2. 技术拆解**
- **重点改进**: 构建解耦的双层策略 $(\pi^{hl}, \pi^{ll})$。高层策略不依赖实时启发式搜索，而是将演示数据转化为可复用的符号规则集；底层策略将高层符号动作作为显式条件输入，直接回归连续控制量，实现“高层给意图，底层做执行”。
- **架构细节**:
  - **数据输入**: 带有高层目标的底层状态-动作演示集，外加预定义领域理论 $\mathcal{D}$（谓词/动作模式）和状态标注函数 $\mathcal{L}$（可由人工设计或视觉模型学习得到）。
  - **高层学习（3步离线提取）**: 1) 用 $\mathcal{L}$ 将底层轨迹映射为高层符号轨迹；2) **目标回归**：从目标状态倒推，提取触发该动作所需的具体前置条件（Grounded Rules）；3) **归纳泛化**：将规则中的具体物体名称替换为变量，生成支持任意数量物体的开放世界一阶规则。
  - **底层执行**: 采用轻量级图神经网络（参数量 < 3.3万）。节点为智能体与环境物体，边表示相对位置/状态关系。输入“当前底层观测 + 高层符号指令 + 高层目标”，输出连续关节控制量。运行时高层决策离散符号动作，底层持续执行直至环境跃迁至下一个高层抽象状态。
- **核心 Loss**: 底层策略使用标准的**行为克隆（Behavior Cloning）损失**拟合专家演示；高层策略为确定性逻辑规则提取与泛化，无梯度反向传播损失，依赖逻辑规则的完备性与一致性。

**3. 实验结果**
- **数据集和baseline**: 基于扩展版 MetaWorld 的 8 个操作环境（Blocks, Factory, Colour, Gacha，均包含短程固定/长程多物体变体）。对比 8 个基线，覆盖 VLA (SmolVLA)、端到端策略 (PureNN)、传统符号规划与 TAMP 求解器 (DetPlan, DetReplan, NdtPlan, PddlNN 等)。
- **评价指标**: 任务成功率、长视距/多物体场景下的零样本泛化能力、训练与推理的时间/内存开销、对开放世界假设与状态不确定性的鲁棒性。
- **实验结果**:
  - BISON 在长步骤和多物体任务上的成功率显著优于 VLA 与端到端基线；相比纯符号规划，能更稳地处理连续动力学扰动。
  - 训练与推理效率更高：无需在线搜索或大模型前向传播，内存与时间开销大幅下降。
  - 泛化性极强：仅高层策略即可在 1 分钟内完成含 10,000+ 相关物体的规划问题；底层 GNN 可零样本泛化到训练未见过的任意物体数量与排列。

### 8. 🔥 [DiLA: Disentangled Latent Action World Models] (DiLA：解耦的隐动作世界模型)
- **研究机构**: `[原文未明确列出机构信息，属计算机视觉/机器人交叉领域研究]`
- **Arxiv ID**: `2605.15725` | [点击跳转](https://arxiv.org/abs/2605.15725)

**0. 论文标题**
- **英文标题**: DiLA: Disentangled Latent Action World Models
- **中文标题**: DiLA：解耦的隐动作世界模型
- **研究机构**: [原文未明确列出机构信息，属计算机视觉/机器人交叉领域研究]

**1. 整体逻辑**
- **研究任务**: 在无真实动作标签的视频数据上，训练世界模型，自动推断抽象的控制动作（隐动作）并预测未来状态，支撑跨具身迁移与视觉规划。
- **研究动机**: 现有隐动作模型（LAMs）存在固有矛盾：加信息瓶颈（如离散化）能学到抽象动作，但破坏特征流形，视频生成质量差；放宽瓶颈生成质量好，但隐动作会混入纹理、光照等无关细节，导致迁移失败。以往方法多用两阶段训练或外挂光流/深度图硬解，端到端效率低。
- **本质改动**: 放弃全特征单一瓶颈，改为“内容-结构解耦”的双流设计。利用预测瓶颈本身作为驱动力，强迫模型将运动相关的空间布局（结构）和静态视觉细节（内容）剥离。结构路径专学隐动作与动态预测，内容路径专保真生成，两者在训练中互相促进。
- **技术溯源**: 以冻结的 **DINOv2** 为视觉特征基座，配合 **ST-Transformer** 编码时空依赖，使用 **Mamba** 做长期记忆，**RAE** 作为冻结的可视化解码器。不依赖任何大语言模型或预训练扩散模型。

**2. 技术拆解**
- **重点改进**: 构建结构与内容双流架构。结构路径在低维特征空间内施加严格的残差更新瓶颈，迫使IDM提取纯动态信号、FDM预测布局变化；内容路径用状态空间模型（Mamba）累积静态外观信息。两者在Fusion Decoder处融合重建特征。
- **架构细节**:
  - **输入/处理**: 16帧视频 -> DINOv2提特征 -> 时空Transformer编码。全程在潜在空间训练，避开像素级计算。
  - **结构流**: Structure Encoder压缩特征。IDM用3D卷积处理相邻帧结构特征差值（Δs），输出256维连续隐动作z。FDM为轻量ST-Transformer+AdaLN-zero，以残差形式预测下一结构状态（s + FDM(s, z)），防误差累积。
  - **内容流**: Content Encoder接Mamba模块，持续更新历史外观记忆（类似慢特征分析），负责处理遮挡、未观测区域等静态上下文。
  - **融合与推理**: Fusion Decoder以预测结构为Query，分别做交叉注意力查询内容记忆和首帧特征，重建目标DINO特征。Rollout时直接在结构空间自回归迭代，再逐帧解码，内容记忆同步更新。
- **核心 Loss**: 纯特征级自监督（Teacher-forcing），无像素重建。
  - `L_e` (特征重建) + `L_s` (结构预测) + `L_z` (隐动作循环一致性) + `L_reg` (正则)。
  - **正则设计是关键**：包含L2范数约束（压紧凑流形）、正反向动作余弦相似度约束（强制时间可逆的几何对称性）、方差最大化约束（防信息坍塌）。无额外辅助任务。

**3. 实验结果**
- **数据集和baseline**: 数据集覆盖日常操作(SSv2)、机械臂控制(RT-1)、室内导航(LoopNav)、户外场景(RECON)。对比基线：LAPA、Moto、AdaWorld(含独立LAM模块)、villa-x。消融含：移除内容流、移除IDM+FDM、离散隐动作等变体。
- **评价指标**:
  - 生成保真度：SSIM（结构一致性）、LPIPS（感知距离）。
  - 动作抽象性：自提“动作循环迁移指标”（源视频提取动作->迁移至目标视频Rollout->反向提取再应用回源视频），以预测误差增量衡量语义失真度。
  - 下游能力：结构/内容重绑定（Rebinding）解耦验证、MPC视觉规划成功率、流形线性探针分析。
- **实验结果**:
  - **生成质量**：DiLA在SSv2与RT-1上全面占优。RT-1上SSIM达0.774，LPIPS降至0.206，显著优于Moto(LPIPS 0.595)与AdaWorld(0.429)。消融证明，去掉内容路径后LPIPS回升至0.258，解耦设计直接拉升保真度。
  - **迁移与规划**：隐动作实现强跨域迁移（如人手动作平滑迁移至机械臂、虚拟至现实导航），循环迁移指标证实抽象性未受损。重绑定实验证明结构与内容完全独立可插拔。基于该世界模型的MPC在分布外场景下能有效完成视觉规划。
  - **机制验证**：去掉预测瓶颈或单流训练会导致解耦失效或保真度骤降，验证了“用动力学瓶颈驱动内容-结构拆分”这一协同设计的必要性。模型学到了连续、可解释且高保真的隐动作流形。
