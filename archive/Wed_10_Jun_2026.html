            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Task Robustness via Re-Labelling Vision-Action Robot Data] (通过重标注视觉-动作机器人数据提升任务鲁棒性)
- **研究机构**: `Mila, 蒙特利尔大学, 不列颠哥伦比亚大学 (UBC)`
- **Arxiv ID**: `2606.10918` | [点击跳转](https://arxiv.org/abs/2606.10918)

**0. 论文标题**
- **英文标题**: Task Robustness via Re-Labelling Vision-Action Robot Data
- **中文标题**: 通过重标注视觉-动作机器人数据提升任务鲁棒性
- **研究机构**: Mila, 蒙特利尔大学, 不列颠哥伦比亚大学 (UBC)

**1. 整体逻辑**
- **研究任务**: 机器人视觉-语言-动作（VLA）模型的数据增强，提升模型对文本指令的跟随能力和跨场景的动作泛化能力。
- **研究动机**: 现有的机器人数据集虽然规模变大了，但语言指令的多样性不够，导致 VLA 模型在推理时“看图像不看字”，对指令的措辞变化非常敏感。此外，长轨迹数据中，单一的语言标签被大量图像帧稀释，降低了语言信号的有效密度。
- **本质改动**: 不改模型结构，纯做数据层面的增强。利用大视觉语言模型（VLM）把现有的长轨迹数据“切碎”成子任务，并给每个子任务重新生成多样化的语言标签。在不增加物理采集成本的前提下，大幅增加“语言-动作”数据对的多样性。
- **技术溯源**: 数据增强部分基于 Gemini Pro 2.5（VLM）；下游策略基座模型使用了 Octo 和 $\pi_0$-FAST。

**2. 技术拆解**
- **重点改进**: 提出 TREAD 框架，通过 VLM 的零样本能力，对离线机器人数据进行“轨迹切分”和“指令重写”，解决长轨迹中语言标签单一和稀疏的问题。
- **架构细节**: 整个数据增强流程分三步，迭代调用 VLM：
  1. **子任务规划**：输入原始长指令和轨迹第一帧图像，让 VLM 规划出完成该任务所需的子任务标签序列（例如将“把碗放进抽屉并关上”拆分为“抓碗”、“放碗”、“关抽屉”）。
  2. **视频切分**：输入完整轨迹视频和上一步生成的子任务标签，让 VLM 给出每个子任务在视频中的起止时间，把长轨迹物理切分成带独立标签的子轨迹。
  3. **指令多样化**：输入子轨迹的第一帧和原始子任务标签，让 VLM 结合画面中的物体属性（颜色、形状）和空间位置，生成多种表述不同的同义指令（例如把“抓蓝杯子”改成“抓电脑旁边的杯子”）。
  最后，将原始数据和增强后的子轨迹数据按比例混合（通过 Re-Mix 调参）来微调策略。
- **核心 Loss**: 纯行为克隆（Behavior Cloning, BC）损失，即计算预测动作分布与真实动作之间的负对数似然。没有引入额外的辅助任务 Loss，完全依靠提升数据分布的质量来改善效果。

**3. 实验结果**
- **数据集和baseline**: 在 LIBERO-100 仿真数据集上评估。Baseline 是直接用原始数据微调的 Octo 和 $\pi_0$-FAST 模型，以及一个只切分轨迹但不做语言增强的消融版本（TREAD w/o div.）。
- **评价指标**: 任务成功率（Success Rate, SR）。测试了两个维度：语言泛化（改变指令的句式或去掉冗余词）和动作泛化（相同指令放到没见过的场景）。同时区分了单目标任务和双目标任务（分别统计完成1个和2个目标的成功率）。
- **实验结果**: 
  - **语言泛化提升显著**：在单目标任务上，Octo 的成功率从 82% 提升到 91%，$\pi_0$-FAST 从 47% 提升到 67%。说明模型不再死记硬背原始指令，能听懂不同的说法了。
  - **动作泛化也有改善**：在单目标任务上，Octo 从 7% 提升到 22%，$\pi_0$-FAST 从 28% 提升到 34%。说明子任务切分帮助模型学到了更细粒度的技能，能更好地组合应用到新场景。
  - **消融对比**：完整的 TREAD（切分+语言增强）比只做切分（w/o div.）在平均成功率上高出几个点，证明语言多样性增强对提升鲁棒性是切实有效的。

### 2. 🔥 [Dexterous Point Policy (注：摘要未提供完整长标题，以核心方法名代指)] (灵巧点策略：直接从人类视频学习灵巧操作)
- **研究机构**: `摘要未明确提及（推测为头部机器人或人工智能研究机构）`
- **Arxiv ID**: `2606.10614` | [点击跳转](https://arxiv.org/abs/2606.10614)

**0. 论文标题**
- **英文标题**: Dexterous Point Policy (注：摘要未提供完整长标题，以核心方法名代指)
- **中文标题**: 灵巧点策略：直接从人类视频学习灵巧操作
- **研究机构**: 摘要未明确提及（推测为头部机器人或人工智能研究机构）

**1. 整体逻辑**
- **研究任务**: 让多指灵巧手执行复杂操作任务（如抓取放置、使用工具），且完全不需要采集真实的机器人示教数据，仅依靠人类操作视频进行学习。
- **研究动机**: 现有的视觉基础模型直接部署到真实机器人时，存在严重的“具身鸿沟”（人手和机器人手物理结构不同）。常规做法是收集机器人数据进行微调，但多指灵巧手的遥操作数据采集成本极高，录制一个简单动作可能就要耗费数天，导致数据量严重不足。
- **本质改动**: 放弃直接预测机器人关节角或末端位姿，改用“3D关键点”作为统一的中间表示。将人类视频中的动作和机器人的控制指令，都映射到同一套3D关键点空间，从而消除人手和机械手的物理结构差异，实现策略的零样本直接迁移。
- **技术溯源**: 基于自回归 Transformer (Autoregressive Transformer)，结合视频 3D 关键点提取技术（未依赖特定的视觉-语言大模型基座）。

**2. 技术拆解**
- **重点改进**: 提出用“统一的 3D 关键点表示”来桥接人类和机器人的具身差异。核心在于提取并关注“手腕”和“指尖”等对操作最关键的关键点。因为在关键点层面，人手和机械手的运动轨迹和行为是高度对齐的。
- **架构细节**: 
  - **输入**: 从原始人类视频中提取的 3D 关键点序列（包含任务相关物体和人手的关键点）。
  - **模型**: 自回归 Transformer，直接在关键点序列上进行时序建模。
  - **输出**: 预测下一时刻的 3D 关键点坐标，随后将其转换为机器人的实际控制指令。
- **核心 Loss**: 摘要未详细说明，但基于架构可知，主 Loss 为 3D 关键点坐标预测的回归损失（如均方误差 MSE），用于约束模型准确预测手腕和指尖的下一帧 3D 位置。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 真实机器人上的灵巧操作任务（包括抓取放置和工具使用），以及用于测试泛化性的多物体环境和新类别物体场景。训练数据为人类操作视频。
  - **baseline**: 当前最优的 VLA（视觉-语言-动作）基线模型。
- **评价指标**: 真实机器人物理任务的成功率（Success Rate），以及在未见场景下的泛化表现。
- **实验结果**: 成功率大幅提升。Dexterous Point Policy 在真实机器人任务上达到了 75.0% 的成功率，而 SOTA VLA 基线模型仅为 1.0%。此外，该方法在多物体和新物体等未见场景下展现出了很强的泛化能力。

### 3. 🔥 [VeriSpace: Spatially Grounded Action Verification for Vision-Language-Action Models] (VeriSpace：面向视觉-语言-动作模型的空间接地动作验证)
- **研究机构**: `中国科学院自动化研究所 (Institute of Automation, Chinese Academy of Sciences)`
- **Arxiv ID**: `2606.10568` | [点击跳转](https://arxiv.org/abs/2606.10568)

**0. 论文标题**
- **英文标题**: VeriSpace: Spatially Grounded Action Verification for Vision-Language-Action Models
- **中文标题**: VeriSpace：面向视觉-语言-动作模型的空间接地动作验证
- **研究机构**: 中国科学院自动化研究所 (Institute of Automation, Chinese Academy of Sciences)

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型在测试时（test-time）的动作验证与选择。即让VLA先采样多个候选动作，再评估并选出最优动作执行。
- **研究动机**: 现有的VLA模型推理时通常是“一次性”输出动作，微小的空间误差就会导致抓取失败或碰撞。虽然可以引入测试时验证（生成多个动作打分），但现有的验证方法（如Robomonkey等）大多只依赖2D图像打分，缺乏对3D空间几何的精细理解，很难区分那些视觉上相似但执行结果截然不同的候选动作（比如差几毫米导致碰撞或抓空）；同时，现有方法也缺乏对“动作是否让任务向目标推进”的有效评估。
- **本质改动**: 提出了一个具备 3D 感知能力的动作验证器（Verifier）。通过引入显式的 3D 几何信息和基于空间关系的思维链推理，在测试时评估和筛选 VLA 生成的候选动作，作为一个即插即用的模块提升原 VLA 的可靠性。
- **技术溯源**: 验证器基于 LLaVA-7B（VLM基座）和 CLIP（视觉特征提取）构建；兼容 OpenVLA 和 $\pi_0$-FAST 等主流 VLA 策略模型。

**2. 技术拆解**
- **重点改进**: 
  1. 将显式的 3D 几何结构注入到场景的视觉特征编码中。
  2. 设计了基于 3D 空间关系和任务目标进度的结构化推理过程（CoT），替代简单的直接打分。
- **架构细节**: 
  - **输入输出**: 输入为静态视角的 RGB-D 图像（224x224）、任务指令和候选动作（7维：6D位姿+1D夹爪）；输出为该候选动作的质量标量分数。
  - **双路 3D 注入场景编码**: 
    - *路径1（3D几何Token）*: 利用相机内外参将深度图反投影为 3D 坐标，经过正弦位置编码和 MLP 后，投影到 VLM 的 token 空间，得到纯粹的几何特征。
    - *路径2（空间增强视觉Token）*: 用 CLIP 提取 RGB 视觉特征，逐元素加上 3D 几何 embedding。随后通过最远点采样（FPS）选取种子点，并在 3D 空间半径内进行局部特征聚合，得到包含局部 3D 邻域结构的视觉特征。
  - **空间接地动作推理**: 将上述双路 Token、指令 Token 和动作 Token 拼接输入 LLaVA-7B。推理分三步：1) **动作空间推理**：分析操作对象、末端执行器的相对位置、接触和间隙，判断动作的几何有效性；2) **目标进度评估**：推断动作执行前后的场景状态变化，评估该动作是否向任务目标推进；3) **分数估计**：综合上述推理输出最终得分。
- **核心 Loss**: 
  - 总 Loss 由两部分组成：$\mathcal{L} = \lambda_a \mathcal{L}_a + \lambda_{CoT} \mathcal{L}_{CoT}$。
  - **动作评估 Loss ($\mathcal{L}_a$)**: 基于 Bradley-Terry 模型的偏好排序损失（Pairwise ranking loss），通过对比“好动作”和“坏动作”，强制模型给空间有效且能推进任务的动作打高分。
  - **推理 Loss ($\mathcal{L}_{CoT}$)**: 标准的交叉熵损失，用于监督模型生成的 CoT（思维链）序列，确保中间的空间推理和目标进度评估过程准确。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: SimplerEnv-WidowX、LIBERO（仿真环境），以及真实机器人操作任务。
  - **VLA 基线**: OpenVLA, $\pi_0$-FAST。
  - **验证方法基线**: V-GPS, Robomonkey, MG-Select。
- **评价指标**: 任务成功率（Success rate %）。
- **实验结果**: 
  - 在 SimplerEnv-WidowX 仿真中，基于 OpenVLA，VeriSpace 将平均成功率从 37.0% 提升至 55.0%（+18.0%），显著优于此前最好的验证方法 Robomonkey（40.5%）。
  - 基于 $\pi_0$-FAST，平均成功率从 57.0% 提升至 60.5%。
  - 在 LIBERO 仿真和真实机器人实验中均取得了一致的提升。
  - 在分布外（OOD）设置下（如改变物体位置或光照），VeriSpace 依然能带来显著的性能增益，证明了其 3D 空间推理带来的鲁棒性。

### 4. 🔥 [UMI-Bench 1.0: An Open and Reproducible Real-World Benchmark for Tabletop Robotic Manipulation with UMI Data] (UMI-Bench 1.0：基于UMI数据的桌面机器人操作开放且可复现的真实世界基准)
- **研究机构**: `未明确提及（相关联合研究团队，项目主页: umibenchmark.github.io）`
- **Arxiv ID**: `2606.10382` | [点击跳转](https://arxiv.org/abs/2606.10382)

**0. 论文标题**
- **英文标题**: UMI-Bench 1.0: An Open and Reproducible Real-World Benchmark for Tabletop Robotic Manipulation with UMI Data
- **中文标题**: UMI-Bench 1.0：基于UMI数据的桌面机器人操作开放且可复现的真实世界基准
- **研究机构**: 未明确提及（相关联合研究团队，项目主页: umibenchmark.github.io）

**1. 整体逻辑**
- **研究任务**: 评估基于 UMI（Universal Manipulation Interface）数据训练的机器人操作策略在真实物理世界中的表现。
- **研究动机**: 现有的真实世界基准不是专门为 UMI 数据设计的。UMI 数据的特点是腕部视角、动作表示和物理部署紧密耦合。如果各家评测时用的硬件、相机位置或重置流程不一样，测出来的分数差异可能是评测环境导致的，而不是模型能力的差异。目前缺乏一个从“标准化数据采集”到“标准化真实世界评测”的完整闭环。
- **本质改动**: 提出了 UMI-Bench 1.0，建立了一个本地优先（local-first）的真实机器人评测基准。统一了从 UMI 数据采集、场景重置、策略执行到结果记录的全流程协议，并设计了 10 个桌面操作任务和基于双因子的泛化评测体系。
- **技术溯源**: 评测了当前主流的 VLA/操作策略基座，包括 $\pi_0$、$\pi_{0.5}$ 和 DreamZero。

**2. 技术拆解**
- **重点改进**: 
  1. **统一采集与评测协议**：固定了硬件平台、桌面尺寸、腕部相机视角（不用第三人称相机）和重置流程，确保训练和测试分布严格一致。
  2. **双因子泛化设计**：将未见过（Unseen）条件拆分为 Factor A（物体/外观/类别变化）和 Factor B（位置/布局/姿态/动态变化），交叉组合成 4 种评测场景，方便定位模型到底是对物体泛化差，还是对空间位置泛化差。
  3. **细粒度评分机制**：除了看最终是否成功，还引入了基于子目标的进度得分，方便诊断模型具体卡在哪一步。
- **架构细节**: 
  - **输入输出**：输入为腕部视角 RGB 图像（部分方法可选加入本体感受），输出为机器人动作。
  - **模型规模**：本文是基准测试，不涉及新模型。评测的 $\pi_0$、$\pi_{0.5}$ 等为现有开源/闭源基座。
  - **数据与任务规模**：包含 10 个任务（4 个单臂，6 个双臂），每个任务提供 1600-3000 条演示数据（共约 2 万条）。每个任务进行 50 次真实世界 Rollout 评测。
  - **硬件细节**：1.2m x 1.0m 标准桌面，带 5cm 网格亚克力板（仅供人工对齐重置使用，不输入给模型）。
- **核心 Loss**: 本文是 Benchmark 论文，不涉及模型训练和 Loss 设计。核心在于定义了评测指标：完全成功率（FSR）和进度得分（Progress Score，0-100分）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：UMI-Bench 1.0 使用 FastUMI Pro 标准化采集的约 2 万条真实世界演示数据。
  - **Baseline**：$\pi_0$、$\pi_{0.5}$、DreamZero。
- **评价指标**: 
  - **Full Success Rate (FSR)**：完全成功率。
  - **Progress Score**：进度得分（0-100分），根据子目标完成情况给分。
  - **泛化差距（$\Delta_{gen}$）**：Seen 和 Unseen 条件下的得分差值。
- **实验结果**: 
  - **整体表现**：$\pi_{0.5}$ 综合得分最高（Overall Score 55.84），在 10 个任务中 6 个排名第一；$\pi_0$ 次之（48.90），在单臂任务上表现较好；DreamZero 较弱（40.59）。
  - **困难任务**：T3（工具盖章）和 T9（长序列重排）最难，所有方法的 FSR 均为 0%，说明长序列和精密放置仍是短板。
  - **泛化性分析**：位置/布局/动态变化（Factor B）比物体/外观变化（Factor A）导致的性能下降更严重。Seen/Seen 均分为 59.62，当位置/动态改变（Factor-B Unseen）时降至 45.33，双 Unseen 降至 40.19。这表明当前策略在几何或动态条件改变时，仍严重依赖与演示对齐的运动先验，空间泛化能力依然不足。

### 5. 🔥 [HiMem-WAM: Hierarchical Memory-Gated World Action Models for Robotic Manipulation] (HiMem-WAM：用于机器人操作的层次化记忆门控世界动作模型)
- **研究机构**: `香港大学, 力控科技 (INFIFORCE), 华中科技大学, 清华大学`
- **Arxiv ID**: `2606.10363` | [点击跳转](https://arxiv.org/abs/2606.10363)

**0. 论文标题**
- **英文标题**: HiMem-WAM: Hierarchical Memory-Gated World Action Models for Robotic Manipulation
- **中文标题**: HiMem-WAM：用于机器人操作的层次化记忆门控世界动作模型
- **研究机构**: 香港大学, 力控科技 (INFIFORCE), 华中科技大学, 清华大学

**1. 整体逻辑**
- **研究任务**: 长视野（long-horizon）机器人操作任务。
- **研究动机**: 现有的 VLA 模型在部署时（如光照、视角变化）鲁棒性差，且难以在长时间内维持任务记忆；现有的世界动作模型（WAM）虽然动力学先验好，但在长视野任务中缺乏对任务相关记忆的有效管理。现有 WAM 要么推理时生成未来视频太慢，要么没有有效利用层级抽象和跨技能边界的记忆。
- **本质改动**: 提出了一种带层次化记忆门控的世界动作模型。核心改动有两点：一是把动作拆成“底层运动”和“高层技能”两级潜在动作（Latent Actions）；二是加了一个门控记忆模块，只在预测到“技能切换边界”时才把关键状态写入外部记忆。这使得模型无需在测试时生成视频或计算光流，实现了完全因果推理。
- **技术溯源**: 规划器（Planner）基于 Qwen3-VL-4B-Instruct，底层动作提取结合了 DPFlow（光流）和变分自编码器（VAE）思想。

**2. 技术拆解**
- **重点改进**: 
  1. **层次化潜在动作**：底层用多视角光流训练一个分词器提取运动特征；高层通过动态分块和边界预测，把底层动作聚合成高层技能特征，实现时间维度上的抽象。
  2. **门控记忆模块**：设计了读/写门控。写门控只在预测到“技能边界”（即一个子任务结束、下一个开始）时，才把紧凑状态写入外部记忆库；读门控控制从记忆库检索历史上下文。这样既保留了长视野记忆，又避免了记忆库无限膨胀。
- **架构细节**: 
  - **输入输出**：输入为多视角 RGB 图像、本体感觉、语言指令、外部记忆状态；输出为动作块（Action chunk）。
  - **模型结构**：分为 Planner（基于 Qwen3-VL-4B，预测当前高层技能和边界得分）和 Executor（将高层技能展开为底层潜在动作块，再解码为具体控制指令）。
  - **模型规模**：核心 Planner 为 4B 参数级别。
- **核心 Loss**: 训练分三阶段：
  - **Stage 1 (底层分词器)**: 光流重建 L1 Loss + 动作对齐 MSE Loss + KL 散度。
  - **Stage 2 (层次化预训练)**: 技能预测 MSE + 底层潜在动作 MSE + 边界预测 BCE。
  - **Stage 3 (带记忆微调)**: 动作 Loss + 规划/执行/边界 Loss + 门控 Loss（写门控用 BCE 监督，读/写门控加 L1 稀疏正则化以鼓励稀疏读写）。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：LIBERO, LIBERO-PLUS (Zero-shot), RMBench。
  - **真实世界**：10个双臂操作任务（分 Easy/Medium/Hard 难度）。
  - **Baselines**：DP, ACT, π0.5, OpenVLA, X-VLA, MEM-0, AtomVLA, WorldVLA, Fast-WAM 等主流 VLA 和 WAM。
- **评价指标**: 成功率 (Success Rate, SR)。仿真每个任务跑 50 或 100 次 rollout，真实世界每个任务跑 20 次。
- **实验结果**: 
  - **LIBERO**: 平均 97.7%（略超 Fast-WAM 的 97.6%，达到 SOTA 水平）。
  - **LIBERO-PLUS (Zero-shot)**: 平均 76.0%（大幅领先其他方法，证明抗视角/光照等部署扰动的鲁棒性极强）。
  - **RMBench (记忆依赖)**: 平均 26.3%（在 M(1) 记忆复杂度任务上达 31.6%，虽然 M(n) 复杂任务不如 8B 的 Mem-0，但在综合 WAM 中表现很好）。
  - **真实世界**: 在 Hard（长视野双臂）任务上，比 π0.5 平均高出 22.5%（例如关节空间动作 35% vs 15%），Medium 任务提升 12.5%。证明了层次化潜在动作和记忆模块在长视野和抗扰动上的实际收益。

### 6. 🔥 [What Matters in Orchestrating Robot Policies: A Systematic Study of Hierarchical VLA Agents] (编排机器人策略的关键因素：分层VLA智能体的系统性研究)
- **研究机构**: `Google DeepMind`
- **Arxiv ID**: `2606.10267` | [点击跳转](https://arxiv.org/abs/2606.10267)

**0. 论文标题**
- **英文标题**: What Matters in Orchestrating Robot Policies: A Systematic Study of Hierarchical VLA Agents
- **中文标题**: 编排机器人策略的关键因素：分层VLA智能体的系统性研究
- **研究机构**: Google DeepMind

**1. 整体逻辑**
- **研究任务**: 复杂机器人操作任务（特别是长序列和需要推理的任务）中的分层视觉-语言-动作（Hi-VLA）系统设计。
- **研究动机**: 目前业界普遍采用“高层VLM做规划 + 底层VLA做执行”的分层架构，但各家在模型选择、状态切换、观察表示和记忆机制上的拼凑方式各不相同。缺乏系统性研究来证明到底哪些设计组件是真正起作用的，哪些是无效甚至起反作用的。
- **本质改动**: 本文没有提出新的模型架构，而是将现有的Hi-VLA系统抽象为一个统一的控制框架（基于Options框架），并对高层VLM、底层VLA、终止条件、观察表示、记忆机制这5个核心模块进行了详尽的消融和对比实验，总结出一套Hi-VLA系统的“最佳实践”指南。
- **技术溯源**: 高层规划基于 Gemini 2.5 系列（Lite/Flash/Pro），底层控制基于 GROD (Gemini Robotics On-Device) 系列。

**2. 技术拆解**
- **重点改进**: 将Hi-VLA系统拆解为5个独立变量进行控制实验，找出每个变量的最优配置，最后拼装成一个“Best Hierarchy”系统，并验证其有效性。
- **架构细节**: 
  - **高层VLM**：开启“思考（thinking/内部多轮推理）”模式对性能提升巨大，而模型大小（Lite vs Pro）影响不大。结论：小模型+思考模式 ≈ 大模型。
  - **底层VLA**：底层VLA参数量越大越好（指令遵循能力更强）。**关键避坑**：千万不要用特定环境的仿真数据对底层VLA做领域微调（in-domain fine-tuning），这会破坏它的指令遵循能力（steerability），导致高层VLM发出的微调指令它听不懂，长序列任务直接崩盘。
  - **终止条件**：使用“成功检测器（Success Detector）”判断子任务是否完成效果最好，且对中等程度的检测误差具有鲁棒性。如果使用固定时间切换，建议设置为4-8秒。让VLM自己预测执行时间效果最差。
  - **观察表示**：在复杂任务中，VLM容易忽略纯图像输入的細節。给图像加上“边界框（Bounding Box）”描述，或者直接提取仿真器里的“接触状态（特权信息）”转成文本喂给VLM，能显著提升性能。
  - **记忆机制**：单次任务内的历史记忆或总结没啥用，甚至起反作用。但是，把**跨任务（跨episode）的成功/失败经验进行总结**（提取 affordances）喂给VLM，能显著提升性能。
- **核心 Loss**: 本文是系统评估论文，不涉及新的Loss设计。高层VLM使用标准的自回归文本生成Loss，底层VLA使用标准的动作预测Loss（如MSE或交叉熵，取决于具体GROD模型的设定）。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：MuJoCo ALOHA 仿真环境（具备真机迁移性） + 真实 ALOHA 机械臂。任务分为短序列、长序列、推理三类。
  - Baseline：Flat VLA（不分层，直接将任务prompt喂给底层VLA）、Naive Hierarchy（随便拼凑的朴素分层，无记忆/无思考/纯图像/固定时间切换）、Best Hierarchy（本文总结的最优分层）。
- **评价指标**: 任务成功率（%），真实机器人上的成功放置次数。
- **实验结果**: 
  - 在长序列任务上，Best Hierarchy (67.08%) 大幅领先 Naive (40.56%) 和 Flat VLA (25.30%)。
  - 在推理任务上，Best (80.89%) 远超 Naive (66.49%) 和 Flat (50.90%)。
  - 真实机器人测试（把水果放到对应颜色的盘子里），Best 成功 12/15，Naive 9/15，Flat 仅 3/15。
  - 结论：分层架构确实有用，但“怎么分层（编排细节）”决定了性能上限。在长序列和推理任务上，未经调优的朴素分层系统优势会大幅缩水，而采用最佳设计的分层系统能带来实质性的性能飞跃。

### 7. 🔥 [Flow Control: Steering Vision–Language–Action Models with Simple Real-Time Inputs] (流控制：通过简单的实时输入引导视觉-语言-动作模型)
- **研究机构**: `UCLA (加州大学洛杉矶分校)`
- **Arxiv ID**: `2606.10180` | [点击跳转](https://arxiv.org/abs/2606.10180)

**0. 论文标题**
- **英文标题**: Flow Control: Steering Vision–Language–Action Models with Simple Real-Time Inputs
- **中文标题**: 流控制：通过简单的实时输入引导视觉-语言-动作模型
- **研究机构**: UCLA (加州大学洛杉矶分校)

**1. 整体逻辑**
- **研究任务**: 在机器人执行任务时，让人类通过简单的实时输入（如键盘方向键）来引导和纠正 VLA（视觉-语言-动作模型）的动作。
- **研究动机**: 现有的 VLA 自主执行时容易出错（如认错物体、泛化差、容易进入 OOD 状态）。现有的纠正方法（如中途改语言指令、画轨迹草图、给目标图像）要么太粗糙，要么需要高带宽输入，且通常需要额外收集数据来微调模型。我们需要一种不用重新训练、输入简单（低带宽）但控制精确的实时引导方法。
- **本质改动**: 利用 Flow Matching（流匹配）动作生成头的数学特性，在推理时直接把用户的简单控制信号（如键盘映射的关节速度）作为 Flow ODE（常微分方程）的**初始条件（Initial Condition, IC）** 注入进去，从而改变最终生成的动作轨迹。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_{0.5}$ VLA（底层是 PaliGemma 视觉语言模型 + 300M 参数的 Gemma 动作专家，动作生成使用的是 Flow Matching）。

**2. 技术拆解**
- **重点改进**: 核心发现是 Flow Matching 和 Diffusion 在保留初始信息上的本质区别。Diffusion 在反向去噪每一步都会加噪声，会把初始条件的信息“洗掉”；而 Flow Matching 是确定性的 ODE 积分，具有微分同胚性质（双射），能完美保留初始条件的信息。因此，只需修改 Flow ODE 的初始条件，就能精准控制最终动作，不需要像 Diffusion 那样去算复杂的引导梯度。
- **架构细节**: 
  - **输入**：用户的键盘输入（上下左右前后） -> 转为末端笛卡尔速度 -> 通过逆运动学（IK）转为机器人关节速度 $\mathbf{x}_{user}$。
  - **处理**：冻结 $\pi_{0.5}$ 模型。将 Flow Matching ODE 的初始条件 $\mathbf{x}_0$（原本是标准高斯噪声）直接替换或偏移为用户的关节速度 $\mathbf{x}_{user}$（经过归一化）。
  - **输出**：对修改了初始条件的 ODE 进行欧拉积分（10步），输出符合 VLA 专家分布且带有用户意图的动作 chunk。
- **核心 Loss**: 本文是推理时的干预（Inference-time steering），**不需要训练新模型，因此没有新增 Loss**。直接复用原 VLA Flow Matching 头的预训练权重进行零样本推理。

**3. 实验结果**
- **数据集和 baseline**: 实验基于 DROID 数据集（使用在其上微调的 $\pi_{0.5}$-DROID 模型）。Baseline 包括：1) 零样本（zero-shot）的 $\pi_{0.5}$ 纯自主策略；2) 人类使用 VR 头显（Meta Quest 2）的传统遥操作（Teleoperation）。
- **评价指标**: 任务成功率（Success rate）、任务完成时间（Speed）、动作的在策略程度（On-policy，即干预是否破坏了模型原有的合理动作）。
- **实验结果**: 
  1. **引导有效性**：在双块抓取任务中，模型原本 85% 的概率抓错块，通过修改 Flow 初始条件，能以近 100% 的概率引导模型去抓正确的块。
  2. **不破坏原有动作（On-policy）**：在任务目标明确的阶段（如抓取后去放置），即使继续输入干预信号，Flow 头也能将其转化为合理的在策略动作，不会导致机械臂乱动或失败。
  3. **用户研究**：16名用户参与测试。相比于纯自主执行和传统 VR 遥操作，使用键盘进行 Flow Control 引导，**任务成功率显著提高，完成速度也更快**。
  4. **数据反哺**：用 Flow Control 引导生成的轨迹去微调 $\pi_{0.5}$，能进一步提升模型纯自主执行的性能。

### 8. 🔥 [Efficient-WAM: A 1B-Parameter World-Action Model with Low-Cost Future Imagination] (Efficient-WAM：一个具有低成本未来想象能力的10亿参数世界-动作模型)
- **研究机构**: `北京大学、香港大学、木客机器人、中科院自动化所、南京大学`
- **Arxiv ID**: `2606.10040` | [点击跳转](https://arxiv.org/abs/2606.10040)

**0. 论文标题**
- **英文标题**: Efficient-WAM: A 1B-Parameter World-Action Model with Low-Cost Future Imagination
- **中文标题**: Efficient-WAM：一个具有低成本未来想象能力的10亿参数世界-动作模型
- **研究机构**: 北京大学、香港大学、木客机器人、中科院自动化所、南京大学

**1. 整体逻辑**
- **研究任务**: 基于世界-动作模型（World-Action Models, WAMs）的机器人操作控制，即同时预测未来视觉画面和机器人动作。
- **研究动机**: 现有的 WAM 为了生成高保真（photorealistic）的未来视频，导致模型极大、推理极慢，根本没法在真实机器人上实时部署。但实际上，机器人控制不需要看清未来画面的每一个像素，只需要知道物体的几何形状、运动趋势和接触关系。
- **本质改动**: 放弃高保真视频生成，把视频预测分支“做小、做糙”。将未来视频预测降级为提取粗粒度物理线索的引导信号，通过压缩视频模型参数、降低未来视频分辨率、减少视频去噪步数，把推理延迟大幅打下来。
- **技术溯源**: 基于视频生成大模型 WAN-2.2-5B 进行知识蒸馏和结构剪枝；整体架构采用 Mixture-of-Transformers (MoT)；底层生成算法使用 Flow Matching。

**2. 技术拆解**
- **重点改进**: 
  1. **紧凑视频专家（模型压缩）**: 从 5B 的 WAN 模型里通过层切片（layer slicing）和蒸馏，剪出一个不到 1B 的视频专家，只保留物理先验，扔掉渲染高清画面的冗余参数。
  2. **多尺度视频潜变量（降分辨率）**: 当前观测用高分辨率编码，未来预测用低分辨率（如 192x160）编码，大幅减少未来视频的 token 数量。
  3. **非对称去噪（改采样步数）**: 视频分支只采样很少的步数（如 2 步），动作分支采样较多步数（如 10 步）。因为视频前几步就能看出几何结构，没必要花算力去噪出高清纹理。
- **架构细节**: 
  - **输入**: 当前高分辨率图像、低分辨率未来图像、语言指令、机器人状态。
  - **结构**: MoT 架构，包含一个冻结的轻量级视频专家和一个可训练的动作专家。视频 token 和动作 token 在每一层进行交叉注意力交互，动作专家利用视频提供的粗粒度未来上下文来生成动作。
  - **规模**: 总参数量约 1B（其中视频专家约 0.8B）。
- **核心 Loss**: 
  - 主 Loss 是基于条件 Flow Matching 的速度预测 Loss。
  - 辅助任务：在阶段 1 训练视频专家时，加入了教师引导的蒸馏 Loss，强制对齐学生模型和 5B 教师模型的中间隐藏层状态和时序变化，确保物理先验不丢失。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**: RoboTwin 2.0（50个双臂任务）。对比了 VLA 方法（π0, StarVLA-α, π0.5, ABot-M0, LingBot-VLA）和 WAM 方法（UWM, GigaWorld-Policy, Motus）。
  - **真机**: Astribot S1 机器人，4个任务（移液管抓取、试剂瓶转移、乐高分拣、拔笔帽）。对比了 π0.5 和 Motus。
- **评价指标**: 
  - 仿真：干净场景（Clean）和随机干扰场景（Random）下的任务成功率（%）。
  - 真机：任务成功率（%）和 每个 action chunk 的推理延迟（ms）。
- **实验结果**: 
  - **仿真表现**: 1B 参数的 Efficient-WAM 成功率（86.7% clean / 85.7% random）超过了 4B 的 LingBot-VLA 和 5B 的 GigaWorld-Policy，仅比 8B 的 Motus 低 2%。极致优化版 Efficient-WAM-RT 也有 83.1% / 82.0% 的成功率。
  - **真机表现**: Efficient-WAM-RT 平均成功率 66.25%，略高于 Motus (63.75%) 和 π0.5 (53.75%)。
  - **效率提升（核心亮点）**: 在 RTX 4090 上，每个 chunk 延迟仅 98 ms（每步 6.1 ms），比 5B/8B 的 Motus（3215 ms/chunk）快了约 32 倍，真正实现了低延迟的实时闭环控制。
