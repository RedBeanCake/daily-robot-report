            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [BridgeVLA++: A Data-Efficient, Generalizable, and Memory-Augmented Vision-Language-Action Framework for 3D Manipulation] (BridgeVLA++：一种数据高效、可泛化且具备记忆增强功能的3D操作视觉-语言-动作框架)
- **研究机构**: `中国科学院自动化研究所、中国科学院大学、字节跳动Seed等`
- **Arxiv ID**: `2608.05042` | [点击跳转](https://arxiv.org/abs/2608.05042)

**0. 论文标题**
- **英文标题**: BridgeVLA++: A Data-Efficient, Generalizable, and Memory-Augmented Vision-Language-Action Framework for 3D Manipulation
- **中文标题**: BridgeVLA++：一种数据高效、可泛化且具备记忆增强功能的3D操作视觉-语言-动作框架
- **研究机构**: 中国科学院自动化研究所、中国科学院大学、字节跳动Seed等

**1. 整体逻辑**
- **研究任务**: 基于语言指令的3D机械臂操作（包含单臂和双臂场景）。
- **研究动机**: 现有的3D VLA（视觉-语言-动作）模型通常缺乏对历史观察的显式记忆。这导致它们在遇到需要依赖历史上下文（如多步任务进度）或目标被机械臂/物体遮挡的情况时容易失败。作者之前的BridgeVLA解决了数据效率和泛化问题，这次主要是为了补齐“记忆”这块短板。
- **本质改动**: 在原有的“3D点云转2D多视图热力图”框架上，增加了一套统一的时空记忆模块。时间记忆用来记录历史交互上下文（决定“下一步做什么”），空间记忆用来保留早期无遮挡的场景几何信息（决定“具体在哪下爪”）。
- **技术溯源**: VLM基座使用的是 PaliGemma（包含 SigLIP 视觉编码器和 Gemma 骨干网络）。3D点云转2D正交投影以及由粗到细的定位策略借鉴了 RVT/RVT-2。

**2. 技术拆解**
- **重点改进**: 引入时空记忆机制。时间记忆：在粗定位阶段，让当前帧的特征与初始锚点帧、历史关键帧做交叉注意力，获取任务进度上下文。空间记忆：在精细定位阶段，将初始帧（无遮挡）的点云按当前视角和缩放级别重新渲染，让当前特征与这个“无遮挡记忆”做交叉注意力，找回被遮挡的几何细节。
- **架构细节**: 
  - 输入：点云渲染的3个正交视图（顶、前、右）和文本指令。不输入机械臂关节状态等本体感觉信号，以保持和预训练阶段的数据分布一致。
  - 结构：采用由粗到细（Coarse-to-fine）的两阶段策略。粗阶段看全局预测大致3D平移，然后裁剪放大点云；细阶段基于局部放大视图预测精确平移。平移通过多视角2D热力图反投影计算。旋转、夹爪和碰撞标志通过拼接全局和局部特征后过MLP预测。
  - 双臂扩展：共享场景级记忆和VLM主干网络，使用独立的动作头分别控制左右臂。
- **核心 Loss**: 
  - 预训练Loss：2D热力图预测的交叉熵损失。
  - 微调主Loss：包含四部分：平移损失（热力图交叉熵）、旋转损失（6D表示恢复的旋转矩阵与真值的Frobenius范数平方差）、夹爪状态损失（二分类交叉熵）、碰撞避免损失（二分类交叉熵）。

**3. 实验结果**
- **数据集和baseline**: 
  - 仿真数据集：RLBench（通用操作）、COLOSSEUM和GemBench（泛化能力）、RMBench（双臂记忆依赖）、MemoryBench（单臂记忆依赖）。
  - 真机平台：Franka Research 3（通用任务）和 Dobot CR5A（记忆依赖任务）。
  - 对比方法：SpatialVLA、π0.5、ACT、RVT-2、SAM2Act+ 等。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - 在RLBench等通用和泛化仿真榜单上，基础版BridgeVLA达到SOTA，证明了其数据效率和泛化能力。
  - 在RMBench和MemoryBench等记忆依赖榜单上，BridgeVLA++达到SOTA，且没有牺牲基础版在通用任务上的性能。
  - 真机测试中，在通用任务上，BridgeVLA比强baseline平均成功率高出32%；在记忆依赖任务上，BridgeVLA++将平均成功率从基础版的20.0%大幅提升至93.3%。

### 2. 🔥 [DreamWAM: Beyond RGB Future Prediction for World Action Models] (DreamWAM：超越RGB未来预测的世界动作模型)
- **研究机构**: `华中科技大学 (HUST) 等`
- **Arxiv ID**: `2608.04996` | [点击跳转](https://arxiv.org/abs/2608.04996)

**0. 论文标题**
- **英文标题**: DreamWAM: Beyond RGB Future Prediction for World Action Models
- **中文标题**: DreamWAM：超越RGB未来预测的世界动作模型
- **研究机构**: 华中科技大学 (HUST) 等

**1. 整体逻辑**
- **研究任务**: 具身智能中的机器人操作任务，即根据视觉观察和语言指令生成机器人动作（VLA/WAM）。
- **研究动机**: 现有的世界动作模型（WAM）主要靠预测未来的RGB图像来辅助动作生成。但RGB图像里掺杂了太多跟动作无关的干扰信息（如纹理、光照、背景），导致模型一旦遇到光照改变或背景变化，鲁棒性就大幅下降。
- **本质改动**: 把未来预测的目标从单一的RGB像素，扩展为包含外观（RGB）、运动（光流）、几何（深度）和语义（DINO特征）的结构化多视角表示。训练时用这些多维特征做监督，推理时全部砍掉，只保留纯RGB输入。
- **技术溯源**: 基于 Fast-WAM 架构（VideoDiT + ActionDiT），使用了 Wan2.2 视频 VAE，并引入 RAFT（提取光流）、Depth Anything V3（提取深度/几何）、DINOv2（提取语义）作为离线特征提取器。

**2. 技术拆解**
- **重点改进**: 
  1. 联合去噪：把RGB和光流（Motion）的隐变量在通道维度拼接，在同一个流里做联合潜在去噪。
  2. 门控残差注入：深度和语义特征跟视频VAE的隐空间不兼容，直接拼接会破坏预训练先验。因此设计了轻量级的门控残差分支，把几何和语义特征作为残差修正注入到VideoDiT的特定层中。
  3. 训练推理解耦：所有非RGB的分支（光流输入、残差分支、特征预测头）只在训练时开启，推理时完全移除，不增加推理负担。
- **架构细节**: 
  - 输入输出：输入为当前RGB帧和语言指令，输出为动作序列（Action chunk）。训练时额外使用未来帧提取的光流、深度和语义特征作为监督目标。
  - 模型结构：双专家架构。VideoDiT（基于Wan2.2-5B，50亿参数）负责预测未来状态，ActionDiT负责生成动作。两者通过共享注意力机制（Shared attention）交互，让动作生成能直接利用多视角的未来特征。
- **核心 Loss**: 
  总Loss由6部分组成：RGB去噪Loss、光流去噪Loss、动作去噪Loss（这三者均基于Flow Matching），几何特征预测Loss、语义特征预测Loss，以及门控激活的L1正则化Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：仿真环境 LIBERO 和分布外测试集 LIBERO-Plus，以及真实双臂机器人（AgileX PiPER）上的4个桌面操作任务。
  - Baseline：主要对比同架构的 Fast-WAM（无视频展开）和 Fast-WAM-Joint（联合视频-动作去噪），以及 OpenVLA、π0 等主流VLA模型。
- **评价指标**: 任务成功率（Success Rate, %）。重点考察在标准场景以及未见过的视觉扰动（如光照、背景、物体布局变化）下的成功率。
- **实验结果**: 
  - LIBERO标准任务：DreamWAM将无视频展开的成功率从97.30%提升至98.40%，联合推理成功率从98.00%提升至98.90%。
  - LIBERO-Plus（视觉扰动）：无视频展开成功率从51.36%提升至63.44%，联合推理从69.16%提升至75.47%。
  - 真实机器人：标准任务成功率从90.8%提升至96.7%；在未见过的视觉扰动下，成功率从55.6%提升至74.4%，证明多维未来预测能有效提高模型在分布外场景的鲁棒性。

### 3. 🔥 [Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models] (用于视觉-语言-动作模型长视野规划的显式语言记忆)
- **研究机构**: `复旦大学 (Fudan University)`
- **Arxiv ID**: `2608.04765` | [点击跳转](https://arxiv.org/abs/2608.04765)

**0. 论文标题**
- **英文标题**: Explicit Language Memory for Long-Horizon Planning in Vision-Language-Action Models
- **中文标题**: 用于视觉-语言-动作模型长视野规划的显式语言记忆
- **研究机构**: 复旦大学 (Fudan University)

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在长视野（多阶段）机器人任务中的规划与控制。
- **研究动机**: 现有的端到端VLA模型在处理长序列任务时，由于缺乏对历史状态的有效压缩，容易出现“非马尔可夫”问题，导致机器人跳步、重复动作或忽略之前的失败；同时，直接对VLM进行端到端动作微调，容易破坏其原有的高层语义推理能力。
- **本质改动**: 引入显式的“自然语言记忆”模块，把长视野策略解耦成两层：高层VLM用自然语言记录和更新任务进度并下发子任务，低层VLA只负责根据子任务执行具体的连续动作。
- **技术溯源**: 基于 π0.5（低层VLA基座）、PaliGemma（高层VLM基座），并使用 Gemini 3.5 Flash 或 Qwen3.5-9B 自动生成训练所需的记忆监督信号。

**2. 技术拆解**
- **重点改进**: 设计了一个滚动更新的文本记忆机制。高层VLM在每一步读取当前画面和上一步的文本记忆，输出更新后的记忆（用过去时总结已完成步骤，用将来时明确下一步意图）和当前子任务。这种文本记忆替代了直接拼接历史图像帧的做法，既控制了上下文长度，又保证了时间逻辑的连贯。
- **架构细节**: 
  - **高层VLM（PaliGemma）**：输入全局指令、当前图像观测、上一时刻文本记忆；输出更新后的文本记忆和简短的子任务指令。使用LoRA微调。
  - **低层VLA（基于π0.5）**：输入当前图像观测和高层下发的子任务指令；输出长度为30的动作块（action chunk）。其内部的300M参数动作专家网络进行全参数微调。
  - 两个分支独立训练，推理时串联形成闭环。
- **核心 Loss**: 
  - **高层Loss**：标准的自回归语言模型交叉熵损失，用于预测记忆文本和子任务文本。
  - **低层Loss**：基于Flow-matching的L2动作重建损失。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集/环境**：BEHAVIOR-1K仿真（开收音机）、Genie Sim 3.0仿真（包裹分拣）、真实XLeRobot双臂移动平台（抓取放置）。
  - **Baseline**：原生的 π0.5 模型（无显式记忆机制）。
- **评价指标**: 阶段成功率（Stage-wise success rate）。计算任务中每个子阶段成功率的平均值，以此定位具体在哪一步失败，而不是只看最终任务是否完成。
- **实验结果**: 
  - **BEHAVIOR-1K（开收音机）**：平均阶段成功率从 30.0% 提升至 40.0%。主要改善了抓取阶段，有效减少了模型跳过“按按钮”直接去“放置”的跳步错误。
  - **Genie Sim 3.0（包裹分拣）**：单包裹平均成功率从 41.7% 提升至 63.9%；连续分拣从 31.3% 提升至 46.9%。有效避免了跳过扫码直接扔进框里的错误。
  - **真实XLeRobot（抓取放置）**：平均成功率从 62.5% 提升至 66.3%。由于该任务步骤较短，记忆机制带来的提升幅度较小。
  - **定性发现**：语言记忆能解决“该做什么”的语义规划问题，支持简单的上下文内失败恢复（如抓取失败后重新张开夹爪），但无法提升“怎么做”的底层控制精度（如按按钮这种需要精确接触的动作，成功率依然很低）。

### 4. 🔥 [Mind-VLA: Instruction-Aware Spatial Representation Alignment for Vision-Language-Action Models] (Mind-VLA：面向视觉-语言-动作模型的指令感知空间表征对齐)
- **研究机构**: `南京大学、中国科学院自动化研究所、中国科学院大学`
- **Arxiv ID**: `2608.04633` | [点击跳转](https://arxiv.org/abs/2608.04633)

**0. 论文标题**
- **英文标题**: Mind-VLA: Instruction-Aware Spatial Representation Alignment for Vision-Language-Action Models
- **中文标题**: Mind-VLA：面向视觉-语言-动作模型的指令感知空间表征对齐
- **研究机构**: 南京大学、中国科学院自动化研究所、中国科学院大学

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的动作生成，重点解决细粒度操作和目标物体被遮挡时的操作失败问题。
- **研究动机**: 现有的3D感知VLA方法在训练时，对齐的是“整个场景”的3D特征，跟语言指令具体指代哪个物体无关（即指令无关）。这导致模型在遇到干扰物或目标被遮挡时，缺乏对特定目标物体3D结构的理解，容易抓错或抓空。
- **本质改动**: 把训练时的3D特征对齐目标从“全局场景”换成“指令指定的特定物体”。通过引入目标物体的三视图特征作为监督，让模型在训练时专门学习指令对应物体的3D几何结构。
- **技术溯源**: 基于主流的VLA架构（Transformer backbone + Diffusion action head），使用了 CLIP（文本编码）、Stable Diffusion VAE（图像编码）和 VGGT（3D特征提取教师模型）。

**2. 技术拆解**
- **重点改进**: 提出了指令感知空间表征对齐。离线准备指令对应目标物体的三视图（顶、前、侧），在训练时让模型预测这三视图的VAE隐变量，并将模型中间层特征与三视图的VGGT 3D特征进行多层对齐。推理时这些辅助模块全部丢弃，不增加推理开销。
- **架构细节**: 
  - **输入**: 2张RGB图（主视角+腕部）、语言指令、本体状态。
  - **结构**: 345M参数的因果Transformer。引入了三组可学习query：scene query（负责场景RGB重建和2D运动预测）、object query（负责预测目标物体三视图隐变量）、action query（输入给Diffusion头预测未来动作序列）。
- **核心 Loss**: 
  - **主 Loss**: 动作预测的扩散Loss。
  - **辅助 Loss**: 场景RGB重建和2D轨迹预测Loss；目标物体三视图VAE隐变量的MSE预测Loss；模型中间4层特征与目标物体三视图VGGT特征的余弦距离对齐Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO（仿真）、CALVIN ABC-D（仿真长程任务）、真实机器人平台（xArm 6，包含正常和25%物理遮挡条件）。
  - **Baseline**: 小参数量模型（DreamVLA, Octo, Diffusion Policy等）和7B级别大模型（OpenVLA, $\pi_0$, GLaD, SpatialVLA, Seer等）。
- **评价指标**: LIBERO使用任务成功率（%），CALVIN使用平均完成任务链长度，真机实验使用成功率（%）。
- **实验结果**: 
  - **LIBERO**: 345M参数的Mind-VLA达到93.9%平均成功率，打平7B级别的 $\pi_0$ (94.2%) 和 GLaD (94.1%)，比同量级的DreamVLA高1.3%。
  - **CALVIN**: 平均完成长度达到4.47，高于 $\pi_0$ (3.92) 和 Seer (4.28)。
  - **真机遮挡实验**: 在目标被遮挡25%的情况下，Mind-VLA成功率仅下降13%（保持在54%），而场景级对齐的消融版本下降29%，OpenVLA下降21%。在真机对比中，比表现最好的指令无关方法（Seer）高出32个百分点。

### 5. 🔥 [GUARD: Test-Time Failure Detection for Diffusion-Based Vision-Language-Action Policies (注：原文未提供完整标题，此为根据摘要核心内容提炼)] (GUARD：基于扩散模型的视觉-语言-动作策略的推理时故障检测方法)
- **研究机构**: `摘要未明确提供（涉及 Pi0 等模型，推测包含 Physical Intelligence 等具身智能研究机构）`
- **Arxiv ID**: `2608.04510` | [点击跳转](https://arxiv.org/abs/2608.04510)

**0. 论文标题**
- **英文标题**: GUARD: Test-Time Failure Detection for Diffusion-Based Vision-Language-Action Policies (注：原文未提供完整标题，此为根据摘要核心内容提炼)
- **中文标题**: GUARD：基于扩散模型的视觉-语言-动作策略的推理时故障检测方法
- **研究机构**: 摘要未明确提供（涉及 Pi0 等模型，推测包含 Physical Intelligence 等具身智能研究机构）

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）策略在推理阶段的故障检测（Failure Detection），即判断模型当前生成的动作是否靠谱、是否会失败。
- **研究动机**: 基于扩散模型的 VLA 策略存在“幻觉”问题。即使在视觉和语言证据支撑不足（grounding 弱）的情况下，它们依然能生成看似合理的动作，导致实际执行失败。
- **本质改动**: 提出一种无需修改或微调预训练 VLA 模型的推理时检测方法（GUARD）。通过扰动 VLM 的 KV Cache 并观察动作去噪响应的变化，来评估动作生成对多模态输入的真实依赖程度。
- **技术溯源**: 基于现有的扩散 VLA 策略基座，包括 Pi0、SmolVLA 和 Alpamayo-1.5。

**2. 技术拆解**
- **重点改进**: 引入反事实推理（Counterfactual）机制来探测动作头（Action Head）对多模态证据的依赖。不改动原 VLA 模型参数，仅在推理时进行诊断。
- **架构细节**: 
  - **输入**: VLA 模型最终的视觉-语言 KV Cache。
  - **处理机制**: 估计 KV Cache 中各个 token 索引条目的影响力，通过消融（ablate）显著的 KV 条目来构建“反事实 Cache”。然后对比原始条件和反事实条件下的动作去噪响应。
  - **特征提取**: 基于上述对比，提取出 4 个诊断指标：敏感度（sensitivity）、注意力熵（attention entropy）、模态偏差（modality bias）和 grounding 效率（grounding efficiency）。
  - **分类输出**: 将这些指标在线校准后，输入到一个轻量级的时间分类器（temporal classifier）中，输出故障预测结果。
- **核心 Loss**: 预训练的 VLA 模型本身无 Loss 更新（冻结参数）。仅针对后接的轻量级时间分类器使用常规的交叉熵损失（Cross-Entropy）进行二分类（成功/失败）训练。

**3. 实验结果**
- **数据集和baseline**: 
  - **环境/数据集**: LIBERO, SimplerEnv, MetaWorld, PhysicalAI-AV。
  - **策略模型**: Pi0, SmolVLA, Alpamayo-1.5。
  - **Baseline**: 现有的其他运行时监控/故障检测方法（runtime monitors）。实验在已见任务（seen-task）和未见任务（task-held-out/unseen-task）设置下进行对比。
- **评价指标**: ROC-AUC（用于衡量故障检测的准确性和鲁棒性）。
- **实验结果**: 
  - 在 5 个未见任务设置中，GUARD 在 4 个设置下取得最佳 ROC-AUC，1 个设置下排名第二。
  - 在未见任务上，平均 ROC-AUC 比最强的 baseline 高出 5.73 个百分点，证明了其跨任务、跨具身形态的泛化能力。
  - 在已见任务上，与最佳 baseline 的平均表现差距不到 0.19 个百分点，说明在提升泛化性的同时没有牺牲已知任务上的检测性能。

### 6. 🔥 [SiMDex: Mining Similar Egocentric Videos for Cross-Embodiment Dexterous Manipulation] (SiMDex：挖掘相似的第一人称视频用于跨具身灵巧操作)
- **研究机构**: `东京大学、字节跳动 Seed、香港大学、上海交通大学、清华大学`
- **Arxiv ID**: `2608.04196` | [点击跳转](https://arxiv.org/abs/2608.04196)

**0. 论文标题**
- **英文标题**: SiMDex: Mining Similar Egocentric Videos for Cross-Embodiment Dexterous Manipulation
- **中文标题**: SiMDex：挖掘相似的第一人称视频用于跨具身灵巧操作
- **研究机构**: 东京大学、字节跳动 Seed、香港大学、上海交通大学、清华大学

**1. 整体逻辑**
- **研究任务**: 利用人类第一人称视频数据，提升机器人（特别是灵巧手）VLA（视觉-语言-动作）模型在复杂操作任务中的后训练效果。
- **研究动机**: 现有的人类第一人称视频数据池非常庞大且内容杂乱（包含做饭、社交等），直接随机混合训练会引入大量噪声，稀释任务相关的监督信号。如何从千万级的人类视频中高效筛选出对特定机器人灵巧操作真正有用的数据，是当前的一大瓶颈。
- **本质改动**: 把人类数据的选择问题转化为一个检索/推荐问题。不修改 VLA 模型架构，而是设计了一个三阶段的检索流水线（召回-排序-重排），从 3200 万条人类视频样本中，基于与少量机器人示教的动作和语义相似度，精准挖掘出约 149 万条（不到 5%）高度相关的人类数据用于训练。
- **技术溯源**: 基于类似 $\pi_0$ 的 flow-matching VLA 架构（具体使用的是 GR-Dexter），人类视频数据基于 EgoDex 数据集。

**2. 技术拆解**
- **重点改进**: 提出了一种与手型/形态无关的统一动作表示方法，并设计了三阶段检索管道来挖掘数据，实现了“只换数据、不改模型”。
- **架构细节**: 
  - **统一动作表示**：将人和机器人的动作映射到 42 维的共享空间，包含左右手腕的 6D 相对变化（平移+旋转），以及左右手各 5 个指尖相对手腕的 3D 坐标。
  - **三阶段检索管道**：
    1. **召回 (Recall)**：基于初始指尖姿态（L2 距离）和语言指令（句子嵌入余弦相似度）进行粗筛。
    2. **排序 (Ranking)**：基于细粒度动作相似度（手腕平移/旋转波形、手指/手腕未来 30 步轨迹）进行精排，并去重。
    3. **重排 (Re-ranking)**：基于视频光流（optical flow）进行与形态无关的像素级运动模式校验，剔除动作数值相似但实际视觉运动不符的样本。
  - **模型结构**：输入图像和文本指令，输出未来 30 步的 88 维动作（42 维共享动作 + 46 维机器人专属关节动作）。
- **核心 Loss**: 采用 Flow-matching 的 Masked MSE Loss。人类数据只在 42 维共享动作空间计算 Loss（通过 mask 屏蔽掉 46 维机器人专属关节），机器人数据在全部 88 维计算 Loss。这使得两种数据可以在同一个模型里联合训练，无需改动网络结构。

**3. 实验结果**
- **数据集和baseline**: 
  - **机器人数据**：约 12.4 小时的双手遥操作示教。
  - **人类数据池**：EgoDex 数据集的约 3200 万帧视频。
  - **Baseline**：GR-Dexter 模型，使用随机采样的等量人类数据（约 149 万帧）。
  - **评估任务**：使用电钻组装 (Drill)、拨动轮子 (Flick Wheel)、抓取放置 4 个异形物体 (Pick & Place)。
- **评价指标**: 各子任务的进度得分（0-1 或 0-3 等），总得分，以及整体成功率（Success Rate）。
- **实验结果**: 
  - **整体提升**：整体成功率从 47.7% 提升到 61.1%（+13.4%），仅使用了不到 5% 的人类数据池。
  - **具体任务**：拨轮子任务成功率几乎翻倍（24.5% -> 45.5%），抓取放置任务大幅提升（54.0% -> 83.4%）。电钻任务在机器人数据充足时略降，但在数据稀缺时提升明显。
  - **数据缩放**：在机器人数据极少（如 0.5 倍，约 6 小时）时，SiMDex 能维持约 57%-58% 的成功率，而 baseline 掉到 40.9%。这意味着使用 SiMDex 可以用 1/4 的机器人数据采集量达到 baseline 全量数据的效果。

### 7. 🔥 [Overcoming Statistical Bias in Action-Controllable World Models] (克服动作可控世界模型中的统计偏差)
- **研究机构**: `原文未明确标注（根据作者署名格式推测为国内高校或科研机构）`
- **Arxiv ID**: `2608.04653` | [点击跳转](https://arxiv.org/abs/2608.04653)

**0. 论文标题**
- **英文标题**: Overcoming Statistical Bias in Action-Controllable World Models
- **中文标题**: 克服动作可控世界模型中的统计偏差
- **研究机构**: 原文未明确标注（根据作者署名格式推测为国内高校或科研机构）

**1. 整体逻辑**
- **研究任务**: 动作条件世界模型（Action-conditioned world models），即根据智能体输入的动作序列，预测视觉环境（视频）未来的演变。
- **研究动机**: 现有的世界模型存在“统计偏差”问题。模型在训练时倾向于走捷径，利用画面的视觉惯性或数据集中常见的运动模式来预测未来，而不是真正根据输入的动作来生成。这导致两个问题：一是输入不同的动作可能生成相似的未来画面；二是输入零动作（不动）时，画面依然会发生漂移。以往的方法只是简单地加强动作特征的注入，但缺乏反事实（counterfactual）的监督，无法从根本上消除这种统计捷径。
- **本质改动**: 引入反事实一致性（Counterfactual Consistency）框架。通过在时间维度（多步反事实）和空间维度（动作-空间反事实）增加约束，强制模型学习动作与状态变化之间的真实因果关系，从而减少对统计捷径的依赖。
- **技术溯源**: 基于自回归视频Token模型（如 iVideoGPT），使用 Transformer 架构对离散化后的视频 Token 进行自回归预测。

**2. 技术拆解**
- **重点改进**: 提出了 CoCo 框架，包含两个核心模块：MSC2（多步反事实一致性）和 ASC2（动作-空间反事实一致性）。此外，还提出了两个专门评估动作可控性的新指标：ARC（动作响应一致性）和 DE（漂移能量），并构建了一个用于反事实评估的数据集 Mini-SSMB。
- **架构细节**: 
  - **基础架构**: 将输入帧通过 Tokenizer 编码为离散 Token，结合动作序列输入到共享参数的自回归 Transformer 中，预测未来的视频 Token，再解码回像素空间。
  - **MSC2（时间维度）**: 包含三个分支。1) 原始动作分支：正常前向预测；2) 反向动作分支：将动作取反进行回退预测，要求画面恢复到初始状态；3) 零动作分支：输入零动作，要求画面保持静止。
  - **ASC2（空间维度）**: 利用空间等价性。将输入画面水平翻转，同时将动作进行对应的空间变换（如左右动作互换），要求模型输出的连续隐层特征与原始画面输出的隐层特征在翻转后保持一致。
- **核心 Loss**: 
  - **基础 Loss**: 自回归的交叉熵 Loss（用于 Token 重建）。
  - **MSC2 Loss**: 由三部分组成。前向预测 Loss（对齐真实动态）、循环 Loss（反向动作回退到初始状态的 MAE 损失）、零动作 Loss（输入零动作时状态漂移的 MAE 损失）。
  - **ASC2 Loss**: 在基础交叉熵 Loss 之外，增加镜像等价 Loss，即原始分支和翻转分支在连续隐层表示上的 SmoothL1 损失。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自建的离散动作数据集 Mini-SSMB（基于 MiniGrid），连续动作视频预测数据集 BAIR 和 RoboNet，视觉规划数据集 VP2（包含 robosuite 和 RoboDesk），以及强化学习数据集 MetaWorld。
  - **Baseline**: CA, MR, FitVid, MaskViT, iVideoGPT, SAMPO 等动作条件视频预测或世界模型方法。
- **评价指标**: 
  - **传统视觉指标**: FVD, LPIPS, PSNR, SSIM（评估画面生成质量）。
  - **新增可控性指标**: ARC（Action Response Consistency，动作响应一致性，越高越好）和 DE（Drift Energy，漂移能量，评估零动作下的画面稳定性，越低越好）。
  - **下游任务指标**: 视觉规划和基于模型的强化学习（MBRL）的任务成功率。
- **实验结果**: 
  - **可控性提升**: 在 Mini-SSMB 上，完整模型的 ARC_inv 达到 0.412，ARC_ref 达到 0.483，DE 相比基线降低了 17.07%。在 BAIR 数据集上，DE 从基线 iVideoGPT 的 0.176 大幅降至 0.018，有效抑制了画面漂移。
  - **视觉质量保持**: 在 BAIR 和 RoboNet 上，FVD、LPIPS 等传统视觉指标与 SOTA 模型持平或更优，证明增加反事实约束没有牺牲视频预测的画质。
  - **下游任务收益**: 在 VP2 视觉规划任务中，达到了 SOTA 模型中最高的平均成功率 73.1%。在 MetaWorld 的 6 个 MBRL 操纵任务中，也展现了更高的任务成功率和样本效率。

### 8. 🔥 [$\omega$-0: A Latent Predictive World Action Model for Concurrent Humanoid Loco-Manipulation] ($\omega$-0：用于人形机器人并发移动操作的隐预测世界动作模型)
- **研究机构**: `南洋理工大学 (NTU), 北京大学 (PKU), 智源人工智能研究院 (BAAI), 香港科技大学(广州)`
- **Arxiv ID**: `2608.06375` | [点击跳转](https://arxiv.org/abs/2608.06375)

**0. 论文标题**
- **英文标题**: $\omega$-0: A Latent Predictive World Action Model for Concurrent Humanoid Loco-Manipulation
- **中文标题**: $\omega$-0：用于人形机器人并发移动操作的隐预测世界动作模型
- **研究机构**: 南洋理工大学 (NTU), 北京大学 (PKU), 智源人工智能研究院 (BAAI), 香港科技大学(广州)

**1. 整体逻辑**
- **研究任务**: 人形机器人的并发移动操作（Concurrent Loco-Manipulation），即机器人在移动底盘、调整躯干姿态和保持平衡的同时，进行手部物体操作（例如边走边擦桌子、拖地、把衣服放进洗衣机）。
- **研究动机**: 现有策略通常把移动和操作解耦，导致动作不连贯；而最近的世界动作模型（WAM）多以“生成未来视频”为核心，但在真实场景中视频生成容易受遮挡和视角变化干扰，且像素级视频保真度高不代表控制效果好，实时控制其实只需要紧凑的未来趋势信息。
- **本质改动**: 放弃像素级的未来视频生成，改为在隐空间预测紧凑的未来视觉特征（Latent Predictive），并将其作为辅助监督信号，与基于扩散模型的全身动作生成结合，直接输出底层控制器可执行的动作隐变量。
- **技术溯源**: 基于 Qwen3-VL-2B（VLM基座）、V-JEPA（视觉编码器）、T5（文本编码器）、Wan（视频特征提取）、FAST（动作离散化）、DiT（扩散模型）以及 SONIC（底层全身控制器）。

**2. 技术拆解**
- **重点改进**: 将世界模型的预测目标从“视频像素”改为“视觉隐变量”。设计了双查询注意力机制（Dual-query attention），让动作查询（Motion queries）去 attend 视频查询（Video queries），把预测的未来视觉动态直接融合到动作特征中，指导动作生成。
- **架构细节**: 
  - **输入**：语言指令、多视角视觉观测（第一人称RGB、第三人称RGB/Depth）、机器人本体状态（关节位置、手部关节、躯干6D旋转）。
  - **模型结构**：分三阶段训练。Stage 1 用 FAST tokenizer 把连续动作离散化，微调 Qwen3-VL-2B 自回归预测动作 token，提取动作感知特征；Stage 2 用人类视频数据在仿真中重放（通过SONIC），预训练隐变量预测和动作生成；Stage 3 在真实机器人数据上微调。核心预测器使用特定的 RoPE 编码（2D给视觉token，3D给视频query，1D给动作query），最后由 Action DiT 接收融合条件，去噪生成 SONIC 兼容的全身动作隐变量。
- **核心 Loss**: 
  - **主 Loss**：Action DiT 的扩散去噪 Loss（用于生成动作隐变量）。
  - **辅助 Loss**：未来视觉隐变量预测 Loss（L2 Loss，计算预测的视频 query 与 Wan 编码器提取的真实未来视觉特征之间的误差）；Stage 1 的 VLM 下一个 token 预测 Loss（交叉熵）和 FAST 动作重建 Loss（L1）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建 $\omega$-HOME 数据集（40+小时真实家庭人形机器人数据，包含多视角RGB-D、SMPL动作、本体状态和动作隐变量）。
  - **Baseline**：ACT, Diffusion Policy (DP), $\pi$-0.5, InternVLA-M1, EgoVLA, GR00T-N1.7, $\psi$-0, Fast-WAM, DiT4DiT 等主流模仿学习、VLA和WAM方法。
- **评价指标**: 成功率（Success Rate）、得分（Score）、任务进度（Task Progress）。
- **实验结果**: 在11个真实世界家庭任务（如桌面操作、清洁、衣物处理等）中，单一的 $\omega$-0 模型无需训练任务特定策略，即可实现平滑的“边移动边操作”。在各项指标上全面超越所有 baseline，并在未见物体、未见场景以及人类数据迁移的泛化测试中表现出明显的优势。

### 9. 🔥 [DyPES-VLA: Learning Shared Dynamics Priors and Embodiment-Specific Control for Cross-Embodiment Manipulation] (DyPES-VLA：学习共享动力学先验与特定具身控制以实现跨具身操作)
- **研究机构**: `香港科技大学（广州）、COCO Matrix（上海）`
- **Arxiv ID**: `2608.06374` | [点击跳转](https://arxiv.org/abs/2608.06374)

**0. 论文标题**
- **英文标题**: DyPES-VLA: Learning Shared Dynamics Priors and Embodiment-Specific Control for Cross-Embodiment Manipulation
- **中文标题**: DyPES-VLA：学习共享动力学先验与特定具身控制以实现跨具身操作
- **研究机构**: 香港科技大学（广州）、COCO Matrix（上海）

**1. 整体逻辑**
- **研究任务**: 跨具身机器人操作（用一个通用策略模型控制单臂、双臂、人形等不同物理形态的机器人）。
- **研究动机**: 现有的跨具身VLA有两个痛点：一是只靠动作标签做监督，浪费了海量无动作视频里物体运动和接触的物理规律（动力学先验）；二是强行把不同机器人的动作手动对齐到一个通用格式，这不仅扩展性差，还把不同机器人共性的交互规律和各自特有的运动学约束混在了一起。
- **本质改动**: 把“学物理规律”和“输出具体动作”解耦。用预测未来画面的任务来逼模型学习通用的动力学先验，然后用一个带混合专家（MoE）的动作头，直接在不同机器人的原生动作空间里输出控制，不再做手动的动作空间对齐。
- **技术溯源**: 视觉语言基座用的是 Qwen3-VL-2B，未来帧生成头基于 SANA-600M，动作生成头基于 Diffusion Transformer (DiT)。

**2. 技术拆解**
- **重点改进**: 
  1. 引入未来帧预测任务：在VLM后接一个图像生成头，通过预测未来帧，强迫中间的共享Query Tokens记住物体怎么动、怎么接触等物理规律。
  2. 特定具身的MoE动作头：动作头用DiT，注意力层（Attention）所有机器人共享，用来学通用的时间动作结构；前馈网络（FFN）和输入输出编解码器做成特定具身的专家（Experts），根据机器人类型静态路由，直接处理各自的运动学约束。
- **架构细节**: 
  - 输入：图像、语言指令、文本化的具身元数据（如机器人类型、控制频率），以及96个可学习的Query Tokens。不使用本体感知（proprioception）输入。
  - 模型结构：VLM提取特征后，Query Tokens的隐藏状态同时送给两个头。一个是SANA生成头（预测未来帧），另一个是16层的DiT动作头（包含3个专家，对应3种具身形态）。
  - 推理阶段：只跑VLM和动作头，未来生成头被丢掉。动作头通过4步Euler积分输出动作chunk。
- **核心 Loss**: 
  - 两阶段训练。
  - 第一阶段（无动作视频）：只算未来预测Loss（$\mathcal{L}_{\text{future}}$），用Rectified Flow目标让模型生成未来帧。
  - 第二阶段（带动作数据）：主Loss是动作Loss（$\mathcal{L}_{\text{action}}$），同样基于Rectified Flow在原生动作空间回归速度；辅助Loss是未来预测Loss（权重0.05），用来正则化共享特征。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：仿真用了LIBERO（单臂）、RoboCasa-GR1（人形）、RoboTwin 2.0（双臂），外加EgoDex等无动作视频。真机用了FR3（单臂）、COBOT Magic（双臂）和Unitree G1（人形）。
  - Baseline：对比了针对单一benchmark微调的专家模型（如OpenVLA, $\pi_0$, $\pi_{0.5}$, X-VLA等）和单checkpoint通用模型（如Qwen-VLA）。
- **评价指标**: 任务成功率（Success Rate, %）。
- **实验结果**: 
  - 仿真（单checkpoint直接测）：在LIBERO达到98.0%，RoboCasa-GR1达到59.25%，RoboTwin 2.0达到89.02%。不仅比Qwen-VLA等通用模型好，也超过了绝大多数针对单一场景微调的专家模型。
  - 真机（联合微调后）：在3种物理形态的机器人上测3个任务，平均成功率75.6%，大幅领先ACT（32.4%）和GR00T-N1.6（59.6%）。证明了学到的动力学先验能很好地迁移到真机控制中。

### 10. 🔥 [GeniWorld: A Generalizable Interactive World Model for Robotic Manipulation via Visual Actions] (GeniWorld：基于视觉动作的机器人操作可泛化交互式世界模型)
- **研究机构**: `清华大学深圳国际研究生院、腾讯Robotics X、香港科技大学、深圳技术大学`
- **Arxiv ID**: `2608.06332` | [点击跳转](https://arxiv.org/abs/2608.06332)

**0. 论文标题**
- **英文标题**: GeniWorld: A Generalizable Interactive World Model for Robotic Manipulation via Visual Actions
- **中文标题**: GeniWorld：基于视觉动作的机器人操作可泛化交互式世界模型
- **研究机构**: 清华大学深圳国际研究生院、腾讯Robotics X、香港科技大学、深圳技术大学

**1. 整体逻辑**
- **研究任务**: 机器人操作的动作条件世界模型，即根据当前图像和给定的动作序列，预测未来的视频观测。
- **研究动机**: 现有方法直接把低维数值动作（如关节角、末端位姿）喂给视频生成模型。这存在两个问题：一是数值缺乏 explicit 的空间位置信息，模型难以精准控制复杂运动；二是模型容易把机器人自身的运动和环境的变化耦合在一起学，导致换个没见过的背景或物体（OOD场景）就生成失败。
- **本质改动**: 把数值动作转换成“视觉动作”。利用机器人的 URDF 模型，把动作序列渲染成只有机器人本体的运动画面（去掉背景和物体），用这个视觉画面作为条件去引导视频生成，从而把机器人运动和环境动力学解耦。
- **技术溯源**: 基于预训练的视频扩散模型（Video Diffusion），使用因果 3D VAE 和因果 DiT（Causal DiT），训练目标基于 Flow Matching。

**2. 技术拆解**
- **重点改进**: 动作条件的输入方式。放弃用 AdaLN 或 Cross-Attention 注入低维数值向量，改为通过正运动学把动作渲染成与相机视角对齐的机器人密集运动视频，用视觉特征提供精确的空间引导。
- **架构细节**: 视觉动作通过因果 3D VAE 编码成动作 Latent，与视频 Latent 在通道维度直接拼接（Channel-wise concatenation），保证空间严格对齐。模型使用带因果注意力掩码（Causal Attention）的 DiT 进行自回归预测。推理时用 KV Cache 缓存历史帧，支持高频闭环交互。
- **核心 Loss**: 主 Loss 是 Flow Matching 的均方误差，用于预测下一帧观测 Latent 的速度场（Velocity Field）。只对观测 Latent 加噪，视觉动作 Latent 作为干净的条件输入，不参与加噪。

**3. 实验结果**
- **数据集和baseline**: 仿真使用 RoboTwin 2.0（包含同分布 Clean-to-Clean 和 OOD 场景 Clean-to-Random），真机使用双臂 Xtrainer 平台（4个操作任务）。对比了 Ctrl-World、IRASim、EnerVerse-AC 等方法。
- **评价指标**: 视频生成质量（FID, FVD, LPIPS, PSNR 等），推理速度，真机策略评估的虚实相关性，以及下游策略（基于 π0 VLA）的真机成功率。
- **实验结果**: 
  1. **生成与泛化**：在 OOD 场景下，FID 降至 13.08（基线在 40-174 之间），FVD 降至 20.15（基线在 53-191 之间），在未见场景中能保持准确的物理交互且不产生视觉伪影。
  2. **推理效率**：得益于视觉动作提供的强运动先验，Flow Matching 的采样步数从 50 步降到 5 步时，FVD 仅下降约 2%，实现约 10 倍推理加速（数值动作基线在此条件下 FVD 下降 22%）。
  3. **下游应用**：作为策略评估器，其预测成功率与真机高度正相关；利用其合成多样化数据微调 π0 策略，在真机 OOD 场景（如空间重排、新物体、视觉干扰）下，显著提升了操作成功率。

### 11. 🔥 [Visual Grounding in Zero-Shot Vision–Language Control] (零样本视觉-语言控制中的视觉接地研究)
- **研究机构**: `多机构合作（具体机构名称未在节选文本中列出）`
- **Arxiv ID**: `2608.06154` | [点击跳转](https://arxiv.org/abs/2608.06154)

**0. 论文标题**
- **英文标题**: Visual Grounding in Zero-Shot Vision–Language Control
- **中文标题**: 零样本视觉-语言控制中的视觉接地研究
- **研究机构**: 多机构合作（具体机构名称未在节选文本中列出）

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言模型（VLM）在零样本控制任务中，其动作决策是否真正依赖于视觉输入（即视觉接地），而不是在“盲猜”或依赖保守先验。
- **研究动机**: 发现VLM在仿真环境中得分高，往往是因为仿真器动力学特性或模型采取了“一直减速”等保守策略，模型本身并没有真正理解图像。这会导致对模型实际感知能力的严重误判。
- **本质改动**: 提出了一套“输入消融测试集”，通过输入空白图、噪声图、镜像图等严格检验模型是否真在看图；并提出“对称性共识守护者”机制，在推理阶段修复VLM的纵向危险识别缺陷。
- **技术溯源**: 基于多款开源和闭源VLM，包括边缘端模型（SmolVLM, Qwen2-VL, LLaVA-1.5）和云端大模型（Qwen2.5-VL-72B, MiniCPM-V, Cosmos3, Kimi等）。

**2. 技术拆解**
- **重点改进**: 
  1. 设计输入消融测试集：包含8种图像条件（真实图、重复图、空白图、噪声图、打乱图、跨场景图、纯文本、镜像翻转图），用以剥离和验证模型对视觉的真实依赖。
  2. 提出对称性共识纵向守护者：利用原图和镜像翻转图的预测结果进行投票（2-of-4机制），提高纵向危险判断的鲁棒性。
- **架构细节**: 
  - 测试了两种具身形态：四旋翼无人机（gym-pybullet-drones）和地面车辆（highway-env）。
  - 评估了9个直接输出动作的模型、6个输出结构化动作的本地VLM，以及一个VLM-MPC分层架构（VLM输出高层意图，MPC执行底层控制）。
  - VLM接收带有图例和比例尺的俯视图，输出离散动作（如stop, slow, left, right, straight）。
- **核心 Loss**: 本文为评估与诊断工作，不涉及模型训练，无训练Loss。主要使用统计检验（如Cramér's V、卡方检验）和动作一致性指标（如图像依赖指数IDI、镜像翻转交换率）进行评估。

**3. 实验结果**
- **数据集和baseline**: 
  - 环境：highway-env（自动驾驶）和 gym-pybullet-drones（无人机），包含轻/密交通、合流、车道 blocked 等场景。
  - Baseline：常数策略（如一直减速、一直向左）、均匀随机策略、基于真实状态的脚本几何控制器。
- **评价指标**: 
  - 闭环指标：行驶距离、奖励、速度、碰撞率。
  - 接地指标：图像依赖指数（IDI）、动作与输入的条件相关性（Cramér's V）、镜像翻转方向交换率、动作与前方车距的互信息。
- **实验结果**: 
  - **伪象揭秘**：“一直减速”的常数策略比脚本控制器碰撞率低12倍。很多VLM看似表现好，实际是退化成了保守的常数策略，根本没看图（边缘模型几乎完全不看图）。
  - **模型表现**：6个本地VLM无一满足纵向和横向联合接地标准。云端大模型中，Qwen2.5-VL-72B和Cosmos3具备纵向（距离）接地能力，但横向（左右）完全失效（图像镜像翻转后，不会交换左右动作）。
  - **修复效果**：使用“对称性共识守护者”（双模型+原图/镜像图投票），在272帧测试集上纵向危险识别的平衡准确率达到0.954（选择性覆盖下达0.973），证明VLM可作为受限的纵向危险辅助模块。
  - **分层失效**：底层的MPC无法弥补高层VLM视觉语义的缺失，VLM的错误意图会导致MPC成功率从23/25骤降至8/25。

### 12. 🔥 [Adaptive-WAM: Quality-Guided Early-Exit Planning from Intermediate Video-Diffusion Features] (自适应WAM：基于中间视频扩散特征的质量引导早退规划)
- **研究机构**: `康奈尔大学 (Cornell University)`
- **Arxiv ID**: `2608.06008` | [点击跳转](https://arxiv.org/abs/2608.06008)

**0. 论文标题**
- **英文标题**: Adaptive-WAM: Quality-Guided Early-Exit Planning from Intermediate Video-Diffusion Features
- **中文标题**: 自适应WAM：基于中间视频扩散特征的质量引导早退规划
- **研究机构**: 康奈尔大学 (Cornell University)

**1. 整体逻辑**
- **研究任务**: 自动驾驶中的端到端轨迹规划（仅依赖前视摄像头输入）。
- **研究动机**: 现有的世界-动作模型（WAM）依赖大型视频扩散模型生成未来视频再做规划，部署时计算开销极大（生成视频需十几秒）。作者通过实验发现，规划任务对视频去噪的步数不敏感，且不需要跑完Transformer的所有层，中间层的特征就足以输出高质量轨迹。
- **本质改动**: 放弃在部署时生成完整的未来视频，改为在视频扩散模型（DiT）的中间层直接引出轨迹预测头，并加入一个轻量级质量评估器。推理时根据当前轨迹的质量动态决定在哪一层“早退（Early-Exit）”，从而大幅降低计算量。
- **技术溯源**: 基于 Wan2.2-5B（视频扩散基座）、ReCogDrive（轨迹扩散头）、DINOv2-Small（质量评估器）以及 DiffGRPO（强化学习微调算法）。

**2. 技术拆解**
- **重点改进**: 
  1. 多出口轨迹解码：在DiT的第5、9、15、18、22、30层分别接入独立的轨迹扩散头。部署时只做单次前向传播，完全跳过视频去噪循环和VAE解码。
  2. 质量引导的自适应推理：训练一个轻量级评估器预测轨迹质量。如果当前层输出的轨迹质量超过设定阈值，则直接输出并停止后续计算；如果不达标，则利用缓存的隐藏状态继续向深层计算。
- **架构细节**: 
  - 输入：当前前视图像、自车历史状态、导航指令。
  - 骨干网络：Wan2.2-5B，使用LoRA微调，固定在一个特定的视频噪声步（index 17）进行单次特征提取。
  - 轨迹头：6个独立的5步轨迹扩散头（ReCogDrive架构），参数量独立，不共享特征。
  - 质量评估器：基于DINOv2-Small，输入图像和展平的轨迹，输出6个规划子指标（如无碰撞、舒适度等），聚合成综合分数。
- **核心 Loss**: 
  - 模仿学习阶段：视频扩散Loss（用于表征学习，部署时不用） + 6个轨迹头的轨迹扩散Loss。评估器使用BCE-with-logits Loss对齐真实的规划子指标软标签，且评估器的梯度不反向传播给轨迹头。
  - 强化学习阶段：冻结骨干和评估器，使用DiffGRPO算法对轨迹头进行RL微调，奖励函数为NAVSIM的真实评估分数。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：NAVSIM v1/v2（主测），nuScenes（零样本迁移测试）。
  - Baseline：传统端到端规划器（UniAD, VADv2, TransFuser等）和基于世界模型的规划器（DriveVA, Epona, PWM等）。
- **评价指标**: 
  - NAVSIM v1的PDMS（综合得分），NAVSIM v2的EPDMS；nuScenes的平均L2误差和碰撞率；端到端规划延迟（ms）。
- **实验结果**: 
  - 规划性能：在NAVSIM v1上，自适应单轨迹模型达到90.8 PDMS（优于DriveVA的90.5）；固定层（B22）+64个候选轨迹的变体达到92.6 PDMS。在NAVSIM v2上达到89.9 EPDMS，为同类前视视频世界模型最优。
  - 泛化能力：在nuScenes上零样本迁移，取得0.88m平均L2误差和0.08%碰撞率。
  - 推理效率：在单张A100上，自适应推理平均延迟为170ms，比固定在第15层退出（190ms）快10%，比跑满全层（320ms）快47%。完全省去了原本需要13.22秒的未来视频生成时间，同时PDMS分数比固定层还微涨了0.17分。

### 13. 🔥 [Beyond Flat Policies: Hierarchical Post-Training for Embodied Agents in Robotic Manipulation] (超越扁平策略：具身智能体机器人操作的分层后训练)
- **研究机构**: `吉林大学、宾汉姆顿大学等（根据作者署名推测）`
- **Arxiv ID**: `2608.05999` | [点击跳转](https://arxiv.org/abs/2608.05999)

**0. 论文标题**
- **英文标题**: Beyond Flat Policies: Hierarchical Post-Training for Embodied Agents in Robotic Manipulation
- **中文标题**: 超越扁平策略：具身智能体机器人操作的分层后训练
- **研究机构**: 吉林大学、宾汉姆顿大学等（根据作者署名推测）

**1. 整体逻辑**
- **研究任务**: 长视野（long-horizon）多阶段机器人操作任务。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型多采用“扁平策略”，直接用全局指令映射到动作。在长视野任务中，缺乏中间状态反馈，微小误差容易累积导致任务失败；而现有的分层方法多依赖离线监督学习，无法通过在线交互进行自我纠错和提升。
- **本质改动**: 提出 HiRoC 框架，把原本端到端直接输出动作的扁平VLA，拆成了“规划器（Planner）”和“执行器（Executor）”的两段式结构。Planner 负责把全局任务拆解成具体的子目标，Executor 根据子目标输出动作，并通过在线强化学习（RL）不断提升执行能力。
- **技术溯源**: 规划器基于 Qwen2.5-VL-3B，执行器基于 OpenVLA-OFT。

**2. 技术拆解**
- **重点改进**: 
  1. 引入子目标条件下的 SFT 预热，解决 Planner 生成的子目标与 Executor 原本习惯的全局指令之间的“分布不对齐（冷启动）”问题。
  2. 提出分层 GRPO（Group Relative Policy Optimization），在 RL 阶段同时利用全局任务奖励和局部子目标进度奖励来优化策略。
- **架构细节**: 
  - **Planner**: 使用 Qwen2.5-VL-3B，通过 LoRA 微调。输入当前的视觉和语言观测，自回归输出文本形式的下一个子目标。在后续的 RL 阶段参数冻结，不参与更新。
  - **Executor**: 使用 OpenVLA-OFT，通过 LoRA 微调。输入视觉观测和 Planner 给出的文本子目标，输出动作块（action chunk）。先进行 SFT 预热，再进行 RL 微调。
- **核心 Loss**: 
  - **SFT 阶段**: Planner 和 Executor 均使用常规的自回归交叉熵损失。
  - **RL 阶段 (Executor)**: 使用 PPO 风格的截断策略损失（Clipped Actor Objective）。核心改动在优势函数（Advantage）的构造上：将全局任务优势（Task-level GRPO）和局部子目标优势（Subgoal-level GRPO）进行加权融合。权重不是固定的，而是根据轨迹中子目标的平均数量和轨迹总长度自适应计算。

**3. 实验结果**
- **数据集和baseline**: 在 LIBERO 基准（包含 Spatial, Object, Goal, Long 四个子集）和 LIBERO-Plus（用于 Zero-shot 泛化测试）上进行评估。对比了 OpenVLA、SmolVLA、TGRPO、VLA-RL、World-Env 等 10 个主流 VLA 和 RL 基线方法。
- **评价指标**: 任务成功率（Success Rate, SR）。
- **实验结果**: 
  - 在 LIBERO 基准上，HiRoC 的平均成功率达到 93.5%，比基线方法平均提升约 10.06%。
  - 在难度最大的 Long（长视野）任务上，成功率高达 98%，证明了分层控制对复杂任务的有效性。
  - 在 LIBERO-Plus 的 Zero-shot 泛化测试中，面对各种环境扰动，HiRoC 的泛化成功率全面优于 OpenVLA 和 WorldVLA 等基线，证明了在线交互和子目标拆解能有效提升模型的鲁棒性。

### 14. 🔥 [XEWorld: Can Action-Conditioned World Models Generalize to Unseen Robot Embodiments?] (XEWorld：动作条件世界模型能泛化到未见过的机器人本体吗？)
- **研究机构**: `中国科学院自动化研究所 (CASIA) 等`
- **Arxiv ID**: `2608.05799` | [点击跳转](https://arxiv.org/abs/2608.05799)

**0. 论文标题**
- **英文标题**: XEWorld: Can Action-Conditioned World Models Generalize to Unseen Robot Embodiments?
- **中文标题**: XEWorld：动作条件世界模型能泛化到未见过的机器人本体吗？
- **研究机构**: 中国科学院自动化研究所 (CASIA) 等

**1. 整体逻辑**
- **研究任务**: 评估动作条件世界模型（根据当前画面和动作预测未来视频）在未见过的机器人本体上的跨本体泛化能力。
- **研究动机**: 现有的世界模型都在训练过的机器人上测试，表现好可能是因为死记硬背了视觉 pattern，而不是真正理解了物理动力学。需要把“机器人本体”这个变量单独抽出来，验证模型换个没见过的机器躯壳后还能不能准确预测。
- **本质改动**: 提出了一个严格控制变量的跨本体测试床 XEWorld（场景和物体完全一样，只换机器人），并系统测试了动作表示、视觉提示、少样本微调等手段对泛化的影响。结论是当前模型本质上只是 2D 视觉 pattern 匹配器，泛化能力取决于“长得像”而不是“运动学像”。
- **技术溯源**: 参考世界模型基于 FlowWAM，光流计算基于 RAFT，机器人掩码分割基于 SAM2，关键点追踪基于 CoTracker3。

**2. 技术拆解**
- **重点改进**: 核心贡献是构建评测体系而非修改模型。设计了“解耦指标体系”（把视觉、形态、运动学、物体动力学分开评估）和“本体距离”（量化视觉外观距离和物理运动学距离）。在干预实验上，将动作输入从抽象的关节角替换为像素级的光流/掩码，将静态视觉提示替换为逐帧对齐的渲染图。
- **架构细节**: 参考模型 FlowWAM 接收三个输入流：(1) 场景 RGB 图像；(2) 像素级动作信号（如用 RAFT 算出的机器人掩码光流）；(3) 本体规格流（如参考图或逐帧渲染图）。输出为预测的未来视频帧。
- **核心 Loss**: 论文侧重评测，未提出新 Loss。参考模型使用的是常规的视频预测重建 Loss（如 L1/L2 和感知 Loss）。

**3. 实验结果**
- **数据集和baseline**: 数据集基于 RoboTwin 模拟器，包含 5 种双臂机器人（3种训练，2种测试）在 25 个操作任务上的严格配对数据（场景字节级对齐）。对比的 baseline 包括 IRASim、Ctrl-World 和 EnerVerse-AC 等现有世界模型。
- **评价指标**: 解耦的四个维度：1. 视觉质量（SSIM, PSNR, LPIPS）；2. 机器人形态（掩码 Sym. IoU, 边界 F1）；3. 机器人运动学（关键点重投影 PCK, 像素误差）；4. 物体动力学（物体轨迹像素误差）。
- **实验结果**: 
  1. **动作表示**：像素级动作远好于抽象关节角。用光流代替关节角，Franka 和 Piper 的 LPIPS 误差分别降低 29% 和 57%，形态 IoU 提升 25% 和 116%。
  2. **视觉提示**：给模型看再多静态参考图（单图、9视角、运动视频）收益都极小（LPIPS 改善不到 1%），只有提供“逐帧完美对齐的渲染图”才能让 robot-region LPIPS 降低 50% 左右。
  3. **少样本微调**：用 1 个 demo 微调就能降低 30% 以上的 LPIPS，但会导致严重的灾难性遗忘（之前见过的 UR5 机器人 LPIPS 误差直接飙升 69%）。
  4. **距离分析**：模型在未见本体上的生成误差与“视觉外观距离”强相关，与“物理运动学距离”相关性很弱，证明当前模型主要依赖 2D 视觉匹配而非物理动力学。

### 15. 🔥 [In-Context VLA: Endowing Vision-Language-Action Models with Language via In-Context Post-Training and Agentic Tool Use] (上下文VLA：通过上下文后训练和智能体工具使用赋予视觉-语言-动作模型语言能力)
- **研究机构**: `未在提供文本中明确列出（实验涉及 AgiBot 智元机器人平台）`
- **Arxiv ID**: `2608.05738` | [点击跳转](https://arxiv.org/abs/2608.05738)

**0. 论文标题**
- **英文标题**: In-Context VLA: Endowing Vision-Language-Action Models with Language via In-Context Post-Training and Agentic Tool Use
- **中文标题**: 上下文VLA：通过上下文后训练和智能体工具使用赋予视觉-语言-动作模型语言能力
- **研究机构**: 未在提供文本中明确列出（实验涉及 AgiBot 智元机器人平台）

**1. 整体逻辑**
- **研究任务**: 语言条件化的机器人操作任务（VLA模型根据文本指令和视觉观察生成底层控制动作）。
- **研究动机**: 目前给VLA加思维链（CoT）让模型“先推理再动作”，反而会降低底层控制效果。原因有三：1）推理文本没提供新信息，产生幻觉还会误导动作；2）文本token数量远超动作token，导致模型顾着“把话说通顺”而忽略了动作准确性（目标冲突）；3）生成大量文本延迟太高，跟不上机器人的闭环控制频率。
- **本质改动**: 提出VLA不需要“生成”语言，只需要“理解”语言。将获取信息和执行动作解耦：用外部视觉工具获取目标的空间证据，转成自然语言塞进上下文（In-Context）里。模型只读取这些证据并输出动作，不生成证据文本，从而彻底解决目标冲突和延迟问题。
- **技术溯源**: 基于 OpenVLA-OFT 基座；外部工具链使用了 GroundingDino（开放词汇检测）、DepthAnything（单目深度估计）和 Qwen2.5-VL-7B（VLM兜底）。

**2. 技术拆解**
- **重点改进**: 
  1. **智能体工具调用**：在关键帧调用外部检测器、深度估计和VLM，获取夹爪和目标的像素坐标及相对深度等结构化证据。
  2. **多样化文本渲染**：将获取的结构化证据改写成句式、词汇多样化的自然语言描述，防止模型过拟合单一模板。
  3. **上下文后训练**：将证据文本作为上下文注入Prompt。训练时只计算动作token的损失，完全屏蔽上下文文本的损失。
  4. **关键帧门控**：只在初始帧、夹爪状态改变等关键帧调用工具和注入上下文，其余帧直接出动作，大幅降低推理开销。
  5. **轨迹级强化学习**：用GRPO算法，通过稀疏的任务成功奖励，对齐工具调用时机和动作轨迹。
- **架构细节**: 
  - **输入**：单张第三人称RGB图像、本体感受（关节状态）、语言指令，以及关键帧注入的 `<spatial>` 上下文证据。
  - **输出**：7自由度的末端执行器动作块（Action Chunk）。
  - **模型结构**：保持 OpenVLA-OFT 的视觉-语言骨干和动作头不变，外部挂载工具链，不改变原模型参数结构。
- **核心 Loss**: 
  - **主 Loss（SFT阶段）**：动作token的自回归交叉熵损失。注入的上下文文本被 mask 掉，不参与 Loss 计算。
  - **RL阶段 Loss**：GRPO（Group Relative Policy Optimization）目标函数。奖励由稀疏的任务成功奖励和微小的格式正则化奖励组成，并带有参考策略的 KL 散度约束。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：RoboCasa-GR1（人形机器人厨房操作）、SimplerEnv（WidowX桌面操作）、LIBERO（语言条件操作），以及8个真实 AgiBot G1 人形机器人任务。
  - **Baseline**：OpenVLA、SpatialVLA、CoT-VLA、π0、VLA-Thinker 等主流VLA，以及一个使用相同证据但生成文本的 Gen-CoT 变体（用于控制变量对比）。
- **评价指标**: 任务成功率（Success Rate, SR）、单步推理延迟（Latency）。
- **实验结果**: 
  - **成功率**：在 LIBERO 上平均成功率达 97.4%（SOTA），比生成式 CoT（Gen-CoT）高 1.2%；在 RoboCasa-GR1 和 SimplerEnv 上分别达到 59.5% 和 72.4%，均为最优。
  - **推理效率**：相比生成式 CoT，上下文注入方法在成功率更高的情况下，单步推理延迟降低了约 4.6 倍。
  - **消融结论**：只监督动作token（不监督文本）效果最好；SFT冷启动和GRPO两阶段训练缺一不可，直接上RL会导致训练不稳定。

### 16. 🔥 [JoyAI-RA 0.5: Scaling Robot Manipulation Learning via Dual Action Alignment] (JoyAI-RA 0.5：通过双重动作对齐扩展机器人操作学习)
- **研究机构**: `Joy Future Academy, JD (京东)`
- **Arxiv ID**: `2608.05674` | [点击跳转](https://arxiv.org/abs/2608.05674)

**0. 论文标题**
- **英文标题**: JoyAI-RA 0.5: Scaling Robot Manipulation Learning via Dual Action Alignment
- **中文标题**: JoyAI-RA 0.5：通过双重动作对齐扩展机器人操作学习
- **研究机构**: Joy Future Academy, JD (京东)

**1. 整体逻辑**
- **研究任务**: 利用异构数据（人类第一人称视频、仿真、真实机器人数据）训练泛化机器人操作策略。
- **研究动机**: 机器人真实数据太少，人类第一人称视频数据量大但缺乏动作标签，且人体动作与机器人控制指令不兼容。现有的VLA（视觉-语言-动作）模型懂语义但不懂物理动态，无法利用无标签人类视频；世界模型懂物理动态但缺乏语义且依赖动作标签。直接混合这些异构数据会导致负迁移。
- **本质改动**: 提出VLWA（视觉-语言-世界-动作）框架，核心是“双重动作对齐”。隐式对齐通过视觉变化推断“潜在动作”来训练世界模型，让无标签人类视频发挥作用；显式对齐把有标签的人类和机器人轨迹映射到统一的物理动作空间，解决具身差异。
- **技术溯源**: 基于 VLM（视觉语言模型）、LAM（潜在动作模型）、World Model（世界模型）以及 Flow-Matching（流匹配）动作专家。数据处理阶段用到了 V-JEPA 2 和 Cosmos-Embed 进行质量过滤。

**2. 技术拆解**
- **重点改进**: 双重动作对齐机制。隐式对齐训练一个变分潜在动作模型（LAM），从多视角连续帧中提取与具身无关的“潜在动作”（Latent Actions），作为世界模型（LAC-WM）的条件输入；显式对齐将可靠的人类手部轨迹和机器人动作统一映射到130维的标准状态-动作空间（相机坐标系下的相对末端执行器动作块）。
- **架构细节**: 模型包含 VLM、LAC-WM（潜在动作条件世界模型）和流匹配动作专家。输入为语言指令和拼接的多视角图像（头、左、右）。训练分三阶段：1. LAC-WM 预训练（学物理动态）；2. VLWA 预训练（结合语义和动作）；3. 目标机器人后训练。部署时采用内外循环强化学习（内环在线残差适应，外环定期更新基础策略）。
- **核心 Loss**: LAM 的训练 Loss 由多项重建 Loss 和变分信息瓶颈组成。重建 Loss 包括 L1（像素）、LPIPS（感知）、DINO（语义）、光流（运动）、深度和 VGGT（几何）；信息瓶颈为 KL 散度，用于逼迫潜变量只编码状态转移信息，过滤掉冗余的外观和背景信息。

**3. 实验结果**
- **数据集和baseline**: 预训练使用了 5.3万+ 小时人类视频（含 2万+ 小时自研 EgoLive 数据集）、1.1万+ 小时仿真数据和 8千+ 小时真实机器人数据。在真实世界 AgiBot G1 机器人平台上测试（涵盖抓取、高精度操作、长序列任务），对比了现有的 VLA 和世界模型方法。
- **评价指标**: 真实世界任务得分（Task score）/成功率，以及对新物体、新空间配置、新背景和光照的泛化能力。
- **实验结果**: 在已知和未知任务上均表现出较强的泛化能力。核心结论是：随着人类第一人称预训练视频数据量的增加，任务得分持续稳定上升，在最大训练规模下仍未出现瓶颈（plateau）。这证明人类视频可以作为扩展机器人操作能力的主力数据源，而不仅仅是弱辅助。

### 17. 🔥 [World-to-Wrist: Task-Conditioned Future Wrist Modeling for Fine-Grained Robot Manipulation] (从世界到腕部：面向细粒度机器人操作的任务条件化未来腕部建模)
- **研究机构**: `香港科技大学 (HKUST) 等`
- **Arxiv ID**: `2608.05369` | [点击跳转](https://arxiv.org/abs/2608.05369)

**0. 论文标题**
- **英文标题**: World-to-Wrist: Task-Conditioned Future Wrist Modeling for Fine-Grained Robot Manipulation
- **中文标题**: 从世界到腕部：面向细粒度机器人操作的任务条件化未来腕部建模
- **研究机构**: 香港科技大学 (HKUST) 等

**1. 整体逻辑**
- **研究任务**: 细粒度机器人操作（如插头插入等需要精准末端交互的任务）。
- **研究动机**: 现有的多视角VLA模型把主视角和腕部视角当成平行的输入，没有区分它们的作用。主视角负责看全局，腕部视角负责看末端局部交互。做细粒度操作时，光看当前的腕部画面不够，还需要结合全局任务意图去预测腕部画面接下来会怎么变，从而更好地指导动作。
- **本质改动**: 把“未来腕部预测”作为中间任务。用VLM提取全局任务意图，生成一个固定长度的隐状态接口，结合腕部历史画面，去预测未来的腕部隐状态。同时设计了一套结构化的思维链（W2-CoT）标注来辅助训练这个接口。推理时直接输出动作，不需要生成CoT或未来画面，保证控制速度。
- **技术溯源**: 基于 StarVLA 框架，VLM底座是 Qwen3-VL-4B-Instruct，动作头是基于 DiT 的 Flow-matching，腕部视觉编码器用的是冻结的 V-JEPA 2.1。

**2. 技术拆解**
- **重点改进**: 
  1. 引入任务条件化的未来腕部预测分支：VLM输出特定的 latent tokens 作为全局意图接口，和 V-JEPA 提取的腕部历史特征一起输入到双向 Transformer，预测未来腕部隐状态。
  2. 提出 W2-CoT 辅助监督：用离线 VLM 生成包含“子任务进度、物理状态转换、腕部局部证据”的结构化文本标注。训练时让模型预测这些文本，促使 VLM 的 latent tokens 学到准确的任务和物理状态。
- **架构细节**: 
  - 输入：当前主视角和腕部视角图像、语言指令、腕部历史视频片段。
  - 结构：VLM (Qwen3-VL-4B) + 腕部预测分支 (冻结的 V-JEPA 2.1 ViT-L 编码器 + 4层 Transformer 预测器 + Q-Former 风格的 adapter) + 动作头 (DiT)。总参数量约 4.97B。
  - 输出：动作块（action chunk，LIBERO任务输出8步，其他输出16步）。
- **核心 Loss**: 
  - 主 Loss：动作生成的 Flow-matching Loss ($L_{act}$)。
  - 辅助 Loss 1：未来腕部隐状态预测的 L1 Loss ($L_{wrist}$)，使用 stop-gradient 阻止梯度回传给 VLM。
  - 辅助 Loss 2：W2-CoT 文本标注的 Next-token 预测交叉熵 Loss ($L_{cot}$)。
  - 总 Loss 是这三者的加权和。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO（单臂仿真）、RoboTwin 2.0（双臂仿真）、3个真实世界任务（基于 Mobile ALOHA 平台的擦桌子、遮挡放置、双臂插插头）。
  - Baseline：OpenVLA、π0、π0.5、DreamVLA、VLA-JEPA、StarVLA 等主流 VLA 模型。
- **评价指标**: 任务成功率（Task success rate, %）和推理频率（Hz）。
- **实验结果**: 
  - LIBERO：平均成功率 98.5%，比最强的 baseline 高出 1.3%。
  - RoboTwin 2.0：Easy 设置成功率 60.71%，Hard 设置 18.21%。
  - 真实世界：在标准场景和 OOD（分布外）场景下，3个任务的成功率均优于所有 baseline。
  - 推理速度：因为推理时不需要自回归生成 CoT 文本和未来画面，动作生成频率保持在 80 Hz 以上，满足实时控制需求。

### 18. 🔥 [VLAff: Vision-Language-Affordance Model for Unified Actionable Affordances] (VLAff：用于统一可操作 Affordance 的视觉-语言-Affordance 模型)
- **研究机构**: `东京大学 (The University of Tokyo)`
- **Arxiv ID**: `2608.05215` | [点击跳转](https://arxiv.org/abs/2608.05215)

**0. 论文标题**
- **英文标题**: VLAff: Vision-Language-Affordance Model for Unified Actionable Affordances
- **中文标题**: VLAff：用于统一可操作 Affordance 的视觉-语言-Affordance 模型
- **研究机构**: 东京大学 (The University of Tokyo)

**1. 整体逻辑**
- **研究任务**: 从第一人称人类视频中提取可操作的 Affordance（视觉接触区、抓取姿态、运动轨迹），并用于机器人的零样本操作和强化学习。
- **研究动机**: 人类视频数据量大，但人和机器人的具身差异导致直接学动作很难。现有的 Affordance 学习通常只关注单一模态（如只预测 2D 接触点），缺乏一个统一模型把“在哪交互（视觉）”、“怎么抓（抓取）”和“怎么动（轨迹）”结合起来。
- **本质改动**: 提出 VLAff 模型，在大型视觉语言模型中引入特殊的 Affordance token，统一预测 2D 视觉热力图、3D 抓取姿态和 3D 运动轨迹。同时构建了包含千万级标注的大规模数据集 EgoAffordance。
- **技术溯源**: 基于 Qwen2.5-VL（基座 VLM）、DINOv2（视觉编码器），借鉴了 LISA 的 `<SEG>` token 机制，抓取姿态基于 MANO 参数化手部模型。

**2. 技术拆解**
- **重点改进**: 在 VLM 词表中加入三种特殊 token：`<SEG>` 用于生成视觉热力图，`<GRASP>` 用于回归抓取姿态，`<p*>` 用于自回归生成离散化的轨迹点。通过联合训练捕捉三种模态间的跨模态关联。
- **架构细节**: 
  - **输入输出**: 输入 RGB 图像和文本指令；输出 2D 交互热力图、96 维 MANO 抓取参数、6D 轨迹点序列。
  - **模型结构**: 核心是 Qwen2.5-VL。为了增强细粒度空间理解，额外并联了一个 DINOv2 视觉编码器。解码端包含三个分支：Visual Affordance Decoder（融合 DINOv2 特征和 `<SEG>` token 输出热力图）、Grasp Decoder（将 `<GRASP>` token 解码为 MANO 参数）、Trajectory 生成（将 6D 位姿空间离散化，通过自回归生成轨迹 token）。
  - **推理策略**: 引入上下文轨迹引导（用 GPT 提供粗粒度 3D 方向指导首个轨迹点）和基于采样的轨迹选择（采样多条轨迹，结合碰撞检测和方向对齐选最优）。
- **核心 Loss**: 总 Loss 是三个子 Loss 的加权和：
  - **Visual Affordance Loss**: Soft Dice Loss，处理热力图正负样本不平衡。
  - **Grasp Affordance Loss**: Smooth L1 Loss，用于回归 96 维 MANO 参数。
  - **Trajectory Affordance Loss**: Cross-Entropy Loss，用于自回归预测离散的轨迹 token。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自建 EgoAffordance（20.4 万 episodes，560 万视觉 affordance，1160 万抓取和轨迹 affordance），并混合了 HANDAL 和 SceneFun3D。
  - **Baseline**: 视觉预测对比 VRB, UAD, 3DOI, LISA；零样本操作对比 RAM, VRB, GeneralFlow, VidBot。
- **评价指标**: 
  - **视觉 Affordance**: IoU（交并比）、NSS（归一化扫描路径显著性）、SIM（相似度）、KLD（KL 散度）。
  - **机器人操作**: 仿真（IsaacGym 10 个任务）和真机（Fetch/PR2 5 个任务）的任务成功率。
- **实验结果**: 
  - **视觉 Affordance**: 取得全面 SOTA。IoU 达到 0.121（优于 LISA 的 0.113），NSS 达到 1.542（优于 LISA 的 1.342），SIM 和 KLD 指标也均为最优。主要得益于 DINOv2 的细粒度特征和联合训练机制。
  - **机器人操作**: （注：提供的原文中零样本操作和 RL 引导学习的具体实验数据部分被截断，但论文明确指出在仿真和真机零样本操作，以及 Affordance 引导的 RL 中均验证了该方法的有效性。）

### 19. 🔥 [GAUGE: A Measurement-Grounded Benchmark for Physical Fidelity in Simulation Engines and Video World Models] (GAUGE：一个基于真实测量的物理引擎与视频世界模型物理保真度基准)
- **研究机构**: `上海人工智能实验室 (Shanghai AI Laboratory)`
- **Arxiv ID**: `2608.05948` | [点击跳转](https://arxiv.org/abs/2608.05948)

**0. 论文标题**
- **英文标题**: GAUGE: A Measurement-Grounded Benchmark for Physical Fidelity in Simulation Engines and Video World Models
- **中文标题**: GAUGE：一个基于真实测量的物理引擎与视频世界模型物理保真度基准
- **研究机构**: 上海人工智能实验室 (Shanghai AI Laboratory)

**1. 整体逻辑**
- **研究任务**: 评估物理引擎（Physics Engines）和视频世界模型（Video World Models）在模拟真实物理规律时的准确度（物理保真度）。
- **研究动机**: 现有的评估大多依赖“视觉上像不像”或人类主观打分，无法指出具体违背了哪些物理原理。视觉逼真不等于物理准确，如果模拟器或世界模型的物理参数是错的，会严重误导具身智能策略的训练和评估。
- **本质改动**: 提出了一个基于真实世界高精度动捕数据的诊断性基准（GAUGE）。摒弃纯视觉评估，直接将仿真/生成的轨迹与真实物理参数、运动方程进行定量对齐，精准定位模型在哪些物理机制上失效。
- **技术溯源**: 评估对象涵盖了主流物理引擎（Isaac Sim, Genesis, Newton）和主流视频生成/世界模型（Cosmos3, Wan系列, Seedance 2.0, Genie 3），视频轨迹提取使用了 SAM3。

**2. 技术拆解**
- **重点改进**: 设计了两套互补的评估 Pipeline。对于物理引擎，直接对比仿真输出与真实测量的“广义轨迹”；对于世界模型，通过初始帧和文本提示生成视频，提取轨迹后去拟合物理方程，诊断其是否真正学到了物理定律的形式和参数。
- **架构细节**: 
  - **数据集**: 包含 22 个受控任务族（8个刚体、1个1D柔性绳索、6个2D纺织品、7个3D可变形软体），共约 1560 次毫米级动捕实验，并附带标定好的物理元数据（如摩擦系数、杨氏模量等）。
  - **评估范围**: 物理引擎评估 14 个任务，世界模型评估 5 个刚体任务。
- **核心 Loss (评价指标)**: 
  - **物理引擎**: 计算广义轨迹（刚体看位置，布料看高斯曲率，软体看网格面积）的 RMSE（均方根误差）和 DTW（动态时间规整）误差。针对特定任务增加物理指标，如牛顿摆的动量传递效率（MTE）、单摆的周期（PD）和能量损失（EL）。
  - **世界模型**: 动态误差（DE，衡量牛顿第二定律 $F=ma$ 的偏差）、决定系数 $R^2$（衡量轨迹是否符合预期物理方程形式）、二次型改进（QFI，衡量匀加速运动等特定规律的拟合残差）。

**3. 实验结果**
- **数据集和baseline**: 使用自建的 GAUGE 数据集。对比的 baseline 包括 3 个物理引擎（Isaac Sim, Genesis, Newton）和 6 个视频世界模型（Cosmos3-Nano/Super, Wan-2.2/2.7, Seedance 2.0, Genie 3）。
- **评价指标**: 轨迹误差（RMSE, DTW）、物理定律一致性（DE, $R^2$, QFI）以及特定物理参数指标。
- **实验结果**: 
  - **物理引擎**: 没有绝对全能的物理引擎。Isaac Sim、Genesis 和 Newton 在脉冲接触（如碰撞）、布料快速运动和 3D 软体大变形任务上均存在显著误差。
  - **世界模型**: 当前的视频世界模型“表面功夫”较好，生成的轨迹能大致符合物理方程的数学形式（$R^2$ 较高），但恢复出的具体物理参数（如加速度大小、动量传递比例、振荡周期）存在严重错误，缺乏真实的物理一致性。

### 20. 🔥 [Robust-WAM: Bridging Generative Pretraining and Semantic Foresight in World-Action Models] (Robust-WAM：在世界-动作模型中桥接生成式预训练与语义前瞻)
- **研究机构**: `香港科技大学（广州）、北京航空航天大学、华为基础模型部`
- **Arxiv ID**: `2608.05903` | [点击跳转](https://arxiv.org/abs/2608.05903)

**0. 论文标题**
- **英文标题**: Robust-WAM: Bridging Generative Pretraining and Semantic Foresight in World-Action Models
- **中文标题**: Robust-WAM：在世界-动作模型中桥接生成式预训练与语义前瞻
- **研究机构**: 香港科技大学（广州）、北京航空航天大学、华为基础模型部

**1. 整体逻辑**
- **研究任务**: 机器人操作中的世界-动作模型（World-Action Models, WAMs），即利用预训练的视频生成模型预测未来画面，并据此生成机器人动作。
- **研究动机**: 现有的WAM通常在VAE潜空间训练，VAE为了重建像素会保留大量光照、纹理等外观细节，导致模型在遇到光照变化等视觉分布外（OOD）情况时容易失效。如果改用DINO等语义潜空间训练，虽然鲁棒了，但又无法利用大规模视频生成模型在VAE空间积累的动力学先验。
- **本质改动**: 提出一种后训练方法，保留原有的VAE视频生成路径，在动作预测流里加一个“语义前瞻对齐”目标。具体是在动作token前面插入可学习的query token，强迫它们去预测未来画面的语义特征，让动作流具备不受外观影响的预见能力。
- **技术溯源**: 基于现有的WAM架构（如FastWAM、GE-Act、LingBot-VA），视频生成底座基于预训练VGM（如Wan2.2），语义特征提取基于冻结的DINOv3。

**2. 技术拆解**
- **重点改进**: 在动作DiT（Diffusion Transformer）的输入序列前拼接可学习的query token。为了让模型知道每个query对应未来的哪一步，直接复用对应动作步的位置编码（Positional Encoding）。训练时，用冻结的DINOv3提取未来真实帧的CLS特征作为目标，对齐query token的输出。推理时丢掉DINOv3和对齐头，只保留query token参与注意力计算。
- **架构细节**: 输入为当前观测、语言指令、加噪的动作token和query token。Query token的数量等于未来预测帧数乘以相机数（如16或24个）。视频DiT和动作DiT联合去噪，query token和动作token在同一个序列里通过注意力机制交互，使得动作生成能直接参考未来的语义信息。
- **核心 Loss**: 总Loss由三部分组成：视频流的Flow Matching Loss、动作流的Flow Matching Loss，以及新增的语义对齐Loss。对齐Loss计算的是query token输出与DINOv3 CLS特征之间的余弦距离（1 - cos），权重设为0.1。

**3. 实验结果**
- **数据集和baseline**: 数据集使用LIBERO（及包含7种扰动的LIBERO-Plus）和RoboTwin（clean到random）。对比基线包括主流VLA（如OpenVLA、π0）和WAM（如FastWAM、GE-Act、LingBot-VA、LDA-1B）。
- **评价指标**: 任务成功率（Success Rate），重点考察分布内（clean）和分布外（OOD，如光照、背景、相机视角、传感器噪声等扰动）的表现。
- **实验结果**: 在LIBERO-Plus上，Robust-WAM将FastWAM的成功率从49.7%提升到58.9%（+9.2%），将GE-Act从78.0%提升到80.9%（+2.9%），并且在clean LIBERO上不掉点甚至微涨。在光照、背景、相机视角等视觉扰动上提升最明显。相比纯语义空间的LDA-1B，Robust-WAM在LIBERO-Plus上高出35.4%，证明了保留VAE预训练先验的必要性。在RoboTwin和真实机器人实验中，也一致提升了OOD鲁棒性。
