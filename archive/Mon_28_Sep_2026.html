            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [InternW0-$Δ$: A World Action Model Bridging Predictive Dynamics and Actions with 20K+ Hours of Open Data] (InternW0-$Δ$：基于2万小时开放数据桥接预测动态与动作的世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.31394` | [点击跳转](https://arxiv.org/abs/2609.31394)

**0. 论文标题**
- **英文标题**: InternW0-$Δ$: A World Action Model Bridging Predictive Dynamics and Actions with 20K+ Hours of Open Data
- **中文标题**: InternW0-$Δ$：基于2万小时开放数据桥接预测动态与动作的世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合视觉动态预测与动作生成的世界动作模型（WAM），通过因果印记（Causal Imprint）和4D蒸馏将预测知识转化为动作表征，并在2万小时异构数据上预训练，在多个仿真和真机平台上取得SOTA。

**1. 整体逻辑**
- **研究任务**: 通用机器人操作（Generalist robot manipulation），即根据多视角视觉观测和语言指令，联合建模视觉动态并生成机器人控制动作。
- **研究动机**: 现有的世界动作模型（WAMs）能预测未来画面，但“预测未来”不等于“能控制机器人”。动作生成需要理解任务相关的场景变化、几何和运动先验。核心痛点是如何把视觉预测知识转化为对动作直接有用的表征，同时避免在推理时自回归生成未来视频（计算开销大且无必要）。
- **本质改动**: 设计了定向的 Mixture-of-Transformers (MoT) 架构，并引入 Causal Imprint（因果印记）机制。核心思路是“训练看未来，推理不看未来”：训练时利用未来视频的监督信号让模型学习“场景变化表征”，推理时完全切断未来信息，让动作专家直接利用这些表征进行控制，实现预测知识与动作生成的解耦。
- **技术溯源**: 视频专家基座为 Wan2.2-TI2V-5B，动作专家为随机初始化的 ActionDiT；场景语义理解基于冻结的 RynnBrain1.1-2B (VLM) 和 T5；4D几何运动先验蒸馏自冻结的 Track4World 教师模型。

**2. 技术拆解**
- **核心方法**: 
  1. **定向 World-Action MoT 架构**：视频专家处理稀疏视觉记忆，动作专家接收 VLM 提供的场景语义。两者通过带掩码的联合自注意力机制交互，信息单向流动（视频->动作），防止推理时动作专家“作弊”看到未来。
  2. **Causal Imprint (因果印记)**：在视频专家中引入可学习的 Imprint tokens。训练时用未来干净视频的 latent 差分和深层特征对齐作为监督，让其学会编码“未来会发生什么变化”。推理时这些 tokens 直接喂给动作专家，无需生成未来视频。
  3. **4D-Aware Distillation**：训练时用冻结的 Track4World 教师提取几何和运动特征，通过辅助 MSE 损失蒸馏到视频专家中，推理时丢弃该分支，不增加推理成本。
- **关键细节**: 
  - **输入与表示**：多视角图像拼接为 384×256 统一画布，经 Wan VAE 编码；本体感觉（关节、末端位姿等）和动作统一映射到 80 维规范空间（Canonical state-action representation），以兼容不同机器人形态。
  - **稀疏记忆**：只保留 episode 开头的锚点帧（Anchor）、上一 action chunk 前的近期帧（Recent）和当前帧（Current），避免长序列密集历史的计算开销。
  - **规模**：预训练数据超 20K 小时（80%真机，10% Ego2Robot，8% UMI，2% Ego）。视频专家 3072 维，动作专家 1024 维，共 30 个 MoT blocks。
- **训练/优化目标**: 
  联合优化四个损失：1) 视频生成的 Flow-matching loss；2) 动作生成的 Flow-matching loss；3) Causal Imprint 的直接回归 loss（预测未来 latent 差分）与特征对齐 loss（余弦相似度）；4) 4D 蒸馏的 MSE loss。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：LIBERO-Plus（单臂，测分布偏移鲁棒性）、RoboTwin 2.0（双臂，测 Clean2Random 泛化）、EBench（移动双臂，测长序列操作）、RoboDojo（双臂，测精度/记忆/长序列）。
  - **真机平台**：4 种平台（AC-One, Arx5 夹爪；Franka+XHand, TianJi Marvin+Wuji Hand 灵巧手），共 11 个任务。
  - **对比对象（Baseline）**：VLA 类（$\pi_0$, OpenVLA-OFT, Qwen-RobotManip-Context 等），WAM 类（Fast-WAM, OpenWAM-$\alpha$, Being-H0.7 等），以及 LLM as Policy（GPT-6 Astra）。
- **评价指标**: 仿真中用任务成功率（Success Rate, SR）和综合得分（Score）；真机中用成功率，以及控制器观测的往返推理延迟（Round-trip time, RTT）。
- **主要结果**: 
  - **仿真 SOTA**：在 LIBERO-Plus 达到 92.8% SR（比最强 WAM Being-H0.7 高 8.0%）；RoboTwin 2.0 Clean2Random 达 71.9%（比 OpenWAM-$\alpha$ 高 23.2%）；EBench 总分 66.0（最高）；RoboDojo 平均 SR 23.91%（是前最强 WAM 的两倍，也超越 GPT-6 Astra）。
  - **真机表现**：预训练极大提升真机表现（如 AC-One 上 toast bread 任务从 20% 提升至 95%）。部署优化后，在单张 RTX 5090 上单步推理延迟降至 152.8ms（相比标准 runtime 加速 5.11 倍），支持 30Hz 异步实时控制。

### 2. 🔥 [Towards VLA-Dreamer: Refining VLA Behavior Using World Models] (迈向VLA-Dreamer：利用世界模型优化VLA行为)
- **研究机构**: `原文未提及（仅提及德国DFG及Horizon Europe等基金项目）`
- **Arxiv ID**: `2609.31313` | [点击跳转](https://arxiv.org/abs/2609.31313)

**0. 论文标题**
- **英文标题**: Towards VLA-Dreamer: Refining VLA Behavior Using World Models
- **中文标题**: 迈向VLA-Dreamer：利用世界模型优化VLA行为
- **研究机构**: 原文未提及（仅提及德国DFG及Horizon Europe等基金项目）
- **一句话总结**: 本文是一篇具身智能领域的概念验证与方法创新工作，核心思路是在VLA冻结的视觉嵌入空间训练一个预测性世界模型，并以此作为模拟器用强化学习微调VLA策略，从而提升样本效率并赋予模型短期规划能力。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作模型（VLA）在机器人控制中的样本效率，并解决其缺乏显式世界模型导致控制能力受限的问题。
- **研究动机**: 现有VLA本质是反应式模型，依赖海量高质量模仿数据，缺乏对真实世界动态的显式理解。在像素空间训练世界模型（如视频生成）计算成本高且容易关注无关细节；在嵌入空间训练世界模型（如JEPA）又依赖昂贵的模型预测控制（MPC）且强依赖目标图像；而在嵌入空间用RL训练轻量策略则缺乏语义先验且难设计奖励。
- **本质改动**: 复用VLA冻结的视觉编码器，在其嵌入空间（而非像素空间）训练一个动作条件世界模型，并直接在这个世界模型的“梦境”中用强化学习（RL）微调原本的VLA策略。
- **技术溯源**: 基于 $\pi_0$-FAST 和 OpenVLA（VLA基座），以及 DINOv2 / SigLIP / Prismatic（视觉编码器），借鉴了 JEPA（联合嵌入预测架构）在嵌入空间进行预测的思想。

**2. 技术拆解**
- **核心方法**: 
  1) 在特定机器人的模仿数据上微调VLA，同时冻结视觉编码器和LLM大部分权重以保留语义知识；
  2) 混合专家与随机动作数据，在VLA的嵌入空间训练世界模型，预测下一帧嵌入和本体感觉；
  3) 将冻结的世界模型作为模拟器，以当前与目标嵌入的负均方距离为密集奖励，使用PPO等无模型RL算法微调VLA。
- **关键细节**: 
  - **输入输出**: 世界模型输入为历史观测嵌入、当前动作和本体感觉；输出为下一观测嵌入（$\pi_0$-FAST还预测下一本体感觉，OpenVLA仅将其作为辅助loss）。
  - **模型结构**: VLA采用基于token概率的架构（便于RL采样）；额外训练图像解码器和语义分割/深度估计探针，仅用于评估嵌入质量和可视化世界模型的“梦境”。
  - **规模与超参**: 原文未提及具体参数量，但强调限制想象 horizon（imagination horizon）并加强正则化，以防止策略利用世界模型的误差或产生累积漂移。
- **训练/优化目标**: 
  - **世界模型**: 最小化预测嵌入与真实下一帧嵌入之间的差异（嵌入空间损失）。
  - **RL微调**: 最大化累积奖励。奖励函数为当前状态嵌入与目标状态嵌入之间负均方距离（Dense reward），若该距离非单调，可结合分类器的稀疏成功信号进行增强。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: NICOL机器人的模仿学习数据集（包含语言指令、遥操作数据、本体感觉和相机帧）。
  - **对比对象**: 原文未提及具体的外部Baseline模型名称，主要对比分析不同VLA架构（$\pi_0$-FAST vs OpenVLA）的嵌入特性差异。
  - **测试环境**: NICOL机器人物理环境，涉及如“方块堆叠”等操作任务。
- **评价指标**: 探针评估指标（语义分割的 mIoU，深度估计的带阈值准确率的 RMSE），以及世界模型预测的漂移程度（用于衡量想象 horizon 和保真度）。
- **主要结果**: 原文未提及具体的定量实验数值（本文定位为 concept paper，重点在于提出架构和验证假设）。定性结论表明：该架构能避免 sim-to-real gap，比构建全物理仿真器更省算力；但系统高度依赖视觉编码器的嵌入质量，在复杂场景下世界模型的累积误差会限制长期规划能力，目前该架构主要适用于短期RL微调以优化细粒度动作，而非长程轨迹规划。

### 3. 🔥 [Kintsugi-VLA: Turning Failed Robot Rollouts into Recovery Data through Interventional Recoverability] (Kintsugi-VLA：通过干预可恢复性将失败的机器人轨迹转化为恢复数据)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.31048` | [点击跳转](https://arxiv.org/abs/2609.31048)

**0. 论文标题**
- **英文标题**: Kintsugi-VLA: Turning Failed Robot Rollouts into Recovery Data through Interventional Recoverability
- **中文标题**: Kintsugi-VLA：通过干预可恢复性将失败的机器人轨迹转化为恢复数据
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种利用仿真器“存档读档”机制，从失败的机器人轨迹中精准筛选出适合学习的异常状态，并生成合成恢复数据的方法，从而有效提升VLA模型的纠偏与恢复能力。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的鲁棒性，特别是让模型学会从非标准（失败/异常）状态中恢复并完成任务。
- **研究动机**: 现有的仿真数据管线通常只保留成功轨迹，直接丢弃失败轨迹。但失败轨迹中恰恰包含了模型急需学习的“分布外状态”。如果直接模仿失败动作显然不对，核心痛点在于：一条漫长的失败轨迹中，到底应该从哪个时间点（状态）切出来收集恢复数据？太早的状态跟正常轨迹没区别，太晚的状态可能已经彻底搞砸无法挽救了。
- **本质改动**: 不丢弃失败轨迹，而是利用仿真器支持“状态恢复与分支（restore-and-branch）”的特性，在失败轨迹的各个检查点反复“读档”，让特权专家从该状态继续尝试。通过统计专家的成功率来测量每个状态的“干预可恢复性”，从而精准挑出最适合收集恢复数据的起始状态。
- **技术溯源**: 基于 Isaac Lab（仿真平台）、PPO（用于训练特权专家）、SmolVLA（下游策略基座模型）。

**2. 技术拆解**
- **核心方法**: 
  1. **定义并测量“专家相对可恢复性”**：在失败轨迹的特定帧恢复仿真状态，让特权专家接着执行，计算专家能成功完成原始任务的概率。
  2. **自适应恢复与分支估计**：采用自适应蒙特卡洛方法（试验次数按 5->15->30 递增）结合 Wilson 置信区间来估算可恢复性，识别出“终端低可恢复性边界”（即过了这个时间点，专家也救不回来了）。
  3. **针对性状态选择**：基于测出的可恢复性曲线结构，在“还能救”和“救不回来”的窗口期内，按固定的归一化深度（0.15, 0.50, 0.85）挑选状态，让专家跑通后导出为合成恢复数据。
- **关键细节**: 
  - **输入输出**：特权专家输入 43D 仿真特权状态；下游 SmolVLA 仅接收 224×224 的双视角 RGB 图像和 8D 机器人状态，输出 7D 动作。恢复数据导出时只保留视觉和 permitted 状态，隐藏特权信息。
  - **系统架构与规模**：控制周期 0.02s（50Hz），恢复阶段最多允许 240 个策略步。Wilson 区间计算中 z=1.95996。
- **训练/优化目标**: 
  - **特权专家**：使用 PPO 进行强化学习，优化任务成功率。
  - **下游 VLA**：使用行为克隆（模仿学习），用正常数据和筛选出的恢复数据微调 SmolVLA。本文的核心贡献在于优化“数据筛选与生成管线”，而非修改 VLA 本身的损失函数。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：仿真环境中的 Franka Panda 机械臂方块搬运任务。评估包含正常任务、受干扰任务（Protocol B）以及改变杂物分布和物理条件（高摩擦/重物体）的任务（Protocol G）。
  - **对比对象（baseline）**：V0（仅使用正常演示数据）、V1（随机状态扰动恢复数据）、V2（均匀窗口采样恢复数据）、V3（本文的针对性采样恢复数据）。
- **评价指标**: 
  - **恢复成功率**：在预设的困难/异常冻结状态下，VLA 闭环执行完成任务的比例。
  - **干净任务成功率**：无干扰情况下的常规任务成功率。
  - **数据效率**：达到特定恢复成功率所需的成功演示条数或同步帧数。
- **主要结果**: 
  - **恢复能力提升**：在难度匹配和帧预算匹配下，V3 的聚合恢复成功率分别达到 34.6% 和 38.4%，比均匀采样的 V2（28.8% 和 31.7%）分别高出 5.8 和 6.7 个百分点。在受干扰和物理条件偏移测试中，V3 同样保持最优。
  - **数据效率更高**：相比 V2，V3 减少了 30.6% 的成功演示需求和 33.7% 的同步帧需求。
  - **性能代价**：引入恢复数据后存在常规性能的 trade-off，V3 在干净任务上的成功率从 V0 的 76.8% 微降至 74.7%。
  - **机制验证**：分析发现可恢复性曲线是非单调的，存在“恢复岛”；且更换不同的特权专家后，状态难度的排序差异很大，证明可恢复性是“专家相对”的，不能脱离专家谈状态难度。

### 4. 🔥 [Causeway: Restoring Task Accessibility for Instruction Switching in VLA Policies] (Causeway：恢复VLA策略中指令切换的任务可达性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.30913` | [点击跳转](https://arxiv.org/abs/2609.30913)

**0. 论文标题**
- **英文标题**: Causeway: Restoring Task Accessibility for Instruction Switching in VLA Policies
- **中文标题**: Causeway：恢复VLA策略中指令切换的任务可达性
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需训练的推理时干预方法 Causeway，通过向冻结 VLA 策略的动作流表示中注入状态引导的梯度，让机器人自主“开回”目标任务的演示分布内，解决了连续执行任务时新指令无法生效的“任务孤岛”问题。

**1. 整体逻辑**
- **研究任务**: 解决 VLA（视觉-语言-动作）策略在连续部署（指令切换）场景下，因前序任务改变了物理状态，导致新指令无法执行（即陷入“任务孤岛” task islands）的问题。
- **研究动机**: VLA 策略在标准初始状态下表现很好，但在执行任务 A 中途或完成后直接切换到任务 B 时，由于当前状态偏离了任务 B 的演示分布，新指令对解码动作的影响会被严重衰减（作者称为 gate 效应），导致直接切换（bare switch）极易失败。现有方法多依赖生成数据或微调策略，不够在线和轻量。
- **本质改动**: 不更新模型参数，也不外挂动作生成器，而是在推理时通过反向传播冻结的解码计算，向动作流表示（action-stream representation）中注入由状态误差引导的梯度，引导机器人回到目标任务的“入口盆地”（entry basin），然后交由冻结策略自己完成后续动作。
- **技术溯源**: 基于 OpenVLA-OFT、π_0.5、GR00T N1.5 等 VLA 架构，在 LIBERO-Goal、LIBERO-Object 仿真环境及 xArm 真实机器人上验证。

**2. 技术拆解**
- **核心方法**: Causeway 是一种推理时表示干预（representation intervention）方法。它计算当前末端执行器位姿与目标任务演示推导出的“重入位姿”（re-entry pose）之间的误差，通过反向传播计算该误差对动作流表示的梯度，并将该梯度方向加到表示中，从而引导动作向重入位姿移动。
- **关键细节**: 
  - **输入输出**: 输入为当前本体感觉状态和预计算的重入位姿，输出为注入扰动后的动作流表示，最终由冻结策略解码出动作。
  - **干预位置**: 针对动作流表示层进行注入（如 OpenVLA-OFT 的第 8/12/16/20/24/28/30 层，π_0.5 的第 15 层，GR00T N1.5 的 DiT block 16）。
  - **通道分解**: 将位姿误差分解为位置（position）、接近轴（approach-axis）、滚转角（roll）和夹爪（gripper）四个通道，分别计算梯度并按权重组合，以应对不同维度的重入容差差异。
  - **调度机制**: 根据本体感觉和距离阈值控制干预的开启和关闭。进入重入位姿邻域后，干预逐渐退出（handoff），交由冻结策略接管。
- **训练/优化目标**: 无训练过程。优化目标是最大化预测动作在期望方向（如指向重入位姿的平移方向、旋转对齐方向）上的投影，通过反向传播求解表示空间的梯度方向。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO-Goal（71个跨物体任务对，14个同物体任务对），LIBERO-Object。
  - **对比对象（baseline）**: Bare switch（直接切换指令）, Contrastive prompt guidance (CPG), Contrastive activation addition (CAA), Action-space steering（动作空间笛卡尔残差）。
  - **测试环境**: LIBERO 仿真环境，以及 xArm 6 真实机器人平台。
  - **切换时机**: Step 30（接近中）, Step 60（抓取后）, 任务完成后。
- **评价指标**: 任务切换后的成功率（Switch success rate），到达重入位姿邻域的比例（Reach），以及到达后的完成率（Fin | R.）。
- **主要结果**: 
  - 在 LIBERO-Goal 的 71 个跨物体任务对上，Bare switch 成功率仅为 3–26%，Causeway 将其提升至 47–65%（π_0.5 达 61.6%，OpenVLA-OFT 达 64.5%，GR00T N1.5 达 47.5%）。
  - 到达重入邻域的比例提升了 42–72 个百分点，且到达后的完成率也有显著提升。
  - 对比 baseline：CPG 和 CAA 几乎无效，Action-space steering 在后期切换时失效，证明表示级注入和状态引导缺一不可。
  - 真实机器人：在 xArm 上，Bare switch 成功率在抓取后降至 14–17%，Causeway 将整体成功率提升至 82–100%，支持连续的语言驱动重定向。

### 5. 🔥 [VLaRL: Augmenting Vision-Language-Action Models with Simulation-Trained Latent-Conditioned Residual RL] (VLaRL：使用仿真训练的潜在条件残差强化学习增强视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.30868` | [点击跳转](https://arxiv.org/abs/2609.30868)

**0. 论文标题**
- **英文标题**: VLaRL: Augmenting Vision-Language-Action Models with Simulation-Trained Latent-Conditioned Residual RL
- **中文标题**: VLaRL：使用仿真训练的潜在条件残差强化学习增强视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出VLaRL框架，将冻结VLA内部的视觉-语言潜在表征作为残差强化学习的接口，并通过最优传输对齐仿真与真实的潜在分布，实现纯仿真训练残差策略并直接部署到真机，大幅提升接触密集型任务的物理执行精度。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在接触密集型（contact-rich）机器人操作任务中的物理执行精度。
- **研究动机**: VLA模型大方向上能听懂指令并生成合理的标称动作，但在接触密集型交互（如精确对准、持续推挤）中，末端物理执行往往不够精准。残差RL可以修正这些局部误差，但在真机上跑RL成本高且不安全。现有的sim-to-real方法要么依赖像素级视觉（受视觉gap影响大），要么依赖显式几何状态（需要额外的感知管线和任务特定状态）。
- **本质改动**: 抛弃传统的像素或几何状态接口，直接复用冻结VLA内部的视觉-语言潜在表征（VLM latent）作为残差控制的接口，并训练一个轻量级映射器将仿真产生的潜在表征对齐到真实分布，从而打通纯仿真训练到真机部署的链路，免去真机RL和在线微调。
- **技术溯源**: 基于VLA模型（如Flower, GR00T N1.7），结合残差强化学习（Residual RL, 使用TD3算法）和最优传输（Optimal Transport）进行分布对齐。

**2. 技术拆解**
- **核心方法**: VLaRL四阶段工作流：1) 微调并冻结VLA，重建对应的数字孪生仿真环境；2) 训练轻量级潜在映射器（Latent Mapper），利用最优传输将仿真VLM表征对齐到真实分布；3) 在仿真中训练残差RL策略；4) 在真机部署，直接输入真实VLM表征，无需映射器和在线自适应。
- **关键细节**: 
  - **输入输出**：残差策略输入为降维后的VLM潜在向量（1024或2048维）、标称VLA动作（7维）、本体感知和腕部3维笛卡尔力；输出为7维残差动作。最终执行动作 = 标称动作 + α * 残差动作（α=0.10）。
  - **模型结构**：VLA全程冻结；潜在映射器为4层Transformer编码器（16个注意力头），在token序列mean pooling前操作，带初始化为0的可学习残差连接（初始表现为恒等映射）；残差策略采用非对称Actor-Critic结构，Actor和Critic均为4层ReLU MLP（隐藏层1024），Critic在仿真中可使用特权状态。
  - **规模与超参**：残差RL训练60,000步，batch size 256，折扣因子0.99。映射器使用Sinkhorn散度训练（λ_τ=0.5, ε=0.05, 50次迭代）。
- **训练/优化目标**: 
  - **映射器**：基于最优传输的分布对齐损失，包含Frobenius范数距离和轨迹进度惩罚。
  - **残差RL**：TD3算法的Actor-Critic损失，结合任务进度与终端成功奖励，并引入基于演示数据的残差目标辅助正则化项及残差动作幅值正则化，以稳定学习过程。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：4个接触密集型任务（按按钮、推方块、叠杯子、关抽屉），使用Franka Research 3机器人和MuJoCo仿真。每个任务收集32个真实遥操作演示用于微调和构建数字孪生。
  - **对比对象**：冻结的基础VLA模型（Flower和GR00T N1.7），以及消融变体（w/o VLM latent, w/o Mapper）。
- **评价指标**: 仿真和真实世界中的任务成功率（Success rate）。真机每个条件评估40次试验。
- **主要结果**: 
  - VLaRL在所有8种任务-骨干组合中均提升了真机成功率。例如，Flower按按钮任务从67.5%提升至100.0%，推方块从22.5%提升至50.0%；GR00T N1.7叠杯子从17.5%提升至45.0%。
  - 消融实验表明，去掉潜在映射器会导致性能断崖式下降（推方块和叠杯子成功率降至0），去掉VLM潜在表征也会显著降低性能，证明了潜在对齐和潜在条件输入的核心作用。
  - 在未见物体（星形/三角形方块，不同颜色杯子）的泛化测试中，VLaRL依然有效提升了成功率（如推方块从40.0%提升至57.5%），且保留了VLA原有的指令依赖行为。

### 6. 🔥 [Fast Plans, Faithful Actions: Closing the Planning-Execution Gap in Hierarchical Vision-Language-Action Models] (快速规划，忠实执行：弥合分层视觉-语言-动作模型中的规划-执行鸿沟)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.30833` | [点击跳转](https://arxiv.org/abs/2609.30833)

**0. 论文标题**
- **英文标题**: Fast Plans, Faithful Actions: Closing the Planning-Execution Gap in Hierarchical Vision-Language-Action Models
- **中文标题**: 快速规划，忠实执行：弥合分层视觉-语言-动作模型中的规划-执行鸿沟
- **研究机构**: 原文未提及
- **一句话总结**: 针对分层VLA模型中规划推理慢和规划结果被低层执行器忽略的问题，提出了按路点分块的自回归解码（Block-AR）来大幅降低延迟，并设计了归一化目标调制（NGM）机制强迫执行器真正利用规划的路点信息。

**1. 整体逻辑**
- **研究任务**: 优化分层视觉-语言-动作（VLA）模型（高层规划器+低层动作专家）的推理延迟，并解决规划器与执行器之间的信息不对齐问题。
- **研究动机**: 现有的分层VLA（如基于 $\pi_{0.5}$ 的 waypoint 架构）存在两个致命缺陷：1) 规划器使用逐 token 的自回归解码（Token-AR）生成路点，导致前向传播次数极多（如57次），推理延迟远超动作执行时间；2) 规划器生成的空间目标端点对低层执行器的动作生成几乎没有实际影响，执行器“无视”了规划结果，存在严重的规划-执行不对齐。
- **本质改动**: 将逐 token 解码改为与路点对齐的块自回归解码（Block-AR）以压缩推理深度；同时引入归一化目标调制（NGM），通过深层路径注入和防捷径训练，打破执行器对视觉/语言信号的过度依赖，迫使其真正遵循规划的路点。
- **技术溯源**: 基于 $\pi_{0.5}$ (Physical Intelligence) 架构。规划器采用 PaliGemma (SigLIP + Gemma-2B)，执行器采用 300M 参数的 Gemma 动作专家（基于 flow matching 训练）。

**2. 技术拆解**
- **核心方法**: 
  1. **Waypoint-aligned Block-AR**: 规划器每次前向传播直接生成一个完整的路点块（包含目标构型、夹爪状态、持续时间），而不是逐个 token 生成。块内采用双向注意力，块间保持因果注意力。
  2. **Normalized Goal Modulation (NGM)**: 为执行器增加一条深层的目标注入路径。将目标位移归一化后通过零初始化的 MLP 映射为残差，加到执行器每一层的 AdaRMS 条件中。为防止执行器走捷径（直接积分位移而不看图像），引入了相位门控（仅在去噪粗粒度阶段开启）、条件噪声（给端点加噪）和 dropout（随机替换为空嵌入）进行 anti-shortcut 训练。
- **关键细节**: 
  - **路点表示**: 复用 PaliGemma 词表尾部 338 个 token。一个路点包含 6 个构型维度、夹爪状态和持续时间（1-32，0表示结束）。
  - **Block-AR 规模**: 最大解码 7 个块。在 LIBERO 中只需 8 次前向传播（1次 prefill + 7次块解码）；在 16 自由度实机上也只需 8 次。
  - **NGM 细节**: 位移归一化使用 MAD 和 std 计算。相位门控函数为 $g(t) = \text{clip}((t-0.2)/0.3, 0, 1)$。训练时端点加噪 $\sigma_c=0.7$，15% 概率替换为 null embedding。
  - **微调设置**: 使用 LoRA (rank 16) 微调规划器、视觉编码器和执行器，可训练参数约 46M-49M。
- **训练/优化目标**: 规划器使用交叉熵损失（$\mathcal{L}_{CE}$），执行器使用 Flow Matching 损失（$\mathcal{L}_{FM}$）。总优化目标为 $\nabla \mathcal{L}_{CE} + 1.7 \nabla \mathcal{L}_{FM}$，并保留了知识绝缘（knowledge insulation）机制。

**3. 实验结果**
- **实验设置**: 
  - **仿真**: LIBERO 四个子集（Spatial, Object, Goal, Long），1693 个 episode 训练，每个子集 500 个 episode 评估。
  - **实机**: Rokae AR5-5 双臂机器人，3 个双臂任务（pepper-banana placement, pepper swap, shelf placement），120 个 episode 训练，每个任务 20 次试验。
  - **对比对象**: 官方 $\pi_{0.5}$，以及作者搭建的 Waypoint Token-AR + suffix cond，Block-AR + suffix cond。
- **评价指标**: 
  - **性能指标**: 任务成功率（%）。
  - **效率指标**: 规划延迟（ms），运动占空比（Motion duty cycle, %）。
  - **对齐诊断指标**: 端点敏感度（$S_{endpoint}$），以及擦除端点后的成功率下降幅度（Utility $U$）。
- **主要结果**: 
  - **推理加速**: Block-AR 将 VLM 最大前向传播次数从 57 降到 8。实机规划延迟从 1094 ms 降至 125 ms（8.7倍加速），运动占空比从 29% 提升至 66%。
  - **仿真成功率**: Block-AR + NGM 在 LIBERO 四个子集平均成功率从 95.85% (Block-AR+suffix) 提升至 98.45%，其中 LIBERO-Long 从 91.0% 提升至 96.2%。整体比官方 $\pi_{0.5}$ 的 96.85% 提升 1.6 个点。
  - **规划-执行对齐**: 引入 NGM 后，端点敏感度从 0.6% 大幅提升至 42.6%；在测试时擦除规划端点会导致成功率下降 7.4 个点（证明执行器真正用上了规划信息），同时保持了对图像变化的高敏感度（82%）。
  - **实机表现**: Token-AR 成功 48/60，Block-AR 成功 46/60，Block-AR+NGM 成功 51/60。Block-AR 还将首个路点的关节角预测误差降低了 28%。

### 7. 🔥 [Praxis: Distilling Physical Interaction Priors from Egocentric Videos for Generalizable Whole-Body Manipulation] (Praxis：从自我中心视频中提取物理交互先验以实现可泛化的全身操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.30735` | [点击跳转](https://arxiv.org/abs/2609.30735)

**0. 论文标题**
- **英文标题**: Praxis: Distilling Physical Interaction Priors from Egocentric Videos for Generalizable Whole-Body Manipulation
- **中文标题**: Praxis：从自我中心视频中提取物理交互先验以实现可泛化的全身操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出Praxis框架，仅凭单次人类自我中心视频演示，结合闭环姿态校准与在线视触觉反馈，实现人形机器人在动态环境下的长时程、免训练全身灵巧操作。

**1. 整体逻辑**
- **研究任务**: 移动人形机器人的长时程全身灵巧操作（包含远距离导航、基座姿态校准和接触丰富的精细操作）。
- **研究动机**: 现有人形机器人全身控制多依赖大量特定任务数据或强化学习训练，难以在动态变化环境中仅凭有限数据实现高泛化性的精细接触操作；需要一种系统既能把物体带入可达工作空间，又能在物体位姿变化时保持关键的“手-物”交互几何。
- **本质改动**: 摒弃对大量机器人遥操作数据或策略重训练的依赖，转而从单次人类自我中心RGB-D视频中提取“以物体为中心的交互几何先验”，并通过在线感知和触觉反馈进行闭环重定位与校准。
- **技术溯源**: NaVILA（视觉语言导航）、HOMIE（全身平衡控制）、FoundationPose++（6D位姿估计）、LISA（图像分割）、MANO/MediaPipe（手部重建与关键点）、Qwen3.8-27B（在线状态验证）。

**2. 技术拆解**
- **核心方法**: Praxis框架分为三个协同阶段：1) 视觉语言导航至目标附近；2) 闭环姿态校准，调整机器人基座使目标物体进入机械臂末端执行器逆运动学(IK)误差较小的“操作就绪”空间；3) 基于单次视频提取的灵巧操作，结合在线视觉重定位和触觉抓取调节。
- **关键细节**: 
  - **硬件系统**: Unitree G1人形机器人 + BrainCo Revo2触觉灵巧手，头戴D435i，躯干L515。控制频率50Hz，视觉25Hz。
  - **动作提取**: 从RGB-D视频中用MANO提取手腕位姿，MediaPipe提取手部关键点，将轨迹压缩为关键帧并进行机器人空间IK与碰撞验证。
  - **在线适应**: 利用FoundationPose++实时估计物体6D位姿，将演示中的末端执行器相对位姿重定位到新物体位姿上；利用触觉传感器估计接触刚度，基于库仑摩擦模型动态调整法向抓取力以防滑动。
- **训练/优化目标**: 
  - **导航模块**: 用LoRA在150条混合采集轨迹上微调NaVILA，增加左右平移动作；底层使用PPO训练的HOMIE策略保持全身平衡。
  - **操作模块**: 免训练（Training-free），直接通过几何映射、关键帧插值和物理约束（如防滑动摩擦模型）生成控制指令，无需针对特定任务重训练操作策略。

**3. 实验结果**
- **实验设置**: 
  - **任务**: 5个真实世界长时程全身操作任务（Hand Over, Pour Water, Pull Drawer, Open Lid, Manipulate Pipette），包含3m和5m长距离导航测试。
  - **对比对象（baseline）**: $\pi_{0.5}$ (视觉语言动作模型), YOTO (单视频双臂操作), OKAMI (单视频模仿)。
- **评价指标**: 逐步成功率（step-wise success rates）、平均完成步数（Avg. Len.）、长距离成功率、抗干扰恢复成功率。
- **主要结果**: 
  - 在5个任务上的平均成功率达到76.97%，显著优于YOTO (66.67%)、OKAMI (37.58%) 和 $\pi_{0.5}$ (30.91%)。
  - 长距离（3m和5m）平均成功率分别达到75%和50%。
  - 在需要精细接触的 Manipulate Pipette 任务上优势最大（63.64% vs YOTO的45.45%）。
  - 消融实验表明，移除触觉反馈会使平均成功率从76.97%降至63.64%。
  - 在外部物理干扰下，系统通过在线验证（Qwen3.8-27B）和重规划展现出良好的恢复能力（如Pour Water任务中受干扰后成功率仍保持在70%-90%）。

### 8. 🔥 [HuGo: LLMs as Whole-Body Policy Code Designers for Humanoid Loco-Manipulation] (HuGo：大语言模型作为人形机器人全身运动操作策略代码设计师)
- **研究机构**: `ICON Lab`
- **Arxiv ID**: `2609.30594` | [点击跳转](https://arxiv.org/abs/2609.30594)

**0. 论文标题**
- **英文标题**: HuGo: LLMs as Whole-Body Policy Code Designers for Humanoid Loco-Manipulation
- **中文标题**: HuGo：大语言模型作为人形机器人全身运动操作策略代码设计师
- **研究机构**: ICON Lab
- **一句话总结**: 本文提出HuGo框架，让LLM直接生成并迭代优化人形机器人高层策略代码，结合冻结的底层全身控制策略，实现无需任务特定奖励设计或示教数据的运动操作。

**1. 整体逻辑**
- **研究任务**: 人形机器人的运动操作（loco-manipulation），即协调移动与物体交互（如过门、按按钮、推/抬箱子）。
- **研究动机**: 现有人形机器人运动操作多依赖强化学习或示教学习，每个新任务都需要重新设计奖励函数或收集示教数据，扩展成本高。直接用LLM控制高维关节不现实，且现有基于LLM的方法多依赖预设的技能库或模块。
- **本质改动**: 把LLM当成高层策略代码的“程序员”，直接生成底层冻结策略能看懂的高级命令（如速度、末端位置），并通过分析执行轨迹和视频帧让LLM自己改代码（Code Diff），完全免除任务特定的奖励设计和示教收集。
- **技术溯源**: 基于大语言模型（gpt-5.4）、Code as Policies（代码作为策略）范式，以及现有的全身控制底层策略（如 rl_isaac 和 SONIC）。

**2. 技术拆解**
- **核心方法**: 
  1. 零样本生成：给LLM任务描述、机器人状态和底层接口，直接写闭环控制代码。
  2. 轨迹评估：在仿真里跑多次，挑出失败轨迹，让LLM写分析函数提取数值摘要和关键视频帧，给出诊断反馈。
  3. 迭代修正：根据反馈让LLM写局部代码diff来改错。采用“深度-轮次”机制（最多7个深度，每深度3轮），改好了就进入下一深度，改不好就换种改法。
  4. Best-of-N：因为LLM写代码有随机性，独立跑N次（如10次），挑成功率最高的。
- **关键细节**: 
  - 输入输出：输入是任务文本、数值观测（无原始图像）、底层策略接口（10维命令：基座速度/航向、左右手位置、身高）。输出是带内部状态（如任务阶段）的可执行策略代码。
  - 评估反馈：结合数值摘要和LLM挑选的关键帧+均匀采样帧（固定帧预算10帧）。
  - 底层策略：使用两种冻结的底层策略（rl_isaac 运行在 50Hz，sonic 运行在 10Hz）。
  - LLM：使用 gpt-5.4。
- **训练/优化目标**: 无传统的梯度训练和损失函数。优化目标是最大化任务成功率。核心机制是基于执行反馈的LLM代码编辑，通过Best-of-N和迭代修正逼近最优策略。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：IsaacSim 仿真环境中的5个运动操作任务（过低门、过窄门、按按钮、推箱子、抬箱子），以及 Unitree G1 真机环境。
  - 对比对象（baseline）：高层强化学习（High-level RL，使用PPO和手工奖励）、基于示教的HDMI（模仿人类视频提取的动作）。
  - 硬件测试：Unitree G1 人形机器人，使用动捕系统提供观测。
- **评价指标**: 任务成功率（%），仿真测100个保留的初始状态，真机测15次物理试验。
- **主要结果**: 
  - 仿真表现：HuGo在5个任务中4个成功率近80%以上（过门接近100%），远超高层RL baseline（通常不到20%）。对比HDMI，按门任务持平（100% vs 99.95%），搬箱子任务达到81.25%（HDMI为98.4%）。
  - 修正效果：迭代修相比零样本生成提升了最高40个百分点的成功率。
  - 真机迁移与修正：仿真策略零样本上真机，按按钮成功率93.3%，抬箱子66.7%。针对上真机后成功率暴跌的策略（从90%掉到20%），直接在真机上跑修正循环，3个深度后恢复到90%，无需真实示教。
  - 成本：拿一个靠谱策略（Best-of-10）大概花11美元API费和几小时，远低于RL训练（两天起步且需手工调参）。
