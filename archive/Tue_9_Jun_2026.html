            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [MemoryVLA++: Temporal Modeling via Memory and Imagination in Vision-Language-Action Models] (MemoryVLA++：通过记忆与想象在视觉-语言-动作模型中进行时序建模)
- **研究机构**: `清华大学、香港大学、Dexmal、StepFun`
- **Arxiv ID**: `2606.09827` | [点击跳转](https://arxiv.org/abs/2606.09827)

**0. 论文标题**
- **英文标题**: MemoryVLA++: Temporal Modeling via Memory and Imagination in Vision-Language-Action Models
- **中文标题**: MemoryVLA++：通过记忆与想象在视觉-语言-动作模型中进行时序建模
- **研究机构**: 清华大学、香港大学、Dexmal、StepFun

**1. 整体逻辑**
- **研究任务**: 机器人操作（特别是需要长时序依赖、历史记忆和未来预测的任务，例如判断按钮是否已按下、在动态传送带上抓取移动物体）。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型主要依赖当前单帧观测，缺乏时序建模能力。如果直接拼接历史帧，计算量大且存在大量时间冗余；如果直接生成未来的像素级视频，计算成本高且容易把视觉预测误差传递给动作生成。
- **本质改动**: 受认知科学启发，给VLA模型加上“记忆”（处理过去）和“想象”（处理未来）。用记忆库存取和压缩历史特征，用世界模型在潜空间生成未来特征，将过去、现在、未来的特征融合后指导动作生成。
- **技术溯源**: 视觉-语言基座采用 Prismatic VLM (7B，包含 DINOv2、SigLIP 和 LLaMA-7B)；动作头采用 Diffusion Policy（扩散策略）；未来预测采用预训练的视频生成世界模型（World Model）。

**2. 技术拆解**
- **重点改进**: 
  1. **记忆模块（处理过去）**: 构建感知-认知记忆库（PCMB），分别存储历史的低层视觉细节和高层语义。当前特征去查询记忆库，通过门控机制融合，并在记忆库满时合并最相似的相邻项以压缩冗余。
  2. **想象模块（处理未来）**: 放弃昂贵的像素级视频预测，改用世界模型在潜空间进行“部分去噪”来生成未来的多尺度特征（Latents），并在记忆特征的引导下将其与当前特征融合。
- **架构细节**: 
  - **输入**: 当前RGB图像 + 语言指令。
  - **工作记忆生成**: 图像经 DINOv2+SigLIP 提取特征后分两支：一支压缩成“感知token”（保留操作细节），另一支与语言指令拼接后过 LLaMA-7B 得到“认知token”（提取高层语义）。两者组成当前的工作记忆。
  - **记忆检索与融合**: 工作记忆通过 Cross-attention 查询 PCMB 获取历史上下文，通过门控机制（Gate）与当前特征融合。PCMB 采用冗余感知合并策略（计算相邻项余弦相似度并平均）来控制容量。
  - **未来想象与整合**: 当前观测和指令送入世界模型，在潜空间去噪得到未来特征。用融合后的记忆特征去引导和整合这些未来特征，得到全时序特征。
  - **输出**: 全时序特征送入扩散动作头，输出未来 T 步的 7-DoF 机械臂动作（包含平移、旋转和夹爪状态）。支持单臂和双臂（如ARX5）配置。
- **核心 Loss**: 主 Loss 为扩散动作头的去噪 Loss（用于预测连续动作序列）；辅助 Loss 包含世界模型在潜空间的去噪/重建 Loss。整体为端到端训练。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**: Libero, SimplerEnv, Mikasa-Robo, Calvin, Libero-Plus。
  - **真机**: 3种机器人平台（包含单臂和双臂），涵盖通用操作、长时序记忆依赖任务、长时序想象依赖任务。
  - **Baseline**: 典型的仅依赖当前帧的 VLA 模型（如 OpenVLA 等）以及前作 MemoryVLA。
- **评价指标**: 仿真环境使用任务成功率（Success Rate）或 Calvin 的序列得分；真机环境使用任务成功率。
- **实验结果**: 
  - **仿真通用任务**: Libero 成功率 98.4%，SimplerEnv 74.0%（比 baseline 最高提升 16.7%）。
  - **仿真长时序任务**: Mikasa-Robo 成功率 44.4%（提升 15.0%），Calvin 得分 4.29。
  - **仿真鲁棒性与泛化**: Libero-Plus 成功率 82.7%。
  - **真机任务**: 通用操作成功率 85%（+9%），长时序记忆依赖任务 83%（+26%），长时序想象依赖任务 77%（+28%）。在需要预测动态物体和依赖历史状态的任务上提升尤为显著。

### 2. 🔥 [iMaC: Translating Actions into Motion and Contact Images for Embodied World Models] (iMaC：将动作转化为具身世界模型的运动与接触图像)
- **研究机构**: `北京邮电大学, 清华大学, GigaAI, 南洋理工大学`
- **Arxiv ID**: `2606.09813` | [点击跳转](https://arxiv.org/abs/2606.09813)

**0. 论文标题**
- **英文标题**: iMaC: Translating Actions into Motion and Contact Images for Embodied World Models
- **中文标题**: iMaC：将动作转化为具身世界模型的运动与接触图像
- **研究机构**: 北京邮电大学, 清华大学, GigaAI, 南洋理工大学

**1. 整体逻辑**
- **研究任务**: 具身世界模型（Embodied World Models），具体指根据当前多视角观测和未来动作序列，预测未来视频，用于机器人策略的闭环推演和评估。
- **研究动机**: 现有的动作条件视频模型通常把动作编码成一维向量塞进模型，让模型自己去“猜”动作带来的空间变化。但在真实机械臂操作中，几厘米的误差就会导致抓空或碰撞，一维向量无法精确表达这种空间接触关系，导致模型生成的视频在物理交互上不准。
- **本质改动**: 把抽象的动作向量变成密集的“图像级”控制信号。通过运动学渲染出机械臂未来的样子，通过点云计算出接触距离图，让视频生成模型直接“看着”这些空间控制图来生成未来视频。
- **技术溯源**: 视频生成骨干基于 WAN2.2 图像到视频 (IT2V) DiT 模型；深度估计基于 Depth Anything 3 (DA3)。

**2. 技术拆解**
- **重点改进**: 
  1. **运动图像 (Motion Images)**: 利用机器人的 URDF 和正运动学，把未来的关节动作直接渲染成未来视角的机器人图像。这直接告诉模型机械臂未来在空间中的确切位置和姿态，不用模型去猜。
  2. **接触图像 (Contact Images)**: 用深度图转成点云，计算“当前场景到未来夹爪”以及“未来机械臂到当前场景”的最短距离，生成两张距离热力图。这告诉模型哪里即将发生物理接触。
  3. **训练时推演 (Training-time Rollout)**: 在训练阶段，让模型使用自己生成的上一段视频的最后一帧作为下一段的输入参考，提前适应闭环生成，减少误差累积（曝光偏差）。
- **架构细节**: 
  - **输入输出**: 输入是当前多视角 RGB（1个头部+2个腕部相机，拼成一张马赛克图）以及伪彩色的深度图（拼在 RGB 下方）。输出是未来的 RGB-D 视频。
  - **模型结构**: 控制信号（1张运动图 + 2张接触图）各自经过独立的 patchify 层后，在 latent 空间直接加到加噪的未来视频 token 上。模型分块（chunk-wise）自回归生成视频。
  - **模型规模**: 基于 WAN2.2 DiT，具体参数量文中未强调，重点在于控制分支的设计。
- **核心 Loss**: 
  - **主 Loss**: Flow Matching Loss（计算预测的 flow 和真实的 flow 之间的 MSE 损失），用于预测未来视频和深度的 latent。
  - **辅助任务**: 深度预测。深度和 RGB 一起预测，主要目的是为了在后续推演中构建点云和接触图像提供几何状态。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 8个具有挑战性的真实机械臂长程操作任务（包含遥操作和策略推演收集的成功与失败数据）。
  - **Baseline**: Ctrl-World, ABot-PhysWorld 等现有的动作条件世界模型。
- **评价指标**: 
  - **视频生成质量**: MSE, FID, PSNR, SSIM, FVD（评估生成的视频和真实视频的差距）。
  - **策略评估能力（核心）**: 世界模型打分与真实世界策略成功率之间的皮尔逊相关系数（评估模型能不能当合格的“裁判”来挑选好的策略）。
- **实验结果**: 
  - **视频质量**: iMaC 在 FID, PSNR, SSIM, FVD 上全面优于 baseline，MSE 与最优持平。运动图和接触图显著提升了动作跟随的准确性。
  - **当裁判的准确度**: 在 8 个任务中的 6 个任务里，世界模型打分与真实世界成功率呈现强正相关（相关系数 0.833 - 0.956），能准确区分不同策略和不同 checkpoint 的性能优劣。
  - **失败分析**: 剩下 2 个任务相关性较低（0.678 和 0.428），原因是相机视角存在高度信息的盲区（例如无法准确判断盒子耳朵是否抬起越过了侧边，或簸箕入口是否与桌面齐平），导致模型缺乏关键的空间几何信息。

### 3. 🔥 [AHA-WAM: Asynchronous Horizon-Adaptive World-Action Modeling with Observation-Guided Context Routing] (AHA-WAM：基于观察引导上下文路由的异步视界自适应世界-动作建模)
- **研究机构**: `上海交通大学、上海AI实验室、百度智能云、香港大学`
- **Arxiv ID**: `2606.09811` | [点击跳转](https://arxiv.org/abs/2606.09811)

**0. 论文标题**
- **英文标题**: AHA-WAM: Asynchronous Horizon-Adaptive World-Action Modeling with Observation-Guided Context Routing
- **中文标题**: AHA-WAM：基于观察引导上下文路由的异步视界自适应世界-动作建模
- **研究机构**: 上海交通大学、上海AI实验室、百度智能云、香港大学

**1. 整体逻辑**
- **研究任务**: 机器人操作（基于视觉、语言和本体感受的闭环控制策略）。
- **研究动机**: 现有的世界-动作模型（WAM）将视频预测和动作生成绑定在相同的短时间尺度上。这导致视频分支浪费算力去预测相邻帧的微小变化，而这些密集帧变化对实际控制来说信息量很弱。世界预测和动作执行在时间抽象上存在结构错配：视频模型更适合做长视界规划，而动作模型需要紧密耦合实时控制环做短视界修正。
- **本质改动**: 将世界-动作建模解耦为异步的双时间尺度架构。用低频的视频模型做长视界的世界规划，用高频的动作模型做短视界的闭环执行。
- **技术溯源**: 基于 Diffusion Transformer (DiT) 架构。视频分支使用了预训练的 Wan2.2-5B 视频模型，动作生成基于 Flow-matching（流匹配）。

**2. 技术拆解**
- **重点改进**: 
  1. **双DiT异步架构**：将模型拆分为视频DiT（慢）和动作DiT（快）。视频DiT生成可复用的长视界上下文，动作DiT通过层间联合注意力机制消费该上下文来生成动作。
  2. **观察引导的视频上下文路由 (OVCR)**：异步执行会导致规划器上下文随着时间推移变得过时。OVCR利用最新的视觉观测构建查询向量，去动态检索和更新规划器的层间KV上下文，避免把密集的视觉token直接塞给高频动作模型。
  3. **视界自适应偏移训练**：在训练时随机偏移动作chunk在视频规划窗口内的起始位置，让动作模型学会在不同的相位偏移下消费规划器上下文，从而适应异步推理带来的相位错位。
  4. **滚动规划器记忆**：视频DiT内部维护一个FIFO的KV记忆，保留历史场景信息，以支持长视界操作任务。
- **架构细节**: 
  - **输入输出**：输入为视觉观测历史、本体感受状态和语言指令；输出为短视界的可执行动作chunk。
  - **模型结构**：包含视频DiT（由Wan2.2-5B初始化）和动作DiT（与视频DiT层数相同的轻量级DiT）。视觉输入先经过预训练VAE编码。
  - **推理机制**：推理时去掉显式的视频帧解码，视频DiT仅用于异步预填充（prefill）更新规划器上下文，动作DiT在关键路径上高频运行。
- **核心 Loss**: 
  - 采用联合流匹配（Joint Flow-Matching）目标。
  - 主 Loss 为动作流匹配 Loss ($\mathcal{L}_a$)，辅助任务为视频流匹配 Loss ($\mathcal{L}_v$)，用于训练世界模型。总 Loss 为 $\mathcal{L} = \mathcal{L}_a + \lambda \mathcal{L}_v$。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：RoboTwin 2.0 仿真环境（50个任务），以及4个真实世界操作任务（柔性操作、长视界整理、精细工具使用、空间泛化）。
  - **Baseline**：主流的 VLA 和 WAM 模型（如 Fast-WAM, $\pi_{0.5}$ 等）。
- **评价指标**: 
  - 任务成功率（仿真和真机）。
  - 闭环控制频率和推理延迟。
  - 分布外（OOD）泛化测试中的性能下降幅度。
- **实验结果**: 
  - **仿真表现**：在 RoboTwin 2.0 的50个任务上平均成功率达 92.80%，达到 SOTA 水平。
  - **真机表现**：4个真实任务平均成功率 78.3%。在4个 OOD 测试维度中，性能下降幅度最小，鲁棒性与 $\pi_{0.5}$ 相当。
  - **推理速度**：常规异步推理的闭环控制频率达 24.17 Hz（比 Fast-WAM 快 4.59 倍）；经过 ODE 蒸馏和 CUDA 优化后，极限控制频率可达 56.9 Hz（比 Fast-WAM 快 10.82 倍）。

### 4. 🔥 [Your Model Already Knows: Attention-Guided Safety Filter for Vision-Language-Action Models] (你的模型已经知道：基于注意力引导的视觉-语言-动作模型安全过滤器)
- **研究机构**: `University of California Los Angeles (UCLA)`
- **Arxiv ID**: `2606.09749` | [点击跳转](https://arxiv.org/abs/2606.09749)

**0. 论文标题**
- **英文标题**: Your Model Already Knows: Attention-Guided Safety Filter for Vision-Language-Action Models
- **中文标题**: 你的模型已经知道：基于注意力引导的视觉-语言-动作模型安全过滤器
- **研究机构**: University of California Los Angeles (UCLA)

**1. 整体逻辑**
- **研究任务**: 解决 VLA（视觉-语言-动作）模型在机器人操作任务中的实时碰撞避免问题（即推理时的安全过滤）。
- **研究动机**: 现有的安全过滤器通常依赖外部 VLM 来识别场景中的障碍物。但 VLM 计算太慢，只能在任务开始时（初始化）跑一次。一旦环境中有动态障碍物（如物体被移动、人走进工作区），初始化时的障碍物信息就会过时，导致碰撞。
- **本质改动**: 不额外引入笨重的感知模型，而是直接利用 VLA 模型内部特定注意力头（attention heads）的输出，来实时区分“当前要操作的目标”和“其他障碍物”。把目标从障碍物列表中剔除，剩下的全当障碍物，结合控制障碍函数（CBF）进行实时的安全约束。
- **技术溯源**: 基于 $\pi_{0.5}$ / OpenVLA 等 VLA 基座模型，结合 CBF-QP（控制障碍函数-二次规划）和 YOLOE（用于实例分割与跟踪）。

**2. 技术拆解**
- **重点改进**: 提出名为 Knows 的免训练安全框架。核心创新在于“注意力引导的目标识别”，将 VLA 内部的注意力图转化为实时的目标/障碍物分离信号，解决了动态环境下安全过滤延迟过高的问题。
- **架构细节**: 
  - **目标识别**: 在 VLA 前向传播时，通过 hook 提取特定层（如 layer 12, head 3）的 action-query 到 vision-key 的注意力图。将注意力权重映射到图像 patch 上，结合物体的 2D mask 计算每个物体的“注意力密度”。在滑动窗口内累积密度，密度最高且与第二名差距超过阈值的物体被认定为“目标”。
  - **障碍物跟踪**: 初始化时用 YOLOE 分割所有物体并拟合 3D 椭球。运行时为了省算力，只根据新的 mask 更新椭球的中心点（质心），保持形状矩阵不变。
  - **安全过滤**: 将 VLA 输出的候选动作和实时更新的障碍物椭球集合输入 CBF-QP 求解器，输出满足不碰撞约束的安全动作。
- **核心 Loss**: 本文是免训练（training-free）的推理时方法，没有引入新的训练 Loss。安全过滤依赖 CBF-QP 的二次规划目标函数（即最小化对 VLA 原始输出动作的修改幅度）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: SafeLIBERO。作者在原有基础上扩展了 Level III 难度，加入了在 episode 中对抗性移动的动态障碍物。
  - **Baseline**: 1) No CBF（无安全过滤的原始 VLA）；2) Naive（仅在初始化时识别一次障碍物的方法，模拟现有基于 VLM 的延迟方案）；3) Oracle（使用仿真器上帝视角的特权方法）。
- **评价指标**: 成功率 (SR)、碰撞率 (CR)、安全成功率 (SSR，即成功且无碰撞，核心指标)。
- **实验结果**: 
  - **静态场景 (Level I & II)**: Knows 大幅降低了碰撞率，SSR 与 Naive 方法基本持平，证明在静态下没有牺牲任务成功率。
  - **动态场景 (Level III)**: Naive 方法因障碍物移动导致碰撞率飙升；Knows 凭借实时的目标识别和障碍物跟踪，SSR 平均比 Naive 方法高出 43%（例如在 object 套件中从 40% 提升至 70.5%），表现接近使用上帝视角的 Oracle。
  - **实时性**: 整个安全包装器的额外计算开销仅为 49.3ms，其中注意力提取仅耗时 0.8ms，完全满足 20Hz 的实时控制频率要求。

### 5. 🔥 [CT-VAM: A Cerebello-Thalamic-Inspired Vision-Action Model for Efficient Visuomotor Control] (CT-VAM：受小脑-丘脑启发的高效视觉运动控制模型)
- **研究机构**: `中国科学技术大学 (University of Science and Technology of China)`
- **Arxiv ID**: `2606.09572` | [点击跳转](https://arxiv.org/abs/2606.09572)

**0. 论文标题**
- **英文标题**: CT-VAM: A Cerebello-Thalamic-Inspired Vision-Action Model for Efficient Visuomotor Control
- **中文标题**: CT-VAM：受小脑-丘脑启发的高效视觉运动控制模型
- **研究机构**: 中国科学技术大学 (University of Science and Technology of China)

**1. 整体逻辑**
- **研究任务**: 机器人操作中的底层视觉运动控制（Visuomotor Control），即根据视觉和本体感觉输入生成机器人动作。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型在底层高频控制时，每个控制步都要用大模型处理一遍文本指令，导致推理极慢、显存占用大，无法在边缘设备（如Jetson）上部署。但实际上，底层动作执行主要依赖视觉反馈，语言只在任务开始时提供意图，没必要在每一步都重复处理。
- **本质改动**: 将“语言理解”与“底层动作执行”解耦。底层策略不再输入原始文本，而是输入轻量级的任务条件（如任务ID）。同时，改进了注意力机制以防止视觉特征淹没任务特征，并引入异步推理机制来掩盖推理延迟。
- **技术溯源**: 基于 DINOv3-S+（视觉编码器）、Rectified Flow（整流流，用于连续动作生成）、Transformer 架构。

**2. 技术拆解**
- **重点改进**: 
  1. **任务条件解耦**：用轻量级任务标识（如 one-hot 向量）替换原始自然语言指令，作为底层策略的唯一任务输入。
  2. **TARS（丘脑动作路由流）**：提出一种流分离的注意力机制。将动作、视觉、本体感觉和任务条件分成四个独立的流进行归一化和路由，防止密集的视觉 token 在注意力计算中把稀疏的任务条件“淹没”。
  3. **FCI（流一致性修复）**：支持异步动作块推理。在当前动作块没执行完时，就提前开始预测下一个块。利用 Rectified Flow 的插值公式约束两个块的重叠部分，保证动作平滑过渡，从而把推理延迟藏在物理执行时间里。
- **架构细节**: 
  - **输入**：双视角图像（主相机+腕部相机）历史、本体感觉历史、任务标识符。
  - **输出**：动作块（Action chunk）。
  - **模型规模**：极小，仅 68M 参数。
  - **TARS 细节**：引入可学习的动作查询（Action Queries）。在 Transformer 每一层，对四个流（自身动作、动作查询、密集视觉/本体感觉、任务条件）分别独立做 LayerNorm 和注意力计算，最后通过门控机制融合。
- **核心 Loss**: Rectified Flow（整流流）的速度场匹配损失，用于训练连续动作生成。无额外的视频重建等辅助任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：LIBERO 基准测试（包含 Spatial, Object, Goal, Long 四个子集）。对比了 OpenVLA, SpatialVLA, $\pi_0$, Diffusion Policy, MDT 等。
  - **真机**：OpenArm 机械臂平台，任务包括倒球（Ball Pouring）、开盒放置等。对比了 $\pi_0$ 和 Diffusion Policy。
- **评价指标**: 
  - **仿真**：任务成功率（Success Rate）。
  - **真机**：任务成功率、任务执行时间、单次推理延迟、实时等效执行频率。
- **实验结果**: 
  - **仿真**：仅 68M 参数的 CT-VAM 在 LIBERO 上平均成功率达到 82.1%，大幅超越同级别的非 VLA 基线（Diffusion Policy 72.4%, MDT 76.1%），并且逼近甚至超越了参数量大几十倍的 VLA 模型（如 7B 的 OpenVLA 76.5%，3.3B 的 $\pi_0$ 86.0%）。
  - **真机**：在倒球任务中，RTX 4080 上的成功率与 $\pi_0$ 相当，明显高于 Diffusion Policy。由于推理步数少（8步 vs $\pi_0$ 的 50 步）且使用了 FCI 异步推理，执行时间更短。最关键的是，模型成功部署在算力受限的 Jetson Orin NX 边缘端，证明了其在资源受限平台上的实际落地能力。

### 6. 🔥 [Targeting World Models to Compromise Robot Learning Pipelines] (通过攻击世界模型破坏机器人学习管道)
- **研究机构**: `Northeastern University, University of Massachusetts Amherst`
- **Arxiv ID**: `2606.09499` | [点击跳转](https://arxiv.org/abs/2606.09499)

**0. 论文标题**
- **英文标题**: Targeting World Models to Compromise Robot Learning Pipelines
- **中文标题**: 通过攻击世界模型破坏机器人学习管道
- **研究机构**: Northeastern University, University of Massachusetts Amherst

**1. 整体逻辑**
- **研究任务**: 针对机器人学习管道中的世界模型（World Models）进行对抗攻击（数据投毒/后门攻击），使下游训练出的机器人策略产生危险行为。
- **研究动机**: 世界模型常被用于生成合成训练数据或模拟环境。传统的数据投毒攻击需要直接篡改数据集或环境，容易被安全检查发现或需要极高的系统权限。作者发现世界模型是一个隐蔽的攻击入口：攻击者只需提供表面安全的遥操作视频，但在像素级加入微小扰动，就能诱导世界模型生成危险数据或破坏环境预测，从而绕过数据安全检查，给下游策略植入后门。
- **本质改动**: 提出两种纯视觉的对抗攻击方法。针对文本条件世界模型，通过图像扰动劫持文本提示（Visual Prompt Hijacking, VPH）；针对动作条件世界模型，通过图像扰动劫持状态转移预测（Visual Transition Hijacking, VTH），使得非目标动作导致预测崩溃，从而强迫下游智能体选择攻击者指定的动作。
- **技术溯源**: 基于 Cosmos-Predict 2.5（文本条件世界模型）以及常规的动作条件世界模型。下游策略涉及 VLA（视觉-语言-动作模型）和 DRL（深度强化学习）。

**2. 技术拆解**
- **重点改进**: 
  - **VPH（视觉提示劫持）**: 在输入图像中加入微小扰动，使得世界模型在处理“安全提示词”时，其内部的语义编码（如交叉注意力或扩散去噪的向量场）与输入“危险提示词”时的编码对齐，从而生成危险轨迹。
  - **VTH（视觉转移劫持）**: 操纵世界模型的潜在编码器。在图像中加入扰动，使得当智能体采取“非目标动作”时，世界模型的未来状态预测发生崩溃（偏离真实分布）；而当采取“目标动作”时，预测恢复正常。以此在 DRL 中形成奖励误导。
- **架构细节**: 
  - **输入**: 带有触发器（Trigger object，如炸弹、刀等特定物体）的机器人观测图像帧。
  - **扰动约束**: 在 LAB 色彩空间内施加 $l_p$ 范数约束，确保扰动在人眼视觉上不可见。
  - **模型结构**: VPH 针对文本条件世界模型（如基于扩散模型的 Cosmos-Predict 2.5，2B 参数），通过优化图像扰动对齐语义编码。VTH 针对动作条件世界模型，通过优化图像扰动操纵潜在空间嵌入的余弦相似度，且该相似度计算条件化于输入动作。
- **核心 Loss**: 
  - **VPH Loss**: 最小化扰动图像在“安全提示”下的语义编码与在“危险提示”下的语义编码之间的距离。
  - **VTH Loss**: 包含两部分。一是让非目标动作下的潜在嵌入余弦相似度最小化（导致预测崩溃）；二是让带有触发器的图像在目标动作下的潜在嵌入与原始干净图像的嵌入余弦相似度最大化（保持正常预测）。同时带有 LAB 空间的扰动幅度约束。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: Libero 任务套件（包含厨房场景如炉子、微波炉等分布内任务，以及礼物盒等分布外任务）。
  - **Baseline**: 无攻击（Clean inputs）情况下的世界模型表现。
- **评价指标**: 
  - **VPH**: 攻击成功率（Attack Success Rate），即世界模型生成危险目标轨迹的比例（通过人工检查评估，避免 VLM 评估误差）。
  - **VTH**: 下游 DRL 策略的后门攻击成功率（遇到触发器时执行目标动作）和隐蔽性（无触发器时保持正常任务成功率）。
- **实验结果**: 
  - **VPH 攻击效果**: 在分布内（In-distribution）相机视角下，攻击成功率较低（大多 0-5%）；但在分布外（Out-of-distribution）相机视角下，攻击成功率显著提升（如礼物盒场景放炸弹达 100%，微波炉放叉子达 90%）。
  - **提示词与物体影响**: 模糊提示词（Vague prompt）比具体提示词（Specific prompt）更容易被攻击成功。攻击成功率也取决于目标物体是否在模型分布内或足够大（如炸药成功率 0%，因为太小或不在分布内）。
  - **整体结论**: 证明了世界模型在分布外和高不确定性设置下非常脆弱。仅通过修改视频帧的像素，就能成功绕过数据检查，实现端到端的后门植入，导致下游 DRL 策略被完全控制。

### 7. 🔥 [$\omega$-EVA: Envision, Verify, and Act with Latent Interactive World Models] ($\omega$-EVA：基于潜在交互式世界模型的设想、验证与执行)
- **研究机构**: `慕尼黑工业大学 (Technical University of Munich, TUM)`
- **Arxiv ID**: `2606.09457` | [点击跳转](https://arxiv.org/abs/2606.09457)

**0. 论文标题**
- **英文标题**: $\omega$-EVA: Envision, Verify, and Act with Latent Interactive World Models
- **中文标题**: $\omega$-EVA：基于潜在交互式世界模型的设想、验证与执行
- **研究机构**: 慕尼黑工业大学 (Technical University of Munich, TUM)

**1. 整体逻辑**
- **研究任务**: 语言条件驱动的机器人视觉操作（根据视觉观察和文本指令生成机器人动作序列）。
- **研究动机**: 现有的VLA或生成式策略通常是“观察直接映射到动作”，无法在执行前评估动作后果。现有的世界模型在推理时要么不参与（仅作为训练时的辅助任务），要么生成像素级视频（计算太慢，无法用于闭环控制）。
- **本质改动**: 在潜在特征空间（Latent Space）构建“设想-验证-执行”闭环。策略先给出一个初始动作，世界模型预测该动作导致的潜在未来特征，然后精炼模块结合“当前特征+预测的未来特征+初始动作”对动作进行修正。全程不生成像素级视频，兼顾了后果推理和推理速度。
- **技术溯源**: 视觉特征提取基于冻结的 DINOv3，语言特征提取基于冻结的 T5，动作生成机制采用 Flow Matching（流匹配）。整体模型规模约 1.2B 参数。

**2. 技术拆解**
- **重点改进**: 将世界模型从“被动的视频/特征预测器”转变为“主动的动作验证器”。通过三阶段训练实现：1）训练动作条件的潜在世界模型；2）训练基于世界模型表征的动作提议策略；3）冻结前两者，训练动作精炼器（Refiner）形成推理时的交互闭环。
- **架构细节**: 
  - **输入输出**: 输入为当前视觉特征（DINOv3 patch tokens）、语言指令（T5 tokens）和动作序列；输出为修正后的动作序列（Action Chunk）。
  - **世界模型 (Stage 1)**: 采用因果多模态注意力机制，包含当前状态、动作、未来查询三个分支。通过随机截断动作序列（Variable-horizon）来预测不同步长的未来特征。同时输出一个与具体动作无关的“动态感知当前表征”（供Stage 2使用）。
  - **动作提议策略 (Stage 2)**: 基于 Flow Matching 的 Query Transformer。以加噪的动作序列为 Query，通过交叉注意力融合世界模型表征和语言特征，输出初始动作提议。
  - **动作精炼器 (Stage 3)**: 接收当前表征、世界模型预测的“初始动作导致的未来表征”、以及初始动作本身，输出最终修正动作。
- **核心 Loss**: 
  - Stage 1: L1 Loss，计算预测的未来潜在特征与真实 DINOv3 未来特征的差异。
  - Stage 2: Flow Matching Loss（流匹配损失），用于训练动作生成策略。
  - Stage 3: Refine Loss（动作重构/模仿损失），用于训练精炼器修正动作。无像素级视频重建 Loss。

**3. 实验结果**
*(注：提供的文本在实验结果部分截断，以下基于实验设置标题及摘要结论进行总结)*
- **数据集和baseline**: 实验在 LIBERO、LIBERO-PLUS（用于测试鲁棒性和迁移能力）以及 RoboTwin 2.0 等仿真基准上进行。对比基线为现有的主流 VLA 模型、扩散策略及传统世界模型方法。
- **评价指标**: 仿真环境中的任务成功率；消融实验中使用了空间表征分析、动作不变性检查、未来特征保真度等指标来评估潜在空间的结构有效性。
- **实验结果**: 
  - 完整的“设想-验证-执行”交互流水线在单臂、双臂、长视野以及受视觉扰动等仿真设置中，一致性地提升了基础提议策略的性能。
  - 消融实验证明，动态感知的当前表征和动作条件的潜在未来反馈，确实为动作修正提供了有效的结构化信息。
  - 在约 1.2B 参数量且无额外大规模机器人数据预训练的情况下，模型展现了良好的性能-规模-数据权衡，验证了将世界模型作为主动反馈模块的可行性。

### 8. 🔥 [Unifying Object-Centric World Models and Diffusion Policy: A Hierarchical Framework for Multi-Stage Robotic Tasks] (统一以物体为中心的世界模型与扩散策略：用于多阶段机器人任务的层次化框架)
- **研究机构**: `New York University (NYU), AMI Labs (Yann LeCun 参与)`
- **Arxiv ID**: `2606.08775` | [点击跳转](https://arxiv.org/abs/2606.08775)

**0. 论文标题**
- **英文标题**: Unifying Object-Centric World Models and Diffusion Policy: A Hierarchical Framework for Multi-Stage Robotic Tasks
- **中文标题**: 统一以物体为中心的世界模型与扩散策略：用于多阶段机器人任务的层次化框架
- **研究机构**: New York University (NYU), AMI Labs (Yann LeCun 参与)

**1. 整体逻辑**
- **研究任务**: 多阶段机器人操作任务（如多物体的抓取、放置、顺序重排等长序列任务）。
- **研究动机**: 现有的视觉世界模型（如基于 JEPA 架构的方法）在机器人控制中通常只能处理单阶段任务（如单纯的 reach 或 grasp），搞不定多阶段任务。主要原因有两个：一是状态表示多用 patch-level 特征，丢失了物体级别的细粒度细节；二是传统的扁平 MPC 规划直接优化长序列动作太难收敛，缺乏层次化的任务分解。
- **本质改动**: 提出 WorldDP 框架，将“以物体为中心的世界模型”与“扩散策略（Diffusion Policy）”结合。高层用世界模型在 MPC 中规划中间子目标（subgoals），低层用扩散策略去执行这些子目标。同时，把世界模型的状态表示从 patch 级改成了 object 级（以物体为中心）。
- **技术溯源**: 基于 DINOv2（提取视觉 patch 特征）、SAM2（提供分割 mask 辅助训练）、JEPA（世界模型架构思想）、Diffusion Policy（低层动作执行器）。

**2. 技术拆解**
- **重点改进**: 
  1. **状态表示升级**：用 Object-Centric Encoder (OCE) 把 DINOv2 的 patch 特征聚合成离散的物体级 embedding。训练时用 SAM2 的 mask 做辅助监督，解决小物体特征在 patch 聚合时丢失的问题。
  2. **层次化规划与执行**：高层用世界模型配合粒子滤波（Particle Filter, PF）优化出中间子目标序列（替代了传统的交叉熵方法 CEM，以应对机器人动作空间的多模态性）；低层用 Goal-Conditioned Diffusion Policy 跟踪执行。
  3. **引入接触预测**：训练了一个轻量的接触预测器（MLP），在 MPC 的 Cost 里加入接触惩罚，逼迫规划出的子目标落在关键的交互帧（如刚抓住物体的瞬间），而不是停在物体旁边。
- **架构细节**: 
  - **OCE (物体中心编码器)**：输入 DINOv2 的 patch 特征，通过 Slot Corrector（交叉注意力 + GRU）输出 $N$ 个 slot，分别代表机器人、背景和各个物体。
  - **动力学模型**：采用 Conditional Diffusion Transformer (CDiT)，12 层，4 个注意力头。输入物体级状态和动作序列的 embedding，自回归预测下一步的物体状态。
  - **低层 DP (扩散策略)**：输入当前和目标的物体级状态（展平）以及机器人末端状态，输出 40 步的动作序列。
- **核心 Loss**: 
  - **OCE 训练**：重构 Loss（预测 patch 特征和真实 patch 特征的 L2 距离） + Tversky Loss（预测 mask 和 SAM2 真实 mask 的分割 Loss）。
  - **动力学模型训练**：MSE Loss（预测的下一步物体状态和真实状态的误差）。
  - **MPC 规划 Cost**：物体状态距离 Loss（预测的最终物体状态和目标物体状态的 MSE） + 接触预测 Loss（交叉熵，促使子目标处发生物理接触）。

**3. 实验结果**
- **数据集和baseline**: 实验在 OGBench 及其变体数据集上进行（变体改变了相机视角和末端颜色以测试泛化性）。任务包括 Cube-Single（单物体移动）和 Cube-Triple（三物体顺序重排）等。对比的 baseline 包括现有的世界模型方法、Diffusion Policy、以及基于扩散的子目标生成方法。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - 在多阶段任务（如 Cube-Triple）上，WorldDP 的成功率显著高于现有的世界模型和单纯的 Diffusion Policy。
  - 消融实验证明：物体级表示比 patch 级表示在细粒度操作上更准；“世界模型规划 + DP执行”的层次化结构比扁平规划更容易收敛；加入接触预测和粒子滤波（PF 替代 CEM）能进一步提升复杂任务的成功率。整体验证了高层物理规划与低层高效执行结合的有效性。

### 9. 🔥 [GEAR-VLA: Learning Geometry-Aware Action Representations for Generalizable Robotic Manipulation] (GEAR-VLA：学习几何感知的动作表示以实现可泛化的机器人操作)
- **研究机构**: `中国科学技术大学 (USTC)、安徽大学、科大讯飞 (iFLYTEK)`
- **Arxiv ID**: `2606.08530` | [点击跳转](https://arxiv.org/abs/2606.08530)

**0. 论文标题**
- **英文标题**: GEAR-VLA: Learning Geometry-Aware Action Representations for Generalizable Robotic Manipulation
- **中文标题**: GEAR-VLA：学习几何感知的动作表示以实现可泛化的机器人操作
- **研究机构**: 中国科学技术大学 (USTC)、安徽大学、科大讯飞 (iFLYTEK)

**1. 整体逻辑**
- **研究任务**: 通用机器人操作，重点解决VLA模型在真实世界中面对未见物体、背景变化以及不同机器人本体（Embodiment）时的泛化问题。
- **研究动机**: 现有VLA模型在实际部署中存在三个痛点：1) 动作token多由底层轨迹量化而来，导致模型只会“死记硬背”轨迹，缺乏真正的具身推理能力；2) 引入3D特征（如深度图）时，容易破坏VLM原有的2D语义空间，导致特征不对齐；3) 跨机器人迁移时，使用特定机器人的动作头或prompt会导致机器人身份与高层语义特征纠缠，降低迁移效率。
- **本质改动**: 提出一套“几何感知动作表示”框架。通过“粗到细”策略先学离散动作语义再学连续动作，避免破坏语义；用零初始化投影层安全地注入3D几何特征；通过“本体规范化”把机器人差异限制在底层接口，保持高层策略表示的共享。
- **技术溯源**: 视觉-语言基座使用 Qwen2.5-VL；3D空间编码器使用 VGGT；连续动作生成使用 DiT (Diffusion Transformer)；动作离散化使用 FAST tokenizer 和 VQ-VAE。

**2. 技术拆解**
- **重点改进**: 
  1. **粗到细的动作学习 (Coarse-to-Fine Policy Learning)**：先让VLM学习离散动作（包括机器人轨迹的FAST token和从视频中提取的隐式动作ID），获得动作语义；然后冻结VLM骨干，挂载一个DiT作为连续动作专家。DiT仅通过VLM隐式动作token的K/V cache进行条件生成，防止连续动作的loss反向传播破坏VLM的语义理解。
  2. **语义对齐的3D融合 (Semantic-Aligned 3D Integration)**：冻结原有的2D视觉编码器以保持语义稳定，引入可训练的3D编码器（VGGT）。通过一个“零初始化”的扩展视觉投影层，将3D特征和2D特征拼接后输入LLM。这保证了训练初期不破坏原有视觉token分布，训练后期再逐渐融合几何结构。
  3. **本体规范化 (Embodiment Canonicalization)**：动作输出端，使用相对于当前末端执行器位姿的相对动作（SE(3)相对变换），避免绝对坐标依赖和动作块内的累积误差；状态输入端，为每个机器人训练一个轻量级的状态投影器，将关节角和末端位姿映射到共享空间，不引入机器人特定的软提示（soft prompts），避免特征纠缠。
- **架构细节**: 
  - **输入**: 多视角RGB图像、语言指令、机器人状态（末端位姿+关节角）。
  - **输出**: 未来动作块（Action chunk，30步，对应1秒，30Hz）。
  - **模型结构**: VLM基于Qwen2.5-VL；3D编码器为VGGT；连续动作专家为DiT（使用Flow Matching）；动作离散化包含FAST tokenizer和因果VQ-VAE。
- **核心 Loss**: 
  1. **VLM预训练Loss**: 自回归Token预测Loss（包含文本、FAST动作token、隐式动作ID等），用于学习离散动作语义和具身推理。
  2. **连续动作Loss**: Flow Matching Loss（用于训练DiT动作专家）。关键操作是使用 `stop_gradient` 截断梯度，确保连续控制优化不会干扰VLM骨干。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**: LIBERO, LIBERO-Plus (零样本OOD), RoboTwin 2.0。对比基线：OpenVLA, WorldVLA, $\pi_0$, UniVLA, $\pi_{0.5}$, X-VLA, ACoT。
  - **真机操作**: AgileX (14-DoF双臂) 和 LDT-01 (16-DoF双臂，预训练未见本体)。任务包括折T恤、折短裤、翻包裹标签。
  - **大规模通用抓取**: 自建benchmark，包含212个未见物体，6360次真机测试。对比基线：$\pi_{0.5}$, DexGraspVLA。
- **评价指标**: 任务成功率 (Success Rate)。
- **实验结果**: 
  - **仿真**: LIBERO平均成功率98.7%（SOTA）；LIBERO-Plus零样本泛化达88.7%（超最强基线ACoT 2.1%）；RoboTwin 2.0 Clean/Random 设置下分别达91.1%和89.9%（超ACoT约11%）。
  - **真机操作**: 在AgileX上，仅用600条demo训练，面对未见颜色/大小的物体，平均成功率达85.9%；跨本体迁移到预训练未见过的LDT-01上，仅需200条demo微调，成功率达81.0%（超$\pi_{0.5}$ 7.1%）。
  - **通用抓取**: 在6360次测试中，仅用首帧mask提示，成功率达90.1%（超$\pi_{0.5}$ 11.0%，超DexGraspVLA 5.7%），在密集遮挡、不规则物体和工具抓取上优势显著。

### 10. 🔥 [Two Bridges, One Pathway: From VLMs to Generalizable VLAs with Embodied Trajectory-Coupled Data] (两座桥，一条路：利用具身轨迹耦合数据将VLM转化为可泛化的VLA)
- **研究机构**: `复旦大学、上海创新研究院`
- **Arxiv ID**: `2606.08520` | [点击跳转](https://arxiv.org/abs/2606.08520)

**0. 论文标题**
- **英文标题**: Two Bridges, One Pathway: From VLMs to Generalizable VLAs with Embodied Trajectory-Coupled Data
- **中文标题**: 两座桥，一条路：利用具身轨迹耦合数据将VLM转化为可泛化的VLA
- **研究机构**: 复旦大学、上海创新研究院

**1. 整体逻辑**
- **研究任务**: 将预训练的视觉语言模型（VLM）微调为用于机器人控制的视觉语言动作模型（VLA）。
- **研究动机**: VLM直接微调成VLA效果很差，因为存在两个正交的鸿沟：一是输入分布鸿沟（互联网图片 vs 机器人操作视角），二是目标函数鸿沟（预测文本 vs 预测动作）。直接拿动作数据微调，模型很难同时跨越这两个鸿沟，容易把预训练学到的通用知识忘掉（灾难性遗忘）。
- **本质改动**: 提出“具身轨迹耦合数据（ETC）”。从机器人操作轨迹中自动生成视觉问答（VQA）形式的文本标签。这种数据跟动作数据长一样（共享视觉分布），但任务是预测文本（保留VLM目标）。基于此设计了三阶段渐进式训练流程，把“对齐视觉分布”和“学习动作预测”拆开来做，平滑过渡。
- **技术溯源**: 基于 PaliGemma（VLM基座）和 Pifast（动作token化及VLA训练框架）。

**2. 技术拆解**
- **重点改进**: 
  1. 构造ETC数据并设计三阶段渐进训练法，解决VLM到VLA微调时的知识遗忘问题。
  2. 发现并利用ETC数据实现零动作样本的分布外（OOD）泛化，即只给新场景的视觉问答数据，不给动作数据，模型也能学会在新场景下执行动作。
- **架构细节**: 
  - **ETC数据构造**：分三类（场景基础、任务导向、动作对齐规划）。用相机标定算几何标签，用大模型（Gemini）生成语义标签，完全离线自动构建，无需人工标注。
  - **三阶段训练**：
    - 阶段1（分布桥接）：只用ETC数据微调VLM，让模型适应机器人视角的视觉-语言语义，不学动作。
    - 阶段2（目标桥接）：引入动作预测目标，同时混入ETC数据做联合训练。ETC的作用是“锚点”，防止学动作时破坏阶段1学到的具身表征。
    - 阶段3（保留性适应）：针对具体部署场景，继续用该场景的ETC和动作数据微调，扩展能力。
  - **组合归纳（OOD ETC）**：在阶段2和3中，混入目标场景的ETC数据（只有视觉问答，没有动作数据），让模型把新视觉条件和已有动作技能组合起来。
- **核心 Loss**: 统一的 Next-token prediction loss（下一个token预测损失）。无论是ETC的文本生成还是VLA的动作生成，都转化为自回归的token预测任务。没有额外的辅助重建Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - 仿真：SimplerEnv, LIBERO, VLABench。
  - 真机：WidowX 机械臂（放咖啡袋、插花任务），基于 BridgeV2 数据预训练。
  - Baseline：直接动作微调（Action only）、通用多模态数据联合训练（MM）、无阶段1直接学动作等。
- **评价指标**: 
  - 仿真：Success Rate (SR, 成功率), Progress Score (PS, 进度得分), Intention Score (IS, 意图得分)。
  - 真机：In-domain Score (域内得分), OOD Score (分布外/泛化得分)。
- **实验结果**: 
  - **阶段1（分布桥接）很关键**：在VLABench上，加了阶段1后，成功率（SR）比直接微调提升了约19%~76%不等。证明通用VLM表征和机器人视角确实有gap，必须先用ETC对齐。
  - **阶段2（目标桥接）中ETC比通用多模态数据好用**：ETC联合训练比通用多模态数据联合训练在VLABench上提升更大，且表征相似度分析（CKA）证明ETC能更好地保留阶段1的具身表征，防止学动作时遗忘。
  - **OOD泛化效果显著**：在真机咖啡袋任务中，只给OOD（未见过的）场景的ETC数据（不给动作数据），OOD得分从 41.67 直接飙升到 91.67（用Gemini生成标签）。证明模型能靠纯视觉语言理解来泛化动作策略，省去了大量新场景的动作遥操作数据收集成本。

### 11. 🔥 [MotionVLA: Injecting Geometric Motion into Vision-Language-Action Model] (MotionVLA：将几何运动注入视觉-语言-动作模型)
- **研究机构**: `华中科技大学、D-Robotics（地平线）、武汉大学`
- **Arxiv ID**: `2606.08288` | [点击跳转](https://arxiv.org/abs/2606.08288)

**0. 论文标题**
- **英文标题**: MotionVLA: Injecting Geometric Motion into Vision-Language-Action Model
- **中文标题**: MotionVLA：将几何运动注入视觉-语言-动作模型
- **研究机构**: 华中科技大学、D-Robotics（地平线）、武汉大学

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长序列机器人操作任务中的策略生成能力。
- **研究动机**: 现有的VLA模型为了处理长序列任务中的状态歧义，通常会注入历史帧、深度或4D时空特征。但作者发现，简单地堆叠历史帧或独立提取每帧的3D几何特征，会导致“几何漂移”和“时间碎片化”。这种在运动上不一致（motion-inconsistent）的4D证据，会让机器人在执行时走弯路、动作抖动。核心问题是：VLA到底应该记住过去的“画面”，还是应该记住连接这些画面的“运动”？
- **本质改动**: 提出MotionVLA，不再把历史帧当作独立的图像或点云处理，而是利用“轨迹场（trajectory-field）”将过去的一小段视频转化为紧凑、时间连续的“运动历史token”。通过“解耦-再耦合”机制，让当前视觉特征去查询这些运动历史，再融合回VLA主干网络。
- **技术溯源**: 基于 $\pi_0$（Physical Intelligence 开源模型，基座为 PaliGemma-3B）作为VLA主干；使用冻结的预训练轨迹提取器 TraceAnything 来提取4D运动特征。

**2. 技术拆解**
- **重点改进**: 
  1. 构建“仅包含过去”的运动历史：用轨迹提取器处理过去几帧（严格排除当前帧），生成时间连续的轨迹场token，作为可查询的键值（KV）记忆。
  2. 解耦-再耦合（Decouple-then-Recouple）融合机制：当前帧的视觉token作为Query，通过交叉注意力从运动历史中检索相关的运动token（解耦）；然后将检索到的运动token与多视角视觉token拼接，通过MLP融合（再耦合），送入VLA主干。
- **架构细节**: 
  - **输入输出**：输入多视角RGB、本体感觉和语言指令；输出连续动作序列。头部相机（head-camera）的历史帧（如过去5帧，时间步长为2）专门用于提取运动特征。
  - **模型结构**：冻结的 TraceAnything 提取历史帧的 decoder tokens 作为运动记忆 $M_{kv}$。当前头部相机视觉token $V^{head}$ 作为 Query，通过 MHA 检索 $M_{kv}$，得到运动条件token $M$。$M$ 与多视角视觉token $V^{mv}$ 拼接后过 MLP 得到融合特征 $F$。$F$ 连同文本、状态 token 输入 LLM。动作头沿用 $\pi_0$ 的 Flow-matching 连续动作生成机制。
  - **模型规模**：基座语言模型为 PaliGemma-3B。
- **核心 Loss**: 
  - **主 Loss**：Flow-matching 动作克隆损失（$\mathcal{L}_{action}$），用于预测速度场生成动作。
  - **辅助 Loss**：轨迹重建损失（$\mathcal{L}_{traj}$）。用一个轻量级预测头，根据检索到的运动token预测过去历史窗口对应的动作序列。这能防止运动token退化为单纯的静态外观特征，强制其包含与控制动力学直接相关的信息。总 Loss = $\mathcal{L}_{action} + \alpha \mathcal{L}_{traj}$。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：RoboTwin2.0（包含长、中、短序列任务）和 LIBERO（Spatial, Object, Goal, Long）。
  - **Baseline**：Diffusion Policy, DP3, RDT, OpenVLA, $\pi_0$, TraceVLA, SpatialVLA, DepthVLA, 4D-VLA, SwiftVLA 等主流方法。
  - **真机**：Agilex Piper 机械臂，3个对时间连续性要求高的任务（Pick&Place, Ranking, Touching）。
- **评价指标**: 
  - **成功率 (SR)**：任务完成的百分比。
  - **路径效率 (PE)**：策略执行的末端执行器轨迹长度与专家演示轨迹长度的比值。越接近1说明走的路越直，没有绕路和抖动。
- **实验结果**: 
  - **仿真表现**：在 RoboTwin2.0 上平均成功率达到 53%，比 $\pi_0$ (41%) 提升 12%；长序列任务 Touch 从 19% 大幅提升至 41%。在 LIBERO 上平均成功率 95.4%，LIBERO-Long 达到 91.2%（比 $\pi_0$ 提升 6%），达到列表中的最优水平。
  - **路径效率**：在 LIBERO-Goal 和 Long 上，PE 分别为 1.05 和 1.10，显著优于 4D-VLA (1.36/1.32) 和 $\pi_0$ (1.23/1.19)，证明机械臂动作更平滑、直接，没有无效绕路。
  - **真机表现**：在3个真机任务上，平均成功率从 $\pi_0$ 的 28.7% 提升到 41.9%，平均完成步数从 338 步降到 282 步，验证了运动一致性在真实物理环境中的有效性。

### 12. 🔥 [Q-VGM: Q-Guided Value-Gradient Matching for Flow-Matching VLA Policies] (Q-VGM：用于流匹配VLA策略的Q引导价值梯度匹配)
- **研究机构**: `上海交通大学、密歇根大学安娜堡分校、电子科技大学`
- **Arxiv ID**: `2606.08015` | [点击跳转](https://arxiv.org/abs/2606.08015)

**0. 论文标题**
- **英文标题**: Q-VGM: Q-Guided Value-Gradient Matching for Flow-Matching VLA Policies
- **中文标题**: Q-VGM：用于流匹配VLA策略的Q引导价值梯度匹配
- **研究机构**: 上海交通大学、密歇根大学安娜堡分校、电子科技大学

**1. 整体逻辑**
- **研究任务**: 使用离线强化学习（Off-policy RL）微调基于流匹配（Flow-Matching）的视觉-语言-动作（VLA）模型。
- **研究动机**: 流匹配VLA没有显式的动作概率分布，导致策略梯度方法无法使用。现有的基于价值（Value-based）的方法存在明显缺陷：直接反向传播整个去噪链在VLA这种大模型上梯度极不稳定；只在推理时用Critic打分无法更新策略；把Critic优化后的动作当标签做蒸馏，又破坏了流匹配的速度场结构。
- **本质改动**: 把Critic的动作梯度转化为去噪过程中的“速度场修正”。通过往前推算一步得到干净动作估计，进行Q梯度上升得到目标速度修正量，然后让策略的残差速度去直接拟合这个修正量。全程不需要反向传播去噪链，也不需要计算动作似然。
- **技术溯源**: 基座策略是 $\pi_{0.5}$（一种流匹配VLA模型），状态特征提取使用了 Physical Intelligence 提出的 RLT (RL Token) 自编码器，Critic 网络基于 Cal-QL 改进。

**2. 技术拆解**
- **重点改进**: 
  1. 训练一个对动作敏感的 Chunk-level Critic，防止高维状态特征掩盖动作的微小变化。
  2. 将 Critic 在干净动作空间的梯度（$\nabla_A Q$）转化为去噪中间状态的速度场修正，通过“残差速度匹配”来更新策略。
- **架构细节**: 
  - **输入输出**: 输入是视觉-语言前缀特征（通过RLT压缩为2048维向量）加上本体感觉，输出是动作块（Action Chunk）。
  - **Critic结构**: 使用 Cal-QL 集成网络。关键改动是“逐层动作注入”，即在Critic的每个隐藏层都拼接动作特征，保证网络对动作的局部敏感性，从而提供准确的Q梯度。
  - **策略更新**: 冻结VLM骨干和Critic，只更新流匹配的Action Expert。
- **核心 Loss**: 
  - **主 Loss (残差速度匹配)**: 计算当前策略预测的速度与基础（冻结）策略预测的速度的差值（即残差速度），让它去拟合由Q梯度计算出的“有效速度修正量”。加入了一个随时间变化的门控函数，在去噪后期（接近干净动作时）加大拟合权重。
  - **Critic Loss**: 使用标准的 Cal-QL 时序差分（TD）Loss 进行离线训练。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO (40个桌面任务), RoboTwin 2.0 (10个双臂任务), 真实机器人桌面任务 (Pick Peach, Stack Bowls)。
  - **Baseline**: Test-time Q Selection, Test-time Q Guidance, Q-Improved Action Distillation, Diffusion-QL。所有方法共享同一个SFT初始化和同一个Critic，仅改变Critic的使用方式。
- **评价指标**: 任务成功率 (Success Rate, SR)。
- **实验结果**: 
  - **LIBERO**: 平均成功率从 75.0% 提升到 92.5%（Diffusion-QL 掉到 69.5%，Action Distillation 为 86.3%）。
  - **RoboTwin 2.0**: 平均成功率从 76.4% 提升到 87.2%。
  - **真实机器人**: 平均成功率从 40.0% 提升到 67.5%。
  - **总结**: 在所有设置下，均大幅优于同基座、同Critic的baseline，证明了该方法能有效利用Critic信息更新流匹配策略，且避免了直接反向传播去噪链导致的训练崩溃。

### 13. 🔥 [TBD-VLA: Temporal Block Diffusion Vision Language Action Model] (TBD-VLA：基于时序块扩散的视觉语言动作模型)
- **研究机构**: `弗吉尼亚大学 (University of Virginia)`
- **Arxiv ID**: `2606.07895` | [点击跳转](https://arxiv.org/abs/2606.07895)

**0. 论文标题**
- **英文标题**: TBD-VLA: Temporal Block Diffusion Vision Language Action Model
- **中文标题**: TBD-VLA：基于时序块扩散的视觉语言动作模型
- **研究机构**: 弗吉尼亚大学 (University of Virginia)

**1. 整体逻辑**
- **研究任务**: 视觉语言动作模型（VLA）的动作生成，即根据视觉观察和语言指令输出机器人的控制动作。
- **研究动机**: 现有的离散VLA模型把动作当成普通文本token，用自回归方式逐个生成，导致推理太慢，跟不上机器人的高频控制。虽然有些并行解码方法提高了速度，但丢失了对动作时序依赖关系的显式建模，导致生成的动作不够连贯。
- **本质改动**: 把动作序列切成多个“时序块（temporal blocks）”。在块内部，用离散扩散模型并行生成动作（提速）；在块与块之间，保持自回归生成（保证时序连贯）。
- **技术溯源**: 基于 Qwen3-VL 2B 作为视觉语言基座模型。

**2. 技术拆解**
- **重点改进**: 引入时序块离散扩散（Temporal Block Diffusion）。训练时，让当前块去预测下一个块（Temporal-level Token Shift），把扩散模型的重建目标和VLM的自回归目标对齐；推理时，引入实时分块（Real-Time Chunking, RTC），利用模型自带的补全（in-painting）能力，在机器人执行当前动作时异步预测后续动作，抵消推理延迟。
- **架构细节**: 
  - **输入输出**：输入是视觉图像、离散化的本体感觉token和语言指令；输出是离散化的动作token。
  - **模型结构**：2B参数量的VLM。动作和本体感觉被离散化成固定数量的bin，共享同一个词表。
  - **训练细节**：使用双倍布局（doubled-layout）和自定义注意力掩码，把干净序列和加噪序列拼在一起算，一次前向传播同时处理块内并行和块间自回归，提高训练效率。
  - **推理细节**：只解码当前执行需要的动作块（Decoding as Needed）；缓存前缀的KV Cache；动作解码时不用argmax，而是用期望采样（Expectation sampling），利用完整的概率分布来还原连续动作值，精度更高。默认配置下，动作块大小设为4（m=4），每个块去噪2步（nd=2）。
- **核心 Loss**: 掩码动作token的平均交叉熵损失（Cross-entropy loss）。没有加额外的辅助任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真用了 LIBERO、LIBERO-Plus 和 SimplerEnv（包含 Widow-X 和 Google Robot）。预训练用了 DROID、Open-X 等开源数据集。真实世界自己采了3个桌面任务的数据。
  - **Baseline**：对比了 OpenVLA、OpenVLA-OFT、$\pi_0$、$\pi_{0.5}$、GR00T-N1、UniVLA 等主流VLA模型。
- **评价指标**: 任务成功率（Success Rate）、推理延迟（Latency）、抗扰动鲁棒性。
- **实验结果**: 
  - **仿真表现**：在 LIBERO 上平均成功率 97.7%，排名第一。在 LIBERO-Plus 的抗扰动测试中，平均成功率 83.0%，比第二名高 15.1%。在 SimplerEnv 的 Google Robot 任务上成功率 91.0%，排名第一。
  - **真实世界**：在3个桌面操作任务（收纳、烤面包、倒水）中，平均成功率 67.1%，比 $\pi_{0.5}$（50.0%）高 17.1%。
  - **速度与延迟**：在单卡 RTX A40 上，结合各项优化后推理延迟为 0.086秒。比专门优化过速度的 OpenVLA-OFT（0.031秒）慢，但比原版 OpenVLA（0.344秒）快很多，且成功率明显更高。结合 RTC 机制后，在 4 步推理延迟的仿真下，成功率依然能保持在 93.2%。

### 14. 🔥 [Ego-Pi: VLA Fine-Tuning for Ego-Centric Human and Robot Data] (Ego-Pi：面向第一人称人类与机器人数据的VLA微调)
- **研究机构**: `Stanford University, Meta`
- **Arxiv ID**: `2606.08107` | [点击跳转](https://arxiv.org/abs/2606.08107)

**0. 论文标题**
- **英文标题**: Ego-Pi: VLA Fine-Tuning for Ego-Centric Human and Robot Data
- **中文标题**: Ego-Pi：面向第一人称人类与机器人数据的VLA微调
- **研究机构**: Stanford University, Meta

**1. 整体逻辑**
- **研究任务**: 利用第一人称（Ego-centric）人类数据微调VLA模型，让配备灵巧手的人形机器人学习高级任务语义（如按颜色分类、技能组合、规则排序）。
- **研究动机**: 机器人数据稀缺，而第一人称人类数据（如通过VR头显或智能眼镜收集）易获取且规模大。但现有VLA多为低维夹爪设计，难以直接用于高维灵巧手；且人手与机器人手形态差异大，直接迁移动作和视觉特征效果差。此外，现有研究多关注基础动作的泛化，缺乏对高级任务逻辑（如顺序、组合）的跨具身迁移探索。
- **本质改动**: 1) 用Token交错策略将高维双手动作拆分到两个token中，免改预训练权重；2) 放弃逆运动学，直接将人手关键点映射为机器人关节角；3) 在图像上绘制带颜色且考虑遮挡的骨骼线进行视觉对齐；4) 引入子任务预测作为辅助任务，让模型“先思考后行动”。
- **技术溯源**: 基于 $\pi_{0.5}$ (Physical Intelligence 提出的 Flow-matching VLA 基座模型)。

**2. 技术拆解**
- **重点改进**: 针对高维灵巧手和跨具身形态差异，对VLA的输入（视觉骨骼线）、动作空间（Token交错）和输出（子任务辅助预测）进行了针对性适配，解决人类高级语义向机器人迁移时的维度和形态不匹配问题。
- **架构细节**: 
  - **输入**: 第一人称图像、左右腕部图像（人类数据无腕部图像，训练时机器人腕部图像做40% dropout）、本体状态。视觉输入上叠加带颜色编码和深度遮挡处理的骨骼线，对齐人手和机器人手的视觉结构。
  - **动作表示**: 手腕6D位姿 + 机器人手部关节角（Tesollo手20维，Inspire手6维），单手最高29维。人手20个关键点通过带偏移和缩放的线性映射直接转为机器人关节角，避免逆运动学导致的自碰撞。
  - **模型结构**: 基于 $\pi_{0.5}$。由于 $\pi_{0.5}$ 单token最大支持32维动作，而双手灵巧手高达58维，采用**Token交错（Interleaving）** 策略，将左右手动作分别作为独立的token输出。这牺牲了一半的动作horizon（H变为H/2），但完美保留了预训练权重，避免了直接改大输出层导致的训练不收敛。
- **核心 Loss**: 
  - **主 Loss**: Flow-matching 动作预测 Loss（预测流速度场）。
  - **辅助 Loss**: 子任务生成 Loss。要求VLM部分先输出子任务文本字符串（如“打开盒子”），再预测具体动作，相当于动作生成前的思维链（CoT）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自建数据集，包含人类和机器人数据。任务包括：番茄颜色分拣（Tomato Sort）、装箱（Boxing，需组合开箱和放置技能）、规则包装（Packaging，需按规则先放盒子再放玩偶）。
  - **Baseline**: 仅用机器人数据训练的模型、简单混合人类数据共训练的模型、无子任务预测的模型、无骨骼线视觉增强的模型。
- **评价指标**: 真实机器人环境下的任务成功率（Success rate）。
- **实验结果**: 
  - **人类数据能有效传递高级语义**: 简单共训练即可让机器人学会人类数据中的逻辑。番茄分拣成功率92%，规则包装90%；而纯机器人数据仅40%和10%（纯机器人数据会乱抓或无视规则）。
  - **子任务预测对复杂技能组合至关重要**: 在“装箱”任务（需要先开箱再放物体）中，简单共训练成功率仅27%（机器人会同时抓盒子和物体导致碰撞），加入子任务预测后提升至93%。
  - **视觉骨骼线对齐效果有限**: 叠加骨骼线对最终性能提升帮助不大。
  - **硬件形态影响迁移效果**: 尺寸更接近人手的Inspire手在复杂任务中表现更好，而尺寸较大的Tesollo手在“装箱”任务中成功率仅为67%，且动作过渡生硬。
  - **腕部相机不可或缺**: 测试时去掉腕部图像，机器人的抓取稳定性明显下降，说明策略依然高度依赖腕部视觉。

### 15. 🔥 [PRISM: PRior-guided Imagination Sampling in world Models] (PRISM：世界模型中先验引导的想象采样)
- **研究机构**: `Northeastern University, UC Berkeley, Qiyuan Lab, University of Florida`
- **Arxiv ID**: `2606.07974` | [点击跳转](https://arxiv.org/abs/2606.07974)

**0. 论文标题**
- **英文标题**: PRISM: PRior-guided Imagination Sampling in world Models
- **中文标题**: PRISM：世界模型中先验引导的想象采样
- **研究机构**: Northeastern University, UC Berkeley, Qiyuan Lab, University of Florida

**1. 整体逻辑**
- **研究任务**: 基于潜在世界模型（Latent World Models）的视觉操作任务规划，具体是采样模型预测控制（Sampling-based MPC），如推T型块、推方块等连续控制任务。
- **研究动机**: 现有的JEPA世界模型（如LeWM）在MPC规划时，初始采样分布是盲目的（零均值、固定方差的高斯分布）。这导致在采样预算（样本数）较少时，大量计算资源被浪费，找不到好动作。而现有的引入动作先验的方法，往往依赖额外的大模型（如VLM）或独立的视觉编码器，增加了架构复杂度和推理负担；或者只用了先验的均值而丢弃了方差（置信度），导致规划器在分布外状态容易失效。
- **本质改动**: 不引入额外的庞大网络，而是直接复用世界模型已有的冻结视觉编码器特征，加一个极轻量（1M参数）的MLP头来预测动作的高斯先验（均值和方差）。在规划初始化时，通过高斯乘积（PoG）公式将先验与默认采样分布进行精度加权融合，实现置信度引导的采样，并支持优雅降级（先验不准时自动退回盲目采样）。
- **技术溯源**: 基于 JEPA 架构的潜在世界模型（具体为 LeWM），结合 MPPI（Model Predictive Path Integral control）作为采样规划器。

**2. 技术拆解**
- **重点改进**: 
  1. **轻量化先验提取**：直接在世界模型的冻结编码器后接MLP，输入当前状态和目标状态特征，输出动作的均值和方差，零额外感知成本。
  2. **精度加权融合（PoG）**：利用高斯分布的精度（方差的倒数）进行融合。先验方差小（置信度高）时，主导采样分布；先验方差大（置信度低）时，自动退化为默认分布，无需额外学习门控机制。
  3. **固定方差设计（$\sigma$-frozen）**：在MPPI迭代过程中保持融合后的方差不变，避免CEM算法中因精英样本聚集导致的方差坍塌，特别是在小样本预算下。
- **架构细节**: 
  - **输入输出**：先验头输入当前观测和目标观测经过冻结JEPA编码器后的特征向量（维度$2d$），输出动作序列的均值 $\mu_p$ 和标准差 $\sigma_p$。
  - **模型结构**：先验头是一个3层GELU MLP，隐藏层宽度512，约1M参数。
  - **融合机制**：按坐标计算精度加权的高斯乘积，得到融合后的均值 $\mu_{fused}$ 和方差 $\sigma_{fused}^2$（方差下限截断为0.05）。
  - **规划器**：MPPI，迭代30次，预测步长5，每次迭代只更新均值，不更新方差。
- **核心 Loss**: 
  - 先验头训练使用 **$\beta$-NLL Loss**（$\beta=0.5$）。标准的高斯NLL Loss容易导致方差头预测坍塌（预测方差趋于0），$\beta$-NLL通过降低均值梯度的权重来稳定方差的学习。世界模型本身的Loss是JEPA标准的嵌入空间MSE。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集/环境**：PushT（推T型块，18.7k轨迹）和 Cube（推方块，10k轨迹），以及两个真机平台（Franka推T，ARX X5推方块）。
  - **Baseline**：BC-only（直接执行先验均值）、Diffusion Policy (DP)、Vanilla MPPI（无先验）、Warm-start MPPI（仅用先验均值初始化，丢弃方差）、PRISM-CEM（使用CEM自适应更新方差）。
- **评价指标**: 
  - 成功率（Success Rate, SR），在不同采样预算（K=32, 64, 128）下评估。同时评估推理时间（ms/plan）。
- **实验结果**: 
  - **相比Vanilla MPPI**：PRISM-MPPI在PushT上提升约23-32个百分点（K=32时从59%提升到82%），在Cube上提升约33-35个百分点（K=32时从46%提升到79%）。
  - **样本效率极高**：PRISM在K=32时的表现，远超Vanilla MPPI在K=128时的表现（PushT高25%，Cube高35%）。这意味着可以用极小的计算量达到甚至超越大计算量的效果。
  - **方差（置信度）的作用**：对比Warm-start，加入方差（$\sigma_p$）后，性能随采样预算增加而稳定提升；而仅用均值的Warm-start在K增大时性能反而下降（因为额外样本在未经校准的均值周围盲目漂移）。
  - **对比CEM**：在小样本（K=32）下，PRISM-MPPI（固定方差）比PRISM-CEM（自适应方差）高出近40%的成功率（PushT上82% vs 43%），证明了固定方差设计能有效避免小样本下的方差坍塌。
  - **计算开销**：推理时间几乎无增加（约210ms vs 211ms），先验头前向传播和融合计算耗时不到0.05ms。
  - **真机部署**：在Franka和ARX X5机械臂上成功部署，验证了零延迟开销和高实时控制频率的优势（Franka 35%成功率，ARX X5 40%成功率）。

### 16. 🔥 [C3ache: Accelerating World Action Models with Cross Inference Chunk Cache] (C3ache：利用跨推理块缓存加速世界动作模型)
- **研究机构**: `George Mason University, University of Central Florida (乔治梅森大学, 中佛罗里达大学)`
- **Arxiv ID**: `2606.08962` | [点击跳转](https://arxiv.org/abs/2606.08962)

**0. 论文标题**
- **英文标题**: C3ache: Accelerating World Action Models with Cross Inference Chunk Cache
- **中文标题**: C3ache：利用跨推理块缓存加速世界动作模型
- **研究机构**: George Mason University, University of Central Florida (乔治梅森大学, 中佛罗里达大学)

**1. 整体逻辑**
- **研究任务**: 加速 World Action Models (WAM) 中基于扩散模型的动作生成推理过程。
- **研究动机**: WAM 推理时把动作分成多个 chunk（块）逐步生成，每个 chunk 需要多步去噪。现有的扩散模型加速方法（如 DeepCache）只利用了*单个 chunk 内部*相邻去噪步之间的特征冗余。但作者发现，机器人执行平滑动作时，*相邻 chunk 之间*在相同去噪步数下的中间特征高度相关，这种“跨 chunk”的冗余被现有方法忽略了。
- **本质改动**: 提出 C3ache，一种免训练（training-free）方法。在推理时，把上一个 chunk 算好的 DiT 残差（Residual）缓存下来，直接给当前 chunk 复用，从而跳过当前 chunk 整个 DiT 网络的计算。
- **技术溯源**: 基于 Fast-WAM（底层是 Wan2.2-5B 视频模型 + 1B 参数的 DiT 动作专家）。

**2. 技术拆解**
- **重点改进**: 
  1. **发现跨 chunk 冗余**：证明相邻 chunk 在相同去噪步的残差 $R$ 余弦相似度极高，且越靠近去噪末尾方差越大。
  2. **缓存残差而非最终输出**：因为最终输出需要融合当前 chunk 的新观测，所以选择缓存 DiT 网络的残差 $R = h_L - h_0$。推理时如果是复用缓存的 chunk，直接计算 $h_L = h_0 + \tilde{R}$，从而跳过所有 DiT 层的计算。
  3. **引入刷新机制和步数限制**：设定刷新间隔 $\tau$（每隔 $\tau$ 个 chunk 重新算一次残差），并且只在去噪的前几步（如前 6 或 7 步）使用缓存，后几步正常计算，防止误差累积。
- **架构细节**: 
  - **输入输出**：输入是当前 chunk 的初始动作 token 嵌入 $h_0$（已包含新观测信息），输出是最后一层 DiT 的输出 $h_L$，经线性头映射为速度预测。
  - **模型规模**：Fast-WAM 总计 6B 参数（5B 视频骨干 + 1B 动作专家）。动作 horizon 为 32，每个 chunk 去噪 10 步。
- **核心 Loss**: C3ache 是纯推理阶段的加速，不改变训练 Loss。底层 Fast-WAM 使用的是 Flow Matching 的速度预测 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO（4个子集，单臂操作）和 RoboTwin 2.0（50个任务，双臂操作，分 clean 和 randomized 两种设置）。
  - **Baseline**：Fast-WAM（不使用任何缓存加速）。
- **评价指标**: 
  - **总挂钟推理加速比**（Wall-clock inference speedup，包含 VAE 编码、KV 缓存构建等完整 pipeline）。
  - **任务成功率**（Success Rate）。
- **实验结果**: 
  - **LIBERO**：在缓存前 7 步、不刷新（$\tau=0$）的配置下，达到 **2.51倍** 加速，成功率几乎无下降（+0.2%）。
  - **RoboTwin**：在缓存前 6 步、不刷新的配置下，达到 **1.84倍** 加速，成功率仅下降 1.05%；若要求成功率完全不降，可达到 1.56倍 加速。
  - **消融结论**：缓存的去噪步数不能太多（超过 7 步成功率暴跌）；对于长序列任务，需要更小的刷新间隔 $\tau$ 来防止缓存过期导致的误差累积。

### 17. 🔥 [vla.cpp: A Unified Inference Runtime for Vision–Language–Action Models] (vla.cpp：面向视觉-语言-动作模型的统一推理运行时)
- **研究机构**: `VinRobotics, VinUniversity, TU Darmstadt 等`
- **Arxiv ID**: `2606.08094` | [点击跳转](https://arxiv.org/abs/2606.08094)

**0. 论文标题**
- **英文标题**: vla.cpp: A Unified Inference Runtime for Vision–Language–Action Models
- **中文标题**: vla.cpp：面向视觉-语言-动作模型的统一推理运行时
- **研究机构**: VinRobotics, VinUniversity, TU Darmstadt 等

**1. 整体逻辑**
- **研究任务**: 解决 VLA（视觉-语言-动作）模型在机器人边缘端设备（如 Jetson Orin）上的跨硬件、低延迟部署问题。
- **研究动机**: 现有 VLA 模型多基于 Python/PyTorch 发布，依赖大显存工作站 GPU。而机器人边缘端内存极小（如 8GB 统一内存）。现有的 LLM 推理引擎（如 llama.cpp）不支持 VLA 特有的 flow-matching/diffusion 动作头和交叉注意力缓存机制；而厂商专属编译器（如 TensorRT）又缺乏跨硬件的便携性，无法统一服务多种 VLA 架构。
- **本质改动**: 基于 llama.cpp 开发了一个纯 C++ 的 VLA 统一推理引擎 `vla.cpp`。补齐了 LLM 引擎缺失的动作头推理逻辑，实现了跨去噪步的交叉注意力 KV 缓存复用，并统一了多种 VLA 架构的推理流程。
- **技术溯源**: 基于 llama.cpp / ggml 构建。支持的基座包括 SmolVLM2, PaliGemma, BitNet-SigLIP (BitVLA), InternVL3, Eagle/Cosmos (GR00T系列)。

**2. 技术拆解**
- **重点改进**: 
  1. **实现 VLA 推理模式**：将推理拆分为 Prefix 阶段（双向注意力编码多模态特征）和 Action 阶段（flow-matching/diffusion 头交叉注意力去噪）。
  2. **填补 C++ 引擎的 4 个空白**：暴露 VLM 最终层隐藏状态（而非仅输出 logits）、使用双向掩码编码 prefix、显式管理交叉注意力缓存生命周期（复用 prefix KV）、使用模型自带统计信息进行动作反归一化。
  3. **底层算子优化**：针对 BitVLA 的三值权重，将原本在 CUDA core 上跑的 dp4a 指令迁移到 IMMA Tensor Core 上，提升计算单元利用率。
- **架构细节**: 采用 C/S 架构。C++ server 加载 GGUF 模型包，通过 ZeroMQ 和 Protobuf 与 Python client 通信。Server 无状态，负责推理和反归一化；Client 负责控制逻辑。单一二进制文件支持 7 种 VLA 架构（5种 backbone + 4种 action head）。
- **核心 Loss**: 本文是系统部署论文，不涉及模型训练，无核心 Loss。主要关注推理延迟、内存占用和行为保真度。

**3. 实验结果**
- **数据集和baseline**: 仿真数据集使用 LIBERO-Object 和 SimplerEnv (WidowX)；真机使用 ALOHA 机械臂。Baseline 为各模型官方的 PyTorch eager 实现。
- **评价指标**: 行为保真度（任务成功率、与 PyTorch 参考实现的 episode 差异）、推理延迟（每步延迟、单次推理延迟）、内存占用。
- **实验结果**: 
  1. **行为保真**：在 LIBERO-Object 上，7 种架构均完美复现官方 checkpoint 行为。BitVLA 达到 100% 成功率，与 PyTorch 参考实现 200 个 episode 中仅差 1 个。
  2. **速度提升**：在 RTX 3060 上，vla.cpp 运行 SmolVLA 的每步延迟为 28.16ms，比 PyTorch 参考实现（223.96ms）快近 8 倍（主要得益于 C++ 静态图减少了 kernel launch 开销）。
  3. **算子优化**：将 BitVLA 的三值矩阵乘法迁移到 IMMA Tensor Core 后，单步延迟降低 4.5 倍（RTX 3060 上从 172.8ms 降至 37.85ms），且输出 bit-identical。
  4. **内存与跨硬件**：在 8GB Jetson Orin Nano 上，内存容量是主要瓶颈（6GB 的大模型装不下）。BitVLA 通过三值量化仅需 1.3 GiB 内存即可运行。此外，论文还发现并修复了视觉塔中 patch position-embedding 索引在 FP16/FP32 下舍入误差导致的动作偏移问题。

### 18. 🔥 [FiberTune: Preserving Action-Fiber Visual Residuals in Vision-Language-Action Fine-Tuning] (FiberTune：在视觉-语言-动作微调中保留动作纤维视觉残差)
- **研究机构**: `中国科学院大学 (UCAS)、河北工业大学、北京信息科技大学等`
- **Arxiv ID**: `2606.08653` | [点击跳转](https://arxiv.org/abs/2606.08653)

**0. 论文标题**
- **英文标题**: FiberTune: Preserving Action-Fiber Visual Residuals in Vision-Language-Action Fine-Tuning
- **中文标题**: FiberTune：在视觉-语言-动作微调中保留动作纤维视觉残差
- **研究机构**: 中国科学院大学 (UCAS)、河北工业大学、北京信息科技大学等

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）大模型的下游任务微调。
- **研究动机**: 在VLA微调时，动作监督Loss只约束了能改变当前动作预测的特征方向。而那些“动作等价”的视觉特征（比如物体颜色、背景、干扰物，它们变了但不影响当前的抓取动作），因为处于作者定义的“动作纤维”（Action fibers，即产生相同动作预测的表征流形）切空间内，没有梯度约束。这导致这些对长序列任务或泛化很有用的视觉特征在微调时发生坍塌丢失。
- **本质改动**: 提出FiberTune，在训练时通过一个轻量级动作探针把“与动作预测相关”的特征方向剔除，将剩下的“残差”特征与冻结的视觉教师模型对齐，并加上有效秩正则化防止残差自身坍塌。推理时移除所有辅助模块，零额外开销。
- **技术溯源**: 基于 $\pi_{0.5}$ (OpenPI系列) 和 OpenVLA-OFT 等VLA基座模型。

**2. 技术拆解**
- **重点改进**: 
  1. **动作探针过滤**：训练一个轻量级线性探针，估计出预测动作的特征方向，从中间视觉token里把这部分减掉，得到“探针过滤残差”。
  2. **残差对齐**：把过滤后的残差过一个固定的MLP适配器，跟冻结的视觉Teacher特征算余弦相似度（去均值和归一化后）。
  3. **有效秩先验**：计算残差协方差矩阵的特征值分布，最大化其形状熵，防止残差特征挤在少数几个维度上发生二次坍塌。
- **架构细节**: 
  - **输入输出**：输入视觉观察、语言指令和动作标签；操作VLA中间的视觉token表征。
  - **模型结构**：引入一个线性动作探针（作用于池化后的视觉特征），一个固定的随机初始化 per-token MLP适配器，以及一个冻结的视觉Teacher。
  - **推理部署**：推理时直接移除Teacher、探针和MLP适配器，不增加任何推理参数和计算量。
- **核心 Loss**: 
  - **主Loss**：任务Loss（$\mathcal{L}_{task}$，即动作预测Loss）。
  - **辅助Loss 1**：对齐Loss（$\mathcal{L}_{align}$），探针过滤残差与Teacher特征的余弦距离。
  - **辅助Loss 2**：有效秩Loss（$\mathcal{L}_{rank}$），残差特征协方差矩阵特征值分布的负熵。
  - **总Loss**：$\mathcal{L} = \mathcal{L}_{task} + \lambda_{align}\mathcal{L}_{align} + \lambda_{rank}\mathcal{L}_{rank}$。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：CALVIN (ABC->D 长序列操作), LIBERO (标准操作套件), 真实世界 SO-101 机械臂 pick-place 任务。
  - **Baseline**：仅使用任务Loss微调（Task-loss-only），以及全token对齐（Full-token alignment，即BlindVLA的做法）作为对照。
- **评价指标**: 
  - **仿真**：CALVIN的平均完成子任务数（Avg. seq. len.）和5步成功率（SR(5)）；LIBERO的任务成功率（SR）。
  - **真实世界**：整体任务成功率，以及分阶段（接触、抬起）和分颜色（分布内颜色，分布外OOD绿色）成功率。
  - **表征诊断**：残差与Teacher的CKA相似度，残差的有效秩（Effective rank）。
- **实验结果**: 
  - **CALVIN**：$\pi_{0.5}$ 微调下，平均序列长度从 3.837 提升到 4.116，SR(5) 从 61.4% 提升到 72.1%（+10.7%）。
  - **LIBERO**：$\pi_{0.5}$ 成功率从 95.75% 提升到 97.10%；OpenVLA-OFT 从通用checkpoint微调的成功率从 42.50% 大幅提升到 48.95%（+6.45%）。
  - **真实世界**：SO-101 整体任务成功率从 72.7% 提升到 78.1%。特别是在OOD（分布外）的绿色方块任务上，成功率从 46.9% 飙升到 62.5%（+15.6%），证明颜色泛化能力显著改善。
  - **消融实验**：有效秩先验是主要贡献者；全token对齐反而会掉点，必须先过滤动作方向再对齐，验证了作者的理论动机。
