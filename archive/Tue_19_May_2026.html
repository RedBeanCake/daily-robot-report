            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Dexora: Open-source VLA for High-DoF Bimanual Dexterity] (Dexora：面向高自由度双臂灵巧操作的开源视觉-语言-动作模型)
- **研究机构**: `清华大学、北京智源人工智能研究院等`
- **Arxiv ID**: `2605.18722` | [点击跳转](https://arxiv.org/abs/2605.18722)

**0. 论文标题**
- **英文标题**: Dexora: Open-source VLA for High-DoF Bimanual Dexterity
- **中文标题**: Dexora：面向高自由度双臂灵巧操作的开源视觉-语言-动作模型
- **研究机构**: 清华大学、北京智源人工智能研究院等

**1. 整体逻辑**
- **研究任务**: 训练端到端的VLA策略，直接输出双臂+双灵巧手（共36自由度）的同步关节轨迹，完成基础抓取到精细双手协调操作。
- **研究动机**: 现有VLA要么针对双夹爪（自由度低），要么只控单手灵巧手，缺乏双臂双高自由度手的统一控制基座；此外，大规模遥操作数据噪声大、质量不均，直接训练会严重拉低策略对精细动作的拟合能力。
- **本质改动**: 构建虚实严格对齐的36-DoF双臂双手数据集，并引入“数据质量感知”训练管线。核心改动是用离线判别器自动给演示片段打分，在策略微调时对Loss加权，自动压制低质量演示的梯度贡献。
- **技术溯源**: 策略基座采用Diffusion Transformer架构；视觉/语言编码器复用开源的SigLIP与T5；数据筛选与加权机制借鉴离线模仿学习中的PU（正例-未标记）学习与动态加权思想。

**2. 技术拆解**
- **重点改进**:
  1. **解耦式混合遥操作**：手臂粗运动由外骨骼背包直接采集关节角（避免视觉逆解抖动），手指精细运动由Apple Vision Pro无标记追踪+短标定映射。同一套驱动代码同时控制真机和MuJoCo数字孪生，保证仿真与现实的观测-动作分布一致。
  2. **质量感知加权训练**：不依赖人工清洗。先按加速度/加加速度平滑度预筛，再进行开环回放验证保留成功片段作为高质量正例。训练轻量判别器给全量真实数据clip打分，策略微调时直接映射为权重，实现“优质数据主导，噪声数据抑制”。
- **架构细节**:
  - **策略网络**: Decoder-only Diffusion Transformer，28层，1024隐藏维，16注意力头。输入为多视角RGB（SigLIP编码）、指令（T5编码）、当前本体状态（36维）及加噪动作块（长度L=32）。输出预测动作噪声，推理端用DPMSolver++加速。
  - **判别器网络**: 结构类似策略但更小（12层，512维，8头，共30M参数）。输入额外拼接当前策略计算的动作兼容性代理分数（基于扩散残差能量的Z-score）。经全局平均池化与MLP+Sigmoid输出(0,1]的质量分。推理时丢弃该网络。
- **核心 Loss**:
  - **判别器Loss**: PU损失。高质量回放成功集逼向1，其余未标记集（含噪声/失败数据）逼向0，系数η=0.5。
  - **策略Loss**: 加权扩散MSE Loss。$\mathcal{L}_{\pi} = \sum w_i \|\epsilon_{\theta}(\cdot) - \epsilon\|_2^2$。权重$w_i$由判别器得分经DWBC映射得到，训练初期加入权重预热（warm-up）防梯度突变。

**3. 实验结果**
- **数据集和baseline**: 数据集含10万条仿真轨迹（30类基础任务，6.5M帧）和1万条真实遥操作数据（含精细工具使用，2.92M帧）。对比基线：Diffusion Policy (DP)、$\pi_0$、GR00T N1。所有方法在相同控制频率、相机配置、动作块长度下，各用100条真实演示微调5万步。
- **评价指标**: 每项任务20次独立Rollout，统计成功率（%）。划分为基础套件（拾放、拆装、关节物体）和精细灵巧套件（写字、切菜、擀面、拧瓶盖等强依赖指尖协同的任务）。
- **实验结果**:
  - **基础任务**: Dexora平均成功率89.6%（GR00T N1为82.1%，$\pi_0$为50.4%），7项任务≥90%，双臂交接与协同放置任务优势明显。
  - **灵巧任务**: Dexora平均成功率66.7%，显著领先GR00T N1 (51.7%)、$\pi_0$ (26.7%) 和 DP (6.7%)。在切菜、擀面等需双臂配合及工具精细操控的任务上拉开差距。拧瓶盖成功率仅25%，主要受限于刚性指尖缺乏触觉反馈导致打滑。
  - **泛化与消融**: 同一套策略无需改结构，可直接降维迁移至单臂夹爪、双臂夹爪或单臂低自由度灵巧手。消融实验确认：真实数据+判别器加权是灵巧操作性能跃升的核心因素。

### 2. 🔥 [DyGRO-VLA: Cross-Task Scaling of Vision–Language–Action Models via Dynamic Grouped Residual Optimization] (DyGRO-VLA：基于动态分组残差优化的视觉-语言-动作模型跨任务扩展方法)
- **研究机构**: `[作者未明确列出，通常为国内高校/研究所AI团队]`
- **Arxiv ID**: `2605.17486` | [点击跳转](https://arxiv.org/abs/2605.17486)

**0. 论文标题**
- **英文标题**: DyGRO-VLA: Cross-Task Scaling of Vision–Language–Action Models via Dynamic Grouped Residual Optimization
- **中文标题**: DyGRO-VLA：基于动态分组残差优化的视觉-语言-动作模型跨任务扩展方法
- **研究机构**: [作者未明确列出，通常为国内高校/研究所AI团队]

**1. 整体逻辑**
- **研究任务**: 面向多任务机械臂操作的VLA模型强化学习在线微调（Post-training）。
- **研究动机**: 现有的RL微调（如直接跑SAC/RFT更新VLA全参数）虽然能提升单任务灵巧度，但会严重污染预训练学到的共享特征空间。任务一多，RL梯度互相冲突，导致表征孤立、灾难性遗忘，多任务平均成功率反而暴跌。
- **本质改动**: 把“端到端RL更新VLA权重”改为“冻结底座 + 动态路由残差修正”。离线阶段用信息瓶颈提纯跨任务共享特征；在线阶段不碰主干，只训练一组残差专家策略，按任务特征动态组合输出动作增量，保住泛化底座的同时补全操作精度。
- **技术溯源**: 视觉基座 DINOv2 + SigLIP，语言基座 Qwen2.5-0.5B，策略架构沿用 Action Chunking。RL优化基于 SAC/Actor-Critic，数据混合采样借鉴 RLPD/Cal-QL。

**2. 技术拆解**
- **重点改进**: 提出两阶段动态分组残差优化（DyGRO）。核心是解耦“特征学习”与“策略优化”：离线学共享表征，在线用 MoRR（Mixture-of-RL-Residuals）做无损增量微调，彻底解决多任务RL微调破坏VLA跨任务泛化能力的问题。
- **架构细节**: 
  - **离线底座**：双目RGB+指令+本体感知输入，经VLM编码与Fusion模块后，输出隐变量 `z` 和基准动作块 `a_base`。
  - **在线MoRR**：冻结Backbone。先用对比学习训练任务Embedding `z_T~`。路由网络接收 `z_T~`，动态选Top-m个残差专家。每个专家以 `z` 和 `a_base` 为条件，输出残差动作块 `Δa`。最终执行动作 `a = a_base + Δa`。
  - **训练策略**：维护离线/在线双Buffer均匀混合采样；采用困难任务感知采样（成功率低于阈值的任务提高采样权重）。
- **核心 Loss**: 
  - **离线阶段**：`L_base = 动作NLL + λ_IB * 变分信息瓶颈项`。用神经Critic估计互信息边界，强制隐变量 `z` 保留对动作决策有用的特征（如目标物位姿、形态），剔除背景、光照等无关噪声。
  - **在线阶段**：`L_π = SAC策略梯度Loss + λ_CL * 任务对比Loss + λ_LB * 路由负载均衡Loss`。对比Loss用于塑造任务Embedding空间；负载均衡Loss最大化路由熵，防止Expert坍缩或单点过拟合。

**3. 实验结果**
- **数据集和baseline**: 仿真用 LIBERO（130个多任务套件，含空间/物体/目标/长程）和 RoboTwin2，同步做实机部署。对比基线为离线VLA底座和标准多任务RL微调（RFT/SAC直接全模型更新）。
- **评价指标**: 各任务套件平均成功率（%）、分布偏移下的性能稳定性、实机Sim2Real迁移成功率。
- **实验结果**: LIBERO整体平均成功率 97.1%，较离线底座绝对提升 +4.4%；最难的多步长程任务（LIBERO-Long）提升 +9.8%。RoboTwin2仿真综合成功率 79.2%。实机迁移显著优于直接RFT基线，在双臂协同和长视野任务上优势明显。t-SNE可视化证实该方法在线优化后共享特征空间依然紧凑，未出现表征撕裂或灾难性遗忘。

### 3. 🔥 [AffordVLA: Injecting Affordance Representations into Vision-Language-Action Models via Implicit Feature Alignment] (AffordVLA：通过隐式特征对齐将可供性表征注入视觉-语言-动作模型)
- **研究机构**: `浙江大学 (Grasp Lab / 机械工程学院), 炬核科技`
- **Arxiv ID**: `2605.17517` | [点击跳转](https://arxiv.org/abs/2605.17517)

**0. 论文标题**
- **英文标题**: AffordVLA: Injecting Affordance Representations into Vision-Language-Action Models via Implicit Feature Alignment
- **中文标题**: AffordVLA：通过隐式特征对齐将可供性表征注入视觉-语言-动作模型
- **研究机构**: 浙江大学 (Grasp Lab / 机械工程学院), 炬核科技

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作模型（VLA）的通用机器人操作任务（如抓取、放置、移动物体）。
- **研究动机**: 现有VLA的视觉表征过度依赖全局语义和物体外观，注意力容易平均分散在物体整体或背景上。这导致在非结构化/杂乱场景中经常“看对物体但抓错位置”（如指令要求拿锅柄，模型却去抓锅身）。现有引入可供性（Affordance，即功能交互区域）的方法多采用显式Mask拼接或外挂检测器，需要大量标注、增加推理延迟，且存在级联误差。
- **本质改动**: 训练期引入一个零样本可供性教师，用隐式特征对齐的方式，把“该交互哪里”的空间偏好直接揉进VLA骨干的中间层视觉特征里。**推理时教师模型直接拆除，纯VLA前向传播，实现零额外开销、零标注依赖。**
- **技术溯源**: 策略基座基于 `π0.5` 架构（PaliGemma-3B VLM + Gemma-2B LLM + SigLIP-So400m视觉编码器 + 条件流匹配动作生成）。教师模型组合了 `Qwen3-VL`（指令转部件提示词）和 `SAM3`（开放词汇感知）。

**2. 技术拆解**
- **重点改进**: 弃用“外挂检测+拼接特征”的显式路线，改为“训练期表征对齐+推理期剥离”的隐式路线。强制VLA的中间层视觉Token去拟合教师产出的、已编码任务功能区域信息的特征向量，使VLA自身学会聚焦交互关键点。
- **架构细节**:
  - **Affordance Teacher (~0.8B参数)**: 输入RGB+指令。Qwen3-VL负责把高层指令拆解为部件级提示词（如“锤头”），SAM3架构进行跨模态交互，输出中间层视觉表征 $Z^{aff}$ 作为对齐目标（像素级Mask仅用于教师自监督，不参与对齐）。
  - **Understanding Expert (~3.0B参数)**: 继承PaliGemma（18层），处理图像、文本、机器人状态，输出多模态上下文。
  - **Action Expert (~0.3B参数)**: 轻量Transformer，接收上下文，通过条件流匹配预测未来动作块（Horizon=30）。
  - **对齐机制**: 选取Understanding Expert第12层（共18层）的视觉特征，经归一化、双线性插值、2层MLP投影至教师特征空间，叠加位置编码后，与教师表征逐空间Token对齐。选取该层是因为它在保留视觉空间细节和抽象语义之间取得了最佳平衡。
- **核心 Loss**: `总Loss = 动作生成Loss + λ * 可供性对齐Loss`。动作Loss为条件流匹配的标准MSE；对齐Loss为负余弦相似度（最大化特征方向一致性）。权重 `λ=0.5`。无视频重建等辅助任务，对齐损失直接反传至VLA视觉骨干。

**3. 实验结果**
- **数据集和baseline**: 仿真基准使用 RoboTwin (分Easy/Hard两个干扰难度等级)；包含真实世界桌面操作任务。对比方法为当前主流VLA强基线（如 $\pi0$、$\pi0.5$ 等）。
- **评价指标**: 任务成功率 (Success Rate)，核心考察非结构化/复杂背景下的操作鲁棒性。
- **实验结果**: 达到SOTA。在RoboTwin上，Easy设置成功率较此前最优基线提升 **20.5%**，Hard设置提升 **12.8%**。真实场景验证了其在杂乱环境下的精准抓取能力。消融实验证明，该方法有效收敛了VLA的视觉注意力，在**完全不增加推理延迟、不改动推理代码**的前提下，显著提升了训练数据效率和最终操作成功率。

### 4. 🔥 [WorldArena 2.0: Extending Embodied World Model Benchmarking on Modality, Functionality and Platform] (WorldArena 2.0：在模态、功能与平台上扩展具身世界模型基准测试)
- **研究机构**: `清华大学（主要完成单位），联合上海交通大学、浙江大学、斯坦福大学、普林斯顿大学、中科院、港大、北大、新加坡国立大学等。`
- **Arxiv ID**: `2605.17912` | [点击跳转](https://arxiv.org/abs/2605.17912)

**0. 论文标题**
- **英文标题**: WorldArena 2.0: Extending Embodied World Model Benchmarking on Modality, Functionality and Platform
- **中文标题**: WorldArena 2.0：在模态、功能与平台上扩展具身世界模型基准测试
- **研究机构**: 清华大学（主要完成单位），联合上海交通大学、浙江大学、斯坦福大学、普林斯顿大学、中科院、港大、北大、新加坡国立大学等。

**1. 整体逻辑**
- **研究任务**: 建立一套更贴近真实部署条件的评估体系，系统测试具身世界模型（EWMs）在多模态感知、闭环决策优化及跨平台迁移中的实际效用。
- **研究动机**: 现有基准（含 WorldArena 1.0）存在三个明显缺口：① 仅限纯视觉输入，忽略接触密集任务中不可或缺的触觉反馈；② 功能评估多为开环规划或冻结策略测试，未验证模型能否作为交互式环境支撑策略的在线迭代；③ 评估全在单一仿真器内完成，无法反映真实机器人的部署表现与 sim-to-real 差距。
- **本质改动**: 将评估维度从“纯视觉/离线开环/单仿真”直接升级为“视触多模态/在线RL交互/跨形态真机-仿真”。核心不是改模型结构，而是改评估协议，强制要求世界模型在闭环、多模态、真机环境中证明其动力学建模的可用性。
- **技术溯源**: 基于 WorldArena 1.0 框架迭代。底层依赖 UniVTAC 触觉仿真器、RoboTwin 2.0、LIBERO 仿真环境及 AgileX Split-Type ALOHA 真机平台。测试基座涵盖 Vidar、Wan2.2、Genie Envisioner 等视频生成类世界模型，以及 ACT 基线。

**2. 技术拆解**
- **重点改进**: 
  1. **模态扩展管线**：提供即插即用的触觉注入方案，无需改动原有视觉世界模型主干。
  2. **RL环境封装**：将世界模型标准化为可交互的 RL 环境代理，替代传统仿真器进行闭环策略训练。
  3. **跨平台协议**：统一数据生成引擎（Data Engine）和闭环动作规划器（Action Planner）的测试接口，覆盖仿真到真机的全链路。
- **架构细节**:
  - **视触双流通路**：新增触觉 VAE 将触觉形变序列对齐至原视频的潜空间；采用双流世界模型同步去噪生成视频帧与触觉序列；末端接入 Action Diffusion Head，接收历史状态、动作及预测的视触潜变量，直接去噪输出下一时刻动作，完成感知到控制的闭环。
  - **RL交互框架**：按 POMDP 建模。世界模型 $\hat{\mathcal{P}}_\phi$ 负责根据当前观测和策略动作预测下一观测；奖励模型 $\mathcal{R}_\psi$ 提供即时奖励；策略网络 $\pi_\theta$ 基于世界模型生成的轨迹进行 rollout。训练时冻结世界模型与奖励模型，仅更新策略参数。
- **核心 Loss**: 
  - **世界模型阶段**：标准预测损失 $\mathcal{L}_{WM}(\phi;\mathcal{D})$（依具体基座架构而定，如扩散去噪损失或重建损失），辅以触觉与视频潜空间对齐约束。
  - **RL策略阶段**：无独立辅助 Loss，完全依赖环境反馈的策略梯度目标 $\nabla\mathcal{J}(\theta)$，通过最大化期望折扣回报优化策略。

**3. 实验结果**
- **数据集和baseline**: 
  - 视触任务：UniVTAC 仿真数据集（Insert HDMI 插拔线、Lift Bottle 举瓶）。
  - 对比模型：ACT（纯视觉基线）、Vidar、Genie Envisioner（具身视频世界模型）、Wan2.2（通用视频生成模型改造）。
  - RL 任务：RoboTwin 2.0 平台，测试 $\pi_{0.5}$ 策略在不同奖励模型（Proxy/VLM/相似度）下的表现（注：原文表2数据截断，此处仅列实验设置）。
- **评价指标**: 触觉预测质量（PSNR, SSIM）、下游闭环任务成功率（Success Rate）、RL 策略在真机/仿真 rollout 的成功率。
- **实验结果**:
  - **视触预测**：通用模型 Wan2.2 因具备更强的跨模态先验，触觉重建质量最高（PSNR 21.26, SSIM 0.746）。
  - **任务表现**：在短程精细接触任务（Insert HDMI）中，Wan2.2 达 100% 成功率，验证了高质量触觉预测对接触密集操作的直接增益。但在长程力控任务（Lift Bottle）中，所有世界模型成功率均为 0%，仅 ACT 基线达 80%。说明当前世界模型难以融合高频触觉反馈维持长程规划，误差累积严重。
  - **整体结论**：标准化触觉注入管线能让现有视频世界模型具备多模态感知能力；但仿真指标（预测质量）与实际部署（任务成功率/策略优化）存在显著脱节，sim-to-real 可用性鸿沟明确，基准有效暴露了各架构在长程交互与物理一致性上的短板。

### 5. 🔥 [RoboFlow4D: A Lightweight Flow World Model Toward Real-Time Flow-Guided Robotic Manipulation] (RoboFlow4D：面向实时流引导机器人操控的轻量化流世界模型)
- **研究机构**: `多机构联合团队（核心作者来自深圳先进院、南洋理工大学等）`
- **Arxiv ID**: `2605.17522` | [点击跳转](https://arxiv.org/abs/2605.17522)

**0. 论文标题**
- **英文标题**: RoboFlow4D: A Lightweight Flow World Model Toward Real-Time Flow-Guided Robotic Manipulation
- **中文标题**: RoboFlow4D：面向实时流引导机器人操控的轻量化流世界模型
- **研究机构**: 多机构联合团队（核心作者来自深圳先进院、南洋理工大学等）

**1. 整体逻辑**
- **研究任务**: 机器人3D操控中的显式轨迹规划与策略引导。即从RGB图像和文本指令中预测未来多帧3D运动流，并以此作为条件输入，引导轻量级动作策略输出控制指令。
- **研究动机**: 现有3D流规划管线严重依赖“视频生成专家+深度估计+点跟踪专家”的模块堆叠。这种方案虽然能产出3D轨迹，但计算和内存开销极大，推理延迟高，无法部署在需要实时响应的真机上；而纯2D像素流方案又缺乏深度信息，直接用于3D控制极易引发碰撞或物理不可行。
- **本质改动**: 1）用端到端的统一网络直接替代模块化串行管线，从2D观测和文本一步预测4D时空3D流；2）控制范式上，将传统的“同频规划-执行”改为“低频慢规划+高频快执行”的双频协作架构，彻底打通低延迟闭环。
- **技术溯源**: 视觉/文本编码器基于 **DINOv2** 和 **SigLIP**；流生成骨干基于 **DiT** (Diffusion Transformer)；3D几何先验通过特征蒸馏自开源3D基础模型 **VGGT** 获得。策略端兼容 **Diffusion Policy** 和 **DiT Policy**。

**2. 技术拆解**
- **重点改进**: 
  1. **去模块化**：砍掉视频生成、深度估计和独立跟踪网络，构建单一流世界模型。
  2. **3D感知注入**：设计 `3D Perceiver` 模块，通过可学习查询向量与 Resampler 结构，将纯2D视觉特征对齐到 VGGT 的3D特征空间，使模型仅凭RGB就能建立3D几何意识。
  3. **目标导向自适应规划**：根据当前状态到“原子任务”（如抓取-移动-释放的单一阶段）结束点的距离，动态调整预测的帧数，避免固定长度带来的算力浪费。
- **架构细节**: 
  - **输入输出**：输入为历史RGB图像序列、文本指令、可选的2D夹爪查询点；输出为未来 $K$ 帧、 $N_{kp}$ 个关键点的 3D 坐标流 $\mathbb{R}^{N_{kp} \times K \times 3}$。
  - **网络结构**：多模态输入经编码器转为 Token 后，全局图像、文本、点特征拼接为条件向量。该条件送入 `FlowDiT`，其核心是将 DiT 块中的标准多头注意力替换为**时空交叉注意力**。通过扩散迭代去噪，最终由 MLP 投影器输出 3D 流。
  - **策略对接**：生成的 3D 流经 MLP 和 Attention Pooling 压缩为全局流特征，与当前观测（图像+本体感觉）的基础特征拼接，作为冻结权重的下游策略的输入条件，直接回归动作序列。
- **核心 Loss**: 
  - $\mathcal{L}_{diff}$（主）：扩散去噪损失（采用 v-prediction 参数化），驱动模型恢复符合物理规律的轨迹分布。
  - $\mathcal{L}_{align}$（辅）：3D特征对齐损失，强制模型内部的3D条件特征与 VGGT 输出保持空间一致，解决2D到3D的跨模态映射难题。
  - $\mathcal{L}_{smooth}$（辅）：轨迹平滑损失，惩罚去噪轨迹的二阶时间差分，保证生成流的时序连续性。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真基准使用 LIBERO（130个任务，覆盖空间/物体/目标泛化）和 ManiSkill3（Push/Pick/StackCube）；真机使用物理机械臂执行抓取放置任务。
  - **Baseline**：仿真对比 OpenVLA、Octo、SpatialVLA、4D-VLA 等大型 VLA，以及 BC、ACT、DP、DiT 等策略基线；同时与模块化3D流方法做效率对比。
- **评价指标**: 任务成功率 (%)、端到端推理延迟/加速比、模型参数量规模。
- **实验结果**: 
  - **精度**：在 LIBERO 上，为 DP 和 DiT 基线策略带来平均 **6.2%** 和 **4.0%** 的成功率提升；在 ManiSkill3 上提升 **9.7%~11.0%**；真机任务提升 **5%~20%**。轻量策略+RoboFlow4D 的性能可直接比肩参数量大数倍的大型 VLA。
  - **效率**：相比传统模块化3D流管线，推理速度提升 **120倍**，模型参数量缩减 **>24%**。单步规划延迟降至 **1秒以内**，慢快双频机制有效避免了算力瓶颈，任务整体完成时间显著缩短。

### 6. 🔥 [Key-Gram: Extensible World Knowledge for Embodied Manipulation] (Key-Gram：面向具身操作的可扩展世界知识框架)
- **研究机构**: `清华大学 (Tsinghua University)`
- **Arxiv ID**: `2605.18556` | [点击跳转](https://arxiv.org/abs/2605.18556)

**0. 论文标题**
- **英文标题**: Key-Gram: Extensible World Knowledge for Embodied Manipulation
- **中文标题**: Key-Gram：面向具身操作的可扩展世界知识框架
- **研究机构**: 清华大学 (Tsinghua University)

**1. 整体逻辑**
- **研究任务**: 语言指令驱动的具身机器人策略生成（视觉-语言-动作策略）。
- **研究动机**: 现有VLA和世界动作模型普遍将静态语言先验与动态视觉计算耦合在同一个骨干网络中。这导致两个实际问题：一是输入端的“模态竞争”，少量指令token被海量视觉token稀释，复杂指令容易失效；二是知识扩展脆弱，学习新物体或新关系必须更新骨干权重，极易覆盖已有能力，阻碍持续学习与模块化部署。
- **本质改动**: 功能解耦。将“语言知识检索”与“视觉物理推理”拆开。骨干网络专注处理视觉状态演化与动作解码；指令侧的世界知识被拆解为独立单元，通过外挂的哈希记忆库检索，再按需注入骨干特定层。新增知识只需追加记忆表条目，骨干参数冻结或仅做微调适配。
- **技术溯源**: 基于 π0 和 π0.5 开源VLA架构进行插件式改进，复用其视觉编码器与流匹配动作专家。

**2. 技术拆解**
- **重点改进**: 
  1. 确定性稀疏检索：不依赖完整token序列，用轻量解析器将指令切分为少量任务级关键片段（key-gram）。通过乘性XOR哈希函数将片段映射到外部静态Embedding表，实现严格O(1)复杂度的查表。
  2. 上下文门控融合：在骨干Transformer选定层前插入残差模块。计算视觉token与检索记忆的逐点门控值，仅在语义相关的区域注入知识；引入轻量长程卷积混合不同key-gram特征，再残差叠加至主干，避免独立注入带来的特征割裂。
- **架构细节**: 
  - 输入输出：输入文本指令+当前视觉帧；输出VAE编码的未来视觉潜变量与自回归动作轨迹。
  - 结构规模：Key-Gram模块极轻量，仅寄生在骨干的第1、8、13层。记忆表按“插槽(slot)-哈希头(head)”逻辑划分，训练时可跨设备切分，推理时可完整放在CPU内存，不消耗GPU显存。动作解码直接复用骨干累积的KV Cache，接轻量网络执行Flow Matching去噪。
- **核心 Loss**: 无自定义损失函数。沿用基座标准目标：视觉前瞻预测损失（VAE潜空间重构/预测）+ 动作流匹配去噪损失。记忆模块与骨干联合端到端优化，参数更新受门控与残差结构自然约束。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：仿真 RoboTwin2.0（50任务/100随机化配置）、LIBERO/LIBERO-Plus（分布扩展与零样本迁移测试）；真实世界 Piper双臂机器人（长程操作+未见物体组合的泛化测试）。
  - Baseline：X-VLA、OpenVLA-OFT、原始 π0 与 π0.5。
- **评价指标**: 任务成功率（%）。
- **实验结果**: 
  - 仿真：RoboTwin2.0上，π0-KG平均相对提升29.5%（简单）/9.9%（困难），π0.5-KG提升约7%~10%。任务步数越长，记忆带来的物体关系保持优势越明显。
  - 跨域迁移：LIBERO-Plus零样本迁移下，π0-KG相对提升35.8%，π0.5-KG提升4.5%；微调后仍全面优于原版，证明外挂记忆有效缩小了训练分布与长尾泛化分布的语义差距。
  - 真机：长程任务平均相对提升15.4%（π0）/8.1%（π0.5），复杂“组装”环节提升最高（+26.9%）。在未训练过的物体组合配对任务中，成功率出现显著跃升（最高相对提升41.7%），验证了该架构仅靠扩充外部记忆表即可实现稳健的组合泛化，且无需重写骨干权重。

### 7. 🔥 [Robo-Cortex: A Self-Evolving Embodied Agent via Dual-Grain Cognitive Memory and Autonomous Knowledge Induction] (Robo-Cortex：一种基于双粒度认知记忆与自主知识归纳的自演进具身智能体)
- **研究机构**: `香港科技大学, X-Humanoid, 中科院自动化所, 北京航空航天大学`
- **Arxiv ID**: `2605.18729` | [点击跳转](https://arxiv.org/abs/2605.18729)

**0. 论文标题**
- **英文标题**: Robo-Cortex: A Self-Evolving Embodied Agent via Dual-Grain Cognitive Memory and Autonomous Knowledge Induction
- **中文标题**: Robo-Cortex：一种基于双粒度认知记忆与自主知识归纳的自演进具身智能体
- **研究机构**: 香港科技大学, X-Humanoid, 中科院自动化所, 北京航空航天大学

**1. 整体逻辑**
- **研究任务**: 复杂未见过环境下的具身导航与交互任务（涵盖图像目标导航 IGNav、主动目标识别 AR、主动具身问答 AEQA）。
- **研究动机**: 现有导航策略普遍存在“经验性失忆”。方法多依赖开环轨迹模仿、局部场景记忆或单轮内反思，无法将历史交互抽象为可迁移的决策原则。导致智能体在未见过环境中重复犯错，经验利用率极低。
- **本质改动**: 从“被动执行/轨迹检索”转向“主动策略演进”。构建“交互-反思-抽象-适配”闭环，将多模态轨迹自动蒸馏为自然语言导航启发式规则（Heuristics），并在测试期持续在线更新，实现策略的跨轮次与跨环境进化。
- **技术溯源**: 基于 Qwen2.5-VL-72B-Instruct（负责规划、记忆分析、启发式归纳）和 Wan2.1-I2V-A14B（负责世界模型视觉想象）。全程冻结权重，依赖 Prompt 驱动与外部检索/打分模块编排，运行于 Habitat-sim。

**2. 技术拆解**
- **重点改进**: 
  1. **想象-验证规划环**：放弃长程开环预测，采用短视窗“生成候选-想象未来-验证打分-执行-重规划”的闭环，抑制累积误差。
  2. **双粒度认知记忆**：短时记忆（SRM）滑动窗口处理单轮内的局部进度与失败模式；长时记忆（LPM）跨轮次提取成功/失败的原则级摘要，供后续检索。
  3. **自主知识归纳（AKI）**：将分散的轨迹经验聚类合并为结构化启发式库（含模式ID、问题描述、推荐策略、置信度、成败标签），高置信度规则直接反哺 SRM/LPM 作为先验，形成自演进。
- **架构细节**:
  - **输入输出**: 输入当前观测与语义目标，输出离散控制指令（前进0.2m，左转/右转22.5°）及高层子任务推理。
  - **规划流**: Planner 生成 N 个候选计划 → 子任务分发器对齐低层动作与高层推理 → 世界模型(Wan2.1)模拟未来 h 步画面 → VLM(Qwen)根据目标相关性打分选优 → 执行单步后立刻重新进入循环。
  - **记忆流**: 维护结构化记忆图（根节点/轨迹/子任务）。SRM 基于滑动窗口 LLM 摘要；LPM 按目标条件嵌入检索，成功轨迹优先保留最短路径，失败轨迹保留多样性以供模式挖掘。
  - **AKI 流**: 每轮结束调用启发式提取器 → 按模式标识与语义相似度聚类 → 合并生成泛化启发式规则 → 注入下一轮上下文。系统分静态版（测试期冻结库）与自适应版（++，在线更新库）。
- **核心 Loss**: 本文为推理期框架，**无梯度训练 Loss**。核心依赖：① VLM 对候选想象的启发式打分函数；② 记忆库的确定性剪枝/合并规则（短路径优先、高置信度聚合）；③ 世界模型的前向视觉生成无额外重建 Loss 参与优化。

**3. 实验结果**
- **数据集和baseline**: 评估平台为 Habitat-sim。数据集采用 HM3D-val（IGNav/AEQA）与 MP3D（AR）。对比方法为 MapGPT（地图引导）、WMNav（世界模型导航）、World-In-World（闭环决策）。
- **评价指标**: 成功率(SR)、路径加权成功率(SPL)、平均轨迹长度(Mean Traj.)，AEQA 额外使用 Answer Score。
- **实验结果**: 
  - **静态对比**：Robo-Cortex 稳定优于最强基线。IGNav SPL 从 27.50 提升至 31.66 (+4.16)；AR 成功率从 20.68% 提升至 22.39%；AEQA 得分从 27.19 提升至 29.78。
  - **动态演进**：开启在线更新的 Robo-Cortex++ 进一步拉开差距，IGNav SPL 达到 35.06，证明启发式库的持续积累有效。
  - **跨环境泛化**：在 Unseen 划分中，直接加载从 Seen 环境归纳的启发式规则并配合在线更新，SPL 相对基线最高提升 +15.30%，验证了规则的可迁移性。
  - **消融与真机**：SRM 与 LPM 联合使用带来明显的轮次性能单调增长；已在物理机器人完成初步部署，闭环逻辑在真实传感器噪声下保持有效。

### 8. 🔥 [Event-Grounded Sparse Autoencoders for Vision-Language-Action Policies] (面向视觉-语言-动作策略的事件锚定稀疏自编码器)
- **研究机构**: `Purdue University (普渡大学)`
- **Arxiv ID**: `2605.17204` | [点击跳转](https://arxiv.org/abs/2605.17204)

**0. 论文标题**
- **英文标题**: Event-Grounded Sparse Autoencoders for Vision-Language-Action Policies
- **中文标题**: 面向视觉-语言-动作策略的事件锚定稀疏自编码器
- **研究机构**: Purdue University (普渡大学)

**1. 整体逻辑**
- **研究任务**: 解析 VLA（视觉-语言-动作）大模型内部表征的物理意义，并验证特定特征对机器人闭环行为的因果影响。
- **研究动机**: 语言/多模态模型的机械可解释性工具（如 Logit Lens、基于文本上下文的 SAE 特征打分）无法直接迁移到 VLA。因为 VLA 输出是动作序列而非可读 token，单次干预效果无法直接读取，且必须依赖昂贵的闭环滚出来验证。现有 VLA 可解释工作要么依赖手动看视频对齐特征，要么缺乏行为层面的因果验证。
- **本质改动**: 放弃以“文本上下文”或“纯激活统计量”为锚点，改为以**机器人运动学关键行为事件**（如接近、接触、抓取、释放）作为外部基准，对 SAE 特征进行自动打分与因果干预验证。
- **技术溯源**: 基于开源 VLA 架构 OpenVLA（离散动作 token）和 $\pi_0.5$（PaliGemma 骨干+连续动作流匹配专家）；SAE 基座采用 Anthropic 系的 BatchTopK 稀疏自编码器。

**2. 技术拆解**
- **重点改进**: 
  1. **事件锚定流水线**：用算法自动提取运动学关键帧并聚类为行为事件，取代人工看视频标注，实现全量 SAE 特征的行为化排序。
  2. **残差保持干预**：设计隐空间编辑公式 $x' = x + \text{Dec}(z') - \text{Dec}(z)$，干预时只修改目标特征贡献的分量，严格保留原始隐藏状态中的 SAE 重构残差，避免暴力覆盖引入额外噪声。
- **架构细节**:
  - **SAE 训练**: 对 VLA 残差流按 token 独立编码。采用 BatchTopK 激活约束（固定 Top-K 稀疏度），维度通常为 $4096 \rightarrow 32768$ (OpenVLA) 或 $2048/1024 \rightarrow \text{同维度扩倍}$ ($\pi_0.5$)。
  - **关键帧与聚类**: 使用 AWE 算法按末端执行器轨迹误差预算 $\eta$ 提取稀疏路标点。聚类描述子拼接：图像视觉嵌入(v) + 末端位姿/夹爪状态(s) + 时间进度标量(p)。采用凝聚聚类，仅保留在超 50% 轨迹中重复出现的簇作为有效事件。
  - **特征排序**: 对比四种策略：①事件对齐（脉冲/阶跃模板匹配）②窗口均值 ③全局均值 ④随机存活特征。取 Top-K 进行干预。
- **核心 Loss**: SAE 训练 Loss 为 $\mathcal{L}_{SAE} = \text{MSE}(\mathbf{h}, \hat{\mathbf{h}}) + \lambda_{\text{aux}}\mathcal{L}_{\text{aux}}$。主 Loss 为重构均方误差；辅助项 $\mathcal{L}_{\text{aux}}$ 为 AuxK Loss，强制激活未使用特征（Dead Features），防止表征坍缩。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO 四大操作套件，每任务 50 次闭环 rollout。
  - 对比 Baseline：四种特征排序策略内部互比；架构对比 OpenVLA 与 $\pi_0.5$；干预强度对比硬清零($\alpha=0$) 与软抑制($\alpha \in [0,1]$)。
- **评价指标**: 核心指标为**闭环成功率(SR)**及其变化量 $\Delta SR$（干预后-基线）。辅助指标含 SAE 离线诊断（FVE方差解释率、活跃特征占比、平均稀疏度 $L_0$）及 Hooked SR（仅挂载 SAE 重构不干预时的任务成功率）。
- **实验结果**:
  - **SAE 保真度架构差异极大**：$\pi_0.5$ 的 SAE 替换隐藏状态后 SR 几乎不掉（>95%）；OpenVLA 因离散 Token 量化对误差敏感，早期层替换直接导致动作锁死(SR=0)，仅最靠近动作头的第 31 层保留约 35% SR（基线 70%）。
  - **事件对齐排序最有效**：在 OpenVLA-31 层，事件对齐 Top-5 特征清零后 $\Delta SR = -21.2\%$，显著优于窗口均值(-6.2%)、全局均值(-6.5%)和随机控制组(-1.3%)，证明结合时间事件形态的打分能精准定位因果特征。
  - **干预存在强架构特异性**：$\pi_0.5$ 的视觉语言骨干(PG)对单特征干预极不敏感(SR 仅微降 1~2%)，但其 Action Expert 层极度脆弱，任意 Top 特征清零均使 SR 暴跌至 0%（-96.4%）。表明不同 VLA 的信息存储与决策位置完全不同，一套干预点位无法跨架构通用。单特征清零难以完全解耦行为变量，二进制成功率指标仅能反映粗粒度因果效应。

### 9. 🔥 [Contrastive Conceptor Activation Steering (COAST): Unlocking Vision-Language-Action Models through Hidden States] (对比Conceptor激活引导（COAST）：通过隐藏状态解锁视觉-语言-动作模型)
- **研究机构**: `University of Pennsylvania`
- **Arxiv ID**: `2605.17144` | [点击跳转](https://arxiv.org/abs/2605.17144)

**0. 论文标题**
- **英文标题**: Contrastive Conceptor Activation Steering (COAST): Unlocking Vision-Language-Action Models through Hidden States
- **中文标题**: 对比Conceptor激活引导（COAST）：通过隐藏状态解锁视觉-语言-动作模型
- **研究机构**: University of Pennsylvania

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型在部署阶段的推理期干预与任务成功率提升。
- **研究动机**: 预训练VLA在下游任务中易失效，但直接微调（如SFT）成本高且未充分利用模型已有的先验知识。现有激活引导方法多针对VLM骨干或仅使用单方向向量，无法有效干预实际解码动作的瓶颈环节。
- **本质改动**: 放弃梯度优化与权重更新，改为在推理期对冻结模型的动作专家（Action Expert）残差流施加线性门控。利用少量成功/失败轨迹的隐藏态拟合对比投影矩阵，将模型内部计算软投影至成功子空间。
- **技术溯源**: 方法核心理论源自RNN时代的Conceptor（概念子线性算子）及近期LLM的激活子空间引导；直接适配并验证于pi0.5（流匹配）、GR00T N1.5（NVIDIA）、pi0-FAST及Diffusion Policy等策略的动作生成部分。

**2. 技术拆解**
- **重点改进**: 
  1. **轨迹划分与协方差拟合**：收集少量Rollout，按执行结果二分。分别对成功集与失败集的激活矩阵计算中心化协方差，通过带正则化的闭式解得到成功投影算子$C^+$和失败投影算子$C^-$。
  2. **布尔代数组合**：计算 $C_{\text{steer}} = C^+ \wedge \neg C^-$。该操作保留成功样本独有的高方差判别方向，同时抑制成功与失败共有的低方差背景噪声。
  3. **乘法门控注入**：推理时在选定层将残差$h$替换为 $h' = h M^\top$，门控矩阵 $M=(1-\beta)I + \beta C_{\text{steer}}$。$\beta$控制干预强度，与单位阵插值防止投影过激破坏模型原有动力学。
- **架构细节**: 输入为动作专家模块特定层的残差激活（跨action token做均值池化，得到一维向量）；输出为可复用或逐生成步更新的线性变换矩阵。方法不引入新网络层，纯闭式矩阵运算，可插拔挂载于任意采用“冻结骨干+动作专家”架构的VLA。
- **核心 Loss**: 无训练Loss。属于纯推理期干预（Training-free），仅依赖任务成功/失败的二元标签进行数据分组与投影矩阵求解，不涉及反向传播或辅助重建任务。

**3. 实验结果**
- **数据集和baseline**: 
  - 仿真环境：MetaWorld ML45, LIBERO-10, RoboCasa子集；真机环境：DROID平台3个长/短程任务。
  - 对比基线：原版冻结策略、同等数据量（15条轨迹）的LoRA-SFT微调、稀疏自编码器特征引导（SAE）、单向量对比激活加法（CAA）。
- **评价指标**: 任务绝对成功率（跨任务均值）、组间差异显著性检验（$p_t, p_z$统计值）。
- **实验结果**: 
  1. 仿真环境平均成功率绝对提升>20%，真机环境提升>40%，全面且稳定地优于SFT、SAE及CAA等基线。
  2. 完整对比引导（成功∧非失败）效果显著优于仅使用成功数据的正向投影，验证了“压制失败几何方向”的必要性。
  3. 不同任务的失败模式在激活空间中共享高重叠度的子空间结构，已拟合的Conceptor矩阵可直接跨任务迁移并带来正向收益，无需重新收集数据拟合。推理延迟与现有单步引导方法基本一致，满足实时控制需求。

### 10. 🔥 [Plan First, Diffuse Later: Extrinsic Graph Guidance for Long-Horizon Diffusion Planning] (先规划，后扩散：外置图引导的长程扩散规划)
- **研究机构**: `Technion (以色列理工学院), Harvard University`
- **Arxiv ID**: `2605.16863` | [点击跳转](https://arxiv.org/abs/2605.16863)

**0. 论文标题**
- **英文标题**: Plan First, Diffuse Later: Extrinsic Graph Guidance for Long-Horizon Diffusion Planning
- **中文标题**: 先规划，后扩散：外置图引导的长程扩散规划
- **研究机构**: Technion (以色列理工学院), Harvard University

**1. 整体逻辑**
- **研究任务**: 基于离线短轨迹数据集，生成满足长程任务（如复杂迷宫导航、多机协同、定点巡检）的机器人运动轨迹。
- **研究动机**: 现有的组合式扩散规划（CompDiffuser等）靠局部轨迹段拼接生成长序列，但仅凭局部一致性无法保证全局连贯，长程任务极易累积偏差失败。近期“去噪内搜索”方法（在扩散迭代中做分支搜索）虽提升了全局性，但需在去噪每一步反复调用大模型，计算复杂度随步长指数级增长，推理极慢且不稳定。
- **本质改动**: 将“全局拓扑探索”与“局部轨迹生成”解耦。在扩散模型去噪过程**外部**，用轻量级图搜索先算出一条高层路点序列，再将该序列作为软约束**引导**扩散模型进行单次去噪。把探索负担从扩散模型转移给传统图算法。
- **技术溯源**: 基座为组合式扩散规划器（CompDiffuser/CD），状态连通图构建沿用时序距离表示（TDR）与kNN连图范式（类似OGBench/GAS方法）。

**2. 技术拆解**
- **重点改进**: 引入外置图引导机制（XDiffuser）。训练期只建图、训扩散模型；推理期先跑图搜索得到路点，再通过梯度引导注入扩散去噪。不同任务只需更换外层图搜索算法，扩散模型权重完全复用。
- **架构细节**:
  - **建图**：从离线数据均匀采样状态作顶点，输入训练好的时序距离表征网络，在表征空间计算欧氏距离作边权。按阈值和k近邻连边，顶点保留原始物理坐标。
  - **图搜索与路点抽取**：测试时将起点/终点接入图，运行对应算法（如A*求最短路、多智能体优先级搜索、TSP求解器）得到顶点序列。按累计时间代价降采样（间隔 $\Delta t$），得到稀疏的时间-位置路点集 $\mathcal{W}$。
  - **扩散引导**：以终点路点的名义时间预估总时长初始化噪声轨迹。去噪时，为每个路点设定一个三角形时间窗权重 $\lambda_m(t)$，计算轨迹偏离路点的能量项梯度，叠加到基础扩散得分函数上。
- **核心 Loss**: 
  - **训练阶段**：沿用标准DDPM去噪损失（匹配噪声/速度）及时序距离表征的学习损失，无新增目标。
  - **推理阶段**：纯测试时引导。定义路点能量 $E_\mathcal{W}(\tau) = \sum_{m}\sum_{t} \lambda_m(t) \|s_t - w_m\|_2^2$，去噪每一步沿 $-\nabla_\tau E_\mathcal{W}$ 方向微调采样轨迹，实现软插值，不硬约束动力学。

**3. 实验结果**
- **数据集和baseline**: OGBench迷宫环境（PointMaze/AntMaze，含标准拼接数据集与低质量随机探索数据集）、PyBullet桥梁巡检环境。对比纯组合扩散(CD)、去噪内搜索(CDGS, C-MCTD)及图+价值策略基线(GAS)。
- **评价指标**: 仿真环境执行成功率（机器人按生成轨迹运行，在时限内抵达目标或完成巡检点覆盖）；单次规划推理耗时。
- **实验结果**: 
  - **成功率大幅跃升**：在长程/低质数据下优势显著。AntMaze Large Explore 任务中，基线 CD 仅 27%，XDiffuser 达到 98.5%。在常规拼接任务上表现与强基线持平或略优。
  - **推理效率极高**：因去除了去噪内部的分支迭代，单次调用扩散模型即可出结果。实测比 CDGS 快约 10 倍，比 C-MCTD 快 5 倍以上，且复杂度不随规划步长指数爆炸。
  - **任务零样本泛化**：不重新训练任何模型，仅将外层图搜索替换为多智能体路径规划器或TSP求解器，同一扩散模型直接解锁多机协同导航与桥梁定点巡检任务，验证了“搜索外置+扩散生成”范式的模块化优势。

### 11. 🔥 [LACE: Latent Visual Representation for Cross-Embodiment Learning] (LACE：面向跨具身学习的潜在视觉表征对齐)
- **研究机构**: `Stony Brook University, Salesforce AI Research`
- **Arxiv ID**: `2605.16743` | [点击跳转](https://arxiv.org/abs/2605.16743)

**0. 论文标题**
- **英文标题**: LACE: Latent Visual Representation for Cross-Embodiment Learning
- **中文标题**: LACE：面向跨具身学习的潜在视觉表征对齐
- **研究机构**: Stony Brook University, Salesforce AI Research

**1. 整体逻辑**
- **研究任务**: 跨具身模仿学习。利用海量人类演示数据训练视觉策略，使其能直接泛化到机器人（尤其是灵巧手）上执行抓取等操作。
- **研究动机**: 主流自监督视觉基座（如DINO）虽具备丰富语义，但在训练数据缺乏机器人样本的情况下，无法在特征空间建立人手与机器手的有效对应。现有像素级对齐方法会丢失形态信息且增加推理计算；而现有的潜在空间对齐方法通常需要海量或严格时空对齐的数据，成本过高。
- **本质改动**: 在预训练视觉基座的潜在特征层，利用共享身体部位（如拇指、食指等）的稀疏关键点进行分布对齐。将点级监督转化为全局语义对齐，使机器人能直接“听懂”人类演示的视觉特征。
- **技术溯源**: 基于 DINOv3 等自监督视觉基座（SSL Backbone）。该框架为通用微调范式，可无缝替换其他同类视觉编码器。

**2. 技术拆解**
- **重点改进**: 提出一套低数据依赖的特征对齐微调方案。仅需单段机器人演示（甚至单张标注帧），通过匹配人机对应关键点在特征空间中的相似度分布，完成跨具身对齐；同时引入正则化约束，锁住预训练模型的通用语义结构，防止微调导致灾难性遗忘。
- **架构细节**: 采用 Student-Teacher 架构。Student 为可训练的 ViT-S 编码器，Teacher 为指数移动平均（EMA）编码器。输入为随机采样的人机图像对及对应的可见关键点掩码。推理阶段直接替换策略网络中的原始视觉编码器，零额外开销。
- **核心 Loss**: 
  1. **语义对齐损失 (Semantic Alignment Loss)**: 计算反向 KL 散度 $D_{KL}(Q||P)$。P 为 Teacher 图像中某关键点与全图 Patch 的自相似度分布，Q 为 Student 图像中对应关键点与 Teacher 全图 Patch 的交叉相似度分布。该设计将单点监督扩散为局部-全局语义结构对齐。
  2. **Gram 矩阵损失 (Gram Loss)**: 计算 Student 与 Teacher Patch 特征 Gram 矩阵的 MSE。用于约束特征间的相对相似度结构，防止小样本微调破坏预训练模型的通用表征能力。
  总目标：$\mathcal{L} = \mathcal{L}_{\text{align}} + \lambda \mathcal{L}_{\text{gram}}$。

**3. 实验结果**
- **数据集和baseline**: Baseline 为原始 DINOv3。人类数据取自 HInt/EpicKitchen；机器人数据为 LeapHand 灵巧手单段遥操作演示（关键点由正运动学自动解算，经增强后约1k/模态）。下游验证使用线性探针（姿态估计/目标定位）及基于 DETR 改造的抓取策略网络。
- **评价指标**: 特征对齐质量用关键点匹配误差 (EPE) 和余弦相似度 (Cos)；策略性能用零样本/少样本下的物体抓取成功率 (%)；额外评估跨背景泛化（实验室/厨房/办公室）及含干扰物场景 (OOD)。
- **实验结果**: 
  1. **表征对齐**: 人机跨具身 EPE 从 87.04 像素骤降至 19.36，余弦相似度从 0.473 升至 0.910。
  2. **零样本迁移 (无机器人数据)**: 探针在机器人测试集上，末端姿态预测误差降低约 22-33 像素；末端与目标物联合定位命中率提升 21.6%。
  3. **策略抓取**: 在零机器人演示设置下，抓取成功率从 5% 跃升至 60%；含干扰物的 OOD 环境下从 0% 升至 65%。加入少量机器人数据后，优势仍保持 40% 以上。
  4. **泛化与数据效率**: 仅用 1 段演示即可完成有效对齐；在不同背景（厨房/办公室）训练的特征在实验室测试表现一致，证明对齐过程与场景解耦；消融实验证实 Gram Loss 对维持模型原有泛化能力不可或缺。

### 12. 🔥 [SCAR: Self-Supervised Continuous Action Representation Learning] (SCAR：自监督连续动作表征学习)
- **研究机构**: `UC San Diego, KTH Royal Institute of Technology`
- **Arxiv ID**: `2605.16412` | [点击跳转](https://arxiv.org/abs/2605.16412)

**0. 论文标题**
- **英文标题**: SCAR: Self-Supervised Continuous Action Representation Learning
- **中文标题**: SCAR：自监督连续动作表征学习
- **研究机构**: UC San Diego, KTH Royal Institute of Technology

**1. 整体逻辑**
- **研究任务**: 跨具身平台的世界模型条件生成。核心是从多平台视频数据中，学出一个统一的连续动作潜变量，代替各机器人/环境特定的原始指令，用于条件化预测未来状态。
- **研究动机**: 原始动作指令与具体本体形态、控制器、延迟强耦合。相同指令在不同机器人上产生的物理效果不同，直接拿原始指令做跨具身世界模型的条件，会引入大量本体特有噪声，导致低数据下难以泛化，且无法直接迁移动作结构。
- **本质改动**: 将“动作”从具体的控制命令抽象为“解释视觉状态变化的连续干预信号”。通过逆动力学从视觉前后帧反推潜动作，前向动力学用该潜动作预测未来；同时用容量限制和对抗训练把本体特有信息滤掉，最后加一个轻量控制器把部署时的原始指令映射回该潜空间，实现表征学习与具体执行解耦。
- **技术溯源**: 基于预训练 Wan2.1 视频生成模型的因果VAE潜空间与DiT架构；沿用逆-前向动力学（IDM+FDM）框架；结合梯度反转层（GRL）实现领域不变性。

**2. 技术拆解**
- **重点改进**: 核心是“预测必要性 + 信息瓶颈 + 对抗解耦”三者联合。单纯靠视频预测学出的潜动作容易变成压缩未来像素的捷径，或偷偷编码机器人外观/任务信息。论文用KL压缩维度、用GRL剔除本体身份，迫使潜动作只保留“能引起状态变化的共性控制量”。
- **架构细节**: 
  - **输入/预处理**: 输入49帧视频，经冻结的Wan因果VAE编码为时间压缩的视觉潜序列 $v$。
  - **IDM（逆模型）**: 66层时空Transformer，输出连续潜动作 $z$（对角高斯分布，维度64）。训练时采样，推理时用均值。
  - **FDM（前向模型）**: 初始化自Wan2.1 1.3B权重。将 $z$ 序列对齐后，通过AdaLN注入FDM，预测未来32帧的扩散流匹配目标。
  - **部署控制器（Action-to-Latent）**: 独立训练的Transformer Decoder。以当前视觉上下文为KV缓存，原始指令序列为Query，直接回归到已学好的潜动作均值空间，解决序列级时序对齐问题。
- **核心 Loss**: 
  - $\mathcal{L}_{rec}$：FDM的扩散流匹配MSE，保证潜动作包含足够的状态转移信息。
  - $\mathcal{L}_{KL}$：约束IDM后验逼近标准正态，限制信道容量，防止潜变量存储冗余视觉细节。
  - $\mathcal{L}_{GRL}$：潜动作经梯度反转层输入本体分类器。分类器想分对错，IDM想骗过它，从而剔除与具身身份相关的方向。
  - 总目标：$\mathcal{L}_{total} = \mathcal{L}_{rec} + \beta\mathcal{L}_{KL} + \lambda_{adv}\mathcal{L}_{GRL}$。控制器单独用MSE对齐IDM输出的潜动作均值。

**3. 实验结果**
- **数据集和baseline**: 
  - **Robotwin**（机械臂操作）：4种本体。目标Franka仅10条训练数据，源数据各300条。
  - **Procgen**（虚拟环境）：两组不同视觉/动力学的程序化游戏，留一环境做低数据适应。
  - **Baseline**: 仅用目标数据+GT动作、源+目标合并数据+GT动作、无正则的纯潜动作基线，以及KL/GRL单独消融变体。
- **评价指标**: 视频生成/世界模型预测质量：SSIM、PSNR、MSE、最后一帧SSIM（SSIM-L）。数值反映潜动作作为条件接口对世界模型预测能力的提升。
- **实验结果**: 
  - 完整SCAR（KL+GRL）在两个基准上全面优于原始动作基线。Procgen低数据适应中，SSIM从源+目标GT动作的0.493/0.451提升至0.594/0.563；PSNR和MSE同步改善。Robotwin跨本体迁移与零样本任务（place_a2b_left -> right）同样取得显著增益。
  - 消融验证：仅用KL或仅用GRL均有提升，两者结合效果最好，证明压缩容量和剔除本体噪声互补。
  - 跨域注入测试：将本体A推断的潜动作直接输入本体B的FDM，生成视频能保持本体B的外观，但复现本体A的运动结构，证明潜动作已剥离具体形态。
  - 控制器对比：序列级原始动作到潜动作的映射，比逐点对齐或直接用原始动作做条件更稳定，低数据下可控性恢复更好。

### 13. 🔥 [OrbiSim: World Models as Differentiable Physics Engines for Embodied Intelligence] (OrbiSim：将世界模型作为具身智能的可微物理引擎)
- **研究机构**: `上海交通大学 (NeoWorld Project)`
- **Arxiv ID**: `2605.16395` | [点击跳转](https://arxiv.org/abs/2605.16395)

**0. 论文标题**
- **英文标题**: OrbiSim: World Models as Differentiable Physics Engines for Embodied Intelligence
- **中文标题**: OrbiSim：将世界模型作为具身智能的可微物理引擎
- **研究机构**: 上海交通大学 (NeoWorld Project)

**1. 整体逻辑**
- **研究任务**: 构建一个端到端可微的世界模型，直接替代传统物理引擎，用于机器人长程轨迹预测、策略梯度优化及实机到仿真的系统参数辨识。
- **研究动机**: 传统物理引擎（MuJoCo/Isaac等）依赖数值求解器，不可微或仅部分可微，梯度无法穿过碰撞等非线性环节；现有生成式世界模型（Vid2World/AdaWorld等）本质是视频预测器，缺乏显式物理状态接口，且视觉与动力学耦合导致长程物理漂移严重，无法支撑闭环控制训练。
- **本质改动**: 将世界模型重构为“动力学状态预测+视觉渲染”的解耦管线。把场景资产、物理参数作为一等公民输入，输出显式状态与像素，打通从环境配置到策略梯度的全链路可微路径。
- **技术溯源**: 自研架构。动力学部分采用对象中心(Object-Centric)的循环状态空间/Transformer混合结构；视觉部分基于VAE+Latent Diffusion框架。未直接微调现有开源基座（如Llama/OpenVLA），而是针对仿真器需求从头设计。

**2. 技术拆解**
- **重点改进**: 架构解耦与结构化条件注入。动力学模块专注数值状态演进，视觉模块专注像素生成。两者通过显式物理状态连接，避免视觉噪声污染动力学梯度。引入AdaLN将控制动作与物理常数（质量/摩擦/重力）直接调制进特征流，提供强归纳偏置。
- **架构细节**: 
  - **输入/输出**: 输入为历史物理状态序列 $x_{0:t-1}$、上一时刻动作 $a_{t-1}$、静态场景描述符 $\bar{x}$（几何、质量、摩擦等）。输出为下一时刻显式物理状态 $\hat{x}_t$ 和 RGB 观测 $\hat{o}_t$。
  - **动力学核心 (`OrbiSim-Dynamics`)**: 机器人及各物体独立为token。通过Transformer耦合模块计算全局自注意力建模接触/约束交互，经自适应层归一化(AdaLN)注入动作与物理属性。包含Encoder、RNN隐状态更新、Transition预测、Decoder四步，输出状态预测。
  - **视觉渲染 (`OrbiSim-Vision`)**: 状态引导的潜在扩散。将前K帧VAE编码为上下文，把动力学输出的状态转为空间条件图（类似深度/热力图）和对象级Token，送入U-Net进行条件去噪，最后由VAE解码为像素。全链路支持自动微分。
- **核心 Loss**: 无复杂辅助任务，分两部分训练。动力学端使用潜在对齐Loss ($\mathcal{L}_{tra}, \mathcal{L}_{enc}$) + 状态重建MSE ($\mathcal{L}_{dec}$)，在 $T$ 步自回归轨迹上优化以保证长程稳定。视觉端使用标准条件潜在扩散MSE Loss ($\mathcal{L}_{vis}$)，依赖预测状态进行去噪监督。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据/环境**: Robosuite Push（双方块碰撞推挤）、Isaac Lab Stack（长程叠三块）、AdaManip（关节物体）、Physion Drape（布料形变）。均从经典引擎采集轨迹训练。
  - **对比方法**: 世界模型对比 Vid2World、AdaWorld；策略优化对比 SAC、PPO、PPO+RND、BC（原版环境）、DreamerV3。
- **评价指标**: 视频质量与物理一致性：PSNR(↑)、LPIPS(↓)、FVD(↓)；轨迹误差 TrajErr(↓)（从生成视频反推姿态与GT对比）；下游策略任务成功率/累积奖励。
- **实验结果**: 
  - **预测保真度**: 10步/100步自回归中全面领先。FVD 降至 534（Vid2World为1750），TrajErr 降至 0.45（对比0.67/1.86）。在225步叠方块及不同摩擦系数下无物理发散，长程稳定性显著优于耦合式世界模型。
  - **可微策略优化**: 支持稀疏奖励下的解析梯度下降。在缺乏GT状态的真实数据场景中，配合内置的视觉状态推断(SaInf)与物理参数推断(PhyInf)模块，梯度可稳定穿透动力学网络更新策略。在标准RL任务上表现与PPO/SAC持平或更优，且无需依赖环境设计的Reward Shaping或大量Rollout采样。
  - **消融结论**: 移除解耦设计（单体联合预测）会导致FVD和TrajErr同步恶化，验证了物理与视觉分离对梯度传播和数值稳定的必要性。

### 14. 🔥 [PH-Dreamer: A Physics-Driven World Model via Port-Hamiltonian Generative Dynamics] (PH-Dreamer：基于端口-哈密顿生成动力学的物理驱动世界模型)
- **研究机构**: `同济大学 (Tongji University)`
- **Arxiv ID**: `2605.18303` | [点击跳转](https://arxiv.org/abs/2605.18303)

**0. 论文标题**
- **英文标题**: PH-Dreamer: A Physics-Driven World Model via Port-Hamiltonian Generative Dynamics
- **中文标题**: PH-Dreamer：基于端口-哈密顿生成动力学的物理驱动世界模型
- **研究机构**: 同济大学 (Tongji University)

**1. 整体逻辑**
- **研究任务**: 面向视觉连续控制的基于模型强化学习（World Model 训练与策略学习）。
- **研究动机**: Dreamer 类 RSSM 世界模型纯靠数据拟合状态转移，潜在空间缺乏物理结构。长程“脑补”推演时易违反能量守恒/耗散，导致想象轨迹回报与真机回报偏差大，且学到的策略动作生硬、能耗高、泛化差。
- **本质改动**: 把物理规律从“静态守恒边界”改为“受控的动态能量流”。在 RSSM 潜在转移中嵌入端口-哈密顿（PH）动力学结构，用显式模块从本体观测重建系统能量，并让策略优化直接受能量梯度引导。
- **技术溯源**: 基于 R2Dreamer 架构，引入经典控制理论中的端口-哈密顿（Port-Hamiltonian）系统框架。

**2. 技术拆解**
- **重点改进**: 三步协同：① 隐式 PH 正则化约束 RSSM 状态转移；② 显式运动学能量推断模块提供热力学锚点；③ 拉格朗日乘子引导的 Actor-Critic 策略微调。
- **架构细节**: 
  - 状态拆分：沿用 R2Dreamer 的图像编码器与 RNN，将 RNN 确定性状态拆为“物理子状态”和“环境子状态”。物理子状态通过线性层投影到低维相空间 $x$。
  - 隐式对齐：在相空间并行跑一套 PH“影子动力学”（含结构矩阵 $\mathbf{J},\mathbf{R},\mathbf{G}$ 和能量函数 $H$），用 RK4 积分推演下一步预测值。该分支与主 RNN 梯度隔离，仅用 MSE Loss 强制主网络的状态投影向物理紧凑空间收敛。PH 正则权重采用课程学习，从零线性升至最大。
  - 显式能量网：输入关节角历史序列，TCN 推断广义动量 $p$。MLP 拟合势能，通过 Cholesky 分解保证逆质量矩阵严格正定，二者相加得哈密顿量 $\mathcal{H}$。利用 PH 功率平衡方程，将能量变化拆解为“动作注入功”与“状态依赖耗散”，全计算图可微，直接输出 $\nabla_a \mathcal{H}$ 供策略网使用。
- **核心 Loss**: 
  - 组合形式：$\mathcal{L}_{total} = \mathcal{L}_{RSSM} + \lambda_{PH}\mathcal{L}_{PH} + \mathcal{L}_{AC} + \lambda_e(C_{energy}-\epsilon_e) + \lambda_s(C_{smooth}-\epsilon_s)$
  - $\mathcal{L}_{PH}$：PH 预测投影与真实后验投影的 MSE 对齐损失。
  - $\mathcal{L}_{AC}$：标准 Dreamer 想象轨迹最大化回报损失（含策略熵）。
  - 约束项：$C_{energy}$ 惩罚与能量梯度同向的错误动作方向；$C_{smooth}$ 计算哈密顿量沿动作方向的二阶 Hessian 曲率，压制能量地形突变导致的抖动。两项乘子 $\lambda_e, \lambda_s$ 采用投影对偶上升法动态更新，不写死超参。

**3. 实验结果**
- **数据集和baseline**: DeepMind Control Suite (Cheetah Run, Walker S/W/R, Reacher Easy, Hopper Hop)。主基线 R2Dreamer，横向对比 DreamerV3, DreamerPro, Dreamer-INFO, HRSSM。
- **评价指标**: 真实环境渐近奖励（部署性能）、想象轨迹回报均值与方差（世界模型内部虚实对齐度）、潜在相空间对数体积（PCA 计算，越小越紧凑）、MuJoCo 底层 API 测得的实际能耗、控制加加速度 Mean Squared Jerk（越小越平滑）。
- **实验结果**: 全面优于基线。6 任务平均真实奖励从 R2Dreamer 的 762.5 提升至 789.2（所有任务单点均有正向增益）。想象回报方差显著收窄，表明内部推演更稳定、虚实鸿沟更小。相空间体积压缩 4.18%~8.41%，证明模型有效过滤了非物理冗余。行为指标上，实际能耗最高降低 7.80%，动作 Jerk 最高降低 9.38%，策略控制更平顺且更省能。

### 15. 🔥 [StableVLA: Towards Robust Vision-Language-Action Models without Extra Data] (StableVLA：面向无需额外数据的鲁棒视觉-语言-动作模型)
- **研究机构**: `北京大学、清华大学、星辰智能(Astribot)、南京大学、南开大学`
- **Arxiv ID**: `2605.18287` | [点击跳转](https://arxiv.org/abs/2605.18287)

**0. 论文标题**
- **英文标题**: StableVLA: Towards Robust Vision-Language-Action Models without Extra Data
- **中文标题**: StableVLA：面向无需额外数据的鲁棒视觉-语言-动作模型
- **研究机构**: 北京大学、清华大学、星辰智能(Astribot)、南京大学、南开大学

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在真实场景中面对未知视觉干扰（如传感器噪声、运动模糊、光照变化等）时的零样本鲁棒性。
- **研究动机**: 现有 SOTA VLA 在干净数据上表现优异，但一旦引入训练集中不存在的视觉干扰，成功率会出现断崖式下跌（部分严重模糊下直接归零）。传统靠堆叠干扰数据或数据增强的方法计算成本高，且容易让模型“死记硬背”特定噪声模式，泛化到未见干扰的能力有限。作者通过分析特征流，发现性能崩盘的核心薄弱点在于连接视觉编码器与大语言模型的投影/对齐层（Projector）。
- **本质改动**: 放弃依赖外部数据增强的老路，从模型架构入手。基于信息瓶颈（Information Bottleneck）理论，设计了一个轻量级的通道滤波模块（IB-Adapter），直接替换原有的 MLP 投影层，在特征送入 LLM 前自动剥离任务无关的噪声。全程不引入任何额外训练数据。
- **技术溯源**: 基于 VLA-Adapter 流水线改造。视觉与语言骨干沿用主流开源 VLM/LLM，整体模型规模控制在 0.5B。

**2. 技术拆解**
- **重点改进**: 将单一的前向 MLP 投影改为 `Fused IB-Adapter` 双分支混合架构。核心目标是解决“抗噪滤波”与“保留高频细节（精细操作所需）”之间的矛盾。
- **架构细节**:
  1) **IB-Adapter 模块**：将输入视觉特征按通道维度分组，计算通道间的 Gram 矩阵以捕获全局通道协方差。引入可学习的 Sigmoid 门控对矩阵进行过滤。Sigmoid 允许通道独立激活/抑制，能精准关闭携带噪声的通道，同时避免 Softmax 带来的通道间强制竞争。过滤后的特征经轻量 MLP 变换后重组。
  2) **双路融合**：`Z = MLP(X) + tanh(λ)·IB-Adapter(X)`。保留一条原始 MLP 通路用于维持高频空间细节（保障精确操控），另一条 IB 通路提供抗噪语义。训练时引入可调节的随机路径丢弃率（SPD），根据任务特性动态平衡两路权重：精细抓取任务偏重 MLP 通路，长程语义规划任务偏重 IB 通路。整体参数量增加不足 10M。
- **核心 Loss**: 完全沿用标准 VLA 的自回归动作预测 Loss。未引入任何额外的正则化、对比学习或视觉重建辅助任务。抗噪能力完全由网络结构内生的 Sigmoid 门控与信息瓶颈特性实现。

**3. 实验结果**
- **数据集和baseline**: 仿真使用 LIBERO（四大子集）和 CALVIN；实机测试拾取放置任务。干扰源采用 ImageNet-C 标准的 19 类合成干扰（重点测试严重度 3-5）及真实物理干扰。对比基线包括 VLA-Adapter (0.5B)、OpenVLA (7B)、OpenVLA-OFT (7B)、OpenPi-0.5 (3B)。
- **评价指标**: 任务成功率（LIBERO/实机）、连续完成任务平均数（CALVIN）。核心关注在干净数据与各级严重干扰下的零样本表现。
- **实验结果**: 
  - 在合成干扰下，比同架构基线 VLA-Adapter 平均提升约 30%~35%，在最严重干扰（Level 5）下提升幅度达 40.2%~139.6%。
  - 实机拾取任务中，成功率绝对值提升约 31.7 个百分点，在真实干扰下表现稳定。
  - 仅 0.5B 参数量、未在 Open X-Embodiment 大规模数据集上预训练的 StableVLA，在鲁棒性指标上直接追平甚至超越参数量大 14 倍的 OpenVLA 和经过更多数据训练的 OpenPi，且训练数据与流程完全未变。

### 16. 🔥 [ESI-Bench: Towards Embodied Spatial Intelligence that Closes the Perception-Action Loop] (ESI-Bench：走向闭合感知-行动环路的具身空间智能基准)
- **研究机构**: `Stanford University, UCLA, Northwestern University`
- **Arxiv ID**: `2605.18746` | [点击跳转](https://arxiv.org/abs/2605.18746)

**0. 论文标题**
- **英文标题**: ESI-Bench: Towards Embodied Spatial Intelligence that Closes the Perception-Action Loop
- **中文标题**: ESI-Bench：走向闭合感知-行动环路的具身空间智能基准
- **研究机构**: Stanford University, UCLA, Northwestern University

**1. 整体逻辑**
- **研究任务**: 评估具身智能体在交互环境中的空间推理能力。智能体需自主决定“去哪看、怎么动、操作什么物体”，通过主动探索解决单凭初始视角无法回答的空间问题。
- **研究动机**: 现有空间推理基准（如 VSR, BLINK 等）默认智能体能直接拿到“完美视角”或固定图像，忽略了真实世界中很多空间信息（遮挡物后面是什么、容器里有没有水、物体是否稳定）必须靠“动”才能获取。当前 VLM 到底是“看不清”还是“不知道该去哪找线索”，缺乏量化诊断工具。
- **本质改动**: 把评估范式从“被动看图问答”改为“具身主动探索闭环”。智能体不再被动接收观测，而是作为决策主体，在仿真环境里组合移动、视角转动和物理操作，在有限步数内主动收集证据并作答。
- **技术溯源**: 基于 OmniGibson 仿真器（底层为 NVIDIA Isaac Sim + PhysX 5 物理引擎）与 BEHAVIOR-1K 场景资产库构建。任务提议与初始轨迹生成依赖 GPT-4o，但所有实例均经过三轮人工核验过滤。评测对象为当前主流 MLLM（GPT-5, Gemini 3.1）与 3D 增强模型（VGGT）。

**2. 技术拆解**
- **重点改进**: 设计了覆盖 10 大类、29 子类、共 3081 个任务的评测体系。任务强制要求解决视线遮挡、透视变形、镜面反射、内部容积、状态变化等“非被动观测可解”问题。动作空间明确划分为：移动（前后/左右/上下）、视角转动（水平/垂直）、操作（拾取、放置、倒水等）及提交答案（带置信度）。
- **架构细节**: 本文为评测基准，非训练模型。环境以第一人称 RGB 图像作为观测输入；模型每步输出离散动作指令，最大交互预算为 30 步。提供四种标准化评测范式以解耦误差来源：①被动单图 ②被动随机多图 ③主动探索 ④上帝视角（Oracle，提供完美观测）。
- **核心 Loss**: 基准评测，无模型训练 Loss。评估指标为最终答案的匹配准确率（Accuracy）。论文额外设计了诊断指标：通过对比主动探索与上帝视角的准确率差值量化“行动盲区”比例；通过人类对比实验记录模型置信度分布，评估元认知校准能力；通过 3D 重建对比测试几何失真对下游推理的干扰程度。

**3. 实验结果**
- **数据集和baseline**: 数据集为自建的 ESI-Bench（3081 实例）。Baseline 包含 2D 多模态大模型（GPT-5, Gemini 3.1）、3D 增强管线（VGGT+Gemini）以及人类被试。对比实验严格围绕上述四种观测范式展开。
- **评价指标**: 任务回答准确率（%）。核心分析维度：主动 vs 被动的性能增益、上帝视角下的理论上限、不同范式的错误归因（感知失效 vs 动作失效）。
- **实验结果**: 
  1. **主动探索收益显著**：主动模式准确率普遍比单图/随机多图高 20%~40%。随机采集多视角不仅没加分，反而引入冗余信息干扰推理。
  2. **主要瓶颈在“行动盲区”**：给足上帝视角时，现有模型准确率飙升至 90% 左右，证明当前 VLM 的视觉特征提取能力已够用，主要短板是“不知道下一步该往哪走/怎么操作”。
  3. **错误会级联放大**：早期一步错误动作（如转到无效角度或错误抓取）会导致后续观测全废，30 步预算内无法恢复。
  4. **3D 表征是双刃剑**：对强依赖深度信息的任务有稳定作用，但不完美的 3D 重建会引入几何伪影，反而扭曲细粒度空间关系，表现不如纯 2D 基线。
  5. **暴露元认知缺陷**：人类遇到矛盾证据会主动寻找反证视角并下调置信度；模型则倾向过早锁定结论并输出高置信度。这种“过度自信+缺乏假设检验”的认知偏差，无法靠单纯提升视觉分辨率或增加交互步数解决。
