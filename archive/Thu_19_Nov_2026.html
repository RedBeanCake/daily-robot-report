            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [$Z$-sight: Unifying Vision-Language-Action and Latent World Modeling] ($Z$-sight：统一视觉-语言-动作与潜在世界模型)
- **研究机构**: `Maven Robotics, USC Physical Superintelligence Lab`
- **Arxiv ID**: `2611.24940` | [点击跳转](https://arxiv.org/abs/2611.24940)

**0. 论文标题**
- **英文标题**: $Z$-sight: Unifying Vision-Language-Action and Latent World Modeling
- **中文标题**: $Z$-sight：统一视觉-语言-动作与潜在世界模型
- **研究机构**: Maven Robotics, USC Physical Superintelligence Lab
- **一句话总结**: 本文属于具身智能/机器人控制领域的方法创新工作，提出 $Z$-sight，在 VLM 原生的视觉 token 空间内通过 Flow Matching 联合去噪预测未来状态和连续动作，摒弃了昂贵的视频生成和外部冻结编码器，在人形机器人和桌面操作任务上实现了 SOTA 性能与高效推理。

**1. 整体逻辑**
- **研究任务**: 机器人控制策略学习（重点是人形机器人的全身运动操作 loco-manipulation，以及单臂/双臂桌面操作）。
- **研究动机**: 现有的视频世界动作模型（WAM）计算成本太高；现有的隐式对齐方法（如 FLARE）只对齐中间特征，不生成未来流；现有的显式潜在预测方法（如 DreamVLA, VLA-JEPA）依赖冻结的外部目标编码器（如 DINOv2），导致预测空间与 VLM 原生感知空间解耦，限制了策略对物理动态的在线利用。
- **本质改动**: 不引入视频生成器或外部目标编码器，直接在 VLM 自身且随训练共同进化（co-evolving）的视觉 token 空间内，联合去噪预测未来空间 token 和连续动作。
- **技术溯源**: 基于 VLA（Vision-Language-Action）范式、Mixture-of-Transformers (MoT) 架构、Flow Matching、EMA (指数移动平均) Teacher、MEM (因果视频编码器)，VLM 基座为 Qwen3.5-2B。

**2. 技术拆解**
- **核心方法**: 采用 MoT 架构，包含 VLM 主干、Foresight expert（前瞻专家）和 Action expert（动作专家）。使用 VLM 视觉编码器的 EMA 版本作为 Teacher 提取未来帧 token 作为预测目标。推理时，两个专家共享 Euler 步长，在单次前向传播中联合去噪未来视觉 token 和动作，Action expert 直接 attend Foresight expert 生成的中间特征。
- **关键细节**: 
  - **输入输出**: 输入语言指令、本体感觉状态、多相机观测历史；输出动作 chunk。
  - **视觉编码**: 使用无参数的因果视频编码器（基于 MEM），每 4 个 ViT block 替换为时空注意力，仅传递最后一帧的 token 给 VLM，保持单图 token 预算。
  - **模型规模**: VLM 2.22B，Foresight/Action expert 各 0.48B，总计 3.18B。
  - **训练策略**: 分三阶段（Pre-training 人类视频、Mid-training 跨具身机器人数据+20%人类数据回放、Post-training 目标具身数据）。使用知识隔离（Knowledge insulation）和 stop-gradient 防止表征崩溃和遗忘。
- **训练/优化目标**: 
  - VLM：自回归预测离散 FAST 动作 token（$\mathcal{L}_{\text{FAST}}$）。
  - Foresight expert：通过 Flow Matching 预测未来空间 token，损失为速度误差（$\mathcal{L}_{\text{view}}$）。
  - Action expert：通过 Flow Matching 预测连续动作，损失为速度误差（$\mathcal{L}_{\text{flow}}$）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**: SIMPLE（人形仿真）、Unitree G1（真实人形机器人，6个任务）、LIBERO（单臂仿真）、RoboTwin 2.0（双臂仿真）。
  - **对比对象 (Baseline)**: $\pi_{0.5}$, GR00T N1.7, $\Psi_0$, Fast-WAM, VLA-JEPA, Motus 等。
- **评价指标**: Success Rate (SR, 成功率), Progress Score (进度得分)。
- **主要结果**: 
  - **人形仿真 (SIMPLE)**: 平均成功率 81.9%，比最强 baseline GR00T N1.7 高 9.6 个点。
  - **真实人形 (Unitree G1)**: 6个任务平均成功率 73.3%，比 Fast-WAM 高 20.0 个点，在多阶段长程任务中优势显著。
  - **桌面操作 (LIBERO & RoboTwin 2.0)**: LIBERO 平均 97.7%（超越 VLA baseline，匹配 Motus）；RoboTwin 2.0 平均 60.72%（C2C 82.44%, C2R 39.00%），位列第一。
  - **推理效率**: 在 RTX 4090 上生成 30 步 action chunk 的中位延迟为 109.5 ms，比 $\pi_{0.5}$ (120.5 ms)、$\Psi_0$ (149.7 ms) 和 Fast-WAM (155.9 ms) 都快，且保留了在线前瞻能力。

### 2. 🔥 [Phoenix: Learning Scene Structure Representations for Generalizable World-Action Models] (Phoenix：学习场景结构表征以实现可泛化的世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24938` | [点击跳转](https://arxiv.org/abs/2611.24938)

**0. 论文标题**
- **英文标题**: Phoenix: Learning Scene Structure Representations for Generalizable World-Action Models
- **中文标题**: Phoenix：学习场景结构表征以实现可泛化的世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出Phoenix模型，通过双教师蒸馏学习场景结构表征并用因果VAE压缩，联合预测未来视觉潜变量与机器人动作，在多个仿真与真实机器人操作基准上取得SOTA。

**1. 整体逻辑**
- **研究任务**: 训练世界-动作模型（World-Action Models, WAMs），联合预测未来视觉观测与机器人动作，提升机器人在不同场景、物体配置及执行条件下的操作泛化能力。
- **研究动机**: 现有以视频重建为导向的视觉表征（如Video-VAE）虽保留了丰富的像素级信息，但未能显式建模操作所需的物体状态变化与空间关系（即场景结构）。单纯的重建保真度无法保证潜变量捕获与动作强相关的场景结构。
- **本质改动**: 引入场景结构表征学习，通过双教师蒸馏将几何与时空语义知识注入视觉编码器，并利用因果语义VAE（CS-VAE）将其压缩为保留空间布局的生成潜变量，与外观潜变量联合指导动作生成。
- **技术溯源**: 基于 DINOv3（视觉语义基座）、VGGT-Ω（几何知识教师）、V-JEPA 2.1-L（时空语义教师）、Wan VAE（外观潜变量提取）、Wan2.2-TI2V-5B（视频扩散Transformer初始化）、UMT5-XXL（语言指令编码）。

**2. 技术拆解**
- **核心方法**: 
  1. Phoenix Encoder：以DINOv3为基座，通过双教师（VGGT-Ω和V-JEPA 2.1-L）蒸馏，学习融合几何与时空语义知识的单帧场景结构特征。
  2. CS-VAE（因果语义变分自编码器）：对Phoenix Encoder输出的密集特征进行因果聚合与通道/时间维度压缩，在保留空间patch网格布局的同时生成场景潜变量。
  3. 联合预测架构：将CS-VAE场景潜变量与Wan VAE外观潜变量在通道维度拼接，通过掩码联合注意力机制（非对称Mask）耦合视频扩散Transformer与动作扩散Transformer，联合去噪预测未来视觉与动作。
- **关键细节**: 
  - 输入输出与规模：输入分辨率256×256。Phoenix Encoder输出16×16×1024的单帧特征；CS-VAE将9帧特征压缩为3个时间步的48通道潜变量。视频专家（5B参数）和动作专家（1B参数）联合预测，动作chunk长度为32步。
  - 跨具身设计：将不同机器人的状态和动作映射到80维共享控制接口，通过arm ID选择可学习的soft prompt tokens进行条件化。
  - 数据规模：使用约39,000小时的第一人称与机器人操作异构数据进行表征预训练，机器人演示子集用于WAM预训练。
- **训练/优化目标**: 
  - Encoder蒸馏：几何分支使用特征对齐损失与置信度加权对数深度损失；时空语义分支使用掩码预测对齐损失。
  - CS-VAE：MSE重建损失 + 余弦相似度损失 + KL散度正则化（引导后验分布逼近标准高斯先验）。
  - WAM联合训练：基于Flow Matching的联合损失（0.5 × 外观潜变量损失 + 0.5 × 场景特征损失 + 动作损失），当前帧视觉潜变量保持干净不参与加噪。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：LIBERO-Plus、LIBERO-Pro、RoboTwin 2.0 C2R、RoboCasa-GR1、Bench2Dex、RoboDojo-RealWorld。
  - 对比对象（Baseline）：VLA类（OpenVLA、π0、π0.5、StarVLA等）；WAM类（Fast-WAM、OpenWAM-α、Cosmos-Policy、ImageWAM、InternW0-Δ等）。
- **评价指标**: 任务成功率（Success Rate, SR），部分基准包含阶段完成率（LSCR）；视频预测质量指标（PSNR、SSIM、LPIPS、DINO-GT、CLIP-GT）。
- **主要结果**: 
  - 泛化与鲁棒性：在LIBERO-Plus上达到94.8%成功率（超InternW0-Δ 2.0%）；在RoboTwin 2.0 C2R上达到72.4%（超π0.5 26.4%）。
  - 跨具身与真实部署：在Bench2Dex上达到45.6%（超GR00T N1.5 17.3%）；在RoboDojo-RealWorld上平均成功率30.0%（超OpenWAM-α 5.6%）。
  - 数据缩放与少样本适应：预训练数据从25%增至100%时，Phoenix成功率提升27.0%，显著高于纯Video-VAE基线Fast-WAM的11.4%；在LIBERO-Plus中仅使用25%的下游演示数据即可达到91.1%成功率。
  - 预测质量：未来视频预测的PSNR、SSIM及特征相似度（DINO-GT/CLIP-GT）全面优于Fast-WAM，验证了场景结构表征对交互动力学预测的保真度提升。

### 3. 🔥 [Render the Robot, Generate the World: One Video World Model Across Embodiments] (渲染机器人，生成世界：一个跨具身形态的视频世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24925` | [点击跳转](https://arxiv.org/abs/2611.24925)

**0. 论文标题**
- **英文标题**: Render the Robot, Generate the World: One Video World Model Across Embodiments
- **中文标题**: 渲染机器人，生成世界：一个跨具身形态的视频世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Doppel，通过将机器人未来的关节轨迹渲染为与相机对齐的图像，并与数值动作共同作为条件输入视频生成模型，实现了一个无需具身标签、跨多种机器人和人体形态共享的统一视频世界模型，让模型专注于预测环境交互而非机器人自身的运动学映射。

**1. 整体逻辑**
- **研究任务**: 构建跨具身形态（embodiment-agnostic）的视频世界模型，根据初始图像和动作轨迹预测未来的环境视频（包含机器人运动和物体交互）。
- **研究动机**: 现有视频世界模型通常只用数值动作向量做条件，迫使模型同时学习“动作如何映射到图像空间的机器人运动”和“机器人运动如何影响环境”。前者其实可以通过运动学和相机参数直接算出来，让模型学这个不仅浪费容量，还导致不同几何结构和动作空间的机器人难以共享同一套模型。
- **本质改动**: 将机器人的意图运动通过可微分渲染显式转化为相机对齐的未来图像序列，与数值动作拼接后作为条件输入。这在图像空间提供了跨具身形态的统一条件接口，将“机器人自身运动”和“环境响应”解耦。
- **技术溯源**: 基于 Wan 2.1 (image-to-video rectified-flow transformer) 视频生成基座；使用 Dr. Robot (基于 3D Gaussians 的可微分渲染器) 渲染机器人；使用 SAM 2 进行物体掩码追踪以计算评估指标。

**2. 技术拆解**
- **核心方法**: 
  1. **相机外参自动恢复**：对缺失外参的数据集，通过优化可微分渲染器，使渲染的机器人轨迹与观测视频在 RGB、光流和 DINOv2 特征上对齐，自动恢复相机位姿。
  2. **渲染-动作条件适配器**：用冻结的 VAE 编码渲染图像序列，减去时空均值以突出机器人主体（防止大面积背景占主导导致权重坍塌）；数值动作统一 zero-padding 到 159 维后经 MLP 编码。两者通过 Cross-Attention 融合。
  3. **逐 Token 时间步调制**：将融合后的特征加到 Flow 时间步嵌入上，通过 AdaLN 调制视频基座 Transformer 的每个 Block。
- **关键细节**: 
  - 基座模型为 Wan 2.1 I2V 14B（16.4B 参数），适配器约 30.5M 参数。
  - 输入 17 帧（240x432 分辨率），预测 16 帧。
  - 训练了 Doppel-3（3 个机械臂数据集）和 Doppel-8（增加双臂、人形、人手、人体等共 8 个数据集，约 600 小时视频）。
  - 所有形态共享同一套权重，不使用具身标签（embodiment label），仅通过渲染图像区分形态，动作向量通过 zero-padding 统一维度。
- **训练/优化目标**: 潜在空间流匹配（Latent flow matching）损失，预测目标速度（噪声减去干净 latent）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DROID (Franka), Bridge (WidowX), RoboMind (UR5e) 用于主要评估；ABC, T-Rex, GigaHands, OakInk2, Ego-Exo4D 用于扩展评估。
  - **Baseline**：Action-only（仅输入数值动作，同 Wan 2.1 基座）、OSCAR（fine-tuned，基于 2D 骨架条件）。
  - **评估设置**：分为验证集（未见过的轨迹，熟悉环境）和测试集（OOD，如新实验室、新厨房、未见过的物体/任务）。
- **评价指标**: 整体帧的 PSNR, SSIM, LPIPS；结构一致性得分 SCS（用 SAM2 追踪 mask 计算 IoU）；以及针对“机器人区域”和“运动物体区域”的独立 PSNR 和 SCS。
- **主要结果**: 
  - 在 3 个机械臂数据集上，Doppel 相比 Action-only baseline，在未见轨迹上平均 PSNR 提升 1.00 dB，在 OOD 测试上提升 1.20 dB，且物体运动预测（SCS 和 PSNR）显著更好。
  - **跨具身形态收益**：Doppel-8（8 个形态）在 DROID 和 RoboMind 上的预测效果优于 Doppel-3（3 个形态），证明引入人手/人体等数据有助于提升机械臂的预测能力。
  - **训练效率**：相比共享的 Action-only baseline，Doppel 少用 63.8% 的训练数据采样（draws）就达到了更高的验证和 OOD 预测质量。

### 4. 🔥 [DiWALI: Diffusion Policy Learning in World Models via Latent Action Inference from Human and Robot Play] (DiWALI：通过从人类和机器人游玩中推断潜在动作在世界模型中进行扩散策略学习)
- **研究机构**: `University of Freiburg（弗莱堡大学，依据项目主页域名推断）`
- **Arxiv ID**: `2611.24836` | [点击跳转](https://arxiv.org/abs/2611.24836)

**0. 论文标题**
- **英文标题**: DiWALI: Diffusion Policy Learning in World Models via Latent Action Inference from Human and Robot Play
- **中文标题**: DiWALI：通过从人类和机器人游玩中推断潜在动作在世界模型中进行扩散策略学习
- **研究机构**: University of Freiburg（弗莱堡大学，依据项目主页域名推断）
- **一句话总结**: 提出DiWALI框架，用逆动力学模型从连续视频帧推断“潜在动作”来训练世界模型，让扩散策略能在无动作标签的人类视频空间里做模仿学习和想象微调，大幅省去了昂贵的机器人动作数据。

**1. 整体逻辑**
- **研究任务**: 机器人操作技能学习（具身智能/模仿学习与强化学习），核心是如何利用海量无动作标签的人类视频数据和少量机器人数据来训练和强化操作策略。
- **研究动机**: 机器人数据收集受限于“机器人时间”（必须遥操作且带动作标签），成本高、规模小。人类视频好拿但没动作标签，且存在具身差异（embodiment gap）。现有的潜在动作模型（如CLAM）只能做表示学习，不能当仿真器；而世界模型（如Dreamer）又强依赖动作标签。
- **本质改动**: 把逆动力学推断出的“潜在动作”直接作为世界模型（RSSM）的驱动输入，让同一个世界模型能同时吃人类和机器人的play数据；同时把动作解码器解耦出来，在世界模型冻结后单独用机器人数据训练，从而把潜在动作安全地映射回真实机器人动作空间。
- **技术溯源**: 基于 DreamerV2 风格的循环状态空间模型 (RSSM)（如 DiWA），扩散策略 (Diffusion Policy)，以及潜在动作推断机制 (如 CLAM, LAPA)。

**2. 技术拆解**
- **核心方法**: 
  1. **潜在动作世界模型**：用逆动力学MLP从相邻帧的视觉嵌入中推断16维潜在动作，替代真实机器人动作去驱动RSSM，端到端无动作监督训练。
  2. **解耦动作解码器**：冻结世界模型后，仅用机器人play数据训练一个MLP，输入“潜在状态+潜在动作”，输出5步的机器人动作chunk。
  3. **潜在空间策略学习与想象微调**：扩散策略在潜在动作空间做行为克隆（模仿人类演示），然后用PPO在世界模型生成的想象轨迹里微调，并加入行为正则化（BC loss）和动作平滑惩罚，防止策略跑出潜在动作流形。
- **关键细节**: 
  - **输入输出**：输入为 64x64 多视角RGB（场景相机+自我中心相机）；世界模型输出潜在状态（确定性1024维+随机32x32维）和16维潜在动作；解码器输出 5x7 维机器人动作。
  - **模型结构**：逆动力学模型为3层MLP；解码器为带LayerNorm的5层MLP；扩散策略为20步去噪的DDPM。
  - **训练规模**：世界模型训练 900k 梯度步，解码器 300k 步。
- **训练/优化目标**: 
  - **世界模型**：最小化负ELBO（图像重建损失 + KL散度），无动作标签监督。
  - **解码器**：最小化预测动作与真实机器人动作的MSE。
  - **策略微调**：PPO损失（基于潜在奖励分类器打分） + 行为正则化（约束在预训练策略的流形上） + 连续潜在动作的平滑惩罚。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：CALVIN benchmark (环境D)，包含6小时机器人play（拆分为机器人play和渲染的人类play CALVIN-H）。每个任务提供50个人类演示，0/1/5个机器人演示。真实世界使用 Franka Emika Panda，收集2小时VR机器人play和2小时人类play。
  - **对比对象 (baseline)**：Diffusion Policy (ViT) (直接预测机器人动作), DiWA (基于真实动作的世界模型), CLAM / CLAM-X (联合训练解码器的潜在动作模型)。
- **评价指标**: 11个任务的成功率 (Success Rate, %)，真实世界评估20次rollout的平均成功率。
- **主要结果**: 
  - 在CALVIN上，仅用人类演示（0个机器人演示）训练的DiWALI平均成功率达 **59.6%**，远超用5个机器人演示的 Diffusion Policy (35.2%) 和 DiWA (23.6%)，以及同数据下的 CLAM-X (8.2%)。
  - 消融实验证实：解码器“单独训练”且“条件于潜在状态”是性能暴涨的关键（从6.8%拉升至61.6%）；辅助的光流/点流监督无明显收益；人类play可替代大部分机器人play（50%人类+50%机器人达61.6%，仅10%机器人也有36.2%）。
  - 想象微调：结合人类play训练的DiWALI世界模型，在想象微调后（5个机器人+50个人类演示）达到 **75.8%**，优于使用10倍机器人演示的DiWA。
  - 真实世界：仅用人类演示预训练的策略初始成功率 **53%**，经过想象微调后提升至 **70%**，全程无需额外真实物理交互。

### 5. 🔥 [RoboMorpher: Scaling Robot Morphology Representations for Cross-Embodiment Action Prediction] (RoboMorpher：扩展机器人形态表示以实现跨具身动作预测)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24816` | [点击跳转](https://arxiv.org/abs/2611.24816)

**0. 论文标题**
- **英文标题**: RoboMorpher: Scaling Robot Morphology Representations for Cross-Embodiment Action Prediction
- **中文标题**: RoboMorpher：扩展机器人形态表示以实现跨具身动作预测
- **研究机构**: 原文未提及
- **一句话总结**: 提出形态条件化的动作分词器RoboMorpher，利用正运动学监督学习跨具身的共享动作表示，显著提升了跨机器人形态的VLA策略操作成功率。

**1. 整体逻辑**
- **研究任务**: 跨具身机器人操作（Cross-embodiment manipulation）中的共享动作表示学习与策略训练。
- **研究动机**: 现有的关节空间动作表示忽略了机器人形态（如连杆长度、关节排列）的差异，导致相同的关节值在不同机器人上产生不同的空间构型；而末端执行器（EE）控制需要特定机器人的逆运动学，且无法唯一确定全关节构型。单纯对动作维度进行padding无法解决这种形态依赖的歧义。
- **本质改动**: 引入形态条件化的动作分词器，在预训练阶段利用正运动学提供连杆位姿监督，将控制坐标（关节角）与其空间运动学效应（连杆位姿）显式绑定，从而学习到形态感知的共享离散动作表示。
- **技术溯源**: 基于残差向量量化（RVQ）、Transformer、Discrete Forcing（离散预测+连续流匹配微调）、Qwen3-VL（视觉语言模型基座）、cuRobo（逆运动学求解）。

**2. 技术拆解**
- **核心方法**: 
  1. **MorphGen数据生成**：基于33个真实机器人描述的几何先验，程序化生成6/7自由度机械臂形态，通过碰撞感知的逆运动学生成初始位姿，利用正运动学生成4000万个“形态-状态”对作为监督数据。
  2. **RoboMorpher分词器**：形态条件化的动作分词器。编码器通过形态特征（AdaLN-Zero）和运动学链注意力偏置处理输入，使用残差向量量化（RVQ）将每个关节离散化为两个code。解码器在形态条件下同时重建关节角和连杆位姿。
  3. **VLA策略集成**：将预训练并冻结的分词器集成到基于Qwen3-VL的VLA策略中。采用Discrete Forcing架构，离散分支预测动作code，解码后通过连续流匹配分支进行轨迹微调。
- **关键细节**: 
  - **输入输出**：分词器输入为形态参数（每个关节的平移、RPY角）和关节角，输出为每个关节的2个离散code。解码输出为关节角和连杆位姿（位置+6D旋转）。
  - **模型结构**：分词器包含2层形态/角度编码Transformer，6层条件编码器和4层解码器（宽度1024，8头）。RVQ使用2个2048大小的codebook，维度256。VLA策略将50帧动作块拟合为10个节点进行分词。
  - **规模**：分词器预训练数据4000万对；VLA在RoboTwin 2.0（3750个demo）和EmbodiBench（15000个demo）上训练。
- **训练/优化目标**: 
  - **分词器预训练**：联合损失函数，包括关节角重建损失（L1）、连杆位置重建损失（L1）、连杆旋转重建损失（SO(3)测地线距离）以及RVQ的commitment loss。
  - **VLA策略训练**：离散分支的交叉熵损失（带cosine masking） + 连续分支的Flow Matching损失（MSE）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在RoboTwin 2.0（15个任务，5种具身）和提出的EmbodiBench（10个桌面任务，每任务30个生成的URDF）上评估。对比基线包括：连续关节空间控制（StarVLA joint）、256-bin离散化、FAST、以及消融变体（Angle+M去掉位姿监督，Angle去掉形态条件）。参考对比还包括末端执行器控制（StarVLA EE）。
  - **测试环境**：SAPIEN仿真器。
- **评价指标**: 任务成功率（Success rate），按任务宏平均（unweighted mean）。
- **主要结果**: 
  - 在RoboTwin 2.0上，RoboMorpher达到56.40%的平均成功率，比连续关节控制（46.67%）高出9.73个百分点。
  - 在EmbodiBench上，达到23.27%的平均成功率，比连续关节控制（7.93%）高出15.34个百分点（提升主要来自Lifting任务，从14%提升至55.11%）。
  - 消融实验证明，移除连杆位姿监督（Angle+M）会导致EmbodiBench成功率大幅下降17.94个百分点（降至5.33%），验证了形态感知几何监督的有效性。
  - 重建保真度：在未见过的URDF上，平均关节角误差在0.41°-0.54°之间，但存在较大离群值（最大方向误差近180°）。

### 6. 🔥 [HINT-WAM: Hindsight-Informed Training for World Action Models] (HINT-WAM：基于事后信息训练的世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24789` | [点击跳转](https://arxiv.org/abs/2611.24789)

**0. 论文标题**
- **英文标题**: HINT-WAM: Hindsight-Informed Training for World Action Models
- **中文标题**: HINT-WAM：基于事后信息训练的世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于事后信息（未来视频帧）的在线自蒸馏框架，让模型在自身采样轨迹上利用特权信息进行分布级蒸馏，解决了世界动作模型后训练中的暴露偏差和模式平均问题。

**1. 整体逻辑**
- **研究任务**: 世界动作模型（WAMs）在机器人操作任务中的后训练（策略微调与下游任务适配）。
- **研究动机**: 现有的离线监督微调（SFT）存在暴露偏差（只在专家轨迹上加噪，没见过自己采样器的中间状态）和目标模糊（当前观测下动作不唯一）；在线强化学习（RL）则面临稀疏奖励探索难、密集奖励只提供标量反馈而非直接动作目标的问题。
- **本质改动**: 引入“事后信息”（hindsight，即演示的未来视频帧）作为特权信息，让同一个模型既当学生（只看当前观测）又当老师（看未来视频），在模型自己生成的去噪轨迹上进行自蒸馏，并使用能量分数（energy score）进行分布级匹配，避免了速度场回归导致的模式平均（mode averaging）。
- **技术溯源**: 基于 Fast-WAM（Mixture-of-Transformers 架构，含 5B 视频专家与 1B 动作专家）、Flow-matching（整流流）、Energy score（能量分数），以及大语言模型中的在线自蒸馏（On-policy self-distillation）思想。

**2. 技术拆解**
- **核心方法**: HINT-WAM 框架分三阶段：1) SFT 初始化动作专家；2) 训练事后教师：冻结骨干，训练轻量级事后编码器和门控适配器来读取未来视频；3) 在线自蒸馏：学生模型在自己的 ODE 采样轨迹上，利用能量分数匹配教师的动作分布，同时用行为克隆（BC）作为锚点防止偏离。
- **关键细节**: 
  - **输入输出**：输入当前相机帧、语言指令、本体状态；输出 32 步的连续动作块。
  - **模型结构**：骨干（30层 MoT）全程冻结。教师端增加约 13M 参数（事后编码器 + 6层门控交叉注意力适配器）。事后编码器丢弃当前帧，对剩余未来帧的 VAE 隐变量进行空间池化和时序注意力提取。
  - **采样与监督**：学生从纯噪声开始积分 ODE（10步 Euler），记录中间状态。根据步长平方加权，选择最后 K 个点（默认 K=1）进行监督，不回传梯度。
- **训练/优化目标**: 
  - **教师训练**：带事后信息的 Flow-matching 损失。
  - **学生蒸馏（Stage B）**：联合损失 = 蒸馏损失 + BC 锚点损失。蒸馏损失主推能量分数（Energy Score），通过拉近学生样本与教师样本、推远学生样本之间来匹配分布，防止坍缩到条件均值；BC 锚点损失为不带事后信息的 Flow-matching 损失，用于约束学生不偏离演示分布。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-90（90个新任务，3921个演示）和 RoboTwin 2.0（50个任务中的25个困难子集）。
  - **Baselines**：Fast-WAM（原始检查点）、SFT（仅微调动作专家）、Full SFT（微调视频和动作专家）、BC control（继续 SFT 但无教师）、Self-imitation（加入自身成功轨迹的 SFT）、Shuffled hindsight（打乱事后信息的 HINT-WAM）。
- **评价指标**: 任务成功率（Success rates, %），在固定初始状态下进行 50 次闭环评估。
- **主要结果**: 
  - **LIBERO-90**：HINT-WAM 达到 85.18%，比 SFT (78.88%) 高 6.30%，比 Full SFT (81.24%) 高 3.94%（且训练成本仅为 Full SFT 的 0.56 倍）。
  - **RoboTwin 2.0**：在 clean 和 random 设置下分别达到 87.04% 和 83.68%，优于 BC control，且避免了继续 SFT 导致的性能下降。
  - **抗遗忘/持续学习**：在 LIBERO 原始 40 个任务上，无 replay 时 HINT-WAM 保留率最高（44.05% vs SFT 的 37.45%）；加入 replay 后，新任务 81.56%，原任务 95.10%，显著优于 SFT 和 Full SFT。
  - **消融实验**：能量分数（85.18%）显著优于速度匹配（79.02%）和动作空间 MSE（82.93%），有效避免了模式平均；事后信息和在线状态缺一不可，结合带来 6.3% 的提升。

### 7. 🔥 [Towards Pose-Robust Few-Shot Vision-Language-Action Models] (面向位姿鲁棒的少样本视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24360` | [点击跳转](https://arxiv.org/abs/2611.24360)

**0. 论文标题**
- **英文标题**: Towards Pose-Robust Few-Shot Vision-Language-Action Models
- **中文标题**: 面向位姿鲁棒的少样本视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 WACO 框架，利用机械臂和静态场景作为双锚点免标定估计位姿偏移，通过通道分离正则化和误差感知微调，使少样本 VLA 模型在相机和基座发生物理偏移时保持鲁棒，无需额外数据或修改模型架构。

**1. 整体逻辑**
- **研究任务**: 提升少样本视觉-语言-动作（VLA）模型在相机和机械臂基座发生物理位姿偏移（Pose Shift）时的执行鲁棒性。（本文属于方法创新与系统工程，同时提出了新的评测基准）
- **研究动机**: 现有 VLA 模型在微调时隐式假设相机和基座位置固定。实际部署中，相机被碰歪或基座重新对接产生几厘米/几度的偏移，会导致策略抓取位置错误。现有数据增强方法需要海量多视角数据（少样本无法承受），几何方法需要测试时的真实外参或标定物，且大多只解决相机偏移，忽略了基座偏移（基座偏移会同时改变图像和动作标签）。
- **本质改动**: 将相机和基座位姿偏移统一建模为相机-基座外参的变化。不依赖数据增强或真实外参，而是利用机械臂自身正运动学作为度量标定目标，静态场景作为世界锚点，在测试时免标定地估计偏移，将观测和状态正则化（canonicalise）回训练分布，并针对估计器的残差误差进行感知微调。
- **技术溯源**: 基于 $\pi_{0.5}$ (VLA 模型基座), LeRobot (训练框架), Depth Anything V2 (深度估计), LIBERO / LIBERO-Plus (仿真基准)。

**2. 技术拆解**
- **核心方法**: 提出 WACO (World-Anchored Canonicalization) 框架。包含三个核心模块：1) 免标定的双锚点偏移估计器（Arm Anchor + World Anchor）；2) 通道分离的正则化器（Channel-separated Canonicaliser）；3) 误差感知的微调策略（Error-Aware Fine-Tuning）。
- **关键细节**: 
  - **输入输出**：输入为单帧第三人称 RGB-D、腕部 RGB、关节角及末端状态；输出为基座坐标系下的末端执行器增量动作。
  - **系统架构**：WACO 前端（双锚点估计器 + 通道分离正则化器）包裹未修改的 $\pi_{0.5}$ 策略网络。前端在 CPU 上运行（单次约 0.8s），策略在 GPU 推理。
  - **双锚点估计器**：Arm Anchor 利用正运动学将机械臂点云与观测深度配准（使用 Trimmed ICP 和 render-and-compare 评分）；World Anchor 利用 SIFT + 3D RANSAC + point-to-plane ICP 将当前帧与空场景参考配准。融合两者解算出相机和基座的偏移，并利用面外残差（如基座不能离开地面）做无真值的一致性门控。
  - **通道分离正则化**：Channel A 仅用相机偏移对第三人称图像进行前向 splatting 变形（不 hallucinate 遮挡区域）；Channel B 仅用基座偏移将状态和动作映射回标定基座坐标系，并将末端执行器归位（homing）到演示起始位姿。
  - **规模与超参**：使用 4 张 A800 GPU 训练，全局 batch size 32；学习率从 2.5e-5 余弦衰减至 2.5e-6；往返重投影和状态噪声的应用概率均为 0.5；归位（homing）最多执行 25 个控制步。
- **训练/优化目标**: 保持 $\pi_{0.5}$ 原有的 flow-matching 目标不变，不增加任何参数或 token。训练机制为误差感知微调：以 0.5 概率应用往返重投影（引入空洞/边界伪影），以 0.5 概率应用结构化状态噪声（耦合位置与偏航角误差），使策略主动适应正则化器产生的伪影和估计残差。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：新提出的 LIBERO-PoseShift 基准（包含分级相机、基座及复合偏移），LIBERO-Plus 相机轨迹，以及 4 个真实机器人桌面任务（UR5e 机械臂）。
  - **对比对象（Baseline）**：标准少样本微调配方（B1）、加 2D 增强的 B1、仅用 W1 数据不跑推理的 B2、Align-and-replay、单锚点方法（Base/Camera gauge）、Ground-truth Oracle。
  - **测试环境**：仿真环境（robosuite/MuJoCo），真实环境（UR5e 机械臂，RealSense D435i 相机，CPU 运行前端，GPU 运行策略）。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - 在 LIBERO-PoseShift 上，WACO 平均偏移成功率达 87.2%，比标准配方（74.0%）提升 13.2 个点，恢复了 90% 的仿真 Gap。
  - 在 LIBERO-Plus 上，WACO 达到 93.7%，在不使用扰动训练数据的方法中取得 SOTA。
  - 在真实机器人上，WACO 将平均偏移成功率从 43.3% 提升至 80.0%（提升 36.7 个点），恢复了 87% 的真实机器人 Gap。
  - 在少样本（10 条演示）场景下优势更明显，比标准配方提升 19.2 个点，验证了该方法在数据稀缺时能有效替代数据增强的结论。

### 8. 🔥 [ProbeShare: Probing a Few, Sharing Across Many for Fast World-Model Planning] (ProbeShare：探测少数，共享多数以实现快速世界模型规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24229` | [点击跳转](https://arxiv.org/abs/2611.24229)

**0. 论文标题**
- **英文标题**: ProbeShare: Probing a Few, Sharing Across Many for Fast World-Model Planning
- **中文标题**: ProbeShare：探测少数，共享多数以实现快速世界模型规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ProbeShare 方法，通过仅评估少量代表性动作序列（探针），并利用场景条件化的相似度加权插值来重建所有候选动作的特征预测，将基于冻结世界模型的机器人视觉规划速度提升数十倍。

**1. 整体逻辑**
- **研究任务**: 加速基于冻结联合嵌入世界模型（Joint-Embedding World Model, JEPA）的机器人视觉规划过程，具体是加速交叉熵方法（CEM）规划器中候选动作序列的评估（rollout）。
- **研究动机**: 标准 CEM 规划器在评估每个候选动作时，都需要通过十亿参数级的预测器进行独立的前向推理。由于相邻动作引起的场景变化高度相似，这种独立评估会产生大量冗余计算，随着种群大小和搜索轮数的增加，严重拖慢闭环重规划的速度。
- **本质改动**: 放弃对所有候选动作进行独立推理，转而只推理少量代表性的“探针”动作，然后利用动作几何和场景条件化的相似度，通过加权组合探针的特征网格来插值重建所有候选动作的特征预测。
- **技术溯源**: 基于冻结的 V-JEPA 2.1 ViT-G/384 视觉编码器，以及 1B 参数规模的 RoboJEPA 动作条件预测头。

**2. 技术拆解**
- **核心方法**: ProbeShare 算法。首先初始化一个包含零命令和相反方向探针对的“探针库”。对于每个候选动作，通过场景条件化的动作编码器计算其与探针的相似度并分配几何权重；通过方向调整（directional adjustment）修正权重，以匹配候选动作在探针方向上的位移；最后用调整后的权重对探针的特征网格进行线性组合，重建候选动作的特征网格。当 CEM 搜索到远离现有探针覆盖的区域时，自适应地评估新探针并加入库中复用。
- **关键细节**: 
  - 输入输出：输入为双视角相机图像、机器人本体状态和目标图像；输出为候选动作序列对应的未来特征网格（600×1664）。
  - 模型结构：场景摘要由池化后的当前特征、特征差和本体状态拼接而成，输入上下文网络以条件化动作编码器。系统包含一个可微核读取头（differentiable kernel readout），用于学习动作表示空间中的相似度度量。
  - 规模与超参：预测头参数量为 1B；CEM 每轮评估 1024 个候选序列，保留 20 个精英；初始探针库包含零命令和基于余弦模式的探针对。
- **训练/优化目标**: 训练动作表示编码器和核读取头，保持视觉编码器和世界模型预测头冻结。损失函数包含三部分：响应损失（监督特征值及动作响应差异）、随机查询损失和聚焦查询损失（结合归一化代价误差、相关性和成对排序）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：RoboCasa 数据集上的四个任务（Reach, Object Reach, Obstacle, Push），训练和校准阶段还使用了 DROID 数据集。
  - 对比对象（baseline）：Dense CEM (RoboJEPA), CostGrad, DDP-WM, CompACT, Sparse Imagination。
  - 测试环境：NVIDIA A800, RTX 4090, RTX A6000 GPU。
- **评价指标**: 规划时间（秒）、目标进度/终端奖励（Progress/Terminal reward）、下一步特征 L1 误差（Next-step L1）、靠近目标的距离/成功次数。
- **主要结果**: 
  - 在相同搜索规模下，ProbeShare 比 Dense CEM 加速 43.8 到 128.9 倍（例如 Object Reach 任务从 1390.3 秒降至 10.8 秒），比最快的 baseline（CompACT）快 14.2 到 38.6 倍。
  - 在匹配规划时间下（如 Obstacle 任务约 569 秒），ProbeShare 评估的候选序列数量是 Dense CEM 的 40 倍；18 步后机械臂平均距离目标近 26.0 cm（Dense CEM 为 17.0 cm），终端奖励从 0.361 提升至 0.532。
  - 预测精度方面，ProbeShare 的下一步特征 L1 误差与 Dense CEM 相差不到 1%，证明了特征重建的高保真度。

### 9. 🔥 [SemPhys: Semantic-Physical Co-Learning for Humanoid Motion Generation via Differentiable World Models] (SemPhys：基于可微世界模型的人形动作生成语义-物理协同学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24074` | [点击跳转](https://arxiv.org/abs/2611.24074)

**0. 论文标题**
- **英文标题**: SemPhys: Semantic-Physical Co-Learning for Humanoid Motion Generation via Differentiable World Models
- **中文标题**: SemPhys：基于可微世界模型的人形动作生成语义-物理协同学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出SemPhys框架，通过可微世界模型将物理执行后的完整轨迹反馈给动作生成器进行语义对齐训练，解决了人形机器人在物理执行时因底层控制器的平衡修正导致动作语义偏离的问题。

**1. 整体逻辑**
- **研究任务**: 根据自然语言指令生成人形机器人的全身动作轨迹（Text-to-motion generation for humanoid robots）。
- **研究动机**: 现有方法通常先由生成器产出运动学参考轨迹，再由底层跟踪控制器在物理约束（如平衡、接触）下执行。但控制器为了维持平衡做出的局部修正（例如缩短转身幅度），会改变动作的整体语义（如转身没转够就往前走，导致方向错误）。在“生成空间”评估语义对齐，无法反映物理执行后的真实语义偏离（例如MotionGPT3参考轨迹检索准确率为74.08%，但物理执行后掉到了58.18%）。
- **本质改动**: 将语义对齐的评估和梯度回传从“生成空间”转移到“物理执行空间”。利用可微世界模型预测局部执行片段并拼接到完整轨迹中，使生成器能直接根据物理执行后的完整动作语义进行优化。
- **技术溯源**: 基于DiT（Diffusion Transformer）动作生成器、SuperMimic风格的冻结跟踪控制器、冻结的文本-动作匹配器（如GloVe matcher），以及学习的可微动力学模型（World Model）。

**2. 技术拆解**
- **核心方法**: SemPhys框架包含三个核心组件：
  1. **执行空间语义对齐**：直接在物理执行后的完整轨迹上计算语义损失，而不是在生成的参考轨迹上计算。
  2. **上下文执行代理（Contextual Execution Surrogate）**：由于端到端物理模拟不可微，使用可微世界模型和冻结控制器预测一个短时间窗口（如32步）的动作，将其拼接到 recorded rollout 的原始位置。这样既保留了全局动作上下文，又能通过局部窗口将语义梯度回传给生成器。
  3. **配对先验锚定（Paired Prior Anchoring）**：使用相同的指令和噪声，约束更新后的生成器输出与初始生成器输出的距离，防止生成器在优化过程中发生漂移和训练不稳定。
- **关键细节**: 
  - **输入输出**：输入为文本指令和随机噪声，输出为参考动作轨迹。
  - **模型结构**：DiT生成器（训练时仅更新其投影头 projection heads），冻结的跟踪控制器，冻结的文本/动作编码器，可微世界模型。
  - **规模与超参**：局部预测窗口长度 $H=32$（在50Hz控制频率下为0.64秒），训练 episodes 长度为6秒。
- **训练/优化目标**: 
  - **语义损失**：计算指令与拼接待评估的完整执行轨迹之间的嵌入距离（如欧氏距离）。
  - **锚定损失**：相同指令和噪声下，当前生成器归一化输出与初始冻结生成器输出的均方误差。
  - **总损失**：语义损失 + 锚定损失权重 + 辅助的物理塑形正则化。使用AdamW优化器。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：BONES-SEED（测试集包含13,302个动作片段，其中13,082个直立任务用于计算失败率）。
  - **对比对象（Baseline）**：TextOp, TeXedo, MoMask, ECHO, OMG, MotionGPT3, MDM。所有方法均在相同的冻结 Unitree G1 控制器下执行。
  - **测试环境**：MuJoCo 物理仿真环境，以及真实的 Unitree G1 人形机器人硬件。
- **评价指标**: 
  - **MM (Matching Metric)**：文本-动作嵌入距离（越低越好）。
  - **R@k**：指令检索准确率（Top-k，越高越好）。
  - **FID**：特征分布距离（越低越好）。
  - **Fail**：每千次直立任务的持续失败率（‰，越低越好）。
  - **User Study**：人工评估动作自然度和语义对齐度。
- **主要结果**: 
  - **语义与物理性能**：在BONES-SEED上，SemPhys的执行后R@1达到79.62%，比最强baseline MDM（60.10%）高出19.52个百分点；持续失败率极低，仅为0.25‰。
  - **语义保持能力**：参考轨迹到执行轨迹的语义损失极小（R@1仅下降1.04%），而MotionGPT3下降了15.9%。
  - **鲁棒性**：在16种动力学扰动条件（质量、摩擦力等）下，平均R@1仍达78.89%，比MDM高出20.43个百分点。
  - **实机部署**：成功部署到真实的 Unitree G1 机器人上，无需硬件微调即可执行“转身并向前走”等复杂连续指令。

### 10. 🔥 [JEPA Dots: Dual-Latent World Model for Language-Guided Robot Control] (JEPA Dots：用于语言引导机器人控制的双潜空间世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.24062` | [点击跳转](https://arxiv.org/abs/2611.24062)

**0. 论文标题**
- **英文标题**: JEPA Dots: Dual-Latent World Model for Language-Guided Robot Control
- **中文标题**: JEPA Dots：用于语言引导机器人控制的双潜空间世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种双潜空间架构 JEPA Dots，通过掩码注意力机制将语言条件严格限制在任务策略分支，使动力学预测分支保持指令无关，在极小参数量下实现了 LIBERO 基准上的高成功率闭环控制。

**1. 整体逻辑**
- **研究任务**: 语言引导的机器人视觉-动作控制（Vision-Language-Action modeling / 具身智能控制）。
- **研究动机**: 现有的基于 JEPA 的世界模型在引入语言条件时，通常将其直接作用于共享视觉表征，导致任务指令信息“污染”了物理动力学预测。理想情况下，语言指令应只影响动作选择，而不应改变在相同观测和固定动作下的物理演化后果。
- **本质改动**: 在共享视觉骨干中解耦出“动力学”和“任务”两条独立的潜空间路径，并通过严格的掩码注意力机制（Masked Attention）切断语言指令向动力学预测分支的信息流。
- **技术溯源**: 基于 JEPA (Joint-Embedding Predictive Architecture)、LeWM (LeWorldModel)、LeWAM、Flow Matching (流匹配策略)、FiLM (特征调制)、Sub-JEPA (子空间正则化)。

**2. 技术拆解**
- **核心方法**: 提出 JEPA Dots (Dynamics-Oriented Task Separation) 框架。采用共享视觉编码器，分出双潜空间表征（动力学与任务），结合掩码混合 Transformer (MoT) 进行联合建模，并使用流匹配（Flow Matching）生成动作。
- **关键细节**: 
  - **输入**：双视角 RGB 图像（外部+腕部）、15维本体感受状态、语言指令。
  - **视觉骨干**：共享的 ResNet-18。
  - **动力学分支**：无语言输入，通过 1x1 卷积和空间池化提取 192 维动力学潜变量。
  - **任务分支**：在池化前通过零初始化的残差 FiLM 注入语言特征，生成任务潜变量，并与语言嵌入融合成 goal tokens。
  - **掩码 MoT**：4层 Transformer。世界预测分支只能 attend 到动力学历史和提供的干净动作（clean actions）；策略分支 attend 动力学历史、goal tokens 和带噪动作（noisy actions）。
  - **规模**：可训练参数 16.4M，加上冻结的 MiniLM 语言编码器共约 39.1M。
- **训练/优化目标**: 联合优化三个损失：1) 世界预测损失（预测未来动力学潜变量的 MSE）；2) 动作流匹配损失（预测流匹配速度场的 MSE）；3) 子空间高斯正则化损失（对 192 维动力学潜变量在 8 个固定 24 维子空间上施加 SIGReg，约束表征质量）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO 的 4 个 suite（Spatial, Object, Goal, LIBERO-10），共 40 个任务。
  - **对比对象 (Baseline)**：V-JEPA 2.1-B/L + Flow Matching（自研基线），NanoVLA-S (161.0M)，SmolVLA-240M (240.0M)，以及 task-ID-conditioned baseline。
- **评价指标**: 闭环评估下的任务成功率（Success rate %）。
- **主要结果**: 
  - **整体表现**：在 40 个任务上达到 84.9% 的整体成功率，总参数量仅约 39.1M。相比 NanoVLA-S (78.7%, 161.0M) 和 SmolVLA-240M (82.8%, 240.0M) 成功率更高且参数量大幅减少（注：后两者评估协议与本文略有不同）。
  - **对比自研 Baseline**：比 task-ID-conditioned baseline (76.0%) 提升 8.9 个点，其中 LIBERO-Goal 任务从 67.1% 跃升至 88.5%。
  - **消融与验证**：引入子空间正则化使世界预测 MSE 相对降低 12.3%；指令切换实验证实，在固定观测和动作下，动力学潜变量和世界预测对语言指令完全不变（最大绝对变化为0），而任务表征和动作能正确响应指令变化，验证了双分支解耦的有效性。

### 11. 🔥 [LaST1.0: A Unified Latent World-Action Model with Control-Centric SpatioTemporal Reasoning] (LaST1.0：一种具有以控制为中心的时空推理的统一潜在世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23974` | [点击跳转](https://arxiv.org/abs/2611.23974)

**0. 论文标题**
- **英文标题**: LaST1.0: A Unified Latent World-Action Model with Control-Centric SpatioTemporal Reasoning
- **中文标题**: LaST1.0：一种具有以控制为中心的时空推理的统一潜在世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能与机器人操作领域的方法创新工作，提出了一种以控制为中心的潜在世界-动作模型，通过在潜空间预测紧凑的几何感知未来交互状态，并设计无视觉编码器接口与4D时空注意力机制，大幅提升了机器人精细操作的性能与泛化能力。

**1. 整体逻辑**
- **研究任务**: 视觉-语言机器人操作（Vision-language robotic manipulation），即根据多视角视觉观察和语言指令，生成机器人末端执行器的动作序列。
- **研究动机**: 现有的世界-动作模型（WAMs）通常通过生成完整视频来预测未来状态，这会将大量模型容量浪费在与控制无关的纹理、光照等外观细节上（observation-complete）；同时，深层视觉编码器（如ViT）会丢失对精细操作至关重要的局部细粒度视觉线索。
- **本质改动**: 将操作的世界建模从“预测完整外观视频”重构为“在潜空间中预测以控制为中心的几何感知未来动态”，并配套去除了深层视觉编码器，改用轻量级投影和4D时空注意力机制来保留细粒度空间线索。
- **技术溯源**: 基于 Qwen3-1.7B（作为语言编码器与Transformer骨干初始化）、VGGT-$\Omega$（用于提取未来几何感知潜在目标）、以及前作 LaST 0 / LaST 0.5。

**2. 技术拆解**
- **核心方法**: 
  1. **以控制为中心的潜在世界建模**：使用冻结的 VGGT-$\Omega$ 从未来的腕部相机视角提取紧凑的 register tokens 作为潜在目标（latent targets），将监督信号集中在机器人-物体交互区域。
  2. **无视觉编码器接口**：摒弃深层视觉编码器，使用轻量级两层卷积将原始图像 patch 直接投影到骨干网络，保留细粒度视觉线索。
  3. **LaST-Attention 与 4D-RoPE**：为 token 分配序列、高度、宽度、时间 4D 坐标，在注意力机制中独立旋转这四个子空间的 Q 和 K，实现结构化的多模态时空融合。
  4. **分支解耦训练**：使用特定的注意力掩码，将潜在预测仅作为训练时的正则化项，推理时直接丢弃潜在分支，实现动作-only部署。
- **关键细节**: 
  - **输入输出**：输入为语言指令和多视角图像（256×256）；输出为动作块（action chunk），包含末端执行器相对位姿和夹爪/灵巧手状态（14维双接口）。
  - **模型结构**：20层 Transformer（基于 Qwen3-1.7B 前20层初始化），隐藏层维度 2048；FFN 层采用任务路由 MoE（context, latent, action 三个专家），解耦不同任务的学习。
  - **关键超参**：潜在损失权重 $\lambda_{lat} = 0.1$，预测未来帧数 $F=4$，动作 horizon $H=8$；推理时采用 4 步 Euler 积分求解流 ODE。
- **训练/优化目标**: 采用线性条件流匹配（linear conditional flow matching），联合优化动作和潜在目标的流速度（flow velocities）。损失函数为动作 MSE 和潜在 MSE 的加权和。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真使用 RLBench（10个任务）、LIBERO（4个suite）、LIBERO-Plus（零样本泛化）；真实世界使用 5 个多阶段操作任务（涉及双 Franka、双 Tianji+夹爪、双 Tianji+Sharpa 灵巧手）。预训练数据包含 AGIBot、GenRobot、Simplexity Robotics i7 共约 25.5 万条轨迹（3900 小时）。
  - **对比对象（Baseline）**：OpenVLA-OFT, $\pi_{0.5}$, HybridVLA, StarVLA-$\alpha$, VLA-JEPA, LaST 0, Fast-WAM, Cosmos Policy, LingBot-VA。
- **评价指标**: 任务成功率（Success rate %）、推理时间（Inference time ms）、以及用于评估潜在目标几何准确性的 3D 欧氏误差（通过线性探测计算）。
- **主要结果**: 
  - **仿真表现**：在 RLBench 上平均成功率达 92.0%（SOTA，比 LaST 0 的 81.8% 提升 10.2%）；在 LIBERO 上达 99.0%；在 LIBERO-Plus 零样本泛化中达 86.3%（比 LaST 0 提升 13.1%）。
  - **真实世界表现**：5 个任务平均成功率 54.0%（SOTA），且推理时间仅 54.7 ms，显著快于 LaST 0（138.3 ms）和 Cosmos Policy（229.0 ms）。
  - **泛化性**：在物体、背景、位置变化的 OOD 场景中，LaST 1.0 的成功率下降幅度远小于基线模型（如背景变化下成功率无下降，而 Cosmos Policy 下降 36%）。

### 12. 🔥 [3DTouch: A Tactile-aware VLA Model with 3D Geometric Relations for Dexterous Manipulation] (3DTouch：面向灵巧操作的具备3D几何关系的触觉感知VLA模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23961` | [点击跳转](https://arxiv.org/abs/2611.23961)

**0. 论文标题**
- **英文标题**: 3DTouch: A Tactile-aware VLA Model with 3D Geometric Relations for Dexterous Manipulation
- **中文标题**: 3DTouch：面向灵巧操作的具备3D几何关系的触觉感知VLA模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出3DTouch，通过在统一3D坐标系下融合场景点云与多指触觉反馈，并显式建模手-物/物-物几何关系，大幅提升了VLA模型在接触密集型灵巧操作中的成功率。

**1. 整体逻辑**
- **研究任务**: 接触密集型灵巧操作（如漏斗插入、插头组装、按键等需要精确接触和几何对齐的任务）。
- **研究动机**: 现有VLA模型主要依赖视觉，但在灵巧操作中，手指和物体的遮挡会导致局部几何缺失；且视觉相似的场景可能因物体相对位置微小差异导致接触状态不同。现有的3D/触觉方法要么没把多指触觉与3D空间位置显式对齐，要么下采样的点云太粗糙无法捕捉微小间隙，缺乏对实体间相对几何关系的显式描述。
- **本质改动**: 把多指触觉测量和场景点云统一投影到机器人基坐标系下实现空间对齐，并利用手部关键点和物体表面点显式构建手-物、物-物之间的相对几何关系，把这些3D特征作为条件输入给预训练的VLA动作专家。
- **技术溯源**: 基于预训练的VLA模型 $\pi_0$（采用 flow-matching 动作专家），结合了 PointNet++（点云编码）、前向运动学（FK）以及轻量级6D位姿估计。

**2. 技术拆解**
- **核心方法**: 
  1) 3D Tactile Grounding (3DTG)：将RGB-D场景点云和五指密集触觉数据（每个触觉单元的3D位置和力向量）通过运动学转换到统一的机器人基坐标系，分别进行编码。
  2) Geometric Relation Modeling (GRM)：利用手部关键点和估计的物体6D位姿对齐后的表面点，计算手-物（HO）和物-物（OO）的相对位移和距离，编码为关系特征。
- **关键细节**: 
  - **输入与规模**：输入RGB-D图像、关节状态和五指触觉（每指120个taxel，共600个）。场景点云采样4096个点，编码出33个 scene tokens；触觉每指120个taxel的6维特征（3D位置+力向量）拼接后编码出5个 tactile tokens；HO和OO关系各编码出5个 relation tokens。
  - **位姿估计**：离线用 SAM2 和 RGBTrack 生成伪标签，训练一个轻量级网络在线预测物体6D位姿，用于在推理时对齐物体表面点。
  - **模型结构**：将生成的48个3D tokens（33+5+10）通过线性投影，插入到 $\pi_0$ 动作专家的观察后缀中，原有的视觉-语言前缀保持不变。
- **训练/优化目标**: 保留 $\pi_0$ 原有的流匹配（flow-matching）训练目标，不增加额外的损失函数。位姿估计器使用平移、旋转和表面点对齐损失进行监督。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 自采的5个真实机器人接触密集型操作任务（漏斗插入、插头组装、按键、海绵擦拭、移液器按压）的示教数据（每任务约100条）。
  - **硬件平台**: UR7e机械臂 + XHand灵巧手（带密集五指触觉）。
  - **对比对象（baseline）**: $\pi_0$, $\pi_{0.5}$, $\pi_0$+tactile, $\pi_{0.5}$+tactile, Tactile-VLA, Simple DP3+tactile, PointACT。
- **评价指标**: 真实机器人 rollout 的任务成功率（%），每个任务20次试验，计算5个任务的平均成功率。
- **主要结果**: 
  - 3DTouch 平均成功率达到 65.0%，比对应的VLA baseline（$\pi_0$ 的23.0%）提升了42个百分点，比最强的触觉感知baseline（Tactile-VLA的45.0%）提升了20个百分点。
  - 在需要精确几何对齐的任务（如漏斗插入、插头组装）上优势最明显。
  - **鲁棒性**：在目标位姿发生微小扰动（平移、旋转）时，3DTouch 成功率平均仅下降5.0%，而 baseline 下降13.3%。
  - **消融实验**：共享空间坐标系（机器人基坐标系）下的触觉表示比手部局部坐标系提升11个百分点；显式交互几何关系进一步提升了12个百分点。场景几何和空间触觉反馈具有明显的互补性。

### 13. 🔥 [GTI: Grounding Task Intent Throughout Long-Horizon VLA Manipulation] (GTI：在长视野VLA操作中全程接地任务意图)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23926` | [点击跳转](https://arxiv.org/abs/2611.23926)

**0. 论文标题**
- **英文标题**: GTI: Grounding Task Intent Throughout Long-Horizon VLA Manipulation
- **中文标题**: GTI：在长视野VLA操作中全程接地任务意图
- **研究机构**: 原文未提及
- **一句话总结**: 提出GTI框架，通过基于历史的意图定位和生成阶段条件化的视觉目标（明确区分接触态和完成态），解决VLA模型在长视野操作中全局指令无法动态适应局部子任务的问题。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在长视野（long-horizon）机器人操作任务中，全局指令无法有效指导局部子任务和交互阶段执行的问题。
- **研究动机**: 现有VLA模型在处理长序列任务时，全局指令保持不变，但机器人会经历不同的子任务和交互阶段。现有分层方法要么只把全局指令拆解为局部语言指令（缺乏视觉参考），要么仅用单一的“完成状态”作为视觉目标。这导致模型无法区分同一子任务中“建立接触”和“局部完成”这两个不同阶段所需的视觉目标，容易出现跳步、重复或失败后无法恢复。
- **本质改动**: 将长视野操作视为连续的任务意图接地问题。核心改动是引入“阶段条件化”的视觉目标生成（明确区分K1交互/接触态和K2局部完成态），并增加基于内部特征异常监控的局部回滚与重接地机制。
- **技术溯源**: 规划器基于 Qwen2.5-VL-3B，视觉接地基于视频生成模型 Wan2.2-TI2V-5B，底层执行器适配了 GR00T N1.5 和 $\pi_{0.5}$ 等VLA模型。

**2. 技术拆解**
- **核心方法**: GTI框架包含三个模块：1) 基于记忆的意图定位（Planner），利用当前观测和执行历史定位当前子任务和阶段；2) 阶段条件化视觉接地（Visual Predictor），根据当前阶段生成K1（交互/接触态）或K2（局部完成态）的视觉目标图像；3) 异常监控与局部恢复（Recovery），在检测到持续异常时进行局部回滚、重新观察和阶段重评估。
- **关键细节**: 
  - **Planner**：使用Qwen2.5-VL-3B，输入全局指令、当前多视角图像和执行历史，并行解码5个字段（技能、物体、目标、来源、阶段）。语义切换需要连续两次确认以防误判。
  - **视觉接地**：使用Wan2.2-TI2V-5B，将阶段（K1/K2）作为显式文本条件。训练时采用重复目标监督（1帧当前观测+4帧相同目标图像）以保留预训练的时序接口。推理时生成的目标图像作为VLA的额外视觉输入。
  - **VLA适配**：生成的K1/K2图像作为第四个视觉输入，与物理相机视图一起送入VLA的共享视觉编码器（如GR00T的Eagle或$\pi_{0.5}$的PaliGemma），不增加额外的视觉分支。
  - **异常监控**：使用LSTM-MLP对VLA动作潜变量的时序模式建模，预测异常概率。连续两个控制chunk超过动态阈值则触发局部回滚（8步回滚+4步稳定+60步冷却），保留当前子任务意图并重新评估阶段。
- **训练/优化目标**: 
  - **Planner**：交叉熵损失，并行监督5个字段的token预测。
  - **视觉接地**：Flow-matching 损失，在VAE潜空间中对速度预测进行监督，仅对目标潜变量位置计算损失。
  - **异常监控**：基于累积后缀的异常预测损失，对靠近异常起点的早期chunk赋予更大权重。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：仿真环境使用 RoboCasa365（包含seen/unseen的atomic/composite任务）和 VLA-Arena Horizon-Long（L0/L1/L2任务）；真实机器人使用 AgileX PiPER 6R 机械臂（3个任务：橱柜搜索/放置、甜椒-香蕉交换、猕猴桃搜索/放置）。
  - **对比对象**：匹配的全局微调（Global-FT）基线（仅使用全局指令），以及适配后的 ForeAct 基线。
- **评价指标**: 任务成功率（Success rate）。RoboCasa区分分布内（ID）和跨场景分布外（OOD）；VLA-Arena按任务难度（L0/L1/L2）加权计算整体成功率。
- **主要结果**: 
  - **RoboCasa365**：相比Global-FT，GTI+GR00T在seen composite任务上的ID/OOD成功率从14.6%/12.1%大幅提升至31.8%/20.4%；整体成功率提升8.5/2.8个百分点。
  - **VLA-Arena**：GTI+$\pi_{0.5}$整体成功率达47.6%，比Global-FT（43.8%）高3.8%，比ForeAct+$\pi_{0.5}$（45.2%）高2.4%；在较难的L1/L2多阶段任务上提升显著（如L1从3.5%提升至11.5%）。
  - **真实机器人**：三个任务的平均全流程成功率从21.7%大幅提升至59.2%（如甜椒-香蕉交换任务从13.3%提升至76.7%）。
  - **消融实验**表明，阶段条件化的K1/K2双视觉目标比单一K2目标或纯文本阶段提示更有效，局部恢复机制进一步保障了多阶段任务的成功率。

### 14. 🔥 [RePlan-VLA: Progress-Aware Replanning for Long-Horizon Vision-Language-Action Models] (RePlan-VLA：面向长时域视觉-语言-动作模型的进度感知重规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23843` | [点击跳转](https://arxiv.org/abs/2611.23843)

**领域与类型**：具身智能/机器人操作；系统工程/方法创新。

**0. 论文标题**
- **英文标题**: RePlan-VLA: Progress-Aware Replanning for Long-Horizon Vision-Language-Action Models
- **中文标题**: RePlan-VLA：面向长时域视觉-语言-动作模型的进度感知重规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个与底层VLA解耦的外部框架，通过VLM进行任务分解、细粒度视觉进度监控和失败重规划，在不微调VLA的情况下大幅提升长时域机器人操作的成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长时域（long-horizon）机器人操作任务中的可靠执行能力。
- **研究动机**: 现有VLA模型在短任务上表现好，但在长时域任务中难以兼顾推理、记忆、动作生成、进度跟踪和错误恢复，导致小错误累积引发下游失败。现有改进方法要么把长时域推理强加给VLA，要么用单调递增的进度奖励但缺乏显式的失败诊断和恢复机制。
- **本质改动**: 将长时域推理、进度跟踪和错误恢复从单一VLA策略中解耦出来，冻结底层VLA仅作为短任务执行器，引入外部VLM框架进行任务分解、基于视觉的细粒度进度监控和基于失败反馈的自适应重规划。
- **技术溯源**: 基于 Qwen3-VL-8B（作为规划器和进度估计器的基座），Awomo-0.5I（作为冻结的VLA执行器），以及 LoRA 微调技术。

**2. 技术拆解**
- **核心方法**: 构建了一个包含三个核心组件的闭环执行框架：1) 少样本 VLM Planner 负责将长指令分解为短任务原语序列，并在失败时重规划；2) 微调的 VLM Progress Estimator 负责在操作原语级别监控进度并诊断故障；3) 冻结的 VLA Policy 负责将当前子任务指令转化为底层控制动作。
- **关键细节**: 
  - **Planner**: 使用目标检测（SAM3 边界框）增强视觉输入以辅助场景接地推理。将任务分解为 `go_to`（接近并抓取）和 `move_to`（运输到目标）等原语。内置指令验证器（Instruction Verifier）确保生成的子任务指令符合底层冻结 VLA 的语言习惯。
  - **Progress Estimator**: 在单张 H100 上训练 80k 步，使用 LoRA (r=16, α=32) 和 1024 维回归头。输入为时序采样的视觉观察和任务上下文。输出连续进度值（用于判断当前原语是否完成）以及自然语言故障解释和重规划触发标志（用于指导 Planner 修正后续计划）。
  - **VLA Policy**: 保持完全冻结，仅接收当前活跃子任务的指令和观察，输出动作块（action chunk），不感知全局长时域历史。
- **训练/优化目标**: Progress Estimator 使用 Smooth L1 回归损失进行训练，基于抓取器、目标物体和目的地之间空间关系计算的真实进度标签进行监督。同时利用预训练语言推理能力（通过 LoRA 微调）生成故障解释，无需单独的故障诊断标签监督。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: RoboCasa365（Composite-Seen 和 Composite-Unseen 划分）和 CALVIN（ABCD → harD 的 5 步长序列困难子集）。
  - **对比对象 (Baseline)**: RoboCasa365 对比了 GR00T-N1.6, π0.5, RLDX-1, Xiaomi-Robotics-1, Awomo-0.5I, Foreact, Long-WAM, REKI-2B 等；CALVIN 对比了 π0.5, FLOWER, MDT, XR-0, MoDe, ForeACT, GR-1, NIAF 等。
  - **测试环境**: 仿真环境及 Franka Research 3 机械臂真机部署。
- **评价指标**: RoboCasa365 使用任务成功率（Success Rate, SR）；CALVIN 使用连续完成任务的平均数量（Avg. Len.）及各长度成功率。
- **主要结果**: 
  - **RoboCasa365**: 平均成功率达到 62.5%，比最强 baseline Awomo-0.5I（40.6%）高出 21.9%。在 Unseen 划分上达到 56.3%，比最强 baseline（Long-WAM + GPT-6 Astra, 35.0%）高出 21.3%。
  - **CALVIN**: 平均连续完成长度达到 4.10/5，比最强 baseline XR-0（3.58）高出 0.52。在 3 步和 4 步连续任务上分别保持 86% 和 76% 的高成功率。
  - **真机部署**: 在 Franka Research 3 上成功完成 3 步长时域操作序列，验证了框架在真实物理不确定性下的恢复能力。
  - **消融实验**: 验证了视觉接地（SAM3 边界框最优）、指令验证、重规划上下文（尤其是失败子任务和故障解释）以及微调的原语级进度估计对系统性能的不可或缺性。

### 15. 🔥 [CoT-WAM: Collaborative Training of Vision-Language Models and World-Action Models via Plan Latents] (CoT-WAM：通过计划隐状态协同训练视觉语言模型与世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23803` | [点击跳转](https://arxiv.org/abs/2611.23803)

**0. 论文标题**
- **英文标题**: CoT-WAM: Collaborative Training of Vision-Language Models and World-Action Models via Plan Latents
- **中文标题**: CoT-WAM：通过计划隐状态协同训练视觉语言模型与世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出CoT-WAM框架，通过可学习的连续隐状态接口和两阶段训练策略，将VLM的语义规划能力与WAM的物理预测能力进行联合优化，显著提升了机器人控制的泛化与长程规划能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Robot manipulation），具体为提升具身智能体在开放世界中的场景理解、语义泛化和长程任务规划能力。
- **研究动机**: 现有的世界-动作模型（WAMs）能预测物理世界演化，但缺乏开放世界语义理解和长程规划能力；而现有结合视觉语言模型（VLMs）的方法（如冻结VLM的ST-WAM，或依赖外部冻结教师的SG-WAM）无法让VLM的语义表示与WAM的物理预测进行联合优化，导致语义先验无法有效指导动作生成。
- **本质改动**: 在VLM和WAM之间引入可学习的连续隐状态（Plan Latents）作为通信接口，并通过文本和目标图像双重监督，配合两阶段训练策略，实现VLM语义规划与WAM物理预测的端到端联合优化。
- **技术溯源**: 基于 Fast-WAM（WAM基座，MoT架构）、Qwen3-VL-4B-Instruct（VLM基座）、Wan2.2-TI2V-5B（视频专家基座）、Flow-matching（生成范式）。

**2. 技术拆解**
- **核心方法**: 
  1. **隐状态接口（Latent Interface）**：VLM通过自注意力聚合观测和指令，输出连续的意图Token，经MLP投影后传给WAM的视频和动作专家，建立可微的信息通路。
  2. **双重监督机制**：用任务/子任务文本预测（Text supervision）和WAM视频专家预测的未来目标图像（Goal-image supervision）来监督隐状态，迫使其同时编码高层语义和具体的视觉状态演化。
  3. **目标条件化生成（Goal-Conditioned Generation）**：WAM利用预测出的目标图像来条件化动作和视频的生成，将抽象的语义意图落地到具体的视觉状态。
  4. **两阶段训练（Staged Training）**：Stage 1 联合训练VLM和视频专家（不含动作专家），学习隐状态表示；Stage 2 冻结VLM，从视频专家插值初始化动作专家，联合优化视频和动作生成。
- **关键细节**: 
  - **输入输出**：输入当前观测、本体状态和任务指令，输出长度为H的动作序列。
  - **接口规模**：默认使用8个可学习的意图Token（RoboCasa365长程规划任务中增至16个）。
  - **推理加速**：推理时跳过完整未来视频生成，仅用5步将目标图像去噪到 $\sigma=0.5$ 并固定，再用10步生成动作。
- **训练/优化目标**: 
  - Stage 1 损失：$\mathcal{L}_{stage1} = \lambda_{text}\mathcal{L}_{text} + \lambda_{goal}\mathcal{L}_{goal} + \lambda_{video}\mathcal{L}_{video}$。
  - Stage 2 损失：$\mathcal{L}_{stage2} = \mathcal{L}_{goal} + \mathcal{L}_{video} + \mathcal{L}_{action}$。
  - 所有生成任务（目标图像、未来视频、动作）均基于 Flow-matching 范式计算速度预测损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO, CALVIN, RoboCasa-Kitchen（控制性能）；LIBERO-Plus, LIBERO-Pro（零样本泛化）；RoboCasa365（长程规划）。
  - **对比对象（Baseline）**：VLA类（OpenVLA, $\pi_{0.5}$, X-VLA等），WAM类（Fast-WAM, ST-WAM, SG-WAM, LingBot-VA等）。
- **评价指标**: 任务成功率（Success rate, %）、平均成功链长（ACL）、零样本泛化成功率、长程规划复合任务成功率。
- **主要结果**: 
  - **控制性能**：无需额外具身预训练，在LIBERO（99.00%）、CALVIN（ACL 4.54）和RoboCasa-Kitchen（61.4%）上达到SOTA。相比Fast-WAM基线，LIBERO提升1.40%，RoboCasa-Kitchen大幅提升19.1%。
  - **零样本泛化**：在LIBERO-Plus（78.60%）和LIBERO-Pro（48.99%）上无需微调即大幅超越Fast-WAM（分别+27.10%和+6.61%），并超越部分使用额外预训练或外部视觉先验的方法。
  - **长程规划**：在RoboCasa365的Composite-Seen（20.42%）和Composite-Unseen（25.42%）上远超Fast-WAM（0.63%和2.50%），甚至显著超越使用Oracle特权状态调度器的Fast-WAM策略。
  - **真机实验**：在双臂平台上，平均成功率达61.3%（Fast-WAM为47.5%），验证了实际部署的有效性。

### 16. 🔥 [ZERITH V2.5: From Predictive Power to Policy Learnability] (ZERITH V2.5：从预测能力到策略可学习性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23746` | [点击跳转](https://arxiv.org/abs/2611.23746)

**0. 论文标题**
- **英文标题**: ZERITH V2.5: From Predictive Power to Policy Learnability
- **中文标题**: ZERITH V2.5：从预测能力到策略可学习性
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种两阶段训练的视频-动作模型，通过先在全噪声范围内单独微调视频生成模型，再联合训练动作策略，显著提升了机器人控制策略的学习效率和最终性能。

**1. 整体逻辑**
- **研究任务**: 机器人视觉-动作控制（根据多视角图像、语言指令和本体状态生成机器人动作）。
- **研究动机**: 视频生成模型学到的视觉预测先验与动作策略所需的控制知识之间存在Gap。直接联合训练（Direct training）往往效果不佳，因为预测和控制的优化目标不同，较低的视频预测误差并不能直接转化为更好的动作控制能力。
- **本质改动**: 采用“先视觉适应，后动作联合”的两阶段训练范式（Staged Training）。在动作策略接入前，先在全噪声范围内单独训练视频模型进行预测；同时动作策略仅读取视频模型的中间特征（Keys/Values）而不解码完整视频帧，实现视觉动态建模与动作读取的解耦。
- **技术溯源**: 基于 Wan2.2 (Wan2.2-TI2V-5B) 视频生成模型、umT5 (语言编码)、VGGT (几何特征提取)、Flow-matching (动作生成)。

**2. 技术拆解**
- **核心方法**: 
  1. **特征读取架构**：动作策略通过注意力机制读取视频模型中间层的 Keys 和 Values，单次前向传播即可为多步动作求解提供记忆，无需完全解码未来视频帧。
  2. **两阶段训练**：Stage 1 (S1) 冻结动作策略，在全噪声范围（0到1）内单独训练视频模型预测未来视觉特征；Stage 2 (S2) 接入动作策略和几何通路，在纯噪声水平下联合优化视频预测和动作生成损失。
  3. **几何条件注入**：引入几何通路，通过乘法残差（multiplicative residual）将当前场景的3D几何特征注入到视频模型导出的未来特征中，且初始化时残差为零以保持预训练权重不变。
- **关键细节**: 
  - 模型规模：视频模型约5B参数，动作策略10个block，总可训练参数约7B。
  - 输入输出：输入最多3个相机视角的图像、自然语言指令、机器人本体状态；输出16步的动作块（action chunk），部署时每次执行前4步。
  - 推理效率：推理时视频模型只计算到第24层（动作策略读取的最深层），省去最后5个block和解码头，单次决策延迟约331ms。
- **训练/优化目标**: 
  - S1目标：条件流匹配（Conditional flow matching）的视觉速度预测损失（仅更新视频模型）。
  - S2目标：视觉预测损失与动作流匹配损失之和。通过梯度路由（Gradient Routing）在S2初期（前5%进度）阻断动作梯度进入视频模型，随后线性恢复至全量，让视频模型先适应视觉目标再接受动作梯度的微调。

**3. 实验结果**
- **实验设置**: 
  - 数据集：预训练使用10,000小时真实机器人数据（6000h自有数据 + 4000h公开数据如ABC-130K, RoboMIND 2.0等）；下游评估使用 LIBERO, LIBERO-Plus, Meta-World MT50 以及真实机器人任务（Pick and place, Bin lining）。
  - 对比对象（Baseline）：$\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, Fast-WAM, Cosmos Policy。
  - 控制实验设置：固定下游演示数据和总更新次数（如30k），对比直接联合训练（Direct S2）与两阶段训练（3k S1 + 27k S2）。
- **评价指标**: 任务成功率（Success Rate, SR, %）。
- **主要结果**: 
  - **系统级表现**：在 LIBERO 达到 98.95%，LIBERO-Plus 达到 93.70%（显著优于 $\pi_{0.5}$ 的 85.70% 和 Fast-WAM 的 49.14%）；Meta-World MT50 达到 92.3%。真实机器人 Pick and place 成功率 97%（100次试验），Bin lining 成功率 40%（20次试验），均超越或持平 Baseline。
  - **训练策略收益**：在固定 30k 更新预算下，两阶段训练比直接联合训练在 LIBERO-Plus 上提升 19.16 个百分点。在 50k 预算下，两阶段训练（30k更新）仍比直接训练（50k更新）高出 16.68 个百分点，证明了其极高的样本和计算效率。
  - **消融实验结论**：
    1. 收益主要来自于**视频模型权重**的适应。将适应后的权重用于视频模型能提升 19.67 个百分点，但若仅用于初始化动作策略反而会导致性能下降 3.94 个百分点。
    2. S1 阶段必须使用**全噪声范围**训练。仅在部署时的纯噪声水平（$\sigma_w=1$）进行训练，会导致 LIBERO-Plus 性能大幅下降 20.80 个百分点。
    3. 在联合训练阶段，保留动作梯度对视频模型的反馈是必要的，全程阻断动作梯度会导致性能低于直接联合训练。

### 17. 🔥 [RecallFlow: Episodic Memory as the Source Distribution of Generative Robot Policies] (RecallFlow：将情景记忆作为生成式机器人策略的源分布)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23731` | [点击跳转](https://arxiv.org/abs/2611.23731)

**0. 论文标题**
- **英文标题**: RecallFlow: Episodic Memory as the Source Distribution of Generative Robot Policies
- **中文标题**: RecallFlow：将情景记忆作为生成式机器人策略的源分布
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RecallFlow，把机器人的情景记忆转化为流匹配策略生成动作时的初始源分布（高斯混合），让动作生成直接从记忆目标附近开始，解决了长历史条件带来的虚假相关和推理慢的问题。

**1. 整体逻辑**
- **研究任务**: 依赖记忆的视觉运动模仿学习（如“三仙归洞”任务，目标物体被遮挡后，机器人需记住位置并执行抓取或触碰）。
- **研究动机**: 现有的扩散/流匹配策略把历史观测当作额外的条件输入，但动作生成依然从标准高斯噪声开始。这导致两个问题：1）网络既要负责从长且冗余的历史中挑出相关目标，又要决定怎么动，容易产生虚假相关；2）初始纯噪声不包含记忆信息，生成过程缺乏向目标引导的起点。随着记忆负载增加，策略性能急剧下降。
- **本质改动**: 改变“记忆”在生成模型中的位置。不再把记忆作为条件（Condition），而是把记忆重定位后转化为动作空间的源分布（Source Distribution）。让生成起点直接靠近目标动作，传输网络只负责基于当前观测做微调。
- **技术溯源**: 基于 Rectified Flow（流匹配）、SigLIP 2（视觉编码器）、DiT（传输网络），代码实现基于 GMP 的开源库，记忆注意力机制参考了 SAM 2。

**2. 技术拆解**
- **核心方法**: RecallFlow 框架。核心思想是“记忆决定生成起点，当前观测决定如何到达”。包含两个核心模块：Recall-Relocalization（记忆重定位）和 Recall Anchors（记忆锚点）。
- **关键细节**: 
  - **记忆库**：保存历史帧的 patch 级 token，带有相机、位置和年龄嵌入。容量满时，合并最相似的相邻条目。
  - **Recall-Relocalization**：当前视角的 token 通过记忆注意力读取历史；随后，$K$ 个可学习的 recall slots 同时读取历史和当前视角，输出每个 slot 在当前视角的 heatmap 和 pooled feature，从而找到记忆目标在当前视角的对应位置。
  - **Recall Anchors**：将每个 slot 的特征映射为动作空间的一个高斯分布（均值和方差）。加上一个无记忆的标准高斯，混合成最终的源分布 $p_0$。
  - **传输网络**：DiT 结构，仅以当前观测为条件，将 $p_0$ 的样本沿直线传输到目标动作。
- **训练/优化目标**: 
  - **锚点训练**：使用最大似然估计（NLL），让高斯锚点靠近真实动作；加入 KL 散度防止方差过小；加入 relaxed winner-takes-all 保证所有 slot 都被训练。
  - **传输网络训练**：使用标准的 Rectified Flow 损失（MSE）。关键细节是，输入样本从解释真实动作最好的那个高斯成分中采样，并使用 stop-gradient 阻断梯度回传到锚点（作者指出如果用 flow loss 训练锚点，模型会倾向于把方差训得极小来作弊，而不是真正找对目标）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建 RecallSuite（5个记忆任务，按单/多物品记忆负载分组）；公开 MIKASA-Robo（5个记忆密集型任务）；RoboMimic（无记忆任务，测试记忆是否带来负面影响）；xArm 7 真机（4个记忆任务）。
  - **对比对象（Baseline）**：无记忆策略（DP, FM），历史条件策略（Medium/Long-history DP），以及 MIKASA-Robo 上的公开方法（Chameleon, GMP, MemoryVLA 等）。
- **评价指标**: 任务成功率（Success rate，要求首次选择正确且完成任务）。
- **主要结果**: 
  - **RecallSuite**：平均成功率 84.6%，比最强 baseline (Long-history DP, 64.3%) 高 20.3 个点。在多物品记忆任务（如 NoRepeat-4）上优势极大（64.7% vs 15.0%）。
  - **MIKASA-Robo**：平均成功率 80.4%，达到 SOTA（超越 Chameleon 的 75.1%）。
  - **RoboMimic**：在不需要记忆的任务上，性能与无记忆策略持平（89.0% vs 86.2%），而长历史 DP 性能下降，证明引入记忆没有带来负面影响。
  - **真机实验**：4个任务平均成功率 82.3%，比最强 baseline (Long-history DP) 高 18.8 个点。
  - **推理成本与分析**：推理延迟仅比无记忆策略增加 1.1ms，远低于长历史 DP（增加 35.1ms）。由于生成起点已经非常靠近目标，RecallFlow 仅需 1 步 Euler 积分就能保持极高的成功率。

### 18. 🔥 [Finetuning VLAs for Dexterous Manipulation: The Right Checkpoint Is All You Need] (为灵巧操作微调VLA：你需要的是正确的检查点)
- **研究机构**: `Mila / Renesas Electronics`
- **Arxiv ID**: `2611.23676` | [点击跳转](https://arxiv.org/abs/2611.23676)

**0. 论文标题**
- **英文标题**: Finetuning VLAs for Dexterous Manipulation: The Right Checkpoint Is All You Need
- **中文标题**: 为灵巧操作微调VLA：你需要的是正确的检查点
- **研究机构**: Mila / Renesas Electronics
- **一句话总结**: 本文系统评估了将VLA模型微调至多指灵巧手并结合扩散引导强化学习（DSRL）的五种策略，发现冻结VLM仅全量微调动作专家，并选择早期SFT检查点作为DSRL初始化，能获得最佳的引导成功率与泛化能力。

**1. 整体逻辑**
- **研究任务**: 将预训练的平行夹爪VLA（视觉-语言-动作）模型适配到多指灵巧手，并在少量遥操作演示数据下完成微调与强化学习优化。
- **研究动机**: 现有VLA主要在夹爪数据上预训练，迁移到多指手困难且数据收集昂贵。此外，现有微调研究仅基于SFT（监督微调）的rollout成功率来选择检查点，但当后续接上潜在噪声引导强化学习（如DSRL）时，SFT表现最好的检查点未必是DSRL引导效果最好的。
- **本质改动**: 转变评估视角，不单纯追求SFT的零样本成功率，而是将SFT视为DSRL的初始化阶段，系统对比了不同参数更新策略和不同SFT检查点对后续DSRL引导成功率（steerability）的影响，打破了“SFT成功率越高越好”的固有假设。
- **技术溯源**: 基于 $\pi_{0.5}$（双系统VLA，包含PaliGemma骨干和flow-matching动作专家），结合 Diffusion Steering Reinforcement Learning (DSRL)。

**2. 技术拆解**
- **核心方法**: 提出并评估了5种SFT微调配方（Expert-only, Frozen-LM, Full-FT, LoRA, LoRA-LM），将微调后的模型作为DSRL的冻结基座，通过在DSRL中学习初始噪声的分布来引导策略生成成功动作。
- **关键细节**: 
  - 基座模型：$\pi_{0.5}$（3B参数PaliGemma VLM + flow-matching动作专家，输出32步动作chunk）。
  - 硬件与环境：16-DoF LEAP hand，RoboCasa仿真环境。
  - DSRL机制：使用large-chunk变体，actor输出一个32维噪声向量并重复到整个chunk，用SAC训练噪声策略，全程冻结VLA权重。
- **训练/优化目标**: 
  - SFT阶段：Flow matching的velocity field回归损失。
  - DSRL阶段：SAC算法，优化目标是最大化累积奖励（每macro step -1直到成功），通过优化初始噪声来引导冻结的VLA。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboCasa仿真环境中的两个自定义任务（CoffeePressButton按咖啡机按钮，ScrewLightbulb拧灯泡），使用16-DoF LEAP手，每个任务几十条遥操作演示。
  - 对比对象（baseline）：5种SFT微调配方（Expert-only, Frozen-LM, Full-FT, LoRA, LoRA-LM），以及不同SFT步数的检查点（2k到18k步不等）。
- **评价指标**: 
  - SFT阶段的 rollout success（独立同分布噪声和重复噪声）。
  - DSRL后的 success rate，分为 training placements（训练位置）和 extrapolation placements（外推/未见位置）。
- **主要结果**: 
  1. SFT的成功率与DSRL后的成功率相关性很差（甚至负相关），用SFT成功率选检查点是次优的。
  2. Expert-only（冻结VLM，全量训练动作专家）是唯一能在所有配置下稳定引导成功的配方，训练位置成功率达95-100%。更新语言模型的配方表现最差。
  3. LoRA是最难被引导（least steerable）的方法。
  4. 随着SFT训练进行，可引导性下降但动作质量上升，建议选择能定性复现演示技能的最早SFT检查点作为DSRL初始化。

### 19. 🔥 [LoRN: Low-Rank Noise Steering for Generative Robot Policies] (LoRN：面向生成式机器人策略的低秩噪声引导)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23628` | [点击跳转](https://arxiv.org/abs/2611.23628)

**0. 论文标题**
- **英文标题**: LoRN: Low-Rank Noise Steering for Generative Robot Policies
- **中文标题**: LoRN：面向生成式机器人策略的低秩噪声引导
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种低秩噪声引导方法（LoRN），通过固定随机投影和范数控制机制，让小型强化学习actor能高效引导大型机器人基础模型（特别是世界-动作模型）的超高维视频和动作噪声，大幅提升任务成功率并实现零样本真机迁移。

**1. 整体逻辑**
- **研究任务**: 在不更新预训练生成式机器人策略（如扩散/流匹配模型）权重的前提下，通过引导其初始采样噪声来提升特定任务的表现。
- **研究动机**: 现有的噪声引导方法（如DSRL）难以扩展到大型机器人基础模型的高维噪声输入。研究发现，世界-动作模型（WAMs）生成的动作对“视频噪声”比“动作噪声”更敏感，但现有方法无法有效利用高维的视频噪声进行引导。
- **本质改动**: 将高维噪声的控制解耦。用一个低维actor通过固定的低秩随机投影来控制噪声方向，并结合范数控制机制保持混合后噪声的整体尺度（期望平方范数）不变，从而安全、高效地引导几十万维的视频噪声。
- **技术溯源**: 基于世界-动作模型（WAMs，如 Cosmos3-Edge, DreamZero）、视觉-语言-动作模型（VLAs，如 $\pi_0$, $\pi_{0.5}$）、Diffusion Policy，以及 SAC 强化学习算法。

**2. 技术拆解**
- **核心方法**: LoRN (Low-Rank Noise Steering)。训练一个小型的强化学习actor输出低维向量，通过固定的低秩随机投影矩阵映射到高维噪声空间；然后将该投影向量与新鲜的高斯噪声混合，通过严格的数学构造确保混合后噪声的期望平方范数与标准高斯噪声一致。
- **关键细节**: 
  - **输入输出**：Actor输入为观测（如图像特征、关节状态），输出为低维向量（如32维）；输出经投影和范数控制后，替换或混合进模型初始的超高维噪声（如50万维的视频噪声或上千维的动作噪声）。
  - **模型架构**：冻结的大型生成式策略 + 小型MLP/Transformer actor + SAC critic。
  - **关键超参**：投影秩 $r$（如32），最大引导强度 $\alpha$，控制actor输出范数饱和的阈值 $\rho$。
- **训练/优化目标**: 使用 SAC 进行强化学习训练。优化目标是最大化任务成功的奖励（如稀疏的+1奖励或分阶段奖励）。核心机制是通过保留高斯噪声分量或调整混合比例，确保引导后的噪声始终处于预训练策略去噪过程所能容忍的分布范围内，避免破坏生成质量。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：RoboLab, LIBERO, ALOHA, YAM, Robomimic 等仿真任务，以及 YAM station 物理双臂操作任务。
  - **对比对象 (Baseline)**：Base policy（无引导）, DSRL（现有的动作噪声引导方法）, LP-DS。
  - **测试环境**：Isaac Lab 仿真环境，以及物理双臂机器人 YAM station（使用 GR00T N1.7 和微调后的 $\pi_{0.5}$）。
- **评价指标**: 任务成功率（Success rate %），早期训练窗口内的平均成功率（Early-window mean）。
- **主要结果**: 
  - **WAMs视频噪声引导**：在3个WAM的10个模型-任务组合中，LoRN视频噪声引导在9个组合中取得最高平均成功率。平均成功率从 Base policy 的 43.0% 提升至 LoRN 的 69.2%（提升 26.2 个百分点），显著优于 DSRL 动作引导的 50.1%（提升 7.1 个百分点）。
  - **Action policies动作噪声引导**：在12个仿真任务中，LoRN 在 9 个任务上早期训练成功率最高；最终成功率与 DSRL 相当（在 $\pi_0$ 和 Diffusion Policy 上差距在 3% 以内），在 $\pi_{0.5}$ 上显著优于 DSRL 和 LP-DS。
  - **Sim-to-Real 零样本迁移**：在仿真中训练的 LoRN actor 直接部署到真机，无需额外真实世界训练。例如，Base policy 在真机 Cube to bowl 任务成功率为 0/10，LoRN 达到 6/10；在 Cube handover 任务中，微调后的 $\pi_{0.5}$ 成功率从 3/10 提升至 LoRN 的 8/10。

### 20. 🔥 [How Uncertain Is My Action? Self-Correcting Visual Planning with Frozen World Models] (我的动作有多不确定？基于冻结世界模型的自纠正视觉规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23620` | [点击跳转](https://arxiv.org/abs/2611.23620)

**0. 论文标题**
- **英文标题**: How Uncertain Is My Action? Self-Correcting Visual Planning with Frozen World Models
- **中文标题**: 我的动作有多不确定？基于冻结世界模型的自纠正视觉规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Actus 框架，通过反向利用冻结的潜在世界模型计算“偏移分数”，在不更新模型权重的情况下，检测、估计并补偿机器人视觉规划中的执行动作偏移。

**1. 整体逻辑**
- **研究任务**: 解决视觉规划中，冻结的潜在世界模型在部署时无法察觉实际执行动作与指令动作不一致（即“执行偏移”，如关节滑动、校准偏差等）的问题。
- **研究动机**: 现有的测试时自适应（TTA）方法通过更新权重来减小预测误差，但无法将“执行偏移”与“模型自身的预测误差”剥离开来；传统的残差能量（residual energy）指标也会将两者混淆，导致对微小偏移不敏感或产生误报。
- **本质改动**: 把冻结的世界模型当成反事实模拟器反向使用，将动作偏移建模为李群（Lie group）变换。通过计算模型残差在偏移方向上的投影（偏移分数），将“模型是否出错”转化为一个统计估计问题，从而在不更新权重的情况下实现故障检测与补偿。
- **技术溯源**: 基于冻结的潜在世界模型（LeWM、DINO-WM）和基于采样的模型预测控制（MPC/CEM）；理论基于统计局部故障检测方法（Rao score test、Fisher information、Cramér-Rao bound）。

**2. 技术拆解**
- **核心方法**: 提出 Actus (Action Uncertainty Self-correction) 框架。核心是“偏移分数（shift score）”，通过冻结模型对动作输入的李群变换求雅可比-向量积（JVP），提取出对偏移敏感的 K 维统计量。基于此分数进行 Rao 检验检测偏移，用高斯-牛顿（GN）法估计偏移量，并在触发警报后通过逆变换重新规划（replanning）。
- **关键细节**: 输入为当前观测和动作指令，输出为偏移估计和补偿后的动作。将动作偏移参数化为李群上的生成元（如 2D 平面的旋转、各向同性/异性增益、剪切，K=4；3D 空间的轴增益和旋转，K=6）。利用名义数据（nominal rollouts）预先校准残差协方差和过离散参数，以区分模型自身误差和真实偏移。
- **训练/优化目标**: 无需训练或更新权重。优化目标是最大化偏移分数在真实偏移下的似然，具体通过最小化白化残差的马氏距离（即高斯-牛顿迭代求解得分方程）来估计偏移量。

**3. 实验结果**
- **实验设置**: 在 PushT、TwoRoom 和 OGBench-Cube 三个视觉规划基准，以及真实的 SO-101 机械臂上进行测试。使用冻结的 LeWM 和 DINO-WM 作为世界模型。对比基线包括：无补偿的 Frozen 规划器、已知真实偏移的 Oracle、多种测试时自适应方法（AdaJEPA, OpTTA, JEPA-TTT, Sandwich-Residuals, ALRA）以及残差能量等检测基线。
- **评价指标**: 检测性能用 AUROC 衡量；补偿效果用任务成功率（Success Rate）和到达误差（reach error）衡量；估计精度用 Fisher 范数下的相对误差衡量。
- **主要结果**: 
  1. **检测**：Shift score 的 AUROC 比残差能量等基线高出 0.04-0.38，实测 AUROC 与理论预测偏差在 0.05 以内。
  2. **补偿**：在 PushT 上，成功率从 Frozen 的 0.650 提升至 Actus 的 0.862；在 OGBench-Cube 上从 0.378 提升至 0.432，性能逼近 Oracle@1，而 TTA 方法提升微弱甚至导致 nominal 成功率下降。
  3. **真机**：在 SO-101 机械臂上，成功检测到关节编码器未记录的 10° 基座偏移，将到达误差从 36-38 mm 降至 3.0-5.5 mm，接近机械臂的重复定位噪声（3.2-5.1 mm）。

### 21. 🔥 [RageVLA: Augmentation-Trained Perception and Action for State-of-the-Art Robustness on LIBERO] (RageVLA：通过增强训练感知与动作以实现LIBERO上最先进的鲁棒性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23517` | [点击跳转](https://arxiv.org/abs/2611.23517)

**0. 论文标题**
- **英文标题**: RageVLA: Augmentation-Trained Perception and Action for State-of-the-Art Robustness on LIBERO
- **中文标题**: RageVLA：通过增强训练感知与动作以实现LIBERO上最先进的鲁棒性
- **研究机构**: 原文未提及
- **一句话总结**: 通过在数据和策略输入端双重解耦物体位置、环境和指令，训练了一个仅0.21B参数的VLA模型，在LIBERO-PRO鲁棒性基准上大幅超越现有大参数模型。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的泛化与鲁棒能力，特别是在物体位置、环境、任务指令发生变化时的表现。
- **研究动机**: 现有VLA模型在LIBERO基准上看似饱和（成功率>90%），但在LIBERO-PRO（引入位置、任务等扰动）中一触即溃（如$\pi_{0.5}$在位置扰动下得分仅0.11）。根本原因是模型将“动作”与“训练时的物体位置、背景场景、特定指令”强耦合，退化为死记硬背训练轨迹，而非真正理解场景。
- **本质改动**: 在“数据”和“策略输入”两端同时进行解耦（Decoupling）。数据端通过通用规则打乱位置、环境和指令；策略端通过显式的感知模块输出解耦的物体3D位置和腕部特征，让动作模型基于当前真实感知做决策，而非回忆轨迹。
- **技术溯源**: 基于 DINOv3（视觉特征提取）、TinyCLIP（图文对齐嵌入）、CenterNet（目标检测头思想）、Flow-matching Diffusion Transformer（动作生成）。

**2. 技术拆解**
- **核心方法**: 
  1. 数据增强：将LIBERO演示数据按物体中心重排（随机平移旋转）、跨环境/跨桌面迁移任务、使用大模型改写指令。
  2. 解耦感知引擎：用冻结的DINOv3提取特征，通过轻量级Adapter输出显式的物体3D位置列表和腕部视图紧凑编码。
  3. 动作生成：将物体列表、腕部编码、TinyCLIP的图文嵌入融合，输入给从头训练的Flow-matching扩散Transformer生成动作。
- **关键细节**: 
  - 模型规模：总参数0.21B（s1）或0.27B（n1）。其中感知引擎174M（含冻结的DINOv3 86M和TinyCLIP 84M，仅训练4M的Adapter），动作引擎35M/100M。
  - 输入输出：输入为agentview和wristcam图像、本体感觉、指令；输出为20步的动作chunk。
  - 感知头设计：Agentview用类似CenterNet的卷积头输出物体类别、3D位置、偏航角；Wristcam压缩为8个token，训练时用解码器重建类别和深度图来进行监督。
- **训练/优化目标**: 
  - 感知头：Agentview使用Focal loss（类别）+ L1 loss（偏移、偏航、高度）；Wristcam使用加权交叉熵（类别）+ L1 loss（深度）。
  - 动作模型：Flow-matching目标，预测从噪声到动作chunk的速度场，推理时通过10步Euler积分求解。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-PRO（包含Obj, Pos, Sem, Task, Env五种单因素扰动测试），以及LIBERO-Object的渐进式位移测试。
  - 对比对象（baseline）：OpenVLA, $\pi_0$, $\pi_{0.5}$, MolmoAct, NORA, X-VLA等（数据取自LIBERO-PRO排行榜）。
- **评价指标**: 各扰动条件下的任务成功率（Success rate）。
- **主要结果**: 
  - 在LIBERO-PRO上，RageVLA s1 (0.21B) 总分达0.72，远超$\pi_{0.5}$ (3.3B) 的0.53。在位置(Pos)和任务(Task)扰动上优势极其显著（如Pos平均0.55 vs 0.11）。
  - 在LIBERO-Object渐进位移测试中，目标物体平移28cm时，RageVLA成功率仍保持0.865，而$\pi_{0.5}$骤降至0.105。
  - 机制验证：在推理时打乱输入的物体位置（保持图像不变），RageVLA成功率从0.965暴跌至0.215，证明其动作确实依赖于感知到的显式位置，而非死记硬背图像轨迹。

### 22. 🔥 [RoboBuilder: Agentic Robot Co-Design with Real-world Video Feedback in the Loop] (RoboBuilder：基于真实世界视频反馈闭环的Agent机器人协同设计)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.23855` | [点击跳转](https://arxiv.org/abs/2611.23855)

**0. 论文标题**
- **英文标题**: RoboBuilder: Agentic Robot Co-Design with Real-world Video Feedback in the Loop
- **中文标题**: RoboBuilder：基于真实世界视频反馈闭环的Agent机器人协同设计
- **研究机构**: 原文未提及
- **一句话总结**: 提出RoboBuilder基准与系统，让代码Agent在“仿真-真实搭建-视频反馈”的闭环中协同设计机器人硬件与控制程序，大幅弥合了纯仿真设计的Sim-to-Real鸿沟。

**1. 整体逻辑**
- **研究任务**: 让AI Agent利用给定的标准零件、电机和3D打印件，设计机器人的物理结构和开环控制程序，使其能跨越多种复杂物理障碍。
- **研究动机**: 现有Agent设计机器人高度依赖仿真器，但纯仿真无法准确模拟真实物理世界的摩擦、形变和装配误差（Sim-to-Real Gap）。仅用公开数据初始化的仿真器，其通过的15个设计在真实世界中全部失败。
- **本质改动**: 将真实世界的物理测试和失败视频反馈引入Agent的设计闭环。Agent不仅要在仿真中迭代，还要根据真实搭建和测试的失败视频，主动修正仿真器的物理参数并重新设计硬件。
- **技术溯源**: 基于MuJoCo物理引擎构建仿真器，依赖前沿代码Agent（Opus 5.5, Sonnet 5.5, GPT-6 Astra, GPT-6.1 Sol），使用CadQuery生成自定义3D打印件的CAD代码。

**2. 技术拆解**
- **核心方法**: 构建了包含四个模块的系统：1) Bench定义任务与约束；2) Sim让Agent通过台架测试和真实视频学习并校准仿真器物理参数；3) Lab将仿真通过的设计人工搭建并在真实赛道测试；4) Loop将真实失败的视频反馈给Agent，Agent修正仿真器并重新设计，再次搭建验证。
- **关键细节**: 输入为132种标准零件（约3000件库存）、电机及最多4个自定义3D打印件；输出为零件装配序列与开环电机时序程序。系统包含10个物理障碍（3个难度级别）。实验共进行16,427次仿真，涉及12,774个独立机器人设计，人工搭建了135个实体机器人（耗时约240小时）。
- **训练/优化目标**: 仿真器校准目标是最小化仿真轨迹与真实视频轨迹的差异（需满足台架测试约束）；设计优化目标是在通过障碍的前提下最小化质量（Light）或时间（Fast）；闭环重设计要求在修正后的仿真器中通过，且在参数扰动下具备鲁棒性（5次仿真至少3次通过）。

**3. 实验结果**
- **实验设置**: 使用自定义的10个物理障碍赛道（3个难度）和真实零件库。对比Baseline包括全库存随机搜索、遗传算法（GA）、参数化搜索（CMA-ES等）以及单次LLM调用。测试了Opus 5.5等四个前沿代码Agent。
- **评价指标**: 任务通过率（Passing rate）、仿真到现实的转化率（Real pass rate）、优化指标（最轻质量/最快速度得分）、设计的新颖性与多样性（功能空间距离与Vendi score）。
- **主要结果**: 1) Agent在Level-1任务中通过率高达98%，而全库存搜索通过率为0；2) 学习后的仿真器使73%的Level-1/2仿真通过设计在真实世界中成功（初始仿真器为0%）；3) 引入真实视频反馈闭环后，消除了72%的真实失败，真实世界转化率提升至93%；4) Agent设计出了轮足、缆车等新颖机制，功能空间新颖度比Baseline高8-9倍；5) 局限在于单一机器人通过所有障碍的集成任务（All-in-one）中表现不佳（最多通过60%），因各障碍需求存在物理冲突。
