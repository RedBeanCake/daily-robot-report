            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Agentic World Action Models] (智能体世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30136` | [点击跳转](https://arxiv.org/abs/2610.30136)

**0. 论文标题**
- **英文标题**: Agentic World Action Models
- **中文标题**: 智能体世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 AW-0 框架，将基于代码的智能体规划引入世界动作模型，通过混合 Transformer 联合生成代码、视频和动作，并辅以自动标注与混合执行策略，显著提升了机器人复杂操作的语言跟随、语义推理与鲁棒性。

**1. 整体逻辑**
- **研究任务**: 机器人复杂操作任务中的长程规划、物理动态预测与低级运动控制。
- **研究动机**: 现有的世界动作模型（WAM）能预测未来视觉和动作，但缺乏显式的组合技能复用和长程任务分解能力；而智能体机器人（Agentic robotics）擅长基于代码的规划和技能复用，但缺乏对真实物理动态的预测基础（predictive grounding）。
- **本质改动**: 将基于代码的规划直接作为高级规划接口引入端到端的世界动作模型中，通过联合去噪让代码、视频和动作三个生成流相互条件化，并在推理时支持代码执行与直接动作输出的动态混合仲裁。
- **技术溯源**: 基于 Mixture-of-Transformers (MoT) 架构；代码专家基于 Qwen3-VL (ViT) 和 SDAR-1.7B (LLaDA-style masked-token diffusion)；视频专家基于 Cosmos-Predict2.5 (DiT)；动作专家为 Action DiT；预训练数据包含 YAM 机器人数据和 Egocentric Human 数据。

**2. 技术拆解**
- **核心方法**: 
  1. **联合生成架构**：提出包含代码、视频、动作三个专家的 MoT 架构，通过掩码联合注意力进行联合去噪。代码流提供规划上下文，引导视频和动作的生成。
  2. **自动标注流水线**：利用大模型（Gemini 3.1 Pro, Claude Opus 4.8）为机器人和人类视频轨迹生成子任务级别的代码程序，并提炼出可复用的技能库（Skill library）。
  3. **混合执行策略（Hybrid Actions）**：在推理时，通过仲裁机制动态决定是执行生成的代码片段（调用感知和控制原语）还是直接执行动作专家生成的动作块。
- **关键细节**: 
  - **模型结构**：28层 Transformer，2048维注意力空间。代码专家使用离散掩码扩散（absorbing-mask），视频和动作专家使用连续 Flow Matching。
  - **输入输出**：输入为多视角观察、语言指令、机器人状态和记忆缓存；输出为参数化技能例程（代码）、未来视觉状态（视频）和低级电机命令（动作）。
  - **规模**：预训练数据约 2000 小时 YAM 机器人数据 + 1000 小时人类数据；提炼出 50 个可复用技能（YAM 23 个，人类 27 个）。
- **训练/优化目标**: 
  - **联合去噪损失**：视频和动作使用 Flow Matching 损失（回归速度目标），代码使用 Masked Cross-Entropy 损失。
  - **噪声重采样（Noise Resampling）**：引入均匀分布成分拓宽视频的高噪声预训练分布，并使用重要性权重（Importance weights）平衡视频学习和对动作的预测引导。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：仿真环境 RoboTwin 2.0（50 个任务，包含 Clean 和 Random 设置）；真实世界 8 个任务（涵盖 YAM 平行夹爪平台和 Tianji-Sharpa 灵巧手平台）。
  - **对比对象（baseline）**：$\pi_{0.5}$ (VLA), EgoScale (VLA), DreamZero (WAM), WLA (自回归 WAM)。
- **评价指标**: 
  - **仿真**：成功率（Success rate, %）。
  - **真实世界**：基于任务特定评分规则的平均得分（Average rubric score, %）。
- **主要结果**: 
  - **仿真表现**：AW-0 默认模式平均成功率 50.7%（Clean 80.8%），超越所有 baseline（最高 baseline WLA 为 34.2%）。在 Random 设置下，混合执行模式（Hybrid）将成功率从 20.6% 提升至 29.2%，超越 $\pi_{0.5}$ (27.7%)，展现出更强的分布外鲁棒性。
  - **真实世界表现**：AW-0 在 8 个任务上的平均 rubric 得分达到 71.1%，比最强 baseline（DreamZero 46.0%）高出 25.1 个百分点。在语言跟随（如 Arrange Fruits）和灵巧操作（如 Deal Poker）任务上优势显著。
  - **消融与效率**：使用 ViT 特征替代 VAE 特征条件化代码专家可大幅提升细粒度语义推理性能；联合去噪相比自回归（AR）生成在 7/8 个任务上表现更好，且推理延迟从 0.55s 降至 0.23s（提速 2.39 倍）。

### 2. 🔥 [TARSphere: A Robot-Oriented Full-Stack Framework for Long-Horizon Embodied Agents in Evolving Physical and Social Environments] (TARSphere：面向动态物理与社会环境中长程具身智能体的机器人全栈框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30043` | [点击跳转](https://arxiv.org/abs/2610.30043)

**0. 论文标题**
- **英文标题**: TARSphere: A Robot-Oriented Full-Stack Framework for Long-Horizon Embodied Agents in Evolving Physical and Social Environments
- **中文标题**: TARSphere：面向动态物理与社会环境中长程具身智能体的机器人全栈框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个耦合连续物理仿真、具身NPC交互与事件驱动状态机的全栈具身框架，并构建了包含动态环境变化的基准TARSphere-Bench，用于评估冻结的大模型在长程任务中的物理执行与社会交互闭环能力。

**1. 整体逻辑**
- **研究任务**: 构建并评估能够在动态变化的物理和社会环境中执行长程任务（如导航报告、抓取递送）的具身智能体系统。
- **研究动机**: 现有具身基准要么将物理执行抽象为离散符号动作（忽略了碰撞、摩擦等物理约束），要么只关注固定目标（忽略了环境动态变化、任务更新和人类NPC交互对决策的真实影响）。
- **本质改动**: 将连续物理引擎、受空间/视线限制的具身NPC交互与事件驱动有限状态机（FSM）深度耦合，并设计了统一的技能接口（Harness），让冻结的多模态大模型（MLLM）直接接收物理执行反馈（如运动残差、碰撞方向）进行闭环决策，而非仅输出抽象符号。
- **技术溯源**: 基于 Isaac Sim 和 PhysX 物理引擎进行仿真，使用 GRScenes-100 场景库；评估对象为冻结的通用/具身多模态大模型，未提及特定的微调基座。

**2. 技术拆解**
- **核心方法**: 
  1. TARSphere-Infra（执行基础设施）：在物理引擎中运行机器人策略和具身NPC，通过事件驱动的FSM根据动作实际完成情况和消息传递状态更新任务状态。
  2. TARSphere-Harness（具身大脑线束）：为冻结的MLLM提供分层记忆、多级可执行技能（导航、抓取、社交等）和物理执行反馈，实现基于观测和反馈的闭环重规划。
  3. TARSphere-Bench（基准测试）：通过Agent-in-the-loop构建360个任务片段，包含基础任务及5种配对条件（感知鲁棒性、干扰适应、任务更新、人类协调、意图理解）。
- **关键细节**: 
  - 物理执行：机器人移动和抓取受接触和摩擦约束，系统会记录真实的碰撞和摔倒。
  - NPC交互：NPC受距离、视线和听力范围限制，通过LLM后端回复授权话题。
  - Harness输入输出：输入当前RGB-D、LiDAR、公共事件和执行反馈；输出1-5个动作序列，单次任务决策上限100次。
  - 基准规模：30个室内场景，360个episode，涵盖2个任务族。
- **训练/优化目标**: 本文为系统与评测类工作，模型权重保持冻结。核心机制为基于事件驱动的FSM状态转移，以及五阶段质量评分（任务理解、目标观察、现场完成、接收者观察、最终完成），结合物理执行指标（碰撞/摔倒率、路径效率）进行综合评估。

**3. 实验结果**
- **实验设置**: 
  - 数据集：TARSphere-Bench（360 episodes）。
  - 对比对象（baseline）：8个冻结的MLLM，包括4个闭源（GPT-5.6-Terra, Claude Sonnet-5, Gemini-3.8-Flash, Qwen3.7-Plus），2个通用开源（Qwen3.8-27B, Gemma-4-31B），2个具身开源（Hy-Embodied-VLM-1.0, RoboBrain2.0-32B）。
  - 测试环境：Isaac Sim物理仿真环境，所有模型共享Harness接口、提示词和100次决策预算。
- **评价指标**: 
  - Progress（进度）：5个阶段的加权质量得分。
  - Success（成功率）：最终任务正确完成且无终端摔倒/掉落的比例。
  - Execution Quality：路径效率（Eff.）、决策/Token成本（Cost）、安全性（碰撞/摔倒发生率）。
- **主要结果**: 
  - 闭源通用模型表现最好：Gemini-3.8-Flash在导航和递送任务中成功率分别达40.6%和47.8%，远超第二名；开源通用模型（Gemma-4-31B）优于具身专用模型（后两者成功率几乎为0）。
  - 能力缺口因任务而异：模型在感知鲁棒性（PR）和干扰适应（DA）上表现接近Base，但在任务更新（TU）和人类协调（HC）上存在显著短板。
  - 物理安全性堪忧：即使是最强模型，碰撞发生率也高达84%-100%，摔倒率达9%-47%，证明规划成功不等于物理执行安全。
  - 消融实验表明：移除LiDAR、运动残差或抓取技能会显著降低成功率；提供底层执行辅助（如运动/摩擦辅助）能提升完成率，但无法消除任务更新和人类协调带来的能力差距。

### 3. 🔥 [Post-hoc Epistemic Uncertainty for Vision-Language-Action Policies] (视觉-语言-动作策略的事后认知不确定性估计)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.29730` | [点击跳转](https://arxiv.org/abs/2610.29730)

**0. 论文标题**
- **英文标题**: Post-hoc Epistemic Uncertainty for Vision-Language-Action Policies
- **中文标题**: 视觉-语言-动作策略的事后认知不确定性估计
- **研究机构**: 原文未提及
- **一句话总结**: 提出在单一冻结的VLA模型嵌入层上直接附加高斯过程核方差头来估计认知不确定性，在主动学习和任务委派中达到了与双模型集成方法相当的效果，同时计算开销降低了数十倍。

**1. 整体逻辑**
- **研究任务**: 估计视觉-语言-动作（VLA）策略的认知不确定性，以指导机器人在遇到未知情况时请求新演示或向更强策略求助（即主动学习与任务委派）。
- **研究动机**: 现有表现较好的不确定性估计方法（如基于集成的速度场不一致性 VFD）需要训练和运行多个策略，计算和训练成本极高，难以在资源受限或大模型场景下部署。
- **本质改动**: 抛弃多模型集成，直接在单一冻结VLA策略的中间嵌入层上事后（post-hoc）拟合高斯过程核方差头，无需梯度更新和回归目标，不改变原策略。
- **技术溯源**: 基于 SmolVLA（VLA基座模型）、SAVE（主动微调协议）、LIBERO/LIBERO-10（仿真基准）、高斯过程（Gaussian Process）。

**2. 技术拆解**
- **核心方法**: 提出事后核方差头（post-hoc kernel-variance heads）。利用高斯核计算当前查询观测的嵌入与训练演示支持集（support set）嵌入之间的条件方差。支持针对单一模态（如仅视觉、仅语言）的独立头，以及融合多模态的整体头。
- **关键细节**: 
  - 输入输出：输入为VLA策略提取的嵌入特征（如 KV-Ctx 读取视觉-语言前缀状态，KV-Dec 读取动作专家第9步的隐藏状态）。输出为0到1之间的不确定性方差分数。
  - 模型规模：基于 SmolVLA。支持集大小约1000到10000个观测。
  - 关键超参/预处理：使用 Ledoit-Wolf 收缩协方差对嵌入进行白化（whitening）；高斯核带宽基于 k-NN 中位数距离设置；正则化参数 $\lambda$ 设为 $10^{-3}$ 或 $10^{-2}$。
- **训练/优化目标**: 无需回归目标，无需梯度更新。核心机制是计算高斯过程在支持集条件下的后验方差，通过 Cholesky 分解计算核矩阵的逆来实现。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-10（包含10个目标任务的仿真操作基准）。
  - 对比对象（baseline）：双策略集成方法（VFD, GU, DECU, Action-L2），单策略基于熵的方法（ACE, VLM entropy, VLM perplexity），以及简单的“演示数量”参考基线。
  - 测试环境：基于 LeRobot 构建，使用 RTX 3090 或 A100 GPU 进行单卡测试。
- **评价指标**: 
  - 任务级校准：任务平均不确定性与任务成功率之间的负 Spearman 和 Pearson 相关系数。
  - 演示获取：SAVE 协议下的任务成功率、获取的新演示数量、每轮计算开销（GPU-minutes）。
  - 监督者委派：全局和任务内的归一化 AUC（nAUC），以及自动化比例（automated fraction）。
  - 受控扰动检测：在任务内区分受扰动和干净观测的 AUROC。
- **主要结果**: 
  - 校准与委派：KV-Ctx 和 KV-Dec 在任务级校准（负 Spearman 相关系数达 0.75-0.77）和全局委派（nAUC 约 0.50-0.51）上表现与双策略集成 VFD（0.75, 0.48）相当甚至略优。
  - 计算成本：KV-Ctx 在评分时比 VFD 快约 50 倍，每轮设置时间快约 44 倍（从 15 GPU-hours 降至 15 GPU-minutes）。
  - 主动学习：在 SAVE 协议中，核方差头指导的获取成功率（约 65.7%）与集成方法（VFD 61.9%, GU 64.4%）相当，且能 100% 避免重复请求已获取的演示。
  - 评估协议反思：发现 LIBERO-10 的标准评估主要奖励对“任务间演示覆盖率”的识别，而非“任务内”的排序。任务内执行噪声掩盖了真实差异。
  - 受控扰动：上下文特定头能精准识别对应模态的扰动；融合头能发现单独熟悉但组合陌生的输入。在受控扰动下，KV-Dec 在任务内委派上显著优于 VFD（nAUC 0.46 vs 0.40）。

### 4. 🔥 [Toward Recursive Self-Improvement in Physical AI] (迈向物理AI的递归自我改进)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.29677` | [点击跳转](https://arxiv.org/abs/2610.29677)

**0. 论文标题**
- **英文标题**: Toward Recursive Self-Improvement in Physical AI
- **中文标题**: 迈向物理AI的递归自我改进
- **研究机构**: 原文未提及
- **一句话总结**: 本文是一篇综述，系统梳理了物理AI（如机器人）中递归自我改进（RSI）的理论框架，界定了从行为改进到真正递归自我改进的四个层级声明，并分析了物理环境带来的独特限制与评估基准。

**1. 整体逻辑**
- **研究任务**: 梳理和界定物理AI（机器人）系统中的递归自我改进（RSI）机制，明确其与数字RSI的区别，建立评估物理系统是否真正实现RSI的理论框架和实验标准。
- **研究动机**: 现有的数字RSI（如代码自我修改）机制在迁移到物理世界时，面临传感器不可靠、试错成本高、物理不可逆及硬件漂移等独特挑战。目前领域内缺乏统一标准，来严格区分“系统只是变强了”和“系统改进了自己学习的方法（甚至改进了改进者本身）”。
- **本质改动**: 将RSI在物理机器人学习中的进展拆解为四个递进的声明层级，并提出了验证真正递归（R1和R2链接）的严格对照实验标准，把“改进者（Improver）”和“学习过程（Learning procedure）”在概念上做了严格剥离。
- **技术溯源**: 基于机器人学习领域的经典范式（强化学习、模仿学习、元学习、AutoML、持续学习），以及近期的物理AI基座系统（如RT系列、OpenVLA、Eureka、RECAP等）。

**2. 技术拆解**
- **核心方法**: 提出了一套概念框架和评估体系。将系统“保留的变更”分类为策略、世界模型、外部知识和学习过程。定义了“学习过程”（决定收集什么、怎么评判、怎么更新）和“改进者”（提出或选择学习过程修订方案的组件）的区别，并给出了验证递归的数学符号定义。
- **关键细节**: 
  - 四个递进声明：1. 行为改进（执行得更好）；2. 后续学习收益（帮助后续学习者）；3. 过程改进（修订后的过程教得更好）；4. 递归自我改进（包含R1：修复知识改进了改进者；R2：改进后的改进者能产生自身的下一次改进）。
  - 物理环境的四个限制条件：信息反馈（能否指出剩余缺陷）、可用性（接收组件能否使用变更）、对分布偏移的鲁棒性（硬件/任务变化后是否依然有效）、持续实践（能否安全且低成本地继续试错）。
  - 提出了“冻结知识对照（frozen-knowledge control）”和“固定改进者对照（fixed-improver control）”来严格验证R1和R2。
- **训练/优化目标**: 本文为综述，无具体训练目标。其核心机制是分析现有文献中的优化目标，并指出真正的RSI需要优化目标本身（或生成优化目标的机制）能够基于历史物理修复经验进行自我迭代。

**3. 实验结果**
- **实验设置**: 本文为综述，无单一实验设置。梳理了现有文献中的基准测试（如LIBERO, RoboCasa, PhysRSI-eval, FailBench等）以及各类硬件/仿真评估环境。
- **评价指标**: 综述中总结的现有研究评价指标包括：任务成功率、部分任务进度得分、执行效率（如周期时间）、学习效率（所需时间/样本量）、前向迁移（Forward transfer）和能力保留率（Retention）。
- **主要结果**: 
  - 现有物理AI研究主要支持前三个层级的声明（行为改进、后续学习收益、过程改进）。
  - 核心结论：目前**尚无**被综述的物理研究通过严格的对照实验（如冻结知识对照）分离出可归因于真正递归（R1和R2）的增益。
  - 指出当前评估的局限性：许多声称“自我改进”的工作实际上只是固定流程下的行为提升，或者只是改进了学习过程，缺乏对“改进者自身是否变好”的因果验证。

### 5. 🔥 [From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation] (从VLM规划器到机器人智能体：面向依赖历史操作的自我进化控制框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.29560` | [点击跳转](https://arxiv.org/abs/2610.29560)

**0. 论文标题**
- **英文标题**: From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation
- **中文标题**: 从VLM规划器到机器人智能体：面向依赖历史操作的自我进化控制框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出SERA框架，通过一个可编辑的控制框架（harness）将高层VLM封装为智能体来管理长程任务的历史上下文，并利用执行反馈自动迭代优化规划策略，在依赖历史信息的机器人操作任务上显著提升了成功率。

**1. 整体逻辑**
- **研究任务**: 解决长程机器人操作任务中的非马尔可夫决策问题，即机器人需要根据历史交互结果和任务进度（而非仅凭当前视觉观察）来做出正确决策。
- **研究动机**: 现有的VLA模型在处理长程任务时，容易受部分可观测性和执行误差累积的影响。现有的记忆增强或分层规划方法，缺乏一个显式的机制来持续维护任务上下文，且难以低成本地利用执行失败的经验来改进高层规划逻辑。
- **本质改动**: 不微调底层VLA模型，而是为高层VLM设计了一个“可编辑的控制框架（harness）”。该框架在运行时显式维护任务上下文，并在开发阶段通过环境rollout的失败反馈，自动诊断并修改框架的规划指导、评估标准和控制规则（即自我进化）。
- **技术溯源**: 基于VLA模型（如 $\pi_{0.5}$）作为底层执行器；结合了分层规划（Hierarchical planning）和智能体系统（Agentic systems）思想；高层VLM规划器使用了 `gpt-5.6-sol`。

**2. 技术拆解**
- **核心方法**: 提出 SERA (Self-Evolving Robotic Agent)，包含两个核心部分：
  1. **基于控制框架的智能体规划**：在固定的VLA执行器外包裹一个harness。每轮规划时，harness将近期观察、运行时上下文（包含任务进度、执行结果等）和候选动作传给VLM，VLM评估上一步效果并输出下一步高层命令和更新后的上下文。
  2. **执行驱动的自我进化**：在测试前，分析智能体的失败轨迹，由分析和修改智能体提出对harness的修改候选（修改prompt指导、评估标准或控制规则），再由验证器通过环境rollout评估候选效果，迭代选出最优harness配置。
- **关键细节**: 
  - **输入输出**：输入为语言指令、初始上下文、当前视觉观察和历史反馈；输出为传递给VLA的高层命令和更新后的任务上下文。
  - **系统架构**：高层为VLM规划器（`gpt-5.6-sol`，推理强度设为high），底层为参数固定的VLA执行器。
  - **上下文管理**：harness维护一个紧凑的任务上下文（限制在1600字符内），包含任务阶段、物理状态、执行结果和不确定性等，并在每轮规划后更新。
- **训练/优化目标**: 非传统梯度训练。优化目标是最大化环境rollout中的任务成功率。通过验证器对比候选harness与基线harness在相同episode上的表现（记录修复的失败、退化的成功等），以搜索和选择最优的harness配置，全程无需构建额外的SFT数据集来微调VLM。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboMME（包含16个依赖历史的操作任务，分为Counting, Permanence, Reference, Imitation四个子集，每个任务50个episode，共800个episode）。
  - **对比对象（Baseline）**：
    - VLA基线：$\pi_{0.5}$, $\pi_{0.5}$ w/ action history
    - 记忆增强策略：SAM2Act, FrameSamp+Modul
    - 分层策略：SimpleSG+QwenVL, GroundSG+Gemini, GroundSG+QwenVL, MemER
- **评价指标**: 任务平均成功率（Success Rate, SR），在各子集和所有16个任务上进行平均。
- **主要结果**: 
  - SERA（带自我进化）在RoboMME上取得了 51.38% 的整体成功率。
  - 相比不带自我进化的初始配置（44.38%），自我进化提升了 7.00 个百分点。
  - 显著优于其他Baseline（如 MemER 为 42.38%，FrameSamp+Modul 为 44.51%）。
  - 在需要利用早期观察解决当前视图外信息的 Reference 子集上表现尤为突出（达到 69.50%），证明了其上下文管理的有效性。

### 6. 🔥 [Relational Geometry Forcing for World Action Models] (面向世界动作模型的关系几何强制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.29282` | [点击跳转](https://arxiv.org/abs/2610.29282)

**0. 论文标题**
- **英文标题**: Relational Geometry Forcing for World Action Models
- **中文标题**: 面向世界动作模型的关系几何强制
- **研究机构**: 原文未提及
- **一句话总结**: 提出关系几何强制（RGF）方法，通过匹配特征间的成对关系而非逐点回归，将3D几何先验无损地注入世界动作模型（WAM），在不增加推理负担的前提下显著提升了机器人操作的精度和泛化能力。

**1. 整体逻辑**
- **研究任务**: 提升世界动作模型（WAMs）在机器人操作任务中的空间感知与精确控制能力。
- **研究动机**: 现有WAM缺乏对3D几何的显式约束。引入3D基础模型做“逐点特征对齐（pointwise alignment）”时，虽然能改善视频特征，但会严重损害动作学习，因为紧凑的动作特征和密集的几何场景特征在语义和维度上存在表示不匹配。
- **本质改动**: 放弃直接回归逐点特征，改为对齐WAM中间层特征与冻结3D基础模型特征之间的“成对关系（pairwise relations）”，从而绕过特征空间不匹配的问题，同时让几何先验同时惠及视频和动作专家。
- **技术溯源**: 基于世界动作模型（WAM）框架，具体基座为 Wan2.2-TI2V-5B（视频专家）和 1B Action DiT（动作专家）；几何教师模型为冻结的 VGGT (Visual Geometry Grounded Transformer)。

**2. 技术拆解**
- **核心方法**: 关系几何强制（RGF）。通过可训练的投影头提取WAM中间层特征，计算其与VGGT特征的余弦相似度矩阵（关系矩阵），并使用Huber损失对齐这些矩阵。包含三个互补目标：帧内关系（单视角空间几何）、跨视角关系（多视角对应）、动作-时间关系（动作步间相似度与场景时间演变的耦合）。
- **关键细节**: 输入为多视角同步RGB和语言指令，输出为未来视频和动作块。模型包含30层的Video DiT（隐藏层3072维）和30层的Action DiT（隐藏层1024维）。RGF监督施加在WAM的第15层（L15），投影头将特征映射到2048维。推理时移除VGGT和投影头，无额外计算开销。
- **训练/优化目标**: 总损失为视频Flow-Matching损失 + 动作Flow-Matching损失 + RGF损失。RGF损失为帧内、跨视角、动作-时间三个关系对齐损失（使用Huber loss）的加权和，整体权重 $\lambda_{RGF}=0.5$。

**3. 实验结果**
- **实验设置**: 仿真数据集使用 LIBERO（4个suite，40个任务）和 RoboTwin 2.0（50个双臂任务）。真实世界使用 Franka 机械臂（4个基础任务及3个泛化设置）。对比基线包括 VLA（OpenVLA-OFT, $\pi_{0.5}$, Spatial Forcing）、WAM（Fast-WAM, Motus, LingBot-VA）及几何感知WAM（X-WAM, GeoSem-WAM, WAM4D, MECo-WAM）。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - **LIBERO**: 平均成功率达98.65%，比基线Fast-WAM（97.60%）提升1.05%，超越所有对比的几何感知WAM。
  - **RoboTwin 2.0**: 在随机化场景下平均成功率92.50%，比Fast-WAM提升，并超越MECo-WAM（92.71% vs 92.62%）。
  - **真实世界**: 平均成功率65.71%，比Fast-WAM（57.14%）大幅提升8.6个百分点。在高度变化等泛化设置下提升尤为显著（+20%）。
  - **消融结论**: 逐点对齐动作特征会导致性能低于无对齐基线，证实了关系对齐的必要性；三个关系目标联合使用具有非加性的互补增益；Huber loss 优于 KL 散度。

### 7. 🔥 [How Representational Priors Shape Generalization in World Action Models] (表征先验如何塑造世界动作模型的泛化能力)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.29168` | [点击跳转](https://arxiv.org/abs/2610.29168)

**0. 论文标题**
- **英文标题**: How Representational Priors Shape Generalization in World Action Models
- **中文标题**: 表征先验如何塑造世界动作模型的泛化能力
- **研究机构**: 原文未提及
- **一句话总结**: 本文从表征几何视角提出“干扰正交性”和“干扰抑制”两个度量指标，揭示了生成式骨干网络的表征先验如何决定世界动作模型（WAM）的视觉泛化能力，并证明在策略训练前测量该指标即可预测模型的下游鲁棒性。

**1. 整体逻辑**
- **研究任务**: 【领域：具身智能/机器人基础模型；类型：理论分析/机制分析】分析并解释不同生成式骨干网络（如图像编辑模型 vs 视频预测模型）作为先验时，为何会导致世界动作模型（WAMs）在应对视觉扰动时的泛化性能存在显著差异。
- **研究动机**: 现有WAMs的泛化能力高度依赖其生成式骨干网络。前期工作（如ImageWAM、FastWAM）发现图像编辑模型比视频预测模型泛化更好，且性能提升主要来自表征增益而非测试时的显式预测。但究竟是什么样的底层几何结构让某些先验更适合WAM，以及策略训练如何改变这种结构，目前缺乏理论解释。
- **本质改动**: 没有提出新的模型架构或训练算法，而是提出了一套基于表征几何的分析框架。定义了“干扰正交性”（衡量训练前骨干网络将视觉干扰与经验分布内流形分离的程度）和“干扰抑制”（衡量策略训练后模型对干扰信息的抑制程度），从而在训练前诊断和预测WAM的泛化能力。
- **技术溯源**: 基于现有的世界动作模型框架（FastWAM、ImageWAM），以及多种生成式骨干网络（Wan2.2, FLUX.2, OmniGen2, Ovis-U1, FlashMotion, Kiwi-Edit, SANA-Video 2.0, MAGI-1）。

**2. 技术拆解**
- **核心方法**: 提出两个几何度量指标：1) **干扰正交性 (Nuisance Orthogonality)**：计算视觉扰动引起的特征位移向量与经验分布内数据子空间（通过SVD降维得到）的正交程度。正交性越高，说明骨干网络在预训练后就越能把“不影响动作的视觉变化”和“区分干净场景的特征”分离开。2) **干扰抑制 (Nuisance Suppression)**：计算策略训练前后，特征在分布内流形方向和正交方向上的响应变化比率。比率小于1说明模型在训练后有效抑制了干扰信息。
- **关键细节**: 
  - 输入输出：输入是干净图像和对应的视觉扰动图像（光照、背景、传感器噪声、相机视角），输出是生成式骨干网络中间层的特征表示。
  - 模型规模：使用了多种规模的生成式骨干网络（1.13B 到 5.00B），并搭配动作专家（Action Expert，0.64B 到 1.21B）扩展为WAM。
  - 关键设置：使用40个干净参考观测来估计经验分布内特征子空间（保留秩 r=39），收集1200个对应的分布外（扰动）观测来计算特征位移。
- **训练/优化目标**: WAM的训练目标包括未来预测损失（如 video prediction loss / flow matching）和动作预测损失（flow matching action prediction loss）。本文的核心不是提出新的损失函数，而是分析现有训练目标下表征空间的重塑过程。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-Plus（包含底层模拟器状态相同但视觉外观不同的配对观测，涵盖4类视觉偏移）。策略训练使用LIBERO数据集。
  - 对比对象：Wan2.2 (FastWAM), FLUX.2 (ImageWAM), Scratch FLUX.2, OmniGen2, Ovis-U1, 以及额外的 FlashMotion, Kiwi-Edit, SANA-Video 2.0, MAGI-1。
  - 测试环境：在LIBERO-Plus评估集上测试，共5418条评估轨迹。计算资源为4张Nvidia H100。
- **评价指标**: 
  - 干扰正交性（Nuisance Orthogonality）：衡量训练前骨干网络的表征几何特性。
  - 任务成功率（Success Rate, SR）：在LIBERO-Plus上的平均成功率，衡量WAM训练后的泛化/鲁棒性能。
  - 干扰抑制比率（WAM/WM ratio）：衡量策略训练前后特征响应的变化。
- **主要结果**: 
  - 干扰正交性与泛化性能高度相关：例如，FLUX.2的平均正交性为0.799，对应89.0%的成功率；而Wan2.2的正交性仅为0.594，成功率仅46.5%。即使是从头训练的Scratch FLUX.2（正交性0.724，成功率63.9%）也优于Wan2.2。这表明在WAM训练前测量正交性即可预测下游的视觉鲁棒性。
  - 干扰抑制解释了鲁棒策略的形成：在策略训练后，鲁棒的ImageWAM（基于FLUX.2）在分布内和正交方向上都表现出一致的干扰抑制（比率<1），使得特征对弱相机扰动具有不变性；而泛化较差的FastWAM（基于Wan2.2）抑制效果弱且不一致，其特征仍被相机变化主导。
  - 表征重塑机制：鲁棒的策略适配（如FLUX.2到ImageWAM）使分布内总方差增加了13.4倍，而视觉扰动引起的位移仅增加2.73和2.48倍；相比之下，FastWAM的分布内方差仅增加4.42倍，位移却增加了5.63和3.18倍。说明鲁棒模型通过增强分布内样本的区分度，相对降低了干扰信息的影响。
