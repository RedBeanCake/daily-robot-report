### 35. 🔥 [All-For-One: Distilling Visual Foundation Models to a Fast, Memory-Efficient Visuomotor Policy] (All-For-One：将视觉基础模型蒸馏为快速、内存高效的视觉运动策略)
- **研究机构**: `KAIST (Korea Advanced Institute of Science and Technology)`
- **Arxiv ID**: `2611.04485` | [点击跳转](https://arxiv.org/abs/2611.04485)

**0. 论文标题**
- **英文标题**: All-For-One: Distilling Visual Foundation Models to a Fast, Memory-Efficient Visuomotor Policy
- **中文标题**: All-For-One：将视觉基础模型蒸馏为快速、内存高效的视觉运动策略
- **研究机构**: KAIST (Korea Advanced Institute of Science and Technology)
- **一句话总结**: 提出AFO两阶段蒸馏框架，在训练时把多个视觉基础模型（VFM）的深度和分割输出当作“特权信息”训练教师网络，然后将其蒸馏为纯RGB输入的轻量级学生策略，从而在推理时彻底摆脱VFM，实现高精度与低延迟的兼得。

**1. 整体逻辑**
- **研究任务**: 机器人视觉运动控制（Visuomotor control），核心是如何在闭环控制中高效利用视觉基础模型（VFM）提供的密集语义和几何信息（如深度、分割）。
- **研究动机**: VFM（如SAM、DAM）能提供极好的深度和分割特征，但直接部署计算开销大、延迟高；且VFM在机器人第一人称视角下存在时间不一致性和偶发的预测错误（如分割错目标、深度把阴影当障碍物），直接放在控制回路里会导致策略崩溃。现有方法要么从头训小模型（快但精度低），要么直接挂大模型（慢且容易因为VFM的偶发错误翻车）。
- **本质改动**: 把VFM的输出（深度图、分割掩码）仅作为训练时的“特权信息”（Privileged information）。通过两阶段蒸馏，把多模态VFM知识压进一个纯RGB输入的轻量级学生网络，推理时彻底抛弃VFM。与Theia等直接在ImageNet上蒸馏VFM中间特征的方法不同，本文是在下游机器人数据上蒸馏VFM的最终输出。
- **技术溯源**: 视觉基础模型采用 SAM 2（分割）、Depth Anything V2 / DAM 2（深度）、Molmo（VLM，用于给SAM2提供初始点提示）。对比的 Baseline 包括从头训练的 LfS，预训练视觉编码器 R3M、MVP、VC-1、DINOv2，以及基础模型蒸馏方法 Theia 和真实世界基线 ACT。

**2. 技术拆解**
- **核心方法**: All-For-One (AFO) 两阶段特权学习框架。All 阶段训练多模态教师网络，For-One 阶段将教师知识蒸馏给单模态学生网络。
- **关键细节**: 
  - **输入**: 256×256 RGB图像，以及本体感觉状态（如关节位置）。
  - **教师结构 (All)**：使用三个轻量级编码器（仿真中为CNN，真实世界为ResNet-18）分别处理 RGB、SAM2 掩码、DAM2 深度图。特征相加融合后拼接本体感觉，输入到策略头（仿真用MLP，真实世界用ACT）。
  - **学生结构 (For-One)**：仅使用单个轻量级 RGB 编码器（CNN/ResNet-18），接相同的策略头。
  - **规模与效率**：仿真中学生仅 2.7M 参数，推理延迟 2.11ms；真实世界学生 34.19M 参数，延迟 4.32ms。相比之下，教师模型高达 8.2B 参数，延迟 110.07ms。
- **训练/优化目标**: 
  - **教师**：行为克隆（BC）损失（MSE）。
  - **学生**：BC 损失 + 特征对齐损失。特征对齐损失计算学生 RGB 特征与教师三个模态（RGB、分割、深度）特征的余弦相似度。权重 $\lambda$ 动态衰减到 0，训练后期退化为纯 BC，让学生动作完全拟合专家。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：Adroit（2个灵巧手任务），MetaWorld（5个桌面机械臂任务）。
  - **真实世界**：6-DoF Indy7 机械臂，3个任务（Clutter Sweep, Clean Toolbox, Pick-and-Place）。
  - **Baseline**：LfS, MVP, VC-1, R3M, DINOv2, Theia, ACT。
- **评价指标**: 任务成功率（仿真和真实世界），推理延迟（ms），模型参数量。
- **主要结果**: 
  - **仿真表现**：AFO Student 在 7 个任务平均成功率达 92.57%，超越所有 Baseline 及自己的教师（87.09%）。参数量仅 2.7M，延迟 2.11ms，和从头训的 LfS 一样快，远低于 Theia（88M参数，7.94ms）和教师（8.2B参数，110ms）。
  - **真实世界表现**：在分布内（ID）和分布外（OOD，改变光照/背景/杂物）下均取得最高成功率。OOD 下平均成功率 52.59%，大幅领先 ACT（43.33%）和 Theia（43.14%），且延迟和参数量与 ACT 持平。
  - **核心结论**：学生最终超越了教师。因为端到端训练让学生适应了目标域，同时避开了 VFM 在推理时的预测错误和时间抖动。证明了 VFM 更适合作为训练时的特权信号，而不是推理时的在环组件。

### 36. 🔥 [RAFT: Reasoning-Aligned Fine-Tuning Improves Robustness of VLA Post-Training] (RAFT：推理对齐微调提升VLA后训练的鲁棒性)
- **研究机构**: `Toyota Research Institute / Microsoft Research`
- **Arxiv ID**: `2611.04368` | [点击跳转](https://arxiv.org/abs/2611.04368)

**0. 论文标题**
- **英文标题**: RAFT: Reasoning-Aligned Fine-Tuning Improves Robustness of VLA Post-Training
- **中文标题**: RAFT：推理对齐微调提升VLA后训练的鲁棒性
- **研究机构**: Toyota Research Institute / Microsoft Research
- **一句话总结**: 提出了一种两阶段的VLA后训练方法RAFT，先用推理数据训练并冻结LoRA适配器，再微调动作策略，大幅提升了机器人在分布外场景下的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 将通用的视觉-语言-动作（VLA）大模型通过少量特定任务示范进行后训练（Post-training），在提升目标任务名义成功率的同时，保持对视觉、物体、指令等分布外（OOD）变化的鲁棒性。
- **研究动机**: 现有的直接微调（Plain FT）虽然能提高目标场景下的成功率，但会导致模型过拟合于狭窄的示范环境，丧失对分布外变化的鲁棒性。现有改进方法（如参数合并RETAIN、正则化DeLock）试图缓解这一问题，但本文提出了一种更根本的互补思路：在动作微调前，先让预训练策略与任务相关的推理监督信号对齐，以保留通用表征能力。
- **本质改动**: 将后训练解耦为“推理对齐”和“动作微调”两个阶段。第一阶段用推理数据训练LoRA适配器并冻结基座参数；第二阶段冻结该适配器，仅微调动作相关参数。通过物理隔离梯度，防止动作学习破坏已学到的推理表征。
- **技术溯源**: 基于预训练的通用VLA模型（如结合SigLIP视觉编码器和Gemma-2B语言模型的MolmoBot，以及双臂任务中的$\pi_{0.5}$），使用Gemini 3.1 Pro生成推理标注数据。

**2. 技术拆解**
- **核心方法**: 
  1. Stage I (Reasoning Alignment): 使用大模型（Gemini 3.1 Pro）生成的任务相关推理标注（包含边界框、关键点、轨迹、空间描述、VQA等），通过自回归损失训练视觉和语言模块中的LoRA适配器，预训练权重（如SigLIP）保持冻结。
  2. Stage II (Action Adaptation): 冻结Stage I训练好的LoRA适配器，使用少量动作示范数据，通过监督微调（SFT）更新语言模型、动作专家和投影层。动作梯度不回传给推理适配器。
- **关键细节**: 
  - 模型架构：SigLIP视觉编码器 + 18层Gemma-2B解码器（用于仿真与单臂DROID），或$\pi_{0.5}$（用于双臂YAM）。
  - LoRA配置：Rank r=64，缩放系数$\alpha=128$。应用于语言模型18层（q/k/v/o及MLP）和视觉编码器27层（q/k/v）。
  - 训练规模：Stage I 优化1000步（仅更新约90.4M LoRA参数），Stage II 优化5000步（更新约3.09B参数）。
- **训练/优化目标**: 
  - Stage I: 自回归交叉熵损失（预测推理token序列，如JSON格式的坐标、文本描述等）。
  - Stage II: 行为克隆/监督微调损失（$\mathcal{L}_{BC}$），基于动作示范序列。

**3. 实验结果**
- **实验设置**: 
  - 数据集/任务：仿真环境（MolmoSpaces中的pick-and-place和open-drawer），物理机器人（单臂DROID的pick-and-place，双臂YAM的开箱放置任务）。
  - Baselines: Plain FT（直接微调）、RETAIN（参数合并）、DeLock（正则化+对比提示）、Base（预训练模型）。
  - 测试环境：包含In-distribution (ID) 和多种Out-of-distribution (OOD) 场景（如光照、纹理、物体外观、背景、指令变化）。
- **评价指标**: 任务成功率（Success rate / Mean success）。
- **主要结果**: 
  - 物理机器人鲁棒性大幅提升：在DROID的OOD测试中，RAFT成功率达75.0%（Plain FT仅27.9%）；在YAM双臂任务中，RAFT平均成功率70.0%（最强baseline DeLock为36.0%，Plain FT为35.0%）。
  - 仿真任务表现更优：Pick-and-place平均成功率83%（Plain FT 80%），Open-drawer在纹理变化下成功率28%（Plain FT 15%）。
  - 表征分析验证：RAFT在模型后期层保留了更多任务相关信息（线性探针解码物体身份和时间的准确率显著高于Plain FT），且对标注任务区域的视觉注意力更集中（注意力富集度达3.2-3.4倍，Plain FT为1.9-2.1倍）。
  - 消融实验证明：分阶段且冻结适配器的设计（83.2%）显著优于联合训练（Co-train 63.2%）或在Stage II继续更新适配器（74.0%）。

### 37. 🔥 [Physical Experience Builds Continual Spatial World Models] (物理经验构建持续的空间世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.04016` | [点击跳转](https://arxiv.org/abs/2611.04016)

**0. 论文标题**
- **英文标题**: Physical Experience Builds Continual Spatial World Models
- **中文标题**: 物理经验构建持续的空间世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出跨episode的空间变化记忆（SCM）与物理动力学更新机制，让具身智能体在动态环境中不仅能持续修正地图，还能积累可迁移的环境变化规律并受物理现实校验。

**1. 整体逻辑**
- **研究任务**: 构建能在动态物理环境中持续学习、复用经验并受物理结果校验的空间世界模型（Continual Spatial World Models），属于具身智能与机器人学领域的方法创新与实验验证工作。
- **研究动机**: 现有的世界模型在持续运行时，智能体虽然能通过局部重规划（reactive updating）成功应对环境变化，但这只是“每次都重新解决”，并没有真正积累可复用的空间知识；此外，纯拓扑正确的地图如果不结合物理动力学（如惯性、摩擦、执行器延迟），也无法准确预测动作的实际后果。
- **本质改动**: 摒弃缓存具体路线或位置特定记忆的做法，转而学习环境状态变换之间的跨位置统计关系（SCM），并结合物理状态-动作-结果经验持续微调低维动力学模型参数。
- **技术溯源**: 基于经典的世界模型（如 Dyna, Dreamer 等基于模型的强化学习）和空间导航/认知地图理论（如 D* Lite, 拓扑记忆），本文未直接依赖特定的大型开源基座模型，而是基于物理方程和贝叶斯统计构建。

**2. 技术拆解**
- **核心方法**: 
  1. 跨episode空间变化记忆（SCM）：利用贝叶斯更新，跨不同空间位置池化环境变化（如门开关）的条件概率证据，学习相邻空间转移的统计关联。
  2. 物理动力学持续辨识：记录 state-action-outcome 转移，利用累积的充分统计量更新低维物理模型（包含滚动惯量、线性/二次阻力、柔顺接触、执行器延迟）的参数。
- **关键细节**: 
  - 环境：一个倾斜的圆形动态迷宫，包含同心环和离散的门，球体受物理规律控制。
  - 输入输出：输入为连续状态（位置、速度、倾斜角）和离散门状态；输出为预测的下一状态和动作后果。
  - 规模/超参：低维物理参数（如阻尼系数、接触刚度等），贝叶斯先验采用对称 Beta 分布。
- **训练/优化目标**: 
  - SCM：最大化基于历史线索预测下游空间状态变化的条件概率（逼近贝叶斯极限）。
  - 物理模型：最小化预测状态与真实物理状态之间的残差（通过累积统计量更新参数）。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：物理接地的动态迷宫仿真环境（包含结构化变化和随机变化控制组）。
  - 对比对象（baseline）：Frozen（冻结地图）、Local（局部 reactive 更新）、Oracle（全知参考）、Position-specific memory（位置特定记忆）、Episodic memory（情景记忆）。
- **评价指标**: 
  - 预测准确率（Prediction accuracy）与贝叶斯极限的对比。
  - 路线修正次数（Route corrections）。
  - 过时目标追踪时间（Obsolete-target persistence）与任务完成时间。
  - 物理参数误差（Parameter error）。
- **主要结果**: 
  - SCM 预测准确率从 0.564 提升至 0.898（接近 0.90 的贝叶斯极限），路线修正次数从 1.744 降至 0.406。
  - 在训练集完全未见的空间转移上，SCM 准确率达 0.898，而位置特定/情景记忆仅约 0.566，证明其学习的是可迁移的变换关系而非死记硬背。
  - 零信息控制组（随机变化）中，SCM 优势消失，证明其不盲目积累历史。
  - 连续导航中，SCM 能在直接观察到变化前 15.59 秒改变行为，将过时追踪时间从 7.806 秒骤降至 0.0083 秒；物理参数持续更新将最大参数误差控制在 4.69% 以内。

### 38. 🔥 [DreamX: Video Diffusion Model is a Universal Latent Action Learner] (DreamX：视频扩散模型作为通用潜在动作学习器)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.05377` | [点击跳转](https://arxiv.org/abs/2611.05377)

**0. 论文标题**
- **英文标题**: DreamX: Video Diffusion Model is a Universal Latent Action Learner
- **中文标题**: DreamX：视频扩散模型作为通用潜在动作学习器
- **研究机构**: 原文未提及
- **一句话总结**: 直接把预训练视频扩散模型当编码器，通过注入可学习query提取紧凑的潜在动作，并利用其生成先验解耦动作与外观，实现了跨具身的高保真动作迁移和高效的机器人策略学习。

**1. 整体逻辑**
- **研究任务**: 从视频中学习跨具身（如人手到不同机器人）、跨环境的通用潜在动作表示，用于动作/视频迁移以及下游的机器人策略控制。
- **研究动机**: 现有的潜在动作模型（LAMs）通常从头训练专门的编码器，学到的表示容易把底层动作和视角、场景外观等无关视觉特征纠缠在一起，导致跨具身迁移困难；而预训练视频扩散模型自带丰富的时空动态特征和生成先验，天然适合提取与外观解耦的纯动作信息。
- **本质改动**: 抛弃从头训练专门的编码器，直接复用预训练视频扩散模型的时空注意力层，通过注入可学习query来“读取”潜在动作，并用同一个模型的生成先验（未来帧重建）来监督，逼迫潜在动作只编码运动而不编码外观。
- **技术溯源**: 预训练视频扩散模型 Cosmos-Predict2.5。

**2. 技术拆解**
- **核心方法**: 
  1) **潜在动作编码**：在视频token序列中插入可学习的query tokens，通过因果时空注意力机制，将每帧1200个视频token压缩为4个潜在动作token（实现300倍压缩）。
  2) **生成式解码监督**：用同一个扩散模型作解码器，给定首帧和潜在动作重建未来帧。首帧提供外观，扩散先验提供演化规律，重建损失迫使query只学习解释画面变化的“纯动作”特征，实现动作与外观解耦。
  3) **策略学习加速**：通过变分自编码器（VAE）瓶颈将潜在动作进一步压缩为低维紧凑码，作为策略网络的预测目标，免去推理时生成未来视频的庞大开销。
- **关键细节**: 基座为 Cosmos-Predict2.5 2B；输入分辨率480×640，视频片段5-29帧；每个VAE潜在帧分配4个query token；编码器和解码器分别使用rank-16 LoRA微调；训练数据包含2190小时的人类第一人称视频（EgoDex, EgoVerse）和机器人演示数据（Bridge, DROID, AgiBot, MolmoAct2）。
- **训练/优化目标**: 核心是 Flow Matching 损失（视频重建损失），当有动作标签时加上辅助的动作生成损失。策略学习阶段优化紧凑码的 Flow Matching 损失和底层动作损失。

**3. 实验结果**
- **实验设置**: 评估基准包括 LARYBench（动作表示质量）、HumanAndRobot (H&R) benchmark（零样本人到机器人视频迁移）、以及真实的 Drawer-closing 任务（策略评估）。对比的 baseline 包括 LAPA, UniVLA, DiLA, MoTo, AdaWorld, VideoWorld2, Mimic-Video 等。
- **评价指标**: LARYBench 用动作回归 MSE 和分类准确率；H&R 用 FVD, LPIPS, PSNR, SSIM；策略评估用子目标成功率（SR）和推理延迟。
- **主要结果**: 
  1) **表示质量**：在 LARYBench 上达到 SOTA，回归 MSE 从最强 baseline DiLA 的 0.38 降至 0.17，分类准确率从 62.25% 升至 69.67%。
  2) **迁移能力**：在 H&R 零样本人转机器人任务中，FVD 降至 57.44（大幅优于 AdaWorld 的 170.19 和 VideoWorld2 的 241.92），且生成画面无伪影或人手残留。
  3) **策略效率**：在真实关抽屉任务中，平均成功率达 96.7%（Mimic-Video 为 50.0%），且因为只需预测紧凑码而不生成视频，单次推理延迟降至 1.47 秒（比 Mimic-Video 的 28.2 秒快 19.1 倍）。

### 39. 🔥 [Cycle WAM: Coupling Action and Video through Cycle Consistency] (Cycle WAM：通过循环一致性耦合动作与视频)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.04711` | [点击跳转](https://arxiv.org/abs/2611.04711)

**0. 论文标题**
- **英文标题**: Cycle WAM: Coupling Action and Video through Cycle Consistency
- **中文标题**: Cycle WAM：通过循环一致性耦合动作与视频
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Cycle WAM，通过引入双向转换和循环重建机制，强制世界动作模型在生成视频和动作时保持跨模态的因果一致性，从而更好地利用预训练视频先验来提升机器人控制性能。

**1. 整体逻辑**
- **研究任务**: 训练世界动作模型（WAM），使其能够联合建模机器人的动作和未来的视觉观测，支持前向动力学（动作推视频）、逆向动力学（视频推动作）和策略执行。
- **研究动机**: 现有的 WAM（如 DreamZero）虽然用同一个骨干网络联合生成视频和动作，但并没有在训练目标上强制保证“预测的动作”和“预测的视频后果”之间的一致性，导致预训练的视频先验没有被充分利用。
- **本质改动**: 把视频和动作看作描述同一交互过程的配对模态，在联合训练的基础上，增加“视频-动作”双向转换，并引入“视频-动作-视频”的循环重建损失，通过梯度回传把动作预测和视觉后果强耦合起来。
- **技术溯源**: 基于预训练视频生成模型 Wan2.2-TI2V-5B，采用 DreamZero 风格的 5B 参数规模 WAM 架构，底层使用 Flow-matching（流匹配）作为原生生成目标。

**2. 技术拆解**
- **核心方法**: 包含三个递进的训练阶段：1) 视频-动作联合训练（Co-training）；2) 双向转换（Bidirectional Conversion），分别训练视频到动作（逆向）和动作到视频（前向）的映射；3) 循环重建（Cycle Reconstruction），将视频先转为动作，再用这个动作去重建原视频，计算重建损失。
- **关键细节**: 模型为 5B 规模。输入为双视角图像、8维机器人状态和文本指令，输出为 7维动作和视频 latents。循环重建阶段，通过一步流匹配读出（one-step flow readout）得到动作预测，再将其作为条件输入到前向视频生成中。Cycle 阶段使用 LoRA (rank 32) 进行微调，基础权重冻结。
- **训练/优化目标**: 联合训练和双向转换使用原生的 Flow-matching 损失。循环重建的损失是视频流匹配损失，但梯度会穿过前向查询和逆向查询（因为动作是模型自己预测出来的），从而在计算图上将动作预测与其视觉后果直接耦合。

**3. 实验结果**
- **实验设置**: 训练数据集为 LIBERO-40/90。评估任务包括 LIBERO-Pro（仿真控制）、DROID（仿真控制）、LIBERO（前向/逆向动力学评估）以及真实机器人桌面抓取放置任务。对比的 baseline 包括 OpenVLA, pi0, pi0.5, UWM, DreamZero 等。
- **评价指标**: 控制任务看成功率（Success rate %）；逆向动力学看动作 MSE、旋转 RMSE 和运动方向余弦相似度；前向动力学看 MSE、MAE、PSNR、SSIM 和 Frame FID。
- **主要结果**: 在 LIBERO-Pro 的4个特定条件下，平均成功率达到 17.8%，显著优于 DreamZero (13.5%) 和 UWM (6.3%)。在 DROID 仿真中总成功率达 98.3%。相比 UWM，逆向动力学的旋转误差更低、方向一致性更高；前向动力学生成的视频 PSNR/SSIM 更高、FID 更低，视觉细节更清晰。在真实机器人测试的5个场景中成功完成3个，而 DreamZero 全部失败。

### 40. 🔥 [Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?] (重新思考代码即策略智能体的自我修复：是什么驱动了重试的成功？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06863` | [点击跳转](https://arxiv.org/abs/2611.06863)

**0. 论文标题**
- **英文标题**: Rethinking Self-Repair in Code-as-Policy Agents: What Drives Retry Success?
- **中文标题**: 重新思考代码即策略智能体的自我修复：是什么驱动了重试的成功？
- **研究机构**: 原文未提及
- **一句话总结**: 揭示了 Code-as-Policy 智能体在重试时成功率的提升，本质上来源于“通用的任务指导”和“额外采样”，而非针对当前失败的特定反馈。

**1. 整体逻辑**
- **研究任务**: 评估和改进基于代码的机器人控制智能体（Code-as-policy agents）在执行失败后的自我修复（重试）机制。
- **研究动机**: 现有智能体在失败后通常依赖执行反馈进行自我反思和重试。但这种重试成功率的提升，究竟是因为模型利用了“针对当前失败的具体反馈”，还是仅仅因为“额外的采样次数”或“提示词中包含了通用的任务指导”，目前尚不清楚。
- **本质改动**: 通过严格控制变量（如重置场景、固定 token 预算、替换/移除特定反馈），将“针对失败的特定反馈”与“通用任务指导”和“额外采样”解耦，重新评估自我修复机制的真实驱动力，打破了“特定反馈必然有效”的固有假设。
- **技术溯源**: 基于 Qwen2.5-Coder (3B/7B/32B) 和 DeepSeek-Coder-6.7B 等冻结代码大模型，在 robosuite 和 MuJoCo 仿真环境中使用 Panda 机械臂进行验证。

**2. 技术拆解**
- **核心方法**: 提出了一种基于模板的反馈机制（Compiled），通过规则标签器将 14 种失败标签和 API 变体映射到固定的“诊断 + MUST/NEVER”指令模板。同时设计了多种对照实验（如无反馈重采样、错误标签反馈、固定任务模板、从头静态指导、直接编辑、自我反思等），在匹配重试次数和总 token 预算的条件下进行严格对比。
- **关键细节**: 
  - 环境：robosuite 仿真环境，Panda 机械臂，仅使用特权状态（无图像输入），生成 Python 代码控制。
  - 重试机制：每次重试前将场景重置为初始状态（reset-and-retry），允许最多 5 次重试，每次生成全新代码（除编辑条件外）。
  - 反馈构建：Compiled 条件会累积历次失败的模板反馈，按时间倒序排列并去重，限制最大反馈 token 长度（768 whitespace tokens）。
- **训练/优化目标**: 本文不涉及模型训练或参数更新（使用冻结模型）。核心机制是推理时的提示词工程与执行反馈闭环，优化目标是最大化在限定重试次数和总 token 预算下的任务恢复率（Recovery@k）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：在 robosuite 中执行方块抓取、堆叠、放置等任务。主要评估集包含 252 个初始失败的 episode。
  - 对比对象（baseline）：Resample（无反馈仅重采样）、Different-Label Feedback（使用其他失败标签的反馈）、Fixed Task Template（固定的任务级模板）、Static-from-Start（首次尝试即使用固定模板）、Direct+Compiled（直接编辑上一版代码）、Reflection（模型自我反思）。
- **评价指标**: 条件恢复率（Conditional recovery@k，即在 k 次重试内解决初始失败的比例）、整体成功率（Overall success）、每个解决 episode 消耗的总 token 数。
- **主要结果**: 
  - Compiled (85.3%) 显著优于 Resample (68.3%)，在固定 token 预算下优势依然成立。
  - Different-Label Feedback (86.1%) 和 Fixed Task Template (86.1%) 与 Compiled 效果相当，证明**不需要匹配具体的失败标签**，通用的任务指导即可达到相同效果。
  - Static-from-Start（一开始就加固定指导）的整体成功率与 Compiled 相当，且单 episode 耗费的 token 更少。
  - Direct+Compiled (21.4%) 和 Reflection (56.0%) 的恢复率反而低于 Resample，说明直接编辑和额外的反思调用在当前设置下效果更差。
  - 负面案例：在需要边缘抓取的螺母插入任务中，Compiled 提供的“中心抓取”固定指导导致恢复率（82.5%）低于 Resample（97.5%），证明不兼容的静态指导会产生负面影响。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06768` | [点击跳转](https://arxiv.org/abs/2611.06768)

**0. 论文标题**
- **英文标题**: PyRUA-REAL: Robot Exploration and Adaptive Learning through RSI in the Real World
- **中文标题**: PyRUA-REAL：通过真实世界中的递归自我改进进行机器人探索与自适应学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 PyRUA-REAL 框架，让代码智能体在真实物理世界中通过“探索-执行-诊断-改码”的闭环实现递归自我改进（RSI），将交互经验沉淀为可复用技能，最终生成无需在线大模型推理的高效离线控制程序。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人控制。具体任务是让机器人通过真实世界的物理交互，自主获取并迭代优化操作技能，最终将其转化为可离线部署的鲁棒控制程序。
- **研究动机**: 现有的 LLM 机器人控制方法要么依赖频繁的在线推理（导致高延迟和高计算成本），要么局限于仿真环境的技能演化（存在 sim-to-real gap）。如何把物理交互经验转化为持久、可复用且能离线高效执行的机器人能力，是当前的痛点。
- **本质改动**: 将“递归自我改进（RSI）”落地到真实物理世界，采用“研究员-工程师”双智能体协作机制，通过代码迭代和物理反馈闭环，把大模型的在线推理能力“蒸馏”并固化为离线的、基于本地感知和控制模型的可执行 Python 程序。
- **技术溯源**: 基于大语言模型（文中提及 GPT-6-Astra），感知模块集成了本地部署的预训练视觉模型（如 SigLIP、SAM）。

**2. 技术拆解**
- **核心方法**: 提出 PyRUA-REAL 框架，包含改进（Improvement）、执行（Execution）和经验（Experience）三个核心组件。通过双智能体协作进行代码生成与物理测试，并将交互经验分层持久化，最终冻结代码实现无 LLM 调用的离线部署。
- **关键细节**: 
  - **双智能体协作**：Researcher 负责宏观任务规划、方法选择和设定停止条件；Engineer 负责代码实现、物理执行和局部错误诊断。两者通过结构化的实验规范进行交互。
  - **三层经验库**：L0（环境事实）、L1（记忆：问题、尝试、结果、失败原因）、L2（实现：任务程序和可复用原语代码）。
  - **硬件平台**：双臂 Franka 平台（配 Robotiq-85 夹爪、ZED Mini 和 RealSense D405 相机），不预设标定和控制器，全靠探索建立。
- **训练/优化目标**: 非传统梯度训练。优化目标是在交互和计算预算内，最大化任务程序的期望性能（成功率），同时最小化执行时间和代码修改成本。通过物理执行的反馈（成功/失败、视觉记录、关节轨迹）来指导代码的迭代修改。

**3. 实验结果**
- **实验设置**: 
  - **真实世界**：双臂 Franka 平台，8个物理操作任务（井字棋、五块堆叠、汉诺塔、以太网插入、毛巾折叠、推T型块、方块分类、方块收纳）。
  - **仿真环境**：RoboDojo benchmark，42个任务。
  - **Baselines**：PyRUA-Lean（在线编码部署）、GPT-6-Astra（在线动作推理）。
- **评价指标**: 任务成功率（Success rate）、执行时间（Execution time）、放置精度（横向和角度误差）。
- **主要结果**: 
  - **真实世界能力获取**：8个任务中有7个成功生成无需在线 Agent 的冻结程序，开发阶段平均成功率达 91.1%。以五块堆叠为例，经过迭代，成功率从 88.7% 提升至 98.7%，执行时间从 285.3s 降至 156.0s，横向误差从 2.69mm 降至 0.44mm。
  - **仿真基准测试**：在 RoboDojo 的 42 个任务上，PyRUA-REAL 冻结程序的平均成功率达 84.42%，显著优于 PyRUA-Lean (50.35%) 和 GPT-6-Astra (22.48%)，在精确操作和长视野任务上优势尤为明显。
  - **部署效率**：离线冻结程序比在线编码（PyRUA-Lean）快 4.6-5.0 倍，比纯在线动作推理（GPT-6-Astra）快 9.9-11.5 倍，大幅消除了在线推理的等待时间（Agent 思考时间占在线执行的 63-90%）。
  - **其他实证发现**：丰富的执行反馈（视频+关节轨迹）比单纯的结果反馈更能提升代码改进效率；提供显式的任务规范（如边界和位姿范围）能显著提升程序在未见场景下的鲁棒性；前期积累的技能库能正向迁移到新任务中（平均成功率从 21.3% 提升至 40.0%）。

### 42. 🔥 [Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs] (VLA推理时间花在哪了？跨GPU的瓶颈与优化交互作用)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06710` | [点击跳转](https://arxiv.org/abs/2611.06710)

**0. 论文标题**
- **英文标题**: Where Is VLA Inference Time Spent? Bottlenecks and Optimization Interactions Across GPUs
- **中文标题**: VLA推理时间花在哪了？跨GPU的瓶颈与优化交互作用
- **研究机构**: 原文未提及
- **一句话总结**: 本文对7个主流VLA模型在4种GPU上的推理延迟进行了全面测量，揭示了不同优化方法（如编译、剪枝、量化）叠加时的相互影响，并提出了一套面向实际部署延迟预算的优化叠加指南（VLA-Triage）。

**1. 整体逻辑**
- **研究任务**: 测量和分析视觉-语言-动作（VLA）模型在不同硬件上的推理延迟瓶颈，以及多种推理优化方法叠加时的相互作用。
- **研究动机**: VLA模型推理延迟高，难以满足机器人实时控制需求。现有优化研究通常只在单一GPU或少数模型上评估，忽略了硬件差异导致的瓶颈变化；且未考虑多种优化方法叠加时的相互影响。此外，现有文献常因未指明执行模式（如eager或compiled）和注意力后端（如是否融合）而导致报告的加速比存在误导（例如在未融合注意力下测得的剪枝加速比，在实际常用的融合注意力下会大打折扣）。
- **本质改动**: 并非提出单一的新优化算法，而是开展了一项大规模的系统级测量研究，量化了优化方法间的“交互作用（interactions）”，并基于此提出了一套指导VLA优化叠加的实用指南。
- **技术溯源**: 基于7个主流VLA模型（OpenVLA, OpenVLA-OFT, LLaVA-VLA, CogACT, $\pi_{0.5}$, GR00T, SmolVLA），以及现有的推理优化技术（CUDA graphs, torch.compile, FlashAttention-2, token pruning, quantization等）。

**2. 技术拆解**
- **核心方法**: 提出 VLA-Triage 指南。该指南包含5个步骤：1) 设定扣除预处理和通信等开销后的实际模型延迟预算；2) 在目标硬件上基准测试并选择最快的执行模式（eager/CUDA graphs/编译）和融合注意力后端；3) 通过权重读取下界和受影响阶段下界筛选不可行的优化方案；4) 根据执行模式测试支持的优化组合（如CUDA graphs下可近似复用eager剪枝收益，编译下必须重新测量）；5) 验证任务性能。
- **关键细节**: 
  - 测试了7个VLA模型，涵盖自回归解码、预填充为主、迭代流匹配三种动作生成架构。
  - 测试了4种GPU：数据中心级H100、云端A10G、消费级RTX 4090、嵌入式Jetson Thor。
  - 评估了7类优化方法：CUDA graphs、编译（torch.compile）、融合注意力、批处理、减少去噪步数、Token剪枝、量化（int8/int4/FP8等）。
  - 深入分析了CPU启动开销、内存带宽和内核效率如何共同决定优化收益。
- **训练/优化目标**: 非学习类工作。核心机制是分析推理各阶段（视觉编码、预填充、动作生成）的延迟构成，计算 Roofline 模型（算力与内存带宽瓶颈），并量化先应用的优化方法如何改变后应用方法的收益（例如：编译改变了剪枝能节省的绝对时间，剪枝改变了量化内核的加速比）。

**3. 实验结果**
- **实验设置**: 无特定下游任务数据集，对比对象为未优化的 Eager 执行模式或单一优化方法。测试了7个VLA模型和4种GPU硬件平台。使用 CUPTI 和 Nsight 测量 CPU 启动延迟、GPU 内核忙碌时间和内存带宽等系统级指标。
- **评价指标**: 推理延迟（毫秒），以及是否满足机器人的控制周期延迟预算（Latency budget）。
- **主要结果**: 
  - **优化效果非均匀且依赖硬件**：同一优化在不同GPU上效果甚至相反。例如，CUDA graphs让GR00T在H100上变快，在Thor上变慢；8位量化让CogACT在A10G上变快，在H100上变慢。
  - **Baseline选择具有误导性**：例如 FastV 剪枝在未融合注意力下测得节省 21.4% 时间，但在生产常用的 FlashAttention-2 下仅节省 6.9%，因为选择器读取注意力权重会强制使用更慢的内核。
  - **优化方法存在强烈的交互作用**：不能简单叠加单独测量的收益。例如，编译会改变剪枝的收益（在A10G上，CogACT编译后剪枝收益从 74.2ms 降至 33.5ms）；剪枝会改变量化的加速比。如果假设收益可线性复用，会导致错误的延迟预算决策（例如假设满足 50ms 预算，实际测量却达到 64.1ms 导致超时）。
  - **VLA-Triage 指南的有效性**：通过该指南，可以准确识别哪些阶段能提供所需的延迟节省，并明确指出哪些组合必须在部署执行模式下进行实际测试，避免了盲目叠加优化带来的部署失败风险。

### 43. 🔥 [Compounding Physical RSI: Turning Execution Failure into Inherited Capability] (复合物理RSI：将执行失败转化为继承能力)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06654` | [点击跳转](https://arxiv.org/abs/2611.06654)

**0. 论文标题**
- **英文标题**: Compounding Physical RSI: Turning Execution Failure into Inherited Capability
- **中文标题**: 复合物理RSI：将执行失败转化为继承能力
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个“诊断-补救-保留”三阶段闭环框架，让通用机器人策略在仿真中通过不断诊断自身执行失败、离线强化学习修复并融合权重，实现操作能力的复利式增长。

**1. 整体逻辑**
- **研究任务**: 提升通用机器人操作策略（Generalist robot manipulation policy）在长序列、多阶段物理任务中的闭环执行成功率。
- **研究动机**: 现有的VLA模型在静态训练后，面对多阶段操作任务时，下游阶段的失败常被上游阶段的失败掩盖（即“能力边界”问题）。此外，现有的自我改进方法面临三大瓶颈：1) 失败轨迹难以定位具体出错阶段；2) 失败轨迹缺乏正确的动作监督；3) 共享权重下的多任务微调容易导致“灾难性遗忘”（修好新bug却忘了旧技能），导致能力无法跨代复利增长。
- **本质改动**: 将物理RSI（递归自我改进）形式化为“复利”问题，设计了一套闭环框架，确保每一代策略只精准吸收针对当前“能力边界”的改进，并通过权重融合机制保留已有技能，从而实现能力的跨代累积。
- **技术溯源**: 视觉-语言-动作（VLA）模型、离线强化学习（Offline RL）、模型权重融合（Model Soup / 权重空间插值）。

**2. 技术拆解**
- **核心方法**: 提出 Compounding Physical RSI 框架，包含三个阶段：1) Diagnosis（诊断）：在任务阶段粒度评估能力缺口，生成结构化改进目标；2) Remedy（补救）：基于改进目标从经验库中筛选针对性数据，进行目标条件的离线强化学习；3) Retention（保留）：在参考策略和更新策略的权重空间进行线性插值生成候选策略，通过全基准评估选出最优策略作为下一代继承者。
- **关键细节**: 
  - 输入输出：输入为闭环执行轨迹（包含观测、状态、动作、奖励、任务阶段标注），输出为进化后的策略权重。
  - 系统架构：包含经验库（整合任务示例、几何示例、在轨执行证据）、自动化质量验证流水线、离线RL更新模块、权重插值与评估模块。
  - 规模与超参：在 RoboDojo-Sim 的 42 个任务上进行评估。离线RL中使用权重散度惩罚项（系数 $\lambda$）来约束参数漂移。权重插值系数 $\alpha_i \in [0, 1]$。
- **训练/优化目标**: 
  - 核心机制：目标条件的离线强化学习（Objective-conditioned offline RL）。
  - 优化目标：最大化目标条件下的Q值，同时通过散度惩罚约束新策略与参考策略的偏差，防止遗忘。公式为 $\max \mathbb{E}[Q(s,a|g_k)] - \lambda D(\pi, \pi_k)$。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：使用 RoboDojo-Sim 仿真环境（包含42个任务）。对比了13个公开的通用策略，包括 GalaxeaVLA (G0.5), Xiaomi-Robotics-1, Hy-Embodied-0.5-VLA, SimpleMemVLA, Spatial Forcing, $\pi_{0.5}$, InternVLA-A1.5, VLAct, X-VLA, X-WAM, StarVLA, $\pi_0$, GR00T-N1.7。
- **评价指标**: Overall Score（整体得分，衡量连续的阶段级任务进度）和 Success Rate (SR，成功率，衡量全任务完成度)。
- **主要结果**: 提出的策略 CSU-AI-07 在 RoboDojo-Sim 榜单上排名第一。三个独立评估种子的平均 Overall Score 为 26.15，Success Rate 为 20.70%。相比第二名 GalaxeaVLA (Overall Score 20.23, SR 14.88%)，Overall Score 提升了 5.92 分（相对提升 29.3%），SR 提升了 5.82 个百分点（相对提升 39.1%）。相比广泛使用的开源策略 $\pi_{0.5}$ (SR 6.93%)，任务完成率提升了近三倍。

### 44. 🔥 [$A^3$-VLA: Automatic Perception-Guided Attention Alignment for Robot Manipulation] (面向机器人操作的自动感知引导注意力对齐)
- **研究机构**: `原文未提及（致谢中提及国家自然科学基金、安徽省自然科学基金、认知智能全国重点实验室等）`
- **Arxiv ID**: `2611.06447` | [点击跳转](https://arxiv.org/abs/2611.06447)

**0. 论文标题**
- **英文标题**: $A^3$-VLA: Automatic Perception-Guided Attention Alignment for Robot Manipulation
- **中文标题**: 面向机器人操作的自动感知引导注意力对齐
- **研究机构**: 原文未提及（致谢中提及国家自然科学基金、安徽省自然科学基金、认知智能全国重点实验室等）
- **一句话总结**: 这篇工作提出了一种无需人工标注、直接从操作轨迹中自动提取目标与机械臂伪区域的方法，通过在微调VLA时加入注意力分配和对比学习两个辅助损失，显式纠正模型的注意力漂移，大幅提升了机器人操作的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作模型（VLA）在机器人操作任务中的策略学习（根据多视角图像和语言指令生成动作序列）。
- **研究动机**: 现有VLA在微调时，动作预测目标缺乏细粒度的任务特定感知监督。这导致模型容易走“视觉捷径”，注意力偏离目标物体和关键交互区（即注意力漂移），只靠死记硬背动作轨迹，限制了泛化能力和操作精度。
- **本质改动**: 不依赖人工标注或通用多模态大模型的先验知识，而是利用“交互前后视觉变化”这一物理先验自动挖掘任务相关的视觉引导信号，并在微调阶段用软约束（注意力下限和对比学习）把模型的注意力“按”在目标物体和机械臂上。
- **技术溯源**: 基于 Flow-matching VLA（如 $\pi_0$）、OpenVLA-OFT、$\pi_{0.5}$ 等VLA基座模型，以及 SAM2（用于视觉分割和时序传播）。

**2. 技术拆解**
- **核心方法**: 
  1) **启发式区域提议与SAM2时序平滑**：计算机械臂与物体接触前后的帧间像素差异，自动提取目标物体和机械臂的候选区域（伪标签），并用SAM2进行时序传播，得到全轨迹一致的伪区域。
  2) **注意力权重分配（Attention Allocation）**：设计辅助损失，为语言token查询图像和状态token查询图像分别设定注意力下限，强制模型将足够的注意力分配给目标物体和机械臂区域。
  3) **对比学习（Contrastive Learning）**：在交互前（无遮挡），将目标区域的视觉特征与语言指令特征拉近，将非目标区域特征推远，实现patch级别的语义对齐。
- **关键细节**: 
  - **输入输出**：输入为多视角图像、语言指令、机器人当前状态；输出为动作序列（Action chunk）。
  - **区域提取**：计算交互前后窗口内的像素平均绝对差，设定阈值 $\tau=10$ 筛选候选patch。
  - **注意力损失**：语言到图像（$L_{l2i}$）和状态到图像（$L_{s2i}$），注意力权重下限阈值 $\eta_1, \eta_2$ 均设为 0.25。
  - **联合训练**：总损失 $L = L_{FM} + \lambda_1(L_{l2i} + L_{s2i}) + \lambda_2 L_{cl}$，其中 $\lambda_1=0.1, \lambda_2=0.01$。
  - **硬件规模**：8张 NVIDIA H200 GPUs。
- **训练/优化目标**: 主目标是 Flow Matching 损失（$L_{FM}$）用于动作生成；辅助目标是注意力分配损失（$L_{l2i}, L_{s2i}$）和对比学习损失（$L_{cl}$），用于感知引导。推理阶段无额外计算开销。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 VLABench（5个任务套件，各500条demo）和 Robotwin 2.0（4个任务，各100条demo）；真实环境使用厨房场景（5个任务，各80条demo，Songling机械臂）。
  - **Baselines**：Octo, OpenVLA, RDT, $\pi_0$, $\pi_0$-FAST, OpenVLA-OFT, $\pi_{0.5}$。
- **评价指标**: 仿真环境使用成功率（Success Rate）；真实环境使用成功率（SR）和任务进度得分（Task Progress, TP，完成记1，半途失败记0.5，未完成记0）。
- **主要结果**: 
  - **VLABench**：相比 $\pi_0$, OpenVLA-OFT, $\pi_{0.5}$，A3-VLA 平均成功率分别提升 16.4%, 24.0%, 25.2%。在存在视觉干扰的任务（如Poker, Mahjong）中提升尤为显著。
  - **Robotwin 2.0**：平均成功率分别提升 9.8%, 7.0%, 6.5%。在长视野任务（Place Burger & Fries）中提升最大。
  - **真实环境**：相比最强基线 $\pi_{0.5}$，平均成功率提升14%，任务进度提升14%。在需要精细指令理解的任务（Select Bottles）中改善最明显。
  - **鲁棒性与效率**：在纹理扰动和高斯噪声扰动下表现更优；训练收敛曲线更平滑，学习动作策略的速度更快。

- **中文标题**: 到达时间：用于JEPA世界模型长视野规划的学习型时间度量
- **研究机构**: 原文未提及
- **一句话总结**: 在冻结的JEPA扁平世界模型上，通过外挂一个极轻量级的度量网络学习“到达目标时间（T2G）”代价来替代欧氏距离，从而在长视野规划中大幅提升成功率，效果媲美甚至超越复杂的层次化模型。

**1. 整体逻辑**
- **研究任务**: 基于联合嵌入预测架构（JEPA）的长视野潜在空间规划（Long-Horizon Latent Planning）。
- **研究动机**: 现有的扁平JEPA世界模型（如LeWM）在规划时使用欧氏距离作为目标代价。但在长视野任务中，随着预测步数增加，欧氏距离无法有效区分不同时间步的状态（即缺乏时间对比度），导致规划信号微弱。现有的层次化方法（如H-JEPA）虽然能缓解这个问题，但引入了复杂的层级架构。作者希望验证：仅改进扁平模型的代价函数，能否在不增加架构复杂度的情况下解决长视野规划问题。
- **本质改动**: 保持JEPA的编码器和预测器完全冻结，额外引入一个极轻量级的度量网络，利用离线轨迹的时间顺序监督，学习一个能反映“到达目标时间”的相对距离度量，直接替换原有的欧氏规划代价。
- **技术溯源**: JEPA (Joint-Embedding Predictive Architectures), LeWM (LeWorldModel), H-JEPA。

**2. 技术拆解**
- **核心方法**: 提出 Time-to-Goal (T2G) 度量学习。从离线轨迹的潜在表示中采样状态三元组（anchor, near, far），通过边际排序损失（margin ranking loss）训练一个小型MLP，使得时间上更近的状态在度量空间中距离更近。在规划阶段，用该网络输出的相对时间距离替代欧氏距离，来评估候选动作序列生成的预测轨迹。
- **关键细节**: 
  - T2G 网络极小，仅 0.182M 参数（占 LeWM 的 1.6%）。
  - 输入为冻结 JEPA 编码器输出的潜在状态（维度 192 或 384），输出为缩放后的欧氏距离。
  - 规划代价计算采用 last-n 策略（仅对预测轨迹最后 n 个状态求平均距离），以避免对必要的中间准备动作（如抓取前的靠近）产生过度惩罚。
- **训练/优化目标**: 边际排序损失（Margin ranking loss）。优化目标是让 anchor 到 near 状态的学习距离小于到 far 状态的距离，且差值至少为设定的边际 m。整个过程完全基于离线轨迹的时间顺序，无需环境奖励或策略标签。

**3. 实验结果**
- **实验设置**: 在四个模拟基准环境（FourRoomDistractors, Visual AntMaze, Push-T, OGBench Cube）上进行评估。对比基线包括使用原生欧氏代价的扁平 LeWM，以及 2 至 4 层的层次化 H-JEPA。
- **评价指标**: 规划成功率（Planning success rate, %）。
- **主要结果**: 
  - T2G (last-n) 将扁平 LeWM 的平均成功率从 32.7% 大幅提升至 63.0%。
  - 在 OGBench Cube 和 Push-T 任务上，T2G 的成功率超越了 4 层 H-JEPA；在导航任务上大幅缩小了与 3 层 H-JEPA 的差距。
  - 实验证明，last-n 代价比 dense（全序列平均）代价在需要中间准备动作的任务上更有效，因为 dense 代价会错误地惩罚那些为了完成任务而必须经历的、距离目标较远的中间状态。

### 46. 🔥 [ELA: End-to-End Latent Action Policy Learning from Video Demonstrations] (ELA：从视频演示中进行端到端潜在动作策略学习)
- **研究机构**: `The University of Texas at Austin (UT Austin)`
- **Arxiv ID**: `2611.05571` | [点击跳转](https://arxiv.org/abs/2611.05571)

**0. 论文标题**
- **英文标题**: ELA: End-to-End Latent Action Policy Learning from Video Demonstrations
- **中文标题**: ELA：从视频演示中进行端到端潜在动作策略学习
- **研究机构**: The University of Texas at Austin (UT Austin)
- **一句话总结**: 提出Ela框架，通过端到端联合优化逆动力学模型、策略和动作解码器，并引入交替表示对齐机制，解决了从海量无标签视频和少量带标签数据中学习机器人策略时，潜在动作难以预测和解码的问题。

**1. 整体逻辑**
- **研究任务**: 机器人模仿学习（利用大量无动作标签的视频数据和少量带标签的机器人演示数据学习控制策略）。
- **研究动机**: 现有的潜在动作（latent action）方法通常采用两阶段流水线（先学逆动力学模型，再冻结训练策略），没有针对下游控制显式优化潜在动作空间，导致学到的潜在表示既难以被策略准确预测（缺乏可建模性 modelability），也难以准确还原为连续的机器人动作（缺乏可解码性 decodability）。
- **本质改动**: 将潜在动作作为统一接口，端到端联合优化逆动力学模型、策略网络和动作解码器，并引入基于冻结视觉模型的交替表示对齐机制，防止联合训练时的表示崩溃。
- **技术溯源**: 基于潜在动作建模（Latent Action Modeling）、扩散策略（Diffusion Policy）、iFSQ量化、DINOv3视觉特征。

**2. 技术拆解**
- **核心方法**: Ela框架联合训练三个组件：潜在动作模型（LAM，含推断潜在动作的IDM和预测下一帧的FDM）、潜在动作策略（输出潜在动作）、动作解码器（将潜在动作映射为连续控制指令）。通过交替更新策略和LAM，并将两者的中间特征对齐到冻结的DINOv3参考特征，塑造兼具可建模性和可解码性的潜在空间。
- **关键细节**: 
  - **输入输出**：输入为RGB图像对（无标签）和带标签的机器人轨迹；输出为连续的机器人末端执行器位姿增量。夹爪控制因视觉变化微小，从潜在动作中剥离，由独立的策略头直接预测。
  - **模型结构**：IDM使用带可学习register tokens的Transformer编码器，输出经iFSQ量化的潜在动作；FDM使用Transformer解码器和U-Net重构下一帧；动作解码器是轻量级单遍Transformer解码器（4M参数）；策略采用Diffusion Policy或UWM。
  - **规模**：动作解码器4M参数；Ela_DP总参数约6M。
  - **关键超参**：潜在动作token长度k=16，FSQ codebook配置为[9,9,9,9]（6561 codes）。
- **训练/优化目标**: 
  - **损失函数**：$\mathcal{L} = \mathcal{L}_{fdm} + \mathcal{L}_{act} + \mathcal{L}_{align} + \mathcal{L}_{policy}$。
  - $\mathcal{L}_{fdm}$：FDM的图像重构损失（L2）。
  - $\mathcal{L}_{act}$：动作解码器的动作重构损失（L2，仅用于有标签数据）。
  - $\mathcal{L}_{policy}$：策略预测潜在动作的损失（L2）。
  - $\mathcal{L}_{align}$：表示对齐损失（负余弦相似度），将策略和IDM的中间特征对齐到冻结DINOv3提取的参考特征。
  - **训练策略**：分三阶段（LAM预热、联合预训练、策略微调）。联合预训练时采用交替更新（LAM-update pass冻结策略更新LAM，Policy-update pass冻结LAM更新策略）防止梯度冲突和表示崩溃。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：LIBERO-10基准，少样本设置（每个任务50条演示中抽取N=5, 10, 20条带标签数据，其余为无标签数据）。对比基线：DP, UWM, ATM, AMPLIFY。
  - **真实世界**：跨具身学习（10条机器人带标签数据 + 40条人类无标签视频），任务包括放置食物、叠碗、倒水、开烤箱等。对比基线：LAPA, Villa-X, UniVLA, LAPA-DINO, Dynamo。
- **评价指标**: 任务成功率（Success rate）、动作预测均方误差（MSE，用于评估可解码性和可建模性）、线性探测MSE。
- **主要结果**: 
  - **仿真中**，Ela在低数据量下提升显著。例如N=5时，Ela_UWM将UWM的成功率从19%提升至59%，Ela_DP将DP从31%提升至54%，且优于依赖外部模型的ATM和AMPLIFY。
  - **真实世界中**，仅用6M参数和250条数据的Ela_DP达到70%的平均成功率，大幅超越使用上亿参数和百万级数据预训练的LAPA (26%)、Villa-X (27%) 和 UniVLA (8%)，也优于同数据量下的DP (48%)。
  - **分析表明**，Ela学到的潜在动作在可解码性和可建模性上均达到最优，线性探测MSE降至0.015，证明其表示质量更高，而非单纯依赖解码器容量。

### 48. 🔥 [ReactWorld: Structuring Interaction Responses for Embodied Video Generation] (ReactWorld：构建具身视频生成的交互响应)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06120` | [点击跳转](https://arxiv.org/abs/2611.06120)

**领域与类型**：方法创新 / 具身视频生成（Embodied Video Generation）

**0. 论文标题**
- **英文标题**: ReactWorld: Structuring Interaction Responses for Embodied Video Generation
- **中文标题**: ReactWorld：构建具身视频生成的交互响应
- **研究机构**: 原文未提及
- **一句话总结**: 提出ReactWorld，在视频生成骨干的特征空间内显式预测交互响应（角色、响应强度、局部运动），并通过零动态参考差值和位移偏置引导特征更新与跨帧检索，提升了具身视频生成中物体响应的任务一致性和物理合理性。

**1. 整体逻辑**
- **研究任务**: 具身视频生成（预测机器人动作引起的场景变化，生成符合物理规律和任务意图的交互视频）。
- **研究动机**: 现有的图像到视频（I2V）模型生成的视频虽然看着平滑，但在具身交互中，物体响应经常跟任务意图和接触动力学对不上（比如还没碰到就动了、抓取物脱落、无关物体乱动）。决定交互成败的关键动力学往往只集中在局部区域和特定瞬间，全局平均的去噪监督会把这些稀疏但关键的动态给淹没掉。
- **本质改动**: 借鉴思维链，在视频生成骨干的特征空间里显式预测“交互响应场”（谁参与、哪里响应最强、怎么动），然后设计了一个反馈适配器，通过计算“有预测动态”和“零动态”的输出差值，以及添加位移注意力偏置，来精准引导物体特征更新和跨帧信息聚合。
- **技术溯源**: 基座模型为 Wan2.2-I2V-A14B（冻结骨干，使用LoRA微调）；使用 Qwen3-VL 辅助角色标注和评估，SAM3 获取物体掩码，CoWTracker 提取点轨迹。

**2. 技术拆解**
- **核心方法**: 
  1. **交互响应场预测器**：从骨干中间特征预测四个维度的信息：参与者角色（机器人、直接目标、受影响物体、背景）、未来运动响应强度、以及区间运动（运动支持权重和位移）。
  2. **响应反馈适配器**：包含两条路径。一是利用预测动态与“零动态”参考输出的差值，作为特征增量去更新物体特征；二是将预测位移转化为固定局部窗口内的时间注意力偏置，引导跨帧去哪找信息。
- **关键细节**: 
  - **输入输出**：推理只需初始图像和任务指令，无需外部角色图或轨迹；输出为未来视频序列。
  - **模型结构**：冻结 Wan2.2 骨干，训练 rank-32 video LoRA、响应预测头、残差适配器和时间注意力分支。响应预测和反馈模块插入在 DiT 的第 12 个 block。
  - **规模与数据**：约 500K 视频片段（来自 AgiBot、RoVid-X 和互联网），视频为 81 帧，分辨率 480×832，16 FPS。
  - **关键超参**：8 张 H100 训练，BF16 精度，AdamW 优化器，学习率 1e-5，有效 batch size 32。
- **训练/优化目标**: 联合损失函数，包括：视频流匹配损失（Flow-matching loss） + 角色交叉熵损失 + 未来响应强度 Smooth L1 损失 + 运动支持 BCE 与位移 Smooth L1 损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：在 RBench（评估任务完成、交互合理性等）和 EZS-Bench（评估具身领域性能和感知质量）上测试。
  - **对比对象（baseline）**：Wan2.2-A14B、Cosmos3-Nano、ABot-PhysWorld、PhysisForcing，以及同数据同预算微调的 Video-FT。
- **评价指标**: 
  - **RBench**：9 个类别的平均分，以及 RSS（机器人和物体稳定性）、PSS（物理-语义合理性）、TAC（任务一致性）。使用 Qwen3-VL-235B 打分。
  - **EZS-Bench**：Domain（领域）和 Quality（质量）得分。Domain 用 Qwen2.5-VL-72B 评估，Quality 用 8 个视频质量指标计算。
  - **人工评估**：50 名评估者对任务进度、接触合理性、视觉质量进行 5 分制打分。
- **主要结果**: 
  - **RBench**：平均分 77.51，比 PhysisForcing 高 3.29 分，比 Video-FT 高 5.57 分，在全部 9 个类别中均优于 PhysisForcing。
  - **EZS-Bench**：Domain 得分 86.98，平均分 81.87，均优于所有 baseline。
  - **人工评估**：任务进度（4.08）和接触合理性（4.06）得分最高，接触合理性显著高于 Video-FT。
  - **消融实验**：证明了“零动态参考”、“局部响应池化”、“位移偏置”均有正向收益，且将模块插入在第 12 层效果最好；干预实验表明反馈位移能定性对应并引导生成物体的实际运动方向。

### 49. 🔥 [OopsieRecover: Learning Transferable VLA Corrections from Semantic Interventions] (OopsieRecover：从语义干预中学习可迁移的VLA纠错策略)
- **研究机构**: `德克萨斯大学奥斯汀分校 (The University of Texas at Austin)`
- **Arxiv ID**: `2611.08462` | [点击跳转](https://arxiv.org/abs/2611.08462)

**0. 论文标题**
- **英文标题**: OopsieRecover: Learning Transferable VLA Corrections from Semantic Interventions
- **中文标题**: OopsieRecover：从语义干预中学习可迁移的VLA纠错策略
- **研究机构**: 德克萨斯大学奥斯汀分校 (The University of Texas at Austin)
- **一句话总结**: 提出OopsieRecover框架，利用VLM从少量人类语义干预中合成门控代价函数，在推理时通过最小化代价来引导冻结的VLA基座，实现零样本跨场景纠错泛化。

**1. 整体逻辑**
- **研究任务**: 利用少量人类干预数据（动作轨迹+自然语言描述），纠正视觉-语言-动作（VLA）模型在部署时的系统性失败（如碰撞、掉落），并使其泛化到新的物体位姿和场景中。
- **研究动机**: 现有的交互式模仿学习（如DAgger）把纠错当成普通的状态-动作监督来微调模型，需要大量数据且一旦场景或位姿变了就失效。人类能从几次纠错中总结出通用原则，但现有方法缺乏从少量干预中提取这种可迁移语义意图的能力。
- **本质改动**: 放弃微调VLA权重，转而利用VLM的溯因推理（abduction），从少量干预中合成结构化的“语义门控代价（Gated Costs）”。在推理时，通过评估候选动作的代价来引导（steer）冻结的VLA，把纠错意图从具体轨迹中解耦出来。
- **技术溯源**: 基于视觉-语言-动作模型（VLA），具体使用的基座是 $\pi_0$ / $\pi_{0.5}$（OpenPI），结合视觉-语言模型（VLM）进行场景实体定位和代价函数生成。

**2. 技术拆解**
- **核心方法**: 
  1. 收集干预：记录人类接管前后的轨迹和语言描述，区分“接管前（失败行为）”和“人类控制（正确延续）”窗口。
  2. 实体接地：用VLM根据任务指令和纠错描述定位相关实体（如杯子、机器边缘），通过分割和深度图构建并跟踪它们的3D点集。
  3. 合成代价：将实体的运动轨迹（质心序列）和语言描述喂给VLM，生成包含“门控（何时触发）”、“纠错项（空间关系约束）”和“任务项（保持任务进度）”的代价函数。
  4. 验证与精炼：通过“排序检查”（纠错后的代价必须低于纠错前）和“触发检查”（纠错前必须触发门控）来验证。不通过则让VLM根据错误反馈修改代价函数，直到通过或达到迭代上限。
  5. 推理引导：部署时，VLA采样多个候选动作块，用动力学模型预测点集轨迹，选择累积门控代价最低的候选动作执行。
- **关键细节**: 
  - 实体被表示为3D点集（保留空间范围）或单点（如特定位置）。
  - 门控代价公式：$C^c(\mathcal{E}) = C^c_{gate}(\mathcal{E})(C^c_{correction}(\mathcal{E}) + \lambda C^c_{task}(\mathcal{E}))$。
  - 动力学模型 $f_{dyn}$ 在仿真中用物理引擎，真实世界用基于抓取的模型。
  - 候选动作采样数量 $K$，预测 horizon 为 $H$。
- **训练/优化目标**: 无传统梯度训练。核心机制是VLM的Prompting生成代价函数，以及基于经验一致性的验证与迭代精炼。推理时的优化目标是选择预测累积门控代价最小的动作块（即 $\arg\min_k J^{(k)}$）。

**3. 实验结果**
- **实验设置**: 
  - 仿真：RoboCasa基准，3个任务，基座为 $\pi_{0.5}$。对比基线：$\pi_{0.5}$ (无引导), HG-DAgger* (LoRA微调), OLAF (VLM重标签微调), VLS (推理时引导，仅用任务描述生成奖励)。难度分 $\mathcal{L}_0$ (同场景同位姿), $\mathcal{L}_1$ (同场景新位姿), $\mathcal{L}_2$ (新场景新位姿)。每任务5-8个纠错。
  - 真实世界：DROID硬件，OpenPI ($\pi_{0.5}$) 检查点。3个任务。对比基线：$\pi_{0.5}$, HG-DAgger*。每任务3-6个纠错。
- **评价指标**: 
  - 仿真：零样本成功率（Zero-shot success rates）。
  - 真实世界：任务进度得分（Task-progress scores，完成任务阶段的比例）。
- **主要结果**: 
  - 仿真：OopsieRecover在 $\mathcal{L}_0$ 表现优异，且在 $\mathcal{L}_1$ 和 $\mathcal{L}_2$ 实现零样本泛化。HG-DAgger* 和 VLS 在 $\mathcal{L}_1/\mathcal{L}_2$ 均失效。
  - 真实世界：OopsieRecover 将真实世界任务进度从 35.1% 提升至 61.0%（相对提升74%），在所有难度级别上比次优基线（HG-DAgger*）高出至少60%，在 $\mathcal{L}_0$ 和 $\mathcal{L}_2$ 统计显著最优。
  - 数据效率：在CoffeeMug任务中，仅需8个纠错即可达到84%成功率并饱和，而HG-DAgger*用同等数据仅达28%。
  - 泛化防错：从单个纠错 episode 学习的“避免碰撞”程序，在10个新场景中100%成功触发并防止碰撞。

### 50. 🔥 [SLA: Scaling Spatial-Language-Action Model via Continual Pre-training] (SLA：通过持续预训练扩展空间-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.08373` | [点击跳转](https://arxiv.org/abs/2611.08373)

**0. 论文标题**
- **英文标题**: SLA: Scaling Spatial-Language-Action Model via Continual Pre-training
- **中文标题**: SLA：通过持续预训练扩展空间-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出SLA模型，通过在持续预训练和后训练阶段将VLA的中间视觉特征与冻结的3D感知模型进行隐式对齐，在不增加推理开销的前提下赋予2D VLA基础模型通用的3D空间理解能力。

**1. 整体逻辑**
- **研究任务**: 训练具备3D物理空间理解能力的视觉-语言-动作（VLA）机器人操作基础模型。
- **研究动机**: 现有2D VLA模型缺乏显式3D知识，在需要细粒度空间推理时不可靠。现有方法要么依赖难获取且异构的3D传感器数据（如深度图/点云），要么仅在后训练（post-training）阶段引入空间监督，导致空间能力沦为任务特定的“插件”，无法形成可扩展的3D VLA基础模型。
- **本质改动**: 将“隐式3D表示对齐”从单纯的后训练阶段提前并贯穿到**持续预训练（continual pre-training）** 阶段，通过双阶段的空间监督塑造基础模型的视觉表征，同时保持原VLA推理架构不变。
- **技术溯源**: 基于预训练的 $\pi_{0.5}$ VLA策略；外部3D感知教师模型采用 OmniVGGT（基于VGGT）；视觉编码器涉及 SigLIP / DINOv2。

**2. 技术拆解**
- **核心方法**: 
  1. **隐式空间对齐**：利用冻结的OmniVGGT提取像素级3D空间表示，通过投影层和余弦相似度损失，将VLA中间层的视觉token与外部3D特征对齐。
  2. **自适应层选择**：设计特征依赖的门控机制（feature-dependent gates），自适应聚合VLA多个Transformer层的视觉嵌入进行空间监督，以应对异构数据。
  3. **概率状态丢弃**：训练时随机丢弃机器人本体状态（proprioceptive state），强迫模型依赖视觉线索，防止对演示轨迹过拟合。
  4. **统一动作表示**：统一不同机器人的末端执行器（EEF）坐标系，使用旋转向量（Rotation Vector）和SO(3)组合计算相对旋转，避免欧拉角带来的数值异常。
- **关键细节**: 
  - **输入输出**：输入多视角RGB（部分带深度和相机标定），输出基于末端执行器（EEF）的连续动作chunk（通过flow matching生成）。
  - **模型架构**：以 $\pi_{0.5}$ 为基座。外部3D教师模型、对齐投影器和层选择门控**仅在训练时使用**，推理时直接丢弃，不增加任何额外计算开销，也不需要深度图或相机标定输入。
  - **数据规模**：持续预训练语料整合了6个公开数据集（InternData-A1, AgiBotWorld-Beta, RoboCasa365, RoboCOIN, DROID, MolmoAct），包含约170万条轨迹、14330小时数据，涵盖多种机器人形态和场景。
- **训练/优化目标**: 联合优化动作预测损失与空间对齐损失：$\mathcal{L} = \mathcal{L}_{action} + \alpha \mathcal{L}_{align}$。其中 $\mathcal{L}_{align}$ 为VLA视觉token与外部3D表示之间的余弦相似度损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 LIBERO-Plus（鲁棒性测试）, RoboTwin 2.0（双臂操作）, RoboCasa-Panda（厨房操作）, RoboDojo-Real/Sim（多形态操作）以及8个自定义真实世界部署条件下评估。对比基线包括 $\pi_0$, $\pi_{0.5}$, Spatial Forcing（仅后训练对齐）, OpenVLA-OFT, SpatialVLA 及各榜单SOTA模型。
- **评价指标**: 任务成功率（Success Rate, SR），部分任务包含进度得分（Score）。
- **主要结果**: 
  - **LIBERO-Plus**：平均SR达87.4%，超越 $\pi_{0.5}$ (84.4%) 和仅后训练对齐的 Spatial Forcing (85.1%)。
  - **RoboTwin 2.0**：在Clean2Random设定下SR达72.3%，平均79.2%，大幅超越 $\pi_{0.5}$ (58.3%)，展现出极强的场景泛化能力。
  - **RoboCasa-Panda**：仅用50个demo/task即达到68.4% SR，超越使用300-3000个demo的baseline，下游数据效率极高。
  - **RoboDojo-Real**：单策略跨3种机器人形态（ARX X5, Piper, Piper X）达到33.9% SR，比 $\pi_{0.5}$ (12.8%) 提升21.1个百分点。
  - **真实世界部署**：在8个复杂条件（涉及双臂协调、动态目标、跨形态少样本适应等）下平均SR达83.8%，比 $\pi_{0.5}$ 提升24.0个百分点。
  - **消融结论**：持续预训练+后训练双阶段对齐效果优于任一单阶段；自适应层选择优于固定层；25%概率的状态丢弃效果最佳；旋转向量表示最优。

### 51. 🔥 [La-JEPA: Compact Robot Policies with Latent World Modeling] (La-JEPA：基于潜在世界建模的紧凑型机器人策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.08156` | [点击跳转](https://arxiv.org/abs/2611.08156)

**0. 论文标题**
- **英文标题**: La-JEPA: Compact Robot Policies with Latent World Modeling
- **中文标题**: La-JEPA：基于潜在世界建模的紧凑型机器人策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种紧凑型世界-动作模型 La-JEPA，在预训练的 V-JEPA 特征空间内从头训练策略 Transformer，摆脱了对庞大生成式骨干网络的依赖，在大幅减少参数量和推理延迟的同时，取得了无具身预训练策略的 SOTA 性能。

**1. 整体逻辑**
- **研究任务**: 机器人控制策略学习（根据多相机视觉观测、本体感觉和语言指令生成动作序列）。
- **研究动机**: 现有的世界-动作模型 (WAMs) 和视觉-语言-动作模型 (VLAs) 通常直接继承用于视频或语言生成的庞大预训练 Transformer 骨干。这导致策略架构和推理成本与生成任务绑定，而生成任务所需的像素级保真度对控制并非必要；同时，现有的基于 JEPA 的方法依然依赖预训练的 VLM 或视频生成模型作为骨干，不清楚专为控制设计的紧凑架构能否达到同等性能。
- **本质改动**: 抛弃生成式骨干网络，将策略的 World DiT 和 Action DiT 从头初始化（train from scratch），直接在预训练的 V-JEPA 2.1 密集时空特征空间中进行联合的未来特征预测和动作生成。
- **技术溯源**: V-JEPA 2.1 (视觉特征提取), Fast-WAM / Faster-WAM (训练时预测未来、推理时仅生成动作的范式), DiT (Diffusion Transformer), Flow Matching, FLAN-T5-large (语言编码)。

**2. 技术拆解**
- **核心方法**: 采用双 DiT 架构（World DiT 和 Action DiT），在 V-JEPA 2.1 特征空间内使用联合 Flow Matching 进行训练。训练时同时预测未来视觉特征和动作，推理时丢弃未来特征预测路径，仅通过 Action DiT 去噪生成动作。
- **关键细节**: 
  - **输入输出**: 输入为多相机观测、本体感觉和语言指令；输出为动作 chunk（如 LIBERO 执行 10 步，RoboTwin 执行 24 步）。
  - **模型结构**: World DiT 处理观测和未来特征 tokens，Action DiT 处理动作 tokens。两者通过交叉注意力交互，并使用严格的注意力掩码防止未来信息泄露给动作路径（观测只关注观测，未来关注观测和未来，动作关注观测和动作）。
  - **规模**: 提供 S (0.1B), B (0.34B), L (1.14B) 三种可训练参数规模，部署参数（含冻结编码器）在 0.74B 到 1.78B 之间。
  - **关键设计**: 采用 tube-motion 时间编码（将16帧未来联合编码），结合相机/本体感觉 dropout、图像增强和编码器 LoRA 微调以提升鲁棒性。
- **训练/优化目标**: 联合 Flow Matching 损失。对 future 和 action 分别独立采样时间步和高斯噪声，预测速度场，优化目标为两者预测速度与真实速度差的均方误差（MSE）之和。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO, LIBERO-Plus (作者修正了官方评估器中指令被污染的问题), RoboTwin 2.0 (包含 clean 和 randomized 场景)，以及 4 个 Franka 真机桌面任务。
  - **对比对象 (Baseline)**: Fast-WAM, Faster-WAM, Cosmos Policy, ImageWAM, NowWAM, JEPA-WAM, LeapBot-WA, StarVLA, Qwen-RobotManip, $\pi_{0.5}$ 等。
- **评价指标**: 任务成功率 (Success rate %)，推理延迟 (Latency ms)。
- **主要结果**: 
  - 在无具身预训练 (embodied pretraining) 的策略中，La-JEPA 在修正指令后的 LIBERO-Plus 和 RoboTwin 2.0 上取得 SOTA（例如 LIBERO-Plus 成功率达 88.0%，显著高于 Fast-WAM 的 70.8%）。
  - **参数与效率**: 部署参数量仅为最强竞争者（如 NowWAM, Fast-WAM）的 1/4 左右；推理速度比 Fast-WAM 快 2 到 5 倍（优化编译后）。
  - **超越同类 JEPA 方法**: 在 LIBERO-Plus 和 RoboTwin 上显著超越 LeapBot-WA 和 JEPA-WAM。
  - **真机表现**: 在 4 个真机任务（含接触密集的 Push T 和长视野餐具摆放）上，平均成功率与具身预训练的 $\pi_{0.5}$ 相当，且推理延迟最低（25.16 ms）。
  - **消融结论**: V-JEPA 特征显著优于视频 VAE 潜变量（尤其在 OOD 场景），且训练时的未来预测监督对提升策略性能至关重要。

### 52. 🔥 [Learning Robotic World Models with Semantic and Visual Feedback] (结合语义与视觉反馈学习机器人世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.07850` | [点击跳转](https://arxiv.org/abs/2611.07850)

**0. 论文标题**
- **英文标题**: Learning Robotic World Models with Semantic and Visual Feedback
- **中文标题**: 结合语义与视觉反馈学习机器人世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RoboImagine 框架，通过分组多样化搜索生成候选轨迹，并结合冻结多模态评估器的语义偏好与像素/感知级视觉误差进行后训练，显著提升了自回归机器人世界模型的视觉保真度与任务一致性。

**1. 整体逻辑**
- **研究任务**: 训练自回归机器人世界模型，使其能够根据初始视觉观察、动作序列和文本指令，预测动作条件下的未来视觉状态（视频预测），以支持机器人的规划与决策。
- **研究动机**: 现有的世界模型训练多依赖视觉重建损失，容易导致“画面好看但任务没推进”（缺乏物理和任务语义）；而纯语义评估又对局部视觉瑕疵不敏感。此外，现有的后训练方法要么依赖难以校准的绝对分数，要么生成的候选轨迹同质化严重，导致比较学习失效。
- **本质改动**: 将世界模型的后训练转化为“候选未来比较”问题。在相同输入下生成多样化的候选轨迹，利用互补的语义反馈（任务进度）和视觉反馈（像素/感知误差）计算组相对优势，通过策略梯度优化模型，从而同时约束视觉细节和任务逻辑。
- **技术溯源**: 基于 iVideoGPT 的离散视觉-动作表示（FSQ量化）；骨干网络为 12层 LLaMA 风格因果 Transformer；文本编码用 T5；搜索算法用分组多样化波束搜索（GDBS）；语义评估器用冻结的 4B 多模态模型 mJev (Jev)。

**2. 技术拆解**
- **核心方法**: RoboImagine 框架分为两阶段。1) SFT初始化：训练一个GPT风格的自回归模型预测离散动力学 token。2) 后训练阶段：使用 GDBS 在共享输入下生成多个不同的候选未来轨迹，每个分支维护独立的滚动历史；接着用冻结的 Jev 模型对候选视频进行双向成对比较获取语义奖励，同时计算预测帧与真实帧的像素L1和LPIPS误差获取视觉奖励；将两类奖励在组内标准化并加权融合，计算组相对优势；最后通过带参考策略正则化的策略梯度方法更新生成器。
- **关键细节**: 
  - **输入表示**：2帧初始观察编码为 1280个上下文 token 和 80个动力学锚点 token，动作离散化为 256 bins。
  - **模型结构**：12层 LLaMA decoder (hidden 768, 12 heads)，在第 4/8/12 层插入文本交叉注意力。
  - **搜索配置**：GDBS 设 4个组，每组 2个 beam，多样性惩罚系数 0.1。
  - **记忆机制**：保留固定初始上下文、动态锚点及最近 W=6 个预测状态和动作，限制条件历史窗口以支持长序列生成。
- **训练/优化目标**: 
  - **SFT阶段**：最小化动力学 token 的负对数似然损失。
  - **后训练阶段**：最大化组相对优势（Group-relative advantages）。使用 PPO 风格的截断替代目标（clipped surrogate），并加入与冻结 SFT 策略的 KL 散度正则化。训练时只更新骨干网络和文本交叉注意力，冻结视觉编解码器和评估器。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RT-1, BridgeV2, RoboCasa（涵盖真实与仿真机器人操作）。
  - **Baselines**：闭源/开源视频生成大模型（Kling, Runway, HunyuanVideo等），动作条件世界模型（iVideoGPT, RoboDreamer, Vid2World等），RL后训练世界模型（RLVR-World, RoboAlign-R1），以及任务适配的视频基础模型（Wan2.2, Cosmos等）。
- **评价指标**: 
  - **视觉质量**：PSNR, SSIM, LPIPS, MAE。
  - **任务与物理一致性**：RoboAlign-Judge（6个维度，满分10分），以及外部独立多模态评估（Qwen3-VL, Doubao, GPT-6）。
- **主要结果**: 
  - **对比继续 SFT**：在 RT-1 上，相同更新次数下，RoboImagine 后训练比继续 SFT 的 PSNR 提升 1.26 dB，LPIPS 降低 11.93%，证明了比较后训练比单纯增加监督训练步数更有效。
  - **对比 SOTA**：在 RobotWorldBench (RT-1) 评估中，RoboImagine 总分达 8.98，超越 RoboAlign-R1 (8.52) 和 iVideoGPT (7.74)，在动作-结果一致性和物理遵循上提升显著。
  - **消融实验**：视觉反馈能最大化视觉指标，语义反馈提升任务进度；两者结合（Hybrid）在保持视觉保真度的同时，使外部多模态评估（如 Qwen）得分最高（8.30）。GDBS 相比普通 Beam Search 和 MCTS 在视觉和语义指标上均更优，且计算开销增加极小（约 2.1%）。
  - **长序列预测**：使用 W=6 的滚动历史窗口在 32-96 帧的预测中取得了质量与推理延迟的最佳平衡，避免了全记忆带来的误差累积和高昂推理成本。

### 53. 🔥 [Embodied RAG++: Retrieval-Augmented Generation From What Exists to What Works in Embodied Scenes] (Embodied RAG++：具身场景中从“存在什么”到“什么可用”的检索增强生成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.07517` | [点击跳转](https://arxiv.org/abs/2611.07517)

**0. 论文标题**
- **英文标题**: Embodied RAG++: Retrieval-Augmented Generation From What Exists to What Works in Embodied Scenes
- **中文标题**: Embodied RAG++：具身场景中从“存在什么”到“什么可用”的检索增强生成
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个连接动态场景图与真实产品手册的基准E2W-Bench，并设计了Embodied RAG++框架，通过“模型级能力卡片”缓存和确定性空间推理，解决了机器人在复杂环境中根据功能需求匹配可用物体和可达机器人的问题。

**1. 整体逻辑**
- **研究任务**: 具身场景下的“机器人-对象”分配（Capability-grounded robot-object assignment）。即根据用户的功能需求（记录在外部产品手册中）和机器人的物理限制（受限于动态场景状态），为机器人分配正确的物理对象。
- **研究动机**: 现有的3D场景图只能记录物体“存在哪里”，但不知道其具体功能（如微波炉的容量和温度，这些只在产品手册里）。现有的RAG方法能读手册，但无法将文档知识、物理实例、机器人状态和动态环境（如电梯故障、楼梯可达性）结合起来做联合推理。此外，每次查询都让LLM重新处理多页手册效率极低且容易出错。
- **本质改动**: 把场景图作为外部知识的索引，首创“模型级能力卡片（Capability Cards）”按需缓存提取的功能属性，避免重复读手册；同时将“文档功能推理”和“物理空间推理”解耦，后者完全交由不消耗LLM token的确定性算法解决。
- **技术溯源**: 基于 3DSceneGraph（场景图构建）、GraphRAG / LightRAG / EmbodiedRAG（RAG基线对比）、MuJoCo（仿真环境）、Qwen2.5-32B / Llama3.3-70B / Gemini-3.5-Flash（LLM骨干网络）、hierarchical navigable small-world graph（图索引后端）。

**2. 技术拆解**
- **核心方法**: 
  1. **E2W-Bench 基准**：构建动态混合场景图，连接物理对象和真实产品手册，包含机器人、空间连接器和动态状态。
  2. **Embodied RAG++ 框架**：
     - **Capability Cards（能力卡片）**：以产品型号为键的缓存，按需增量提取和存储功能字段，同型号的不同物理实例共享。
     - **Scoped, Aspect-Split Retrieval（范围限定与方面拆分检索）**：利用场景图将检索范围限制在候选对象的手册内；将复合需求拆分为独立方面分别检索，防止单一约束主导embedding。
     - **Graph-Based Selective-Recomputation（图索引按需重计算）**：使用剪枝的近邻图代替全量embedding矩阵，查询时按需重计算访问节点的embedding，大幅降低存储和计算成本。
     - **Deterministic Spatial Reasoning（确定性空间推理）**：使用BFS在楼层-连接器图上检查可达性，结合固定垂直可达包络检查高度，不依赖LLM。
- **关键细节**: 
  - **输入输出**：输入动态混合场景图和自然语言查询，输出可行的 `(robot_id, target_object_id)` 对及其位置。
  - **规模与环境**：20个仿真场景，约500K tokens的序列化空间上下文，770页真实产品手册（涵盖5类电器），3种机器人平台（四足、人形、轮式移动操作臂）。
  - **系统架构**：分两阶段。阶段一：通过卡片和检索筛出满足功能需求且可用的候选对象；阶段二：将候选对象传给确定性空间层，筛出物理上可达的机器人。
- **训练/优化目标**: 非参数学习类工作。核心机制是：查询时先查缓存（Capability Card），若未命中（miss）则触发基于图索引的局部检索和LLM提取；空间可达性通过BFS和几何包络计算，通过确定性的规则满足（如连通性检查、高度检查）而非梯度优化。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 E2W-Bench（20个动态场景，包含微波炉、电饭煲等5类电器，真实手册，3种机器人）。
  - **Baselines**：Naive LLM, Naive LLM + SR, GraphRAG + SR, LightRAG + SR, EmbodiedRAG + SR（SR指共享的确定性空间推理模块）。
  - **LLM Backbones**：Qwen2.5-32B, Llama3.3-70B, Gemini-3.5-Flash。
- **评价指标**: 
  - **主要指标**：Exact-match pair accuracy（精确匹配的对准确率，即同时选对机器人和目标对象）。
  - **效率指标**：预处理时间、查询+生成时间、总Token消耗量、Capability Card缓存命中率。
- **主要结果**: 
  - **准确率碾压**：使用 Qwen2.5-32B 时，Embodied RAG++ 的 Pair 准确率达到 0.90（Baseline 最高仅 0.30）；使用 Llama3.3-70B 时达到 1.00（Baseline 最高 0.55），是唯一在开源模型上达到完美的系统。
  - **效率最优**：预处理时间最短（14-25秒），总 Token 消耗量最低（0.2M tokens，与 EmbodiedRAG 持平）。随着查询增加，Capability Card 的稳态命中率超过 85%，大幅减少重复提取。
  - **消融结论**：去掉“确定性空间推理”导致准确率下降最大（证明LLM不擅长处理复杂的物理连通和高度推理）；去掉“方面拆分检索”和“模型级共享”也会显著降低准确率；而“能力卡片”本身不影响准确率，其核心价值在于减少重复调用。

### 54. 🔥 [Spatial-UMI-Dream: Scaling World Action Models with Metric Geometry for UMI Manipulation] (Spatial-UMI-Dream：利用度量几何扩展用于UMI操作的世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.07229` | [点击跳转](https://arxiv.org/abs/2611.07229)

**0. 论文标题**
- **英文标题**: Spatial-UMI-Dream: Scaling World Action Models with Metric Geometry for UMI Manipulation
- **中文标题**: Spatial-UMI-Dream：利用度量几何扩展用于UMI操作的世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种引入显式度量深度的5B世界动作模型，通过两阶段预训练在605小时RGB-D UMI数据上学习，并构建了专门的仿真基准，大幅提升了UMI策略在域内及跨实体/环境变化下的操作成功率。

**1. 整体逻辑**
- **研究任务**: 基于UMI（Universal Manipulation Interface）数据学习操作策略，解决移动腕部鱼眼相机下缺乏稳定外部视角导致的度量几何缺失问题，并评估策略在跨机器人实体和环境变化下的泛化能力。
- **研究动机**: 1. UMI的腕部相机随夹爪移动，纯RGB模型将场景尺度和空间关系隐式化在外观中，模型难以推断精确的3D几何（尤其是双臂协同的共享工作空间）。2. 现有UMI评估只看域内成功率，缺乏对跨实体（cross-embodiment）和环境变化鲁棒性的控制变量评估。
- **本质改动**: 将度量深度（Metric Depth）作为显式的观测和预测目标引入世界动作模型（WAM），构建统一的RGB-D视频画布进行联合建模；同时构建了专门针对UMI策略泛化评估的仿真基准RoboTwin-UMI。
- **技术溯源**: 基于预训练的 Wan2.2-TI2V-5B 视频生成模型（Wan VAE 和 Transformer），Fast FoundationStereo（用于深度估计），以及 RoboTwin（仿真环境基座）。

**2. 技术拆解**
- **核心方法**: 
  1. **度量RGB-D表示**：利用双目立体视觉恢复度量深度，映射回鱼眼RGB视角。将深度通过三通道颜色映射（Turbo）编码，与RGB拼接成双夹爪统一的 320x320 RGB-D画布，直接输入预训练的视频VAE。
  2. **联合世界-动作建模**：使用共享Transformer，通过块因果注意力（block-causal attention）联合去噪视频和动作表示，同时预测未来RGB-D画布和执行动作。
  3. **两阶段训练**：Stage 1 仅世界适应（只预测未来RGB-D，冻结动作分支）；Stage 2 联合世界-动作训练（引入动作流和机器人状态，联合预测）。
  4. **部署补偿**：对UMI手持夹爪的物理延迟进行一阶响应模型标定和逆补偿。
- **关键细节**: 
  - **模型规模**：5B参数。
  - **数据规模**：605小时的RGB-D UMI数据。
  - **输入**：双夹爪RGB和度量深度（各160x160拼接），机器人状态，语言指令。深度编码范围 $d_{min}=0.01$m, $d_{max}=1.5$m。
  - **输出**：未来RGB-D画布，20维相对动作块（chunk size 24，包含平移、6D旋转、夹爪开合）。
- **训练/优化目标**: 基于Flow-matching（流匹配）的加权目标函数。Stage 1 优化视频流匹配损失 $\mathcal{L}_{world}$；Stage 2 优化联合损失 $\mathcal{L}_{world} + \lambda_a \mathcal{L}_{action}$（其中 $\lambda_a=1$）。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：RoboTwin-UMI（20个任务，包含Aloha-AgileX和ARX-X5两种实体，以及干净/随机光照环境）。
  - **真实世界**：6个双臂任务（基于Dexmate Vega1机器人）。
  - **对比基线**：VLA基线 $\pi_{0.5}$（通用）、RDT2-FM（UMI专用）；WAM基线 Fast-WAM、LingBot-VA。
- **评价指标**: 
  - **仿真**：20个任务的平均成功率（Mean success rate）。
  - **真实世界**：完整episode成功率（SR）和平均进度得分（Score，完成任务阶段的比例）。
- **主要结果**: 
  - **真实世界**：6个任务平均成功率85.0%，比最强基线 $\pi_{0.5}$ (60.8%) 高出24.2个百分点。
  - **仿真域内**：RoboTwin-UMI上平均成功率79.10%，比 $\pi_{0.5}$ (74.45%) 高4.65个百分点，比最强WAM基线 Fast-WAM (61.20%) 高17.90个百分点。
  - **泛化能力**：在实体和环境联合变化下，成功率72.15%，比最强基线高10.30个百分点。跨实体转移时成功率下降最小。
  - **消融实验**：引入度量深度（RGB-D vs RGB-only）在域内提升5.75个百分点，联合偏移下提升8.25个百分点。两阶段预训练将仿真域内成功率从直接微调基座的39.50%提升至Stage 1的61.25%，最终达到Stage 2的79.10%。

### 55. 🔥 [Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement] (学习任务还是学习验证器？重新思考具身自我提升中的标准暴露)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.08318` | [点击跳转](https://arxiv.org/abs/2611.08318)

**0. 论文标题**
- **英文标题**: Learning the Task or Learning the Verifier? Rethinking Criteria Exposure in Embodied Self-Improvement
- **中文标题**: 学习任务还是学习验证器？重新思考具身自我提升中的标准暴露
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过控制实验揭示，具身智能体在自我提升时如果直接读取评测标准，实际上是在“过拟合验证器”而非“学习真实任务”，并提出了使用“忠于指令的评测标准”来挤干现有基准刷榜水分的方法。

**1. 整体逻辑**
- **研究任务**: 评估具身编码智能体（Embodied coding agents）在机器人仿真基准上的自我提升效果，核心是研究向智能体暴露评测标准（Criteria Exposure, CE）到底是在帮它学任务，还是在帮它刷榜。
- **研究动机**: 现有的具身基准（如 RoboDojo）的评测标准往往比自然语言指令要求更多（比如包含隐藏规则、严苛的阈值等）。当智能体能直接看到这些标准代码时，它生成的代码到底是在完成指令，还是仅仅在迎合验证器？
- **本质改动**: 引入“忠于指令的评测标准（Instruction-faithful criteria）”进行反事实评估，把评测标准中超出指令要求的部分剔除，从而把“学任务”和“学验证器”的收益剥离开来。
- **技术溯源**: 基于 RoboDojo、LIBERO-PRO、RoboCasa365 等具身仿真基准；底层调用 GPT-6 Astra（作为执行 Actor）和 Claude Opus 5.5（作为反思 Learner），通过 PyRUA-Lean 接口控制机器人。

**2. 技术拆解**
- **核心方法**: 设计了一个包含 Actor 和 Learner 的自我提升闭环。设置两组对照：w/ CE（Learner 能看评测标准代码、分数和阶段）和 w/o CE（Learner 只能看到 episode 是否成功）。同时，人工重写了 RoboDojo 中存在“标准与指令不符”的任务，构建了“忠于指令的评测标准（$C^{faith}$）”。
- **关键细节**: 
  - Actor（GPT-6 Astra）负责写 Python 代码调用机器人原语；Learner（Claude Opus 5.5）负责根据执行反馈更新技能库（Skills）和记忆（Memory）。
  - 将 RoboDojo 任务分为“标准受限（Criteria-limited，标准比指令严或有隐藏规则）”和“忠于指令（Faithful）”两类。
  - 重写标准时，只改评测代码不改指令，去除了隐藏规则、放宽了硬阈值、修复了标准缺陷。
- **训练/优化目标**: 非梯度训练，而是基于 LLM 的迭代反思。优化目标是在开发集（dev layouts）上最大化成功率（Success Rate），并设有回滚（Rollback）机制防止性能退化。

**3. 实验结果**
- **实验设置**: 主要在 RoboDojo（25个任务）上训练和测试，并在 LIBERO-PRO 和 RoboCasa365 上测试跨基准迁移。对比 Baseline 为：空技能库、w/o CE（仅看成功与否）、w/ CE（看完整标准）。
- **评价指标**: 成功率（Success Rate, SR），即在未见过的测试布局上成功完成的 episode 比例。使用原始标准（$C^{orig}$）和忠于指令的标准（$C^{faith}$）进行双重评判。
- **主要结果**: 
  1. **刷榜现象确认**：在原始标准下，w/ CE 整体成功率（62.0%）显著高于 w/o CE（47.8%），但这完全来自于“标准受限”任务（51.6% vs 27.8%）；在“忠于指令”任务上两者表现打平（80.6% vs 83.3%）。
  2. **反事实打回原形**：当用“忠于指令的标准（$C^{faith}$）”重新评估同一批代码时，w/ CE 的优势直接消失（降至 45.0%，低于 w/o CE 的 47.2%），证明其高分全靠过拟合验证器。
  3. **泛化性差**：w/ CE 学到的“迎合特定标准”的技能无法迁移到新任务或新基准；而 w/o CE 学到的基于物理规律的技能在跨任务迁移时表现更稳健。
  4. **结论建议**：评估具身自我提升时，应默认不暴露评测标准，并使用忠于指令的标准，以反映智能体在真实世界（无验证器代码）中的实际任务学习能力。

### 56. 🔥 [Concertina: Embodying Manipulation and Cognition in One Diffusion Vision-Language Model] (Concertina：在单一扩散视觉语言模型中具身化操作与认知)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.07513` | [点击跳转](https://arxiv.org/abs/2611.07513)

**0. 论文标题**
- **英文标题**: Concertina: Embodying Manipulation and Cognition in One Diffusion Vision-Language Model
- **中文标题**: Concertina：在单一扩散视觉语言模型中具身化操作与认知
- **研究机构**: 原文未提及
- **一句话总结**: 提出具身视觉语言模型（eVLM）范式，通过极轻量的连续潜在动作接口将动作生成直接融入共享扩散VLM骨干，彻底抛弃外挂动作专家与离散分词器，在主流机器人操作基准上取得SOTA。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）策略中的机器人连续动作生成与物理操作。
- **研究动机**: 现有VLA模型将认知（VLM）与操作（动作生成）强行解耦。要么把动作量化为离散token（导致物理误差与符号惩罚不对等），要么外挂独立的动作专家（引发梯度冲突，迫使研究者使用“知识隔离”阻断梯度，破坏了VLM预训练表征的端到端更新）。
- **本质改动**: 摒弃外挂动作专家或离散动作分词器，将连续动作直接映射为共享扩散VLM骨干隐空间中的连续潜在token，复用VLM原生的“破坏-重建”算子进行端到端训练，让认知与操作在同一个参数路径上联合优化。
- **技术溯源**: 基于 BARD-VL（扩散视觉语言模型）作为共享骨干网络。

**2. 技术拆解**
- **核心方法**: 提出 Concertina (eVLM)。使用轻量级的逐位置MLP作为动作编解码器，将每个时间步的完整连续动作向量映射为骨干隐空间中的一个连续潜在动作token。将动作序列分块（blockwise），采用块间因果、块内双向的注意力机制，并复用BARD-VL的掩码块重建（corrupt-and-reconstruct）算子进行 packed teacher forcing 训练。
- **关键细节**: 
  - 模型规模：4.46B 参数的 BARD-VL-B4 骨干（36层Transformer，隐层维度2560）。
  - 动作接口：仅占 0.21% 参数（约9.49M），无独立动作生成层。
  - 动作表示：统一20D规范坐标系（支持单臂/双臂），每臂10维（3D平移+6D旋转+1D夹爪）。
  - 分块生成：将长度为H的轨迹分为M个块（每块K步，如K=10），块间因果保证时序，块内双向允许连贯动作（如靠近、抓取）联合去噪。
  - 推理机制：基于风险的块级解码（risk-guided blockwise reconstruction），支持KV cache复用。
- **训练/优化目标**: 物理坐标下的直接重建损失（位姿用Smooth-L1，夹爪用概率值BCE）。引入物理坐标权重（平移:旋转:夹爪 = 500:10:1）以平衡量级差异，并使用逆掩码概率对损失进行加权。

**3. 实验结果**
- **实验设置**: 
  - 数据集：多具身预训练混合数据集（80.2M帧，含AgiBot, DROID, RoboMIND等），下游评估使用 regular LIBERO, LIBERO-Plus (10,030 tasks), CALVIN ABC-D。
  - 对比对象（baseline）：离散/压缩token VLA (RT-2, OpenVLA, FAST等)，外挂动作专家VLA (π0, π0.5, SmolVLA, X-VLA等)，共享骨干VLA (LLaDA-VLA, Dream-VLA等)。
- **评价指标**: LIBERO/LIBERO-Plus 的成功率（Success Rate, %），CALVIN 的平均完成链长（AvgLen）及 SR@k。此外提出 Action Interface Audit 指标（EGC, TCA/NLR, ASCR）来审计模型的解耦程度。
- **主要结果**: 
  - 在 regular LIBERO 上平均成功率达 98.15%，超越 π0 (94.2%)、π0.5 (97.5%) 和 X-VLA (98.1%)。
  - 在包含10,030个任务的 LIBERO-Plus 上平均成功率达 85.9%，大幅超越 EFFVLA (79.8%) 和 OpenVLA-OFT (69.6%)。
  - 在 CALVIN ABC-D 上平均链长达 4.142，超越共享骨干策略 LLaDA-VLA (4.01)。
  - 架构审计证实：动作的时间耦合自然发生在共享骨干的中深层，而非外部接口；连续潜在token保持了满秩的物理流形（有效秩18.63/20），彻底避免了离散token单点错误导致整条轨迹崩溃的问题。

### 57. 🔥 [When Does Test-Time Search Help World Action Models? An Empirical Audit of Candidate Selection and Simulator Integrity] (测试时搜索何时对世界动作模型有效？对候选选择与模拟器完整性的实证审计)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41970` | [点击跳转](https://arxiv.org/abs/2610.41970)

**0. 论文标题**
- **英文标题**: When Does Test-Time Search Help World Action Models? An Empirical Audit of Candidate Selection and Simulator Integrity
- **中文标题**: 测试时搜索何时对世界动作模型有效？对候选选择与模拟器完整性的实证审计
- **研究机构**: 原文未提及
- **一句话总结**: 本文对世界动作模型在测试时增加计算量的收益进行了严格的实证审计，发现候选选择信号微弱、标称算力节省未转化为实际端到端加速，并揭示了模拟器中随计算量增加的隐蔽渲染损坏问题。

**1. 整体逻辑**
- **研究任务**: 评估世界动作模型（WAMs）在测试时增加推理计算（如候选动作选择、自适应算力分配）是否真正提升了机器人控制性能。
- **研究动机**: 现有工作通常只报告成功率提升，但忽略了额外计算是否真的提供了有效的决策信号、是否转化为实际的端到端加速，以及评估环境本身是否可靠（存在模拟器伪影）。
- **本质改动**: 不提出新的规划器或世界模型，而是提出一套“前提优先”的预注册审计方法论，从决策信号存在性、实际加速效果和评估完整性三个维度对测试时扩展进行实证检验。
- **技术溯源**: 基于 Cosmos Policy（世界动作模型）和 RoboCasa / robosuite（机器人仿真环境）。

**2. 技术拆解**
- **核心方法**: 提出包含三道门槛的审计流程：1) 验证决策信号前提（通过因果消融和事后Oracle估计选择上限）；2) 统计功效门槛（Power gate，防止在无法得出确切结论的实验中浪费算力）；3) 渲染完整性检查（通过帧缓冲区哨兵检测模拟器渲染损坏）。
- **关键细节**: 
  - 候选选择：在 N=8 的候选动作中，对比学习到的价值选择器、随机选择和事后 Oracle。
  - 算力分配：测量不同 Token 剪枝水平下的端到端延迟，设计析因实验（2步 vs 5步去噪，全/关键/均匀 Token 选择）检测联合分配效应。
  - 渲染完整性：使用帧缓冲区哨兵预填标记，检测渲染后是否被实质性修改，以发现 OpenGL 上下文管理导致的静默渲染损坏。
  - 规模与环境：Cosmos Policy (2B参数), RoboCasa 环境, NVIDIA RTX A6000 GPU, bf16 精度, 5步去噪。
- **训练/优化目标**: 本文非学习类工作，核心机制为预注册的实证审计协议（包含统计功效控制、Bootstrap 置信区间计算、帧缓冲区完整性校验等）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：RoboCasa 环境（包含 OpenSingleDoor, PnPCounterToCab, TurnOnStove, TurnOffStove 等任务）；对比基线包括随机选择（针对价值选择器）、密集查询 Dense（针对 Token 剪枝）以及官方直接策略（Direct-policy）协议。
  - 测试环境：NVIDIA RTX A6000, PyTorch 2.7.0, CUDA 12.8。
- **评价指标**: 闭环成功率差异（百分比点，pp）及 Bootstrap 置信区间；端到端查询延迟（ms）及加速比； episodes 的渲染损坏率（%）。
- **主要结果**: 
  1) 候选选择：在干净数据上，可部署的价值选择器比随机选择差 1.66 pp；事后 Oracle 仅提升 1.40 pp（且 episode 级别置信区间包含0），82% 的状态下所有候选结果相同，选择空间极小。
  2) 算力分配：Token 剪枝最多减少 47.9% 的前向 FLOPs，但在部署路径上仅实现 1.15× 的端到端加速（排除 decode 为 1.25×），未达到预注册的 1.5× 目标，受限于不可缩减的 VAE 编解码时间；联合分配效应低于噪声分辨率，未通过功效门槛，结论为不确定。
  3) 评估完整性：发现 RoboCasa/robosuite 中存在静默渲染损坏。在官方直接策略下损坏率仅 0.67%（对官方成功率影响极小），但在计算密集的规划路径下，损坏率飙升至高达 65%。
