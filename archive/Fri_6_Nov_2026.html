            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Hierarchical World Models with Implicit Dynamics] (基于隐式动力学的分层世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.42146` | [点击跳转](https://arxiv.org/abs/2610.42146)

**0. 论文标题**
- **英文标题**: Hierarchical World Models with Implicit Dynamics
- **中文标题**: 基于隐式动力学的分层世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种将状态可达性与局部控制解耦的分层世界模型，高层利用扩散模型的噪声空间作为隐式动作来生成可达子目标，低层通过逆动力学求解具体动作，有效解决了长视野具身规划中误差累积和搜索复杂度的问题。

**1. 整体逻辑**
- **研究任务**: 具身智能中的长视野（long-horizon）零样本目标条件规划（zero-shot goal-conditioned planning）。
- **研究动机**: 现有世界模型在长视野任务中面临搜索复杂度指数增长和预测误差累积的问题；而现有的分层方法通常依赖任务特定的价值函数、预训练低级策略或僵化的宏动作，不仅表示脆弱、泛化差，且优化器极易利用世界模型的缺陷产生不真实的转移（即“虫洞”效应）。
- **本质改动**: 将状态空间的拓扑可达性与底层执行细节解耦，把扩散模型的初始高斯噪声作为“隐式高层动作”，在平滑且良态的潜在空间中搜索子目标，避免了直接建模复杂、不连续的技能空间。
- **技术溯源**: 扩散概率模型（DDPM/DDIM）、Transformer、交叉熵方法（CEM）、DINO-WM（低层模型架构参考）。

**2. 技术拆解**
- **核心方法**: ID-WM 框架。高层使用条件扩散模型作为“可达状态生成器”，将高斯噪声映射为固定时间步长（$\Delta$）内的可行未来状态；低层使用基于 Transformer 的确定性世界模型作为“逆动力学求解器”，通过规划搜索出到达子目标的具体动作序列。
- **关键细节**: 
  - **高层模型**：输入当前状态和时间半径 $\Delta$，输出未来状态。推理时使用 DDIM 将标准高斯噪声 $z_t$ 确定性映射为子目标。
  - **低层模型**：输入历史 $k$ 步状态和动作，预测下一步状态。
  - **规划算法**：使用 CEM 交替优化高层噪声变量和低层动作序列。高层规划中加入了噪声正则化项，限制噪声幅值，防止优化器跑到高斯分布边缘产生分布外（OOD）的虚假转移。
- **训练/优化目标**: 
  - **高层训练**：标准扩散模型的噪声预测损失（MSE）。
  - **低层训练**：状态预测的 L2 损失。
  - **规划阶段（CEM）**：最小化最终预测状态与目标状态的距离，高层目标函数额外包含对噪声幅值的正则化惩罚。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：Wall（2D 过门导航）、PushT（T型块操作）、Maze（包含 U、Medium、Large、Giant 四种尺寸的迷宫导航），任务视野从几百到几千步不等。
  - **对比对象（Baseline）**：模仿学习（GCBC）、离线强化学习（HIQL）、扩散规划器（Diffuser、H-Diffuser）、单层世界模型 MPC（SL-WM / DINO-WM）、分层潜在世界模型（HWM）、视觉规划（AVDC）。
- **评价指标**: 成功率（Success Rate, SR）、最终覆盖率（Final Coverage, Cov，针对 PushT 任务）、到达目标的平均步数（Steps-to-goal）。
- **主要结果**: 
  - **整体提升**：相比 SOTA 基线（包括分层离线 RL、模仿学习和扩散规划）整体性能提升 38.5%。
  - **对比单层模型**：相比单层世界模型 MPC（SL-WM）性能大幅提升 135%，有效克服了长视野任务（如 PushT）中因误差累积导致的失败。
  - **扩展性与泛化**：在 Maze 尺寸增大和 PushT 目标距离增加（超过 150 步）时，ID-WM 仍能保持接近完美的成功率，而基线方法显著退化；在随机目标设定下优势尤为明显。
  - **视觉规划**：在基于视觉的 PushT 任务中，显著优于 DINO-WM、HWM 和 AVDC。
  - **推理效率**：虽然比单层模型慢，但比 Diffuser 快 27 倍，比 H-Diffuser 快 54 倍。

### 2. 🔥 [RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory] (RoboArchitect：自动化设计带持久记忆的机器人智能体)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.42141` | [点击跳转](https://arxiv.org/abs/2610.42141)

**0. 论文标题**
- **英文标题**: RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory
- **中文标题**: RoboArchitect：自动化设计带持久记忆的机器人智能体
- **研究机构**: 原文未提及
- **一句话总结**: 提出RoboArchitect，利用代码大模型自动迭代优化包裹在冻结机器人策略外围的控制代码（harness）并演化出持久记忆，在不更新策略权重的情况下大幅提升机器人在未见场景和任务上的成功率，甚至超越微调后的策略。

**1. 整体逻辑**
- **研究任务**: 自动化设计并优化机器人智能体的控制外壳（agent harness），以适应新任务或新硬件，替代传统的收集数据并微调模型权重的方法。
- **研究动机**: 现有的机器人智能体外壳都是手工设计的，需要大量人工试错；同时，将视觉-语言-动作（VLA）策略微调到新环境需要收集新数据且泛化性差。人工分析长轨迹并修改控制代码效率极低。
- **本质改动**: 将人工设计外壳的“试错-诊断-修改”循环自动化。让代码大模型观察冻结策略的执行轨迹，自动诊断失败原因并迭代修改外壳代码，同时让外壳自主演化出持久记忆来跨任务积累经验。
- **技术溯源**: 基于冻结的VLA策略（如OpenVLA、MolmoAct、$\pi_{0.5}$、X-VLA等），辅助视觉/语言工具（如Grounding-DINO、SAM 3、GraspGen等），以及代码大模型（claude-opus-5）。

**2. 技术拆解**
- **核心方法**: RoboArchitect 框架。初始外壳仅透传冻结VLA策略的动作。随后进入优化循环：在训练episode上运行外壳 -> 记录完整轨迹 -> 代码大模型分析轨迹诊断失败 -> 提出外壳代码修改（如调用辅助工具、直接编程控制机械臂） -> 在训练集上重新评估，仅当性能提升时才接受修改。最多迭代5次。
- **关键细节**: 
  - 输入输出：输入为相机图像、深度图、夹爪位姿/状态、自然语言指令；输出为底层动作向量。
  - 辅助工具：语言模型（Qwen3-30B）、视觉语言模型（Molmo2-8B/Qwen3-VL-8B）、目标检测（Grounding-DINO）、分割（SAM 3）、指向模型、抓取位姿生成（GraspGen）及几何计算工具。
  - 持久记忆：不预设记忆结构，由代码模型在优化过程中自主决定存储内容（如成功的抓取深度比例、抓取姿态、环境重置周期等）及检索方式，记忆跨episode持久化。
  - 规模/超参：最多5次优化迭代，使用claude-opus-5（通过Claude Code客户端，最大努力模式）。
- **训练/优化目标**: 非梯度优化。优化目标是最大化在“训练”episode集上的任务成功率（或VLABench的progress score）。采用经验验证机制，即新候选外壳必须在训练集上的表现严格优于当前外壳才会被接受，保证训练集性能单调递增。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-Pro-10、RoboCerebra、VLABench、RoboCasa-365、SimplerEnv WidowX、SimplerEnv Google。
  - 对比对象（baseline）：1) 裸策略（单独的冻结VLA）；2) 单次生成的外壳（One-Shot）；3) 在目标基准上微调的同一策略（Finetuned）；4) 跨基准和机器人形态的统一外壳（Unified harness）。
  - 测试环境：仿真环境。评估协议分为“未见场景（Unseen scenes，任务同但布局不同）”和“未见任务（Unseen tasks，任务不同但底层技能相似）”。
- **评价指标**: 标准基准指标。VLABench使用官方的progress score（进度得分），其他基准使用平均任务成功率（%）。
- **主要结果**: 
  - 相比裸策略，迭代优化的外壳在未见场景上的平均成功率从9.7%提升至43.3%（提升4.5倍），在未见任务上从12.7%提升至40.2%（提升3.2倍）。
  - 在跨基准和域外（out-of-domain）设置下提升更显著（未见场景提升696%，未见任务提升671%）。
  - 在VLABench和SimplerEnv WidowX（未见场景）上，包裹通用策略的进化外壳甚至超越了在同一基准上微调后的策略权重。
  - 迭代优化（Iterative）显著优于单次生成（One-Shot），且泛化性更好。
  - 统一外壳能在不微调的情况下，让通用X-VLA在多个不同机器人和基准上从零提升到可用水平（平均41.6%），同时保留微调专家的原有能力。
  - 外壳自动演化出了直观的控制策略（如解除机械臂卡死、侧向伸入抓取、调整接触力）和持久记忆（如记录不同物体的有效抓取深度比例），记忆读取的有效率超过90%。

### 3. 🔥 [Nexus-VLA: Bridging Human and Robot Experiences via a Shared Hierarchical Semantic Latent Space] (Nexus-VLA：通过共享的分层语义潜在空间桥接人类与机器人经验)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.42021` | [点击跳转](https://arxiv.org/abs/2610.42021)

**0. 论文标题**
- **英文标题**: Nexus-VLA: Bridging Human and Robot Experiences via a Shared Hierarchical Semantic Latent Space
- **中文标题**: Nexus-VLA：通过共享的分层语义潜在空间桥接人类与机器人经验
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Nexus-VLA 框架，通过构建分层语义潜在空间，在单阶段端到端混合训练中实现人类视频与机器人数据的跨具身多层级语义对齐与直接迁移，显著提升机器人策略的学习效率和泛化能力。

**1. 整体逻辑**
- **研究任务**: 利用大规模第一人称人类视频中的操作经验，学习机器人的连续操作策略。
- **研究动机**: 人类和机器人在视觉外观、运动学结构和动作空间上差异巨大。现有方法通常把“跨具身知识对齐”和“机器人策略学习”解耦成多阶段，或者只对齐单一层级的语义（如只对齐高层任务意图或低层末端轨迹），导致人类视频里的操作知识没法直接、充分地转化为机器人的动作控制。
- **本质改动**: 抛弃多阶段解耦和单一语义对齐，在单阶段端到端混合训练中，把从抽象意图到细粒度物理交互的多层级跨具身共享语义，统一编码到一个紧凑的“分层语义潜在空间”里，直接用来生成连续动作。
- **技术溯源**: 基于视觉语言模型（具体为 Qwen2.5-VL-3B-Instruct）、Flow Matching（流匹配）动作生成架构，以及离线的结构化操作专家（如 Qwen3-VL, SAM 3, CoTracker3, HaMeR 等，仅用于生成训练标签）。

**2. 技术拆解**
- **核心方法**: 
  1. **分层跨具身语义对齐**：定义意图（Intent）、空间（Spatial）、运动（Motion）和交互（Interaction）四个语义层级，利用离线专家为人类和机器人数据生成一致的多层级监督信号。
  2. **共享分层语义潜在空间**：在 VLM 的 token 序列末尾加一个可学习的语义 token，其最终隐藏状态作为语义潜在变量。通过四个轻量级投影头联合预测上述四个层级的语义目标，从而“塑造（shape）”这个潜在表示。推理时不显式生成这些中间语义。
  3. **端到端人机混合训练**：将动作空间拆分为“共享的腕部/末端执行器空间”和“机器人专属关节空间”。人类数据只监督共享空间，机器人数据监督全部空间，通过掩码机制在同一个策略模型里单阶段联合优化。
- **关键细节**: 
  - **输入输出**：输入为视觉观察、语言指令、本体感觉状态和带噪动作序列；输出为条件速度场（用于 Flow Matching）。
  - **模型结构**：VLM 骨干为 Qwen2.5-VL-3B-Instruct（36层 LLM / 32层 ViT），动作头为 32 层 Flow-Matching DiT。
  - **规模与超参**：全局 batch size 512，学习率 3e-5，训练 200K 步。人机采样比例固定为 1:2。动作 horizon 为 16。
- **训练/优化目标**: 
  - 联合损失函数：$\mathcal{L}_{joint} = \mathcal{L}_{FM} + \lambda_{sem} \mathcal{L}_{sem}$。
  - $\mathcal{L}_{FM}$ 是带掩码的 Flow Matching 损失，仅计算有效动作维度。
  - $\mathcal{L}_{sem}$ 是多层级语义塑造损失，包含意图的自回归交叉熵、空间的 SmoothL1+GIoU 及可见性 BCE、运动的 SmoothL1 及可见性 BCE、交互的 SmoothL1 及存在性 BCE。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真基准 RoboCasa-GR1（24个人形机器人任务，2.4万条机器人轨迹），人类视频数据集 EgoDex（2.1万条过滤后的第一人称抓取放置视频）。
  - **对比对象**：基础 VLA（GR00T-N1.6, ABot-M0），语义增强 VLA（VP-VLA, IntentVLA, ZR-0），利用人类经验的方法（DyPES-VLA, JoyAI-RA 0.1, ACE-Ego-0）。真实世界还对比了 $\pi_{0.5}$。
  - **测试环境**：RoboCasa-GR1 仿真（包含标准分布和 6 种 OOD 设置：光照、视觉噪声、新空间配置、新物体-容器组合、仅人类数据见过的物体、完全未见物体），以及真实机器人平台（包含 4 种 OOD 设置）。
- **评价指标**: 任务成功率（Task success rate, %），以及跨具身语义检索的 R@1, P@5, mAP。
- **主要结果**: 
  - **仿真标准设置**：在 RoboCasa-GR1 上平均成功率达 80.5%，比最强 baseline ACE-Ego-0（72.8%）高 7.7%。
  - **仿真 OOD 设置**：6 种 OOD 平均成功率 68.9%，比 Baseline（48.2%）高 20.7%。在“仅人类数据见过的物体”上达 69.4%（比 Baseline 高 28.6%），证明人类经验能有效补充机器人未见物体。
  - **真实世界**：标准设置成功率 82.0%，4 种 OOD 平均 74.0%，比 Baseline（52.0%）高 22.0%。在“未见物体”任务上达 72.7%，比纯机器人 Baseline（47.0%）高 25.7%。
  - **消融与效率**：统一语义潜在空间比独立潜在空间好（78.25% vs 76.92%）；加入人机混合训练进一步提升至 80.17%。在 60K 步时（73.58%）即超越纯机器人 Baseline 在 100K 步的峰值（72.92%），训练效率提升约 40%。

### 4. 🔥 [Movens-Zero: Scaling Humanoid Motion Foundation Models with Large-Scale Human Videos] (Movens-Zero：利用大规模人类视频扩展人形运动基础模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41877` | [点击跳转](https://arxiv.org/abs/2610.41877)

**0. 论文标题**
- **英文标题**: Movens-Zero: Scaling Humanoid Motion Foundation Models with Large-Scale Human Videos
- **中文标题**: Movens-Zero：利用大规模人类视频扩展人形运动基础模型
- **研究机构**: 原文未提及
- **一句话总结**: 构建了经过物理验证的大规模多模态人形运动数据集 Movens-5M 和统一评估基准 Movens-Intent，并提出支持多模态输入和实时闭环执行的人形运动基础模型 Movens-Zero，验证了数据与模型规模扩展对多模态生成及物理执行能力的显著提升。

**1. 整体逻辑**
- **研究任务**: 根据文本、语音、音乐、视频等多模态输入，生成语义对齐且物理可执行的人形机器人（Unitree G1）全身运动，并支持实时闭环控制。
- **研究动机**: 现有人形运动模型受限于缺乏多样化且机器人可执行的数据；难以从异构多模态输入中联合学习；现有评估通常孤立研究单一模态，缺乏统一基准，难以区分模型的通用意图理解能力和特定评估栈带来的性能差异。
- **本质改动**: 摒弃了单一模态或纯运动学生成的思路，通过构建包含物理精炼和执行验证的大规模多模态数据集，训练一个统一的动作专家（Action Expert）来联合处理所有模态，并引入实时分块机制实现连续闭环控制。
- **技术溯源**: 基于 Transformer/DiT 架构、Flow-matching（流匹配）生成范式，底层执行和评估依赖 HoloMotion、SONIC 控制器，以及 OMG、GVHMR 等现有基准协议。

**2. 技术拆解**
- **核心方法**: 
  1. **构建 Movens-5M 数据集**：从互联网视频提取，经过片段生成、质量过滤、语义标注、运动恢复，并进行物理精炼（人形重定向和闭环执行验证），得到 500 万物理可执行的人形运动序列。
  2. **提出 Movens-Zero 架构**：包含共享的多模态上下文编码器和基于 DiT 的动作专家。采用任务混合的流匹配训练，让单个动作专家同时处理 7 个生成任务。
  3. **实时闭环机制**：Multimodal Real-Time Chunking，在连续更新的指令和机器人状态下，连接重叠的动作块（chunks）以实现连续执行。
  4. **提出 Movens-Intent 基准**：包含文本、语音、音乐、视频四个赛道，共 8192 个专家验证的条件-运动对，统一使用 Unitree G1 表示。
- **关键细节**: 
  - **数据规模**：Movens-5M 包含 1500 万人体运动序列和 500 万物理可执行人形序列，跨度超 10,000 小时。
  - **模型规模**：动作专家（Action Expert）分为 S (64M), M (188M), L (500M), XL (911M) 四个规模。
  - **机器人表示**：Unitree G1，每帧 40 个通道（29 个绝对关节角，2 个平面根位移，6 个根方向，1 个高度，2 个脚部接触状态）。
- **训练/优化目标**: 任务混合的流匹配（Task-mixed flow-matching）损失函数，联合优化单一动作专家，使其同时拟合文本、语音、音乐、视频条件下的运动生成。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：OMG, EMDB, RICH, 以及新提出的 Movens-Intent。
  - **Baseline**：文本/语音/音乐赛道对比 GENMO, HY-Motion, TextOp, Kimodo 变体, OMG-L/XL, LODGE, Bailando 等；视频赛道对比 GENMO, WHAM, TRAM, GVHMR, PromptHMR, OnlineHMR 等。
- **评价指标**: 
  - **生成质量**：文本（FID, Matching Score, R@K, Diversity），视频（WA-MPJPE, W-MPJPE, RTE, Jitter, Foot-Sliding），音频/音乐（BeatAlign, FID-k, FID-g, PFC）。
  - **物理执行与跟踪**：C-Slide（接触滑动）, Jerk（加加速度）, MPJPE, Fall rate（跌倒率）, J-Limit（关节超限率）, Tracking Score。
- **主要结果**: 
  - **多模态生成与执行 SOTA**：在 OMG 和 Movens-Intent 上，Movens-Zero 在绝大多数指标上优于 Baseline。例如在 OMG 文本赛道，FID 降低 59%（从 24.68 降至 10.13），R@3 提升 27.35 个百分点（至 85.06%），跌倒率降至 0.29%；在视频赛道，RICH 数据集上的 WA-MPJPE100 和 W-MPJPE100 均取得最优，且物理执行更稳定。
  - **Scaling Law 验证**：随着执行验证数据从 1% 扩展到 100%，以及动作专家参数从 64M 扩展到 911M，所有模态的生成和跟踪指标均呈现单调、可预测的提升（如 Text R@3 从 12.72% 提升至 62.57%，Video MPJPE 降低 69.2%）。
  - **数据质量与跨模态监督**：消融实验表明，数据流水线中的物理精炼和执行验证步骤对提升跟踪分数至关重要；同时，联合多模态对齐训练（去掉某一模态训练会导致其他模态性能下降）能提升整体生成效果，证明了跨模态监督的有效性。

### 5. 🔥 [META-Robot: Self-Cognition and Capability Scaling in Agentic Robots] (META-Robot：具身智能体中的自我认知与能力扩展)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41868` | [点击跳转](https://arxiv.org/abs/2610.41868)

**0. 论文标题**
- **英文标题**: META-Robot: Self-Cognition and Capability Scaling in Agentic Robots
- **中文标题**: META-Robot：具身智能体中的自我认知与能力扩展
- **研究机构**: 原文未提及
- **一句话总结**: 提出 META-Robot 框架，通过引入动作级谓词和耦合的技能-谓词库，并结合本体感觉信号编排，让机器人智能体在闭环执行中实现自我认知与能力的持续扩展。

**1. 整体逻辑**
- **研究任务**: 提升基于大语言模型（LLM）的机器人智能体系统在面对新任务时的泛化能力、故障恢复能力，以及系统级的自我认知与能力扩展。
- **研究动机**: 现有智能体系统高度依赖预定义的脚手架（scaffolding）。仅仅扩充技能库无法让系统评估新能力或识别自身的能力边界。当遇到超出预设机制的失败时，系统缺乏对自身任务和能力的显式认知，导致无法进行有效的元级别泛化和可靠的错误恢复。
- **本质改动**: 将“动作级谓词（action-level predicates）”与“技能库”显式耦合，并引入本体感觉信号作为物理证据。这使得智能体不仅能扩展执行技能，还能同步扩展评估这些技能的验证标准和感知通道，实现认知与能力的联合扩展。
- **技术溯源**: 基于神经符号谓词（NSPs）、代码即策略（Code-as-Policy）范式，以及现有的技能扩展智能体（如 ASPIRE, Playful 等）。底层驱动模型使用了 GPT-6 Astra、DeepSeek-V4-Flash（仿真环境）和 GPT-5.6-sol（真机环境）。

**2. 技术拆解**
- **核心方法**: 
  1. **闭环执行智能体（Loop Execution Agent）**：通过动作级谓词的状态转换来评估每次技能执行的结果。失败时触发有界的局部修复；若无法解决，则利用全局谓词轨迹进行系统级修复和全任务重执行。
  2. **耦合的谓词与技能库（Coupled Predicate and Skill Libraries）**：技能库以树状层级结构存储可复用的执行知识，谓词库存储对应的验证条件。两者通过显式关联和父子层级进行耦合，支持知识的增量合并、去重与检索。
  3. **本体感觉信号编排机制（Proprioceptive Signal Orchestration）**：当视觉信息不足时，自动识别并利用关节状态、电机电流、力/扭矩等本体感觉信号，将其转化为动作级谓词的物理证据，辅助执行与验证。
- **关键细节**: 
  - **输入输出**：输入为自然语言任务描述、机器人视觉及本体感觉观测；输出为可执行的 Python 控制程序及对应的动作级谓词。
  - **系统架构**：技能被形式化为包含失败特征、适用条件、意图、修复机制等属性的节点，谓词与技能通过映射关系关联。系统通过记录执行前后的谓词状态（$z^-$ 和 $z^+$）来捕捉技能调用的实际物理效果。
  - **规模/超参**：原文未提及具体模型参数量，提及了局部修复的有界循环（bounded local repair loop）机制。
- **训练/优化目标**: 本文是非参数微调的系统工程与方法创新工作。核心机制是基于 LLM 的代码生成、基于谓词状态转换的闭环评估与修复，以及基于验证通过的经验对技能库和谓词库进行增量式蒸馏与合并。

**3. 实验结果**
- **实验设置**: 
  - **仿真环境**：使用 LIBERO-Pro 数据集（包含 Object, Goal, Spatial 任务套件）。对比基线包括 OpenVLA, $\pi_0$, $\pi_{0.5}$, CaP-Agent0, ASPIRE, Playful/RATS。
  - **真机环境**：使用 Galaxea R1 Lite 机器人平台。任务涵盖基础抓取放置、顺序多物体操作、指令跟随、精确插头插入、薄毛巾折叠、早餐物品堆叠，以及利用关节扭矩区分不同水量的不透明水瓶。
- **评价指标**: 任务成功率（Success Rate）。
- **主要结果**: 
  - **仿真表现**：在 LIBERO-Pro Spatial-Task 上，META-Robot (GPT-6) 成功率达 95.8%，远超 ASPIRE 的 60.0%。在 Goal-Task 上，GPT-6 和 DeepSeek-V4-Flash 分别达到 69.8% 和 64.6%（ASPIRE 为 45.0%）。Object 任务上成功率也高达 99.0% 和 99.6%。
  - **真机表现**：7个任务共56次试验，总成功率 78.6%。其中网球抓取、指令杯子堆叠、重量比较达 100%；毛巾折叠和早餐准备达 62.5%（消融实验显示，无本体感觉反馈时这两项成功率为 0%）；精确插头插入为 37.5%。
  - **零样本迁移**：在 LIBERO-Pro Long 上，保留 25%-100% 的技能/谓词库，成功率在 0% 到 40.2% 之间。证明积累的知识支持部分零样本迁移，但并非库越大越好，迁移效果取决于保留的知识是否覆盖了目标任务的所需条件。
  - **消融实验**：移除动作级谓词后，各任务成功率显著下降（如 Spatial-Task 从 95.8% 降至 76.0%）；在仿真抓取薄刚性物体任务中，加入本体感觉信号使成功率从 50% 提升至 78%。

### 6. 🔥 [VLA Policies Do Not Know When Not to Act: Unintended Task Execution and Start Suppression] (视觉-语言-动作策略不知道何时不该行动：非预期任务执行与启动抑制)
- **研究机构**: `原文未提及具体机构名称（由韩国政府MSIT下属的IITP、NST、NRF等基金资助）`
- **Arxiv ID**: `2610.41609` | [点击跳转](https://arxiv.org/abs/2610.41609)

**0. 论文标题**
- **英文标题**: VLA Policies Do Not Know When Not to Act: Unintended Task Execution and Start Suppression
- **中文标题**: 视觉-语言-动作策略不知道何时不该行动：非预期任务执行与启动抑制
- **研究机构**: 原文未提及具体机构名称（由韩国政府MSIT下属的IITP、NST、NRF等基金资助）
- **一句话总结**: 揭示了当前主流VLA模型在缺失或无效指令下仍会盲目启动并执行非预期任务的安全隐患，并证明现有的三种启动抑制机制均无法让模型真正具备“判断是否该行动”的能力。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作（VLA）策略在缺失、无意义或不可执行指令下的行为表现（是否会盲目启动、执行什么任务），并测试启动抑制（start suppression）机制的有效性。
- **研究动机**: 现有的VLA模型训练数据通常去除了静止（no-op）步骤，导致模型没有“保持静止”的概念。当输入空指令、乱码或不可执行指令时，模型不会停下来，而是盲目执行场景中的默认任务，这在人机协作中会带来严重的安全风险。
- **本质改动**: 不再用单一的“任务成功率”掩盖模型盲目行动的问题，而是将“是否启动”与“执行何种任务”解耦评估，提出严格的配对协议，并摸清了现有启动抑制机制的失效边界。
- **技术溯源**: 基于 LIBERO-Goal 仿真环境，测试了五个模型家族的六个开源/微调 VLA 检查点（GR00T N1.7, $\pi_{0.5}$, SmolVLA, Fast-WAM, Evo-1）。

**2. 技术拆解**
- **核心方法**: 
  1. **配对评估协议**：固定初始状态和随机种子，仅改变指令（空、中性、无意义、缺失物体、不可能动作等），严格区分“未启动（位移<5cm且无接触）”、“无接触运动”、“尝试（有接触未完成）”和“完成”四种状态。
  2. **测试三种启动抑制机制**：
     - **指令前缀（Prefix）**：在指令前加“如果没有任务就不要动”。
     - **动作差异门控（Gate）**：对比给定指令和空指令的首个动作块（action chunk）差异，若小于基于采样噪声设定的阈值则强制保持静止。
     - **无动作微调（No-action fine-tuning）**：在微调数据中以15%概率将指令替换为空/中性/乱码，并将动作标签设为保持静止。
- **关键细节**: 
  - **环境**：LIBERO-Goal（10个任务，1个厨房布局，200个固定初始状态）。
  - **门控阈值（$\tau$）**：通过计算同一指令在不同噪声种子下的动作块L2距离分布的95分位数来设定，以区分“指令改变”和“采样噪声”。
  - **微调规模**：GR00T N1.7 在200个demo上微调5000步，batch size 32，学习率 1e-4。
- **训练/优化目标**: 
  - **基础VLA**：语言条件行为克隆（Language-conditioned behavior cloning）。
  - **无动作微调**：在原有行为克隆基础上，对非任务输入增加“保持静止（零末端执行器位移，保持夹爪状态）”的回归目标。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Goal。
  - **对比对象（Baseline/检查点）**：GR00T N1.7 (official & ft), $\pi_{0.5}$, SmolVLA, Fast-WAM, Evo-1。
  - **对比机制**：无机制（None）、指令前缀（Prefix）、动作差异门控（Gate）、无动作微调（Fine-tuned）。
- **评价指标**: 
  - **未启动率（Non-start rate）**：末端位移<5cm且无接触、无完成（衡量启动抑制效果）。
  - **任意任务完成率（Any-task completion rate）**：衡量非预期动作的发生率。
  - **指定任务成功率（Designated-task success）**：标准 LIBERO 成功率指标。
- **主要结果**: 
  - **盲目启动问题严重**：在空指令下，6个模型100%都会启动（未启动率均为0.0%）。其中5个模型会高概率（30.5%–94.0%）完成场景中的某个非预期任务。
  - **指令只决定“做什么”，不决定“做不做”**：即使输入不可执行指令（如“吃掉奶油奶酪”），模型依然会启动并执行其他任务（在GR00T上完成率高达61.0%–73.0%）。
  - **抑制机制均存在失效边界**：
    - **前缀提示**：完全无效，甚至导致部分模型成功率下降或执行更多非预期任务。
    - **动作门控**：在5/6个模型上有效抑制了空/乱码指令的启动，但在 $\pi_{0.5}$ 上失效（噪声分布重叠），且无法阻止不可执行指令的启动。
    - **无动作微调**：能避免接触和完成任务，但无法可靠保持静止（手臂会漂移>5cm），且对“不可执行指令”完全无效。
  - **核心结论**：现有VLA缺乏对“是否该行动”的显式表征，依靠外部提示、门控或简单微调无法从根本上解决“不知何时不该行动”的安全问题。

### 7. 🔥 [Cross-Embodiment Motion Planning by Coupling Body-Agnostic World Model with Differentiable Ego-Dynamics] (通过耦合与身体无关的世界模型和可微自我动力学实现跨具身运动规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41330` | [点击跳转](https://arxiv.org/abs/2610.41330)

**0. 论文标题**
- **英文标题**: Cross-Embodiment Motion Planning by Coupling Body-Agnostic World Model with Differentiable Ego-Dynamics
- **中文标题**: 通过耦合与身体无关的世界模型和可微自我动力学实现跨具身运动规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Hourglass 架构，将跨具身运动规划在“相机自我运动”处解耦为通用世界模型和可微动力学模板，在此接口训练参数条件化的通用策略，实现无需针对单一机器人训练即可跨具身泛化及零样本真机部署。

**1. 整体逻辑**
- **研究任务**: 机器人在杂乱环境中的跨具身局部运动规划（生成速度命令以避障并到达目标）。
- **研究动机**: 现有跨具身策略要么忽略机器人动力学差异，要么需要为每个机器人单独训练或蒸馏；现有的世界模型要么绑定单一动作空间（需针对每个机器人重训），要么丢失了命令到运动的映射（导致策略对动力学无感知），环境表示与具身特性严重纠缠。
- **本质改动**: 在平地假设下，将环境表示与具身特性在“相机自我运动（ego-motion）”处解耦。构建一个只依赖 ego-motion 的通用世界模型，并通过可微的降阶动力学模板将命令映射到 ego-motion，在这个唯一的接口处训练参数条件化的通用策略。
- **技术溯源**: 基于循环状态空间模型（RSSM，如 Dreamer 系列中的世界模型结构）、模型预测路径积分（MPPI）采样规划器，以及模仿学习/行为克隆初始化。

**2. 技术拆解**
- **核心方法**: Hourglass 架构，包含三个核心模块：1) 仅以 ego-motion 和相机参数为条件的 Body-Agnostic World Model；2) 包含物理参数（速度/加速度限制、响应时间常数、步频、 footprint）的可微降阶动力学模板（Differentiable Ego-Dynamics）；3) 在两者耦合的潜在想象空间中，通过解析梯度训练的 θ-条件化通用策略。
- **关键细节**: 
  - **输入输出**: 输入深度图像、ego-motion 估计、目标点；输出机体坐标系下的速度命令（线速度和角速度）。
  - **模型结构**: World Model 包含确定性循环状态、随机隐变量和以自我为中心的 Spatial Memory（48×48×8 网格）；策略网络输出多个命令模式（modes）及 critic 头，通过 relaxed WTA 机制选择最优模式。
  - **规模/超参**: 决策间隔 0.2s，规划 horizon 5s，模板子步数 4，深度图像分辨率 144×256。
- **训练/优化目标**: 
  - **World Model 目标**: 深度重建、可选语义目标、KL 散度、开环先验 roll-out 的 latent overshooting，以及基于空间记忆的净空（clearance）预测。
  - **策略优化目标**: 最小化规划代价（包含碰撞惩罚、进度奖励、航向对齐、目标到达、路线遵循和命令平滑度）。通过解析梯度（analytic gradient）在 template 和 world model 之间反向传播，使策略感知具身动力学。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: 无公开数据集名称，使用合成数据（基于包含办公室、实验室和仓库的 39.7×30.6m 室内场景，通过无机器人的虚拟相机 rig 渲染深度序列）。测试环境分为 B1（固定布局）和 B2（随机添加箱子的密集杂乱布局）。
  - **对比对象（baseline）**: BC-θ（行为克隆）、DP-θ（Diffusion Policy）、DWA-θ（动态窗口法）、MPPI-θ（采样规划器）、RL（强化学习 baseline）、Privileged MPPI（带全局地图的 MPPI）。
  - **测试对象**: 7 个训练机器人（5 种运动类型：轮式、四足、人形、轮腿、双足轮腿），2 个未见过的仿真机器人，1 个未见过的真实机器人（Scout Mini）。
- **评价指标**: 成功率（SR）、碰撞率（Coll.）、成功路径长度加权（SPL）、成功 episode 的平均耗时（Time）。
- **主要结果**: 
  - 在 7 个训练机器人上，Hourglass 的平均 SR 在 B2 上达到 81.8%，显著优于 BC-θ（71.2%）和 DP-θ（75.5%），略低于 MPPI-θ（83.2%），但取得了最高的 SPL 和最短的耗时，路径更直接。
  - 零样本迁移：在 2 个未见过的仿真机器人上直接部署（仅需识别参数）；在真实 Scout Mini 机器人上，仅需 3 分钟遥操作识别参数，即可零样本迁移到未见过的室内场景并成功导航，无需重新训练世界模型。

### 8. 🔥 [TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents] (TinyAstral：将自我演化的Harness迁移到小型通用操作智能体)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41216` | [点击跳转](https://arxiv.org/abs/2610.41216)

**0. 论文标题**
- **英文标题**: TinyAstral: Transferring Self-Evolving Harnesses to Tiny Generalist Manipulation Agents
- **中文标题**: TinyAstral：将自我演化的Harness迁移到小型通用操作智能体
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能/机器人操作领域的系统工程与方法创新，核心贡献是提出一种两阶段方法：先通过统计检验驱动的递归自我改进（RSI）自动演化冻结大模型的Agent Harness（外挂工具链与逻辑），再将演化后的系统与推理轨迹蒸馏给小模型，从而在保持高性能的同时大幅降低推理计算成本。

**1. 整体逻辑**
- **研究任务**: 提升基于视觉语言模型（VLM）的机器人操作Agent的性能，同时大幅降低推理时的计算成本。
- **研究动机**: VLM Agent的性能不仅取决于规划模型本身，还高度依赖其周围的Harness（工具接口、反馈、记忆和恢复逻辑）。现有方法要么只改模型权重，要么只改Harness，且大模型推理成本太高。业界需要一种方法，能把大模型Harness的改进低成本地转移到小模型上。
- **本质改动**: 将“Harness演化”与“Agent蒸馏”结合：先冻结大模型权重，用LLM Master通过统计检验自动演化其Harness；然后冻结最终Harness，收集大模型的推理和故障恢复轨迹，蒸馏训练一个小模型来替换大模型。
- **技术溯源**: 基于开源大模型 Qwen3.8-Flash-Next (Teacher) 和 Qwen3.5-4B (Student)；使用的机器人操作基准包括 RoboTwin, Guava, LIBERO-PRO, SimplerEnv, VLABench, EB-Manipulation。

**2. 技术拆解**
- **核心方法**: 
  1. **阶段一（Harness演化）**：冻结Teacher模型，由前沿LLM组成的Master读取失败轨迹，提出Harness修改（如新工具、感知修复、任务记忆等），并通过预注册的配对统计检验（paired statistical tests）决定是否接受修改。
  2. **阶段二（蒸馏）**：冻结最终演化好的Harness，收集Teacher的推理和故障恢复轨迹，混合离线真实机器人数据，微调训练小模型（Student）。部署时，Student在同一个冻结Harness中替换Teacher。
- **关键细节**: 
  - Harness包含感知（SAM 3分割转点云）、抓取/放置几何、无碰撞运动规划和闭环校正。
  - 演化时，Master提出修改必须通用，不能针对特定任务名分支；每次修改需通过触发器记录，且未触发时行为与父代完全一致。
  - 蒸馏数据包含：Teacher的推理链（`<think>...</think>`）、注入扰动生成的故障恢复分支、仅保留严格成功（Strict Success）的轨迹，以及转换为Harness格式的离线真实机器人数据。
  - 模型规模：Student包括0.8B, 2B, 4B版本，主要评估基于Qwen3.5-4B微调的4B版本。
- **训练/优化目标**: 
  - **阶段一**：通过配对统计检验（如单侧97.5%下界为正，且非目标集无显著退化）来优化Harness的严格成功率。
  - **阶段二**：标准的自回归语言模型损失（Next-token prediction），仅对最终assistant turn计算loss，监督目标是Teacher的推理过程加上一步工具调用。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 RoboTwin, Guava, LIBERO-PRO 上训练/开发，在 SimplerEnv, VLABench, EB-Manipulation 上测试零样本泛化。对比对象包括开源Agent（Guava-4B, PyRUA-Lean-4B, SenseNova-RoboRSI-27B），以及使用相同Teacher模型但放在其他竞品Harness（MotorMind, PyRUA-Lean, Guava harness）中的系统。
- **评价指标**: 严格成功率（Strict Success，需Agent主动调用done且最终状态满足谓词）；零样本基准使用官方指标；推理计算成本（加速器数量 × 中位数单集时长，即 Accel·s）。
- **主要结果**: 
  - **Harness演化有效**：演化使冻结Teacher在RoboTwin上的成功率从33.4%提升至63.6%。
  - **蒸馏效果好**：TinyAstral-4B在RoboTwin上达到62.8%，接近Teacher，且远超未训练的4B模型（41.2%）。
  - **超越竞品**：在相同测试集上，TinyAstral-4B超越了所有测试的开源Agent，以及Teacher模型在其他竞品Harness中的表现（如Guava上93.6% vs 78.9%）。
  - **泛化能力强**：在三个未见过的零样本基准上，4B学生模型的表现接近552B的DeepSeek-V4.1-Flash（差距在2.4pp以内）。
  - **推理成本低**：TinyAstral-4B单卡bf16部署，每个episode的加速器耗时约为Teacher（4卡FP8+推测解码）的1/5（25.3 vs 123.8 Accel·s）。

### 9. 🔥 [WorldBridge: Bridging Video and Action for Task Generalization in World Action Models] (WorldBridge：在世界动作模型中桥接视频与动作以实现任务泛化)
- **研究机构**: `京东（根据通讯作者邮箱推断）`
- **Arxiv ID**: `2610.40748` | [点击跳转](https://arxiv.org/abs/2610.40748)

**0. 论文标题**
- **英文标题**: WorldBridge: Bridging Video and Action for Task Generalization in World Action Models
- **中文标题**: WorldBridge：在世界动作模型中桥接视频与动作以实现任务泛化
- **研究机构**: 京东（根据通讯作者邮箱推断）
- **一句话总结**: 提出了一种结合视频预测与动作生成的世界动作模型（WAM）WorldBridge，通过统一数据管线和联合流匹配训练，在缺乏新任务动作标签的情况下实现了显著的具身任务泛化。

**1. 整体逻辑**
- **研究任务**: 解决具身智能中的广泛任务泛化（Task Generalization）问题，即让机器人在缺乏新任务动作示范的情况下，理解指令并执行新任务。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型在遇到训练分布外（OOD）的新任务时，由于缺乏物理交互的动作标签，难以将语义理解转化为可执行的控制。视频数据能提供密集的物理演变监督，但如何建立从“视频预测”到“动作生成”的有效桥接（即逆动力学能力）是核心瓶颈。
- **本质改动**: 将任务泛化拆解为“视频泛化”和“动作泛化”，通过解耦的视频和动作专家（MoT架构）以及联合流匹配训练，让模型先预测视觉未来，再据此生成动作；同时设计了一套统一的数据管线，将异构的机器人和人类第一人称数据对齐到同一动作空间。
- **技术溯源**: 基于 Mixture-of-Transformers (MoT) 架构、Flow Matching（流匹配）、Causal Video VAE 和 T5 文本编码器。

**2. 技术拆解**
- **核心方法**: 
  1. 提出 WorldBridge 模型，采用 MoT 架构包含独立的视频专家和动作专家，通过结构化注意力掩码强制信息从“历史/当前观测 -> 未来视频 -> 动作”单向流动。
  2. 设计统一数据管线，将不同形态的机器人轨迹和人类第一人称（Ego）手部数据标准化为共享的46维动作空间，利用维度掩码处理缺失数据。
- **关键细节**: 
  - **模型结构**：视频专家通过交叉注意力融合语言特征，两个专家通过联合自注意力交互。引入短期和长期视觉记忆（通过 Causal Video VAE 编码）以提供时序上下文。
  - **动作强迫（Action Forcing）**：训练时，为动作 chunk 内的不同动作 token 独立采样不同的噪声水平，迫使动作专家在部分动作被严重加噪时，更多地依赖上下文视觉信息来预测。
  - **统一动作空间**：46维表示（14D手臂关节，14D末端位姿，2D夹爪，12D灵巧手，4D腰部），使用 EEF-Relative 表示法，并通过维度有效性掩码（Validity Masks）兼容不同机体。
  - **数据规模**：清洗并融合了约 338 万条 episode（超 2.2 万小时），包含 8 个机器人数据集和 7 个 Ego 数据集。
- **训练/优化目标**: 采用联合流匹配（Joint Flow Matching）损失，独立采样视频和动作的流时间步。预训练阶段使用全连接视频掩码（视频不看动作，动作看所有），后训练（Post-training）阶段切换为结构化掩码，显式引导动作条件化于预测的未来视频特征。

**3. 实验结果**
- **实验设置**: 
  - **任务泛化分析**：在 RoboTwin 2.0 上控制 OOD 视频和动作标签的注入量。
  - **仿真基准**：RoboTwin 2.0 (Full 和 Clean2Random), RoboCasa GR1 TableTop, RMBench, DOMINO Level-1, SimplerEnv-WidowX, RoboDojo。
  - **真实机器人**：AgiBot G2 和 ARX AC-1 平台，评估 6 个复杂操作任务（如插花、扫描饮料、拆乐高、装书等）。
  - **对比对象（Baseline）**：π0, π0.5, OpenVLA, X-VLA, StarVLA, Fast-WAM, LingBot-VA 等。
- **评价指标**: 任务成功率（Success Rate, SR）、RoboDojo 综合得分（Score）、DOMINO 操作分数（MS）、推理延迟（Latency）。
- **主要结果**: 
  - **泛化机制验证**：在 RoboTwin 2.0 上，仅用分布内（ID）数据时 OOD 成功率仅 25.07%；加入 OOD 视频（无动作标签）提升至 55.90%；每个 OOD 任务仅加 1 个动作标签即提升至 70.70%。证明视频覆盖能拓宽泛化边界，而极少量的动作监督就能有效强化“视频到动作”的桥接。
  - **仿真基准 SOTA**：RoboTwin 2.0 Full 平均 96.23%，Clean2Random 80.9%；RoboCasa GR1 82.8%；RMBench 83.0%；DOMINO Level-1 57.6%（超第二名 19.4%）；SimplerEnv-WidowX 84.4%；RoboDojo Score 26.03。全面领先对比方法。
  - **真机部署**：在 G2 和 AC-1 上平均成功率达 72.5%，显著优于 π0.5 (57.5%)。在强依赖记忆的任务（如扫描饮料）中优势极大（65% vs π0.5 的 5%）。
  - **推理加速**：通过解耦视频/动作去噪步数、算子融合及 CUDA Graph 重放，单次推理延迟从 957.2ms 降至 103.9ms（加速 9.21 倍），支持约 7Hz 的真机控制频率。

### 10. 🔥 [CausalWAM: Learning the Causes of Actions in World Action Models] (CausalWAM：在世界动作模型中学习动作的成因)
- **研究机构**: `NVIDIA`
- **Arxiv ID**: `2610.42096` | [点击跳转](https://arxiv.org/abs/2610.42096)

**0. 论文标题**
- **英文标题**: CausalWAM: Learning the Causes of Actions in World Action Models
- **中文标题**: CausalWAM：在世界动作模型中学习动作的成因
- **研究机构**: NVIDIA
- **一句话总结**: 通过在动作生成端引入稀疏路由约束，从纯观测数据中分离出真正导致动作的潜在变量（剔除背景等干扰变量），在理论上证明了动作成因的可识别性，并显著提升了机器人的闭环控制成功率。

**1. 整体逻辑**
- **研究任务**: 从视觉观测和动作演示数据中，学习世界动作模型（WAMs）的潜在状态，并准确提取出真正导致动作发生的潜在变量（action-relevant latent variables），剔除仅用于场景预测的干扰变量（nuisance variables，如背景、桌布等）。
- **研究动机**: 现有的 WAMs（如 Cosmos 3）在拟合演示数据时，潜在变量会混合动作相关变量和干扰变量。模型可能仅仅通过纠缠这些变量来模仿动作，导致动作头依赖于无关的干扰变量。现有的非线性独立成分分析（ICA）方法通常需要时间依赖假设、外部干预或特定标签，这在复杂的机器人真实场景中难以满足。
- **本质改动**: 放弃对全量潜在变量的恢复，转而在动作生成端引入“支持稀疏性（support sparsity）”约束。通过限制动作机制对潜在变量的依赖数量，在不依赖时间结构或干预的情况下，纯靠观测数据就能将动作相关的潜在变量块与干扰变量分离开来。
- **技术溯源**: 基于 NVIDIA 的 Cosmos 3 (Cosmos 3 Nano) 世界动作模型基座，结合了非线性独立成分分析（ICA）和因果表征学习的理论。

**2. 技术拆解**
- **核心方法**: 提出 CausalWAM (CWAM)。在预训练的 WAM 基础上，在视觉/任务 token 到动作头之间增加一条稀疏路由路径（sparse routing path）。通过施加 token 级别的稀疏正则化，强制动作查询（action queries）仅关注最相关的少量上下文 token（即紧凑状态 $C_t$），而保持世界建模（视频预测）的密集路径不变。
- **关键细节**: 
  - **输入输出**: 输入为视觉观测和任务指令，输出为未来视频帧和动作块（action chunk）。
  - **模型结构**: 基于 Cosmos 3 Nano（包含 Qwen3-VL-8B-Instruct 推理器和 MoT 生成器）。在生成器塔后增加一个 relation-aware attention 路由器，包含位置、模态和块进度的偏置。
  - **规模与超参**: 路由器维度 $d_r=512$，8 个注意力头，top-k 路由支持 $k=32$。稀疏损失权重 $\lambda=0.01$，在 1000 步后激活并线性退火。
- **训练/优化目标**: 
  - 总损失 $\mathcal{L}_{total} = \mathcal{L}_{WAM} + \mathcal{L}_{sparse}$。
  - $\mathcal{L}_{WAM}$ 是 Cosmos 3 原有的联合 rectified-flow 损失（用于去噪未来视频 token 和动作块），保持不变。
  - $\mathcal{L}_{sparse}$ 是 token 级别的稀疏代理损失，鼓励路由器将注意力质量集中在 top-k 个干净上下文 token 上，以此作为理论中“最小化动作机制对潜在坐标依赖支持集大小”的代理优化目标。

**3. 实验结果**
- **实验设置**: 
  - **合成数据**: 20 维潜在变量（4 维动作相关，16 维干扰），带有隐藏环境变化。Baseline 包括 Dense readout, Random matched, CWAM without sparsity, Standard MLP VAE。
  - **仿真机器人**: RoboCasa365 (17 个任务), LIBERO (40 个任务)。Baseline 为未加路由器和稀疏损失的 Cosmos 3。
  - **真机**: Franka 机器人堆叠方块任务。
- **评价指标**: 
  - 合成数据：动作相关潜在变量的线性探测 $R^2$，以及干扰变量的超额解释率 $\Delta_{nuis}$。
  - 机器人任务：闭环控制成功率（Closed-loop success rate）。
- **主要结果**: 
  - **合成数据验证**: CWAM (with sparsity) 选出的 4 个坐标能以极高的 $R^2$ (0.9957) 解码动作相关变量，且对干扰变量的超额解释率接近 0 (0.039)，验证了理论（成功分离动作成因）。
  - **仿真机器人提升**: 在 RoboCasa365 上，CWAM 的平均成功率从 baseline 的 0.24 提升至 0.43（几乎翻倍）；在 LIBERO 的所有 suite 中均优于 baseline。
  - **真机表现**: CWAM 在 50 次试验中成功率显著高于 baseline（CWAM 在多数试验中成功，而 baseline 成功率不到一半）。
  - **路由可视化与消融**: 路由权重主要集中在被操作物体及其目标上。在表现最好的 4 个 RoboCasa365 任务中，仅保留路由 token (C-only) 仍能保持 60.3% 的平均成功率，而随机保留同等数量 token 则降至 24.5%，证明路由 token 确实包含了执行动作所需的核心视觉信息。

### 11. 🔥 [SACQ: Structure-Aware Codebook Quantization for Ultra-Low-Bit Vision-Language-Action Models] (SACQ：面向超低比特视觉-语言-动作模型的结构感知码本量化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.41408` | [点击跳转](https://arxiv.org/abs/2610.41408)

**0. 论文标题**
- **英文标题**: SACQ: Structure-Aware Codebook Quantization for Ultra-Low-Bit Vision-Language-Action Models
- **中文标题**: SACQ：面向超低比特视觉-语言-动作模型的结构感知码本量化
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种针对VLA模型的超低比特向量码本量化框架，通过感知网络层下游功能的量化度量、感知最终动作误差的比特分配以及两阶段后量化微调，在1.5 bit下大幅压缩显存并保持接近全精度的机器人控制成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的超低比特（Ultra-Low-Bit）后训练权重量化，以解决大模型内存占用过高、难以在资源受限的机器人端侧部署的问题。
- **研究动机**: 现有的大语言模型后训练量化（PTQ）方法直接应用于VLA时，在极低比特下性能急剧下降。现有低比特PTQ方法（如GPTQ、GPTVQ等）通常只关注最小化单层输出的局部重建误差，没有显式考虑不同投影层（如注意力的Q/K/V/O或FFN的gate/up/down）在下游计算中的结构差异，也没有考虑量化误差对最终输出的机器人动作（policy actions）的实际影响。
- **本质改动**: 摒弃了单纯最小化层局部重建误差的做法，转而为每个投影层推导符合其下游计算角色的特定二次型度量矩阵（结构感知），并根据对最终动作误差的影响来分配比特（动作感知），最后通过面向最终动作的两阶段微调恢复精度。
- **技术溯源**: 基于 GR00T N1.7 和 OpenVLA-OFT 等 VLA 模型架构；向量量化机制参考了 GPTVQ、AQLM、QuIP# 等工作；后训练量化基础参考了 GPTQ。

**2. 技术拆解**
- **核心方法**: SACQ (Structure-Aware Codebook Quantization) 框架，包含三个核心组件：
  1) **结构感知码本拟合**：为不同角色的投影层推导特定的度量矩阵（结合输入统计和下游敏感度），替代传统的欧氏距离或单纯的层局部重建误差。
  2) **动作感知混合比特分配**：根据降低一层精度所导致的最终解码动作误差的增加量，贪心地分配比特，同时平衡语言主干和动作头的比特率。
  3) **两阶段后量化微调**：第一阶段利用二阶误差补偿重新分配码字索引；第二阶段固定索引，微调码本和行组缩放因子（row-group scales）以匹配最终动作。
- **关键细节**: 采用仅权重的向量码本量化（Weight-only vector-codebook quantization）。关键超参包括块大小 $g=64$，向量维度 $d=4$，每层共享一个码本。量化范围针对 GR00T N1.7 的 338 个线性层（112个语言主干，226个DiT动作头），视觉编码器等保持4-bit。
- **训练/优化目标**: 
  1) 码本拟合阶段：最小化带有结构感知度量矩阵的加权二次型失真（公式2）。
  2) 动作级校准阶段（第二阶段微调）：最小化量化策略最终解码动作与全精度（BF16）参考动作之间的均方误差（公式9）。

**3. 实验结果**
- **实验设置**: 在 LIBERO（包含 Spatial, Object, Goal, Long 四个子集）和 SimplER（包含 Visual Matching 和 Variant Aggregation 协议）基准上评估。对比的 baseline 包括 HQQ, GPTQ, ActQuant, TWLA 和 AQLM。全精度参考为 BF16。测试模型主要为 GR00T N1.7，并在附录中测试了 OpenVLA-OFT。推理延迟在 RTX 4090 上测试。
- **评价指标**: 机器人任务成功率（Success rates, %）、模型显存占用（Memory, GB）、推理延迟与加速比。
- **主要结果**: 
  1) 在 LIBERO 上，GR00T N1.7 在 1.5 bpw (bits per weight) 下平均成功率达 93.85%（仅比 BF16 的 94.10% 低 0.25%），显存从 5.677 GB 降至 1.175 GB（压缩 4.83 倍）。在 2.0 bpw 下成功率 94.25%，显著优于 TWLA (93.05%) 和 AQLM (83.60%)。
  2) 在 SimplER 上，2.0 bpw 下 Visual Matching 成功率 63.76%（高于 BF16 的 58.90%），Variant Aggregation 成功率 52.27%（与 BF16 的 53.45% 相当）。
  3) 配合 INT8 激活量化（W1.5A8），在 RTX 4090 上实现 1.51 倍推理加速，成功率保持 93.55%。
  4) 跨架构测试中，OpenVLA-OFT 在 2.0 bpw 下 LIBERO 平均成功率达 94.05%（接近 BF16 的 95.80%）。

### 12. 🔥 [Seeing Through the Illusion: Test-Time Scaling for World Action Models] (看穿幻觉：世界动作模型的推理时扩展)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.03585` | [点击跳转](https://arxiv.org/abs/2611.03585)

**0. 论文标题**
- **英文标题**: Seeing Through the Illusion: Test-Time Scaling for World Action Models
- **中文标题**: 看穿幻觉：世界动作模型的推理时扩展
- **研究机构**: 原文未提及
- **一句话总结**: 提出 WISE 选择器，在冻结的世界动作模型推理时，通过联合评估动作有效性、逆动力学一致性和任务进度来挑选最靠谱的轨迹，显著提升机器人闭环控制成功率。

**1. 整体逻辑**
- **研究任务**: 世界动作模型（WAMs）在机器人控制中的推理时候选轨迹选择（Test-time scaling）。
- **研究动机**: WAM 会同时生成动作和想象的未来视频，但两者经常脱节（比如想象抓住了香蕉，动作却把香蕉推飞了）。现有的推理时选择器要么只看未来视频，要么只看动作，要么依赖外部物理模拟器，没有直接检查“同一个候选里的动作和未来是否描述了同一种运动”。
- **本质改动**: 提出一个无需微调 WAM 的执行前选择器（WISE），直接计算 WAM 原生联合生成的“动作-未来”对的内部一致性（用逆动力学模型把想象的未来还原成动作，看和原动作是否匹配），并结合物理有效性和任务进度综合打分选优。
- **技术溯源**: 基于 Cosmos 3 Edge 和 DreamZero（WAMs），辅助模型包括 Robometer（评估任务进度）和基于 DROID/LIBERO 数据训练的逆动力学模型（IDM）。

**2. 技术拆解**
- **核心方法**: WISE 打分机制。对 WAM 采样的多个“动作-未来”联合 rollout 计算三项得分并求和：1) 动作有效性（检查控制指令是否超限及运动学平滑度）；2) 世界-动作一致性（用 IDM 从想象的未来帧中恢复动作，计算与 WAM 生成动作的差异）；3) 任务进度（用 Robometer 评估想象未来最终帧的任务完成度）。选总分最高的执行。
- **关键细节**: 
  - 输入输出：输入当前观测、机器人状态和指令；输出选中的动作 chunk。
  - 规模与超参：每次决策采样 B=4 个候选。IDM 针对特定机器人形态训练一次。
  - 架构：WAM 全程冻结。IDM 使用纯视觉输入，预测连续控制（Smooth L1）和离散控制如夹爪（BCE）。
- **训练/优化目标**: WISE 本身无参数，不需要训练，是纯推理时的打分策略。其依赖的 IDM 训练目标为连续动作的 Smooth L1 损失和离散动作的二元交叉熵（BCE）损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：真实机器人环境 RoboLab（10个操作任务，使用 Cosmos 3 Edge）和仿真环境 LIBERO（4个 suite，使用 DreamZero）。
  - 对比对象（baseline）：单样本直接执行（B=1），以及同为 B=4 预算的 Future Consensus、GeoBoN、Robometer。
- **评价指标**: 闭环任务成功率（%），以及单集平均运行时间（秒）。
- **主要结果**: 
  - RoboLab：WISE 将成功率从 6.0% (B=1) 提升至 24.0%，比最强 baseline (GeoBoN/Robometer 20.0%) 高出 4.0%。
  - LIBERO：WISE 将平均成功率从 75.1% (B=1) 提升至 78.3%，比最强 baseline (Robometer 77.4%) 高出 0.9%。
  - 效率代价：WISE 的运行时间约为单样本执行的 3.4-3.5 倍，在 B=4 的选择器中处于中等水平。
  - 消融结论：任务进度得分对最终选择影响最大（移除它会改变近一半的决策），且三个得分维度在 92% 以上的决策中排序不同，证明它们提供了互补的信号。

- **研究机构**: 原文未提及
- **一句话总结**: 本文提出将不确定性感知的人体3D重建模型（KNOWN）与基于物理的运动预测模型（PhysMoP）相耦合，构建用于机器人的不确定性感知且基于物理的人类世界模型，并设计了三种不确定性传递机制与评估协议。

**1. 整体逻辑**
- **研究任务**: 为机器人构建人类世界模型（包含对人体状态的信念和预测未来状态的动力学模型），以在人类环境中进行安全规划和交互。
- **研究动机**: 现有的人体网格估计器无法区分观测噪声（随机不确定性）与模型无知（认知不确定性）；现有的人体运动预测器仅在动捕数据上训练，未验证在估计输入下的表现，且缺乏物理结构来保证预测的合理性。机器人需要知道预测何时不可信，以防止规划器利用模型误差。
- **本质改动**: 将已发布的不确定性感知3D重建模型（KNOWN）作为状态信念，与基于物理的运动预测模型（PhysMoP）作为动力学模型进行系统级耦合，并设计了不确定性从感知端传递到预测端的具体机制。
- **技术溯源**: 基于两个已发表的工作：KNOWN（不确定性感知3D人体重建）和 PhysMoP（基于物理的人体运动预测），两者均基于 SMPL 人体参数化模型。

**2. 技术拆解**
- **核心方法**: 设计KNOWN与PhysMoP的耦合接口，提出三种将KNOWN的不确定性引入PhysMoP的机制：1) 初始条件采样（利用整体信念）；2) 协方差加权平滑（利用随机不确定性）；3) 认知门控（利用认知不确定性），并制定野外视频评估协议。
- **关键细节**: 
  - **接口**：KNOWN输出SMPL姿态/形状的均值与协方差，转换为PhysMoP所需的25帧欧拉角历史；根平移由外部深度传感器提供，形状在序列上平均。
  - **机制1（整体信念）**：从每帧后验分布中采样多个历史序列输入PhysMoP，生成预测分布，无需重训练。
  - **机制2（随机不确定性）**：将KNOWN的观测协方差作为时变测量协方差输入线性高斯平滑器，对遮挡/模糊导致的宽协方差帧进行降权，防止噪声在二阶差分中被放大。
  - **机制3（认知不确定性）**：对认知不确定性超阈值的帧（训练集低密度区），放大测量协方差，或直接屏蔽物理分支回退至数据分支。
- **训练/优化目标**: 本文无新训练目标。引用的原组件中，KNOWN使用负对数似然（NLL）和不确定性引导的细化损失；PhysMoP使用物理分支与数据分支的融合损失。

**3. 实验结果**
- **实验设置**: 本文未开展新实验，提出基于3DPW测试集的评估协议。对比5种输入（GT历史、点估计、采样历史、协方差平滑、认知门控平滑），在80、160、320和400 ms预测步长下评估。
- **评价指标**: 根对齐平均关节位置误差（root-aligned MPJPE），以及90%预测区间的经验覆盖率。
- **主要结果**: 原文未提及（本文未报告新实验结果，仅提出评估协议。引用的已有组件基线结果为：KNOWN将少数类图像误差从81.3降至70.3 mm；PhysMoP在Human3.6M的80ms误差从9.6降至2.1 mm，在3DPW上从12.1降至0.7 mm）。

- **研究机构**: `原文未提及（致谢中提及国家自然科学基金等资助，但未明确具体高校或研究所名称）`
- **Arxiv ID**: `2611.03294` | [点击跳转](https://arxiv.org/abs/2611.03294)

**0. 论文标题**
- **英文标题**: ForceLDM: A Force-aware Latent Dynamics Model for Contact-Rich Manipulation
- **中文标题**: ForceLDM：一种用于接触丰富操作的力感知潜在动力学模型
- **研究机构**: 原文未提及（致谢中提及国家自然科学基金等资助，但未明确具体高校或研究所名称）
- **一句话总结**: 提出ForceLDM，通过知识蒸馏将未来的力/扭矩和光流动力学特征从特权教师网络蒸馏到仅依赖当前观测的学生策略中，使模型在推理时不依赖未来传感器输入即可实现高精度的接触丰富操作。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作（Contact-rich manipulation），如USB插入、齿轮组装、盒子翻转等需要精细力控和物理交互的任务。
- **研究动机**: 1) 纯视觉策略难以推断接触状态和交互力；2) 现有力感知方法（如ForceVLA）仅将力信号作为辅助输入拼接，未建模未来的交互动力学；3) 现有的基于视频预测的世界模型容易拟合与任务无关的视觉细节（如背景、光照），且需要大量同步多模态数据，计算开销大。
- **本质改动**: 放弃直接预测高维未来视觉观测，转而通过教师-学生知识蒸馏框架，将代表接触和运动动力学的未来力/扭矩和光流的紧凑潜在表示，蒸馏给仅使用当前观测的学生网络，让学生学会“脑补”未来动力学。
- **技术溯源**: 基于 $\pi_0$ (Vision-Language-Action模型), PaliGemma (SigLIP + Gemma-2B), RAFT (光流估计), SDXL-VAE (光流特征编码)。

**2. 技术拆解**
- **核心方法**: 
  1) **未来动力学编码**：用MLP编码未来H步的6D力/扭矩为力token；用RAFT估计光流并转为伪RGB图像，经冻结的SDXL-VAE和Q-Former压缩为运动token。
  2) **在线未来动力学蒸馏**：教师网络利用当前观测和真实的未来力/运动token提取特征，学生网络利用当前观测和可学习的query tokens，在Transformer特定层进行特征对齐。
  3) **渐进式噪声注入**：训练时随进度逐渐给学生query加高斯噪声，防止过拟合并提升对不确定性的鲁棒性。
- **关键细节**: 
  - 输入：多视角图像、机器人状态、10步6D力/扭矩历史、语言指令。输出：32步动作chunk。
  - 模型规模：总参数约3.56B（2.92B VLM骨干 + 两个约300M的动作专家）。
  - 蒸馏设置：16个运动query，1个力query，在Transformer的第8、12、16层进行对齐。推理时仅保留学生网络。
- **训练/优化目标**: 
  - 总损失 $\mathcal{L}_{total} = \mathcal{L}_S + \mathcal{L}_T + \lambda \mathcal{L}_{distill}$。
  - $\mathcal{L}_S, \mathcal{L}_T$ 为基于Flow Matching的动作预测MSE损失。
  - $\mathcal{L}_{distill}$ 为师生表示对齐损失（1 - 余弦相似度），权重 $\lambda=0.5$。教师端使用stop-gradient阻断梯度回传。

**3. 实验结果**
- **实验设置**: 
  - 数据集：作者通过遥操作自采的数据集（xArm 7平台5个任务共420条demo，Piper-X平台2个任务共200条demo）。
  - Baselines：$\pi_0$ w/o Force, $\pi_0$ w/ Force, TA-VLA, ForceVLA, Seer w/ Force (主实验)；GR00T N1.5, TA-VLA (跨平台补充实验)。
  - 测试环境：xArm 7 和 AgileX Piper-X 机械臂，包含分布内(ID)和分布外(OOD，如视觉遮挡、新物体、颜色/高度/材质/尺寸改变)测试。
- **评价指标**: 真实世界任务成功率（Success Rate %）。
- **主要结果**: 
  - ID任务：平均成功率87.1%，比最强基线 Seer w/ Force (72.2%) 高14.9%。在需要毫米级对齐的插入任务（USB、VGA）上表现尤为突出。
  - OOD任务：平均成功率68.9%，比 Seer w/ Force (48.9%) 高20.0%，证明其学到了物理交互本质而非视觉表象。
  - 跨平台泛化：在Piper-X平台上平均成功率70%，比 TA-VLA (62.5%) 高7.5%。
  - 消融实验证实：力+光流组合效果最佳（90.7%）；直接预测未来信号不如潜在蒸馏（62.1% vs 85.1%）；渐进式噪声注入对OOD泛化提升显著。

### 15. 🔥 [FineCraft: Enhancing VLA Models for Fine-Grained Manipulation] (FineCraft：增强VLA模型以实现细粒度操作)
- **研究机构**: `HITSZ Robotics (哈尔滨工业大学（深圳）)`
- **Arxiv ID**: `2611.03163` | [点击跳转](https://arxiv.org/abs/2611.03163)

**0. 论文标题**
- **英文标题**: FineCraft: Enhancing VLA Models for Fine-Grained Manipulation
- **中文标题**: FineCraft：增强VLA模型以实现细粒度操作
- **研究机构**: HITSZ Robotics (哈尔滨工业大学（深圳）)
- **一句话总结**: 提出了一种任务路由的策略混合（MoP）框架，通过为不同任务独立适配 DINOv2-DiT 和 $\pi_{0.5}$ 模型并结合执行期重规划，在 MetaFine 挑战赛的细粒度机器人操作任务中取得第四名，并全面超越官方基线。

**1. 整体逻辑**
- **研究任务**: 解决机器人细粒度操作任务（如抓取特定部位、运输、切换开关、排序、插入），要求模型具备指令定位、局部视觉精度和持续执行能力（基于 MetaFine 挑战赛的 5 个具体任务）。
- **研究动机**: 细粒度操作对视觉感知和动作执行的精度要求极高。现有的预训练机器人策略（VLA模型）直接迁移时，难以同时满足特定目标的精确选择、复杂动作序列的持续执行以及对环境扰动的鲁棒性。
- **本质改动**: 放弃使用单一通用模型解决所有任务，转而设计一个“任务路由的策略混合（MoP）”框架，根据任务ID硬路由到独立适配的视觉-动作骨干网络，并在执行中引入基于新观测的重规划机制。
- **技术溯源**: DINOv2, DiT (Diffusion Transformer), $\pi_{0.5}$ (预训练VLA模型), LoRA。

**2. 技术拆解**
- **核心方法**: 
  1. **任务路由策略混合（MoP）**：根据任务ID将观测和指令路由到5个独立策略之一。
  2. **差异化骨干适配**：对需要精细视觉特征的任务（T1瓶子部位抓取、T5字母插入）采用 DINOv2 提取局部特征结合 DiT 生成动作；对需要复杂多阶段推理的任务（T2杯子运输、T3开关切换、T4方块排序）采用 LoRA 微调 $\pi_{0.5}$ VLA模型。
  3. **执行期重规划与阶段切换**：动作分块预测，执行 K 步后根据新观测重新规划；T5 中引入分类器，实现从通用策略到完成策略再到纠正策略的单向阶段切换。
- **关键细节**: 
  - **输入输出**：输入为双视角 512×512 RGB 图像（基座和腕部）、9维关节本体感受状态、任务指令及观测历史；输出为 8维动作（7个关节+1个夹爪）。
  - **执行步长**：预测 H 步动作，实际执行 K 步后重规划。T1/T5: H=16, K=2；T2/T4: H=K=10；T3: H=10, K=5。
  - **数据规模**：T2/T4 各使用 300 条演示轨迹和 30,000 次更新；T3 包含 864 条轨迹（88,059 个动作帧），涵盖相机和光照扰动场景。
- **训练/优化目标**: 
  - **DINOv2-DiT 分支**：使用 landmark 和 visibility 标签监督感知头；DiT 采用扩散模型目标，对演示动作序列加噪并预测噪声。T1 的特定分支还使用了离线专家干预生成的成功轨迹进行混合训练。
  - **$\pi_{0.5}$ LoRA 分支**：保留 $\pi_{0.5}$ 原始目标，即从演示数据中学习动作序列。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 MetaFine 挑战赛的 5 个任务（T1-T5）上测试；对比基线为官方发布的 $\pi_0$ 参考模型（published $\pi_0$ reference）。
- **评价指标**: 
  - 三个维度：感知（Perception, P，扰动下的成功率曲线下面积）、理解（Understanding, U，固定场景下改变指令的表现）、行为（Behavior, B，最终成功率或阶段进度）。
  - 综合得分：单任务得分 $S_\tau = (P+U+B)/3$，总体得分 $S_{overall}$ 为 5 个任务的平均值。
- **主要结果**: 
  - 总体得分为 0.878，在 MetaFine 排行榜排名第四（以 HITSZ Robotics 名义提交）。
  - 在所有 5 个任务和所有评估维度上均超越 $\pi_0$ 基线，总体得分比 $\pi_0$ 的平均分（0.430）高出 44.8 个百分点。
  - 具体任务表现：T2（杯子运输）满分 1.000；T4（方块排序）0.987；T3（开关切换）0.925；T1（瓶子抓取）0.796；T5（字母插入）0.681。
  - 局部诊断表明，T5 在感知和理解上比基线分别大幅提升 56.9 和 67.5 个百分点；T3 通过扩展数据和持续训练，得分从 0.841 提升至 0.894。

### 16. 🔥 [ReContact: Reconstruct and Retarget Human Contacts from Video for Contact-Rich Humanoid Manipulation] (ReContact：从视频中重建与重定向人类接触，用于接触丰富的人形机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.02968` | [点击跳转](https://arxiv.org/abs/2611.02968)

**0. 论文标题**
- **英文标题**: ReContact: Reconstruct and Retarget Human Contacts from Video for Contact-Rich Humanoid Manipulation
- **中文标题**: ReContact：从视频中重建与重定向人类接触，用于接触丰富的人形机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种“以物体为中心的接触计划”，通过约束视频中的物体重建、全身运动重定向以及残差策略的接触力奖励，让人形机器人能精准复现人类视频中复杂的身体接触转移（如大腿托举、腋下夹持），避免了仅复现轨迹导致的受力方向错误和物体滑落。

**1. 整体逻辑**
- **研究任务**: 从人类单目视频中学习人形机器人的接触丰富操作（contact-rich manipulation），实现涉及身体多部位（手、大腿、躯干等）支撑与接触状态转移的复杂操作。
- **研究动机**: 1) 视频中的身体遮挡会破坏物体位姿跟踪，导致重建失败；2) 仅复现物体运动轨迹无法保证机器人在正确的接触点施加正确方向的稳定力（例如“侧面挤压”和“底部托举”在轨迹上可能相似，但受力方向完全不同），这会导致机器人在后续动作中滑落物体。现有方法无法同时统一处理接触位置、按压方向和支撑变化的顺序。
- **本质改动**: 引入“以物体为中心的接触计划（object-centric contact plan）”，将接触点（锚点）、按压方向、粘滑模式显式解耦，并让这一计划贯穿视频重建、运动重定向和强化学习控制的全流程。
- **技术溯源**: 基于 GVHMR（人体运动恢复）、AGILE（第一人称视频手物交互重建）、UMR（运动重定向初始化）、SONIC（冻结的全身运动跟踪器基座）、PPO（强化学习算法）以及 GPT-6 Astra（用于草拟和审查接触计划）。

**2. 技术拆解**
- **核心方法**: 
  1. **构建接触计划**：将操作划分为多个阶段，为每个阶段定义活动的接触对（机器人表面与物体表面）、接触锚点、按压方向以及粘滞/滑动模式。
  2. **接触约束的重建与重定向**：利用计划中的接触先验（支撑、承载、滑动）在遮挡时稳定物体位姿；在全身重定向时，强制机器人连杆与物体锚点及法向对齐。
  3. **接触点与方向奖励的残差控制**：在冻结的全身跟踪器上叠加残差策略，奖励函数专门针对“在计划锚点附近产生接触”且“接触力方向与计划方向一致”进行设计。
  4. **任务族生成（Task-family generation）**：通过改变物体放置位置，重新求解依赖放置的运动片段，生成多个参考轨迹供单一策略学习，从而扩大工作空间泛化能力。
- **关键细节**: 
  - **输入输出**：输入为单目视频（外视角或第一人称视角）、目标人形机器人模型和物体几何；输出为机器人全身关节及手指关节的控制指令。
  - **系统架构**：采用“冻结基座 + 残差策略”架构。基座为适配了23个身体关节的 SONIC 跟踪器；残差策略基于 PPO 训练，输入包括本体感觉、动作历史、参考轨迹、当前阶段及接触掩码等。
  - **接触计划表示**：包含阶段区间、活动接触对集合、承载体（如大腿、手臂）。每个接触对绑定了机器人连杆上的点/法向与物体坐标系下的锚点/法向。
- **训练/优化目标**: 
  - **重建与重定向优化目标**：接触残差（点距离惩罚 + 法向对齐惩罚）+ 姿态目标 + 站立约束 + 平滑与碰撞惩罚。
  - **强化学习奖励函数**：包含接近锚点的距离衰减奖励、在锚点处产生正确方向接触力的角度衰减奖励、以及接触持久性奖励。同时结合物体/身体跟踪误差和残差正则化项。

**3. 实验结果**
- **实验设置**: 
  - **任务与数据集**：仿真与真机（Unitree G1）上的多种任务，包括腋下搬运(T1)、大腿支撑重抓(T2)、纸巾包/羽毛球筒腋下转移(T3/T4)、管子转移任务族(T5)、不规则物体抓取(T6)。
  - **对比对象（Baseline）**：HDMI-style、ResMimic-style、CWS adapter（基于 CHORD 的接触力 wrench-space 目标）。
  - **测试环境**：mjlab 仿真环境，真机控制频率 50 Hz。
- **评价指标**: 
  - **任务指标**：完成率（Complete）与成功率（SR，需满足特定接触结果，如双掌底部托举）。
  - **接触保真度**：物体跟踪误差（$E_o$）、锚点误差、接触依从性（Adherence，在锚点 30mm 内产生法向接触的比例）、法向误差（接触力方向与计划方向的夹角）。
  - **能耗**：机械功（Mechanical work）。
- **主要结果**: 
  - **精准执行接触转移**：在大腿支撑重抓任务 (T2) 中，ReContact 在 83.5% 的 episode 中成功实现了计划的双掌底部托举；而最好的 baseline (ResMimic-style) 成功率仅为 0.16%（baseline 倾向于陷入“侧面挤压”的局部最优，导致后续滑落）。ReContact 的大腿接触依从性达 94.4%，法向误差仅 16.3°。
  - **任务族泛化能力**：在管子转移任务 (T5) 中，使用 247 个生成的参考轨迹训练单一策略，将工作空间内的成功率从单参考轨迹的 20.4% 大幅提升至 97.8%。
  - **接触保真度领先**：在多数任务（T3, T4, T6）中，ReContact 的锚点误差最小，接触依从性最高（如 T4 达 83.4%），且机械功最低。
  - **真机部署**：在 Unitree G1 上成功执行了 7 个接触丰富操作任务和 2 个移动操作任务（如行走抓取、带载行走 3 米并进行正反向大腿重抓等）。

### 17. 🔥 [Right Ranking, Wrong Scale: Reproducing the Robotic World Model's Dynamics Model and Testing the Uncertainty of Its Follow-up] (排序正确，尺度错误：复现机器人世界模型的动力学模型并测试其后续工作的不确定性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.02699` | [点击跳转](https://arxiv.org/abs/2611.02699)

**0. 论文标题**
- **英文标题**: Right Ranking, Wrong Scale: Reproducing the Robotic World Model's Dynamics Model and Testing the Uncertainty of Its Follow-up
- **中文标题**: 排序正确，尺度错误：复现机器人世界模型的动力学模型并测试其后续工作的不确定性
- **研究机构**: 原文未提及
- **一句话总结**: 本文严格复现了RWM动力学模型并验证了其长视野训练优势，同时通过代码级排查和统计测试，指出其后续工作RWM-U的集成不确定性估计“能正确排序误差但严重低估误差尺度”，并修复了原版代码中的多个致命缺陷。

**1. 整体逻辑**
- **研究任务**: 复现并验证Robotic World Model (RWM) 及其不确定性感知后续版本 (RWM-U) 在离线基于模型强化学习（Offline Model-Based RL）中的核心声明，特别是多步训练（rollout training）的有效性，以及集成不确定性（ensemble disagreement）作为奖励惩罚项的可靠性。
- **研究动机**: RWM和RWM-U提出了多项关于动力学模型训练和不确定性估计的声明，但缺乏严格的独立复现和统计验证。作者怀疑其代码实现和损失函数设计存在缺陷，导致不确定性估计在实际应用中失效。
- **本质改动**: 这是一篇强化学习领域的复现与实证分析工作。核心思路是通过预注册（pre-registration）的严格统计协议，从代码底层到宏观指标对原论文进行“证伪与修正”，点破了RWM-U不确定性失效的根本原因（共享主干限制分歧、方差坍缩、错误的rollout方式）。
- **技术溯源**: 基于 RWM (Li, Krause and Hutter) 和 RWM-U，涉及 PETS 的概率动力学模型架构（GRU + 均值/log-sigma头），以及 MOPO/MOReL 的集成不确定性惩罚机制。

**2. 技术拆解**
- **核心方法**: 
  1. 从零复现RWM的GRU集成动力学模型，确保训练前梯度与原版完全一致。
  2. 针对RWM-U的集成不确定性，设计控制变量实验（独立训练成员 vs 共享主干、按成员独立rollout vs 按集成均值rollout），分别测试其误差排序能力和尺度校准能力。
  3. 排查并修复原版代码管道中的缺陷（如数据拼接越界、评估时动作错位一步）。
- **关键细节**: 
  - **输入输出**: 输入为ANYmal D四足机器人的本体感受状态和动作，输出为下一步状态的均值和带边界的log-sigma（方差）。
  - **模型结构**: RWM使用GRU；RWM-U使用5个预测器，但共享同一个循环主干（shared trunk），仅头部不同。
  - **规模与数据**: 数据集包含10,000行数据（10个20秒的episode），采用5折交叉验证，每次留出2个episode。
- **训练/优化目标**: 
  - **RWM**: 对比多步自回归rollout损失与单步teacher forcing损失。
  - **RWM-U**: 原版代码实际最小化的是“采样预测的平方误差”，而非论文描述的高斯似然。这导致方差（sigma）的最优解为0，引发方差坍缩。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: ANYmal D 四足机器人的10个episode（10,000行数据）。
  - **对比对象 (Baseline)**: 
    - 训练方式：Rollout training vs Teacher forcing。
    - 架构对比：MLP, RSSM, Transformer（按原论文设置复现）。
    - 不确定性模型：原版RWM-U checkpoint vs 本文复现的集成模型（共享主干 vs 独立主干）。
- **评价指标**: 
  - **误差指标**: Relative-L1, nRMSE。
  - **不确定性指标**: 误差与spread的比值（Error-to-spread ratio），±1σ和±2σ覆盖率（Coverage），Spearman秩相关系数。
- **主要结果**: 
  - **RWM声明验证**: 在长视野（h=368）下，rollout训练确实优于teacher forcing（相对L1误差降低约5.9倍，10个留出的episode全部胜出）；但在短视野（h=1）下teacher forcing更优。架构对比中，RWM确实优于未调参的MLP/Transformer/RSSM。
  - **RWM-U不确定性“排序准但尺度错”**: 
    1. **排序正确**: 集成分歧与真实误差的Spearman相关系数在h=100时达到+0.90，优于简单的预测步数指标。
    2. **尺度严重错误**: 即使在单步（h=1），误差也远超spread预测。原版checkpoint在h=100时的1σ覆盖率仅为4.6%（理论应为68%）。
  - **缺陷定位与修复**: 
    1. 共享主干导致成员间分歧受限；原版代码给所有成员输入集成均值，导致spread无法随视野累积。改为让每个成员独立rollout后，h=100的覆盖率从4.6%提升至33%。
    2. 实际使用的平方误差损失导致预测方差（sigma）坍缩至0。
    3. 按视野重新缩放（per-horizon rescaling）可恢复1σ覆盖率，但由于误差呈重尾分布，无法恢复2σ覆盖率。
  - **代码缺陷**: 修复了原版数据集中episode边界未标记导致的拼接越界问题，以及评估时动作错位一步（stale action）导致h=1误差增加55%的问题。

### 18. 🔥 [W2A: Distilling World Priors into Action Models for Real-Time Robotic Control] (W2A：将世界先验蒸馏到动作模型中以实现实时机器人控制)
- **研究机构**: `原文未提及（致谢中仅提及国家自然科学基金及深圳、广东省相关基金）`
- **Arxiv ID**: `2611.02600` | [点击跳转](https://arxiv.org/abs/2611.02600)

**0. 论文标题**
- **英文标题**: W2A: Distilling World Priors into Action Models for Real-Time Robotic Control
- **中文标题**: W2A：将世界先验蒸馏到动作模型中以实现实时机器人控制
- **研究机构**: 原文未提及（致谢中仅提及国家自然科学基金及深圳、广东省相关基金）
- **一句话总结**: 提出W2A两阶段蒸馏框架，训练时把视频扩散模型的世界先验（经PCA降维的中间特征）蒸馏进动作扩散模型，推理时彻底扔掉视频模型，从而在保持高成功率的同时实现低延迟的实时机器人控制。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作（根据当前视觉观测和文本指令，生成动作序列控制机械臂）。
- **研究动机**: 现有的世界-动作模型（WAMs）在推理时需要显式生成或想象未来视频/状态来提供物理动态先验，导致计算开销极大、推理延迟高，根本无法部署在需要实时控制的真实机器人上。
- **本质改动**: 把视频模型降级为纯“训练期老师”，通过特征蒸馏把视频先验“内化”到动作模型里。推理时彻底抛弃视频模型，只跑动作模型，实现无视频生成的纯动作推理。
- **技术溯源**: Cosmos-Predict2（预训练语言条件视频DiT）、Flow Matching（流匹配）、Q-Former、PCA。

**2. 技术拆解**
- **核心方法**: 两阶段特征蒸馏框架。
  - **阶段一（视频域适应与压缩）**：用LoRA微调预训练视频DiT到机器人视频数据。提取其去噪轨迹中间层的隐状态，并用PCA将其投影到低维子空间（从2048维降到482维），去除冗余噪声，保留核心时空结构。
  - **阶段二（动作模型训练与蒸馏）**：从头训练动作DiT。引入Q-Former从动作DiT中间层读取特征，将其在时空维度上与压缩后的视频特征对齐，计算余弦蒸馏损失。
- **关键细节**: 
  - **输入输出**：输入为双视角图像（224x224）、T5文本嵌入、2步历史观测；输出为16步动作序列（实际执行前8步，后8步用于下次推理的warmstart）。
  - **模型结构**：视觉编码器用ResNet-18；动作DiT为10层Transformer（隐藏层768）；Q-Former为1层（隐藏层128）。
  - **时空对齐**：根据视频VAE的时间压缩比，将动作序列按时间分组，Q-Former通过交叉注意力聚合每组动作token，输出与视频特征相同空间网格布局的特征。
- **训练/优化目标**: 
  - 总损失 = 流匹配损失（Flow Matching loss） + 余弦蒸馏损失（Cosine distillation loss）。
  - 蒸馏损失带有基于流时间（flow time）的高斯权重，在特定的去噪时刻（$\tau_c=0.5$）重点对齐动作特征和视频特征。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：LIBERO（4个suite），CALVIN（ABC->D设置）。
  - **真实世界**：Franka机械臂，双视角相机。包含拾取放置、堆叠、长视野操作，以及折毛巾、清理桌面、插USB等复杂任务。每个子任务50个示教，评估时每个子任务30次rollout。
  - **对比对象（baseline）**：Diffusion Policy, Octo, OpenVLA, $\pi_{0.5}$, mimic-video, DreamZero-5B等。
- **评价指标**: 平均成功率（Success Rate），CALVIN平均任务完成长度（Avg. Len），推理延迟（Inference latency）。
- **主要结果**: 
  - **仿真表现**：LIBERO平均成功率95.9%，在长视野任务（Long）上达93.6%，超过微调的$\pi_{0.5}$（92.4%）；CALVIN平均完成长度4.30，完成5个子任务成功率77.1%，与现有视频基线持平。
  - **真机表现**：在拾取放置（78.3%）、堆叠（65.0%）、长视野（54.2%）及复杂任务（折毛巾76.7%等）上显著优于Diffusion Policy和OpenVLA。
  - **推理效率**：单张A100上推理延迟仅55ms，比保留视频生成的mimic-video快约21倍，部署显存占用仅约6GB。

### 19. 🔥 [RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild] (RoboColosseum：在真实环境中大规模评估物理智能)
- **研究机构**: `National University of Singapore (NUS), Hugging Face, Singapore Embodied AI Centre, BitRobot`
- **Arxiv ID**: `2611.02497` | [点击跳转](https://arxiv.org/abs/2611.02497)

**0. 论文标题**
- **英文标题**: RoboColosseum: Evaluating Physical Intelligence at Scale In-The-Wild
- **中文标题**: RoboColosseum：在真实环境中大规模评估物理智能
- **研究机构**: National University of Singapore (NUS), Hugging Face, Singapore Embodied AI Centre, BitRobot
- **一句话总结**: 这篇工作构建了一个名为 RoboColosseum 的分布式真实世界机器人评估框架，通过标准化物理协议和双赛道设计，在124个真实站点大规模评估了通用机器人策略的零样本泛化与少样本微调能力。

**1. 整体逻辑**
- **研究任务**: 构建大规模真实世界基准（系统工程/基准测试），评估通用机器人策略（VLA模型和前沿大模型Agent）在跨机器人形态、跨任务、跨环境下的物理智能表现。
- **研究动机**: 仿真评估缺乏真实物理反馈，而真实世界物理试验受环境、硬件、初始条件影响大，难以标准化。现有评估要么在受控实验室里做（缺乏环境多样性），要么靠志愿者做（难以持续和规模化），导致无法公平、大规模地衡量模型在真实世界的鲁棒性。
- **本质改动**: 搭建了一个包含100多台机器人、124个真实站点的分布式评估网络，设计了“开放赛道（测零样本泛化）”和“微调赛道（测少样本适应）”双轨制，并引入基于难度校准的Rasch模型（DCR）和主动匹配机制，解决了真实世界评估中变量不可控和样本效率低的问题。
- **技术溯源**: 评估了5种VLA策略（GR00T N1.7, $\pi_{0.5}$, MolmoAct2, G0.5, LingBot-VLA v2）和3种前沿AI Agent（GPT-6 Astra, Claude Opus 5.5, Grok 4.7）；硬件平台涵盖SO-101, Franka (DROID), Bimanual-YAM和Unitree G1人形机器人。

**2. 技术拆解**
- **核心方法**: 
  1. **物理基建与标准化协议**：统一4种机器人的硬件配置、观测和动作空间，雇佣全职操作员在办公室、家庭、工厂等真实场景执行试验，并进行隐私脱敏。
  2. **双轨评估设计**：Fine-tune Track 控制数据变量（每任务固定100条演示），评估微调后的表现；Open Track 评估零样本泛化，采用盲测A/B对比，任务和环境由评估员自定义。
  3. **统计与匹配机制**：Open Track 使用难度校准的 Rasch (DCR) 模型联合估计策略能力和任务难度，并采用主动匹配（Active Matchmaking）优先评估不确定性高的模型对，以提高样本效率。
- **关键细节**: 
  - **规模**：124个站点，5699次Open Track对比，4种形态，20个微调任务。
  - **输入输出**：VLA输入图像和指令输出关节位置；Agent输入图像、本体感觉和指令，通过工具调用输出关节位置。
  - **指标**：Fine-tune Track 用 SR（成功率）和 PS（归一化进度得分，衡量部分完成情况）；Open Track 用 DCR Rating（Elo风格得分）。
- **训练/优化目标**: 
  - Fine-tune Track 中各模型遵循官方微调recipe，原文未提及具体损失函数，优化目标为在固定100条演示数据上收敛。
  - Open Track 的 DCR 模型优化目标为最大化物理成功结果的对数似然，联合推断策略能力 $\theta_p$ 和任务难度 $\beta_t$，并将人类难度评分作为先验。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：Fine-tune Track 使用收集的20个任务（每形态5个），每任务100条演示；Open Track 使用评估员在真实环境自定义的5699个任务。
  - **对比对象**：5个VLA模型与3个前沿AI Agent进行对比，以及各模型在不同形态和赛道间的相互对比。
  - **测试环境**：124个真实世界站点（办公室、家庭、工厂等），4种机器人形态。
- **评价指标**: 
  - Fine-tune Track: 成功率 (SR) 和 归一化进度得分 (PS)。
  - Open Track: 难度校准的 DCR Rating，以及基于进度的 BTD 期望对比得分。
- **主要结果**: 
  1. **开放世界能力**：前沿AI Agent（如GPT-6, Claude）的零样本操作性能可与专门的VLA策略媲美，但所有系统在真实任务中的绝对成功率极低（均<13%），且在高难度任务上几乎无法取得有效进展。
  2. **任务适应与部分进度**：微调后，GR00T N1.7 在 SO-101 上领先，$\pi_{0.5}$ 在 Franka 和 Bimanual-YAM 上领先。模型表现出强烈的任务和形态依赖性。进度指标（PS）揭示了仅看成功率无法发现的差异（例如在G1人形机器人上，所有策略成功率为0，但平均PS在13.3%到23.2%之间）。
  3. **排名一致性**：跨形态的排名一致性很弱（Kendall's W = 0.24）；Open Track 的零样本排名无法预测 Fine-tune Track 的微调排名，存在大量排名反转。
  4. **评估效率**：分布式评估能产生可复现的排名；主动匹配机制只需400-500次物理试验即可达到与全量数据90%的排名一致性，比均匀采样（需约1000次）显著提高了样本效率。

### 20. 🔥 [GoalDex: Learning Image-Goal-Conditioned Policies for Dexterous In-Hand Manipulation] (GoalDex：学习用于灵巧手内操作的图像目标条件策略)
- **研究机构**: `ETH Zurich`
- **Arxiv ID**: `2611.02171` | [点击跳转](https://arxiv.org/abs/2611.02171)

**0. 论文标题**
- **英文标题**: GoalDex: Learning Image-Goal-Conditioned Policies for Dexterous In-Hand Manipulation
- **中文标题**: GoalDex：学习用于灵巧手内操作的图像目标条件策略
- **研究机构**: ETH Zurich
- **一句话总结**: 提出了一种无需显式物体位姿估计的端到端视觉运动框架，通过图像目标条件和特权教师-学生蒸馏，实现了多物体灵巧手内重定向的零样本真机迁移。

**1. 整体逻辑**
- **研究任务**: 灵巧手内重定向（Dexterous in-hand reorientation），即仅凭视觉和本体感觉将手中物体旋转到指定的目标姿态。
- **研究动机**: 现有方法依赖显式的物体位姿估计来连接感知和控制，但在严重的手物遮挡下位姿跟踪极不可靠，且需要为每个物体定义标准坐标系，难以扩展到多种或未见物体。此外，预训练的静态视觉编码器（如DINOv2）缺乏闭环物理交互所需的接触和时序动态特征。
- **本质改动**: 抛弃了中间的显式位姿估计和物体标准坐标系，直接在图像空间定义目标，通过端到端策略联合学习视觉表征与控制，利用特权教师蒸馏和辅助物理状态重建来学习具有交互感知能力的隐式表征。
- **技术溯源**: 强化学习（PPO）、教师-学生蒸馏（Teacher-student distillation）、3D高斯溅射（3DGS）渲染、ResNet-34、GRU。

**2. 技术拆解**
- **核心方法**: 
  1. 图像空间目标条件：用目标图像直接指定目标配置，替代传统的位姿坐标。
  2. 特权教师-学生蒸馏：在仿真中用包含完整物理参数和位姿的特权状态训练教师策略，再让学生策略仅通过RGB图像和本体感觉模仿教师。
  3. 辅助状态重建与连续对比对齐：让学生策略的隐状态重建未观测的特权物理变量（如速度、尺寸）以防表征坍塌；引入连续对比损失，使视觉表征空间的距离与物理旋转误差单调对应。
- **关键细节**: 
  - 输入：单目RGB图像（当前帧和目标帧，120x120分辨率，带物体mask）、本体感觉（关节状态、动作历史）。
  - 模型结构：ResNet-34提取图像特征，MLP处理本体感觉，拼接后输入两层GRU进行时序特征融合，最后通过MLP输出关节位置目标。
  - 规模：仿真中训练了25个不同几何形状的物体。真机部署在16自由度Allegro Hand上，使用Intel RealSense D435i相机。
- **训练/优化目标**: 
  - 教师：PPO最大化期望折扣回报。
  - 学生：行为克隆损失（BC） + 辅助重建损失（MSE，重建特权状态子集） + 连续对比损失（MSE，使视觉特征余弦相似度与真实旋转角距离的指数映射对齐）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：在仿真中评估了5个和25个不同几何形状的物体（如Cube, Globe, Tablet Bottle等）。对比对象包括基于位姿的方法（使用预训练位姿估计器）、冻结的预训练视觉编码器（ImageNet, DINOv2, DepthAnythingV2）以及多种消融变体（如无记忆模块、仅位姿重建等）。
  - 测试环境：仿真使用NVIDIA Isaac Lab；真机使用Allegro Hand和RTX 6000 Ada GPU工作站。
- **评价指标**: 
  - 任务性能：连续成功次数（Consecutive Successes, CS）、成功时间（Time-to-Success, TTS）、成功预测F1分数、预测失败率。
  - 重建质量：特权状态（位置、姿态、相对姿态、缩放、质量）的预测误差。
- **主要结果**: 
  - 仿真中，图像目标条件策略在连续成功次数（77.30）和成功时间（4.35s）上显著优于基于位姿的方法（最高11.23）和冻结预训练编码器（均失败或极低）。
  - 真机部署中，单一策略在5个物体上的100次试验中达到了80%的平均成功率，而最强的基于位姿的baseline成功率仅为27%。
  - 消融实验证明，冻结的预训练视觉特征无法捕捉交互相关信息，而辅助重建和时序记忆模块对维持闭环控制下的稳定表征至关重要。

### 21. 🔥 [Do Embodied VLMs Actually Use Their Scene-Graph Memory?] (具身VLM真的使用了它们的场景图记忆吗？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.02056` | [点击跳转](https://arxiv.org/abs/2611.02056)

**领域与类型判断**：具身智能/多模态大模型（Embodied VLMs），属于诊断性研究/方法创新。

**0. 论文标题**
- **英文标题**: Do Embodied VLMs Actually Use Their Scene-Graph Memory?
- **中文标题**: 具身VLM真的使用了它们的场景图记忆吗？
- **研究机构**: 原文未提及
- **一句话总结**: 提出“图交换测试”诊断协议，揭示了具身VLM在接收场景图记忆时，标准的图融合方式会丢失信息，而“每节点一token”能让模型真正依赖图记忆，但在有文本记忆时图记忆会被模型忽略。

**1. 整体逻辑**
- **研究任务**: 评估具身智能体在回答导航路线相关问题时，是否真正依赖并有效利用了场景图（Scene-Graph）形式的情景记忆。
- **研究动机**: 现有系统通常将场景图序列化为文本或通过图编码器输入VLM，但仅靠任务准确率无法区分模型是真正读取了图记忆，还是走了语言先验等捷径（即无法证明图内容到达了模型且被依赖）。
- **本质改动**: 提出“图交换测试（graph-swap test）”诊断协议，通过推理时替换测试样本的图记忆来量化模型对图内容的真实依赖度，并系统对比了文本、标准图融合和“每节点一token”三种记忆输入路由。
- **技术溯源**: 基座模型为 MomaGraph-R1 (Qwen2.5-VL-7B)，仿真环境为 AI2-THOR (ProcTHOR-10k)，图编码器采用 R-GCN。

**2. 技术拆解**
- **核心方法**: 
  1. 场景图记忆构建流水线：从视频帧提取场景图，通过闭集词汇表约束、按类型修正规则、基于门穿越划分房间，合并为单集 episode graph。
  2. 三种记忆输入路由（Memory Routes）：文本路由（将图序列化为Prompt）、标准图路由（输入端平均池化向量 + 输出端门控交叉注意力）、每节点路由（为每个图节点分配一个独立的输入token）。
  3. 图交换测试（Graph-swap test）：在推理时将当前 episode 的图替换为另一个 episode 的图，统计答案翻转数量，并与模型重评估的噪声基线对比，以验证模型是否真正依赖图内容。
- **关键细节**: 
  - 模型结构：使用 LoRA (r=16, α=32) 微调 Qwen2.5-VL-7B。图编码器为 2层 R-GCN。
  - 每节点路由实现：在 Prompt 中添加 N 个 `<kg_node>` 占位符，通过 hook 将 R-GCN 编码后的节点嵌入（经两层 MLP 和 LayerNorm 投影）替换到对应位置。图单独输入时 N=64，图文同时输入时 N=80。
  - 训练细节：回答时输入图像置空（强制依赖记忆）。
- **训练/优化目标**: 主要损失函数为导航动作预测的交叉熵损失与最终步问答字母的交叉熵损失（回答样本过采样8倍）；优化器为 AdamW，峰值学习率 1e-4，余弦调度，训练 6000 步。

**3. 实验结果**
- **实验设置**: 
  - 数据集：基于 AI2-THOR 构建的具身问答基准（包含2-7个房间的路线，800个测试问题，分为考察时间顺序的“路线问题”和考察空间分布的“集合问题”）。
  - 对比对象（Baseline）：无记忆（No memory）、纯文本记忆（Text）、标准图路由（Standard graph route）、文本+标准图（Text + graph standard）。
- **评价指标**: 问答准确率（Accuracy），以及图交换/文本交换测试中的准确率下降幅度（Swap cost），并与重评估噪声（Re-evaluation noise）对比。
- **主要结果**: 
  1. 文本记忆效果最强：在路线问题上比无记忆提升 30.1 个点（整体提升 11.06 个点）。
  2. 标准图路由失效：图单独输入时，准确率提升在噪声范围内（+1.62），晚期融合门控值极小（0.062），信息在融合阶段丢失。
  3. 每节点路由有效：图单独输入时，在路线问题上提升 8.25 个点；图交换测试证实模型确实依赖该图（交换图导致路线问题准确率下降 6.53 个点）。
  4. 文本存在时图被忽略：当同时提供文本和图时，交换图引起的答案变化（12个）与重评估噪声（9-12个）相当，而交换文本会导致准确率暴跌 16.38 个点，表明模型完全依赖文本捷径，忽略了图。

### 22. 🔥 [OpenNWM: A Generalist Navigation World Model with Latent Action Pretraining] (OpenNWM：基于潜在动作预训练的通用导航世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.01844` | [点击跳转](https://arxiv.org/abs/2611.01844)

**0. 论文标题**
- **英文标题**: OpenNWM: A Generalist Navigation World Model with Latent Action Pretraining
- **中文标题**: OpenNWM：基于潜在动作预训练的通用导航世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于潜在动作预训练的通用导航世界模型，通过大规模无动作视频学习通用潜在动作并与物理运动对齐，大幅提升了开放世界导航的视觉预测和规划泛化能力。

**1. 整体逻辑**
- **研究任务**: 构建通用导航世界模型（Navigation World Models），通过预测未来视觉观测来支持具身智能体的导航规划。
- **研究动机**: 现有导航世界模型高度依赖带动作标签的轨迹数据，收集成本高且场景覆盖有限；而无动作视频数据量大、场景丰富，但缺乏显式控制信号。直接用无动作视频训练潜在动作模型容易学到环境外观变化，而非智能体可控的物理运动。
- **本质改动**: 引入“通用导航潜在动作（UNLAs）”作为统一接口，先在大规模无动作视频上进行视觉预测预训练，再利用少量带物理标签的数据进行后训练，将潜在动作空间与真实的物理运动对齐。
- **技术溯源**: 基于扩散模型（Diffusion Model）和时空Transformer。具体使用了 CDiT (Conditional Diffusion Transformer) 作为世界模型骨干，Stable Diffusion VAE 作为图像分词器，以及类似 Gao et al. (2026) 的时空 Transformer 架构作为潜在动作模型（LAM）。

**2. 技术拆解**
- **核心方法**: 
  1. **潜在动作学习 (LAM)**：采用变分转移建模，通过视觉重建和KL散度约束从视频帧对中学习潜在动作；同时引入物理运动接地（Physical Motion Grounding），对带标签数据增加物理运动预测损失，实现异构监督。
  2. **潜在条件世界建模 (NWM)**：使用扩散模型预测未来视觉状态。将潜在动作、预测步长和扩散时间步编码后，通过自适应层归一化（AdaLN）和交叉注意力注入模型。
  3. **导航规划**：后训练阶段将潜在动作适配器替换为物理动作适配器，在真实的物理航点动作空间内，使用交叉熵方法（CEM）进行基于能量的滚动视界规划。
- **关键细节**: 
  - **LAM**：约709M参数，24层时空编码器/解码器，隐藏层宽度1024，16个注意力头，潜在动作维度32。输入2帧，分辨率240×320。
  - **NWM**：CDiT-B/2骨干，约197M参数，冻结SD-VAE。输入分辨率224×224，4帧上下文，4帧预测目标。
  - **规划**：规划视界2秒（8步，每步0.25秒），CEM采样80个候选序列，5个精英，3次随机评估。
- **训练/优化目标**: 
  - **LAM目标**：联合优化视觉重建损失（所有数据）和物理动作预测损失（仅带标签数据），加上KL散度正则化。
  - **NWM目标**：混合优化未来状态预测的L2损失和扩散模型的变分下界（VLB）损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：预训练使用自建的 NavAnywhere（15个来源，1750万帧无动作视频）。下游训练和评估使用 RECON, SCAND, HuRoN, TartanDrive（域内），以及 Go Stanford, TUM RGB-D, Office-Go2, Planetary Rover（域外）。
  - **Baselines**：视觉预测对比 NWM, RAE-NWM, NWM CDiT-XL + Ego4D；导航规划对比 GNM, NoMaD, CompACT, Garrido et al.。
  - **硬件**：8张 NVIDIA L20 GPU。
- **评价指标**: 
  - 视觉预测：PSNR, LPIPS, DreamSim, FID。
  - 导航规划：ATE（绝对轨迹误差）, RPE（相对位姿误差）。
  - LAM重建：PSNR, LPIPS。
- **主要结果**: 
  - **视觉预测**：在域内和域外基准上均取得SOTA。相比最强baseline，LPIPS降低9.1%，DreamSim降低13.7%，PSNR提升0.342 dB。且模型总参数量（280M）远小于RAE-NWM (867M) 和 NWM XL (1099M)。
  - **导航规划**：在RECON, SCAND和域外的Office-Go2上取得最优或持平最优的ATE和RPE。例如在SCAND上，ATE从1.01降至0.98，RPE从0.28降至0.27。
  - **域外泛化**：在Go Stanford, TUM RGB-D和Planetary Rover的视觉预测PSNR最高；在Office-Go2上导航ATE最低（2.89），证明了潜在动作预训练带来的强泛化能力。
  - **LAM重建**：在域内和域外设置下，图像重建的PSNR和LPIPS均优于所有对比方法（如域内PSNR达21.071 dB，LPIPS为0.505）。

### 23. 🔥 [ODE Policy: Robot Learning via Action Dynamics, Not Actions] (ODE策略：通过动作动力学而非动作本身进行机器人学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.01729` | [点击跳转](https://arxiv.org/abs/2611.01729)

**0. 论文标题**
- **英文标题**: ODE Policy: Robot Learning via Action Dynamics, Not Actions
- **中文标题**: ODE策略：通过动作动力学而非动作本身进行机器人学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ODE Policy，将机器人动作生成从直接预测离散动作值改为学习动作的动力学（常微分方程向量场），通过积分生成连续动作，大幅提升了模仿学习与强化学习的训练效率、推理速度和动作平滑度。

**1. 整体逻辑**
- **研究任务**: 机器人模仿学习（IL）和强化学习（RL）中的动作策略生成，涵盖视觉运动策略、视觉-语言-动作（VLA）模型、世界动作模型（WAM）以及基于模型的 RL。
- **研究动机**: 现有的直接动作策略在离散控制步直接输出动作值，隐式学习物理运动的连续性。这导致 IL 中依赖海量数据，且生成式策略需要多次网络评估、推理慢、反应延迟；RL 中动作容易高频振荡，磨损硬件且不利于 Sim2Real；此外，离散动作在 chunk 边界容易出现跳跃或不连续。
- **本质改动**: 放弃直接预测离散动作值，转而将策略建模为常微分方程（ODE），学习动作的向量场（即动作随时间变化的速率），在物理时间上通过积分得到天然连续的动作轨迹。
- **技术溯源**: 基于 Neural ODE，结合了 Action Chunking 机制，并作为 Action Head 替换了 $\pi_{0.5}$ VLA、ImageWAM WAM 以及 SuperMimic RL actor 中的原有动作头（如 Flow Matching、Diffusion 等）。

**2. 技术拆解**
- **核心方法**: 
  1. 向量场与分块积分：用神经网络参数化动作速度。IL 中在一个 action chunk 内积分生成动作序列，RL 中每个控制步积分一次。
  2. 收缩扰动：训练时对 chunk 起始动作施加随机扰动，要求积分路径收敛回演示轨迹，防止推理时误差累积。
  3. 无缝分块：推理时，下一个 chunk 从上一个 chunk 的末尾动作开始积分，保证跨 chunk 平滑，消除边界跳跃。
  4. 多样性头：增加一个轻量级网络，在 chunk 起始处采样一个速度偏移量加到向量场上，用来保留多模态行为（如绕障碍物的左右选择）。
- **关键细节**: 
  - 输入输出：输入图像/语言特征、本体感觉和当前动作状态，输出动作速度（向量场）。
  - 模型结构：使用 FiLM-MLP 作为向量场（比 Transformer 推理快很多），多样性头使用 K=12 的高斯混合模型。在 VLA 中仅占原 action expert 约 3% 的参数量（13.7M）。
  - 规模与超参：IL 默认 chunk length $H=8$，使用 RK4 积分器；RL 中 $H=1$，使用 Euler 积分。
- **训练/优化目标**: 
  - IL：Path loss（匹配积分路径与演示轨迹）+ 收缩扰动 loss + 可选的 Diversity loss。不直接回归速度标签，以避免放大演示数据中的噪声。
  - RL：直接通过 RL 算法（如 SuperMimic 的 world model return）优化。ODE actor 每步执行 Euler 步，梯度可以无衰减地沿动作链回传，使早期动作也能获得强梯度信号。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：IL 在 LIBERO/LIBERO-plus 仿真，以及 4 种真机（单臂 Franka、双臂 Galaxea、灵巧手 Sharpa、人形 Unitree G1）。RL 在人形仿真中做全身动作跟踪 (LAFAN1)。
  - 对比对象：IL 对比 Flow Matching (FM-DiT/UNet)、Diffusion、A2A-DiT、ACT；VLA/WAM 对比原生 Flow Matching 和 A2A 头；RL 对比 SuperMimic 原生 actor 和 PPO。
- **评价指标**: 成功率、推理时间/速度、动作平滑度（Jerk、边界加速度）、零样本泛化能力、多模态平衡度。
- **主要结果**: 
  - 学习效率：IL 中 1 个 epoch 在 LIBERO 达 79.2% 成功率（baseline 最高 43.2%）；作为 $\pi_{0.5}$ 的头 1 个 epoch 达 96.0%（原 FM 75.5%）；作为 ImageWAM 的头 1 个 epoch 达 82.6%（原 24.6%）。RL 中训练 0.75 小时 return 比 baseline 高 37%。
  - 推理与平滑度：生成 8 步 chunk 比 FM-DiT 快 10.8 倍，比 Diffusion 快约 100 倍；真机上比 baseline 快 3.5-27 倍。动作 jerk 和边界加速度显著低于 baseline，多数情况下比人类演示更平滑。
  - 泛化与多模态：在 LIBERO-plus 泛化表现更好；在 2D 导航和双臂任务中成功保持多模态行为；灵巧手任务成功从其他实验室的公开数据零样本迁移到本实验室真机。

### 24. 🔥 [Democratizing Robot-Use Agents: A Unified Harness with Open Models] (普及机器人使用智能体：支持开源模型的统一框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.01560` | [点击跳转](https://arxiv.org/abs/2611.01560)

**0. 论文标题**
- **英文标题**: Democratizing Robot-Use Agents: A Unified Harness with Open Models
- **中文标题**: 普及机器人使用智能体：支持开源模型的统一框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个统一且模块化的机器人操作框架 `uni-robot-agent`，让开源大模型在无需特权信息（如深度图）的情况下，零样本机器人操作性能超越了闭源前沿模型。

**1. 整体逻辑**
- **研究任务**: 构建一个通用的机器人使用智能体（RUA）执行框架，使开源大模型能够零样本地执行复杂的物理机器人操作任务。
- **研究动机**: 现有的RUA研究高度依赖闭源前沿模型（如GPT-6），限制了进一步的训练和优化；而开源模型在空间理解和Agent能力上存在差距，以往工作多依赖特权信息（如仿真器深度图、成功反馈）或特定技能库来弥补，缺乏一个通用且高效的框架来系统性挖掘开源模型的现有能力。
- **本质改动**: 设计了一个统一、模块化且支持流水线并发的执行框架，通过标准化的工具接口、状态快照和结构化反馈，在不依赖任何特权信息的前提下，最大化开源模型在机器人操作中的通用能力。
- **技术溯源**: 基于开源多模态大模型（Qwen3.8-Flash-Next, DeepSeek-V4.1-Flash）、闭源模型（GPT-6 Astra），以及现有的机器人操作基准（RoboDojo）。

**2. 技术拆解**
- **核心方法**: 提出 `uni-robot-agent` 框架，包含五个逻辑层（Agent、编排、工具、服务、后端）。核心机制包括：1) 统一的工具接口与环境适配器，解耦工具逻辑与底层环境；2) 两阶段流水线执行，将模型推理与物理工具执行重叠；3) 无特权信息的交互设计，仅依赖RGB、相机标定和本体感觉；4) 六项关键工程设计（如状态快照绑定、防重复执行、运动与夹爪协同、运动停止检测、可诊断的动作反馈、滑动窗口视觉历史管理）。
- **关键细节**: 
  - 系统架构分为五层，通过环境适配器（Adapter）实现N个工具在M个环境中的复用，避免N×M的开发成本。
  - 流水线并发：支持后台工具调用，模型推理与物理执行重叠，重叠率高达84.5%-93.8%。
  - 关键设计：将图像、相机标定和机器人状态绑定为不可变快照；通过记录请求ID防止通信失败导致的重复物理动作；运动工具结合目标位姿和夹爪开合度；通过中间目标生成和进度检查动态调整运动并检测停滞；返回包含位姿误差和停止原因的数值反馈及结果图像；使用滑动窗口和文本占位符管理视觉历史以支持KV Cache复用。
  - 测试模型规模包括 27B (Qwen3.8-27B) 和 125B (Qwen3.8-Flash-Next) 等。
- **训练/优化目标**: 本文非学习类工作（不训练模型权重），核心机制是通过系统设计和Prompt工程（如结构化的工具反馈、上下文管理）来优化Agent的推理和决策过程，目标是提高零样本任务成功率、降低执行时间并减少API调用成本。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：RoboDojo基准（42个任务），对比基线包括 GPT-6 Astra (RoboProbe)、VLA/WAM模型（如π0.5, Hy-Embodied-0.5-VLA等）及其他harness（GAP, RPent）。
  - 真实世界：自建19个桌面操作任务基准（5个维度），对比基线包括微调的 π0.5 和零样本的 Dream-1。
  - 测试模型：Qwen3.8-Flash-Next, DeepSeek-V4.1-Flash, GPT-6 Astra等。
- **评价指标**: 
  - 仿真：成功率（SR）和 RoboDojo Score（0-100，包含部分成功）。
  - 真实世界：自建基准的总分（0-100，按5个维度各20分计算）。
  - 其他：API成本、执行时间（Episode duration）、特权信息（深度、技能库）的消融影响。
- **主要结果**: 
  - 仿真中，Qwen3.8-Flash-Next 结合 uni-robot-agent 在无特权信息下取得 31.39 Score（SR 25.00%），超越了 GPT-6 Astra 使用 RoboProbe 的 28.97 Score（SR 22.48%），以及众多微调的VLA/WAM基线。
  - 真实世界中，Qwen3.8-Flash-Next 取得 53.50 总分，超越了零样本的 Dream-1（43.50），并优于微调的 π0.5（47.75）。
  - 能力分析：机器人使用能力依赖于四种通用能力（视觉理解、空间定位、几何编码、具身推理），而非单一的机器人特化能力。
  - 效率与成本：流水线执行将物理执行与模型推理重叠，任务耗时减少4.8%至73.7%；Qwen单集成本约$1.09，远低于Astra的$21.29。无深度图信息下，Qwen性能仅下降约12.5%。

### 25. 🔥 [Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied Manipulation] (Auriga技术报告：一种用于零样本具身操作的与任务无关的智能体执行框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.01112` | [点击跳转](https://arxiv.org/abs/2611.01112)

**0. 论文标题**
- **英文标题**: Auriga Technical Report: A Task-Agnostic Agent Harness for Zero-Shot Embodied Manipulation
- **中文标题**: Auriga技术报告：一种用于零样本具身操作的与任务无关的智能体执行框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出Auriga执行框架，通过轨迹预览、执行容差验证和3D几何感知，在不重置环境的情况下，大幅弥合了视觉语言模型在零样本机器人操作中的“规划-执行差距”。

**1. 整体逻辑**
- **研究任务**: 解决视觉语言模型（VLM）在零样本、单episode机器人物理操作任务中，规划决策正确但物理执行成功率极低的问题（即“规划-执行差距”）。
- **研究动机**: 现有的VLM控制接口（如逐帧动作输出或代码即策略）是开环或缺乏物理反馈的。模型在执行前看不到完整轨迹，执行中发生几毫米的碰撞或抓取滑动时无法及时止损，导致机械臂频繁失败。而现有的改进方法多依赖在特定任务上反复重置环境来微调（过拟合特定场景），无法泛化到零样本和随机布局。
- **本质改动**: 将“任务决策”与“物理执行验证”解耦。设计了一个统一的准入网关（Admission Gateway），让模型在仿真暂停时预览轨迹，在执行时通过严格的容差检查实现原地错误恢复（In-place recovery），同时提供精确的3D几何感知和基于手指末端（而非手腕）的控制接口。
- **技术溯源**: 基于 GPT-6 Astra (大模型)，结合了 VGGT-Omega (深度估计)、SAM 3.1 (图像分割) 等视觉基础模型，运行于 Isaac Sim 仿真环境。

**2. 技术拆解**
- **核心方法**: Auriga 框架，核心包含三个机制：1) 显式任务信念与证据记录；2) 基于准入网关的轨迹预览与执行验证；3) 校准的3D感知与基于手指参考的动作空间。
- **关键细节**: 
    - **任务信念 (Task Belief)**: 模型维护当前计划、未决问题和前提假设（支持/矛盾/未知），长文本交互日志存入外部证据记录按需检索，避免上下文溢出。
    - **准入网关 (Admission Gateway)**: 所有物理动作必须经过网关。执行前，网关在仿真暂停状态下生成多阶段双臂轨迹预览（包含路径、耗时、碰撞警告）供模型审查；执行中，网关实时检查位置/姿态容差（默认位置10mm，姿态0.15rad）和夹爪开合度，一旦超限立即停止机械臂，返回偏差收据和最新视角，供模型原地重规划。
    - **3D感知与动作**: 输入端融合相机标定、VGGT-Omega深度和SAM 3.1分割，提供射线-平面相交和双视图三角测量；输出端允许模型直接指定手指接触区域的目标位姿，并在统一时间轴上协调双臂。
- **训练/优化目标**: 非学习类工作（无需训练模型权重）。核心机制是“预览-执行-验证”闭环控制逻辑，以及基于大模型的零样本推理与原地恢复策略。

**3. 实验结果**
- **实验设置**: 
    - **RoboDojo**: 42个双桌面臂操作任务，包含泛化、精度、长程、记忆、开放5个维度，6300个episode。对比基线包括RoboProbe（参考harness）、PyRUA-Lean、HexaShell-Preview等Agent方法，以及GO-3 Nano等VLA/WAM策略。
    - **RoboCasa365**: 50个Target50厨房移动操作任务（250个episode），对比RPent、PyRUA-Lean等Agent+VLA基线。
- **评价指标**: 成功率 (SR, Success Rate) 和 官方评分 (Score, 0-100)。在RoboDojo还评估了场景随机化下的泛化指标 $G$。
- **主要结果**: 
    - **RoboDojo**: Auriga (GPT-6 Astra) 取得 57.7% SR 和 64.0 Score，位列排行榜第一（超越所有Agent和VLA/WAM方法）。相比参考harness (22.5% SR)，弥补了68.3%的规划-执行差距。在场景随机化下保持第一（$G=46.3$），而学习策略SR下降高达33.9%。

### 26. 🔥 [pico-WAM: Evaluating Counterfactual Prediction and Planning Error in a Compact World Action Model] (pico-WAM：在紧凑型世界动作模型中评估反事实预测与规划误差)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.01039` | [点击跳转](https://arxiv.org/abs/2611.01039)

**0. 论文标题**
- **英文标题**: pico-WAM: Evaluating Counterfactual Prediction and Planning Error in a Compact World Action Model
- **中文标题**: pico-WAM：在紧凑型世界动作模型中评估反事实预测与规划误差
- **研究机构**: 原文未提及
- **一句话总结**: 构建了一个透明的紧凑型世界动作模型，通过控制变量实验诊断出在模型预测控制中，引入反事实分支数据能显著提升动作排序能力，且用真实模拟器代价替代学习到的轨迹打分能大幅提高控制覆盖率。

**1. 整体逻辑**
- **研究任务**: 本文属于机器人控制与世界模型（World Model）领域，是一篇偏向系统诊断与分析的方法创新工作。主要任务是诊断紧凑型世界动作模型（WAM）在模型预测控制（MPC）中，究竟是动作提议（proposal generation）生成环节出错，还是轨迹打分（trajectory scoring）环节出错。
- **研究动机**: 世界模型通常只在专家演示的动作分布内进行训练，但规划器在搜索时需要评估专家未曾选择过的“反事实”动作。现有的紧凑型模型能否准确对这些偏离专家流形（off-manifold）的提议进行打分并指导控制，是一个未被充分验证的盲区。
- **本质改动**: 不追求更大的模型规模或更复杂的架构，而是通过引入反事实模拟器分支数据来拓宽训练数据分布，并在规划时解耦“动作提议”与“轨迹打分”环节，通过控制变量实验精准定位规划误差的来源。
- **技术溯源**: 基于 LeRobot 的 Push-T 任务数据集和 Meta-World 的 door-opening 任务；基线方法包括行为克隆（BC）、Diffusion Policy 以及纯演示数据训练的 WAM。

**2. 技术拆解**
- **核心方法**: 提出 pico-WAM 架构，使用共享潜在表示（shared latent representation）同时输出策略、状态转移和显式状态读出，使决策过程完全可追踪。训练时引入反事实分支数据（对专家动作加高斯噪声），并在规划阶段交叉组合“学习到的/真实的”动作提议与轨迹打分，以隔离各组件的误差贡献。
- **关键细节**: 
  - 输入：64x64图像、固定指令、8维物理状态（agent位置/速度，block位置/朝向）。
  - 模型结构：3层CNN（提取16个空间softmax关键点）+ GRU + 状态MLP融合为128维潜在状态。策略为3层512单元MLP（预测8个2维动作），残差动力学为2层256单元MLP。
  - 规划机制：策略前向滚动12步生成提议，生成256个候选动作序列（1个提议，1个搜索中心，254个加噪扰动）。每步执行后重新规划（Restart）或基于上一计划平移（Warm）。
- **训练/优化目标**: 联合优化行为克隆损失（BC）、当前状态重建损失、未来H步状态预测损失和潜在一致性损失。反事实分支数据仅提供状态预测目标，不提供专家动作标签，以避免污染策略学习。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LeRobot 的 206 个 Push-T 演示（25,444个状态转移），以及 Meta-World 的 door-open-v3 任务。
  - 对比对象（baseline）：纯演示数据训练的模型、行为克隆（BC）、调优的 BC、Diffusion Policy。
  - 测试环境：Push-T 物理环境（100Hz 物理仿真，10Hz 控制），以及 Meta-World 环境。
- **评价指标**: 控制覆盖率（Coverage，目标最大重叠度）、成功率（Success）、选择遗憾（Selection regret，选中序列真实代价与候选池中最佳真实代价之差）、预测均方误差（nMSE）。
- **主要结果**: 
  - 引入反事实分支数据后，策略重启搜索（policy-restarted search）的覆盖率从 43.8% 提升至 78.4%，且重启搜索优于热启动搜索（warm search）的优势扩大了 4.8 个百分点。候选排序的秩相关系数从 0.49 提升至 0.80，选择遗憾从 7.56 降至 2.77。
  - 在保留学习到的动作提议的情况下，用真实模拟器代价替代学习到的轨迹打分，覆盖率进一步提升 12.2 个百分点，证明打分环节是有效的改进目标。
  - 仅在提议生成阶段替换为模拟器状态，没有检测到明显收益。
  - 尽管排序能力显著提升，但学习到的计划仍会系统性地高估实际进展；且更好的轨迹排序并不必然转化为超越纯模仿学习（如调优的 BC 或 Diffusion Policy）的闭环控制表现。

### 27. 🔥 [WorldSketch: Sketching World Models for Zero-Shot Mobile Manipulation] (WorldSketch：为零样本移动操作绘制世界模型草图)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.00513` | [点击跳转](https://arxiv.org/abs/2611.00513)

**0. 论文标题**
- **英文标题**: WorldSketch: Sketching World Models for Zero-Shot Mobile Manipulation
- **中文标题**: WorldSketch：为零样本移动操作绘制世界模型草图
- **研究机构**: 原文未提及
- **一句话总结**: 提出让VLM不再直接生成动作或代码，而是构建一个极简的运动学世界模型（草图），交由几何规划器进行接触与运动联合优化，从而在零样本移动操作和导航中大幅提升成功率并显著降低VLM调用开销。

**1. 整体逻辑**
- **研究任务**: 领域与类型：具身智能/机器人操作，属于方法创新与系统工程。具体任务：零样本移动操作（厨房和桌面任务）及视觉语言导航。
- **研究动机**: 现有的基于VLM的机器人系统要么受限于预定义技能库，要么让VLM直接生成动作或代码。后者要求VLM具备精确的几何和接触推理能力，极易出错；而端到端的VLA在训练分布外（如物体位置或任务改变）性能断崖式下跌。
- **本质改动**: 改变VLM在系统中的角色，从“动作/代码生成器”转变为“世界模型构建者”。VLM只负责提取任务相关的极简运动学特征（画草图），将具体的几何计算和接触规划交给传统的几何规划器。
- **技术溯源**: 基于视觉语言模型（如GPT-6.1-Sol, GPT-6-Astra），结合传统机器人学工具（如逆运动学、RRT-Connect路径规划、VAMP、顺应操作空间控制）。

**2. 技术拆解**
- **核心方法**: 
  1. 世界草图（World Sketch）：定义极简运动学模型，包含无标签的碰撞体素、带语义和运动学参数的任务实体（如关节类型、轴、目标角度），以及处理图像歧义的联合假设。
  2. 智能体草图构建：VLM主动调用感知工具（请求特定3D点、特定视角图像）来测量和组装草图，并通过渲染叠加进行视觉验证。
  3. 执行反馈与自我修正：执行后通过深度和外观变化验证结果，用贝叶斯更新假设概率；若失败则尝试下一假设或让VLM修改/重画草图。
  4. 接触-运动联合规划：在草图上，规划器联合优化接触点和全身运动，使用增广拉格朗日方法求解，闭环执行时实时重拟合关节。
- **关键细节**: 
  - 输入输出：输入为RGB-D图像和语言指令，输出为机器人底层控制指令。
  - 系统架构：VLM（决策） + 感知后端（测量） + 几何规划器（运动求解） + 闭环执行器。
  - 规模与开销：厨房任务平均每集调用VLM约5.4次，输入约88k tokens；桌面任务约3.2次。草图非常精简，中位数仅含1个实体和2个图元。
- **训练/优化目标**: 非学习类工作，无需训练。核心优化目标是规划器中的接触-运动联合优化：在满足运动学闭环和无碰撞约束的前提下，最小化关节运动、基座位移和抓取姿态的惩罚项。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboCasa（30个厨房任务，90个episode）、LIBERO-PRO（150个受扰动的桌面任务）、R2R-CE（376个未见导航episode）。
  - 对比对象：零样本方法（Code as Policies, CaP-Agent0/CaP-X, ReKep），训练过的VLA（GR00T N1.5, $\pi_{0.5}$）。导航对比了多种现有VLM导航Agent。
- **评价指标**: 任务成功率（Success Rate），导航还评估了SPL、OSR等；同时统计VLM调用次数、输入Token数和执行时间。
- **主要结果**: 
  - RoboCasa厨房任务：WorldSketch零样本成功率达91%，大幅领先次优零样本基线CaP-Agent0（33%）和训练过的VLA（GR00T 44%, $\pi_{0.5}$ 39%），且VLM输入Token数仅为次优基线的1/10。
  - LIBERO-PRO桌面任务：成功率达97%，远超CaP-X（15%）。
  - R2R-CE导航：成功率76%，与逐步调用VLM的Agent持平，但VLM调用次数减少至约1/5（5.7次对30次），输入Token减少6倍。
  - 失败分析：WorldSketch 89%的失败发生在物理执行阶段（如打滑、小零件抓取失败），仅11%是草图构建错误；而对比方法（如Code as Policies）67%的失败是因为任务模型/世界模型错误。

### 28. 🔥 [SPARK: Self-Correcting Embodied Memory via Physical Re-Observation] (SPARK：通过物理重观测实现自纠正的具身记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.00344` | [点击跳转](https://arxiv.org/abs/2611.00344)

**0. 论文标题**
- **英文标题**: SPARK: Self-Correcting Embodied Memory via Physical Re-Observation
- **中文标题**: SPARK：通过物理重观测实现自纠正的具身记忆
- **研究机构**: 原文未提及
- **一句话总结**: 提出 SPARK 框架，让机器人通过 VLM 自主诊断记忆库错误并规划物理重访，选择性地增删改记忆，从而在无真值监督下修复具身 RAG 知识库并提升下游问答性能。

**1. 整体逻辑**
- **研究任务**: 修复具身检索增强生成（Embodied RAG）系统中的环境记忆知识库，解决感知噪声、遮挡等导致的错误积累（如错误标签、位置偏移），提升下游具身问答（EQA）任务。
- **研究动机**: 现有具身记忆系统多假设单次探索的知识库可靠，或在多轮探索中只追加（append）观测而不纠正 prior errors。大模型 RAG 的纠错依赖文本检索，而具身场景必须通过物理世界的重新观测（physical re-observation）来获取纠正证据。
- **本质改动**: 引入“诊断-重访-纠正”闭环。机器人不再盲目追加新观测，而是利用 VLM 自主诊断已建记忆中的不可靠区域，规划针对性的物理重访路线，并根据新观测对记忆库进行增、删、改的选择性更新。
- **技术溯源**: 基于 Embodied-RAG 的层次化记忆表示；感知管线采用 SAM2（分割）和 gpt-5-mini（VLM 开放词汇标签与推理）；仿真平台为 AirSim。

**2. 技术拆解**
- **核心方法**: SPARK 框架包含三个核心模块：语义评论家（Semantic Critic）用于诊断错误、重访规划器（Revisit Planner）用于生成视点、选择性合并（Selective Merge）用于更新记忆。
- **关键细节**: 
  - **语义评论家**：结合 VLM 和图统计，从三个独立信号标记不可靠区域：合理性（标签是否有视觉上下文支持）、密度（可见物体估计与存储数量的比例）、图覆盖率（簇的观测支持度是否过低）。
  - **重访规划器**：在源视点基础上，沿指向目标错误区域质心的方向，按固定步长（2.5m/4m）和安全间隙（2m）生成重访视点，不依赖全局障碍物地图。
  - **选择性合并**：同类且距离 <2m 的新旧检测视为同一物体进行替换或合并；被评论家标记为不合理、且重访时在该位置未观测到的物体被直接删除。
- **训练/优化目标**: 非端到端学习类工作，核心是基于启发式规则的诊断与更新机制。优化目标是使纠正后的记忆库 $H^{(e+1)}$ 在下游固定集合的 EQA 任务中得分优于纠正前的 $H^{(e)}$。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: 4 个户外 AirSim 地图（Hangar, Old Shipyard, Construction Site, Downtown West）。
  - **对比对象 (Baseline)**: Append-only updating（仅追加更新）、Replace clusters（直接替换簇）、Untargeted revisits（无目标/随机重访）。
  - **测试条件**: 引入两种视角退化条件（pitch-up 仰视、low-lateral 低视角侧转）以可控地模拟感知错误。
- **评价指标**: 固定集合的具身问答（EQA）得分（由 LLM judge 评分，1.0/0.5/0.0）；评论家诊断的区域级召回率（Recall）。
- **主要结果**: 
  - 单次纠正（Episode 1 到 2）使整体 EQA 得分从 0.306 提升至 0.531，在所有地图和退化条件下均有提升。
  - 相比 append-only，选择性合并在取得相近 EQA 提升（+0.295 vs +0.296）的同时，存储的物体数量减少了 13%–41%（平均 283 个 vs 391 个），有效控制了记忆膨胀。
  - 扩展到第 4 集时，所有地图的 EQA 表现均超过了未退化参考（undegraded reference）。
  - 消融实验表明，评论家的三个信号结合后区域召回率达 0.800；有指导的重访比同等预算下的无目标重访平均 EQA 增益更大（+0.154 vs +0.147）。

### 29. 🔥 [Learning to Live: A Step Toward Lifelong Embodied Intelligence] (学习生存：迈向终身具身智能的一步)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.00180` | [点击跳转](https://arxiv.org/abs/2611.00180)

**0. 论文标题**
- **英文标题**: Learning to Live: A Step Toward Lifelong Embodied Intelligence
- **中文标题**: 学习生存：迈向终身具身智能的一步
- **研究机构**: 原文未提及
- **一句话总结**: 提出 LIFE 框架，通过轻量级流式视觉门控、可塑性记忆和能力自主演化机制，让机器人在连续交互中持续观察、选择性记忆并发展出新能力，实现终身具身智能。

**1. 整体逻辑**
- **研究任务**: 构建终身具身智能体（Lifelong Embodied Agents），解决机器人在连续变化的物理环境中，如何持续观察、积累长期记忆，并自主发展出解决新问题的工具和技能。
- **研究动机**: 现有具身系统多围绕离散任务设计，无法应对物理世界的连续变化；全量处理视频流计算成本过高且内存冗余，而系统又必须保留足够证据以应对未来未知的问题。
- **本质改动**: 引入轻量级流式感知门控（RoboBeats）进行条件追踪和事件发现，结合保留原始图像的可塑性记忆（Plastic Memory），并通过探索-蒸馏-挂载（EDM）机制将解决问题的经验转化为可复用的工具，实现从“等待指令”到“主动感知并积累经验”的转变。
- **技术溯源**: 基于 Qwen3.5 系列模型（0.8B/2B/4B）构建 RoboBeats 门控；基于作者前期工作 ReSight 引入 Plastic Memory 和 EDM 机制；使用 Qwen3.8-27B 作为记忆写入和读取的大模型。

**2. 技术拆解**
- **核心方法**: 
  1. **RoboBeats**: 轻量级流式视觉门控，处理连续帧，评估自然语言条件是否成立或是否发生新事件，决定是否触发响应或写入记忆。
  2. **Plastic Memory**: 扁平化记忆结构，保存图像及结构化 JSON 记录（时间、位姿、语义字段），支持通过字段过滤和链接，并允许后续通过编程重新扫描图像提取新信息。
  3. **EDM (Explore-Distill-Mount)**: 探索-蒸馏-挂载机制，将解决特定问题时开发的有效方法（如新的检索或提取程序）提炼为可复用的工具、技能和记忆构建器。
- **关键细节**: 
  - **RoboBeats**: 输入为带时间戳的图像序列和条件描述，输出为每个条件的激活区间。采用因果注意力，支持多条件共享视觉表示以复用 KV cache。包含条件追踪（监控特定描述）和事件发现（固定查询“是否发生新事件”）两种模式。
  - **Plastic Memory**: 记忆表示为包含原始观察集、初始字段和扩展字段的集合。通过视图（View）将同一位置/方向的观察关联起来，支持历史重访和状态变化对比。
  - **EDM**: 编码智能体（Coding Agent）在探索阶段编写程序解决难题，蒸馏阶段去除硬编码并泛化为工具，挂载阶段注册到共享能力层供执行智能体（Execution Agent）调用。
- **训练/优化目标**: 
  - **RoboBeats**: 结合加权二元交叉熵损失（对区间边界赋予 3 倍权重以强调状态切换）和软交并比损失（监督正区间），总损失为两者之和。使用 LoRA 微调 Qwen3.5 的语言模型部分，冻结视觉编码器。通过读取 true/false 两个 token 的 logits 计算概率，避免逐帧生成文本。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 自建的 SSS-Bench（用于评估事件发现和记忆问答），以及公开的 OVO-Bench, Charades-STA, StreamingBench, SPOT-Bench, ESTP-Bench, GOAT-core, OC-NaVQA, FindingDory。
  - **对比对象**: 通用 VLM（如 Qwen2-VL, InternVL3.5 等）、流式视频模型（如 OneStreamer, MMDuet, JoyAI-VL 等）、以及未微调的基座模型。
  - **系统测试**: 24 小时真实机器人视频回放案例研究。
- **评价指标**: 
  - 条件追踪：AUROC, Recall, R@0.5, First-trigger accuracy, T-F1@5, ESTP-F1。
  - 事件发现/记忆问答：Accuracy (SSS-Bench, OVO-Bench BT Avg., EPM+ASI Avg.)。
  - 能力扩展 (EDM)：Success rate, Position/Time error, Token cost。
- **主要结果**: 
  - **条件追踪**: RoboBeats-2B 在 held-out 视频上达到 0.915 AUROC 和 73.6% Recall（基座模型仅 0.612 和 14.1%）。在 Charades-STA (57.3% vs 7.4%)、StreamingBench (56.0% vs 22.8%)、SPOT-Bench (43.8 vs 27.5) 上大幅超越基座模型和多数通用 VLM。
  - **事件发现与记忆**: 在 SSS-Bench 上，相同写入预算下，RoboBeats-2B 比均匀采样和 27B 基线分别高出 5.2 和 9.9 个百分点（观察时长≥20分钟时）。相比全量写入，将写入 token 减少了约 45%（相比全帧）或 99.2%（相比 OneStreamer PHCM），且问答准确率保持相当或更优。在 OVO-Bench 上结合 OneStreamer-4B reader 达到 78.4% BT Avg.。
  - **能力扩展 (EDM)**: 在 FindingDory 的 held-out 剧集上，使用 EDM 后整体成功率从 37.5% 提升至 65.8%，每次查询 token 消耗从 128.8k 降至 39.4k。在机器人记忆查询中，成功率从 12/30 提升至 30/30，平均工具调用从 5.10 降至 1.20。
  - **24小时案例**: 集成系统能准确回答关于人、物、活动的日常问题，比直接从原始录像处理的编码智能体更快更准。

### 30. 🔥 [Should the Action Expert Train the VLM? Action-Token Supervision and Gradient Routing in Mixture-of-Transformer VLAs] (动作专家应该训练VLM吗？混合Transformer VLA中的动作Token监督与梯度路由)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.05249` | [点击跳转](https://arxiv.org/abs/2611.05249)

**0. 论文标题**
- **英文标题**: Should the Action Expert Train the VLM? Action-Token Supervision and Gradient Routing in Mixture-of-Transformer VLAs
- **中文标题**: 动作专家应该训练VLM吗？混合Transformer VLA中的动作Token监督与梯度路由
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过控制变量实验解耦了VLA训练中的“动作Token监督”与“梯度路由”策略，证明在缺乏动作Token监督时，允许动作专家梯度回传（耦合）能显著提升控制性能，挑战了当前流行的“梯度绝缘”默认训练范式。

**1. 整体逻辑**
- **研究任务**: 优化Mixture-of-Transformer架构的视觉-语言-动作（VLA）模型的训练策略，具体探究连续动作专家的损失是否应该通过梯度回传更新VLM主干（梯度路由），以及离散动作Token监督在其中的作用。
- **研究动机**: 当前主流的VLA训练范式（如Knowledge Insulation）通常使用stop-gradient阻断动作专家的梯度以保护VLM的预训练能力（绝缘），但同时会辅以离散动作Token的监督。这两种机制在以往研究中是纠缠在一起的，尚不清楚“绝缘”策略的成功究竟是因为阻断了梯度，还是因为依赖了动作Token监督作为替代的动作学习信号。
- **本质改动**: 将“是否使用离散动作Token监督”和“是否允许动作专家梯度回传VLM（耦合/绝缘）”进行正交解耦，在自动驾驶和机器人操作任务中独立评估这两个因素及其交互作用，而非直接对比不同系统。
- **技术溯源**: 基于 Mixture-of-Transformers 架构（如 $\pi_0$, $\pi_{0.5}$, MolmoAct2, Alpamayo），使用预训练VLM（如 Qwen3-VL-2B-Instruct, PaliGemma, Molmo2-ER）搭配 Flow-matching 动作专家。

**2. 技术拆解**
- **核心方法**: 设计四组控制变量实验（2x2），交叉组合“动作Token监督（On/Off）”与“梯度路由（Coupled/Insulated）”。在 Coupled 设置下，动作专家的 flow-matching loss 梯度直接回传更新 VLM 的 K/V cache；在 Insulated 设置下，使用 stop-gradient 阻断回传。同时评估了三种训练调度（Concurrent, VLM-First, Expert-First）。
- **关键细节**: 
  - 输入输出与结构：VLM 与动作专家通过逐层 K/V 表示交互（专家 attend VLM 的 K/V，VLM 不 attend 专家）。自动驾驶预测加速度和曲率控制对（积分成 waypoints）；机器人预测关节位置和夹爪值。离散动作 Token 使用 FAST 等压缩表示。
  - 规模：自动驾驶实验训练 300k 步；机器人 $\pi_{0.5}$ 实验训练 400k 步，MolmoAct2 实验训练 300k 步。
- **训练/优化目标**: 联合损失函数 $\mathcal{L} = \mathcal{L}_{CE} + \mathcal{L}_{flow}$。$\mathcal{L}_{CE}$ 包含 VQA、推理和结构 Token 的交叉熵，以及可选的未来动作 Token 交叉熵（通过指示变量控制 On/Off）；$\mathcal{L}_{flow}$ 为动作专家的 Rectified Flow Matching 损失。两者权重均为 1。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自动驾驶开环使用 Physical AI Autonomous Vehicles dataset (Public Golden 和 OOD splits)，闭环使用 AlpaSim 仿真器；机器人操作使用 DROID, PolaRiS 等数据，在 PolaRiS 仿真环境（BlockStackKitchen, FoodBussing, PanClean）中评估。
  - 对比对象（baseline）：主要对比内部解耦的四种设置（Insulated/Coupled $\times$ Tokens on/off），并参考了 $\pi_{0.5}$ (CoVeR) 和 MolmoAct2 的官方/公开复现结果。
- **评价指标**: 
  - 自动驾驶开环：平均位移误差（ADE）和最小平均位移误差（minADE）。
  - 自动驾驶闭环：AlpaSim 路线进度（Route progress）、碰撞率等。
  - 自动驾驶推理：Lingo-Judge 评估的推理轨迹通过率。
  - 机器人操作：归一化任务进度（Normalized task progress，基于 rubric criteria 达成率）。
- **主要结果**: 
  - 开环自动驾驶：当有动作 Token 监督时，绝缘和耦合的 ADE 差异很小；当**没有**动作 Token 监督时，耦合相比绝缘将轨迹预测误差（ADE）降低了约 25%（Public Golden 降 26%，OOD 降 24%）。
  - 闭环自动驾驶：在 Concurrent 训练下，无论是否有 Token 监督，耦合都能提升路线进度。特别是没有 Token 监督时，路线进度从 0.425 提升至 0.601（相对提升约 41%）。
  - 机器人操作：在 $\pi_{0.5}$ 和 MolmoAct2 复现中，耦合训练在有无 FAST 监督时均提升了任务进度，且在**没有** FAST 监督时提升更显著（例如 $\pi_{0.5}$ 中无 FAST 进度从 10.3% 提升至 32.9%）。
  - 结论：动作 Token 监督和专家梯度回传提供了部分可替代的动作学习信号。“梯度绝缘”并非默认的最佳训练策略，其价值高度依赖于是否使用了动作 Token 监督以及具体的评估场景。

### 31. 🔥 [HiLo-WAM: Decoupling Long-Horizon Task Evolution and Local Dynamics in World Action Models] (HiLo-WAM：在世界动作模型中解耦长时任务演进与局部动态)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.05023` | [点击跳转](https://arxiv.org/abs/2611.05023)

**0. 论文标题**
- **英文标题**: HiLo-WAM: Decoupling Long-Horizon Task Evolution and Local Dynamics in World Action Models
- **中文标题**: HiLo-WAM：在世界动作模型中解耦长时任务演进与局部动态
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种双时间尺度的世界动作模型，通过解耦长时任务演进和局部交互动态，并配合渐进式推理，大幅提升了机器人长序列操作任务的性能和推理效率。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人操作领域的长序列视觉-语言-动作（VLA）建模，具体为构建世界动作模型（WAM）以联合预测未来视觉动态并生成机器人控制动作。
- **研究动机**: 现有的 WAM 多关注密集的短时视觉动态，缺乏长程任务上下文；如果直接拉长预测窗口，不仅会增加计算量和预测不确定性，还会把“任务级宏观演进”和“细粒度局部交互”混为一谈，导致模型无法有效区分和利用这两种不同时间尺度的信息来指导动作生成。
- **本质改动**: 将视觉世界建模解耦为“稀疏的长时任务流”和“密集的局部动态流”两个互补分支，在统一的双 DiT 架构中通过结构化非对称注意力机制进行跨流交互，并引入渐进式推理策略来降低多尺度建模带来的计算开销。
- **技术溯源**: 视觉基座采用 Wan2.2-5B（包含 Video DiT 和 Video VAE），语言条件采用预训练的 T5 编码器，整体网络架构遵循 Mixture-of-Transformers (MoT) 的 WAM 范式（如 Fast-WAM）。

**2. 技术拆解**
- **核心方法**: 
  1. **多尺度时间建模**：构建稀疏长时视觉流（按时间步长 $k$ 下采样，捕捉历史上下文和粗略未来演进）和密集局部视觉流（逐帧捕捉短时机器人-物体交互）。
  2. **结构化跨流注意力**：设计非对称注意力掩码。长时流内部双向注意；局部流可注意长时流的历史和近期未来，防止局部控制直接依赖不确定的远期未来；动作流可注意两个视觉流及本体状态。
  3. **渐进式推理**：包含部分去噪（为不同流分配不同去噪步数并缓存特征）、联合去噪（早期各流同步去噪交互，后期动作流利用缓存特征）和动态跳步（利用相邻步预测的余弦相似度跳过冗余计算）。
- **关键细节**: 
  - **输入输出**：输入当前图像、本体状态、语言指令；输出动作序列（Action chunk，长度 $H=32$）及未来视觉轨迹。
  - **模型结构**：Dual-DiT 架构，包含一个共享的 Video DiT（30层，隐藏层 3072）和一个 Action DiT（30层，隐藏层 1024）。视频 VAE 时空压缩 patch 大小为 $1\times2\times2$。
  - **关键超参**：长时流历史/未来关键帧数 $m=8, n=8$，时间步长 $k=4$。动作与视频的采样频率比为 4。
- **训练/优化目标**: 采用联合 Flow-Matching 目标。对长时视觉流、局部视觉流和动作流分别计算 Flow Matching 损失（预测速度场），总损失为三者加权和（权重均为 1.0）。各流独立采样 flow time，以支持不同噪声水平下的训练和后续的渐进式推理。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：RoboTwin 2.0（50个双臂任务，包含 clean 和 randomized 设置）；RoboDojo（评估其中 8 个长时任务）。
  - **真机平台**：Fourier GR-3 人形机器人，执行 3 个长时双臂任务（Build House, Disassemble House, Disassemble Heart）。
  - **对比基线 (Baselines)**：VLA 类（$\pi_0$, $\pi_{0.5}$, StarVLA, LingBot-VLA 等）和 World-model 类（Fast-WAM, LingBot-VA, AHA-WAM, Motus 等）。
- **评价指标**: 
  - RoboTwin 2.0：平均成功率（%）。
  - RoboDojo：任务进度得分（Score）和平均成功率（%）。
  - 真机：进度得分（0-10）和成功率（%），分 In-domain 和 OOD（改变光照、背景、杂乱度）评估。
  - 效率：端到端推理延迟（ms）和加速比。
- **主要结果**: 
  - **RoboTwin 2.0**：平均成功率达 93.70%（Clean 93.87%, Rand 93.52%），比 Fast-WAM 高 1.85%，比 LingBot-VA 高 1.50%。
  - **RoboDojo 长时任务**：平均得分 17.43，成功率 6.50%，大幅领先 Fast-WAM（得分高 8.29）和 AHA-WAM（得分高 8.82）。
  - **真机实验**：In-domain 得分 6.9（成功率 33%），OOD 得分 6.0（成功率 30%），均显著优于 $\pi_{0.5}$ 和 Fast-WAM，展现出良好的鲁棒性。
  - **推理效率**：渐进式推理策略将单次推理延迟从 1114.46 ms 降至 380.02 ms，实现 2.93 倍加速，同时成功率从 93.54% 微升至 93.70%。

### 32. 🔥 [Trusting Imagined Futures: Auditing Imagined Rewards for VLA Post-Training] (信任想象的未来：审计视觉语言动作模型后训练中的想象奖励)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.04873` | [点击跳转](https://arxiv.org/abs/2611.04873)

**0. 论文标题**
- **英文标题**: Trusting Imagined Futures: Auditing Imagined Rewards for VLA Post-Training
- **中文标题**: 信任想象的未来：审计视觉语言动作模型后训练中的想象奖励
- **研究机构**: 原文未提及
- **一句话总结**: 提出TIF方法，通过多维奖励模型和风险审计器来过滤视频世界模型生成的想象轨迹中的“高分低能”样本，从而为VLA后训练筛选出更可靠的监督轨迹。

**1. 整体逻辑**
- **研究任务**: 视觉语言动作模型（VLA）后训练（行为克隆）中的监督轨迹选择与数据筛选。
- **研究动机**: 利用视频世界模型评估候选动作时，奖励模型容易对想象视频给出高分（奖励高估），但这些轨迹在真实执行中可能存在碰撞、不稳定等质量问题。直接用这些“想象出来”的高分轨迹做监督，会导致策略学到不良行为。
- **本质改动**: 不盲目相信世界模型给出的最高奖励，而是引入一个基于真实执行反馈训练的“风险审计器”，在奖励分数之外增加一道执行质量风险的门槛，只接受既高分又低风险的候选轨迹。
- **技术溯源**: 基于 OpenVLA（策略基座）、Cosmos-Predict2 2B（视频世界模型）、DINOv2-L（视觉特征提取），在 LIBERO 仿真环境上进行验证。

**2. 技术拆解**
- **核心方法**: 
  1. 多维奖励模型：从想象视频中预测5个执行质量维度（任务进度、目标正确性、操作质量、安全性、执行稳定性）和1个综合效用分数。
  2. 风险审计器：利用想象视频预测与真实执行结果的差异（高估模式）训练一个分类器，输入包括奖励预测分布、不确定性及视频诊断特征，输出风险分数。
  3. 可靠性门控选择：选出效用最高的候选轨迹，仅当其相对于原轨迹（Source）的优势大于阈值且审计风险低于阈值时，才替换原轨迹；否则保留原轨迹。选中的真实轨迹用于行为克隆。
- **关键细节**: 
  - 奖励模型使用DINOv2-L提取视频特征，融合指令和动作信息。
  - 审计器是一个约2.5万参数的MLP，输入包含奖励模型输出的效用、5个维度的分布/分数、不确定性统计，以及20个想象视频的诊断特征（如亮度、对比度、帧间变化等）。
  - 候选动作池包含5个分支：1个Source（原始演示或历史策略记录），1个贪心解码分支，3个采样分支。
  - 门控阈值设定为：优势（Advantage）> 0.15 且 审计风险（Audit risk）<= 0.50。
- **训练/优化目标**: 
  - 奖励模型损失：联合优化维度分类、效用回归和 pairwise ranking 损失（$\mathcal{L}_{R} = \mathcal{L}_{dim} + 0.5\mathcal{L}_{utility} + 0.1\mathcal{L}_{pair}$）。
  - 审计器损失：针对“高分低能”（预测效用>=0.58，真实效用<=0.42，且差值>=0.20）的二分类交叉熵损失。
  - 策略微调损失：标准的Behavior Cloning交叉熵损失，仅更新OpenVLA的LoRA参数。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO的4个套件（Spatial, Object, Goal, Long），构建了32,000对真实执行与想象视频用于训练奖励模型和审计器；自然候选集包含1,600个初始状态。
  - 对比对象（Baseline）：Original OpenVLA、Source（仅用原始轨迹训练）、Greedy、Random、Reward-only（仅按奖励排序）、Reward+Margin（加优势阈值），以及固定替换数量下的 Advantage ranking、Logistic regression risk 等。
- **评价指标**: 
  - 离线选择：Pairwise accuracy, Top-1 accuracy, 选中轨迹的平均真实效用（Utility），Better/Worse（替换后效用高于/低于Source的数量）。
  - 下游策略：任务成功率（Success rate），真实机器人任务中的干净完成率（Clean completion，即无碰撞、无错误交互的完成）。
- **主要结果**: 
  - 在LIBERO的4个套件上，TIF平均成功率达到76.25%，比直接用Source轨迹训练（73.25%）提升3.00个百分点。
  - 在固定奖励模型和优势阈值的情况下，加入审计门控比 Reward+Margin 进一步提升1.47个百分点。
  - 在固定替换数量的对比中，TIF选出的有益替换数量（58个）优于 Advantage ranking（47个）和 Logistic regression risk（52个）。
  - 在真实机器人（JAKA S5）的3个任务 recorded videos 测试中，TIF将选中轨迹的“干净完成”比例从 58.33% 提升至 70.00%。

### 33. 🔥 [Future Representation Distillation for Imagination-free World Action Models] (面向无想象世界动作模型的未来表征蒸馏)
- **研究机构**: `KAIST, New York University`
- **Arxiv ID**: `2611.04527` | [点击跳转](https://arxiv.org/abs/2611.04527)

**0. 论文标题**
- **英文标题**: Future Representation Distillation for Imagination-free World Action Models
- **中文标题**: 面向无想象世界动作模型的未来表征蒸馏
- **研究机构**: KAIST, New York University
- **一句话总结**: 提出 DreamFree，通过未来表征蒸馏将视频扩散模型的预测知识直接提取到视觉编码器中，使机器人无需在推理时生成未来视频，即可实现高精度、11Hz 的实时动作控制。

**1. 整体逻辑**
- **研究任务**: 基于预训练视频扩散模型的机器人控制（即世界动作模型 World Action Models, WAMs）。
- **研究动机**: 现有 WAM 依赖迭代视频去噪来预测未来画面以指导动作，导致推理成本极高；且视频预测一旦产生误差，会直接导致动作预测失败。
- **本质改动**: 摒弃推理时生成未来视频的做法。在训练阶段，通过“未来表征蒸馏”，让仅输入当前帧的视觉编码器直接学习冻结视频模型中蕴含的未来预测特征；推理时只需单次前向传播提取特征即可生成动作。
- **技术溯源**: 预训练视频扩散模型 (Wan2.2-5B / Wan2.2-A14B)、Diffusion Transformer (DiT)、Flow Matching、Perceiver。

**2. 技术拆解**
- **核心方法**: 两阶段训练框架。阶段一：利用未来表征蒸馏训练预测性视觉编码器；阶段二：基于蒸馏后的视觉特征训练动作解码模块。
- **关键细节**: 
  - **视觉编码器**：基于 Wan2.2 视频 DiT。使用结构化注意力掩码，强制当前帧 token 仅进行自注意力计算，不 attend 未来帧。
  - **蒸馏机制**：引入轻量级 Transformer decoder 作为 projector，将当前帧表征映射到 teacher 模型（冻结的视频扩散模型，输入加噪的未来帧）的时空 token 布局，对齐两者的特征。
  - **动作模块**：包含基于 Perceiver 的 readout module（通过交叉注意力提取动作相关的固定数量 token）和 1B 参数的 DiT action decoder（基于 flow matching 生成 action chunk）。
- **训练/优化目标**: 
  - **阶段一**：生成损失（Flow matching 正则化，保持视频生成能力） + 蒸馏损失（当前帧投影表征与 teacher 未来帧表征的负余弦相似度）。
  - **阶段二**：动作生成损失（Flow matching 预测 action chunk，冻结视觉编码器）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmarks**：LIBERO（仿真）、RoboCasa-Kitchen（仿真）、DROID（真实世界单臂）、ABC-130k（真实世界双臂）。
  - **对比对象 (Baselines)**：VLAs ($\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, GR00T-N1.5, FLARE)；WAMs (Motus, LingBot-VA, Fast-WAM, Cosmos Policy, DreamZero)。
- **评价指标**: 任务成功率 (Success Rate)、任务进度得分 (Task Progress)、推理延迟/控制频率 (Hz)。
- **主要结果**: 
  - **仿真表现**：LIBERO 平均成功率 98.6%（媲美 SOTA）；RoboCasa-Kitchen 14B 模型达 71.7%（大幅超越 Fast-WAM 的 44.7% 及其他 baseline）。
  - **真实世界 (DROID)**：平均成功率 64%（超越 DreamZero 的 56% 和 $\pi_{0.5}$ 的 16%），在柔性物体操作和连续重排等复杂任务上优势明显，且具备错误恢复能力。
  - **推理效率**：实现 11Hz 实时闭环控制，比生成视频的 DreamZero 快 17.8 倍，延迟与 $\pi_{0.5}$ 相当（1.1 倍）。
  - **扩展性与迁移**：证明了更大的视频基座（14B 对比 5B 提升 13.2%）和无标注视频数据能直接提升控制性能；支持通过无动作标注的视频（甚至跨具身 cross-embodiment 视频）进行零样本任务迁移。
