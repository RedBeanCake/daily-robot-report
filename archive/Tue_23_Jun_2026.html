            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [LaST-HD: Learning Latent Physical Reasoning from Scalable Human Data for Robot Manipulation] (LaST-HD：从可扩展的人类数据中学习潜在物理推理以用于机器人操作)
- **研究机构**: `北京大学、香港中文大学、Simplexity Robotics、Aether Tech`
- **Arxiv ID**: `2606.23685` | [点击跳转](https://arxiv.org/abs/2606.23685)

**0. 论文标题**
- **英文标题**: LaST-HD: Learning Latent Physical Reasoning from Scalable Human Data for Robot Manipulation
- **中文标题**: LaST-HD：从可扩展的人类数据中学习潜在物理推理以用于机器人操作
- **研究机构**: 北京大学、香港中文大学、Simplexity Robotics、Aether Tech

**1. 整体逻辑**
- **研究任务**: 利用人类手部示范数据训练机器人的视觉-语言-动作（VLA）模型，实现跨具身形态（如平行夹爪、灵巧手）的操作任务学习。
- **研究动机**: 机器人遥操作数据采集成本高，人类手部数据易获取但存在具身鸿沟。现有方法多在动作级或视觉特征级进行对齐，忽略了人类和机器人在物理动力学层面的内在一致性，导致模型对数据规模敏感且泛化能力受限。
- **本质改动**: 不直接模仿人类运动学，而是训练一个动作条件世界模型，将不配对的人类和机器人轨迹对齐到共享的“潜在物理推理空间”。用世界模型预测的物理后果作为监督信号，指导 VLA 模型的推理过程。同时设计低成本动捕手套采集数据，并采用两阶段渐进式训练策略。
- **技术溯源**: 视觉编码器基于 SigLIP-Large，语言模型基座基于 DeepSeek-LLM 1.5B，动作生成基于 Flow-matching，整体采用 Mixture-of-Transformers (MoT) 架构（参考 LaST0）。

**2. 技术拆解**
- **重点改进**: 
  1. **潜在物理对齐**：训练动作条件世界模型，提取其去噪最后一步的深层特征作为物理动力学表征，以此监督 VLA 的推理专家，实现跨具身的物理规律对齐。
  2. **硬件与数据**：开发 OOL Glove，用 IMU 追踪 21 个手部关键点，采集的原始人类手部数据可重定向给夹爪或灵巧手。
  3. **训练策略**：第一阶段混合人类-机器人数据联合训练；第二阶段在机器人执行失败的状态下，收集人类手部纠正数据进行在线微调（DAgger）。
- **架构细节**: 
  - **输入**：语言指令 + 384x384 的三视角图像（1个头戴，2个腕部）。
  - **视觉特征**：SigLIP-Large 提取后通过 MLP 投影。
  - **骨干网络**：DeepSeek-LLM 1.5B 的 24 层 decoder-only transformer，改为 MoT 结构，分为“推理专家”和“动作专家”。
  - **推理专家**：自回归预测潜在状态序列（Latent tokens）。
  - **动作专家**：通过 Flow-matching 预测动作块（Action chunk）。两者通过共享注意力机制传递知识。
- **核心 Loss**: 
  - **动作 Loss**：Flow-matching action loss ($\mathcal{L}_{act}$)。
  - **潜在推理 Loss**：推理专家预测的潜在 token 与世界模型提取的 Ground Truth 潜在 token 之间的余弦相似度损失 ($\mathcal{L}_{latent}$)。
  - **总 Loss**：$\mathcal{L}_{loss} = \mathcal{L}_{act} + \lambda \mathcal{L}_{latent}$。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：6 个真实世界任务（拧瓶盖、整理盒子、分拣水果、装袋拉链、倒水、夹取），涉及 3 种具身形态（Galaxea R1 Lite 双臂夹爪, Tianji Marvin 双臂夹爪, Tianji Marvin + WUJI 灵巧手）。每个任务 100 条机器人数据 + 50 条 OOL 手套数据。泛化场景（新位置、新物体、新背景）各补充 60 条人类数据。
  - **Baseline**：LaST0 (latent-CoT VLA), $\pi_{0.5}$ (VLA policy), Cosmos-Policy (world-action model)。
- **评价指标**: 任务完成成功率（Success rate），每个任务 20 次 rollout。
- **实验结果**: 
  - **域内表现**：LaST-HD 平均成功率 73%，高于 $\pi_{0.5}$ (62%)、Cosmos-Policy (52%) 和 LaST0 (63%)。在复杂任务（如分拣水果）上达到 95%。仅用混合数据训练的 LaST-HD (Mix-HD) 也能达到 68%，证明人类数据能有效补充物理先验。
  - **泛化表现**：在仅使用人类数据微调（不增加机器人数据）的情况下，LaST-HD 在新位置、新物体、新背景下的平均成功率分别达到 41%、58%、68%，大幅超越 $\pi_{0.5}$（最高 43%）和 LaST0（最高 58%）。
  - **在线纠正**：仅需 20 分钟（60 条轨迹）的 OOL 手套纠正数据，就能在新背景/新物体下达到 100% 成功率，新位置下从 60% 提升到 80%。

### 2. 🔥 [Learning to See While Learning to Act: Diffusion Models for Active Perception in Robot Imitation] (边看边学：用于机器人模仿学习中主动感知的扩散模型)
- **研究机构**: `Georgia Institute of Technology, Autodesk Research, NVIDIA`
- **Arxiv ID**: `2606.23625` | [点击跳转](https://arxiv.org/abs/2606.23625)

**0. 论文标题**
- **英文标题**: Learning to See While Learning to Act: Diffusion Models for Active Perception in Robot Imitation
- **中文标题**: 边看边学：用于机器人模仿学习中主动感知的扩散模型
- **研究机构**: Georgia Institute of Technology, Autodesk Research, NVIDIA

**1. 整体逻辑**
- **研究任务**: 存在视觉遮挡环境下的机器人模仿学习（视觉运动控制）。
- **研究动机**: 现有的模仿学习（包括扩散策略）都假设相机视角固定、环境完全可见。一旦目标被遮挡，被动感知就失效了。机器人需要主动移动相机去寻找目标，但现有方法要么把“看”和“动”割裂开，要么需要额外设计复杂的视角规划器，很难从有限的示范数据中同时学好这两件事。
- **本质改动**: 把“相机视角的移动”和“动作的去噪”绑定在同一个扩散过程里。在推理时，随着动作预测的不断清晰，相机也同步移动到能看清目标的角度，实现真正的“边看边动”。
- **技术溯源**: 基于 DDPM（去噪扩散概率模型）和 Diffusion Policy（扩散策略）。

**2. 技术拆解**
- **重点改进**: 将相机位姿的轨迹与扩散模型的时间步直接对齐。训练时，让模型学习从“全局大视角”到“目标特写视角”的平滑过渡；推理时，让相机跟着去噪过程主动调整位姿，去遮挡物后面找目标，不需要额外的视角规划网络或强化学习奖励。
- **架构细节**: 
  - **输入输出**：输入是当前相机位姿下的图像和带噪的 6-DoF 动作；输出是预测的噪声。注意，动作是在**相机坐标系**下表示的，而不是世界坐标系。
  - **相机位姿设计**：扩散步 $t=T$ 对应全局视角，$t=0$ 对应由目标动作推导出的目标中心视角（相机对准动作执行点）。中间时间步的相机位姿通过位置线性插值和旋转 SLERP（球面线性插值）平滑过渡。
  - **推理机制（主动视角推理）**：从全局视角开始，每去噪一步，就用当前预测的动作算出新的目标相机位姿，驱动相机移动拍新照片，再输入模型继续去噪。最后通过多次采样，选择相机移动轨迹最平滑（方差最小）的那次结果执行。
- **核心 Loss**: 标准的扩散模型 MSE Loss（预测噪声与真实噪声的均方误差），没有引入额外的辅助任务或视角监督信号。

**3. 实验结果**
- **数据集和baseline**: 
  - **Ravens**：4个带严重遮挡的任务（如 bin-picking, box-search）。Baseline 包括单/多视角固定 BC/Diffusion、被动选视角（计算去噪熵）、只能平移缩放的 C3DM。
  - **RLBench**：9个常规及遮挡任务。Baseline 包括 PerAct, RVT, RVT-2 等依赖多视角或点云输入的 SOTA 方法。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - **遮挡任务（Ravens）**：See2Act 平均成功率达 91%。在完全被遮挡的 box-search 任务中达到 100%（所有 baseline 均为 0%），比只能平移缩放的 C3DM 和被动选视角方法高出 70% 以上，证明主动改变视角是解决遮挡的关键。
  - **常规任务（RLBench）**：平均成功率 81.1%，超越了 RVT-2 (77.9%) 等依赖多视角或点云的复杂方法，证明单相机主动移动比堆砌固定视角更有效。
  - **真机实验**：仅在仿真（数字孪生）中用 50 条数据训练，零样本迁移到真机（带遮挡的抓取放置任务），成功率达到 95%。

### 3. 🔥 [dVLA-RL: Reinforcement Learning for Discrete Diffusion Vision-Language-Action Models (注：摘要未提供完整标题，此为根据核心内容推断的标准命名)] (离散扩散视觉-语言-动作模型的强化学习 (dVLA-RL))
- **研究机构**: `摘要未提及`
- **Arxiv ID**: `2606.23623` | [点击跳转](https://arxiv.org/abs/2606.23623)

**0. 论文标题**
- **英文标题**: dVLA-RL: Reinforcement Learning for Discrete Diffusion Vision-Language-Action Models (注：摘要未提供完整标题，此为根据核心内容推断的标准命名)
- **中文标题**: 离散扩散视觉-语言-动作模型的强化学习 (dVLA-RL)
- **研究机构**: 摘要未提及

**1. 整体逻辑**
- **研究任务**: 优化离散扩散视觉-语言-动作模型（dVLA）的机器人操作策略。
- **研究动机**: 现有的 dVLA 仅依赖监督微调（SFT），没有利用强化学习（RL）来进一步提升策略性能。而在 dVLA 中应用 RL 存在一个根本的数学障碍：dVLA 生成的最终动作的边缘概率是难以直接计算的（intractable），导致常规的 RL 算法无法直接套用。
- **本质改动**: 提出 dVLA-RL 方法。放弃了计算难以求解的最终动作边缘概率，转而优化“采样生成路径的联合概率”。将多步去噪过程建模为马尔可夫决策过程（MDP），用每一步转移概率的乘积来表示整条路径的概率。同时，引入了根据任务复杂度动态调整去噪步数的调度策略。
- **技术溯源**: 基于离散扩散视觉-语言-动作模型（dVLA）。该基座通过掩码生成建模（Masked Generative Modeling），将视觉、语言和动作统一映射到同一个离散 token 空间中。

**2. 技术拆解**
- **重点改进**: 
  1. 提出了基于路径联合概率的 RL 优化目标，绕开了 dVLA 最终动作边缘概率不可解的问题。
  2. 提出了统一的去噪步数调度方法（Step Scheduling），能够根据具体任务的难度自适应分配去噪步数，在成功率和计算效率之间取得平衡。
- **架构细节**: 
  - **输入/输出**: 输入为视觉、语言和动作的离散 token 序列；输出为经过多步掩码去噪后生成的动作 token。
  - **模型结构**: 核心在于将 dVLA 的迭代去噪过程重新建模为马尔可夫决策过程（MDP）。这种轨迹级别（trajectory-level）的建模方式天然支持可变长度的去噪步数，为多任务学习中的步数调度提供了基础。
- **核心 Loss**: 采用 RL 的优化目标（Objective/Reward）。主目标不再是单步动作的概率，而是整条采样生成路径的联合概率（即逐步转移概率的乘积）。结合任务成功率奖励和计算效率（通过步数调度控制）进行联合优化。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO, RoboTwin 2.0。
  - **Baseline**: 监督微调（SFT）训练的 dVLA 基线模型，以及强大的世界-动作模型（World-Action Model）基线。
- **评价指标**: 任务成功率（Success Rate），同时兼顾推理的计算效率（通过去噪步数体现）。
- **实验结果**: 
  - 在 LIBERO 数据集上，该方法取得了 **99.7%** 的极高成功率。
  - 在 RoboTwin 2.0 数据集上，相比 SFT 基线，成功率大幅提升了 **30.6%**，并且性能与强大的 World-Action Model 基线处于同一竞争水平。

### 4. 🔥 [RECALL: Recovery Experience Collection for Active Lifelong Learning in Vision-Language-Action Models] (RECALL：用于视觉-语言-动作模型主动终身学习的恢复经验收集)
- **研究机构**: `Yale University`
- **Arxiv ID**: `2606.23617` | [点击跳转](https://arxiv.org/abs/2606.23617)

**0. 论文标题**
- **英文标题**: RECALL: Recovery Experience Collection for Active Lifelong Learning in Vision-Language-Action Models
- **中文标题**: RECALL：用于视觉-语言-动作模型主动终身学习的恢复经验收集
- **研究机构**: Yale University

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的持续微调与终身学习。
- **研究动机**: 现有的VLA微调多采用被动模仿学习（从任务初始状态收集数据，失败了再补），这种方式效率低、缺乏针对性，且容易在模型已经擅长的状态上浪费人力。
- **本质改动**: 引入主动学习，利用不确定性估计找出模型预测把握不准的中间状态，直接从这里开始收集专家的“恢复”轨迹；同时引入持续学习策略（数据回放和正则化）来解决只微调新数据导致的灾难性遗忘问题。
- **技术溯源**: 基于自回归VLA模型 $\pi_0$-FAST，使用 INSIGHT 进行推理时的不确定性量化，在 LIBERO 仿真环境上验证。

**2. 技术拆解**
- **重点改进**: 
  1. 主动数据收集：用 INSIGHT 预测的高不确定性状态代替传统的初始状态来触发数据收集。分为 Online（只收集轨迹中第一个不确定状态）和 Offline（收集所有不确定状态）。
  2. 持续学习微调：对比了仅用新数据微调、数据回放（Replay，包括全量、特定任务集、目标子集回放）和正则化（EWC、低学习率）对防止灾难性遗忘的实际效果。
- **架构细节**: 
  - **输入**: 语言指令、视觉观测、机器人状态。
  - **输出**: 自回归预测的连续动作 token 块。
  - **模型结构**: $\pi_0$-FAST 基座，使用 next-token prediction 目标训练。INSIGHT 作为外挂模块，提取 token 级别的概率特征（熵、对数概率等）来判断当前状态是否需要人类干预。
- **核心 Loss**: 
  - **主 Loss**: 标准的自回归交叉熵损失（Cross-Entropy）。
  - **辅助 Loss**: EWC 损失（通过 Fisher 信息矩阵惩罚对旧任务重要参数的改变，限制参数更新幅度）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO-10 仿真数据集（包含10个操作任务）。
  - **baseline**: 被动从初始状态收集数据、仅用新数据微调（New-only）、标准学习率微调。
- **评价指标**: 
  - **整体成功率**: 10个任务的平均成功率。
  - **收集任务成功率**: 用于收集数据的5个任务的成功率（衡量新任务学习效果）。
  - **保留任务成功率**: 未收集数据的另外5个任务的成功率（衡量是否发生灾难性遗忘）。
- **实验结果**: 
  1. **主动收集优于被动收集**: 从不确定状态开始收集数据，整体成功率从被动收集的 60.2% 提升到 72.4%，证明挑难的数据收集更高效。
  2. **Online 收集效率最高**: Online（只从第一个不确定状态收集）和 Offline（收集所有不确定状态）最终效果没有显著差异，但 Online 需要的数据量更少。
  3. **只微调新数据会导致严重遗忘**: 如果只用新收集的数据微调，保留任务成功率会暴跌，证明恢复数据分布太窄，无法维持模型原有的通用能力。
  4. **数据回放（Replay）是目前的最优解**: 低学习率和 EWC 能缓解遗忘，但会牺牲对新数据的适应能力（收集任务成功率低）。数据回放效果最好，全量回放和 LIBERO-10 回放都能保持很好的整体性能（72.4% / 68.6%），而只回放相关任务的“目标回放”会导致未收集任务的性能下降。

### 5. 🔥 [KEMO: Event-Driven Keyframe Memory for Long-Horizon Robot Manipulation with VLA Policies] (KEMO：用于VLA策略长时程机器人操作的事件驱动关键帧记忆)
- **研究机构**: `香港具身智能实验室 (Hong Kong Embodied AI Lab), 香港中文大学, xdof.ai, 电子科技大学, 上海交通大学`
- **Arxiv ID**: `2606.23589` | [点击跳转](https://arxiv.org/abs/2606.23589)

**0. 论文标题**
- **英文标题**: KEMO: Event-Driven Keyframe Memory for Long-Horizon Robot Manipulation with VLA Policies
- **中文标题**: KEMO：用于VLA策略长时程机器人操作的事件驱动关键帧记忆
- **研究机构**: 香港具身智能实验室 (Hong Kong Embodied AI Lab), 香港中文大学, xdof.ai, 电子科技大学, 上海交通大学

**1. 整体逻辑**
- **研究任务**: 长时程、多阶段的双臂机器人操作任务（如交换食物、找特定方块、做三明治等，单条轨迹长达800-2800步）。
- **研究动机**: 长时程任务中经常出现“阶段歧义”（当前画面相似，但处于不同执行阶段，需要不同的动作）。现有的记忆方法要么存全量帧导致信息冗余或压缩时丢失关键信息，要么只存最近几帧导致丢失早期关键事件，或者依赖VLM做任务分解导致推理慢且有幻觉风险。需要一种轻量、直接保留关键状态变化的记忆机制。
- **本质改动**: 设计了一个即插即用的“事件驱动关键帧记忆”模块。利用机器人关节减速和画面实质变化自动提取关键帧存入记忆库，通过交叉注意力注入给VLA；并在训练时给关键帧附近的动作预测加大Loss权重，让模型更关注状态转换时刻。
- **技术溯源**: 基于 VLA 基座 $\pi_{0.5}$，视觉特征提取使用 SigLIP（基座自带的主视觉编码器）和 DINOv2（冻结用于关键帧视觉去重过滤）。

**2. 技术拆解**
- **重点改进**: 
  1. **事件驱动的关键帧检测**：结合运动学（关节移动变慢时得分高）和视觉（用DINOv2算特征距离过滤掉没发生实质画面变化的假关键帧）来提取真正代表任务状态改变的关键帧。
  2. **轻量级记忆融合**：关键帧特征经过空间池化大幅压缩后，通过交叉注意力与当前帧融合，并引入门控机制控制注入量，防止训练初期记忆噪声干扰基础策略。
  3. **关键帧一致性训练**：在训练阶段，对检测到的关键帧附近时间步的Loss赋予更高权重。
- **架构细节**: 
  - **输入输出**：输入多视角RGB图像、机器人本体感觉状态、语言指令；输出动作块（Action chunk）。
  - **关键帧检测**：计算滑动窗口内的关节位移，位移越小事件显著性得分越高，寻找局部峰值作为候选；用冻结的DINOv2计算候选帧与上一个关键帧的全局特征余弦距离，大于阈值才保留为最终关键帧。
  - **记忆库与融合**：记忆库保存最近 $K$ 个关键帧。每个关键帧用SigLIP编码后做4x4空间平均池化（从256个token降维到16个），加上可学习的时序位置编码。当前帧token做Query，记忆库token做Key/Value进行Masked Cross-Attention。输出通过一个线性投影+sigmoid门控（初始化负偏置）与当前帧残差相加。此过程不改变原VLA语言模型的输入序列长度。
- **核心 Loss**: 主 Loss 是 Flow-matching loss（动作预测的流匹配损失）。改进点在于引入了基于关键帧的加权机制：在关键帧前后 $\delta$ 窗口内的时间步，loss 权重乘以 $\lambda$ ($\lambda > 1$)，强迫模型在关键状态转换点学得更准。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：真实世界双臂操作数据集，包含6个任务（Swap Foods, Find Block, Cover Blocks, Box Refill, Make Sandwich, Drawer Items Replacement），轨迹时长28到95秒。
  - **Baseline**：无记忆的 $\pi_{0.5}$ (memory-free baseline)，以及密集记忆基线 MemoryVLA。
- **评价指标**: 
  - **TSR (Task Success Rate)**：整体任务成功率。
  - **SCR (Stage Completion Rate)**：阶段完成率（成功完成的子任务比例）。
- **实验结果**: 
  - 对比无记忆 $\pi_{0.5}$：KEMO 的 TSR 提升了 23.6%，SCR 提升了 34.1%。
  - 对比 MemoryVLA：KEMO 的 TSR 提升了 50.0%，SCR 提升了 60.9%。
  - 消融实验（以 Cover Blocks 任务为例）：去掉门控记忆融合会导致 TSR 和 SCR 分别下降 75.0% 和 87.5%；去掉关键帧对齐的 loss 加权会导致分别下降 50.0% 和 45.8%。此外，事件驱动采样策略显著优于均匀采样和仅保留最近帧的策略。

### 7. 🔥 [Flowing With Purpose: Latent Action Guided Flow Matching Policies For Robotic Manipulation] (基于潜在动作引导的流匹配机器人操作策略)
- **研究机构**: `法国里昂中央理工学院 (École Centrale de Lyon) / LIRIS实验室`
- **Arxiv ID**: `2606.23420` | [点击跳转](https://arxiv.org/abs/2606.23420)

**0. 论文标题**
- **英文标题**: Flowing With Purpose: Latent Action Guided Flow Matching Policies For Robotic Manipulation
- **中文标题**: 基于潜在动作引导的流匹配机器人操作策略
- **研究机构**: 法国里昂中央理工学院 (École Centrale de Lyon) / LIRIS实验室

**1. 整体逻辑**
- **研究任务**: 机器人操作中的行为克隆（根据视觉图像、语言指令和本体感觉，预测未来的机器人动作序列）。
- **研究动机**: 现有的流匹配（Flow Matching）策略在去噪生成动作时，起点都是同一个固定的标准正态分布。但机器人动作空间是多模态且方差不同的（比如简单的直线抓取和复杂的长序列操作，动作分布差异很大）。用单一的全局高斯先验作为起点，会导致模型需要学习高度纠缠的向量场，限制了训练效率和最终的控制性能。
- **本质改动**: 把流匹配去噪起点的“单一标准高斯分布”，替换成了“由潜在动作（Latent Action）索引的多个可学习的自适应高斯分布库”。先预测当前观察属于哪种离散的运动基元，再从对应的专属分布里采样噪声作为起点，从而缩短传输路径，减少向量场纠缠。
- **技术溯源**: 基于 Flow Matching (条件流匹配), Latent Action Model (LAM, 潜在动作模型), DiT (Diffusion Transformer)。

**2. 技术拆解**
- **重点改进**: 
  1. 引入多先验库：用 $K$ 个可学习的高斯分布 $\mathcal{N}(\mu_k, \Sigma_k)$ 替代单一的标准正态分布 $\mathcal{N}(0, I)$。
  2. 潜在动作引导：利用预训练的LAM提取离散的运动基元（Codebook）。策略网络根据当前视觉观察，预测出一个离散的动作索引 $k$。
  3. 自适应初始化：根据预测的索引 $k$，从先验库中取出对应的均值 $\mu_k$ 和方差 $\Sigma_k$ 来生成初始噪声。这让去噪过程直接从与当前粗粒度动作意图对齐的分布开始。
- **架构细节**: 
  - **输入**: 多模态输入，包括RGB图像、自然语言任务描述、机器人本体感觉状态。
  - **结构**: 采用 Encoder-Decoder 架构。Encoder 处理多模态输入（图像用预训练编码器，文本用冻结编码器），通过 Transformer 输出隐藏状态，并预测离散动作索引 $k$（分类头）。Decoder 是 DiT，通过交叉注意力接收 Encoder 的特征，输入是带噪的动作序列。
  - **规模**: 策略模型参数量约 0.11B（1.1亿）。
- **核心 Loss**: 
  - **主 Loss**: 自适应流匹配损失（Adaptive Flow Matching Loss），用于回归去噪向量场。
  - **辅助 Loss 1**: 分类交叉熵损失（CCE），监督 Encoder 预测的离散动作索引与 LAM 提取的真实潜在动作保持一致。
  - **辅助 Loss 2**: KL散度正则化，限制学习到的先验分布不要偏离标准正态分布太远，防止过拟合和训练初期不稳定。

**3. 实验结果**
- **数据集和baseline**: 
  - **真实世界**: 4个操作任务（放盘子、开抽屉放螺丝刀、扔易拉罐、叠碗），每个任务50个演示。Baseline 对比了 ACT (0.05B) 和 $\pi_0$ (3.3B 的 VLA 模型)。
  - **仿真环境**: LIBERO 仿真平台，包含 4个基础套件（Spatial, Object, Goal, Long 共40个任务）和 LIBERO-90（90个独立任务）。Baseline 对比了 DP, Octo, OpenVLA, UniVLA, SmolVLA, ACT 以及标准 FM。
- **评价指标**: 
  - 真实世界：成功率（Success Rate，二值指标）和 完成度得分（Completion Score，0到1的连续指标，表示任务完成的百分比）。
  - 仿真环境：成功率（Success Rate）。
- **实验结果**: 
  - **真实世界**: LAFM (0.11B) 平均成功率达到 86.7%，比标准 FM (63.3%) 大幅提升 23.4%，比 3.3B 的 $\pi_0$ (71.7%) 高 15.0%。完成度得分也显著领先（93.9% vs $\pi_0$ 的 82.9%）。
  - **LIBERO 4 suites**: 标准 FM 和 ACT 在这里已经接近天花板（95%以上），LAFM 平均成功率为 96.5%，比标准 FM (95.4%) 有约 1% 的稳定提升，超过了 $\pi_0$ (86.0%) 和 SmolVLA (88.8%)。
  - **LIBERO-90**: LAFM 成功率达到 93.0%，大幅超越标准 FM (82.6%) 和 ACT (86.2%)，并且超过了参数量大30倍的 $\pi_0$ (92.1%)。

### 8. 🔥 [IOI: Decoupling Kinematics and Physics for Interactive World Models] (IOI：为交互式世界模型解耦运动学与物理动力学)
- **研究机构**: `北京人形机器人创新中心 (Beijing Innovation Center of Humanoid Robotics), 北京大学 (Peking University)`
- **Arxiv ID**: `2606.23296` | [点击跳转](https://arxiv.org/abs/2606.23296)

**0. 论文标题**
- **英文标题**: IOI: Decoupling Kinematics and Physics for Interactive World Models
- **中文标题**: IOI：为交互式世界模型解耦运动学与物理动力学
- **研究机构**: 北京人形机器人创新中心 (Beijing Innovation Center of Humanoid Robotics), 北京大学 (Peking University)

**1. 整体逻辑**
- **研究任务**: 构建动作条件的交互式视频世界模型，用于具身智能的策略学习与评估（即根据历史图像和动作序列，生成未来的视频帧）。
- **研究动机**: 现有的纯数据驱动世界模型（直接把动作和图像扔进网络）缺乏显式的物理结构约束。这会导致两个致命问题：一是动作偏差（累积误差让生成的机械臂动作偏离控制指令）；二是状态不合理（生成的视频里会出现物体穿透、诡异变形等违背物理常识的现象）。
- **本质改动**: 将“确定性的机器人运动学”与“随机性的环境物理交互”解耦。不让神经网络隐式去猜机械臂的几何结构，而是直接用URDF和动作序列算出精确的机械臂3D轨迹，渲染成多视角正交投影图作为先验条件，喂给视频生成模型，让生成模型专心去学环境的物理交互和视觉变化。
- **技术溯源**: 基于预训练的潜在空间视频扩散模型（DiT架构 + Flow Matching），条件注入模块参考了 VACE (Video Any-space Context Editing) 的设计。

**2. 技术拆解**
- **重点改进**: 设计了一套不依赖相机外参的运动学先验提取与注入机制。通过正交投影避免了透视投影带来的深度畸变和外参标定误差，并通过专门的MKAI模块将几何先验无损注入到冻结的生成主干中。
- **架构细节**: 
  - **输入输出**: 输入为历史观测视频帧、未来动作序列和机器人URDF模型；输出为未来视频帧。
  - **运动学提取**: 根据动作算关节角，用URDF正运动学算出3D连杆位姿。为了免去相机外参标定，直接把3D模型渲染成前、侧、顶三个视角的2D正交投影图。
  - **MKAI注入模块**: 包含三个子模块。1) *融合嵌入器*：用轻量MLP把三视图的VAE特征融合成统一的几何表示；2) *对齐嵌入器*：用3D卷积把特征切块并映射到DiT的Token空间；3) *运动学Block*：包含自注意力和与观测特征的交叉注意力，最后通过零初始化的门控权重，把特征加到冻结的DiT主干网络里，保证不破坏原模型的生成能力。
- **核心 Loss**: 标准的 Flow Matching Loss。只对未来的视频帧加噪并计算速度场重建损失，历史帧作为固定条件。没有引入额外的辅助重建Loss。

**3. 实验结果**
- **数据集和baseline**: 在 RoboTwin 2.0 仿真平台上测试。对比的 Baseline 是 IRASim 和 Ctrl-World。
- **评价指标**: 视频生成质量和物理一致性指标，包括 PSNR、SSIM、LPIPS（越低越好）和 FVD（越低越好）。
- **实验结果**: 全面优于 Baseline。以“Move Can Pot”任务为例，IOI的PSNR达到30.41（Baseline最高29.66），FVD大幅降至89.43（Baseline最低214.81），画面清晰度和时序一致性显著提升。此外，IOI在OOD（分布外）任务上零样本泛化能力更强；作为策略评估器，其给出的成功率与真实物理仿真器高度一致；在真机实验中，纯用IOI合成数据训练的策略，成功率媲美用真实遥操作数据训练的策略。

### 9. 🔥 [Causal Reward World Models: Zero-shot Reward Design for Automated Skill Generation] (因果奖励世界模型：用于自动技能生成的零样本奖励设计)
- **研究机构**: `中国科学院自动化研究所（牵头），合肥工业大学，安徽大学，中国矿业大学（北京）`
- **Arxiv ID**: `2606.23280` | [点击跳转](https://arxiv.org/abs/2606.23280)

**0. 论文标题**
- **英文标题**: Causal Reward World Models: Zero-shot Reward Design for Automated Skill Generation
- **中文标题**: 因果奖励世界模型：用于自动技能生成的零样本奖励设计
- **研究机构**: 中国科学院自动化研究所（牵头），合肥工业大学，安徽大学，中国矿业大学（北京）

**1. 整体逻辑**
- **研究任务**: 自动奖励设计（Automated Reward Design, ARD），即利用大语言模型（LLM）根据自然语言任务描述，自动生成强化学习所需的奖励函数代码。
- **研究动机**: 现有的 LLM 奖励设计方法依赖“试错-环境反馈”的迭代循环。由于 LLM 缺乏因果推理能力，容易生成语义合理但因果上虚假的奖励组件（例如用“ lifting velocity”作为奖励导致梯度噪声引发优化崩溃，或用“scissors_open”导致机器人保持剪刀微开刷分）。此外，现有方法每个任务都要从头迭代，无法复用任务间的物理规律，设计效率极低。
- **本质改动**: 提出因果奖励世界模型（CRWM）。通过多任务离线交互数据预训练，显式提取候选奖励组件与物理变量之间的真实因果拓扑图。在推理时，将该因果图作为先验输入给 LLM，约束其进行“因果剪枝”，从而实现无需环境反馈迭代的零样本（zero-shot）奖励函数生成。
- **技术溯源**: 基于预训练因果基础模型 LimiX（用于提取初始因果图）和 LLM（用于最终的奖励代码生成与因果剪枝）。

**2. 技术拆解**
- **重点改进**: 
  1. 提出 CRWM，将奖励设计范式从“基于相关性的迭代试错”转变为“基于因果拓扑的零样本生成”。
  2. 提出从粗到细（coarse-to-fine）的因果发现预训练策略，解决纯数据驱动在高维物理系统中容易发现虚假因果的问题。
  3. 提出联合优化模块，通过显式机制解耦（EMD）分离持久因果关系与瞬态物理交互（如短暂碰撞），消除初始因果图中的结构幻觉。
- **架构细节**: 
  - **输入**: 多任务离线交互数据。分为宏观数据（不同奖励权重配置下的任务成功率）和微观数据（结构变量的密集逐帧轨迹）。
  - **模型结构**: 
    1. *结构先验提取*：用 LimiX 处理宏观数据，输出包含边方向和置信度的粗粒度因果图。
    2. *联合优化模块*：利用微观轨迹数据微调。构建一个可学习的因果骨架矩阵，并结合一个状态依赖的瞬态组件（处理接触等短暂物理交互）。通过置信度感知软融合，将粗粒度先验与微观轨迹拟合，蒸馏出最终的无环因果骨架（即 CRWM）。
    3. *Causal-ARD（推理阶段）*：将 CRWM 序列化为因果拓扑 Prompt 输入 LLM。LLM 在生成奖励代码时，根据因果图剔除虚假相关节点（因果剪枝），直接输出可执行代码。
  - **输出**: 零样本生成的、可执行的强化学习奖励函数代码。
- **核心 Loss**: 联合优化模块的主 Loss 包含三部分：1) 微观轨迹的局部线性预测 MSE Loss（用于拟合状态转移）；2) 无环正则化项（Acyclicity Regularization，确保学到的因果图是有向无环图）；3) 软融合 Loss（用于将粗粒度先验的置信度融入优化过程）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 复杂的连续控制基准测试（如 ShadowHand 灵巧手操作任务），以及跨具身、跨环境的泛化测试和 Sim-to-Real 实验。
  - **Baseline**: 现有的基于 LLM 的自动奖励设计方法（如 Eureka, URDP 等依赖环境反馈迭代的方法），以及无因果指导的直接 LLM 生成方法。
- **评价指标**: 任务成功率（Success Rate, SR），奖励设计延迟/成本（是否需要环境交互迭代），以及跨任务/跨具身的零样本泛化能力。
- **实验结果**: 
  1. **零样本性能**：在不使用任何环境反馈迭代的情况下，单次生成的奖励函数性能匹配甚至超越了 SOTA 的基于迭代的 ARD 方法。
  2. **解决优化问题**：通过因果剪枝有效剔除了虚假相关组件，彻底解决了基线方法中常见的“优化崩溃”和“奖励作弊（规范博弈）”问题。
  3. **泛化能力**：CRWM 具备“一次训练，处处推理”的特性，在未见过的任务、不同的机器人具身（embodiments）和环境中均表现出强泛化能力，大幅降低了新技能的获取延迟。

### 10. 🔥 [Foresight: Failure Detection for Long-Horizon Robotic Manipulation with Action-Conditioned World Model Latents] (Foresight：基于动作条件化世界模型潜在特征的长序列机器人操作失败检测)
- **研究机构**: `University of Michigan, Princeton University, University of Virginia`
- **Arxiv ID**: `2606.23085` | [点击跳转](https://arxiv.org/abs/2606.23085)

**0. 论文标题**
- **英文标题**: Foresight: Failure Detection for Long-Horizon Robotic Manipulation with Action-Conditioned World Model Latents
- **中文标题**: Foresight：基于动作条件化世界模型潜在特征的长序列机器人操作失败检测
- **研究机构**: University of Michigan, Princeton University, University of Virginia

**1. 整体逻辑**
- **研究任务**: 长序列机器人操作任务中的实时失败检测（判断当前正在执行的任务轨迹是否已经偏离并最终会导致失败）。
- **研究动机**: 长序列任务中，微小的执行偏差会累积，且同一个视觉画面在不同的动作阶段意义完全不同（比如物体在桌上，可能是还没抓，也可能是抓空了）。现有的失败检测多依赖策略内部特征或单帧视觉异常，难以处理长序列累积误差，且跨策略泛化能力差。此外，长序列任务极难获取每一步的失败标注，通常只有最终的成败标签。
- **本质改动**: 抛弃对策略内部特征的依赖，外挂一个动作条件化的世界模型。通过输入“当前画面+策略预测的动作”，让世界模型预测下一步的潜在状态特征。用这个“预期特征”结合因果 Transformer 进行序列打分，并用共形预测自适应校准报警阈值。
- **技术溯源**: 基于 V-JEPA 2-AC（动作条件化的视频世界模型基座）提取特征，使用因果 Transformer 进行序列建模。

**2. 技术拆解**
- **重点改进**: 
  1. 使用世界模型的“动作条件预测特征”作为检测信号，捕捉“在当前动作下世界预期发生什么”，从而判断实际执行是否合理。
  2. 引入函数共形预测（FCP），仅利用少量成功的轨迹数据，自适应地校准随时间变化的报警阈值，从统计学上控制误报率。
- **架构细节**: 
  - **输入**：当前的图像上下文和策略输出的动作块（Action chunk）。
  - **特征提取**：冻结 V-JEPA 2-AC 的视觉编码器提取当前隐藏特征，然后输入动作预测器，结合动作块输出“预测的潜在特征（Predicted latents）”。
  - **打分模型**：将预测特征加上位置编码作为 Token，输入带掩码的因果 Transformer，输出当前时间步 0 到 1 之间的失败分数。
  - **训练方式**：只使用轨迹级别的最终成败标签进行训练，并引入早期检测权重，鼓励模型在失败发生前或刚发生时给出高分。
- **核心 Loss**: 带权重的轨迹级二分类交叉熵 Loss。没有视频像素重建等辅助任务（V-JEPA 直接在 Latent 空间进行预测）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真环境使用 LIBERO-Long、ManiSkill-Long 和 BEHAVIOR-1K（平均步数高达8500步）；真机环境使用 ReactorX 和 Franka 机械臂。
  - **Baseline**：FAIL-Detect（基于不确定性）、SAFE（基于策略内部表征）、RND（基于嵌入分布）、Gauge（基于视频世界模型）。
  - **测试策略**：涵盖了 OpenVLA, $\pi_0$-FAST, $\pi_{0.5}$, ACT, SmolVLA, GR00T N1.5 等多种主流 VLA 和视觉运动策略。
- **评价指标**: ROC-AUC（衡量分数区分成功和失败轨迹的能力）和 Balanced Accuracy（平衡准确率，衡量在特定阈值下的分类性能，对类别不平衡更鲁棒）。
- **实验结果**: 
  - **仿真表现**：在步数最长、最复杂的 BEHAVIOR-1K 上优势最明显，Balanced Accuracy 达到 0.78，比最好的 Baseline（0.64）提升了 14%；ROC-AUC 达到 0.76，提升 4%。在 LIBERO-Long 和 ManiSkill-Long 上也均取得最佳的 Balanced Accuracy（0.94 和 0.80）。
  - **真机表现**：在 4 个真机设置（不同机械臂和策略组合）中，Foresight-Transformer 在 3 个设置下取得了最高的 ROC-AUC（最高达 0.93）。
  - **跨策略泛化**：用 $\pi_0$ 策略数据训练的检测器，可以直接用于检测 OpenVLA 或 ACT 策略的轨迹（ROC-AUC 达 0.64 和 0.94），证明模型学到的是物理执行层面的失败规律，而不是特定策略的固有缺陷。

### 11. 🔥 [Cloak: Zero-Shot Cross-Embodiment Manipulation by Masking the End-Effector from the VLA] (Cloak：通过在VLA中遮蔽末端执行器实现零样本跨具身操作)
- **研究机构**: `Stanford University`
- **Arxiv ID**: `2606.22836` | [点击跳转](https://arxiv.org/abs/2606.22836)

**0. 论文标题**
- **英文标题**: Cloak: Zero-Shot Cross-Embodiment Manipulation by Masking the End-Effector from the VLA
- **中文标题**: Cloak：通过在VLA中遮蔽末端执行器实现零样本跨具身操作
- **研究机构**: Stanford University

**1. 整体逻辑**
- **研究任务**: 零样本跨具身操作。即在一个机器人（源）上训练策略，直接部署到另一个硬件结构不同的机器人（目标）上，且不收集目标机器人的任何数据。
- **研究动机**: 现有的VLA模型换机器人就拉胯，核心瓶颈是“视觉具身差异”。腕部相机里夹爪占的面积太大，模型把源夹爪的外观特征学死了。一旦换目标夹爪，视觉输入就超出分布导致性能骤降。以前的方法要么用生成模型P图换夹爪（容易幻觉、不实时），要么用分割模型切图（切不准），要么在训练时叠加目标掩码（需要提前知道目标硬件长什么样）。
- **本质改动**: 在训练时，利用机器人的几何模型和运动学，实时算出夹爪在图像里的掩码（Mask），并在视觉编码器的注意力机制中把这块区域屏蔽掉，让模型“看”不到夹爪。同时对掩码形状做随机变形增强，让模型适应各种夹爪轮廓。部署时，对目标机器人做同样的屏蔽，并通过正逆运动学在两个机器人的“指尖”之间转换状态和动作。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_{0.5}$ VLA 模型作为基座。

**2. 技术拆解**
- **重点改进**: 
  1. **几何掩码生成**：用正运动学（FK）和相机内参，把机器人URDF模型投影到图像上，生成精确的二值掩码。
  2. **掩码注意力**：把掩码缩小到ViT的patch大小，在自注意力计算时，把被掩码patch的注意力权重设为负无穷，使其完全不参与计算。
  3. **掩码增强**：训练时，在掩码边缘随机加胶囊体，在内部随机挖圆盘，造出各种形状的“假夹爪”轮廓。被挖掉或增加的区域用图像平移（rolling）来填补，避免引入纯色或生成模型的噪声。
  4. **指尖重定向**：部署时，选定源和目标机器人的两个“指尖”（如夹爪的两个尖，或灵巧手的拇指和中指），通过FK把模型输出的关节动作转成指尖位姿，再通过IK转成目标机器人的关节动作。输入状态也做反向转换。
- **架构细节**: 
  - **输入**：腕部相机图像、外部相机图像（外部视角不掩码）、语言指令、关节位置状态。
  - **模型结构**：沿用 $\pi_{0.5}$ 架构，视觉编码器是ViT，将图像切成 $14 \times 14$ 的patch。动作头解码输出动作块（action chunk）。
  - **模型规模**：沿用 $\pi_{0.5}$ 的规模（数十亿参数级别）。
- **核心 Loss**: 标准的模仿学习Loss，预测动作块（Action chunk prediction）。没有添加视频重建等额外的辅助任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：DROID 数据集（约75k episodes，350小时），源机器人是 Franka 机械臂 + Robotiq 平行夹爪。
  - **Baselines**：
    1. $\pi_{0.5}$-droid：直接在DROID上微调的 $\pi_{0.5}$，加上指尖重定向（不掩码）。
    2. LAP-VLA：通过语言层对齐具身的最新零样本跨具身方法。
    3. Cloak-VLA-NoAug：本文方法去掉掩码增强。
    4. Cloak-VLA-Overlap：训练时直接叠加源和目标的掩码（类似以往工作）。
- **评价指标**: 任务进度率（Task progression rate）。按完成子任务给进度分，综合评估四个任务（Pick and Place, Remove, Move, Fold/Unfold）的平均得分。
- **实验结果**: 
  - **源机器人（无迁移差异）**：Cloak-VLA 与原版 $\pi_{0.5}$-droid 性能持平（约88%），说明屏蔽夹爪没有损害原有性能。
  - **零样本迁移到未见机器人**：
    - **UMI夹爪**：Cloak (85.1%) 显著优于 $\pi_{0.5}$+重定向 (69.0%) 和 LAP (60.9%)。
    - **YAM机械臂+夹爪**：Cloak (86.3%) 显著优于 $\pi_{0.5}$+重定向 (69.5%) 和 LAP (68.5%)。
    - **Sharpa五指灵巧手（视觉差异最大）**：Cloak (81.8%) 大幅领先 $\pi_{0.5}$+重定向 (54.4%) 和 LAP (60.2%)。
  - **结论**：通过直接遮蔽腕部相机的末端执行器并配合掩码增强，模型成功解耦了视觉特征与特定硬件，实现了真正的零样本跨具身迁移，且不需要生成模型或预先知道目标硬件。

### 12. 🔥 [UniFS: Unified Fast-to-Slow Hierarchical Architecture for Vision-Language-Action Models] (UniFS：用于视觉-语言-动作模型的统一快慢分层架构)
- **研究机构**: `京东 (JD.com)、天津大学 (Tianjin University)、复旦大学义乌研究院 (Yiwu Research Institute of Fudan University)`
- **Arxiv ID**: `2606.22794` | [点击跳转](https://arxiv.org/abs/2606.22794)

**0. 论文标题**
- **英文标题**: UniFS: Unified Fast-to-Slow Hierarchical Architecture for Vision-Language-Action Models
- **中文标题**: UniFS：用于视觉-语言-动作模型的统一快慢分层架构
- **研究机构**: 京东 (JD.com)、天津大学 (Tianjin University)、复旦大学义乌研究院 (Yiwu Research Institute of Fudan University)

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的实时控制与推理加速。
- **研究动机**: 现有的快慢双系统VLA模型（如GR00T、Fast-in-Slow）存在“频率困境”：VLM更新间隔大导致语义过时，间隔小又起不到加速作用。此外，动作专家通常只接收VLM最后一层的固定频率特征，丢弃了中间层的多尺度信息，导致信息耦合不足，限制了操作精度。
- **本质改动**: 打破将VLM和动作专家作为独立双模块的设计，在单一VLM骨干内部实现“分层异步更新”（浅层高频、深层低频）。同时引入“特征反转”机制，调整特征与动作专家的交互顺序，使得深层特征可以安全缓存，从而在保证精度的同时实现整体推理加速。
- **技术溯源**: 视觉编码器基于 DINOv2 和 SigLIP，语言基座基于 Qwen2.5-0.5B，动作专家基于 Transformer 结构。

**2. 技术拆解**
- **重点改进**: 
  1. **分层异步更新 (Fast-to-Slow Architecture)**：将VLM的层分为多组，越深的层更新频率越低。浅层每步都更新以捕捉快速变化的动态，深层隔多步更新一次以缓存稳定的语义上下文。
  2. **潜在向量反转 (Latent Vector Inversion)**：由于深层靠近输出端，其特征原本变化较快，不利于缓存。作者反转了交互顺序：让初始噪声动作先与深层（高频）特征交互，细化后的动作再与浅层（低频）特征交互。这样浅层负责高频感知，深层负责低频缓存。
  3. **频率特征替换 (Frequency Feature Replacement)**：为解决异步更新导致GPU无法并行计算的问题，在训练时先全量并行计算所有层的特征，然后按频率规则将旧时间步的特征复制覆盖给新时间步，实现训练加速。
- **架构细节**: 
  - **输入**: 视觉图像（经DINOv2和SigLIP编码）、文本指令、本体感觉状态。
  - **结构**: VLM（Qwen2.5-0.5B）提取多尺度中间层特征，输入到动作专家（多层Transformer）。
  - **动作解码**: 噪声动作先通过Cross-Attention融合深层VLM特征，再融合浅层特征，最后通过MLP输出7维动作（3维平移、3维旋转、1维夹爪状态）。
- **核心 Loss**: 多级监督策略（Multi-Level Supervision）。主Loss为动作预测的L1 Loss。不仅在最终输出层计算，还在动作专家的每个频率组（每一层/组）都计算辅助L1 Loss。这迫使低频组学习粗粒度的长期规划，高频组学习细粒度的即时修正。没有视频重建等其他辅助任务。

**3. 实验结果**
- **数据集和baseline**: 仿真环境使用 LIBERO 数据集（包含 Spatial, Object, Goal, 10 四个子集，共130个任务）。对比的 baseline 主要是 VLA-Adapter 等主流快慢双系统方法。
- **评价指标**: 平均成功率（Average success rate）和 平均推理延迟（Average inference latency，单位ms）。
- **实验结果**: 在 LIBERO 数据集上，UniFS 达到 98.3% 的平均成功率（比 VLA-Adapter baseline 提升 2.5%）；同时，平均推理延迟从 36.5 ms 降至 17.8 ms，实现了 2.1 倍的加速。在 Franka 机械臂的真机实验中也验证了该方法的实用性。

### 13. 🔥 [Temporal Logic Guidance for Action-Only Diffusion Policies with World Models] (基于世界模型的仅动作扩散策略的时序逻辑引导)
- **研究机构**: `Georgia Institute of Technology (佐治亚理工学院)`
- **Arxiv ID**: `2606.22729` | [点击跳转](https://arxiv.org/abs/2606.22729)

**0. 论文标题**
- **英文标题**: Temporal Logic Guidance for Action-Only Diffusion Policies with World Models
- **中文标题**: 基于世界模型的仅动作扩散策略的时序逻辑引导
- **研究机构**: Georgia Institute of Technology (佐治亚理工学院)

**1. 整体逻辑**
- **研究任务**: 在推理阶段引导“仅生成动作”的扩散策略（Action-only Diffusion Policies），使其生成的动作轨迹满足用户指定的时序逻辑（STL）约束（如安全限制、特定姿态等）。
- **研究动机**: 现有的基于STL的扩散引导方法，要求扩散模型在推理时同时预测未来的“动作和状态”（联合生成），这增加了模型复杂度和计算开销。而目前主流的扩散策略通常只生成“动作序列”，导致现有的STL引导方法无法直接套用。
- **本质改动**: 引入一个单独训练的、可微的世界模型（World Model）来预测动作对应的未来状态。通过世界模型计算出STL约束的鲁棒性（Robustness）梯度，并将其注入到扩散模型的去噪过程中，从而在不重训策略的情况下实现推理时的约束引导。
- **技术溯源**: 基于 Diffusion Policy（扩散策略）、STL（信号时序逻辑）和 World Model（世界模型）。

**2. 技术拆解**
- **重点改进**: 将STL引导从“联合生成动作和状态”的架构，解耦并适配到了“仅生成动作”的主流扩散策略上。通过外挂可微世界模型来桥接“动作”到“状态”的映射，实现了约束梯度的反向传播。
- **架构细节**: 
  - **输入/输出**: 输入当前状态 $s_t$ 和带噪动作序列 $\mathbf{a}^k$；输出去噪后的动作序列 $\mathbf{a}^{k-1}$。
  - **模型结构**: 包含两个独立模型。1) 扩散策略模型 $\mu_\theta$：负责动作去噪；2) 世界模型 $f_\theta$：输入当前状态和动作，预测下一状态。通过迭代使用世界模型，得到未来状态序列 $\hat{s}_{t+1:t+H}$。
  - **引导机制**: 在扩散去噪的每一步，计算动作序列的STL鲁棒性目标 $J$，求 $J$ 对带噪动作的梯度，乘以权重 $\lambda$ 后叠加到去噪更新公式中。此外，在去噪结束后的最终动作序列上，再执行几步梯度上升以进一步强化约束满足。
- **核心 Loss**: 
  - **训练阶段**: 扩散策略使用常规的动作重建Loss（如MSE）；世界模型使用常规的状态预测Loss。两者使用相同的数据独立训练。
  - **推理阶段（引导目标）**: 无额外训练Loss，直接使用STL鲁棒性度量 $\rho_\phi(\hat{s}_{t+1:t+H})$ 作为引导目标函数 $J$ 来计算梯度。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: Robomimic 中的 Can Transport（罐子搬运）任务。使用包含多种行为模式的混合人类演示数据进行训练，以捕捉策略的多模态特性。
  - **Baseline**: 1) Base Policy（无引导的基础扩散策略）；2) Sample & Rank（采样并排序基线，即多次采样动作轨迹，用相同的STL鲁棒性目标打分并选择得分最高的一条）。
- **评价指标**: 
  - **任务成功率 (Succ. %)**: 是否成功将罐子放入目标盒子。
  - **约束违反率 (Viol. %)**: 违反STL约束（要求搬运过程中罐子倾斜角度不超过5度，即 $\mathbf{G}(R_{zz}>\cos(5^{\circ}))$）的轨迹比例。
  - **平均倾斜角度 (Avg. Tilt)**: 罐子偏离垂直方向的平均角度。
- **实验结果**: 
  - **Base Policy**: 成功率 100%，但约束违反率高达 84%，平均倾斜 8.51°。
  - **Sample & Rank**: 成功率 98%，约束违反率 82%，平均倾斜 8.42°。（说明简单的采样选择无法有效纠正策略生成的不良模式）。
  - **Guidance (Ours)**: 成功率保持 100%，约束违反率大幅降至 4%，平均倾斜降至 1.93°。证明了基于梯度的引导能精准控制策略走向合规行为，效果远优于采样选择。

### 14. 🔥 [Wh0: Generative World Models as Scalable Sources of Egocentric Human Hand Manipulation Data] (Wh0：生成式世界模型作为可扩展的第一人称人手操作数据源)
- **研究机构**: `上海创新研究院, 南京大学, 上海交通大学`
- **Arxiv ID**: `2606.22136` | [点击跳转](https://arxiv.org/abs/2606.22136)

**0. 论文标题**
- **英文标题**: Wh0: Generative World Models as Scalable Sources of Egocentric Human Hand Manipulation Data
- **中文标题**: Wh0：生成式世界模型作为可扩展的第一人称人手操作数据源
- **研究机构**: 上海创新研究院, 南京大学, 上海交通大学

**1. 整体逻辑**
- **研究任务**: 提升灵巧手操作 VLA（视觉-语言-动作）模型的零样本泛化能力。
- **研究动机**: 训练灵巧手操作模型面临数据“规模”与“场景/具身对齐”的矛盾。遥操作数据对齐好但太贵太少；仿真数据多但有 sim-to-real gap；真实第一人称人手视频多，但场景和具身（人手 vs 机械手）跟机器人实际部署不匹配。
- **本质改动**: 用视频生成模型（世界模型）来合成大规模、可控的第一人称人手操作视频（构建 WM-H 数据集），再通过图像编辑把人手换成机械手外观，并提取 3D 手部动作。最后把这些生成的数据和少量真实机器人数据混在一起微调 VLA 模型。
- **技术溯源**: 基于 VITRA (VLA 基座), PaliGemma (视觉语言骨干), Wan-I2V-A14B (图生视频模型), Qwen-Image-Edit (图像编辑), Qwen3-VL (动作描述生成), HaWoR (手部动作重建)。

**2. 技术拆解**
- **重点改进**: 
  1. **构建 WM-H 数据集**：设计了一套自动化流水线。先用 LLM 生成多样化的操作指令；然后拍真实桌面背景，用图像编辑模型把目标物体 P 进去；接着用图生视频模型生成人手操作视频；再用图像编辑把视频里的人手替换成机械手外观（具身对齐）；最后用手部重建模型提取 3D 动作标签。最终产出 5 万条带 3D 手部姿态和语言指令的视频。
  2. **混合微调策略（Wh0 框架）**：把生成的 WM-H 数据和少量真实遥操作数据混合，微调预训练好的 VLA 模型。动作空间统一映射到 MANO 手部模型空间，避免机器人数据太少导致归一化参数不准。
- **架构细节**: 
  - **输入**: 当前相机观测图像、语言指令、视场角 (FoV) token、当前手部状态。
  - **输出**: 未来手部动作（相机坐标系下的腕部平移/旋转 + MANO 关节旋转，共 102 维）。
  - **模型结构**: PaliGemma 提取视觉和语言特征，输入到基于扩散模型的动作解码器（Diffusion Action Decoder）中预测动作。
  - **数据配比**: 训练时按 28% 真实遥操作、68% WM-H 生成数据、4% WM-H 具身对齐版本进行采样，通过过采样少量真实数据来保证具身约束的稳定性。
- **核心 Loss**: 扩散动作解码器的噪声预测 MSE Loss ($\mathcal{L}_{MSE}$)。没有视频重建等辅助 Loss，生成的视频纯粹作为训练数据输入。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自建 WM-H (50k 视频)，真实遥操作数据 (400 条)，以及预训练用的人类视频数据集 (Ego4D 等)。
  - **Baseline**: $\pi_{0.5}$ (仅机器人数据微调), VITRA (人类视频预训练 + 仅机器人数据微调), VITRA Real Version (用真实第一人称视频 HOI4D 代替 WM-H 进行微调)。
- **评价指标**: 
  - **主要指标**: 真实世界零样本灵巧操作任务的成功率（18 个任务，每个任务 20 次尝试，包含未见过的物体、容器和背景）。
  - **辅助指标**: 手-物距离（Hand-Object Distance），用于评估模型对目标物体的视觉接地（grounding）稳定性。
- **实验结果**: 
  - 在 18 个真实世界零样本任务中，Wh0 的成功率达到 38.9%，比仅用机器人数据微调的 VITRA 基线（8.3%）提升了 4.7 倍。
  - 消融实验证明，场景对齐（保持桌面视角一致）、具身对齐（人手换机械手外观）和数据规模（5k -> 25k -> 50k）是性能提升的核心驱动力。去掉具身对齐会导致成功率掉到 34.7%。
  - 进一步分析表明，WM-H 的主要作用是“激活并解锁”人类视频预训练带来的操作先验，而不是让模型从零学习灵巧技能。

### 15. 🔥 [KITE: Decoupling Kinematics and Interaction for Zero-Shot Cross-Embodiment Manipulation] (KITE：解耦运动学与交互以实现零样本跨具身操作)
- **研究机构**: `Cornell University`
- **Arxiv ID**: `2606.22113` | [点击跳转](https://arxiv.org/abs/2606.22113)

**0. 论文标题**
- **英文标题**: KITE: Decoupling Kinematics and Interaction for Zero-Shot Cross-Embodiment Manipulation
- **中文标题**: KITE：解耦运动学与交互以实现零样本跨具身操作
- **研究机构**: Cornell University

**1. 整体逻辑**
- **研究任务**: 零样本跨具身操作（Zero-Shot Cross-Embodiment Manipulation）。即在一个机器人（源具身）上收集演示数据训练策略，然后直接部署到运动学结构完全不同的另一个机器人（目标具身）上，且不需要目标机器人的任何任务演示数据。
- **研究动机**: 现有的跨具身方法（如共享动作空间或具身感知架构）把“任务推理”和“特定机器人的动作控制”耦合在同一个策略里。这导致新机器人在结构上处于分布外，依然需要新机器人的任务数据。但实际上，部署时目标机器人的运动学模型（URDF）是完全已知的，没必要非要任务数据。核心痛点是如何把任务求解和特定形态的控制彻底解耦。
- **本质改动**: 将操作解耦为“与具身无关的任务推理”和“特定具身的运动控制”，中间通过一个基于接触模式（contact patterns）学习到的“交互意图”隐变量来连接。任务策略只负责预测这个隐变量，动作解码器负责把隐变量翻译成具体关节指令。
- **技术溯源**: 策略部分基于现成的 iDP3（一种 Diffusion Policy 变体），运动学部分基于标准的 URDF 模型。

**2. 技术拆解**
- **重点改进**: 
  1. 提出基于接触的隐式交互意图（latent interaction intent）作为中间接口，彻底切断任务策略与具体机器人形态的联系。
  2. 动作解码器（Action Decoder）完全摆脱了对任务数据的依赖，仅依靠目标机器人的运动学模型生成的合成数据进行训练。
- **架构细节**: 
  - **隐变量定义**: 交互意图被定义为物体表面的接触点集合（包含3D位置和法向方向）。因为接触点数量不固定且无序，使用一个置换不变编码器（如 PointNet 类结构）将其映射为固定维度的隐变量 $z_t$。
  - **任务策略 ($\pi$)**: 输入是当前观测 $o_t$ 和上一步的隐变量 $z_{t-1}$，输出是当前的隐变量 $z_t$。这里把 iDP3 原本的动作空间替换成了隐变量空间，把本体感知输入替换成了 $z_{t-1}$。
  - **动作解码器 ($g^e$)**: 输入是隐变量 $z_t$ 和当前机器人的关节构型 $q_t^e$，输出是目标关节构型 $a_t^e$。
- **核心 Loss**: 
  - **动作解码器 Loss**: 使用均方误差（MSE）回归目标构型。关键细节是引入了 **Joint Mask**：只监督与当前接触点直接相关的关节，冻结其他无关关节。这迫使隐变量在空间中对齐到特定的局部关节，保证不同机器人共享同一个隐变量空间时语义一致。
  - **任务策略 Loss**: 使用 iDP3 原生的 Diffusion Loss（或 Flow Matching Loss），预测隐变量 $z_t$。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 在 MuJoCo 仿真中构建了 3 个任务（Cube Picking, Keyboard Pressing, Bottle Pumping），涉及 5 种具身（Robotiq 平行夹爪，Barrett/Allegro/Wuji 灵巧手，以及 Robotiq+Stick 复合具身）。每个任务使用 800 个源具身的演示轨迹。
  - **Baseline**: OHRA 和 D(R,O)（具身感知抓取方法），SPIDER（基于人工对应和优化的动作重定向方法）。
- **评价指标**: 零样本跨具身迁移的任务成功率（Success Rate %）。
- **实验结果**: 
  - **仿真结果**: KITE 在所有 9 个迁移组合中都取得了极高的成功率（基本在 90% - 100% 之间）。相比之下，OHRA 和 D(R,O) 几乎全挂（0% 或 N/A），因为单源数据无法支撑结构完全不同的目标具身；SPIDER 在接触区域固定的任务上表现尚可，但在 Bottle Pumping（任务中接触区域会随时间变化）中严重退化，且完全无法处理复合具身（N/A）。
  - **消融实验**: 证明“隐变量接口”比直接用原始接触点作为动作好（成功率提升 12-24%），因为原始接触点无序且变长，策略很难学。
  - **真机部署**: 在真实灵巧手上进行了验证，源数据分别来自平行夹爪和人手演示，KITE 均成功实现了零样本迁移并完成了操作任务。

### 16. 🔥 [Imitation from Heterogeneous Demonstrations using Grounded Latent-Action World Models] (基于接地隐动作世界模型的异构演示模仿学习)
- **研究机构**: `University of Oxford (牛津大学)`
- **Arxiv ID**: `2606.21672` | [点击跳转](https://arxiv.org/abs/2606.21672)

**0. 论文标题**
- **英文标题**: Imitation from Heterogeneous Demonstrations using Grounded Latent-Action World Models
- **中文标题**: 基于接地隐动作世界模型的异构演示模仿学习
- **研究机构**: University of Oxford (牛津大学)

**1. 整体逻辑**
- **研究任务**: 利用少量带标签的目标机器人数据，结合大量无标签、不同动作空间的辅助数据（如仿真数据、其他形态机器人的数据），训练机器人的视觉运动操作策略。
- **研究动机**: 现有的模仿学习高度依赖昂贵的目标机器人遥操作数据。利用便宜的辅助数据是趋势，但异构数据动作空间不同且往往没标签。以前的方法靠手工调参、最优传输等启发式规则来对齐数据，效果受限且不够通用。作者认为，只要对环境产生相同物理效果的动作，在隐空间就该有相同的表示，不需要依赖数据来源。
- **本质改动**: 提出 GLAM（接地隐动作世界模型）。不直接对齐动作空间，而是训练一个世界模型，把不同来源的动作统一映射到一个“由物理状态转移锚定”的连续隐动作空间中。用这个隐空间给无标签数据打伪标签，再训练下游策略。
- **技术溯源**: 基于 Dreamer 风格的世界模型架构。视觉特征提取使用 DINOv2，下游行为克隆（BC）策略使用 MIP（一种轻量级的两步回归策略）。**注：本文没有使用 OpenVLA/Llama3 等视觉语言大模型基座，而是采用经典的生成模型+小策略网络组合。**

**2. 技术拆解**
- **重点改进**: 设计了一对生成模型来构建共享的隐动作空间。一个逆动力学模型（IDM）通过观察混合数据的帧间状态变化来推断隐动作；一个动作编码器（Action Encoder）通过观察目标数据的真实机器人动作来推断隐动作。通过非对称 KL 散度将两者对齐，确保隐空间既包含物理转移规律，又包含目标机器人的控制语义。
- **架构细节**: 
  - **输入输出**：混合模型输入图像（或物体 Mask），预测下一帧状态；目标模型输入本体状态，重建真实动作。两者共享前向动力学模型。隐动作 $z_t$ 是连续向量。
  - **对齐机制**：使用非对称 KL 散度，让 IDM 的后验分布去拟合 Action Encoder 的后验分布（对后者使用 stop-gradient）。这样 IDM 能学到目标机器人的控制语义，而 Action Encoder 不会被 IDM 模糊的信号带偏。
  - **下游 Pipeline**：冻结训练好的 GLAM，用 IDM 给所有数据（包括没标签的辅助数据）提取隐动作标签。下游 BC 策略输入 DINOv2 特征和本体状态，预测隐动作序列（Action Chunk），最后通过解码器还原成真实机器人动作执行。
- **核心 Loss**: 
  - **世界模型部分**：混合数据的 ELBO（包含观测重建、状态转移 KL、隐动作 KL） + 目标数据的 ELBO（包含状态转移、动作重建、隐动作 KL） + 非对称 KL 对齐 Loss。
  - **下游策略部分**：预测隐动作的 MSE Loss（所有数据） + 预测真实动作的 MSE Loss（仅目标数据）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：3 个真机任务（抓取、放置、推倒）和 2 个仿真任务（单臂叠2块、双臂叠3块）。每个任务包含 100 条目标数据（Kinova 机械臂）和 400 条无标签辅助数据（UMI 仿真夹爪）。
  - **Baseline**：纯 BC 方法（MIP，只用目标数据）、单具身隐动作方法（CLAM）、离散隐动作方法（LAPA），以及它们使用物体 Mask 的变体（CLAM-O, LAPA-O）。
- **评价指标**: 任务成功率（Task success rate）。
- **实验结果**: 
  - 在数据稀缺（仅 100 条目标数据）的设定下，GLAM 比纯 BC 和之前的隐动作方法**平均成功率提升 48%**，最高提升达 **69%**。
  - 使用物体 Mask 替代 RGB 图像作为输入（GLAM-O），能进一步过滤背景干扰，提升跨源转移效果。
  - 开环回放实验证明，GLAM 学到的隐动作空间成功实现了对齐：从 UMI 或仿真数据推断出的隐动作，能准确解码为 Kinova 机械臂的真实动作。

### 17. 🔥 [VQActFlow: Vector-Quantized Action Mode Steering for Multi-Task Robot Manipulation] (VQActFlow：面向多任务机器人操作的向量量化动作模式引导)
- **研究机构**: `佐治亚理工学院 (Georgia Institute of Technology)`
- **Arxiv ID**: `2606.21600` | [点击跳转](https://arxiv.org/abs/2606.21600)

**0. 论文标题**
- **英文标题**: VQActFlow: Vector-Quantized Action Mode Steering for Multi-Task Robot Manipulation
- **中文标题**: VQActFlow：面向多任务机器人操作的向量量化动作模式引导
- **研究机构**: 佐治亚理工学院 (Georgia Institute of Technology)

**1. 整体逻辑**
- **研究任务**: 多任务机器人操作（根据视觉观察和语言指令生成连续动作）。
- **研究动机**: 在多任务场景下，同一个视觉观察可能对应不同任务的动作。现有的扩散/流匹配策略在连续空间生成，没有显式的“动作模式”概念，容易选错任务或做出当前场景下不可行的动作。之前的离散策略（如Discrete Policy）虽然用了VQ-VAE把动作离散化，但在生成时仍在连续空间做扩散，最后才查表变离散，丢失了离散结构在模式选择上的优势。
- **本质改动**: 用变分流匹配（Variational Flow Matching）直接生成VQ-VAE的离散动作token。在生成的每一步都输出离散动作模式的概率分布（logits），从而可以在推理时直接对“动作模式”进行引导，而不是在连续空间里盲目去噪。
- **技术溯源**: 基于 VQ-VAE（动作离散化）、Flow Matching / Variational Flow Matching（生成框架）、DiT（策略骨干网络）、CLIP（文本编码）。

**2. 技术拆解**
- **重点改进**: 
  1. 动作Token化：用VQ-VAE把连续动作chunk压缩成离散的code序列。
  2. 变分流匹配生成：不用传统的L2回归预测连续速度，而是用交叉熵损失预测codebook上的logits，把生成过程变成对离散动作模式的选择过程。
  3. 推理期引导：在logits层面做引导（包括语言条件引导和场景可行性引导），直接干预动作模式的概率分布。
- **架构细节**: 
  - **VQ-VAE**: Codebook大小设为512，将动作chunk压缩为离散序列，训练后冻结。
  - **VFM策略**: 12层DiT骨干。输入为高斯噪声、时间步、视觉特征（ResNet-18）和语言特征（CLIP-B/32）。输出为每个位置的codebook logits。推理时，通过logits计算后验均值，再算出速度场进行ODE积分。
  - **引导机制1 (CFG)**: 在logits层面对语言条件做无分类器引导（Classifier-Free Guidance），通过线性外推强化指令相关的动作模式。
  - **引导机制2 (Codebook Critic)**: 3层小Transformer，评估当前code分布的“场景可行性”。推理时通过梯度调整code分布，把概率推向当前场景下可行的动作模式。
- **核心 Loss**: 
  - **VQ-VAE**: 标准重建损失 + commitment loss。
  - **VFM策略**: 交叉熵损失（预测的logits与真实的code index之间）。
  - **Codebook Critic**: InfoNCE对比损失。负样本构造包括：时间打乱、随机替换code、错配视觉/语言等，以确保学到的可行性信号包含时间连贯性和多模态对齐信息。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO-Goal, LIBERO-90（仿真）；Unitree G1人形机器人（真机）；ALOHA双臂机器人（真机）。
  - Baseline：CFM（连续流匹配）、MT-ACT、VQ-BeT、Discrete Policy（使用相同的VQ-VAE和DiT骨干作为控制变量）。
- **评价指标**: 任务成功率（Success rate %）。
- **实验结果**: 
  - **LIBERO-Goal**: VQActFlow在CFG权重为4时达到81.0%，比无引导（73.0%）提升明显，且远超Discrete Policy的峰值（61.5%）。
  - **LIBERO-90**: VQActFlow（CFG+Critic组合）达到80.5%。显著优于连续baseline（CFM 77.2%, MT-ACT 72.4%）和离散baseline（VQ-BeT 24.1%, Discrete Policy落后VQActFlow 17.3%）。消融实验表明，CFG和Critic提供的信号是互补的，组合使用效果最好。
  - **真机实验**: 在G1人形全身抓取放置和ALOHA双臂接触丰富任务中，VQActFlow的成功率均超越了连续和离散baseline。

### 18. 🔥 [UniviewVLA: A Unified Multiview Vision-Language-Action Model with World Modeling] (UniviewVLA：一种结合世界模型的统一多视角视觉-语言-动作模型)
- **研究机构**: `同济大学、小米汽车、上海交通大学等`
- **Arxiv ID**: `2606.21501` | [点击跳转](https://arxiv.org/abs/2606.21501)

**0. 论文标题**
- **英文标题**: UniviewVLA: A Unified Multiview Vision-Language-Action Model with World Modeling
- **中文标题**: UniviewVLA：一种结合世界模型的统一多视角视觉-语言-动作模型
- **研究机构**: 同济大学、小米汽车、上海交通大学等

**1. 整体逻辑**
- **研究任务**: 解决机器人操作任务中的视觉遮挡问题，提升操作成功率。
- **研究动机**: 现有的VLA模型在遇到视觉遮挡时容易失败。现有的多视角方法要么需要额外部署物理相机（要求训练和推理时相机配置严格一致，部署不灵活），要么依赖显式3D重建（计算成本高）。此外，单一固定的辅助视角在不同操作阶段提供的信息量是变化的，固定视角不够灵活。
- **本质改动**: 引入世界模型，仅依靠标准的两个相机（Agent视角和Wrist视角）输入，自回归生成多视角的未来场景演化（辅助视图），从而“脑补”出被遮挡区域的信息和未来动态。同时，通过Token压缩和基于动作熵的动态视角选择来降低推理延迟并提高动作预测的准确性。
- **技术溯源**: 基于 UniVLA 框架（使用 Emu3 自回归骨干网络、VQ 视觉分词器和 FAST 动作分词器）。

**2. 技术拆解**
- **重点改进**: 
  1. **多视角世界模型后训练**：让模型学会从标准双视角预测未来多视角的视觉Token。
  2. **运动信息Token压缩**：计算相邻帧Token的余弦距离，只保留视觉变化最大的前16个Token，大幅砍掉冗余计算。
  3. **基于动作熵的动态视角选择**：推理时计算不同视角的动作Token熵，选择熵最低（即模型最确定、信息量最大）的视角来指导动作生成，并且每30步动态更新一次视角。
- **架构细节**: 
  - **输入**: 语言指令 + 过去两帧的标准双视角图像（Agent和Wrist）。
  - **输出**: 压缩后的辅助视角VQ Token + FAST动作Token。
  - **模型结构与规模**: 统一的自回归Transformer。Stage 1 训练世界模型预测完整辅助视图（25x25=625 tokens）；Stage 2 微调动作预测，输入压缩后的辅助视图（16 tokens）并预测动作。
- **核心 Loss**: 
  - **Stage 1 (世界模型)**: 自回归视觉预测的交叉熵损失，用于监督未来辅助视图VQ Token的生成。
  - **Stage 2 (动作微调)**: 自回归交叉熵损失，对拼接后的压缩视角Token和动作Token序列进行联合监督。

**3. 实验结果**
- **数据集和baseline**: 
  - **无遮挡基准**: LIBERO, CALVIN ABCD->D。对比 OpenVLA, pi0-FAST, UniVLA, GR00T N1 等主流方法。
  - **遮挡基准**: 自定义的6个LIBERO风格遮挡仿真任务，以及2个真实机器人（ALOHA平台）遮挡任务。对比双相机策略、三相机物理策略。
- **评价指标**: 
  - LIBERO：任务成功率（%）。
  - CALVIN：平均连续完成的任务链长度。
  - 真实机器人：任务成功率（%）。
- **实验结果**: 
  - **无遮挡基准**：LIBERO平均成功率95.8%（SOTA），CALVIN平均链长4.60（SOTA），证明生成辅助视图对常规任务也有增益。
  - **遮挡仿真**：在自定义遮挡任务中，双相机基线平均成功率40.0%，三相机物理基线66.3%，UniviewVLA达到73.3%。
  - **真实机器人**：在两个遮挡任务中，双相机基线平均成功率约16.7%，三相机物理基线约46.7%，UniviewVLA平均成功率达到50.0%（提升了33.4个百分点），且无需额外部署和标定物理相机。
  - **推理效率**：Token压缩将每个辅助视角的生成延迟从 6-7秒 降至 0.2-0.3秒，满足了闭环控制的实时性要求。

### 19. 🔥 [Decoupling the Declarative from the Procedural in Vision-Language-Action Models] (在视觉-语言-动作模型中解耦陈述性知识与程序性知识)
- **研究机构**: `爱丁堡大学 (University of Edinburgh), 伦敦大学学院 (UCL), 三星AI中心剑桥分部 (Samsung AI Center - Cambridge)`
- **Arxiv ID**: `2606.21496` | [点击跳转](https://arxiv.org/abs/2606.21496)

**0. 论文标题**
- **英文标题**: Decoupling the Declarative from the Procedural in Vision-Language-Action Models
- **中文标题**: 在视觉-语言-动作模型中解耦陈述性知识与程序性知识
- **研究机构**: 爱丁堡大学 (University of Edinburgh), 伦敦大学学院 (UCL), 三星AI中心剑桥分部 (Samsung AI Center - Cambridge)

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的零样本技能迁移（Zero-shot skill transfer），即把在一个物体上学会的动作技能，直接泛化迁移到另一个没见过的物体上。
- **研究动机**: 现有的VLA模型通常把视觉、语言、本体感知等所有token拼成一个长序列，统一喂给一个不透明的动作专家（Action Expert）。这种设计导致模型容易死记硬背“特定物体-特定技能”的虚假相关性（比如学会了抓杯子，换个碗就不会抓了）。根本原因在于，陈述性知识（物体是什么、在哪）和程序性知识（怎么执行动作）在模型内部纠缠在了一起。
- **本质改动**: 提出w2VLA模型，重构信息流。不再把所有多模态token混合处理，而是把机器人本体状态序列作为基础，依次用视觉特征、空间位置（where）和技能意图（what）进行独立调制，强行解耦这两类知识。
- **技术溯源**: 基于冻结的双塔VLM（MetaCLIP2）和视觉基础模型（VFM），动作预测部分使用Transformer架构。

**2. 技术拆解**
- **重点改进**: 设计了模块化的动作专家Transformer，通过FiLM（特征线性调制）机制，分步骤将“where”和“what”信息注入到机器人状态序列中。同时在训练时对视觉特征做50%的随机Mask（Structured Dropout），逼迫模型依赖位置和语义信息，打破视觉外观和动作技能的绑定。
- **架构细节**: 
  - **输入**: 历史本体感知状态、多视角图像、语言指令（被前置解析为独立的“物体描述”和“技能描述”）。
  - **结构**: 本体状态先经过MLP编码；接着通过交叉注意力融合VFM提取的视觉特征（Visual Modulation）；然后进入第一个FiLM块，注入由VLM图文相似度计算出的空间热力图特征，解决“目标在哪”（Where）；接着进入第二个FiLM块，注入技能文本特征，解决“做什么动作”（What）；最后通过MLP输出动作chunk。
  - **规模**: VLM和VFM骨干网络保持冻结，动作专家为Transformer结构（具体参数量未详述，基于billion-parameter VLMs）。
- **核心 Loss**: 标准的行为克隆Loss（L1 Loss），直接预测未来动作chunk（末端执行器位姿增量），无额外辅助Loss。

**3. 实验结果**
- **数据集和baseline**: 真实世界SO-101机械臂，基于LeRobot框架。自建4个场景，每个场景包含2个(技能, 物体)对，每对16条demo。对比Baseline：OTTER（冻结VLM）和 $\pi_{0.5}$（微调VLM+DiT）。
- **评价指标**: 任务成功率（SR）。细化为3分制：1分找对物体（评估陈述性知识），1分做对动作（评估程序性知识），1分完成任务。核心对比Seen（训练见过的组合）和Transfer（技能迁移到场景内另一个物体）的表现。
- **实验结果**: 在Seen任务上，三者表现持平（93%-95%）。但在Transfer任务上，OTTER和 $\pi_{0.5}$ 大幅落后（平均仅30.6%和38.2%），分析发现它们通常找对了物体，但执行了训练时该物体对应的错误动作。w2VLA在Transfer任务上达到了91.7%的平均成功率，成功实现零样本技能迁移。在加入干扰物或完全未见物体的鲁棒性测试中，w2VLA依然能正确执行技能动作，证明了解耦设计的有效性。

### 20. 🔥 [ASCII Art Turns LLMs into VLA Controllers] (用ASCII字符画把纯文本大模型变成VLA控制器)
- **研究机构**: `Dartmouth College (达特茅斯学院), Clemson University (克莱姆森大学), University of Houston (休斯顿大学)`
- **Arxiv ID**: `2606.21470` | [点击跳转](https://arxiv.org/abs/2606.21470)

**0. 论文标题**
- **英文标题**: ASCII Art Turns LLMs into VLA Controllers
- **中文标题**: 用ASCII字符画把纯文本大模型变成VLA控制器
- **研究机构**: Dartmouth College (达特茅斯学院), Clemson University (克莱姆森大学), University of Houston (休斯顿大学)

**1. 整体逻辑**
- **研究任务**: 2D桌面机械臂操作任务（如目标到达、避障、抓取放置）。模型需要根据视觉观察和自然语言指令，输出具体的机器人动作，并判断任务是否因为障碍物或缺失目标而不可达。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型通常依赖多模态大模型（VLM），需要庞大的计算资源、复杂的多模态训练流程，且高质量机器人演示数据收集成本极高。作者想验证一个想法：能不能完全抛弃图像输入和多模态训练，只用纯文本的大语言模型（LLM）来实现VLA控制？
- **本质改动**: 把相机的RGB图像转换成固定大小的ASCII字符画（ASCII Art），作为纯文本LLM的输入。这样就把视觉感知问题直接转化成了纯文本处理问题，可以无缝复用现有的纯文本LLM训练和部署工具链。
- **技术溯源**: 基于 Qwen3 (0.6B到14B), Qwen3-VL, Llama-3.2, gemma-3 等开源大语言模型和视觉语言模型。

**2. 技术拆解**
- **重点改进**: 设计了一个“ASCII-as-Vision”接口。将RGB图像通过颜色掩码、去噪、视差校正（针对真实机器人）等预处理后，映射为 96×54 分辨率的彩色ASCII字符矩阵（背景用空格，不同物体用不同字符）。同时，将连续的动作空间离散化，定义了受限的领域特定语言（DSL）作为动作输出（如 `MOVE(x,y)`, `GRIP(PICK)`, `UNREACHABLE(...)`）。
- **架构细节**: 
  - **输入/输出**: 输入是 ASCII字符画文本 + 自然语言指令；输出是单步 DSL 动作指令。
  - **模型规模**: 对比了 0.6B 到 14B 的纯文本 LLM 和 2B 到 8B 的 VLM。所有模型均使用 LoRA 进行轻量级微调。
  - **训练流程**: 分阶段训练。Stage 0 用基于 A* 的传统运动规划专家策略生成示范数据（行为克隆）；Stage 1-20 使用 DAgger 算法进行迭代改进，让模型在自己生成的轨迹上收集数据并由专家纠正，解决闭环控制中的分布偏移问题。
- **核心 Loss**: 标准的自回归语言模型 Next-token prediction loss（交叉熵），配合 LoRA 微调。没有引入复杂的辅助任务或额外的重建 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 基于 Pygame 生成的 2D 俯视操作环境，包含 5 种场景（简单可达、复杂可达、被阻挡不可达、狭窄不可达、未定义不可达）。真机实验使用 7 自由度机械臂和顶部 RGB 相机。
  - **Baseline**: 对比了不同规模的纯文本 LLM（Qwen3, Llama-3.2, Gemma-3）和视觉语言模型（Qwen3-VL, Gemma-3-VL）。为了保证公平，VLM 的图像输入也被强制降采样到与 ASCII 相同的 96×54 分辨率。
- **评价指标**: 
  - **可达场景**: 任务成功率（Success）、碰撞率（Collision）、平均步数（Steps）。
  - **不可达场景**: 不可达检测率（Detect）、不可达子类型准确率（Subtype Acc.）、可达场景中的误报率（FP Unreach.）。
- **实验结果**: 
  - DAgger 迭代训练效果显著，从 Stage 0 到 Stage 20 成功率大幅提升（例如 Qwen3-4B 从 30.8% 提升到 89.2%）。
  - 在同等 ASCII 输入下，纯文本 LLM 的表现不输甚至优于 VLM。例如 Qwen3-14B 成功率达到 81.2%，而同等规模的 Qwen3-VL-8B 为 79.0%。表现最好的 VLM 是 Qwen3-VL-4B（83.6%）。
  - 证明了在 2D 操作任务中，ASCII 字符画可以作为一种轻量、可解释的模态桥梁，纯文本 LLM 完全能胜任 VLA 控制器的角色，并且成功 Sim-to-Real 迁移到了真实机械臂上。

### 21. 🔥 [Robot Self-Improvement via Human-Video Dynamics Models] (基于人类视频动力学模型的机器人自我改进)
- **研究机构**: `ETH Zurich, Technical University of Munich, Microsoft`
- **Arxiv ID**: `2606.21406` | [点击跳转](https://arxiv.org/abs/2606.21406)

**0. 论文标题**
- **英文标题**: Robot Self-Improvement via Human-Video Dynamics Models
- **中文标题**: 基于人类视频动力学模型的机器人自我改进
- **研究机构**: ETH Zurich, Technical University of Munich, Microsoft

**1. 整体逻辑**
- **研究任务**: 机器人操作策略的持续自我改进（让机器人从真实世界的执行失败中自动学习并修正策略）。
- **研究动机**: 过去用人类视频主要是为了帮机器人“冷启动”（零样本部署），但机器人实际跑起来还是会因为本体差异或环境变化而失败。现有的纠错方法要么靠人盯着在线干预，要么只做简单的成功数据过滤（如RECAP），效率低且难以扩展。作者想解决的核心问题是：如何利用人类视频里的先验知识，让机器人自己评估失败原因并纠正动作，摆脱对人工干预的依赖。
- **本质改动**: 从人类视频中预训练一套跨本体的“动作-动力学-价值”表征，并设计了一个无需额外训练的 DGAC（动力学引导的动作纠正）模块。当机器人失败时，该模块利用动力学和价值模型，把“失败状态”重新标注为“修正后的成功动作”，从而把失败数据洗成有效监督信号来迭代更新策略。
- **技术溯源**: 动作和动力学生成基于 Flow Matching（流匹配）；视觉表征基于 DINO-v3（语义token）和 TAPIP3D（3D点流）；策略更新机制借鉴了 CFGRL（优势条件强化学习）。

**2. 技术拆解**
- **重点改进**: 
  1. **跨本体表征设计**：为了让人类视频能用来训练通用的动力学模型，作者把动作抽象为 6-DoF 手腕运动+夹爪闭合度，把状态抽象为 DINO 视觉 token + 短期 3D 点流。这剥离了具体机器人的关节限制，保留了交互本质。
  2. **DGAC 纠错算法**：核心创新点。不需要重新训练模型，直接在推理阶段通过“检索参考 -> 混合生成 -> 模型打分”的流程，把不可恢复的失败过滤掉，把可恢复的失败修正为成功数据。
- **架构细节**: 
  - **输入输出**：策略模型输入历史手腕状态和视觉 token，输出动作 chunk；动力学模型输入历史状态和动作，输出未来状态（视觉 token + 3D 点流）；价值模型输入当前状态，输出标量价值（预测能否成功）。
  - **DGAC 具体流程**：面对一个失败状态，先在成功数据集里按“价值相似度”和“状态相似度”检索出一个最接近的成功参考状态。然后利用 Flow Matching 的向量场特性，把当前状态和参考状态的生成方向做加权混合，采样出多个候选动作。接着用动力学模型预测这些动作的未来状态，用价值模型打分，选分数最高的动作作为修正动作。
- **核心 Loss**: 
  - 动作和动力学模型使用 Flow Matching 的 x-prediction 均方误差 Loss（直接回归干净目标）。
  - 价值模型使用回归 Loss，在机器人微调阶段增加了 TD error Loss（时序差分损失），以更好地区分成功和失败状态。
  - 策略更新不使用传统的 RL 梯度更新，而是计算 Advantage（优势函数），通过 CFGRL 的目标函数进行条件策略提取（本质上是给高优势数据更高权重来重新做行为克隆）。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：大规模人类视频数据集（用于预训练），以及真实机器人收集的 7 个操作任务数据（涵盖移动操作臂 Hello Robot Stretch 3 和固定臂 Franka Panda）。
  - Baselines：SWIM, LPB, AWR, RECAP, RISE，以及直接微调 $\pi_{0.5}$（Physical Intelligence 的基座模型）。
- **评价指标**: 真实世界操作任务的成功率（Success Rate）。
- **实验结果**: 
  - 在 7 个真实任务上，该框架将平均成功率从 40.0% 大幅提升至 81.0%。
  - 跨本体泛化：在移动臂和固定臂上均验证了有效性。
  - 即插即用效果：将 DGAC 模块直接应用于 $\pi_{0.5}$ 大模型，成功率从微调后的 62.7% 提升至 88.0%。作为对比，使用相同 rollout 数据但只做简单价值过滤的 RECAP 方法，只能将成功率从 62.7% 提升至 68.0%。这证明了 DGAC 主动纠错比单纯过滤数据有效得多。

### 22. 🔥 [NAC: Neural Action Codec for Vision-Language-Action Models] (NAC：用于视觉-语言-动作模型的神经动作编解码器)
- **研究机构**: `德克萨斯大学达拉斯分校 (The University of Texas at Dallas)`
- **Arxiv ID**: `2606.21372` | [点击跳转](https://arxiv.org/abs/2606.21372)

**0. 论文标题**
- **英文标题**: NAC: Neural Action Codec for Vision-Language-Action Models
- **中文标题**: NAC：用于视觉-语言-动作模型的神经动作编解码器
- **研究机构**: 德克萨斯大学达拉斯分校 (The University of Texas at Dallas)

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型中的动作离散化（Action Tokenization），即把连续的机器人动作轨迹压缩成离散的token序列，让自回归大模型能直接进行预测。
- **研究动机**: 现有的动作tokenizer（如OpenVLA的均匀分箱、FAST的DCT压缩）在压缩率、延迟和下游性能之间很难平衡。音频领域的神经编解码器（如EnCodec, DAC）在压缩连续时间信号上非常成熟，但音频和机器人动作在频率、通道数和感知目标（mel频谱 vs 运动学）上有差异。作者想探究能否直接把音频编解码器架构迁移到动作压缩上，并解决其中的不匹配问题。
- **本质改动**: 把机器人动作chunk展平为1D伪波形信号，套用音频编解码器架构（SEANet编码器 + 多尺度残差向量量化 + Vocos解码器）。最关键的改动是去掉了音频特有的mel频谱重建损失，改用简单的时域重建损失，并加入对抗训练来保留动作的高频细节。
- **技术溯源**: 基于神经音频编解码器架构（SoundStream, EnCodec, DAC, SNAC, Vocos）。下游策略基于自回归行为克隆（Behavioral Cloning）。

**2. 技术拆解**
- **重点改进**: 
  1. **信号转换**：把多维度的动作序列（时间×关节维度）展平成一维信号，当成单通道音频波形处理。
  2. **损失函数替换**：彻底去掉音频模型常用的mel-spectrogram loss，改用MSE或L1等时域重建loss，因为mel频谱不符合机器人运动学特征。
  3. **引入对抗训练**：使用DAC判别器进行对抗训练，强迫解码器还原动作的高频细节（比如快速的速度变化），并放大1000倍的commitment loss防止codebook坍塌。
  4. **结构化Token排布**：采用offset codebooks，把多尺度量化的token按“先粗后细”的顺序拼接，方便自回归模型按因果顺序预测。
- **架构细节**: 
  - **输入输出**：输入是连续动作chunk，输出是离散token序列（解码时还原为连续动作）。
  - **编码器**：SEANet（1D卷积网络），带步长下采样。
  - **量化模块**：多尺度残差向量量化（MRVQ）。每一级量化前做时间平均池化，让前面的codebook捕捉全局粗粒度轨迹，后面的codebook捕捉高频残差。
  - **解码器**：Vocos风格网络，末端接ISTFT（逆短时傅里叶变换）头，把隐空间特征还原回1D时域信号。
- **核心 Loss**: 
  - **生成器Loss** = 重建Loss (MSE/L1) + 1000 × Commitment Loss + 对抗Loss (来自DAC判别器)。
  - **判别器Loss**：标准的GAN对抗Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO-10（仿真）, RoboMimic（仿真）, 8个真实世界机械臂操作任务。
  - **Baseline**：Bin (OpenVLA的均匀分箱), Diffusion Policy, FAST (基于DCT压缩), VQ-VLA, OAT。
- **评价指标**: 
  - 下游任务成功率 (%)。
  - 动作重建MSE（评估tokenizer本身的还原能力）。
  - 压缩率与延迟（Token数量、编解码耗时）。
- **实验结果**: 
  - **消融实验证明**：mel-spectrogram loss会导致性能直接崩溃（成功率接近0），必须用时域loss；对抗训练和ISTFT头对保留高频细节、提升成功率必不可少。
  - **仿真表现**：在LIBERO-10上，NAC成功率49.73%，比OAT (44.17%) 高5.56%，比FAST (38.02%) 高11.71%。在RoboMimic上，NAC (33.94%) 同样优于OAT (31.94%) 和 FAST (28.38%)。
  - **真机表现**：NAC在8个真机任务上平均成功率50%，OAT和FAST为40%。在需要精细微调的任务（如抓葡萄、叠方块）上优势明显。
  - **压缩与延迟**：NAC把动作压缩到12个token（120 bits）。虽然编解码总耗时（约3.5ms）比FAST（0.29ms）慢，但比OAT和VQ-VLA快，且远小于自回归策略的生成时间，完全能满足实际闭环控制需求。

### 23. 🔥 [MV-WAM: Manifold-Aware World Action Model with Value Augmentation] (MV-WAM：基于流形感知与价值增强的世界动作模型)
- **研究机构**: `北京大学、北京人形机器人创新中心`
- **Arxiv ID**: `2606.21088` | [点击跳转](https://arxiv.org/abs/2606.21088)

**0. 论文标题**
- **英文标题**: MV-WAM: Manifold-Aware World Action Model with Value Augmentation
- **中文标题**: MV-WAM：基于流形感知与价值增强的世界动作模型
- **研究机构**: 北京大学、北京人形机器人创新中心

**1. 整体逻辑**
- **研究任务**: 双臂机器人操作策略学习，重点解决模型在分布外（OOD）场景（如光照、背景、物体位置变化）下的视觉与动作泛化问题。
- **研究动机**: 现有的世界动作模型（WAM）引入视频先验后，域内性能提升明显，但 OOD 泛化能力提升不成比例。作者分析发现，这是因为视觉和动作模态存在“流形不匹配”：视觉是高维、高曲率流形，而动作是低维、低曲率流形。用统一的扩散/流匹配目标联合优化时，视觉的复杂几何结构会干扰动作学习，导致动作表征在分布偏移时变得脆弱。
- **本质改动**: 提出 MV-WAM 框架。1) 采用双流专家架构配合非对称因果掩码，让动作生成严格条件化于预测的未来视频帧；2) 针对流形不匹配，为视频和动作设计不同的优化目标（视频预测速度场，动作直接回归干净动作）；3) 引入价值评估模块，在推理时监控任务进度，一旦发现执行偏离正轨，自动触发回滚重采样。
- **技术溯源**: 架构基于 MoTs (Mixture-of-Transformers)；视频专家初始化自 WoW-1.3B（视频生成模型）；文本和视觉特征提取分别基于 umT5 和 SigLIP2；动作空间设计参考 RDT-1B（128维统一动作表示）；生成骨干采用 Flow Matching。

**2. 技术拆解**
- **重点改进**: 
  1. **流形感知的双目标优化**：打破传统 WAM 用单一目标优化所有模态的做法。视频分支（高曲率）使用标准的 Flow Matching 预测速度场；动作分支（低曲率）直接回归干净的动作潜变量（相当于 $x_0$ 预测），消除几何不匹配带来的梯度干扰。
  2. **非对称因果掩码**：在 MoTs 架构中，视频 token 只能自注意力，保证视频生成质量；动作 token 可以 attend 视频和动作 token，确保动作基于预测的视频未来；价值 token 可以 attend 所有模态，用于全局评估。
  3. **价值引导的回滚机制 (Value-Guided Rollback)**：推理时，利用价值 token 预测当前状态的蒙特卡洛回报。如果当前预测价值低于历史峰值一定阈值，说明执行偏离了正轨，系统会自动回退到历史最高价值的状态缓存点，重新采样动作，实现自我纠错。
- **架构细节**: 
  - **输入输出**：输入为历史多视角图像、语言指令、当前状态；输出为 128 维的动作 chunk、未来视频帧潜变量、价值标量。
  - **模型结构**：总参数量 1.9B。包含一个 30 层的 Video Expert（基于 WoW-1.3B，处理视觉 token）和一个 30 层的 Action-Value Expert（处理动作、状态和价值 token，隐藏层维度 768，在共享注意力时投影到 1536 维）。
  - **时间对齐**：Action-Value Expert 的 RoPE 缩放因子设为 Video Expert 的 1/4，以对齐动作 token 和视频 latent 的时间步。
- **核心 Loss**: 
  - 主 Loss 为两部分加权和：$\mathcal{L} = \lambda_v \mathcal{L}_v + \lambda_a \mathcal{L}_a$（权重均为 1）。
  - $\mathcal{L}_v$：视频专家的标准 Flow Matching 速度场预测 Loss（L2 范数）。
  - $\mathcal{L}_a$：动作专家的直接回归 Loss（预测干净动作 $a_0$ 的 L2 范数）。
  - 辅助任务：价值 token 使用蒙特卡洛折扣回报（MC returns）作为监督信号进行回归。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：RoboTwin 2.0 基准（Aloha AgileX 双臂机器人），包含 50 个操作任务。分为 Clean（干净）和 Random（随机光照、背景、物体位置）两种设置。对比基线包括 VLA 模型（$\pi_0$, RDT, UP-VLA, DP）和 WAM 模型（HALO, BagelVLA, Fast-WAM）。
  - **真机**：4 个不同难度的双臂机器人真实物理任务。
- **评价指标**: 任务级别的成功率（Success Rate, SR），分别报告 Clean 和 Random 设置下的成功率及平均成功率（Mean SR）。
- **实验结果**: 
  - **仿真 OOD 泛化**：在 Random 设置下，MV-WAM 平均成功率达到 55.7%，比最强基线（HALO 的 26.4%）高出 29.3%。同时在 Clean 设置下保持 84.0% 的高成功率，证明了其在不牺牲域内性能的前提下大幅提升了 OOD 泛化能力。
  - **真机实验**：在 4 个真实世界双臂任务中，平均成功率达到 77.5%，而基线方法在物理部署中基本失效。
  - **效率**：相比其他 WAM，MV-WAM 参数量更小（1.9B），单卡 A800 推理速度达到 17.9 actions/s。

### 24. 🔥 [Vesta: A Generalist Embodied Reasoning Model] (Vesta：一个通用的具身推理模型)
- **研究机构**: `NVIDIA`
- **Arxiv ID**: `2606.20905` | [点击跳转](https://arxiv.org/abs/2606.20905)

**0. 论文标题**
- **英文标题**: Vesta: A Generalist Embodied Reasoning Model
- **中文标题**: Vesta：一个通用的具身推理模型
- **研究机构**: NVIDIA

**1. 整体逻辑**
- **研究任务**: 将具身智能中的空间定位、视觉导航、具身推理和长程动作规划这四项能力，统一到一个单一的基础模型（Generalist Planner）中。
- **研究动机**: 现有的具身系统通常采用“专家模型”堆叠（如专门的导航模型、专门的推理模型）。这种多模型架构计算开销大、推理延迟高，且前一个模型的误差容易级联放大。作者希望证明，单一通用模型不仅能匹敌，甚至能超越这些专家模型的组合。
- **本质改动**: 用单一 VLM 统一四大能力。核心改动在于构建了一个极度偏向空间定位（Spatial grounding）的混合 SFT 数据集，并设计了一个简单的多模态记忆机制（图文混合）来处理长程任务。
- **技术溯源**: 规划器基座采用 Qwen3-VL-8B；真机实验中的底层动作执行器（Actor）采用 NVIDIA 的 Gr00t-N1.6。

**2. 技术拆解**
- **重点改进**: 
  1. **数据配比**：设计了包含空间智能、导航、Grounding、通用VLM、具身推理和真机数据的混合 SFT 数据集。其中空间相关数据（空间智能27.1% + 导航21.8% + Grounding 20.8%）占比近 70%，强制模型建立空间理解先验。
  2. **记忆机制**：引入了一个极简的多模态记忆机制（Memory Harness），将历史采样图像和文本子任务缓存结合，注入到 prompt 中，解决长程任务的非马尔可夫性问题。
- **架构细节**: 
  - **输入**：当前视觉观测、历史视觉帧（通过记忆机制采样）、文本指令/目标、历史文本缓存。
  - **输出**：所有结构化输出（如定位的像素坐标、导航的航点或转向指令）和自由文本均通过同一个语言头解码。动作规划输出下一步子任务（文本），并强制要求输出 CoT（包含观察、进度、推理、动作四个阶段）。
  - **模型规模**：8B 参数。
- **核心 Loss**: 标准的自回归语言建模 Loss（Next-token prediction）。没有引入复杂的额外辅助 Loss（如视频重建等），主要依靠数据配比和记忆机制来提升性能。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：定位（CrossPoint, EmbSpatial等）、导航（R2R-CE）、具身推理（Open-X VQA, SAT等）、动作规划（AgiBot, 内部 Egocentric-Human 离线集，以及找物体、数水果、记糖果三个真机任务）。
  - **Baseline**：同规模的专家模型和通用模型，如 RynnBrain-8B, RoboBrain 2.5-8B, Qwen3-VL-8B, 以及导航专家 InternVLA-N1-8B。
- **评价指标**: 
  - 定位/推理：各 benchmark 的标准准确率。
  - 导航：SR (成功率), SPL, OS, NE。
  - 动作规划：离线评估使用时间 IoU (Temporal IoU)；真机评估使用任务成功率 (Success Rate)。
- **实验结果**: 
  - **离线 Benchmark**：在四大类任务中，Vesta 平均得分比最强单一 baseline 高 >20%，比“每个类别取最优”的假想专家集成（Oracle ensemble）高 >10%。在导航任务上，Vesta 追平了导航专家 InternVLA-N1。
  - **真机实验**：在需要记忆和长程推理的三个真机双臂任务中，相比纯 Actor (Gr00t-N1.6) baseline，任务成功率提升了 38.3%（统计显著性 >4σ）；相比 Qwen3-VL 规划器提升了 25%。
  - **消融实验**：证明了“通用混合训练”优于“单一专家训练”（存在正向迁移）；记忆机制中“图文混合”优于“纯图”或“纯文”；对动作切换阶段（Transition phase）的数据进行过采样（2倍）能显著提升规划准确率，而单纯增加倍数收益递减。

### 25. 🔥 [MemoryVAM: Integrating Memory into Video Action Model for Robot Manipulation] (MemoryVAM：将记忆机制集成到机器人操作的视频动作模型中)
- **研究机构**: `UCLA (加州大学洛杉矶分校)`
- **Arxiv ID**: `2606.20679` | [点击跳转](https://arxiv.org/abs/2606.20679)

**0. 论文标题**
- **英文标题**: MemoryVAM: Integrating Memory into Video Action Model for Robot Manipulation
- **中文标题**: MemoryVAM：将记忆机制集成到机器人操作的视频动作模型中
- **研究机构**: UCLA (加州大学洛杉矶分校)

**1. 整体逻辑**
- **研究任务**: 基于视频世界模型的机器人长视界及依赖记忆的操作任务（如计数、空间回忆、顺序追踪）。
- **研究动机**: 现有的视频动作模型通常只看固定长度的短期观测窗口（比如最近几帧）。在长视界任务中（例如“把红块拿起来3次”），第1次和第2次拿起红块时的画面看起来几乎一样，但需要的动作和任务进度不同。只看当前画面会导致模型无法区分隐藏的任务进度，产生非马尔可夫问题。
- **本质改动**: 给视频动作模型加了一个“情景记忆”模块。把历史帧压缩成紧凑的记忆 token，然后通过“双路注入”同时塞给“视频预测骨干”和“动作解码器”，让模型在想象未来和输出动作时都能记住之前发生过什么。
- **技术溯源**: 基于视频生成模型，具体实例化了两种视频骨干：UNet (基于 SVD 的 VPP) 和 DiT (基于 Cosmos 的 Cosmos-RF)。视觉特征提取用了 CLIP，记忆压缩用了 Perceiver 架构。

**2. 技术拆解**
- **重点改进**: 提出了 Recap-Cue (RC) 模块和双路注入（Dual Injection）机制，让记忆同时影响视频生成和动作决策。
- **架构细节**: 
  - **记忆压缩**: 用 CLIP 提取历史帧特征，通过 Perceiver 交叉注意力机制压缩成固定长度的记忆 token。
  - **双路注入**: 
    - 路径1（视频骨干）：把记忆 token 通过交叉注意力注入到视频生成骨干（UNet 或 DiT）中，让预测的未来视频符合历史进度。
    - 路径2（动作解码）：把同样的记忆 token 直接拼接到动作解码器的输入特征里，让动作生成也受历史记忆约束。
  - **Cue Gate (提示门)**: 一个轻量级网络，结合视觉特征、记忆 token 和语言指令，估计任务是否完成，用于控制机器人自主停止。
- **核心 Loss**: 
  - **主 Loss**: 视频预测 loss（预测未来帧） + 动作预测 loss。
  - **辅助 Loss 1**: 增量重建 loss（Delta-reconstruction），帮助记忆模块保留画面中的关键变化。
  - **辅助 Loss 2**: 任务边界监督（Cue Gate supervision），利用 episode 的首尾帧（最后一帧为正，前面为负）来训练任务完成度估计，不需要每帧的人工进度标签。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO-Mem 仿真基准（包含计数、排序等10个需记忆任务），以及3个真机任务（Toy Pickup k× 计数, Place and Return 空间回忆, Shell Game 顺序追踪）。
  - **Baseline**: 无记忆的 VPP/Cosmos-RF，以及带记忆的 VLA (SlotVLA, MemoryVLA) 和 Diffusion Policy (Gated Memory Policy)。
- **评价指标**: 
  - 任务成功率（仿真和真机）。
  - 视频预测质量（Last-Frame SSIM, LPIPS, FVD，评估长程预测是否偏离历史）。
  - 停止质量（Stop ratio，评估任务完成后是否还在做多余动作）。
- **实验结果**: 
  - **仿真 (LIBERO-Mem)**: 无记忆基线的平均成功率极低（VPP 为 5%，Cosmos 为 3%）。加上记忆后，UNet 骨干成功率提升到 42.5%，DiT 骨干提升到 40.5%。远超其他带记忆的基线方法（最高仅 19.5%）。
  - **真机**: 在计数、空间回忆、追踪任务上分别达到 78.3%、80.0%、75.0% 的成功率，而无记忆基线在这些任务上基本失效（0% - 5%）。
  - **消融实验**: 证明双路注入缺一不可；辅助 loss 让任务停止时机更准，且视频生成在任务完成后能正确停止（stop ratio 降至 1 以下），说明模型真正理解了任务进度。

### 26. 🔥 [Reference-Free Assessment of Physical Consistency in World Model-based Video Generation] (基于世界模型的视频生成中物理一致性的无参考评估)
- **研究机构**: `汉阳大学 ERICA 校区 (Hanyang University ERICA)`
- **Arxiv ID**: `2606.22363` | [点击跳转](https://arxiv.org/abs/2606.22363)

**0. 论文标题**
- **英文标题**: Reference-Free Assessment of Physical Consistency in World Model-based Video Generation
- **中文标题**: 基于世界模型的视频生成中物理一致性的无参考评估
- **研究机构**: 汉阳大学 ERICA 校区 (Hanyang University ERICA)

**1. 整体逻辑**
- **研究任务**: 评估世界模型生成的机器人操作视频（rollouts）的物理一致性，即检查生成的视频里有没有物体形变、穿模等违背物理规律的幻觉。
- **研究动机**: 现在常用世界模型生成的视频来评估 VLA（视觉-语言-动作）模型。但生成的视频常有物理瑕疵，导致 VLA 在视频里的成功率跟真实世界对不上（Sim-to-Real gap）。现有的视频评估指标（如 FVD）只看整体像素分布，抓不到像素级的物理错误；而人工评估又太贵。
- **本质改动**: 提出了一种不需要真实视频做参考的评估方法。直接拿现成的 SLAM 和光流算法去算生成视频的 3D 一致性和 2D 光度一致性，得出一个“异常分数”来过滤劣质视频，并生成热力图定位出错的具体位置。
- **技术溯源**: 基于 DROID-SLAM（计算 3D 重投影误差）、SEA-RAFT（计算光流/光度一致性）、WorldScore（借鉴其指标思路），并在 WorldGym 环境和 OpenVLA 模型上进行了验证。

**2. 技术拆解**
- **重点改进**: 设计了“相对评估”和“绝对评估”两套机制。相对评估用于给整段视频打分排序，过滤掉物理上不合理的视频；绝对评估用于在单条视频里找出具体哪一帧、哪个像素发生了物理崩溃。
- **架构细节**: 
  - **输入输出**：输入是世界模型生成的机器人操作视频序列；输出是视频的“相对异常分数”以及单帧的“伪影热力图”。
  - **相对评估（定量筛选）**：用 DROID-SLAM 算 3D 重投影误差，用 SEA-RAFT 算平均端点误差（AEPE）作为光度一致性。计算这两个指标分布的 Shannon 熵，用熵的倒数做 softmax 归一化得到权重，加权求和得到最终的异常分数。分数越低，物理越合理。
  - **绝对评估（定性分析）**：只用 DROID-SLAM 的因子图。计算相邻帧重投影误差的跳变（差值），找到误差突增的时间帧。然后在该帧计算因子图边的残差流的像素级幅值，生成热力图，标出空间上的出错位置。
- **核心 Loss**: 本文提出的是评估指标而非训练模型，因此没有传统意义上的 Loss。核心计算为 3D 重投影误差和 2D 光流误差，并利用信息熵进行自适应加权。

**3. 实验结果**
- **数据集和baseline**: 实验使用 OpenVLA 在 BridgeData V2 上的 5 个 OOD（分布外）任务生成的视频（每个任务 30 个，共 150 个）。Baseline 包括随机生成的视频组、未过滤的高异常视频组，对比基准是真实机器人的实际成功率。
- **评价指标**: 使用 GPT-4o 作为奖励模型来评估视频中的任务成功率（Success Rate），以此衡量过滤后的视频是否更接近真实物理世界的表现。
- **实验结果**: 
  - **相对评估效果**：用本文方法过滤出的“低异常”视频组，其 GPT-4o 评估的平均任务成功率达到 74.6%，显著高于随机组（66.2%）和高异常组（70.2%），并且非常接近真实机器人的成功率（79.0%）。证明过滤物理不一致的视频能有效缩小仿真到现实的差距。
  - **绝对评估效果**：成功生成了伪影热力图，准确可视化了机械臂形变等物理崩溃的具体位置和时间。
  - **局限性发现**：在 Sora、Grok 等模型上测试发现，如果伪影是全局一致的（如 Sora），或者非刚性形变太严重导致 SLAM 跟踪崩溃，基于现有 SLAM 的方法会失效。

### 27. 🔥 [SignVLA: Real-Time Sign Language-Guided Robotic Manipulation via Attention LSTM and Vision-Language-Action Models] (SignVLA：基于注意力LSTM和视觉-语言-动作模型的实时手语引导机器人操作)
- **研究机构**: `University College London (UCL)`
- **Arxiv ID**: `2606.20857` | [点击跳转](https://arxiv.org/abs/2606.20857)

**0. 论文标题**
- **英文标题**: SignVLA: Real-Time Sign Language-Guided Robotic Manipulation via Attention LSTM and Vision-Language-Action Models
- **中文标题**: SignVLA：基于注意力LSTM和视觉-语言-动作模型的实时手语引导机器人操作
- **研究机构**: University College London (UCL)

**1. 整体逻辑**
- **研究任务**: 让机器人能够实时理解手语指令，并执行相应的物体抓取和放置等操作任务。
- **研究动机**: 现有的VLA模型基本只支持语音或文本输入，对听障人士不友好，在嘈杂环境下也不可靠。而现有的手语识别模型通常计算量大、延迟高，直接接给VLA会导致指令乱跳（闪烁），机器人没法稳定执行。
- **本质改动**: 不修改VLA模型本身，在VLA前面加了一个轻量级的“手语转文本”中间层。用MediaPipe提取手部关键点，用带注意力的LSTM做实时识别，加个时间平滑模块防止指令闪烁，最后转成自然语言指令喂给下游VLA。
- **技术溯源**: 下游VLA使用的是 NVIDIA 的 GR00T N1，前端特征提取使用 MediaPipe，时序识别模型使用 LSTM + Attention。

**2. 技术拆解**
- **重点改进**: 设计了一个低延迟的手语感知与指令转换模块。核心是解决手语连续时空信号和VLA离散文本指令之间的模态不匹配，以及识别不稳定导致的指令闪烁问题。
- **架构细节**: 
  - **输入输出**: 输入实时RGB视频流，输出给GR00T N1的自然语言指令。
  - **前端感知**: 用MediaPipe提取双手的3D关键点、手指方向和帧间速度差，每帧拼接成544维特征向量。
  - **识别模型**: 输入序列长度设为32帧。用LSTM提取时序特征，加上加法注意力机制（Attention）给关键动作帧分配更高权重，最后接线性分类器。词表精简到33个（专门针对LIBERO操作任务定制）。
  - **稳定模块**: 增加了时间缓冲机制，要求连续3帧预测结果一致，且距离上次提交间隔8帧（cooldown），才把指令发给下游，防止指令闪烁。
  - **下游控制**: GR00T N1（包含VLM和Diffusion Transformer），接收图像和稳定后的文本指令，输出动作控制7自由度Franka机械臂。
- **核心Loss**: 手语识别部分使用带标签平滑（label smoothing）和类别权重（class weight）的加权交叉熵损失（Cross-Entropy Loss），用来解决类别不平衡和过拟合。VLA部分使用常规的GR00T监督微调（SFT）损失。

**3. 实验结果**
- **数据集和baseline**: 
  - **手语识别**: 使用 ASL Citizen 数据集，筛选出33个手语词汇。对比的 baseline 是普通的 Vanilla LSTM。
  - **机器人操作**: 使用 LIBERO 仿真环境（包含 Spatial, Goal, Object, Long 四个任务套件）。
- **评价指标**: 
  - **手语识别**: Top-1 和 Top-5 准确率（Accuracy）。
  - **机器人操作**: 任务成功率（Success Rate）。
- **实验结果**: 
  - **手语识别**: 在33个词的定制词表下，Attention-LSTM 的 Top-1 准确率达到了 88.89%，Top-5 达到 96.53%，大幅优于普通的 Vanilla LSTM（Top-1 仅 34.72%）。
  - **机器人操作**: 用这套手语指令驱动 GR00T，在 LIBERO-Object 任务上成功率达到 98.50%，Spatial 和 Goal 达到 97.50%，长序列的 LIBERO-10 也有 94.50%。
  - **真机情况**: 搭建了 Franka 真机平台，但真机数据采集和闭环测试还没做，目前只在仿真环境里跑通了流程。

### 28. 🔥 [TriMotion: Modality-Agnostic Camera Control for Video Generation] (TriMotion：用于视频生成的模态无关相机控制)
- **研究机构**: `GIST、华为诺亚方舟实验室、延世大学、帝国理工学院`
- **Arxiv ID**: `2606.20774` | [点击跳转](https://arxiv.org/abs/2606.20774)

**0. 论文标题**
- **英文标题**: TriMotion: Modality-Agnostic Camera Control for Video Generation
- **中文标题**: TriMotion：用于视频生成的模态无关相机控制
- **研究机构**: GIST、华为诺亚方舟实验室、延世大学、帝国理工学院

**1. 整体逻辑**
- **研究任务**: 相机控制的视频生成（支持图像到视频 I2V 和视频到视频 V2V），即在生成视频时精确控制相机的运动轨迹。
- **研究动机**: 现有的相机控制方法通常只支持单一模态输入。位姿轨迹控制精确但不直观；参考视频控制灵活但缺乏显式几何约束；文本描述直观但难以保证物理和几何的一致性。需要一种能统一处理多种异构输入模态的框架。
- **本质改动**: 构建了一个统一的运动嵌入空间，将视频、位姿和文本这三种描述相同相机轨迹的输入，映射到同一个共享的连续运动表示中。同时提出在潜空间直接约束生成的视频遵循目标轨迹，避免像素级解码带来的计算开销。
- **技术溯源**: 基于 Wan2.5（潜空间视频扩散 Transformer）作为生成基座；文本编码使用 T5，图像编码使用 CLIP，视频运动特征提取使用 VGGT。

**2. 技术拆解**
- **重点改进**: 
  1. **构建运动三元组数据集**：利用 LLM 将相机外参转化为基于几何的文本描述，实现视频、位姿、文本三种模态数据的同步对齐，为跨模态训练提供监督信号。
  2. **统一运动嵌入空间**：设计了三个特定模态的编码器，通过对比学习、时间同步和位姿回归，把不同模态的输入对齐到同一个共享的运动特征空间。
  3. **潜在运动一致性约束**：训练了一个运动嵌入预测器，直接在潜空间预测运动嵌入并计算约束 loss，避免了传统方法在像素空间解码后再计算误差的高昂成本。
- **架构细节**: 
  - **输入**：源视频/图像、目标噪声潜变量、全局外观描述（T5编码）、首帧图像（CLIP编码）、目标运动嵌入序列。
  - **模型结构**：基于 Rectified Flow 的视频扩散 Transformer。目标运动嵌入序列通过一个特定 block 的投影 MLP 和残差连接，注入到扩散模型的每个 Transformer block 中。训练时只微调 3D 时空注意力层和投影 MLP，冻结主干以保留预训练先验。
- **核心 Loss**: 
  - **统一运动空间 Loss**：全局对比对齐 Loss (InfoNCE) + 时序 token 匹配 Loss (余弦距离) + 辅助的位姿回归 Loss (L1，用于保持几何保真度)。
  - **生成 Loss**：扩散去噪 Loss (预测速度) + 潜在运动一致性 Loss (在潜空间计算预测嵌入与目标嵌入的双粒度余弦距离)。

**3. 实验结果**
- **数据集和baseline**: 
  - **训练集**：Motion Triplet Dataset（基于 Multi-Cam Video Dataset 扩展，包含 136K 视频及对应的位姿和文本描述）。
  - **评估集**：Koala-36M (500个) 和 RealEstate10K (500个)。
  - **Baseline (I2V)**：CamI2V, MotionClone, CamCloneMaster。
  - **Baseline (V2V)**：DaS, TrajectoryCrafter, ReCamMaster, CamCloneMaster。
- **评价指标**: 
  - **视觉质量**：FVD, FID, CLIP Score, VBench 视觉/美学得分。
  - **动态质量**：CLIP-F, VBench 动态得分（运动平滑度、时间闪烁等）。
  - **相机运动精度**：平移误差、旋转误差、相机运动一致性 CamMC（通过 MegaSaM 估计生成视频的位姿来计算）。
  - **V2V 内容保留**：FVD-V, CLIP-V。
- **实验结果**: 
  - 在 I2V 和 V2V 任务中，TriMotion 无论使用文本、视频还是位姿作为条件，其视觉质量（FVD、FID等）和动态质量均优于或持平于现有的 SOTA 方法。
  - 在相机运动精度方面，TriMotion 的平移/旋转误差更低，CamMC 指标更优，说明统一运动空间有效提升了轨迹跟随的准确性。
  - 在 V2V 任务中，TriMotion 的核心指标（如 FVD 降至 235 左右，优于 ReCamMaster 的 253）表现最好，同时在源内容保留（CLIP-V）上也优于 baseline。
  - 此外，共享的运动嵌入空间成功支持了跨模态的运动组合和插值等扩展应用。
