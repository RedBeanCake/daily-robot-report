            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Spatially Conditioned Diffusion Policy: Learning Precise and Robust Manipulation with a Single RGB Camera] (空间条件扩散策略：使用单目RGB相机学习精确且鲁棒的机械臂操作)
- **研究机构**: `KAIST (韩国科学技术院), Neuromeka`
- **Arxiv ID**: `2606.14535` | [点击跳转](https://arxiv.org/abs/2606.14535)

**0. 论文标题**
- **英文标题**: Spatially Conditioned Diffusion Policy: Learning Precise and Robust Manipulation with a Single RGB Camera
- **中文标题**: 空间条件扩散策略：使用单目RGB相机学习精确且鲁棒的机械臂操作
- **研究机构**: KAIST (韩国科学技术院), Neuromeka

**1. 整体逻辑**
- **研究任务**: 基于单目全局RGB相机的视觉模仿学习，用于机器人精确操作（如插USB、抓取杯子特定部位等）。
- **研究动机**: 现有的视觉模仿学习通常依赖多相机（特别是腕部相机）来看清局部细节。如果只用一个全局相机，模型很难同时兼顾“看清精细交互细节”和“在杂乱背景中找准任务目标”。现有单目方法通常把整张图压缩成全局特征，没有显式地去关注任务相关区域，导致在精细操作和抗干扰时表现不佳。
- **本质改动**: 在扩散策略（Diffusion Policy）的去噪过程中，把当前预测的“中间末端执行器轨迹”投影到图像上作为注意力锚点，直接去多尺度特征图里采样对应位置的视觉特征。通俗地说，就是让模型“看着自己接下来要走的路线”去图像里提取有用的视觉信息。
- **技术溯源**: 基于 Diffusion Policy (DP) 框架。视觉编码器基于 ResNet-18 改造为多尺度特征金字塔，动作去噪网络是条件 U-Net。

**2. 技术拆解**
- **重点改进**: 
  1. 引入多尺度图像编码器，同时保留全局上下文和局部精细细节。
  2. 提出空间条件模块（Spatial Conditioning Module），用扩散过程中的中间动作轨迹作为空间查询，动态提取任务相关区域的视觉特征。
- **架构细节**: 
  - **输入输出**：输入为单目RGB图像和机器人当前状态，输出为未来动作序列（Action Chunk）。
  - **多尺度图像编码器**：用 ResNet-18 提取 5 个不同分辨率（stride 4 到 32）的特征图，用 3x3 卷积统一通道维度，得到多尺度特征。
  - **空间条件模块**：
    - **轨迹重建**：根据扩散步当前预测的中间动作（相对位移），累加计算出未来 $s$ 步的末端 3D 轨迹。
    - **轨迹投影**：通过相机内外参，把这 3D 轨迹点投影到 2D 图像像素坐标上。
    - **特征采样**：用双线性插值在 5 个尺度的特征图上采样这些 2D 坐标的特征。在时间步上做平均池化，在尺度上拼接，得到一个包含多尺度空间上下文的一维特征向量。
  - **去噪网络**：条件 U-Net，通过 FiLM 层把上述空间上下文向量和机器人状态注入进去，预测动作噪声。推理时用 DDIM 采样。
- **核心 Loss**: 标准的扩散模型 MSE Loss（预测噪声与真实噪声的均方误差）。没有加额外的辅助任务（如视频重建）。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：Meta-World（54个任务，分4个难度）和 DexArt（4个灵巧手任务）。Baseline 包括 DP（基础扩散策略）、DP3（基于点云的扩散策略）、SKIL（基于分割掩码）和 OTTER（基于VLM）。还对比了带腕部相机或深度相机的设置。
  - **真机**：6个任务（USB/电池插入、杯子把手/杯壁抓取、长序列操作、推方块），包含无干扰、有干扰物、杂乱环境等测试。
- **评价指标**: 任务成功率（%）。
- **实验结果**: 
  - **仿真**：在 Meta-World 中，仅用 20 个 demo，SCDP 在所有难度下成功率均超 80%，平均 87.2%，大幅领先 DP (54.9%) 和 DP3 (82.3%)。在最难的 Hard 任务上，SCDP (82.5%) 甚至超过了带腕部相机的 DP (74.2%) 和带深度相机的 DP3 (60.3%)。
  - **真机**：在要求高精度的 USB 和电池插入任务中，SCDP 成功率远超基线（如 USB 插入 85% vs DP 60%）。在抗干扰和杂乱场景中优势明显，例如推方块在杂乱环境下 SCDP 仍有 70% 成功率，而 DP 掉到 50%，DP3 直接掉到 0%。证明了单目相机下也能实现高精度和强鲁棒性。

### 2. 🔥 [Hy-Embodied-0.5-VLA: From Vision-Language-Action Models to a Real-World Robot Learning Stack] (Hy-Embodied-0.5-VLA：从视觉-语言-动作模型到真实世界机器人学习全栈)
- **研究机构**: `腾讯 Robotics X 实验室 & 腾讯混元团队 (Tencent Robotics X × Tencent Hy Team)`
- **Arxiv ID**: `2606.14409` | [点击跳转](https://arxiv.org/abs/2606.14409)

**0. 论文标题**
- **英文标题**: Hy-Embodied-0.5-VLA: From Vision-Language-Action Models to a Real-World Robot Learning Stack
- **中文标题**: Hy-Embodied-0.5-VLA：从视觉-语言-动作模型到真实世界机器人学习全栈
- **研究机构**: 腾讯 Robotics X 实验室 & 腾讯混元团队 (Tencent Robotics X × Tencent Hy Team)

**1. 整体逻辑**
- **研究任务**: 构建一个端到端的通用机器人学习全栈系统（包含数据采集、模型设计、预训练/微调、RL后训练到真机部署），而不仅仅是提出一个单一的VLA模型。
- **研究动机**: 现有的VLA研究多局限于模型本身，但要让机器人真正落地，数据（遥操作别扭、手持UMI精度低）、模型（通用VLM缺乏物理交互的时空推理）、训练（模仿学习遇瓶颈、RL依赖脆弱的奖励模型）和部署（难以高频闭环）存在系统性的耦合瓶颈，必须全栈协同设计。
- **本质改动**: 打造了一套完整的系统栈：定制高精度指尖UMI+光学动捕硬件收集1万小时高保真数据；基于4B MoT基座设计双塔流匹配动作专家；提出无需奖励模型的离线RL后训练算法（FlowPRO）；并在部署端实现异步推理与动作平滑。
- **技术溯源**: 基于腾讯自研的 **Hy-Embodied-0.5** (4B Mixture-of-Transformers) 视觉语言基座，结合了 **Flow Matching** (流匹配) 生成连续动作，以及 **Pi-MEM** (时空注意力) 处理多帧视觉历史。

**2. 技术拆解**
- **重点改进**: 
  1. **数据端**：用定制指尖UMI结合外部光学动捕，替代传统SLAM，解决手持设备轨迹抖动问题，实现亚毫米级精度的1万小时数据采集。
  2. **模型端**：引入双塔流匹配动作专家预测连续动作；设计紧凑记忆编码器处理多帧历史而不增加Token数；采用增量动作块（Delta-chunk）解耦策略与具体运动学。
  3. **训练与部署**：提出FlowPRO无奖励离线RL算法，直接利用失败数据提升策略；部署端采用异步推理和贝塞尔曲线平滑，保证高频控制。
- **架构细节**:
  - **输入**：多视角多帧RGB图像（如头戴+腕部）、语言指令、本体感受状态（末端执行器位姿）。
  - **骨干网络**：4B参数的 MoT 架构。视觉和文本流使用独立的QKV和FFN参数，仅在共享的自注意力层进行跨模态交互，避免分布偏移。
  - **动作专家**：双塔结构（VLM理解塔 + 动作生成塔）。通过分块因果注意力交互，使用条件流匹配（Flow Matching）预测连续动作的速度场。推理时通过10步欧拉积分生成动作块。
  - **记忆编码器**：在ViT中每隔几层插入时间注意力（因果掩码），复用空间注意力参数。将历史帧信息压缩到当前帧，确保输入VLM的视觉Token数量与单帧时一致，不增加计算负担。
  - **输出**：预测未来 $H$ 步的增量末端执行器动作块（Delta-chunk），包含3D平移、6D旋转和1D夹爪开合，直接解耦了机器人具体的关节运动学。
- **核心 Loss**:
  - **主 Loss**：流匹配损失 (Flow-matching loss)，计算预测的速度场与真实去噪方向（$\epsilon - A_t$）之间的均方误差（MSE）。
  - **辅助 Loss**：Next-token prediction loss (NTP loss)。在混合VQA、2D/3D空间定位等辅助数据时使用，保持VLM的通用语义和空间推理能力。总 Loss 为两者的加权和。

**3. 实验结果**
*(注：提供的文本在第3.1节处截断，未包含第6节具体的实验数值，以下基于摘要和引言中的定性结论进行总结)*
- **数据集和baseline**: 使用了自建的 **Hy-UMI-10K** 数据集（1万小时，110万个episode，70个任务，涵盖厨房、洗衣、灵巧操作等6大类）。对比基线主要包括传统遥操作数据、基于SLAM的常规UMI数据，以及现有的通用VLM和自回归动作VLA模型。
- **评价指标**: 仿真与真实世界任务的成功率、跨具身迁移成功率、以及真机部署时的控制频率和轨迹平滑度。
- **实验结果**:
  - **数据质量提升**：光学动捕彻底解决了传统UMI依赖SLAM导致的轨迹抖动和丢失问题，动作标签精度达到亚毫米级，特别适合精细操作。
  - **RL后训练效果**：通过 FlowPRO 算法，将遥操作中的“干预-回滚”失败案例转化为偏好数据。无需训练奖励模型或价值网络，即可将长尾操作的成功率推向接近上限（near-ceiling success rates）。
  - **跨具身迁移**：Track-B 实验证明，仅使用UMI采集的人类数据，即可零样本/少样本迁移到形态完全不同的目标机器人上。
  - **真机部署**：异步推理流水线重叠了模型前向传播和动作执行，结合贝塞尔曲线动作平滑（保证 $C^1$ 连续），在真实硬件上实现了高频、平滑的闭环控制。

### 3. 🔥 [Self-Improving VLA Policies: Selected Diffusion Noise for Spurious-Robust Action Smoothing] (自我改进的VLA策略：用于抗虚假相关与动作平滑的筛选扩散噪声)
- **研究机构**: `VinUniversity, VinRobotics, KAIST, University of Stuttgart, NUS 等`
- **Arxiv ID**: `2606.14084` | [点击跳转](https://arxiv.org/abs/2606.14084)

**0. 论文标题**
- **英文标题**: Self-Improving VLA Policies: Selected Diffusion Noise for Spurious-Robust Action Smoothing
- **中文标题**: 自我改进的VLA策略：用于抗虚假相关与动作平滑的筛选扩散噪声
- **研究机构**: VinUniversity, VinRobotics, KAIST, University of Stuttgart, NUS 等

**1. 整体逻辑**
- **研究任务**: 在推理时（test-time）优化基于扩散模型的视觉-语言-动作（VLA）策略，提升机器人操作任务的成功率和鲁棒性。
- **研究动机**: 现有的扩散 VLA 策略存在两个痛点：一是容易产生“视觉幻觉”和虚假相关（例如没抓到物体却继续执行放置动作，过度依赖背景特征）；二是生成的动作经常抖动、不平滑，物理上不可行。现有的推理时引导方法（如 CFG 或 best-of-N）通常依赖外部大模型打分或修改模型参数，难以同时解决这两个问题且计算开销大。
- **本质改动**: 提出 Selected Diffusion Noise (SDN) 框架。不修改模型参数，也不引入外部评估器，而是将扩散模型的“初始噪声”作为可控变量。在推理时生成多条候选轨迹，通过“对比目标物体遮挡前后”来过滤掉产生幻觉的噪声种子，再从中挑选出物理运动学最平滑的轨迹。
- **技术溯源**: 基于 Flow Matching（流匹配）的扩散 VLA 基座模型（如 $\pi_0$, GR00T-N1.5, GR00T-N1.6）。

**2. 技术拆解**
- **重点改进**: 将推理时的优化方式从“单步梯度引导”转变为“全局初始噪声筛选”。利用物体遮挡（masking）作为诊断工具来验证动作是否真正依赖目标物体，并利用运动学指标直接筛选物理平滑的轨迹。
- **架构细节**: 
  - **输入输出**: 输入为多模态观测（RGB图像、机器人关节状态、语言指令），输出为动作块（Action chunk）。
  - **模型结构**: VLM 编码器提取多模态特征，Diffusion Transformer 基于 Flow Matching 预测速度场。
  - **SDN 两阶段筛选**:
    1. **Stage 1 (视觉基础过滤)**：用原始观测生成一组正候选动作，用目标物体被遮挡（通过 DINO 和 SAM2 自动追踪并零填充）的观测生成一组负候选动作。使用 kNN 密度估计计算对比得分，保留那些在正集中密度高、在负集中密度低的动作（即动作确实是因为看到了目标物体，而不是脑补的幻觉）。
    2. **Stage 2 (运动学平滑过滤)**：对 Stage 1 筛出的 Top-M 个候选，计算 JerkRMS（加加速度的均方根，即动作的三阶差分）。选择 JerkRMS 最小的动作作为最终输出，确保动作平滑、无剧烈抖动。
- **核心 Loss**: 
  - 训练时：标准的 Flow Matching Loss（回归目标速度场）。
  - 推理时：无 Loss 更新。使用的是两个启发式选择指标：Stage 1 的 kNN 密度差得分（最大化 $d_{\mathcal{B}} - d_{\mathcal{G}}$），以及 Stage 2 的 JerkRMS 最小化。没有额外的辅助重建任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 仿真环境使用 SIMPLER benchmark（包含 Google Robot 的 5 个任务和 Widow-X 的 4 个任务）；真机环境使用 ALOHA 机器人（2 个任务：方块放抽屉、香蕉放锅里）。
  - **Baseline**: 原版 VLA（无额外模块），以及 CFG（无分类器引导）、WNG（白噪声引导）、ACG（动作连贯性引导）等免训练推理时引导方法。底层模型涵盖了 $\pi_0$ 和 GR00T 系列。
- **评价指标**: 任务成功率（Success Rate），以及动作的物理平滑度/稳定性（通过 JerkRMS 等指标和定性轨迹分析评估）。
- **实验结果**: 
  - 相比 Baseline，SDN 在仿真环境中的任务成功率提升了 **+8%**，在真机环境中提升了 **+10%**。
  - 生成的动作轨迹显著更平滑，有效消除了高频抖动。
  - 定性结果显示，SDN 大幅减少了“空气抓取”等视觉幻觉现象，模型注意力更集中于目标物体而非背景干扰。

### 4. 🔥 [PhysVLA: Towards Physically-Grounded VLA for Embodied Robotic Manipulation] (PhysVLA：面向具身机器人操作的物理感知VLA模型)
- **研究机构**: `IIT Madras (印度理工学院马德拉斯分校), NTU (南洋理工大学)`
- **Arxiv ID**: `2606.13886` | [点击跳转](https://arxiv.org/abs/2606.13886)

**0. 论文标题**
- **英文标题**: PhysVLA: Towards Physically-Grounded VLA for Embodied Robotic Manipulation
- **中文标题**: PhysVLA：面向具身机器人操作的物理感知VLA模型
- **研究机构**: IIT Madras (印度理工学院马德拉斯分校), NTU (南洋理工大学)

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在具身机器人物理操作（如抓取、搬运、放置）任务中的表现。
- **研究动机**: 现有VLA模型主要通过拟合示范数据训练，缺乏对刚体动力学和接触约束的显式理解，导致在接触丰富的任务中容易生成物理上不合理的动作（例如：没对准物体就闭合夹爪、放置时不减速导致冲过头）。现有的推理时平滑方法（如EMA）虽然能提高轨迹平滑度，但会抹平接触瞬间的关键响应动作，反而导致成功率下降。
- **本质改动**: 提出一种即插即用、无需训练的推理时外挂框架。不修改原VLA模型权重，通过拦截VLA输出的动作并结合环境状态，利用“阶段状态机”和“动力学残差门”条件性地纠正物理上不合理的动作。
- **技术溯源**: 基于 OpenVLA, OpenVLA-OFT, Force-VLA, Generalist-VLA 等主流VLA基座模型。

**2. 技术拆解**
- **重点改进**: 将物理约束从“训练时正则化”转移到“推理时条件修正”。设计了一个双分支的物理修正器，仅在检测到动作违反物理规律或处于特定操作阶段时进行干预，避免了全局物理惩罚带来的动作僵硬。
- **架构细节**: 
  - **输入/输出**: 输入为VLA预测的7维动作（6维末端位姿增量+1维夹爪）及当前环境状态（末端位姿、关节状态、物体位置等），输出为修正后的执行动作。
  - **分支A（相位感知有限状态机）**: 根据末端与目标的几何距离，判断当前处于“接近、抓取、运输、放置”哪个阶段，并应用特定规则。例如：接近阶段禁止闭合夹爪；放置阶段根据距离按比例减速。
  - **分支B（选择性拉格朗日动力学门）**: 计算机器人运动方程（欧拉-拉格朗日方程）的分析残差。仅当残差超过阈值（即动作在动力学上不一致）时，才激活基于关节惯性加权的修正。
  - **融合与延迟**: 最终动作由 95%的VLA原始动作 和 5%的物理修正动作 混合而成（夹爪指令有硬覆盖）。整个修正过程每步增加不到 1ms 的延迟。
- **核心 Loss**: 本文是纯推理时（inference-time）方法，不需要训练或微调，因此**没有 Loss**。其核心依赖于基于物理方程的残差计算和基于几何规则的硬约束触发机制。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO-Spatial（10个桌面空间推理操作任务，Franka Panda 7-DoF机械臂），以及 Robosuite Lift 任务（用于跨模拟器验证）。
  - **Baseline**: 包含4种VLA基座（OpenVLA单步、OpenVLA-OFT分块、Force-VLA力残差、Generalist-VLA流匹配），以及推理时常用的均匀指数移动平均（EMA）平滑方法。
- **评价指标**: 成功率（Success）、稳定性（Stability）、精度（Precision）、效率（Efficiency），以及跨模拟器测试中的轨迹抖动（Jerk）。
- **实验结果**: 
  - 在 LIBERO-Spatial 上，PhysVLA 在所有4个基座模型上均实现了成功率和稳定性的双提升，且无单任务性能退化。例如，OpenVLA 的成功率从 36% 提升至 53%（绝对提升 17%），稳定性从 20.1% 提升至 36.8%（绝对提升约 16.7%）。
  - 对比传统的 EMA 平滑，EMA 会导致 OpenVLA 成功率下降至 28%，而 PhysVLA 成功打破了“平滑度与成功率不可兼得”的 trade-off。
  - 在 Robosuite 高噪声测试中，PhysVLA 的轨迹抖动比 Baseline 降低了 58%，抖动鲁棒性提升约 10 倍。
  - 在真实 Agilex Piper 机械臂的抓取放置实验中，成功率从 35% 大幅提升至 95%。

### 5. 🔥 [ReactVLA: Fast and Lightweight Reactive Robot Manipulation via Improved Mean Flow Action Generation] (ReactVLA：通过改进的平均流动作生成实现快速轻量级反应式机器人操作)
- **研究机构**: `上海交通大学, 汉堡大学`
- **Arxiv ID**: `2606.14255` | [点击跳转](https://arxiv.org/abs/2606.14255)

**0. 论文标题**
- **英文标题**: ReactVLA: Fast and Lightweight Reactive Robot Manipulation via Improved Mean Flow Action Generation
- **中文标题**: ReactVLA：通过改进的平均流动作生成实现快速轻量级反应式机器人操作
- **研究机构**: 上海交通大学, 汉堡大学

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作中的动作生成。
- **研究动机**: 现有的扩散VLA模型生成动作需要几十步迭代采样，推理延迟高达几百毫秒，跟不上机器人高频闭环控制（反应式操作）的需求。
- **本质改动**: 用改进的平均流（Improved Mean Flow）替代扩散模型做动作生成，把多步采样压缩到1-2步；同时把Transformer里普通的残差连接换成注意力残差（Attention Residuals），防止深层网络里多模态特征被稀释。
- **技术溯源**: 视觉编码器用的 SigLip2，文本编码器用的 SmolVLM，整体框架参考了 SmolVLA 和 π0 等轻量级 VLA 基座。

**2. 技术拆解**
- **重点改进**: 
  1. **动作生成头**：不用传统的局部速度场预测，改用改进的平均流（iMF），直接预测一段区间内的平均传输速度，从而支持大跨度的少步生成。为了解决平均流训练不稳定的问题，加了雅可比向量积（JVP）修正，并用了 Pseudo-Huber Loss 来防止梯度爆炸。
  2. **骨干网络**：用注意力残差Transformer替换普通Transformer。普通残差是层层均匀累加，容易把前面的有用特征冲淡；注意力残差让每一层动态计算权重，从历史层里挑选有用的特征传过来。
- **架构细节**: 
  - **输入**：两路视觉特征（SigLip2提取的agent和wrist视角）、文本指令（SmolVLM提取）、8维本体感觉关节状态。
  - **模型结构**：Transformer主干，隐藏层维度768。预测16步的动作序列（动作维度7）。
  - **模型规模**：0.39B 参数量，属于轻量级模型。
- **核心 Loss**: 
  - 主 Loss 是 **Pseudo-Huber Loss**。用来计算修正后的平均流预测值与目标速度的误差。它的好处是当误差很大时，梯度是有界的，能防止 JVP 修正引入的二阶导数导致训练初期梯度爆炸。没有额外的辅助任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO（标准VLA仿真）、RoboIMI（自建双臂仿真，包含插销和物体传递）、真实机器人平台（Diana 7单臂，包含抓橘子和叠方块）。
  - **Baseline**：Diffusion Policy, OpenVLA, π0 (包含3B和原版), SmolVLA, ACT。
- **评价指标**: 
  - 仿真看**任务成功率**（LIBERO）和**平均累积奖励**（RoboIMI）。
  - 通用指标看**推理延迟（ms）**。
  - 真机看**任务成功率**和**物理推理延迟**。
- **实验结果**: 
  - **LIBERO仿真**：ReactVLA (0.39B) 平均成功率 88.0%，超过了 SmolVLA (0.45B, 87.3%) 和 π0 (4.03B, 86.0%)。因为只需要2步生成，推理延迟降到 18.3 ms，比 Diffusion Policy (178.82 ms) 快近10倍，比 SmolVLA (71.1 ms) 快近4倍。
  - **RoboIMI仿真**：在插销任务上奖励 1513.56（Diffusion Policy 为 1019.39），物体传递奖励 526.22（Diffusion Policy 为 319.20），延迟仅 15.1 ms。
  - **真机实验**：推理延迟控制在 38.6 ms 以内。在精密操作任务上，性能比baseline最高提升1.65倍，推理速度比主流VLA模型快4倍以上。

### 6. 🔥 [ContactWorld: What Matters in Vision-Tactile World Models for Contact-Rich Manipulation] (ContactWorld：接触丰富操作中视觉-触觉世界模型的关键因素)
- **研究机构**: `普渡大学 (Purdue University), 德州农工大学 (Texas A&M University)`
- **Arxiv ID**: `2606.13877` | [点击跳转](https://arxiv.org/abs/2606.13877)

**0. 论文标题**
- **英文标题**: ContactWorld: What Matters in Vision-Tactile World Models for Contact-Rich Manipulation
- **中文标题**: ContactWorld：接触丰富操作中视觉-触觉世界模型的关键因素
- **研究机构**: 普渡大学 (Purdue University), 德州农工大学 (Texas A&M University)

**1. 整体逻辑**
- **研究任务**: 评估和优化用于接触丰富（contact-rich）机器人操作任务的视觉-触觉世界模型，解决多模态感知下的长时域规划问题。
- **研究动机**: 在接触丰富的任务中，世界模型的预测误差极易累积。虽然视觉-触觉多模态世界模型很有潜力，但目前不清楚哪种数据表征属性（如空间结构、时间连续性）对维持稳定的长时域规划最关键。现有研究多关注模型架构，缺乏对表征结构本身的系统性对比。
- **本质改动**: 提出了 ContactWorld 基准测试，包含 12 个接触丰富任务。通过大量实证研究，系统对比了不同视觉（腕部图像、正面图像、点云）和触觉（RGB图像、深度图、力场）表征组合对世界模型规划性能的影响，揭示了表征结构对规划稳定性的决定性作用。
- **技术溯源**: 基于 JEPA (Joint Embedding Predictive Architecture) 架构的潜在世界模型，结合 CEM (交叉熵方法) 进行模型预测控制 (MPC) 规划。模型从头训练（from scratch），未依赖大型预训练基础模型。

**2. 技术拆解**
- **重点改进**: 核心贡献在于通过系统性实验得出三个关键结论：1) 保留空间结构和时间连续性的表征（如点云）规划效果最好；2) 触觉的有效性取决于与视觉表征的兼容性（点云+触觉力场 TacFF 最佳，而非简单的模态堆叠）；3) 规划 horizon 越长，触觉带来的收益越大。
- **架构细节**: 
  - **输入**: 多模态观测。视觉包括腕部视角、正面视角图像或 3D 点云；触觉包括 TacRGB（外观）、TacDepth（深度/形变）和 TacFF（力场/受力分布）。
  - **模型结构**: 使用轻量级模态特定编码器将观测编码为潜在表征。默认采用晚期拼接融合（late concatenation fusion），且仅对视觉潜在表征进行正则化。预测器在潜在空间进行自回归未来预测。
  - **规划**: 使用 CEM 在潜在空间采样候选动作序列，通过自回归潜在滚动预测，最小化预测状态与目标状态在潜在空间的距离来优化动作。
- **核心 Loss**: 主 Loss 为基于 JEPA 的自回归潜在未来预测 Loss（直接在嵌入空间预测，不重建像素）。辅助任务包括对视觉潜在表征的正则化，具体包含方差-协方差正则化 (VC)、草图各向同性高斯正则化 (SIGReg) 以及辅助动力学正则化。

**3. 实验结果**
- **数据集和baseline**: 使用自建的 ContactWorld 基准数据集，包含 12 个任务（如 USB 插入、 peg 插入、刺条拆卸、拧螺母、盲盒探索等）。Baseline 为不同视觉和触觉模态组合的 JEPA 世界模型（如纯视觉、视觉+TacDepth、视觉+TacFF 等）。
- **评价指标**: 规划成功率（Planning success rates）。在不同目标偏移步数（goal-offset steps: 12, 24, 36, 48 步）下评估模型的长时域规划鲁棒性。
- **实验结果**: 
  - **视觉表征对比**: 点云显著优于图像。平均规划成功率从腕部视角的 20.7%、正面视角的 22.0% 提升至点云的 32.1%。点云在插入和拆卸等需要精确几何推理的任务中优势明显。
  - **多模态融合对比**: 点云 + 触觉力场（TacFF）组合效果最好，平均成功率达到 36.1%。图像类触觉（TacRGB/TacDepth）与点云结合反而会导致性能下降，证明跨模态表征的兼容性比单纯增加模态更重要。
  - **长时域规划表现**: 随着规划步数增加（12步到48步），所有模型成功率均下降。但点云模型下降最慢（从 52.1% 降至 16.0%）。在 48 步的长时域规划中，加入 TacFF 后，点云模型的成功率从 16.0% 提升至 20.5%，证明触觉信息能有效减缓长时域自回归预测中的误差累积。

### 7. 🔥 [FlowMo-WM: A World Model with Object Momentum and Hidden Ambient Drift] (FlowMo-WM：一种考虑物体动量与隐藏环境漂移的世界模型)
- **研究机构**: `Dartmouth College, Clemson University, University of Houston`
- **Arxiv ID**: `2606.13817` | [点击跳转](https://arxiv.org/abs/2606.13817)

**0. 论文标题**
- **英文标题**: FlowMo-WM: A World Model with Object Momentum and Hidden Ambient Drift
- **中文标题**: FlowMo-WM：一种考虑物体动量与隐藏环境漂移的世界模型
- **研究机构**: Dartmouth College, Clemson University, University of Houston

**1. 整体逻辑**
- **研究任务**: 训练一个视觉世界模型，仅通过干净的俯视图RGB图像和动作历史，预测水面无人船在未知水流和自身惯性影响下的未来位姿。
- **研究动机**: 现有的动作条件世界模型通常假设物体的运动由当前动作直接决定。但在真实环境（如水面、空中）中，物体会受自身惯性（动量）和隐藏的环境干扰（如水流）影响继续运动。单帧图像无法观测到这些隐藏状态，导致长时程预测时误差快速累积，规划失败。
- **本质改动**: 将输入历史在时间维度上解耦，分为“短历史”和“长历史”两个分支。短历史提取物体自身的运动状态（惯性/动量），长历史提取缓慢变化的环境漂移上下文（水流）。并在隐空间状态转移时，设计了一个“零上下文残差”机制，把基础动作动力学和环境漂移效应在数学上彻底剥离。
- **技术溯源**: 基于经典的视觉隐空间世界模型框架（如Dreamer/PlaNet的RSSM结构、TD-MPC2的紧凑隐动力学、LeWorldModel的端到端联合预测），未使用大语言模型或视觉大模型基座，而是采用CNN+GRU的轻量级架构。

**2. 技术拆解**
- **重点改进**: 
  1. **时序特征解耦**：用两个不同时间尺度的GRU分别提取特征。短分支看最近8帧，捕捉物体的动量、速度和执行器延迟；长分支看32帧（步长为4），捕捉缓慢变化的环境水流漂移。
  2. **零上下文残差转移**：在隐状态转移公式中，显式减去上下文为0时的漂移预测值。这确保了当没有环境上下文输入时，漂移项严格为0，防止模型把基础动力学和漂移效应混为一谈。
- **架构细节**: 
  - **输入**：过去32帧的160x160 RGB图像（拼接了坐标图以提供空间位置信息）和动作历史。
  - **视觉编码器**：4层CNN（使用SiLU激活和CoordConv），提取图像特征。
  - **时序分支**：短分支GRU输出112维的物体运动状态 $z_t$；长分支GRU输出8维的环境漂移上下文 $c_t$。
  - **状态转移**：$z_{t+1} = z_t + F_\theta(z_t, a_t) + R_\theta(z_t, a_t, c_t) - R_\theta(z_t, a_t, \mathbf{0})$。其中 $F$ 是基础动力学，$R$ 是漂移效应。
  - **输出头**：直接预测未来60步的归一化位姿（x, y, cos, sin），不重建图像。
  - **模型规模**：约66万参数，与对比模型严格对齐。
- **核心 Loss**: 
  - **主 Loss**：60步位姿推演的MSE损失（位置误差权重1，航向误差权重2）。
  - **辅助 Loss**：当前位姿重建损失（权重1）和运动增量损失（权重0.5）。没有图像重建Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建的2D水面无人船仿真环境。包含2种船型（双推进器欠驱动、三推进器全向），10种不同的隐藏水流场（均匀、涡流、剪切流等），以及随机化的物理参数（质量、阻力等）。训练集2400个episode，测试集480个episode。模型输入仅为无标注的干净RGB图，没有水流标签或速度传感器数据。
  - **Baseline**：参数量匹配的隐空间预测模型，包括 LeWorldModel风格（单帧隐预测）、PlaNet/RSSM风格（通用循环记忆）、TD-MPC2风格（紧凑短历史隐动力学）。
- **评价指标**: 
  - **开环预测**：60步推演的平均位置误差（pos@60）和航向误差。
  - **闭环规划**：基于采样的模型预测控制（MPC），评估4个任务（到达目标、定点保持、方形航点、Z字形航点）的成功率、最终距离和能量消耗。
  - **消融与分析**：预测时将上下文置零或打乱观察误差变化；用冻结的线性探针（linear probes）检测隐变量中是否编码了真实的动量和流场信息。
- **实验结果**: 
  - **开环预测**：在60步预测时，FlowMo-WM的位置误差为0.344，比最接近的Baseline（PlaNet/RSSM的0.426）降低了约19%；在20步预测时，比TD-MPC2降低了约32%。
  - **闭环规划**：在4000个测试episode中，FlowMo-WM的综合规划成功率达到98.5%，显著高于Baseline的91.0%~93.1%。在欠驱动的双推进器船上优势更明显，因为这类船更难补偿横向水流漂移。
  - **消融实验**：如果将长历史上下文置零，60步位置误差会飙升到0.840；打乱上下文会飙升到1.100。线性探针显示短历史变量确实编码了动量信息（$R^2=0.667$），证明解耦设计让模型真正学到了物理规律，而不是单纯增加了网络容量。

### 8. 🔥 [$\mu_0$: A Scalable 3D Interaction-Trace World Model] ($\mu_0$：一个可扩展的3D交互轨迹世界模型)
- **研究机构**: `马里兰大学学院公园分校 (University of Maryland, College Park), 首尔国立大学 (Seoul National University)`
- **Arxiv ID**: `2606.13769` | [点击跳转](https://arxiv.org/abs/2606.13769)

**0. 论文标题**
- **英文标题**: $\mu_0$: A Scalable 3D Interaction-Trace World Model
- **中文标题**: $\mu_0$：一个可扩展的3D交互轨迹世界模型
- **研究机构**: 马里兰大学学院公园分校 (University of Maryland, College Park), 首尔国立大学 (Seoul National University)

**1. 整体逻辑**
- **研究任务**: 构建一个用于机器人操作的3D世界模型，预测未来交互关键点的3D运动轨迹，并以此作为运动先验指导下游机器人生成具体动作。
- **研究动机**: 现有的像素级视频生成模型把算力浪费在背景重建上，难以捕捉操作所需的精确几何和接触结构；而直接预测动作的VLA模型（如$\pi_0$）依赖特定机器人形态的动作数据，难以规模化。此外，现有的轨迹预测方法存在三个缺陷：1）对工具尖端、接触点等任务关键小区域采样不足；2）在2D或局部3D空间操作，混淆了物体运动和相机运动；3）长视频只配整段（episode）级别的文本描述，缺乏细粒度的事件级意图。
- **本质改动**: 放弃预测密集像素或直接预测动作，改为预测“3D交互轨迹”（物体、工具、手、接触点等关键语义点的3D平滑轨迹）。提出TraceExtract数据管道自动从视频中提取带事件级文本的3D轨迹，训练$\mu_0$世界模型预测这些轨迹。推理时冻结$\mu_0$，外接动作专家（Action Expert）来适配不同形态的机器人。
- **技术溯源**: 基于预训练的视觉语言模型 SmolVLM2-2.2B 作为多模态骨干，结合 DINOv2 提取语义特征，使用 Flow Matching（流匹配）生成平滑轨迹。

**2. 技术拆解**
- **重点改进**: 
  1. **数据端 (TraceExtract)**：用DINOv2聚类提取语义关键点（解决小目标漏采）；通过全局-局部重建对齐到统一3D坐标系（消除相机运动干扰）；利用轨迹加速度峰值进行运动切分，并配上事件级Caption（解决长视频描述粗糙）。
  2. **模型端 ($\mu_0$)**：用B-spline（B样条）控制点表示轨迹（保证平滑和紧凑）；设计置换等变（Permutation-Equivariant）的Trace Expert处理无序关键点；使用带语义结构约束的Flow Matching进行去噪生成。
  3. **下游适配**：冻结预训练的$\mu_0$，训练一个Action Expert，利用$\mu_0$去噪过程中的中间特征作为运动先验，结合本体感知和语言生成动作。
- **架构细节**: 
  - **输入**：当前RGB图像、语言指令、可选深度图、历史关键点查询集（Query）及历史轨迹。
  - **结构**：SmolVLM2编码RGB和语言，深度图走单独的patch stem并共享SigLIP层。Trace Expert通过交叉注意力获取VLM特征。每个关键点被token化为包含历史/未来段嵌入、傅里叶位置嵌入和DINO局部语义特征的查询Token。
  - **输出**：未来一段时间内各关键点的3D B-spline控制点（解码后为平滑3D轨迹）。
  - **规模**：骨干为2.2B参数的SmolVLM2。
- **核心 Loss**: 
  - **主 Loss**：$\mathcal{L}_{flow}$ (Flow Matching Loss)，用于匹配B-spline控制点的速度场。
  - **辅助 Loss 1**：$\mathcal{L}_{done}$，预测关键点轨迹是否因遮挡或丢失而终止（有效性预测）。
  - **辅助 Loss 2**：$\mathcal{L}_{rig}$，语义刚性损失，鼓励同一DINO聚类内的关键点保持局部几何结构不变。

**3. 实验结果**
- **数据集和baseline**: 
  - **轨迹预测**：对比了 Gemini-3.1-pro, GPT-5.5, Track2Act, Hamster, 3DFlowAction, Dream2Flow, TraceGen。
  - **动作生成（仿真）**：RoboCasa365数据集（8个厨房任务），对比 Diffusion Policy, $\pi_0$, $\pi_{0.5}$, TraceGen+Action Expert。
  - **动作生成（真机）**：UR3机械臂，3个任务（Pick into Sink, Pour Almonds, Unfold Towel），对比 VLM+Action Expert, $\pi_0$, $\pi_{0.5}$, TraceGen。
- **评价指标**: 
  - **轨迹预测**：仅评估移动点。使用平均位移误差（ADE）、最终位移误差（FDE）、动态时间规整（DTW，评估轨迹形状）。
  - **动作生成**：任务成功率（Success Rate %）。
- **实验结果**: 
  - **轨迹预测**：在2D和3D轨迹预测上，$\mu_0$在Top-5 ADE、FDE和DTW上全面优于基线。推理速度极快（0.29s/图），比最快的2D基线Track2Act（0.85s）快近3倍。
  - **仿真动作生成**：在RoboCasa365上，$\mu_0$+Action Expert平均成功率30.25%，比不用动作监督预训练的$\pi_0$（25.25%）高5%，比同为视频预训练的TraceGen（23%）高7.25%。（注：$\pi_{0.5}$使用了大量动作数据预训练，成功率42%，此处主要体现无动作数据预训练下的竞争力）。
  - **真机动作生成**：在3个UR3任务上，$\mu_0$平均成功率91.7%，比$\pi_0$高20%，比$\pi_{0.5}$高11.7%，比TraceGen高10%。

### 9. 🔥 [Encoder Winners Do Not Reliably Transfer Across VLA Backbone Scale: A Frozen-Backbone Grafting Diagnostic] (视觉编码器优胜者无法可靠地跨VLA主干规模迁移：一种冻结主干的嫁接诊断方法)
- **研究机构**: `清华大学 (Tsinghua University)`
- **Arxiv ID**: `2606.14153` | [点击跳转](https://arxiv.org/abs/2606.14153)

**0. 论文标题**
- **英文标题**: Encoder Winners Do Not Reliably Transfer Across VLA Backbone Scale: A Frozen-Backbone Grafting Diagnostic
- **中文标题**: 视觉编码器优胜者无法可靠地跨VLA主干规模迁移：一种冻结主干的嫁接诊断方法
- **研究机构**: 清华大学 (Tsinghua University)

**1. 整体逻辑**
- **研究任务**: 探究在小规模视觉-语言-动作（VLA）模型上筛选出的最佳视觉编码器，能否直接迁移到大规模VLA模型上并取得同样最好的效果。
- **研究动机**: 现有的VLA模型通常直接沿用上游VLM的视觉编码器。以往关于编码器选择的研究都是和语言模型从头联合训练的，导致“编码器本身的质量”和“编码器与主干的共适应”耦合在一起。当研究者拿到一个已经预训练好的大VLA模型想换个视觉编码器时，缺乏控制变量的实验证据来指导选择，盲目替换容易浪费算力。
- **本质改动**: 提出一种“冻结主干嫁接（Frozen-Backbone Grafting）”诊断协议。保持VLA的语言模型、动作专家以及原始视觉塔完全冻结，仅替换候选视觉编码器，并只训练一个极小的线性投影层来对齐特征，从而纯粹地评估不同视觉编码器的特征质量。
- **技术溯源**: 基于 SmolVLA-450M（4.5亿参数，小主干）和 $\pi_{0.5}$-3.3B（33亿参数，大主干）两个开源VLA基座模型。

**2. 技术拆解**
- **重点改进**: 设计了一套严格控制变量的特征替换流水线，将视觉编码器的评估与语言/动作模块解耦。通过固定训练步数（2000步）和仅训练轻量级投影层（0.37M-1.58M参数），排除了联合训练带来的干扰，隔离出视觉编码器本身的贡献。
- **架构细节**: 
  - **输入输出**: 输入224x224 RGB图像，输出与原始VLA视觉塔形状完全一致的特征张量（SmolVLA为64个token，$\pi_{0.5}$为256个token）。
  - **模型结构**: 候选视觉编码器（冻结） -> 确定性自适应平均池化（AdaptiveAvgPool2d，用于统一token数量） -> LayerNorm -> 单层线性投影层（整个流程中唯一可训练的部分）。
  - **模型规模**: 测试了4种代表性编码器：SigLIP（93M，语义ViT）、DINOv2-small（22M，几何ViT）、FastViT-SA12（11M，边缘混合Transformer）和 RepViT-M1（5M，轻量级CNN）。
- **核心 Loss**: 动作预测的均方误差（Action MSE）。由于预训练模型（SO-100机械臂）和评估环境（LIBERO的Franka机械臂）存在具身不匹配（Embodiment Mismatch），导致闭环成功率接近0，因此本文放弃闭环指标，仅使用离线验证集上的动作MSE和L1误差作为评价Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO基准的两个任务集（libero_spatial 和 libero_object），每个包含约2.5万训练窗口和6千验证窗口。
  - **Baseline**: 未修改的原始 SmolVLA 和 $\pi_{0.5}$ 模型（使用它们自带的SigLIP编码器，并在相同数据上按相同协议微调）。
- **评价指标**: 离线动作预测的均方误差（val_mse），辅以 L1 误差。
- **实验结果**: 
  - **小模型赢家无法可靠迁移到大模型**: 在 SmolVLA（小主干）上，语义编码器 SigLIP 在两个任务集上都是第一名；但在 $\pi_{0.5}$（大主干）上，空间任务集（spatial）变成了几何编码器 DINOv2 最好，物体任务集（object）则是 SigLIP、DINOv2 和 FastViT 成绩非常接近（差距在2.7%以内），且第一名会随随机种子变化而改变。
  - **统计显著性**: 在4组“主干-任务”对比中，有3组支持“最佳编码器依赖于主干规模”的结论。在更细粒度的12个（主干、任务、种子）单元格中，有11个支持该结论。
  - **协议局限性**: 嫁接协议本身是非中性的（替换编码器会导致SmolVLA的MSE增加45-56%，$\pi_{0.5}$的MSE降低50-52%），因此结论是在该固定协议下的条件结论。
  - **计算效率**: 该诊断方法成本极低，每个配置在单张Blackwell GPU上只需几分钟（SmolVLA）到约5小时（$\pi_{0.5}$），适合在大规模训练前进行快速验证。

### 10. 🔥 [WAM4D: Fast 4D World Action Model via Spatial Register Tokens] (WAM4D：通过空间寄存器Token实现快速4D世界动作模型)
- **研究机构**: `北京大学、香港科技大学、北京人形机器人创新中心`
- **Arxiv ID**: `2606.14048` | [点击跳转](https://arxiv.org/abs/2606.14048)

**0. 论文标题**
- **英文标题**: WAM4D: Fast 4D World Action Model via Spatial Register Tokens
- **中文标题**: WAM4D：通过空间寄存器Token实现快速4D世界动作模型
- **研究机构**: 北京大学、香港科技大学、北京人形机器人创新中心

**1. 整体逻辑**
- **研究任务**: 机器人操作中的世界动作模型（World Action Models），即联合预测未来视频观测和可执行的机器人动作。
- **研究动机**: 现有的2D世界动作模型缺乏3D空间和接触几何信息，导致精细操作容易失败；而现有的4D模型（显式预测深度或点云）虽然物理一致性好，但推理时需要解码密集的几何信息，导致推理极慢、延迟高。核心矛盾在于“引入3D几何先验”与“保持推理速度”难以兼顾。
- **本质改动**: 将4D几何信息（深度）仅作为训练时的辅助监督信号。在训练时引入轻量级的“空间寄存器Token”，把预训练几何模型的先验蒸馏到视频-动作特征中；在推理时直接砍掉几何分支，只保留纯2D到动作的轻量接口，从而实现快速推理。
- **技术溯源**: 基于 LingBot-VA（因果视频-动作骨干网络）、Wan2.2（视频VAE）、Depth Anything V3（几何先验/深度预测头）。

**2. 技术拆解**
- **重点改进**: 
  1. **空间寄存器蒸馏（Spatial Register Distillation）**：训练时加入可学习的寄存器Token，通过交叉注意力从历史视频特征中提取信息，送入预训练的深度头预测未来深度。深度Loss反传更新主干网络，把几何先验“注入”主干。推理时直接丢弃寄存器和深度头。
  2. **因果混合注意力（Causal Mixture Attention）**：设计严格的注意力掩码。未来动作Token只能看到历史视频、历史动作和未来的动作噪声，**绝对不能**看到未来视频和寄存器Token，防止动作预测“走捷径”（非因果捷径）。
- **架构细节**: 
  - **输入**：语言指令、多视角RGB历史帧（拼成单张马赛克图像）、历史动作队列。
  - **主干**：Mixture-of-Transformers (MoT)，处理视频和动作Token。
  - **寄存器设计**：寄存器网格与多视角RGB马赛克的空间布局严格对齐（主视角8x10，腕部4x5），每个寄存器对应图像的一个32x32像素区域。在Transformer的第12, 14, 16, 18层后插入深度提取块（DepthBlock），寄存器作为Query去查询历史视频特征。
- **核心 Loss**: 
  - **主 Loss**：条件 Flow Matching（用于未来视频和动作的生成，包含视频重建Loss和动作生成Loss）。
  - **辅助 Loss**：未来深度的 SmoothL1 Loss（用于监督寄存器分支，并反传更新主干网络）。总 Loss = L_video + L_action + L_depth。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真**：RoboTwin 2.0（包含Clean和Randomized设置，50个任务）。Baseline: π0, π0.5, Motus, LingBot-VA, Fast-WAM。
  - **真机**：AstriBot S1机器人，4个操作任务（盘子、瓶子、笔帽、乐高），每个任务100条demo，10次物理rollout。
- **评价指标**: 
  - **策略**：任务成功率（Success Rate）。
  - **效率**：推理延迟（Latency）和显存占用（VRAM）。
  - **视觉/几何质量**：FVD, PSNR, AbsRel, 点云Chamfer Distance等（用于验证几何一致性）。
- **实验结果**: 
  - **仿真（RoboTwin 2.0）**：WAM4D平均成功率91.8%，与LingBot-VA（92.3%）和Fast-WAM（91.8%）基本持平，远超VLA基线（π0 62.2%, π0.5 79.8%）。核心优势在于**推理效率**：推理延迟降至525ms（LingBot-VA为843ms，Motus为1516ms），显存占用降至9.71 GiB（LingBot-VA为12.97 GiB）。
  - **真机表现**：平均成功率达到90%，显著优于π0.5（74%）、LingBot-VA（84%）和Fast-WAM（80%）。在需要精细空间推理的任务（如拔笔帽、乐高分拣）上优势尤为明显，证明了训练时注入的3D几何先验有效提升了真机操作的空间一致性。

### 11. 🔥 [RT-VLA: Real-Time Vision-Language-Action Models via Knowledge Distillation] (RT-VLA：通过知识蒸馏实现实时视觉-语言-动作模型)
- **研究机构**: `Carnegie Mellon University (CMU)`
- **Arxiv ID**: `2606.14010` | [点击跳转](https://arxiv.org/abs/2606.14010)

**0. 论文标题**
- **英文标题**: RT-VLA: Real-Time Vision-Language-Action Models via Knowledge Distillation
- **中文标题**: RT-VLA：通过知识蒸馏实现实时视觉-语言-动作模型
- **研究机构**: Carnegie Mellon University (CMU)

**1. 整体逻辑**
- **研究任务**: 端到端自动驾驶（基于视觉-语言-动作 VLA 模型的轨迹预测与驾驶决策）。
- **研究动机**: 现有的 VLA 模型（如 SimLingo）虽然能结合视觉感知和语言推理，但大模型骨干和自回归生成导致推理极慢（单帧高达 1.5 秒），完全无法满足自动驾驶的实时控制需求。
- **本质改动**: 用知识蒸馏把大模型（SimLingo）压缩成轻量级小模型（RT-VLA）。同时，在架构上将“实时开车”和“语言解释”解耦，实时控制时不跑语言大模型，需要复盘解释时再离线调用，从而在不增加实时延迟的前提下保留语言推理能力。
- **技术溯源**: 教师模型基于 SimLingo（视觉编码器 InternVL-2 + 语言模型 Qwen2-0.5B）；学生模型视觉编码器换成了更轻量的 EVA-02，语言模块大幅缩减。

**2. 技术拆解**
- **重点改进**: 
  1. **多层级蒸馏**：不仅蒸馏最终的 waypoint 和语言输出，还强制学生模型学习教师模型的中间视觉特征和 Query 特征。
  2. **架构解耦**：将模型拆分为“实时驾驶分支”和“离线语言分支”。
  3. **On-policy 语言微调**：在离线蒸馏后，让学生模型自己自回归生成文本，再用教师模型评估这些生成的文本进行优化，解决训练和推理时的分布偏移（Exposure Bias）问题。
- **架构细节**: 
  - **输入**：前视相机图像、自车速度、GPS 目标点。
  - **驾驶分支**：EVA-02 提取视觉 token，结合状态 token 和可学习的任务/路径/速度 query token，输入轻量级语言模型，输出几何 waypoint 和时间速度 waypoint。
  - **语言分支**：视觉 token 经过 Perceiver Resampler 压缩后，输入紧凑语言模型输出文本 logits。
  - **对齐机制**：因为师生模型的视觉特征维度和 token 长度不同，加入了投影层和自适应平均池化层进行特征对齐。
- **核心 Loss**: 采用两阶段训练：
  - **第一阶段（训练驾驶，冻结语言）**：Driving Loss = GT waypoint 的 L2 Loss + 视觉特征蒸馏 L2 Loss + Query 特征蒸馏 L2 Loss + Waypoint 预测蒸馏 L1 Loss。
  - **第二阶段（训练语言，冻结驾驶）**：Language Loss = GT 文本的交叉熵 Loss + 师生语言 logits 的 KL 散度 Loss。

**3. 实验结果**
- **数据集和baseline**: 在 CARLA 仿真器的 Bench2Drive 数据集（220 条路线）上测试。Baseline 为 SimLingo（完整版）和 SimLingo-BASE（纯视觉版）。
- **评价指标**: Driving Score (DS，综合路线完成率与违规惩罚), 单帧推理时间 (Time/Frame), 语言解释质量（使用 DeepSeek-V4-Flash 作为裁判打分）。
- **实验结果**: 
  - **速度大幅提升**：纯视觉模式下推理仅需 34.5 ms/帧，比教师模型（1544 ms）快 **44.8 倍**；即使开启语言分支也只需 196 ms/帧，快 **7.9 倍**。
  - **驾驶性能持平**：DS 达到 85.19，与教师模型（85.07）持平，略低于无语言能力的基线（85.94），证明在大幅减小的同时保住了驾驶能力。
  - **语言能力保留**：语言解释质量得分 50.9，与教师模型（51.8）差距极小。
  - **消融实验**：如果不使用蒸馏，DS 直接暴跌至 34.05；使用蒸馏后提升至 85.17。加入 On-policy 语言微调后，语言质量得分从 47.0 提升至 50.9，证明了这两项改动的必要性。

                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise();
                    }
                }
