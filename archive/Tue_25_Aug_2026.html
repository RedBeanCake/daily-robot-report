            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models] (带着意图行动：为视觉-语言-动作模型蒸馏行为意图)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.23478` | [点击跳转](https://arxiv.org/abs/2608.23478)

**0. 论文标题**
- **英文标题**: Act with Intent: Distilling Behavior Intent for Vision-Language-Action Models
- **中文标题**: 带着意图行动：为视觉-语言-动作模型蒸馏行为意图
- **研究机构**: 原文未提及
- **一句话总结**: 提出意图蒸馏（Indi）方法，利用冻结的教师VLM提取行为片段的局部语义目标，并将其作为中间隐状态注入VLA动作解码器，使模型在生成动作时显式建模“行为意图”，大幅提升了仿真与真机操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: [领域：具身智能/机器人学习；类型：方法创新] 提升视觉-语言-动作（VLA）模型在机器人操作任务中的策略性能与泛化能力。
- **研究动机**: 现有VLA模型的动作解码器主要依赖行为克隆，只模仿具体动作，缺乏对行为局部语义目标（即“为什么要做这个动作”）的显式建模。现有的基于未来状态的监督（如预测未来帧或轨迹）只关注行为的具体物理实现，而非其服务的共享语义目标，导致模型难以应对“同一目标多种执行方式”或“相似阶段不同目标”的复杂情况。
- **本质改动**: 摒弃单纯模仿动作或预测未来物理状态的范式，利用冻结的教师VLM提取已执行行为片段的“多模态行为意图”（局部语义目标），并将其作为中间语义状态蒸馏到学生VLA的动作解码器中，指导后续的动作与接地（grounding）预测。
- **技术溯源**: 基于 GR00T-N1.7 和 $\pi_{0.5}$ 等 VLA 基座模型，使用 Cosmos-Reason2-8B 作为教师 VLM。

**2. 技术拆解**
- **核心方法**: 意图蒸馏（Intention Distillation, Indi）。包含三个核心组件：1) 意图提取：教师VLM根据当前观测、指令、粗略动作摘要和执行视频，生成多模态意图表示作为目标，并生成功能目的陈述和端点视觉特征作为辅助接地。2) 意图恢复：在动作解码器中间层引入可学习的意图查询（intent queries），学习恢复教师的多模态意图表示。3) 意图感知解码：恢复的意图作为中间状态参与后续动作和接地预测。部署时移除教师及目标生成模块。
- **关键细节**: 
  - 教师模型使用 Cosmos-Reason2-8B，离线生成目标。意图目标取教师处理多模态输入时的中间层（第18层）隐藏状态，分块平均池化为8个槽位。
  - 解码器结构：在 GR00T-N1.7 的 DiT 流或 $\pi_{0.5}$ 的动作专家后缀中，追加意图查询、视觉接地行和文本接地行。
  - 信息流控制：意图查询只关注VLA上下文和自身；接地行关注意图和自身；动作行关注意图和接地行。通过上下文 dropout（概率0.5）强制动作和接地行在部分训练中必须通过意图行获取上下文。
  - 规模与开销：GR00T-N1.7 增加 46.4M 参数（+1.3%），推理时间从 56.1ms 增至 61.5ms；$\pi_{0.5}$ 增加 23.1M 参数（+0.64%），推理时间从 24.4ms 增至 29.7ms。
- **训练/优化目标**: 
  - 动作预测损失（Flow-matching/diffusion loss）。
  - 意图对齐损失：在解码器中间层（GR00T第16块，$\pi_{0.5}$第9层）提取意图状态，通过MLP投影后与教师意图目标计算余弦距离。
  - 视觉和文本接地预测损失：对齐恢复的视觉/文本状态与端点视觉/文本目标。
  - 意图不匹配损失（Margin loss）：通过循环移位 batch 内的意图表示，强制下游预测对意图具体内容的敏感性，而非仅仅依赖隐状态通路。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：仿真环境使用 SimplerEnv-Bridge（4个桌面任务）和 RoboCasa Kitchen（24个家庭厨房任务）；真机环境使用4个桌面操作任务（包含标准场景、未见物体和干扰物条件）。
  - 对比对象（baseline）：主要对比 GR00T-N1.7 和 $\pi_{0.5}$ 的原始版本，以及基于未来视觉特征对齐的 future supervision 变体。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - SimplerEnv-Bridge：Indi 将 GR00T-N1.7 的平均成功率从 64.3% 提升至 84.7%（+20.4 pp）；将 $\pi_{0.5}$ 从 52.3% 提升至 58.8%（+6.5 pp）。
  - RoboCasa Kitchen：Indi 将 GR00T-N1.7（100 demos/task）的平均成功率从 64.1% 提升至 70.3%（+6.2 pp），在“其他”类任务上提升显著（+14.0 pp）；将 $\pi_{0.5}$ 从 34.9% 提升至 41.4%（+6.5 pp）。
  - 真机任务：平均成功率从 62.0% 提升至 68.7%，在长 horizon 任务（如跨箱堆叠、抽屉收纳）上提升尤为明显（分别提升 7.3 pp 和 10.7 pp），且在未见物体和干扰物条件下保持了良好的泛化能力。
  - 机制分析：消融实验证明性能提升主要来源于教师衍生的意图监督，而非单纯的容量增加或未来状态预测。干预实验表明，恢复的隐状态确实编码了行为目标和执行进度，并因果地组织了下游的动作预测。

### 2. 🔥 [Pointing-VLA: Typed Spatial Grounding Interfaces for Vision-Language-Action Manipulation] (Pointing-VLA：用于视觉-语言-动作操作的类型化空间定位接口)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.23138` | [点击跳转](https://arxiv.org/abs/2608.23138)

**0. 论文标题**
- **英文标题**: Pointing-VLA: Typed Spatial Grounding Interfaces for Vision-Language-Action Manipulation
- **中文标题**: Pointing-VLA：用于视觉-语言-动作操作的类型化空间定位接口
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Pointing-VLA，用类型化的隐状态空间读出（点、热图、轨迹）替代自回归文本坐标，为 VLA 模型提供高效、可检查的空间定位接口，大幅提升了机器人操作的成功率与推理速度。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在机器人操作中空间定位（spatial grounding）接口脆弱的问题，打通多模态推理与底层机器人执行的接口。
- **研究动机**: 现有 VLA 模型多用自回归文本生成坐标或不透明的动作 token。文本坐标需要耗费 token 生成数字且解析易错，把几何当成事后处理；动作 token 则隐藏了空间推理逻辑，不便于调试。此外，将稀疏点、密集功能区域和时序轨迹等不同几何形态强行折叠到单一输出分布或全部序列化为文本，会导致负干扰，且推理慢、不稳定。
- **本质改动**: 将具身空间定位从“文本坐标生成”转变为“类型化接口预测（typed interface prediction）”，直接从多模态隐状态中解码出特定几何形态的机器人执行目标，不再经过文本序列化。
- **技术溯源**: 基于 Embodied-R1（多模态视觉语言基座），结合 CuRobo（碰撞检测运动规划器）、NORA-1.5（跨模型迁移验证）、$\pi_{0.5}$（底层动作策略）。

**2. 技术拆解**
- **核心方法**: 
  1. 类型化隐状态空间读出（Typed Hidden-State Spatial Readout）：设计三个并行的几何专家头，分别输出归一化目标点（Pointing）、物体功能接触热图（OFG）和视觉轨迹航点（VTG）。
  2. 显式执行契约（Explicit Execution Contracts）：在抓取-放置（pick-place）任务中，将 PICK 阶段固定绑定到源条件 OFG（提取功能接触点），PLACE 阶段固定绑定到 Pointing（提取目标放置点），实现执行阶段与几何形态的严格对齐。
- **关键细节**: 
  - 模型结构：共享 Embodied-R1 的多模态隐状态和 Grounding Adapter，每个专家头配备独立的 LoRA、learned queries 和解码器。Pointing 和 OFG 使用 8 个 grounding queries，VTG 使用时序 queries 直接 attend 全序列。
  - Pointing 头：通过 pointer query 输出 $[0,1]^2$ 的归一化坐标，直接作为放置目标。
  - OFG 头：用全局特征通过 FiLM 调制视觉特征图，经卷积网络输出热图，取峰值作为抓取接触点，保留密集的空间范围信息。
  - 坐标转换：外部 wrapper 结合深度图和相机内参，将图像空间输出转换为机器人基坐标系下的物理目标。
- **训练/优化目标**: 
  - 监督损失：Pointing 和 VTG 使用 SmoothL1 Loss；OFG 使用高斯关键点 MSE 和类别平衡 BCE（用于密集 affordance mask）。
  - 强化学习微调：对 Pointing 头引入 GRPO（Group Relative Policy Optimization）风格的组归一化细化，直接在连续空间头上进行奖励优化。
  - 特化训练：对源条件 OFG 结合 dense source-mask reconstruction 和 distractor suppression 进行 LoRA 特化，提升抗干扰和实例区分能力。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：VABench-P, Part-Affordance-2K, VABench-V, RefCOCO, AGD20K, RoboAff 等空间定位数据集；Bridge/WidowX 仿真环境；AgileX PiPER 真实机器人。
  - 对比对象（baseline）：GPT-4o, Qwen2.5-VL, RoboPoint, FSD, Embodied-R1, Octo-S, SpatialVLA, SoFar, MemoryVLA, $\pi_{0.5}$ 等。
- **评价指标**: 
  - 空间定位：Point-in-mask (PIM) 和 Point-in-bbox (PIB) 准确率。
  - 轨迹预测：RMSE, ADE, FDE。
  - 机器人任务：任务成功率（Success rate），推理加速比。
- **主要结果**: 
  - 空间定位能力：OFG 在 Part-Affordance-2K 上的准确率从 Embodied-R1 的 40.9% 提升至 57.3%，证明了类型化头对密集功能区域的有效保留。
  - 仿真部署：在 Bridge/WidowX 的 4 个任务中，固定的 OFG-PICK/Pointing-PLACE 契约在开启碰撞检测的 CuRobo 下平均成功率达 72.9%，达到 SOTA。
  - 效率与迁移：类型化读出比 Embodied-R1 文本解码快 6.68–6.90 倍。迁移到 NORA-1.5 基座时，保持或提升了成功率，且控制器记录时间缩短 20 倍以上。
  - 真机部署：结合 $\pi_{0.5}$ 策略，在 3 种视觉上下文（无干扰、黄/红圆柱干扰）中，真实机器人自主任务成功率从 52.7% 提升至 80.7%，抓取前失败次数从 47 次大幅降至 16 次。

### 3. 🔥 [UniMem: Unifying Multimodal Memory and Control for Vision-Language-Action Models] (UniMem：统一视觉-语言-动作模型的多模态记忆与控制)
- **研究机构**: `原文未提及（致谢中提及 Toyota Research Institute 提供资金支持）`
- **Arxiv ID**: `2608.22869` | [点击跳转](https://arxiv.org/abs/2608.22869)

**0. 论文标题**
- **英文标题**: UniMem: Unifying Multimodal Memory and Control for Vision-Language-Action Models
- **中文标题**: UniMem：统一视觉-语言-动作模型的多模态记忆与控制
- **研究机构**: 原文未提及（致谢中提及 Toyota Research Institute 提供资金支持）
- **一句话总结**: [领域：具身智能/机器人学；类型：方法创新] 提出 UniMem 框架，通过在 VLA 主干网络中引入事件驱动的多模态（文本+视觉关键帧）记忆机制与隐藏状态缓存技术，解决了长时程非马尔可夫机器人任务中的感知混叠问题，在单模型下实现了高成功率与实时推理。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在长时程、非马尔可夫机器人操作任务中因缺乏架构记忆而导致的“感知混叠”（perceptual aliasing，即当前观测相似但需要不同动作）问题。
- **研究动机**: 现有 VLA 缺乏记忆能力。现有引入记忆的方法要么依赖额外的 VLM 进行分层管理（导致记忆瓶颈、训练割裂、丢失底层时空细节），要么采用固定间隔采样历史帧（引入无关噪声、增加计算负担且容易引发因果混淆）。
- **本质改动**: 将高层多模态记忆与底层控制统一在同一个 VLA 主干网络中，通过事件分类器动态触发文本和视觉关键帧的记忆更新，并利用隐藏状态缓存技术消除重复计算，实现低延迟推理。
- **技术溯源**: 基于开源 VLA 模型 $\pi_{0.5}$（包含 PaliGemma 视觉-语言主干和 Gemma 动作专家），视觉编码器基于 SigLIP。

**2. 技术拆解**
- **核心方法**: 
  1. **事件驱动的多模态记忆**：在 VLA 主干最后一层附加一个轻量级 MLP 事件分类器。当检测到预定义的关键子任务事件（如“抓住盒子”）时，同步更新文本记忆（追加自然语言事件描述）和视觉记忆（保存当前多视角图像）。
  2. **高效关键帧编码与缓存**：修改 SigLIP 视觉编码器，插入因果时间自注意力层。推理时缓存历史关键帧在时间注意力之前的中间隐藏状态，新帧到来时仅计算新帧的空间注意力，历史帧直接复用缓存，避免重复计算。
  3. **自动化数据标注与联合训练**：利用 LLM 生成脚本自动从演示数据中提取动作签名并标注事件。联合优化动作生成损失和事件分类损失。
- **关键细节**: 
  - **输入输出**：输入为当前观测、本体感知、任务指令、文本记忆和视觉关键帧历史；输出为动作块（action chunk）和当前事件预测。
  - **模型结构**：事件分类器接在主干最终层隐状态 $z_t$ 后。视觉历史最多保留 3 个（仿真）或 4 个（硬件）过去的关键帧。
  - **关键超参**：事件分类损失中，无事件（null）类的权重设为 0.02（防止漏报，同时避免模型坍缩到多数类）；总损失中事件分类损失的权重 $\lambda=0.1$。
- **训练/优化目标**: 
  - **动作损失 $\mathcal{L}_a(\theta)$**：保持 $\pi_{0.5}$ 原有的 Flow-matching 目标不变。
  - **事件分类损失 $\mathcal{L}_e(\theta, \phi)$**：对事件分类器头施加类别加权的交叉熵损失。
  - **总损失**：$\mathcal{L} = \mathcal{L}_a + 0.1 \mathcal{L}_e$。分类梯度会回传到共享主干，使记忆学习与底层控制耦合。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：仿真使用 robosuite (Franka Panda)，硬件使用 UFactory xArm6。共 9 个记忆任务（5 个仿真，4 个硬件）。
  - **对比对象（Baseline）**：仿真对比 $\pi_{0.5}$ + 视频编码器（固定 6 秒间隔采样）；硬件对比分层记忆系统 MemER。同时进行了无记忆、仅文本、仅关键帧的消融实验。
- **评价指标**: 任务成功率（Success rates %），硬件任务还评估了推理延迟（Inference latency）。
- **主要结果**: 
  - **仿真任务**：平均成功率达到 93.4%，显著优于固定间隔采样 baseline 的 68.2%。
  - **硬件任务**：平均成功率达到 80.0%，显著优于分层 baseline MemER 的 43.5%。
  - **推理速度**：通过关键帧缓存机制，保持了单帧推理速度（约 90 ms），比分层记忆 baseline 快 6 倍。在 4 个相机流、16 个关键帧的极端测试下，仅增加约 25 ms 延迟。
  - **消融结论**：文本记忆擅长处理长时程顺序/计数任务，视觉关键帧擅长提供空间几何信息，两者结合（多模态）在所有任务中均取得最优表现，证明了联合条件化的必要性。

### 4. 🔥 [Robust Bimanual Vision-Language-Action Models via Embarrassingly Simple Modality Masking] (通过极简的模态掩码提升双臂视觉-语言-动作模型的鲁棒性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22419` | [点击跳转](https://arxiv.org/abs/2608.22419)

**0. 论文标题**
- **英文标题**: Robust Bimanual Vision-Language-Action Models via Embarrassingly Simple Modality Masking
- **中文标题**: 通过极简的模态掩码提升双臂视觉-语言-动作模型的鲁棒性
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种仅在训练阶段使用的模态掩码策略（M3），通过随机遮挡部分视觉视角和动作查询，强迫双臂 VLA 模型学习更鲁棒的多模态特征融合，在不改变模型架构的前提下显著提升了复杂双臂操作任务的成功率和抗干扰能力。

**1. 整体逻辑**
- **研究任务**: 提升基于查询（query-based）的双臂视觉-语言-动作（VLA）模型在复杂双臂操作任务中的鲁棒性，解决动作轨迹不连续和执行失败的问题。
- **研究动机**: 现有的 query-based VLA 模型在双臂任务中容易出现动作不连续。作者发现，这是因为多视角和语言融合不稳定：如果训练时总是给模型看所有视角的图像，模型会学到虚假的跨视角相关性（例如，被空闲手臂视角里的高显著性干扰物吸引），导致注意力分散到无关区域。一旦遇到背景、光照或干扰物变化（分布偏移），模型性能就会急剧下降。
- **本质改动**: 提出了一种“极其简单”的纯训练期策略（Modality Masking Mechanism, M3）。不改变模型架构，也不依赖大规模机器人预训练，而是通过在训练时随机遮挡部分模态（视角、语言、动作查询），让模型在受控的部分可观测条件下学习，从而减少对干扰线索的依赖。
- **技术溯源**: 基于 VLA-Adapter (0.5B) 和 OpenVLA-OFT (7B) 架构；视觉编码器使用 Prismatic VLM（结合 DINOv2 和 SigLIP），语言模型基于 Qwen2.5-0.5B。

**2. 技术拆解**
- **核心方法**: 模态掩码机制（M3）。在训练的 self-attention 中通过加性掩码（additive masks）随机隐藏部分模态 token，并引入查询缩放机制。该方法遵循三个针对双臂场景的设计原则：
  1. 始终保留第一人称视角（egocentric view）作为稳定的全局空间锚点。
  2. 联合遮挡左右腕部视角（dual-wrist views），防止空闲手臂干扰和虚假的跨视角特征匹配，强迫模型从全局视角提取任务几何信息。
  3. 对动作查询（action queries）进行子集遮挡（类似 dropout），鼓励不同的查询学习互补的特征表示（如有的负责粗规划，有的负责精细接触）。
- **关键细节**: 
  - **输入输出**：输入为多视角图像（第一人称、左腕、右腕）、语言指令、本体感觉（默认输入）和动作查询；输出为 H 步的动作块（action chunk）。
  - **掩码实现**：腕部视角联合遮挡（伯努利分布 $u_v$），语言整体遮挡（$u_l$），动作查询按元素随机遮挡但保证至少有一个可见（$u_q$）。构建统一的可见性指示向量，生成加性掩码矩阵 $\tilde{M}$，只有两个 token 都可见时才计算注意力。
  - **查询缩放**：对可见的查询 embedding 乘以 $1/(1-p_q)$ 进行缩放，保持特征能量，鼓励模型将任务信息分散到不同的查询槽中。
  - **关键超参**：查询掩码比例（query-mask ratio）设为 0.1 效果最好；LoRA rank 设为 64。
- **训练/优化目标**: 保持标准的 L1 回归损失（$\mathcal{L}_1$），但在 M3 掩码后的部分可观测输入上进行计算。即 $\mathcal{L}_{M3}(\theta) = ||\mathbf{g}_\theta(V_t^{M3}, T_t^{M3}, Q_t^{M3}) - \mathbf{\hat{A}}_t||_1$。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：RoboTwin 2.0（10个双臂任务，分短、中、长 horizon）。分为 Clean（干净场景评估）和 Clean2Rand（干净训练，随机化场景评估）设置。
  - **真机平台**：Agilex Cobot 平台，3个长 horizon 任务（Bottle Cleanup, Stack & Shelf, Veggie Centering），分 Clean 和 OOD（带新干扰物）设置。
  - **对比对象（Baseline）**：VLA-Adapter (主要 baseline), OpenVLA-OFT, RDT-1B, $\pi_0$, ACT, DP。
- **评价指标**: 任务成功率（Success Rate, SR），包括平均成功率、特定任务成功率和全任务成功率（full-task success rate）。
- **主要结果**: 
  - **仿真 Clean 设置**：M3 (基于 Adapter) 平均成功率从 41.0% 提升到 62.7%（+21.7%），长 horizon 任务提升尤为明显（如 Handover Block 从 27% 跃升至 74%）。
  - **仿真 Clean2Rand 设置**：在分布偏移下，M3 平均成功率从 3.7% 提升到 15.1%（+11.4%），是所有对比方法中表现最好的。
  - **真机结果**：3个长 horizon 任务中，Clean 设置下平均全任务成功率从 44.4% 提升到 69.4%；OOD 设置下从 12.5% 大幅提升至 61.1%。
  - **跨骨干迁移**：将 M3 应用于 OpenVLA-OFT，平均成功率从 32.2% 提升到 53.5%（+21.3%）。
  - **消融实验**：证明“保留第一人称视角+联合遮挡双腕视角”效果最好；视觉+查询（V+Q）掩码是性能提升的主要来源，显著优于通用的 token dropout 或 modality dropout。注意力可视化也证实，M3 让模型的注意力更集中在目标物体和接触区域，减少了对干扰物的关注。

### 5. 🔥 [LD4WAM: Learning Latent Dynamics from Human Videos for World Action Models] (从人类视频中学习潜在动力学用于世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22403` | [点击跳转](https://arxiv.org/abs/2608.22403)

**0. 论文标题**
- **英文标题**: LD4WAM: Learning Latent Dynamics from Human Videos for World Action Models
- **中文标题**: 从人类视频中学习潜在动力学用于世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种与具身形态无关的“运动对齐潜在动力学”表征，结合混合Transformer架构，利用超5000小时的人类和机器人视频预训练世界动作模型，显著提升了跨具身机器人操作的成功率和泛化能力。

**1. 整体逻辑**
- **研究任务**: 利用大规模人类视频和机器人数据训练世界动作模型（WAMs），以预测未来观测并直接生成机器人动作，提升机器人操作能力。
- **研究动机**: 现有的WAMs主要通过像素级重建学习人类视频，导致学到的动力学与动作脱节（缺乏动作标签锚定）；直接进行动作重定向会引入运动学差异导致的对应误差，且无法解决视觉上的具身差异；而现有的潜在动作学习方法往往保留了外观和具身特有信息，缺乏与可执行运动的明确联系。
- **本质改动**: 提出“运动对齐的潜在动力学”作为中间表征，在语义特征空间学习帧间动态，并显式对齐真实的末端执行器运动，从而在视频先验和底层动作之间建立与具身形态无关的桥梁。
- **技术溯源**: 基于 DINOv3（语义特征提取）、Wan2.2（视频生成基座）、LeRobot（统一数据格式）以及 Transformer（时空聚合与混合专家架构）。

**2. 技术拆解**
- **核心方法**: 
  1. 潜在动力学模型（LDM）：在语义特征空间通过下一帧语义重建和真实运动对齐进行训练，使用Soft-VQ将帧间转换映射为潜在动力学token，剥离外观和具身差异。
  2. 世界动力学动作模型（WDAM）：采用混合Transformer（MoT）架构，包含视频、潜在动力学和动作三个专家。通过非对称的自注意力机制，让可学习查询从生成的未来视频中蒸馏出潜在动力学，用于条件化动作生成。
- **关键细节**: 
  - LDM：输入为随机时间步长采样的帧序列，冻结DINOv3提取特征，时空Transformer聚合后接Soft-VQ（8个codebook entries，每个transition量化为4x4 grid，输出512维向量）。
  - WDAM：基于Wan2.2 TI2V-5B视频扩散骨干。视频专家为30层DiT；动力学专家为可学习查询（每2个预测latent生成8个token，512维）；动作专家预测16个动作。三者通过共享自注意力交互，形成“视频→动力学→动作”的单向信息流。
  - 数据：整合了8个数据集（如Ego4D、Agibot-World等），构建了超5000小时（2.74亿帧，15 FPS）的统一格式人类和机器人操作数据集。
- **训练/优化目标**: 
  - LDM目标：语义重建损失（DINOv3特征空间的余弦距离）+ 运动对齐损失（仅对有动作标签的帧计算末端执行器delta的MSE）+ VQ正则化（防止codebook collapse）。
  - WDAM目标：视频和动作的flow-matching损失 + 潜在动力学与LDM离线目标的MSE损失。采用三阶段训练（预训练、对齐训练、后训练），动态调整各专家损失权重。

**3. 实验结果**
- **实验设置**: 
  - 仿真：RoboTwin benchmark（50个任务），对比 $\pi_{0.5}$, Fast-WAM, Lingbot-VA, ACE-Ego-0 等基线。
  - 真实世界：双臂AgileX PiPER（平行夹爪）和双臂Tianji（Wuji灵巧手），7个操作任务。对比 $\pi_{0.5}$, Fast-WAM, Lingbot-VA。
  - 探针实验：用浅层MLP从潜在表征回归末端执行器运动，评估潜在动力学包含的动作相关信息量。
- **评价指标**: 
  - 仿真和真实世界：任务成功率（Success rate）。
  - 探针实验：尺度归一化的均方误差（Scale-normalized MSE）。
- **主要结果**: 
  - 仿真：在RoboTwin上平均成功率达93.4%，比ACE-Ego-0高2.5%，比Lingbot-VA高1.2%。
  - 真实世界：在7个任务中6个取得最高成功率，平均成功率70.5%（$\pi_{0.5}$ 为63.3%，Fast-WAM 为47.1%，Lingbot-VA 为64.3%）。
  - 泛化性：在未见物体上保留88.6%的性能；在未见背景上比WAM基线提升显著（+10.0和+34.4），但因纹理扰动是视频生成的弱点，仍略逊于 $\pi_{0.5}$（44.4% vs 54.5%）。
  - 消融实验：运动对齐是LDM最关键的部分，移除后回归误差增加3.7-5.0倍；Soft-VQ、语义重建和多尺度采样均优于替代方案；完整的三阶段训练架构比基线WAM提升23.7%。

### 6. 🔥 [Beyond Instance Slots: Semantically Rich World Models for Physical Interaction Planning] (超越实例槽：面向物理交互规划的语义丰富世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22294` | [点击跳转](https://arxiv.org/abs/2608.22294)

**0. 论文标题**
- **英文标题**: Beyond Instance Slots: Semantically Rich World Models for Physical Interaction Planning
- **中文标题**: 超越实例槽：面向物理交互规划的语义丰富世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出SR-WM，将视觉实体动态绑定到五种任务功能角色（夹爪、目标、目的、关系、阶段），在轻量级世界模型上实现语义感知的动作生成、状态预测与轨迹修复，大幅提升机器人操作规划的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人物理交互（操作）中的动作规划。
- **研究动机**: 现有的世界模型（基于单体隐变量或实例级对象槽）只能预测未来观测或识别场景里有什么物体，但无法表达物体在具体任务中扮演的角色（比如哪个是抓取目标，哪个是放置目的，是否保持抓取，处于什么任务阶段）。这导致规划时无法判断动作是否建立了所需状态或破坏了已有约束。
- **本质改动**: 摒弃传统的“可互换实例槽”表示，引入“任务条件化的角色绑定”机制，把视觉实体映射为五种非互换的功能角色状态，并以此统一指导动作生成和语义动力学预测。
- **技术溯源**: 基于轻量级的 LeWM (15M参数，含5M ViT-Tiny encoder和10M predictor)；动作头使用 Flow-Matching (FM)；视觉先验可选用 SAM/SAM2 和 Grounding DINO。

**2. 技术拆解**
- **核心方法**: 
  1. **实体提取与角色绑定**：先用LeWM提取软视觉实体（包含外观、几何、运动、置信度），然后通过语言和机器人状态条件化的交叉注意力，将实体绑定到5个固定的角色查询（Gripper, Target, Goal, Relation, Phase）上。
  2. **动作条件化角色动力学**：将动作分块输入，预测每个子时间步的角色状态转移以及细粒度语义事件（接触、抓取、谓词建立/保持、夹具状态、阶段变化）。
  3. **语义选择与后缀修复**：基于预测的语义转移对多个FM生成的候选动作打分排序；若发现违规，保留合法前缀，仅对违规点之后的后缀进行重新采样修复。
- **关键细节**: 
  - 模型规模：基础LeWM 15M，完整系统（含FM头和角色模块）45.4M参数。
  - 输入输出：输入为RGB历史、本体感觉、语言指令（掩码仅作可选的注意力偏置，推理时可不使用）；输出为5维角色状态向量及K=4个候选动作块。
  - 负样本构造：使用打乱、反转、替换等硬负样本来训练选择器，确保模型对因果动作顺序敏感。
- **训练/优化目标**: 包含11个损失项，分三组：1) 表示损失（LeWM预测、角色绑定、状态动力学）；2) 语义损失（接触/抓取、谓词建立、关系保持、阶段、夹具状态）；3) 策略损失（FM动作损失、硬负样本排序损失、后缀修复损失）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO 的四个子集（Object, Spatial, Goal, LIBERO-10）及跨套件迁移测试。
  - Baseline：生成端对比单体LeWM隐变量、实例槽；决策端对比Candidate 0（直接取第一个）、Random@K、固定ID、全块重采样等。
- **评价指标**: 闭环滚动成功率（Selected top-1 success）、候选覆盖率（Oracle@K）、语义诊断指标（绑定准确率、关系AUROC、阶段F1）、动作敏感度（打乱动作得分差、排序准确率）。
- **主要结果**: 
  - 相比单体隐变量（45.5%）和实例槽（55.8%），SR-WM的Candidate 0成功率提升至62.8%，Oracle@4覆盖率从68.0%提升至89.5%。
  - 结合语义选择器和后缀修复后，最终闭环成功率达到83.0%。
  - 消融实验证明，显式绑定Target/Goal（68.0%）和Relation（73.0%）是性能提升的关键。
  - 强鲁棒性：完全不用分割掩码（patch-only）成功率仍有72.6%，掩码损坏时仅降至70.8%。
  - 迁移能力：在Object上预训练后微调到Goal和LIBERO-10，显著优于从头训练（如Goal 74.6% vs 66.3%）。

### 7. 🔥 [DreamMimic: Learning Visuomotor Whole-Body Loco-Manipulation via World Model] (DreamMimic：基于世界模型的人形机器人视觉全身运动操作学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22278` | [点击跳转](https://arxiv.org/abs/2608.22278)

**0. 论文标题**
- **英文标题**: DreamMimic: Learning Visuomotor Whole-Body Loco-Manipulation via World Model
- **中文标题**: DreamMimic：基于世界模型的人形机器人视觉全身运动操作学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出DreamMimic框架，将Dreamer风格的世界模型重构为预测性隐状态表示学习器和多步监督信号源，结合性能条件引导（PCG）蒸馏策略，解决了人形机器人在视觉部分可观测下长时程、富接触全身运动操作的误差累积问题。

**1. 整体逻辑**
- **研究任务**: 训练人形机器人仅依赖视觉和本体感觉（不依赖模拟器特权状态），执行富接触的全身运动操作（loco-manipulation）任务。
- **研究动机**: 现有的视觉运动策略在处理长时程、富接触任务时，由于部分可观测性和不连续的接触动力学，极易产生误差累积。传统的单步行为克隆/蒸馏无法约束未来状态演化，而纯RL从视觉学习极不稳定；现有的世界模型（如Dreamer）多用于想象规划或低维动作空间，直接用于高维人形接触任务效果很差。
- **本质改动**: 摒弃了用世界模型做想象规划（planning）的传统范式，将其改造成预测性隐状态表示的学习基座，通过多步动作条件隐状态对齐提供长期监督；同时引入基于相对性能的自适应蒸馏调度（PCG），动态平衡教师指导和学生探索。
- **技术溯源**: Dreamer (RSSM架构), DAgger, PPO, InterMimic (特权教师构建), SMPL-X。

**2. 技术拆解**
- **核心方法**: 
  1. **世界模型辅助表示学习**：利用视觉和本体感觉输入训练RSSM世界模型，并增加辅助预测头（预测特权状态、接触、物体状态、奖励），迫使隐空间保留对富接触交互有用的信号。
  2. **多步隐状态蒸馏**：在冻结的世界模型中，从同一后验隐状态出发，分别代入学生和教师的动作进行多步开环预测，通过最小化两者未来隐状态的差异，提供多步动作条件监督。
  3. **性能条件引导（PCG）**：根据教师和学生在各自环境中的相对奖励表现，动态调整教师驱动环境与学生驱动环境的比例，防止教师指导过早衰减或过度干扰。
- **关键细节**: 
  - **输入输出**：学生端输入为深度图、分割图、非特权本体感觉和紧凑目标条件（目标物体位姿和短期轨迹提示）。输出为机器人动作。
  - **模型结构**：世界模型包含轻量CNN+MLP编码器、RSSM（确定性GRU+随机状态）及辅助预测头。策略网络将本体感觉-目标特征、确定性世界模型特征和辅助预测特征投影为独立token，经轻量Transformer融合后输入Actor-Critic MLP。
  - **关键超参**：多步预测步长 H=3。
- **训练/优化目标**: 
  - **世界模型损失**：KL散度（含free-bits防坍塌）+ 视觉/本体感觉重建损失 + 奖励/特权状态/接触/物体状态的辅助预测损失。
  - **策略损失**：动作匹配损失（DAgger）+ 多步隐状态一致性损失 + PPO正则化损失。优化过程以模仿学习为主，PPO作为辅助正则化。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：OMOMO（5种物体：大桌子、木椅、塑料箱、小箱、手提箱）和 BEHAVE（3种物体：背包、塑料容器、凳子），基于SMPL-X动作重定向生成参考轨迹。
  - **对比对象（baseline）**：纯RL视觉基线、使用ResNet-18/ViT/Simple-CNN作为视觉编码器并结合DAgger或DAgger+RL蒸馏的学生策略、单阶段Dreamer基线。
  - **测试环境**：Isaac Gym（主训练与测试），Isaac Lab（跨模拟器测试），Unitree G1人形机器人（跨形态测试）。
- **评价指标**: 成功率（Succ.）、平均持续步数（Time）、机器人跟踪误差（Er，cm）、物体跟踪误差（Eo，cm）。
- **主要结果**: 
  - 在OMOMO上，DreamMimic达到92.2%成功率，机器人和物体跟踪误差分别为5.4cm和8.8cm，显著优于ResNet-18+DAgger+RL（72.6%成功率）和单阶段Dreamer（0%成功率）。
  - 在BEHAVE上，使用PCG调度的DreamMimic在成功率（72.7%）与Naive Annealing持平的情况下，显著降低了跟踪误差（Er 10.2 vs 15.2，Eo 13.3 vs 14.9）并增加了持续步数（289.53 vs 275.21）。
  - 消融实验证明：多步隐状态蒸馏、辅助预测头作为策略输入、以及RSSM的确定性循环状态对维持长时程稳定交互至关重要；去掉多步隐状态蒸馏会导致成功率从92.2%骤降至70.6%。
  - 定性结果表明，该方法在跨形态（Unitree G1）和跨模拟器（Isaac Gym到Isaac Lab）设置下均能保持稳定的全身接触交互，而基线方法容易在接触时失稳摔倒。

### 8. 🔥 [BehaviorWorldGen: Closing the Loop between Action Models and World Simulators via Controllable Behavior-Aware Structured World Generation] (BehaviorWorldGen：通过可控行为感知结构化世界生成闭合动作模型与世界模拟器之间的闭环)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22187` | [点击跳转](https://arxiv.org/abs/2608.22187)

**0. 论文标题**
- **英文标题**: BehaviorWorldGen: Closing the Loop between Action Models and World Simulators via Controllable Behavior-Aware Structured World Generation
- **中文标题**: BehaviorWorldGen：通过可控行为感知结构化世界生成闭合动作模型与世界模拟器之间的闭环
- **研究机构**: 原文未提及
- **一句话总结**: 提出 BehaviorWorldGen 框架，通过核心模块 BehaviorFlow 注入可控的帧级元动作来生成多智能体交互轨迹，解决了现有世界模拟器无法模拟周围车辆合理响应的问题，从而为自动驾驶动作模型提供高质量的长尾交互训练数据。

**1. 整体逻辑**
- **研究任务**: 自动驾驶中动作模型（如端到端规划器、VLA模型）的自改进闭环数据生成与策略优化。
- **研究动机**: 现有的“动作模型-世界模拟器”自改进闭环中，世界模拟器仅以自车动作为条件，周围车辆的行为是固定的或仅为历史回放，无法对自车动作做出合理的交互响应。这导致生成的交互数据不真实，且分布不平衡，缺乏长尾交互场景（如切入、让行等）。
- **本质改动**: 在动作模型和世界模拟器之间引入基于“元动作（meta-action）”条件化的交通流模型（BehaviorFlow），将结构化轨迹作为接口，显式控制周围车辆的高层行为和生命周期，生成符合物理规律且交互一致的多智能体轨迹，将被动模拟器转化为 targeted 交互训练数据源。
- **技术溯源**: 基于 Diffusion Transformer (DiT)、3D Gaussian Splatting (3DGS)、Rectified Flow、DMD2 蒸馏、Diffusion Forcing、ChainFlow-VLA、DiffusionDrive 等已有工作。

**2. 技术拆解**
- **核心方法**: 
  1. **BehaviorFlow**：自回归生成交通场景，将生成过程解耦为生命周期（ENTER/ALIVE/EXIT）、帧级元动作（10种如变道、转弯等）和物理状态三个因子。推理时通过约束集注入特定行为，联合生成所有智能体状态，使周围车辆能对自车和彼此做出合理响应。
  2. **World Simulator**：实例化为两种管线。一是基于 DiT 的动作条件生成模型，联合生成多视角 RGB 和 LiDAR；二是基于 3DGS 的重建管线，利用 BehaviorFlow 外推场景以突破 3DGS 固有的空间边界限制。
- **关键细节**: 
  - BehaviorFlow 输入静态场景上下文和历史，输出多智能体 rollout。元动作词表包含 10 种行为（如 Stationary, LaneChangeLeft 等）。
  - 动作条件世界模型分四阶段训练：LiDAR VAE 训练、双向模型训练（Rectified Flow）、少步蒸馏（DMD2）、因果模型训练（Diffusion Forcing + Self Forcing），最终实现少步自回归长视频生成。
  - 动作模型实例化为 VLA 模型（ChainFlow-VLA）和端到端规划器（DiffusionDrive）。
- **训练/优化目标**: 
  - **BehaviorFlow**：生命周期、元动作和物理状态的监督损失加权和（$\mathcal{L}_{flow} = \lambda_{life}\mathcal{L}_{life} + \lambda_{meta}\mathcal{L}_{meta} + \lambda_{state}\mathcal{L}_{state}$），训练时使用 teacher-forcing。
  - **世界模型**：双向阶段用 Rectified Flow 速度场预测损失；蒸馏阶段用 DMD 分布匹配损失和 fake score 损失；因果阶段用 Diffusion Forcing 和 Self Forcing 损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 私有数据集（用于世界模型和 BehaviorFlow 评估），NAVSIM benchmark（用于动作模型评估，包含 85K 真实数据和 16K 合成数据）。
  - **对比对象 (Baseline)**: 世界模型对比双向模型；动作模型对比 UniVLA, AutoVLA, FSDrive, DriveVLA-W0, ReCogDrive, SGDrive, SpanVLA, LatentVLA, ChainFlow-VLA, UniAD, PARA-Drive, Transfuser, DRAMA, VADv2, DrivingGPT, Hydra-MDP, LTF, DiffusionDrive 等。
- **评价指标**: 
  - **世界模型**: FID, FVD, 生成速度。
  - **动作模型 (NAVSIM)**: PDM Score (PDMS) 及其子项：NC (无责碰撞), DAC (可行驶区域合规), EP (自车进度), TTC (碰撞时间), Comf (舒适度)。
- **主要结果**: 
  - **世界模型**: 因果模型比双向模型推理速度快近 70 倍（0.3s/帧 vs 20s/帧），且质量更好（FID 4.36 vs 6.72, FVD 43.27 vs 61.29）。支持长视频、LiDAR 生成及多种场景编辑（如动物插入、天气控制、轨迹编辑）。
  - **3DGS 外推**: 结合生成的图像和 LiDAR，有效扩展了 3DGS 的渲染边界，抑制了边界外的几何伪影和浮影，提升了闭环仿真的可靠性。
  - **动作模型**: 
    - **ChainFlow-VLA**: PDMS 达到 93.3（原方法 93.1），在 NC、DAC、TTC 上提升，显著减少了导致零分的严重碰撞或违规。
    - **ReCogDrive**: PDMS 达到 87.3（原方法 86.5），绝对提升 0.8，TTC 提升最大（+0.7）。
    - **DiffusionDrive**: PDMS 达到 88.6（原方法 87.7），绝对提升 0.9。在低分困难场景（如 PDMS < 0.15）提升极其显著，从 0.0 提升至 34.8，证明该方法能有效修正严重失败案例，而非仅仅微调常规场景。

### 9. 🔥 [Inferring Action from Future Latent State for Robotic Manipulation] (从未来潜在状态推断机器人操作动作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22067` | [点击跳转](https://arxiv.org/abs/2608.22067)

**0. 论文标题**
- **英文标题**: Inferring Action from Future Latent State for Robotic Manipulation
- **中文标题**: 从未来潜在状态推断机器人操作动作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种不依赖视频生成的世界-动作模型，通过直接预测与动作因果相关的未来潜在状态来推断机器人动作，去除了视觉冗余，大幅提升了长时序真实机器人操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 具身智能中的机器人操作（Robotic Manipulation），特别是需要多阶段、长时序协调的真实世界双臂操作任务。
- **研究动机**: 现有的世界-动作模型（WAM）依赖生成密集的未来视频帧来预测世界演化，这引入了高维视觉冗余，导致训练和推理成本高昂，且优化视觉重建并不直接等同于优化动作相关的物理状态预测；而视觉-语言-动作（VLA）模型则存在泛化性差、需要海量数据的问题。
- **本质改动**: 摒弃了“生成中间视频帧”的代理目标，将世界模型重新定义为“未来潜在状态与动作”的联合预测问题。模型不再重建视觉演化过程，而是直接预测动作执行后的物理潜在状态，并从中推断动作。
- **技术溯源**: 语言编码基于 Qwen3，视觉编码基于 DINO-v3，生成模型框架采用 Flow Matching（流匹配），网络架构采用双流 Transformer（Dual-stream attention）。

**2. 技术拆解**
- **核心方法**: 提出 DELE-w0.5（结论部分亦称 HeTu-1.0）框架。采用双流注意力机制：条件流（Condition Stream）融合语言指令和当前多视角视觉观测；噪声流（Noise Stream）联合对动作块和下一个潜在观测状态进行去噪。在推理阶段，直接截断未来视觉状态的生成分支，仅输出动作序列，从而消除视频生成带来的延迟。
- **关键细节**: 
  - 输入：语言指令、3个视角的RGB图像（头部1个，双臂各1个）、本体感知（proprioception）。
  - 输出：60步的动作块（Action chunk，包含3-DoF位置、3-DoF旋转和1-DoF夹爪状态）和下一个潜在视觉状态。
  - 模型隐藏层维度设为 1024。
- **训练/优化目标**: 基于 Flow Matching 的速度场回归损失。总损失为动作回归损失与未来潜在状态回归损失的加权和（$\mathcal{L} = \mathcal{L}_a + \lambda \mathcal{L}_o$）。训练时采用特定的注意力掩码：未来状态可关注所有token，动作只能关注条件信息和自身，防止目标泄露；推理时移除未来状态分支。

**3. 实验结果**
- **实验设置**: 
  - 测试环境：真实世界场景，使用 Astribot S1 双臂机器人。
  - 任务：4个长时序任务（开门、从冰箱拿可乐、加冰块、微波炉热爆米花），涵盖接触丰富交互、双手传递、工具使用等难点。
  - 对比对象（baseline）：5个主流 VLA 策略（$\pi_{0.5}$, LingBot-VLA2, HY-VLA, Spirit-v1.5, GR00T-N1.7）。
  - 规模：每个任务20次试验，共480次真实机器人试验。
- **评价指标**: 完整任务成功率（Full-task success rate）和归一化有序阶段进度（Normalized ordered-stage progress）。
- **主要结果**: DELE-w0.5 取得 81.3% 的宏观进度和 62.5% 的整体成功率（50/80）。相比最强基线 $\pi_{0.5}$（正文描述为 50.6% 宏观进度和 15.0% 成功率），宏观进度提升 30.7 个百分点，完整成功率提升 47.5 个百分点。阶段分析表明，该方法在长时序任务中更能有效保持早期进度并转化为最终成功，显著减少了多阶段交互中的误差累积。

### 10. 🔥 [Geo-VLA: Geometry-Aware Vision-Language-Action Planning via Internalization of Map Semantics] (Geo-VLA：通过内化地图语义实现几何感知的视觉-语言-动作规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.21440` | [点击跳转](https://arxiv.org/abs/2608.21440)

**0. 论文标题**
- **英文标题**: Geo-VLA: Geometry-Aware Vision-Language-Action Planning via Internalization of Map Semantics
- **中文标题**: Geo-VLA：通过内化地图语义实现几何感知的视觉-语言-动作规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Geo-VLA 框架，在训练期通过几何 QA 数据将地图语义内化到 VLA 骨干网络中，使单目端到端自动驾驶规划器在推理期无需高精地图即可显著提升弯道和路口的轨迹规划能力。

**1. 整体逻辑**
- **研究任务**: 端到端自动驾驶轨迹规划（基于单目前视相机的视觉-语言-动作模型规划）。
- **研究动机**: 现有 VLA 模型仅靠图像难以准确捕捉规划所需的道路几何和拓扑结构（如车道连接、曲率），导致弯道和路口规划失败；而引入高精地图或在线建图会增加推理复杂度和系统开销，且未解决 VLA 骨干本身表征道路结构能力弱的问题。
- **本质改动**: 训练时利用离线地图生成的几何 QA 数据对 VLA 骨干进行对比学习和指令微调以“内化”地图语义，推理时直接丢弃地图相关模块，保持原有纯视觉输入接口。
- **技术溯源**: 基于端到端自动驾驶 VLA 模型（如 ReCogDrive、DynVLA），结合了视觉-语言基础模型（Vision-Language backbone）、对比学习（CLIP 范式）和指令微调（Instruction tuning）技术。

**2. 技术拆解**
- **核心方法**: 提出两阶段训练框架 Geo-VLA 及配套的 Geo-QA 数据集。第一阶段（几何感知预训练）：用 Geo-QA 进行图像-文本对比学习和 QA 指令微调，更新 VLA 骨干的 LoRA 适配器；第二阶段（规划微调）：冻结骨干网络，仅微调原有的动作解码器以拟合专家轨迹。
- **关键细节**: 
  - **输入输出**：输入为前视图像、自车历史轨迹、自车状态和导航指令；输出为未来多个 waypoints。
  - **模型结构**：VLA 骨干（视觉编码器 + LLM）+ 动作解码器。预训练时引入辅助投影头（projection heads），推理时丢弃。
  - **数据规模**：Geo-QA 包含 3000 个样本，涵盖车道结构、道路几何、路口结构、可行驶边界和道路拓扑 5 类，由 GPT-5.4 基于离线地图标注生成。
  - **关键超参**：LoRA rank 设为 16。
- **训练/优化目标**: 
  - **预训练目标**：对称 InfoNCE 对比损失（图像到文本和文本到图像）加上 QA 自回归预测损失（Cross-Entropy）。
  - **微调目标**：Baseline 原有的规划损失（模仿学习/轨迹回归损失）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：NAVSIM v1（navtrain 训练，navtest 测试）。
  - **对比对象（baseline）**：ReCogDrive、DynVLA，以及显式引入高精地图编码器（HD map encoder）和在线车道线检测（Lane detection）的变体。
- **评价指标**: NAVSIM 官方指标，核心为综合得分 PDMS（Predictive Driver Model Score），辅以 NC（无责碰撞）、DAC（可行驶区域合规）、TTC（碰撞时间）、C（舒适度）、EP（自车进度）。
- **主要结果**: 
  - DynVLA + Geo-VLA 达到 92.1 PDMS，成为单目 VLA 规划器的新 SOTA（比原 DynVLA 提升 1.1，比此前最强单目结果提升 0.3）。
  - ReCogDrive + Geo-VLA 从 90.8 提升至 91.2 PDMS，证明框架对不同动作生成架构的通用性。
  - 相比在线车道线检测，Geo-VLA 在 DynVLA 上 PDMS 高 0.4，且推理开销与 Baseline 完全一致（无额外模块）。
  - 相比高精地图编码器，PDMS 差距仅在 0.3~0.7 以内，但免去了高精地图定位、检索和编码的推理开销。
  - 消融实验表明，静态道路结构 QA 监督比同等规模的动态物体 QA 监督带来更大的规划收益（92.1 vs 90.7 PDMS）。

### 11. 🔥 [Selective Cross-View Consistency for World Action Models: Held-Out Viewpoint Robustness Without Test-Time Camera Information] (面向世界动作模型的选择性跨视角一致性：无需测试时相机信息的未见视角鲁棒性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.21402` | [点击跳转](https://arxiv.org/abs/2608.21402)

**0. 论文标题**
- **英文标题**: Selective Cross-View Consistency for World Action Models: Held-Out Viewpoint Robustness Without Test-Time Camera Information
- **中文标题**: 面向世界动作模型的选择性跨视角一致性：无需测试时相机信息的未见视角鲁棒性
- **研究机构**: 原文未提及
- **一句话总结**: 发现对世界动作模型直接套用跨视角一致性会导致视频预测模糊，提出仅对动作等不变量施加一致性约束的选择性方法，显著提升了模型在未见相机视角下的控制成功率。

**1. 整体逻辑**
- **研究任务**: 提升世界动作模型（WAMs）在相机视角发生扰动或变化时的机器人控制鲁棒性，特别是针对训练时未见过的视角（held-out viewpoints）。
- **研究动机**: WAMs同时预测未来视频帧和机器人动作。视频帧随视角变化（协变），而动作、本体感觉等不随视角变化（不变）。如果像传统VLA那样对所有输出直接施加跨视角一致性损失，会把不同视角的未来视频帧“拉扯”成模糊的平均图像，产生严重的收缩偏差，反而破坏模型。此外，现有评估中手腕相机（wrist camera）的姿态稳定性严重混淆了场景相机的鲁棒性测量。
- **本质改动**: 提出选择性跨视角一致性（SCVC），在损失函数中把输出拆块，只对视角不变的输出（动作、本体感觉、价值）施加跨视角一致性惩罚，对随视角变化的输出（未来视频帧）保留逐视角的独立监督。
- **技术溯源**: 基于 Cosmos Policy（2B参数的WAM），在 LIBERO-Plus 数据集的 camera track 上进行验证。

**2. 技术拆解**
- **核心方法**: 选择性跨视角一致性（SCVC）。将WAM的联合去噪目标分为不变块（动作chunk、未来本体感觉、价值）和协变块（未来场景帧）。训练时，对同一物理状态渲染两个不同视角的图像输入给共享去噪器。损失函数包含：所有块的逐视角去噪MSE损失，以及仅针对不变块的跨视角一致性MSE损失。两个视角的分支共享相同的扩散噪声水平和噪声采样。
- **关键细节**: 输入为当前场景图像、本体感觉、语言指令；输出为7帧潜在序列（含动作chunk、未来本体感觉、未来场景图像、价值等）。模型规模为2B参数。一致性权重 $\lambda_{CV} = 2.0$，在训练前2%的步数内线性增加。
- **训练/优化目标**: 基于EDM风格的扩散去噪器。总Loss = 逐视角去噪MSE + $\lambda(t)$ * 不变块的跨视角一致性MSE。理论证明若对协变块（未来场景）加一致性，最优解会导致视角差异被缩小到真实值的 $1/(1+4\lambda)$。

**3. 实验结果**
- **实验设置**: 数据集为 LIBERO-Plus camera track。对比对象为 Matched control（使用完全相同的数据增强对，但一致性权重设为0，即仅做相机数据增强）。提出 carve-and-hold-out 评估协议，将相机参数扰动分为分布内（in-distribution）、插值（interpolation）和外推（extrapolation）三个区间。
- **评价指标**: 闭环控制成功率（Closed-loop success rate），并计算95%置信区间（CI）。
- **主要结果**: 在未见视角的外推（extrapolation）区间，SCVC比对照组的闭环成功率提升了12.2个百分点（95% CI [7.4, 17.0]），第二个随机种子下提升了15.5个百分点，且在方位角、距离、仰角三个相机轴上均得到复现。在插值区间和分布内区间，成功率没有显著提升或基本保持不变，证明方法没有牺牲模型原有的分布内能力。审计结果指出，带手腕相机的模型在遮挡场景相机时仍能完成约2/3的任务，说明之前榜单上的相机鲁棒性分数很大程度上是被手腕相机的姿态稳定性混淆的。

### 12. 🔥 [WAM-OPD: On-Policy Distillation for World Action Models] (WAM-OPD：面向世界动作模型的在策略蒸馏)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.22364` | [点击跳转](https://arxiv.org/abs/2608.22364)

**0. 论文标题**
- **英文标题**: WAM-OPD: On-Policy Distillation for World Action Models
- **中文标题**: WAM-OPD：面向世界动作模型的在策略蒸馏
- **研究机构**: 原文未提及
- **一句话总结**: 本文是一篇机器人学习后训练方向的方法创新工作，提出了一种针对视频优先的世界动作模型（WAM）的在策略蒸馏（OPD）方法，通过让学生模型自主收集环境数据并由教师模型提供密集监督，有效修复了模型加速蒸馏后丢失的任务能力与分布偏移问题。

**1. 整体逻辑**
- **研究任务**: 修复加速后的世界动作模型（Student）在闭环部署时丢失的任务能力，解决离线训练数据分布与部署时学生自主决策产生的状态分布之间的偏移（协变量偏移）问题。
- **研究动机**: 现有的离线蒸馏方法（如 Flash-WAM）只优化固定的离线数据分布，无法覆盖学生模型在真实部署中遇到的状态；而在线强化学习（RL）虽然能解决分布偏移，但面临机器人任务奖励稀疏、长轨迹信用分配困难的问题。
- **本质改动**: 将“在策略蒸馏（OPD）”引入视频优先的 WAM 架构。核心在于让学生模型自己决定环境历史分布，由冻结的教师模型对这些历史进行密集的视频和动作联合标注；同时，让学生模型的动作分支基于自己生成的视频计划（而非教师的视频计划）进行训练，以严格匹配部署时的计算图，解决条件接口不匹配的问题。
- **技术溯源**: 基于 LingBot-VA（作为冻结的教师模型基座）和 Flash-WAM（作为初始化的加速学生模型基座）。

**2. 技术拆解**
- **核心方法**: 提出 WAM-OPD（部署一致的 WAM 蒸馏方法）。学生模型在环境中执行动作收集历史数据，教师模型对这些历史进行视频和动作联合标注。训练时，学生模型先预测视频计划，再通过停止梯度（stop-gradient）的视频计划预测动作，使用联合损失和流匹配正则化项更新共享骨干网络中的轻量级适配器。
- **关键细节**: 
  - **输入输出**: 输入为历史观测、动作和语言指令；输出为未来视频计划潜变量和动作块。
  - **模型结构**: 视频和动作路径拥有独立的输入/输出模块，但共享 30 个 Transformer 块。
  - **规模与超参**: 使用 rank-8 的 JointLoRA 适配器更新所有 30 个共享块，冻结原始权重；AdamW 优化器，学习率 $2 \times 10^{-5}$，batch size 为 4，训练 3 个 epoch（120 步）。
- **训练/优化目标**: 联合损失函数。包含视频端点和动作端点的伪 Huber（pseudo-Huber）对齐损失，以及一个动作流匹配（flow-matching）辅助正则化项（在高噪声边界提供学习信号）。视频、动作和流匹配损失的权重分别设为 1、1 和 0.2。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: RoboTwin 2.0 仿真环境。
  - **任务**: Handover Mic（递麦克风）和 Put Object Cabinet（把物体放进柜子）。
  - **对比对象 (baseline)**: 官方发布的单步视频/单步动作 Flash-WAM 检查点。
  - **数据规模**: 每个任务使用 8 条学生轨迹，160 个教师标注上下文。
- **评价指标**: 使用 RoboTwin 官方的 latched `eval_success`（精确配对的留出集评估，包含 6 个场景种子和 2 个固定噪声库）。
- **主要结果**: 相比 baseline，WAM-OPD 在 Handover Mic 任务上的成功率从 0.0% 提升至 58.3%（+58.3 pp）；在 Put Object Cabinet 任务上从 16.7% 提升至 33.3%（+16.7 pp）。结果证明了在策略密集监督对修复加速 WAM 任务能力的有效性，但作者也坦言这仅是初步的能力验证，尚未证明广泛的泛化性。
