            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [XBot-Omni: An Omni-Modal Model for Embodied Understanding and Interaction] (XBot-Omni：一种用于具身理解与交互的全模态模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.17160` | [点击跳转](https://arxiv.org/abs/2611.17160)

**0. 论文标题**
- **英文标题**: XBot-Omni: An Omni-Modal Model for Embodied Understanding and Interaction
- **中文标题**: XBot-Omni：一种用于具身理解与交互的全模态模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Thinker-Talker-Actor 架构，让全模态大模型在生成流式语音的同时，直接利用内部原生表征协同生成语义可控、视觉接地的身体动作与面部表情。

**1. 整体逻辑**
- **研究任务**: 构建具身交互全模态模型，实现多模态输入理解与流式语音、身体动作、面部表情的协同生成。
- **研究动机**: 现有全模态模型（如 Qwen、Gemini）能理解多模态并生成语音，但无法直接生成身体动作；现有的语音驱动动作（A2G）方法通常依赖下游的音频波形特征，不仅丢失了未显式表达的场景意图，还需等待音频生成完毕再提取特征，导致延迟高且缺乏视觉场景接地。
- **本质改动**: 摒弃传统的“语音转动作”级联管线，让动作生成模块（Actor）直接读取理解模块（Thinker）的原生语义表征和语音模块（Talker）的实时隐藏状态，实现低延迟、语义和视觉双重接地的流式动作生成。
- **技术溯源**: 基于 Qwen3.5-Omni（构建 Thinker 和 Talker 基座），动作生成器的自回归公式参考了 MIBURI。

**2. 技术拆解**
- **核心方法**: 提出 Thinker-Talker-Actor 三段式架构。Thinker 负责多模态理解与意图推理；Talker 负责流式语音生成并暴露隐藏状态；Actor 包含动作生成器、语义动作控制器和语音-动作对齐器，直接消费上游原生状态生成身体动作，并通过 Chunk Transformer 和 Flow-matching 生成面部表情。
- **关键细节**: 
  - **Thinker**：引入绝对时间戳处理音视频时序。训练采用 SFT -> 多专家 RL (GRPO) -> 多教师在线策略蒸馏 (MOPD) 的三阶段流程。
  - **Talker**：采用混合 MoE 和深度预测器，在自回归生成语音 token 的同时，向外暴露演化中的隐藏状态（native states）。
  - **Actor**：语义动作控制器将 Thinker 的视觉场景理解转化为显式的动作需求（如指向物体的 3D 坐标），通过特征缩放和偏移（scale and shift）调制动作生成；语音-动作对齐器利用 Talker 状态估计语音进度，协调动作的准备与表达时机。
- **训练/优化目标**: 
  - **Thinker**：SFT 交叉熵损失、RL 的规则/模型奖励、MOPD 的 token 级反向 KL 散度。
  - **Actor**：原生状态适配（L2 回归对齐音频特征）、语音对齐（位置交叉熵）、语义动作学习（token 交叉熵与完成度 BCE）、生成历史训练，以及面部表情的条件 Flow-matching L2 损失。

**3. 实验结果**
- **实验设置**: 
  - **Thinker 评测**：使用 Daily-Omni, ReTurn, EgoProx, ERIBench。对比 Qwen3.5-Omni-Plus, Gemini 3.1 Pro, Doubao-Seed-2.1-Lite 等。
  - **Motion 评测**：使用 BEAT2 测试集（通用动作）和包含 10 个语义目标的独立语义集。对比 EMAGE, GestureHYDRA, Semantic Gesticulator, RoboGesture。语义质量由 Gemini 3.8 Flash 进行盲评。
  - **视觉接地动作**：使用 TraceSpatial-Bench, SUN RGB-D，以及 100 个指向动作测试片段。
- **评价指标**: 
  - **Thinker**：准确率 (Accuracy)。
  - **Motion**：Fréchet Gesture Distance (FGD, 越低越好)，语义质量 SQ (0-3分，越高越好)，条件语义时序 CT。
  - **指向动作**：空间准确率 (Score b)，时间对齐 (Score a)，时空联合性能 (STG)。
- **主要结果**: 
  - **Thinker**：在 Daily-Omni 上达到 86.30% 准确率（超 Qwen3.5-Omni-Plus 1.56%），在 ReTurn 上达 84.00%（超最强 baseline 13.96%），在 EgoProx 和 ERIBench 的空间推理与接地能力上大幅提升。
  - **Motion**：动作生成 FGD 降至 1.351（全场最低），语义质量 SQ 达 1.383（0-3分，最强 baseline Semantic Gesticulator 仅 0.608），证明其能将语义意图转化为高识别度的可见手势。
  - **视觉接地**：在指向任务中，引入空间接地训练（SGPT）后，空间准确率 Score b 从 0.357 飙升至 0.990（接近人类参考的 0.999），STG 从 0.241 升至 0.843。集成系统的首动作延迟中位数为 527 ms。

### 2. 🔥 [SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models] (SALA：语义对齐的潜在动作实现具身基础模型的双轴扩展)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.17110` | [点击跳转](https://arxiv.org/abs/2611.17110)

**0. 论文标题**
- **英文标题**: SALA: Semantically Aligned Latent Actions Enable Dual-Axis Scaling of Embodied Foundation Models
- **中文标题**: SALA：语义对齐的潜在动作实现具身基础模型的双轴扩展
- **研究机构**: 原文未提及
- **一句话总结**: 提出 SALA 方法，利用原子动作的语言描述将无标签人类视频的潜在动作与机器人潜在动作进行语义对齐，从而在预训练和后训练两个维度上利用人类视频有效扩展机器人策略。

**1. 整体逻辑**
- **研究任务**: 利用无动作标签的第一人称人类视频（egocentric human videos）来训练和扩展具身基础模型（机器人策略），解决人类到机器人的跨具身（cross-embodiment）迁移问题。
- **研究动机**: 现有的潜在动作模型（LAMs）仅靠视频重建来学习，导致潜在表征往往按视觉外观（如场景）聚类，而不是按底层动作语义聚类。这使得人类动作和机器人动作在潜在空间中无法有效对齐。
- **本质改动**: 引入未配对的人类和机器人视频片段的“原子动作”语言描述，计算语义相似度构建软邻域结构，将人类潜在动作向由真实动作锚定的机器人潜在动作进行单向语义对齐。
- **技术溯源**: 基于潜在动作模型（LAMs）、$\pi_0$ 风格的视觉-语言-动作（VLA）架构、SoftVQ 量化器，以及 DINOv2、CLIP/Qwen3-Embedding（文本编码）、Qwen3-VL（VLM 基座）。

**2. 技术拆解**
- **核心方法**: 训练一个跨具身对齐的潜在动作分词器（Tokenizer），然后用冻结的分词器为人类和机器人视频生成潜在动作标签，以此作为统一的监督信号来训练 VLA 策略网络。
- **关键细节**: 
  - **分词器 (Tokenizer)**: 人类和机器人数据共享视觉编码器、SoftVQ 量化器（256个码字，输出8个token）和视觉解码器。仅使用机器人数据训练动作解码器以重建真实动作，从而将机器人潜在动作锚定在实际控制上。
  - **语义对齐**: 使用冻结的文本编码器提取原子动作描述的相似度，通过交叉熵损失对齐人类和机器人潜在动作的软邻域分布。使用 stop-gradient 确保只移动人类潜在动作，机器人潜在动作作为锚点不动。采用 SoftVQ 而非 hard VQ，以支持连续的梯度对齐。
  - **策略网络 (Policy)**: 采用 $\pi_0$ 架构，包含 Qwen3-VL-4B 作为 VLM，0.6B 参数的 Qwen3 风格 Transformer 作为 Action Expert。在 Action Expert 中加入 latent-action queries 来预测 token 分布，使潜在动作预测直接条件化动作生成。
- **训练/优化目标**: 
  - **分词器损失**: 视觉重建损失（人类和机器人） + 动作重建损失（仅机器人，Huber loss） + 语义对齐损失（交叉熵）。
  - **策略损失**: 潜在动作损失（KL散度，人类和机器人共有） + Flow Matching 动作损失（仅机器人）。训练分三阶段：Pre-training（仅用人类视频预测 latent actions）、Mid-training（用机器人遥操作数据）、Post-training（用任务特定的机器人遥操作 + 人类演示）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**: RoboTwin 2.0 基准。目标机器人 Aloha-AgileX，非目标机器人 ARX-X5（作为人类视频替代）。对比 VLA ($\pi_{0.5}$, X-VLA)、WAM (FastWAM, LingBot-VA, InternVLA-A1.5, OpenWAM) 和 LAM (UniVLA, UniT, RotVLA)。
  - **真机**: Sharpa North 轮式人形机器人（63-DoF，含双22-DoF灵巧手）。4个下游任务（齿轮装配、双手倒水、插花、勺子舀物）。对比 GR00T N1.7、OpenWAM-$\alpha$ 和 Vanilla VLA。
- **评价指标**: 仿真和真机均使用任务成功率（Success rate, %）；预训练扩展阶段使用预测动作的验证集 L1 误差。
- **主要结果**: 
  - **仿真表现**: SALA 在 Random（域随机化）设置和平均成功率（64.4%）上取得最优，超越所有使用相同数据或预训练权重的 baseline，证明了语义对齐在场景变化下的鲁棒性。
  - **真机表现**: 平均成功率达到 72.5%，显著优于 GR00T N1.7 (41.25%)、OpenWAM-$\alpha$ (63.75%) 和 Vanilla VLA (27.50%)。
  - **双轴扩展 (Dual-Axis Scaling)**: 
    1. **预训练扩展**: 使用高达 2678 小时的人类视频进行预训练，持续降低下游任务的机器人动作预测 L1 误差，且不需要额外的机器人数据。
    2. **后训练扩展**: 在固定遥操作数据的情况下，增加任务特定的人类演示视频，使真机平均成功率从 53.75% 提升至 72.5%。
  - **机制验证**: 语言对齐使潜在空间按动作语义而非场景聚类；跨具身检索准确率大幅提升（如人类扫地视频能准确检索到机器人扫垃圾动作）；消融实验证明 stop-gradient 和 SoftVQ 对对齐至关重要。

### 3. 🔥 [EgoX: Egocentric Cross-Embodiment Manipulation with Embodiment Dreaming] (EgoX：基于具身梦境的第一人称跨具身操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16728` | [点击跳转](https://arxiv.org/abs/2611.16728)

**0. 论文标题**
- **英文标题**: EgoX: Egocentric Cross-Embodiment Manipulation with Embodiment Dreaming
- **中文标题**: EgoX：基于具身梦境的第一人称跨具身操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出EgoX框架与MED模型，通过统一第一人称视角下跨具身（人/真机/仿真）的细粒度模态表示，并引入仅训练时生效的“具身梦境”目标来预测未来潜在状态，显著提升了跨具身操作策略在分布外场景下的泛化能力。

**1. 整体逻辑**
- **研究任务**: 跨具身机器人操作（Cross-embodiment robot manipulation），即利用人类、真实机器人和仿真智能体的异构演示数据，训练能迁移到不同形态、传感器和控制接口的通用操作策略。
- **研究动机**: 不同具身（人、不同机器人）在形态、视角、本体感觉和动作空间上差异巨大，直接混合训练难以有效利用这些互补经验；现有方法要么覆盖的形态有限，要么观察/动作接口太粗糙，没有显式对齐解剖学或功能上对应的模态。
- **本质改动**: 将异构数据在“语义对应的细粒度模态”层面进行对齐（同时保留具身特定的传感和控制接口），并引入“具身梦境（Embodiment Dreaming）”作为训练时的辅助目标，迫使共享主干网络学习每个具身特有的动力学演化。
- **技术溯源**: 基于 Transformer 架构（共享主干），借鉴了 JEPA（联合嵌入预测架构）的 EMA 目标更新机制，并在前作 MXT（模块化跨具身 Transformer）基础上进行了细粒度改进。对比基线包括 ACT 和 $\pi_{0.5}$。

**2. 技术拆解**
- **核心方法**: 
  1. **统一的第一人称跨具身数据表示**：将观测和动作分解为解剖/功能对应的模态（如躯干、左右腕、末端执行器关键点），并定义统一的局部坐标系（根坐标系、自我中心坐标系、腕部坐标系）。
  2. **模块化具身梦境网络（MED）**：每个具身、每种模态有专属的 Tokenizer 和动作 Expert，中间通过共享的 Transformer Encoder-Decoder 主干融合信息。
  3. **具身梦境（Embodiment Dreaming）**：训练时，用当前观测的 EMA（指数移动平均）副本编码未来观测作为 Target，让 Dream Expert 从共享主干预测未来潜在状态（Latent），推理时丢弃该模块。
- **关键细节**: 
  - **输入**：第一人称图像、具身特定本体感觉（关节状态）、躯干/腕部/末端关键点位姿。
  - **输出**：未来 $H$ 步的动作块（Action chunk），包括各模态的目标位姿或速度指令。
  - **模型结构**：专属 Tokenizer -> 共享 Transformer 主干 -> 专属 Action Expert。Dream Expert 和 EMA Teacher 仅在训练时使用。
  - **规模/超参**：梦境潜在 token 数 $L_{dream}=8$。
- **训练/优化目标**: 
  - **动作预测损失**：各动作模态预测值与真实动作块之间的 Smooth L1 损失加权求和。
  - **具身梦境损失**：预测的未来潜在 token 与 EMA 教师编码的未来潜在 token 之间的余弦距离损失 + 可选的 Smooth L1 幅值损失。
  - 预训练时混合所有具身数据计算总 Loss，微调时只用目标具身和目标任务数据。

**3. 实验结果**
- **实验设置**: 
  - **任务与具身**：5个操作任务（Kitchen-Bread, Kitchen-Cleanup, Sort, Insert, Scoop），涵盖长序列移动操作、工具使用等；6种机器人（G1-Dex5, xArm7-Dex4, G1-Sim-Dex3, LocoMan-Dex2, R1Lite-Gripper, Z1-Tool）+ 1种人类（Human-Dex5）。
  - **Baseline**：ACT（从头训练）, $\pi_{0.5}$（微调）, MED w/o pretraining（从头训练）, MXT-FG（无梦境目标的MED变体）, 以及 Coarse variant（粗粒度模块化变体）。
  - **环境**：真实机器人和仿真环境，分分布内（ID）和分布外（OOD）设置。
- **评价指标**: 归一化任务进度得分（Normalized task progress score），根据中间阶段得分和完成奖励计算；同时用 Gromov-Wasserstein (GW) 距离评估潜在空间的几何相似度。
- **主要结果**: 
  - 跨具身预训练使 MED 的平均任务进度从 0.63 提升至 0.80，在 13 个任务-具身组合中的 12 个取得最佳，OOD 场景下提升尤为显著（0.53 -> 0.77）。
  - 预训练数据越丰富（人+其他机器人+目标机器人其他任务），OOD 泛化越好。
  - 具身梦境目标使平均任务进度从 0.63 提升至 0.78（7个设置下），并使不同具身间的潜在表征几何相似度大幅提升（GW 距离降低 38.52%）。
  - 细粒度模块化设计（每个模态独立 Tokenizer/Expert）比粗粒度设计更能避免预训练带来的性能下降，特别是在动作模态复杂的具身上表现更稳。

### 4. 🔥 [Rethinking Actions: Continuity-Aware Priors for World-Model Planning] (重新思考动作：用于世界模型规划的连续性感知先验)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16645` | [点击跳转](https://arxiv.org/abs/2611.16645)

**0. 论文标题**
- **英文标题**: Rethinking Actions: Continuity-Aware Priors for World-Model Planning
- **中文标题**: 重新思考动作：用于世界模型规划的连续性感知先验
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合局部/全局动作历史和深度核高斯过程的连续性感知动作先验（LG-DKGP），通过拟合专家动作的时间连续性来引导视觉世界模型的规划搜索，在5个机器人模拟任务中大幅提升了规划成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉世界模型的机器人目标导向规划（Visual world-model planning）。
- **研究动机**: 现有的规划方法在生成未来动作块（action chunk）时，往往将其视为无约束的独立向量集合，忽略了专家演示中动作序列固有的局部时间连续性。这种对动作结构的忽视导致搜索空间大、效率低，且容易生成不符合物理直觉的抖动动作。
- **本质改动**: 不再强加通用的平滑约束，而是直接从专家演示的时间结构中“学习”动作的延续性。通过构建一个 locality-gated 深度核高斯过程先验，将近期和长期的动作历史结合，预测动作的非线性均值并用GP拟合残差，从而为规划搜索提供一个符合专家直觉的高质量初始分布。
- **技术溯源**: 基于视觉世界模型 LeWM (LeWorldModel)，以及动作先验方法 PRISM 和直接执行方法 INTACT。规划搜索部分使用了交叉熵方法（CEM）。

**2. 技术拆解**
- **核心方法**: 提出 LG-DKGP (Locality-Gated Deep-Kernel Gaussian-Process Prior)。包含三个核心模块：1) 局部门控历史编码器，通过门控机制融合局部（近期）和全局（历史）注意力；2) 神经均值+时间GP残差，建模动作的非线性延续并拟合残差结构；3) 基于专家训练数据推导的探索尺度，用于初始化CEM搜索。
- **关键细节**: 
    - **输入输出**：输入为当前和目标的视觉特征（来自冻结编码器），以及过去最多32步的标准化动作历史。输出为未来 $H$ 步（默认25步）的动作序列。
    - **模型结构**：历史编码器使用2层带门控的多头注意力；神经均值使用MLP；GP使用稀疏变分推断，每个动作坐标独立，使用128个诱导点（inducing points），核函数结合了RBF和Matérn 3/2。
    - **规模与超参**：CEM搜索使用300个候选样本，30次迭代，保留30个精英（每次评估9000个候选）。
- **训练/优化目标**: 采用两阶段训练。第一阶段：使用MSE损失预训练历史编码器和神经均值，目标是拟合专家未来动作。第二阶段：最大化变分证据下界（ELBO），联合优化GP残差、核参数以及历史编码器和神经均值，期间视觉世界模型保持冻结。

**3. 实验结果**
- **实验设置**: 
    - **数据集与环境**：5个模拟任务，包括 PushT, OGBench Cube, LIBERO Caddy, LIBERO Scene2, RoboTwin。
    - **对比对象（baseline）**：LeWM, iCEM, INTACT, PRISM。
- **评价指标**: 
    - **控制性能**：宏观成功率（Macro success rate，5个任务的平均成功率）。
    - **动作结构**：专家相对动作结构指标（如转移特征的 MMD^2 和变化曲线误差），用于衡量生成动作与专家动作时间结构的相似度。
- **主要结果**: 
    - LG-DKGP 的宏观成功率达到 87.07%，显著优于 INTACT (71.03%)、PRISM (61.66%) 和 LeWM (58.66%)。
    - 在动作结构匹配上，LG-DKGP 生成的动作在 MMD^2 指标上全面低于 LeWM，证明其生成的动作序列在时间结构上更贴近专家演示。
    - 消融实验表明，基于专家数据校准的探索尺度对性能至关重要（例如在 RoboTwin 任务中，将固定尺度替换为专家推导尺度，成功率从 18.88% 跃升至 78.66%）；同时，引入GP残差和门控注意力机制也带来了稳定的性能提升。

### 5. 🔥 [Reins: Frontier Multimodal Models Driving Real Robot Arms on Long-Horizon Tasks, Zero-Shot] (Reins：前沿多模态模型零样本驱动真实机械臂执行长视野任务)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16632` | [点击跳转](https://arxiv.org/abs/2611.16632)

**0. 论文标题**
- **英文标题**: Reins: Frontier Multimodal Models Driving Real Robot Arms on Long-Horizon Tasks, Zero-Shot
- **中文标题**: Reins：前沿多模态模型零样本驱动真实机械臂执行长视野任务
- **研究机构**: 原文未提及
- **一句话总结**: 提出Reins系统框架，通过引入带条件检查的动作链和持续监控场景变化的“旁白”模型实例，让前沿大模型能零样本、高成功率地控制真实双臂机器人完成长视野复杂操作。

**1. 整体逻辑**
- **研究任务**: 让前沿多模态大模型在零样本、无任务特定代码的情况下，直接驱动真实双臂机器人完成长视野（long-horizon）、接触丰富的复杂操作任务。
- **研究动机**: 现有大模型在驱动真实机器人时，在移动和思考过程中是“盲”的（缺乏实时状态反馈），难以处理长视野任务中的接触和状态变化；现有的VLA（视觉-语言-动作）模型在真实硬件上成功率极低，而现有的大模型机器人系统多为开环执行或简单的技能组合，缺乏物理世界的闭环反馈。
- **本质改动**: 将大模型的单次决策从“开环动作”改为“带条件检查的闭环动作链（Guarded chains）”，并引入一个持续观察摄像头并汇报场景变化的“旁白（Narrator）”模型实例，解决大模型思考期间的场景状态丢失问题。
- **技术溯源**: 基于前沿多模态大模型（GPT-6.1 Sol, GPT-6 Astra, Claude Opus 5.5），结合 SAM 3（用于3D感知）、MuJoCo（用于仿真孪生）以及 Blender（用于场景几何重建）。

**2. 技术拆解**
- **核心方法**: 构建名为 Reins 的系统框架（harness）。核心包含两部分：1) Actor（执行者）通过调用18种原子工具（如3D感知、带接触反馈的运动和抓取）执行带前置/后置条件检查的动作链，遇到条件不满足即停止；2) Narrator（旁白）作为模型的第二个实例，以 1Hz 频率持续观察摄像头，在 Actor 思考和执行时实时汇报场景变化。
- **关键细节**: 
  - **输入输出**：Actor 输入任务提示和历史，输出工具调用链；输出包含测量值、新图像、双臂状态和 Narrator 的汇报。
  - **系统架构**：双实例架构。Actor 使用18种工具（感知、运动、夹爪、任务管理、动作链）。动作链（`do`）最多包含8个工具调用和16次运行，每一步运行工具直到条件满足，且结果必须通过检查（如关节电流指示接触、夹爪闭合指示抓取）。
  - **规模与超参**：Narrator 每 1帧/秒接收最多20帧图像。上下文管理上，文本历史保留，图像在 prompt 增长 30k tokens 后压缩为单行文本（stub），Narrator 对话每 60帧（约1分钟）重启一次以控制 Token 消耗和成本。
- **训练/优化目标**: 非学习类工作（零样本）。无训练或微调，核心机制是基于大模型的推理与工具调用（Tool use），通过物理世界的传感器反馈（接触、抓取状态）和视觉反馈实现闭环控制。

**3. 实验结果**
- **实验设置**: 
  - **任务与数据集**：5个真实双臂机器人长视野任务（shell game/杯子洗牌找物、drawer/开抽屉放物、fold towel/折毛巾、fold shirt/折衬衫、sweep/扫地）。
  - **对比对象（Baseline）**：无 Reins 框架直接调用大模型（raw images, straight-down moves），以及去除 Narrator 模块的 Reins。对比了三个模型：GPT-6.1 Sol (Ultrafast), GPT-6 Astra, Claude Opus 5.5。
  - **测试环境**：两个 6-DoF AirBot Play 双臂机器人，带头部和腕部 RGB-D 摄像头。每个条件跑 5 个 episode。
- **评价指标**: 任务成功率（Success rate）、任务耗时（Time/minutes）、API 调用成本（Cost）。对于仿真孪生，还评估了 IoU、轮廓距离、碰撞保真度等几何与物理指标。
- **主要结果**: 
  - **整体表现**：GPT-6.1 Sol 在 5 个任务中达到 88% 的真实 episode 成功率。
  - **框架有效性**：没有 Reins 框架时，GPT-6.1 Sol 在 shell game 中成功率为 0（全失败），且耗时是原来的 8 倍。
  - **Narrator 的作用**：在场景动态变化的 shell game 中，没有 Narrator 时 Sol 只成功 2/5；加入后全成功。对比三个模型的 Narrator：Sol（响应快 1-6s）能看清洗牌过程并全成功；Astra（响应慢 3-40s）成功 4/5；Opus 成功 0/5（赢的 2 次是猜的）。
  - **仿真孪生（Appendix C）**：从单张 RGB 图像重建的 MuJoCo 场景中，14 个可移动物体有 11 个通过了 sim-ready 检查，IoU 达 0.90-0.99，且脚本任务能在仿真中顺利完成，验证了场景重建的物理可用性。

### 6. 🔥 [STVLA: Spatial-aware and Temporal-memory forVision-Language-Action Models] (STVLA：面向视觉-语言-动作模型的空间感知与时间记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16589` | [点击跳转](https://arxiv.org/abs/2611.16589)

**0. 论文标题**
- **英文标题**: STVLA: Spatial-aware and Temporal-memory forVision-Language-Action Models
- **中文标题**: STVLA：面向视觉-语言-动作模型的空间感知与时间记忆
- **研究机构**: 原文未提及
- **一句话总结**: 提出STVLA框架，将预训练3D几何特征引入VLA的有界时间记忆，并设计无额外参数的联合检索打分机制，显著提升了依赖空间精度和任务历史的机器人操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Robotic manipulation），特别是需要空间场景理解和任务历史的非马尔可夫决策任务。
- **研究动机**: 现有VLA策略多依赖当前帧，缺乏对空间结构和任务历史的显式建模。纯外观记忆易受遮挡和视角变化干扰，而仅用当前帧的空间表示又无法记录任务执行中的场景动态变化。
- **本质改动**: 把预训练视觉几何模型提取的3D空间特征和2D视觉特征绑定存入有界记忆库，并设计了一个基于数学规则的“相关性-非冗余性”打分机制来引导历史检索。
- **技术溯源**: 基于 $\pi_{0.5}$（PaliGemma VLM + flow-matching action expert）、SigLIP（2D视觉编码器）和 VGGT-$\Omega$（冻结的视觉几何基础模型）。

**2. 技术拆解**
- **核心方法**: 
  1) **空间Token化**：用冻结的VGGT-$\Omega$提取多帧空间特征，通过可训练的压缩器（交叉注意力+变分瓶颈）压成紧凑的空间Token；
  2) **有界时空记忆**：将视觉和空间Token配对存入固定容量的记忆库，通过交叉注意力检索历史；
  3) **联合检索打分**：计算历史帧与当前帧的特征相似度（相关性）和归一化差异（非冗余性），两者相乘作为注意力偏置（bias），无需额外学习参数。
- **关键细节**: 输入默认4帧RGB，VGGT-$\Omega$ (1B参数) 提取特征后压缩为256个空间Token。记忆库容量为16，检索交叉注意力层数为2。空间Token在注意力掩码中有独立的prefix segment，仅对Action tokens可见，保持原有VLM的注意力模式。
- **训练/优化目标**: 联合优化。主损失为 flow-matching action loss；辅助损失包括空间特征重构损失（保证压缩Token保留几何信息）和 KL散度损失（正则化变分后验）。

**3. 实验结果**
- **实验设置**: 仿真评测使用 LIBERO、LIBERO-Mem、MIKASA-Robo 和 SimplerEnv Bridge 数据集；真机评测使用 AGIBOT G2 双臂机器人执行 block stacking、object organization 和 phone packaging 任务。对比基线包括 $\pi_{0.5}$、MemoryVLA、Spatial Forcing 等。
- **评价指标**: 任务成功率（Success Rate）。
- **主要结果**: 仿真方面，在四个基准上均取得最高平均成功率（如LIBERO 97.8%，LIBERO-Mem 41.0%）。真机方面，相比 $\pi_{0.5}$ 基线，block stacking 提升 58.33%（达到100%），object organization 提升 30.00%（达到85%），phone packaging 提升 35.00%（达到45%）。消融实验证明空间信息和时间记忆对减少执行犹豫和放置错误均有实质性贡献。

### 7. 🔥 [What Can a VLA Learn from the Agent That Calls It? Task-Level Experience Distillation for Embodied Navigation] (调用它的Agent能教给VLA什么？面向具身导航的任务级经验蒸馏)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16246` | [点击跳转](https://arxiv.org/abs/2611.16246)

**0. 论文标题**
- **英文标题**: What Can a VLA Learn from the Agent That Calls It? Task-Level Experience Distillation for Embodied Navigation
- **中文标题**: 调用它的Agent能教给VLA什么？面向具身导航的任务级经验蒸馏
- **研究机构**: 原文未提及
- **一句话总结**: 提出H2E方法，将LLM导航Agent的成功探索经验蒸馏到底层VLA模型中，让VLA学会自主停止、寻路和纠错，从而在推理时彻底摆脱LLM，在REVERIE-CE和NavRAG-CE上取得SOTA且推理速度提升3.7倍。

**1. 整体逻辑**
- **研究任务**: 连续3D环境中的目标导向导航（根据自然语言指令，让机器人在环境中找到并到达目标物体）。
- **研究动机**: 单独的VLA（视觉-语言-动作）模型在导航时有三个致命缺陷：1. 走过目标不停；2. 没到目标就提前停；3. 走偏了不会绕路恢复。现有的“LLM Planner + VLA”Agent系统能解决这些问题，但推理时全程需要调用LLM，导致极高的token消耗和推理延迟。
- **本质改动**: 现有的蒸馏工作都在压缩LLM Planner，而这篇工作反其道行之，把LLM Agent（包含Planner的决策和工具调用）在成功轨迹中的“任务级经验”直接蒸馏给底层的冻结VLA，让VLA自己学会Agent的决策逻辑，推理时完全不需要LLM。
- **技术溯源**: 基于 8B NavGPT video VLA（作为基座执行器），LLM planner (gpt-6-astra)，Habitat/Matterport3D 仿真环境，使用 LoRA 进行参数高效微调。

**2. 技术拆解**
- **核心方法**: 提出 Harness-to-Executor (H2E) 任务级经验蒸馏方法。核心包含三个数据重标签规则和一个两轮训练机制：
  1. **任务级标签 (Task-level labels)**：把Agent成功session里的所有移动（无论是VLA自己走的，还是Planner用工具走的，或是Planner改了子指令走的）都统一归功于原始任务指令下的VLA动作。
  2. **进度掩码 (Progress masking)**：Agent探索时会有绕路，通过计算距离目标的测地线距离变化，把“远离目标”的步从loss中mask掉，只保留“靠近目标”的步。
  3. **结束标签 (End labels)**：将靠近目标（1m内）的状态标记为任务结束（强制输出全0的waypoint）。利用L1 loss的中位数回归特性，强迫VLA在目标附近输出0，从而学会“停止”。
  4. **两轮蒸馏**：第一轮用Agent成功session训练；第二轮收集第一轮VLA失败的case，让Agent从这些失败状态重新开始探索（recovery sessions）并再次蒸馏，赋予VLA“恢复/纠错”能力。
- **关键细节**: 
  - **输入输出**：输入过去16帧RGB图像和文本指令，输出未来8个waypoints（平面偏移+航向）。VLA没有单独的stop head，停止动作靠输出全0的waypoint实现。
  - **数据混合**：训练数据按 0.60(Agent sessions) : 0.25(DART) : 0.15(R2R-CE) 混合。第二轮加入recovery sessions后比例调整为 0.30 : 0.30 : 0.25 : 0.15。
  - **模型结构**：冻结Vision Encoder，用LoRA (rank=16, alpha=32) 微调语言模型的attention和FFN层，全量训练action head。
- **训练/优化目标**: 最小化带进度掩码的 L1 损失函数 (Masked L1 loss)。L1 loss 结合结束标签（多数样本目标为0），在数学上能迫使模型在目标附近输出精确的0值，解决VLA“停不下来”的问题。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：REVERIE-CE (val-unseen 3189 episodes), NavRAG-CE (val-unseen 6932 episodes)。环境为 Habitat + Matterport3D。
  - **Baseline**：Base VLA (8B NavGPT), Geodesic adaptation (仅用测地线专家数据), 以及已发表的单目方法 (InstructNav, NaVid, g3D-LF, Dynam3D, D3D-VLP)。
- **评价指标**: SR (成功率), OSR (神谕成功率), SPL (路径长度加权成功率), NE (导航误差)。
- **主要结果**: 
  - **刷新SOTA**：在REVERIE-CE上，两轮H2E将8B VLA的SR从35.0%提升至50.6%（+15.6%），超越使用10M样本和深度图的D3D-VLP (SR 47.5%)。在NavRAG-CE上，SR从21.3%提升至32.4%（+11.1%），同样超越D3D-VLP成为SOTA。
  - **超越教师Agent**：在held-out episodes上，蒸馏后的VLA独立运行，SR达到57%，超过了教它的LLM Agent (53%)。同时推理时间从423s降至114s（快3.7倍），LLM token消耗降为0。
  - **能力拆解分析**：H2E第一轮主要提升了“停止（Stopping）”能力（Stop term +11.8%）；第二轮额外提升了“到达（Reach）”和“偏离后恢复（Recovery）”能力。

### 8. 🔥 [BWM-Forge: Agentic World Programming for Embodied Intelligence] (BWM-Forge：面向具身智能的智能体世界编程)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.16221` | [点击跳转](https://arxiv.org/abs/2611.16221)

**0. 论文标题**
- **英文标题**: BWM-Forge: Agentic World Programming for Embodied Intelligence
- **中文标题**: BWM-Forge：面向具身智能的智能体世界编程
- **研究机构**: 原文未提及
- **一句话总结**: 提出 BWM-Forge 框架，通过多智能体协作生成可执行的 Blender 场景代码来构建代理视频，从而实现对机器人视频生成中场景几何、运动和视角的精确控制与跨任务复用。

**1. 整体逻辑**
- **研究任务**: 生成可控的具身智能（机器人）视频数据，支持对场景布局、机器人运动和相机视角的直接编辑与复用。
- **研究动机**: 现有的端到端视频生成模型将世界状态隐式编码在像素中，用户无法直接访问和修改场景物体、机器人构型和相机轨迹。这导致在生成具身数据时，难以实现“保留背景只换物体”、“同一交互多视角观察”或“同一场景适配不同机器人”等针对性编辑。
- **本质改动**: 摒弃直接端到端生成，采用“代码驱动的世界编程”思路。用大模型生成可编辑的 Blender 场景和运动程序，渲染出几何与运动正确的代理视频（proxy video），再以此作为结构和运动条件，引导视频生成模型补充视觉细节。
- **技术溯源**: 基于 Code World Model（如 WorldCoder, Code2Worlds）思想，结合 Blender 3D 引擎、URDF 机器人描述文件、大语言模型（gpt-5.6-sol, gpt-6-astra）以及视频生成模型（Doubao-Seedance-2.5）。

**2. 技术拆解**
- **核心方法**: 设计了一个由 Harness 系统协调的四智能体工作流：Preprocessing Agent 负责验证资产并解析视觉信息；Building Agent 分阶段（场景构建、机器人导入、组合）生成并执行 Blender 代码构建 3D 场景和动画；Review Agent 结合视觉和数值证据检查物理约束和布局；Rendering Agent 利用代理视频引导视频生成模型生成高保真视频。系统还包含一个经验库（Experience Repository），用于跨任务复用建模和渲染规则。
- **关键细节**: 
  - 输入支持三种模式：仅初始图像、初始图像+运动数据、人类演示视频。
  - 支持 5 种机器人构型：单臂、双臂带夹爪、双臂带灵巧手、四足、人形。
  - 核心工具链：Blender 5.2.2 LTS 用于代理场景渲染，Doubao-Seedance-2.5 用于最终视频生成，gpt-5.6-sol 和 gpt-6-astra 作为底层 LLM/VLM 驱动各个 Agent。
- **训练/优化目标**: 本文为系统工程与 Agent 方法，不涉及神经网络参数训练。核心机制是基于 LLM 的代码生成与测试时提示优化（Test-Time Prompt Optimization）。优化目标是通过自动化评估（7 项客观指标）和 VLM 视觉评估的反馈，迭代修改渲染提示词和场景代码，使最终视频在物理合理性、指令对齐和视觉质量上达到阈值。

**3. 实验结果**
- **实验设置**: 
  - 任务与数据：15 个具身任务，覆盖 5 种机器人类型及多种场景（厨房、会议室、办公室、实验室等）。
  - 对比对象（Baseline）：LingBot-World Base Cam。
  - 测试环境：Baseline 运行于 8 张 NVIDIA A100 40GB GPU，环境为 Python 3.10.20, PyTorch 2.7.1, CUDA 12.6 等。
- **评价指标**: 
  - 视频质量（VBench-Long）：美学质量 (AQ)、成像质量 (IQ)、主体一致性 (SC)、背景一致性 (BC)、运动平滑度 (MS)、动态程度 (DD)。
  - 具身任务指标（RoboJudge-9B）：物理合理性 (PA)、指令对齐度 (IA)，1-5 分制。
- **主要结果**: 
  - 在 VBench-Long 上，BWM-Forge 在 AQ (0.5226 vs 0.5135)、SC (0.9721 vs 0.9480)、BC (0.9722 vs 0.9578)、MS (0.9942 vs 0.9872) 上均优于 Baseline，但在 DD (0.5023 vs 0.7889) 上较低（说明大尺度运动较少，画面更稳定）。IQ 指标两者基本持平（0.7321 vs 0.7341）。
  - 在 RoboJudge-9B 上，BWM-Forge 的 PA (2.93 vs 2.89) 和 IA (3.33 vs 2.73) 均高于 Baseline，特别是在指令对齐度上提升显著。
  - 定性结果表明，该框架支持同一场景程序下的多视角同步渲染、外观风格迁移（如将同一代理视频渲染为市场、仓库或农场），以及基于用户反馈的局部编辑。

### 9. 🔥 [Bind-WAM: Binding-Uncertainty-Guided Selective Future Imagination in World Action Models] (Bind-WAM：绑定不确定性引导的世界动作模型选择性未来想象)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.15368` | [点击跳转](https://arxiv.org/abs/2611.15368)

**0. 论文标题**
- **英文标题**: Bind-WAM: Binding-Uncertainty-Guided Selective Future Imagination in World Action Models
- **中文标题**: Bind-WAM：绑定不确定性引导的世界动作模型选择性未来想象
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于语言-物体绑定不确定性的路由机制，让世界动作模型（WAM）只在视觉证据不稳定时才进行昂贵的未来视频预测，从而在保持高成功率的同时大幅降低推理时间。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略中的世界动作模型（WAM）推理优化（具体为：决定何时在WAM中触发联合未来视觉与动作预测）。
- **研究动机**: 现有的WAM在每次重规划时都默认生成未来视觉状态（如Fast-WAM-Joint），计算成本高且在很多状态下是不必要的；而完全去除未来想象（如Fast-WAM）又会在视觉证据模糊时导致动作失败。目前缺乏一个可解释的信号来判断当前状态是否真的需要“想象未来”。
- **本质改动**: 引入“语言-物体绑定不确定性”作为路由信号，通过一个轻量级预测器评估当前指令与视觉物体的绑定是否稳定，从而动态切换WAM的推理路径（直接预测动作 vs 联合预测未来与动作）。
- **技术溯源**: 基于 World Action Models (WAMs) 框架（如 Fast-WAM）；离线标签生成依赖 Qwen3-VL、SAM 3.1 和 DINOv3；WAM的视频骨干网络使用预训练的 Wan2.2-5B。

**2. 技术拆解**
- **核心方法**: 
  1. 离线构建绑定不确定性伪标签：利用大模型和分割模型检测参考不匹配、物体不可见和身份漂移，生成帧级别的二值标签。
  2. 训练轻量级不确定性预测器：仅输入当前RGB帧和语言指令，输出绑定不确定性得分。
  3. 不确定性引导的动态路由：在推理时，根据不确定性绝对值及其时间步变化量，决定WAM走“直接动作去噪”路径还是“联合未来-动作去噪”路径。
- **关键细节**: 
  - 离线标签：从demo中均匀采样32帧，用Qwen3-VL-32B分配角色边界框，SAM 3.1生成掩码，DINOv3 ViT-L/16计算特征余弦相似度。当IoU<0.3、不可见或相似度<0.9时标记为不确定。
  - 预测器：6.65M参数的轻量级ViT架构，输入224x224图像和指令，输出0-1的不确定性概率。
  - WAM路由：共享参数的WAM，通过修改action-to-video的注意力掩码实现两条路径。直接路径只看当前帧，联合路径看当前帧+未来帧。路由触发条件为不确定性 $U_t \ge \tau_U$ 或变化量 $\Delta U_t \ge \tau_\Delta$。
- **训练/优化目标**: 
  - 预测器：类别加权二元交叉熵损失加上Brier分数项（用于校准概率）。
  - WAM策略：基于Flow-matching（流匹配）目标，分别对动作和潜在视频未来计算MSE损失，并根据路由掩码进行联合优化。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（单臂，4个suite），RoboTwin 2.0（双臂，7个任务，含clean和randomized条件），真实世界双臂任务（Towel-Fold, Handover-Place, Shape-Alignment）。
  - 对比对象（baseline）：OpenVLA, $\pi_0$, $\pi_{0.5}$, X-VLA, LingBot-VA, Motus, AdaWAM, Fast-WAM, Fast-WAM-Joint。
- **评价指标**: 任务成功率（Success Rate, %）、成功 episode 的平均完成时间（Time, s）、未来想象触发比例（Future Imagination, %）。
- **主要结果**: 
  - LIBERO：Bind-WAM平均成功率达98.6%，比Fast-WAM高1.5%，比Fast-WAM-Joint高0.2%；平均完成时间降至11.71s（比Fast-WAM-Joint的15.73s减少25.6%），未来想象触发比例仅为40.6%。
  - RoboTwin 2.0：在clean条件下平均成功率88.3%（位列第二），在randomized条件下87.0%（位列第一），均优于Fast-WAM系列，且完成时间更短（未来想象比例约36%-44%）。
  - 真实世界：平均成功率66.6%（高于Fast-WAM-Joint的57.6%），平均完成时间39.0s，未来想象触发比例仅28.4%。
  - 消融实验证明，在相同的未来想象触发比例下，基于不确定性的路由比随机或均匀路由的成功率更高、耗时更短。

### 10. 🔥 [Does Your World Model Know Actions Have Consequences?] (你的世界模型知道动作会产生后果吗？)
- **研究机构**: `Northwestern University`
- **Arxiv ID**: `2611.15048` | [点击跳转](https://arxiv.org/abs/2611.15048)

**0. 论文标题**
- **英文标题**: Does Your World Model Know Actions Have Consequences?
- **中文标题**: 你的世界模型知道动作会产生后果吗？
- **研究机构**: Northwestern University
- **一句话总结**: 提出了一种基于动作灵敏度分析的 AP 评估指标，用于衡量具身世界模型预测反事实动作后果的保真度，揭示了现有模型在状态重建误差与动作灵敏度预测之间的内在权衡。

**1. 整体逻辑**
- **研究任务**: 评估具身世界模型（Embodied World Models）对反事实动作（counterfactual actions）后果的预测保真度。
- **研究动机**: 现有的评估指标（如重建清晰度、任务成功率）只关注单一组件或最终结果，无法准确衡量世界模型核心组件（动力学预测器）在面对动作扰动时预测环境响应的真实能力，容易给出虚假的规划效用信号（例如重建误差低不代表规划能力强，或者在训练分布内成功但泛化极差）。
- **本质改动**: 引入控制论和系统辨识中的灵敏度分析思想，将评估视角从“状态预测准不准”转变为“对动作扰动的响应预测准不准”，提出了动作扰动（AP）指标来审计动力学预测器的反事实推理能力。
- **技术溯源**: 基于 TD-MPC2（世界模型框架）和 MetaWorld（机器人仿真环境）。

**2. 技术拆解**
- **核心方法**: 提出动作扰动（Action Perturbation, AP）指标。通过对动作施加微小扰动，计算真实环境响应与模型预测响应之间的差异，来量化模型对动作后果的敏感度预测能力。
- **关键细节**: 
  - 输入输出：输入当前状态和动作，输出未来潜在状态。通过一个冻结的线性探针（linear probe）将潜在空间映射回物理状态空间。
  - 模型结构：基于 TD-MPC2 架构，实验中冻结感知编码器和评估数据，仅微调动力学预测头（dynamics head）。
  - 关键超参：动作扰动幅度 $\|\delta\| \in \{0.1, 0.2, 0.5, 1.0\}$，预测步长 $H \in \{1, 2, 3, 4, 5, 10\}$。AP 指标按真实脉冲响应的大小进行加权平均。
- **训练/优化目标**: 动力学头使用标准的动力学一致性损失（dynamics consistency loss） $\|\hat{z}_{t+1} - z_{t+1}\|$ 进行微调。AP 指标本身不作为训练损失，而是作为事后评估指标，衡量预测的脉冲响应与真实脉冲响应的相对误差（AP=0 为完美，AP>1 表示预测结果比直接忽略扰动还要糟）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：MetaWorld 环境中的 Push（推方块）和 Peg（插 peg）任务。
  - 对比对象（baseline）：三种不同数据收集策略训练的 TD-MPC2 动力学头：1) Workspace raster（工作空间均匀网格采样，优先状态覆盖）；2) Imitation learning (IL，仅使用专家演示)；3) Noise-injected（专家演示中加入高斯噪声）。
- **评价指标**: State error（状态误差，越低越好）和 AP metric（动作扰动指标，衡量预测灵敏度与真实灵敏度的差异，越低越好）。
- **主要结果**: 
  - Noise-injected 模型在保持与 IL 模型相近的状态误差的同时，AP 指标显著更优（Push 任务提升约 16%，Peg 任务提升约 48%），证明噪声注入能有效提升动作灵敏度预测。
  - IL 模型虽然状态误差低，但 AP 指标较差，暴露了其在训练分布外的动作扰动下极其脆弱。
  - Workspace raster 模型在两项指标上均表现最差，说明有限且分散的数据不足以支撑准确的动力学预测。
  - 结论验证了设计世界模型时，往往需要在低状态误差和高动作灵敏度预测精度之间进行权衡，具体取舍取决于部署环境是结构化（要求低状态误差）还是非结构化未知环境（要求高动作灵敏度）。

### 11. 🔥 [The Posterior-Prior Epistemic Gap: When World Model Imagination Fails to Carry Task-Relevant Signals] (后验-先验认知鸿沟：当世界模型想象无法传递任务相关信号时)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.14955` | [点击跳转](https://arxiv.org/abs/2611.14955)

**0. 论文标题**
- **英文标题**: The Posterior-Prior Epistemic Gap: When World Model Imagination Fails to Carry Task-Relevant Signals
- **中文标题**: 后验-先验认知鸿沟：当世界模型想象无法传递任务相关信号时
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过诊断性案例研究揭示了基于 RSSM 的世界模型在多步想象（先验）中会严重丢失任务相关的障碍物信号，且模型自身的认知不确定性指标无法察觉该丢失（即“未知的未知”），同时展示了通过动态调节自由能权重可在同一模型上切换多种驾驶行为。

**1. 整体逻辑**
- **研究任务**: 评估基于世界模型（World Model）和主动推理（Active Inference）的自动驾驶规划器，在想象（rollout）未来轨迹时任务相关信号的传递保真度，并改进其多任务行为控制能力。
- **研究动机**: 基于模型的规划器假设转移模型（transition model）能忠实传递任务相关信号，但这一假设极少被直接测量。作者发现，经过观测滤波的后验状态包含障碍物信息，而规划实际使用的纯想象先验状态会逐步丢失这些信息，且规划器自带的置信度指标根本察觉不到这种信息丢失。
- **本质改动**: 提出了一种“后验-先验探针诊断方法”来量化世界模型在想象过程中的信息衰减瓶颈；同时引入任务条件化的有效自由能（EFE）权重动态调制机制，在不重新训练模型的情况下切换驾驶行为。
- **技术溯源**: 循环状态空间模型（RSSM，如 Dreamer 系列）、主动推理（Active Inference / Expected Free Energy）、改进的交叉熵方法（iCEM）、CARLA 驾驶模拟器。

**2. 技术拆解**
- **核心方法**: 
  1. **后验-先验认知鸿沟诊断**：训练一个辅助障碍物预测头，分别在后验状态（有真实观测）和先验状态（纯想象 rollout）上评估，量化障碍物信息随想象步数的衰减情况，从而定位信息瓶颈。
  2. **任务条件化 EFE 权重调制**：在运行时根据预测误差和上下文（如状态误差、障碍物距离），动态调整有效自由能（EFE）公式中各组件（工具价值、认知价值、状态空间价值、障碍物惩罚）的权重，实现行为切换。
- **关键细节**: 
  - **世界模型**：ConvEncoder (64×64 RGB + 4D 本体状态) -> RSSM (256维确定性 GRU 状态 + 64维随机性高斯状态) -> 解码器。
  - **规划器**：iCEM (500个样本，50个精英，12-15步 horizon)。
  - **EFE 组件**：包含工具价值（基于 GMM 的潜在空间偏好）、认知价值（5个集成转移头的 disagreement）、状态空间价值（航向和横向误差）、障碍物惩罚。
  - **权重调制规则**：状态误差大时增加状态权重；障碍物近时抑制工具价值让障碍物惩罚主导；避障后临时增加状态权重以回正车道。
- **训练/优化目标**: 训练时最小化变分自由能（VFE），包含双重 KL 散度、图像和状态重建损失，以及辅助障碍物预测头的 BCE 损失。规划时最小化多组件的有效自由能（EFE）。

**3. 实验结果**
- **实验设置**: CARLA 0.9.16 驾驶模拟器（Town04 和 Town06）。单一种子案例研究（single-seed case study）。对比对象为自身不同配置（后验 vs 先验，有特权坐标 vs 无特权坐标，不同 EFE 权重配置），原文未提及与其他外部 SOTA baseline 的对比。
- **评价指标**: 
  - 信息保真度：辅助探针的 AUC 和 logit 分离度。
  - 驾驶表现：平均横向偏差（MLD）、路线完成率、避障成功率。
- **主要结果**: 
  - **信息衰减（核心发现）**：后验状态下障碍物探针 AUC 为 0.85，但在 15 步先验想象中 AUC 衰减至 0.71，logit 分离度下降 57%，且第一步衰减最剧烈。这证明转移模型是信息丢失的瓶颈。
  - **未知的未知**：规划器基于集成 disagreement 的认知价值项作为障碍物分类器的 AUC 仅为 0.52（随机水平），完全无法察觉想象过程中的信息丢失。在无特权坐标时，避障率跌至 0%。
  - **行为控制（次要贡献）**：通过动态调节 EFE 权重，同一个世界模型在 Task A 实现 81.2 ± 1.8% 的车道保持路线完成率（MLD 0.63m）；在 Task B（依赖特权障碍物坐标）实现 28/28 的 100% 避障成功率。

### 12. 🔥 [AFTER: A World Model with Adaptive Fast--Slow Timescales for Error-Driven Retention] (AFTER：一种具有自适应快慢时间尺度以进行误差驱动保留的世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.15215` | [点击跳转](https://arxiv.org/abs/2611.15215)

**0. 论文标题**
- **英文标题**: AFTER: A World Model with Adaptive Fast--Slow Timescales for Error-Driven Retention
- **中文标题**: AFTER：一种具有自适应快慢时间尺度以进行误差驱动保留的世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 受大脑预测编码启发，提出一种通过快慢双时间尺度记忆和动态路由预训练专家的世界模型，解决了机器人在未知动力学突变下难以兼顾响应性、稳定性和持久性的问题。

**1. 整体逻辑**
- **研究任务**: 具身智能与机器人控制中，世界模型在交互时遇到突发且持续的动力学变化（如机械臂抓取未知负载、关节或引擎故障）时的在线自适应预测。
- **研究动机**: 现有世界模型在动力学适应上面临“不可能三角”：响应性（快速反应防止开环推演误差累积）、稳定性（区分持续变化和瞬态干扰防止错误更新）和持久性（在无新观测的开环推演中保持适应后的动力学，不退化回旧状态）。单时间尺度模型顾此失彼，而现有多时间尺度模型（如 MTS3）只在固定间隔推断慢变量，响应太慢。
- **本质改动**: 引入快慢双时间尺度记忆机制来解耦响应与持久，同时通过预测误差动态调整预训练专家的组合权重而不修改专家参数，从而同时满足上述三个要求。
- **技术溯源**: 灵感来自神经科学的预测编码 (Predictive Coding)；基座模型为混合专家系统 (Mixture of Experts, MLP)；对比了 DreamerV3 (RSSM), TD-MPC2, GrBAL, ReBAL, MOLe, MBCD, GPMM, MTS3 等主流世界模型。

**2. 技术拆解**
- **核心方法**: AFTER-WM 包含三个核心设计：1) 预测校正：用单步预测误差更新在线记忆，无需梯度反传；2) 双时间尺度适应：快状态快速衰减负责响应初始变化，慢状态类似卡尔曼滤波负责持久累积持续变化；3) 多内部模型：通过路由记忆根据误差动态调整预训练专家的权重，冻结专家参数以防噪声破坏。
- **关键细节**: 输入为状态和动作，上下文窗口 $C=64$ 步，预测视界 $H=40$ 步。预训练基座包含 $K=3$ 个 MLP 专家。在线记忆包括路由记忆、每个专家的快状态和慢状态（含方差）。快状态更新带衰减因子 $\rho$；慢状态更新包含测量网络和滤波网络以处理噪声。模型总参数量约 0.70M。
- **训练/优化目标**: 分两阶段。Stage 1 预训练基座，优化单步和轨迹的混合高斯负对数似然，加正则项保证所有专家都被使用；Stage 2 冻结基座，训练记忆网络，优化开环预测的加权均方误差 (MSE) 和负对数似然，使模型学会从误差中读取动力学变化。

**3. 实验结果**
- **实验设置**: 数据集包括 5 个 MuJoCo 仿真数据集（JSHC, ESCP-HC, Panda, UR5e, Hopper，包含关节失效、负载/摩擦突变等）和 1 个真实固定翼无人机数据集（ALFA，包含引擎/控制面故障）。对比 10 个 baseline，涵盖通用、在线自适应和多时间尺度三类。
- **评价指标**: 多步平均误差 (multi-step mean error, nMSE，1-40步的平均归一化均方误差)、第 40 步误差 (step-40 error)，以及控制任务中的平均回报 (mean return)。
- **主要结果**: 在 5 个仿真集上，多步平均误差比最强 baseline (ReBAL 或 MOLe) 低 16.4%–33.7%；在真实无人机数据上比最强 baseline (MOLe) 低至少 13.1%；在关节故障控制任务中取得最高平均回报 (93.1)，比第二名高 13.8。消融实验证实了快校正保障了早期响应，慢校正和路由记忆保障了后期持久，且瞬态干扰不会破坏慢状态（稳定性）。

### 13. 🔥 [Prediction or Persistence? What Future-Prediction Scores Miss About World Models] (预测还是惯性？未来预测分数在世界模型中遗漏了什么)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.15082` | [点击跳转](https://arxiv.org/abs/2611.15082)

**0. 论文标题**
- **英文标题**: Prediction or Persistence? What Future-Prediction Scores Miss About World Models
- **中文标题**: 预测还是惯性？未来预测分数在世界模型中遗漏了什么
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种“持久性控制”评估方法，通过禁用预测器来隔离并量化视频世界模型中预测模块的真实贡献，揭示了现有的未来预测分数混合了编码器质量和时间惯性，无法单独反映模型的真实预测能力。

**1. 整体逻辑**
- **研究任务**: 评估预训练视频世界模型（如 V-JEPA、DINO-WM 等）的未来预测能力，为机器人学习中的模型选择、规划或评估提供可靠的衡量标准。
- **研究动机**: 现有的“未来预测分数”具有误导性。这个分数实际上混合了三个因素：编码器表征场景的质量、近期未来与近期过去的相似性（时间惯性/持续性）、以及预测器本身的贡献。一个毫无预测能力的模型仅靠优秀的编码器也能拿到高分，导致单看总分无法判断预测模块是否真正在起作用。
- **本质改动**: 引入“持久性控制（persistence control）”机制。将模型中的预测器替换为恒等映射（即直接复制当前状态，不调用预测器），通过计算完整模型与控制模型在同一任务上的得分差值，单独剥离并量化预测器的真实贡献。
- **技术溯源**: 基于 V-JEPA (2 和 2.1)、DINO-WM、LeWM (LeWorldModel) 等预训练视频世界模型，以及 DINOv2 等视觉编码器。

**2. 技术拆解**
- **核心方法**: 构建“未来检索探针（future-retrieval probe）”与“持久性控制”的配对评估协议。在检索任务中，模型需从 11 个同源视频候选片段中找出真正的未来延续。持久性控制组使用完全相同的冻结编码器，但禁用预测器，仅依靠编码器计算当前状态与候选片段的相似度。
- **关键细节**: 
  - **输入输出**：输入为历史视频片段（anchor，时长 $A \in \{1..10\}$ 秒），输出为从 11 个候选窗口（时长 $W \in \{1..A\}$ 秒）中检索出真实未来片段。
  - **模型结构**：冻结编码器 $f_\theta$ 和冻结预测器 $g_\theta$。在控制组中，预测器被替换为 $g_\theta^{pers}(z, W) = z$。
  - **规模与数据**：使用 1,094 个家庭第一人称被动视频（共 479 小时，无动作流），构建了 27,000 个零样本检索试验。
  - **关键设置**：候选片段顺序随机打乱以排除位置提示；使用模型原生的训练损失函数（native energy）进行排序，确保评估在其自身的特征空间内进行。
- **训练/优化目标**: 本文为零样本评估方法，无训练过程。核心机制是计算预测器贡献 $\delta_\theta$，即完整模型与持久性控制模型在 Top-1 准确率上的配对差值。若 $\delta_\theta < 0$，则说明预测器不仅没用，反而起了反作用。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：1,094 个家庭第一人称被动视频（479 小时），提取 27,000 个检索试验。
  - **对比对象（baseline）**：V-JEPA 2 (ViT-H, ViT-L)、V-JEPA 2.1 (ViT-g)、DINO-WM、LeWM。
- **评价指标**: Top-1 准确率（检索真实未来片段的命中率），以及完整模型与持久性控制模型的 Top-1 差值（预测器贡献 $\delta_\theta$）。使用视频级别的聚类 bootstrap 计算 95% 置信区间。
- **主要结果**: 
  - **分数与预测器贡献解耦**：在 V-JEPA 2 家族中，模型总分超过 0.42，但预测器的真实贡献极小（仅 +0.028 到 +0.04），说明高分主要靠编码器。
  - **V-JEPA 2.1 预测能力显著**：总分达到 0.736，其中预测器贡献高达 +0.291，是 V-JEPA 2 的近 10 倍。
  - **预测器可能起反作用**：DINO-WM 和 LeWM（动作条件模型在被动视频上属于分布外）总分虽高于随机概率（0.091），但去掉预测器后分数反而大幅上升（如 DINO-WM 从 0.136 升至 0.315），预测器贡献为负。
  - **控制组验证了探针的有效性**：仅看持久性控制（禁用预测器）的分数，就能恢复出编码器预训练方式的预期排序（视频预训练 > 图像预训练 > 仿真预训练），证明该评估协议能追踪到真实的表征信号。作者建议未来报告预测分数时，必须同时报告其持久性基线。

### 14. 🔥 [Making Future-Predictive Representations Actionable] (使未来预测表征可被动作利用)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22994` | [点击跳转](https://arxiv.org/abs/2611.22994)

**0. 论文标题**
- **英文标题**: Making Future-Predictive Representations Actionable
- **中文标题**: 使未来预测表征可被动作利用
- **研究机构**: 原文未提及
- **一句话总结**: 揭示了现有世界动作模型中“未来预测特征”未被动作路径有效利用的鸿沟，并通过引入轻量级的显式过渡空间，将深层预测特征直接注入动作注意力，大幅提升了机器人在分布偏移下的泛化能力。

**1. 整体逻辑**
- **研究任务**: 提升基于世界动作模型（WAMs）的机器人策略在分布偏移（如背景、光照、视角变化等）下的零样本泛化能力。
- **研究动机**: 现有的无未来帧推理（FFI）WAMs（如 Fast-WAM）假设辅助的未来预测监督能隐式提升共享表征，进而帮助动作生成。但作者通过逐层分析发现了一个“表征-利用鸿沟”：未来监督确实在深层视觉特征中写入了丰富的预测信息，但这些信息的特征方向和注意力焦点与动作目标逐渐正交，导致动作路径根本“读”不到这些有用的预测信息。
- **本质改动**: 不再依赖动作路径去隐式读取共享表征，而是在视频骨干和动作骨干之间加了一个显式的“过渡空间（transition space）”，把深层的未来预测特征主动提取出来，转换成动作能直接用的形式并喂给动作注意力机制。
- **技术溯源**: 基于 Fast-WAM（FFI WAM 范式），底层采用 Video DiT（Wan2.2-5B）和 Action DiT 组成的 Mixture-of-Transformers (MoT) 架构。

**2. 技术拆解**
- **核心方法**: 提出 RelayWAM，在 Video DiT 的中深层（14-29层）附加循环过渡层（recurrent transition layers）。这些层维护一组与动作步对齐的 transition tokens，通过任务指令、机器人状态和当前动作估计进行条件化，从视频特征中提取预测线索，并跨层累积后直接作为 Key/Value 注入到 Action DiT 的原生注意力机制中。
- **关键细节**: 
  - **输入与条件**：当前视觉观测、语言指令、机器人本体状态、当前动作估计（flow time）。
  - **模型结构与规模**：过渡层仅增加 34.96M 参数（不到 6.02B 骨干的 0.6%），且各层共享权重，仅保留轻量级的层归一化和偏置。
  - **推理机制**：Video DiT 只跑一次并缓存 K/V，每个去噪步只重跑轻量级的过渡层，推理时完全不生成未来帧。
- **训练/优化目标**: 保持与 FFI WAM 完全相同的联合损失函数 $\mathcal{L}_{action} + \lambda_{future}\mathcal{L}_{future}$。过渡层没有额外的辅助损失，通过动作损失端到端学习特征转换，梯度同时回传塑造视觉骨干。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（标准操作）、LIBERO-Plus（7种分布偏移）、LIBERO-PRO（5种泛化维度）。真实世界：室内人造苹果树采摘任务（Piper 机械臂，80个演示）。
  - **对比对象（baseline）**：VLA 模型（OpenVLA, $\pi_0$, OpenVLA-OFT），Joint WAMs（Fast-WAM-Joint, OpenWAM-$\alpha$），FFI WAMs（Fast-WAM, DreamWAM, Light-WAM），以及大规模具身预训练模型（DM0.5）。
- **评价指标**: 任务成功率（Success Rate %）。
- **主要结果**: 
  - 在 LIBERO-Plus（分布偏移）上，RelayWAM 达到 72.03%，远超无未来监督的 56.42% 和基线 Fast-WAM 的 51.50%，甚至超过了推理时显式生成未来帧的 OpenWAM-$\alpha$ (69.2%)。
  - 消融实验证明，未来监督在基础架构上仅提升 5.2 个点，但加入过渡空间后提升了 15.6 个点，证实了过渡空间能成倍放大未来监督的收益。
  - 真实世界光照剧烈变化下，Fast-WAM 成功率暴跌至 15%，而 RelayWAM 保持 70%，媲美经过大规模预训练的 DM0.5 (75%)。

### 15. 🔥 [Zero-Shot Compositional Generalization for Embodied Manipulation] (具身操作的零样本组合泛化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22797` | [点击跳转](https://arxiv.org/abs/2611.22797)

**0. 论文标题**
- **英文标题**: Zero-Shot Compositional Generalization for Embodied Manipulation
- **中文标题**: 具身操作的零样本组合泛化
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于几何监督的训练框架，利用正向运动学将源机器人的动作转化为工具空间目标，从而在没有目标机器人关节标签的情况下训练其动作解码器，实现跨机器人的零样本技能组合。

**1. 整体逻辑**
- **研究任务**: 解决异构机器人数据集中，某些“机器人-任务”组合缺失（unobserved）时的零样本泛化问题，即让一个熟悉的机器人执行一个熟悉的技能，但该机器人从未演示过该特定技能。
- **研究动机**: 现有的多机器人数据集在 pooling 数据时，动作标签（关节向量）与特定的运动学链条强绑定。不同机器人的关节数、几何和约定不同，导致共享模型难以在不同机器人之间建立动作的物理对应关系，无法直接复用未观测到的机器人-任务组合。
- **本质改动**: 放弃直接对齐不同机器人的关节空间，而是利用校准的正向运动学（FK）将源机器人的动作映射到共享的任务空间（工具位姿和夹爪开合度），以此作为物理监督信号来训练目标机器人的原生动作解码器。
- **技术溯源**: 基于现有的策略骨干网络（如 $\pi_{0.5}$、OpenWAM、FastWAM），以及多机器人模拟器环境（RoboTwin、ManiSkill3）。

**2. 技术拆解**
- **核心方法**: 分为动作接口预训练和策略学习两阶段。接口预训练阶段，使用变分编码器将源动作编码到共享坐标，用目标机器人的原生解码器解码，并通过正向运动学计算解码后的工具位姿，与源动作的工具位姿计算几何监督损失；策略学习阶段，冻结动作接口，策略网络学习预测共享动作坐标，并可选地通过冻结的解码器和FK对预测动作进行额外的几何校正。
- **关键细节**: 
  - 输入输出：输入为图像、语言指令、当前原生状态；输出为原生关节命令和夹爪开合度。
  - 模型结构：包含特定于机器人的输入投影、共享变分编码器、特定于机器人的原生解码器。策略骨干采用基于 Flow matching 的架构。动作表示为32维，以分块（chunks）序列形式处理。
  - 关键机制：使用正向可达性检查（通过数值IK求解）过滤不可达的目标，仅对可达目标施加跨机器人监督。
- **训练/优化目标**: 
  - 接口训练目标：最小化 $\mathcal{L}_{own} + \gamma \mathcal{L}_{foreign}$。$\mathcal{L}_{own}$ 包含原生重建、源工具位姿重建和KL散度；$\mathcal{L}_{foreign}$ 是工具位置、旋转和夹爪开合度的误差，并乘以可达性掩码。
  - 策略训练目标：基于 Flow matching 的加权流损失 $\mathcal{L}_{flow}$，可选加上 $\lambda_{FK} \mathcal{L}_{FK}$（通过冻结的解码器和FK计算的干净预测几何误差）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboTwin 和 ManiSkill3 两个模拟器。
  - 对比对象（baseline）：Native joints（直接预测原生关节）、Direct EEF + IK（直接预测末端执行器位姿加在线IK）、Source（仅原生重建的接口）、Cross（加入跨机器人几何监督的接口）、Full（Cross接口 + 策略阶段FK监督）。
- **评价指标**: 任务平均成功率（Task-averaged success rate, %），分为 Seen（训练时见过的机器人-任务组合）和 Held-out（训练时未见过的/缺失的组合）。
- **主要结果**: 
  - 在 RoboTwin 中，Full 方法在 Held-out 组合上比 Native joints 提升了 11.7-20.1 个百分点（如 $\pi_{0.5}$ 从 17.0% 提升至 33.6%，FastWAM 从 9.7% 提升至 29.8%）。
  - 引入跨机器人几何监督（Cross 相比 Source）在 Held-out 上提升了约 8.6-9.5 个百分点。
  - 策略阶段的 FK 监督（Full 相比 Cross）进一步提升了 Held-out 成功率约 3.5-3.6 个百分点。
  - Full 方法比 Direct EEF + IK 在 Held-out 上高出约 4.6-5.0 个百分点，且命令生成速度快 1.71 倍。
  - 在 ManiSkill3 中，Full 在 Held-out 上达到 28.6-43.5%，而 Native joints 仅为 3.1-11.6%，验证了方法在不同模拟器中的可迁移性。

### 16. 🔥 [Task Convergent Flow Matching for Generative Robotics] (面向生成式机器人的任务收敛流匹配)

- **中文标题**: 面向生成式机器人的任务收敛流匹配
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种推理时优化框架，通过物理仿真评估和任务级性能漏斗约束，结合 CMA-ES 搜索流匹配的源种子，确保生成式机器人策略在允许合理倒退的同时实现任务收敛。

**1. 整体逻辑**
- **研究任务**: 解决生成式机器人策略（如流匹配/扩散模型）在推理时生成的动作块（action chunks）无法保证任务进度，甚至可能撤销已有进展的问题。
- **研究动机**: 现有的推理时优化方法要么只关注碰撞和运动平滑，要么只关注动作块终点的进度（如 Endpoint-only）。它们忽略了中间过程可能出现的严重倒退，无法提供任务收敛的充分条件，导致连续的动作块可能会停滞或undo之前的操作。
- **本质改动**: 引入“任务级性能漏斗（Performance Funnels）”来约束动作块执行过程中的任务误差，允许合理的中间倒退但强制要求净进展；同时通过优化流匹配的源种子（source seeds）而非直接修改动作来满足这些漏斗条件。
- **技术溯源**: 基于 Flow Matching（流匹配） / RMFM（黎曼流匹配）策略，以及 CMA-ES（协方差矩阵自适应进化策略）优化算法。

**2. 技术拆解**
- **核心方法**: 
  1. **任务级性能漏斗**：定义任务误差的包络线，允许瞬态误差增加（有界倒退），但要求动作块结束时误差必须收缩（净进展）。理论上证明了重复满足该漏斗条件可保证任务误差收敛。
  2. **连续时间验证**：利用区间 Lipschitz 边界，从离散采样的物理仿真 rollout 中验证连续时间内的漏斗满足情况，防止采样点之间出现违规。
  3. **径向分位数带约束的 CMA-ES**：在流匹配的源分布空间内，使用无导数的 CMA-ES 搜索最优种子，并将搜索限制在源分布的径向分位数带（radial quantile bands）内，以保留学到的运动先验。
- **关键细节**: 
  - **输入输出**：输入为观测历史和初始源种子，输出为优化后的动作块（waypoint action chunk）。
  - **模型结构**：框架同时支持欧几里得空间的 OT 流匹配（如 U-Net）和位姿空间的 RMFM（如 DiT）。
  - **规模/超参**：CMA-ES 种群大小设为 20，每次推理时搜索的时间预算为 1.5 秒/chunk。
- **训练/优化目标**: 优化目标是最小化采样残差的平滑最大值（log-sum-exp），即最小化整个时间窗口内任务误差偏离漏斗包络线的最大程度。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：PushT（平面推T型块）和 three-cube stacking（三块积木堆叠），在 robosuite 和 MimicGen（包含 two-nut assembly）中进行。
  - **对比对象（Baseline）**：Nominal execution（无优化的原始策略），以及不同的推理时优化目标（Endpoint-only, $\dot{V} \le 0$, $\Sigma V$, 各种 funnels）和搜索方法（L-BFGS, Best-of-N, CEM, 无约束 CMA-ES）。
- **评价指标**: 
  - 任务成功率（Success rate）。
  - 最终得分的 CVaR_10（最低 10% episode 的平均分，衡量下限）。
  - 最大回撤（Maximum drawdown）及其 CVaR_90（衡量执行过程中的进度损失）。
  - OOD 比例（分布外动作窗口的比例）和 LDJ（平滑度）。
- **主要结果**: 
  - **成功率大幅提升**：PushT 成功率从 31.3% 提升至 88.5%（使用 calibrated global funnel）；Stacking 成功率从 77.0% 提升至 86.0%（使用 Endpoint-only）。
  - **进度保留更好**：在 PushT 上，learned funnel 相比仅约束终点的 Endpoint-only，将平均最大进度损失（drawdown）降低了 19%。
  - **保持运动先验**：使用径向分位数带约束的 CMA-ES，将 OOD 动作窗口比例从 34.1%（无约束 CMA-ES）降至 11.3%，保持在 held-out demonstrations 的合理范围内，同时成功率（86.5%）显著优于 L-BFGS（70.0%）和 Best-of-N（82.5%）。

### 17. 🔥 [InteractVLA: Turning VLAs into Interactive Tools for Agentic Robotic Manipulation] (InteractVLA：将VLA转化为用于智能体机器人操作的交互式工具)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22584` | [点击跳转](https://arxiv.org/abs/2611.22584)

**0. 论文标题**
- **英文标题**: InteractVLA: Turning VLAs into Interactive Tools for Agentic Robotic Manipulation
- **中文标题**: InteractVLA：将VLA转化为用于智能体机器人操作的交互式工具
- **研究机构**: 原文未提及
- **一句话总结**: 提出 InteractVLA 框架，通过前向几何引导和反向动作反馈的双向接口，将预训练的基于流的 VLA 模型从黑盒转化为可被上层智能体精确控制和诊断的交互式工具，大幅提升了复杂机器人操作的成功率与效率。

**1. 整体逻辑**
- **研究任务**: 解决现有视觉-语言-动作（VLA）模型在智能体机器人操作中作为“黑盒”难以被上层智能体有效引导和干预的问题，提升长视野、多阶段及受扰动场景下的操作成功率。
- **研究动机**: 现有 VLA 通常只接受高层语言指令，是不透明的黑盒。当遇到场景扰动或指令失败时，上层智能体无法介入底层控制，只能无效重试或人工接管；而单纯改写语言指令往往会使 VLA 偏离数据分布，导致性能骤降。实际上 VLA 本身具备优秀的空间感知和运动先验，需要一种机制让智能体能显式地引导其执行。
- **本质改动**: 摒弃纯语言调用，设计了一种双向几何接口（Bidirectional geometric interface）：前向通过可微的几何目标引导 VLA 的动作生成，反向将 VLA 生成的动作块和视觉重投影反馈给智能体进行误差诊断和修正。
- **技术溯源**: 基于预训练的基于流的 VLA 模型（文中具体使用 MR-0），结合了 VLM 策略引导（VLM-based policy steering）和视觉几何约束（visual geometric constraints）。

**2. 技术拆解**
- **核心方法**: InteractVLA 测试时（test-time）框架，包含三个核心组件：1) 测试时几何引导（Test-Time Geometric Guidance）；2) 软时间目标对齐（Soft-Time Target Alignment）；3) 动作告知的智能体修正（Action-Informed Agentic Refinement）。
- **关键细节**: 
  - **前向引导（Agent -> VLA）**：智能体指定末端执行器的 6-DoF 目标（位置、姿态、夹爪状态）。通过可微的命令到姿态映射，将目标转化为动作专家的输入梯度，在单次去噪轨迹中引导流速度场。引入“软时间目标对齐”，将到达时间视为潜在索引，通过 log-sum-exp 目标函数在去噪过程中动态分配时间权重，避免固定时间惩罚破坏接近轨迹。同时计算目标兼容性置信度，若目标不兼容则提前终止并交还控制权。
  - **反向反馈（VLA -> Agent）**：将生成的动作块、已执行前缀、剩余动作以及校准的相机重投影暴露给智能体。智能体通过对比 3D 动作提案与 2D 视觉证据，诊断空间误差，决定是修改目标重新生成，还是对现有轨迹进行局部微调。
  - **规模与基座**：VLA 基座为 MR-0，上层智能体使用 GPT-6.1 Sol（兼顾成本）或 GPT-6 Astra（强推理）。
- **训练/优化目标**: 本文是测试时框架，不更新模型权重。优化目标为测试时的引导损失：通过最小化当前去噪步骤下的姿态误差（位置、旋转、夹爪差异）来引导流速度场；软时间对齐使用基于 log-sum-exp 的时间分配损失函数，使位置、姿态和夹爪误差共享时间权重。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真环境使用 LIBERO-Plus、RoboDojo、RoboCasa365；真实世界使用 Dexmal 双臂机器人平台（4个任务）。
  - **对比对象（Baseline）**：独立 VLA（MR-0, OpenVLA-OFT, pi0, RIPT-VLA 等），纯语言 Agent+VLA（HarnessVLA, RV-ICL, PhysicalRSI, WorldScape-R2SI 等），以及纯智能体控制（Agent Only）。
- **评价指标**: 任务成功率（Success rate / Overall %），真实世界中的任务得分（Task score）和执行时间（Execution time），以及智能体 API token 消耗量。
- **主要结果**: 
  - **仿真基准**：结合递归自我改进（RSI），在 LIBERO-Plus 上达到 99.4% 成功率（SOTA），RoboDojo 达到 48.62%（大幅领先 PhysicalRSI 的 31.38%），RoboCasa365 达到 89.4%（超越 HexaShell 1.5 的 85.6%）。
  - **真实世界**：相比纯语言 Agent+VLA，不仅得分大幅提升（如 Move Cube 从 86.7 提升至 97.6），执行时间减少 59%（165.2s 降至 67.5s），API 调用减少 67%（14.4 降至 4.7）。
  - **消融实验**：证明“软时间对齐”比固定步或均匀惩罚效果更好；“动作重投影反馈”比仅靠视觉观察或仅看动作块能更准确地诊断空间误差。

### 18. 🔥 [JointGV: Structure-Aware Correction of Visual World Models with Parallel Graph Dynamics for Long-Horizon Modeling] (JointGV：基于并行图动态的长时域视觉世界模型结构感知校正)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22543` | [点击跳转](https://arxiv.org/abs/2611.22543)

**0. 论文标题**
- **英文标题**: JointGV: Structure-Aware Correction of Visual World Models with Parallel Graph Dynamics for Long-Horizon Modeling
- **中文标题**: JointGV：基于并行图动态的长时域视觉世界模型结构感知校正
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种即插即用的图-视觉校正模块 JointGV，通过并行预测场景图并将其动态变化与视觉状态变化对齐，在不修改原视觉世界模型的前提下，显著降低了长时域递归预测中的结构漂移误差。

**1. 整体逻辑**
- **研究任务**: 长时域视觉世界模型的预测（用于机器人规划与控制），解决多步递归预测中实体位姿和空间关系的累积误差（即结构漂移）。
- **研究动机**: 现有的视觉世界模型在长时域预测时会产生结构漂移（如关节变形、图像模糊）。现有改进方法要么改变原生预测表示，要么在原始隐空间学残差，或者完全替换为以图/物体为中心的世界模型。它们都没解决一个核心问题：如何用一个独立预测的、与视觉状态没有共享元素和特征空间的关系图，去校正现有的视觉状态。
- **本质改动**: 提出“跨粒度动态假设”：虽然图节点和视觉状态特征空间不同，但它们在动作诱导下的“变化量”描述的是同一个物理过程。据此设计了一个即插即用的校正插件，将图的变化和视觉的变化在共享空间对齐，计算有界残差来修正视觉预测，且校正梯度不回传给原视觉模型。
- **技术溯源**: 基于 DINO-WM（空间 token 表示）和 DreamerV3（全局隐状态表示）；使用了 RelTR (Relation Transformer) 提取特征构建场景图；空间对齐使用了 Sinkhorn 最优传输 (OT)。

**2. 技术拆解**
- **核心方法**: JointGV 包含三个部分：1) 任务条件场景图构建（用 RelTR 特征绑定任务角色）；2) 历史感知图动态（用消息传递预测图节点和关系的变化）；3) 图-视觉校正接口（将图的变化和视觉的变化对齐，结合预测的节点位置，计算有界门控残差）。
- **关键细节**: 
  - 针对空间 token（如 DINO-WM）：用 Sinkhorn OT 将视觉 token 变化和图节点变化进行多对少软匹配，得到图运动上下文；再用预测的节点位置计算位置上下文。两者拼接后过 MLP 得到残差。
  - 针对全局向量（如 DreamerV3）：用全局视觉状态变化通过注意力机制池化图节点变化，再计算残差。
  - 规模与超参：图节点维度 64，3 层消息传递，图历史窗口为 4。Sinkhorn 迭代 20 次。
- **训练/优化目标**: 联合损失函数，包括视觉模型原生损失、图观察/动态损失、对齐损失和校正损失。核心机制是**梯度隔离**：在计算对齐和校正损失前，对原始视觉预测使用 stop-gradient (detach)，确保校正模块的梯度不回传给原始视觉编码器，从而保持原模型的预测能力。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：DMC (Cheetah Run, Walker Walk, Finger Turn Hard) 以及真实机器人倒立摆（RM65-B 机械臂）数据集。
  - 对比对象 (Baseline)：DINO-WM, DreamerV3, LeWorldModel，以及视觉残差（Visual-only residual）等对照组。
- **评价指标**: 关节位置误差 (Joint-position error, px)、Token MSE、RGB MSE、SSIM、LPIPS、倒立摆杆角度误差 (pole-angle error)、控制任务的 episode 完成率。
- **主要结果**: 
  - 在 32 步长时域预测中，JointGV 将关节位置误差降低了 11% 到 28%（跨不同模型和任务）。例如 DINO-WM 在 Cheetah Run 上 32 步误差从 1.036 降至 0.852 像素。
  - 在真实机器人倒立摆预测中，DINO-WM 的 32 步杆角度误差从 12.56° 降至 6.69°。
  - 在仿真倒立摆控制中，使用 JointGV 校正 rollout 训练的 actor 在 50 个测试中成功完成 46 个（6秒），而使用原始 rollout 的 actor 成功率为 0。

### 19. 🔥 [FailureGen: Scalable Robot Failure Data Generation with World Models] (FailureGen：基于世界模型的可扩展机器人失败数据生成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22367` | [点击跳转](https://arxiv.org/abs/2611.22367)

**0. 论文标题**
- **英文标题**: FailureGen: Scalable Robot Failure Data Generation with World Models
- **中文标题**: FailureGen：基于世界模型的可扩展机器人失败数据生成
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FailureGen 方法，将真实记录的失败动作轨迹移植到兼容的成功场景中，利用动作条件世界模型推演生成带有时间标注的合成失败视频，从而低成本扩充长尾失败数据，并有效提升了下游视觉失败检测任务的性能。

**1. 整体逻辑**
- **研究任务**: 扩充机器人失败数据集（生成带有时间事件标注的合成失败视频数据）。
- **研究动机**: 真实机器人失败数据难以大规模收集，长尾失败场景在数据集中代表性不足。现有方法（如仿真中的程序化扰动或基于世界模型的盲目生成）难以完全覆盖真实的物理接触和复杂的失败模式。
- **本质改动**: 不依赖仿真器硬凑失败，也不靠世界模型从头生成，而是直接复用真实物理世界中已经发生的失败动作轨迹（donor），将其移植到兼容的成功场景（host）上下文中，通过动作条件世界模型推演出新的失败视频。
- **技术溯源**: 基于 Cosmos 世界模型（具体使用 Cosmos3-Nano 进行生成，Cosmos3-Edge 进行下游检测），以及视觉大语言模型（用于自动化时间标注）。下游评估使用了 Qwen3-VL-2B 和 Qwen3-VL-8B。

**2. 技术拆解**
- **核心方法**: 包含四个阶段：1) 微调动作条件的 Cosmos 世界模型；2) 标注源数据，匹配失败的 donor 片段和成功的 host 片段；3) 将 donor 动作转移到 host 上下文中（支持空间偏移），生成连续视频；4) 对生成视频进行事件标注和质量过滤。
- **关键细节**: 
  - 输入输出：输入为同步的视觉观测和机器人状态（如关节角增量、末端执行器相对位姿、夹爪状态），输出为生成的视频、动作序列及时间事件标签。
  - 模型结构：基于 Cosmos3-Nano，使用特定的域投影层处理不同机器人的动作表示。微调时冻结大部分参数，只更新生成专家（generation expert）及相关投影模块。
  - 规模：工业双臂任务包含 80 个真实 episode（66 个用于训练），最终筛选出 75 个合成失败片段。ViFailback 评估了 3 个操作任务。
  - 关键超参：生成窗口包含 17 个观测帧和 16 个动作 transition（5Hz 采样，时间跨度 3.2 秒）。
- **训练/优化目标**: 世界模型微调采用 rectified-flow 目标，结合前向动力学（给定初始观测和动作生成未来视频）和逆向动力学（给定视频预测动作）的监督。下游检测模型使用标准的二分类/时序检测优化（原文未提及具体 loss 名称，仅说明微调视觉塔和因果二值预测头）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自研工业双臂操作数据集（YAM 机器人处理 SMT 料盘），以及 ViFailback 数据集（包含放入黑盒、放入架子、抽屉操作 3 个任务）。
  - 对比对象（Baseline）：下游任务对比了“无微调（预训练模型直接推理）”和“仅使用真实数据微调（Real-only）”。下游模型包括 Cosmos3-Edge、Qwen3-VL-2B 和 Qwen3-VL-8B。
- **评价指标**: 
  - 工业任务：平均精度（Average Precision）、检测到的失败事件数、干净 episode 中的误报数。
  - ViFailback 任务：Episode 级别的准确率（Accuracy）和失败召回率（Failure recall）。
- **主要结果**: 
  - 工业任务：结合生成数据的模型检测到 33/36 个失败事件（召回率 91.67%），平均精度达到 0.51，且无干净 episode 误报；而仅用真实数据的模型检测到 28/36 个事件，平均精度 0.41。
  - ViFailback 任务：在 6 个模型-任务组合中，5 个取得提升。例如在抽屉任务中，Qwen3-VL-2B 的准确率从 84.4% 提升至 97.0%，失败召回率从 82.5% 提升至 96.7%；在黑盒任务中准确率和召回率均达到 100%。
  - 数据质量：生成数据经过自动化和人工过滤，工业数据剔除 9.8%，ViFailback 剔除 11.2%，保留了约 90% 的高质量可用数据。

### 20. 🔥 [When the World Is the Test Suite: Agentic Intelligence for the Physical World] (当物理世界成为测试集：面向物理世界的智能体智能)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22291` | [点击跳转](https://arxiv.org/abs/2611.22291)

**0. 论文标题**
- **英文标题**: When the World Is the Test Suite: Agentic Intelligence for the Physical World
- **中文标题**: 当物理世界成为测试集：面向物理世界的智能体智能
- **研究机构**: 原文未提及
- **一句话总结**: 本文系统综述了以物理世界为测试集的代码智能体系统，提出了基于“程序角色”与“评估来源”的分析框架，并深入剖析了技能库的维护机制与当前评估实践中缺失的关键指标（如成本、Judge误差、虚实迁移等）。

**1. 整体逻辑**
- **研究任务**: 梳理和评估具身智能/机器人领域中，基于代码的智能体（Coding agents）在物理世界中的执行、验证、经验积累（技能库构建与模型权重蒸馏）及评估基准（Benchmarks）。
- **研究动机**: 现有综述要么只关注纯软件代码生成，要么只关注端到端视觉-语言-动作（VLA）模型，缺乏对“物理世界中的程序”及其“验证机制（Judges）”的系统性对比。同时，获取物理世界中程序行为的可靠证据正成为限制智能体自我改进的瓶颈，且现有评估缺乏对成本、方差、Judge误差等关键指标的严谨报告。
- **本质改动**: 作为一篇综述/视角文章，其核心贡献是构建了一个双轴分析框架（程序相对于执行器的角色 vs. 评估来源），将现有系统从动作代码到生成训练世界进行统一分类，并首次系统性地审视了物理世界中代码智能体的“验证-维护-评估”闭环。
- **技术溯源**: 综述了 ASPIRE, Voyager, Skill2Real, RoboBridge, CaP-X, Code as Policies, Eureka, RoboTwin 2.0 等基于代码的机器人系统；涉及的大模型基座包括 GPT-4, GPT-6, Claude (Opus 4.6/5/5.5, Sonnet 5.5), Qwen (3.5-4B/9B), CodeLlama-Python 7B 等。

**2. 技术拆解**
- **核心方法**: 提出双轴分类框架（程序角色：Action/Orchestration/Objective/World；评估来源：Simulator/Human/VLM/Formal等）。系统拆解了经验积累的两条路径：1) 技能库（Skill Libraries）的获取、验证（6种机制）、维护（防止退化/过时）与跨域迁移；2) 经验蒸馏到模型权重（训练 Action policy 或 Code-writing model）。最后审查了现有 Benchmarks 的评估协议。
- **关键细节**: 
  - **技能库验证机制**：包括成功即存储、模型 Judge、特权状态检查、人类验证、留出集比较、多标准检查。
  - **技能库维护痛点**：库变大可能导致部分任务性能退化，需要严格的接受测试（Acceptance tests）和回归测试，并面临技能过时（Staleness）和淘汰（Retirement）问题。
  - **评估盲区**：指出现有 Benchmarks 很少报告成本（Cost）、方差（Variance）、Judge 可见性（Judge visibility）、Judge 误差（Judge error）以及虚实联系（Simulation-reality link）。
- **训练/优化目标**: 本文为综述，不涉及单一模型的训练损失函数。其分析的核心机制是智能体的“接受测试（Acceptance test）”和“验证（Validation）”机制，即决定哪些程序或技能可以进入共享经验（技能库或模型权重）的过滤规则与统计检验方法（如配对检验、贝叶斯后验等）。

**3. 实验结果**
- **实验设置**: 本文为综述，汇总了所评述系统（如 ASPIRE, RoboBridge, Skill2Real, Embodied First Exam 等）在 LIBERO-PRO, LIBERO-90, RoboDojo, RoboTwin 2.0 等物理世界基准上的实验设置、消融实验和评估协议。
- **评价指标**: 任务成功率（Success rate）、API/美元成本、方差/置信区间、Judge 误差率、技能保留率（Retention rate）等。
- **主要结果**: 
  - **技能库的双刃剑效应**：ASPIRE 在 LIBERO-PRO Long 上，技能库从空到满使整体成功率从 0.047 升至 0.305，但在任务扰动下，特定任务（如放摩卡壶）成功率从 0.68 降至 0.26。
  - **验证机制的必要性**：移除验证步骤会导致成功率大幅下降（如 RoboBridge 下降 13-31 个点，Skill2Real 下降 13-17 个点）。
  - **评估成本高昂**：评估 6 个前沿模型在 1800 个 LIBERO-10 episode 上花费约 99,000 次 API 调用和 4,936 美元；RobotWorld 中 84 个任务花费约 9,913 美元。
  - **Judge 误差问题**：RoboTwin 2.0 的 VLM observer 准确率仅 0.431，将 101 次失败执行中的 61 次误判为成功，凸显了物理世界 Judge 的不可靠性。

### 21. 🔥 [HubEgo-100K: In-the-Wild Egocentric Video of Skilled Work for Robot Learning] (HubEgo-100K：用于机器人学习的野外熟练工作第一人称视频)
- **研究机构**: `Hub Labs (Hub Data, Inc.)`
- **Arxiv ID**: `2611.21938` | [点击跳转](https://arxiv.org/abs/2611.21938)

**0. 论文标题**
- **英文标题**: HubEgo-100K: In-the-Wild Egocentric Video of Skilled Work for Robot Learning
- **中文标题**: HubEgo-100K：用于机器人学习的野外熟练工作第一人称视频
- **研究机构**: Hub Labs (Hub Data, Inc.)
- **一句话总结**: 发布了一个包含1万小时、极具环境和任务多样性的野外熟练手工工作第一人称视频数据集 HubEgo-100K，旨在通过低成本的人类视频数据提升机器人操作策略的泛化能力。

**1. 整体逻辑**
- **研究任务**: 构建大规模、高多样性的第一人称人类视频数据集，为机器人学习（如视觉表征预训练、VLA模型预训练、策略共训练）提供基础数据。
- **研究动机**: 机器人模仿学习策略在训练环境和物体之外泛化能力差，且研究表明泛化能力随训练数据的环境/物体多样性呈幂律增长，而非单纯依赖数据量。但机器人数据采集成本极高。现有的第一人称数据集多局限于日常生活、厨房或实验室脚本任务，缺乏真实工作场景中涉及复杂工具、材料和多步骤程序的“熟练手工工作”（如砌砖、接线、微焊等）数据。
- **本质改动**: 不同于以往聚焦日常生活或实验室的设定，该工作通过众包在真实工作场所收集非脚本的“熟练手工工作”第一人称视频，并在贡献者、环境、任务类别等多个维度上重点保证数据多样性，同时同步记录IMU传感器数据并生成动作与语言标注。
- **技术溯源**: 数据集格式基于 LeRobot v3 和 MCAP 传感器流；其设计目标和下游应用背景紧密围绕 OpenVLA、$\pi_0$、$\pi_{0.5}$、GR00T N1 等机器人基础模型，以及 DROID、Ego4D 等现有数据集的局限性展开。

**2. 技术拆解**
- **核心方法**: 设计了一套包含9个阶段的数据收集与处理流水线，利用视觉语言模型（VLM）进行时间分割、手部可见性过滤、隐私检测和自动标注，将原始众包视频转化为高质量的机器人学习数据。
- **关键细节**: 
  - **规模与采集**：v1.0 包含 10,124 小时 1080p 视频，72,754 个 episode。由 12,227 个贡献者使用头戴式手机（56种型号，多为超广角镜头）录制，同时记录手机原生 IMU 数据（加速度计、陀螺仪等，约100Hz）。
  - **标注体系**：机器生成每个 episode 的动作家族（35类）、技能组（18类）、难度、场景类型、简短描述和步骤级指令。
  - **数据分布**：涵盖 30 个工作大类，56 个任务类型，15,548 个真实环境。
- **训练/优化目标**: 本文为数据集工作，无模型训练优化目标。核心机制在于其数据清洗与标注流水线：使用 VLM 进行密集时间分割（仅保留手部执行任务的片段）、手部可见性门控（丢弃手部不在画面内的帧）、隐私检测（裁剪人脸/儿童/敏感文本），以及跨任务类型的时长重平衡（防止单一任务主导）。

**3. 实验结果**
- **实验设置**: 本文是数据集工作，无传统模型对比实验。实验设置主要为对 v1.0 数据集本身进行多维度的统计分析（贡献者、环境、任务、动作、语言、难度、IMU数据等），并与 Ego4D、Ego-Exo4D、DROID 等现有数据集在多样性指标上进行横向对比。
- **评价指标**: 数据多样性指标（如有效数量 $e^H$、均匀度 $J$、逆辛普森指数 $D^{-1}$）、手部可见率、任务内（on-task）比例、词汇量长尾分布等。
- **主要结果**: 
  - **多样性远超同类数据集**：拥有 12,227 个贡献者（无单一贡献者超过 0.22% 时长）和 15,548 个环境，而对比数据集中贡献者最多为两千余人，环境最多为数百个。随机打乱数据顺序后，最后 10% 的数据仍能贡献 356 个新贡献者和大量新词汇，证明长尾效应显著。
  - **数据质量高**：经模型估计，至少一只手可见的帧占 94.7%，双手可见占 76.3%，任务内（on-task）比例高达 96.9%，83% 的时长集中在手部可见率 90% 以上的 episode 中。
  - **任务与动作覆盖广**：34.5% 的时长被标记为“困难（hard）”，动作家族在不同工作类别间高度复用（如“组装与安装”出现在 20 个类别中），验证了数据在技能学习上的泛化潜力。

### 22. 🔥 [VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models] (VSpark：面向自回归视觉-语言-动作模型的推测解码)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22666` | [点击跳转](https://arxiv.org/abs/2611.22666)

**0. 论文标题**
- **英文标题**: VSpark: Speculative Decoding for Autoregressive Vision-Language-Action Models
- **中文标题**: VSpark：面向自回归视觉-语言-动作模型的推测解码
- **研究机构**: 原文未提及
- **一句话总结**: 提出 VSpark 框架，通过带噪声的 rollout 训练、隐藏特征对齐和续写复用三个设计，在不放松严格验证的前提下，显著提升了自回归 VLA 模型的推测解码加速比。

**1. 整体逻辑**
- **研究任务**: 加速自回归视觉-语言-动作模型（VLAs）的推理速度，解决逐个生成动作 token 导致的机器人控制频率受限问题。
- **研究动机**: 现有的推测解码在 VLA 上加速效果有限。因为压缩动作 tokenizer（如 FAST、ActionCodec）中，许多不同的 token 编码了几乎相同的物理动作，导致 draft 模型生成的近似正确 token 在严格验证时被拒绝。而现有的放宽验证规则（如基于 token embedding 距离）在压缩 tokenizer 下极不可靠，会大幅降低任务成功率（例如加速比提升时成功率从 91.7% 暴跌至 71.4%）。
- **本质改动**: 保持严格的无损验证（exact verification）不变，转而在 draft 侧挖掘动作相似性。通过改进 draft 的训练数据分布、引入连续特征监督，以及复用 target 在拒绝分支上的计算结果，来提高 draft token 的接受率。
- **技术溯源**: 基于并行推测解码器 DSpark 构建；目标加速模型涵盖 $\pi_0$-FAST、StarVLA-FAST、ActionCodec 和 G0.5 等自回归 VLA。

**2. 技术拆解**
- **核心方法**: VSpark 框架，包含三个核心设计：1) 带校准动作噪声的 Rollout 数据收集；2) 特征对齐（Feature Alignment）训练；3) 续写复用（Continuation Reuse）推理机制。
- **关键细节**: 
  - **噪声 Rollout**：在仿真中用 target 模型收集数据，但执行动作时注入校准后的高斯噪声（噪声协方差由 draft 和 target 动作差异计算得出），让 draft 在更广泛的机器人状态下学习。
  - **特征对齐**：将 target 的多个隐藏层特征拼接送入 draft 作为条件输入，并使用 SmoothL1 loss 让 draft 回归 target 输出头前的隐藏特征，提供 token label 无法提供的连续动作信号。
  - **续写复用**：在树状验证时，target 会计算被拒绝分支后续的预测。VSpark 提取这些预测，在下一轮构建 draft 树时，将这些 token 的得分提升至当前父节点下的最高 draft 得分，直接融入候选树，无需 target 额外计算。
  - **模型规模**：Draft 模型均为 1 层 Transformer（参数量 119M-205M），Target 模型在 2.2B-3B 之间。
- **训练/优化目标**: Draft 的训练损失为交叉熵损失（CE）和特征回归损失（SmoothL1）的加权和。推理时采用贪婪解码和严格的树状精确验证。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：LIBERO（包含 Goal, Spatial, Object, Long 四个子集）、LIBERO-Plus、LIBERO-Pro 以及 SimplerEnv（WidowX 机器人）。
  - **对比对象（Baseline）**：EAGLE-3, P-EAGLE, DFlash, DFlash2, DSpark。
  - **目标模型**：$\pi_0$-FAST, StarVLA-FAST, ActionCodec, G0.5。
- **评价指标**: 接受长度（Acceptance length $\tau$，每次验证周期平均接受的 token 数）和 加速比（Speedup，自回归解码时间除以推测解码时间）。
- **主要结果**: 
  - 在四个 VLA 和多个操作基准上，VSpark 实现了 1.28× 到 2.10× 的加速比，同时保持了 100% 的无损解码（在 FP32 下与自回归解码结果完全一致）。
  - 全面优于所有 baseline。例如在 $\pi_0$-FAST 上，相比基础版 DSpark，平均接受长度从 3.16 提升到 3.94，加速比从 1.60× 提升到 1.93×；在 ActionCodec 上，加速比从 1.93× 提升到 2.10×。
  - 消融实验证明三个组件互补：特征对齐在 $\pi_0$-FAST 上贡献最大，续写复用在 ActionCodec 上贡献最大，噪声 rollout 提供稳定增益。
  - 分析证实，基于 token embedding 距离的放宽验证会导致成功率断崖式下跌，证明了 VSpark 坚持严格验证的必要性；同时验证了 target 在被拒绝分支上的预测有约 45%-55% 的概率与修正后的预测一致，证明了续写复用的有效性。

### 23. 🔥 [Distilling World Action Models for Efficient Bimanual Manipulation via Anchored Path Matching] (通过锚点路径匹配蒸馏世界动作模型以实现高效双臂操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22592` | [点击跳转](https://arxiv.org/abs/2611.22592)

**0. 论文标题**
- **英文标题**: Distilling World Action Models for Efficient Bimanual Manipulation via Anchored Path Matching
- **中文标题**: 通过锚点路径匹配蒸馏世界动作模型以实现高效双臂操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出锚点路径匹配（APM）方法，在学生模型自身到达的中间状态上同时对齐教师模型的端点和局部转移目标，并通过梯度投影解决多目标冲突，实现单模型支持多步数的高效世界动作模型推理。

**1. 整体逻辑**
- **研究任务**: 加速世界动作模型（WAMs，即联合生成未来视频和机器人动作的模型）的推理速度，通过少步蒸馏减少扩散/流匹配模型迭代去噪的评估次数。
- **研究动机**: 现有的少步蒸馏方法在更新学生模型时，由于单步跨度变大，容易偏离教师模型的真实轨迹。此外，现有的局部转移监督和端点监督往往作用在不同的状态分布上；如果强行把它们对齐到同一状态，两者的优化梯度会发生冲突，导致模型在优化时顾此失彼。
- **本质改动**: 把端点监督和局部转移监督统一到学生模型自己跑出来的同一个中间状态上，并设计了一种“锚点优先”的梯度投影机制，在梯度冲突时强行保留端点（最终输出）的梯度方向，舍弃局部梯度中冲突的部分。
- **技术溯源**: 基于 LingBot-VA（基座世界动作模型）和 AnyFlow（流匹配蒸馏方法）。

**2. 技术拆解**
- **核心方法**: 锚点路径匹配（APM）。采用两阶段训练：第一阶段用 AnyFlow 做基础蒸馏；第二阶段冻结主干，训练模态路由的 LoRA 适配器。在第二阶段，从学生模型生成的轨迹中采样一个中间状态，让教师模型从这个状态继续走到零噪声，把教师走到的终点作为“锚点（端点目标）”，把教师走的第一步作为“局部转移目标”，两者共享同一个起始状态。
- **关键细节**: 
  - 输入输出：输入是当前观测、语言指令和机器人状态；输出是联合的视频和动作潜在表示。
  - 模型结构：冻结 LingBot-VA 主干，加入模态路由的 LoRA 适配器（视频和动作分别路由，FFN rank 为 64，时间 rank 为 128）。
  - 规模与超参：教师积分使用 8 步。训练时均匀采样 1、2、4 步的修正预算，推理时一个 checkpoint 直接支持 1、2、4 步生成，无需重新训练或调用教师模型。
- **训练/优化目标**: 
  - 基础损失为均方误差（MSE）。
  - 核心优化机制是“锚点优先更新（Anchor-priority correction）”：分别计算端点梯度和局部梯度，如果两者内积小于 0（即方向冲突），就把局部梯度在端点梯度方向上的负投影减去。这样既保证了端点梯度不被破坏，又保留了局部梯度中不冲突的有益成分。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：RoboTwin 2.0（包含 Clean 和 Random 域随机化设置，只用 Clean 数据训练，直接在 Random 上测泛化）。
  - 真机平台：Astribot S1（双臂 7 自由度机器人）。
  - 对比基线（Baseline）：LingBot-VA（原模型 1/2/4 步）、Flash-WAM、Continued（同等参数量和训练步数下，继续用基础蒸馏目标训练的学生模型）。
- **评价指标**: 闭环操作成功率（Success rate）、视频预测质量（PSNR, SSIM, LPIPS）、控制周期延迟（Latency）。
- **主要结果**: 
  - 仿真表现：1 步生成时，APM 平均成功率 80.9%，比 Continued 高 1.7 个百分点（其中 Clean 高 2.0%，Random 高 1.4%）。4 步时达到 91.4%（高 1.6%）。单步视频 PSNR 从 30.169 dB 提升至 32.317 dB，SSIM 和 LPIPS 也有相应提升。
  - 真机表现：在 PenHolder 和 FoldTowel 任务上，1 步 APM 成功率（62.5% 和 75.0%）远超 1 步粗粒度 Teacher（29.2% 和 25.0%）。控制延迟从 8 步 Teacher 的 4323.6 ms 降至 203.1 ms，实现 21.3 倍加速。

### 24. 🔥 [CoBoVLA: Decoupling Language from Action with Discrete Codes for Robust and Interpretable Robot Manipulation] (CoBoVLA：通过离散代码将语言与动作解耦，实现鲁棒且可解释的机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22395` | [点击跳转](https://arxiv.org/abs/2611.22395)

**0. 论文标题**
- **英文标题**: CoBoVLA: Decoupling Language from Action with Discrete Codes for Robust and Interpretable Robot Manipulation
- **中文标题**: CoBoVLA：通过离散代码将语言与动作解耦，实现鲁棒且可解释的机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出CoBoVLA，通过离散代码本将语言理解、规划和控制彻底解耦，在保持模型轻量（250M）和实时推理的同时，大幅提升了对指令改写的鲁棒性，并实现了失败原因的精准定位。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的指令遵循与动作生成。
- **研究动机**: 现有VLA模型对指令改写（paraphrasing）极度敏感，性能断崖式下跌；语言理解和动作控制联合学习导致失败时无法归因（是听不懂还是做错了）；此外，大语言模型在每个控制步都参与推理，难以在资源受限的机器人端侧硬件上实现实时控制。
- **本质改动**: 抛弃端到端联合学习，将语言理解、规划和控制解耦为三个独立阶段，阶段间仅通过可学习的离散代码（Discrete Codes）进行通信，语言指令只在第一步编码一次，后续控制模块完全不看文本。
- **技术溯源**: 基于 SmolVLA（视觉编码器SigLIP、Actor的Flow-matching架构）、bge（文本编码器）、VQ-VAE与残差向量量化（动作代码本）、MDL（最小描述长度，用于动作轨迹分割）。

**2. 技术拆解**
- **核心方法**: 三阶段流水线架构。Stage 1（文本编码器）将指令映射为离散的步骤代码（step codes）；Planner（视觉规划器）结合步骤代码和视觉/状态输入，预测动作代码序列（action codes）；Actor（执行器）将动作代码转换为电机指令，且全程不接收语言输入。
- **关键细节**: 
  - **模型规模**：总计250M参数（Stage 1: 38.4M, 共享SigLIP: 86.4M, Planner: 26.1M, Actor: 99.4M）。
  - **动作代码（Action codes）**：使用MDL原则对演示轨迹进行变长分割，通过带残差向量量化的VQ-VAE学习两级代码本（32×32），第一级覆盖粗粒度计划，第二级覆盖精细修正。
  - **步骤代码（Step codes）**：使用bge模型，通过同义改写对（paraphrase pairs）训练一个共享的余弦代码本（32个条目，6个slot），强制同义改写映射到相同代码。
  - **推理机制**：Planner和Actor每5个控制步调用一次，每次生成包含3个动作代码段的序列，结合时间集成（temporal ensembling）输出动作。
- **训练/优化目标**: 
  - **Stage 1**：交换损失（互相预测代码）、承诺损失、批熵正则化（防代码本坍塌）、槽位重叠惩罚。
  - **Planner**：交叉熵损失（行为克隆），结合DAgger进行分布外状态纠正；二步任务的完成概率用二元交叉熵微调。
  - **Actor**：Flow-matching损失，加入辅助损失（用夹爪未来路径监督代码槽对图像的注意力），混合使用真实代码和Planner预测代码进行训练以容忍规划误差。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Goal（标准指令），LIBERO-Para（4092个改写指令），以及自定义的160个自由形式两步指令（无两步演示数据）。
  - **Baseline**：SmolVLA (0.6B), SmolVLA + paraphrase LoRA，以及文献中的 ParaVLA, OpenVLA-OFT, TurboVLA, VLA-Adapter 等。
  - **测试环境**：MuJoCo仿真器，NVIDIA RTX 4050 笔记本 GPU。
- **评价指标**: 任务成功率（Success rate），PRIDE分数（考虑改写距离的加权成功率），推理延迟（ms/step），显存占用。
- **主要结果**: 
  - **鲁棒性与成功率**：在LIBERO-Goal上，CoBoVLA (250M) 成功率91.4%，优于SmolVLA (82.8%)。在LIBERO-Para上，CoBoVLA达到81.1%（SmolVLA仅8%，SmolVLA+LoRA为36.5%），且成功率下降幅度最小（仅10.3%）。
  - **两步任务泛化**：在无两步演示的情况下，CoBoVLA完成48.8%的两步任务，而SmolVLA为0%。
  - **失败归因分析**：当Stage 1输出正确代码时，成功率高达91.0%；输出错误时降至27.2%。证明剩余的改写失败主要源于语言理解错误，而非规划或执行。
  - **效率表现**：在RTX 4050上，单次推理调用74ms，折合每控制步17ms，满足20Hz实时控制需求，显存峰值仅1.0GB。整个流水线训练总耗时约8.5 GPU小时。

### 25. 🔥 [Perception into Imagination: Executable Memory for World Models] (从感知到想象：世界模型的可执行记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.22294` | [点击跳转](https://arxiv.org/abs/2611.22294)

> **领域与类型**：强化学习 / 具身智能（Physical AI） / 方法创新与系统工程。

**0. 论文标题**
- **英文标题**: Perception into Imagination: Executable Memory for World Models
- **中文标题**: 从感知到想象：世界模型的可执行记忆
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出“可执行感知记忆（EPM）”，在世界模型的想象阶段让显式感知状态与神经隐状态并行演化，并将其直接接入奖励预测和Actor-Critic学习，显著提升了部分可观测环境下的机器人控制性能。

**1. 整体逻辑**
- **研究任务**: 解决部分可观测环境下的物理智能体（如机器人）控制问题，特别是当智能体失去对目标（视觉地标或触觉接触）的观测后，如何利用记忆中的事实及其随动作变化的推论来进行决策和学习。
- **研究动机**: 现有世界模型（如Dreamer系列）虽然能通过隐状态或空间记忆编码历史，但在“想象（imagination）”轨迹中，维持的记忆事实如何参与学习信号（奖励、价值）的构建仍不清晰。随着智能体动作，记忆事实与智能体的相对关系会改变，现有方法往往只把静态记忆喂给策略，没有让记忆的动态演化直接指导奖励预测和想象轨迹的监督。
- **本质改动**: 在世界模型的想象阶段引入“可执行感知记忆（EPM）”，让显式感知状态（如目标相对位姿）与神经隐状态并行推进，并将这个“演化中的显式状态读数”直接接入奖励头和价值头，同时设计转移对齐和开环监督来专门训练奖励头。
- **技术溯源**: 基于 DreamerV3 世界模型框架，结合了视觉里程计（visual odometry）和地标检测等感知模块。对比基线包括 DreamerV3 和 R2I。

**2. 技术拆解**
- **核心方法**: 
  1. **显式状态维护与联合想象**：真实交互时通过感知模块写入显式状态（如目标方位、距离）；想象阶段，利用神经网络预测的运动学（odometry）驱动显式状态与隐状态并行更新。
  2. **学习信号接入**：将演化后的显式状态读数（read-out）同时输入给奖励头、价值头和Actor-Critic网络。
  3. **转移对齐与开环监督**：在Replay中，用前一步记忆推进得到的读数（而非新观测更新后的读数）来对齐奖励；在想象轨迹上，用开环rollout的真实奖励来监督奖励头。
- **关键细节**: 
  - 显式状态包含目标标志位、相对方位（sin/cos）、对数距离和对数年龄等。
  - 模型规模：12M参数配置，16个并行环境，2M transition replay capacity。
  - 关键超参：想象horizon=15，return horizon=333，开环监督步长H=15。运动预测使用stop-gradient。
- **训练/优化目标**: 
  - 标准的Dreamer actor-critic和表征学习损失。
  - **后验奖励损失（Posterior reward loss）**：使用转移对齐的显式读数与真实奖励计算。
  - **开环奖励损失（Open-loop reward loss $\mathcal{L}_{OL}$）**：在replay anchor处沿记录动作开环rollout，用真实奖励监督奖励头，通过stop-gradient隔离，仅优化奖励预测头。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：主实验使用 Memory Maze (9×9, 13×13) 和 MiniWorld (9×9)。辅助验证使用 Concentration（符号规则记忆）、Tactile Gym 2.0（触觉恢复）和 Real Tactile MNIST（真实触觉帧）。
  - **对比对象（Baseline）**：外部基线 DreamerV3、R2I；内部消融基线包括仅观测输入（Observation+OL）、保持静态读数（Held+OL, Held+R+OL）、仅策略/价值接入演化读数（Evolved, Evolved+OL）以及完整方法（EPM）。
- **评价指标**: 平均回合奖励（Mean return）、净奖励预期（Net reward anticipation，衡量对不可见目标到达的预测能力）、触觉预测误差等。
- **主要结果**: 
  - **控制性能提升**：在 Memory Maze 13×13 中，EPM 在 1M 交互时达到 30.37 return，比仅接入策略/价值的 Evolved (23.37) 提升 7.00，比仅观测输入的 Observation+OL (14.18) 提升 16.19。在 9×9 和 MiniWorld 中也有显著提升。
  - **外部对比**：EPM (30.37) 显著优于原生 DreamerV3 (1M时 2.90) 和原生 R2I (3M时 6.74)。
  - **消融结论**：奖励头接入演化读数（Reward access）和读数随动作动态演化（Action-dependent evolution）是性能提升的核心来源；静态保持读数反而会降低性能。
  - **机制验证**：探针实验表明，EPM 显著增强了对记忆中不可见目标到达的奖励预期，缩小了与可见目标的预期差距。辅助任务验证了该框架在符号规则推演、触觉丢失后恢复及真实触觉内容压缩存储上的通用性。

### 26. 🔥 [ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters] (ScaleVLA：将视觉-语言-动作模型扩展至5520亿参数)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.21607` | [点击跳转](https://arxiv.org/abs/2611.21607)

**0. 论文标题**
- **英文标题**: ScaleVLA: Scaling Vision-Language-Action Models to 552 Billion Parameters
- **中文标题**: ScaleVLA：将视觉-语言-动作模型扩展至5520亿参数
- **研究机构**: 原文未提及
- **一句话总结**: 本文是一篇方法创新与系统工程工作，提出ScaleVLA，将VLA的VLM骨干扩展至552B参数（基于DeepSeek-V4.1-Flash）并连接动作DiT，证明了前沿规模预训练表示能大幅提升机器人策略的样本效率、泛化性和精细操作能力，且通过稀疏MoE和特征复用将推理延迟控制在亚秒级。

**1. 整体逻辑**
- **研究任务**: 构建基于大规模视觉-语言模型（VLM）的机器人视觉-语言-动作（VLA）基础模型，实现高效、泛化且精细的连续机器人控制。
- **研究动机**: 现有VLA策略多依赖小参数VLM骨干（如2B），未能充分利用前沿VLM在大规模预训练中积累的丰富视觉、空间和推理知识；而让大模型在控制每一步进行自回归文本推理又会导致极高的延迟。
- **本质改动**: 放弃让VLM自回归生成动作或文本推理，直接将552B参数的冻结VLM作为特征提取器，将其多模态隐状态输入到从头训练的动作扩散Transformer（DiT）中，通过流匹配生成连续动作块。
- **技术溯源**: 基于 DeepSeek-V4.1-Flash (552B MoE VLM)、GR00T N1.7 (动作DiT架构)、Flow Matching (流匹配算法)。

**2. 技术拆解**
- **核心方法**: 
  1. 特征提取：冻结552B VLM骨干，截断其因果编码器（causal encoder）的输出作为多模态token特征，不运行解码器，避免自回归开销。
  2. 动作生成：设计可训练的动作头（Action Head），通过特征适配器对齐维度后，利用32层的动作DiT（交替自注意力和交叉注意力）结合机器人状态，通过流匹配（Flow Matching）预测连续动作块的速度场。
- **关键细节**: 
  - VLM骨干：DeepSeek-V4.1-Flash-1017，552B参数，MoE架构，输出5120维特征。
  - 动作头：特征适配器映射至2048维并经4层自注意力；动作DiT为32层；推理时通过4步流匹配积分生成动作。
  - 动作块配置：LIBERO预测16步（执行8步后重规划），DexJoCo预测30步（异步生成与执行）。
  - 训练策略：VLM特征预计算并缓存，训练时仅更新动作头参数。
- **训练/优化目标**: 
  - 损失函数：流匹配损失（Flow Matching Loss），即最小化预测速度场与真实速度（真实动作减去高斯噪声）在有效维度上的均方误差。
  - 优化目标：仅优化动作头（Action Head）参数，VLM骨干保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集/Benchmark：LIBERO（桌面操作）, LIBERO-PRO（环境/物体扰动泛化）, RoboCasa（厨房OOD场景）, DexJoCo（双臂灵巧操作），以及真实机器人双臂插充电器任务（Plug In Charger）。
  - 对比对象（Baseline）：不同参数规模的VLM骨干（Qwen3-VL-2B/32B, Cosmos-Reason2-2B/8B/32B），真实机器人实验对比 $\pi_{0.5}$ + Action Head。
- **评价指标**: 
  - 仿真：任务成功率（Success Rate）。
  - 真实机器人：任务成功率、插入时间、完成时间、动作块推理延迟（Latency）。
- **主要结果**: 
  - 样本效率：在LIBERO-Goal中，ScaleVLA仅用10个demo即达87.8%成功率，超过2B骨干用50个demo的85.6%。
  - 泛化能力：在LIBERO-PRO扰动下，ScaleVLA平均成功率达45.1%，远超小骨干最高31.3%；在RoboCasa OOD场景（Gen-100）中达54.9%（小骨干最高45.6%）。
  - 精细操作：真实机器人插充电器任务中，ScaleVLA域内10次成功9次（2B为4次），插入时间从81.2s（$\pi_{0.5}$）缩短至58.1s，优势集中在接触敏感的对齐和插入阶段。
  - 推理延迟：得益于MoE架构和每动作块仅推理一次VLM，ScaleVLA在4张H200上的中位推理延迟为216ms/块，真实机器人上为384ms/块，实现亚秒级控制。

### 27. 🔥 [ThinkWAM: Rethinking Latent Futures for Action Refinement] (ThinkWAM：为动作优化重新思考潜在未来状态)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.21258` | [点击跳转](https://arxiv.org/abs/2611.21258)

**0. 论文标题**
- **英文标题**: ThinkWAM: Rethinking Latent Futures for Action Refinement
- **中文标题**: ThinkWAM：为动作优化重新思考潜在未来状态
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种带“提议-反思-优化”闭环的潜空间世界-动作模型，让模型在生成初始动作后，用该动作去修正未来的潜在状态，再据此生成最终动作，在多个机器人操作基准上实现了高成功率和低延迟。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的视觉-语言-动作（VLA）策略学习，具体是构建世界-动作模型（WAM）来指导连续动作块的生成。
- **研究动机**: 现有的 WAM 在生成初始动作块时，对未来的预测并没有以这个初始动作为条件。这意味着无论初始动作提得好不好，预测的未来状态都是一样的，无法提供针对该动作的反馈信号来在执前修正动作。
- **本质改动**: 在执前引入双向反馈闭环：先用策略生成一个初始动作提议，然后用这个提议去修正多时间尺度的未来潜在特征，最后把修正后的特征喂给同一个动作头进行第二次推理，输出最终动作。
- **技术溯源**: 基于冻结的 V-JEPA 2.1 (ViT-L) 作为视觉编码器和未来目标定义，Qwen2.5-0.5B 作为语言骨干，以及基于 Flow Matching 的 Diffusion-Transformer (ActionDiT) 作为动作头。

**2. 技术拆解**
- **核心方法**: 提出 ThinkWAM 架构，核心是“提议-反思-优化”（proposal–rethink–refine）循环。配合受预测编码启发的“可供性引导的观察-动作记忆”（affordance-guided memory）和“近细远粗的多时间尺度预测”（near-fine, far-coarse multi-horizon prediction）。
- **关键细节**: 
  - **记忆与预测**：构建包含当前视觉和近期动作的记忆。用可供性（affordance）解码器预测接触概率，加权后残差更新记忆。未来预测在 V-JEPA 潜空间进行，对近未来分配更多 token（如288），远未来分配更少 token（如72）。
  - **提议 (Proposal)**：第一次 ActionDiT 前向传播，结合语言特征和引导记忆，生成初始动作块。
  - **反思 (Rethink)**：将初始动作块和当前视觉 token 输入残差预测器，预测多尺度未来特征的修正量，加到基础未来特征上得到修正后的特征。
  - **优化 (Refine)**：将修正后的未来特征拼接到上下文中，进行第二次 ActionDiT 前向传播（权重共享），生成最终动作块。
  - 模型总参数量约 1.5B。
- **训练/优化目标**: 端到端训练。损失函数包括：两次动作生成的 Flow Matching 损失、多尺度未来特征的 JEPA 余弦距离损失、未来特征修正的 SmoothL1 损失（以专家未来为锚点），以及可供性预测的 BCE+Dice 损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO, LIBERO-Plus, RoboTwin 2.0, RoboCasa24，以及真实机器人 Galaxea A1Z（包含双目标、颜色干扰、紫光等 OOD 场景）。
  - Baseline：$\pi_{0.5}$, FastWAM, ImageWAM, ForeWAM, JEPA-WAM, V-JEPA Policy, Diffusion Policy 等主流 VLA/WAM 模型。
- **评价指标**: 任务成功率 (%)，以及每个动作块的平均推理延迟 (ms)。
- **主要结果**: 
  - 仿真表现：在 LIBERO 达到 98.70%，LIBERO-Plus (无 OOD 微调) 达到 84.76%，RoboTwin 2.0 平均 75.8% (Random 场景达 65.85%)，RoboCasa24 达到 65.17%，均取得 SOTA 或极具竞争力的结果。
  - 真实世界：在 3 个 OOD 条件下平均成功率 64.4%，显著优于 $\pi_{0.5}$ (56.7%) 和 FastWAM (37.8%)。
  - 效率：虽然有两轮动作推理，但得益于潜空间计算和较少的积分步数，单块推理延迟在 LIBERO 上为 153.48 ms，RoboTwin 上为 164.61 ms，真实世界为 101.2 ms，比多数对比方法（如 FastWAM, $\pi_{0.5}$）更快。
  - 消融实验证明“反思”（潜特征修正）和“可供性引导”带来了互补的性能提升，且诊断表明修正后的未来表征确实改变了动作轨迹并提升了最终动作质量。

### 28. 🔥 [WinDEX: Metric 3D Hand Motion Reconstruction in the Wild for Dexterous Teleoperation and Policy Learning] (WinDEX：面向灵巧遥操作与策略学习的野外度量3D手部运动重建)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.21143` | [点击跳转](https://arxiv.org/abs/2611.21143)

**0. 论文标题**
- **英文标题**: WinDEX: Metric 3D Hand Motion Reconstruction in the Wild for Dexterous Teleoperation and Policy Learning
- **中文标题**: WinDEX：面向灵巧遥操作与策略学习的野外度量3D手部运动重建
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套从低成本双目鱼眼+IMU硬件采集、几何时序优化标注到端到端网络重建的完整系统，实现了野外场景下度量尺度且世界坐标系下的3D手部运动高精度重建，并直接赋能机器人强化学习策略训练与实时灵巧遥操作。

**1. 整体逻辑**
- **研究任务**: 从第一人称（egocentric）双目鱼眼视频和IMU数据中，恢复度量尺度（metric-scale）且在世界坐标系（world-frame）下的3D手部运动（包含手指关节和手腕轨迹），以支持机器人策略学习和实时遥操作。
- **研究动机**: 现有的野外手部数据采集和重建方法存在局限：单目相机缺乏深度和绝对尺度；光学动捕受限于实验室环境；现有的单目/视频手部估计器（如HaMeR, WiLoR）难以处理头戴式设备的短基线、鱼眼畸变、相机与手部耦合运动及遮挡，且难以直接输出世界坐标系下的度量轨迹。
- **本质改动**: 将“低成本双目鱼眼+IMU硬件采集”、“基于几何与时序优化的度量标注（结合VIO SLAM）”与“原生支持鱼眼输入的端到端重建网络”深度耦合，并通过“数据-模型飞轮”迭代扩充训练集，最终蒸馏出满足离线学习和实时控制不同延迟需求的推理模型。
- **技术溯源**: 基于MANO手部参数化模型；特征提取依赖DINO/DINOv3和VGGT-Omega；相机位姿估计使用cuVSLAM（视觉惯性SLAM）；2D关键点检测使用YOLO11-pose、ViTPose和Sapiens2；优化初始化使用WiLoR和DPoser-X（姿态先验）。

**2. 技术拆解**
- **核心方法**: 
  1) 几何-时序优化标注：利用人工筛选的2D关键点，结合双目几何、手部先验和时序平滑约束拟合MANO参数，通过重投影误差过滤生成3D伪标签，最后结合VIO SLAM的相机位姿将手部运动转换到世界坐标系。
  2) WinDEX-Net：一个端到端的鱼眼原生网络，融合双目校准几何、局部手部裁剪细节和里程计条件化的时序特征，无需外部检测器即可完成定位与重建，并通过迭代裁剪精炼提升小目标和遮挡下的精度。
  3) 数据-模型飞轮：用WinDEX-Net预测初始化未标注数据，经几何优化和重投影误差过滤后扩充训练集。
  4) 模型蒸馏与部署：将WinDEX-Net蒸馏为双向时序的WinDEX-Window（用于离线高精度重建）和因果流式的WinDEX-Stream（用于实时低延迟控制）。
- **关键细节**: 
  - 硬件：CyberCap双目鱼眼相机（60.7mm基线，1920x1200@30fps）+ 300Hz IMU。
  - 数据集：WinDEX-Hand，包含1000小时的野外训练伪标签，20小时人工标注的野外2D测试集，以及20小时独立光学动捕的3D测试集。
  - 网络结构：WinDEX-Net使用VGGT-Omega深度分支和DINO特征；WinDEX-Window (116M参数) 使用DINOv3 ViT-S/16；WinDEX-Stream (8.92M参数) 使用MobileNetV3-Large和因果GRU。
- **训练/优化目标**: 
  - 优化标注阶段：加权能量函数，包含2D重投影误差（Geman-McClure核）、立体手腕深度锚点、姿态先验、形状正则化和时序二阶差分平滑。
  - 网络训练阶段：联合损失函数，包含3D度量监督、2D重投影/关键点监督、参数（姿态/形状）正则化、立体一致性以及时序平滑损失。
  - 蒸馏阶段：WinDEX-Window使用中间特征匹配（余弦相似度）加端到端微调；WinDEX-Stream使用特征匹配、绝对手腕位置、相对关节误差和手腕速度的L1/Smooth-L1损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：WinDEX-Hand（包含1000小时训练集，20小时人工2D测试集，20小时光学动捕3D测试集）。
  - 对比对象：METRO, Mesh Graphormer, MobRecon, HaMeR, WiLoR, POEM, POEM-v2, UmeTrack, HaWoR。
  - 下游任务设置：Hand2Policy（使用Inspire和Wuji灵巧手进行强化学习抓取-抬起-放置任务），Hand2Teleop（使用Wuji 20关节灵巧手和7关节机械臂进行实时遥操作）。
- **评价指标**: 
  - 相机坐标系3D重建：绝对手腕位置误差（Wrist error）、手腕相对平均关节位置误差（MPJPE）、Procrustes对齐MPJPE（PA-MPJPE）、时序抖动（Jitter）。
  - 世界坐标系3D重建：世界MPJPE（W-MPJPE）、世界对齐MPJPE（WA-MPJPE）、根平移误差（RTE）。
  - 2D定位：重投影误差（px），2D检测框的Precision, Recall, F1。
  - 下游任务：强化学习策略的抓取-抬起-放置成功率（%）；遥操作的实时控制延迟与轨迹跟踪。
- **主要结果**: 
  - 重建精度：WinDEX-Window在相机坐标系下达到SOTA，Wrist error 15.70 mm，MPJPE 16.68 mm，PA-MPJPE 7.82 mm，全面优于所有baseline（如HaWoR FT的31.87/23.48/9.45 mm）。
  - 世界坐标系：结合cuVSLAM，W-MPJPE降至37.29 mm，相比HaWoR (FT) 的97.65 mm大幅降低（误差减少61.8%）。
  - 2D泛化：在野外人工标注2D关键点上的重投影误差为14.5 pixels，优于baseline的22.42-26.72 pixels。
  - 推理速度：WinDEX-Window离线重建达43.61 FPS，WinDEX-Stream因果流式推理达171 FPS。
  - 下游任务：在Hand2Policy中，使用WinDEX轨迹训练的RL策略平均成功率达61%，而使用WiLoR和HaWoR轨迹训练的仅分别为8%和17%。在Hand2Teleop中，成功实现了30Hz的实时手臂-灵巧手协调遥操作。

### 29. 🔥 [ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models] (ForceHarness：将力转化为冻结前沿模型的动作与物理量)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.21099` | [点击跳转](https://arxiv.org/abs/2611.21099)

**0. 论文标题**
- **英文标题**: ForceHarness: Turning Force into Action and Physics for Frozen Frontier Models
- **中文标题**: ForceHarness：将力转化为冻结前沿模型的动作与物理量
- **研究机构**: 原文未提及
- **一句话总结**: 提出ForceHarness三层系统架构，通过底层力觉闭环控制和顶层物理量翻译，让无需微调的API冻结大模型能够零样本利用接触力完成复杂的机器人操作任务。

**1. 整体逻辑**
- **研究任务**: 让只能通过API调用的冻结多模态大模型（如GPT-6 Astra）能够利用接触力（contact forces），零样本完成依赖力觉的机器人操作任务（如拧螺丝、插USB、按重量分拣等）。
- **研究动机**: 现有的大模型harness主要处理视觉和运动，缺乏力觉；而引入力觉的现有方法需要大量演示和微调，无法用于API冻结模型。此外，直接给模型传原始力数据模型看不懂，且接触过程极快，API模型决策太慢，无法在底层做力闭环控制。
- **本质改动**: 设计ForceHarness系统，在模型下方用“自终止力原语”做高频力闭环控制，在模型上方用“物理翻译层”把力轨迹转成带不确定性的物理量，从而桥接冻结模型与底层力控。
- **技术溯源**: 基于现有的冻结多模态大模型（GPT-6 Astra等）和机器人底层阻抗控制器（Impedance controller）；对比基线包括 Diffusion Policy、$\pi_{0.5}$、ForceVLA 等。

**2. 技术拆解**
- **核心方法**: ForceHarness的三层架构：
  1. **力感知与校准层**：利用腕部传感器或关节扭矩估算受力，通过“静止时归零”和“读取前放松”消除零漂，向模型报告力的相对变化。
  2. **自终止力原语层**：将接触技能（如搜索、滑动、插入）封装为工具。原语在底层阻抗控制器上通过导纳控制调节力，并在接触事件发生时自动停止，解决API模型决策慢的问题。
  3. **物理翻译层**：将原语执行期间的力轨迹转化为质量、摩擦系数等物理量，附带不确定性（$\sigma$）和状态标志返回给模型，解决模型看不懂原始力数据的问题。
- **关键细节**: 包含12种力原语（分5组）；底层使用固定安全边界（如25N力上限）；物理翻译层使用简单的均值和最小二乘法估算，不包含任务阈值（只报告物理事实，不替模型做判断）；模型每次决策调用一个原语并读取返回的物理量。
- **训练/优化目标**: 非学习类工作。核心机制是底层阻抗/导纳控制算法，以及基于统计（均值、标准差、最小二乘拟合）的固定物理量估算器。

**3. 实验结果**
- **实验设置**: 
  - **真实机器人**：Franka FR3机械臂（无腕部力传感器，靠关节扭矩估算），6个接触任务（擦白板、拧螺丝、削茄子皮、插USB、按重量分拣瓶子、分辨软硬）。
  - **仿真基准1**：公开的 ForceBench（8个任务，Isaac Lab）。
  - **仿真基准2**：本文新建的 HiddenPhys（7个隐藏物理变量任务，MuJoCo）。
  - **对比对象**：无力的同模型控制、训练型策略（Diffusion Policy, $\pi_{0.5}$, ForceVLA，各约200个expert demo）、手写的专家力控制器。
- **评价指标**: 任务成功率（Success rate），损坏次数（Damage counts）。
- **主要结果**: 
  - **真实机器人**：GPT-6 Astra 在 ForceHarness 下成功率从 3.3% (2/60) 提升至 90.0% (54/60)。在按重量分拣和分辨软硬任务上达到 10/10。
  - **ForceBench**：GPT-6 Astra 成功率从 70.0% 提升至 87.5%，超越了在该基准上训练的最好策略（$\pi_{0.5}$ + Dual-Path Fusion 35.13%）。
  - **HiddenPhys**：GPT-6 Astra 成功率从 62.1% (87/140) 提升至 96.4% (135/140)，匹配了手写的专家力控制器（136/140），远超训练策略（如 Diffusion Policy 83/140），且损坏次数为0（训练策略常有损坏）。
  - **消融实验**：给模型返回“带不确定性的物理量”比返回“原始力数值”或“力曲线图”能显著提高小模型的决策准确率；自终止原语保证了接触安全；逐次调用（turn-by-turn）比一次性生成代码（Code-as-Policies）效果更好。

### 30. 🔥 [Lift, See, Act: Hierarchical Robot Policy Pretraining with 3D Foundation Models] (Lift, See, Act：基于3D基础模型的分层机器人策略预训练)
- **研究机构**: `原文未提及（致谢中提及华南理工大学等单位）`
- **Arxiv ID**: `2611.20481` | [点击跳转](https://arxiv.org/abs/2611.20481)

**0. 论文标题**
- **英文标题**: Lift, See, Act: Hierarchical Robot Policy Pretraining with 3D Foundation Models
- **中文标题**: Lift, See, Act：基于3D基础模型的分层机器人策略预训练
- **研究机构**: 原文未提及（致谢中提及华南理工大学等单位）
- **一句话总结**: 提出LSA分层预训练框架，通过挖掘3D基础模型在提取手部轨迹时产生的密集中间特征和深度图，将2D视频观测提升为3D表征，并结合双重引导机制，显著提升了机器人策略在仿真和真实世界中的操作泛化与鲁棒能力。

**1. 整体逻辑**
- **研究任务**: 利用无标签的人类视频预训练机器人视觉编码器，以提升下游机器人操作任务（如桌面抓取、灵巧手操作）的泛化能力。
- **研究动机**: 现有方法利用3D基础模型从人类视频中提取3D手部运动轨迹作为监督信号，但仅保留了稀疏的轨迹，忽略了3D基础模型在提取过程中产生的丰富、细粒度的中间几何表征和深度图信息。
- **本质改动**: 摒弃仅使用稀疏3D手部轨迹的做法，构建包含Lift、See、Act三个阶段的分层预训练框架，充分利用多个3D基础模型产生的多层级密集3D知识（中间特征、深度图）来监督策略的视觉编码器。
- **技术溯源**: 基于3D基础模型（VGGT用于相机内参和几何表征，Depth Pro用于度量深度图）；视觉编码器基于ImageNet预训练的ViT-B，使用LoRA微调；下游策略基于行为克隆（Behavior Cloning）。

**2. 技术拆解**
- **核心方法**: 
  1) **Lift阶段**：将策略浅层视觉token与多个3D基础模型的中间密集特征进行对齐，提升2D表征的3D几何感知。
  2) **See阶段**：引入深度图重建提供显式3D空间结构约束；利用手部关键点热图作为先验，选择并蒸馏最相似的浅层注意力图，引导模型聚焦交互热点。
  3) **Act阶段**：预测未来3D手部运动轨迹，作为动作相关的代理目标。
- **关键细节**: 
  - 输入为224x224 RGB图像，输出为动作。
  - 视觉编码器为ViT-B，在第3层进行表征对齐，第6层进行深度重建，前6层进行注意力引导。
  - 采用动态权重机制（基于[CLS] token的缩放点积相似度）平衡多个3D基础模型的监督信号。
  - 预训练数据为清洗后的DexYCB等人类视频数据集（约20K clips）。
- **训练/优化目标**: 联合优化四个损失：运动规划损失（L1距离）、表征对齐损失（余弦相似度）、深度重建损失（MSE）和注意力引导损失（L2距离）。总损失为运动规划损失加上几何相关损失（对齐+重建+注意力）的加权和。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集与任务**：MetaWorld（8个桌面操作任务）、DexArt（2个关节物体操作任务）、Adroit（3个灵巧手操作任务）。
  - **真实世界任务**：Franka机械臂执行4个日常任务（Wipe PC, Pick Trash, Place Toy, Pluck Flower），包含改变物体外观、背景和光照的OOD（分布外）测试。
  - **对比对象（Baseline）**：通用视觉表征（CLIP, DINOv3），机器人视觉预训练方法（MCR, VIP, R3M, VC-1, HRP, MPI, R3M-A, VITRA, H-RDT, Moto），以及直接3D策略（DP3, KAN-We-Flow）。
- **评价指标**: 任务成功率（Success Rate, %），以及视觉扰动（降低亮度、添加遮挡）下的成功率相对下降比例。
- **主要结果**: 
  - **仿真表现**：在MetaWorld等三个基准上全面超越Baseline。例如在MetaWorld上，LSA平均成功率达92.2%，比无预训练Baseline（73.3%）提升18.9%；且显著优于直接输入3D点云的DP3等方法，同时推理速度大幅提升（230.6 FPS vs 14.5 FPS）。
  - **真实世界表现**：平均成功率达68.3%，远超最强Baseline HRP的41.7%。在OOD设置下（如改变毛巾颜色），LSA保持70%和60%的成功率，而Baseline大幅下降（如R3M-A降至0%）。
  - **鲁棒性**：在降低亮度和添加遮挡的视觉扰动下，LSA成功率相对下降仅为7.5%和18.7%，远优于DINOv3（下降14.6%和33.7%）及R3M-A（下降44.0%和49.2%）。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.21517` | [点击跳转](https://arxiv.org/abs/2611.21517)

**0. 论文标题**
- **英文标题**: Lazy-MOSAIC: Accelerating Skill-Centric Manipulation Planning with Learned Skill-Effect World Models
- **中文标题**: Lazy-MOSAIC：利用学习到的技能效应世界模型加速以技能为中心的操作规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Lazy-MOSAIC 规划框架，通过引入廉价的技能效应预测模型结合惰性搜索（lazy search）机制，大幅减少昂贵的物理仿真调用，在保持规划物理有效性的同时显著加速长程机器人操作规划。

**1. 整体逻辑**
- **研究任务**: 本文属于机器人学/任务与运动规划（TAMP）领域的方法创新工作。主要解决长程机器人操作规划（Long-horizon manipulation planning）任务，即在给定的参数化技能库（如推、拉、抓、放）中，搜索并组合出一系列技能序列，以完成半结构化环境下的复杂操作（如从杂乱货架上取出特定物体）。
- **研究动机**: 现有的以技能为中心的规划器（如 Mosaic）依赖高保真物理仿真器作为世界模型来评估每个候选技能。由于每次评估都需要进行完整的物理前向仿真，计算成本极高（占规划总时间的 83.4%），导致规划效率低下，难以满足实际部署需求。
- **本质改动**: 将惰性搜索（lazy search）思想引入技能中心规划。不再对每个候选技能都进行物理仿真，而是先用一个廉价的“学习到的技能效应世界模型”预测技能结果并指导搜索，仅在必要时才调用昂贵的物理仿真器进行验证（certification），并在预测失败时进行局部图修复。
- **技术溯源**: 基于 Mosaic（以技能为中心的非序列规划器）、Lazy search（惰性搜索/延迟评估机制）、Deep Sets（用于处理可变数量物体的特征提取网络）、Flow-matching policies（用于推/拉等接触丰富技能的学习策略）。

**2. 技术拆解**
- **核心方法**: Lazy-MOSAIC 维护两个搜索图：一个是由廉价模型预测构成的“乐观图（optimistic graph）”，另一个是由物理仿真验证过的“认证图（certified graph）”。规划时，先在乐观图上寻找候选路径，然后按顺序对路径上的技能进行物理仿真认证。如果仿真结果与预测不符，则局部修复乐观图（剔除失效的下游依赖），保留已认证的真实状态供后续搜索使用。
- **关键细节**: 
  - **廉价世界模型**：使用 Deep Sets 架构，输入技能参数、机器人本体状态和物体特征，输出技能成功概率、末端状态预测（机器人位姿变化和物体位姿残差）以及不确定性（通过集成模型 ensemble 的预测差异计算）。推理极快（128 个提案仅需 0.7ms）。
  - **乐观图成本函数**：结合执行成本、失败惩罚（$-\log p$）和不确定性惩罚，引导搜索避开高失败率和高不确定性的技能。
  - **认证与修复机制**：只有当前驱节点都被物理认证后，当前技能才会被送入仿真器。若仿真失败或结果偏差超过阈值，则从乐观图中移除该节点，并级联失效依赖其预测状态的下游节点；但已认证的真实状态会被保留为单例节点，避免浪费已有的计算。
- **训练/优化目标**: 廉价模型使用二元交叉熵损失训练成功预测头，使用 Smooth-$L_1$ 损失训练状态残差预测头。规划器本身没有传统意义上的损失函数，其核心优化目标是在满足物理仿真验证（Soundness）的前提下，最小化规划时间（即最小化昂贵仿真器的调用次数）。

**3. 实验结果**
- **实验设置**: 
  - **环境**：在 ManiSkill3 (SAPIEN) 仿真环境中，使用 UR10e 机械臂和平行夹爪。
  - **任务**：三个杂乱货架检索任务（Cluttered retrieval, Bin manipulation, Wrench repositioning），每个任务分 Easy/Medium/Hard 难度，共 8 个设置，每个设置 20 次随机试验。
  - **技能库**：包含 Pick, Place, Move, Push, Pull 5 种技能（部分基于 flow-matching 策略学习，存在不完美成功率）。
  - **Baseline**：Mosaic, Options, CEM, Roadmap 及其结合学习模型的变体（Lazy Options, Lazy Roadmap, WM-Mosaic, Ranked-Mosaic 等）。
- **评价指标**: 规划时间（Planning time）、成功率（Success rate）、技能序列长度（Solution length）、仿真器查询次数（Simulator queries）。
- **主要结果**: 
  - 相比原版 Mosaic，Lazy-MOSAIC 在所有设置下匹配或超越了成功率（总成功 104/160 vs 81/160），同时在成功 trials 上的规划速度提升了 2.1 到 6.6 倍。
  - 仿真器查询次数大幅减少 64%–69%（例如 Hard 难度下，Mosaic 平均需 134.5 次查询，Lazy-MOSAIC 仅需 41.3 次）。
  - 消融实验证明，惰性延迟（lazy deferral）比单纯的学习模型排序（Ranked-Mosaic）更能减少仿真调用；而物理仿真认证（相比直接使用预测结果的 WM-Mosaic）对于保证最终规划的成功率和物理有效性至关重要。

### 32. 🔥 [ReRead: Wrong Predictions, Useful Representations - Correcting Frozen Robot Policies by Re-reading Their Own Representations] (ReRead：错误的预测，有用的表征——通过重读冻结机器人策略自身的表征来修正策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.20465` | [点击跳转](https://arxiv.org/abs/2611.20465)

**0. 论文标题**
- **英文标题**: ReRead: Wrong Predictions, Useful Representations - Correcting Frozen Robot Policies by Re-reading Their Own Representations
- **中文标题**: ReRead：错误的预测，有用的表征——通过重读冻结机器人策略自身的表征来修正策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出ReRead方法，通过冻结机器人策略主干并训练轻量修正器重读其内部K/V缓存来预测动作残差，在不增加外部感知的前提下有效修正错误动作，大幅提升困难及相位模糊任务的成功率。

**1. 整体逻辑**
- **研究任务**: 修正预训练机器人策略（如VLA或视频世界动作模型）在困难任务或视觉相位模糊（phase-ambiguous）任务中的错误动作预测。
- **研究动机**: 现有方法通常假设“预测错误是因为内部表征缺乏信息”，从而去重训主干、加外部视觉编码器或引入记忆模块。但作者指出“预测错误不代表表征错误”，策略内部可能已保留正确信息，只是未能正确读取（readout gap）。此外，当前帧往往不足以区分任务阶段，而区分阶段的信息可能已存在于之前决策的内部缓存中。
- **本质改动**: 不重训主干，不加外部视觉，而是冻结主干网络，训练一个小型修正器（corrector），直接读取主干当前及前两步决策缓存的原生K/V和状态，以候选动作为query输出动作残差来修正预测。
- **技术溯源**: 基于RoboTwin 2.0数据集，使用LingBot-VLA、$\pi_{0.5}$、Fast-WAM等预训练机器人策略作为冻结的backbone。

**2. 技术拆解**
- **核心方法**: ReRead。在推理时，backbone正常生成候选动作并缓存原生的视觉和动作K/V。Corrector以候选动作为query，通过交叉注意力机制读取当前及前两个时间步的缓存，预测动作残差并叠加到候选动作上。
- **关键细节**: 
  - Corrector结构：5层Transformer（包含query self-attention, cross-attention, FFN），参数量198.52M。
  - 输入输出：Corrector不看图像，输入为候选动作、当前及过去两步的K/V（来自backbone特定层）、机器人状态和时间/位置编码；输出为动作残差。
  - 推理开销：每次决策增加11.66ms延迟（仅占4.17%），显存和计算开销极小。
- **训练/优化目标**: 
  - 训练数据：仅使用RoboTwin 2.0所有50个任务的离线专家演示。
  - 关键机制：训练时对输入给corrector的候选动作加入稀疏高斯噪声，防止corrector只学会校准候选动作而忽略读取缓存。
  - 损失函数：动作均方误差（Action MSE）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：RoboTwin 2.0（50个任务），重点评估Hard11（11个最难任务）、全50个任务，以及自定义的相位模糊任务（仿真与Flexiv双臂真机）。
  - 对比对象（baseline）：LingBot-VLA、$\pi_{0.5}$、Fast-WAM等backbone；外部视觉编码器（DINOv3、C-RADIOv3、LingBot-Vision、V-JEPA 2.1）。
- **评价指标**: 任务成功率（Success rate），开环下的动作MSE。
- **主要结果**: 
  - 开环分析：仅读取当前缓存降低MSE 61.45%，读取当前+前两步缓存降低92.45%，证明所需信息确实在缓存中。
  - 闭环Hard11：ReRead使LingBot-VLA、$\pi_{0.5}$、Fast-WAM的成功率分别提升23.45、13.09、8.00个百分点。
  - 闭环全50任务：Fast-WAM平均成功率从90.73%提升至92.66%。
  - 消融与干预：替换过去缓存导致误差激增12.37倍；4种外部视觉编码器均未超越ReRead，证明失败并非源于感知不足；相位信息主要存在于过去的动作K/V中，替换相反相位的缓存会使动作偏向错误相位。
  - 相位模糊任务：仿真中Fast-WAM成功率从2%提升至50%，真机Flexiv双臂从0%提升至36%。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.20314` | [点击跳转](https://arxiv.org/abs/2611.20314)

**0. 论文标题**
- **英文标题**: NF-VLA: A Normalizing-Flow Baseline for Vision-Language-Action Learning
- **中文标题**: NF-VLA：一种用于视觉-语言-动作学习的归一化流基线模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于“深-浅”架构自回归归一化流的VLA模型，通过单一最大似然目标训练，并利用模型自身的密度分数进行推理时的动作修正，在LIBERO操作基准上取得了领先性能。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的策略学习，即根据视觉图像、语言指令和本体感知生成连续的机器人动作序列。
- **研究动机**: 现有的VLA动作生成方法（如离散预测、扩散、流匹配）各有优劣。归一化流（NF）能提供易于处理的连续概率密度和精确的最大似然训练，但在自回归流VLA中，如何高效注入多模态条件以及是否利用学到的密度来修正采样动作，仍缺乏系统性研究。
- **本质改动**: 采用“深-浅”架构的自回归归一化流，将多模态条件集中注入到高容量的“深”块中，保持“浅”块无条件以提供共享的可逆变换；同时在推理时，直接利用同一模型学到的密度计算分数，进行单次动作修正，无需额外训练去噪网络。
- **技术溯源**: 基于 TARFlow 和 STARFlow（自回归归一化流架构），以及 SmolVLM-500M-Instruct（预训练视觉-语言骨干网络）。

**2. 技术拆解**
- **核心方法**: 
  1. 深-浅条件注入架构：设计包含一个高容量深块和多个浅块的自回归流，仅将视觉、语言和本体感知特征作为前缀注入深块，浅块保持无条件。
  2. 自分数动作修正：在训练时对动作添加高斯平滑，推理时通过流反转采样后，利用模型自身的对数密度梯度（分数）进行单次 Tweedie 去噪修正，以补偿训练时的平滑。
- **关键细节**: 
  - 输入输出：输入为双视角图像（各384×384，共72个视觉token）、语言指令（50个token）和本体感知（1个token）；输出为长度10、维度7（3平移+3旋转+1夹爪）的归一化动作块。
  - 模型结构：VLM骨干输出经投影后与本体感知拼接为条件前缀。流部分包含6个仿射自回归块（1个14层的深块 + 5个2层的浅块），隐藏层宽度1024，16个注意力头。流部分参数量约303M。
  - 关键超参：高斯平滑强度 σ=0.05；推理时温度设为1.0。
- **训练/优化目标**: 单一的精确最大似然目标。最小化每维动作的负对数似然损失，联合优化流块、上下文投影层和VLM骨干，不使用任何辅助预测或表示对齐损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（包含 Spatial, Object, Goal, Long 4个标准套件，共40个任务）和 LIBERO-Plus（包含相机视角、机器人初始状态、语言指令、光照、背景、噪声、物体布局等7类扰动的零样本泛化测试）。
  - 对比对象（baseline）：OpenVLA, OpenVLA-OFT, π0, π0.5, UniVLA, NinA, RoMAN-Flow 等主流VLA和基于流的策略。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - LIBERO标准任务：NF-VLA平均成功率达到98.35%，超越 π0.5 的96.85%。在 Object (99.8%)、Goal (98.4%) 和 Long (97.8%) 套件上取得最高分。
  - LIBERO-Plus泛化任务：同一检查点零样本平均成功率达72.6%，在光照（96.9%）和物体布局（83.7%）扰动下表现最佳。
  - 消融实验：仅对深块进行条件注入比全块注入平均提升1.20%；单次基于分数的修正比不修正平均提升1.90%；前缀条件注入比 AdaLN 平均提升4.30%，且推理延迟降低约30%。

### 34. 🔥 [DexFormer 2.0: Towards a Cross-Embodiment Foundation Policy for Dexterous Grasping] (DexFormer 2.0：迈向跨具身形态的灵巧抓取基础策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.20273` | [点击跳转](https://arxiv.org/abs/2611.20273)

**0. 论文标题**
- **英文标题**: DexFormer 2.0: Towards a Cross-Embodiment Foundation Policy for Dexterous Grasping
- **中文标题**: DexFormer 2.0：迈向跨具身形态的灵巧抓取基础策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于统一关节接口和形态感知注意力机制的强化学习策略，实现了单一模型控制多种机械臂与灵巧手组合，并能零样本泛化到未见过的臂手搭配及新类型手部。

**1. 整体逻辑**
- **研究任务**: 跨具身形态（Cross-Embodiment）的灵巧抓取。即训练一个通用的强化学习策略，去控制多种不同机械臂和灵巧手的组合，而不是为每种硬件单独训练。
- **研究动机**: 现有的灵巧抓取策略通常和特定的“一臂一手”硬件强绑定。不同机器人的关节数量、运动学结构和动力学特性差异很大，导致观察和动作空间无法直接共享。每增加一种臂或手，就需要重新训练一个策略，知识无法复用，开发成本极高。
- **本质改动**: 摒弃为每种机器人设计独立策略或输出头的做法，将所有机器人映射到统一的规范关节槽位（Canonical joint slots），并通过注入物理形态描述子和运动学树偏置的注意力机制，让单一网络能够理解不同硬件的拓扑结构和动力学差异。
- **技术溯源**: 强化学习（PPO算法）、Transformer-XL（用于时序记忆）、图Transformer（运动学树距离偏置）、前作 DexFormer 1.0。

**2. 技术拆解**
- **核心方法**: 
  1. **统一接口与形态描述**：将所有臂手组合映射到7个臂关节+22个手关节的规范槽位，用有效性掩码（validity masks）处理缺失关节。为每个关节构建16维形态描述子，包含关节轴、位置、限位、语义角色和运动学深度等物理属性。
  2. **MorphNode 空间编码器**：结合身体MLP路径和拓扑感知的MorphAttention残差。在注意力计算中引入基于运动学树距离和关节角色的偏置（类似图Transformer的结构编码），让网络感知关节间的物理连接关系。
  3. **形态条件化记忆**：使用 Transformer-XL 维护16步的时序记忆，用于推断静态几何无法完全指定的接触和动力学响应。
  4. **共享Actor-Critic**：所有具身形态共享同一个Actor和Critic网络，仅通过输入端的掩码和描述子区分。
- **关键细节**: 
  - **输入**：29个关节的22维特征（6维状态+16维描述子）+ 任务观测（物体位姿、点云等）。
  - **模型结构**：MorphNode（包含带树偏置的2层4头注意力） + 3层8头 Transformer-XL（隐层512维，SwiGLU前馈） + 任务编码器。
  - **输出**：29维掩码高斯分布的相对关节位置目标。动作标准差限制在[0.05, 1.0]，采样后裁剪到[-5, 5]。
  - **规模/超参**：控制频率60Hz，仿真频率240Hz，rollout 64步。
- **训练/优化目标**: 使用 PPO 算法在混合具身形态的环境中联合训练。奖励函数鼓励指尖到达、拇指与手指接触、接触后追踪目标，并带有成功奖励和动作惩罚。采用课程学习（重力从0逐渐增加）和物理参数随机化（Domain Randomization）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：Isaac Lab 仿真环境。包含4种机械臂（Flexiv, Franka, KUKA, xArm7）和6种灵巧手（Revo3, Sharpa, LEAP, Allegro, RAPID, Shadow），共24种组合。18种用于训练，6种留出测试。训练物体为10种基础几何体，测试物体包含10种YCB物体。
  - **对比对象（baseline）**：GRU策略（带MLP编码器）、DexFormer 1.0（无显式形态描述子，仅依赖历史观测记忆）。
- **评价指标**: 稳定成功率（Stable Success Rate, SR）。定义为完成240步控制、最后30步（0.5秒）物体位置误差小于5cm且无超时外终止的 episode 比例。
- **主要结果**: 
  - **基础性能**：在见过的组合上，DexFormer 2.0 达到 89.01% 的成功率（GRU 64.82%，DexFormer 1.0 66.02%）。在留出的6种未见组合上，达到 51.18%（GRU 31.28%，DexFormer 1.0 14.15%），提升显著。
  - **泛化能力**：在未见物体（YCB）且未见组合的极端设定下，仍保持 48.85% 的成功率。无需微调即可零样本控制4种训练时未见过的灵巧手，并通过虚拟手重定向（retargeting）控制4种平行夹爪。
  - **消融实验**：时序记忆、运动学树偏置对零样本迁移至关重要（去掉后留出组合成功率降至24%左右）；训练时增加组合覆盖面（从12种增加到18种）能将留出组合成功率从 5.65% 大幅提升至 51.18%。
  - **真机实验**：在物理 Flexiv 臂上，通过 DAgger 蒸馏出基于深度相机的学生策略，零样本部署到 Revo3（留出组合，成功率68%）和 LEAP（训练组合，成功率92%）手上。
