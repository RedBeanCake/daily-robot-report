### 35. 🔥 [Right Goal, Wrong Body: Re-grounding Frozen VLAs under Actuation Shift] (正确目标，错误躯体：执行偏移下冻结VLA的重新锚定)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.20244` | [点击跳转](https://arxiv.org/abs/2611.20244)

**0. 论文标题**
- **英文标题**: Right Goal, Wrong Body: Re-grounding Frozen VLAs under Actuation Shift
- **中文标题**: 正确目标，错误躯体：执行偏移下冻结VLA的重新锚定
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ReGround 方法，在机器人执行机构发生变化（如控制延迟、增益改变）时，无需重新训练，通过推理时读取冻结 VLA 的意图轨迹并结合新学习的动力学模型重新计算动作，恢复任务成功率并保证安全性。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在部署时，因机器人执行机构变化（actuation shift，如机械磨损、重挂载、控制延迟等导致动作指令到物理运动的映射改变）引起的任务失败和不安全行为问题。
- **研究动机**: VLA 训练时假设动作指令与物理运动的映射固定。部署时若发生执行偏移，同一动作会产生不同的物理运动。现有方法需要重新训练/微调（需额外数据和算力），或依赖测试时奖励信号进行推理时对齐（但在执行偏移场景下缺乏外部任务奖励）。
- **本质改动**: 将推理时对齐问题转化为“意图追踪”问题：不依赖外部任务奖励，而是用训练体前向模型 rollout 出 VLA 的意图轨迹，再用部署体前向模型和信任区域 MPC 重新求解动作，使部署体复现该意图轨迹。
- **技术溯源**: 基于 VLA 模型（如 $\pi_{0.5}$、SmolVLA）、推理时对齐（inference-time alignment）、逆向动力学迁移（inverse-dynamics transfer）、模型预测控制（MPC）。

**2. 技术拆解**
- **核心方法**: ReGround 方法包含四个核心模块：
  1. **意图读取**：用训练体前向模型 rollout VLA 输出的动作块，得到参考轨迹，作为 VLA 的真实意图。
  2. **部署体辨识**：通过任务无关的电机随机运动（motor babbling）收集数据，拟合部署体的集成前向模型，并辨识控制延迟和线性映射。
  3. **信任区域追踪**：使用 MPC 最小化部署体预测轨迹与参考轨迹的偏差，同时用二次惩罚项限制动作偏离 VLA 的原始计划（锚点动作）。
  4. **偏移监测**：使用单侧 CUSUM 检验监测训练体模型的单步残差，仅在检测到执行偏移时才激活 ReGround，避免在正常状态下干扰原策略。
- **关键细节**: 
  - **输入输出**：输入为观测、语言指令、机器人状态（25维：6D EEF位姿、夹爪状态、关节位置/速度）；输出为动作块（6D EEF delta + 夹爪指令），每次执行前 10 个动作（共 50 个）。
  - **模型结构**：训练体和部署体前向模型用于预测旋转矢量位姿增量；MPC 规划 horizon $H$（实验中 $H=1$ 即可匹配更长 horizon 的效果）。
  - **关键超参**：信任区域权重 $\lambda$（实验中验证集选择的 $\lambda$ 使解保持在锚点动作附近），折扣因子 $\gamma$，CUSUM 阈值等。
- **训练/优化目标**: 
  - **部署体辨识**：拟合前向模型以预测位姿增量，同时辨识动作延迟和线性映射。
  - **信任区域追踪（MPC优化目标）**：最小化部署体预测轨迹与参考轨迹的加权误差（替代外部奖励），加上动作与锚点动作的二次惩罚（替代 KL 散度，作为信任区域）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：8 个 LIBERO 任务（基于 MuJoCo 和 robosuite，20Hz 控制频率）。
  - **对比对象（baseline）**：Base（基础冻结 VLA）、Linear（线性校准）、Intent（单步逆向动力学迁移）、Oracle（解析逆）。
  - **测试环境与负载**：改变执行机构设置，包括动作帧旋转（90度/30度）、控制器增益（x3/x2）、延迟（250ms/400ms）及复合偏移。测试对象为 $\pi_{0.5}$ 和 SmolVLA。
- **评价指标**: 任务成功率（Success rate）和不安全事件率（Unsafe-episode rate，包括非目标接触、物体位移/掉落、速度包络违规）。使用 IQM（Interquantile Mean）和分层 bootstrap 区间进行统计。
- **主要结果**: 
  - 执行偏移会严重破坏冻结 VLA 并引发危险（如 400ms 延迟下 $\pi_{0.5}$ 成功率从 0.99 暴跌至 0.16，不安全率升至 0.86）。
  - ReGround 将成功率恢复至 0.90-0.98，接近 Oracle 上限。在时序偏移（延迟）下优势显著，如 400ms 延迟下比 Linear 高 0.83，比 Intent 高 0.74。
  - 在静态偏移（旋转/增益）下，成功率与 Linear/Intent 相当，但不安全率大幅降低（如 90度旋转下不安全率从 Linear 的 0.76 降至 0.29）。
  - 监测器有效且轻量：未偏移时 ReGround 保持关闭（成功率 0.98，不安全率与 Base 相当），仅 2.1% 误报；仅需 50秒（1k次）的电机随机运动数据即可完成部署体辨识并恢复高成功率。

### 36. 🔥 [CRAFT: A Robot-Agent Harness with Scope-Aware Adaptation] (CRAFT：具有范围感知适应能力的机器人智能体框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.19952` | [点击跳转](https://arxiv.org/abs/2611.19952)

**0. 论文标题**
- **英文标题**: CRAFT: A Robot-Agent Harness with Scope-Aware Adaptation
- **中文标题**: CRAFT：具有范围感知适应能力的机器人智能体框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个冻结底层物理技能的机器人框架CRAFT及核心方法Scope Ladder，通过动态权衡具体记忆与泛化规则，解决机器人如何从稀疏的人类纠正反馈中学习未明说规则及其适用范围的问题。

**1. 整体逻辑**
- **研究任务**: 机器人从稀疏的人类纠正反馈（如“放错地方了”）中学习未明说的局部需求，并判断该纠正的适用范围（reach/scope），即该纠正是只针对当前特定场景，还是表达了一个更广泛的规则。
- **研究动机**: 机器人收到纠正时，无法直接得知规则的真实边界。单纯依赖记忆（如kNN）会导致泛化能力差，在新场景下犯同样的错误；单纯依赖规则推断，又可能因为感知噪声或规则超出预设语法而失效。现有方法难以在“具体经验”和“广泛规则”之间做出合理的在线仲裁。
- **本质改动**: 将物理执行成功与否与动作是否符合要求解耦，冻结底层物理技能。提出Scope Ladder机制，在遇到几乎相同的情况时优先使用具体记忆（门控机制），在其他情况则根据历史预测准确度，动态加权混合记忆、显式规则和开放学习器。
- **技术溯源**: 基于冻结的机器人技能库（如HALO）、持久记忆与纠正机制（如CarryOn, NAPPING）、贝叶斯概念学习（Goodman et al.）、以及基于预序列证据的专家混合加权（Freund et al.）。

**2. 技术拆解**
- **核心方法**: CRAFT框架与Scope Ladder（范围阶梯）。CRAFT通过标准合约将物理执行、任务可接受性和提问成本分离，确保学习器不会从物理执行失败中错误地学习规则。Scope Ladder包含三个预测器，通过预序列证据加权混合，并引入基于特征距离的门控机制（Gate）优先处理近乎相同的情况。
- **关键细节**: 
  - **输入输出**：输入为RGB-D图像提取的感知事实（物体存在、颜色、位置）和动作菜单；输出为动作选择、放弃或向人提问。
  - **规则层（Rule level）**：基于约1800条手写语法（属性、空间、占用等）的贝叶斯预测性规则推断，带固定共享遗忘机制（$\eta=0.002$）和噪声标签假设（$\epsilon=0.05$）。
  - **开放层（Open level）**：基于感知事实的L2正则化逻辑回归，用于拟合语法外的线性规则。
  - **记忆层（Memory level）**：基于冻结视觉特征的kNN（k=3）余弦距离投票。
  - **混合与门控**：根据各预测器过去的预测似然（预序列证据）计算权重进行混合；若当前状态与历史某记录的特征余弦距离小于0.01，则直接由记忆层决定（Gate机制）。
  - **决策与提问**：选择概率最大动作，概率<0.5则放弃，在0.25~0.75之间且有预算时触发提问。
- **训练/优化目标**: 非端到端学习类工作。核心机制是在线贝叶斯更新与预序列证据加权：通过贝叶斯步骤更新规则权重，通过累积的预序列对数似然调整混合权重，并在带噪标签假设下进行预测性规则推断，以最大化净效用。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：主要在决策级别的渲染桌面场景组合中进行（50-75个上下文），并在基于MuJoCo/LIBERO和R1机器人的闭环模拟（集成服务级别）中进行测试。
  - **对比对象（Baseline）**：kNN-mem（kNN纠正记忆）、NAPPING-mem、Popper (ILP)、Qwen3-VL-8B (VLM)、LLM rule writer，以及集成服务中的 frontier agent (gpt-6.1-sol) 和 CarryOn/DROC 的改编版。
- **评价指标**: 净效用（Net utility，正确+1，错误-1，放弃/失败0，提问-0.5），可接受任务完成数，错误动作数，提问数。
- **主要结果**: 
  - **决策级别**：Scope Ladder 在新场景和重复场景下的净效用均显著优于 kNN-mem（如新场景提升+0.074）。组件分析表明，规则推断在新场景贡献大，而记忆门控在重复场景贡献大。Ladder 也显著优于 Popper 和 8B VLM/LLM 基线。
  - **闭环模拟（集成服务）**：Ladder 与 frontier agent (gpt-6.1-sol) 接受任务数相近（96/120 vs 94/120），Ladder 提问更少（6次 vs 11次），但 frontier agent 错误派遣更少（不过 frontier 有7次决策超时）。
  - **与 CarryOn 改编版对比**：Ladder 接受任务更多（96 vs 90），提问更少（7次 vs 17次），但 CarryOn 在规则发生未通知的改变后表现更好。
  - **局限性验证**：在规则发生未通知的改变时，Ladder 容易受到旧记忆（stale memory）的干扰。可靠地适应未通知的规则变化在该工作中仍未解决。所有证据均来自模拟环境。

### 37. 🔥 [DiffWAM: Learning World Action Model from Consecutive Visual Difference] (DiffWAM：从连续视觉差异中学习世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.19904` | [点击跳转](https://arxiv.org/abs/2611.19904)

**0. 论文标题**
- **英文标题**: DiffWAM: Learning World Action Model from Consecutive Visual Difference
- **中文标题**: DiffWAM：从连续视觉差异中学习世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于 MoE 架构的世界动作模型（WAM），通过引入连续视觉差异预测任务来显式建模场景的时序动态变化，在推理时直接裁掉预测分支实现零额外开销，显著提升了仿真和真机机器人操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作任务中的策略学习（具体为基于世界动作模型 WAM 的视觉-语言-动作策略生成）。
- **研究动机**: 现有的 WAM（如 FastWAM）通过预测未来完整状态来辅助动作生成，但未来状态中混杂了大量与任务无关的静态背景信息。这种全状态预测目标没有为“时序变化（temporal variation）”提供独立的学习信号，导致模型难以聚焦于与任务执行真正相关的场景动态变化。
- **本质改动**: 在 WAM 中引入“连续视觉差异预测”作为辅助任务，通过 MoE 架构让模型同时学习预测未来状态和相邻帧的 Latent 差值，从而显式地捕捉场景的时序动态，且推理时直接移除预测分支，不增加推理开销。
- **技术溯源**: 基于 Wan2.2-5B 的预训练文本编码器（T5）和视频 VAE；采用了 Flow Matching（流匹配）生成范式；在 WAM 范式（核心 Baseline 为 FastWAM）基础上进行架构与目标改进。

**2. 技术拆解**
- **核心方法**: 提出 DiffWAM 框架，包含一个共享的 Observation Encoder 和三个专家（World Expert, Diff Expert, Action Expert）。World Expert 负责去噪生成未来帧，Diff Expert 负责回归相邻帧的 Latent 差值，Action Expert 负责生成动作。通过结构化的单向注意力掩码（Structured unidirectional attention mask）隔离各专家间的注意力，仅允许它们关注当前帧表示。
- **关键细节**: 
  - **模型规模与结构**：总参数量约 7B。Observation Encoder 和三个 Expert 各包含 $N$ 层 Transformer（默认 $N=30$）。World 和 Diff Expert 共享前 $N-M$ 层，后 $M$ 层独立（Diff Expert 独立的 $M$ 层称为 LDB，默认 $M=10$）。
  - **训练配置**：分为 DiffWAM-S（小数据场景，冻结 Diff Expert 的独立 LDB 层，保留 diff loss 梯度回传以防过拟合）和 DiffWAM-L（大数据场景，先冻结其他模块单独训练 Diff Expert，再联合训练所有模块）。
  - **推理机制**：推理时直接移除 World 和 Diff Expert，只保留 Observation Encoder 和 Action Expert，视觉预测分支不产生任何额外推理开销。
- **训练/优化目标**: 联合损失函数，包含三部分：1) World Expert 的视频 Flow Matching 损失（预测速度场）；2) Diff Expert 的 Latent 差值均方误差（MSE）回归损失；3) Action Expert 的动作 Flow Matching 损失。总损失为这三者的加权和。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmark**：LIBERO（40个单臂任务），RoboTwin 2.0（50个双臂任务，含 clean 和 random 场景），真实世界操作任务（ALOHA-AgileX 平台，3个任务：Place Pens, Store Block, Stack Cups）。
  - **对比对象（Baseline）**：VLA 类（OpenVLA, $\pi_0$, $\pi_{0.5}$ 等）和 WAM 类（Motus, LingBot-VA, FastWAM, ImageWAM, WLA 等）。核心直接对比 Baseline 为 FastWAM。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - **LIBERO 仿真**：DiffWAM-S 平均成功率 98.8%，比 FastWAM (97.05%) 高 1.75 个百分点，在 Goal 和 Long 任务上提升尤为明显。
  - **RoboTwin 2.0 仿真**：DiffWAM-L 平均成功率 92.65%，比 FastWAM (91.10%) 高 1.55 个百分点，在 clean 和 random 场景下均有稳定提升。
  - **真实世界操作**：DiffWAM-S 平均成功率 88.3%，比 FastWAM (73.3%) 大幅提升 15.0 个百分点。
  - **训练效率**：在 LIBERO 上达到 95% 平均成功率所需的优化步数减少了 28.1%（6.9k 步对比 FastWAM 的 9.6k 步），证明差异预测提供了更有效的学习信号，加速了收敛。

### 38. 🔥 [ResWAM: Learning What Changes, Not What Stays, for World-Action Models] (ResWAM：在世界-动作模型中学习变化而非静止)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.19559` | [点击跳转](https://arxiv.org/abs/2611.19559)

**0. 论文标题**
- **英文标题**: ResWAM: Learning What Changes, Not What Stays, for World-Action Models
- **中文标题**: ResWAM：在世界-动作模型中学习变化而非静止
- **研究机构**: 原文未提及
- **一句话总结**: 把世界-动作模型（WAM）的监督目标从“预测完整未来帧”改为“预测未来特征的残差”，并设计了一个轻量级双分支DiT架构，在大幅降低计算开销的同时取得了最优的机器人策略性能。

**1. 整体逻辑**
- **研究任务**: 具身智能中的机器人策略学习，具体是构建世界-动作模型（World-Action Models, WAMs），让视觉-语言-动作策略（VLAs）具备预测动作对物理世界影响的能力。
- **研究动机**: 现有WAMs监督完整的未来观测（完整未来帧或特征），但在一个action chunk内场景变化很小，导致loss主要被“复制静态背景”主导，学不到机器人和物体的运动。此外，现有WAMs依赖大型视频生成模型或独立的世界模型，训练和推理算力开销极大，阻碍了闭环部署。
- **本质改动**: 监督目标从“预测未来世界长什么样”改为“预测世界怎么变”（即当前帧到未来帧的视觉特征残差）；架构上抛弃笨重的视频生成模型，改用轻量级双分支DiT联合去噪动作和残差。
- **技术溯源**: 基于 RynnBrain-1.1-2B（VLM主干）、冻结的 DINOv3（视觉编码器）、DiT（双分支架构）以及条件流匹配（conditional flow matching）。

**2. 技术拆解**
- **核心方法**: 
  1. **视觉残差学习**：在冻结的DINOv3特征空间里，直接计算未来帧特征和当前帧特征的差值（$\Delta_t = Z_{t+H} - Z_t$）作为监督目标。这能过滤掉静态背景，把注意力集中在机械臂和抓取物体的运动上。
  2. **ResWAM架构**：一个总参数2.3B的模型，包含2B的VLM主干和0.5B的双分支DiT。动作分支预测action chunk，残差分支预测视觉残差。两个分支通过联合注意力（joint attention）交互信息，用条件流匹配一起训练。
- **关键细节**: 
  - **输入输出**：输入当前相机图像、本体感受状态和语言指令；输出预测的动作块（action chunk）和视觉残差。
  - **模型结构**：视觉编码器用冻结的DINOv3 ViT-B/16，经过2x2池化压缩到每个视角64个token。双分支DiT各自带独立参数，通过拼接token做双向注意力。推理时从10步Euler积分联合去噪，不需要像素级解码。
  - **规模与超参**：总参数2.3B。流匹配损失权重 $\lambda_w = 0.1$。
- **训练/优化目标**: 
  - 主要的优化目标是条件流匹配（conditional flow matching）的速度场回归。损失函数是动作分支和残差分支的流匹配L2损失之和（$\mathcal{L} = \mathcal{L}_a + \lambda_w \mathcal{L}_r$）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Plus（10030个扰动episode）、RoboTwin 2.0（50个双臂任务）、RoboDojo（42个任务），以及真实机器人FR3操作任务（Open, Put, Stack）。
  - **对比对象（baseline）**：VLAs（OpenVLA, Mantis, UniVLA, $\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, GR00T-N1.6, VLA-JEPA等）和 WAMs（Motus, LingBot-VA, LaWAM, Fast-WAM, Cosmos-Policy等）。
- **评价指标**: 
  - 任务成功率（%），RoboDojo额外看阶段级进度分数（Score）。
  - 计算效率：单样本训练计算量（Train TFLOPs）、单块推理计算量（Infer. TFLOPs）、推理延迟（Latency ms）。
- **主要结果**: 
  - **性能最优**：在无需外部机器人数据预训练的情况下，ResWAM在LIBERO-Plus（81.1%）、RoboTwin 2.0（93.8%）和RoboDojo（9.40%成功率，13.41分数）上均取得最高平均成功率。真实机器人FR3任务平均成功率80.0%，比 $\pi_{0.5}$ 高10.0%。
  - **极致轻量**：训练计算量（2.7–4.0 TFLOPs）和推理计算量（1.0–1.4 TFLOPs）全场最低，推理延迟（92.2–99.7 ms）也是最低，比那些基于视频生成的WAMs（如Motus、Cosmos-Policy）快了几十甚至上百倍。
  - **消融结论**：残差分支对性能至关重要（去掉掉3.9%）；学残差比学完整未来特征好（+2.9%）；在冻结的DINOv3空间学残差比在VLM ViT空间学好（+2.2%），因为DINOv3的空间几何特征更细。

- **研究机构**: `原文未提及`

**0. 论文标题**
- **英文标题**: RoboCoEvo: Expanding Robot Capabilities through Agent-Policy Co-Evolution
- **中文标题**: RoboCoEvo：通过Agent与策略的共进化扩展机器人能力
- **研究机构**: 原文未提及
- **一句话总结**: 提出RoboCoEvo框架，让Agent通过编写故障检测与恢复代码生成修复数据，指导VLA策略模型微调，两者在迭代中协同进化，持续提升机器人长序列任务的自主成功率。

**1. 整体逻辑**
- **研究任务**: 提升多模态大语言模型（MLLM）Agent与机器人基础模型（如VLA）结合后的自主执行能力，解决长序列操作任务中的累积错误和失败恢复问题。
- **研究动机**: 现有系统中Agent和策略模型的改进是解耦的。Agent的改进不能自动提升底层策略的参数能力，而策略的更新也会改变失败分布，导致Agent之前的修复策略失效。两者缺乏双向的协同进化机制。
- **本质改动**: 建立了一个以“失败模式（Failure Modes）”为中心的迭代反馈闭环，将Agent的显式可执行知识（检测与恢复代码）的演进，与机器人基础模型的参数学习（后训练）深度耦合。
- **技术溯源**: 基于视觉-语言-动作（VLA）模型，采用code-as-policy范式，依赖物理仿真器。Agent基座使用GPT-6 Astra，策略基座使用了RLC、$\pi_{0.5}$和XR-1等。

**2. 技术拆解**
- **核心方法**: 包含两个交替执行的模块：1) 策略引导的Agent进化：Agent分析策略的失败轨迹，将重复失败聚类为“失败模式”，并为每个模式编写有限状态机形式的检测器和恢复程序；2) Agent引导的策略能力扩展：利用恢复程序在检测到的失败状态及仿真扰动状态上执行，收集成功的恢复经验，对VLA进行后训练。
- **关键细节**: 
  - 输入输出：Agent输入场景状态（机器人状态、物体位姿、符号事实、图像），输出检测器和恢复代码；VLA输入图像和状态，输出动作。
  - 模型与系统：Agent使用GPT-6 Astra（开启高推理模式）。恢复程序需在验证集上达到70%成功率才被接受。
  - 数据规模：BEHAVIOR-1K每任务收集50个rollouts采样20个失败；RoboCasa和RoboTwin每任务收集200个rollouts。
  - 关键机制：引入“故障条件增强（failure-conditioned augmentation）”，在仿真中扰动失败状态的机器人和物体位姿，用同一套恢复程序执行，以极低成本扩充修复数据。
- **训练/优化目标**: 
  - Agent端：优化检测器的准确率和恢复程序的成功率（验证集成功率>=70%）。
  - 策略端：DAgger风格的模仿学习。将原始演示数据与累积的恢复经验按1:1比例混合进行微调，以缓解灾难性遗忘。

**3. 实验结果**
- **实验设置**: 
  - 数据集：BEHAVIOR-1K（前6个长序列双臂任务）、RoboTwin 2.0（50个双臂桌面任务）、RoboCasa（10个单臂厨房任务）。
  - Baseline：BEHAVIOR-1K使用RLC（2025 BEHAVIOR Challenge冠军），RoboTwin使用$\pi_{0.5}$，RoboCasa使用XR-1。
- **评价指标**: 任务成功率（Success rate），BEHAVIOR-1K额外使用Q-score（目标谓词满足比例），以及失败模式相关指标（如FM发生率、自主恢复率等）。
- **主要结果**: 
  - 经过两轮共进化，RoboTwin成功率从79%提升至93%，RoboCasa从79%提升至91%，BEHAVIOR-1K的Q-score从0.40提升至0.56。
  - 消融实验表明，共享失败模式程序（FMs）比单独修复每个失败效果更好（避免高熵数据）；故障条件增强（Augmentation）将GPU仿真时间从147小时降至36小时，Agent Token消耗减少6倍，同时进一步提升了策略性能。

### 40. 🔥 [Optimal Operating-Point Selection for Single-Linearization Trajectory Planning of Nonlinear Robot Manipulators] (非线性机器人机械臂单线性化轨迹规划的最优操作点选择)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.18935` | [点击跳转](https://arxiv.org/abs/2611.18935)

**0. 论文标题**
- **英文标题**: Optimal Operating-Point Selection for Single-Linearization Trajectory Planning of Nonlinear Robot Manipulators
- **中文标题**: 非线性机器人机械臂单线性化轨迹规划的最优操作点选择
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种离线性能驱动的方法，将单点线性化轨迹规划中的线性化点位置作为优化变量进行寻优，在保持仿射模型计算效率的同时显著降低了非线性动力学下的轨迹规划代价。

**1. 整体逻辑**
- **研究任务**: 非线性机器人机械臂的基于优化的轨迹规划。
- **研究动机**: 单点线性化计算高效，但规划性能高度依赖线性化点的选择。传统的启发式选择（如初始点、中点、终点）无法充分表征非线性动力学，且最小化局部线性化误差并不等同于最小化有限时域的非线性轨迹执行代价。
- **本质改动**: 摒弃预设的固定线性化点，将线性化点在种子轨迹上的时间位置参数化为归一化变量 $\lambda \in [0,1]$，并将其作为外层优化的设计变量，通过最小化非线性开环执行代价来离线搜索最优操作点。
- **技术溯源**: 基于经典的机器人动力学单点线性化、二次规划（QP）轨迹生成以及PID反馈控制。

**2. 技术拆解**
- **核心方法**: 采用双层嵌套优化框架。内层针对固定的 $\lambda$ 构建仿射模型并求解约束有限时域二次规划（QP）生成控制序列；外层将该控制序列输入原非线性动力学进行开环 rollout，计算非线性轨迹代价，并通过粗粒度网格搜索结合无导数有界优化（fminbnd）寻找使外层代价最小的最优 $\lambda$。
- **关键细节**: 候选操作点从同一条满足边界条件的三次种子轨迹上采样。机械臂模型为3自由度 UR5（关节1-3），控制时域 $N=100$，采样间隔 $0.02\text{s}$。状态代价权重 $Q_q=150I_3, Q_{\dot{q}}=10I_3$，控制代价权重 $R_u=4I_3$，力矩限制 $\pm 60\text{Nm}$。
- **训练/优化目标**: 内层 QP 优化目标为仿射模型下的状态偏差与控制能量二次型代价；外层优化目标为控制序列在真实非线性动力学下 rollout 产生的非线性开环状态偏差与控制能量二次型代价。

**3. 实验结果**
- **实验设置**: 仿真环境为3自由度 UR5 机械臂模型，测试了4个不同的点到点运动任务（T1-T4）。对比基线（baseline）为传统的初始点（$\lambda=0$）、中点（$\lambda=0.5$）和终点（$\lambda=1$）线性化，并取三者中表现最好的作为对比基准。
- **评价指标**: 非线性轨迹目标代价（Nonlinear trajectory objective），以及相对于最优 $\lambda$ 的遗憾值（Regret）。
- **主要结果**: 最优线性化点具有强任务依赖性（T1-T4的最优 $\lambda$ 分别为 0.390, 0.325, 0.935, 0.432）。相比传统启发式中表现最好的基线，所提方法在4个任务上分别将非线性轨迹目标代价降低了 17–18%、21–22%、37–38% 和 7–8%。此外，在引入相同参数的 PID 反馈校正进行闭环执行时，该性能优势依然保持。

### 41. 🔥 [The Flip Test: Video World Models Fail to Learn the World State] (翻转测试：视频世界模型未能学习世界状态)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.19822` | [点击跳转](https://arxiv.org/abs/2611.19822)

**0. 论文标题**
- **英文标题**: The Flip Test: Video World Models Fail to Learn the World State
- **中文标题**: 翻转测试：视频世界模型未能学习世界状态
- **研究机构**: 原文未提及
- **一句话总结**: 提出反事实评估基准FlipTest，证明当前视频世界模型无法从初始帧中准确读取决定物理未来的关键状态，主要败在状态感知而非视频渲染。

**1. 整体逻辑**
- **研究任务**: 评估视频世界模型是否真正理解了物理世界的因果状态（即能否根据当前微小的状态变化，准确预测截然相反的未来）。
- **研究动机**: 现有视频生成模型能生成逼真的画面，但视觉逼真不等于物理理解。现有基准只孤立评估单个视频的物理合理性，存在致命盲区：模型可能对两个真实未来完全相反的初始帧，生成一模一样的“看似合理”的视频，从而掩盖其缺乏物理因果推理能力的事实。
- **本质改动**: 抛弃孤立评估，采用反事实（counterfactual）测试思路：通过微小改变当前状态使其跨越物理边界（翻转未来），测试模型的预测是否随之翻转，并据此构建了三层级递进的严格测试基准。
- **技术溯源**: 基于现有的视频世界模型（如Gemini, Cosmos, Wan等），以及视觉语言模型（VLM）和代码智能体（Coding Agent）。诊断思路借鉴了Visual De-animation的三阶段分解（感知、动力学、渲染）。

**2. 技术拆解**
- **核心方法**: 构建FlipTest基准，包含1680个初始帧（10个MuJoCo模拟任务和15个真实世界任务），设计三层级测试：1) 视觉最小对（Detection）：测试模型能否区分几乎相同但未来相反的帧；2) 匹配控制（Selectivity）：在边界同侧进行扰动，测试模型是否只在真实未来改变时才改变预测；3) 密集扫描（Localization）：在边界附近密集采样，测试模型预测翻转的位置和锐度。
- **关键细节**: 输入为干净的初始帧和中性提示词。使用两个独立的VLM（Gemini 3.8 Flash和3.6 Flash）作为盲测裁判，读取生成视频中的实际事件来打分。模拟任务通过MuJoCo构建并精确控制边界变量；真实任务通过实拍或反事实图像编辑构建，确保像素级匹配。
- **训练/优化目标**: 本文为评估基准与诊断分析工作，不涉及模型训练。核心机制是基于反事实物理边界的最小对构造与三层级探针测试。

**3. 实验结果**
- **实验设置**: 使用自建的FlipTest数据集（包含模拟和真实场景）。对比对象（baseline）为11个视频世界模型（包括Gemini Omni Flash 1.1, MiniMax-H3, Wan2.2, Cosmos系列等）。同时引入直接预测的VLM和代码智能体（Measure/Simulation agent）作为诊断对照。
- **评价指标**: 1) Pair accuracy（最小对准确率，随机猜测基线为25%）；2) Selective sensitivity（选择性敏感度，跨越边界的翻转率减去同侧翻转率）；3) Response curve（响应曲线，预测概率随物理边界变量变化的心理测量曲线）。
- **主要结果**: 
  1) 所有视频模型均告失败。最佳模型平均Pair accuracy仅18.3%（低于25%的随机基线），在模拟任务上所有模型均低于5.3%。主要失败模式是“模式崩溃”，即对最小对生成完全相同的未来。
  2) 模型缺乏选择性敏感度，在无关扰动和真实边界上的翻转率一样；响应曲线平坦，完全无法定位物理边界。
  3) 扩大模型规模、升级架构或进行物理专用训练几乎无济于事。
  4) 诊断表明，绕过渲染直接用VLM预测，或用代码智能体测量图像几何，能取得极高准确率（>93%）；即使直接在提示词中告诉视频模型真实结果，最佳模型准确率也仅升至73.7%。结论：视频模型主要败在从图像中读取物理状态（感知阶段），其次败在渲染阶段。

### 42. 🔥 [Frame First, Decode Once: Object-Centric Coordinates and Single-Pass Decoding for System-1 World Models] (先定坐标系，一次解码完：面向System-1世界模型的以物体为中心的坐标系与单遍解码)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.18761` | [点击跳转](https://arxiv.org/abs/2611.18761)

**0. 论文标题**
- **英文标题**: Frame First, Decode Once: Object-Centric Coordinates and Single-Pass Decoding for System-1 World Models
- **中文标题**: 先定坐标系，一次解码完：面向System-1世界模型的以物体为中心的坐标系与单遍解码
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过严格的消融实验证明，在具身操作的System-1世界模型中，把输入输出转换到物体局部坐标系，并采用单遍并行解码结合软token期望与Kabsch刚体投影，能以约1.6ms的极低延迟大幅降低决策遗憾，同时保证轨迹的刚体一致性。

**1. 整体逻辑**
- **研究任务**: 构建并优化用于接触丰富操作任务（如推T型块）的System-1世界模型（即控制循环中用于快速评估候选动作的动作条件预测器）。
- **研究动机**: 现有的视觉语言动作模型（VLA）通常把几何信息 tokenize 成坐标序列，自回归逐 token 解码太慢（约12ms/决策），满足不了 System-1 模型在几毫秒内对候选动作排序的需求。此外，在世界坐标系下直接预测容易过拟合绝对位姿，且独立预测各个关键点会破坏物体的刚体一致性。
- **本质改动**: 放弃世界坐标系，改用物体初始位姿的 SE(2) 局部坐标系；放弃自回归或扩散等迭代解码，改用单遍（single-pass）并行解码所有坐标 slot，并结合软 token 期望与闭式 2D Kabsch 投影来强制保证刚体一致性。
- **技术溯源**: 基于 LocateAnything 和 VFlash 的单遍原语解码（Flash Primitive Decoding）思想，结合了积分人体姿态回归（soft-bin regression）和 6D 位姿估计中的 Procrustes/Kabsch 拟合。基座为小型卷积图像编码器加 3 层 Transformer。

**2. 技术拆解**
- **核心方法**: 
  1. **物体中心坐标系（Object-Centric Frame）**：将所有输入（关键点历史、目标、推杆位置、动作）和输出映射到物体初始位姿的局部 SE(2) 坐标系中，消除全局旋转和平移的干扰。
  2. **单遍解码与软 Token 期望（Single-pass & Soft-Token Expectation）**：使用 block attention mask，在一次前向传播中并行预测所有 100 个坐标 slot 的 logits，然后对离散 bin 求 softmax 期望得到连续坐标，配合 Smooth-L1 损失进行监督。
  3. **2D Procrustes (Kabsch) 投影**：对预测的 4 个冗余关键点，通过闭式 2D Kabsch 算法计算最优刚体变换，将其投影到 SE(2) 流形上，滤除非刚体形变误差。
- **关键细节**: 
  - **模型规模**：约 2M-4.2M 参数（3 层 Transformer，d=192，100 个并行 query slots）。
  - **输入输出**：输入为 128x128 RGB 图像（物体坐标系下通常不用或做 warp）、4 步关键点历史、目标和动作；输出为 10 步未来轨迹（每步 4 个关键点+推杆，共 100 个 slot）。
  - **损失函数设计**：结合 token 交叉熵（带 label smoothing）和坐标的 Smooth-L1 损失。Kabsch 投影可以在测试时后处理（Pre-L1），也可以端到端反向传播（E2E-L1）。
- **训练/优化目标**: 最小化预测轨迹与真实轨迹的 Smooth-L1 距离（结合 Kabsch 投影），以及辅助的接触模式分类交叉熵。核心目的是准确预测轨迹几何形状，从而通过任务效用函数（Utility）对候选动作进行正确排序。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：ManiSkill3 PushT-v1（512 个测试 family，8192 次 rollout，评估决策遗憾 Regret 和 Top-1 准确率）和 lerobot/pusht（2384 个测试窗口，评估轨迹误差 MAP-ADE）。
  - **Baseline**：KV-cache 自回归模型、DDIM 扩散模型（10步/50步）、直接效用回归、接触模式分类器、VFlash-style CE head、MDN head 等。
- **评价指标**: 
  - **决策遗憾（Regret）**：最优动作的真实平均效用与模型选择动作的效用之差。
  - **轨迹误差（MAP-ADE）**：预测点与真实点的平均欧氏距离（px）。
  - **刚体误差（RB-Err）** 及违规率（RB-Viol）。
  - **延迟（Latency）**：单次决策（评估 4 个候选动作）的中位耗时。
- **主要结果**: 
  1. **坐标系选择收益巨大**：在物体坐标系下，所有解码器的决策遗憾降低了约 1.9x-2.2x，且样本效率提升约 4 倍（128 个 family 的物体坐标系模型匹敌 512 个 family 的世界坐标系模型）。
  2. **单遍解码碾压迭代解码**：在物体坐标系下，单遍 head 的遗憾低至 0.020-0.021，延迟仅 1.6-1.8ms；而 10 步 DDIM 扩散遗憾为 0.046（延迟 10.3ms），自回归遗憾为 0.059（延迟 12.9ms）。不同单遍 head（CE, Soft-L1, MDN）之间的遗憾无显著差异。
  3. **软 Token 期望 + Kabsch 投影效果最好**：Procrustes-FPD（E2E-L1 或 Pre-L1）在 ManiSkill3 上达到最低轨迹误差（11.35 px），且刚体误差严格为 0；在 lerobot/pusht 上误差降至 3.78 px。全面优于扩散模型（即使扩散跑满 50 步）。

### 43. 🔥 [Training Reasoning Models in Simulation to Natively Use Real Robots] (在仿真中训练推理模型以原生控制真实机器人)
- **研究机构**: `MIT (Massachusetts Institute of Technology) 等机构（致谢中提及 MIT-IBM Watson AI Lab, MIT Science Hub 等）`
- **Arxiv ID**: `2611.18562` | [点击跳转](https://arxiv.org/abs/2611.18562)

**0. 论文标题**
- **英文标题**: Training Reasoning Models in Simulation to Natively Use Real Robots
- **中文标题**: 在仿真中训练推理模型以原生控制真实机器人
- **研究机构**: MIT (Massachusetts Institute of Technology) 等机构（致谢中提及 MIT-IBM Watson AI Lab, MIT Science Hub 等）
- **一句话总结**: 抛弃外部工具链和示范数据，纯靠仿真环境下的强化学习训练开源推理模型，使其原生具备直接控制真实机器人的能力，并实现了极强的零样本泛化与 Sim-to-Real 迁移。

**1. 整体逻辑**
- **研究任务**: 训练通用机器人使用智能体（Robot-use agents, RUAs），让视觉语言模型直接通过观察相机图像和机器人状态，进行思维链推理并输出末端执行器位姿，从而控制机器人完成任务。
- **研究动机**: 目前强大的 RUA 性能被闭源前沿模型（如 GPT-6 Astra）垄断。开源模型要么依赖外部工具链（harness，如分割模型、技能库），限制了动作空间；要么依赖特定任务的示范数据微调（如 VLA），导致在面对新任务或新指令时泛化能力极差，只会“死记硬背”动作。
- **本质改动**: 彻底去掉所有外部感知工具、规划器和技能库（无 harness），且不使用任何示范数据（无 demonstrations），完全在仿真环境中通过多轮强化学习（RURL）训练开源推理模型，使其“原生”学会机器人控制。
- **技术溯源**: 基座模型为 Qwen3.8-27B；训练框架基于 veRL 和 LMCache 构建了 PEAR (Post-training Engine for Agentic Robotics)；强化学习算法采用 GRPO。

**2. 技术拆解**
- **核心方法**: 提出机器人使用强化学习（RURL）。模型在仿真中通过思维链（CoT）推理，直接输出 JSON 格式的末端执行器位姿变化量，由底层逆运动学和控制器执行。由于基础模型初始成功率极低，采用课程学习（Curriculum）策略，从简单任务逐步过渡到复杂任务，确保 RL 始终有有效的梯度信号。
- **关键细节**: 
  - **输入输出**：输入为相机图像和机器人状态（JSON），输出为 CoT 推理过程及动作（JSON 格式的位姿变化）。
  - **系统架构**：PEAR 系统支持长序列多轮异步 RL。利用 LMCache 将前缀 KV cache 卸载到 CPU，保持 95% 以上的缓存命中率；使用 FSDP + 序列并行 + 梯度检查点处理长达 256k token 的序列。
  - **规模与超参**：27B 参数模型；训练分三阶段（LIBERO 简单任务 -> LIBERO 全任务 -> RoboDojo 任务），共约 340 步；学习率 1e-6，Batch size 为 128 组（每组 8 个 rollouts），推理 effort 设为 xhigh。
- **训练/优化目标**: 最大化任务成功的期望奖励（二元奖励，成功为 1，失败为 0）。使用 GRPO 的组归一化优势估计，结合无 PPO 裁剪的 REINFORCE 策略损失；引入 score-centering 修正异步更新带来的策略偏移；丢弃全成功或全失败的组以提供有效学习信号。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：LIBERO, LIBERO-Plus, LIBERO-Pro, RoboDojo, RoboLab-120，以及真实的 YAM 双机械臂。
  - **Baseline**：闭源模型 GPT-6.1 Sol, GPT-6 Astra；开源 VLA 微调模型 $\pi_{0.5}$；RoboLab 榜单模型 (Cosmos3-Nano-Policy, DreamZero, GR00T N1.6)。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **仿真性能逼近闭源**：在 LIBERO 上，基础模型成功率仅 1.6%，训练后提升至 74.4%，接近 GPT-6 Astra (80.6%) 和 GPT-6.1 Sol (76.2%) 的 max effort 表现，并超过它们的 medium effort 表现。
  - **强鲁棒性与指令遵循**：在 LIBERO-Pro（改变任务目标或物体位置）中，依赖示范微调的 $\pi_{0.5}$ 成功率暴跌至 0.75%（任务改变）和 20.8%（位置改变），而本文模型仍保持在 57.4% 和 57.5%，证明其依靠推理理解指令，而非模仿固定动作。
  - **零样本迁移**：未参与训练的 LIBERO-Long 成功率达 39.0%；迁移到双机械臂环境 RoboDojo 和全新环境 RoboLab-120（37.3%），均显著优于基础模型和 $\pi_{0.5}$ (28.0%)。
  - **Sim-to-Real 零样本迁移**：在训练时未见过的真实双机械臂 YAM 上，最终模型成功率达 60%（18/30 次试验），基础模型为 0%。
  - **通用能力无损**：在 AIME、GPQA、LiveCodeBench 等 9 个推理、代码和视觉基准上，性能无显著下降（平均变化仅 -0.15 分），证明 RURL 可作为基础模型后训练的有效组件。

### 44. 🔥 [Vision-Language-Action Models: A Life-Cycle Survey of Design, Training and Deployment] (视觉-语言-动作模型：设计、训练与部署的生命周期综述)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.18372` | [点击跳转](https://arxiv.org/abs/2611.18372)

**0. 论文标题**
- **英文标题**: Vision-Language-Action Models: A Life-Cycle Survey of Design, Training and Deployment
- **中文标题**: 视觉-语言-动作模型：设计、训练与部署的生命周期综述
- **研究机构**: 原文未提及
- **一句话总结**: 本文系统梳理了视觉-语言-动作（VLA）模型在模型设计、训练和部署全生命周期的7个核心设计轴，定量对比了88项相关工作，揭示了数据规模扩充、模型参数两极分化及操作与导航走向统一等关键趋势，并指出了当前仿真评估体系的脆弱性与未来研究方向。

**1. 整体逻辑**
- **研究任务**: 全面综述和分类视觉-语言-动作（VLA）模型，构建涵盖模型设计、训练到部署的生命周期分类体系（Taxonomy），并统筹对比操作、导航、人形控制及世界-动作模型（WAM）。
- **研究动机**: VLA领域在不到四年内发展极快，现有综述往往只关注操作任务或特定架构，缺乏从全生命周期视角的系统性梳理；同时，对导航、人形控制、世界-动作模型的覆盖不足，且缺乏以数据为中心的定量分析，对当前评估基准的饱和与脆弱性问题也缺乏反思。
- **本质改动**: 提出了一套沿着VLA“生命周期”展开的7轴分类法（输入与记忆、架构、动作输出、中间预测、预训练数据、后训练、实时执行），将各类具身智能模型纳入统一框架进行定量与定性对比，并提供了面向研究者的实操指南。
- **技术溯源**: 基于 RT-1, RT-2, PaLM-E, Diffusion Policy, ACT, Open X-Embodiment 等 VLA 先驱工作，以及各类视觉-语言模型（VLM，如 PaliGemma, Eagle, Qwen-VL 等）和视频生成基础模型。

**2. 技术拆解**
- **核心方法**: 提出7个生命周期设计轴，对88篇论文（2022.12-2026.10）进行系统性拆解。重点提取并对比了22个主流模型在这些轴上的具体选择，统计了各模型的训练数据量、参数量、推理速度和硬件依赖。
- **关键细节**: 
  - **输入与记忆**：从单帧图像/语言/本体感觉，扩展到包含历史关键帧记忆或慢速上下文。
  - **架构**：分为单体（直接映射，如 RT-2, OpenVLA）、双系统（慢VLM+快动作模块联合训练，如 GR00T N1）、层级（VLM输出可解释的中间子任务/路径给底层策略，如 Hi Robot）。
  - **动作输出**：从离散文本 token，演进到扩散模型、流匹配（Flow Matching，当前主流如 π0），以及连续回归。
  - **规模与部署**：主流前沿模型在 3-7B 参数；新兴一批 <1B 参数模型（如 SmolVLA, VLA-Adapter）可在消费级 GPU 甚至 CPU 上运行。通过异步推理或实时分块（Real-Time Chunking）解决大模型推理延迟问题。
- **训练/优化目标**: 作为综述，总结了 VLA 优化目标的演进路线：从早期的离散动作 token 交叉熵损失（RT-2），到扩散模型的去噪损失（Diffusion Policy），再到当前主流的流匹配（Flow Matching）平滑优化，以及结合世界模型预测未来观测的联合预测损失。

**3. 实验结果**
- **实验设置**: 综述类工作无单一实验设置。对比了88项工作，涉及的仿真与真实世界基准包括 LIBERO, CALVIN, SimplerEnv, RoboCasa, VLABench, RoboTwin 2.0, R2R-CE/RxR-CE 等。
- **评价指标**: 任务成功率（仿真/真实世界）、推理延迟/吞吐量（Hz）、模型参数量、训练数据规模（episode 数或小时数）、鲁棒性（扰动测试下的成功率衰减）。
- **主要结果**: 
  1. **训练数据大幅扩充且来源多样化**：从约 1万小时遥操作数据（π0），扩展到 2.3万社区采集 episode（SmolVLA），以及 2万小时第一人称人类视频（GR00T N1.7）。
  2. **模型规模两极分化**：主流模型集中在 3-7B 参数，同时涌现出一批 <1B 参数、专为消费级硬件设计的轻量模型。
  3. **通用性增强**：操作与导航开始走向统一，如 UniVLA 和 Qwen-VLA 在单一模型中同时处理操作与导航任务。
  4. **评估体系暴露严重缺陷**：主流仿真基准（如 LIBERO）已近饱和（成功率达 97.1%~98.6%），且存在严重的脆弱性——在 LIBERO-PRO 中，物体位置轻微扰动会导致原本 90% 以上的成功率直接跌至 0%。文章呼吁引入扰动测试、分布式真实世界评估及标准化的数据/延迟报告规范。

### 45. 🔥 [ESI: An Embodied Self-Improvement Flywheel for LLM-VLA Agents] (ESI：一种用于 LLM-VLA 智能体的具身自我改进飞轮)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.18176` | [点击跳转](https://arxiv.org/abs/2611.18176)

**0. 论文标题**
- **英文标题**: ESI: An Embodied Self-Improvement Flywheel for LLM-VLA Agents
- **中文标题**: ESI：一种用于 LLM-VLA 智能体的具身自我改进飞轮
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个自动化飞轮系统，利用 LLM 与 VLA 在环境交互中的纠正与有效执行数据，联合更新 LLM 提示词、技能接口和 VLA 参数，解决模块化具身智能体的协同失败问题。

**1. 整体逻辑**
- **研究任务**: 解决大语言模型（LLM，作为推理/规划者）与视觉-语言-动作模型（VLA，作为执行者）组合时的协同失败问题，提升模块化具身智能体在复杂操作任务中的执行成功率。
- **研究动机**: 现有的 LLM+VLA 系统多为简单拼接，存在“意图鸿沟”（VLA 动作偏离 LLM 规划的子任务）和“交接鸿沟”（LLM 纠正物理状态后，VLA 接管时又破坏了恢复的状态）。现有系统过度依赖 LLM 在线干预，没有将交互经验转化为 VLA 的底层能力提升，导致推理算力浪费且底层动作能力无法进化。
- **本质改动**: 将 LLM 与 VLA 的“协作交互过程”本身作为监督信号，构建一个自动化飞轮。在保持 LLM 权重冻结的前提下，联合迭代更新 LLM 的 Prompt、共享技能目录和 VLA 的模型参数，实现从“模型级”到“系统级”的后训练。
- **技术溯源**: 基于 GPT-as-Policy 系统框架；推理模型使用 GPT-6 Astra；动作策略基座使用 $\pi_{0.5}$（基于 OpenPI/JAX 实现，采用 flow-matching 目标）；仿真环境使用 RoboDojo（双机械臂 ARX X5）。

**2. 技术拆解**
- **核心方法**: 提出 ESI（Embodied Self-Improvement）飞轮架构。通过定义“共享子任务接口”让 LLM 和 VLA 对齐意图；在在线交互中收集数据，提取“局部有效”的交互片段（包括 LLM 的纠正动作和 VLA 随后的成功延续，即使整个 episode 最终失败），用于闭环更新系统的三个核心组件（Prompt、技能、VLA 策略）。
- **关键细节**: 
  - *共享子任务接口*：LLM 输出结构化的子任务（如“左臂：抓取红块”），渲染为简洁指令作为 VLA 的条件输入。
  - *数据筛选与窗口构建*：使用 LLM 标注局部结果，保留有效的学生动作和教师纠正。构建时间连续的动作窗口（Horizon=50），允许控制权在 Teacher 和 Student 之间切换而不中断窗口，让策略学习如何从纠正状态恢复。
  - *经验回放*：采用递归混合策略（$\alpha=0.6$），当前轮次数据占 60%，历史数据占 40%，在吸收新经验的同时防止灾难性遗忘。
- **训练/优化目标**: 
  - *Prompt 与技能更新*：基于交互记录中的失败反思更新 LLM 决策指导（不更新 LLM 权重）；将频繁出现的自定义操作固化为标准化技能目录。
  - *VLA 优化目标*：使用带时间掩码的 Flow-Matching 损失函数（Masked flow-matching objective）。仅在有效的动作窗口内计算损失，无效和填充位置不参与梯度计算，确保策略只从局部有效的行为中学习。

**3. 实验结果**
- **实验设置**: 
  - *数据集/环境*：RoboDojo 仿真环境中的 10 个精选操作任务（如装箱、数字排序、分类等），每个任务 20 个 case。
  - *对比对象 (Baseline)*：单独的 $\pi_{0.5}$、单独的 GPT-6 Astra、RoboDojo 榜单上的其他混合/代码方法（如 GO-3 Nano Preview, HexaShell, WorldScape 等），以及 Matched baseline（未使用飞轮更新的原始 GPT-as-Policy + 初始 VLA）。
- **评价指标**: Score（0-100，衡量任务进度）和 Success Rate / SR（衡量任务完全成功率）。
- **主要结果**: 
  - ESI 在 10 个任务上的平均 Score 达到 62.03，平均 SR 达到 49.41%，全面超越所有参考方法（包括榜单参考中表现最好的 GO-3 Nano Preview 的 47.27 Score 和 36.60% SR）。
  - 相比 Matched baseline，ESI 的 SR 提升了 19.74 个百分点，Score 提升了 16.36。
  - 控制成本显著降低：相比 baseline，LLM（教师）每集干预决策减少 41.20%，LLM 直接执行的动作步数减少 46.65%，证明 VLA 接管了更多底层执行。
  - 泛化与意图遵循：在未参与飞轮训练的“解方程”任务和改变操作顺序的任务中，ESI 成功率更高，且 LLM 干预步数大幅减少（减少 55%~77%），验证了策略真正学到了组合意图遵循能力，而非死记硬背执行序列。

### 46. 🔥 [Objectives as Policies: Vision-Language Model Cost Programs for Contact-Rich Manipulation] (目标即策略：用于接触丰富操作的视觉语言模型代价程序)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.18298` | [点击跳转](https://arxiv.org/abs/2611.18298)

**0. 论文标题**
- **英文标题**: Objectives as Policies: Vision-Language Model Cost Programs for Contact-Rich Manipulation
- **中文标题**: 目标即策略：用于接触丰富操作的视觉语言模型代价程序
- **研究机构**: 原文未提及
- **一句话总结**: 提出 OaP 框架，让 VLM 生成并基于仿真反馈迭代修改多阶段 MPC 代价程序，从而在无需训练的情况下实现开放世界的接触丰富操作。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人桌面操作任务（如抓取、推、放置、工具使用等）。
- **研究动机**: 端到端 VLA 模型缺乏显式物理模型，难以处理复杂接触动力学；传统 MPC 需要人工硬编码奖励和约束，无法泛化到开放世界；现有结合 VLM 和 MPC 的方法要么忽略接触动力学（如假设刚体运动），要么需要极高频地调用大模型（如 1Hz 更新），计算成本高且难以落地。
- **本质改动**: 不让 VLM 直接输出动作或复杂的 3D 约束，而是让 VLM 生成一个“可编辑的目标程序”（由预定义代价库组合而成的多阶段代价函数和完成条件），并在数字孪生中通过 MPC 仿真 rollout 的反馈来迭代修改该程序，最后部署到真机。
- **技术溯源**: 视觉语言模型 (GPT-5.6-sol)、基于采样的模型预测控制 (MPPI)、物理仿真器 (MuJoCo / MuJoCo-warp)、3D 重建与位姿估计 (SAM 3D, Any6D, FoundationPose)。

**2. 技术拆解**
- **核心方法**: OaP (Objectives as Policies) 框架。核心流程包含三步：1) 从真实场景构建数字孪生；2) VLM 生成目标程序草稿并自我审查，随后在数字孪生中通过 MPC 仿真执行，利用失败反馈迭代优化程序；3) 将优化后的程序部署到真机，由共享的采样 MPC 控制器执行。
- **关键细节**: 
  - **目标程序 (Objective Program)**: 将任务分解为多个阶段，每个阶段包含运行代价、终端代价、权重和完成阈值。代价项来自一个固定的参数化代价库（包含几何误差、接触/抓取状态指示器、夹爪命令等），限制了搜索空间同时保留了组合灵活性。
  - **数字孪生 (Real-to-Sim)**: 用 SAM 3D 和 Any6D 从 RGB-D 重建物体 mesh 和位姿，用 VLM 估计密度和摩擦系数。真机执行时用 FoundationPose 追踪位姿。
  - **MPC 控制**: 采用 MPPI 算法，在 MuJoCo-warp 中并行 rollout，无需接触动力学梯度。
  - **VLM 迭代优化**: VLM 先根据指令生成草稿并自我审查（检查阶段连贯性和冲突）。然后在仿真中执行，若失败，将执行轨迹的统计信息（6个均匀采样的状态记录）反馈给 VLM 修改程序，迭代直到成功或达到预算。
- **训练/优化目标**: 无模型训练（VLM 权重不更新）。MPC 的优化目标是最小化目标程序定义的复合代价函数（包含运行代价、终端代价和物理惩罚项，如控制变化、关节速度、过大接触力等）。

**3. 实验结果**
- **实验设置**: 
  - **硬件**: Flexiv Rizon 4s 机械臂 + GN01 夹爪 + ZED 2i RGB-D 相机。
  - **任务**: 4个桌面操作任务（Pick-and-place, Cup reorientation, Direct push, Push with Tool）。
  - **Baselines**: L2R, ReKep, CoRAL, OpenVLA-OFT, $\pi_{0.5}$。
- **评价指标**: 任务成功率（基于固定的、独立于生成阈值的任务特定标准）。
- **主要结果**: 
  - **仿真表现**: OaP 在最多 2 轮反馈下达到 90% 成功率，5 轮达到 97.5%。显著优于 L2R (27.5%)、ReKep (42.5%)、OpenVLA-OFT (0%) 和 $\pi_{0.5}$ (25%)。相比最接近的 CoRAL (77.5%)，OaP 成功率更高且无需 1Hz 的高频 LLM 调用。消融实验证明，代价库和自我审查机制对首轮及整体成功率提升至关重要。
  - **真机表现**: 将仿真成功的程序直接部署到真机（带有物体位置扰动），总体成功率达 80% (32/40)。失败主要由于 VLM 估计的摩擦系数不准导致抓取打滑，以及仿真未考虑真实物体的形变（仿真假设刚体）。

### 47. 🔥 [Beyond Prediction Gain: LASR as a Metric for Action-Grounded Latents in World Models] (超越预测增益：LASR 作为世界模型中动作接地潜在变量的评估指标)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.17775` | [点击跳转](https://arxiv.org/abs/2611.17775)

**0. 论文标题**
- **英文标题**: Beyond Prediction Gain: LASR as a Metric for Action-Grounded Latents in World Models
- **中文标题**: 超越预测增益：LASR 作为世界模型中动作接地潜在变量的评估指标
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种名为 LASR 的无量纲评估指标，通过对比状态、潜在动作和非动作捷径的预测风险，来严格衡量世界模型中的潜在变量是否真正编码了动作信息。

**1. 整体逻辑**
- **研究任务**: 评估世界模型（World Models）中从视频或轨迹无监督学习到的“潜在动作”（Latent Actions）是否真正包含了动作相关的预测信息，而非仅仅拟合了状态或场景的预测捷径。
- **研究动机**: 现有的评估指标（如预测损失、重建质量、下游成功率）无法区分预测性能的提升是来自于潜在动作真正的动作信息，还是来自于当前状态、episode 进度或场景身份等非动作捷径（shortcuts）。此外，评估模型本身的容量差异也会混淆结果，导致“预测增益”不能直接等同于“动作信息”。
- **本质改动**: 将潜在动作的评估转化为一个受控的指标设计问题。提出 LASR 指标，通过强制要求“潜在动作路径”的预测风险必须低于“纯状态路径”和“非动作控制变量路径”中的较小者，从而在数学上隔离出真正的动作支持。
- **技术溯源**: 基于现有的潜在动作模型（DiLA, UniVLA, MVP-LAM, LAPA, LaWAM），在机器人和仿真数据集上进行评估，理论基础涉及条件贝叶斯风险分解（Conditional Bayes-risk identity）。

**2. 技术拆解**
- **核心方法**: 提出 LASR (Latent Action Support Ratio) 指标。构建三条匹配的预测路径：状态路径（仅用当前状态 $S$）、潜在路径（用 $S$ + 潜在动作 $Z$）、控制路径（用 $S$ + 非动作变量 $b$，如 episode 进度或身份）。LASR 分数定义为：潜在路径的预测风险除以状态路径和控制路径预测风险的最小值。
- **关键细节**: 
  - 输入输出：输入为当前状态 $S_t$、潜在表示 $Z_t$、非动作控制变量 $b$；输出为动作相关目标 $Y_\tau$（如记录的真实物理动作 $A_t$ 或单步物理状态变化 $S_{t+1}-S_t$）。
  - 模型结构：三条路径使用相同家族的仿射岭回归预测器（affine ridge predictor），均方误差（MSE）作为损失函数，确保模型容量一致。
  - 聚合指标：提供 GeoLASR（几何平均，反映典型支持）和 WorstLASR（最大值，暴露最弱情况）。分数小于 1 表示潜在路径优于两个参考路径。
- **训练/优化目标**: 
  - 作为评估指标时，无训练目标，直接计算 held-out 测试集上的风险比值。
  - 作为训练代理时，使用 LASR 启发的代理损失函数训练一个轻量级残差适配器。优化目标是最小化对数风险比值，同时通过正则项惩罚对原始潜在表示的过大偏离。

**3. 实验结果**
- **实验设置**: 
  - 数据集：49 个 ALOHA 静态电池释放演示（2048 个对齐的 transition），以及匹配的 5 任务 ManiSkill3 仿真面板。
  - 对比对象（baseline）：5 个冻结的潜在动作模型（DiLA, UniVLA, MVP-LAM, LAPA, LaWAM），以及记录的真实动作（作为正对照），和随机/打乱/纯状态等负对照。
- **评价指标**: LASR 分数（GeoLASR 和 WorstLASR，越低越好，<1 为通过），下游的单步物理回放分支准确率（Branch accuracy），以及世界模型预测指标（DINO, SSIM, LPIPS）。
- **主要结果**: 
  - LASR 成功检测到真实动作的预测支持（WorstLASR < 1），并拒绝了非动作捷径。
  - 在 5 个模型中，DiLA 表现最好（GeoLASR 0.750），UniVLA 和 MVP-LAM 未能通过 LASR 边界（>1）。GeoLASR 排序与单步物理回放的分支准确率高度一致（Spearman $\rho=0.810$）。
  - 使用 LASR 启发的代理目标训练的残差适配器，在点估计上进一步降低了 LASR 分数，并在冻结世界模型预测中一致提升了 DINO、SSIM 和 LPIPS 指标。

### 48. 🔥 [Learning Latent Goal Costs for Visual World-Model Planning with an Expanding Curriculum] (通过扩展课程学习视觉世界模型规划的潜在目标代价)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.17529` | [点击跳转](https://arxiv.org/abs/2611.17529)

**0. 论文标题**
- **英文标题**: Learning Latent Goal Costs for Visual World-Model Planning with an Expanding Curriculum
- **中文标题**: 通过扩展课程学习视觉世界模型规划的潜在目标代价
- **研究机构**: 原文未提及
- **一句话总结**: 在冻结的视觉世界模型中，通过一个基于扩展课程学习训练的小型残差适配器来修正预训练视觉特征的潜在目标代价，从而大幅提升存在障碍物环境下的图像目标规划成功率。

**1. 整体逻辑**
- **研究任务**: 基于冻结视觉世界模型的图像目标规划（Image-goal planning），即智能体根据目标图像在潜在空间中规划动作序列，以控制自身到达目标视觉状态。
- **研究动机**: 预训练视觉编码器（如 I-JEPA、DINOv2）提取的特征在局部（靠近目标时）能提供有用的规划信号，但在全局上，视觉相似性不等于实际可达性。例如，被墙隔开的两个状态视觉距离很近，但实际很难到达。这导致基于原始潜在距离（如 MSE）的规划器在障碍物环境中容易被视觉相似性误导，陷入局部最优或超时失败。
- **本质改动**: 保持预训练视觉编码器和世界模型完全冻结，仅在规划器的代价计算路径上引入一个小型残差适配器。利用智能体自身从近到远扩展的规划轨迹，提取状态访问的时间顺序作为弱监督信号来训练该适配器，从而将“视觉相似度”修正为符合物理可达性的“实际进度”。
- **技术溯源**: 基于预训练视觉编码器 I-JEPA (ViT-H/14)、基于 Transformer 的潜在空间世界模型（World Model），以及交叉熵方法（CEM）规划器。

**2. 技术拆解**
- **核心方法**: 提出一种任务无关的扩展课程学习（expanding curriculum）方法来拟合潜在目标代价适配器。从靠近目标的区域（Band 1）开始收集轨迹，利用成功轨迹中状态访问的时间先后顺序（后访问的状态代价应更低）构建排序损失来训练适配器；随后逐渐扩大起始状态区域（Band 2, 3...），用更新后的适配器指导下一阶段的轨迹收集，循环迭代。
- **关键细节**: 
  - **输入输出与结构**：输入为 I-JEPA 提取的 1280 维 patch embeddings（256 个 patch）。适配器是一个共享的残差多层感知机（MLP），带 64 维 bottleneck，初始化为恒等映射，独立应用于每个空间 embedding。
  - **系统架构**：适配器仅作用于规划器计算目标代价的路径上，世界模型和编码器接收的原始 embedding 保持不变且全程冻结。
  - **轨迹处理**：对成功轨迹，直接使用时间顺序构建对比对；对失败轨迹，通过计算其与成功路线的潜在代价接近度进行排序来构建对比对。同时过滤掉轨迹中的循环和未变化的观察帧。
- **训练/优化目标**: 排序损失函数（Ranking loss）。对于一对状态 $(e, l)$（$e$ 为较差/较早状态，$l$ 为较好/较晚状态），优化目标为 $\mathcal{L}_{\rm rank} = \max\{0, m + d_\theta(e, l, g)\}$，其中 $d_\theta$ 是两者适配后到目标的潜在代价差，$m$ 是边际值。全程不使用任何专家定义的进度标签（如测地距离）。

**3. 实验结果**
- **实验设置**: 在 DotWall（带墙和门的房间）和 PointMaze（U型迷宫）两个 2D 导航环境中进行。对比基线（baseline）为使用原始 I-JEPA 潜在 MSE 代价的 CEM 规划器。测试包含 50 个匹配用例（相同的起点、终点、世界模型和规划器设置），以及 16 个未见过的 DotWall 布局泛化测试。
- **评价指标**: 闭环规划成功率（Success rate）；潜在代价排序与最短合法路径排序的一致性（Map-wide pair ordering, Opposite-room pair ordering, Spearman $\rho$）。
- **主要结果**: 
  - 在 DotWall 的 50 个匹配用例中，成功率从基线的 54% 提升至 98%（特别是跨房间的成功率从 24% 提升至 96%）。
  - 在 PointMaze 的 50 个匹配用例中，成功率从 82% 提升至 96%（绕障成功率显著提升）。
  - 在 16 个未见过的 DotWall 布局上，适配后的潜在代价与最短合法路径的全局排序一致性从 71.9% 提升至 85.8%，跨房间排序一致性从 48.5% 提升至 77.1%，证明其学到的代价场具有良好的几何泛化能力。
