            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Splat2Act: From Captured Scenes to Personalized VLA Manipulation] (Splat2Act：从捕获场景到个性化视觉-语言-动作操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13945` | [点击跳转](https://arxiv.org/abs/2610.13945)

**0. 论文标题**
- **英文标题**: Splat2Act: From Captured Scenes to Personalized VLA Manipulation
- **中文标题**: Splat2Act：从捕获场景到个性化视觉-语言-动作操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出Splat2Act自动化流水线，仅用手机扫描大尺度室内场景和物体照片，即可在仿真中自动发现抓取点并生成演示数据，从而将通用VLA策略个性化适配到特定的真实环境中。

**1. 整体逻辑**
- **研究任务**: 将通用的视觉-语言-动作（VLA）操作策略个性化适配到用户特定的室内场景和物体集合中，解决通用模型在特定新环境中抓取成功率极低的问题。
- **研究动机**: 通用VLA（如 $\pi_{0.5}$）在用户真实环境中未经适配时抓取成功率为0%。现有个性化方法依赖昂贵的人工遥操作演示；而现有的real-to-sim方法通常只局限于单张桌面级别，且仍需人工标注或演示，难以扩展到大尺度全屋环境。
- **本质改动**: 将real-to-sim-to-real的尺度从“单桌面”扩展到“建筑级室内环境”，并实现全自动化。无需人工遥操作或标注，仅靠手机扫描场景和物体照片，就能自动发现可放置区域（receptacles）、构建任务并用特权仿真Oracle生成演示数据。
- **技术溯源**: 基于3D Gaussian Splatting (3DGS) 进行场景高保真重建，基于Habitat Simulator和Isaac Sim进行物理仿真，基座策略为预训练的 $\pi_{0.5}$ (VLA模型)，使用Objaverse和SAM3D生成3D物体资产。

**2. 技术拆解**
- **核心方法**: 包含四个自动化步骤：1) 场景与物体表示：用3DGS重建场景获取视觉，提取mesh用于碰撞和导航；用公开资产或单图生成物体3D模型。2) 容器发现与任务组装：基于mesh提取地平面，聚类向上的表面作为候选容器，结合机器人导航网格和可达范围过滤出有效放置点。3) 演示生成：使用特权状态几何Oracle在并行仿真环境中自动规划抓取轨迹，生成成功演示。4) 两阶段策略微调：Stage 1用同场景或百个场景的数百个公开物体资产进行广泛适配；Stage 2用用户自己的物体在目标场景进行个性化微调。
- **关键细节**: 输入为手机扫描的RGB-D视频（20-30分钟）及目标物体的单张图片和尺寸。系统处理了101个校园建筑级场景（中位可导航面积104.87平方米），发现852个容器，生成超68,000条抓取演示。动作空间为10维Stretch机器人动作空间（含手臂、升降、手腕、夹爪、底盘等），每次预测10步动作chunk。真机部署使用Hello Robot Stretch 3，通过单张A40 GPU远程推理，控制频率20Hz。
- **训练/优化目标**: 使用条件流匹配（conditional flow matching）目标进行监督微调（SFT）。损失函数为监督流匹配损失，将带噪动作chunk映射向Oracle动作chunk。训练时全微调PaliGemma语言骨干和动作专家，冻结SigLIP图像编码器以保留视觉语义先验。

**3. 实验结果**
- **实验设置**: 在101个扫描场景生成的数据集上进行。评估在两个部署场景（Office和Conference）进行，包含Easy（无干扰物）和Hard（有干扰物）条件。对比基线包括预训练的 $\pi_{0.5}$ 基座模型、直接进行Stage 2微调的模型，以及不同Stage 1数据来源（单场景Office1k vs 多场景Multi1k）的模型。
- **评价指标**: 聚合抓取成功率（Aggregate pickup success rate, SR），即成功抓取并终止的episode比例。
- **主要结果**: 预训练 $\pi_{0.5}$ 在目标场景成功率为0%。两阶段微调效果最佳：同场景广泛适配（Office1k）加个性化在Office场景达到最高聚合成功率62.5%，比直接从基座微调高17.5个百分点。Sim-to-Real迁移方面，在Office的12个任务子集上，仿真成功率66.7%，真机成功率63.9%，差距在8%以内。此外，跨场景个性化会损害性能，而多场景广泛适配（Multi1k）能提供一定的分布外（OOD）鲁棒性。

### 2. 🔥 [Dream to Remember: Continual Steering of Generalist Robot Policies with World Models] (梦想以铭记：利用世界模型对通用机器人策略进行持续引导)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13816` | [点击跳转](https://arxiv.org/abs/2610.13816)

**0. 论文标题**
- **英文标题**: Dream to Remember: Continual Steering of Generalist Robot Policies with World Models
- **中文标题**: 梦想以铭记：利用世界模型对通用机器人策略进行持续引导
- **研究机构**: 原文未提及
- **一句话总结**: 提出 D2R 方法，利用冻结的世界模型在“想象”中排练旧任务来约束引导模块，从而在不使用经验回放的情况下，持续引导冻结的通用机器人策略学习新任务且避免遗忘。

**1. 整体逻辑**
- **研究任务**: 通用机器人策略的持续学习（Continual learning），即在按顺序到达的新任务上不断提升策略能力，同时避免灾难性遗忘。
- **研究动机**: 现有的强化学习改进方法（微调策略权重或训练引导模块）在顺序学习新任务时会产生灾难性遗忘。微调会破坏旧任务性能，而仅引导输入噪声则会将遗忘转移到共享的引导模块上。
- **本质改动**: 引入冻结的预训练世界模型，通过在“想象”中回放旧任务来约束引导模块，替代了传统的经验回放缓冲区（replay buffer），实现了无遗忘的持续引导。
- **技术溯源**: 生成式通用机器人策略（如 $\pi_0$）、预训练世界模型（如 A2World）、策略输入噪声引导（Steering）技术。

**2. 技术拆解**
- **核心方法**: Dream to Remember (D2R)。在引导模块学习新任务时，利用冻结的世界模型生成旧任务的想象轨迹（imagined rollouts）进行排练，以此将引导模块锚定在其早期行为上，防止遗忘。
- **关键细节**: 包含两种自适应工作模式：1) 当世界模型足够准确时，新任务的学习也完全在世界模型的“想象”中进行（无需真实环境交互）；2) 当世界模型不够准确时，新任务在真实环境中学习，世界模型仅用于排练旧任务。整个过程中，通用策略和世界模型的权重保持冻结，仅训练小型的引导模块来操纵生成策略的输入噪声。
- **训练/优化目标**: 引导模块的优化目标包含两部分：一是在真实环境或想象环境中最大化新任务的收益；二是利用世界模型生成的旧任务想象轨迹计算约束损失，使引导模块的行为与学习新任务前保持一致。

**3. 实验结果**
- **实验设置**: 测试场景包括 CALVIN 数据集、LIBERO-90 任务套件以及真实的 Franka 机器人环境。对比的 baseline 包括 LoRA 微调。使用的冻结基座模型为通用策略 $\pi_0$ 和世界模型 A2World。
- **评价指标**: 任务平均成功率（Average success rate），以及持续学习过程中旧任务性能的保持情况。
- **主要结果**: 
  1. 在 CALVIN 上按顺序学习 8 个任务（完全在想象中进行），平均成功率从 63.7% 提升至 74.8%，而相同序列下的 LoRA 微调导致成功率暴跌至 11.7%。
  2. 在 LIBERO-90 任务中，在真实环境学习新任务的同时，完美保持了 $\pi_0$ 在原有 LIBERO 套件上的性能（尽管此时世界模型不够准确，仅用于排练旧任务）。
  3. 在真实 Franka 机器人上，完全在想象中按顺序改进了 3 个任务，并成功保留了早期的改进效果。

### 3. 🔥 [Dual-Stream Memory for Vision-Language-Action Policies] (面向视觉-语言-动作策略的双流记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13262` | [点击跳转](https://arxiv.org/abs/2610.13262)

**0. 论文标题**
- **英文标题**: Dual-Stream Memory for Vision-Language-Action Policies
- **中文标题**: 面向视觉-语言-动作策略的双流记忆
- **研究机构**: 原文未提及
- **一句话总结**: 给VLA模型加了一个“双流记忆”模块，用GDN压缩执行进度，用阈值检索挑出关键历史帧并做多尺度融合，解决了长视野任务中“记不住执行阶段”和“找不到历史视觉细节”的问题。

**1. 整体逻辑**
- **研究任务**: 长视野机器人操作（Long-horizon manipulation）。这类任务经常遇到“当前画面看起来一样，但因为执行阶段不同需要做不同动作”（如重复抓取），或者“目标被遮挡过，需要找回之前的视觉证据”（如目标重识别）的情况。
- **研究动机**: 现有的VLA模型不知道该怎么存历史记忆。如果用循环网络压缩，会丢掉用来认目标的视觉细节；如果均匀采样或存全历史，又容易漏掉一闪而过的关键证据，或者因为空间池化丢掉细节。
- **本质改动**: 把记忆拆成“时间”和“空间”两条流。时间流只负责记“执行进度”，空间流负责存“关键历史画面的细节”。
- **技术溯源**: 策略基座是 RoboMME 的 $\pi_{0.5}$（Gemma + flow-matching action expert）。视觉特征用了 DINOv3 和 SigLIP，文本用了 MiniLM，时间压缩用了 Gated DeltaNet (GDN)。

**2. 技术拆解**
- **核心方法**: 
  1) 时间流（执行上下文）：用6层GDN把DINOv3提取的历史全局token压缩成1个512维向量，再映射成1个时间token。通过预测“执行进度”和“动作条件特征重构”来监督它，让它记住当前处于任务的哪个阶段。
  2) 空间流（视觉证据）：用SigLIP提取patch特征，结合MiniLM的文本query算相关性得分。只保留得分大于0.6的帧（阈值检索）。对保留下来的帧，把16x16的特征池化到8x8、4x4、2x2，做线性多尺度融合，每帧固定输出16个1024维的空间token。
- **关键细节**: 
  - 训练分两步：第一步冻结其他模块，只预训练GDN；第二步冻结GDN，联合训练检索器和 $\pi_{0.5}$ 策略。
  - 策略集成：在action expert的每一层，用交叉注意力分别读取空间token和时间token，然后通过一个门控机制（gated sum）融合进动作表征里。
  - 空间流的帧数不固定，取决于超过阈值的帧数；时间流固定输出1个token。
- **训练/优化目标**: 
  - 阶段一（GDN预训练）：进度预测损失（SmoothL1） + 动作条件特征重构损失（余弦+MSE） + 锚点损失 + SIGReg正则化损失。
  - 阶段二（联合训练）：动作损失 + 检索损失（包含patch级和关键帧interval级的交叉熵损失）。

**3. 实验结果**
- **实验设置**: 
  - 数据集/任务：RoboMME 的 16 个仿真任务（分 Counting, Permanence, Reference, Imitation 四类），以及 4 个真实机器人任务（Pick×3, Swing×2, RePick, Shell）。
  - 对比对象（baseline）：无记忆的 $\pi_{0.5}$、NativeMEM、FrameSamp+Modul。
- **评价指标**: 任务成功率（TSR）。
- **主要结果**: 
  - 仿真环境：16个任务平均 TSR 49.22%，比 FrameSamp+Modul (44.51%) 提升 4.71 个百分点，比 NativeMEM (20.54%) 和无记忆基线 (17.93%) 高很多。14个单项任务和所有4个suite均值都有提升。
  - 真实机器人：4个任务平均 TSR 62.5%，比 FrameSamp+Modul (37.5%) 提升 25 个百分点。在需要区分执行阶段的重复动作任务（Pick×3, Swing×2）上提升巨大（分别达到80.0%和93.3%）。但在需要跨交互跟踪目标身份的 Shell（杯子交换）任务上掉点了（从53.3%降到40.0%），说明显式的身份追踪还是个未解决的坑。

### 4. 🔥 [Beyond Actions: Learning Future Operation Targets for Vision-Language-Action Models] (超越动作：为视觉-语言-动作模型学习未来操作目标)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13212` | [点击跳转](https://arxiv.org/abs/2610.13212)

**0. 论文标题**
- **英文标题**: Beyond Actions: Learning Future Operation Targets for Vision-Language-Action Models
- **中文标题**: 超越动作：为视觉-语言-动作模型学习未来操作目标
- **研究机构**: 原文未提及
- **一句话总结**: 提出 AFCE 方法，将 VLA 模型的预测目标从“未来动作”改为由动作、机器人状态和视觉变化共同构建的“未来物理效果(Effect)”，显著提升了双臂灵巧操作的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作 (VLA) 模型在机器人灵巧操作（单臂与双臂）中的策略学习。
- **研究动机**: 传统 VLA 直接预测动作 chunks，但动作只描述了“命令了什么”，没描述“改变了什么”。在灵巧操作中，接触和手部构型会导致相似动作产生不同结果，直接预测动作难以让模型理解任务相关的物理进展。
- **本质改动**: 把 VLA 的预测目标从“未来动作”改成了“未来物理效果 (Effect)”。让模型先预测“动作执行后环境和机器人会发生什么物理改变”，推理时再通过解码器把这个 Effect 还原成具体的动作。
- **技术溯源**: 基于 flow-matching VLA 架构（具体为 $\pi_{0.5}$），视觉特征提取使用了冻结的 DINOv3。

**2. 技术拆解**
- **核心方法**: Action-Future Coupled Effect Learning (AFCE)。分为两阶段：Stage I 离线训练一个 Effect tokenizer，融合多模态未来证据生成 Effect tokens；Stage II 训练 VLA 预测该 Effect，并用状态条件解码器将其转换为动作。
- **关键细节**: 
  - **输入输出**：Stage I 输入为执行动作、机器人实际响应（状态变化）、稀疏视觉变化，输出为时序 Effect tokens（如 $30 \times 256$）。Stage II 输入为当前图像、语言指令、机器人状态，输出为归一化 Effect，最终解码为动作 chunks。
  - **模型结构**：Stage I 使用 cross-attention 和 temporal Transformer 融合多模态特征。Stage II 复用 $\pi_{0.5}$ 的 flow-matching 骨干网络，配合一个 state-conditioned 的 action decoder。
  - **跨具身设计**：使用特定于具身的 adapters（单臂/双臂）来映射不同维度的原生状态和动作，但中间共享同一个 Effect 表示空间。
- **训练/优化目标**: 
  - **Stage I (Tokenizer)**：联合重建损失。包括动作重建损失（Grouped Huber loss + SO(3) 弦长损失）、机器人状态重建损失、稀疏视觉重建损失，确保 Effect 既保留可执行细节又包含物理变化。
  - **Stage II (Policy)**：Flow-matching 损失（预测速度场） + 辅助动作损失（Ground-truth-action loss 和 finger-difference loss，用于约束解码后的动作精度和手指关节的连续性）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DexJoCo（包含 6 个单臂和 5 个双臂灵巧操作任务，使用 rand-obj 随机化设置）。
  - **对比对象 (Baseline)**：$\pi_{0.5}$（官方多任务 checkpoint）和 UVT。
- **评价指标**: 任务成功率 (Success rate, %)。
- **主要结果**: 
  - **总体表现**：AFCE 总体成功率达 50.97%，比 $\pi_{0.5}$ (39.15%) 提升 11.82 个百分点，比 UVT (35.76%) 提升 15.21 个百分点。
  - **双臂任务**：在全部 5 个双臂任务上均取得最优，平均成功率 37.33%（$\pi_{0.5}$ 为 9.73%，UVT 为 14.53%），在 Microwave 和 Photograph 等任务上提升极其显著。
  - **单臂任务**：平均成功率 62.33%，略低于 $\pi_{0.5}$ 的 63.67%，但高于 UVT。在需要精细控制的单臂任务（如 Pinch Tongs）上存在明显的性能退化（5.33% vs $\pi_{0.5}$ 的 43.33%），说明该方法在极精细的单指/单臂控制上仍有局限。

### 5. 🔥 [Grounded-Dreamer: Robot Learning from World Model Synthetic Data with Physical Grounding] (Grounded-Dreamer：基于物理落地的世界模型合成数据进行机器人学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13164` | [点击跳转](https://arxiv.org/abs/2610.13164)

**领域与类型**: 具身智能 / 机器人学习 | 方法创新 / 系统工程

**0. 论文标题**
- **英文标题**: Grounded-Dreamer: Robot Learning from World Model Synthetic Data with Physical Grounding
- **中文标题**: Grounded-Dreamer：基于物理落地的世界模型合成数据进行机器人学习
- **研究机构**: 原文未提及
- **一句话总结**: 作为具身智能领域的方法创新与系统工程工作，本文提出一个无需人类演示的机器人数据合成框架，通过将视频世界模型与物理模拟器结合并进行闭环验证，生成既视觉逼真又物理合理的操作轨迹数据。

**1. 整体逻辑**
- **研究任务**: 解决机器人操作策略学习中，高质量、带动作标签的大规模数据收集成本高昂且难以扩展的问题，实现无需人类遥操作演示的机器人数据合成。
- **研究动机**: 现有数据源各有短板：真实遥操作太贵；仿真数据有视觉 sim-to-real gap；人类视频没动作标签。而直接用预训练视频世界模型（如 Cosmos）生成机器人视频，会产生严重的“物理幻觉”（如物体穿模、运动学 invalid），生成的视频没法直接用来训策略。
- **本质改动**: 把视频世界模型的“视觉逼真度”和物理模拟器的“物理真实性”结合起来。用仿真数据微调世界模型时做背景掩码，生成视频后再扔回仿真器里做闭环重放验证，把物理上不合理的“幻觉”轨迹过滤掉。
- **技术溯源**: 视频世界模型 Cosmos-Predict 2.5，逆动力学模型 IDM，图像编辑模型 Nano Banana 2，仿真环境 Lehome / Isaac Sim，3D重建 SAM3D，相机标定 FEEPE，策略基座 Diffusion Policy (DP) 和 π_0.5。

**2. 技术拆解**
- **核心方法**: 包含四个阶段的自动化流水线：1) 面向任务的仿真重建：从少量真实图像重建场景和物体；2) 仿真数据收集与交互感知掩码：在仿真里自动跑轨迹，掩码掉无关背景来微调世界模型和 IDM；3) 初始帧合成：把仿真物体和真实背景融合，生成多样化的初始帧；4) 数据合成与闭环验证：用世界模型生成操作视频，用 IDM 提取动作，最后把动作扔回仿真器里重放，只保留成功的轨迹。
- **关键细节**: 
  - **仿真重建**：用 FEEPE 标定相机外参，用 SAM3D 重建刚体和关节物体。
  - **交互感知掩码**：微调 Cosmos 和 IDM 时，只保留机械臂和交互物体，屏蔽背景，让模型专注学交互动态。
  - **初始帧合成**：用 Nano Banana 2 把掩码后的仿真物体贴到真实背景上，并随机改变光照和桌面纹理来增加多样性。
  - **闭环验证**：在重建的仿真环境里重放 IDM 提取的动作，根据任务是否成功来过滤掉物理不一致的轨迹。
  - **规模与超参**：Cosmos 微调用 8 张 A800，batch size 32，迭代 1400-2000 次；IDM 训练用 8 张 A800，batch size 512，5000-10000 步。每个任务收集 100-150 条仿真轨迹用于微调，生成 50 条用于策略训练。
- **训练/优化目标**: 
  - **Cosmos 微调**：基于掩码后的仿真视频数据优化视频生成（原文未提及具体损失函数）。
  - **IDM 训练**：基于仿真轨迹优化动作预测（使用 flow-matching action head）。
  - **策略训练**：使用合成的 (图像, 动作) 轨迹对，优化 Diffusion Policy 或 π_0.5 策略网络。

**3. 实验结果**
- **实验设置**: 
  - **任务**：7 个真实世界操作任务（Pick, Close Drawer, Press Button, Pick and Place, Put in Drawer, Sweep Trash, Slice Sausage）。
  - **硬件**：Franka Emika 机械臂 + Panda 夹爪，Intel RealSense D405 相机，RTX 4090 推理。
  - **对比对象**：Sim-only（纯仿真数据），Real-only（50 条真实人类演示），Low-data Real（5 条真实数据），RIGVid（基于视频世界模型提取手部动作的 baseline），Co-training（5 条真实 + 50 条合成数据）。
- **评价指标**: 任务成功率（Success Rate），每个任务进行 20 次或 30 次试验。
- **主要结果**: 
  - 仅用合成数据（GD data）训练的策略，成功率与用 50 条真实数据（Real-only）训练的相当（例如 Press Button 任务上 π_0.5 均达到 75%）。
  - 在 OOD（分布外）场景下，合成数据训练的策略泛化能力远超真实数据（原文指出 Real-only 平均成功率跌至 7.1% 和 16.4%，而合成数据保持在 30%-60% 的较高水平）。
  - Co-training（少量真实 + 合成）效果最好，超越了纯合成和纯真实数据。
  - RIGVid baseline 表现很差（成功率 0-25%），因为手部姿态提取不准和视角抖动。
  - 消融实验证明：交互感知掩码（去掉后成功率暴跌至 0-10%）和闭环验证（混入 50% 未验证数据会导致性能断崖下跌）是保证数据质量的核心。
  - Scaling law：成功率随合成轨迹数量增加而提升，但在约 150 条时开始饱和。

### 6. 🔥 [JoyInside-VLM-Agent: Product-Conditioned Multimodal Policy Learning for Embodied Agents] (JoyInside-VLM-Agent：面向具身智能体的产品约束多模态策略学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12957` | [点击跳转](https://arxiv.org/abs/2610.12957)

**领域与类型判断**：本文属于具身智能与多模态智能体领域的**方法创新与系统工程**结合的工作。以下总结将使用具身智能、强化学习和Agent系统的行话进行拆解。

**0. 论文标题**
- **英文标题**: JoyInside-VLM-Agent: Product-Conditioned Multimodal Policy Learning for Embodied Agents
- **中文标题**: JoyInside-VLM-Agent：面向具身智能体的产品约束多模态策略学习
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出了一套面向机器人和智能硬件的多模态Agent训练框架，核心是把“产品硬件约束”作为条件贯穿数据构建和训练全过程，并设计了DPER强化学习算法来精细化Token级别的奖励，让Agent能根据设备能力和执行反馈自适应决策。

**1. 整体逻辑**
- **研究任务**: 训练一个共享的多模态策略（Agent），使其能根据多模态观察和用户指令生成可执行动作，并适应不同产品的硬件约束、用户目标变化以及执行过程中的反馈（部署于各类机器人和智能硬件）。
- **研究动机**: 现有的多模态Agent在实际部署时容易“眼高手低”：要么执行超出设备物理能力的动作，要么生成的回复跟用户当前的场景和意图脱节。现有的训练数据和方法缺乏对“产品特定约束”和“动态交互反馈”的联合建模。
- **本质改动**: 把“产品规格（能力、权限、工作流）”作为强条件注入到数据构建和训练的各个阶段；在强化学习阶段，设计了DPER算法，通过路由“特权教师”和“特权学生”的Token级打分来调制优势（Advantage），解决轨迹级奖励无法精细分配到每个Token的问题。
- **技术溯源**: 基座模型用的是 Qwen3.5-35B-A3B；框架基于 ReAct；强化学习部分借鉴了 RLSD（符号保留的优势调制）和 DOPD（双源路由）的思路。

**2. 技术拆解**
- **核心方法**: 
  1. **产品条件数据构建**：把产品拆解为身份、工作流、约束、技能四个模块，通过代码生成Agent搭建可执行沙盒，闭环生成包含目标修改和故障恢复的多模态轨迹，并进行严格的确定性与语义审计。
  2. **三阶段训练**：先做SFT（监督微调）对齐产品规范，再做多教师在线策略蒸馏（OPD）融合文本和视觉能力，最后用DPER做强化学习。
  3. **DPER算法**：在RL阶段，利用冻结的特权教师和共享参数的特权学生对采样Token打分。根据两者的分歧度和联合支持度，动态路由选择证据概率，用来缩放Token级优势，同时保留基础轨迹奖励决定的正负号。
  4. **多源交互奖励**：结合生成过程奖励模型（GPRM，评估推理步骤）、多评委排名（Multi-Judge，评估产品约束遵守）和任务队列一致性（TaskQueue，评估目标对齐）来算综合奖励。
- **关键细节**: 
  - **数据规模**：约120K训练样本（50K私有轨迹 + 40K公开数据集增强 + 30K视频指令）。
  - **DPER路由逻辑**：计算教师和学生的分歧度（对数概率差的绝对值）和联合支持度（概率和），与batch中位数比较。分歧小且支持高选教师；分歧大则选概率大的那个；否则选学生。
  - **RL训练配置**：16张H200 GPU，训练350步，batch size 128，每个prompt采样8条回复（K=8）。
- **训练/优化目标**: 
  - **SFT**：最小化助手Token的交叉熵损失。
  - **OPD**：最小化学生与分配教师之间的反向KL散度。
  - **DPER**：最大化基于证据加权的Token优势的策略代理目标（Clipped policy surrogate），不改变基础优势符号。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：公开基准 MSAgent, BFCL v4, ToolBench, ToolACE；私有数据集 JoyInside-Devices（智能设备多轮对话与控制）, JoyInside-Robotics（机器人长程视觉推理与控制）。
  - **对比对象（baseline）**：基座模型 Qwen3.5-35B-A3B 和更大的 Qwen3.5-397B-A17B。
  - **测试环境**：RL训练在16张H200上进行；真实部署在四足机器人上。
- **评价指标**: 
  - **公开基准**：轨迹准确率（Exact Match），BFCL v4 官方总分。
  - **细粒度指标**：Plan.EM（决策类型EM），Act.EM（工具名EM），Avg.F1（参数匹配），HalluRate（幻觉/越权工具调用率），ROUGE-L（回复重叠度）。
- **主要结果**: 
  - **公开基准**：在 BFCL v4 上总分 77.44，比 397B 大模型（72.90）高 4.54 分。在 ToolBench 上轨迹准确率 23.5% 领先，Act.EM 54.66 大幅领先大模型。但在 ToolACE 上轨迹准确率略低于大模型（51.53 vs 52.27），公开集结果算混合（mixed）。
  - **私有数据集**：在 JoyInside-Devices 和 JoyInside-Robotics 的所有指标上全面碾压 baseline（如 Act.EM 分别达到 84.99 和 93.73，HalluRate 降至 0.02% 和 0.04%）。
  - **真实案例**：在四足机器人上成功演示了基于视觉的搜索、执行失败后的重规划以及明确的失败报告。

### 7. 🔥 [Evo-World: A Lightweight Vision-Language-Action Model with Future Motion Prediction via Optical-Flow Supervision] (Evo-World：通过光流监督进行未来运动预测的轻量级视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12936` | [点击跳转](https://arxiv.org/abs/2610.12936)

**0. 论文标题**
- **英文标题**: Evo-World: A Lightweight Vision-Language-Action Model with Future Motion Prediction via Optical-Flow Supervision
- **中文标题**: Evo-World：通过光流监督进行未来运动预测的轻量级视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出轻量级VLA模型Evo-World，通过光流监督在潜在空间预测未来运动特征来增强策略学习，在仅0.87B参数下显著提升了仿真与真机操作任务的成功率及部署效率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的策略学习（根据视觉、语言和机器人状态生成连续动作序列）。
- **研究动机**: 纯动作监督无法显式鼓励模型预测场景的未来演化；而预测未来RGB图像会将任务相关的运动与静态外观（背景、纹理）耦合，无法直接提供控制所需的运动变化信号。
- **本质改动**: 摒弃预测未来外观，改用光流（optical-flow）监督在潜在空间预测未来“运动”特征，并通过FiLM机制将其注入动作生成过程，同时利用梯度截断和正则化防止特征坍塌。
- **技术溯源**: 基于 DINOv2（视觉/光流编码）、CLIP（文本编码）、InternVL3-1B（视觉语言骨干）、RAFT（光流计算）、LeJEPA（SIGReg正则化）以及 Flow-matching（动作生成）。

**2. 技术拆解**
- **核心方法**: 
  1. **运动表示模块**：利用DINOv2和CLIP提取当前图像与指令特征，通过MLP预测未来的潜在运动表示；训练时以RAFT计算的光流渲染图作为监督目标。
  2. **运动条件动作生成**：将当前与预测的运动表示拼接，通过有界FiLM调制视觉语言骨干的特征，随后输入基于Flow-matching的动作专家生成动作chunk。
  3. **训练机制**：引入SIGReg防止表示坍塌；在FiLM前使用Stop-gradient分离表示学习与动作优化的梯度路径。
- **关键细节**: 
  - 模型总参数量 0.87B（含预测分支）。
  - 推理时仅需当前相机画面、指令和机器人状态，无需未来图像或光流估计器（预测在潜在空间完成，无需解码）。
  - 动作chunk长度为50；策略图像分辨率448x448，运动分支图像分辨率224x224。
- **训练/优化目标**: 
  - 联合损失函数：$\mathcal{L} = \mathcal{L}_{\mathrm{action}} + \lambda_{\mathrm{world}} (\mathcal{L}_{\mathrm{pred}} + \lambda_{\mathrm{sig}} \mathcal{L}_{\mathrm{SIGReg}})$。
  - $\mathcal{L}_{\mathrm{pred}}$：预测运动表示与光流目标表示的均方误差（MSE）。
  - $\mathcal{L}_{\mathrm{SIGReg}}$：Sketched Isotropic Gaussian Regularization，用于维持表示的多样性，防止特征坍塌。
  - $\mathcal{L}_{\mathrm{action}}$：Flow-matching动作专家的均方速度误差。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：Meta-World MT50（4个难度层级）和 RoboTwin（Clean和Random设置）。
  - **真机环境**：AgileX双臂机器人，3个任务（单臂插花、双臂挂马克杯、双臂微波炉放置）。
  - **Baselines**：仿真对比 $\pi_0$, SmolVLA, RoboTron-Mani, Evo-1, DP, ACT, RDT 等；真机对比 OpenVLA-OFT 和 $\pi_0$。
- **评价指标**: 任务成功率（Success Rate, SR），以及部署效率（参数量、GPU显存占用、推理频率）。
- **主要结果**: 
  - **仿真**：在 Meta-World MT50 上 Tier-averaged SR 达 91.1%（比非预测baseline Evo-1的80.6%相对提升13.0%）；在 RoboTwin 上平均 SR 达 41.8%，均为对比方法最优。
  - **真机**：平均 SR 达 63.3%，超越 $\pi_0$ (51.7%) 和 OpenVLA-OFT (23.3%)。
  - **效率**：仅 0.87B 参数，真机部署显存占用 2.54GB，推理频率 6.16Hz；相比 $\pi_0$ (3.5B) 节省 62% 显存，推理频率提升 13.7%。

### 8. 🔥 [Sampling-based Kinodynamic Planning with World Models] (基于世界模型的采样运动动力学规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12910` | [点击跳转](https://arxiv.org/abs/2610.12910)

**0. 论文标题**
- **英文标题**: Sampling-based Kinodynamic Planning with World Models
- **中文标题**: 基于世界模型的采样运动动力学规划
- **研究机构**: 原文未提及
- **一句话总结**: 本文把经典的基于采样的运动规划（RRT/KPIECE）搬到了视觉世界模型的隐空间里做树搜索，配合GPU批处理和CEM轨迹抛光，解决了传统优化方法在长视野任务（如绕障碍推方块）中容易陷入局部最优的痛点。

**1. 整体逻辑**
- **研究任务**: [领域：机器人学-运动规划 / 类型：方法创新] 在缺乏解析物理模型的情况下，利用视觉世界模型进行长视野（long-horizon）机器人运动动力学规划（如走迷宫、推方块、操作柔性绳）。
- **研究动机**: 现有的视觉世界模型规划多依赖CEM或MPPI等基于采样的优化器（射击法），这些方法在长视野任务中（需要先做不直接减小目标距离的动作，如绕开障碍物）极易陷入局部最优；而经典的基于采样的运动规划（SBMP）擅长处理高维长视野规划，但尚未被有效应用于世界模型的高维隐空间。
- **本质改动**: 放弃传统的射击法优化，直接将经典SBMP（RRT和KPIECE）的树搜索机制引入世界模型的隐空间，用冻结的世界模型作为状态前向传播器，并针对高维隐空间设计了专用的距离度量和探索引导策略。
- **技术溯源**: 基于 DINO-WM（视觉世界模型）、DINOv2（视觉特征编码器），以及经典的 RRT 和 KPIECE 运动规划算法。

**2. 技术拆解**
- **核心方法**: 
  1. **隐空间树搜索**：将DINO-WM作为前向传播器，在隐空间中构建运动动力学搜索树，采用滑动窗口从祖先节点重建历史上下文以节省内存。
  2. **隐空间探索策略**：提出两种节点选择机制。一是基于最近邻的RRT，通过对局部空间区域进行通道平均池化构建低维特征图，以计算更合理的L2距离；二是基于投影的KPIECE，将隐状态投影到低维网格，优先从覆盖稀疏的边界单元格进行扩展。
  3. **GPU批处理扩展**：将候选节点的扩展和前向传播打包成批次，分摊世界模型的推理开销。
  4. **轨迹抛光（Polishing）**：树搜索找到离散路径后，使用短时间的CEM进行连续优化，弥补离散采样的精度损失。
- **关键细节**: 
  - **输入输出**：输入为历史观测序列（上下文窗口 $k=3$）和动作，输出为下一步的隐状态预测。
  - **模型结构**：使用冻结的DINOv2提取视觉patch特征，结合本体感受状态构成统一隐状态。动作步长 `frameskip=5`。推理采用 `fp16` 精度。
  - **关键超参**：树搜索设有节点预算上限，但找到首个有效解即提前终止；目标偏置（goal bias）概率为 $\beta$；CEM polish步数为 $m$。
- **训练/优化目标**: 本文不涉及世界模型的训练（使用现成冻结模型）。核心算法机制是树搜索的节点选择与扩展。优化目标是最小化当前隐状态与目标隐状态在隐空间中的距离（通过 spatial soft-argmax 计算），当距离小于阈值 $\epsilon$ 时视为到达目标。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：4个仿真环境（point_maze, wall, pusht, rope）和1个真实世界推方块任务（YAM机械臂，30个问题分3个难度层级）。
  - **对比对象（baseline）**：CEM、MPPI、MCTS（WorldPlanner）。所有方法使用相同的世界模型检查点和执行循环。
- **评价指标**: 任务成功率（Succ.）、中位规划时间（Time s）、路径代价（Cost）、世界模型单步评估次数（Nodes）。真实机器人还评估了重规划次数（Repl.）和最终位置误差（Err. mm）。
- **主要结果**: 
  - **仿真环境**：RRT和KPIECE匹配或超过了CEM和MPPI的成功率，同时规划时间最多降低13.8倍，世界模型调用次数少一个数量级。KPIECE+polish在接触丰富任务（如pusht）中表现最佳。
  - **真实机器人**：RRT+polish成功解决29/30的问题，KPIECE+polish解决28/30，而CEM和MPPI仅解决23/30。在需要绕路推块的高难度（Tier 3）任务中，树搜索方法优势显著（9/10 vs 5/10），而优化方法常因陷入局部最优而耗尽计算预算。

### 9. 🔥 [LeapBot-JAC: Joint Action Chains for World Action Models] (LeapBot-JAC：面向世界动作模型的联合动作链)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12886` | [点击跳转](https://arxiv.org/abs/2610.12886)

**0. 论文标题**
- **英文标题**: LeapBot-JAC: Joint Action Chains for World Action Models
- **中文标题**: LeapBot-JAC：面向世界动作模型的联合动作链
- **研究机构**: 原文未提及
- **一句话总结**: 在固定的动作token预算下，将动作预测拆分为稀疏的远期参考链和密集的近期执行链，通过共享专家联合去噪，在不增加参数和推理开销的前提下，大幅提升了世界动作模型在零样本扰动下的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 优化具身智能中世界动作模型（WAMs）的动作分块（Action-chunking）策略，解决在固定动作token预算下，如何更好地组织未来控制序列以支持闭环执行的问题。
- **研究动机**: 现有的动作分块策略（如ACT、Diffusion Policy）在闭环部署时，通常只执行预测序列的短前缀就重新规划。由于模型内部的注意力依赖，被截断的远期预测其实能影响当前输出。但现有方法给每个token分配了相同的时间密度和角色，没有区分“近期密集执行”和“远期稀疏参考”的不同需求，导致固定预算下的信息利用率受限。
- **本质改动**: 在不增加动作token总数和模型参数的前提下，把固定的动作预算重新分配为“稀疏远期参考链”和“密集近期执行链”。两者在同一个动作专家内共享参数、联合去噪，并通过有向注意力机制让执行链能读取参考链的远期信息。
- **技术溯源**: 基于世界动作模型（World Action Models, WAMs），具体宿主模型为 FastWAM 和 LeapBot-WA；底层生成范式基于线性流匹配（Linear Flow Matching）/ 扩散生成。

**2. 技术拆解**
- **核心方法**: 联合动作链（Joint Action Chains, JAC）。将原本全密集的动作序列（如32个连续控制目标）拆分为16个稀疏参考目标（按步长s=3采样，覆盖0-45步）和16个密集执行目标（覆盖0-15步）。两者拼接后输入共享的Transformer动作专家。
- **关键细节**: 
  - **输入输出与结构**：参考链（R）和执行链（A）共享输入/输出投影、时间嵌入和Transformer层，不增加任何额外参数。
  - **物理时间对齐**：摒弃简单的拼接位置编码，根据真实的物理控制时间分配位置编码（如RoPE），使得执行token和参考token的相对偏移反映真实时间差（如 $3j - i$）。
  - **注意力可见性**：引入有向角色掩码（Directed Visibility），允许执行链（A）通过注意力读取参考链（R）的信息，但禁止R直接读取A，防止信息反向泄露，同时保留宿主模型原有的语义/世界模型可见性约束。
  - **噪声与去噪**：在相同的噪声水平下，R和A使用独立的高斯噪声样本进行联合去噪。
- **训练/优化目标**: 损失函数包含执行链损失和参考链损失。两者均使用真实演示控制进行监督，参考链损失带有权重 $\lambda_R$（默认0.2）。超出episode边界的无效token（Padding）不参与直接损失计算，但仍参与注意力计算。总损失为执行损失、加权参考损失与宿主世界模型损失之和。推理时只输出执行链的前K个动作。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：LIBERO（标准操作）、LIBERO-Plus（零样本鲁棒性/扰动测试）、RoboTwin 2.0（双臂操作），以及两个真实世界任务（顺序分拣、关抽屉）。
  - **对比对象（Baseline）**：复现的 FastWAM 和 LeapBot-WA 基础模型（Base），以及文献中的 $\pi_0$, $\pi_{0.5}$, Motus, LingBot-VA, LAWA, ImageWAM 等。
- **评价指标**: 任务成功率（Success rate, %），计算成本（推理延迟、峰值显存）。
- **主要结果**: 
  - **标准任务（LIBERO）**：JAC将 FastWAM 和 LeapBot-WA 的平均成功率分别从 97.0% 提升至 98.3%，从 97.3% 提升至 98.3%。RoboTwin 双臂任务也有小幅提升。
  - **零样本鲁棒性（LIBERO-Plus）**：提升极其显著。FastWAM 从 53.5% 大幅提升至 70.4%（+16.9%），LeapBot-WA 从 73.1% 提升至 77.3%（+4.2%），尤其在噪声和相机扰动下增益明显。
  - **真实世界**：FastWAM 和 LeapBot-WA 在两个真实任务上的平均成功率分别从 80% 升至 86%，从 88% 升至 93%。
  - **计算成本**：由于没有增加token总数和模型参数，推理延迟和峰值显存与Base模型几乎完全一致，没有引入额外开销。

### 10. 🔥 [VLMs are Native Action Models: Unleashing the Manipulation Capabilities of VLMs with Explicit Action-Space Grounding] (VLM即原生动作模型：通过显式动作空间接地释放VLM的操作能力)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12832` | [点击跳转](https://arxiv.org/abs/2610.12832)

**0. 论文标题**
- **英文标题**: VLMs are Native Action Models: Unleashing the Manipulation Capabilities of VLMs with Explicit Action-Space Grounding
- **中文标题**: VLM即原生动作模型：通过显式动作空间接地释放VLM的操作能力
- **研究机构**: 原文未提及
- **一句话总结**: 提出 EASG 框架，通过将 TCP 坐标系和深度信息显式投影到视觉上下文，让预训练 VLM 无需额外动作头即可零样本生成连续机器人动作，并支持同接口微调。

**1. 整体逻辑**
- **研究任务**: 将预训练视觉语言模型 (VLM) 转化为通用的机器人操作策略 (Generalist manipulation policies)。
- **研究动机**: 现有 VLA 模型需要大量机器人数据隐式学习动作空间语义（坐标系、深度、运动学）；而模块化方法（如 Code as Policies）虽能零样本操作，但依赖外部规划器，无法端到端微调为统一的连续动作策略。
- **本质改动**: 不引入新的动作 token 或动作头，而是将连续动作空间的物理语义（TCP 坐标系、度量深度）显式锚定到 VLM 的视觉输入中，并直接利用 VLM 原生的文本生成接口输出连续动作。
- **技术溯源**: 基于预训练 VLM（如 Qwen 系列），对比基线包括 VLA 模型（$\pi_{0.5}$, $\pi_0$-FAST, GR00T N1.6, OpenVLA 等）及模块化方法。

**2. 技术拆解**
- **核心方法**: 提出显式动作空间接地 (EASG) 框架。包含三个核心设计：1) 视觉与度量接地：将 TCP 中心的动作坐标系投影到手腕相机图像，并结合深度信息提供物理尺度；2) 原生文本动作学习：将 6-DoF 增量动作和夹爪状态序列化为纯文本格式，利用 VLM 原生词表自回归生成；3) 语法约束解码 (GCD)：推理时通过有限状态机约束 token 生成，确保输出符合动作语法。
- **关键细节**: 
  - 输入：手腕 RGB-D 图像、外部图像、语言指令、动作空间接地信息（坐标系投影、TCP 前方深度）。
  - 输出：纯文本格式的动作，如 `task_state|vx,vy,vz,d|rx,ry,rz,theta|gripper`。
  - 模型规模：真实世界实验使用 Qwen-3.8-27B（零样本）和 LoRA 微调；仿真使用 Qwen3.5-0.8B。
  - 动作表示：在 TCP 局部坐标系下，预测平移（单位方向向量+厘米距离）和旋转（单位轴+度数角度）。
- **训练/优化目标**: 零样本阶段无需训练；微调阶段使用标准的因果语言模型交叉熵损失 (Cross-Entropy Loss) 在机器人轨迹数据上进行监督微调。

**3. 实验结果**
- **实验设置**: 
  - 真实世界：UR3 机械臂 + 手腕/外部 RGB-D 相机。任务分 Group 1（简单，测零样本）和 Group 2（复杂，测微调）。跨实体迁移测试使用 Flexiv 机械臂。
  - 仿真：LIBERO 基准。
  - 对比对象：VLA 基线（$\pi_{0.5}$, $\pi_0$-FAST, GR00T N1.6, OpenVLA-OFT, OpenVLA, Octo）。
- **评价指标**: 任务成功率 (Success Rate)。
- **主要结果**: 
  - 零样本能力：27B VLM + EASG 在 Group 1 达到 79.4% 成功率，相当于微调了 30 条 demonstration 的 VLA 模型（如 $\pi_{0.5}$）。且在物体位置/姿态/颜色随机化下，泛化性显著优于微调后的 VLA。
  - 微调扩展：在 Group 2 复杂任务和 LIBERO 仿真中，微调后的 VLM（27B 和 0.8B）性能与大规模预训练的 VLA 模型持平或更具竞争力。
  - 跨实体迁移：在 UR3 上微调的模型可直接 zero-shot 迁移到 Flexiv 机械臂，成功率基本一致（63.9% vs 62.2%）。
  - 消融实验：TCP 坐标系投影和度量深度缺一不可（去掉任一成功率降至 0%）；语法约束解码 (GCD) 将仿真平均成功率从 72.6% 提升至 83.3%。

### 11. 🔥 [LeWAM: End-to-End World and Action Modeling with JEPAs] (LeWAM：基于JEPA的端到端世界与动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12818` | [点击跳转](https://arxiv.org/abs/2610.12818)

**0. 论文标题**
- **英文标题**: LeWAM: End-to-End World and Action Modeling with JEPAs
- **中文标题**: LeWAM：基于JEPA的端到端世界与动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机器人视觉控制领域的方法创新，提出了一个端到端的联合嵌入预测架构（JEPA），通过联合训练潜在动力学和动作流匹配策略，在单一模型中同时支持高效的直接控制和基于梯度的视觉规划。

**1. 整体逻辑**
- **研究任务**: 视觉控制（Visual Control），具体包括基于目标图像的视觉规划（Visual Planning）、无目标的行为克隆/任务完成（Task Completion），以及物理机器人上的闭环控制。
- **研究动机**: 现有的JEPA世界模型通常分阶段训练（先学表示和动力学，再训练控制策略），导致动作监督与视觉表示学习脱节，容易丢失控制相关信息；此外，基于群体搜索（如CEM）的规划在动作维度高或接触丰富（Contact-rich）的任务中效率极低，且容易陷入局部最优。
- **本质改动**: 摒弃分阶段训练，在单一训练阶段内，使用联合目标（下一状态预测 + 动作流匹配）端到端地同时学习视觉表示、动作条件潜在动力学和随机策略，使一个模型既能直接输出动作，又能作为规划器。
- **技术溯源**: 联合嵌入预测架构（JEPA）、LeWM、DINO-WM、Mixture-of-Transformers (MoT)、Flow Matching（流匹配）、SIGReg。

**2. 技术拆解**
- **核心方法**: 采用 Mixture-of-Transformers (MoT) 架构，包含状态分支和动作分支。状态分支利用干净动作（Clean actions）预测下一潜在状态；动作分支利用带噪动作（Noisy actions）通过流匹配学习随机策略。使用 SIGReg 对潜在状态施加各向同性高斯约束以防止表示崩溃。推理时，既可以直接从策略采样动作执行，也可以采样动作序列后，通过潜在动力学进行基于梯度的规划细化。
- **关键细节**: 视觉编码器为 ResNet-18；MoT 预测器包含 4 个 Transformer 块，隐藏层宽度 192；模型总参数约 17M。输入为像素观察历史和可选的目标图像嵌入，输出为下一潜在状态和动作块的速度场。动作块长度设为 10，frameskip 为 5。
- **训练/优化目标**: 联合损失函数，包括潜在动力学预测的 MSE 损失、动作流匹配的速度场 MSE 损失，以及 SIGReg 正则化损失（保持潜在空间分布多样性）。

**3. 实验结果**
- **实验设置**: 在 10 个异构模拟环境（如 Push-T, Cube, ToolHang 等，包含专家与次优混合数据）和 3 个物理机器人任务上进行测试。对比基线包括 LeWM (CEM/IDM)、DINO-WM、GCBC、Diffusion Policy 和 $\pi_{0.5}$。
- **评价指标**: 目标到达成功率、任务完成成功率、规划速度（plans/s），以及通过线性探测（Linear probing）评估表示质量的 $R^2$ 分数。
- **主要结果**: 
  1. **视觉规划**：在 10 个模拟任务中平均成功率达 93.5%（比 LeWM CEM 的 50.9% 提升 42.7%）；在接触丰富任务（如 ToolHang）和长视野任务（100步偏移）中优势显著（46.2% vs 10.9%）。
  2. **规划效率**：通过提供表达性先验和基于梯度的优化，规划速度比 LeWM (CEM) 快 32.3 倍（52.50 plans/s vs 1.62 plans/s）。
  3. **表示质量**：线性探测证明，联合训练和 SIGReg 有效保留了物理状态和动作信息，避免了表示崩溃。
  4. **行为克隆与真机**：在模拟任务完成和物理机器人控制中，性能与 Diffusion Policy 等基线持平或更优，且推理计算量（GFLOPs）大幅低于 $\pi_{0.5}$（270.2 vs 3603.6）。

### 12. 🔥 [StereoEngine: Scaling Stereo Bimanual Robot Data without Stereo Cameras] (StereoEngine：无需双目相机扩展双臂机器人双目数据)
- **研究机构**: `南加州大学 (University of Southern California)`
- **Arxiv ID**: `2610.12734` | [点击跳转](https://arxiv.org/abs/2610.12734)

**0. 论文标题**
- **英文标题**: StereoEngine: Scaling Stereo Bimanual Robot Data without Stereo Cameras
- **中文标题**: StereoEngine：无需双目相机扩展双臂机器人双目数据
- **研究机构**: 南加州大学 (University of Southern California)
- **一句话总结**: [机器人学/数据合成] 提出 StereoEngine 框架，利用视频扩散模型将单目视频或仿真轨迹合成为高质量的双目立体数据，解决了双臂机器人缺乏大规模双目训练数据的瓶颈，显著提升了下游视觉-语言-动作（VLA）策略的性能。

**1. 整体逻辑**
- **研究任务**: 为双臂机器人操作合成大规模、逼真的双目立体视频数据，以训练和扩展基于双目视觉的 VLA 策略。
- **研究动机**: 现有的大规模机器人数据集大多是单目和单臂的，极度缺乏双臂双目数据集，而收集真实双目数据成本高昂。现有的单目转双目方法主要针对 VR 或自动驾驶，且依赖真实双目数据进行训练，无法直接应用于机器人操作场景。
- **本质改动**: 提出无需真实双目数据即可训练生成模型的方法：利用单目深度估计和 warping 生成 mask 来训练视频修复模型（StereoEngine-L），或利用仿真边缘图结合参考图像零样本生成双目视频（StereoEngine-S）。
- **技术溯源**: 基于视频扩散模型（Wan2.2-VACE-Fun 和 Wan2.2-Fun-A14B-Control）、单目视频深度估计模型、RoboTwin 仿真平台，以及下游策略 ExStereo 和 StereoVLA。

**2. 技术拆解**
- **核心方法**: StereoEngine 包含两个独立的数据合成管线。StereoEngine-L 针对有真实单目视频的情况，通过深度 warping 和扩散模型修复遮挡区域生成右视图；StereoEngine-S 针对无真实视频的情况，基于仿真轨迹的边缘图和真实场景参考图，联合生成左右双视图。
- **关键细节**: 
  - **StereoEngine-L**: 输入单目左视频和语言指令。先用深度模型估计逆深度，通过前向 splatting 将左视图 warping 到右视图，生成被遮挡区域的 mask。使用 Wan2.2-VACE-Fun 作为 backbone，输入 warping 后的视频、mask 和文本提示进行修复。训练时，在 3469 个单目机器人视频上，使用 warping 生成的 mask、部分机械臂 mask 和随机视差 dropout 进行微调，全程无需真实双目数据。
  - **StereoEngine-S**: 输入仿真渲染视频、左右参考图像和语言指令。在 RoboTwin 中渲染双目轨迹，提取 Canny 边缘并拼接。使用 Wan2.2-Fun-A14B-Control，以边缘视频为结构控制，参考图像提供真实外观，零样本（zero-shot）生成拼接的左右视图视频，最后拆分。
- **训练/优化目标**: 
  - **StereoEngine-L**: 优化视频扩散模型的修复能力，条件概率为 $p_\psi(\hat{V}^R | \tilde{V}^R, M, l)$，即根据 warping 后的右视频、遮挡 mask 和文本指令生成真实的右视频。
  - **StereoEngine-S**: 零样本生成，无额外训练。条件概率为 $p_\phi(\hat{V} | V^c, I^{ref}, l)$，即根据 Canny 边缘控制视频、参考图像和文本指令生成拼接的双目视频。

**3. 实验结果**
- **实验设置**: 
  - **硬件与数据**: AgileX PiPER 双臂机器人，ZED Mini 2 双目相机。StereoEngine-L 使用 3469 个公开单目 episode 进行 mid-training，并在真实遥操作数据上 fine-tune（如 Stack Two Bowls 200个等）。StereoEngine-S 完全使用仿真生成的合成数据（如 Stack Two Bowls 200个等）。
  - **对比对象 (Baseline)**: StereoEngine-L 对比 No Mid.（无 mid-training）、SVG、StereoCrafter；StereoEngine-S 对比 Point Clouds（仿真点云加高斯噪声）。下游策略使用 ExStereo 和 StereoVLA。
- **评价指标**: 
  - **生成质量**: PSNR, SSIM, LPIPS, CTC (CLIP 时间一致性)。
  - **下游任务**: 真实世界物理实验的成功率（每个任务 20 次试验）。
- **主要结果**: 
  - **生成质量**: StereoEngine-L 在所有指标上均优于 baseline（如 PSNR 达到 15.31，比最强 baseline StereoCrafter 高 2.48 dB）。
  - **下游任务 (StereoEngine-L)**: 在 ExStereo 上进行 mid-training，总体成功率达 83.3% (50/60)，显著优于无 mid-training (60.0%)、StereoCrafter (66.7%) 和 SVG (51.7%)。在 Lift Transparent Bottles 任务上提升最明显（18/20 vs 11/20）。
  - **下游任务 (StereoEngine-S)**: 仿真点云 baseline 因 sim-to-real gap 成功率为 0%。StereoEngine-S 成功生成可用数据，在 Container Plate 和 Lift Two Bottles 等任务上分别取得了 11/20 和 9/20 的成功率。

### 13. 🔥 [Spa-Bench: A Real-Robot Benchmark for Spatial Grounding in Vision-Language-Action Models] (Spa-Bench：视觉-语言-动作模型空间接地的真实机器人基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12696` | [点击跳转](https://arxiv.org/abs/2610.12696)

**0. 论文标题**
- **英文标题**: Spa-Bench: A Real-Robot Benchmark for Spatial Grounding in Vision-Language-Action Models
- **中文标题**: Spa-Bench：视觉-语言-动作模型空间接地的真实机器人基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个专门评估 VLA 模型在真实机器人上“空间接地（Spatial Grounding）”能力的基准测试 Spa-Bench，通过控制变量设计证明当前 SOTA 模型能执行物理动作，但缺乏稳健的空间概念组合理解能力。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作模型（VLAs）在真实机器人上，能否可靠地将自然语言中的空间描述（如位置、大小、状态、数量等）映射并执行到物理场景中。
- **研究动机**: 现有 VLA 基准主要看整体任务成功率，导致空间理解能力与物体识别、语言解释、电机执行等能力纠缠。任务失败时，无法确定是因为没理解空间关系，还是没认出物体或没抓稳；此外，固定场景测试容易导致模型死记硬背位置。
- **本质改动**: 设计了“保留单元（withheld-cell）”的数据划分策略。在训练集中保留物体、空间概念和动作的单独出现，但隐藏它们特定的组合（作为 OOD 测试），从而剥离物体和动作不熟练的干扰，纯粹测试模型对空间概念组合的理解。
- **技术溯源**: 基于 SO-101 机械臂平台；评估了 5 个 SOTA VLA 策略：VLA-0, MolmoAct2, $\pi_{0.5}$, GR00T-N1.7 F-LLM, GR00T-N1.7 F-FT。

**2. 技术拆解**
- **核心方法**: 构建 Spa-Bench 基准测试，包含 6 个桌面任务（物体状态、相对大小、指代描述、关系放置、序数位置、计数）。采用控制变量法，固定机器人、工作区和动作族，仅改变决定操作对象和位置的空间规则。引入 ID（训练见过的组合）和 OOD（训练未见过的组合）评估，并设计了直接操作、提示词改写、跨任务物体、无干预等 4 种诊断条件来定位失败原因。
- **关键细节**: 
  - **输入输出**: 输入为 6 维机器人状态 + 中间和腕部 2 个 RGB 相机视图（480×640）；输出为连续或离散动作。
  - **数据规模**: 1200 个人类遥操作演示（每任务 200 个），约 5.7 小时，612,733 帧。
  - **评估协议**: 每个完全评估的策略进行 900 次物理 rollout，跨策略对比时手动重置到相同的场景规格。
- **训练/优化目标**: 各策略使用其原生的微调程序（如基于 flow-matching 或 diffusion transformer 的动作预测）进行行为克隆，在 1200 个演示 episode 上训练 12 个 epoch，全局 batch size 为 96，使用 AdamW 优化器。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: Spa-Bench 收集的 1200 个真实机器人演示数据。
  - **对比对象（baseline）**: 5 个 SOTA VLA 策略（VLA-0, MolmoAct2, $\pi_{0.5}$, GR00T-N1.7 F-LLM, GR00T-N1.7 F-FT），其中前三个完成了完整的 900 次 rollout 评估。
  - **测试环境**: SO-101 机械臂，固定光照和相机位置的无窗房间。
- **评价指标**: 二元物理任务成功率（Binary physical task success），即是否满足特定任务的成功标准（如放对位置、数量正确等），无部分得分。
- **主要结果**: 
  - **ID 到 OOD 性能显著下降**: 三个完全评估策略在 ID 空间配置下成功率为 67.5%–73.3%，但在 OOD 配置下骤降至 40.7%–52.0%。
  - **空间推理是主要瓶颈**: 在匹配的 OOD 场景下，使用直接操作指令（直接点名目标，去掉空间推理）的成功率高达 81.7%–89.2%，比空间指令高出 28.3–40.0 个百分点，证明失败并非因为物理执行困难，而是空间推理失败。
  - **特定任务完全失败**: 所有策略在 OOD 计数（Counting）任务上成功率为 0%。
  - **提示词敏感与动作门控差**: 改写提示词通常会降低空间指令成功率；模型很难可靠判断何时不需要动作（如在无干预场景中，Object State 和 Ordinal Position 任务的成功率均为 0%）。

### 14. 🔥 [CASTER: Formalizing Zero-Shot Manipulation from Synthetic Videos as Constrained Optimization] (CASTER：将基于合成视频的零样本操作形式化为约束优化问题)
- **研究机构**: `Virginia Tech (弗吉尼亚理工大学)`
- **Arxiv ID**: `2610.12567` | [点击跳转](https://arxiv.org/abs/2610.12567)

**0. 论文标题**
- **英文标题**: CASTER: Formalizing Zero-Shot Manipulation from Synthetic Videos as Constrained Optimization
- **中文标题**: CASTER：将基于合成视频的零样本操作形式化为约束优化问题
- **研究机构**: Virginia Tech (弗吉尼亚理工大学)
- **一句话总结**: 把“用视频生成模型指导机器人零样本操作”这个问题严格定义为一个约束优化问题，不再死磕视频里的每个动作细节，而是提取任务关键特征在数字孪生里做轨迹优化，大幅提高了真实机器人的操作成功率。

**1. 整体逻辑**
- **研究任务**: 零样本桌面机器人操作（Zero-shot tabletop robot manipulation）。即在没有真实人类演示的情况下，仅靠视频生成模型生成的“假人”操作视频，让真实机械臂在现实环境中完成任务。
- **研究动机**: 现在的视频生成模型生成的视频看着像回事，但缺乏物理一致性（比如穿模、违背物理规律）和机器人运动学基础（人手和机械臂结构不同）。现有方法要么直接把视频里的物体轨迹硬套给机械臂（导致现实中的碰撞），要么在仿真里死磕每一个视频帧的 waypoint（导致在物理约束下根本解不出可行轨迹）。这些方法都是“头痛医头”的 ad hoc 方案，缺乏统一的问题定义。
- **本质改动**: 将“从合成视频到真实机器人轨迹的转换”统一形式化为一个**约束优化问题**。核心思路是：视频只提供一个“初始猜测”，机器人不需要精确复刻视频里的每一个动作细节，而是提取出“任务关键特征”，在满足物理和语义约束的前提下，在数字孪生中优化出一条可行的机械臂轨迹。
- **技术溯源**: 视频生成模型（HunyuanVideo-1.5 等）、3D 重建与仿真（SAM 3D, Isaac Sim）、3D 追踪（TrackCraft3R）、大语言模型（LLM 提取特征）、视觉语言模型（Qwen3.5 验证视频）、交叉熵方法（CEM 优化）。

**2. 技术拆解**
- **核心方法**: 提出 CASTER (Constraint-Aware Synthetic Task-feature ExtRaction) 框架，具体流程如下：
  1. **视频生成与过滤**：根据初始场景和任务提示生成多个视频，用 VLM 过滤掉语义不符的废片。
  2. **特征提取**：用 LLM 根据任务描述，指出哪些物体关系和运动维度是“任务关键”的（例如：倒水时，壶嘴和杯子的相对位置是关键，壶在空中的绝对轨迹不重要）。然后在多个有效视频中计算这些关键特征的均值和方差，得到带权重的共享优化目标。
  3. **约束优化**：在 Isaac Sim 构建的数字孪生中，用 CEM 算法优化机械臂末端执行器的轨迹样条。优化目标是让机械臂执行时的物体特征尽量贴近上述共享目标，同时严格满足碰撞和关节限位等物理约束。
- **关键细节**: 
  - **输入**：单张 RGB-D 初始观测 + 自然语言任务描述。
  - **输出**：机械臂末端执行器的开环轨迹（样条参数）。
  - **规模/超参**：每个任务生成 20 个视频，保留 VLM 评分 >= 0.75 的。CEM 优化种群大小为 1024，最多迭代 10 代。
- **训练/优化目标**: 
  - **优化目标**：最小化机械臂实际轨迹的物体特征与视频提取的共享任务特征参考之间的加权 L2 距离（权重随跨视频方差指数衰减，即多个视频里越一致的特征，优化时权重越大）。
  - **约束条件**：物理可行性约束（包括与无关物体碰撞的力阈值限制、机械臂关节角度限位）。

**3. 实验结果**
- **实验设置**: 
  - **任务与环境**：12 个真实的桌面操作任务（如把香蕉放进锅里、倒水、堆叠碗等），在真实世界（Franka 机械臂 + Orbbec 相机）中进行零样本评估。
  - **对比对象 (Baseline)**：
    1. **Retarget** (类似 RIGVid)：直接把视频里的物体轨迹通过刚体变换重定向给机械臂末端。
    2. **Mimic** (类似 PhysWorld)：在数字孪生中优化轨迹，精确模仿视频中的物体运动，同时保持物理可行性。
- **评价指标**: 零样本任务成功率（Zero-shot success rate），即成功完成提示目标、避免与无关物体碰撞，且不违反关节限制。
- **主要结果**: 
  - CASTER 平均零样本成功率达到 **76.6%**，比最佳 baseline (Mimic 的 42.5%) 提高了 **34.1%**。
  - Retarget 成功率仅 32.1%，因为直接重定向会把视频里的物理错误（如碰撞）直接带到现实。
  - Mimic 试图匹配视频中的每一个 waypoint，导致在物理约束下经常找不到可行解。CASTER 通过只匹配跨视频一致的关键特征，给了优化器更大的灵活性，从而能解出更多可行轨迹。
  - 对比不同视频生成模型（HunyuanVideo, Wan, LTX, CogVideoX）发现，生成“语义有效”视频的数量并不完全决定最终成功率，视频特征误差与优化器“语义吸引域”的匹配程度才是关键。

### 15. 🔥 [What Should Embodied Agents Remember? Benchmarking and Evaluating Memory Modality for Embodied Agents] (具身智能体应该记住什么？具身智能体记忆模态的基准测试与评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12561` | [点击跳转](https://arxiv.org/abs/2610.12561)

**0. 论文标题**
- **英文标题**: What Should Embodied Agents Remember? Benchmarking and Evaluating Memory Modality for Embodied Agents
- **中文标题**: 具身智能体应该记住什么？具身智能体记忆模态的基准测试与评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出了 MeMoREval 基准，通过解耦“经验积累”和“任务请求”阶段，系统评估了具身智能体采用不同记忆模态（文本、描述、原图、场景图）在任务成功率和推理成本上的权衡。

**1. 整体逻辑**
- **研究任务**: 评估具身智能体（机器人）在长程任务中，采用不同记忆存储形式（记忆模态）对后续信息回忆和动作规划的影响，并衡量其构建和使用记忆的推理成本。
- **研究动机**: 现有具身记忆研究多关注“怎么存”（记忆后端/检索机制），忽略了“存什么形式”（记忆模态）。对机器人而言，存纯文本会丢失视觉细节，存描述需要预先截断信息，而机器人重新探索环境的物理代价极高。因此需要控制变量，单纯评估记忆形式本身的优劣。
- **本质改动**: 设计了一个“先盲测体验、后无观察请求”的评估协议，固定智能体模型和记忆后端，仅改变记忆的存储模态（文本/描述/原图/场景图），从而剥离出“记忆形式”对性能和成本的纯粹影响。
- **技术溯源**: 基于 Genesis 仿真器和 SceneSmith 场景；智能体基座模型使用了 Gemini 3.7 Flash、GPT 5.6 Sol、GLM 5.3 Flash；记忆后端参考了 A-MEM、Mem0、ObsMem 等；物理验证使用了 Dexmate Vega 1 机器人和 SAM 3 分割模型。

**2. 技术拆解**
- **核心方法**: 提出 MeMoREval 基准及配套的 Experience-Request 评估协议。将任务严格分为两阶段：Experience 阶段让机器人按脚本执行动作并记录观察（此时不知未来任务）；Request 阶段清空上下文且不给新观察，强制机器人仅靠记忆回答信息或输出动作计划（开环执行，防止靠探索弥补记忆缺失）。
- **关键细节**: 
  - **规模**：4个室内仿真环境（办公室、摄影棚、家、诊所），53个任务，涵盖7类记忆信息（物体位置、空间配置、外观绑定等）。
  - **记忆模态配置**：纯文本（text）、生成描述（desc@64/256/1024 token）、原始相机帧（frames）、原始帧+场景图（frames+graph）。
  - **记忆后端**：transcript, wiki, A-MEM, Mem0, ObsMem。
  - **成本计算**：将输入输出 token 按 API 价格折算为加权 token 数，分别统计写入时（Experience阶段）和读取时（Request阶段）的成本。
- **训练/优化目标**: 本文是基准测试与评估工作，无训练过程。核心机制是通过控制变量法（固定后端和模型，改变模态）来测量任务成功率（Task success）和推理成本（Write-time / Read-time cost）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：MeMoREval（53个仿真任务，4个环境）。
  - **对比对象**：6种记忆模态（text, desc@64/256/1024, frames, frames+graph），5种记忆后端。主实验使用 Gemini 3.7 Flash，对比实验加入 GPT 5.6 Sol 和 GLM 5.3 Flash。
- **评价指标**: 任务成功率（%）；写入时推理成本（每步加权 token 数）；读取时推理成本（每次成功请求的加权 token 数）。
- **主要结果**: 
  1. **存原图优于存描述**：对于主模型 Gemini 3.7 Flash，存原始帧（frames）的成功率（70%）高于最长描述 desc@1024（60%），且写入成本更低（无需额外调用模型生成描述）。
  2. **帧+场景图综合最优**：结合原始帧和场景图（frames+graph）在所有测试模型中均取得了最高的综合任务成功率（75%）。
  3. **读取成本优势**：存原图比存最长描述在每次成功请求上消耗的加权 token 更少（信息请求少约15%，动作请求少约7%）。
  4. **部署变体发现**：累积长历史会导致 transcript 等简单后端性能大幅下降；让 writer 选择性存帧会掉点；给 writer 输入图像并不能稳定提升成功率。

### 16. 🔥 [LAPT-Scale: Scaling Embodied Policies with Latent Action Pre-Training on Human Videos] (LAPT-Scale：通过在人类视频上进行潜在动作预训练来扩展具身策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13732` | [点击跳转](https://arxiv.org/abs/2610.13732)

**0. 论文标题**
- **英文标题**: LAPT-Scale: Scaling Embodied Policies with Latent Action Pre-Training on Human Videos
- **中文标题**: LAPT-Scale：通过在人类视频上进行潜在动作预训练来扩展具身策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种可扩展的潜在动作预训练范式，利用连续潜在动作模型从大规模人类视频中提取隐式动作监督，通过三阶段训练显著提升VLA策略表现，并验证了随人类视频数据量增加带来的持续Scaling规律。

**1. 整体逻辑**
- **研究任务**: 利用大规模无标注的第一人称人类视频预训练视觉-语言-动作（VLA）机器人策略，解决机器人交互数据采集成本高昂的瓶颈。
- **研究动机**: 现有方法通过显式运动估计提取人类动作容易产生噪声；现有的潜在动作模型（LAM）多使用离散向量量化（VQ）空间，容易过度压缩连续操作动态，且仅依赖像素级重建（如MSE）容易受静态背景主导，丢失手部-物体交互的细粒度动态。
- **本质改动**: 摒弃离散VQ空间和纯像素重建，采用连续潜在空间结合感知、语义和光流多重对齐信号来学习人类视频中的细粒度隐式动作，并将其作为VLA策略预训练的可扩展监督信号。
- **技术溯源**: 基于VLA架构（如JoyAI-RA）、时空VAE、Transformer、DINOv2（语义特征）、RAFT（光流）、LPIPS（感知损失）、Conditional Flow Matching（条件流匹配）。

**2. 技术拆解**
- **核心方法**: LAPT-Scale包含两部分：LAPT-Scale-LAM从人类视频学习连续潜在动作以构建监督信号；LAPT-Scale-Policy采用三阶段训练VLA策略：阶段1在人类视频潜在动作上预训练，阶段2在目标机器人数据上进行具身对齐，阶段3进行任务特定后训练。
- **关键细节**: 
  - **LAM**：输入相邻两帧，输出32维连续高斯潜在动作。采用时空VAE架构（24层Transformer encoder/decoder，1024维，16个注意力头）。
  - **对齐信号**：感知对齐（MSE + LPIPS）、语义对齐（冻结的DINOv2特征）、运动对齐（冻结的RAFT光流）。
  - **Policy**：VLM骨干网络 + Perceiver风格的action expert。阶段1预测LAM产生的潜在动作chunk，阶段2切换为真实机器人动作chunk（使用250小时对齐数据），阶段3任务后训练。全程使用Conditional Flow Matching，不引入额外的动作头或适配器，action chunk horizon为30。
- **训练/优化目标**: 
  - **LAM优化目标**：结合感知损失、DINO语义损失、光流运动损失和KL散度（$\mathcal{L}_{LAM} = \mathcal{L}_{perc} + \lambda_{dino}\mathcal{L}_{dino} + \lambda_{flow}\mathcal{L}_{flow} + \beta\mathcal{L}_{KL}$）。
  - **Policy优化目标**：条件流匹配损失（Conditional Flow Matching loss）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：23.3K小时人类视频训练LAM，5.1K小时清洗子集用于策略预训练（Scaling实验使用1K, 3K, 5K小时嵌套子集）。机器人数据包含250小时具身对齐数据及下游任务数据。
  - **对比对象**：$\pi_0$, $\pi_{0.5}$, Motus, LingBot-VLA, JoyAI-RA, Diffusion Policy, DreamDojo LAM, Hand-motion annotation等。
  - **测试环境**：RoboTwin 2.0 (Easy/Hard), RoboCasa-GR1仿真环境，以及AgiBot G1真实机器人（3个基础任务+4个困难任务）。
- **评价指标**: 任务成功率（Success Rate）。LAM诊断使用PSNR, SSIM, LPIPS和LARY线性探测准确率。
- **主要结果**: 
  - **仿真表现**：在RoboTwin 2.0 Easy/Hard分别达到90.0%/89.3%，RoboCasa-GR1达到64.8%，均优于对比baseline。
  - **真实机器人**：3个基础任务平均成功率85.0%（显著优于$\pi_{0.5}$的56.7%和JoyAI-RA的80.0%）。在4个困难任务的未见位置/光照/背景偏移下，保持70.0-75.0%的成功率。
  - **Scaling规律**：仅增加阶段1的人类视频预训练数据（1K -> 5K小时），真实机器人平均成功率从63.3%稳步提升至85.0%，验证了连续潜在动作标注的可扩展性。
  - **消融实验**：去除光流对齐导致RoboTwin Hard成功率下降11.5%；连续空间+多重对齐的LAM在重建和语义指标上均显著优于VQ-LAM和仅用MSE的LAM。

### 17. 🔥 [MAGMA-Bench: Evaluating Long-Horizon Embodied Agents under Dynamic Tasks and Execution Failures] (MAGMA-Bench：在动态任务与执行失败下评估长时程具身智能体)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13534` | [点击跳转](https://arxiv.org/abs/2610.13534)

**0. 论文标题**
- **英文标题**: MAGMA-Bench: Evaluating Long-Horizon Embodied Agents under Dynamic Tasks and Execution Failures
- **中文标题**: MAGMA-Bench：在动态任务与执行失败下评估长时程具身智能体
- **研究机构**: 原文未提及
- **一句话总结**: [类型：数据集/基准测试] 提出评估动态多机器人环境下长时程任务推理的基准 MAGMA-Bench，测试表明现有模型在应对执行扰动和异构协同任务时成功率较低。

**1. 整体逻辑**
- **研究任务**: 构建基准测试（数据集/基准类工作）。评估长时程具身智能体在动态多机器人环境中的持久任务推理与异构协调能力。
- **研究动机**: 现有基准测试要么只关注动态任务执行，要么只关注具身多智能体协调，缺乏对两者交集（即动态环境下的多智能体长时程协同与抗扰动推理）的有效评估。
- **本质改动**: 引入了包含在线扰动（执行失败、中断、更新）和异构机器人协同的动态评估场景，并通过结构化技能级接口将任务推理与底层控制解耦。
- **技术溯源**: 原文未提及（摘要中仅提及评估开源权重规划器和前沿模型，未说明具体基座或依赖的已有工作名称）。

**2. 技术拆解**
- **核心方法**: 提出 MAGMA-Bench 基准测试，包含递增的任务时程和受控的在线扰动（执行失败、任务中断、任务更新），要求异构机器人协同。采用结构化的技能级接口（skill-level interface）分离任务级推理与感知/底层控制。同时提供了一个与架构无关的专家轨迹生成管道（expert-trace generation pipeline）。
- **关键细节**: 评估对象包括本地可部署的开源权重规划器、多智能体状态跟踪策略和前沿模型。开源释放了 261,646 个任务级训练样本。
- **训练/优化目标**: 非学习类工作（基准测试）。核心机制是通过结构化技能级接口隔离任务推理与底层控制，并引入受控在线扰动来测试智能体的持久任务推理和状态跟踪能力。

**3. 实验结果**
- **实验设置**: 在 MAGMA-Bench 上评估本地可部署的开源权重规划器、多智能体状态跟踪策略和前沿模型（原文未提及具体模型名称）。测试场景包含递增的任务时程以及执行失败、任务中断、任务更新等在线扰动，且涉及异构机器人协同。
- **评价指标**: 任务成功率（在干净 episode 和受在线扰动 episode 下的表现）。
- **主要结果**: 即使是最强的评估模型，在无扰动的干净 episode 中也有很大比例失败；在引入在线扰动后，成功率进一步下降。监督微调（Supervised adaptation）能大幅提升小模型的性能，但在更长时程和多机器人任务中，其性能依然大幅落后（原文未提及具体数值与 baseline 名称）。

### 18. 🔥 [What Visual Representations Do World Action Models Need?] (世界动作模型需要什么样的视觉表示？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.13024` | [点击跳转](https://arxiv.org/abs/2610.13024)

**0. 论文标题**
- **英文标题**: What Visual Representations Do World Action Models Need?
- **中文标题**: 世界动作模型需要什么样的视觉表示？
- **研究机构**: 原文未提及
- **一句话总结**: 系统评估了外部视觉特征在世界动作模型（WAMs）中的选择与融合策略，提炼出“通用特征+通道拼接+互补组合”的实证配方（R2-WAM），大幅提升了机器人操作的鲁棒性与成功率。

**1. 整体逻辑**
- **研究任务**: 提升世界动作模型（WAMs）在机器人操作任务中的性能和鲁棒性，通过引入外部视觉表示来弥补其原生 VAE 在操作语义和空间关系表征上的不足。
- **研究动机**: WAMs 继承的 VAE 是为视觉重建优化的，缺乏对操作关键信息的显式关注。现有研究虽然引入了外部视觉特征，但特征选择和融合机制往往是基于假设拼凑的，缺乏对“哪种表示最好”、“哪种融合机制最有效”以及“多特征组合是否总是有益”的系统性解耦和对比。
- **本质改动**: 在统一的 WAM 基座和训练协议下，对 13 种视觉表示、5 种融合机制和多特征组合进行大规模控制变量实验，提炼出指导特征选择与融合的实证配方，并实例化为 R2-WAM。
- **技术溯源**: 基于 Wan 2.2 预训练视频生成模型构建基础架构，采用 Flow-Matching（流匹配）框架进行视频和动作的联合预测；视觉表示溯源至 DINOv3、V-JEPA 2.1、UniTok 等通用视觉/多模态基础模型。

**2. 技术拆解**
- **核心方法**: 提出并验证了一套视觉表示的“配方”（Representation Recipe）：1) 优先选择强通用视觉表示（如 DINOv3）作为默认选项；2) 采用通道级拼接（Channel-wise concatenation）进行特征融合，并联合预测未来特征；3) 在通用表示基础上，根据任务信息的互补性谨慎添加额外特征源。
- **关键细节**: 
  - **输入输出**：输入 RGB 观测、语言指令、机器人状态；输出未来视频 VAE 潜变量和动作块（action chunk）。
  - **模型结构**：包含视频专家（Video expert）和动作专家（Action expert），两者通过非对称掩码的联合注意力机制交互（动作 token 可注意视频和动作 token，视频 token 只注意视频 token）。
  - **融合机制细节**：通道级拼接将外部特征与 VAE 潜变量在空间上对齐后沿通道维度拼接，视频专家联合预测 VAE 和外部特征的流速度（flow velocities），推理时仅解码 VAE 潜变量。
  - **R2-WAM 具体配置**：通过通道级拼接融合 DINOv3、UniTok 和 V-JEPA 2.1 三种表示。
- **训练/优化目标**: 视频与动作的流匹配损失（Flow-matching loss）加权求和，针对联合预测机制额外加上未来特征的流匹配损失（辅助损失）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO、LIBERO-Plus (LP)、RoboCasa GR1 Tabletop、RoboTwin 2.0，以及 4 个真实机器人物理操作任务（使用 Galbot G1 平台）。
  - **对比对象（Baseline）**：仅使用原生 VAE 表示的 WAM（VAE-only WAM），以及其他 WAM 变体（直接动作预测、先视频后动作预测 IDM）。在跨基准测试中对比了 GR00T-N1.6、DiT4DiT、FLARE、LDA-1B、DIAL、WALA、LAWA、Fast-WAM、LingBot-VA 等方法。
- **评价指标**: 任务成功率（Success rate, %）；在 LIBERO-Plus 中评估了 7 种扰动（相机、机器人、语言、光照、背景、噪声、布局）下的鲁棒性。
- **主要结果**: 
  - **实证结论**：通用表示平均成功率（82.2%）高于专用表示（80.0%）；通道级拼接平均成功率（81.5%）远超其他 4 种机制；多特征组合收益有限且高度依赖互补性，同一特征源在不同组合中效果差异很大。
  - **仿真性能**：R2-WAM 在 RoboCasa GR1 Tabletop 达到 84.7%（比 VAE-only 提升 5.9%），在 RoboTwin 2.0 达到 92.8%（提升 2.2%），均为 SOTA。在 LIBERO-Plus 的视角、背景、噪声等扰动测试中鲁棒性显著提升。
  - **真机性能**：在 4 个真实机器人任务中，R2-WAM 相比 VAE-only baseline，完整任务成功率平均提升 10.0%（如空气炸锅任务从 50.0% 升至 60.0%，推杯子从 65.0% 升至 75.0%），扫地任务的垃圾收集率从 48.3% 提升至 66.7%。

### 19. 🔥 [Imagine the Future, Internalize the Gist: Efficient VLA Reasoning via Internalized Spatiotemporal Imagination] (想象未来，内化要旨：通过内化时空想象实现高效VLA推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.02626` | [点击跳转](https://arxiv.org/abs/2610.02626)

**0. 论文标题**
- **英文标题**: Imagine the Future, Internalize the Gist: Efficient VLA Reasoning via Internalized Spatiotemporal Imagination
- **中文标题**: 想象未来，内化要旨：通过内化时空想象实现高效VLA推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出IG-VLA框架，在潜在视觉空间预测未来场景演变以指导动作，并通过“场景要旨记忆”将推理知识蒸馏为紧凑Token，在保持SOTA成功率的同时将VLA推理延迟降低数倍。

**1. 整体逻辑**
- **研究任务**: [领域与类型：具身智能/机器人操作，方法创新] 提高视觉-语言-动作（VLA）模型在机器人操作任务中的成功率，同时大幅降低推理时的计算开销。
- **研究动机**: 现有VLA推理方法（如基于语言或视觉的CoT）主要依赖当前观测状态，缺乏对未来场景演变的显式预测；且每次推理都进行完整的时空推理展开（rollout），带来巨大的计算延迟。
- **本质改动**: 将未来场景的想象从像素级生成转移到潜在视觉表征空间，并设计“场景要旨记忆（Scene Gist Memory）”机制，将训练时的未来推理知识内化为一个紧凑的Token，推理时直接预测该Token从而跳过显式的未来展开。
- **技术溯源**: 基于PaliGemma架构（SigLIP So400m/14视觉编码器 + Gemma-2B多模态前缀模型 + Gemma-300M动作专家）。

**2. 技术拆解**
- **核心方法**: 
  1. 潜在时空推理（Latent Spatiotemporal Reasoning）：在视觉表征空间直接预测未来关键帧的潜在状态转移，而非生成像素级视频，用预测的未来状态指导动作选择。
  2. 场景要旨记忆（Scene Gist Memory）：包含要旨压缩器和要旨编码器。训练时，压缩器将推理增强的表征压缩为“场景要旨向量”；推理时，编码器直接从当前上下文预测该向量，替代耗时的未来推理展开。
- **关键细节**: 
  - 输入输出：输入当前视觉观测和语言指令，输出动作块（action chunk）。
  - 模型结构：视觉编码器 + 视觉语言骨干网络 + 潜在时空推理模块 + 推理策略；以及要旨压缩器、要旨编码器和要旨策略。
  - 规模/超参：预测未来K=10个潜在状态；Gist Encoder使用2层MLP；方向一致性损失权重λ_dir=0.1。
- **训练/优化目标**: 
  - 潜在时空推理：最小化预测的未来视觉转移与真实转移的L2距离（回归损失），并加上余弦相似度损失（方向一致性损失）。
  - 场景要旨记忆：分两阶段。先冻结推理策略训练压缩器，使其输出的动作与推理策略对齐；再冻结压缩器训练编码器，通过表示对齐损失（L2）和动作一致性损失（L2）进行监督。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（Spatial/Object/Goal/Long）, LIBERO-Plus, VLABench。真实世界部署在双臂UR3机器人上（pick-and-place-a-screwdriver任务）。
  - 对比对象（baseline）：ACoT-VLA, Octo, OpenVLA, π0, π0.5, CoT-VLA, WorldVLA, DreamVLA, Fast-WAM, ImageWAM等。
  - 测试环境与负载：单张NVIDIA A6000 GPU用于推理延迟评估；8张H100训练推理模块，4张A6000训练要旨记忆模块。
- **评价指标**: 
  - 仿真：平均成功率（%）（LIBERO/LIBERO-Plus），Intention Score (IS) 和 Progress Score (PS)（VLABench）。
  - 真实世界：任务成功率（%）。
  - 效率：每个动作块（action chunk）的推理延迟（ms）。
- **主要结果**: 
  - LIBERO：IG-VLA平均成功率达98.9%，超越最强baseline ACoT-VLA（98.5%）。
  - LIBERO-Plus：平均成功率88.5%，超越ACoT-VLA（88.0%），在Language变体上提升显著（79.7% -> 85.6%）。
  - VLABench：平均IS达66.68，超越ACoT-VLA（63.5）。
  - 效率：要旨策略（Gist Policy）推理延迟降至169.5ms/动作块，比FastWAM-IDM（1081ms）快6.38倍，比FastWAM 1-step（302ms）快1.78倍，比ImageWAM（263ms）快1.55倍。
  - 真实世界：成功率62.5%，高于π0.5（56.2%）和ACoT-VLA（50.0%）。
