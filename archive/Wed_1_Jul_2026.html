            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [DVG-WM: Disentangled Video Generation Enables Efficient Embodied World Model for Robotic Manipulation] (DVG-WM：解耦视频生成赋能高效机器人操作具身世界模型)
- **研究机构**: `南洋理工大学 (NTU)、北京邮电大学 (BUPT)、GigaAI`
- **Arxiv ID**: `2606.32028` | [点击跳转](https://arxiv.org/abs/2606.32028)

**0. 论文标题**
- **英文标题**: DVG-WM: Disentangled Video Generation Enables Efficient Embodied World Model for Robotic Manipulation
- **中文标题**: DVG-WM：解耦视频生成赋能高效机器人操作具身世界模型
- **研究机构**: 南洋理工大学 (NTU)、北京邮电大学 (BUPT)、GigaAI

**1. 整体逻辑**
- **研究任务**: 基于初始图像和语言指令预测未来视频轨迹的具身世界模型，并用于下游的机器人动作规划。
- **研究动机**: 现有的视频世界模型把“动力学建模”（关注接触、滑动等物理交互，需要低层时间推理）和“高保真视觉合成”（关注纹理和语义，需要高分辨率）耦合在一起。这导致在高分辨率下推理太慢（无法用于迭代规划），或者在低分辨率下丢失关键的接触细节。
- **本质改动**: 将视频生成解耦为“低分辨率动力学预览”和“高分辨率视觉细化”两个阶段。先在低分辨率下快速预测物理交互过程，再在高分辨率下恢复细节生成高保真视频。
- **技术溯源**: 视频生成基座使用 CogVideoX（预览阶段用 5B 模型，细化阶段用 2B 模型），视频压缩使用 3D causal VAE，动作生成使用 Diffusion Policy (DP)。

**2. 技术拆解**
- **重点改进**: 
  1. **两阶段解耦生成**：先在低分辨率（256x384）快速生成物理交互的粗略轨迹，再在高分辨率（480x720）生成高保真视频。
  2. **基于 Flow Matching 的级联机制**：细化阶段不用传统的从头去噪，而是用 Flow Matching 直接学习从低分辨率潜变量到高分辨率潜变量的映射路径，大幅减少去噪步数。
  3. **潜空间退化机制 (Latent Degradation)**：训练细化阶段时，不在像素层做模糊退化，而是在潜空间对低分辨率特征加扰动。这能逼迫模型在细化时真正去重建夹爪和物体接触的精细结构，而不是简单地把像素放大。
- **架构细节**: 
  - **输入输出**：输入初始帧和语言指令，输出 49 帧、720p 分辨率的视频，以及通过逆动力学模型提取的动作序列。
  - **模型结构**：预览阶段用 CogVideoX-5B（加 LoRA rank 128 微调），细化阶段用参数量更小的 CogVideoX-2B（因为操作场景结构相对简单）。动作专家使用纯视觉的 Diffusion Policy。
- **核心 Loss**: 
  - 预览阶段：标准的扩散模型去噪 Loss。
  - 细化阶段：Flow Matching Loss（预测潜变量插值路径的速度场）。
  - 动作生成阶段：Diffusion Policy 的标准去噪 Loss。训练时先单独训练世界模型，再联合微调世界模型和动作专家。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO（仿真）和自采的真实世界数据集（7K 条轨迹）。
  - Baseline：CogVideoX-5B、Wan2.1-14B、LongScape、LVP-14B。
- **评价指标**: 
  - 视频质量：PSNR, SSIM, LPIPS, FVD。
  - 物理准确性：Object-level accuracy（人工检查是否操作了正确的物体）、Mask-IoU（生成视频与真实视频中机械臂区域的分割重合度）。
  - 任务表现：真实世界 9 个任务的成功率。
  - 效率：推理时间。
- **实验结果**: 
  - **质量与准确性**：视频质量指标平均提升 3.7%。关键的是 Object-level accuracy 达到 89%（基线最高 80%），说明解耦设计让模型更准确地理解了物理交互，减少了抓错物体的情况。
  - **推理速度**：推理时间 88.7 秒，比 LVP-14B（354.2 秒）快 3.97 倍，比 CogVideoX-5B（236.8 秒）快 2.6 倍。主要因为细化阶段只需 4 步去噪，且预览阶段在低分辨率下运行。
  - **真实世界**：结合动作专家后，在真实机械臂操作任务中取得了更好的成功率，验证了其作为动作规划器的实用性。

### 2. 🔥 [Z-1: Efficient Reinforcement Learning for Vision-Language-Action Models] (Z-1：面向视觉-语言-动作模型的高效强化学习)
- **研究机构**: `Zioneer Robot Team`
- **Arxiv ID**: `2606.31846` | [点击跳转](https://arxiv.org/abs/2606.31846)

**0. 论文标题**
- **英文标题**: Z-1: Efficient Reinforcement Learning for Vision-Language-Action Models
- **中文标题**: Z-1：面向视觉-语言-动作模型的高效强化学习
- **研究机构**: Zioneer Robot Team

**1. 整体逻辑**
- **研究任务**: 在 RoboCasa 仿真环境中执行长时序、多步骤的机器人桌面操作任务（如开门、抓取、使用微波炉等）。
- **研究动机**: 现有的 VLA 模型主要靠行为克隆或 SFT 训练，受限于演示数据覆盖度，在长时序任务中容易累积误差，且无法从自身的失败中纠错。虽然用 RL 后训练能解决这个问题，但对于基于 Flow（流匹配）的 VLA 模型，直接上 RL 面临三个痛点：1) Flow 模型推理慢，独立采样整条轨迹的 rollout 成本极高；2) 任务成功奖励太稀疏，导致优化方差大；3) 冻结视觉语言骨干网络会导致感知和定位错误无法在 RL 阶段被修正。
- **本质改动**: 提出了一套专门针对 Flow-based VLA 的高效 GRPO（组相对策略优化）后训练框架。通过“共享前缀”机制大幅削减 rollout 计算量，通过“奖励衰减”机制细化稀疏奖励，并根据任务诊断结果“选择性解冻”视觉骨干进行联合训练。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_{0.5}$ 开源基座模型，视觉语言骨干为 PaliGemma，动作生成模块采用 Flow-SDE。

**2. 技术拆解**
- **重点改进**: 
  1. **共享前缀与树状分支 (Shared-Prefix & Tree-Structured Branching)**：将操作轨迹分为“接近物体”的前缀和“精细操作”的后缀。在同一个 GRPO 采样组内，强制所有轨迹共享前缀的仿真器状态，只在分支点后独立采样后缀。这避免了重复计算前缀，大幅降低 rollout 成本。树状分支则是渐进式分支，防止前缀被完全 mask 掉导致学习信号丢失。
  2. **成功感知奖励衰减 (Success-Aware Reward Decay)**：针对稀疏奖励，对成功的轨迹按完成时间引入衰减因子（越早完成得分越高）。如果一组内全部成功，则用完成时间排序来计算优势（Advantage），避免把慢的成功轨迹当成负样本。
  3. **选择性联合训练 (Selective Joint Training)**：默认只更新动作专家（Action Expert）。但在训练前会进行诊断，如果发现某些任务失败是因为视觉定位或空间推理错误，则解冻 PaliGemma 视觉语言骨干，进行 VLM 和动作专家的联合更新。
- **架构细节**: 
  - **训练流程**：分两阶段。第一阶段按“场景”做 SFT（同一场景下的任务共享数据，提高数据利用率）；第二阶段按“任务”做 GRPO 后训练。
  - **输入输出**：输入为多视角图像和语言指令，输出为连续的动作块（Action chunks）。
  - **模型规模**：基于 $\pi_{0.5}$ 架构，VLM 部分为 PaliGemma（约 3B 参数），动作专家为 Flow 网络。
- **核心 Loss**: 
  - 主 Loss 为 GRPO 的截断目标函数。由于是 Flow 模型，作者将确定性的 Flow 采样路径转化为随机马尔可夫过程（Flow-SDE），从而能够计算动作块的 log-probability 和 GRPO 所需的似然比（Likelihood ratio）。
  - 没有使用额外的 KL 散度正则化项。无视频重建等辅助任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：RoboCasa 基准测试的 24 个标准家庭操作任务（仅使用官方公开的演示数据，未引入私有数据）。
  - **Baseline**：对比了 GR00T、GR00T N1.5、Video Policy、X-WAM，以及论文自身的 SFT 初始化版本（Z-1 SFT）。
- **评价指标**: 任务成功率（Success Rate, %）。
- **实验结果**: 
  - Z-1 RL 在 24 个任务上的平均成功率达到 **80.6%**。
  - 相比自身的 SFT 初始化（67.4%），RL 后训练带来了 **13.2%** 的绝对提升，且在所有 7 个任务类别中均有一致提升。
  - 相比现有 SOTA：比引入了深度信息的 X-WAM 高出 **1.4%**（在 7 个类别中赢了 5 个）；比 GR00T N1.5 高出 **20.9%**；比 GR00T 和 Video Policy 分别高出 **30.9%** 和 **17.3%**。

### 3. 🔥 [UniTacVLA: Unified Tactile Understanding and Prediction in Vision Language Action Models] (UniTacVLA：视觉语言动作模型中统一的触觉理解与预测)
- **研究机构**: `哈尔滨工业大学、大湾区大学、上海交通大学、复旦大学、南京大学、Daimon Robotics`
- **Arxiv ID**: `2606.31723` | [点击跳转](https://arxiv.org/abs/2606.31723)

**0. 论文标题**
- **英文标题**: UniTacVLA: Unified Tactile Understanding and Prediction in Vision Language Action Models
- **中文标题**: UniTacVLA：视觉语言动作模型中统一的触觉理解与预测
- **研究机构**: 哈尔滨工业大学、大湾区大学、上海交通大学、复旦大学、南京大学、Daimon Robotics

**1. 整体逻辑**
- **研究任务**: 接触丰富的灵巧操作任务（如擦拭、插入、装配等需要频繁物理接触和力控的任务）。
- **研究动机**: 现有的VLA模型只靠视觉，看不清局部的瞬态接触（如打滑、卡死、微小对齐误差）。现有的加入触觉的VTLA方法，只把触觉当成被动的辅助输入拼接到网络里，没有真正去理解触觉语义，也无法预测未来的接触状态。此外，VLA通常输出低频的开环动作块，在接触任务中，小误差会迅速累积导致任务失败。
- **本质改动**: 把触觉信号从“被动辅助输入”升级为“主动的交互预测线索”。构建了一个统一的触觉隐空间，同时做当前触觉状态推理（理解）和未来触觉状态预测（预测），最后加了一个高频控制器，用预测和实时的触觉反馈去修正低频动作。
- **技术溯源**: 基于 $\pi_0$ / $\pi_{0.5}$ 等VLA架构，结合了 VMAE（变分掩码自编码器）做触觉编码，LLM（大语言模型）做思维链推理，DiT（扩散Transformer）做细粒度预测。

**2. 技术拆解**
- **重点改进**: 
  1. 引入“统一触觉Token”和“触觉思维链(T-CoT)”来强迫模型理解当前的接触阶段和语义。
  2. 设计“粗到细”的触觉预测模块，分两步预测未来的触觉状态。
  3. 提出“动作-触觉混合控制器”，利用预测的未来触觉和当前真实触觉，对低频动作进行高频残差修正。
- **架构细节**:
  - **输入输出**: 输入为视觉图像、语言指令、左右夹爪的视触觉图像（3通道形变信息）；输出为动作块（Action Chunk）。
  - **触觉编码**: 用VMAE把触觉图像压缩成紧凑的触觉Token，并重建以保证物理信息不丢失。
  - **统一触觉理解**: 在VLM中注入一组可学习的“统一触觉Query”来提取触觉信息。利用预训练LLM，以这些Query为条件自回归生成“触觉思维链(T-CoT)”，用自然语言描述当前接触阶段，强迫触觉特征具备语义感知能力。
  - **触觉预测**: 因为直接预测高维触觉太慢，采用粗到细策略。先用轻量MLP预测粗粒度的未来触觉趋势，再用DiT以粗粒度特征和当前触觉为条件，生成细粒度的未来触觉隐变量（推理时直接用隐变量，不解码回图像）。
  - **混合控制器**: 一个轻量Transformer。输入当前动作、预测的未来触觉隐变量、当前真实触觉隐变量。输出一个经过tanh限幅的残差动作，叠加到原动作上，实现高频闭环修正。
- **核心 Loss**:
  - **触觉表征学习**: VMAE的重建Loss（掩码部分+可见部分）+ KL散度正则化。
  - **阶段一（主网络训练）**: 动作的 Flow Matching Loss + T-CoT的交叉熵Loss + 粗触觉预测的 L1 Loss + 细触觉预测的 Flow Matching Loss。此阶段只用无扰动的专家数据。
  - **阶段二（控制器训练）**: 残差动作的 L1 Loss。此阶段混入带有人为扰动和纠错轨迹的数据进行训练。

**3. 实验结果**
- **数据集和baseline**: 真实机器人实验（RealMan 7轴机械臂 + DM-Tac W视触觉传感器）。包含4大类8个子任务（调整、擦拭、插入、装配）。Baseline包括：纯视觉的 $\pi_0$ 和 $\pi_{0.5}$，以及简单拼接触觉输入的 $\pi_{0.5}$-VTLA 和 $\pi_{0.5}$-TacVLA。实验分无扰动（clean）和有扰动（perturbed，如人为推搡、改变平台高度）两种设置。
- **评价指标**: 固定时间内的任务成功率（每种设置每个任务跑50次）。
- **实验结果**: 
  - 在无扰动设置下，UniTacVLA 平均成功率比 $\pi_{0.5}$ 提升约 10%-15%。
  - 在有扰动设置下优势极其明显。例如在USB插入和齿轮装配任务中，Baseline在扰动下成功率基本掉到 0%-10%，而 UniTacVLA 能保持在 48%-60%。
  - 消融实验表明：加 T-CoT 提升 6%，加粗预测提升 8%，加细预测提升 8%，加高频控制器提升 10%，各模块缺一不可。
  - 额外发现：在推理时如果直接关掉真实触觉输入（仅用视觉和语言），因为训练时学到了触觉先验，其成功率依然比纯视觉的 Baseline 高，证明模型确实学到了通用的接触物理先验。

### 4. 🔥 [Revisiting Parameter Redundancy in Vision-Language-Action Models: Insights from VLM-to-VLA Adaptation] (重新审视视觉-语言-动作模型中的参数冗余：来自VLM到VLA适配的启示)
- **研究机构**: `中国科学院计算机网络信息中心、中国科学院大学、上海交通大学、悉尼大学`
- **Arxiv ID**: `2606.31382` | [点击跳转](https://arxiv.org/abs/2606.31382)

**0. 论文标题**
- **英文标题**: Revisiting Parameter Redundancy in Vision-Language-Action Models: Insights from VLM-to-VLA Adaptation
- **中文标题**: 重新审视视觉-语言-动作模型中的参数冗余：来自VLM到VLA适配的启示
- **研究机构**: 中国科学院计算机网络信息中心、中国科学院大学、上海交通大学、悉尼大学

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的参数剪枝与轻量化。
- **研究动机**: 现有的VLA模型参数量太大，现有的剪枝方法一剪性能就崩，必须靠微调或低秩适应来“回血”。作者质疑：如果剪完必须靠微调才能用，那剪掉的真的是冗余参数吗？现有的做法其实掩盖了误杀关键参数的问题。
- **本质改动**: 抛弃“先剪枝、后微调恢复”的套路，利用VLM微调成VLA时的参数变化量（$\Delta W$）来找真正的冗余参数，实现剪完直接能用、无需微调恢复的剪枝。
- **技术溯源**: 基于 OpenVLA (Prismatic VLM, 包含 Llama 2, DINOv2, SigLIP) 和 $\pi_{0.5}$ (PaLI-Gemma) 等开源VLA基座。

**2. 技术拆解**
- **重点改进**: 把VLM到VLA的参数变化量（$\Delta W$）当成识别冗余参数的信号，并发现不同模块（语言模型、视觉编码器、投影层）的变化规律完全不同（即模块异质性），据此设计了一套多模块联合剪枝方案。
- **架构细节**: 
  - **输入输出**: 输入是VLM的原始权重和VLA微调后的权重，输出是各模块的剪枝掩码（Mask）。
  - **模型结构**: 计算权重的相对变化量 $\Delta W_{rel}$。作者发现变化规律不是全局统一的：比如LLM的FFN层中间层稳定、首尾层变化大；视觉编码器浅层和深层的变化重点也不同。因此不能全局一刀切，必须按模块分别设定剪枝策略。
  - **模型规模**: 针对数十亿参数级别的 OpenVLA 和 $\pi_{0.5}$ 进行剪枝。
- **核心 Loss**: 本文是分析框架，不涉及模型训练的Loss。核心机制是“控制剪枝”（Controlled Pruning）：通过直接对比剪掉“高差异参数”和“低差异参数”后的模型表现，用任务成功率来验证差异信号和参数重要性的因果关系。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO benchmark（包含Spatial, Object, Goal, Long四个子集）。
  - **baseline**: 现有的剪枝方法（LLM-Pruner, FLAP, Wanda），以及未剪枝的原始 OpenVLA 和 $\pi_{0.5}$。
- **评价指标**: 任务成功率（Success Rate, SR）。核心约束是：剪枝后绝对不进行任何微调恢复，直接测推理性能。
- **实验结果**: 
  1. 验证了“微调恢复”是个伪命题：剪掉变化小的参数后模型直接崩溃，微调后虽然恢复了，但说明剪掉的是关键参数，不是真冗余。
  2. 验证了参数差异信号的有效性，且不同模块规律不同。例如在OpenVLA的DINOv2中，剪高差异的Attention头会崩溃，但剪高差异的FFN通道就没事。
  3. 最终效果：用这套多模块联合剪枝方案，在完全不微调的情况下，把 OpenVLA 和 $\pi_{0.5}$ 的参数量砍掉了 12% 到 30%，同时还能保住原来 90% 左右的性能。而传统的剪枝方法在同样不微调的条件下，性能直接全军覆没。

### 5. 🔥 [3D HAMSTER: Bridging Planning and Control in Hierarchical Vision Language Action Models through 3D Trajectory Guidance] (3D HAMSTER：通过3D轨迹引导弥合分层视觉语言动作模型中的规划与控制)
- **研究机构**: `KAIST, POSTECH, KRAFTON AI`
- **Arxiv ID**: `2606.31329` | [点击跳转](https://arxiv.org/abs/2606.31329)

**0. 论文标题**
- **英文标题**: 3D HAMSTER: Bridging Planning and Control in Hierarchical Vision Language Action Models through 3D Trajectory Guidance
- **中文标题**: 3D HAMSTER：通过3D轨迹引导弥合分层视觉语言动作模型中的规划与控制
- **研究机构**: KAIST, POSTECH, KRAFTON AI

**1. 整体逻辑**
- **研究任务**: 分层视觉-语言-动作（Hierarchical VLA）架构下的机器人操作任务（高层语义规划 + 低层电机控制）。
- **研究动机**: 现有的分层VLA（如HAMSTER）中，高层VLM规划器只输出2D轨迹，但主流的低层控制器（如基于点云的策略）都在3D空间运行。2D轨迹缺乏深度信息，反投影到3D时会直接“贴”在场景表面上（论文称为 graffiti effect），导致几何失真，低层控制器无法准确执行规划意图。
- **本质改动**: 让高层规划器直接输出带有度量深度的3D轨迹 $(u,v,d)$，直接对齐3D低层控制器的操作空间，消除2D到3D的表示鸿沟。
- **技术溯源**: 高层基座使用 Qwen3-VL-8B，低层策略基座使用 3DFA (3D FlowMatch Actor)，深度编解码器使用 LingBot-Depth 进行初始化。

**2. 技术拆解**
- **重点改进**: 
  1. 给VLM增加了一个专门的深度编码器，将深度特征与RGB特征融合，弥补单目RGB无法可靠恢复度量深度的缺陷。
  2. 引入密集深度重建Loss作为辅助任务，防止深度特征在微调过程中退化。
  3. 采用两阶段训练和数据混合策略：混合了3D轨迹数据和2D视觉语言数据，防止模型在微调时遗忘原有的通用视觉语言能力。
  4. 低层策略端，将3D轨迹反投影到世界坐标系并拼接到场景点云中，加入可学习的模态Embedding，让模型能区分“轨迹引导点”和“场景几何点”。
- **架构细节**: 
  - **输入**: 单张RGB图像、深度图、语言指令。
  - **输出**: 自回归生成的3D轨迹序列 $(u,v,d)$，包含 $T$ 个waypoint。
  - **模型规模**: 高层规划器为 Qwen3-VL-8B-Instruct；低层策略为基于点云的 3DFA。
  - **训练流程**: Stage 1 冻结主干，只训练深度投影器和解码器以对齐特征空间；Stage 2 冻结编码器，使用 LoRA 微调 LLM 进行轨迹预测。
- **核心 Loss**: 
  - **规划器**: $\mathcal{L} = \mathcal{L}_{LM} + 0.1 \times \mathcal{L}_{depth}$。主Loss是自回归语言建模Loss，辅助Loss是 L1 深度重建Loss（通过轻量级解码器重建整张深度图，提供场景级几何先验）。
  - **低层策略**: Rectified Flow Matching 的速度场 Loss + 夹爪开闭动作的 BCE Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **轨迹预测**: 自建 DroidSpatial-Bench。对比闭源大模型（Sonnet-4.6, GPT-5.2, Gemini-3.0-Pro）和开源基线（RoboBrain-2.5-8B）。
  - **仿真**: Colosseum benchmark（基于RLBench，包含14种外观、视角等扰动）。对比无引导的 3DFA、2D引导的 3DFA (即原版 HAMSTER)。
  - **真机**: Franka 机械臂，3个任务（按键、倒水、抓取放置）。对比无引导、2D引导、以及端到端大模型 $\pi_{0.5}$。
- **评价指标**: 
  - **轨迹预测**: 起点、终点、或两者在 5cm / 10cm 误差范围内的准确率。
  - **仿真/真机**: 任务成功率（真机采用 0-1 的连续得分，按到达、抓取、运输、放置等阶段给分）。
- **实验结果**: 
  - **轨迹预测**: 增加深度编码器的 VLM 在 3D 轨迹预测准确率上显著优于所有闭源大模型（如 Gemini-3.0-Pro）和开源基线，且在分布外场景下保持度量一致性。
  - **仿真**: 在外观改变（如光照、纹理变化）等分布偏移下，3D 引导比 2D 引导的成功率提升非常明显；2D 引导在分布内甚至会损害性能。
  - **真机**: 在未见语言、空间、视觉及综合泛化条件下，3D 引导持续提高操作成功率。2D 引导会导致动作轨迹扭曲，而 3D 引导能够忠实、准确地执行高层的规划意图。

### 6. 🔥 [MIRTH: Mutual-Information Reasoning with Temporal Hubs for Vision-Language-Action Agents] (MIRTH：面向视觉-语言-动作智能体的时间枢纽互信息推理)
- **研究机构**: `立命馆大学 (Ritsumeikan University), 浙江大学 (Zhejiang University)`
- **Arxiv ID**: `2606.31167` | [点击跳转](https://arxiv.org/abs/2606.31167)

**0. 论文标题**
- **英文标题**: MIRTH: Mutual-Information Reasoning with Temporal Hubs for Vision-Language-Action Agents
- **中文标题**: MIRTH：面向视觉-语言-动作智能体的时间枢纽互信息推理
- **研究机构**: 立命馆大学 (Ritsumeikan University), 浙江大学 (Zhejiang University)

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作（VLA）模型的机器人操作控制。
- **研究动机**: 现有开源 VLA（如 OpenVLA）存在三个核心痛点：1）单帧输入导致“时间近视”，物体被遮挡或移动后容易丢失状态；2）高层指令到底层动作之间缺乏中间推理，直接映射缺乏规划，而用文本做中间监督成本高且存在多对一模糊问题；3）自回归逐维度生成离散动作 token 导致推理延迟极高，无法满足实时控制需求。
- **本质改动**: 在预训练 VLA 基础上，加入双尺度时间记忆模块压缩长短期历史信息；插入可学习的潜在推理 token，通过互信息对比学习对齐上下文与动作；将动作解码从自回归标量生成改为并行向量预测。
- **技术溯源**: 基于 OpenVLA 等开源 VLA 架构，视觉编码器采用 DINOv2 + SigLIP，语言骨干采用预训练大语言模型（LLM）。

**2. 技术拆解**
- **重点改进**: 
  1. **双尺度时间记忆枢纽**：长期记忆用多尺度指数移动平均（EMA）压缩场景布局，短期记忆用带时间衰减的注意力机制捕捉近期运动趋势，两者融合后以固定长度输入，解决历史上下文膨胀问题。
  2. **潜在推理（Latent Reasoning）**：在视觉/语言输入和动作输出之间插入一组可学习的推理 token。不依赖文本标注，而是通过对比学习最大化推理 token 与多模态上下文、动作轨迹之间的互信息，形成隐式的规划桥梁。
  3. **并行动作解码**：一个动作向量只占一个 token 位置，整段动作序列通过一个轻量 MLP 并行解码，彻底消除动作维度的自回归开销。
- **架构细节**: 
  - **输入**：当前帧视觉/本体感觉特征、语言指令、融合后的历史记忆特征、潜在推理 token。
  - **模型结构**：视觉特征提取后，与记忆枢纽特征通过前缀拼接（Prefix）或特征调制（Infusion）融合。融合特征、语言指令、推理 token、动作 token 拼接后输入 LLM。LLM 输出后，动作 token 位置的特征经 2 层投影头映射为连续动作。
  - **模型规模**：基于 7B/9B 级别的 VLM 骨干（如 OpenVLA-OFT 使用的架构）。
- **核心 Loss**: 
  - **主 Loss**：动作预测的 L1 回归 Loss。
  - **辅助 Loss**：互信息推理 Loss（基于 InfoNCE），包含两部分：推理 token 与动作表示的对比 Loss，以及推理 token 与多模态上下文表示的对比 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO 仿真基准（包含 Spatial, Object, Goal, Long 四个子集），以及真实世界的 LeRobot 硬件平台。
  - **Baseline**：Diffusion Policy, Octo, OpenVLA, OpenVLA-OFT。
- **评价指标**: 任务成功率（Success Rate），以及推理吞吐量/控制频率（Throughput/Latency）。
- **实验结果**: 
  - 在 LIBERO 仿真中，MIRTH 平均成功率达到 98.1%，显著优于单帧的 OpenVLA (76.5%) 和微调版的 OpenVLA-OFT (97.1%)。在需要长程记忆的 LIBERO-Long 任务上达到 95.3%。
  - 在真实 LeRobot 平台上，MIRTH 在 5 个任务组中均取得最高成功率，且得益于并行解码，推理速度和控制吞吐量显著优于自回归基线。
  - 消融实验和定性分析表明，时间记忆枢纽让模型在物体遮挡时能保持位置记忆，潜在推理 token 使模型具备了动态重规划和错误恢复（error recovery）能力。

### 7. 🔥 [A Modular Vision-Language-Action Robotics Framework for Indoor Environments] (面向室内环境的模块化视觉-语言-动作机器人框架)
- **研究机构**: `CMU VLA Challenge 参赛团队 (作者未明确标注单一机构)`
- **Arxiv ID**: `2606.31144` | [点击跳转](https://arxiv.org/abs/2606.31144)

**0. 论文标题**
- **英文标题**: A Modular Vision-Language-Action Robotics Framework for Indoor Environments
- **中文标题**: 面向室内环境的模块化视觉-语言-动作机器人框架
- **研究机构**: CMU VLA Challenge 参赛团队 (作者未明确标注单一机构)

**1. 整体逻辑**
- **研究任务**: 在室内未知仿真环境中，让机器人根据自然语言指令自主探索，并回答三类问题：数值统计（如数椅子）、物体定位（如找盆栽）、以及基于路点的导航（如去厨房找桌子）。
- **研究动机**: 直接用 VLM 看当前画面回答问题，机器人没有环境记忆，答不出视野外的问题；而依赖先验 3D 模型（如 VLA-3D）的方法在真实未知环境里行不通，因为拿不到先验地图。因此需要一套能边探索边建图，并把语言指令和地图上下文结合起来的系统。
- **本质改动**: 放弃端到端的动作生成，搭建了一套模块化系统。核心是边探索边构建带有语义特征的 3D 体素地图。收到指令后，先让大模型分类意图，在体素地图里通过特征匹配定位目标物体，最后把地图上下文输入给大模型，输出最终答案或导航路点。
- **技术溯源**: 基于 ROS 框架。视觉特征提取用 OwlViT (CLIP embeddings)，核心推理和意图分类用 Gemini 2.0 Flash，导航建图用传统的 2D 栅格地图和 3D 体素地图。

**2. 技术拆解**
- **重点改进**: 
  1. 实时动态构建 3D 语义体素地图：不依赖先验 3D 模型，探索时直接用 OwlViT 提取物体特征并融入体素地图。
  2. 三阶段语言处理流水线：意图分类 -> 基于体素地图特征的物体定位 (Grounding) -> 结合地图上下文让 VLM 推理。
  3. 针对 10 分钟限时任务的探索与建图加速优化。
- **架构细节**: 
  - **输入输出**: 输入是实时相机画面、LiDAR 数据和自然语言指令；输出是数值答案、物体 3D 坐标或导航路点。
  - **模型结构**: 视觉特征提取用 OwlViT-base-patch32；推理引擎用 Gemini 2.0 Flash（为降低延迟选用 Flash 版，Deepseek v3 做备用）。
  - **具体流程**: LiDAR 建 2D 栅格地图用于规划路线 -> 相机画面用 OwlViT 检测物体并提取特征 -> 融合到 3D 语义体素地图（限时 500 秒） -> 收到指令后，Gemini 分类指令类型 -> 提取名词，在体素地图中计算特征相似度定位物体 -> 把物体位置、属性等打包成 Prompt 给 Gemini -> 解析输出，执行对应动作（返回数字、输出坐标、或生成避开障碍物的路径）。
- **核心 Loss**: 本文是系统框架论文，未训练模型，无自定义 Loss。直接调用预训练模型（OwlViT, Gemini）进行推理，导航部分使用传统路径规划算法的代价函数。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: CMU VLA Challenge 提供的 AI Habitat 和 Unity 仿真环境（基于 Matterport3D 的 18 个室内场景）。
  - **Baseline**: 
    1. 无记忆模型：直接用 BLIP2-opt-2.7b 看当前帧回答（缺乏全局记忆，效果差）。
    2. 依赖先验 3D 模型的方法：如 VLA-3D（需要预先生成 3D 扫描，无法在未知环境实时使用）。
    3. 对比框架：SORT3D（依赖 3D LiDAR 和 2D VLM 描述的零样本 3D 指代框架）。
- **评价指标**: CMU VLA Challenge 的任务完成度、回答准确率，以及 10 分钟内的任务完成时间。
- **实验结果**: 
  - 系统成功在 10 分钟内完成探索、建图和问答/导航任务。
  - 通过工程优化（路点间距从 0.6m 增至 1.25m，到达阈值从 0.65m 增至 1.0m，体素尺寸增至 0.15m），将探索建图时间从 8分42秒 缩短至 4分17秒，时间减少约 50%，同时保持了足够的问答准确率。

### 8. 🔥 [Efficient Sim-to-Real Transfer of World-Action Models from Synthetic Priors] (基于合成先验的世界-动作模型高效Sim-to-Real迁移)
- **研究机构**: `普渡大学 (Purdue University), 机器人与人工智能研究所 (Robotics and AI Institute)`
- **Arxiv ID**: `2606.31101` | [点击跳转](https://arxiv.org/abs/2606.31101)

**0. 论文标题**
- **英文标题**: Efficient Sim-to-Real Transfer of World-Action Models from Synthetic Priors
- **中文标题**: 基于合成先验的世界-动作模型高效Sim-to-Real迁移
- **研究机构**: 普渡大学 (Purdue University), 机器人与人工智能研究所 (Robotics and AI Institute)

**1. 整体逻辑**
- **研究任务**: 机器人操作任务的Sim-to-Real（仿真到真机）迁移，具体包括物体抓取、放置、开抽屉等。
- **研究动机**: 真机采集数据成本太高，仿真数据便宜但存在Sim-to-Real Gap。之前的“世界-动作模型”（同时预测未来画面和动作的生成模型）在纯仿真或纯真机环境下表现不错，但还没人证明过它们能完全依靠合成数据训练，并直接Zero-shot部署到真实机器人上。
- **本质改动**: 不对模型底层架构做魔改，而是将“视频扩散世界-动作模型”与“广泛的域随机化”及“自动化数据生成管线”结合，验证纯合成数据训练下的Zero-shot真机迁移可行性。
- **技术溯源**: 基座模型为 Cosmos-Predict2（预训练视频扩散模型），策略框架采用 Cosmos Policy，数据生成采用 AnyTask（基于基础模型的自动化运动规划管线）。

**2. 技术拆解**
- **重点改进**: 核心在于数据工程与训练策略。通过极致的域随机化（涵盖纹理、光照、相机位姿、物体位置等）让仿真数据的视觉分布尽量覆盖真实世界；同时用自动化运动规划（AnyTask）代替人工遥操作，自动生成合成数据来训练模型。
- **架构细节**: 
  - **输入输出**: 输入为手腕和第三人称相机的固定RGB图像；输出为未来的视觉帧、机器人动作轨迹和价值估计。
  - **模型结构**: 采用 Cosmos Policy，将动作、未来观察和价值估计统一编码为潜在帧（latent frames），放在同一个扩散过程中进行联合预测。
  - **模型规模**: 使用 40张 H100 GPU 训练 32个 epoch（约72小时）。数据规模较小，每个任务约800条仿真演示，4个任务共计约3200条数据。
- **核心 Loss**: 扩散模型的标准重建 Loss。由于动作、视频帧和价值估计被统一在同一个扩散框架内，Loss 即为联合预测这些潜在帧的误差。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 4个操作任务（抓香蕉、抓砖块、开抽屉、把草莓放进碗里），每个任务 800条纯仿真数据，0条真实数据。
  - **Baseline**: Diffusion Policy (DP)。作为成本参考，DP 分别使用 10条 和 50条 **真实真机数据** 进行训练。
- **评价指标**: 真机 Zero-shot 部署的任务成功率（每个任务测试 10次）。
- **实验结果**: 
  - **本文方法**（0条真实数据）：平均成功率达到 35%（抓香蕉 50%，抓砖块 50%，开抽屉 20%，放草莓 20%）。
  - **对比 Baseline**：DP 使用 10条真实数据成功率仅 5%，使用 50条真实数据成功率为 25%。本文方法在完全不使用真实数据的情况下，平均成功率超过了使用 50条真实数据的 DP。
  - **泛化能力**：模型展现出分布外（OOD）泛化能力，能够 Zero-shot 抓取训练集中未出现过的瓶子，说明模型学到了通用的视觉运动技能，而非单纯记忆特定物体。

### 9. 🔥 [Position: Vision-Language-Action Models Cannot Be Verified to Perform Physical Reasoning] (立场：视觉-语言-动作模型无法被验证为具备物理推理能力)
- **研究机构**: `The University of Sydney (悉尼大学)`
- **Arxiv ID**: `2606.30686` | [点击跳转](https://arxiv.org/abs/2606.30686)

**0. 论文标题**
- **英文标题**: Position: Vision-Language-Action Models Cannot Be Verified to Perform Physical Reasoning
- **中文标题**: 立场：视觉-语言-动作模型无法被验证为具备物理推理能力
- **研究机构**: The University of Sydney (悉尼大学)

**1. 整体逻辑**
- **研究任务**: 反思和批判当前 VLA（视觉-语言-动作）模型的核心假设与评估体系。这是一篇观点论文（Position Paper），不提出新模型，而是指出当前研究范式的根本逻辑漏洞。
- **研究动机**: 当前 VLA 领域存在一种盲目的“叙事漂移”（narrative drift），大家默认 VLM（视觉语言模型）的语义泛化能力提升，就等同于物理执行能力提升。同时，大家只用“任务成功率”这一个指标来评估，根本分不清模型到底是“语义理解对了”还是“物理动作做对了”，导致对模型物理能力的评估名不副实。
- **本质改动**: 没有改动模型结构。本质是把 VLA 策略拆解为“语义映射”和“物理动作决策”两部分，从逻辑上证明当前的评估协议存在严重的“不可识别性”（Non-Identifiability），并呼吁改革评估标准，引入控制变量来分别测试语义和物理能力。
- **技术溯源**: 梳理并批判了当前主流的基于 VLM 骨干的 VLA 系统，包括 RT-2, OpenVLA, OpenVLA-OFT, $\pi_0$, GR00T N1 等。

**2. 技术拆解**
- **重点改进**: 提出了当前 VLA 评估体系的三个致命缺陷（不可识别性）：
  1. **归因不可识别**：任务失败时，分不清是语义理解错了，还是物理执行做错了。
  2. **来源不可识别**：性能提升时，分不清是 VLM 预训练带来的语义先验，还是机器人微调带来的物理理解，或者是单纯的测试集分布重合。
  3. **表征不可识别**：在微调成动作策略时，VLM 原本可能具备的物理常识和约束判断能力，是否被覆盖或退化了，现有评估根本测不出来。
  作者建议未来的评估必须引入“控制变量法”（改变物理条件但不改变语义），来因果归因。
- **架构细节**: 作者将现有 VLA 架构归纳为三大流派：离散 token 输出、扩散策略头、双系统架构。指出不管输出头怎么改，核心都没变：都依赖“预训练 VLM 骨干”，且都隐式假设了“语义充分性”（即认为 VLM 提取的语义特征足够指导物理决策）。但作者指出，VLM 的训练数据全是静态图文，没有物理交互反馈，从结构上讲，它根本学不到质量、摩擦力等物理属性，这个假设在底层就不成立。
- **核心 Loss**: 本文不涉及具体的 Loss 改进。但深刻剖析了当前主流的评估指标（任务成功率）的局限性：它只能衡量最终结果，无法区分“任务理解错误”和“物理执行失败”这两种完全不同的 failure mode。

**3. 实验结果**
- **数据集和baseline**: 本文没有跑新的定量实验。Baseline 是现有的 VLA 评估协议（如基于任务成功率的 manipulation benchmarks）以及现有文献中的归因逻辑。
- **评价指标**: 深度剖析了“任务成功率”这个单一指标的盲区，指出它把语义能力、物理能力、分布重合度全部混为一谈。
- **实验结果**: 通过文献分析（Case Study）证实了评估体系的失效。作者梳理了 RT-2、OpenVLA-OFT、$\pi_0$ 等模型在遇到物理执行失败时的表现（例如 RT-2 推铅笔失败、OpenVLA-OFT 受干扰物影响成功率暴跌）。发现现有研究的作者总是将这些失败归咎于“数据不够”、“分布偏移”等工程问题，而从来没有去验证是不是“语义指导物理”这个根本假设破产了。这证明了现有的评估体系确实在掩盖模型缺乏物理推理能力的真相。
