            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [World Action Models: A Survey (基于摘要内容推断)] (世界动作模型：综述)
- **研究机构**: `未知 (摘要未注明)`
- **Arxiv ID**: `2605.12090` | [点击跳转](https://arxiv.org/abs/2605.12090)

**0. 论文标题**
- **英文标题**: World Action Models: A Survey (基于摘要内容推断)
- **中文标题**: 世界动作模型：综述
- **研究机构**: 未知 (摘要未注明)

**1. 整体逻辑**
- **研究任务**: 综述具身智能中结合世界模型与动作生成的新范式（World Action Models, WAMs）。
- **研究动机**: 现有 VLA 模型只做“观察 - 动作”的反应式映射，不建模物理世界如何演化；现有结合世界模型的工作架构分散，缺乏统一框架。
- **本质改动**: 正式定义 WAMs，将“预测状态”与“生成动作”统一，目标从单纯的动作分布变为“未来状态 + 动作”的联合分布。
- **技术溯源**: 基于 VLA 模型 (Vision-Language-Action) 与世界模型 (World Models) 的早期整合研究。

**2. 技术拆解**
- **重点改进**: 提出了 WAMs 的结构化分类体系，将现有方法分为级联式 (Cascaded) 和联合式 (Joint) 两大类，并梳理了数据生态和评估协议。
- **架构细节**: 按生成模态、条件机制、动作解码策略对现有方法进行细分；输入涵盖视觉、语言及历史状态，输出为未来状态序列与动作序列。
- **核心 Loss**:  surveyed 方法主要优化未来状态和动作的联合分布 (joint distribution over future states and actions)，部分包含视频重建等辅助任务。

**3. 实验结果**
- **数据集和 baseline**: 涵盖机器人遥操作、便携式人类演示、仿真数据、互联网规模第一人称视频；对比分析了现有各类 WAM 架构。
- **评价指标**:  synthesized 评估协议，主要围绕视觉保真度 (visual fidelity)、物理常识 (physical commonsense)、动作合理性 (action plausibility)。
- **实验结果**: 无具体 SOTA 数值（综述论文）；厘清了不同架构范式的权衡，指出了数据稀缺、评估标准不统一等开放挑战及未来机会。

### 2. 🔥 [DreamAvoid: Critical-Phase Test-Time Dreaming to Avoid Failures in VLA Policies] (DreamAvoid：关键阶段测试时推演以避免 VLA 策略失败)
- **研究机构**: `HKU, HKUST, Northwestern University`
- **Arxiv ID**: `2605.11750` | [点击跳转](https://arxiv.org/abs/2605.11750)

**0. 论文标题**
- **英文标题**: DreamAvoid: Critical-Phase Test-Time Dreaming to Avoid Failures in VLA Policies
- **中文标题**: DreamAvoid：关键阶段测试时推演以避免 VLA 策略失败
- **研究机构**: HKU, HKUST, Northwestern University

**1. 整体逻辑**
- **研究任务**: 视觉 - 语言 - 动作（VLA）模型在细粒度操作任务中的鲁棒性提升（如插充电器、精密对齐）。
- **研究动机**: 
    1. VLA 在关键阶段（Critical Phases）对微小动作误差敏感，易导致不可恢复的失败。
    2. 现有 VLA 仅用成功数据训练，缺乏对失败边界的认知。
    3. 全时段测试时计算（Always-on Test-Time Compute）延迟过高，无法实用。
- **本质改动**: 从“全时段推理”改为“关键阶段触发式推演”。仅在检测到关键时刻，利用世界模型生成未来视频片段（Dreaming），评估不同动作候选的后果，择优执行。
- **技术溯源**: 基于 DreamDojo（世界模型）、Robometer（价值/进度模型）及 Flow Matching 基座策略。

**2. 技术拆解**
- **重点改进**: 
    1. **选择性干预**: 引入轻量级 Trigger，仅在关键时刻启动高算力推演。
    2. **边界学习**: 提出自主边界学习范式，收集失败和边界数据训练评估器，避免世界模型只生成“乐观幻觉”。
    3. **动作采样**: 将基座策略的确定性 ODE 采样改为随机性 SDE 采样，生成多个动作候选块。
- **架构细节**: 
    1. **Dream Trigger**: 输入最近 K 帧视觉 + 本体感知，输出关键阶段概率（软标签监督）。
    2. **Action Proposer**: 基于基座 VLA，通过添加噪声项将确定性流匹配转为随机过程，采样多个动作块。
    3. **Dream Evaluator**: 包含世界模型（生成未来视频）和价值模型（预测进度增量）。输入为候选动作 + 当前观测，输出为价值评分。
- **核心 Loss**: 
    1. **Trigger**: 类别平衡的二元交叉熵 Loss。
    2. **Value Model**: Huber 回归 Loss（拟合进度增量） + 连续边际排序 Loss（区分优劣动作对）。训练数据混合了成功、失败及边界案例。

**3. 实验结果**
- **数据集和 baseline**: 
    - **数据集**: 真机数据（AgileX PiperX 机器人，含插充电器等任务）、LIBERO 及 SimplerEnv 仿真基准。
    - **Baseline**: 原始基座 VLA 策略、直接语义评估方法（仅用 VLM 判断动作序列）。
- **评价指标**: 任务成功率（Success Rate）、失败预测准确率（Pilot Study）。
- **实验结果**: 
    1. **Pilot Study**: 在充电器插拔任务的关键帧失败预测中，显式时空推演（Dreaming）准确率达 80.0%，显著优于直接语义评估的 57.5%（后者误报率高）。
    2. **整体性能**: 在真机操作和仿真基准上，DreamAvoid 相比基座策略有效避免了关键阶段失误，提升了整体任务成功率。
    3. **数据效率**: 通过自主收集边界数据，评估器学会了对危险动作降权，减少了世界模型的乐观幻觉。

### 3. 🔥 [Premover: Fast Vision-Language-Action Control by Acting Before Instructions Are Complete] (Premover：通过在指令完成前行动实现快速视觉 - 语言 - 动作控制)
- **研究机构**: `UNIST (韩国蔚山科学技术院), The Catholic University of Korea`
- **Arxiv ID**: `2605.12160` | [点击跳转](https://arxiv.org/abs/2605.12160)

**0. 论文标题**
- **英文标题**: Premover: Fast Vision-Language-Action Control by Acting Before Instructions Are Complete
- **中文标题**: Premover：通过在指令完成前行动实现快速视觉 - 语言 - 动作控制
- **研究机构**: UNIST (韩国蔚山科学技术院), The Catholic University of Korea

**1. 整体逻辑**
- **研究任务**: 在用户指令输入过程中（流式 prefix），VLA 模型如何提前进行视觉 grounding 并决定何时开始执行动作，而非等待指令完全输入。
- **研究动机**: 实际部署中，用户输入指令需要时间（LIBERO 基准中约占交互总时间的 39%）。传统 VLA 在此期间闲置，造成 latency 浪费。
- **本质改动**: 在冻结的 VLA 主干上挂载轻量级模块，利用未完成的指令 prefix 计算“视觉专注图”和“动作就绪门控”，将输入等待时间转化为计算时间。
- **技术溯源**: 基于冻结的 $\pi_{0.5}$ (VLA 模型)；利用模拟器提供的目标物体分割 mask 作为监督信号。

**2. 技术拆解**
- **重点改进**: 
    1. **Vision-Language Focus Map**: 将图像 patch 和语言 token 映射到共享空间，计算相似度得到每个 patch 的相关性概率。
    2. **Action Readiness Gate**: 根据专注图的集中程度（Top-K 均值减去全局均值）计算就绪分数，超过 learned threshold 才执行动作。
- **架构细节**: 
    - 主干网络冻结，仅训练两个 2 层 MLP 投影头（图像侧、语言侧）和一个标量阈值 $\tau$。
    - 参数量小于主干的 1%。
    - 为避免双重前向传播，使用 $t$ 时刻的专注图对 $t+1$ 时刻的图像 token 进行重加权（注入权重 $\alpha=0.2$ 保留背景信息）。
- **核心 Loss**: 
    - **Focus Loss**: 专注图与模拟器目标 mask 的 Class-balanced BCE。
    - **Ready Loss**: 就绪分数与“目标物体是否已出现在 prefix 中”的二值标签的 BCE。
    - 总 Loss 为两者加权和。

**3. 实验结果**
- **数据集和 baseline**: 
    - 数据集：LIBERO (Spatial, Object, Goal, 10), VLA-arena Level-1。
    - Baseline：Full-prompt VLA（等指令输完再动）、Naive Premoving（无门控直接提前动）。
- **评价指标**: 成功率 (Success Rate)、端到端墙钟时间 (Wall-Clock Time，含用户输入时间)。
- **实验结果**: 
    - **LIBERO**: 成功率 95.1% (vs  baseline 95.0%)，平均耗时从 34.0s 降至 29.4s (减少 13.6%)。
    - **对比 Naive**: Naive Premoving 成功率暴跌至 66.4%，证明就绪门控的必要性。
    - **效率**: 训练成本低，不破坏主干预训练知识，显著降低人机交互延迟。

### 4. 🔥 [GuidedVLA: Specifying Task-Relevant Factors via Plug-and-Play Action Attention Specialization] (GuidedVLA：通过即插即用动作注意力特化指定任务相关因素)
- **研究机构**: `复旦大学，上海交通大学，香港大学`
- **Arxiv ID**: `2605.12369` | [点击跳转](https://arxiv.org/abs/2605.12369)

**0. 论文标题**
- **英文标题**: GuidedVLA: Specifying Task-Relevant Factors via Plug-and-Play Action Attention Specialization
- **中文标题**: GuidedVLA：通过即插即用动作注意力特化指定任务相关因素
- **研究机构**: 复旦大学，上海交通大学，香港大学

**1. 整体逻辑**
- **研究任务**: 视觉 - 语言 - 动作（VLA）模型策略学习，即根据视觉观测和语言指令生成机器人动作。
- **研究动机**: 现有 VLA 模型依赖端到端监督，动作解码器隐式学习任务特征，容易过拟合到背景纹理、噪声等虚假相关性上，导致泛化能力弱且决策过程不稳定。
- **本质改动**: 不再将动作解码器视为整体，而是将其中的注意力头（Attention Heads）功能化拆分。手动指定部分注意力头专门负责特定的任务因素（如物体定位、技能逻辑、几何结构），并施加显式辅助监督。
- **技术溯源**: 基于 $\pi_0$ (Flow Matching VLA) 架构，结合 ControlNet 残差适配思想。

**2. 技术拆解**
- **重点改进**: 引入即插即用的注意力头特化机制。利用 ControlNet 风格的残差适配器，在主分支注意力旁并联特化分支，通过 ZeroConv 融合，确保训练初期不破坏预训练权重。
- **架构细节**: 
    - 输入：视觉 Token、语言 Token、动作 Token。
    - 结构：在动作解码器的多层注意力机制中，划分三组专用头：
        1. **物体头 (Object Head)**：监督其注意力图聚焦于任务相关物体区域。
        2. **技能头 (Skill Head)**：监督其特征表示对齐当前动作阶段的技能标签。
        3. **深度头 (Depth Head)**：强制其仅 attend 到由冻结深度编码器产生的 Key/Value，引入 3D 几何信息。
    - 数据：使用 Qwen3-VL 和 SAM2 构建自动化标注管线，生成物体 Mask 和技能标签，减少人工成本。
- **核心 Loss**: 
    - 主 Loss：Flow Matching Loss ($\mathcal{L}_{FM}$)。
    - 辅助 Loss：物体头使用负对数物体质量损失 ($\mathcal{L}_{object}$)；技能头使用 KL 散度损失 ($\mathcal{L}_{skill}$)；深度头无额外 Loss，仅通过结构约束实现。

**3. 实验结果**
- **数据集和 baseline**: 
    - 仿真：LIBERO-Plus（鲁棒性基准）、RoboTwin 2.0。
    - 真机：ALOHA AgileX（家庭任务）、PSI-Bot（实验室任务）。
    - 对比方法：OpenVLA, $\pi_0$, OpenVLA-OFT, RT-1 变体等。
- **评价指标**: 任务成功率 (Success Rate)，涵盖域内及域外（光照、场景、布局变化）泛化设置。
- **实验结果**: 
    - **LIBERO-Plus**: 总成功率 75.4%，优于 $\pi_0$ 的 68.2%，在物体、空间、长程任务套件上均有提升。
    - **真机泛化**: 域内泛化成功率 75.8% ($\pi_0$ 为 55.8%)；场景干扰下 67.5% ($\pi_0$ 为 44.2%)；光照变化下 79.2% ($\pi_0$ 为 57.5%)。
    - **结论**: 显式引导动作解码器学习特定因素，显著提升了模型在分布外场景下的鲁棒性。

### 5. 🔥 [See What Matters: Differentiable Grid Sample Pruning for Generalizable Vision-Language-Action Model] (看见重点：面向通用视觉 - 语言 - 动作模型的可微网格采样剪枝)
- **研究机构**: `未在提供的文本中明确标注 (基于 arXiv 预印本)`
- **Arxiv ID**: `2605.11817` | [点击跳转](https://arxiv.org/abs/2605.11817)

**0. 论文标题**
- **英文标题**: See What Matters: Differentiable Grid Sample Pruning for Generalizable Vision-Language-Action Model
- **中文标题**: 看见重点：面向通用视觉 - 语言 - 动作模型的可微网格采样剪枝
- **研究机构**: 未在提供的文本中明确标注 (基于 arXiv 预印本)

**1. 整体逻辑**
- **研究任务**: 在保持甚至提升机器人操作成功率的前提下，大幅降低 VLA 模型的视觉 Token 数量，解决推理速度慢、计算成本高的问题。
- **研究动机**: 现有 VLA 视觉编码器 Token 太多（如 256 个），导致 Transformer 计算量过大。现有的剪枝方法多是“离散丢弃”（直接扔掉某些 patch），会丢失接触点、边缘等关键几何细节，且多为不可微的启发式方法，导致成功率下降。
- **本质改动**: 将视觉 Token 压缩从“离散丢弃”改为“连续重采样”。不直接删 Token，而是预测关键区域的连续坐标，通过可微双线性插值提取特征。
- **技术溯源**: 基于现有的 VLA 架构，如 $\pi_0$、$\pi_{0.5}$ (Flow-matching) 和 SmolVLA (Auto-regressive)，视觉编码器多用 ViT (如 DINOv2, SigLIP)。

**2. 技术拆解**
- **重点改进**: 提出了 **GridS (Differentiable Grid Sampler)** 模块。核心是用一个轻量级 MLP 根据全局上下文预测 $K$ 个连续坐标 $(x, y)$，然后用可微双线性插值从原特征图上采样，代替传统的固定网格选取。
- **架构细节**:
    - **输入**: 视觉编码器输出的 dense 特征图 (如 $16 \times 16 \times C$)。
    - **流程**: 1. 全局平均 pooling 得到上下文向量；2. MLP 预测 $K$ 个归一化连续坐标；3. 双线性插值采样特征；4. 加上坐标位置编码 (Position Embedding) 恢复几何信息。
    - **规模**: 视觉 Token 从 256 压缩至 16 甚至 4 个 (压缩率 >90%)。
- **核心 Loss**: 无辅助 Loss。直接端到端联合优化，仅使用 VLA 原本的任务 Loss (如动作预测 Loss)，梯度可直接回传至坐标预测网络。

**3. 实验结果**
- **数据集和 baseline**:
    - **仿真**: LIBERO (4 个套件), ALOHA (双手机器人)。
    - **真机**: SO100 机械臂 (Pick & Place, Stack Cubes 等任务)。
    - **Baseline**: OpenVLA, $\pi_0$, $\pi_{0.5}$, SmolVLA 及其结合现有剪枝方法 (FastV, SparseVLM, VLA-Cache)。
- **评价指标**: 任务成功率 (Success Rate), 推理耗时 (Time), 计算量 (FLOPs), 泛化能力 (OOD 场景)。
- **实验结果**:
    - **效率**: 视觉 Token 降至 16 个 (原 6.25%)，FLOPs 降低 **76%**，推理速度提升 **1.23 倍**。
    - **性能**: 在 LIBERO 上，$\pi_0$ + GridS (16 tokens) 比原版 $\pi_0$ 成功率还高 **1.6%**；现有剪枝方法通常会下降 1.5%~4.6%。
    - **泛化**: 在真机 OOD 场景下，成功率提升显著 (如 Stack Cubes 任务提升 **52.4%**)，证明去除背景冗余噪声有助于模型关注关键物体。
    - **极限压缩**: 即使压缩到仅剩 **4 个** 甚至 **1 个** Token，性能仍能与 dense baseline 持平或更优。

### 6. 🔥 [ECHO: Continuous Hierarchical Memory for Vision-Language-Action Models] (ECHO：面向视觉 - 语言 - 动作模型的连续层次化记忆)
- **研究机构**: `西安交通大学 (Xi'an Jiaotong University)`
- **Arxiv ID**: `2605.10993` | [点击跳转](https://arxiv.org/abs/2605.10993)

**0. 论文标题**
- **英文标题**: ECHO: Continuous Hierarchical Memory for Vision-Language-Action Models
- **中文标题**: ECHO：面向视觉 - 语言 - 动作模型的连续层次化记忆
- **研究机构**: 西安交通大学 (Xi'an Jiaotong University)

**1. 整体逻辑**
- **研究任务**: 长程机器人操作任务中的视觉 - 语言 - 动作（VLA）模型记忆增强。
- **研究动机**: 现有 VLA 记忆系统多为线性或扁平存储，缺乏对操作任务层次结构（任务 - 子目标 - 动作）的先验建模，导致长程任务中经验检索效率低，难以泛化到未见过的任务组合。
- **本质改动**: 用双曲几何空间下的连续层次化记忆树，替代传统的扁平向量记忆库，利用几何蕴含关系实现自顶向下的结构化检索。
- **技术溯源**: 基于 $\pi_0$ 基础模型进行集成，借鉴双曲嵌入（Hyperbolic Embeddings）技术。

**2. 技术拆解**
- **重点改进**: 设计双曲自编码器（HAE）将 VLA 隐藏状态映射到 Lorentz 流形；引入“蕴含锥”约束，强制子目标状态位于父任务状态的几何锥内，构建语义记忆树。
- **架构细节**: 输入为任务条件下的隐藏状态，输出为动作块。记忆模块作为插件集成在 $\pi_0$ 骨干网中，通过动态门控机制融合短期上下文与检索到的长期记忆，经残差连接注入动作头。支持后台异步记忆巩固（节点分裂与几何插值）。
- **核心 Loss**: 重构 Loss + 双曲距离 Loss + 蕴含惩罚 Loss（约束子节点不超出父节点蕴含锥角）。辅助任务包括后台的记忆树几何分裂与合成。

**3. 实验结果**
- **数据集和 baseline**: LIBERO 全套 benchmark（Spatial/Object/Goal/Long/Plus）及真实世界 Franka 机器人实验；对比 Octo, OpenVLA, MAP-VLA, MemoryVLA 及 Vanilla $\pi_0$。
- **评价指标**: 任务执行成功率（Success Rate）。
- **实验结果**: 在 LIBERO-Long 上比 Vanilla $\pi_0$ 绝对成功率提升 12.8%（80.7% -> 93.5%）；跨套件组合泛化测试中，仅用源套件记忆使 Long 任务成功率从 80.7% 提升至 89.31%；真实世界实验验证了部署可行性。

### 7. 🔥 [SEVO: Semantic-Enhanced Virtual Observation for Robust VLA Manipulation via Active Illumination and Data-Centric Collection] (SEVO：通过主动照明和数据中心化采集实现鲁棒 VLA 操作的语义增强虚拟观察)
- **研究机构**: `University of Connecticut (康涅狄格大学)`
- **Arxiv ID**: `2605.11114` | [点击跳转](https://arxiv.org/abs/2605.11114)

**0. 论文标题**
- **英文标题**: SEVO: Semantic-Enhanced Virtual Observation for Robust VLA Manipulation via Active Illumination and Data-Centric Collection
- **中文标题**: SEVO：通过主动照明和数据中心化采集实现鲁棒 VLA 操作的语义增强虚拟观察
- **研究机构**: University of Connecticut (康涅狄格大学)

**1. 整体逻辑**
- **研究任务**: 低成本移动机器人（SO-101 机械臂）在多样化真实环境下的抓取与放置任务（目标为高难度透明水瓶）。
- **研究动机**: 社区主流策略（如 ACT、SmolVLA）在训练环境外泛化性极差。背景、光照变化会导致策略失效，现有 Benchmark 多在受控背景下测试，掩盖了这一问题。
- **本质改动**: **不修改策略模型结构**，仅重构观测输入（RGB 流）和数据采集协议。通过物理照明和语义叠加稳定观测分布，通过多样化数据采集打破环境过拟合。
- **技术溯源**: 基于 **ACT** (全参数微调) 和 **SmolVLA** (冻结视觉编码器) 基座，使用 **LeRobot** 工具链。

**2. 技术拆解**
- **重点改进**:
    1.  **机身固定相机**: 替代腕部相机，相机相对于机器人静止，消除臂运动导致的视角分布偏移。
    2.  **主动红光照明**: 5W 红光 LED (620-630nm) 物理标准化透明物体外观，抑制环境光干扰，提供几何反射锚点。
    3.  **实时语义叠加**: YOLO 分割 mask 以黄色半透明层叠加在原图上，提供与背景无关的语义 cue，并作为动作触发的安全门控。
    4.  **多样化数据采集**: 系统性地变化背景、光照、 distractors 和人员走动，迫使策略忽略无关环境特征。
- **架构细节**:
    - **输入**: 经 SEVO 处理后的增强 RGB 图像 + 关节状态 (6-DOF)。
    - **模型**: 直接使用原生 ACT (51.6M, 100% 可训练) 或 SmolVLA (450M, 22.2% 可训练)。
    - **处理流**: 原始 RGB → YOLO 分割 → 颜色叠加 → 策略网络。YOLO 仅作为预处理，不参与策略反向传播。
- **核心 Loss**: 无特殊设计。沿用 LeRobot 默认配置，ACT 使用动作块回归 Loss，SmolVLA 使用 Next-token 预测 Loss。

**3. 实验结果**
- **数据集和 baseline**:
    - **数据**: 遥操作采集 80 条 (ACT) / 120 条 (SmolVLA) 轨迹。
    - **Baseline**: 标准 RGB 输入、固定背景、腕部相机、无主动照明。
    - **对比**: 在训练环境、相似新环境、极端新环境（白地板）下测试。
- **评价指标**: 抓取并放置的成功率 (Success Rate)，每种条件测试 100 次。
- **实验结果**:
    - **训练环境**: SEVO 版 ACT 95% / SmolVLA 83% vs. Baseline 75% / 70%。
    - **新环境泛化**: SEVO 版 ACT 85% / SmolVLA 75% vs. Baseline 30-35% (Baseline 在极端环境下完全失效)。
    - **消融结论**: **数据采集多样性**对泛化贡献最大 > 主动照明 > 语义叠加。
    - **相机位置**: 机身固定相机显著优于社区默认的腕部相机。
    - **模型差异**: ACT 受益大于 SmolVLA，因为 ACT 的卷积层可端到端适应 SEVO 的颜色特征，而 SmolVLA 的冻结 SigLIP 编码器存在信息瓶颈。

### 8. 🔥 [From Imagined Futures to Executable Actions: Mixture of Latent Actions for Robot Manipulation] (从想象未来到可执行动作：用于机器人操作的混合潜在动作模型)
- **研究机构**: `University of Surrey, Tsinghua University (Logos Robotics Group)`
- **Arxiv ID**: `2605.12167` | [点击跳转](https://arxiv.org/abs/2605.12167)

**0. 论文标题**
- **英文标题**: From Imagined Futures to Executable Actions: Mixture of Latent Actions for Robot Manipulation
- **中文标题**: 从想象未来到可执行动作：用于机器人操作的混合潜在动作模型
- **研究机构**: University of Surrey, Tsinghua University (Logos Robotics Group)

**1. 整体逻辑**
- **研究任务**: 基于视频想象（Video Imagination）的机器人操作策略生成。
- **研究动机**: 现有的视频生成模型能预测未来画面，但画面本身不是动作。直接把预测帧给策略模型，要么让策略自己去猜动作因果（负担重），要么直接解码动作（对视频误差太敏感）。核心问题是视觉预测追求“像”，而控制需要“因果”。
- **本质改动**: 不在图像空间做控制，而在动作空间做推理。用逆动力学模型（Inverse Dynamics Model, IDM）把“当前帧 + 预测未来帧”的视觉变化，转换成“潜在动作 token"，再用这些 token 去控制机器人。
- **技术溯源**: 视频生成基于 Stable Video Diffusion (SVD)；逆动力学模型基于 ViT + VQ-VAE；策略头基于 Diffusion Transformer (DiT)。

**2. 技术拆解**
- **重点改进**: 提出了 MoIDM（混合逆动力学模型）。不像以前只用 RGB，这里用了三个专门的 IDM 分别处理语义（Semantic）、深度（Depth）和光流（Flow）信息。每个 IDM 输出离散的潜在动作 token，最后混合在一起给策略用。
- **架构细节**:
    1.  **视频生成**: 微调 SVD，推理时只用 1 步去噪以保证速度，生成未来 RGB 序列。
    2.  **MoIDM**: 输入当前帧和未来帧，通过时空 Transformer 提取特征，经 VQ 码本量化为离散动作 token。三个 IDM 并行工作，输出互补的动作表示。
    3.  **动作头**: 使用 Diffusion Transformer，输入是混合后的潜在动作 token + 视频特征，输出是连续的动作序列。
    4.  **训练流程**: 三阶段训练（1. 微调视频模型 -> 2. 预训练 MoIDM -> 3. 端到端微调 MoIDM 和动作头，视频模型冻结）。
- **核心 Loss**:
    -   **MoIDM 预训练**: 重建损失（Reconstruction Loss）。不仅重建 RGB，还用冻结的基础模型（Depth Anything, SAM2, CoTracker3）提取的深度、语义、光流特征作为监督信号重建对应模态。
    -   **动作头训练**: Flow Matching Loss（流匹配），用于生成连续动作。

**3. 实验结果**
- **数据集和 baseline**:
    -   **仿真**: CALVIN (ABC-D), LIBERO, LIBERO-Plus。
    -   **真机**: UR5e 机器人操作任务。
    -   **对比方法**: OpenVLA, UniVLA, π0, VPP, DreamVLA, OpenVLA-OFT+ 等主流 VLA 和视频动作模型。
- **评价指标**: 任务成功率（Success Rate）、连续完成任务长度（Avg. Len）、鲁棒性评分。
- **实验结果**:
    -   **CALVIN**: 平均连续完成长度 4.55，优于 DreamVLA (4.44) 和 VPP (4.33)。
    -   **LIBERO**: 平均成功率 97.0%，优于 VPP (90.9%) 和 OpenVLA (76.5%)。
    -   **LIBERO-Plus**: 平均成功率 92.7%，比最强基线 OpenVLA-OFT+ (79.5%) 高出 13.2 个百分点。
    -   **真机**: 在真实机器人上验证有效，相比直接条件化视频帧的方法，时序一致性和泛化性更好。
