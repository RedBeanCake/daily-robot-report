            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance] (RynnValue：利用时间距离扩展机器人价值基础模型)
- **研究机构**: `阿里巴巴达摩院 (DAMO Academy, Alibaba Group)、湖畔实验室 (Hupan Lab)`
- **Arxiv ID**: `2608.09853` | [点击跳转](https://arxiv.org/abs/2608.09853)

**0. 论文标题**
- **英文标题**: RynnValue: Scaling Robotic Value Foundation Models with Temporal Distance
- **中文标题**: RynnValue：利用时间距离扩展机器人价值基础模型
- **研究机构**: 阿里巴巴达摩院 (DAMO Academy, Alibaba Group)、湖畔实验室 (Hupan Lab)

**1. 整体逻辑**
- **研究任务**: 机器人操作中的通用价值/奖励建模（为强化学习提供 dense reward 信号）。
- **研究动机**: 现有的通用奖励模型依赖人工偏好标注或归一化进度（0到1）。偏好标注成本高且难跨平台迁移；归一化进度只是单条轨迹内的相对坐标，不符合强化学习中“到目标的剩余代价（cost-to-go）”的物理定义，导致跨任务、跨具身形态的泛化能力很差。
- **本质改动**: 把监督目标从“偏好得分”或“归一化进度”换成“时间距离”（即当前状态到任务完成还需要多少秒）。时间标签可以直接从视频时间戳自动提取，从而摆脱了对偏好标注的依赖，实现了大规模数据扩展。
- **技术溯源**: 基于阿里自研的多模态基座 RynnBrain，语言辅助标注使用了 Qwen3-VL-27B。

**2. 技术拆解**
- **重点改进**: 引入“时间距离”作为价值预测目标，并针对多帧输入设计了防“走捷径”的采样和注意力机制，强制模型依赖视觉状态而非序列位置来预测价值。
- **架构细节**: 
  - **输入**: 语言指令 + 具身元数据 + 8帧随机采样的图像观测。
  - **Query设计**: 在每帧图像后插入一组（8个token）绝对价值 Query（预测到完成的剩余时间），从第二帧起额外插入相对价值 Query（预测相邻两帧的时间差）。
  - **输出头**: 使用两个分布头（distributional heads），将连续时间映射到256个 symlog 分箱，用 two-hot 编码输出。保留原有的 LM 头用于输出自然语言的视频分析和成功判断。
  - **注意力机制**: 设计了“价值隔离注意力”（Value-isolation attention），不同帧的价值 Query 之间互相不可见（mask掉），防止模型直接外推或抄袭前一帧的预测值。
- **核心 Loss**: 
  - **主 Loss**: 绝对时间距离 Loss 和相对时间位移 Loss（均基于 two-hot 分布的交叉熵）。
  - **辅助 Loss**: 自然语言生成 Loss（用于视频描述、指令匹配判断和成功判断）。训练时加入了10%的指令不匹配增强（替换错误指令），此时会屏蔽绝对时间 Loss，教模型识别图文不符的情况。

**3. 实验结果**
- **数据集和baseline**: 训练集包含 7000+ 小时、约 300 万条异构机器人轨迹（涵盖 Open X-Embodiment、AgiBot、EgoDex 等）。对比基线包括基于偏好监督的 SOTA 奖励模型和基于归一化进度的模型。
- **评价指标**: 在 RBM-EVAL-OOD 基准上使用 Kendall's $\tau_a$ 评估轨迹排序能力；在真实机器人平台上评估下游在线/离线强化学习的任务成功率。
- **实验结果**: 
  - **排序能力**: 在零样本 OOD 评估中，Kendall's $\tau_a$ 达到 0.675，超过了完全依赖偏好标注的 SOTA（0.655），大幅领先仅用进度监督的模型（0.292）。
  - **下游 RL**: 将预测的时间距离通过基于势能的奖励塑形（potential-based shaping）转化为密集奖励。真实世界在线 RL 成功率从 52.5% 提升至 72.5%，离线 RL 成功率从 63.8% 提升至 82.5%。

### 2. 🔥 [SLIM-0.5B: Learning Action-Grounded Predictive Latents for Robot Manipulation] (SLIM-0.5B：学习用于机器人操作的与动作关联的预测隐特征)
- **研究机构**: `复旦大学、北京智源人工智能研究院（BAAI）、清华大学、中国人民大学`
- **Arxiv ID**: `2608.09771` | [点击跳转](https://arxiv.org/abs/2608.09771)

**0. 论文标题**
- **英文标题**: SLIM-0.5B: Learning Action-Grounded Predictive Latents for Robot Manipulation
- **中文标题**: SLIM-0.5B：学习用于机器人操作的与动作关联的预测隐特征
- **研究机构**: 复旦大学、北京智源人工智能研究院（BAAI）、清华大学、中国人民大学

**1. 整体逻辑**
- **研究任务**: 语言条件驱动的机器人操作（VLA任务），即根据语言指令和视觉观察生成连续的动作序列。
- **研究动机**: 现有的VLA模型（如OpenVLA）主干网络太大，推理慢且显存占用高，且只是隐式学习动作和观察变化的关系；而世界模型（World Models）去预测未来的像素或视频，浪费算力在背景等无关控制的细节上，推理时生成未来帧还会增加控制延迟。
- **本质改动**: 抛弃庞大的VLM主干和像素级未来预测，提出一个仅0.5B参数的轻量级模型。核心思路是在隐空间做自监督的掩码轨迹预测（同时做正动力学和逆动力学），让视觉隐特征和动作强绑定，然后用Flow Matching直接生成动作，推理时不需要预测未来帧。
- **技术溯源**: 视觉编码器基于 DINOv2，语言编码器基于 T5-small，动作生成基于 Flow Matching，主干网络基于 Mixture-of-Transformers (MoT)。

**2. 技术拆解**
- **重点改进**: 提出了“与动作关联的掩码轨迹预测”。第一阶段训练时，通过掩码动作（用当前和未来隐特征重建动作，即逆动力学）和掩码未来隐特征（用当前隐特征和动作预测未来隐特征，即正动力学），逼迫模型学到的隐空间既能解释动作，又能预测未来状态。第二阶段再用这个主干做Flow Matching训练动作生成。
- **架构细节**: 
  - 模型总参数量约 0.47B。
  - 输入：多视角图像（DINOv2提取的隐变量token）、本体状态（映射为1个token）、语言指令（T5-small编码）。
  - 主干：双流的 Mixture-of-Transformers (MoT)，分为观察流和动作流，两流通过联合注意力交互，语言指令通过交叉注意力分别注入两流。观察流还引入了可学习的“未来槽位”（future slots）来承载预测信息。
  - 输出：连续动作块（Action chunk）。
- **核心 Loss**: 
  - 第一阶段（表征学习）：逆动力学Loss（基于Flow Matching重建被加噪掩码的动作） + 正动力学Loss（预测被掩码的未来观察隐特征，与EMA教师网络的目标算L1 Loss）。
  - 第二阶段（策略训练）：标准的 Flow Matching Loss（根据当前观察和加噪动作预测动作速度场）。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：仿真环境 LIBERO（及测鲁棒性的LIBERO-Plus）、CALVIN ABC->D；真实世界5个操作任务。
  - Baseline：VLA类（OpenVLA, $\pi_0$, OpenVLA-OFT等）和 世界模型类（Fast-WAM, VLA-JEPA等）。真实世界对比了 $\pi_{0.5}$ 和 Fast-WAM。
- **评价指标**: 
  - LIBERO/LIBERO-Plus：任务成功率。
  - CALVIN：平均连续完成指令的长度（满分5）。
  - 真实世界：标准场景及背景、光照、干扰物等OOD扰动下的成功率。
- **实验结果**: 
  - 仿真表现：LIBERO成功率97.5%（与最优持平）；LIBERO-Plus零样本鲁棒性测试中成功率77.45%，显著优于OpenVLA-OFT（69.6%）和VLA-JEPA（79.5%）；CALVIN平均完成长度4.556，达到SOTA。
  - 效率优势：参数量仅0.47B（远小于对比的3B-8.5B模型），无需额外的具身预训练，推理延迟和GPU显存占用大幅降低。
  - 真实世界：在5个任务的混合训练及多种扰动测试中，表现优于或持平大参数量的 $\pi_{0.5}$ 和 Fast-WAM。

### 3. 🔥 [HarnessWAM: Bridging Prediction and Deliberation in World Action Models] (HarnessWAM：弥合世界动作模型中预测与决策的鸿沟)
- **研究机构**: `中国科学院自动化研究所、中国科学院大学、因望智能、北京理工大学、武汉人工智能研究院`
- **Arxiv ID**: `2608.09516` | [点击跳转](https://arxiv.org/abs/2608.09516)

**0. 论文标题**
- **英文标题**: HarnessWAM: Bridging Prediction and Deliberation in World Action Models
- **中文标题**: HarnessWAM：弥合世界动作模型中预测与决策的鸿沟
- **研究机构**: 中国科学院自动化研究所、中国科学院大学、因望智能、北京理工大学、武汉人工智能研究院

**1. 整体逻辑**
- **研究任务**: 复杂长程具身操作任务（这类任务需要全局规划、跨阶段状态维护、执行验证和失败恢复）。
- **研究动机**: 现有的世界动作模型（WAM）只能做有限步的局部预测和动作生成，缺乏全局任务状态维护、结果验证和失败恢复的能力。作者将这种局部预测控制与长程任务所需的全局决策之间的不匹配称为“预测-决策鸿沟”。
- **本质改动**: 在WAM外部增加了一个Agent框架（Harness）。不改变底层WAM的结构，而是用VLM做任务管理器来维护全局状态和任务图，把大模型生成的开放计划翻译成WAM能执行的原子动作序列，并引入双时间尺度的反馈闭环来做进度监控、计划修正和失败恢复。
- **技术溯源**: 基于视觉语言模型（VLM）作为上层任务管理器，底层执行器兼容各类现有的世界动作模型（WAM，如文中提到的 LingBot-VA、DreamZero、Fast-WAM 等）。

**2. 技术拆解**
- **重点改进**: 
  1. **证据支撑的任务状态**：用VLM维护场景信念（明确区分已观察、推断、未知状态）和包含物理/认知节点的任务图，避免大模型产生幻觉或遗忘。
  2. **可执行空间投影**：把VLM生成的开放语义计划，通过确定性编译器，映射为底层WAM实际支持的、满足物理和状态约束的原子技能（primitives）序列。
  3. **双时间尺度控制**：快循环用轻量级进度估计器高频评估子任务进度；慢循环在关键节点或异常时触发VLM进行决策（决定继续、推进、观察、重规划或恢复）。
  4. **具身状态恢复**：子任务失败时，让机器人本体恢复到该子任务初始的关节和夹爪状态，但不丢弃已获取的场景记忆和任务进度。
- **架构细节**: 
  - **输入**：多视角RGB图像（全局+腕部）、机器人本体状态、自然语言指令。
  - **上层（Task Manager）**：基于VLM，维护场景信念、任务图和记忆，仅在关键事件触发时进行推理。
  - **中层（Progress Estimator）**：轻量级进度估计器，使用冻结的视觉-语言编码器和因果时间模块，输入最近几帧双视角图像和文本，输出连续进度和完成概率。
  - **底层（WAM）**：接收局部技能指令，输出动作块（action chunk）控制机器人。
- **核心 Loss**: 
  VLM和底层WAM直接调用，不涉及联合训练。主要训练的是中层的**轻量级进度估计器**。其 Loss 由6部分组成：连续进度回归、进度区间分类、时间排序、轨迹端点预测、阶段完成分类和局部单调性约束。

**3. 实验结果**
- **数据集和baseline**: 在 RoboMemArena（侧重记忆依赖和部分可观测的长程任务）和 RoboCerebra Ideal 数据集上进行测试。对比了常规WAM（无外部框架）及其他主流具身Agent基线方法。
- **评价指标**: 完整任务成功率（Full-task Success Rate）和子任务成功率（Subtask Success Rate）。
- **实验结果**: 在 RoboMemArena 上，完整任务成功率和子任务成功率分别达到 59.6% 和 69.9%，达到 SOTA 水平；在 RoboCerebra Ideal 上成功率为 23.7%。结果证明，外挂结构化的状态管理和闭环决策机制，能显著提升WAM在长程、部分可观测任务中的可靠性。

### 4. 🔥 [Rethink Before You Execute: Adaptive Execution for World Action Models] (执行前再思考：世界动作模型的自适应执行)
- **研究机构**: `上海交通大学等（原文未显式标注，基于作者署名推测）`
- **Arxiv ID**: `2608.09492` | [点击跳转](https://arxiv.org/abs/2608.09492)

**0. 论文标题**
- **英文标题**: Rethink Before You Execute: Adaptive Execution for World Action Models
- **中文标题**: 执行前再思考：世界动作模型的自适应执行
- **研究机构**: 上海交通大学等（原文未显式标注，基于作者署名推测）

**1. 整体逻辑**
- **研究任务**: 机器人操作中，世界动作模型（WAM）生成的动作块（action chunk）的执行控制策略。
- **研究动机**: 现有WAM生成动作块后，通常死板地执行固定步数就重新规划。但这不匹配实际情况：简单阶段动作可靠，固定步数会导致频繁重算、浪费算力；困难阶段误差累积快，固定步数会导致执行失败。以前有人用动作熵或注意力来判断要不要重规划，但这些指标不能直接反映“任务到底有没有在推进”。
- **本质改动**: 提出TempoWAM，在WAM外围挂载一个极轻量的“进度监控器”。通过实时评估“任务进度”来决定是继续执行当前动作，还是提前打断重新规划，实现即插即用的自适应执行。
- **技术溯源**: 基于 FastWAM 和 Motus 等世界动作模型（WAM）基座（推理时冻结主干网络）。

**2. 技术拆解**
- **重点改进**: 把“固定步数重规划”改为了“基于任务进度的自适应重规划”。完全不改动WAM主干网络，只在外围增加监控和决策逻辑。
- **架构细节**: 
  - **RPM（循环进度监控器）**: 输入当前图像特征（复用WAM冻结的视觉骨干）、待执行的候选动作、历史进度和任务指令。通过GRU融合特征，输出0到1的进度预测值。整个模块参数量仅2.27M（占主干网络的0.038%），推理开销极低。
  - **AEP（自适应执行协议）**: 计算“实际进度推进率”和“需求推进率”的比值。结合离线校准和在线EMA自适应机制，如果比值小于1，说明当前动作没在推进任务，直接丢弃剩余动作并触发WAM重新规划。
- **核心 Loss**: 
  - **主 Loss**: 进度预测的二元交叉熵损失（BCE），直接用“当前步数/总步数”作为软标签进行监督。
  - **辅助 Loss**: 包含平滑正则化（约束进度预测曲线不要乱跳）和历史一致性正则化（随机mask掉部分图像输入，强迫模型多依赖执行历史，而不是单帧的视觉噪声）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 仿真环境 RoboTwin 2.0（50个任务）、LIBERO（4个子集），以及3个真实机械臂任务。
  - **Baseline**: 固定步数执行的 FastWAM（24步或12步）和 Motus，以及基于注意力的 Auto-Horizon 和基于动作熵的 AAC 两种自适应方法。
- **评价指标**: 成功率（SR）、WAM推理调用次数（Calls，衡量计算成本）、成功任务的执行步数（Steps，衡量轨迹效率）。
- **实验结果**: 
  - **仿真环境**: 在 LIBERO 上成功率持平（平均97.25%），但推理调用次数减少约16%。在 RoboTwin 的困难任务（如开微波炉）上，成功率从53%大幅提升至83%；在简单任务上成功率不变，但调用次数显著减少。对比方法（Auto-Horizon和AAC）不仅调用次数更多，成功率也没提升。
  - **真机实验**: 简单任务减少了26.9%的推理调用，困难任务成功率提升了13.3%。
  - **泛化性**: 免训练直接挂载到另一个基座 Motus 上，某个困难任务（move_can_pot）的成功率直接提升了59%。

### 5. 🔥 [VANE: Reliable Test-Time Training for Vision-Language-Action Models via Future Visual Representation Prediction] (VANE：通过未来视觉表征预测实现视觉-语言-动作模型的可靠测试时训练)
- **研究机构**: `香港中文大学（深圳）、北京邮电大学、中科院自动化所、理想汽车`
- **Arxiv ID**: `2608.09448` | [点击跳转](https://arxiv.org/abs/2608.09448)

**0. 论文标题**
- **英文标题**: VANE: Reliable Test-Time Training for Vision-Language-Action Models via Future Visual Representation Prediction
- **中文标题**: VANE：通过未来视觉表征预测实现视觉-语言-动作模型的可靠测试时训练
- **研究机构**: 香港中文大学（深圳）、北京邮电大学、中科院自动化所、理想汽车

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在部署阶段的无标签在线自适应（测试时训练，TTT）。
- **研究动机**: 现有的VLA测试时训练在闭环操作中不可靠。一方面，所有任务共用一个提示（prompt）去更新，会导致不同任务的修正方向互相干扰；另一方面，边执行边更新会改变后续动作，导致在没验证效果的情况下盲目应用更新，容易把原本正常的策略改崩。
- **本质改动**: 提出VANE框架。把单一提示改成了根据上下文动态组合的提示库；把预测当前状态改成了预测未来的视觉特征；加了一套“先提议、后验证、再提交”的机制，确保在线更新安全可控。
- **技术溯源**: 基于 QwenPi（基于Qwen和flow-matching的VLA模型，属于StarVLA-α框架）以及 V-JEPA 2（用于提取视觉表征）。

**2. 技术拆解**
- **重点改进**: 
  1. **MoLP (潜在提示混合)**: 维护一个包含多个潜在提示的库，通过路由器根据当前的图像和指令稀疏组合出有效的提示，不需要外部提供任务ID，解决多任务间的干扰。
  2. **WPI (世界预测接口)**: 放弃预测当前状态，改为预测执行动作后未来的视觉特征。利用延迟的未来观测作为无标签目标，让模型学习动作带来的未来变化。
  3. **AGV-TTT (注意力门控与验证驱动)**: 监控模型内部注意力的剧烈变化（如接触、抓取物体时）来触发更新。更新先在一个“影子副本”上进行，等未来的图像传回来后，对比新旧提示的预测误差。只有新提示在关键区域误差更小且全局性能没退化时，才正式提交替换。
- **架构细节**: 
  - 基座为QwenPi，使用flow-matching生成动作序列。
  - 提示库包含8个潜在提示，采用Top-2路由。
  - 视觉特征由冻结的V-JEPA 2编码器提取。将当前视觉token、路由后的提示和加噪动作token输入Latent-Action DiT进行未来特征预测。
  - 部署时，VLA主干、路由器和视觉编码器全部冻结，只微调潜在提示库。
- **核心 Loss**: 
  - **训练阶段**: 包含动作生成的flow-matching loss、未来视觉特征预测的MSE loss，以及路由器的负载均衡loss。
  - **部署阶段 (TTT)**: 只计算未来视觉特征预测loss，且仅针对注意力集中的关键视觉token计算误差，梯度只回传给潜在提示库。

**3. 实验结果**
- **数据集和baseline**: 
  - 实验在SimplerEnv仿真平台进行，使用WidowX和Google Robot两种机械臂。
  - 对比基线包括：不加TTT的原始QwenPi、TTT-VLA（单提示状态接地TTT），以及去掉了MoLP、WPI或未来验证机制的消融版本。
- **评价指标**: 闭环操作的平均成功率（Success Rate）。
- **实验结果**: 
  - 在WidowX上，VANE比基础的单提示TTT基线平均成功率提升了3.2个百分点。
  - 诊断实验表明，为每个任务单独更新提示（66.1%）比全局共享一个提示（63.3%）效果更好，证明了MoLP解决任务干扰的有效性。
  - 消融实验证明，加入未来验证机制能有效防止在线盲目更新导致的性能退化。在Google Robot上的结果也表明，部署时的增益与具体任务和硬件形态相关。

### 6. 🔥 [JEPA-WAM: Learning Vision-Language-Action Policies with Joint-Embedding World Modeling] (JEPA-WAM：基于联合嵌入世界模型的视觉-语言-动作策略学习)
- **研究机构**: `XYZ Embodied AI, Columbia University`
- **Arxiv ID**: `2608.09381` | [点击跳转](https://arxiv.org/abs/2608.09381)

**0. 论文标题**
- **英文标题**: JEPA-WAM: Learning Vision-Language-Action Policies with Joint-Embedding World Modeling
- **中文标题**: JEPA-WAM：基于联合嵌入世界模型的视觉-语言-动作策略学习
- **研究机构**: XYZ Embodied AI, Columbia University

**1. 整体逻辑**
- **研究任务**: 机器人视觉-语言-动作（VLA）策略学习，重点解决模型在视觉和空间分布外（OOD）场景下的泛化问题。
- **研究动机**: 现有的世界动作模型（WAM）通过预测未来状态来提升鲁棒性，但基于视频生成的WAM推理太慢、部署成本高。而现有的隐式WAM（Latent WAM）虽然不生成像素，但往往把未来状态压缩成少数几个token，丢失了空间细节；或者把预测模块和动作生成模块分开，导致预测的监督信号无法有效指导动作生成。
- **本质改动**: 在预训练的V-JEPA特征空间里做隐式状态转移预测，并用一个共享的LLM骨干网络同时做“状态转移预测”和“动作特征提取”。训练时用预测任务监督骨干网络，推理时直接砍掉预测分支，只输出动作。
- **技术溯源**: 基于 V-JEPA 2.1（视觉特征提取）、Qwen2.5-0.5B（共享预测器/语言骨干）、DiT（动作生成专家），并在预训练的 π0.5 策略上进行了验证。

**2. 技术拆解**
- **重点改进**: 
  1. 提出“当前-未来联合目标”：不直接预测未来帧的特征，而是把当前帧和未来帧在时间维度拼接，一起输入冻结的V-JEPA，得到保留密集patch空间结构的联合特征。这让模型关注“哪里变了、怎么变的”，而不是死记硬背未来画面。
  2. 共享预测器架构：用同一个Qwen网络处理视觉和语言输入。输出分两路：一路去预测上述联合特征（提供世界模型监督），另一路（专用的action tokens）送给动作专家。这样世界模型的监督信号能直接更新动作生成的骨干网络。
- **架构细节**: 
  - 视觉端：冻结的V-JEPA 2.1（300M参数），输出patch级token，通过一个轻量级投影层对齐到Qwen的输入空间。
  - 骨干网络：Qwen2.5-0.5B，冻结基础权重，只微调LoRA和投影层。
  - 动作端：基于DiT的Flow Matching动作专家，接收Qwen输出的专用动作token和本体状态，输出动作chunk。
  - 部署：推理时直接移除预测头和联合目标分支，单步推理耗时约85ms（11.76Hz）。
- **核心 Loss**: 
  总Loss由两部分组成：$\mathcal{L} = \mathcal{L}_{act} + \lambda_{wm}\mathcal{L}_{wm}$。
  - 世界模型Loss ($\mathcal{L}_{wm}$)：预测的联合特征与目标联合特征之间的平均patch级余弦距离。
  - 动作Loss ($\mathcal{L}_{act}$)：Flow Matching的均方误差（预测速度或干净动作轨迹）。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：LIBERO（标准分布内）、LIBERO-Plus（视觉/空间OOD）、RoboTwin 2.0（双臂操作，分Clean和Random设置），以及真实世界双臂平台。
  - Baseline：无预训练的 Diffusion Policy、ResVLA、Fast-WAM 等；有大规模预训练的 π0.5、VLA-JEPA 等。
- **评价指标**: 任务成功率（Task Success Rate %）。
- **实验结果**: 
  - LIBERO（分布内）：JEPA-WAM 成功率 96.7%，与SOTA持平。将其目标函数加到预训练的 π0.5 上，成功率从 96.9% 提升至 97.8%。
  - LIBERO-Plus（OOD）：JEPA-WAM 成功率 79.2%，是无预训练方法中的最高分。加到 π0.5 上后，成功率从 84.5% 提升至 86.3%，拿到整体第一。
  - RoboTwin 2.0：在Random（随机干扰）设置下，JEPA-WAM 达到 36.9%，大幅领先无预训练方法，并媲美预训练的 π0.5。加到 π0.5 上后，Clean设置下的成功率从 75.4% 大幅提升至 84.6%。

### 7. 🔥 [WorldSimProbe: Diagnosing Simulator Faithfulness in Action-Conditioned World Models for Embodied Manipulation] (WorldSimProbe：诊断具身操作中动作条件世界模型的模拟器保真度)
- **研究机构**: `北京大学 (Peking University), EvoPhys AI, 京东 (JD) 等`
- **Arxiv ID**: `2608.09298` | [点击跳转](https://arxiv.org/abs/2608.09298)

**0. 论文标题**
- **英文标题**: WorldSimProbe: Diagnosing Simulator Faithfulness in Action-Conditioned World Models for Embodied Manipulation
- **中文标题**: WorldSimProbe：诊断具身操作中动作条件世界模型的模拟器保真度
- **研究机构**: 北京大学 (Peking University), EvoPhys AI, 京东 (JD) 等

**1. 整体逻辑**
- **研究任务**: 评估动作条件世界模型（ACWMs）作为物理模拟器的忠实度（即输入动作能否准确转化为物理运动并引发正确的环境反馈）。
- **研究动机**: 现有的世界模型评测主要看生成的视频画质好不好，或者最终任务成没成功。但这存在严重盲区：模型可能只是在“脑补”合理画面，输入的动作根本没被准确执行，或者机械臂没碰到物体但物体自己动了（幻觉接触）。这种缺乏物理因果一致性的模型，无法用于可靠的策略规划或数据生成。
- **本质改动**: 提出“可观察模拟器契约”（输入动作必须产生对应运动，环境响应必须基于该运动），并据此构建了包含5个维度的诊断基准 WorldSimProbe，把“动作->运动->环境响应”的因果链拆开，专门定位模型在物理模拟上的具体 failure case。
- **技术溯源**: 评估了6个主流开源 ACWM 基座（IRASim, Ctrl-World, BWM, DreamDojo, LingBot-VA, Cosmos-3-Nano）。评估工具使用了预训练光流模型、TAPNext++ 点追踪器以及 Qwen3-VL-8B 多模态大模型。

**2. 技术拆解**
- **重点改进**: 将评测从“看最终结果”转变为“沿物理因果链分阶段诊断”。不只看动作跟没跟上，还要看运动风格保没保留、没接触时会不会乱动、接触后的动力学对不对。
- **架构细节**: 包含5个测试套件（Suite）：
  1. **局部动作校准 (Task 1)**：对输入动作加微小扰动，对比模型输出的变化比例是否与真实物理引擎一致，测微操灵敏度。
  2. **全局轨迹覆盖 (Task 2)**：把其他任务的动作序列放到当前场景执行（跨任务重放），用机器人掩码光流对齐（RMFA）评估大尺度动作到运动的映射能力。
  3. **动作源行为保持 (Task 3)**：输入不同人类或策略生成的风格各异的动作（如速度快慢、平滑度），看模型能否保留原有的执行风格，而不是退化成标准动作。
  4. **交互接地 (Task 4)**：构造“无接触”场景（如把物体移开一点），用 TAPNext++ 追踪物体。如果物体动了，说明模型产生了“幻觉接触”。
  5. **交互动力学 (Task 5)**：用 Qwen3-VL-8B 判断模型生成的8种基础交互（推、拉、拖、旋转等）的动力学反馈是否符合物理规律。
- **核心 Loss**: 本文为评测基准，不涉及模型训练 Loss。评价指标包括：基于 MSE 的扰动响应比例得分（Task 1）、光流误差归一化得分（Task 2/3）、物体静止率（Task 4）以及 VLM 判断的交互原语分类准确率（Task 5）。

**3. 实验结果**
- **数据集和baseline**: 在 RoboTwin、ManiSkill 和 LIBERO 三个仿真平台上构建了超过 18,000 个测试实例。对比了 6 个开源 ACWM：IRASim, Ctrl-World, BWM, DreamDojo（动作注入架构）以及 LingBot-VA, Cosmos-3-Nano（统一动作-视频架构）。
- **评价指标**: 5个 Task 各自的得分（0-100分），以及 Overall 宏观平均分。
- **实验结果**: 
  - **整体表现**：没有模型在所有维度都完美。LingBot-VA 在 RoboTwin 和 ManiSkill 上整体最好，Ctrl-World 在 LIBERO 上最好。架构类型（动作注入 vs 统一建模）不能直接决定保真度。
  - **暴露的共性缺陷**：
    1. 模型对微小动作扰动的响应普遍存在衰减（Task 1 得分多在 35-60 之间），微操能力差。
    2. 在分布外动作下泛化能力弱，容易把不同风格的动作“同化”为标准动作（Task 3 得分偏低）。
    3. **“幻觉接触”是重灾区**（Task 4），除了 Ctrl-World 表现较好（70+），多数模型得分在 20-50 之间，说明模型经常在没有物理接触的情况下“脑补”物体运动。
    4. 交互动力学（Task 5）得分普遍在 40-60 分左右，说明模型很难准确区分和模拟“推、拉、拖”等具体动作的物理反馈差异。
  - **结论**：单一的任务成功率会掩盖物理模拟的严重缺陷，WorldSimProbe 能有效揪出这些隐藏的 failure case。

### 8. 🔥 [SG-WAM: Text-grounded and Spatial-aware Semantic Guidance for World-Action Models] (SG-WAM：面向世界-动作模型的文本锚定与空间感知语义引导)
- **研究机构**: `香港科技大学（广州）、Ola Dimensions（深圳）`
- **Arxiv ID**: `2608.08839` | [点击跳转](https://arxiv.org/abs/2608.08839)

**0. 论文标题**
- **英文标题**: SG-WAM: Text-grounded and Spatial-aware Semantic Guidance for World-Action Models
- **中文标题**: SG-WAM：面向世界-动作模型的文本锚定与空间感知语义引导
- **研究机构**: 香港科技大学（广州）、Ola Dimensions（深圳）

**1. 整体逻辑**
- **研究任务**: 基于语言指令的具身机械臂操作（World-Action Models, WAM）。
- **研究动机**: 现有的WAM模型在处理语言指令时，通常只用CLIP或T5提取一个全局文本特征，这个特征和当前的视觉画面是割裂的。这就导致模型在预测未来视频和动作时，经常“听不懂”具体指令（比如抓错目标物体），动作准确率受限。
- **本质改动**: 引入一个VLM作为“语义规划器”，让它结合当前画面和指令，提前预测出未来关键帧的“目标物体特征（文本锚定）”和“场景深度特征（空间感知）”。然后把这些细粒度的语义特征图作为条件，注入到视频和动作生成模型中，强迫生成过程严格遵循指令。
- **技术溯源**: 基于 Qwen3.5（VLM规划器基座）、SigLIP2（提供文本锚定特征的教师模型）、Depth Anything 3（提供空间几何特征的教师模型）、LTX-Video（预训练视频扩散模型基座）。

**2. 技术拆解**
- **重点改进**: 抛弃了原来WAM中粗粒度的纯文本条件注入，改为用VLM预测的细粒度、空间对齐的语义特征图（Semantic Foresight）来引导视频和动作的生成。
- **架构细节**: 
  - **输入**：当前视觉观察、语言指令、机器人本体状态。
  - **语义规划器**：基于 Qwen3.5 2B，在输入序列后拼接可学习的 query tokens（分为基础组和两个模态特定组）。通过一次前向传播，用 resampler 解码出未来4个关键帧的密集特征图（文本分支256个token，维度1024；空间分支256个token，维度2048）。
  - **世界-动作模型**：基于 LTX-Video 扩散模型。视频专家通过额外的交叉注意力分支接收融合后的语义特征图；动作专家不直接接收特征，而是通过与视频专家的联合注意力（Joint Attention）隐式获取引导。
  - **输出**：未来9帧视频和36步动作块（Action Chunk）。
- **核心 Loss**: 
  - **规划器 Loss**：预测的特征图与教师模型（SigLIP2 和 Depth Anything 3）从真实未来帧中提取的特征之间的 MSE 和 Smooth-L1 损失。
  - **生成 Loss**：视频专家和动作专家的 Flow-matching（流匹配）损失。
  - **训练策略**：分三阶段。阶段1单练规划器拟合教师特征；阶段2联合训练规划器和视频专家；阶段3加入动作专家，三者端到端联合训练。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：LIBERO（标准桌面操作）、LIBERO-Plus（包含7种环境和指令扰动的鲁棒性测试）、真实世界双臂机器人平台（4个多任务及泛化测试）。
  - **Baseline**：VLA模型（OpenVLA-OFT, π0, π0.5, GR00T-N1）和 WAM模型（WorldVLA, GE-Act, FastWAM, LingBot-VA等）。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - 在 LIBERO 基准上，平均成功率达到 98.7%（SOTA），微弱领先于 LingBot-VA（98.5%）。
  - 在 LIBERO-Plus 的扰动测试中（如改变光照、背景、指令表述等），平均成功率 81.3%，比第二名高出 3.5%，在语言指令扰动下的提升尤为明显。
  - 在真机实验中（AgileX双臂），执行排除干扰物按顺序放置等复杂任务时，成功率全面优于 GE-Act 和 FastWAM，且在未见过的物体高度和光照条件下展现出了更好的泛化能力。

### 9. 🔥 [Vid2WAM: Distilling Video Diffusion Priors into World Action Models] (Vid2WAM：将视频扩散先验蒸馏到世界动作模型中)
- **研究机构**: `复旦大学、香港中文大学（深圳）等`
- **Arxiv ID**: `2608.08558` | [点击跳转](https://arxiv.org/abs/2608.08558)

**0. 论文标题**
- **英文标题**: Vid2WAM: Distilling Video Diffusion Priors into World Action Models
- **中文标题**: Vid2WAM：将视频扩散先验蒸馏到世界动作模型中
- **研究机构**: 复旦大学、香港中文大学（深圳）等

**1. 整体逻辑**
- **研究任务**: 基于视觉和语言指令的机器人动作生成（机器人策略学习）。
- **研究动机**: 现有的世界动作模型（WAM）需要大量目标任务的专家轨迹来提供未来视觉和动作的监督信号。这导致数据收集成本高，且模型难以泛化到没有专家数据的新任务。
- **本质改动**: 提出一种离线蒸馏框架。用预训练的大型视频扩散模型生成未来视频，再用逆动力学模型（IDM）从视频中提取动作，将这两路信号离线蒸馏给一个轻量级的WAM学生模型。推理时仅使用学生模型，无需实时生成视频。
- **技术溯源**: 视频教师基于 Wan2.1-14B（LVP），逆动力学模型基于 ResNet-50，学生模型架构基于 Fast-WAM。

**2. 技术拆解**
- **重点改进**: 
  1. 双通道蒸馏：教师生成的未来视频隐变量直接监督学生的视觉预测分支，IDM提取的伪动作监督动作分支。
  2. 源感知残差适配器：由于伪动作存在噪声，在共享动作主干网络前后加入独立的残差适配器，分别针对真实数据和伪数据进行修正，防止伪数据干扰模型学习。
- **架构细节**: 
  - 输入：当前视觉观测、本体感觉状态、语言指令。
  - 教师模型：14B参数的视频扩散模型，微调后用于生成未来视频。
  - 学生模型：共享的视频-动作表征主干，包含动作预测头和未来视频预测头。推理时移除视频预测头、IDM和伪数据适配器，仅保留主干、动作预测头和真实数据适配器。
- **核心 Loss**: 流匹配损失（Flow-matching loss）。总Loss由真实域损失（真实动作+真实视频隐变量）和伪域损失（伪动作+伪视频隐变量）加权求和构成。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：RoboTwin 2.0（双臂仿真）、LIBERO、LIBERO-Plus，以及真实世界双臂平台（AgileX Piper）。
  - Baseline：π0.5、Motus、Fast-WAM。
- **评价指标**: 任务成功率。主要在“低数据”（每任务10条专家轨迹）和“新任务”（无目标专家轨迹，仅提供初始画面和指令）两种设定下进行评估。
- **实验结果**: 
  - 在 RoboTwin 2.0 的新任务子集上，Vid2WAM 的成功率比 Fast-WAM 高出 9.7%（无扰动）和 12.5%（有扰动）。
  - 在 LIBERO 和 LIBERO-Plus 中，低数据和新任务设定下均取得最高成功率，且在多种环境扰动下表现出更好的鲁棒性。
  - 真机实验表明，在完全没有专家演示的新任务上，仅靠初始画面生成的伪数据也能成功完成任务，且推理延迟与纯动作模型相当。

### 10. 🔥 [Action- and Language-Conditioned Video Assessment (ALVA) [注：提供文本仅为摘要，此处以核心方法名代指]] (动作与语言条件化的视频评估)
- **研究机构**: `[摘要未提供，需查阅原文]`
- **Arxiv ID**: `2608.08273` | [点击跳转](https://arxiv.org/abs/2608.08273)

**0. 论文标题**
- **英文标题**: Action- and Language-Conditioned Video Assessment (ALVA) [注：提供文本仅为摘要，此处以核心方法名代指]
- **中文标题**: 动作与语言条件化的视频评估
- **研究机构**: [摘要未提供，需查阅原文]

**1. 整体逻辑**
- **研究任务**: 为执行多步自然语言指令的视觉具身智能体提供轨迹级别的进度评估（即为策略优化提供奖励/反馈信号）。
- **研究动机**: 传统的评估方法只比对最后一帧或计算连续帧的特征相似度，容易忽略判断任务是否完成所必需的中间过渡状态，导致评估不准。
- **本质改动**: 把“单帧视觉比对”改为“视频+动作+指令”的综合评估。引入两阶段机制，先总结动作引起的画面变化，再结合指令给整条轨迹打分。
- **技术溯源**: 基于预训练的视觉语言模型（VLM）。

**2. 技术拆解**
- **重点改进**: 提出两阶段评估流程。第一阶段：以执行的具体动作为条件，让模型总结帧与帧之间的视觉过渡；第二阶段：结合自然语言指令，对生成的视觉总结进行评估，输出最终的进度得分。
- **架构细节**: 输入为视觉观察序列（视频帧）、执行的动作序列和自然语言指令；核心网络为预训练VLM；输出为离散的轨迹级进度分数。
- **核心 Loss**: 摘要未详述评估器自身的训练Loss。在下游应用中，该离散分数直接作为闭环策略优化的终端反馈（Terminal feedback/Reward）。

**3. 实验结果**
- **数据集和baseline**: 实验在模拟3D家庭环境中进行。对比基线包括：基于静态图像的评估方法、基于视觉特征嵌入的评估方法，以及 Ground-truth Oracle（上帝视角/完美奖励）。
- **评价指标**: 假阳性率（False-positive rates），以及闭环策略优化后的任务整体性能（与Oracle的性能差距）。
- **实验结果**: ALVA 的评估模式偏向保守，假阳性率接近于零。作为终端反馈用于闭环策略优化时，效果显著优于静态图像和特征嵌入基线，有效缩小了与 Oracle 之间的性能差距。

### 11. 🔥 [4D-WAM: Infusing Spatiotemporal Awareness into World Action Models through Trajectory Fields] (4D-WAM：通过轨迹场将时空感知注入世界动作模型)
- **研究机构**: `阿德莱德大学、香港科技大学（广州）、东北大学等`
- **Arxiv ID**: `2608.08023` | [点击跳转](https://arxiv.org/abs/2608.08023)

**0. 论文标题**
- **英文标题**: 4D-WAM: Infusing Spatiotemporal Awareness into World Action Models through Trajectory Fields
- **中文标题**: 4D-WAM：通过轨迹场将时空感知注入世界动作模型
- **研究机构**: 阿德莱德大学、香港科技大学（广州）、东北大学等

**1. 整体逻辑**
- **研究任务**: 世界动作模型（WAM）的联合建模，即同时预测未来视频帧和生成机器人控制动作。
- **研究动机**: 现有的WAM主要在2D像素空间做视频预测，与机器人实际的3D物理空间存在表示鸿沟。虽然部分工作引入了深度图等3D信息，但仅局限于单帧3D重建，忽略了物体在3D空间中随时间连续运动的4D动态特性；此外，让模型预测像素级深度图会导致其过度关注低级图像细节，学不到高级的空间运动规律。
- **本质改动**: 提出一种与模型结构无关的训练策略，不改变原WAM架构，而是通过特征对齐的方式，把预训练4D模型（提取3D轨迹场）中的时空运动知识“蒸馏”给WAM。具体做法是放弃对齐绝对特征，转为对齐“帧间特征变化”（运动对齐）和“首尾帧的对应关系”（目的地对齐）。
- **技术溯源**: 基于现有的WAM基座模型（如基于DiT架构的 FastWAM-Joint、Lingbot-VA）以及4D基础模型（Trace Anything）。

**2. 技术拆解**
- **重点改进**: 
  1. 发现WAM和4D教师模型的绝对特征空间差异过大，直接对齐会导致优化冲突，因此改为对齐相邻帧的“特征差值”，让模型学习一致的局部运动方向。
  2. 仅有局部运动不够，增加了首尾帧的“目的地对齐”，通过约束注意力分布，让模型明确当前运动的物体最终要去哪里，增强目标导向的全局感知。
- **架构细节**: 
  - 输入为视频帧序列。在WAM（如DiT）的第20层提取中间视觉token特征，同时用冻结的Trace Anything提取对应的4D特征。
  - 使用两个独立的两层MLP将两者的特征映射到同一维度的共享空间。
  - 运动对齐：计算相邻帧归一化特征的差值来表征局部运动。
  - 目的地对齐：把第一帧作为源，最后一帧作为目的地，计算源token到目的地token的相似度矩阵。
- **核心 Loss**: 
  总 Loss = L_latent (视频潜在空间去噪) + L_action (动作预测) + λ1 * L_motion + λ2 * L_dest。
  - L_motion：WAM和教师模型帧间特征差值的余弦距离。
  - L_dest：WAM和教师模型首尾帧相似度概率分布的KL散度。
  - λ1和λ2为权重系数，均小于0.1，作为辅助Loss不影响主任务训练。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：分布内使用 RoboTwin 2.0 和 LIBERO；分布外（OOD）使用 LIBERO-Plus（包含7种环境扰动）和 RoboTwin Clean2Rand。
  - Baseline：π0.5、WorldVLA、Motus、FastWAM-Joint、Lingbot-VA 等主流VLA和WAM模型。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - 分布内：在 RoboTwin 2.0 上比基线 FastWAM-Joint 提升约 0.4%~1.1%；在性能接近饱和的 LIBERO 上，平均成功率从 98.2% 提升至 98.6%。
  - 分布外（OOD）：提升显著。在 LIBERO-Plus 上平均成功率提升 8.8%，其中在相机视角扰动下大幅提升 17.26%；在 RoboTwin Clean2Rand 中，部分基线模型成功率跌至 20% 以下，而 4D-WAM 保持了较强的泛化能力，证明引入4D时空感知对提升模型鲁棒性有直接帮助。

### 12. 🔥 [GWM-VLA: Geometry-Aware Latent World Modeling for Vision-Language-Action Learning] (GWM-VLA：用于视觉-语言-动作学习的几何感知潜空间世界模型)
- **研究机构**: `文本未明确标注（根据作者 Junqiao Zhao, Guang Chen 等信息推测为同济大学及相关合作机构）`
- **Arxiv ID**: `2608.07619` | [点击跳转](https://arxiv.org/abs/2608.07619)

**0. 论文标题**
- **英文标题**: GWM-VLA: Geometry-Aware Latent World Modeling for Vision-Language-Action Learning
- **中文标题**: GWM-VLA：用于视觉-语言-动作学习的几何感知潜空间世界模型
- **研究机构**: 文本未明确标注（根据作者 Junqiao Zhao, Guang Chen 等信息推测为同济大学及相关合作机构）

**1. 整体逻辑**
- **研究任务**: 提升 VLA（视觉-语言-动作）模型在机器人操作任务中，面对视角、光照、背景等视觉和环境扰动时的鲁棒性。
- **研究动机**: 现有的 VLA 模型容易过拟合外观特征。引入世界模型可以缓解这个问题，但显式生成未来图像的世界模型计算成本高且容易陷入无关的外观细节；而现有的潜空间世界模型（如 VLA-JEPA）虽然紧凑，但它们是独立编码各个相机视角再拼接的，丢失了多视角间的 3D 几何关系，导致模型对视角变化依然敏感。
- **本质改动**: 将“独立编码多视角”改为“使用几何基础模型联合聚合多视角”，并在潜空间中只预测对操作最关键的目标视角（如腕部相机）的下一步状态，同时让用于状态预测的“潜动作”和用于生成真实动作的“潜动作”共享同一套特征表示。
- **技术溯源**: 视觉编码器基于 VGGT-Ω（前馈几何基础模型），VLM 主干基于 Qwen3-VL-2B，动作生成头基于 Flow-Matching（流匹配）。

**2. 技术拆解**
- **重点改进**: 
  1. 引入几何感知的多视角状态编码，保留跨视角的几何关系。
  2. 提出全局上下文条件下的目标视角预测，降低预测负担并聚焦末端执行器交互。
  3. 统一潜动作表示，将世界模型的预测监督与真实动作的监督结合在同一个潜空间特征上。
- **架构细节**: 
  - **输入**: 多视角图像（包含腕部视角）、语言指令、机器人本体状态。
  - **视觉编码**: 使用冻结的 VGGT-Ω 联合处理同一时刻的多视角图像，输出包含几何信息的 patch tokens（局部特征）和 register tokens（全局特征）。
  - **世界模型**: 不预测所有视角的下一步，只提取“腕部视角”的 patch tokens 作为预测目标，用它的 register tokens 作为全局几何上下文。通过因果注意力机制，结合当前的潜动作序列，预测下一步的腕部视角 patch tokens。
  - **动作生成**: 用 Qwen3-VL-2B 提取共享的“潜动作 tokens”。这些 tokens 既作为条件输入给世界模型做状态预测，也作为条件输入给 Flow-Matching 动作头生成连续的动作 chunk。
- **核心 Loss**: 
  - 总 Loss = 动作 Loss + λ * 世界模型 Loss（λ=0.1）。
  - **动作 Loss**: Flow-Matching 的标准 MSE 损失（预测速度场与真实速度场的 L2 距离）。
  - **世界模型 Loss**: 预测的下一步潜状态（patch tokens）与真实下一步潜状态之间的 L1 损失。没有像素级的图像或视频重建任务。

**3. 实验结果**
- **数据集和baseline**: 在 DROID 数据集（约7.6万条轨迹）上预训练，在 LIBERO（分布内）和 LIBERO-Plus（包含视角、光照、背景等7种扰动的分布外鲁棒性测试）上微调。真机实验在 SO-101 机器人上进行。对比了 VLA-JEPA、OpenVLA-OFT、π0、π0.5 等主流方法。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - **LIBERO（分布内）**: 平均成功率 97.1%，与 OpenVLA-OFT 持平，比仅用机器人数据训练的 VLA-JEPA 高 1.0%，证明引入世界模型没有损害分布内性能。
  - **LIBERO-Plus（鲁棒性，核心亮点）**: 平均成功率 76.9%，达到 SOTA。比 OpenVLA-OFT 高 7.3%，比 VLA-JEPA 高 14.0%。在视角、视觉噪声、背景和语言指令扰动下的提升尤为明显，证明几何感知状态能提供更稳定的空间表示。
  - **真机实验**: 在分布内和物体布局 OOD（分布外）设置下成功率最高，验证了模型在有限演示数据下的空间鲁棒性。

### 13. 🔥 [LIRA: Local Cross-Layer Information Routing for Vision-Language-Action Decoding] (LIRA：用于视觉-语言-动作解码的局部跨层信息路由)
- **研究机构**: `原文未提供（根据作者名单推测为国内高校联合团队）`
- **Arxiv ID**: `2608.07596` | [点击跳转](https://arxiv.org/abs/2608.07596)

**0. 论文标题**
- **英文标题**: LIRA: Local Cross-Layer Information Routing for Vision-Language-Action Decoding
- **中文标题**: LIRA：用于视觉-语言-动作解码的局部跨层信息路由
- **研究机构**: 原文未提供（根据作者名单推测为国内高校联合团队）

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型中，如何将VLM（视觉语言模型）的中间层特征更好地路由给动作解码器（Action Decoder）以生成机器人动作。
- **研究动机**: 现有的VLM到动作的接口（如VLA-Adapter）采用的是“一层对一层”的死板对齐，即解码器的第 $i$ 层只能接收VLM第 $i$ 层的特征。这导致解码器无法获取相邻层互补的语义和细节信息，在面对视角、光照、背景等分布偏移时（如LIBERO-Plus测试），鲁棒性较差。
- **本质改动**: 把“一对一”的层对齐特征传递，改成了“局部跨层路由”。动作解码器的每一层不仅能看到VLM对应层的特征，还能通过一个局部滑动窗口，看到上下相邻几层的特征。
- **技术溯源**: 基于 VLA-Adapter 架构，VLM底座使用的是 Prismatic VLM（语言模型基座为 Qwen2.5-0.5B）。

**2. 技术拆解**
- **重点改进**: 引入了 LIRA Query tokens。在VLM每一层提取这些 query 的特征，在送入动作解码器（PFB）时，将当前层和前后相邻层（默认共3层）的 query 特征在 token 维度拼接后送入。同时，Task-token（图像和文本特征）依然保持严格的一层对一层对齐，作为语义锚点。
- **架构细节**: 输入包含两张图（全局+夹爪）、语言指令和本体状态。VLM有 $L$ 层，动作解码器也有 $L$ 个并行融合块（PFB）。每个PFB接收三部分信息：1）对应层的 Task-token；2）局部窗口（默认 $r=1$，即当前层及前后各一层，共3层）拼接的 LIRA Query 特征；3）本体状态嵌入。因为只是在 token 维度做拼接，直接喂给现有的交叉注意力机制，所以**没有增加任何额外的可训练参数**。整体模型参数量保持在 0.5B。
- **核心 Loss**: 仅使用基础的连续动作回归 L1 Loss（预测动作块与真实动作块的 L1 距离），没有添加任何辅助任务或额外损失。

**3. 实验结果**
- **数据集和baseline**: 在 LIBERO、LIBERO-Plus（包含7类受控扰动的鲁棒性测试）、CALVIN ABC→D 以及真机（Franka）上进行评估。对比了 VLA-Adapter、OpenVLA、OpenVLA-OFT、π0 等主流方法。
- **评价指标**: 任务成功率（Success Rate），CALVIN 数据集额外评估平均连续完成任务的长度（Avg. len.）。
- **实验结果**: 
  - 在同等 0.5B 参数下，LIBERO 平均成功率从 baseline (VLA-Adapter) 的 97.3% 提升至 98.9%。
  - **LIBERO-Plus 零样本迁移提升巨大**：成功率从 59.1% 提升至 78.0%（绝对提升 18.9 个点），比 7B 参数的 OpenVLA-OFT (69.6%) 高出 8.4 个点，证明了局部跨层路由对鲁棒性的直接贡献。
  - CALVIN 5个任务连续完成率从 76.5% 提升至 80.5%，平均完成长度从 4.42 提升至 4.52。
  - 真机实验成功率全面领先 baseline。此外，由于模型紧凑，其推理吞吐量（186.3Hz）是 OpenVLA-OFT 的 2.61 倍，训练显存占用仅为其 21%。

### 14. 🔥 [You Don’t Need To Stay in The Loop: An Agentic Robotics Loop for Robot-Policy Improvement] (你不需要留在循环中：一种用于机器人策略改进的智能体自动化循环)
- **研究机构**: `未明确标注（作者：Hang Yu，推测为独立研究者或机构信息在预印本中省略）`
- **Arxiv ID**: `2608.07555` | [点击跳转](https://arxiv.org/abs/2608.07555)

**0. 论文标题**
- **英文标题**: You Don’t Need To Stay in The Loop: An Agentic Robotics Loop for Robot-Policy Improvement
- **中文标题**: 你不需要留在循环中：一种用于机器人策略改进的智能体自动化循环
- **研究机构**: 未明确标注（作者：Hang Yu，推测为独立研究者或机构信息在预印本中省略）

**1. 整体逻辑**
- **研究任务**: 机器人策略改进的“外循环”（Outer Loop）自动化。即让 AI Agent 自动管理机器人策略的训练、评估、对比和迭代流程，让人类研究员不需要一直盯着实验。
- **研究动机**: 现在的机器人学习“内循环”（如 VLA 模型训练、RL 微调）很强，但“外循环”（分析失败原因、决定下一步改什么、管理长任务、对比带噪声的评估结果）依然严重依赖人工。直接套用软件代码 Agent 的架构行不通，因为机器人工具（训练好的策略、数据收集器等）经常失败且不可靠，必须对工具的实际能力进行严格测量和状态追踪。
- **本质改动**: 将软件工程中的 Agent 架构移植到机器人策略改进中，提出 `AgenticRobotics` 控制面。核心改动是：把所有执行操作封装为标准“工具”，引入“基于证据的门控晋升”机制防止噪声导致的假提升，并将工具的质量评分与具体的模型权重文件强绑定（权重一变，之前的评分自动作废）。
- **技术溯源**: 控制面基于 LLM 作为 Controller；工具调用基于 MCP (Model Context Protocol)；后端兼容各种开源 VLA 基座（如 OpenVLA, $\pi_0$, SmolVLA, RT-2 等）；评估基于 LIBERO benchmark。

**2. 技术拆解**
- **重点改进**: 
  1. **工具化与状态绑定**：不信任工具的描述，只相信实际测量。工具注册表将能力质量（成功率）与具体的 artifact（模型权重）绑定，一旦重新训练导致权重变化，工具状态自动变为“过期（stale）”，强制重新评估。
  2. **基于证据的门控晋升（Evidence-Gated Promotion）**：使用严格的统计学检验（如 Agresti-Caffo 区间或 anytime-valid 检验）来判断新策略是否真正优于老策略，避免因为评估时的随机噪声把差的模型误判为好模型。
  3. **解耦物理实体**：Controller 完全不接触机器人的物理细节（电机、传感器），只通过标准化的工具描述和测量记录来调度，实现后端无关性。
- **架构细节**: 
  - **分层架构**：Agent（决定做什么） -> Skill（Markdown 格式的工作流，决定怎么做） -> Tool（底层的具体执行能力，如训练器、评估器）。
  - **事务性轮次（Round Transaction）**：每一轮改进是一个持久化事务，包含 `Bind -> Analyze -> Act -> Measure -> Score -> Commit` 六个阶段。支持崩溃恢复，通过 commit key 保证不重复执行。
  - **输入输出**：输入是不可变的实验目标（指标、阈值等），输出是追加写入的账本（ledger）记录和经过验证的策略更新。
- **核心 Loss**: 本文侧重于系统控制面和自动化实验流程设计，**不涉及底层神经网络训练 Loss 的修改**。其核心“评判标准”是二项分布成功率的统计检验（如计算 $\Delta = m_{new} - m_{best}$ 是否大于置信区间宽度的 1.5 倍）。

**3. 实验结果**
- **数据集和baseline**: 
  - **环境/数据集**：LIBERO-10（机器人操作 benchmark）。
  - **对比基线**：系统特性上对比了 concurrent systems（如 LearningFlow, RoboRouter 等）；统计门控上对比了 naive McNemar 检验、固定 Agresti-Caffo 规则和 anytime-valid 检验（如 Mixture-SPRT）。
- **评价指标**: 
  - **系统层面**：假晋升率（Type-I error）、统计功效（Power）、崩溃恢复成功率、副作用重复/丢失率。
  - **任务层面**：LIBERO 任务的平均成功率（Success Rate）。
- **实验结果**: 
  - **门控有效性**：在允许随时停止（optional stopping）的评估中，传统的 McNemar 检验假晋升率高达 16.1%；本文采用的 anytime-valid 检验（Mixture-SPRT）将假晋升率控制在 0.7%，同时将统计功效提升至 0.86。
  - **系统鲁棒性**：在 14000 次进程 kill 注入测试中，实现了 0 丢失、0 重复的副作用，崩溃恢复耗时仅 0.15-0.25 ms。
  - **策略改进表现**：在 SmolVLA 的改进案例中，系统成功拦截了由于评估噪声导致的“假提升”（某 checkpoint 偶然测出 63% 成功率，但实际均值仅 56.5%，系统拒绝将其作为最终晋升版本）。
  - **客观结论**：作者明确指出，该系统的价值在于“让人能放心离开”（保证统计严谨性、防错、可恢复），**而不是**比人类专家挑出更好的 checkpoint（在对比中，人类直接选最终 checkpoint 的表现并不比该系统差）。

### 15. 🔥 [GraphThink: Graph-Enhanced LLM Thinking for Long-Horizon Embodied Task Planning] (GraphThink：基于图增强大语言模型思考的长视野具身任务规划)
- **研究机构**: `中国人民大学、清华大学、北京人工智能研究院 (BAAI)`
- **Arxiv ID**: `2608.07905` | [点击跳转](https://arxiv.org/abs/2608.07905)

**0. 论文标题**
- **英文标题**: GraphThink: Graph-Enhanced LLM Thinking for Long-Horizon Embodied Task Planning
- **中文标题**: GraphThink：基于图增强大语言模型思考的长视野具身任务规划
- **研究机构**: 中国人民大学、清华大学、北京人工智能研究院 (BAAI)

**1. 整体逻辑**
- **研究任务**: 具身智能体根据自然语言指令，在长视野（long-horizon）日常任务中进行高层任务规划，即将复杂指令拆解为可执行的子任务序列。
- **研究动机**: 直接用LLM做规划容易出现“物理幻觉”（如没拿刀就切菜），且在长任务中泛化差；现有的重规划机制往往只在底层动作报错时触发，缺乏对环境全局状态的感知，导致重规划短视、反复无效重试。
- **本质改动**: 给LLM外挂两个图结构。用“任务图（Task Graph）”提供子任务间的物理和逻辑依赖，用来约束LLM生成和强化学习奖励；用“场景图（Scene Graph）”动态维护环境里关键物体的状态，用来触发和引导闭环重规划。
- **技术溯源**: 基于大语言模型（LLM）作为高层规划基座，使用 GRPO（Group Relative Policy Optimization）进行强化学习对齐，底层视觉感知依赖视觉语言模型（VLM）提取场景图。

**2. 技术拆解**
- **重点改进**: 
  1. **任务图构建与约束**：用LLM分析子任务的前置条件和执行效果，自动构建子任务转移有向图。在Prompt里加入图结构引导生成，并在推理时做合法性校验。
  2. **结合任务图的GRPO训练**：针对具身规划答案不唯一导致RL奖励难设计的问题，利用任务图设计了节点（物体合法性）和边（转移合法性）奖励，结合格式和指令奖励来微调LLM。
  3. **事件驱动的场景图重规划**：用VLM在线构建只包含任务相关物体的紧凑场景图。不仅在底层动作失败时重规划，在高层子任务完成时也会主动检查，纠正“动作执行成功但偏离最终目标”的问题。
- **架构细节**: 
  - **输入输出**：输入为自然语言指令和当前环境可见物体列表；输出为高层子任务序列（如 `Heat(object, microwave)`），底层策略将其转为具体动作。
  - **模型结构**：分层架构。高层是LLM规划器；底层是带记忆的动作策略（主动缓存沿途看到的物体位置和掩码，避免重复探索）；重规划模块接收当前场景图、执行进度和反馈，输出修改后的子任务序列。
- **核心 Loss**: 
  核心为 GRPO 的 Reward 设计，总奖励 $R_{total} = R_{fmt} + R_{node} + R_{edge} + R_{inst}$。
  - **格式奖励 ($R_{fmt}$)**：输出符合规定的 XML 和 JSON 格式。
  - **节点奖励 ($R_{node}$)**：规划中涉及的物体是否真实存在于环境的对应类别中。
  - **边奖励 ($R_{edge}$)**：相邻子任务的连接是否符合任务图的物理逻辑约束。
  - **指令奖励 ($R_{inst}$)**：是否覆盖了完成任务的核心子任务，以及是否和专家示范完全一致。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：主测 ALFRED（视觉语言导航与交互基准），辅以 AI2-Thor 和 VirtualHome 测泛化，并自建了一个长视野测试集。
  - **Baseline**：主流的基于 API 的头部闭源大模型（如 GPT 系列）和其他 SOTA 层级规划方法。
- **评价指标**: ALFRED 官方排行榜指标（任务成功率 SR 和路径加权成功率）。
- **实验结果**: 
  - 在 ALFRED 官方排行榜排名第一。
  - 高层规划器在验证集和未见过的长视野任务上，成功率超越了头部的 API 大模型，零样本和少样本能力强。
  - 在 AI2-Thor 的新动作和 VirtualHome 的跨场景测试中，展现出很强的分布外（OOD）泛化能力。

### 16. 🔥 [LUCID: Latent-Skill Unified Control via Imagined Dynamics for Long-Horizon Humanoid Loco-Manipulation] (LUCID：基于想象动力学的潜技能统一控制用于长视野人形机器人移动操作)
- **研究机构**: `Italian Institute of Technology (IIT) / University of Manchester`
- **Arxiv ID**: `2608.07746` | [点击跳转](https://arxiv.org/abs/2608.07746)

**0. 论文标题**
- **英文标题**: LUCID: Latent-Skill Unified Control via Imagined Dynamics for Long-Horizon Humanoid Loco-Manipulation
- **中文标题**: LUCID：基于想象动力学的潜技能统一控制用于长视野人形机器人移动操作
- **研究机构**: Italian Institute of Technology (IIT) / University of Manchester

**1. 整体逻辑**
- **研究任务**: 人形机器人的长视野移动操作（Loco-manipulation），具体场景是按顺序导航、搬运和重排多个物体。
- **研究动机**: 现有的分层控制方法通常用写死的脚本、有限状态机或无模型的高层策略来拼接底层技能。这些方法无法预测当前动作对后续子任务物理条件的影响，导致在长序列任务中极易失败。
- **本质改动**: 引入了一个“宏观动力学世界模型”。不让世界模型去预测每一帧复杂的关节级物理状态，而是预测执行一个底层技能后，任务级别的状态变化（如物体位移、任务进度标志）。高层策略在这个世界模型的“想象”中进行训练，从而学会规划长序列任务。
- **技术溯源**: 底层技能基于 ASE (Adversarial Skill Embeddings) 训练；高层策略和世界模型的训练框架借鉴了 DreamerV3。

**2. 技术拆解**
- **重点改进**: 
  1. 结构化潜空间：底层技能的潜变量不再用无结构的球面分布，而是给每个语义技能分配一个离散的 one-hot 锚点，剩余维度用于技能内的连续微调，方便高层精准调用。
  2. 宏观状态转移预测：世界模型在宏观时间尺度（每20个底层控制步）做预测，用残差预测连续变量（如位移），用二分类预测离散标志（如物体是否放下），避免了长步长物理预测的误差累积。
- **架构细节**: 
  - 底层控制器（LLC）：输入本体感受、物体状态和引导变量，结合潜变量输出关节PD目标。训练好后冻结。
  - 高层控制器（HLC）：Actor-Critic架构，输入宏观任务状态和目标，输出潜变量和引导偏移。
  - 世界模型（WM）：简单的多层感知机（MLP），输入当前宏观状态和高层动作，预测下一步的连续状态、离散标志和回合继续概率。
- **核心 Loss**: 
  - 底层LLC：对抗模仿Loss（判别器奖励） + 任务进度Loss。
  - 世界模型WM：连续状态的MSE Loss + 离散标志的BCE Loss + 继续概率的BCE Loss。
  - 高层HLC：Actor用策略梯度Loss（带优势归一化和熵正则），Critic用分布值Loss。训练初期加入了行为克隆（BC）Loss做冷启动。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：基于HITR构建的多物体重排任务（包含厨房、卧室等场景），分ID（62个训练任务）和OOD（20个测试任务），动捕数据使用OMOMO和SAMP。
  - Baseline：InterMimic（运动跟踪）、TokenHSI（有限状态机切换技能）、HumanVLA（端到端单物体策略拼接）。
- **评价指标**: 
  - SR_k（成功率）：前k个物体成功放置（误差<0.2m）的Episode比例。
  - APE（平均放置误差）：物体最终位置到目标的平均距离。
  - Time：成功任务的平均耗时。
- **实验结果**: 
  - 在双物体重排任务中，LUCID的完整任务成功率（SR2）在ID下达到89.2%，远超HumanVLA（39.8%）、TokenHSI（28.7%）和InterMimic（4.7%）。
  - 在OOD测试中同样保持最高成功率，且放置误差（APE）最低（ID下0.83m，优于其他方法）。
  - 结果证明，基于想象的宏观规划能有效处理长序列任务中的状态依赖问题，比脚本切换或纯端到端方法更可靠。
