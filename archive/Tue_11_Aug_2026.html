            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [RynnValue (原文未提供显式大标题，以模型名称指代)] (RynnValue：用于机器人操作的开源价值基础模型)
- **研究机构**: `Alibaba DAMO Academy (阿里巴巴达摩院)`
- **Arxiv ID**: `2608.09853` | [点击跳转](https://arxiv.org/abs/2608.09853)

本文属于**机器人学习（Robot Learning）/ 强化学习（RL）**领域，是一篇**方法创新与系统工程**结合的工作。

**0. 论文标题**
- **英文标题**: RynnValue (原文未提供显式大标题，以模型名称指代)
- **中文标题**: RynnValue：用于机器人操作的开源价值基础模型
- **研究机构**: Alibaba DAMO Academy (阿里巴巴达摩院)
- **一句话总结**: 提出用“剩余时间（时间距离）”替代“归一化进度”或“偏好”作为机器人价值模型的监督信号，配合防捷径的采样与注意力设计，在零偏好标注下实现了 SOTA 的轨迹排序和真实世界 RL 策略提升。

**1. 整体逻辑**
- **研究任务**: 为通用机器人策略学习（特别是强化学习）提供密集奖励（Dense Reward）或价值评估（Value Estimation）。
- **研究动机**: 现有的通用奖励模型依赖人工偏好（preferences）或归一化进度（[0,1] progress）。进度只是轨迹内的相对坐标，不是控制论里真正的“剩余成本（cost-to-go）”，跨实体和跨任务时很难对齐；而偏好标注成本太高，难以扩展。
- **本质改动**: 把监督目标从“进度百分比/偏好打分”改成了“时间距离（temporal distance）”，即预测当前帧距离任务完成还剩多少秒。这个标签可以直接从视频时间戳算出来，实现了廉价、跨数据集的统一价值监督。
- **技术溯源**: 视觉语言基座基于 RynnBrain；连续值预测借鉴了 DreamerV3 的 symlog 空间与 two-hot 分布头；下游 RL 接口使用了基于势能的奖励塑形（potential-based shaping）。

**2. 技术拆解**
- **核心方法**: 
  1. **时间距离监督**：同时预测绝对剩余时间和相邻帧的相对时间位移。
  2. **防捷径设计**：为了防止模型不看画面、只靠帧的顺序或间隔来“猜”时间，采用了随机时间采样（打破固定间隔）、时间顺序打乱（打破序列位置与进度的绑定）、以及价值隔离注意力（Value-isolation attention，限制不同帧的 value query 互相不可见，防止模型通过外推前序 value 来作弊）。
  3. **指令不匹配增强**：10% 的数据替换为错误指令，训练模型识别图文不符，避免无脑输出进度。
- **关键细节**: 
  - **基座与规模**：基于 RynnBrain (8B 和 4B)。训练数据超 7000 小时，约 300 万个指令条件片段（涵盖 OXE、AgiBot、EgoDex 等异构数据）。
  - **输入输出**：输入任务指令、实体元数据和 K=8 帧观测。每帧插入 8 个绝对价值 query token 和 8 个相对价值 query token。
  - **预测头**：使用 BroNet 残差 MLP 作为分布头，在 symlog 空间划分 256 个 bin，输出连续时间值。
- **训练/优化目标**: 
  - **绝对时间距离损失**：交叉熵损失，two-hot 目标。
  - **相对时间位移损失**：交叉熵损失，two-hot 目标。
  - **自然语言生成损失**：交叉熵损失，用于生成视频描述、指令匹配和成功判断（权重设为 2）。

**3. 实验结果**
- **实验设置**: 
  - **评测基准**：RBM-EVAL-OOD（包含 6 个 OOD 数据集的轨迹排序任务）。
  - **对比 Baseline**：Robometer (RBM-1M, Progress only), RoboReward, VLAC, GVL, RoboDopamine 等。
  - **真实世界 RL**：双臂 Franka 机器人，4 个操作任务（放面包、铲牛排、放盒子进抽屉、双臂搬盒子）。基线策略为 $\pi_{0.5}$，离线 RL 用 IQL，在线 RL 用 DSRL。
- **评价指标**: 
  - **基准评测**：Kendall's $\tau_a$（衡量预测得分与真实轨迹质量的排序相关性）。
  - **真实世界**：成功率（Success rate），成功回合的平均动作块数（Avg. Steps）。
- **主要结果**: 
  - **轨迹排序**：RynnValue-8B 在 RBM-EVAL-OOD 上平均 Kendall's $\tau_a$ 达 0.675，超过完全偏好监督的 SOTA Robometer (0.655)，远超仅进度监督的 Robometer (0.292)。
  - **真实世界在线 RL**：平均成功率从 52.5% (Robometer) 提升至 72.5%。
  - **真实世界离线 RL**：平均成功率从 63.8% (Robometer) 提升至 82.5%。

### 2. 🔥 [SLIM: Self-supervised Latent Interaction Model（注：原文未提供显式大标题，根据摘要和正文核心命名推断）] (SLIM：自监督潜在交互模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.09771` | [点击跳转](https://arxiv.org/abs/2608.09771)

**领域与类型判断**：本文属于**具身智能/机器人操作（Embodied AI / Robot Manipulation）** 领域，是一篇典型的**方法创新**论文。

**0. 论文标题**
- **英文标题**: SLIM: Self-supervised Latent Interaction Model（注：原文未提供显式大标题，根据摘要和正文核心命名推断）
- **中文标题**: SLIM：自监督潜在交互模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种仅0.5B参数的紧凑型潜在交互策略（SLIM），通过自监督的掩码轨迹预测在潜在空间显式建模动作与观测的动力学关系，在无需庞大VLM骨干和像素级未来预测的情况下，实现了与大规模VLA和世界模型相当或更优的操作性能，且推理延迟和显存占用大幅降低。

**1. 整体逻辑**
- **研究任务**: 语言条件驱动的机器人连续操作（Language-conditioned robot manipulation）。
- **研究动机**: 现有的VLA策略依赖庞大的多模态骨干网络，隐式学习动作与观测变化的关系，计算开销大；而基于世界模型（WAM）的方法在像素级预测未来，会浪费算力在与控制无关的视觉细节（如背景、光照）上，且推理时生成未来帧会增加控制环路的延迟。
- **本质改动**: 将控制计算从“庞大的VLM推理”或“像素级未来生成”转移到“紧凑的观测-动作潜在空间交互”上。通过自监督掩码轨迹预测（双向：用当前和未来观测重构动作，用当前观测和动作预测未来观测），在潜在空间显式建模动作与观测的动力学关系，推理时直接输出动作，不生成未来帧。
- **技术溯源**: 基于 DINOv2（视觉编码器）、T5-small（语言编码器）、Mixture-of-Transformers (MoT) 骨干网络、Flow Matching（流匹配，用于连续动作生成）、JEPA（联合嵌入预测架构，用于潜在空间预测）。

**2. 技术拆解**
- **核心方法**: 提出 SLIM（自监督潜在交互模型）。包含两个阶段：Stage 1 进行自监督掩码轨迹预测，包含逆动力学（IDM，根据当前和未来观测预测加噪动作的流速度）和前向动力学（FDM，根据当前观测和动作预测未来观测的EMA目标）；Stage 2 使用 Flow Matching 训练最终的策略，推理时不需要未来观测。
- **关键细节**: 
  - **模型规模**：0.47B（约0.5B）可训练参数。视觉编码器 DINOv2-B/14 (86.58M)，MoT交互主干 (377.96M)。
  - **输入**：双视角RGB图像（224x224），本体感受状态，语言指令（T5-small编码）。
  - **结构**：紧凑的 Mixture-of-Transformers (MoT) 双流（观测流和动作流）骨干网络。语言通过交叉注意力注入，不参与联合注意力。
  - **动作表示**：连续动作块（Action chunk），LIBERO horizon=8，CALVIN horizon=12。推理时使用4步流采样。
- **训练/优化目标**: 
  - **Stage 1**: $\mathcal{L}_{\mathrm{stage1}} = \lambda_{\mathrm{IDM}}\mathcal{L}_{\mathrm{IDM}} + \lambda_{\mathrm{FDM}}\mathcal{L}_{\mathrm{FDM}}$。IDM 损失为预测动作流速度与真实速度的MSE；FDM 损失为预测未来观测潜在与EMA目标（停止梯度）的L1损失（带LayerNorm）。最佳权重比 $\lambda_{\mathrm{IDM}}:\lambda_{\mathrm{FDM}} = 0.125:1$。
  - **Stage 2**: $\mathcal{L}_{\mathrm{stage2}} = \mathcal{L}_{\mathrm{FM}}$，即标准的 Flow Matching 动作生成损失（MSE）。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：LIBERO（4个标准套件），LIBERO-Plus（零样本鲁棒性测试，7种扰动），CALVIN ABC->D（长程任务组合，未见环境D）。
  - **真实世界**：5个操作任务（如放胡萝卜、叠盘子等），每个任务150条演示，共750条。测试 nominal 及3种OOD扰动（背景、光照、干扰物）。
  - **Baselines**：VLA类（OpenVLA, OpenVLA-OFT, $\pi_0$, $\pi_{0.5}$, NORA, WorldVLA, UnifiedVLA, RIPT-VLA等），WAM类（Fast-WAM, VLA-JEPA, GR-1, UniPi, VPP等）。
- **评价指标**: 仿真用成功率（LIBERO/LIBERO-Plus）和平均序列长度（CALVIN）；真实世界用进度得分（Progress score，0, 0.5, 1）；系统效率用推理延迟（ms）、峰值显存（GiB）和每动作块FLOPs。
- **主要结果**: 
  - **LIBERO**：整体成功率 97.5%（与最大模型持平）。
  - **LIBERO-Plus**：零样本鲁棒性整体成功率 77.45%，大幅领先 OpenVLA-OFT (69.6%) 和 $\pi_0$ (69.3%)，且无需额外具身预训练。
  - **CALVIN ABC->D**：平均序列长度 4.556（满分5），优于所有对比基线。
  - **真实世界**：在 nominal、干扰物、光照下取得最高平均进度，背景扰动下（49）接近 $\pi_{0.5}$（54），远超 Fast-WAM（2）。
  - **效率**：在单张 H100 上，推理延迟 60.6ms（比 $\pi_{0.5}$ 快 3.19倍，比 Fast-WAM 快 5.95倍），峰值显存 4.26 GiB，FLOPs 仅 490.73 G（比 $\pi_{0.5}$ 少 9.61倍）。

### 3. 🔥 [HarnessWAM] (HarnessWAM)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.09516` | [点击跳转](https://arxiv.org/abs/2608.09516)

**0. 论文标题**
- **英文标题**: HarnessWAM
- **中文标题**: HarnessWAM
- **研究机构**: 原文未提及
- **一句话总结**: 提出 HarnessWAM 智能体框架，通过外部任务管理器、可执行空间投影和双时间尺度反馈闭环，弥补了世界动作模型（WAM）在长视野具身任务中缺乏全局规划、状态维护与失败恢复能力的缺陷。

**1. 整体逻辑**
- **研究任务**: 长视野、部分可观测环境下的复杂具身操作任务（如多物体转移、遮挡处理、计数、顺序执行）。
- **研究动机**: 现有的世界动作模型（WAM）只能进行有限视野的预测和局部动作生成，缺乏全局任务状态维护、结果验证和失败恢复能力。这种局部预测控制与长视野任务所需的全局深思之间的不匹配，被称为“预测-深思鸿沟”（prediction-deliberation gap）。
- **本质改动**: 不修改底层 WAM 的网络架构，而是在其外部包裹一个 Agent 框架（Harness）。将 WAM 降级为局部技能执行器，由外部的 VLM 任务管理器负责全局状态维护、计划编译、进度监控和失败恢复。
- **技术溯源**: 基于 World Action Models（如 LingBot-VA）、视觉语言模型（Qwen3-VL-32B）、视觉编码器（SigLIP2），以及传统任务与运动规划（Task-and-motion planning）中的符号接地和状态机思想。

**2. 技术拆解**
- **核心方法**: HarnessWAM 框架。包含三个核心机制：1) 基于证据的任务状态维护（场景信念和结构化任务图）；2) 能力条件约束的可执行空间投影（将 VLM 的开放语义计划编译为 WAM 支持的原子技能序列）；3) 事件驱动的双时间尺度控制（快循环进度估计 + 慢循环 VLM 深思与恢复）。
- **关键细节**: 
  - **底层执行器**: 使用 LingBot-VA 作为 WAM，输入 256×256 的双视角（agent/wrist）RGB 和机器人本体状态，输出动作块（action chunks）。
  - **任务管理器（Task Manager）**: 使用 Qwen3-VL-32B-Instruct（零样本，无微调），仅在关键事件触发时调用。维护场景信念（包含实体、属性、认知状态）和有向任务图（包含物理执行节点和认知观察节点）。
  - **进度估计器（Progress Estimator）**: 使用冻结的 SigLIP2 提取特征，接 4 层因果 Transformer。输入最近 5 帧双视角 RGB 和当前技能指令，输出连续进度和完成概率。
- **训练/优化目标**: 
  - WAM 和 Task Manager 无联合训练，Task Manager 直接零样本推理。
  - 进度估计器的损失函数包含 6 项：连续进度回归、进度区间分类、时序排序、轨迹端点锚定、阶段完成预测和局部单调性约束。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmark**: RoboMemArena（26个长视野操作任务，强调历史依赖和部分可观测）和 RoboCerebra Ideal（强调长视野组合操作和高级推理）。
  - **Baselines**: RoboMemArena 上对比 π_0.5、HiF-VLA、MemoryVLA、MemER、PrediMem，以及同权重的 WAM+Whole Task、WAM+Static Plan；RoboCerebra 上对比 π_0.5、OpenVLA、GPT-4o Planner+OpenVLA、HPE Framework。
- **评价指标**: RoboMemArena 使用全任务成功率（Full-task SR）和子任务成功率（Subtask SR）；RoboCerebra 使用关键物体状态转换的平均完成率（SR）。
- **主要结果**: 
  - **RoboMemArena**: HarnessWAM 取得 SOTA，全任务成功率 59.6%，子任务成功率 69.9%。比次优的 PrediMem 分别高出 21.1% 和 14.7%。相比同一 WAM 权重的 WAM+Static Plan，全任务成功率提升 11.7%，证明提升来自外部框架而非单纯的计划分解。
  - **RoboCerebra Ideal**: 取得 SOTA，成功率 23.7%，比 GPT-4o Planner+OpenVLA 高 1.78%。
  - **消融实验**: 移除“可执行空间投影”导致全任务成功率暴跌至 18.5%（下降 41.1%），证明将 VLM 计划对齐到 WAM 物理执行接口是核心贡献；移除“进度事件触发”和“结构化任务状态”也导致显著下降。计划级诊断显示，可执行空间投影将 VLM 原始计划的物理可执行率从 13.8% 提升至 72.9%。

### 4. 🔥 [TempoWAM: Timing Execution by Monitoring Progress Online] (TempoWAM：通过在线监控进度来控制执行时机)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.09492` | [点击跳转](https://arxiv.org/abs/2608.09492)

**0. 论文标题**
- **英文标题**: TempoWAM: Timing Execution by Monitoring Progress Online
- **中文标题**: TempoWAM：通过在线监控进度来控制执行时机
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种即插即用的自适应执行方案，通过轻量级监控器在线评估“任务进度”来决定世界动作模型（WAM）动作块的重规划时机，在简单阶段减少推理开销，在困难阶段提前重规划以提升成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作中世界动作模型（WAMs）的动作块（action chunk）执行与重规划（replanning）决策。
- **研究动机**: 现有的 WAMs 通常采用固定步数的执行视界（fixed execution horizon），但动作块的可靠性随任务阶段变化（简单阶段可靠期长，困难阶段误差积累快）。现有基于动作熵或注意力等代理指标的自适应方法，无法直接衡量“任务是否在实际推进”，导致简单任务浪费算力，困难任务成功率低。
- **本质改动**: 将重规划触发条件从“固定步数”或“动作不确定性”改为“任务进度（task progress）”，通过评估剩余动作能否按预期推进任务来决定是否丢弃动作并重规划。
- **技术溯源**: 基于世界动作模型（World Action Models, WAMs）范式，具体使用了 FastWAM 和 Motus 作为基座模型（backbone）。

**2. 技术拆解**
- **核心方法**: TempoWAM，包含两个核心模块：1) 循环进度监控器（RPM）：根据当前观测、任务指令、候选动作前缀和执行历史，估计如果执行这些动作能达到的任务进度；2) 自适应执行协议（AEP）：比较“观测到的进度率”与“需求的进度率”，结合带在线自适应的校准因子，决定是否继续执行当前动作块或触发 WAM 重规划。
- **关键细节**: 
  - **规模与结构**: RPM 仅 2.27M 参数（占基座 FastWAM 的 0.038%）。使用 WAM 冻结的视觉 backbone 提取观测特征，通过 GRU 融合观测、动作前缀、历史进度和位置编码，最后经 MLP 输出进度估计值。
  - **执行机制**: 每次生成新动作块后，先无条件执行一个短前缀（仿真中 $n_p=10$，真机中 $n_p=4$），然后逐步评估剩余动作。
  - **在线校准**: 引入任务级校准因子，在回合内通过 EMA 更新以吸收估计偏差，在回合间根据成功率与目标成功率的差距动态缩放，以平衡效率与成功率。
- **训练/优化目标**: 
  - **进度预测损失**: 使用 BCE Loss 拟合基于时间步的软进度标签（$u/T_{ep}$）。
  - **平滑正则化**: 约束连续进度预测的差值，减少决策振荡。
  - **历史一致性正则化（HCR）**: 随机 mask 部分观测输入，迫使监控器依赖执行历史而非瞬态视觉噪声。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**: RoboTwin 2.0、LIBERO 仿真基准，以及真机双臂平台（3个任务）。
  - **对比对象**: 基座模型默认固定视界执行（FastWAM-24/12），以及两种自适应执行基线方法 Auto-Horizon（基于自注意力）和 AAC（基于动作熵）。
- **评价指标**: 成功率（SR, %）、WAM 推理调用次数（Calls，衡量计算成本）、成功回合的执行步数（Steps，衡量轨迹效率）。
- **主要结果**: 
  - **RoboTwin**: 短视界任务在保持/提升成功率的同时减少了 WAM 调用；长视界任务成功率提升（Clean 环境 86.93% 升至 88.47%）且执行步数减少。
  - **LIBERO**: 平均成功率保持 97.25%，WAM 平均调用次数从 14.88 降至 12.46。
  - **真机任务**: 简单任务（take drinks）减少 26.9% 的 WAM 调用（32.7 降至 23.9）且保持 90% 成功率；困难任务（pack hand cream）成功率提升 13.3 个点（50.0% 升至 63.3%）。
  - **即插即用与开销**: 直接挂载到 Motus 模型上无需重训，在 move_can_pot 任务上成功率最高提升 59 个点；RPM 单次决策开销极低，在复用 WAM 视觉特征时仅占一次 WAM 推理耗时的 0.34%。

### 5. 🔥 [VANE: A Reliable Test-Time Training Framework for VLA Policies] (VANE：一种用于视觉-语言-动作策略的可靠测试时训练框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.09448` | [点击跳转](https://arxiv.org/abs/2608.09448)

**0. 论文标题**
- **英文标题**: VANE: A Reliable Test-Time Training Framework for VLA Policies
- **中文标题**: VANE：一种用于视觉-语言-动作策略的可靠测试时训练框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出 VANE 框架，通过上下文路由的 Prompt 混合、未来视觉表征预测以及“影子提议-未来验证”机制，解决了 VLA 模型在闭环操作中测试时训练（TTT）的任务干扰和在线更新不可靠问题。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）策略在机器人闭环操作中的测试时训练（Test-Time Training, TTT）与无标签在线适应。
- **研究动机**: 现有的 TTT-VLA 在闭环操作中不可靠。一方面，单一共享 Prompt 会导致不同任务的修正方向互相干扰（Task interference）；另一方面，直接在线更新会在后果未知前改变后续动作，导致闭环耦合（Closed-loop coupling），可能引入有害更新导致性能退化。
- **本质改动**: 将 TTT 的更新空间改为上下文路由的 Prompt 混合（MoLP）以解耦任务干扰，将自监督目标改为预测未来视觉表征（WPI）以提供跨时间监督，并引入“影子提议-未来验证-原子提交”机制（AGV-TTT）来确保在线更新的可靠性和可逆性。
- **技术溯源**: 基于 QwenPi（StarVLA-$\alpha$ 框架下的 Flow-matching VLA）、V-JEPA 2（视觉表征编码器）、TTT-VLA（Latent-prompt TTT 基线）。

**2. 技术拆解**
- **核心方法**: 
  1. **MoLP (Mixture of Latent Prompts)**：维护一个共享的 Prompt Bank，通过线性 Router 根据当前视觉-语言上下文进行 Top-K 稀疏路由，动态组合 Prompt，无需外部任务 ID，平衡跨任务共享与特化。
  2. **WPI (World-Predictive Interface)**：用冻结的 V-JEPA 2 提取当前和延迟的未来视觉 Token，将当前视觉、路由后的 Prompt 和 Action Token 输入 DiT，预测未来视觉表征，作为无标签的自监督代理目标。
  3. **AGV-TTT (Attention-Gated and Validation-Driven TTT)**：监控 Action-to-VLM/Predictive-latent 的跨层注意力变化，在交互转换（如接触、抓取）时触发“影子更新”（在 Prompt Bank 的副本上进行）。利用后续到达的观察对新老 Prompt 进行配对验证，仅当聚焦损失改善且全局不退化时才原子提交更新，否则回滚。
- **关键细节**: Prompt Bank 包含 8 个 Latent Prompts，采用 Top-2 路由。WPI 预测步长 $k=8$。AGV-TTT 验证窗口 $H_v=4$。训练时联合优化 Action、WPI 和 Router 损失；部署时仅更新 Prompt Bank，Router 和 Policy backbone 冻结。
- **训练/优化目标**: 
  - 训练阶段：$\mathcal{L}_{\mathrm{train}} = \mathcal{L}_{\mathrm{act}} + 0.1\mathcal{L}_{\mathrm{wpi}} + 0.01\mathcal{L}_{\mathrm{lb}}$，其中 $\mathcal{L}_{\mathrm{act}}$ 是 flow-matching 动作损失，$\mathcal{L}_{\mathrm{wpi}}$ 是未来视觉表征预测的 MSE 损失，$\mathcal{L}_{\mathrm{lb}}$ 是路由负载均衡损失。
  - 部署阶段（TTT）：仅优化 Prompt Bank，目标为基于注意力权重加权的聚焦预测损失 $\mathcal{L}_{\mathrm{focus}}$。

**3. 实验结果**
- **实验设置**: 在 SimplerEnv 的 WidowX（4个任务）和 Google Robot（3个或4个任务家族）上进行闭环评估。训练数据为 RT-1 和 Bridge。对比 Baseline 包括 RT-1-X, OpenVLA, $\pi_0$, TTT-VLA 等，主要进行同 Backbone (QwenPi/QwenWPI) 下的消融和对比。
- **评价指标**: 任务成功率（Success Rate）。
- **主要结果**: 
  - 在 WidowX 上，完整的 VANE (QwenWPI + MoLP + AGV-TTT) 达到 71.2% 成功率，比对应的 TTT baseline 提升 3.2 个百分点，比 TTT-VLA ($\pi_{0.5}$) 高 3.8%。
  - 在 Google Robot 上，最强变体 (QwenPi + MoLP + AGV-TTT) 在 3-task 上达到 76.7%（比 TTT-VLA 高 10.4%），但 WPI 的表现不如 State Grounding，表明增益具有任务和 Embodiment 依赖性（WidowX 离训练分布更远，WPI 优势更明显）。
  - 效率方面，AGV-TTT 减少了 98.7% 的反向传播次数（从 45824 降至 612），同时将单 Prompt 变体的成功率从 67.5% 提升至 69.0%。

### 6. 🔥 [JEPA-WAM（原文未提供完整大标题，正文中统称为 JEPA-WAM）] (JEPA-WAM（基于 JEPA 的潜在世界动作模型）)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.09381` | [点击跳转](https://arxiv.org/abs/2608.09381)

**0. 论文标题**
- **英文标题**: JEPA-WAM（原文未提供完整大标题，正文中统称为 JEPA-WAM）
- **中文标题**: JEPA-WAM（基于 JEPA 的潜在世界动作模型）
- **研究机构**: 原文未提及
- **一句话总结**: 提出 JEPA-WAM，在 V-JEPA 表征空间中构建保留 patch 级空间结构的“当前-未来”联合转移目标，通过共享预测器将转移预测与动作生成耦合，显著提升了 VLA 策略在 OOD 场景下的泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（视觉-语言-动作模型 VLA / 世界动作模型 WAM）。
- **研究动机**: 视频生成类 WAM 部署成本太高；而现有的潜在（latent）WAM 要么把未来观测压缩成少量 token 丢了细粒度空间结构，要么把预测建模和动作生成的表征分开，导致转移监督信号无法直接塑造动作生成的骨干网络。
- **本质改动**: 放弃预测绝对未来状态或重建像素，转而预测“当前-未来”联合表征来捕获时间关系，并通过共享骨干网络，让转移监督信号直接优化用于动作生成的特征提取器。
- **技术溯源**: V-JEPA 2.1（视觉编码器）、Qwen2.5-0.5B（共享预测器骨干）、DiT（Flow-matching 动作专家）、$\pi_{0.5}$（预训练 VLA 基座）。

**2. 技术拆解**
- **核心方法**: 
  1. **联合当前-未来目标**：用冻结的 V-JEPA 将当前帧和未来帧（间隔 $\delta$）在时间维度拼接编码，得到保留 patch 级空间结构的联合表征，作为转移预测的监督目标。
  2. **共享预测器**：用 LLM 骨干同时处理视觉和语言输入，其输出的隐藏状态一部分用于预测联合目标，另一部分（专用的 action placeholder）用于条件化动作专家。
  3. **插件式迁移**：这套联合目标监督机制可以作为辅助分支，直接插进预训练 VLA（如 $\pi_{0.5}$）里，不改动原有的感知和动作路径。
- **关键细节**: 
  - **视觉编码器**：冻结的 V-JEPA 2.1 ViT-L/16，输入 384x384，输出 24x24 的 1024 维 patch 特征。
  - **共享预测器**：Qwen2.5-0.5B，使用 LoRA (rank 32) 微调。
  - **动作专家**：16层 DiT-L flow-matching 模型，预测连续动作块（action chunk）。
  - **推理部署**：推理时直接砍掉目标分支和转移预测头，只依赖当前帧，不增加额外推理负担（延迟 85ms，11.76 Hz）。
- **训练/优化目标**: 
  - **联合损失**：$\mathcal{L} = \mathcal{L}_{act} + 0.5 \mathcal{L}_{wm}$。
  - **转移损失 $\mathcal{L}_{wm}$**：预测表征与冻结联合目标之间的 patch 级平均余弦距离。
  - **动作损失 $\mathcal{L}_{act}$**：基于条件 flow matching 的速度预测（velocity-prediction）或 x-prediction 的 MSE 损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：LIBERO（4个标准套件）、LIBERO-Plus（OOD 泛化测试）、RoboTwin 2.0（20个任务，Clean/Random 设置）。
  - **真实世界**：AgileX COBOT Magic 双臂平台（5个操作任务，ID/OOD 设置）。
  - **Baseline**：Diffusion Policy, ResVLA, Fast-WAM, VLA-JEPA, $\pi_{0.5}$ 等。
- **评价指标**: 仿真环境使用任务成功率（Success rate %），真实世界使用归一化任务完成得分（[0,1]）。
- **主要结果**: 
  - **LIBERO-Plus (OOD)**：JEPA-WAM 达到 79.2%（无大规模预训练方法中最佳）；作为辅助目标加入 $\pi_{0.5}$ 后，从 84.5% 提升至 86.3%（整体最佳）。
  - **RoboTwin 2.0**：JEPA-WAM 在 Random (OOD) 设置下达到 36.9%，远超无预训练 baseline；加入 $\pi_{0.5}$ 后，Clean 设置从 75.4% 提升至 84.6%。
  - **真实世界 (OOD)**：JEPA-WAM 得分 54.2%（$\pi_0$ 仅 22.5%）；加入 $\pi_{0.5}$ 后，从 72.5% 提升至 84.7%。

### 7. 🔥 [WorldSimProbe (注：原文未提供显式主标题行，此处采用核心方法名及第4节标题)] (WorldSimProbe：一个诊断性基准测试)
- **研究机构**: `原文未提及（致谢显示受中国国家自然科学基金、北京市自然科学基金等资助）`
- **Arxiv ID**: `2608.09298` | [点击跳转](https://arxiv.org/abs/2608.09298)

**0. 论文标题**
- **英文标题**: WorldSimProbe (注：原文未提供显式主标题行，此处采用核心方法名及第4节标题)
- **中文标题**: WorldSimProbe：一个诊断性基准测试
- **研究机构**: 原文未提及（致谢显示受中国国家自然科学基金、北京市自然科学基金等资助）
- **一句话总结**: 提出了 WorldSimProbe 基准，通过5个受控测试套件系统评估动作条件世界模型（ACWMs）的物理模拟器保真度，揭示了现有模型在动作实现和交互接地上的系统性缺陷。

**1. 整体逻辑**
- **研究任务**: 评估动作条件世界模型（Action-Conditioned World Models, ACWMs）作为物理模拟器的保真度（Simulator Faithfulness）。
- **研究动机**: 现有评估过度依赖视觉质量、任务成功率或粗略的 rollout 响应，无法直接检验“输入动作是否精确导致对应智能体运动”以及“环境响应是否真实基于该运动”这两个物理模拟器的核心能力。
- **本质改动**: 将评估范式从“判断生成视频是否合理或任务是否成功”转变为“验证可观测模拟器契约（Observable Simulator Contract）”，即严格测试“动作 -> 智能体运动 -> 环境响应”链路的物理一致性。
- **技术溯源**: 基于现有的开源 ACWMs 和具身模拟器平台（RoboTwin、ManiSkill、LIBERO）；评估器依赖预训练的光流模型（DPFlow）、分割模型（RobotSeg）、点跟踪器（TAPNext++）和视觉语言模型（Qwen3-VL-8B）。

**2. 技术拆解**
- **核心方法**: 提出 WorldSimProbe，包含5个递进的诊断套件（Tasks 1-5）：T1 局部动作校准（微小扰动响应）、T2 全局轨迹覆盖（跨任务动作重放）、T3 动作源行为保持（多控制源执行）、T4 交互接地（无接触场景下的幻觉检测）、T5 交互动力学（8种基本交互原语的物理规律）。
- **关键细节**: 在3个平台上构建了 18,608 个受控评估实例。评估6个开源 ACWMs（分为动作注入架构和统一动作-视频架构）。T1 使用对齐后的全视频 MSE 比例；T2/T3 使用 RMFA（Robot-Masked Flow Alignment，基于机器人掩码的光流对齐）评估密集动作-运动对应；T4 使用 TAPNext++ 跟踪物体位移以检测接触幻觉；T5 使用 Qwen3-VL-8B 作为 VLM Judge 判断交互原语。
- **训练/优化目标**: 本文为基准测试/评估类工作，无模型训练目标。核心机制为基于物理模拟器参考（Oracle）的相对误差计算、光流场对齐误差、以及基于规则和 VLM 的状态判定。

**3. 实验结果**
- **实验设置**: 测试平台为 RoboTwin（50个双臂任务）、ManiSkill（11个单臂任务）和 LIBERO（40个单臂任务）。被评估对象（Baselines）为 6 个开源 ACWMs：IRASim、Ctrl-World、BWM、DreamDojo、LingBot-VA、Cosmos-3-Nano。
- **评价指标**: 各套件独立打分（0-100分），包括 T1 的相对响应比例得分、T2/T3 的 RMFA 归一化得分、T4 的无位移通过率、T5 的 VLM 原语判断准确率。Overall 为 T1-T5 的宏观平均。
- **主要结果**: 
  1. **综合排名**：LingBot-VA 在 RoboTwin 和 ManiSkill 领先，Ctrl-World 在 LIBERO 领先。架构类型（动作注入 vs 统一）不能直接决定保真度。
  2. **动作实现**：模型在局部校准上存在响应衰减；当输入动作偏离任务先验（全局/跨源）时，保真度显著下降，表明模型过度依赖场景或任务关联的运动先验。
  3. **交互缺陷**：模型普遍存在“接触幻觉”（在视觉暗示接触但实际无接触的场景中，T4 假接触得分最低仅 38.6）；在动力学原语上，对 shake（摇晃）的掌握几乎为零（0.0-1.2分）。
  4. **下游相关性**：基于 WorldSimProbe 排名生成的合成数据，在 OOD（分布外）控制下的策略成功率排名与基准测试结果高度一致，证明了该 benchmark 对下游任务的实际指导价值。

### 8. 🔥 [SG-WAM (原文未提供完整大标题，基于正文推断为 SG-WAM: Semantic Guidance for World-Action Models)] (SG-WAM：世界动作模型的语义引导)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.08839` | [点击跳转](https://arxiv.org/abs/2608.08839)

**0. 论文标题**
- **英文标题**: SG-WAM (原文未提供完整大标题，基于正文推断为 SG-WAM: Semantic Guidance for World-Action Models)
- **中文标题**: SG-WAM：世界动作模型的语义引导
- **研究机构**: 原文未提及
- **一句话总结**: 提出 SG-WAM，通过 VLM 规划器预测“文本接地”和“空间感知”的未来语义特征图来引导世界动作模型（WAM），解决了传统 WAM 因文本与视觉特征独立编码导致的指令跟随不准问题。

**1. 整体逻辑**
- **研究任务**: 领域与类型：具身智能/机器人操作（方法创新）。具体任务：构建基于语言指令联合预测未来视频和动作的世界动作模型（World-Action Models, WAMs）。
- **研究动机**: 现有的 WAM 主要依赖视觉线索，语言指令仅通过独立的文本编码器（如 CLIP/T5）转化为 embedding 输入。这种文本与视觉观测独立的编码方式，导致生成的未来视频和动作在语义上与指令不对齐，模型容易被视觉显著性干扰而偏离任务意图。
- **本质改动**: 摒弃独立的文本 embedding 条件，改用 VLM 预测包含“文本接地（找对目标物体）”和“空间感知（提供场景几何）”的未来语义特征图，将其作为高级语义蓝图注入到 WAM 的视频和动作生成过程中。
- **技术溯源**: 基于 VLM 基座（Qwen3.5）、视频扩散模型（LTX-Video）、视觉语言对齐模型（SigLIP2）、深度估计模型（Depth Anything 3），以及现有 WAM 架构中的联合注意力（joint attention）和流匹配（flow-matching）机制。

**2. 技术拆解**
- **核心方法**: 系统分为 VLM 语义规划器（Semantic Planner）和语义引导的世界动作模型（WAM）。Planner 从当前观测和指令中预测未来关键帧的 dense feature maps；WAM 通过门控融合（gated fusion）和交叉注意力将这些特征图注入到视频专家中，动作专家则通过联合注意力隐式获取引导，确保视频和动作生成严格遵循指令。
- **关键细节**: 
  - **Planner**: 采用 Qwen3.5 2B。输入图像和指令，附加可学习的 query tokens（分为 32 个 base tokens 和两组各 32 个模态特定 tokens）。通过 resampler 解码出 $P=256$ 个 token 的特征图（文本接地维度 1024，空间感知维度 2048），预测 $K=4$ 个未来关键帧。
  - **WAM**: 基于预训练的 LTX-Video 扩散模型。生成 $T=9$ 帧未来视频，预测 $H=36$ 步动作 chunk。
  - **训练机制**: 采用三阶段训练（1. Planner 预训练；2. Planner + 视频专家联合训练；3. 全局联合训练）。推理时使用 classifier-free guidance（训练时 drop rate 为 0.15）。
- **训练/优化目标**: 
  - **Planner**: 使用 MSE loss 对齐 SigLIP2 的倒数第二层 patch tokens 特征，使用 Smooth-L1 loss 对齐 Depth Anything 3 的最后一层 dense 特征。
  - **WAM**: 视频专家和动作专家均使用 Flow-matching loss，通过回归从高斯噪声到干净目标的 velocity 进行优化。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmark**: LIBERO（4 个标准 suite）、LIBERO-Plus（7 种环境/指令扰动）、DROID（用于 OOD 指令分析），以及真实世界 AgileX Cobot 双臂平台（4 个操作任务）。
  - **Baseline**: VLA 类模型（OpenVLA-OFT、$\pi_0$、$\pi_{0.5}$、GR00T-N1 等）；WAM 类模型（WorldVLA、GE-Act、Motus、FastWAM、LingBot-VA 等）。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - **LIBERO**: 平均成功率达到 98.7%（SOTA），超过次优的 LingBot-VA（98.5%）。
  - **LIBERO-Plus**: 在扰动环境下平均成功率 81.3%（SOTA），特别是在语言指令扰动下提升显著（+2.2%），证明了指令接地特征的有效性。
  - **真实世界**: 在 4 个标准任务和 2 个泛化任务（未见高度、未见光照）中均取得最高成功率，展现了强鲁棒性。
  - **消融实验**: 移除语义引导、移除任一语义分支（文本/空间）、或改为单阶段端到端训练，均会导致性能下降，验证了核心设计的必要性。

### 9. 🔥 [Vid2WAM] (Vid2WAM)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.08558` | [点击跳转](https://arxiv.org/abs/2608.08558)

**0. 论文标题**
- **英文标题**: Vid2WAM
- **中文标题**: Vid2WAM
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Vid2WAM 框架，利用视频基础模型生成的未来视频和逆动力学模型恢复的伪动作作为离线双通道监督，将大模型先验蒸馏到轻量级世界动作模型中，提升机器人在少样本和无专家演示情况下的新任务泛化能力。

**1. 整体逻辑**
- **研究任务**: 基于视觉和语言指令的机器人策略学习（动作生成）。
- **研究动机**: 现有的世界动作模型（WAMs）依赖昂贵的目标专家轨迹来提供未来视觉和动作的监督信号，导致数据效率低、新任务泛化差；而直接用视频大模型在线生成动作会面临推理延迟高、信息瓶颈和伪标签噪声等问题。
- **本质改动**: 打破“未来监督必须来自真实专家轨迹”的限制，把视频大模型当作离线的“未来视频生成器”，结合逆动力学模型（IDM）生成伪动作，通过双通道和源感知残差适配器将先验知识离线蒸馏给小模型，推理时完全抛弃大模型。
- **技术溯源**: World Action Models (WAMs) / Fast-WAM，视频扩散模型（Wan2.1 / LVP），逆动力学模型（IDM），Flow Matching（流匹配）。

**2. 技术拆解**
- **核心方法**: 
  1) **离线伪数据生成**：用微调后的视频大模型根据初始观测和指令生成未来视频，再用 IDM 从视频中恢复出伪动作。
  2) **双通道蒸馏**：生成的视频 latent 直接监督学生的未来预测分支，伪动作监督动作分支。
  3) **源感知残差适配（Source-aware residual adaptation）**：在共享的动作骨干网络前后插入针对真实数据和伪数据的轻量级残差适配器，缓解伪动作噪声对共享特征的干扰。推理时仅保留真实域的适配器和动作骨干。
- **关键细节**: 
  - **输入/输出**：输入为当前视觉观测、本体感觉状态、语言指令；输出为动作块（action chunk）。
  - **模型规模**：视频教师模型基于 Wan2.1-I2V-14B；学生模型基于 Wan2.2-TI2V-5B（5B 参数）；IDM 基于 ResNet-50。
  - **推理部署**：丢弃视频教师、IDM 和未来预测头，仅用学生模型的动作预测部分，单次前向传播直接输出动作。
- **训练/优化目标**: 采用流匹配损失（Flow-matching loss）。分别对真实域和伪域的动作块和未来视频 latent 计算损失，总损失为两者的加权和（$\mathcal{L} = \lambda_{real}\mathcal{L}_{real} + \lambda_{pseudo}\mathcal{L}_{pseudo}$，其中 $\lambda_{pseudo}$ 设为 0.25）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：仿真使用 RoboTwin 2.0（50个任务）、LIBERO（4个子集）、LIBERO-Plus（带7种扰动的 LIBERO）；真机使用双臂机器人（AgileX Piper）配 3 个 RealSense D435 相机，包含 6 个 seen 任务和 3 个 novel 任务。
  - **对比 Baseline**：$\pi_{0.5}$、Motus、Fast-WAM。
  - **评估机制**：Low-data regime（每任务仅 10 条专家轨迹）和 Novel regime（目标任务 0 条专家轨迹，纯靠初始观测生成伪数据）。
- **评价指标**: 任务成功率（Success rate）、推理延迟（Inference latency）。
- **主要结果**: 
  - **仿真泛化**：在 RoboTwin 2.0 的 Novel regime 下，Vid2WAM 在 15 个 unseen 任务上的成功率（clean 54.7%, randomized 55.3%）比 Fast-WAM（45.0%, 42.8%）分别提升 9.7 和 12.5 个百分点。
  - **少样本与抗扰动**：在 LIBERO 的 Low-data 机制下平均成功率达 89.7%（最优）；在 LIBERO-Plus 的多种扰动测试中整体成功率最高。
  - **真机表现**：在 9 个真机任务（含 3 个无专家演示的 novel 任务）的 20 次测试中取得最高或相当的成功率（如 novel 任务 Pick Test Tube 30%、Tomato Basket 30%）。
  - **推理效率**：在单张 RTX 4090 上推理延迟约 212.5ms，与 Fast-WAM（209.1ms）持平，远低于 Motus（2414.9ms）和在线 Teacher Policy（4894.5ms）。

**0. 论文标题**
- **英文标题**: 原文未提供完整标题（核心方法名为 4D-WAM）
- **中文标题**: 4D-WAM：通过表示对齐将3D轨迹场的时空知识注入世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种与模型无关的训练策略 4D-WAM，通过运动对齐和目的地对齐，将3D轨迹场的4D时空知识注入到视频动作模型中，显著提升了机器人操作的空间理解、鲁棒性和泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的世界动作模型（World Action Models, WAMs），即联合进行未来视频预测与机器人动作生成。
- **研究动机**: 现有 WAMs 多在 2D 像素空间建模，与机器人执行的 3D 物理空间存在表示鸿沟；近期的 3D 方法（如引入深度图）局限于单帧 3D 表示，忽略了动态场景的 4D 本质（3D 结构随时间的连续演变），且像素级重建容易让模型陷入低级细节，缺乏对高级 4D 运动规律的理解。
- **本质改动**: 不直接预测 3D/4D 几何或增加额外生成模态，而是通过特征表示对齐，将预训练 4D 基础模型提取的 3D 轨迹场知识，以“局部运动变化”和“全局源-目的地对应”的形式，注入到 WAM 的中间层特征中。
- **技术溯源**: 基于 DiT 架构的 WAMs 基座（如 FastWAM-Joint, Lingbot-VA），4D 基础模型 Trace Anything，以及表示对齐（Representation Alignment）技术。

**2. 技术拆解**
- **核心方法**: 提出两个互补的对齐目标。1) **运动对齐（Motion Alignment）**：不直接对齐绝对特征，而是对齐相邻帧的特征差分，捕捉局部 4D 运动感知；2) **目的地对齐（Destination Alignment）**：对齐首尾帧的注意力式相似度分布，建立移动区域与最终目标的对应关系，提供长程目标指导。
- **关键细节**: 
  - 在 DiT 骨干网络的特定位（第 20 层）进行特征对齐。
  - 使用两层 MLP 将 WAM 和教师模型（Trace Anything）的特征映射到共享空间，教师模型的投影网络冻结。
  - 训练时采用预提取和缓存策略（Cache）提取轨迹特征，大幅降低计算开销。
  - 推理时完全移除教师模型和对齐模块，实现零额外推理开销和参数量。
- **训练/优化目标**: 总损失包含原有的潜空间重建损失（$\mathcal{L}_{latent}$）和动作预测损失（$\mathcal{L}_{action}$），加上两个辅助对齐损失：$\mathcal{L}_{motion}$（相邻帧特征差分的余弦距离）和 $\mathcal{L}_{dest}$（首尾帧相似度分布的 KL 散度）。辅助损失权重 $\lambda$ 建议设置在 0.1 以下。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO, RoboTwin 2.0（分布内）；LIBERO-Plus, RoboTwin Clean2Rand（分布外 OOD）。
  - **Baseline**: $\pi_{0.5}$, Motus, FastWAM-Joint, Lingbot-VA, WorldVLA, StarVLA 等。
  - **硬件**: 8 张 NVIDIA H100 GPU。
- **评价指标**: 任务成功率（SR）、视频预测质量（PSNR, SSIM）、真实世界任务进度（Progress）、探针实验指标（Top-k, Rank 等）。
- **主要结果**: 
  - **分布内**: 在 RoboTwin 2.0 和 LIBERO 上均超越基线，LIBERO 平均成功率从 98.2% 提升至 98.6%。
  - **OOD 泛化**: 在 LIBERO-Plus 上平均成功率提升 8.8 个百分点（相机扰动提升 17.26）；在 RoboTwin Clean2Rand 上，结合 Lingbot-VA 取得 61.7% 的平均成功率，是唯一超过 60% 的模型。
  - **视频预测**: PSNR 从 19.22 提升至 21.44，SSIM 从 0.75 提升至 0.83，结构一致性和遮挡处理更好。
  - **真实世界**: 在 4 个长程/复杂任务（如双臂插圆柱、展平毛巾等）中，总成功率从 0% 提升至 5.5%，子任务进度平均提升超 10%。
  - **训练开销**: 缓存特征后，总训练时间仅增加约 2%（51 到 52 GPU hours），峰值显存增加 5.4%。

### 12. 🔥 [GWM-VLA: A Geometry-Aware Latent World Modeling Framework for VLA Learning (基于正文推断)] (GWM-VLA：用于视觉-语言-动作学习的几何感知隐空间世界模型框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.07619` | [点击跳转](https://arxiv.org/abs/2608.07619)

这篇工作属于**具身智能/机器人操作**领域的**方法创新**。

**0. 论文标题**
- **英文标题**: GWM-VLA: A Geometry-Aware Latent World Modeling Framework for VLA Learning (基于正文推断)
- **中文标题**: GWM-VLA：用于视觉-语言-动作学习的几何感知隐空间世界模型框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出 GWM-VLA，通过引入几何感知的多视角状态编码和共享隐动作表示，在隐空间仅对目标视角进行下一步预测，显著提升了 VLA 模型在视觉和环境扰动下的操作鲁棒性。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的视觉-语言-动作（VLA）策略学习，重点解决模型在视角、光照、背景等视觉和环境变化下的鲁棒性问题。
- **研究动机**: 现有 VLA 模型容易过拟合外观特征，环境一变性能就掉。现有的隐空间世界模型（如 VLA-JEPA）虽然避免了生成像素级的未来图像，但它们是独立编码各个相机视角的，忽略了跨视角的几何关系，且预测目标没有充分利用多视角的几何上下文。
- **本质改动**: 把前馈几何基础模型（VGGT-Ω）引入 VLA，在隐空间联合聚合多视角几何特征，并只挑一个目标视角（腕部视角）结合全局几何上下文做下一步隐状态预测，同时让同一套隐动作表示去同时驱动世界模型和动作生成。
- **技术溯源**: 基于 VLA-JEPA（隐空间世界模型框架）、VGGT-Ω（几何感知多视角编码器）、Qwen3-VL-2B（视觉-语言骨干网络）以及 Flow-matching（连续动作生成）。

**2. 技术拆解**
- **核心方法**: 
  1. **几何感知多视角编码**：用冻结的 VGGT-Ω 联合处理多视角图像，提取包含跨视角几何关系的 patch 和 register tokens。
  2. **全局上下文条件化的目标视角预测**：不预测所有视角的未来状态，而是用多视角聚合后的 register tokens 作为全局上下文，只预测腕部视角（wrist view）的下一步 patch tokens，聚焦末端执行器交互。
  3. **共享隐动作表示**：从 VLM 提取的隐动作序列同时作为世界模型和 flow-matching 动作头的条件，让预测损失和动作损失共同优化这组隐动作。
- **关键细节**: 
  - 视觉语言骨干：Qwen3-VL-2B。
  - 几何编码器：VGGT-Ω（冻结参数，使用第24层特征）。
  - 目标视角：腕部视角（wrist view），因其与末端执行器运动和局部交互最相关。
  - 动作头：Conditional Flow-Matching。
  - 预测机制：采用 Time-causal attention，训练时使用 teacher forcing。
- **训练/优化目标**: 
  联合优化动作生成损失和隐状态预测损失：$\mathcal{L} = \mathcal{L}_{\mathrm{action}} + \lambda \mathcal{L}_{\mathrm{wm}}$。
  - $\mathcal{L}_{\mathrm{action}}$ 是 flow-matching 的 MSE 损失。
  - $\mathcal{L}_{\mathrm{wm}}$ 是目标视角 patch tokens 的 L1 预测损失。
  - 权重 $\lambda$ 默认设为 0.1。

**3. 实验结果**
- **实验设置**: 
  - 预训练数据集：DROID（约 76,000 条机器人演示轨迹）。

- **一句话总结**: 【领域/类型：具身智能/机器人操作，方法创新】提出 LIRA 机制，将 VLM 到动作解码器的特征路由从严格的单层对齐改为局部跨层窗口聚合，在不增加额外参数的情况下，显著提升了 VLA 模型在分布偏移下的鲁棒性和操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Robot Manipulation），具体为基于视觉-语言-动作（VLA）模型，将视觉观测和语言指令映射为连续的机器人控制动作。
- **研究动机**: 现有 VLA 模型在将预训练 VLM 的中间层特征路由给动作解码器时，通常只用最后一层、全局聚合或严格的“一对一”层级对齐（即解码器的每个 block 只接收对应 VLM 层的特征）。这限制了模型利用不同深度互补特征的能力，导致在面对视角、光照、背景等分布偏移时鲁棒性较差。
- **本质改动**: 将 VLM 到动作的条件化（conditioning）重构为深度感知的信息路由问题，引入“局部性先验”（locality prior），让动作解码器的每个模块能够接收其对应 VLM 层及相邻层（局部窗口）的特征，而非仅限单层。
- **技术溯源**: 基于 VLA-Adapter（核心架构 baseline）、Prismatic-style VLM（使用 Qwen2.5-0.5B 作为语言骨干）、OpenVLA 等现有 VLA 范式。

**2. 技术拆解**
- **核心方法**: 局部跨层动作条件化机制（LIRA）。在 VLM 输入端追加可学习的 LIRA Query tokens；在动作解码器端，每个 Parallel Fusion Block (PFB) 除了接收对应 VLM 层的 task-token 特征外，还接收以一个局部窗口（centered local window）聚合的 LIRA Query 特征。
- **关键细节**: 
  - **输入**: 第三人称图像、夹爪视角图像、语言指令、机器人本体感知状态（proprioceptive state）。
  - **模型规模**: 0.5B 参数的 VLM 骨干，LIRA Query tokens 数量 M=64。
  - **局部窗口设计**: 默认窗口半径 r=1，即内部 PFB 在 token 维度拼接 3 个相邻 VLM 层的 Query 特征，边界 PFB 拼接 2 层。特征直接送入现有的 cross-attention，不引入额外的投影层或可训练参数。
  - **关键超参**: LoRA rank 64，学习率 1e-4，batch size 16，使用 4 张 H100 GPU 训练。
- **训练/优化目标**: 监督式连续动作回归。损失函数为预测的动作块（action chunk，horizon H）与真实动作之间的 L1 损失（$\mathcal{L}_{act}$）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO（4个标准任务集）、LIBERO-Plus（包含 10,030 个受控扰动任务，用于测试鲁棒性）、CALVIN ABC→D（长序列任务），以及基于 Franka Research 3 的真实机器人平台。
  - **Baseline**: 主要受控对比 VLA-Adapter 和 VLA-Adapter-Pro，同时对比 OpenVLA、OpenVLA-OFT、UniVLA、$\pi_0$ 等。
- **评价指标**: 任务成功率（Success rate, %），CALVIN 额外评估平均完成序列长度（Avg. len.）。
- **主要结果**: 
  - **LIBERO**: 平均成功率从 VLA-Adapter 的 97.3% 提升至 98.9%，长程任务（Long）从 95.0% 提升至 97.6%。
  - **CALVIN ABC→D**: 连续完成 5 个任务的成功率从 76.5% 提升至 80.5%，平均序列长度从 4.42 提升至 4.52。
  - **LIBERO-Plus（零样本迁移）**: 整体成功率从 VLA-Adapter 的 59.1% 大幅提升至 78.0%（+18.9 个百分点），比 OpenVLA-OFT 高 8.4 个百分点；在目标域微调后达到 82.9%。
  - **真实机器人**: 在 4 个操作任务（含两阶段任务）的 10 次测试中，最终成功率均优于 OpenVLA-OFT 和 VLA-Adapter（如 Transfer 任务最终成功率达 7/10）。
  - **系统开销**: 相比 7B 的 OpenVLA-OFT，0.5B 的 LIRA 骨干网络小 14 倍，训练显存减少 79%，推理吞吐量提升 2.61 倍。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.07555` | [点击跳转](https://arxiv.org/abs/2608.07555)

**0. 论文标题**
- **英文标题**: AgenticRobotics（注：原文未显式提供完整论文标题，此处以核心系统名指代）
- **中文标题**: AgenticRobotics：基于证据门控与持久化事务的机器人策略改进控制平面
- **研究机构**: 原文未提及
- **一句话总结**: 将代码 Agent 架构引入机器人策略改进的外循环，通过持久化事务、证据门控和工具质量自动过期机制，实现无需人类干预的可靠自动化实验，其核心价值在于严格控制错误晋升而非提升选择上限。

**1. 整体逻辑**
- **研究任务**: 机器人策略改进（Robot-policy improvement）的自动化外循环（Outer loop）控制。
- **研究动机**: 现有的机器人学习内循环（如 VLA 策略训练、RL 后训练）已经很强，但外循环（解释失败、选择下一步、管理长任务、对比带噪声的评估结果）仍高度依赖人工。直接套用软件工程的 Agent 架构行不通，因为机器人工具（训练流水线、数据收集、策略本身）不可靠且经常失败，必须对工具质量进行严格测量和追踪。
- **本质改动**: 将机器人实验中的一切物理执行和后端操作封装为标准化工具（Tool），引入带有证据账本、崩溃恢复和工具质量自动过期机制的持久化事务控制平面，用严格的统计门控替代启发式的人工选择。
- **技术溯源**: 基于 Coding Agent 架构（主 Agent 管理，子 Agent 执行）、Model Context Protocol (MCP)、VLA 策略后端（如 OpenVLA、$\pi_0$、SmolVLA）、LIBERO 评测套件，以及 Anytime-valid 统计推断方法（如 e-process、SPRT）。

**2. 技术拆解**
- **核心方法**: 提出 AgenticRobotics 控制平面，采用 Agent $\rightarrow$ Skill $\rightarrow$ Tool 的解耦架构。LLM Controller 仅负责决策，不直接接触物理实体；Skill 是可编辑的 Markdown 工作流；Tool 是底层的具体能力。系统通过包含 11 个不变量的 Round Transaction（Bind $\rightarrow$ Analyze $\rightarrow$ Act $\rightarrow$ Measure $\rightarrow$ Score $\rightarrow$ Commit）来保证状态持久化和崩溃恢复。
- **关键细节**: 
  - **工具注册表（Tool Registry）**：记录工具的描述、调用契约和质量标签（5个状态：unvalidated, effective, ineffective, stale, deprecated）。当底层 artifact（如模型权重）改变时，质量标签自动变为 stale，强制重新验证。
  - **质量评估**：使用 Wilson lower bound 对工具能力进行排序，防止小样本侥幸胜出。
  - **调用接口**：所有工具通过统一的 MCP stdio server 调用，每次调用都会追加记录到 append-only log 中。
- **训练/优化目标**: 本文不直接优化模型参数，而是优化“实验循环”的决策质量。核心机制是 Evidence-Gated Promotion（证据门控晋升）：使用 Agresti-Caffo 置信区间或 anytime-valid tests 计算指标提升的显著性，只有当新策略的指标提升超过统计阈值（如 $\Delta \ge 1.5w$）时才予以晋升，否则触发确认或切换策略，以此控制假阳性。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**: LIBERO-10。
  - **测试后端**: SmolVLA、$\pi_{0.5}$、MolmoAct2、GR00T N1.7、X-VLA。
  - **对比对象（Baseline）**: 人类脚本（如直接选最后一个 checkpoint、选观察到的最高分）、Random search、Vizier-style TPE、Thompson sampling。
- **评价指标**: False-promotion rate（错误晋升率/Type-I error）、Statistical Power（统计功效）、Crash recovery（崩溃恢复的丢失/重复率）、Holdout Regret（留出集遗憾）。
- **主要结果**: 
  - **门控有效性**：在可选停止（optional stopping）下，固定规则（Agresti-Caffo 1.5x）将错误晋升率控制在 0.002，anytime-valid tests (e-process/mixture-SPRT) 控制在 0.003-0.007，而 naive McNemar 偷看会膨胀到 0.161。
  - **崩溃恢复**：在 14,000 次进程 kill 注入测试中，实现 0 丢失、0 重复的副作用，恢复耗时 0.15-0.25 ms。
  - **决策质量**：在单调递增的 checkpoint lineage 测试中，人类直接选最后一个 checkpoint（Oracle）表现最好（留出集成功率 60.00%），本系统（e-process）为 53.94%。系统并未选出绝对最优，但将错误晋升率降至 0.001（对比基线的 0.005-0.021），验证了其核心价值在于“控制错误晋升”而非“超越人类选择上限”。

- **一句话总结**: 提出 GraphThink 框架，通过任务图（Task Graph）约束 LLM 的高层规划与 RL 奖励，并结合场景图（Scene Graph）实现事件驱动的动态重规划，显著解决了具身智能体在长视野任务中的规划幻觉和泛化问题。

**1. 整体逻辑**
- **研究任务**: 具身智能（Embodied AI）领域的任务规划（Task Planning）方法创新。具体任务是：具身智能体在 3D 仿真环境（如 ALFRED）中，根据自然语言指令执行长视野（long-horizon）日常任务的高层规划。
- **研究动机**: 现有基于 LLM 的具身规划存在三个痛点：1) 缺乏物理常识导致规划幻觉；2) 监督微调（SFT）在长视野和未见任务上泛化能力差；3) 现有的重规划策略缺乏全局环境感知，容易陷入局部错误和无效重试。
- **本质改动**: 将“任务图”和“场景图”双图结构引入 LLM 规划闭环。任务图提供物理和逻辑约束，用于引导 Prompt、设计 RL 奖励和推理验证；场景图作为轻量级环境记忆，用于事件驱动的动态重规划。
- **技术溯源**: 基于大语言模型（Qwen2.5-7B-Instruct）、强化学习（GRPO 算法）、具身仿真环境（ALFRED / AI2-THOR / VirtualHome）。

**2. 技术拆解**
- **核心方法**: 
  1) **基于任务图的高层规划**：构建包含子任务节点和状态转移边的任务图。通过任务图引导 Prompt，设计基于图结构的 GRPO 奖励，并在推理时作为外部验证器纠正幻觉。
  2) **带记忆的底层策略**：底层执行器主动缓存沿途相关物体的位置和掩码，避免重复探索，提高导航和交互效率。
  3) **基于场景图的动态重规划**：构建仅保留任务相关物体的动态场景图。由“底层执行错误”和“高层子任务完成”两个事件触发重规划，结合场景图和任务图修正计划。
- **关键细节**: 
  - 任务图节点抽象为 4 种元类（obj, rec, mov, spec），边通过 LLM 分析子任务的前置条件和后置效果自动生成，无需依赖演示轨迹。
  - 场景图通过 VLM 在线构建，仅保留任务相关物体的语义三元组，包含冲突检测与修正机制，控制图规模（通常少于 20 个节点）。
  - 基座模型采用 Qwen2.5-7B-Instruct。
- **训练/优化目标**: 使用 GRPO 进行强化学习。总奖励 $R_{total} = R_{fmt} + R_{node} + R_{edge} + R_{inst}$。其中 $R_{node}$ 和 $R_{edge}$ 鼓励生成符合任务图节点和边约束的路径；$R_{inst}$ 采用两阶段设计（覆盖关键子任务得 0.5，完全匹配 GT 得 1.0）以保证指令对齐；$R_{fmt}$ 约束 XML/JSON 输出格式。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：主测 ALFRED，泛化测试 AI2-THOR（新任务）和 VirtualHome（跨环境），并自建了一个包含 1396 个样本的长视野数据集。
  - **对比对象**：ALFRED 榜单上的 SOTA 方法（HLSM, CAPEAM, DISCO, RoboGPT 等），以及 GPT-5.2、Gemini-2.5-Pro 等闭源 API 模型（结合 RAG/CoT/Few-shot）。
- **评价指标**: 成功率（SR）、目标条件完成率（GC）。高层规划还评估了图通过率（GPR）、缺失步率（MSR）、额外步率（ASR）等细粒度推理保真度指标。
- **主要结果**: 
  - 在 ALFRED 测试集上，GraphThink 在 Seen 和 Unseen 设置下均取得 SOTA（SR 分别达 67.71% 和 68.52%），比之前的 SOTA 提升约 6.17 个百分点。
  - 高层规划器在验证集和长视野任务上超越了 GPT-5.2 等闭源大模型，长视野任务 SR 达 90.04%（同等基座的 SFT 仅 20.57%）。
  - 在 AI2-THOR 的新任务（零样本）和 VirtualHome 的跨环境测试中均表现出强泛化能力。长视野任务推理时间（约 7-23s）显著低于 GPT-5.2+RAG（约 32-46s）。

**0. 论文标题**

**1. 整体逻辑**
- **研究任务**: 人形机器人长视野多物体重排（Long-horizon multi-object rearrangement），要求机器人在连续回合中自主导航并操作多个物体。
- **研究动机**: 现有方法多用脚本、有限状态机或无模型策略来拼接预训练技能，无法处理复杂的任务序列；若直接用世界模型预测关节级物理动态，高维接触动力学带来的误差会随自回归步数急剧放大。
- **本质改动**: 将世界模型的预测粒度从“关节级物理轨迹”抽象到“技能级宏观状态转移”，结合结构化的潜在技能接口，让高层策略在想象的宏观动态中进行长视野规划，避免了底层物理误差的累积。

**2. 技术拆解**
- **核心方法**: LUCID 分层框架。第一阶段用对抗模仿学习训练带结构化潜在接口的底层控制器（LLC）并冻结；第二阶段联合训练宏观动态世界模型（WM）和目标条件的高层控制器（HLC），HLC 通过 WM 想象的宏观 rollout 进行优化。
- **关键细节**: 
  - **结构化潜在空间**: 为 N 个语义技能各保留一个 one-hot 锚点，剩余维度用于技能内的连续变化。
  - **宏观时间抽象**: 仿真 60Hz，LLC 30Hz，HLC 每 20 个 LLC 步输出一次宏观动作（包含潜在技能指令和引导偏移）。
  - **世界模型预测**: 预测连续任务变量的残差、二值任务进度标志（用 Sigmoid），以及回合继续概率（用于折扣想象回报）。
  - **训练规模**: HLC 想象视野 12 步，序列长度 32，batch size 64，使用 8192 个并行环境。
- **训练/优化目标**: 
  - **LLC**: 对抗模仿奖励 + 目标条件任务奖励（配合三阶段课程学习）。
  - **WM**: 连续状态的 MSE + 二值标志的 BCE + 继续概率的 BCE。
  - **HLC**: Actor 使用基于 score-function estimator 的策略梯度损失（带回报归一化和熵正则），Critic 使用 distributional value loss。初期引入基于 oracle 的行为克隆损失并逐渐衰减以稳定训练。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 基于 HITR 构建的多物体重排任务（含仓库、厨房、卧室、客厅布局），ID 训练集 62 个任务，OOD 测试集 20 个任务。LLC 动作捕捉参考数据来自 OMOMO 和 SAMP。
  - **Baseline**: InterMimic（动作跟踪）、TokenHSI（有限状态机切换）、HumanVLA（端到端单物体策略扩展）。
- **评价指标**: SR_k（前 k 个物体的成功率）、APE（平均放置误差）、Time（平均完成时间）。
- **主要结果**: 
  - **主实验**: 在 ID 和 OOD 测试中，LUCID 的 SR2 分别达到 73.4% 和 68.4%，比最强 baseline (HumanVLA) 分别高出 33.6 和 31.4 个百分点；APE 指标均为最低。
  - **长视野泛化**: 在扩展到 5 个物体的任务链中，baseline 的 SR5 降至 0%~5%，LUCID 仍保持 21% 的成功率。
  - **消融实验**: 使用世界模型想象（WM）比无模型（MF）在 OOD SR2 上提升显著（63.1% vs 42.8%）；结构化潜在接口比非结构化接口在 ID SR2 上提升巨大（74.2% vs 0.0%），证明任务对齐的时间抽象是核心。
