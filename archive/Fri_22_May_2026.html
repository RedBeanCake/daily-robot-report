            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [GesVLA: Gesture-Aware Vision-Language-Action Model with Embedded Representations] (基于嵌入表示的手势感知视觉-语言-动作模型（GesVLA）)
- **研究机构**: `清华大学 & Dexmal`
- **Arxiv ID**: `2605.22812` | [点击跳转](https://arxiv.org/abs/2605.22812)

**0. 论文标题**
- **英文标题**: GesVLA: Gesture-Aware Vision-Language-Action Model with Embedded Representations
- **中文标题**: 基于嵌入表示的手势感知视觉-语言-动作模型（GesVLA）
- **研究机构**: 清华大学 & Dexmal

**1. 整体逻辑**
- **研究任务**: 让机器人在执行抓取、放置等操作时，联合理解视觉画面、语言指令和人类指点手势。
- **研究动机**: 现有VLA模型纯靠文字指令，在物品密集或同类物体多的场景下指代模糊（空间歧义）。传统做法要么把手势转成文字导致精度丢失，要么作为后处理外挂模块，未参与核心推理。同时，缺乏大规模带精确指点坐标标注的训数据。
- **本质改动**: 把手势提升为与视觉、语言并列的一等输入模态，拒绝离散化文本转换，直接将手势关键帧特征嵌入连续潜空间。通过双VLM架构实现手势表征与动作策略的直接交互，并配套搭建半合成数据生成管线解决数据瓶颈。
- **技术溯源**: 视觉语言主干基于 PaliGemma-2B；动作策略主干初始化自 π0；手部关键点检测依赖 MediaPipe；开放词汇目标检测依赖 GroundingDINO。

**2. 技术拆解**
- **重点改进**: 
  1. **手势潜空间嵌入**：提取手腕和食指关节坐标，经MLP投影到模型共享嵌入空间，保留连续空间信息供下游直接调用。
  2. **双VLM解耦架构**：拆分为意图推理模块（VLM_int）和在线感知模块（VLM_per）。VLM_int只读一次手势+语言，输出文本描述和离散化坐标Token，并缓存KV状态；VLM_per通过Cross-Attention直接读取缓存，输出给动作专家。非对称注意力设计让VLM_int计算只需发生一次，大幅降低在线算力。
  3. **动态关键帧抽取**：根据手部运动学特征（指点时的自然停顿）自动截取关键帧，过滤冗余时序，降算力保精度。
  4. **半合成数据引擎**：用真实RGB-D场景+3D几何反投影生成精准指点3D锚点，渲染符合人体运动学（含抛物线抬手）的手势视频，自动生成配对指令，实现零人工标注成本的规模化数据生产。
- **架构细节**: 
  - 输入：多视角RGB图像、语言指令、手势视频（抽关键帧+关键点向量）。
  - 输出：连续动作序列（位置、旋转、夹爪开合）。
  - 规模与配置：VLM_int/per 均为 2B 参数；动作专家从头训练；训练用 44 卡 H20，推理单卡 RTX 4090。推理计算流比例为 1:T:T×N（意图推理1次，感知执行T步，动作去噪T×N步）。
- **核心 Loss**: 
  - 阶段一（推理预训练）：标准自回归交叉熵（L_int），联合监督文本描述和离散化空间坐标Token生成。
  - 阶段二（策略微调）：Flow Matching 损失（L_action），预测连续动作流场的速度向量，无额外辅助重建任务。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据：16k条半合成指点数据（用于推理预训练）+ 真实机械臂演示数据（用于策略训练）。
  - 评测场景：3个真实机械臂任务（方块堆叠抓取、果冻杯选择、果蔬选择），均设简单/困难（多物体/多步骤）子集；另设88个真实场景的纯意图推理测试集。
  - Baseline：纯文本VLA（π0）、MLLM+VLA级联、几何射线法+VLA。
- **评价指标**: 任务执行成功率（Success Rate）；意图推理准确率（Acc）与进度得分（Progress Score，正确预测目标的比例）。
- **实验结果**: 引入手势后，综合平均成功率达 83.3%，显著优于纯文本VLA（31.7%）和几何基线（41.7%）。在困难/杂乱场景下提升最明显（例如果蔬选择困难模式从1/10跃升至8/10）。意图推理测试中准确率达 94.3%。证明将手势直接嵌入潜空间并解耦推理与执行，有效解决了空间歧义问题，且非对称设计保证了实际部署的推理效率。

### 2. 🔥 [Spatial Memory for Out-of-Vision Manipulation in Vision-Language-Action] (面向VLA模型视域外操作的空间记忆框架)
- **研究机构**: `未明确标注（作者团队）`
- **Arxiv ID**: `2605.22283` | [点击跳转](https://arxiv.org/abs/2605.22283)

**0. 论文标题**
- **英文标题**: Spatial Memory for Out-of-Vision Manipulation in Vision-Language-Action
- **中文标题**: 面向VLA模型视域外操作的空间记忆框架
- **研究机构**: 未明确标注（作者团队）

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在目标物体初始不可见或移出相机视场（Out-of-Vision, OOV）条件下的机器人抓取与操作。
- **研究动机**: 现有VLA默认“目标始终可见”，依赖瞬时视觉输入做反应式决策。目标一旦离开视野，模型缺乏持久空间表征，只能盲目搜索或推理失败。纯靠模型内部先验无法弥补物理感知证据的缺失。
- **本质改动**: 用“主动扫描+持久空间记忆”替代“纯反应式视觉感知”。通过可动云台相机采集多视角数据构建全局空间-语义地图，并在操作过程中动态更新与按需检索，使模型具备视域外推理能力。
- **技术溯源**: 基于通用VLA架构（DiT动作解码器+多模态大模型）；感知模块调用开源模型：YOLO（目标检测）、DINOv3（外观特征）、VGGT（相机位姿与3D几何估计）。

**2. 技术拆解**
- **重点改进**: 提出三段式记忆流水线：1）空间记忆构建（扫描聚合）；2）动态记忆更新（时序融合）；3）上下文记忆检索（指令对齐）。核心是将瞬时帧输入替换为“持久记忆+当前感知”的联合条件。
- **架构细节**: 
  - **输入输出**: 输入为云台相机扫描序列/当前帧、自然语言指令、机器人状态及噪声动作序列；输出为未来H步动作块。
  - **构建阶段**: 云台按策略扫描，逐帧经YOLO+DINOv3提取实例特征，VGGT升维至全局3D坐标。通过外观余弦相似度+3D位置一致性进行跨视角实例关联与特征平均，生成初始场景记忆 $\mathcal{M}_0$（对象级三元组：外观向量+3D位置编码+类别）。
  - **更新阶段**: 操作时每步接收新观测，通过相似度计算与门控机制得出更新系数 $\alpha$，对匹配的记忆条目做指数移动平均（EMA）更新，保持全局一致性并兼容场景变化/遮挡。
  - **检索阶段**: 将VLM的图文Token作为Query，更新后的记忆 $\hat{\mathcal{M}}_t$ 作为Key/Value，经Cross-Attention检索与指令相关的空间线索。增强后的特征直接注入DiT块调制Token交互，最终由动作解码器输出动作。
- **核心 Loss**: 沿用标准VLA动作预测Loss（如扩散模型去噪Loss或动作块回归Loss），未引入针对记忆模块的额外辅助Loss（如重建或对比Loss），端到端联合优化动作输出。

**3. 实验结果**
- **数据集和baseline**: 
  - 数据集：自研5个现实世界OOV任务（单臂/双臂/多步/视外目标）；仿真基准 RoboCasa GR1 与 SimplerEnv。
  - Baseline: StarVLA, SpatialVLA, GR00T N1.5（均配云台），以及消融变体（无扫描SOMA/仅扫描SOMA/Scan+GR00T）。
- **评价指标**: 任务成功率（SR）；行为效率指标：首次注视时间、头部搜索路径角度、视角修正次数、抓取尝试次数、到达抓取时间。
- **实验结果**: 
  - 现实OOV任务中，SOMA综合成功率（28.3%）显著优于Scan+GR00T（18.5%）及无记忆版本。
  - 行为指标对比GR00T-N1.5全面优化：首次注视时间缩短40~59%，头部搜索路径减少40~57%，视角修正次数减少43~57%，抓取尝试减少41~57%，抓取耗时缩短41~60%。
  - 结论：SOMA使模型从“盲目反应式搜索”转变为“记忆引导式精准操作”，实现更快定位、更少无效环视和近一次性抓取。在完全可观测的仿真基准上也验证了记忆机制的兼容性与泛化能力。

### 3. 🔥 [EvoScene-VLA: Evolving Scene Beliefs Inside the Action Decoder for Chunked Robot Control] (EvoScene-VLA：在动作解码器内演化场景信念的分段机器人控制策略)
- **研究机构**: `澳大利亚国立大学、昆士兰大学、北京师范大学`
- **Arxiv ID**: `2605.21862` | [点击跳转](https://arxiv.org/abs/2605.21862)

**0. 论文标题**
- **英文标题**: EvoScene-VLA: Evolving Scene Beliefs Inside the Action Decoder for Chunked Robot Control
- **中文标题**: EvoScene-VLA：在动作解码器内演化场景信念的分段机器人控制策略
- **研究机构**: 澳大利亚国立大学、昆士兰大学、北京师范大学

**1. 整体逻辑**
- **研究任务**: 分段（Chunked）视觉-语言-动作（VLA）策略的机器人长程控制。
- **研究动机**: 现有分段VLA策略在生成一个动作块（chunk）时，完全依赖执行开始时的单帧观测。但在chunk执行期间，机器人动作本身会改变场景几何（如遮挡、物体位移）。由于下一帧观测还没到来，后续动作基于“过时”的场景信息决策，导致中途失败。空间VLA只优化单帧几何，时序VLA只记历史观测，均缺失“被动作更新过的场景先验”。
- **本质改动**: 放弃推理时外挂独立场景预测器或世界模型，改为在现有动作解码器内部直接做“动作-场景联合去噪”。解码器在输出动作chunk的同时，输出对应的场景更新块；执行完该chunk后，直接将最后的场景令牌作为下一控制调用的先验。闭环自更新，训练辅助模块推理时全部丢弃。
- **技术溯源**: 基于 LingBot-VLA 架构和 π0.5 的流匹配（Flow Matching）解码器；训练期依赖冻结的单目深度教师（MDT）和多视角3D基础模型（3DFM）提供几何监督。

**2. 技术拆解**
- **重点改进**: 将场景状态维护机制内嵌至动作解码器流程。用流匹配框架下的联合去噪（Co-denoising）替代独立的未来帧预测，实现“动作输出”与“场景状态更新”在同一采样步内同步完成，彻底消除推理时的额外计算开销。
- **架构细节**:
  - **递归场景前缀**: VLM输入前缀新增两组令牌：`观测槽`（OBS Slots，吸收当前多视角图像特征）和`先验槽`（Prior Slots，继承上一chunk末端的场景状态）。采用非对称注意力掩码：图像/语言token不关注场景槽；观测槽只读对应视角图像；先验槽只读观测槽和自身。确保VLM预训练主干不受干扰，场景信息单向流动。
  - **联合解码**: 动作解码器接收VLM前缀特征，在流匹配噪声注入/去噪过程中，同时维护动作序列和场景序列。采样结束后，机器人执行动作chunk，并将关键帧处的场景令牌直接反馈为下一调用的 `Prior Slots`。
  - **配置**: 沿用50步动作分段；场景令牌维度与VLM隐藏层对齐，数量固定。
- **核心 Loss**: 训练期端到端优化，推理期仅保留联合流匹配。
  - $\mathcal{L}_{\text{actFM}}$: 标准动作流匹配损失（π0.5形式）。
  - $\mathcal{L}_{\text{sceneFM}}$: 场景流匹配损失，将未来场景目标蒸馏进动作解码器的场景分支。
  - $\mathcal{L}_{\text{geo}}$ (局部几何锚定): 跨视角掩码深度重建损失。轮流掩掉单视角图像，强制场景令牌通过跨视角聚合恢复深度，防止退化。
  - $\mathcal{L}_{\text{rep}}$ (全局几何锚定): 场景令牌特征与冻结3DFM提取的度量级3D特征做L1对齐。
  - $\mathcal{L}_{\text{pred}}$ (场景预测监督): 训练独立的Scene Predictor生成未来帧场景目标，供联合去噪蒸馏。推理时该模块丢弃。

**3. 实验结果**
- **数据集和baseline**: RoboTwin仿真基准（31个任务，含固定初始位Clean和随机初始位Rand两种协议）；真实双臂机器人平台 Galaxea R1-Lite。对比基线：π0.5、LingBot-VLA、LingBot-VLA*（带深度监督的LingBot-VLA）。
- **评价指标**: 任务成功率（Success Rate）；末端执行器3D轨迹平滑度与中段决策连续性（定性）。
- **实验结果**: 
  - 仿真Clean设置：平均成功率从 LingBot-VLA* 的 87.2% 提升至 89.1%（+1.9%）。
  - 仿真Rand设置（初始位姿/布局扰动大）：成功率从 86.1% 提升至 88.5%（+2.4%）。随机设置下增益更大，说明动作更新的场景先验有效缓解了感知噪声和布局变化带来的误差累积。
  - 真实机器人：全面超越所有基线，动作轨迹更平滑，彻底消除了基线因场景漂移导致的“动作块中段卡死/偏离”现象。消融实验确认未来场景监督、双层几何锚定和递归前缀均为有效且可叠加的贡献。

### 4. 🔥 [Physically Grounded Data Generation for Robust Bimanual Policy Learning from a Single Demonstration] (基于物理约束的数据生成：从单次演示中实现稳健的双臂策略学习)
- **研究机构**: `Carnegie Mellon University, Dexmate`
- **Arxiv ID**: `2605.21710` | [点击跳转](https://arxiv.org/abs/2605.21710)

**0. 论文标题**
- **英文标题**: Physically Grounded Data Generation for Robust Bimanual Policy Learning from a Single Demonstration
- **中文标题**: 基于物理约束的数据生成：从单次演示中实现稳健的双臂策略学习
- **研究机构**: Carnegie Mellon University, Dexmate

**1. 整体逻辑**
- **研究任务**: 双臂接触式操作任务的行为克隆（BC）数据扩充。目标是用单次专家演示，自动生成一套紧凑、物理可行且覆盖多种恢复路径的数据集，用于训练鲁棒策略。
- **研究动机**: 纯几何/空间随机化（如MimicGen）在接触密集任务中容易生成几何合理但物理上不可行或无法恢复的轨迹；现有数据筛选方法依赖策略在线rollout评估或额外标注，计算开销大且难以泛化。单一演示导致策略在测试时遇到状态偏移时缺乏恢复监督。
- **本质改动**: 将“数据扩增”从“盲目生成+后处理”改为“生成-筛选”闭环迭代。放弃对策略在线评估的依赖，用零样本机制直接评估轨迹的物理可恢复性与多样性，专注挖掘处于“偏离演示但可恢复”的中间地带（Goldilocks Zone）的数据。
- **技术溯源**: 基于标准行为克隆（BC）训练管线；数据生成逻辑参考了MimicGen的空间随机化作为基线，核心采样与优化依赖物理仿真环境与经典控制方法（如CEM），未绑定特定大模型基座。

**2. 技术拆解**
- **重点改进**: 提出PGDG框架，核心是“物理采样器”与“零样本策展人”交替工作。采样器负责在仿真中跑通物理轨迹，策展人负责打分、去重并反向指导采样分布，最后用CEM对少量危险状态做局部动作重标注。彻底解耦了数据生成与策略训练，筛选过程不依赖任何策略前向传播。
- **架构细节**: 
  - 输入：单次专家演示轨迹。
  - 采样器：将动作序列压缩为M个控制点，用固定解码器还原。从对角高斯分布$q^{(k)}$中采样控制点，在仿真中执行全episode rollout，仅保留成功轨迹。
  - 策展人：①奖励打分：计算轨迹状态到专家流形的最大距离，划定动态的“内/外半径”，距离适中（不贴专家线、不越界）的轨迹得分高。②多样性筛选：用DCT提取轨迹状态-动作序列的时域低频特征，代入DPP（行列式点过程）算法挑选差异最大的子集。③分布更新：用筛选出的控制点重新拟合高斯分布的均值与方差，引导下一轮采样集中在高价值区域。
  - 局部重标注：对筛选后轨迹中偶尔越界的“风险状态”，用短时CEM优化动作，并以整episode是否成功作为硬约束进行替换。
- **核心 Loss**: 本文非端到端网络训练，核心优化目标为策展人数据选择函数：$\max \sum R(\tau) + \lambda \text{Div}(S)$。$R(\tau)$为基于偏离距离的区间奖励，$\text{Div}(S)$为DPP多样性项。下游策略训练直接使用标准行为克隆Loss（如动作预测的交叉熵或MSE），数据由PGDG离线生成。

**3. 实验结果**
- **数据集和baseline**: 输入均为单次演示。对比基线包括纯空间随机化增强（MimicGen/DexMimicGen范式）及传统物理轨迹生成方法。测试覆盖4个双臂接触式操作任务。
- **评价指标**: 任务执行成功率（Success Rate），在物理仿真环境与零样本实机部署中分别评估。
- **实验结果**: 在所有测试任务上，PGDG生成的数据训练出的策略成功率均稳定超越空间增强基线。以RotateBox-Pitch为例，仿真成功率从38%提升至93%，零样本实机迁移从35%提升至82%。此外，用该数据微调机器人基础模型（GR00T）也能将成功率从46%拉升至77%。证明了该方法在生成“可恢复、不冗余、物理合规”数据上的有效性。

### 5. 🔥 [Understanding Multimodal Failure in Action-Chunking Behavioral Cloning] (动作分块行为克隆中的多模态失效机制解析)
- **研究机构**: `德国德累斯顿（NCT/UCC Dresden, TU Dresden）与慕尼黑 LMU 联合团队`
- **Arxiv ID**: `2605.22493` | [点击跳转](https://arxiv.org/abs/2605.22493)

**0. 论文标题**
- **英文标题**: Understanding Multimodal Failure in Action-Chunking Behavioral Cloning
- **中文标题**: 动作分块行为克隆中的多模态失效机制解析
- **研究机构**: 德国德累斯顿（NCT/UCC Dresden, TU Dresden）与慕尼黑 LMU 联合团队

**1. 整体逻辑**
- **研究任务**: 诊断并量化动作分块（Action-Chunking）行为克隆策略在面对“同一观测对应多个合理动作”时，为什么会在部署阶段丢失多模态能力（模态 collapse）。
- **研究动机**: 当前主流多模态 BC 方法（如潜变量法、动作扩散/流模型）在训练集上能拟合多样动作，但推理时往往退化为单模态或平均输出。现有工作缺乏明确的理论边界来解释失效原因，导致调参（如正则化强度、网络平滑度）只能靠经验试错。
- **本质改动**: 不发明新架构，而是给出严格的数学诊断框架。推导出两类主流路线的模态保留边界：潜变量策略受后验-先验正则化强度 β 直接制约；动作空间生成策略受基础噪声到动作的映射平滑度（Lipschitz常数）制约。给出了可计算的失效阈值与改进路径。
- **技术溯源**: 基于现有开源范式：ACT/条件变分自编码器（CVAE）、动作空间扩散模型与流匹配（Flow Matching）、确定性行为克隆（BC）。

**2. 技术拆解**
- **重点改进**: 
  1. **潜变量路线**：证明保留多模态必须让潜变量携带动作相关的条件互信息 `I(A;Z|S)`。点态 KL 正则化强度 β 过大会强制压缩该信息，理论证明 `I(A;Z|S) ≤ C/β`，β 过大必然导致模态覆盖下降。建议降低 β 或改用聚合匹配（Aggregate Matching）替代点态 KL。
  2. **动作空间生成路线**：证明采样映射 `G_θ(s, u)` 的 Lipschitz 常数 `L` 与能稳定表示的模态数成反比。映射越平滑，能分配显著概率的分离模态越少。要覆盖多模态，必须容忍映射中的尖锐跳变，或允许动作空间出现离群桥接区域。
- **架构细节**: 输入为状态/观测（可含视觉/本体），输出为未来 H 步的动作块。分为两条分析线：(1) 潜变量架构：包含后验编码器 `q(z|a,s)`、条件先验 `p(z|s)` 和解码器 `π(a|z,s)`，部署时从先验采样 Z 再解码。(2) 动作空间架构：直接通过确定性采样器 `G_θ(s, u)` 将高斯噪声映射为动作块。无超大参数训练，侧重可控诊断实验。
- **核心 Loss**: 论文未修改标准训练目标，而是对其进行分析：
  - 潜变量分支：标准 CVAE 目标 `L = E[-log π(a|z,s)] + β * D_KL(q(z|a,s) || p(z|s))`。核心约束是 KL 项直接截断条件互信息。
  - 动作空间分支：标准扩散 score matching 或流匹配 loss。核心约束来自网络结构自带的 Lipschitz 平滑性。
  - 辅助诊断项：引入 Fano 校正的条件模态熵下界、后验-先验质量缺口（valid-mass gap）、以及 Lipschitz 常数与模态分离度的比值作为失效指标。

**3. 实验结果**
- **数据集和baseline**: 使用带地面真值模态标签的合成多模态任务，以及机器人操作仿真基准（如 MuJoCo 多分支控制）。对比了 Deterministic BC、KL-CVAE、Aggregate-Matched Latent Policy、VQ-VAE、动作空间 Flow/Diffusion Policy 等。
- **评价指标**: 不依赖单一的 rollout 成功率，核心评估：(1) 模态覆盖率（推理时能访问到几个有效动作分支）；(2) 条件互信息保持量；(3) 采样映射 Lipschitz 常数与理论阈值的对齐度；(4) 失败案例与诊断指标的一致性。
- **实验结果**: 理论预测与仿真完全吻合。强 KL 正则化导致潜变量策略推理时严重退化为单模态，按理论下调 β 或改用聚合匹配可恢复模态覆盖；动作空间模型中，强制平滑约束会直接切断多模态能力，放宽约束或调整桥接策略后模态覆盖率显著提升。在仿真任务中，按理论机制调整后的策略在多分支选择上更可靠，推理吞吐量未受损失，且失败案例可被提出的诊断指标精准定位，避免了盲目调参。

### 6. 🔥 [Pre-VLA: Preemptive Runtime Verification for Reliable Vision-Language-Action and World-Model Rollouts] (Pre-VLA：面向可靠VLA与世界模型轨迹推演的抢占式运行时验证框架)
- **研究机构**: `文本未提供完整机构列表（根据作者署名编号推断为国内高校/科研院所联合团队）`
- **Arxiv ID**: `2605.22446` | [点击跳转](https://arxiv.org/abs/2605.22446)

**0. 论文标题**
- **英文标题**: Pre-VLA: Preemptive Runtime Verification for Reliable Vision-Language-Action and World-Model Rollouts
- **中文标题**: Pre-VLA：面向可靠VLA与世界模型轨迹推演的抢占式运行时验证框架
- **研究机构**: 文本未提供完整机构列表（根据作者署名编号推断为国内高校/科研院所联合团队）

**1. 整体逻辑**
- **研究任务**: 在VLA生成的候选动作块下发到物理执行器，或输入世界模型进行未来帧推演之前，实时评估该动作的安全性与有效性，并拦截高风险动作。
- **研究动机**: VLA与世界模型在实际部署时存在分布偏移与生成不确定性。直接执行低质量动作会导致物理碰撞、不可逆运动学违规；输入世界模型则会导致未来预测模糊、目标漂移、物理关系失真等“幻觉”，同时浪费大量GPU渲染算力。现有验证模块要么推理延迟高，要么只评估环境状态而非候选动作本身。
- **本质改动**: 在原VLA/WM推理流水线前插入一个轻量级“预验证+重采样”网关。不改动主干策略，而是将PPO强化学习的优势值信号与碰撞掩码加工成安全标签，训练一个轻量判别器实时过滤坏动作，并在预算内触发重采样。
- **技术溯源**: 特征提取基于冻结的WorldVLA多模态编码器（底层为Chameleon VLM架构）；监督信号来源于PPO训练过程中的Critic价值网络输出与环境碰撞奖励。

**2. 技术拆解**
- **重点改进**: 
  1. 将PPO的连续优势值与碰撞掩码结合，引入“失败回溯惩罚(Failure-Aware Refinement)”，把长程奖励信号转化为适用于运行时验证的二分类安全标签和连续优势回归目标。
  2. 设计双模态抢占式重采样调度器：物理执行支路拦截危险动作防碰撞；WM推演支路拦截无效动作防幻觉和算力浪费。
- **架构细节**: 
  - 输入：文本指令、视觉观测、机器人本体状态、候选动作块（统一编码为离散token序列）。
  - 骨干：冻结的WorldVLA编码器，直接提取最后一层隐藏状态作为特征基底。
  - 特征层：模态感知池化(Modality-Aware Pooling)，用预定义mask分别对文/图/状态/动作的token独立做均值池化后拼接，显式解耦多模态纠缠特征。
  - 头部：极简双分支FFN。分支1输出安全置信度(分类)；分支2回归标准化后的长程优势值(回归)。
  - 规模/延迟：参数量极小，单action chunk正向推理耗时约183.9ms，满足实时控制节奏。
- **核心 Loss**: 多任务联合优化 = Focal Loss（压制简单安全样本，聚焦罕见的灾难性失败样本，解决正负样本极度不平衡） + MSE回归Loss（约束隐藏特征与Critic优势值对齐，提供物理动力学先验） + Soft-threshold Loss（用温度参数对硬阈值标签做平滑，解决安全边界附近的决策震荡与置信度校准问题）。总Loss为三者加权。

**3. 实验结果**
- **数据集和baseline**: 数据集为LIBERO机器人操作基准（4个任务套件）。对比基线为RynnVLA-002及未加拦截器的原始VLA策略。
- **评价指标**: 动作判别指标（F1、Accuracy、无效动作误通过率False Pass Rate）；闭环执行成功率；任务完成步数；单次验证延迟(ms)；世界模型推演的视觉质量与错误累积程度。
- **实验结果**: 
  - 判别能力：独立测试集上F1达0.8303，准确率95.42%，无效动作误通过率仅0.0200，证明拦截器能准确区分好/坏动作。
  - 闭环执行：LIBERO四个套件平均成功率从30.79%提升至37.62%（绝对提升6.83%），且任务执行步数减少，说明过滤无效试探后策略能更快进入有效轨迹。
  - 运行效率：单次验证183.9ms，在严格计算预算内完成拦截与重采样调度。
  - WM推演：定性结果表明，接入Pre-VLA后显著缓解了世界模型因坏动作导致的未来帧模糊、目标漂移和视觉伪影，有效抑制了模拟推演的错误累积。

### 7. 🔥 [Beyond Euclidean Proximity: Repairing Latent World Models with Horizon-Matched Trajectory Reachability Metrics] (超越欧氏距离：用时序跨度匹配的轨迹可达性指标修复隐空间世界模型)
- **研究机构**: `Tongji University (同济大学)`
- **Arxiv ID**: `2605.22164` | [点击跳转](https://arxiv.org/abs/2605.22164)

**0. 论文标题**
- **英文标题**: Beyond Euclidean Proximity: Repairing Latent World Models with Horizon-Matched Trajectory Reachability Metrics
- **中文标题**: 超越欧氏距离：用时序跨度匹配的轨迹可达性指标修复隐空间世界模型
- **研究机构**: Tongji University (同济大学)

**1. 整体逻辑**
- **研究任务**: 修复基于隐空间世界模型（Latent World Models）的规划器终端代价计算接口，解决候选动作序列排序错误导致的长程规划失败问题。
- **研究动机**: 现有方法直接用隐状态欧氏距离（MSE）作为终端代价。作者发现这存在“隐空间邻近性陷阱”：模型确实编码了控制所需信息（如XY坐标线性可解码R²=0.998），但控制相关变量仅占隐空间的极小方差（<1%），被预测/重建相关的冗余维度主导。规划器用MSE打分会选出“直线穿墙”的假近邻动作，而非真正能穿过门口的可达序列。
- **本质改动**: 不动编码器、动力学模型、采样器和规划预算，仅在规划器终端打分层加一个后处理“插件”。训练一个轻量级成对距离头，用轨迹的时间跨度作为可达性代理标签，专门修正终端候选序列的排序逻辑。
- **技术溯源**: 不依赖特定大基座，而是即插即用模块。直接挂载在已训练好的隐空间世界模型基座（LeWorldModel/LeWM, PLDM）与CEM规划器之上。

**2. 技术拆解**
- **重点改进**: 提出轨迹可达性指标（TRM）。核心设计是“Horizon-Matched”（全时间跨度匹配）采样。短跨度采样学到的距离无法用于长序列终端打分，因此强制模型在完整episode的时间跨度上平衡采样，使训练分布直接对齐规划时的终端排序需求。
- **架构细节**: 输入为预测终端隐状态 $z$ 与目标隐状态 $z_g$ 的拼接与差值 $[z, z_g, z-z_g, |z-z_g|]$。接一个轻量MLP（两层256隐藏单元，SiLU激活，Softplus输出标量距离）。推理时作为CEM的代价函数 $c_{TRM}$，支持直接替换原始MSE，或在连续操控场景中做线性混合（hybrid）。
- **核心 Loss**: 主 Loss 为 Smooth-L1 Loss。监督标签为同一记录轨迹中两状态的时间差 $y_{ij} = |t_i - t_j|$。利用时间差天然表征状态间经过合法动力学过渡的“可达距离”，无需任务特定的真值状态、奖励或环境模型。

**3. 实验结果**
- **数据集和baseline**: 数据集为 TwoRoom 导航（硬 n=100 manifest，含大量跨墙/门口路线）与 PushT 连续操控。Baseline 为固定checkpoint的 LeWM 与 PLDM 模型，使用原始隐空间MSE终端代价+CEM规划。
- **评价指标**: 闭环任务成功率；SCSA（同候选集排序审计）Spearman相关系数（衡量模型打分排序与真实最优序列的一致性）；最优候选百分位排名（Best-rank percentile）。
- **实验结果**: TwoRoom硬场景中，LeWM原始MSE成功率仅7.0%，接入全跨度TRM后提升至97.0%；PLDM从32.7%提至84.0%。打乱时间标签的负控成功率保持0%，证明收益来自结构学习而非增加参数量。SCSA机制证明：TRM将候选序列排序与真实轨迹质量的Spearman相关从0.018拉升至0.729，并把真实最优候选的排名从31.7%大幅提升至前3.9%。PushT实验表明，在连续接触操控中，纯替换易引入分布偏移，需与原始MSE做hybrid混合使用。整体验证了“模型能编码状态，但规划接口代价函数排序错了”这一核心假设。

### 8. 🔥 [stable-worldmodel: A Platform for Reproducible World Modeling Research and Evaluation] (stable-worldmodel：一个用于可复现世界模型研究与评估的平台)
- **研究机构**: `Mila, Université de Montréal, New York University, Brown University（等）`
- **Arxiv ID**: `2605.21800` | [点击跳转](https://arxiv.org/abs/2605.21800)

**0. 论文标题**
- **英文标题**: stable-worldmodel: A Platform for Reproducible World Modeling Research and Evaluation
- **中文标题**: stable-worldmodel：一个用于可复现世界模型研究与评估的平台
- **研究机构**: Mila, Université de Montréal, New York University, Brown University（等）

**1. 整体逻辑**
- **研究任务**: 搭建一套标准化、开源、全链路的世界模型研究、训练与评估平台，统一数据流、规划求解器与环境交互协议。
- **研究动机**: 当前世界模型研究严重碎片化：各团队代码库孤立导致重复实现与隐藏Bug；多模态时序数据（视频+关节状态）加载存在严重I/O瓶颈；缺乏统一的零样本与分布外（OOD）评估基准，使得“分布内高成功率”掩盖了模型未真正理解底层动力学的问题。
- **本质改动**: 不提出新网络或新算法，而是做“基建”。通过统一数据读写接口、封装主流MPC规划器、提供可控扰动环境，将数据收集→模型训练→在线规划评估的完整pipeline标准化，强制暴露现有模型的脆弱性。
- **技术溯源**: 基于 PyTorch 与 Gymnasium API 构建；数据层采用 Lance 列式存储；整合了现有主流基线（DINO-WM, PLDM, LeWorldModel, TD-MPC2）与规划求解器（CEM, MPPI, GD 等）。

**2. 技术拆解**
- **重点改进**: 
  1. **数据层重构**：弃用传统HDF5/MP4，采用Lance格式。利用列式存储、零拷贝与云原生流式特性，彻底解决多模态时序数据“存得慢、读得卡”的问题，实现高吞吐随机访问。
  2. **规划器解耦与标准化**：将MPC求解器（采样类CEM/iCEM/MPPI，梯度类GD/PGD/GRASP）抽离为独立模块。世界模型只需实现 `get_cost` 接口即可无缝调用，避免各论文重复实现带来的精度偏差。
  3. **可控扰动评估（FoV）**：内置视觉、几何、物理参数等多维度扰动因子。支持在任意Gym环境下动态注入扰动，实现系统化的零样本/OOD测试协议。
- **架构细节**: 平台核心由三个抽象组件构成：`World`（环境包装器，处理向量化交互、数据采集和FoV注入）、`Policy`（策略接口，核心是 `MPCPolicy` 将世界模型+求解器打包成策略）、`Solver`（规划器实现，输入当前隐状态，通过有限视界优化输出动作序列）。平台不限制用户模型结构，仅规范数据流与评估协议，保持低侵入性。
- **核心 Loss**: 本文属平台/基准类论文，无自研Loss。框架内嵌的基线沿用其原始训练目标：如JEPA风格的隐状态预测损失（PLDM, LeWorldModel）、冻结DINOv2特征+ViT时序预测（DINO-WM）、离散奖励与价值预测（TD-MPC2）。平台仅负责标准化数据喂入与计算流程。

**3. 实验结果**
- **数据集和baseline**: 数据集：Push-T（核心案例）、OGB-Cube、DeepmindControl等。对比基线：GCBC, GCIQL, DINO-WM, PLDM, LeWorldModel, TD-MPC2。
- **评价指标**: 主要使用任务成功率（Success Rate）衡量控制/规划能力；使用轨迹级预测MSE分布评估动力学拟合质量；通过逐步叠加FoV扰动，测试模型在视觉/物理分布外场景下的零样本泛化上限。
- **实验结果**: 
  1. **分布内性能**：在Push-T上完全复现了各基线原论文水平（LeWM 94%, DINO-WM 92%, PLDM 78%, GCBC 75%）。同时排查出TD-MPC2在离线设置下成功率骤降（仅12%），定位原因为模型生成分布外动作导致预测器漂移，修正了此前文献中可能存在的评估偏差。
  2. **分布外鲁棒性**：随着FoV扰动从单一视觉变化扩展到几何尺寸、背景、物理参数（质量/摩擦等），所有基线的规划成功率断崖式下跌，预测误差显著上升。结论明确：当前世界模型仍高度依赖训练数据相关性，尚未掌握可迁移的底层动力学规律，对分布外变化极其脆弱。平台成功验证了FoV评估协议的有效性与必要性。
