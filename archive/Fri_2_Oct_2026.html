            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Counterfactual Video Generation Enables Scalable Humanoid Loco-Manipulation] (反事实视频生成实现可扩展的人形机器人运动操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.38172` | [点击跳转](https://arxiv.org/abs/2609.38172)

**0. 论文标题**
- **英文标题**: Counterfactual Video Generation Enables Scalable Humanoid Loco-Manipulation
- **中文标题**: 反事实视频生成实现可扩展的人形机器人运动操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出PRISM框架，通过V2V视频生成扩充少量真实交互视频为反事实数据集，并结合接触锚定重建与重定向技术，训练出能零样本泛化到多种未知物体的人形机器人全身运动操作策略。

**1. 整体逻辑**
- **研究任务**: 训练人形机器人的全身运动与物体操作（loco-manipulation）技能，使其能根据视觉和手柄指令，完成对多种未知物体的抓取、搬运和放置。
- **研究动机**: 视觉模仿学习需要大量高质量、无遮挡的人机交互视频，互联网数据筛选成本极高。直接让视频模型生成机器人演示存在物理不可执行的鸿沟；而单目视频重建的人机交互数据往往存在物理不合理（如穿模、接触点偏移），直接用于训练会导致策略失败。
- **本质改动**: 利用V2V模型将少量真实视频“反事实”地替换为不同类别和形态的物体（让人类动作自适应），并通过引入“接触锚点”约束单目重建与运动重定向过程，将含有噪声的视频重建数据转化为物理合理的机器人训练轨迹。
- **技术溯源**: SeedDance 2.0 (V2V生成), CRISP (单目重建), SAM 2 & SAM3D (分割与3D重建), OmniRetarget (运动重定向), PPO & DAgger (策略训练), Fast-FoundationStereo (深度估计), Unitree G1 (真机部署)。

**2. 技术拆解**
- **核心方法**: PRISM框架包含三个核心阶段：1) 反事实视频生成：用V2V模型替换种子视频中的物体，生成人类动作自适应的交互视频；2) 接触锚定的Real-to-Sim：在统一世界坐标系下重建人、场景和物体，利用接触信号互相约束优化人体姿态和物体6D位姿，并通过接触锚点指导运动重定向，修正重建误差；3) 统一策略学习：在仿真中训练接触感知的特权教师策略，再蒸馏为仅依赖本体感觉、手柄指令和机载深度的学生策略。
- **关键细节**: 
  - 数据规模：4个真实种子视频，通过SeedDance 2.0生成4个类别（箱子、桶、圆筒、球）共256个反事实视频，筛选后得到137条有效轨迹。
  - 重建与重定向：使用CRISP恢复相机和人体，SAM2/SAM3D恢复物体。接触阶段将物体锚定在SMPL-X手掌上。重定向时，将手掌中心连线与物体网格的交点作为接触锚点，加入IK优化目标。
  - 策略网络：3层MLP。教师策略输入特权状态（参考动作、物体位姿等），学生策略输入本体感觉、手柄指令和深度图（经CNN编码为32维）。
  - 训练规模：8张L40S GPU，每卡4096个并行环境。教师训练40K迭代，学生28K迭代。
- **训练/优化目标**: 
  - 重建阶段：最小化重定向误差，包含基础网格匹配项和接触锚点约束项。
  - 教师策略（RL）：基于PPO，奖励包括位姿跟踪、动作平滑、碰撞惩罚，核心是接触感知交互奖励（鼓励末端执行器到达目标接触点并产生足够接触力）。
  - 学生策略（蒸馏）：DAgger模仿损失与PPO强化学习损失的加权组合，训练后期PPO权重占主导（0.9）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：对比基线为OMOMO数据集（90个训练序列，36个测试序列）。PRISM使用生成的视频重建的轨迹训练。仿真评估在MuJoCo中进行，真机部署在29自由度的Unitree G1人形机器人上。
  - 测试对象：域内物体（箱子、桶、圆筒、球的未知实例）和域外物体（纸巾、头盔、背包、灯、椅子等）。
- **评价指标**: 
  - 仿真指标：完成“抓取-搬运-放置”全流程并将物体放到目标位置的成功率。
  - 真机指标：成功到达、抓取并稳定搬运至少3米不掉落或不摔倒的成功率。
- **主要结果**: 
  - 仿真中，PRISM训练的策略在域内（96.25%）和域外（72.92%）的成功率远超OMOMO训练的策略（23.75%和12.50%），证明反事实数据提供了更好的泛化性。
  - 消融实验表明，接触锚定位姿、接触感知重定向和接触奖励逐步将仿真成功率从22.5%提升至96.25%（域内）和12.5%至72.92%（域外）。
  - 真机部署中，策略零样本泛化到20多种不同尺寸、形态和类别的物体。域内物体成功率达93%-100%，域外物体成功率达60%-100%。
  - 数据效率：V2V生成在数据量更少的情况下（80条 vs 103条）性能优于纯几何增强（Seed-17X）。

### 2. 🔥 [Rho: A Foundation for Efficiently Adaptable VLA Models] (Rho：一个用于高效适应的VLA模型基础)
- **研究机构**: `Microsoft`
- **Arxiv ID**: `2609.38164` | [点击跳转](https://arxiv.org/abs/2609.38164)

**0. 论文标题**
- **英文标题**: Rho: A Foundation for Efficiently Adaptable VLA Models
- **中文标题**: Rho：一个用于高效适应的VLA模型基础
- **研究机构**: Microsoft
- **一句话总结**: 提出了开源的5B参数VLA模型家族Rho，通过将“适应机器人本体”与“适应具体任务”解耦（引入具身中间训练），大幅降低了双臂机器人下游任务微调的数据需求，并支持基于少量人类反馈的在线潜空间适应。

**1. 整体逻辑**
- **研究任务**: 构建通用物理AI模型（VLA），解决双臂机器人在新环境和新任务中零样本成功率低、下游任务适应数据需求极大的问题。
- **研究动机**: 现有VLA的预训练通常混合了多种任务和机器人本体，导致模型对特定机器人的运动学、相机视角和控制约定缺乏深入理解。如果直接让预训练模型去适应新任务，模型需要同时学习“如何控制这台机器人”和“如何完成这个任务”，导致数据效率极低。
- **本质改动**: 将“适应机器人本体（Embodiment）”和“适应具体任务（Task）”分为两个独立的训练阶段。先通过“具身中间训练（Embodiment Midtraining）”让模型彻底掌握特定机器人的物理控制特性，再进行数据高效的任务微调；并引入轻量级内部潜在策略支持部署后的在线纠正。
- **技术溯源**: 基于微软 Phi-family VLM (Phi-Phy backbone)，结合 Flow-matching 动作生成机制，以及 FlowDAgger 在线适应算法。

**2. 技术拆解**
- **核心方法**: 
  1. **物理接地的VLM骨干 (Phi-Phy)**：在Phi模型基础上加入机器人相关的VQA和接地数据，增强物理感知与推理能力。
  2. **Flow-matching 动作专家**：将VLM特征与机器人本体状态结合，通过Transformer解码高斯噪声，生成连续的动作块（Action chunks）。
  3. **分阶段训练范式**：
     - *预训练*：多本体、多任务混合数据 + 物理VQA数据。
     - *具身中间训练 (Midtraining)*：针对单一目标机器人（如FR3 Duo），在大量不同任务上进行水平适应，学习其专属的运动学和视觉约定。
     - *任务微调*：在特定任务的少量数据上进行垂直微调。
  4. **在线潜空间适应**：冻结主模型，训练一个轻量级的内部潜在策略（Internal latent policy），根据当前观测为Flow-matching提供初始条件，通过人类纠正进行在线更新。
- **关键细节**: 
  - **模型规模**：总参数约5.22B（Phi-Phy 4.68B + Action Expert 542M）。
  - **动作专家结构**：12层Transformer，宽度2048，16个Query Heads（Head dim 128），使用共享的adaLN-single进行时间步条件化。支持最高32维连续状态/动作输入。
  - **接口设计**：动作专家通过交叉注意力（Cross-attention）读取VLM解码器第14层的隐藏状态，VLM上下文在推理时缓存复用，不随Flow积分步数重复计算。
  - **训练超参**：动作专家预训练学习率设为 $1 \times 10^{-4}$，远大于骨干网络的学习率。
- **训练/优化目标**: 
  - **VLM部分**：标准的自回归语言建模损失和物理VQA损失（权重0.02）。
  - **动作专家**：Flow-matching 均方误差损失（预测速度 $\epsilon - a$），推理时使用10步显式Euler积分。

**3. 实验结果**
- **实验设置**: 
  - **数据集与测试环境**：仿真环境包括 LIBERO, RoboEval, RoboTwin 2.0, Meta-World；真实机器人包括 YAM Box, UR AI Trainer, FR3 Duo。
  - **对比对象 (Baseline)**：$\pi_{0.5}$, GR00T N1.7, MolmoAct2, OpenVLA, $\pi_0$ 等主流开源VLA模型。
- **评价指标**: 任务成功率（Success Rate, SR）、任务进度（Task Progress, TP），以及部分行为指标（如笛卡尔/关节路径长度、碰撞次数等）。
- **主要结果**: 
  - **消融实验**：确认了动作专家宽度2048、Head dim 128的最优性；证明了物理接地数据能显著提升长视野/语义任务的表现；确认了动作专家学习率 $1 \times 10^{-4}$ 最优。
  - **Midtraining 效果**：在 RoboTwin 仿真中，经过具身中间训练的模型，达到相同成功率所需的下游微调数据量**减少了一半**；在真实 FR3 Duo 上，中间训练的 epoch 数越多，后续任务适应的成功率越高（0 epoch 60.0% -> 2 epoch 86.7%）。
  - **仿真对比**：在 RoboEval 上，Rho-base 平均成功率 73.4%，比第二名 $\pi_{0.5}$ 高 6.3%；在 LIBERO 上平均成功率 97.9%，优于所有 baseline。
  - **真机对比**：
    - **YAM Box (BusyBox)**：Rho-YAM-Box 成功率 90%，与 $\pi_{0.5}$ 持平，优于 GR00T 和 MolmoAct2。
    - **UR AI Trainer**：Rho-UR-AI-Trainer 在 Toolbox (46.7%) 和 Micro-electronics (60.0%) 任务上显著优于 $\pi_{0.5}$ (20.0%, 40.0%) 和 GR00T (16.7%, 13.3%)。
    - **FR3 Duo**：Rho-FR3-Duo 平均成功率 80.0%，大幅领先 GR00T (50.0%) 和 $\pi_{0.5}$ (46.7%)，尤其在需要精确对齐的任务（如 Tumbler stacking 成功率 70.0% vs baseline 最高 36.7%）上优势明显。
  - **在线适应**：在真实 FR3 Duo 的困难初始配置下，仅用 15 个纠正 episode 进行在线潜空间适应，就能将 test-tube assembly 成功率从 30.0% 提升至 70.0%，plug insertion 从 66.7% 提升至 93.3%。

### 3. 🔥 [MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation] (MotorMind：搭建通用视觉语言模型以实现零样本机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.38078` | [点击跳转](https://arxiv.org/abs/2609.38078)

**0. 论文标题**
- **英文标题**: MotorMind: Scaffolding General Vision Language Models for Zero-Shot Robot Manipulation
- **中文标题**: MotorMind：搭建通用视觉语言模型以实现零样本机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需任务特定训练和外部工具的异步执行框架，通过中间层动作表示让冻结的通用VLM直接进行零样本机器人操作。

**1. 整体逻辑**
- **研究任务**: 零样本机器人操作（Zero-shot robot manipulation），即在不使用特定任务数据微调的情况下，让机器人根据自然语言指令完成物理操作。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型零样本泛化能力差，且依赖专用机器人数据训练；而现有的基于VLM的Agent系统又高度依赖外部工具（如SAM3分割模型、代码生成器、动作专家等），导致系统复杂、昂贵，且未能直接利用通用VLM快速提升的语义和空间理解能力。
- **本质改动**: 抛弃底层动作预测和外部工具依赖，设计一种“中间层动作表示”和“异步执行框架”，让冻结的通用VLM像人类遥操作一样，直接基于视觉观测推理并发出可修正的中级动作指令。
- **技术溯源**: 通用视觉语言模型（如 Qwen3.8-Flash-Next, GPT-6 Sol）。

**2. 技术拆解**
- **核心方法**: 构建一个以VLM为中心的操作框架（MotorMind），将VLM的推理能力通过中间层动作表示与确定性机器人控制连接，并引入异步监控与后台记忆更新机制，形成闭环决策。
- **关键细节**: 
  1. **中间层动作表示**：VLM不输出底层关节指令，而是输出机器人基坐标系下的参数化动作（平移方向+距离、旋转方向+角度、夹爪开合），由底层Controller转换为具体运动。
  2. **五角色架构**：系统为VLM分配五个角色：Planner（任务分解）、Executor（动作生成）、Monitor（后台异步监控，发现异常可中断执行）、Verifier（结果验证）、Memory（后台异步总结执行证据）。
  3. **异步调度**：主决策循环（观察-推理-执行）顺序进行，但场景监控和记忆总结在后台异步并发，不阻塞机器人的物理执行。
- **训练/优化目标**: 无训练/优化目标（Zero-shot，完全冻结VLM）。核心机制是基于观测反馈的闭环决策与异步状态监控。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-PRO（包含Goal, Spatial, Object基础套件及语义、物体、位置、任务四类扰动），以及真实 xArm6 机器人桌面操作。
  - **对比对象（Baseline）**：VLA策略（$\pi_{0.5}$, MolmoAct2, OpenVLA/OFT, GR00T N1.5），Agent方法（CaP-X, VoLoAgent, Harness VLA）。
- **评价指标**: 任务成功率（SR, %）、平均单集耗时（Wall time）、时间归一化成功率（TimeScore）。
- **主要结果**: 
  1. 在LIBERO-PRO基础任务上，MotorMind（零样本）成功率达 66.7%，远超此前最好的零样本方法（CaP-X 10 loops 的 19.2%）。
  2. 在扰动任务下成功率达 53.8%（此前最好为 19.2%），且与微调过的 OpenVLA-OFT（51.2%）性能相当。
  3. 在真实 xArm6 机器人上，直接操作与人类干扰场景下的平均成功率达 95%。
  4. 将骨干网络替换为更强的 GPT-6 Sol 后，基础任务成功率从 66.7% 提升至 83.3%。
  5. 失败分析表明，剩余错误主要源于视觉定位（grounding）不准、过早宣布任务完成（具身推理错误）以及动作知识不足。

### 4. 🔥 [WorldLine: Action-Driven Visual Simulation for Robotic Manipulation] (WorldLine：用于机器人操作的动作驱动视觉模拟)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.38059` | [点击跳转](https://arxiv.org/abs/2609.38059)

**0. 论文标题**
- **英文标题**: WorldLine: Action-Driven Visual Simulation for Robotic Manipulation
- **中文标题**: WorldLine：用于机器人操作的动作驱动视觉模拟
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种解耦动力学学习与动作接地的视频生成框架，通过图像空间动作表示实现跨机器人形态的视觉模拟，并利用少步因果蒸馏加速推理，有效支持了机器人的策略评估与具身规划。

**1. 整体逻辑**
- **研究任务**: 构建动作驱动的视觉模拟器（世界模型），根据初始观测和机器人动作序列预测未来视频，用于策略评估和具身规划。
- **研究动机**: 现有视频生成模型偏向视觉合理性，缺乏对机器人动作的精确跟随和物理连贯性；而现有的动作条件模拟器依赖稀缺且特定于单一机器人形态（embodiment-specific）的数据，难以跨形态共享和扩展。
- **本质改动**: 将可迁移的机器人-物体动力学学习与异构动作的接地（grounding）解耦。用海量无动作标签视频学习动力学先验，用投影到图像空间的动作表示作为跨形态的共享控制接口。
- **技术溯源**: 基于预训练的 Cosmos3-Nano 视频生成模型，使用 V-JEPA2 作为关系正则化的教师模型，下游评估采用 Qwen3VL-8B。

**2. 技术拆解**
- **核心方法**: 采用三阶段训练框架：1) 用无动作视频预训练动力学先验；2) 引入图像空间动作条件、多视角、失败轨迹和关系正则化进行动作接地后训练；3) 进行机器人聚焦的少步因果蒸馏，实现高效的块自回归推理。
- **关键细节**: 
  - **输入输出**: 输入为初始多视角观测和动作序列，输出为未来的多视角视频。
  - **图像空间动作表示**: 利用机器人运动学将末端执行器位姿投影到各相机视角，生成包含位置高斯热力图、深度、Rot6D 方向和夹爪状态的 9 通道动作图（Action Map），与视频 latent token 对齐相加，从而抹平不同机器人控制空间的差异。
  - **关系正则化**: 使用冻结的 V-JEPA2 提取特征，约束学生模型在时间（视角内）和空间（跨视角）的余弦相似度矩阵与教师模型对齐，增强物理交互的连贯性。
  - **因果蒸馏**: 将非因果模型蒸馏为块自回归学生模型，每个块（16 帧 RGB）仅需 4 步去噪，并引入基于机器人掩码的重建和时序运动辅助损失，防止蒸馏过程丢失关键动作细节。
- **训练/优化目标**: 
  - **Stage 1**: 标准的 Flow-Matching 损失。
  - **Stage 2**: 多视角 Flow-Matching 损失 + 视角内和跨视角的关系正则化损失（权重动态缩放）。
  - **Stage 3**: 轨迹回归损失 + 基于分数的分布匹配损失（DMD） + 机器人聚焦的重建与时序运动辅助损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 视频生成评估使用 held-out 的 AgiBotWorld（in-domain）和 DROID（out-of-domain）；策略评估与规划使用 RoboTwin 和 AgiBot。
  - **对比对象（baseline）**: Cosmos3-Nano, Cosmos3-Super, CTRL-World, GE-Sim-V2, OpenDW-0.5, Masked Visual Actions。
- **评价指标**: 
  - **视频生成**: PSNR, SSIM, LPIPS, Robot-mask IoU（使用 SAM 3 分割计算）。
  - **策略评估**: 轨迹成功分类的平均准确率（使用 Qwen3VL-8B 判断）。
  - **具身规划**: 任务成功率（Best-of-N 轨迹选择）。
  - **效率**: 采样步数和单帧延迟。
- **主要结果**: 
  - **视频生成**: 在 AgiBotWorld 失败轨迹上，Robot-mask IoU 达到 0.4705，比最强 baseline (GE-Sim-V2 的 0.3079) 提升 0.1626。在 OOD 的 DROID 数据集上，Robot-mask IoU 达到 0.2739，比最强 baseline 高出 0.0690。
  - **策略评估**: 在 RoboTwin 和 AgiBot 上，平均轨迹成功分类准确率达到 74%，比最强 baseline (73%) 高 1 个百分点。
  - **具身规划**: 在 RoboTwin 上（未经 RoboTwin 数据训练或微调），当候选轨迹数 N=32 时，相比直接执行，使 π0.5 策略的任务成功率提升 19.1 个百分点，LingBot-VLA 策略提升 21.4 个百分点。
  - **推理效率**: 因果蒸馏将 129 帧生成的采样步数从 35 步降至 4 步，单帧延迟从 0.698 秒降至 0.163 秒，实现 4.3 倍加速，且保留了关键的机器人-物体交互动态。

### 5. 🔥 [MVG-WAM: Multiple View Geometry-Aware World-Action Modeling for Robotic Manipulation] (MVG-WAM：用于机器人操作的多视角几何感知世界-动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37793` | [点击跳转](https://arxiv.org/abs/2609.37793)

**0. 论文标题**
- **英文标题**: MVG-WAM: Multiple View Geometry-Aware World-Action Modeling for Robotic Manipulation
- **中文标题**: MVG-WAM：用于机器人操作的多视角几何感知世界-动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种多视角几何感知的世界-动作模型，通过引入极线约束和视角索引几何条件，将多视角观测显式建模为同一物理世界的几何投影，在没有额外具身预训练的情况下显著提升了仿真和真机操作的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作（基于多视角视觉观测、语言指令和本体感觉的机器人动作预测）。
- **研究动机**: 现有的世界-动作模型（WAMs）在处理多视角输入（如场景相机和腕部相机）时，通常只是简单拼接图像或token。这导致相机间的标定几何关系是隐式的，模型很难将全局场景上下文与局部交互几何有效结合，增加了从训练信号中恢复跨视角对应关系的负担，削弱了空间推理能力。
- **本质改动**: 不再将多视角图像视为画布上独立的拼接块，而是利用多视角几何（极线约束和几何基础模型）显式构建跨视角的全局状态和视角级别的几何条件，并通过未来深度监督将表征锚定到物理尺度。
- **技术溯源**: 基于预训练视频生成骨干（Wan2.2），结合 DINOv3（密集特征提取）、VGGT-Ω（几何基础模型）以及视频-动作扩散 Transformer（Video-Action Diffusion Transformer）。

**2. 技术拆解**
- **核心方法**: 
  1) **极线约束的跨视角全局状态**：在 DINOv3 密集特征空间进行极线约束的跨视角检索，聚合多视角信息形成紧凑的全局状态。
  2) **视角索引的几何条件**：利用冻结的几何基础模型（VGGT-Ω）联合编码同步观测，生成视角级别的几何状态，并通过相机感知路由（camera-aware routing）将其注入到对应相机区域的视频 token 中。
  3) **未来度量深度监督**：训练时对中间去噪特征施加多时间步的未来度量深度监督，将几何感知表征锚定到物理尺度（推理时不需要深度解码）。
- **关键细节**: 
  - **输入输出**：输入为语言指令、本体感觉、多相机同步 RGB 及内外参；输出为未来视频 latent 和动作 chunk。
  - **模型结构**：包含视频专家和动作专家，视频骨干基于 Wan2.2。动作 token 通过混合注意力（mixed attention）访问增强后的视频表征。
  - **规模与超参**：8 张 H100 训练，batch size 128；推理采用 10 步去噪，预测 32 步动作 chunk。
- **训练/优化目标**: 
  - **主损失**：视频流匹配损失（video flow-matching loss）和动作流匹配损失（action flow-matching loss）。
  - **辅助损失**：多时间步未来度量深度监督损失，包含 log-depth 的 Huber loss、多尺度梯度匹配 loss 以及基于 RGB 梯度的边界加权 loss。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（40 个任务），RoboTwin 2.0（50 个任务，含 Clean 和 Randomized 域）。
  - **对比对象**：π0.5, X-VLA, Motus, LingBot-VA, FastWAM, FastWAM-Joint, OpenVLA 等。
  - **真机环境**：AgileX Cobot Magic 机械臂，3 个操作任务（拔萝卜放盘子、叠杯子、开锅盖放胡椒）。
- **评价指标**: 任务成功率（Success Rate, SR），以及短视距 RGB 预测的 PSNR/SSIM 和度量深度的 MAE 等诊断指标。
- **主要结果**: 
  - **仿真基准**：无需额外具身预训练，在 LIBERO 平均成功率 99.1%，RoboTwin 2.0 上 92.07%，超越 FastWAM-Joint 等 baseline，且推理延迟更低（0.74s vs 5.23s）。
  - **泛化能力**：在 LIBERO-Plus 的 Camera 和 Background 分布偏移下提升显著（+12.0 和 +4.2）；在 RoboTwin 2.0 Clean2Random 设置下，C2R 成功率从 1.3%（FastWAM-Joint）大幅提升至 29.2%。
  - **真机实验**：在 Cobot Magic 上 150 次试验平均成功率 91.3%，优于 π0.5（89.3%）和 FastWAM-Joint（78.7%）。
  - **表征诊断**：短视距 RGB 预测 PSNR 提升 3.74dB，教师强制（TF）深度诊断 MAE 达 2.12cm，证明隐式表征确实保留了度量几何信息。

### 6. 🔥 [RawVLA: Embodied Neural Image Signal Processor For Robotic Manipulation] (RawVLA：用于机器人操作的具身神经图像信号处理器)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37530` | [点击跳转](https://arxiv.org/abs/2609.37530)

**0. 论文标题**
- **英文标题**: RawVLA: Embodied Neural Image Signal Processor For Robotic Manipulation
- **中文标题**: RawVLA：用于机器人操作的具身神经图像信号处理器
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种轻量级神经ISP（RawVLA），直接处理相机RAW数据并自适应渲染，以即插即用的方式显著提升冻结VLA模型在恶劣光照等成像条件下的机器人操作成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中对不良成像条件（如低光、过曝、高动态范围等）的鲁棒性。
- **研究动机**: 现有VLA模型依赖相机固定的图像信号处理器（ISP）生成的RGB图像，将ISP视为任务中立的固定预处理环节。但分析表明，ISP参数（如曝光、噪声、色彩、色调、位深）会实质性影响动作预测，导致模型在极端光照下性能崩溃。
- **本质改动**: 将ISP从固定的硬件预处理环节剥离，替换为一个可学习的、任务驱动的神经ISP（RawVLA），直接接收RAW数据，根据下游VLA策略的需求自适应渲染出最合适的RGB图像。
- **技术溯源**: 基于主流VLA模型（如 PI-0, PI-0.5, Qwen3-OFT 等）以及传统相机成像物理模型（ISP管线：去马赛克、曝光、白平衡、色彩校正、色调映射）。

**2. 技术拆解**
- **核心方法**: 提出 RawVLA，一个因果流式神经ISP。它接收多帧RAW数据，通过解耦的亮度和色度循环状态提取特征，预测结构化的ISP参数，最终解析生成RGB图像喂给冻结的VLA策略，保持时序渲染稳定性。
- **关键细节**: 
  - **输入输出**：输入为6帧因果线性RAW burst，输出为渲染后的RGB图像。
  - **模型结构**：无U-Net图像解码器，仅包含约88.7万可训练参数的轻量级网络（包含空间亮度编码器、MLP和GRU）。
  - **参数化设计**：曝光用EV空间表示；白平衡用零和通道偏移；色彩校正用单位矩阵加残差；色调曲线用8阶Bernstein多项式保证单调性且无色彩偏移。
- **训练/优化目标**: 动作驱动优化。使用下游冻结VLA策略的原生动作损失（Action loss）作为主目标，通过反向传播更新RawVLA参数；同时引入亮度（Bright）和色度（Chroma）正则化损失，以稳定极端光照下的训练过程。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RawVLA-Bench（包含 LIBERO 和 RoboTwin 2.0 的RAW域扩展，涵盖5种光照条件），以及真实世界双臂操作任务。
  - **对比对象（Baseline）**：Default ISP（固定相机管线），以及 DarkISP、RAM、RAW-Adapter、RAWild 四种学习型神经ISP。
  - **VLA骨干**：PI-0, PI-0.5, Qwen3-OFT 等。
- **评价指标**: 任务成功率（Task success rate，%）。
- **主要结果**: 
  - **LIBERO**：RawVLA将跨骨干平均成功率从最强baseline的43.01%提升至68.82%，在过曝等恶劣条件下提升显著，且正常光照下的性能得以保留。
  - **RoboTwin 2.0**：平均成功率达54.98%，相比最强baseline相对提升85.81%，在极低光和过曝下均排名第一。
  - **真实世界**：正常光照下成功率75.00%（与Default ISP的76.50%相当），低光下维持在66.50%（Default ISP为0.00%，DarkISP为11.00%）。
  - **推理速度**：达到168 FPS，满足相机原生帧率和实时控制需求。

### 7. 🔥 [Anisotropic Representations Improve Planning in JEPA World Models] (各向异性表征改善JEPA世界模型中的规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37441` | [点击跳转](https://arxiv.org/abs/2609.37441)

**0. 论文标题**
- **英文标题**: Anisotropic Representations Improve Planning in JEPA World Models
- **中文标题**: 各向异性表征改善JEPA世界模型中的规划
- **研究机构**: 原文未提及
- **一句话总结**: 本文指出JEPA世界模型中各向同性正则化会导致潜在空间几何与任务规划代价不对齐，提出一种可学习的各向异性高斯正则化方法，在不改变规划器的前提下提升了视觉规划成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉观测的潜在世界模型动作规划（Visual goal planning in latent world models）。
- **研究动机**: 现有方法（如LeWM）使用各向同性高斯正则化（SIGReg）来防止表征崩溃，但这会导致潜在空间的欧氏距离按状态方差的倒数来加权误差。当真实任务代价与这种加权方式不一致时，即使预测完全准确，规划器也会选出次优动作，产生规划遗憾（planning regret）。
- **本质改动**: 把固定的各向同性高斯正则化目标，替换为带有固定迹和条件数约束的可学习对角协方差（各向异性高斯目标），让模型在训练时自动学习如何在不同潜在维度上分配方差，从而让潜在距离对齐任务规划代价。
- **技术溯源**: 基于 JEPA（Joint Embedding Predictive Architecture）框架，具体继承自 LeWorldModel (LeWM) 和 LeJEPA 中的 SIGReg (Sketched Isotropic Gaussian Regularization)。

**2. 技术拆解**
- **核心方法**: 提出 AnisoWM 与 $\Lambda$ Reg。引入一个可学习的对角高斯目标协方差矩阵 $\Lambda$。在计算正则化损失时，先将潜在表征按 $\Lambda^{-1/2}$ 进行标准化，然后再应用原有的 SIGReg 统计量。预测目标、预测器架构和欧氏规划器保持不变，$\Lambda$ 仅在训练时使用。
- **关键细节**: 
  - 输入输出：输入当前视觉观测、动作序列和目标观测，输出预测的终端潜在表征。
  - 模型结构：ViT-Tiny 编码器 + 投影 MLP（生成 192 维表征），3帧上下文的因果预测器。
  - 规模与超参：表征维度 192；各向异性边界（条件数）$\kappa=2$；正则化权重 $\lambda=0.09$。$\Lambda$ 的对角元素通过 softmax(logits) 参数化以保证迹为维度 $D$，并通过裁剪 logits 来限制条件数不超过 $\kappa$。
- **训练/优化目标**: 
  - 预测损失：潜在表征的均方误差（MSE）。
  - 正则化目标：$\Lambda$ Reg，即计算标准化特征的经验特征函数与高斯特征函数之间的加权平方距离（有限批次 SIGReg 统计量）。
  - 总目标：预测损失 + $\lambda$ * $\Lambda$ Reg。$\Lambda$ 仅通过正则化项进行梯度更新。

**3. 实验结果**
- **实验设置**: 
  - 数据集：TwoRoom, Reacher, PushT, Cube（视觉控制环境数据集）。
  - 对比对象：主要对比 LeWM ($\kappa=1$ 的基线)，并引用了 PLDM, DINO-WM, GCBC, GCIQL, GCIVL, Random 的数据。
- **评价指标**: 
  - 规划成功率（Planning success rate）。
  - 动作排序一致性：潜在代价排序与实际任务结果排序的吻合比例（分为仅用表征的 $J_{enc}$ 和包含预测展开的 $J_{pred}$）。
  - 局部代价几何：潜在规划代价与物理空间任务代价的 Spearman 秩相关系数。
- **主要结果**: 
  - 规划成功率：在四个环境中全面优于 LeWM（TwoRoom: 93% vs 87%，Reacher: 89% vs 86%，PushT: 97% vs 96%，Cube: 79% vs 74%）。
  - 排序一致性：AnisoWM 的潜在代价排序与实际任务结果排序的吻合度显著高于 LeWM，证明其几何结构更对齐任务。
  - 局部几何：在 Cube 和 PushT 中，目标周围的低代价区域与物理距离的 Spearman 秩相关系数大幅提升（Cube 从 0.15 升至 0.91，PushT 从 0.65 升至 0.92）。
  - 方差分配特性：不同环境学到的方差谱不同，且增大条件数上限 $\kappa$ 并不总是单调提升规划性能，说明学习到的方差分配起到了关键作用。

### 8. 🔥 [Remember What You Did: Action-History Memory with Dual-Expert Denoising for Long-Horizon Vision-Language-Action Policies] (记住你做了什么：用于长视野视觉-语言-动作策略的动作历史记忆与双专家去噪)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37307` | [点击跳转](https://arxiv.org/abs/2609.37307)

**0. 论文标题**
- **英文标题**: Remember What You Did: Action-History Memory with Dual-Expert Denoising for Long-Horizon Vision-Language-Action Policies
- **中文标题**: 记住你做了什么：用于长视野视觉-语言-动作策略的动作历史记忆与双专家去噪
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ActMem-VLA，通过 Mamba 编码历史动作并采用双专家交接去噪机制，在不微调基础 VLA 的前提下，以极小参数代价解决长视野机器人操作中的感知混叠问题。

**1. 整体逻辑**
- **研究任务**: 长视野机器人操作（Long-horizon robotic manipulation）中的动作生成，重点解决任务执行过程中的进度感知与动作歧义问题。
- **研究动机**: 现有 VLA 仅依赖当前观测，在长视野任务中遇到视觉相似但处于不同阶段的场景时，会产生“感知混叠”（Perceptual aliasing），导致动作歧义。现有引入历史上下文的方法要么直接处理多帧视觉导致计算成本高，要么需要联合微调记忆模块和基础策略，训练代价大且不够灵活。
- **本质改动**: 将记忆建模与动作生成解耦，设计“双专家交接去噪”架构：用轻量级预动作专家（PAE）结合动作历史记忆处理早期高噪去噪，随后将中间状态交接给冻结的基础动作专家（AE）进行后期精修，实现即插即用。
- **技术溯源**: 基于 Flow-matching VLA（如 $\pi_{0.5}$）、Mamba-2 以及 Transformer 架构。

**2. 技术拆解**
- **核心方法**: 基于执行动作历史的记忆机制（Execution Memory）与双专家交接去噪（Dual-Expert Handover Denoising）。摒弃冗余的历史视觉帧，仅用低维的执行动作历史作为任务进度的紧凑信号，通过双专家分工完成动作块（Action chunk）生成。
- **关键细节**: 
  - **输入输出**：输入当前观测、语言指令、历史执行动作块；输出动作块。
  - **模型结构**：使用 2 层 Mamba-2（隐藏维度 1024）编码历史动作生成记忆表示；PAE 由基础 AE 的部分 Transformer 层（4层）复制初始化，接收历史 KV 和 VLM 前缀 KV。
  - **交接机制**：在 10 步 Flow-matching 去噪中，设定交接点 $r=0.4$。前 4 步（高噪阶段）由 PAE 负责，利用历史记忆引导动作轨迹；后 6 步（低噪阶段）直接交接给冻结的 AE 进行细节精修。
  - **规模**：整个记忆插件仅增加基础 VLA 3.45% 的参数量。
- **训练/优化目标**: 优化目标为 Flow-matching loss（预测速度场与真实速度场的 L2 距离）。训练时基础 VLM 和 AE 完全冻结，仅联合优化 Mamba 模块和 PAE。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：仿真采用 LIBERO-Mem 基准（10 个任务）；真机采用 DOBOT Nova 机械臂，设计 4 个任务（R1-R4），每任务收集 50 个遥操作 demo。
  - **对比对象（Baseline）**：无记忆机制的 $\pi_{0.5}$，以及基于视觉历史检索的 MemoryVLA。
- **评价指标**: 任务成功率（Success rate）。仿真中特别引入了基于演示长度 95 分位数计算的“特定任务步数限制”（Task-specific step limits），以防止模型靠死循环刷成功率，更真实地反映任务完成能力。
- **主要结果**: 
  - **仿真**：在特定步数限制下，ActMem-VLA 平均成功率达 80.8%，显著优于 $\pi_{0.5}$（65.2%）和 MemoryVLA（49.5%），在需要重复计数和状态区分的任务（如 T4、T5）上优势明显。
  - **真机**：4 个任务平均成功率从 $\pi_{0.5}$ 的 35.0% 提升至 63.75%（绝对提升 28.8%）。在需要区分称重前后相似状态的 R2 任务上，成功率从 10% 大幅提升至 65%，验证了动作历史记忆在解决感知混叠上的有效性。

### 9. 🔥 [Disentangling Spurious Correlations in Vision-Language-Action Models via Predicting Domain-Invariant Latent Lookahead] (通过预测领域不变潜在前瞻来解耦视觉-语言-动作模型中的虚假相关)
- **研究机构**: `原文未提及具体机构（受韩国政府IITP/NRF/KEIT/KIAT等基金资助）`
- **Arxiv ID**: `2609.37165` | [点击跳转](https://arxiv.org/abs/2609.37165)

**0. 论文标题**
- **英文标题**: Disentangling Spurious Correlations in Vision-Language-Action Models via Predicting Domain-Invariant Latent Lookahead
- **中文标题**: 通过预测领域不变潜在前瞻来解耦视觉-语言-动作模型中的虚假相关
- **研究机构**: 原文未提及具体机构（受韩国政府IITP/NRF/KEIT/KIAT等基金资助）
- **一句话总结**: 提出DILL框架，通过解耦任务与领域视觉特征，并预测“领域不变的未来潜在表征”来监督VLA模型，有效消除视觉捷径学习，大幅提升模型在视角/背景等视觉分布偏移下的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在视觉分布偏移（如视角、背景、光照、传感器噪声变化）下的鲁棒性，解决VLA策略中的捷径学习（shortcut learning）问题。
- **研究动机**: VLA模型在训练时容易学到与任务无关的视觉线索（如特定视角或背景）作为捷径。当测试时视觉条件改变，模型会发生“任务替换”（即根据视角执行错误的任务）。现有的未来预测方法如果直接预测原始或纠缠的视觉特征，依然会保留这些干扰因素，无法从根本上解决捷径问题。
- **本质改动**: 不直接预测原始未来帧或纠缠的视觉特征，而是先训练一个编码器将表征解耦为“任务”和“领域”两部分，然后让VLA策略去预测“领域不变的未来任务潜在表征”，从而强迫策略只关注任务相关结构，忽略领域特定视觉变化。
- **技术溯源**: 基于VLA架构（视觉语言骨干使用Qwen2.5-VL），视频编码器基座使用VJEPA2，对比学习使用InfoNCE，解耦正则化使用SIGReg。预训练数据使用ManiSkill、MimicGen和OXE（Bridge, Fractal/RT-1）。

**2. 技术拆解**
- **核心方法**: 提出Domain-Invariant Latent Lookahead (DILL)，分为两阶段：1) 预训练Task-Domain Encoder，利用领域变换的轨迹数据，通过对比学习和高斯解耦损失，将视频特征解耦为任务潜在变量和领域潜在变量；2) VLA策略学习，冻结Encoder，让策略网络预测未来的任务潜在变量（与Encoder提取的未来任务latent对齐），同时让当前表征与领域潜在变量解耦，两者拼接后输入动作头。
- **关键细节**: 
  - 输入输出：输入当前观测和语言指令，输出动作chunk（如50步）。
  - 模型结构：VLM骨干（Qwen2.5-VL + LoRA），Task/Domain Encoder（VJEPA2 + LoRA + Multi-query Attention Pooling），策略侧新增Lookahead Predictor、Current Representation Head和ResNet Action Head（共约364M参数）。
  - 规模：Encoder预训练数据约842万帧、15.7万条轨迹。
- **训练/优化目标**: 
  - Encoder预训练：任务对比损失（同轨迹不同领域） + 领域对比损失（同领域不同轨迹） + 联合高斯解耦损失（SIGReg，促使拼接后的任务-领域latent服从各向同性高斯分布，从而消除协方差）。
  - 策略学习：行为克隆损失（L1） + 前瞻对比对齐损失（InfoNCE，对齐预测的lookahead latent与未来任务latent） + 当前表征解耦损失（促使当前表征与领域latent解耦）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（Shortcut Diagnostic，反事实任务-视角组合）、LIBERO-Plus（视觉扰动鲁棒性）、真实机器人实验（UR5e机械臂）。
  - Baseline：Base VLA, MiniVLA, $\pi_0$, OpenVLA, OpenVLA-OFT, WorldVLA, UniVLA, NORA，以及消融模型（Entangled LA, DILL w/o CH等）。
- **评价指标**: 
  - LIBERO Shortcut Diagnostic：OOD success（反事实视角下的任务成功率），Shortcut degree（捷径依赖度，即执行错误任务的比例，越低越好）。
  - LIBERO-Plus：Camera/Light/BG/Noise等视觉扰动下的成功率，以及相比Original的性能下降幅度（Drop）。
  - 表征诊断：任务对与领域对的余弦相似度差距（$\Delta_{task}$）。
- **主要结果**: 
  - 捷径消除：在LIBERO反事实诊断中，DILL将Shortcut degree降至0.05（Base VLA为0.73），OOD success提升至0.58（Base VLA为0），有效避免了“看视角做任务”的替换行为。
  - 视觉鲁棒性：在LIBERO-Plus视觉扰动下，DILL平均成功率达69.1%，比最强baseline（OpenVLA-OFT）高11.4个百分点，且性能下降幅度最小（仅降12.5%，而OpenVLA-OFT降37.6%）。
  - 真实世界：反事实任务跟随成功率从29.7%提升至80.2%，Shortcut degree降至0；在预定义和全新视觉扰动下均显著优于baseline。
  - 表征分析：最终输入动作头的VLA latent对任务对的相似度（0.94）远高于领域对（0.55），证明成功将动作决策依据从视觉领域特征转移到了任务结构特征。

### 10. 🔥 [CoRe-VLA: Preserving Cross-View Coordination in VLAs under Camera Shifts] (CoRe-VLA：在相机位移下保持VLA的跨视角协调)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37150` | [点击跳转](https://arxiv.org/abs/2609.37150)

**0. 论文标题**
- **英文标题**: CoRe-VLA: Preserving Cross-View Coordination in VLAs under Camera Shifts
- **中文标题**: CoRe-VLA：在相机位移下保持VLA的跨视角协调
- **研究机构**: 原文未提及
- **一句话总结**: 提出即插即用的CoRe-VLA框架，通过点云重投影和图像修复将偏移视角的观测恢复为训练视角，无需额外多视角数据或微调模型，即可解决外部相机位移导致的VLA跨视角协调失效问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在外部相机发生物理位移（Camera Shifts）时的操作成功率与鲁棒性。
- **研究动机**: 现有VLA在相机位移下成功率大幅下降，核心原因是“跨视角协调失效”：机器人过度依赖腕部相机的局部线索，导致子任务执行顺序错误或忽略全局状态（例如没开盖子就去抓东西）。现有修复方法需要收集昂贵的多视角配对数据并重新微调VLA，部署成本高。
- **本质改动**: 不修改VLA权重、不采集新数据，直接利用RGB-D重建点云并渲染回训练视角，配合轻量级图像修复和异步执行策略，把偏移后的观测恢复成VLA熟悉的训练视角。
- **技术溯源**: 基于主流开源VLA（$\pi_{0.5}$, OpenVLA-OFT, GR00T），底层几何重建采用直接RGB-D重投影（direct RGB-D reprojection），图像修复采用轻量级NAFNet。

**2. 技术拆解**
- **核心方法**: CoRe-VLA框架包含三个模块：几何视角恢复（Geometric Viewpoint Restoration）、渲染至相机修复（R2C Restoration）、执行轨迹条件对齐（ETCA）。
- **关键细节**: 
  - **几何视角恢复**：利用偏移相机的RGB-D和内外参，将像素反投影到3D空间，再投影到训练相机坐标系下重渲染，恢复训练视角的几何结构。
  - **R2C修复**：重渲染会导致纹理丢失、颜色失真和模糊。使用轻量级NAFNet进行修复，其训练数据由现有2D演示视频通过投影变换和像素遮挡人工合成，无需真实多视角数据。
  - **ETCA异步控制**：渲染和修复增加了推理延迟。ETCA将新预测的action chunk与机器人实际已执行的关节轨迹进行匹配，找到最佳接续点，实现异步执行，避免运动冲突。
- **训练/优化目标**: VLA保持冻结。R2C的优化目标为联合损失函数 $\mathcal{L}_{R2C} = \lambda_{per}\mathcal{L}_{per} + \lambda_{col}\mathcal{L}_{col} + \lambda_{pix}\mathcal{L}_{pix}$，结合VGG16的感知损失、通道均值与方差的颜色损失，以及Charbonnier像素损失，以联合恢复纹理、颜色和细节。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：5个真实机器人任务（UR7e机械臂，外部RGB-D相机+腕部相机），LIBERO-100（仿真），LIBERO-Plus（仿真Camera子集）。
  - **对比对象（baseline）**：真实机器人和LIBERO-100中对比原始偏移视角（Raw）与CoRe-VLA，底层VLA为 $\pi_{0.5}$, OpenVLA-OFT, GR00T。LIBERO-Plus中对比了Cross-View AC, GAM, Anchor-Align, AVA-VLA, SRPO, SCVC, Robust-WAM等需要微调或特定训练的方法。
- **评价指标**: 任务成功率（SR），Type 2 失败率（任务状态不一致/局部操作与全局状态不符的比例），平均完成时间，平均空闲时间。
- **主要结果**: 
  - **真实机器人（1.6m偏移）**：$\pi_{0.5}$ 成功率从 13.3% 提升至 83.3%，Type 2 失败率从 76.7% 降至 13.3%；GR00T 成功率从 6.7% 提升至 80.0%。
  - **LIBERO-100（0.9m偏移）**：$\pi_{0.5}$ 成功率从 13.8% 提升至 71.5%，OpenVLA-OFT 从 5.9% 提升至 55.1%。
  - **LIBERO-Plus**：$\pi_{0.5}$ 成功率从 72.0% 提升至 89.1%，在不微调VLA的情况下超越了Anchor-Align等需要微调VLA的方法。
  - **消融实验**：R2C在1.6m偏移下带来 33.3% 的成功率提升；ETCA将CoRe-VLA的平均完成时间从 64.5s 降至 43.7s（降幅 32.2%），空闲时间从 39.1s 降至 13.8s（降幅 64.7%）。

### 11. 🔥 [Beyond Token Importance: Preserving Spatial Scaffolds for Efficient Vision-Language-Action Inference] (超越Token重要性：在高效视觉-语言-动作推理中保留空间骨架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36967` | [点击跳转](https://arxiv.org/abs/2609.36967)

**0. 论文标题**
- **英文标题**: Beyond Token Importance: Preserving Spatial Scaffolds for Efficient Vision-Language-Action Inference
- **中文标题**: 超越Token重要性：在高效视觉-语言-动作推理中保留空间骨架
- **研究机构**: 原文未提及
- **一句话总结**: 指出VLA模型在激进剪枝时仅靠语义重要性会丢失空间结构，提出免训练的GeoScaffold方法，通过“区域语义分配+区域内几何采样”保留空间骨架，在极高剪枝率下大幅兼顾推理加速与任务成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的推理加速（具体为视觉Token剪枝）。
- **研究动机**: 现有VLA剪枝方法主要基于语义相关性挑选单个Token，忽略了机器人操作对空间几何信息的依赖。作者发现了一个反直觉的“Stride-Random反转”现象：在激进剪枝下，纯几何的均匀采样在某些比例下反而大幅优于语义采样，但比例微调又会突然崩溃。这说明仅靠语义重要性无法维持场景的空间骨架，导致定位和接触推理失败。
- **本质改动**: 将剪枝逻辑从“全局基于语义的Token级Top-K选择”改为“基于语义的区域级预算分配 + 基于几何的区域内Token选择”，在保留语义相关性的同时强制保留场景的空间覆盖。
- **技术溯源**: 基于双系统VLA架构（如 $\pi_{0.5}$、OpenVLA-OFT），借鉴了FastV等免训练剪枝方法中利用浅层注意力图计算相关性的思路。

**2. 技术拆解**
- **核心方法**: 提出 GeoScaffold，一种免训练视觉Token剪枝算法。将图像划分为多个空间区域，利用浅层注意力图计算区域级语义权重来分配Token预算（设定每个区域至少保留1个Token作为空间底线），然后在每个区域内使用以中心为种子的最远点采样（FPS）来挑选Token，从而最小化局部空间覆盖半径。
- **关键细节**: 
  - **输入输出**: 输入多视角RGB图像、语言指令和本体状态，输出连续动作chunk。
  - **模型结构**: 双系统VLA（视觉-语言骨干网络编码多模态前缀，动作专家通过迭代去噪生成动作）。
  - **规模与超参**: 默认将 $16 \times 16$ 的视觉Token网格划分为 $4 \times 4$ 的非重叠区域。使用第2层的注意力图。选取注意力方差最大的前20% ($\rho=0.2$) 文本Token作为聚合集合来计算语义权重。采用物理移除（physical removal）未选中Token的方式，直接缩短后续Transformer层的序列长度。
- **训练/优化目标**: 免训练方法，无额外训练损失。核心机制是求解离散n-center问题，即在给定Token预算下，最小化空间覆盖半径（图像网格上任意位置到最近保留Token的最大距离），同时通过注意力机制最大化保留区域的任务相关性。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: LIBERO（包含Spatial, Object, Goal, Long四个子集）。
  - **对比对象（baseline）**: 未剪枝基线，以及语义/缓存剪枝方法 FastV, SparseVLM, VLA-Cache。
  - **测试环境**: NVIDIA A100（测成功率），NVIDIA RTX 4090（测延迟）。
  - **评估模型**: 主实验在 $\pi_{0.5}$ 上进行，并在 OpenVLA-OFT 上进行跨架构验证。
- **评价指标**: 任务成功率（Success Rate），Prefill（预填充）延迟及加速比，端到端延迟及加速比。
- **主要结果**: 
  - 在 $\pi_{0.5}$ 上，90%激进剪枝率下（仅保留10% Token），GeoScaffold平均成功率达75.1%，比FastV（26.6%）高出48.5个百分点，Prefill加速1.96倍，端到端加速1.33倍。
  - 80%剪枝率下（保留20% Token），平均成功率93.2%，Prefill加速1.78倍。
  - 跨架构验证中，在 OpenVLA-OFT 上87.5%剪枝率下，GeoScaffold平均成功率79.9%，显著优于FastV（72.6%）和VLA-Cache（51.8%）。
  - 消融实验证实，单层几何或纯语义方法均表现不佳，结合“语义区域分配”与“中心种子2D FPS几何采样”是性能提升的核心。

### 12. 🔥 [PreferenceFlow: Test-Time Guidance of Flow-Matching Robot Policies from Human Interventions] (PreferenceFlow：利用人类干预在测试时引导流匹配机器人策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36872` | [点击跳转](https://arxiv.org/abs/2609.36872)

**0. 论文标题**
- **英文标题**: PreferenceFlow: Test-Time Guidance of Flow-Matching Robot Policies from Human Interventions
- **中文标题**: PreferenceFlow：利用人类干预在测试时引导流匹配机器人策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出 PreferenceFlow 框架，利用人类干预数据训练偏好模型，在测试时通过偏好梯度引导冻结的流匹配机器人策略，无需环境奖励或更新基础参数，显著提升了真实机器人精密操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 提升预训练的生成式机器人策略（特别是流匹配策略）在部署时的局部执行成功率，解决因视觉变化、接触丰富等分布偏移导致的局部执行错误。
- **研究动机**: 现有的策略改进方法要么依赖难以获取的环境奖励（如稀疏、延迟），要么需要更新基础模型参数（计算昂贵且易遗忘）。基于 Q 函数的测试时引导（如 QGF）在真实机器人上因缺乏奖励信号而难以应用。相比之下，人类在部署时的直接干预（相对纠正动作）比显式奖励更容易获取。
- **本质改动**: 前人用 Q 函数梯度引导需要环境奖励，这篇工作将人类干预动作与同状态下机器人生成的动作构建偏好对，训练一个状态条件偏好模型，并在推理时用该偏好模型的梯度替代 Q 函数梯度，直接引导冻结的流匹配采样过程。
- **技术溯源**: 基于流匹配（Flow-matching）机器人策略（实验采用 $\pi_{0.5}$ 作为基座），以及 Q-Guided Flow (QGF) 的测试时引导机制。

**2. 技术拆解**
- **核心方法**: 
  1. 偏好数据构建：在相同的初始状态窗口下，将人类干预动作块与机器人采样动作块配对，构建偏好数据集（设定人类动作优于机器人动作）。
  2. 偏好模型训练：使用 Bradley-Terry 目标训练状态条件偏好模型，并引入两个梯度正则化项：梯度上限损失（限制干预数据上的过大梯度）和零梯度损失（抑制专家演示动作邻域内的引导梯度）。
  3. 测试时引导：推理时，利用偏好模型在估计的干净动作上计算的梯度，加到冻结的流匹配速度场中，引导采样轨迹。
- **关键细节**: 
  - 偏好模型架构：复用基座策略冻结的条件表示（视觉、语言、机器人状态 token）作为 Key/Value，动作 token 作为 Query 进行交叉注意力。对每个动作步独立计算得分并求平均，动作步之间无时序自注意力。
  - 动作块设置：人类干预和机器人采样均取前 $K=10$ 步。
  - 推理引导机制：每步采样时，先用欧拉外推估计干净动作，计算偏好梯度后，将其与基础速度场结合进行更新。
- **训练/优化目标**: 总损失 = 偏好排序损失 + 梯度上限损失 + 零梯度损失。仅优化偏好模型参数，基础策略及其编码器保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：4个真实世界精密插入任务（Insert Ethernet, Insert USB, Insert SATA, Insert Charger），使用 Franka 机器人。每个任务提供 50 次专家演示和约 50 次人类干预 episode。
  - 对比对象（baseline）：Frozen $\pi_{0.5}$ (冻结基础策略), Intervention BC (在干预数据上微调基础策略), QGF (基于 Q 函数引导), FlowDAgger (基于噪声空间干预学习)。
- **评价指标**: 任务成功率（每个任务 50 次试验的成功比例）。
- **主要结果**: 
  - PreferenceFlow 在 4 个任务上平均成功率达到 90.5%，比冻结策略 (69.0%) 提升 21.5 个百分点，比 Intervention BC (84.5%) 提升 6 个百分点，比 QGF (76.0%) 和 FlowDAgger (78.5%) 分别提升 14.5 和 12 个百分点。
  - 消融实验表明：梯度正则化至关重要，去掉任一正则化项会导致成功率大幅下降（如去掉零梯度损失降至 74.5%）；动作 token 间不加时序自注意力（独立打分）效果更好（90.5% vs 77.0%）；随机翻转偏好标签会导致成功率降至 63.5%，证明正确的偏好排序是有效的。
  - 数据效率：仅需 10 个干预 episode 即可将平均成功率从 69% 提升至 78.5%，50 个 episode 达到 90.5%。

### 13. 🔥 [VidAct: Learning Manipulation from In-the-Wild Videos with Object-Centric 3D Awareness] (VidAct：从野外视频中学习具有以物体为中心的3D感知的操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36870` | [点击跳转](https://arxiv.org/abs/2609.36870)

**0. 论文标题**
- **英文标题**: VidAct: Learning Manipulation from In-the-Wild Videos with Object-Centric 3D Awareness
- **中文标题**: VidAct：从野外视频中学习具有以物体为中心的3D感知的操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出VidAct框架，通过以物体为中心的轨迹重建、残差轨迹迁移和仿真特权3D点云辅助监督，仅用单目视频即可训练机器人操作策略并实现零样本真机部署。

**1. 整体逻辑**
- **研究任务**: 从单目RGB视频中学习机器人操作策略，实现零样本真实世界部署（Zero-shot real-world deployment）。
- **研究动机**: 现有的视频重建方法通常依赖受限的相机视角或人手到机器人的重定向，重建的轨迹难以适应新的物体配置且容易发生形变；此外，基于RGB输入的策略缺乏精确的物体级3D几何感知，限制了物体定位和精细操作（如插入、堆叠）的性能。
- **本质改动**: 将可迁移信号从“人手/机器人动作”转为“物体运动”，在静态物体坐标系下表达轨迹以消除相机视角依赖；提出残差轨迹迁移机制，在适应新物体配置的同时保留原始运动形状；在训练时引入仿真提供的完整物体点云作为辅助监督，赋予策略3D感知，而部署时仅需RGB输入以避免真实世界3D输入的噪声和Sim-to-Real gap。
- **技术溯源**: 策略基座为ACT (Action Chunking with Transformers)；3D与视觉处理依赖SAM2、SAM 3D、MoGe-3、FoundationPose；仿真环境基于Isaac Sim。

**2. 技术拆解**
- **核心方法**: 
  1) Video-to-Sim重建：从视频提取物体网格和位姿序列，并将其转换到静态物体坐标系下，实现视角和实体无关的轨迹表达。
  2) 残差轨迹迁移：将演示运动分解为起点到终点的基线（线性插值+SLERP）和残差。对新物体位姿构建新基线并叠加原残差，实现轻量级轨迹增强。
  3) 3D辅助监督策略学习：在ACT中增加可学习token和辅助头，训练时预测当前帧任务相关物体的完整点云，部署时仅用RGB。
- **关键细节**: 
  - 输入为单目RGB视频，输出为机器人末端执行器动作序列。
  - 使用SAM2分割物体，SAM 3D重建初始网格，MoGe-3估计深度并对齐尺度，FoundationPose估计6-DoF位姿。
  - 策略模型为ACT加上点云预测辅助头。
  - 仿真与训练在单张RTX 5090上进行，使用Isaac Sim，相机分辨率480x640。
- **训练/优化目标**: 联合优化ACT的动作预测损失和基于Chamfer距离的点云预测辅助损失：$\mathcal{L} = \mathcal{L}_{\mathrm{ACT}} + \lambda_{\mathrm{pc}} [d(\hat{\mathbf{c}}_t, \mathbf{c}_t) + d(\mathbf{c}_t, \hat{\mathbf{c}}_t)]$，其中$d$为双向最近邻距离。

**3. 实验结果**
- **实验设置**: 
  - 视频源：自采视频、PH2D（人类视频）、Wan2.2（生成视频）、BridgeData V2/DreamDojo/UMI（互联网机器人视频）。
  - 机器人实体：KUKA iiwa 14配Robotiq夹爪（仿真+真机），以及配Inspire RH56E2灵巧手（仿真）。
  - Baseline：标准ACT（2D）、ACT_Pose（位姿辅助监督）、轨迹插值（Real2Render2Real）、分段技能重放（DemoGen）。
- **评价指标**: 视频转换成功率、仿真与真机任务成功率、点云预测Chamfer距离、轨迹形状保留度（Demo-Shape RMSE）、动作平滑度（Jerk RMS）。
- **主要结果**: 
  - 视频转换：自采视频成功率100%，互联网人类视频70%，互联网机器人视频68%，生成视频45%。尺度对齐对位姿跟踪至关重要。
  - 3D监督优势：ACT_3D比标准ACT在真机成功率平均提升9.5%；在未见场景中，仿真和真机成功率分别比ACT提升12.50%和14.17%，比ACT_Pose提升11.75%和11.67%。点云预测Chamfer距离稳定在$1\times10^{-4}$至$4\times10^{-4} \mathrm{m}^2$。
  - 残差迁移优势：数据生成成功率达93.95%（插值48.63%，重放56.15%）；Demo-Shape RMSE最低（0.068）；下游策略仿真成功率最高（89.5%）。
  - 零样本部署与泛化：仅用200条合成数据训练的策略，在4个任务中成功零样本部署到真机；在灵巧手仿真任务中，Cup Stacking和Ketchup Pouring的成功率分别达到67.5%和77.5%。

### 14. 🔥 [LexiconVLA: Learning Reusable Atomic Action Codebooks for Unseen Tasks] (LexiconVLA：学习可复用的原子动作码本以应对未见任务)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36774` | [点击跳转](https://arxiv.org/abs/2609.36774)

**0. 论文标题**
- **英文标题**: LexiconVLA: Learning Reusable Atomic Action Codebooks for Unseen Tasks
- **中文标题**: LexiconVLA：学习可复用的原子动作码本以应对未见任务
- **研究机构**: 原文未提及
- **一句话总结**: 提出 LexiconVLA，通过构建与视觉状态变化对齐的原子动作码本，让 VLA 模型在推理时动态检索并重组原子动作，从而大幅提升在未见任务上的泛化与失败恢复能力。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在未见操作任务（unseen manipulation tasks）上的跨任务泛化能力。
- **研究动机**: 现有 VLA 模型在完整任务上成功率高，但诊断实验发现其 constituent atomic actions（组成原子动作）无法被可靠地独立执行（完整任务成功率高达 95.7%，但单独执行原子动作掉到 28.5%）。现有方法缺乏原子级别的显式表示，导致策略只能隐式记忆轨迹，无法灵活重组基础动作来解决新任务。
- **本质改动**: 摒弃端到端策略隐式学习动作的做法，显式学习一个包含全局和细节特征的“原子动作码本”，并在推理时通过规划器和适配器动态检索码本中的动作代码（codes），以此来条件化（condition）共享的 VLA 策略。
- **技术溯源**: 策略骨干基于多种 VLA 模型（如 BridgeVLA、PerAct、RVT 等）；视觉特征提取基于 DINOv2；向量量化采用 NSVQ（Noise Substitution in Vector Quantization，用噪声扰动替代 STE 实现可导）；轨迹重建采用 Conditional Flow Matching（条件流匹配）。

**2. 技术拆解**
- **核心方法**: 
  1) 构建 AtomAction Dataset 提供原子级监督；
  2) 训练 Vector-Quantized Atomic Action Model (VQAA) 学习全局和细节码本，并通过 Visual-Atomic Action Alignment (V3A) 将动作代码与视觉状态变化对齐；
  3) 部署时，VLM 规划器将任务分解为原子子任务，场景感知适配器根据当前观察检索对应的动作代码，引导共享策略执行。
- **关键细节**: 
  - **数据集**: AtomAction Dataset，包含来自 69 个任务的 57,803 个原子动作片段（基于 RLBench），每个片段包含轨迹、边界观察和文本描述。
  - **码本结构**: 全局码本（Global codebook）通过池化总结片段的交互结构；细节码本（Detail codebook）通过可学习查询（learnable queries）提取细粒度的执行变化，两者结合保留复用模式与执行细节。
  - **推理架构**: 码本和适配器在推理时冻结。规划器支持 NEXT（推进）、CONTINUE（继续）、RETRY（重试/失败恢复）和 REPLAN（重规划）四种调度技能。
- **训练/优化目标**: VQAA 的联合损失函数，包含三部分：1) 基于条件流匹配的轨迹重建损失（位置、旋转、夹爪状态）；2) 视觉动作对齐损失（从首尾帧视觉变化重建动作，监督 DINOv2 提取动作相关特征）；3) 全局码条件化的视觉预测损失（基于初始帧和全局码预测最终帧特征，将动作代码与环境状态变化绑定）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**: RLBench 环境，18 个 seen tasks 和 8 个 policy-unseen tasks。对比基线包括 Act3D、3D Diffuser Actor、SAM2Act、PerAct、RVT、RVT-2、BridgeVLA++ 和 BridgeVLA。
  - **真机**: 5 个任务（3 个有仿真对应，2 个纯真机），包含 Standard 和 Generalization（引入干扰物、高度变化、新类别、新指令）设置。对比基线为 BridgeVLA 和 $\pi_{0.5}$。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - **仿真**: 在 5 个策略骨干上均提升了未见任务和整体成功率。以 BridgeVLA 为例，未见任务成功率从 16.67% 大幅提升至 34.17%（+17.50%），整体成功率达到 71.08%（所有方法中最高），且基本保持了已见任务的性能（89.78% 微降至 87.48%）。
  - **消融实验**: 移除 Planner、Codebooks（全局/细节）或 V3A 均会导致未见任务成功率显著下降（降至 26.00%-29.50%），证明了子任务分解、码本结构和视觉对齐的必要性。
  - **真机**: Standard 设置下平均成功率达 62.0%（BridgeVLA 为 26.0%，$\pi_{0.5}$ 为 28.0%）；在 Generalization 扰动设置下仍保持 56.0% 的成功率（基线跌至 12.0%-16.0%），并展示了基于视觉反馈的失败恢复（RETRY）能力。

### 15. 🔥 [EVO-WAM: Evolving World Action Models through Video-Action Verification] (EVO-WAM：通过视频-动作验证进化世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.38057` | [点击跳转](https://arxiv.org/abs/2609.38057)

**0. 论文标题**
- **英文标题**: EVO-WAM: Evolving World Action Models through Video-Action Verification
- **中文标题**: EVO-WAM：通过视频-动作验证进化世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 EVO-WAM 框架，通过视觉语言模型（VLM）和逆动力学模型（IDM）对世界动作模型（WAM）自身生成的视频-动作轨迹进行双重验证与迭代自训练，在无额外专家演示和外部环境执行反馈的前提下，大幅提升机器人对未见任务的成功率。

**1. 整体逻辑**
- **研究任务**: 在不收集额外专家演示（expert demonstrations）且不在外部环境中执行动作的情况下，让机器人策略（世界动作模型）适应并掌握未见任务（unseen tasks）。
- **研究动机**: 现有的世界动作模型（WAMs）能利用视频先验联合预测未来视频和动作，但生成的视频可能无法完成任务；且即使视频看似成功，配对的動作也可能与视频不一致导致执行失败。现有方法依赖外部世界模型或任务演示，未能充分利用 WAM 自身生成的视频先验作为监督信号。
- **本质改动**: 不依赖外部环境交互或额外专家数据，而是让 WAM 通过“视频-动作双重验证”（VLM 验证任务完成度 + IDM 验证视频动作一致性）筛选自身生成的高质量轨迹前缀（prefixes），并进行迭代自训练（Self-Training）。
- **技术溯源**: 基于世界动作模型（WAMs），具体使用 Cosmos3 和 DreamZero 作为基座模型；验证阶段使用了视觉语言模型（VLM，如 Qwen3.8-Flash-Next / Qwen3.5-27B）和基于 Wan2.2 预训练权重微调的逆动力学模型（IDM）。

**2. 技术拆解**
- **核心方法**: 
  1. **自回归轨迹生成**：引入状态预测和锚定多帧上下文（初始单帧作为锚点 + 最近生成的 $m$ 帧），使 WAM 能在无外部环境反馈下自回归生成完整的视频-动作-状态轨迹。
  2. **视频-动作双重验证**：
     - *任务完成度验证*：用 VLM 对生成的视频进行“先描述后判断”的时序扫描，确认是否达成子目标。
     - *视频-动作一致性验证*：用 IDM 根据生成的视频重建动作，计算重建动作与 WAM 生成动作的均方误差（MSE），低于阈值则视为一致。
  3. **迭代自训练**：将验证通过的轨迹前缀与原始训练数据混合，对 WAM 进行监督微调（SFT），更新后的模型继续生成新轨迹，循环迭代。
- **关键细节**: 
  - *输入输出*：输入为初始观察、机器人状态和任务指令；输出为未来视频块、动作块和结束状态。
  - *模型结构*：IDM 基于 Wan2.2 修改，保留视频条件，移除视频去噪分支，参数量约 0.9B。
  - *验证机制*：VLM 采用 3 次投票制（至少 2 次 Accept）；IDM 计算归一化动作空间下的 MSE，阈值 $\eta$ 通过离线数据分位数（如 P90/P99）校准。
  - *规模与超参*：自训练进行 4 轮。仿真每轮生成 2800 个候选，训练 1000 步（Batch size 256）；真机每轮生成 800 个候选，训练 500 步。
- **训练/优化目标**: 
  - WAM 的优化目标为自回归预测视频、动作和状态的监督微调损失（SFT loss）。
  - IDM 的训练目标为动作流匹配损失（Action flow-matching loss），用于从视频中准确重建动作。

**3. 实验结果**
- **实验设置**: 
  - *仿真*：使用 RoboTwin 2.0 数据集，43 个任务用于基座训练，7 个未见任务用于自训练和评估。对比基线包括 $\pi_{0.5}$、LingBot-VLA、StarVLA-OFT、Fast-WAM、LingBot-VA、DreamZero、Cosmos3。
  - *真机*：使用 Franka 机器人，评估 3 个未见长视野复合任务（Stack Bowls, Place Ducks, Load the Air Fryer）。对比基线为 $\pi_{0.5}$、DreamZero、Cosmos3。
- **评价指标**: 任务成功率（Success rates, %）。
- **主要结果**: 
  - *仿真*：EVO-WAM Cosmos3 在 7 个未见任务上的平均成功率从 26.9% 提升至 68.0%（基线 Cosmos3 为 31.6%）；EVO-WAM DreamZero 从 28.5% 提升至 46.4%（基线 27.2%）。
  - *真机*：EVO-WAM Cosmos3 在 3 个未见复合任务上的平均成功率从 20.0% 大幅提升至 76.7%（提升 56.7 个百分点），在堆叠碗、放置鸭子、装载空气炸锅等任务上分别超越最强基线 20、50、80 个百分点。
  - *消融与泛化*：VLM+IDM 双重验证（68.0%）显著优于仅用 VLM（43.7%），且接近需要仿真器执行的 VLM+Simulator（72.7%）。模型对新场景泛化良好（70.4% vs 24.9%），且几乎不损失已见任务的性能（84.8% vs 85.8%）。

### 16. 🔥 [Staircase Policy: Streaming Inference for World-Action Models with Large Action Chunks] (阶梯策略：面向大动作块世界-动作模型的流式推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36471` | [点击跳转](https://arxiv.org/abs/2609.36471)

**0. 论文标题**
- **英文标题**: Staircase Policy: Streaming Inference for World-Action Models with Large Action Chunks
- **中文标题**: 阶梯策略：面向大动作块世界-动作模型的流式推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出Staircase Policy，通过流式交错去噪和观测条件刷新机制，使大动作块VLA模型能边生成边执行并持续修正后续动作，在保持长horizon控制精度的同时大幅提升推理吞吐并降低首动作延迟。

**1. 整体逻辑**
- **研究任务**: 加速视觉-语言-动作（VLA）模型（特别是World-Action Models, WAMs）的推理过程，解决长动作块（large action chunks）执行时因初始观测过时导致的性能衰减问题。
- **研究动机**: WAMs引入未来预测会增加推理开销。虽然动作分块（action chunking）能分摊推理成本，但实际部署中只能执行一小部分动作（如10-20个），因为随着执行时间推移，后续动作基于的初始观测会变得过时（stale），导致累积误差和性能断崖式下降。单纯增加生成的动作块长度无法提高有效吞吐量。
- **本质改动**: 将大动作块拆分为多个子块（sub-chunks）进行交错（staggered）去噪，实现“边生成边执行”，并在每个子块边界利用最新观测刷新未来潜在表示（future latent），持续修正未执行的动作。
- **技术溯源**: 基于 Flow-matching VLA（如 LaWAM, $\pi_{0.5}$, FLOWER）和 JEPA-style WAMs（在潜在空间而非像素空间预测未来观测）。

**2. 技术拆解**
- **核心方法**: Staircase Policy（阶梯策略）。将长度为 $H$ 的动作块分为 $K$ 个大小为 $G$ 的子块。推理时不一次性去噪完整个块，而是每进行一步去噪（Euler step），就外推（extrapolate）并输出一个子块给控制器执行。同时，利用执行期间获取的新观测，通过轻量级未来预测器重新计算条件，更新剩余未执行动作的去噪过程。
- **关键细节**: 
  - **输入输出**：输入为当前观测 $o$ 和指令 $\ell$，输出为连续动作块。
  - **模型结构**：主骨干网络（如2.3B的LaWAM）提取语义上下文和潜在计划；轻量级未来预测器（冻结视觉编码器+解码器）预测未来观测的潜在表示 $f$；Flow-matching DiT 专家进行动作去噪。
  - **规模与超参**：默认总动作块 $H=50$，子块数 $K=5$，子块大小 $G=10$。每个子块边界刷新一次未来预测，重骨干网络仅推理一次，轻量级预测器推理 $K$ 次。
- **训练/优化目标**: 采用与推理时相同的流式调度（streaming schedule）进行训练。优化目标包括动作损失（对已执行位置全权重，未执行位置低权重 $\lambda_{ne}=0.25$）和未来潜在预测损失（MSE）。总损失为 $\mathcal{L} = \mathcal{L}_{act} + \beta(\mathcal{L}_f + \mathcal{L}_z)$，其中 $\beta=0.1$。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真基准（LIBERO, LIBERO-Plus, DOMINO）和9个真机任务（包含静态和动态场景，如旋转桌面）。
  - **对比对象（baseline）**：Vanilla执行策略（固定执行horizon $H_{exec}=10$ 或 $50$），多个开源VLA策略（如OpenVLA, $\pi_0$, FLOWER等），以及紧凑型VLA（TurboVLA, VLA-Adapter, Evo-1）。
- **评价指标**: 成功率（Success Rate, SR）、执行动作吞吐量（executed actions per second, Act/s）、首动作延迟（Time-to-first-action, TTFA）。
- **主要结果**: 
  - **仿真表现**：在 LIBERO 上达到 97.7% SR，在 LIBERO-Plus 上达到 87.9% SR（比 Vanilla $H_{exec}=50$ 提升 17.3 个点），证明了长horizon下的鲁棒性。
  - **推理速度**：吞吐量达到 292.7 actions/s（是 Vanilla $H_{exec}=10$ 的 3.62 倍），TTFA 从 123.6 ms 降至 73.3 ms。加入 CUDA Graph 和 Prompt Cache 后，吞吐量进一步提升至 642.9 actions/s，TTFA 降至 48.6 ms。
  - **真机表现**：在动态任务中，Vanilla $H_{exec}=20$ 仅 10.8% 成功率，S-WAM 达到 44.2%，有效克服了长horizon下的预测漂移。
  - **额外发现**：未来预测误差（$\delta_j$）可作为自适应分块（adaptive chunking）的信号，在吞吐量和成功率之间取得更优平衡。

### 17. 🔥 [Rethinking Representations for World-Action Modeling] (重新思考世界-动作模型的表示)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.38163` | [点击跳转](https://arxiv.org/abs/2609.38163)

**0. 论文标题**
- **英文标题**: Rethinking Representations for World-Action Modeling
- **中文标题**: 重新思考世界-动作模型的表示
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出 ReWAM，通过校准预训练 DINO 特征并引入非对称梯度路由，让动作目标直接塑造世界模型的潜在表示，在不依赖视频生成预训练的情况下实现了高效的机器人控制与预测。

**1. 整体逻辑**
- **研究任务**: 联合学习机器人控制策略与预测未来观测的世界模型（World-Action Modeling, WAM）。
- **研究动机**: 现有 WAM 多依赖视频生成模型（如 Video-VAE），其潜在空间优化目标是视觉重建，保留了外观细节但缺乏控制所需的关键信息。实验表明，单纯的像素重建保真度或未经处理的预训练感知特征（如原始 DINO）都不足以支撑高效的策略学习。
- **本质改动**: 重新设计 WAM 的表示空间，解耦表示的塑造与演化：由动作损失（策略目标）来决定表示空间编码什么，而世界模型损失只负责学习该表示如何随时间演化。
- **技术溯源**: 基于预训练的 DINOv3 视觉特征、Flow Matching（流匹配）训练范式，以及参考 Fast-WAM 的 Mixture-of-Transformers (MoT) 架构。

**2. 技术拆解**
- **核心方法**: 提出 ReWAM (Representation-centric WAM)，包含三个核心模块：特征校准（Feature Calibration）、时序表示瓶颈（TRB）和基于动作的表示塑造（AGRS）。
- **关键细节**: 
  - 输入多视角图像、本体感觉和语言指令，输出动作块。
  - 视觉编码器使用冻结的 DINOv3-L，通过多层聚合和归一化进行特征校准。
  - TRB 将逐帧特征通过时空分块和自注意力机制压缩为紧凑的 128 维世界状态。
  - 骨干网络为 MoT 架构，包含世界分支和动作分支的 DiT（各 30 层，总参数约 3.58B）。推理时世界分支仅处理当前状态以提供条件，不实际生成未来帧。
- **训练/优化目标**: 
  - 采用线性流匹配（Flow Matching）计算世界预测损失和动作预测损失。
  - 核心机制 AGRS 采用非对称梯度路由：世界损失和动作损失的梯度共同更新 DiT 参数；但只有动作损失的梯度能回传更新 TRB 参数，世界损失的梯度在表示层被截断（stop-gradient），防止世界模型为了好预测而破坏表示的控制效用。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboTwin 2.0（50 个任务，含 clean 和 random 设置）、RoboDojo（5 个能力维度），以及真实双臂 Piper 机器人平台（3 个任务）。
  - 对比基线：Fast-WAM, $\pi_0$, $\pi_{0.5}$, LDA-1B, HyVLA-0.5 等十余种方法。
  - 具身预训练数据：约 600 小时的真实机器人操作演示。
- **评价指标**: RoboTwin 2.0 的平均成功率（%）；RoboDojo 的平均得分（Average Score）和成功率（SR）；真实机器人的任务成功率。
- **主要结果**: 
  - 在 RoboTwin 2.0 上，无具身预训练的 ReWAM 在 clean 和 random 设置下均达到 93.6% 成功率，优于或持平最强基线。
  - 在 RoboDojo 上，无预训练时平均得分 9.42（领先基线）；加入 600 小时预训练后，得分提升至 12.29，成功率 8.28%，在泛化和长程任务上表现最佳。
  - 真实机器人测试中，ReWAM 平均成功率 91.7%，比 Fast-WAM（80.0%）提升显著，尤其在折叠衣服等复杂任务上优势明显。
  - 消融实验证实：重建保真度不等于控制效用；特征校准带来 12.2% 的提升；AGRS 使得表示在更低维度（128 维）下仍能保持极高的动作相关性。

### 18. 🔥 [FineART: Fine-Grained Annotated Robotic Trajectory Dataset and Vision-Language-Action Model for Bimanual Manipulation] (FineART：用于双臂操作的细粒度标注机器人轨迹数据集与视觉-语言-动作模型)
- **研究机构**: `Scale AI, Hugging Face`
- **Arxiv ID**: `2609.36416` | [点击跳转](https://arxiv.org/abs/2609.36416)

**0. 论文标题**
- **英文标题**: FineART: Fine-Grained Annotated Robotic Trajectory Dataset and Vision-Language-Action Model for Bimanual Manipulation
- **中文标题**: FineART：用于双臂操作的细粒度标注机器人轨迹数据集与视觉-语言-动作模型
- **研究机构**: Scale AI, Hugging Face
- **一句话总结**: 构建了目前最大的带密集子任务标注的双臂操作数据集 FineART，并提出了一种能在单一端到端 VLA 模型中通过预测子任务来引导长视野动作执行的训练与推理范式。

**1. 整体逻辑**
- **研究任务**: 解决双臂机器人在长视野（long-horizon）复杂任务中的指令跟随与子任务规划问题。
- **研究动机**: 现有的单臂数据集缺乏长视野和子任务标注；现有的双臂数据集要么标注不全，要么缺乏密集的子任务边界。扁平的 VLA 模型无法跟踪多分钟任务的进度，而传统的分层方法需要拆分两个独立的模型。目前缺乏一个能在单一端到端策略中进行持久、密集子任务训练的数据集和模型组合。
- **本质改动**: 在单一端到端 VLA 模型中引入“System-2 子任务预测 + System-1 连续动作执行”的联合训练，并利用知识隔离（Knowledge Insulation）防止连续动作的梯度破坏预训练 VLM 的语义表征。
- **技术溯源**: 基于 LeRobot 开源的 $\pi_{0.5}$ VLA 基座，结合 Gemma-2B（语言骨干）、SigLIP（视觉编码器）和 300M 参数的 Gemma-style action expert。

**2. 技术拆解**
- **核心方法**: 
  1. 构建 FineART 数据集：包含 4万+ episode，1718 小时，提供 100% 覆盖的密集子任务（subtask）自由文本标注，涵盖基础操作与接触丰富的长尾操作（如柔性物体、工具使用、精密插入）。
  2. FineART-VLA 模型架构与训练：模型同时输出下一个子任务（文本）、离散动作（FAST-token）和连续动作 chunk（Flow-matching）。训练时采用任务平衡采样（task-balanced sampling），并引入知识隔离（KI）机制。
- **关键细节**: 
  - 输入：3个相机视图（鸟瞰、双腕，224×224）和 14维双臂关节/夹爪状态。
  - 输出：子任务文本、FAST-token 序列、50步的连续动作 chunk（14维）。
  - 知识隔离（KI）：Action expert 在注意力机制中只读取 Backbone 的 stop-gradient 版本的 K 和 V，确保 $\nabla_{\theta_{VLM}} \mathcal{L}_{flow} = 0$，从而保护 VLM 预训练知识不被动作损失破坏。
  - 推理模式：支持扁平（Flat，直接给动作）、分层（Hierarchical，模型自己生成子任务）和交互式（Interactive，人类给子任务）三种模式。
- **训练/优化目标**: 联合损失函数 $\mathcal{L} = 10\mathcal{L}_{flow} + 1\mathcal{L}_{fast} + 1\mathcal{L}_{text}$。其中 $\mathcal{L}_{flow}$ 是连续动作的 flow-matching L2 损失，$\mathcal{L}_{fast}$ 和 $\mathcal{L}_{text}$ 是离散动作和子任务文本的 next-token 交叉熵损失。

**3. 实验结果**
- **实验设置**: 
  - 同实体评估（ALOHA）：对比 subtask training 和 KI 的 2×2 消融实验。评估任务分为分布内（ID）、部分分布内（Partial ID）和分布外（OOD）。还做了去除长尾数据的消融。
  - 跨实体评估（YAM）：在 ALOHA 上 mid-train 后，在 YAM 机器人上微调（10 到 250 个 episode/task）。对比无 mid-train、ABC 数据集 mid-train、MolmoAct2 数据集 mid-train。
- **评价指标**: 成功率（Success Rate, SR）和进度率（Progress Rate, PR，即完成子任务的比例）。
- **主要结果**: 
  - 空间指令跟随：密集子任务训练将空间消歧任务（如放入左/中/右 bins）的成功率从 32.0% 提升至 100.0%。
  - 长视野任务：在人类提供子任务指导的情况下，长视野任务（prepare breakfast）成功率从 16.0% 提升至 76.0%。
  - 长尾数据作用：去除长尾接触丰富数据后，整体成功率从 24.7% 降至 14.0%，证明长尾数据对泛化至关重要。
  - 跨实体迁移（数据效率）：FineART mid-training 使 YAM 上的微调数据需求降至 baseline 的 1/10（25 个 episode/task 达到 26.4% SR，而无 mid-train 需 250 个 episode/task 才达到 18.4%）。
  - 跨实体零样本泛化：在 YAM 上仅微调 5 个基础任务后，模型在未见过的长视野任务（如 prepare breakfast）上达到 28.0% SR，在带干扰物的任务（put cable into bin）上达到 60.0% SR。

### 19. 🔥 [Cooperative Multi-Agent Vision-Language-Action Models via Reinforced Fine Tuning] (基于强化微调的协作多智能体视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36588` | [点击跳转](https://arxiv.org/abs/2609.36588)

**0. 论文标题**
- **英文标题**: Cooperative Multi-Agent Vision-Language-Action Models via Reinforced Fine Tuning
- **中文标题**: 基于强化微调的协作多智能体视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套专为多智能体VLA设计的三阶段强化微调（RFT）流程，通过按需收集数据、离线信用过滤和在线潜空间RL，解决了多智能体协作中细粒度控制难、信用分配乱以及常规在线RL易崩溃的问题。

**1. 整体逻辑**
- **研究任务**: 提升多智能体视觉-语言-动作（VLA）模型在机器人协作任务（如双臂/多臂协同操作）中的细粒度低层控制与协同能力。
- **研究动机**: 现有VLA主要在单智能体数据上预训练，缺乏多智能体协作所需的细粒度协调技能；现有的监督微调（SFT）性能受限于演示数据上限；而直接将现有的单智能体在线RL方法（如基于Flow-matching的RL）应用到多智能体VLA时，会因“嘈杂的协同探索（noisy co-exploration）”和“不稳定的策略更新”导致训练崩溃或失效。
- **本质改动**: 设计了一套三阶段强化微调管线，在数据端按需引入人类演示保底，在离线端通过优势分解解决多智能体信用分配问题，在在线端通过冻结VLA并在潜噪声空间进行RL来规避动作空间探索的崩溃问题。
- **技术溯源**: 基于 $\pi_0$ 和 $\pi_{0.5}$ 等 Flow-matching VLA 基座模型，结合了多智能体强化学习（MARL）中的多智能体优势分解引理，以及 DSRL（潜空间强化学习）算法。

**2. 技术拆解**
- **核心方法**: 三阶段强化微调（RFT）管线：1) 初始化感知数据收集；2) 离线信用过滤微调；3) 在线潜空间强化学习。
- **关键细节**: 
  - **阶段一（数据收集）**：遍历环境初始配置，若预训练VLA在某配置下成功率为0，则仅在此类配置下收集人类演示，否则收集自主探索的成功/失败轨迹。以此最小化人力成本，并保证后续RL有正奖励信号起步。
  - **阶段二（离线微调）**：利用多智能体优势分解引理，训练一个共享的Critic网络计算每个智能体的个体优势（Advantage）。过滤出个体优势大于0的轨迹，仅用这些正优势数据对VLA进行微调，避免联合轨迹中“一荣俱荣一损俱损”的错误信用分配。
  - **阶段三（在线微调）**：冻结离线微调后的VLA权重，引入小型网络学习 Flow-matching 的初始潜噪声（latent noise）。在潜噪声空间使用 DSRL 算法进行在线RL，避免在原始动作空间加噪破坏协同，同时规避计算 Flow-matching 边缘似然的困难。
- **训练/优化目标**: 
  - 离线阶段：最小化条件 Flow-matching 损失（$\mathcal{L}_{FM}$），但仅在过滤后的正优势数据集上进行。
  - 在线阶段：在潜噪声空间使用 DSRL 进行策略梯度优化，最大化累积奖励（包含步骤惩罚和任务成功/失败的稀疏奖励）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：RoboTwin（4个双臂任务）、RoboFactory（4个3-4臂任务）以及真实世界（3个双臂Franka机器人任务），共11个任务。
  - **对比对象（Baseline）**：SFT方法 CHORUS；在线RL方法 Flow-SDE 和 Flow-Noise。
  - **基座模型**：$\pi_0$ 和 $\pi_{0.5}$。
- **评价指标**: 任务平均成功率（Success Rate, %）。
- **主要结果**: 
  - 相比 Baseline（CHORUS），多智能体VLA在 RoboTwin、RoboFactory 和真实世界任务上的平均成功率分别提升了 +23.1%、+16.4% 和 +44%。

### 20. 🔥 [Bilinear World Models: Learning Representations with Structured Dynamics for Efficient Control] (双线性世界模型：学习具有结构化动态的表征以实现高效控制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36305` | [点击跳转](https://arxiv.org/abs/2609.36305)

**0. 论文标题**
- **英文标题**: Bilinear World Models: Learning Representations with Structured Dynamics for Efficient Control
- **中文标题**: 双线性世界模型：学习具有结构化动态的表征以实现高效控制
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种将潜在动态限制为双线性参数化的JEPA风格世界模型，通过结构化设计防止表征坍塌，并利用基于梯度的规划器将控制规划时间缩短了三个数量级，同时保持或提升了控制精度。

**1. 整体逻辑**
- **研究任务**: 从高维观测（如图像）中联合学习潜在表征和动态模型，用于下游的机器人规划和控制任务。
- **研究动机**: 现有的JEPA风格世界模型通常用无约束的神经网络来建模潜在动态，这不仅容易导致表征坍塌（即编码器和动态预测器退化为常数表征），而且在规划时只能依赖计算昂贵的零阶采样方法（如CEM），导致规划效率极低，无法胜任长时域或实时控制。
- **本质改动**: 放弃用无约束的神经网络预测潜在动态，将其严格限制为双线性参数化形式。这种结构化设计把建模负担转移给编码器，迫使编码器学到能暴露系统可控几何结构的表征，并从结构上保证了动作的可恢复性，从而从根本上防止表征坍塌。
- **技术溯源**: 基于JEPA（联合嵌入预测架构）风格的世界模型框架，结合了Koopman算子理论（用于证明非线性系统存在双线性嵌入）以及经典控制理论中的双线性动力系统。

**2. 技术拆解**
- **核心方法**: 
  1. **结构化表征学习**：将潜在动态建模为 $z_{t+1} = A z_t + M(z_t) a_t$，其中 $M(z_t)$ 采用双线性参数化 $B + C z_t$。为了保证 $M(z_t)$ 满秩（确保动作可恢复），引入Cholesky-QR分解进行归一化，得到 $M(z) = Q(z)R$，其中 $Q(z)$ 是正交矩阵，$R$ 是学习的状态无关矩阵。
  2. **高效规划控制**：利用结构化动态的显式可微性，计算终点状态对动作序列的雅可比矩阵，使用高斯-牛顿（Gauss-Newton）规划器替代传统的CEM采样方法，直接在潜在空间进行基于梯度的优化。
- **关键细节**: 
  - **模型结构**：编码器采用ViT-Tiny（5M参数），将观测映射到192维潜在空间；动态预测器仅由四个矩阵 $A, B, C, R$ 参数化。
  - **规划器设计**：使用降维的动作空间（coherent subspace）改善高斯-牛顿系统的条件数；使用方向有限差分估计雅可比矩阵；加入阻尼和回溯线搜索。对于接触丰富的环境，额外训练了一个辅助残差模型来修正规划时的预测误差。
- **训练/优化目标**: 
  - **训练目标**：最小化归一化双线性动态的潜在前向预测误差，同时加入动作恢复的正则化项（鼓励从潜在状态转移中恢复出原始动作），作为满秩条件的代理优化目标。
  - **规划目标**：最小化预测终点状态与目标状态的误差，加上动作幅值的L2正则化项。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：使用LeWM基准测试套件，包含4个标准2D和3D控制任务：TwoRoom（2D导航）、PushT（2D接触操作）、Reacher（2D连续控制）、Cube（3D操作）。此外，引入了目标随机游走的移动目标（moving-goal）变体任务用于评估实时控制。
  - **对比对象（baseline）**：LeWM 和 Sensorimotor World Models (SMWM)。
- **评价指标**: 
  - **成功率（Success Rate）**：100个评估回合中成功完成任务的百分比。
  - **规划时间（Planning time）**：控制器获取动作序列所需的总挂钟时间。
  - **平均加加速度（Average jerk）**：衡量连续动作变化的控制轨迹平滑度。
- **主要结果**: 
  - **控制性能**：在4个标准任务上匹配或提升了baseline的成功率（例如在Cube任务上成功率提升17个百分点，达到99%）。
  - **规划效率**：规划时间减少了近三个数量级，将baseline所需的几分钟到几十分钟（如@75时长达1.4小时）缩短至0.7-6.5秒。
  - **长时域与实时控制**：在目标偏移量增加（@25, @50, @75）的长时域任务中，性能下降更少；在20Hz控制频率的移动目标实时任务中，成功率比最强baseline高出约27个百分点。
  - **轨迹平滑度**：产生的动作序列加加速度更低，规划出的物理轨迹更平滑。

### 21. 🔥 [One from Infinity: Actualizing Futures from Pretrained World Models into Robot Actions] (从无限到唯一：将预训练世界模型中的未来转化为机器人动作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.36413` | [点击跳转](https://arxiv.org/abs/2609.36413)

**0. 论文标题**
- **英文标题**: One from Infinity: Actualizing Futures from Pretrained World Models into Robot Actions
- **中文标题**: 从无限到唯一：将预训练世界模型中的未来转化为机器人动作
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RoboActualizer，通过冻结预训练视频世界模型，仅训练一个 60M 参数的轻量级 Actualizer 来“选择”并“实现”任务特定的未来，以极低的算力和数据成本达到甚至超越大参数 VLA/WAM 基线的机器人控制性能。

**1. 整体逻辑**
- **研究任务**: 将预训练的视频世界模型转化为可执行的机器人策略（即根据视觉观测和文本指令输出连续的机器人控制动作）。
- **研究动机**: 现有方法要么在推理时做模型预测控制（MPC，需多次 rollout 导致控制频率低），要么微调整个庞大的世界模型骨干（WAMs/VLAs，需海量机器人数据和算力）。但预训练世界模型其实已经编码了场景动态和所有可能的未来（Prior），下游只需要“选择”特定任务对应的未来并“读取”动作，没必要重新学习动力学。
- **本质改动**: 将“学习场景动力学”降维成“在冻结的表征空间中进行任务条件化的选择与动作读取”，用一个极小的 Actualizer 模块替代了对庞大世界模型骨干的微调。
- **技术溯源**: V-JEPA 2.1（预训练视频世界模型/编码器）、DiT（Diffusion Transformers）、Flow Matching、UMT5（文本编码器）。

**2. 技术拆解**
- **核心方法**: 提出 RoboActualizer 框架。冻结 V-JEPA 2.1 视频编码器提取当前观测和历史帧的表征作为先验（Prior）。设计一个轻量级的 Actualizer（包含 Latent Expert 和 Action Expert 两个分支），通过 Flow Matching 联合预测任务条件化的未来潜在表征（Selection）和动作序列（Realization）。
- **关键细节**: 
  - **输入输出**: 输入为短序列 RGB 观测（如 4 帧）、文本指令、本体感受状态；输出为动作 chunk（如 16 步）及对应的未来 latent 目标。
  - **模型结构**: 冻结的 V-JEPA 2.1 (ViT-L/16, 300M) 作为编码器；Actualizer 为 DiT-S (60M 可训练参数)，采用 Mixture-of-Transformers (MoT) 架构。两个 Expert 通过共享的 self-attention 交互，各自通过 cross-attention 接收文本和本体感受条件。
  - **规模**: 可训练参数仅 60M（比现有 WAM/VLA 基线少 100 倍）。
  - **关键超参/设置**: 采用 clean-sample parameterization (x-prediction) 以适应窄网络；动作 chunk 长度 16，预测未来 4 个 latent 目标。
- **训练/优化目标**: 基于 Flow Matching 的联合预测损失。在速度空间（velocity space）计算 MSE 损失，包含动作预测损失和潜在未来表征预测损失（$\mathcal{L} = \mathcal{L}_a + \lambda_z \mathcal{L}_z$）。训练时完全在缓存的 V-JEPA latent 上进行，无需前向传播视频编码器。

**3. 实验结果**
- **实验设置**: 
  - **数据集/基准**: 仿真环境 LIBERO, LIBERO-Plus (分布外泛化), RoboTwin 2.0 (双臂)；真实环境 FANUC CRX-10iA (单臂) 和 Unitree G1 (双臂人形)。
  - **对比对象 (baseline)**: OpenVLA, $\pi_0$, $\pi_{0.5}$, UniVLA, Motus, WorldVLA, Fast-WAM, DC-WAM 等 VLA 和 WAM 模型。
- **评价指标**: 任务成功率 (Success Rates, %)，推理延迟 (Latency, ms)，可训练参数量，训练算力成本。
- **主要结果**: 
  - **性能**: 在 LIBERO 上达到 98.0% 平均成功率，超越参数量大 100 倍的 Fast-WAM (97.6%) 和 $\pi_{0.5}$ (96.9%)。在 RoboTwin 2.0 上达到 58.8%，大幅领先 Fast-WAM (41.9%) 和 $\pi_{0.5}$ (31.4%)。
  - **泛化**: 在 LIBERO-Plus 上达到 63.1%，优于 Fast-WAM 的 51.5%，证明冻结预训练表征保留了更好的鲁棒性，避免了微调带来的灾难性遗忘。
  - **成本与效率**: 仅需单张 32GB 显存 GPU 训练 15 小时（LIBERO 设置）；推理延迟仅 39.9 ms（>25Hz），满足实时控制需求，远快于其他基线。
  - **真实机器人**: 在 FANUC 和 Unitree G1 上的 5 个真实任务中，成功率均显著高于 Fast-WAM 和 $\pi_{0.5}$ 基线（例如 FANUC 的 Mug 任务 95% vs 10%）。

### 22. 🔥 [Direct Experience World-Model Optimization: Learning the World Beyond Action Imitation] (直接经验世界模型优化：超越动作模仿的世界学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37398` | [点击跳转](https://arxiv.org/abs/2609.37398)

**0. 论文标题**
- **英文标题**: Direct Experience World-Model Optimization: Learning the World Beyond Action Imitation
- **中文标题**: 直接经验世界模型优化：超越动作模仿的世界学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DEWO 方法，在灵巧操作的部署后学习中，利用成功与失败的视觉未来预测来联合优化世界模型与动作生成，并通过价值门控的无分类器引导（CFG）提升控制成功率。

**1. 整体逻辑**
- **研究任务**: 具身智能中世界-动作模型（WAMs）在灵巧操作任务中的部署后学习（post-deployment learning）与策略改进。
- **研究动机**: 现有的部署后学习（如动作模仿或基于价值的 RL）只关注改进动作行为，不要求提升世界预测能力。在灵巧操作中，微小的执行误差会在高维动作空间中累积，导致策略偏离训练分布（OOD），单纯的动作模仿无法纠正这些分布外的物理交互。
- **本质改动**: 将部署后的学习从“单纯的动作模仿”扩展为“世界模型与动作的联合优化”。不仅模仿成功动作，还利用成功和失败的视觉未来（visual futures）作为监督信号来更新世界表示，并在推理时通过价值头门控的 CFG 来干预动作生成。
- **技术溯源**: 基于 World-Action Models (WAMs) 架构（如 FastWAM, FACT），以及基于 Wan2.2 VideoDiT 和 ActionDiT 构建的混合 Transformer (MoT) 架构；推理引导借鉴了 Classifier-Free Guidance (CFG) 和 Flow-matching 机制。

**2. 技术拆解**
- **核心方法**: DEWO (Direct Experience World-Model Optimization) 框架，包含三个核心机制：
  1. **交互转折点探索**：在失败的部署轨迹中识别“交互转折点”，恢复环境状态并采样匹配的成功与失败延续轨迹（continuations）。
  2. **结果条件化世界模型学习**：成功轨迹同时提供视觉和动作监督，失败轨迹仅提供视觉监督（动作被 Mask），让模型学习相似上下文如何导向不同的物理未来。
  3. **进度门控动作引导**：训练一个价值头（Value head）估计任务进度，在推理时若检测到进度停滞，则激活 CFG 将动作生成引向成功条件。
- **关键细节**: 
  - **输入输出**：输入为头部和腕部 RGB 图像（拼接为 224×448），输出为动作序列（如预测 32 步，执行 24 步）及未来视觉帧。
  - **模型结构**：基于 VideoDiT 和 ActionDiT 的 MoT 架构，增加一个基于视频特征（3072 维）的价值头（经 MLP 输出标量）。
  - **关键超参**：CFG 引导尺度 $w=0.2$；价值停滞检测阈值 $\alpha=1.27$，监控窗口 $H=5$ 个重规划步。
- **训练/优化目标**: 
  - 视觉预测损失（Video prediction loss）和动作预测损失（Action prediction loss）。
  - 价值回归损失（Value regression loss，使用 Huber loss 预测折扣终端成功率）。
  - 失败轨迹的动作损失被 Mask，仅保留视觉和Value损失。
  - 推理时目标：$f_{guided} = f_{base} + g_j \cdot w \cdot (f_{+} - f_{base})$，其中 $g_j$ 为基于价值估计的门控信号。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：5 个 DexJoCo 灵巧操作任务（Water Plant 等）。对比基线：SFT, RECAP, DSRL。基座模型：$\pi_{0.5}$, FastWAM, FACT。
  - **真实世界**：Wuji 和 Sharpa 两款灵巧手，4 种物体（水瓶、胶带、橡皮擦、网球），3×3 空间网格评估（共 720 次试验/轮）。
- **评价指标**: 任务成功率（Success rate），以及离线验证集上的视频预测损失（Video prediction loss）。
- **主要结果**: 
  - **仿真表现**：DEWO 在 FastWAM 上平均成功率从 80.7% 提升至 82.3%，在 FACT 上从 64.5% 大幅提升至 81.2%（SFT 仅为 70.1%）。联合建模（Joint）架构受益最大。
  - **真机表现**：经过两轮部署学习，全网格平均成功率从 20.6% 提升至 28.9%；在初始至少有一次成功的格子中，成功率从 51.0% 提升至 71.7%（提升 20.7 个百分点），证明其有效增强了初始模型的空间泛化可靠性。
  - **消融结论**：引入失败轨迹的视觉监督使视频预测损失显著下降（如 Water Plant 下降 32.7%），并进一步提升控制成功率；基于价值门控的引导显著优于无引导或连续引导。

### 23. 🔥 [V-JEPA Policy: Building Effective World-Action Models on Predictive Visual Latents] (V-JEPA Policy：基于预测性视觉隐空间构建有效的世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.37250` | [点击跳转](https://arxiv.org/abs/2609.37250)

**0. 论文标题**
- **英文标题**: V-JEPA Policy: Building Effective World-Action Models on Predictive Visual Latents
- **中文标题**: V-JEPA Policy：基于预测性视觉隐空间构建有效的世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出 V-JEPA Policy，证明了无需继承完整的预训练视觉生成模型，仅利用冻结的 V-JEPA 预测性视觉隐空间从头联合训练预测器和动作专家，就能构建出高效且具备强泛化能力的世界-动作模型。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人模仿学习，具体是构建将未来视觉状态预测与动作生成耦合的世界-动作模型（WAMs）。
- **研究动机**: 现有的 WAM 大多通过微调大规模预训练的视觉生成模型（如视频生成或图像编辑模型）来获取预测先验，导致预测知识和生成骨干强绑定。作者想探究：是否必须继承一整个视觉生成模型？一个纯粹由大规模预测预训练诱导出的视觉隐空间，是否足以支撑有效的 WAM 学习？
- **本质改动**: 抛弃继承完整的视觉生成模型，改用冻结的 V-JEPA 2.1 编码器提供的预测性视觉隐空间作为基础，在这个隐空间上从头（from scratch）联合训练一个未来隐变量预测器和一个动作专家。
- **技术溯源**: V-JEPA 2.1（视觉编码器）、T5（文本编码器）、Vision Transformer、Flow Matching（流匹配）、Mixture-of-Transformers (MoT)。

**2. 技术拆解**
- **核心方法**: 
  1. 隐空间未来预测：用冻结的 V-JEPA 2.1 提取当前上下文和未来目标的隐变量。预测器采用 ViT 架构，加入交叉注意力接收指令和状态条件，通过双向自注意力联合处理上下文 token 和可学习的未来查询 token，单次前向传播预测未来隐变量。
  2. 预测与动作耦合（MoT架构）：预测器和基于流匹配的动作专家组成 MoT 架构。预测器深层产生的“包含未来信息的上下文 Key-Value 状态”作为接口，通过共享注意力机制条件化动作专家的动作生成。
- **关键细节**: 
  - 输入输出：输入多视角 RGB 图像、本体感觉状态和任务指令；输出连续动作块（action chunks）。
  - 模型规模：总参数 0.9B，可训练参数 0.6B（视觉编码器 0.3B 冻结，预测器 0.5B，动作专家 0.1B）。
  - 结构细节：预测器和动作专家均为 24 层 Transformer，隐藏维度分别为 1024 和 512，使用 3D RoPE 处理时空位置。
- **训练/优化目标**: 联合优化未来预测损失和动作生成损失。未来预测采用 L1 损失（预测未来 tubelet 的隐变量）；动作生成采用条件流匹配的 L2 损失。动作损失会反向传播通过上下文接口到预测器，使预测器的上下文状态同时受到未来预测和动作生成的监督。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：LIBERO（分布内多任务）、LIBERO-Plus（分布偏移鲁棒性）、RoboCasa-GR1（人形机器人桌面操作）、真实世界双臂平台（TianJi Marvin）。
  - 对比对象：OpenVLA-OFT, $\pi_0$, $\pi_{0.5}$, VLA-JEPA, PRTS, FastWAM, ImageWAM 等 WAM 和 VLA 基线；以及 DINOv2, WAN2.2 VAE, InternVideo3 等不同视觉基础。
- **评价指标**: 任务成功率（%）、推理延迟（ms）、峰值显存（GiB）。
- **主要结果**: 
  1. 基础性能：0.9B 参数的 V-JEPA Policy 在 LIBERO 达 97.25%，LIBERO-Plus 达 79.25%，RoboCasa-GR1 达 50.92%，真实世界双臂任务平均 45%。以较小的参数量达到了与更大 WAM 和 VLA 基线相当或更优的性能，处于参数-性能 Pareto 前沿。
  2. 视觉基础对比：在相同下游框架和训练预算下，V-JEPA 的预测性隐空间全面优于判别式（DINOv2/v3）、重建式（WAN2.2 VAE）和视频理解（InternVideo3）替代方案。在分布偏移（LIBERO-Plus）下优势显著扩大（例如比 DINOv2 高出 12.23%）。
  3. 知识迁移：在 DROID 视频-指令对上仅预训练预测器（无动作标签）再迁移到下游，可将 LIBERO-Plus 成功率从 79.25% 提升至 91.50%，真实世界平均成功率从 45% 提升至 80%，且效果超越了单纯增加下游训练计算量（60k steps 仅达 81.64%）。
  4. 部署效率：在 RTX 4090 上，峰值显存仅 4.66 GiB（比 FastWAM 降低 63.4%），平均延迟 178.17 ms，部署开销显著低于保留大型视觉生成骨干的 WAM。

### 24. 🔥 [Ego4WAM: What Matters When Scaling Egocentric Human Data for Robot Learning?] (Ego4WAM：在机器人学习中缩放第一人称人类数据时，哪些因素最关键？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.40341` | [点击跳转](https://arxiv.org/abs/2609.40341)

**0. 论文标题**
- **英文标题**: Ego4WAM: What Matters When Scaling Egocentric Human Data for Robot Learning?
- **中文标题**: Ego4WAM：在机器人学习中缩放第一人称人类数据时，哪些因素最关键？
- **研究机构**: 原文未提及
- **一句话总结**: 在统一的 World-Action Model 框架下，系统解耦并验证了第一人称人类数据的人机对齐度、数据时长、任务多样性、监督信号类型及使用策略对机器人闭环性能的具体影响，指出了单纯堆数据时长的局限性。

**1. 整体逻辑**
- **研究任务**: 探究在机器人学习中，如何有效缩放和利用第一人称（egocentric）人类数据来提升机器人策略的闭环执行性能。
- **研究动机**: 现有研究表明增加人类数据能带来收益，但通常只把“数据时长”作为唯一的缩放维度。这导致人机对齐度、任务多样性、监督信号类型等关键因素相互混淆，无法指导实际的数据收集、标注和训练流水线设计。
- **本质改动**: 固定模型骨干，将第一人称人类数据按监督质量构建为“数据金字塔”，通过控制变量法，系统解耦并量化了数据对齐度、时长、多样性、监督类型及训练阶段策略对下游机器人性能的真实影响。
- **技术溯源**: 基于 World-Action Models (WAMs)（如 FastWAM、OpenWAM），底层代码实现基于 StarVLA。

**2. 技术拆解**
- **核心方法**: 提出“第一人称数据金字塔”分层使用数据，设计统一的人机动作空间，并采用三阶段训练协议（纯视频预训练 -> 视频+动作中期训练 -> 机器人微调），结合不同的共享注意力机制进行世界建模与动作预测。
- **关键细节**: 
  - **数据金字塔**：按监督质量分为三层：机器人对齐的人类演示、多任务视频-动作数据、纯视频数据。
  - **统一动作空间**：将人类手部抽象为平行夹爪末端执行器（EEF）和夹爪开合度。双臂共 32D（每臂 6D关节 + 1D夹爪 + 9D EEF）。人类数据只监督共享的 9D EEF 和 1D 夹爪，缺失的机器人关节维度通过解析前向噪声策略（analytic forward-noise）在 Flow Matching 中处理。
  - **模型结构**：视频分支（世界建模）和动作分支（动作预测），通过共享注意力交互。对比了 Base 机制（动作只看当前视觉）和 Joint 机制（动作还能看预测的未来视觉）。
  - **数据规模**：视频预训练使用 15K 小时（12K 有效动作视频 + 3K 纯视频），中期训练使用 12K 小时人类数据 + 90 小时机器人数据。
- **训练/优化目标**: 使用条件 Flow Matching。世界建模分支优化未来视频帧的预测损失（$\mathcal{L}_{world}$），动作分支优化动作轨迹的预测损失（$\mathcal{L}_{action}$）。纯视频阶段只优化 $\mathcal{L}_{world}$，有动作标签阶段联合优化两者。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：真实机器人（双臂 Piper 机器人）任务（如 Place into the Basket, Fold Cloth 等）；RoboDojo 仿真基准。
  - **对比对象（Baseline）**：RoboDojo 榜单上的 Pi-0.5, Spatial Forcing, Hy-0.5-VLA, Meituan-0, Xiaomi-1, GalaxeaVLA-0.5, GPT-6-Astra, FastWAM, OpenWAM 等。
- **评价指标**: 真实机器人评估闭环执行的成功率（Success Rate）和归一化任务进度（Normalized Task Progress）；RoboDojo 评估 Progress Score 和 Success Rate（涵盖泛化、精度、长程等维度）。
- **主要结果**: 
  1. **对齐数据的作用**：对齐的人类演示能显著提升 OOD（物体和场景）泛化能力，并大幅减少目标机器人数据的需求（如从 300 条降至 100 条仍能恢复大部分性能），但不能完全替代机器人数据。
  2. **时长 vs 多样性**：两者是独立的缩放轴。增加固定任务的时长能提升泛化和长程能力；盲目增加任务多样性（引入长尾任务）反而会损害精度（Precision）。
  3. **纯视频的价值**：纯视频预训练能有效学习动力学先验，为后续动作学习打下基础，突破了必须有动作标签才能用数据的限制。
  4. **注意力机制的增益**：在拥有强视频预训练后，采用 Joint 共享注意力机制（动作预测关注未来视觉）比 Base 机制在 RoboDojo 上提升巨大（平均分从 14.13 提升至 20.29）。
  5. **最终性能**：Ego4WAM 仅用 0.1K 小时机器人数据和 15K 小时人类数据，在 RoboDojo 上取得 20.29 平均分和 14.35% 成功率，表现优于或媲美众多使用更多机器人数据的基线方法。

### 25. 🔥 [Dream4ACT: A Shared Visual Action Interface for Multi-Embodiment Video-Action Modeling] (Dream4ACT：一种用于多形态视频-动作建模的共享视觉动作接口)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.40153` | [点击跳转](https://arxiv.org/abs/2609.40153)

**0. 论文标题**
- **英文标题**: Dream4ACT: A Shared Visual Action Interface for Multi-Embodiment Video-Action Modeling
- **中文标题**: Dream4ACT：一种用于多形态视频-动作建模的共享视觉动作接口
- **研究机构**: 原文未提及
- **一句话总结**: 提出“动作视图”作为跨机器人形态的统一视觉接口，将关节构型渲染为多视角图像以复用视频生成模型，并通过免训练的URDF约束优化还原动作，实现了单一模型跨形态的闭环控制与视频预测。

**1. 整体逻辑**
- **研究任务**: 构建跨多种机器人形态（multi-embodiment）的视频-动作联合世界模型，支持前向动力学（预测未来观察）、逆向动力学（推断动作）和联合生成，用于机器人闭环操作和动作条件视频生成。
- **研究动机**: 关节空间动作向量缺乏图像空间结构，且在不同机器人形态间维度和语义不一致，难以直接利用视频生成模型的时空先验；而末端执行器可视化无法提供完整的关节构型信息，执行时仍需特定形态的逆解映射，容易出现奇异解或无解。
- **本质改动**: 将目标关节构型通过URDF正向运动学渲染为4个固定虚拟相机的“动作视图（action views）”，作为统一的视觉接口共享视频模型权重；推理时通过免训练的多视图几何匹配（URDF约束）直接恢复关节目标，免去了学习特定形态动作解码器的开销。
- **技术溯源**: Wan2.2 VAE（视频自编码器）、DiT（扩散Transformer）、Qwen3.5-VL 9B（冻结的视觉语言模型提取语义条件）。

**2. 技术拆解**
- **核心方法**: 
  1. **动作视图渲染**：利用URDF正向运动学，将当前和目标关节状态渲染为4个固定虚拟视角的图像，统一不同形态的动作空间维度。
  2. **联合扩散建模**：RGB观察和4路动作视图分别通过共享的Wan2.2 VAE编码，加入模态和视角嵌入后，输入DiT进行掩码流匹配（Masked Flow Matching），通过控制掩码策略实现前向/逆向/联合生成。
  3. **免训练动作恢复**：对预测的动作视图进行二值化和膨胀，计算候选关节构型渲染图与预测图的IoU和单向Chamfer距离，使用Gauss-Newton/Levenberg-Marquardt优化求解出最优关节轨迹，并结合B样条进行窗口级平滑。
- **关键细节**: 
  - **输入**：当前RGB图像（头部和腕部）、关节/夹爪状态、URDF、任务指令。
  - **模型结构**：冻结Qwen3.5-VL 9B提取指令和场景特征作为语义条件；共享Wan2.2 VAE（空间下采样16倍，时间4倍）；DiT作为生成骨干。
  - **规模与超参**：训练资源16张Nvidia B200，Batch Size 16，学习率1e-5，优化器AdamW；仿真动作块40帧，真实世界80帧；序列分辨率320x224。
- **训练/优化目标**: 
  - **生成模型**：带模态特定噪声水平的条件流匹配（Conditional Flow Matching）损失，仅在掩码（被破坏）的位置计算速度场预测的MSE损失。
  - **动作恢复**：最小化预测视图与URDF渲染视图之间的IoU损失和单向Chamfer距离，结合B样条轨迹平滑正则化。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：RoboTwin 2.0（50个双臂操作任务，仿真），TriWorldBench（动作条件多视角视频生成），DROID（消融实验）。
  - **对比对象（Baseline）**：$\pi_{0.5}$, Motus, LingBot-VA, Fast-WAM（操作任务）；Ctrl-World, Genie Envisioner, DreamDojo, BWM（视频生成）。
  - **真实世界测试**：4个平台（Aloha-Agilex, TienYi2.5 Pro, Franka Research 3, UR5e）。
- **评价指标**: 
  - **操作任务**：任务成功率（Success rate）。
  - **视频生成**：TriWorldBench的6个维度（TVC, TA, P3D, MQ, TC, VQ）及总体TWB-Score。
  - **消融实验**：PSNR, SSIM, LPIPS。
- **主要结果**: 
  - **RoboTwin 2.0**：平均成功率88.98%（Clean 90.50%, Randomized 87.46%），优于$\pi_{0.5}$（79.80%），与Motus（87.80%）相当，略低于LingBot-VA（92.20%）和Fast-WAM（91.80%）。
  - **TriWorldBench**：总体得分65.66，与BWM（65.54）相当，在P3D、MQ、TC上取得最高分。
  - **跨形态能力**：单一联合训练的checkpoint在5种仿真形态（Aloha, Piper, ARX-X5, Franka, UR5）和4种真实机器人上均能成功执行，无需特定形态的动作头。
  - **消融实验**：在DROID上，动作视图渲染比相机对齐的骨架条件在PSNR（24.33 vs 23.19）、SSIM（0.906 vs 0.899）和LPIPS（0.093 vs 0.105）上表现更好。

### 26. 🔥 [EWAM: Emergent Depth-Wise Specialization in a Unified Embodied Model -- From Semantic Understanding through Visual Foresight to Action] (EWAM：统一具身模型中涌现的深度方向特化——从语义理解、视觉前瞻到动作生成)
- **研究机构**: `Sun Yat-sen University, Tsinghua University, Yinwang Intelligent Technology Co. Ltd. 等（中山大学、清华大学、银王智能）`
- **Arxiv ID**: `2609.39973` | [点击跳转](https://arxiv.org/abs/2609.39973)

**0. 论文标题**
- **英文标题**: EWAM: Emergent Depth-Wise Specialization in a Unified Embodied Model -- From Semantic Understanding through Visual Foresight to Action
- **中文标题**: EWAM：统一具身模型中涌现的深度方向特化——从语义理解、视觉前瞻到动作生成
- **研究机构**: Sun Yat-sen University, Tsinghua University, Yinwang Intelligent Technology Co. Ltd. 等（中山大学、清华大学、银王智能）
- **一句话总结**: 提出了一种以动作为中心的统一具身模型 EWAM，通过非对称注意力机制让模型在训练中自发形成“浅层语义理解-中层视觉前瞻-深层动作生成”的深度分工，在仿真和真机任务上全面超越现有 VLA 和 WAM 基线。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（具身智能），具体是构建结合语义理解、环境动态预测和动作生成的统一策略模型。
- **研究动机**: 现有的 VLA（视觉-语言-动作）模型偏重语义，WAM（世界-动作模型）偏重动态预测。现有的混合系统（如外挂世界模型或 MoE 架构）往往存在“单专家偏见”（single-expert bias），动作计算依然集中在单一模态特征上，没有实现真正的内部协同与分工。
- **本质改动**: 设计了一个以动作为中心的非对称联合注意力架构。让动作 token 在每一层都能读取语义、视觉和动作特征，而感知专家（VL 和 Video）保持独立，从而在模型内部自发涌现出按网络深度分工的计算流。
- **技术溯源**: 视觉语言专家基于 Qwen3-VL-2B，视频专家基于 Wan2.2-TI2V-5B，生成框架基于 Flow Matching。

**2. 技术拆解**
- **核心方法**: 
  1. **非对称联合注意力**：动作查询（Action queries）可以 attend 到 VL、视频和动作的 Key/Value，而 VL 和视频查询只能 attend 自己（即 $A \leftarrow \{V,A,L\}, V \leftarrow V, L \leftarrow L$），保证动作流是唯一的跨模态整合接口。
  2. **联合视频-动作 Flow Matching**：视频和动作在同一个前向过程中联合去噪，让演化中的未来视频特征直接参与动作计算，而不是作为独立生成的视觉 prompt。
  3. **子任务阶段监督**：在后训练阶段引入子任务文本标签和归一化阶段索引的监督，辅助长程任务规划。
  4. **人类第一人称数据利用**：构建相机相对末端执行器动作空间，将人类 egocentric 视频数据用于预训练或联合训练，提升跨具身迁移和鲁棒性。
- **关键细节**: 模型包含 30 个对齐的 Transformer 块。VL 专家提取 28 层隐藏状态并对齐到 30 层深度。视频和动作独立采样噪声水平。动作空间为 16 维（包含左右手/臂的相机相对平移和旋转，以及夹爪命令）。
- **训练/优化目标**: 基础目标是视频和动作的 Flow Matching 损失（独立采样噪声）。后训练目标增加了子任务阶段索引的回归损失（MSE）和子任务文本标签的自回归交叉熵损失。

**3. 实验结果**
- **实验设置**: 仿真环境使用 RoboTwin 2.0（50 个双臂任务）和 LIBERO（4 个套件）。真机使用 Franka（单臂）、Dobot（双臂）、Unitree G1-D（人形双臂）。对比基线包括 VLA（如 $\pi_{0.5}$, starVLA）、WAM（如 Fast-WAM）以及混合模型（如 GigaBrain-0.7, Motus）。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **仿真表现**：在 RoboTwin C2R（Clean-to-Random）设定下达到 72.1%（比 GigaBrain-0.7 高 4.2%，比 $\pi_{0.5}$ 高 26.1%）；In-domain 平均 92.9%；LIBERO 平均 98.8%，全面超越各类基线。
  - **真机表现**：在 7 个跨平台真机任务上取得最高成功率（如 Franka 叠碗 80% vs $\pi_{0.5}$ 70%）。
  - **机制验证**：通过逐层 mask 和反事实未来特征注入，证实了动作生成确实依赖于中层的未来预测特征（mask 掉中层未来特征会导致成功率从 92.8% 暴跌至 3.55%）。
  - **数据增益**：人类数据预训练将跨具身迁移成功率从 40.1% 提升至 66.9%；在场景变化下，联合训练将真机成功率从 10% 提升至 60%；子任务监督显著提升了长程任务的完成率（如双篮分类任务平均放置物体数从 1.0 提升至 2.2）。

- **英文标题**: When Instructions Retrieve Trajectories: Diagnosing and Mitigating Generalization Failures in VLA Models
- **中文标题**: 当指令检索轨迹：诊断并缓解VLA模型的泛化失败

- **一句话总结**: 发现VLA模型在反事实场景下会退化为“指令触发固定轨迹、视觉仅做微调”的绑定失败，并提出等变反事实训练（ECT），通过配对同指令不同场景的动作差异，强制模型进行真正的场景-指令联合决策。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在反事实扰动（即需要改变动作才能成功的场景变化）下泛化失败的问题。
- **研究动机**: 现有VLA模型在分布内任务和不改变动作的干扰（nuisance changes）下表现很好，但在反事实变化下会失败。深入诊断发现，模型并非单纯忽略语言或视觉，而是出现了“指令-动作绑定（instruction-action binding）”缺陷：指令仅仅作为检索熟悉轨迹族的“钥匙”，视觉反馈只负责微调执行，导致模型无法根据当前场景和指令的组合去选择真正需要的动作。
- **本质改动**: 打破“单一指令对应单一轨迹族”的捷径学习，通过构建同指令不同场景/动作的反事实数据对，并在训练时将它们配对联合优化，强制模型学习基于场景差异的动作选择。
- **技术溯源**: 基于 $\pi_{0.5}$ (Physical Intelligence) 和 GR00T-N1.7 (Nvidia) 等主流VLA架构，以及 Flow Matching（流匹配）动作生成范式。

**2. 技术拆解**
- **核心方法**: 提出等变反事实训练（Equivariant Counterfactual Training, ECT），包含数据构建（ECT data）和损失函数（ECT loss）两个层面。
- **关键细节**: 
  - **ECT data**: 针对同一指令，通过几何变换（如镜像、平移）改变场景布局，并通过运动学重放（Replay）生成在新场景下成功且动作不同的有效示范。确保新场景在视觉上可区分，且所需动作发生改变。
  - **ECT loss**: 在训练时，将原始示范与其反事实对应物组成配对（pair），在同一个参数更新步骤中计算两者的流匹配模仿损失之和。两者共享流匹配的噪声样本和流时间（flow time）。
- **训练/优化目标**: 标准的流匹配（Flow Matching）模仿损失（Imitation loss）。ECT loss 没有引入额外的辅助目标，只是将配对的两个样本的损失相加：$\mathcal{L}_{\mathrm{ECT}} = \mathbb{E}[L(s, \ell, a) + L(s', \ell, a')]$。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**: 使用 LIBERO-PRO（包含语义、物体、位置交换Swap、任务Task等扰动）、CALVIN 以及真实机器人 UR5e。对比 Baseline 为 $\pi_{0.5}$ 官方 checkpoint、GR00T-N1.7 官方 checkpoint 以及标准微调（Standard training）。
- **评价指标**: 终端状态成功率（Terminal-state success rate），以及通过人工标注分析的行为类别（如检索相似行为 retrieval-like behavior 的比例）。
- **主要结果**: 
  - **LIBERO-PRO**: 在 $\pi_{0.5}$ (Frozen-LM设置) 上，完整 ECT 将位置交换（Swap）任务的平均成功率从 36% 提升至 59%。行为分析显示，反事实失败中“检索熟悉轨迹”的比例从 69% 降至 47%。
  - **CALVIN**: 仅使用 ECT loss（利用原始数据中自然存在的同指令不同场景配对，无需新数据），将五任务连续完成率从 58% 提升至 76%。
  - **真实机器人 UR5e**: 在固定 400 条演示的预算下，通过在不同布局下收集数据并使用完整 ECT，将未见位置（unseen-position）的成功率从 8% (3/40) 大幅提升至 88% (35/40)。

### 28. 🔥 [SplineWAM: Adaptive Action Horizons for World Action Models via B-Spline Representations] (SplineWAM：通过B样条表示实现世界动作模型的自适应动作视界)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.39873` | [点击跳转](https://arxiv.org/abs/2609.39873)

**0. 论文标题**
- **英文标题**: SplineWAM: Adaptive Action Horizons for World Action Models via B-Spline Representations
- **中文标题**: SplineWAM：通过B样条表示实现世界动作模型的自适应动作视界
- **研究机构**: 原文未提及
- **一句话总结**: 用固定参数预算的B样条曲线替换WAM中固定长度的动作块，让单次预测的执行时长和时间分辨率根据运动复杂度自适应变化，从而在提升成功率的同时大幅减少推理调用次数。

**1. 整体逻辑**
- **研究任务**: 优化世界动作模型（WAMs）在机器人操作任务中的动作表示与推理效率。
- **研究动机**: 现有WAMs使用固定长度、均匀时间网格的动作块（action chunk），导致计算预算在时间上均匀分配。这在自由空间运动时造成推理浪费，在接触丰富的复杂操作时又无法提供足够的时间分辨率和及时的重新规划，成为云端部署的吞吐量瓶颈。
- **本质改动**: 将固定长度的离散动作序列替换为固定参数预算的连续B样条曲线，通过自适应节点分布，让单次预测自带可变的执行时长（动作视界）和时间分辨率。
- **技术溯源**: 基于 Fast-WAM 骨干网络，使用 Wan2.2-5B 视频生成模型和 Wan VAE，以及 Flow-matching（流匹配）训练框架。动作的B样条局部窗口构建借鉴了 Han et al. (2026) 的工作。

**2. 技术拆解**
- **核心方法**: 
  1. **自适应B样条动作表示**：用三次B样条的节点时间（knot times）和控制点（control points）组成固定大小的参数窗口。通过误差驱动的自适应拟合放置节点，简单运动节点稀疏，复杂运动节点密集。
  2. **视频-动作节点对齐（Knot-grid alignment）**：将视频监督帧的采样对齐到动作的拟合节点时间，使视频预测的分辨率与动作执行的复杂度保持一致。
  3. **雅可比拉回实时分块（JP-RTC）**：针对异步执行（机器人边动边算），在解码后的原始动作空间计算连续性残差，并通过解码器的局部雅可比矩阵将其拉回到样条参数空间进行修正，保证执行动作的平滑连续。
- **关键细节**: 
  - **输入输出**：输入为视频潜在变量和B样条参数窗口；输出为预测的B样条参数，解码后为可变长度的执行动作。
  - **模型结构**：双专家架构（视频专家+动作专家），共享注意力掩码。动作窗口固定为36行（包含边界支持），有效控制点32个。
  - **关键超参**：拟合容差 $\epsilon$（控制节点密度，LIBERO-Plus设为0.01，RoboCasa设为0.08）；执行行预算 $H$（LIBERO-Plus设为12，RoboCasa设为20）。
- **训练/优化目标**: 
  - 采用 Flow-matching 损失。总损失为视频流匹配损失和动作流匹配损失的加权和（权重均为1）。
  - 动作损失直接在归一化后的B样条参数空间计算均方误差，而不是在解码后的动作空间计算。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 LIBERO-Plus 和 RoboCasa；真机使用三个双臂任务（Arrange Bookshelf, Charge Earphone, Clean Whiteboard）。
  - **对比对象（Baseline）**：Action Chunking (未修改的 Fast-WAM), BEAST, Naive B-Spline, Naive B-Spline w/o video。
- **评价指标**: 仿真看成功率（Success rate）、每集策略调用次数（Calls/ep.）、每次调用执行步数（Steps/call）；真机看成功率（SR）、任务节点进度（PG）和每次调用执行步数（Chunk）。
- **主要结果**: 
  - **仿真表现**：相比 Action Chunking，SplineWAM 在 LIBERO-Plus 和 RoboCasa 上成功率分别提升 8.2 和 4.4 个百分点，同时每集策略调用次数减少 22% 和 26%。
  - **真机表现**：在异步执行下，SplineWAM (JP-RTC) 在6个准确率指标中4个超越baseline，1个持平；每次策略调用解码执行的动作量是baseline的 1.2 到 1.6 倍。
  - **消融结论**：视频-动作节点对齐（Knot-grid）优于时间窗口对齐；JP-RTC 显著优于直接在参数空间约束的 Naive RTC，有效解决了异步执行下样条参数非线性解码导致的动作不连续问题。

### 29. 🔥 [Magic-W0: A Structured World-Action Foundation Model for Physical Intelligence] (Magic-W0：面向物理智能的结构化世界-动作基础模型)
- **研究机构**: `Magiclab (MagicLab Robotics)`
- **Arxiv ID**: `2609.39870` | [点击跳转](https://arxiv.org/abs/2609.39870)

**0. 论文标题**
- **英文标题**: Magic-W0: A Structured World-Action Foundation Model for Physical Intelligence
- **中文标题**: Magic-W0：面向物理智能的结构化世界-动作基础模型
- **研究机构**: Magiclab (MagicLab Robotics)
- **一句话总结**: 提出 Magic-W0，通过显式构建“当前状态-状态转移-未来状态”的三维结构化世界表示，并与连续动作生成在多层网络中双向耦合，显著提升了机器人在复杂操作任务中的泛化与适应能力。

**1. 整体逻辑**
- **研究任务**: 具身智能中的通用机器人策略学习，具体为根据多视角视觉、语言指令和本体感觉生成连续动作，并显式建模动作条件化的物理环境动态演变（World-Action Modeling）。
- **研究动机**: 现有 VLA 模型主要隐式地从轨迹中学习物理交互，缺乏对动作条件化环境演变的显式结构化预测；现有 WAM（世界-动作模型）要么在像素空间预测未来（包含过多与控制无关的纹理/光照信息），要么在隐空间预测通用特征（缺乏面向控制的结构化表示），且世界预测与动作生成往往是松耦合的（如仅作为辅助目标或在最后阶段条件化）。
- **本质改动**: 提出“结构化世界转移（Structured World Transition）”，将物理世界演变显式组织为“当前状态-转移-未来状态”的三维表示，并设计“层对齐的世界-动作交互架构”，在网络多个深度实现世界预测与连续动作生成的双向紧密耦合。
- **技术溯源**: 基于 Qwen3.5-2B（VLM 骨干）、Flow Matching（连续动作生成）、Track4World（3D 几何与运动监督）、DINOv3（未来语义监督）、Gated DeltaNet（层内状态更新）。

**2. 技术拆解**
- **核心方法**: 
  1. **结构化世界表示**：将世界状态显式拆分为 Current State（VLM 上下文 + 当前 3D 几何）、Transition（3D 运动）和 Future State（未来语义）。
  2. **层对齐双向交互**：3D 流、语义流和动作专家在 24 层网络中对齐，通过联合注意力（Joint Attention）在多个深度交换信息，实现“动作条件化的世界转移”和“世界告知的动作生成”。
  3. **统一跨具身表示**：构建 34 维统一状态-动作接口，融合人类第一视角、UMI、真机和仿真等异构数据。
- **关键细节**: 
  - **模型规模**：总参数 3.4B，VLM 骨干为 Qwen3.5-2B (2.2B)。
  - **网络结构**：24 层对齐深度，每 3 层 Gated DeltaNet 后接 1 层联合注意力。
  - **输入输出**：输入多视角图像 (256x256)、语言、本体感觉；输出长度为 H=50 的连续动作 chunk。
  - **监督信号**：Track4World 冻结提取 3D 几何和运动特征，DINOv3 冻结提取未来语义特征，均在 16x16x1024 的空间网格上进行潜空间监督。
- **训练/优化目标**: 
  - **连续动作损失**：Flow matching 的均方误差（MSE）损失。
  - **世界表示损失**：语义特征用余弦距离，几何和运动特征用通道归一化后的 MSE。
  - **辅助损失**：VQA 自回归交叉熵、FAST 离散动作交叉熵。
  - **联合优化**：采用梯度隔离（知识绝缘）和辅助权重调度策略协调多目标，防止不同任务间的梯度干扰。

**3. 实验结果**
- **实验设置**: 
  - **仿真环境**：RoboDojo-Sim (42 个任务), LIBERO。
  - **真机环境**：5 个新操作任务（叠衣服、扶正瓶子、收笔、收物体、厨房收纳）。
  - **Baseline**：RoboDojo 对比了 Simate-beta, DM0.5, GalaxeaVLA, Xiaomi-Robotics-1, OpenWAM-α 等 VLA 和 WAM；LIBERO 对比了 π0.5, X-VLA, OpenVLA-OFT, Fast-WAM 等；真机对比了 π0.5。
- **评价指标**: 
  - RoboDojo-Sim: Process Score 和 Success Rate (SR, %)。
  - LIBERO 与真机: Success Rate (SR, %)。
- **主要结果**: 
  - **RoboDojo-Sim**：Magic-W0 平均 Score 27.10，SR 20.84%，在对比的 WAM 中排名第一（比第二名 OpenWAM-α 高 9.92 分），在泛化（Generalization）维度也超过最强开源 VLA Xiaomi-Robotics-1。
  - **LIBERO**：平均 SR 99.1%，在 Spatial 和 Goal 任务上取得最高 SR。
  - **真机**：5 个任务平均 SR 94.6%，比 π0.5 (91.8%) 高 2.8 个百分点，在需要持续追踪环境变化的任务（如物体收纳、厨房收纳）上提升明显。
  - **机制分析**：通过动作替换和跨流掩码干预实验证明，结构化世界表示确实依赖于动作条件（低噪声区间动作替换导致 Future Semantics 损失增加 73.5%），且未来语义预测强依赖于 3D 流向语义流的信息传递（Masking 3d→sem 导致语义损失增加 60.8%）。

### 30. 🔥 [Toward Real-Time VLAs: Stage-Aware Two-Step Flow Denoising and System-Level Evaluation] (迈向实时VLA：阶段感知的两步Flow去噪与系统级评估)
- **研究机构**: `原文未提及（项目主页与代码库显示为 Magiclab）`
- **Arxiv ID**: `2609.39822` | [点击跳转](https://arxiv.org/abs/2609.39822)

**0. 论文标题**
- **英文标题**: Toward Real-Time VLAs: Stage-Aware Two-Step Flow Denoising and System-Level Evaluation
- **中文标题**: 迈向实时VLA：阶段感知的两步Flow去噪与系统级评估
- **研究机构**: 原文未提及（项目主页与代码库显示为 Magiclab）
- **一句话总结**: 针对VLA模型推理慢和系统延迟问题，提出基于Flow Matching速度场异质性的两步非均匀去噪方法将推理加速近3倍，并开发了分布式实时评估框架对6种执行策略进行了系统级对比。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型低推理率与机器人高频连续控制之间的时序不匹配问题，实现端到端的实时VLA系统。
- **研究动机**: VLA模型（如基于Flow Matching）的多次去噪推理成本高，且机器人执行链（感知、通信、物理响应）存在固有延迟；现有的异步执行虽然重叠了计算与执行，但无法消除低频模型更新带来的动作块间不连续（inter-chunk discontinuity）和时序错位，且现有研究缺乏统一的端到端延迟测量与评估标准。
- **本质改动**: 发现Flow Matching去噪速度场存在“早期稳定、末端修正强”的阶段异质性，据此将10步均匀去噪改为“长区间粗生成+短区间终端细化”的2步非均匀去噪；同时构建了解耦推理与控制的分布式实时系统框架，以统一评估各类实时策略。
- **技术溯源**: 基于 $\pi_{0.5}$ 基座模型，采用 Flow Matching 动作生成范式，并结合了 SnapFlow 的短区间终端细化机制。

**2. 技术拆解**
- **核心方法**: 
  1. **两阶段非均匀去噪**：将Flow Matching积分区间划分为 $[1, 0.3]$ 和 $[0.3, 0]$。第一阶段用标准Flow Matching做1步长区间粗生成；第二阶段用SnapFlow机制做1步短区间终端细化。推理时仅需2次网络评估。
  2. **分布式实时框架**：客户端负责高频感知与控制，GPU服务端负责低频推理。通过独立线程管理动作缓冲与时间对齐，支持多种实时策略的即插即用和全链路日志追踪。
- **关键细节**: 基座模型为 $\pi_{0.5}$；推理硬件为 NVIDIA RTX 4090 D；物理平台为 Agilex Piper 双臂机器人；超参数 $\tau=0.3$，SnapFlow损失权重 $\lambda_{sc}=0.1$；训练集包含3048条遥操作演示轨迹（原文未提及具体数据集名称）。
- **训练/优化目标**: 联合损失函数 $\mathcal{L}_{\mathrm{2stage}} = \text{MSE}(v^{(1)}, v^{(1)*}) + \lambda_{sc} \text{MSE}(\bar{v}^{(2)}, \bar{v}^*_{\tau\rightarrow 0})$。结合了标准Flow Matching的局部速度监督与SnapFlow的跨区间平均速度监督，训练时以50%概率选择标准分支或两阶段分支。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**: 3048条遥操作演示轨迹（训练）；物理任务为双臂T恤折叠（长时序任务，包含3种不同颜色和大小的T恤）。
  - **对比对象**: 系统级对比6种实时执行方法（Naive Asynchronous, Temporal Smoothing, Inference-time RTC, Training-time RTC, Legato, VLASH）；模型级对比标准10步Flow与提出的2步两阶段Flow。
  - **测试环境**: NVIDIA RTX 4090 D 推理，Agilex Piper 双臂机器人物理执行。
- **评价指标**: 任务级（成功率、平均完成时间、吞吐量）；动作连续性（Tail Gap、Switch Gap、最大加速度）；模型级（推理时间、关节MAE/RMSE、TCP位姿误差）。
- **主要结果**: 
  1. **延迟量化**：测出相机偏移(17.7ms)、图像读取(32.8ms)、本体反馈(26.4ms)等非模型延迟，证明仅靠模型加速无法消除系统级时序错位。
  2. **模型加速**：2步非均匀去噪将函数评估次数（NFE）从10降至2，推理时间从 61.557 ms 降至 21.956 ms（加速 2.804倍，降低 64.33%），且关节与TCP动作误差与10步法保持在同一数量级。
  3. **系统评估**：在6种执行方法中，Legato（基于训练）和 Temporal Smoothing（免训练）综合表现最优，Legato成功率达96.7%，吞吐量47.31/h。
  4. **联合效果**：将2步去噪与Legato/Temporal Smoothing结合，在成功率仅略降（约10%）且动作连续性指标轻微退化的情况下，大幅降低了推理成本，验证了模型效率与系统时序联合优化的可行性。

### 31. 🔥 [DiffWAM: A Fast and Efficient Navigation World Action Model] (DiffWAM：一种快速高效的导航世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.39763` | [点击跳转](https://arxiv.org/abs/2609.39763)

**0. 论文标题**
- **英文标题**: DiffWAM: A Fast and Efficient Navigation World Action Model
- **中文标题**: DiffWAM：一种快速高效的导航世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需生成完整未来视频，直接利用冻结视频模型中间预测特征结合首帧几何信息解码连续3D相机轨迹的世界-动作模型，并配套了支持无人机连续飞行的异步推理框架。

**1. 整体逻辑**
- **研究任务**: 无人机（UAV）的视觉-语言连续3D导航，即将自然语言指令和初始RGB图像转换为连续、可执行的3D相机运动轨迹。
- **研究动机**: 现有的基于视频基础模型的导航方法（如作者前期的 NavDreamer）采用“先生成未来视频，再进行几何重建”的范式。但导航任务本质上不需要高保真的纹理和像素级渲染，完整的视频生成和多帧重建带来了极大的计算冗余和延迟。
- **本质改动**: 跳过耗时的未来视频解码环节，直接提取冻结视频模型在去噪早期的中间预测特征，通过几何条件化将其“蒸馏”并解码为连续的3D运动轨迹。
- **技术溯源**: 基于 MiniMax H3（视频世界模型骨干）、MoGe2（单目几何估计模型）、$\pi^3$（用于离线轨迹重建的几何基础模型）。

**2. 技术拆解**
- **核心方法**: 
  1. **Grid-Motion 模块**：在视频模型的多级中间特征（DiT blocks 15/25/35）之间建立跨空间位置和时间的运动关联，并融合首帧几何条件，保留时空运动结构。
  2. **Latent2Pose 模块**：将融合后的运动记忆与首帧几何特征结合，通过 Transformer Decoder 直接回归出带有度量尺度的连续相机位姿序列。
  3. **非对称师生蒸馏训练**：离线训练时，Teacher 跑完整个视频生成和 $\pi^3$ 重建得到真实轨迹标签；Student 仅使用早期预测特征和首帧几何进行拟合。部署时完全剔除视频解码和多帧重建。
- **关键细节**: 
  - **输入输出**：输入为初始RGB图像和语言指令；输出为38个未来位姿（加上初始位姿共39个），包含平移和旋转（旋转通过 Gram-Schmidt 正交化保证合法性）。
  - **特征提取**：视频骨干冻结，提取 schedule index 0-3 的特征（Flash 轻量版仅用 index 0）。
  - **尺度对齐**：利用 MoGe2 估计首帧深度中位数作为场景尺度 $s_0$，对平移输出进行归一化和条件化，赋予轨迹真实的物理度量意义。
- **训练/优化目标**: 
  - **位置损失**：带场景尺度归一化的鲁棒标量位置惩罚（Robust scalar position penalty）。
  - **旋转损失**：SO(3) 流形上的测地线角度距离平方（Geodesic angle in radians）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：训练集使用 FlyMirage (~110k轨迹) 和 NavGen (~400k轨迹) 合成的 510k+ 样本；测试集为自建的 DiffWAM-1000（1000个样本，涵盖18种任务），以及 IndoorUAV-VLA 和 UAV-FLOW-Sim。
  - **Baseline**：WorldVLN, ImagineUAV, Fast-WAM-UAV, WorldFly。
- **评价指标**: 端点成功率（Endpoint SR，基于FDE阈值）、轨迹均方根误差（RMSE）、平均位移误差（ADE）、平均旋转误差（RoE）、推理延迟。
- **主要结果**: 
  - 在 DiffWAM-1000 上，轨迹 RMSE 降至 0.3492 m，端点成功率达 74.40%。
  - 在三个 Benchmark 上端点成功率均取得 SOTA（IndoorUAV-VLA 56.77%, UAV-FLOW-Sim 91.42%, DiffWAM-1000 74.40%），比最强基线 WorldVLN 分别高出 17.45、11.18、16.00 个百分点。
  - 消融实验表明，相比简单的 MLP 读取头，DiffWAM 的 RMSE 降低了 74.84%；混合深度特征（15/25/35层）比单一深度效果更好。
  - 部署效率方面，配套的 FastDreamer 框架支持异步执行，DiffWAM-Flash 在 Jetson AGX Thor 上的模型管线 P50 延迟为 1.080 s，相比完整 DiffWAM 提速约 3.5 倍。

### 32. 🔥 [ChunkTrust: Adapting Execution Horizons for Robot Policies with Action-Expert Evidence] (ChunkTrust：利用动作专家证据自适应机器人策略的执行视界)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.39754` | [点击跳转](https://arxiv.org/abs/2609.39754)

**0. 论文标题**
- **英文标题**: ChunkTrust: Adapting Execution Horizons for Robot Policies with Action-Expert Evidence
- **中文标题**: ChunkTrust：利用动作专家证据自适应机器人策略的执行视界
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出了一个名为 ChunkTrust 的即插即用框架，通过挖掘动作生成时的内部频谱特征和外部历史拼接平滑度，免训练地动态调整机器人策略每次重新规划前执行的动作块长度，在多个仿真和真机任务上显著提升了基础策略的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人基础策略（如 VLA）在预测出一长串动作块（action chunks）后，动态决定在重新规划（replanning）前到底应该执行多少个动作（即执行视界/execution horizon）。
- **研究动机**: 任务的不同阶段对执行长度的需求不同（例如自由空间接近可以执行长一点，接触物体或精细搬运时需要短一点以便及时纠错）。现有的自适应方法多依赖单次推理的局部特征（如注意力结构、动作熵），容易受噪声干扰，且“模型内部预测稳定”并不代表“预测动作与已执行的历史动作兼容”。
- **本质改动**: 将执行视界视为隐变量，利用动作专家生成时的“内部频谱稳定性”和“外部历史拼接连续性”作为双重证据，结合在线时序记忆和轻量级学习先验来动态推断最优执行长度，全程冻结基础策略权重。
- **技术溯源**: 基于各类机器人基础策略（如 $\pi_0$, $\pi_{0.5}$, Fast-WAM, Qwen3GR00T 等 flow-based 或 VLA 模型），依赖 RoboTwin2.0 和 RoboCasa 仿真环境。

**2. 技术拆解**
- **核心方法**: 提出 ChunkTrust 框架，包含两个核心组件：免训练的 Action-aware Horizon Selector (AHS) 和可选轻量训练的 Query-based Horizon Adapter (QHA)。
- **关键细节**: 
  - **AHS (免训练)**: 评估候选执行前缀的两个证据维度：1) 块内频谱稳定性（对生成过程的速度预测做 FFT，计算高频能量偏差）；2) 块间连续性（计算候选前缀与已执行历史拼接后的速度变异系数）。使用带核遗忘的在线 Beta 后验分布来累积和跟踪这些证据，通过 Thompson 采样输出执行长度。
  - **QHA (轻量训练)**: 使用桥接交叉注意力机制，从 VLM 上下文 token 和动作隐变量 token 中学习一个上下文条件化的密集先验分布。推理时与 AHS 的在线证据融合。
  - 基础策略保持冻结，仅需记录生成轨迹（traces）用于计算证据，不改变生成的动作值。
- **训练/优化目标**: AHS 无需训练，基于在线软反馈更新 Beta 分布（结合指数遗忘和高斯核平滑）。QHA 的训练目标是最小化其预测的密集先验分布与基于当前证据归一化后的教师分布之间的 KL 散度。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: RoboTwin2.0（50 tasks 和 8 tasks），RoboCasa GR1 Tabletop（24 tasks），以及 4 个真实世界双臂家务任务。
  - **对比对象 (Baseline)**: 各基础策略的固定执行视界（Base），部分实验对比了 AAC 等自适应方法。基础策略包括 $\pi_0$, $\pi_{0.5}$, Fast-WAM, Qwen3GR00T 等。
- **评价指标**: 仿真环境使用任务成功率（Success rate, %）；真实世界使用平均归一化过程得分（Mean normalized process score, %）。
- **主要结果**: 
  - **RoboTwin2.0 (50 tasks, $\pi_{0.5}$)**: 成功率从 56.70% 提升至 63.50% (+6.80 pp)。
  - **RoboCasa (24 tasks)**: $\pi_{0.5}$ 成功率从 40.08% 提升至 42.50% (+2.42 pp)；Qwen3GR00T 从 47.83% 提升至 57.50% (+9.67 pp)。
  - **8-task 评估 ($\pi_{0.5}$)**: AHS+QHA 相比 Base 提升 +9.44 pp。
  - **真实世界 (4 tasks)**: 平均归一化过程得分从 50.4% 提升至 57.5% (+7.1 pp)。
  - **消融与开销**: 消融实验证明双重证据、时序记忆和 QHA 先验均有贡献；AHS 引入的计算开销极小，每次重新规划仅增加约 0.7~3.6 ms。

### 33. 🔥 [RoboCoach: World Models as Active Coaches for Compositional Robot Skills] (RoboCoach：将世界模型作为组合机器人技能的主动教练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.39685` | [点击跳转](https://arxiv.org/abs/2609.39685)

**0. 论文标题**
- **英文标题**: RoboCoach: World Models as Active Coaches for Compositional Robot Skills
- **中文标题**: RoboCoach：将世界模型作为组合机器人技能的主动教练
- **研究机构**: 原文未提及
- **一句话总结**: 提出RoboCoach框架，利用世界模型在想象执行中诊断长时序任务的失败瓶颈，主动指导真实数据的定向采集并针对性微调模块化技能专家，以极少数据大幅提升任务成功率与组合泛化能力。

**1. 整体逻辑**
- **研究任务**: 长时序机器人操作任务（long-horizon manipulation）的策略自我改进，核心是解决“下一步采集哪些子任务的演示数据”以及“更新哪个策略组件”的决策问题。
- **研究动机**: 长时序任务由多个可复用原子技能组合而成，端到端采集真实数据成本极高。现有方法难以在有限的数据预算下，精准定位导致任务失败的瓶颈技能，也无法将新数据高效路由到对应的策略模块进行更新。
- **本质改动**: 将动作条件世界模型从单纯的“数据生成器”转变为“主动教练（Active Coach）”，通过在想象执行中定位首次超时的子任务-专家对，实现数据定向采集与模块化专家（LoRA）定向微调的闭环。
- **技术溯源**: 基于动作条件视频预测世界模型（参考Ctrl-World）、通用视觉-语言-动作模型（VLA，如 $\pi_{0.5}$、MolmoAct2）、LoRA参数高效微调，以及进度评估模型（如RoboMeter）。

**2. 技术拆解**
- **核心方法**: 提出RIDI（Route-Imagine-Diagnose-Improve）循环。1) Route：将长时序指令分解为原子子任务，分发给对应的技能专家；2) Imagine：技能专家在共享世界模型（CoachWorld）中进行闭环想象执行；3) Diagnose：进度判断器评估想象执行，记录首次超时的子任务-专家对；4) Improve：聚合记录计算“任务平衡的首次超时质量”，选出Top-M个瓶颈对，请求真实演示数据，并仅更新对应的专家LoRA适配器。
- **关键细节**: 
  - 世界模型（CoachWorld）：基于条件流匹配训练，输入稀疏视觉历史、任务指令、校准的双槽末端执行器（EEF）轨迹和相机标定，预测未来视频块，支持单臂和双臂异构机器人。
  - 模块化策略：共享VLA骨干网络 + 技能特定的LoRA适配器（如press、pick等原子技能专家）。
  - 进度判断器：采用RoboMeter，通过因果观察窗口估计子任务完成度并判断超时。
- **训练/优化目标**: 
  - CoachWorld训练：条件流匹配损失函数 $\mathcal{L}_{CW} = \mathbb{E}[\|v_\theta(z_\sigma, \sigma|c) - (\epsilon - z_0)\|_2^2]$。
  - 策略更新：使用新采集的子任务演示数据混合少量旧数据，对选中的LoRA适配器进行模仿学习微调，骨干网络和其他未选中适配器保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：LIBERO-Long (10个任务), RoboTwin 2.0 (5个任务)。
  - 真实机器人：Franka Research 3 (单臂), AgileX dual-Piper (双臂)。
  - Baselines：Single VLA + Uniform（均匀采集+全局更新）, Single VLA + WM-targeted（定向采集+全局更新）, Modular + Random（随机采集+专家更新）。
- **评价指标**: 
  - 世界模型保真度：LPIPS, FVD, HSD, nDTW, DYN, 物理遵循度，指令遵循度。
  - 策略评估：完整任务成功率（Complete-task success rate），想象与真实成功率的Spearman相关系数，Budget AUC。
  - 泛化能力：在未见过的任务组合（held-out compositions）上的成功率。
- **主要结果**: 
  - 世界模型对齐：CoachWorld在混合域训练下视觉和轨迹指标最优；22个任务-策略对的想象成功率与真实部署成功率Spearman相关系数达0.840。
  - 固定预算提升：在真实机器人上，仅用150个额外子任务演示，Franka成功率从13.3%提升至75.0%，AgileX从40.0%提升至83.8%（Baseline Single VLA + Uniform仅达30.0%和47.5%）。仿真中LIBERO和RoboTwin也取得最高成功率，验证了“定向采集+对应专家更新”耦合的有效性。
  - 组合泛化：在4个未见过的任务组合（如更长时序、跨任务、技能重排）上，RoboCoach平均成功率达35.0%，而Uniform baseline为0%。
