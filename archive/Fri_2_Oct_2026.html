### 34. 🔥 [UniWAM Technical Report: Unified Mobile Manipulation via Mixed-Stream World-Action Modeling and Manipulation Anchor Pose Supervision] (UniWAM技术报告：通过混合流世界-动作建模与操作锚点姿态监督实现统一移动操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.39388` | [点击跳转](https://arxiv.org/abs/2609.39388)

**0. 论文标题**
- **英文标题**: UniWAM Technical Report: Unified Mobile Manipulation via Mixed-Stream World-Action Modeling and Manipulation Anchor Pose Supervision
- **中文标题**: UniWAM技术报告：通过混合流世界-动作建模与操作锚点姿态监督实现统一移动操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出将导航与操作解耦为独立采样的双流世界-动作模型（UniWAM），并构建大规模操作锚点姿态数据集（MAP-Data），大幅提升了移动机器人精准停靠与端到端操作的成功率。

**1. 整体逻辑**
- **研究任务**: 统一移动操作（Unified Mobile Manipulation），即训练单一策略让移动机器人先精准导航至操作就绪位姿（Manipulation-ready pose），再可靠执行物体交互。
- **研究动机**: 现有统一策略（如VLA或WAM）通常共享动作表示，忽略了导航与操作在视觉输入、动作空间和控制频率上的异构性，导致联合监督时大量算力浪费在静止指令上，且无法直接利用独立的纯导航或纯操作数据；此外，现有模型只能从昂贵的完整轨迹中隐式学习“停在哪”，缺乏大规模显式监督“操作就绪姿态”的导航数据。
- **本质改动**: 在控制流层面将导航与操作解耦，采用共享骨干但独立采样的双流架构，并定义显式的“操作锚点姿态（MAP）”以自动化生成大规模导航监督数据。
- **技术溯源**: 基于视频生成模型（Wan2.2-TI2V-5B）、DiT（Diffusion Transformer）、Flow Matching，以及DINOv2（用于末端执行器可见性判断）。

**2. 技术拆解**
- **核心方法**: 
  1. **UniWAM混合流架构**：导航流与操作流拥有独立的视觉输入、动作编码器和输出头，但共享视频DiT和动作DiT。通过混合流批次打包（Mixed-Stream Batch Packing），使每个训练样本仅监督其所属流，支持纯导航、纯操作及移动操作数据的独立采样与联合训练。
  2. **MAP与MAP-Data**：定义操作锚点姿态（MAP，即基座停止的2D位置与航向角），通过自动化流水线从大规模3D室内场景生成150万+ episode的MAP-Data，提供逐帧的图像平面MAP坐标和目标边界框作为辅助监督。
  3. **图像平面辅助监督**：在动作向量中拼接图像平面目标（导航流预测目标框和投影MAP点，操作流预测末端执行器投影轨迹），与动作联合去噪，将3D动作显式锚定在自中心图像平面上。
- **关键细节**: 
  - **输入与动作表示**：导航流使用广角头部相机，预测相对位姿增量（解决速度标签的双峰分布问题）；操作流使用向下头部相机和腕部相机，预测相机坐标系下的末端执行器位姿（6D旋转+3D平移+夹爪），以跨实体对齐视觉-动作映射。
  - **模型规模**：视频骨干为Wan2.2-TI2V-5B（50亿参数），动作DiT为30层（隐藏维度1024）。
  - **数据规模**：MAP-Data包含超150万条导航轨迹（7500小时）；MAP-Bench包含300个目标、109个场景，用于无泄漏评估。
- **训练/优化目标**: 基于Flow Matching的损失函数。包含视频潜在序列重建损失、各流动作损失及图像平面辅助目标损失。训练时采用因果掩码（Causal mask）支持前缀条件异步推理；推理时通过编译优化（torch.compile）和KV Cache复用将双流推理延迟降至60ms以内。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真基准MAP-Bench；真实机器人评估包含24个任务（13个MAP导航、4个移动操作、7个纯操作），涵盖4种实体（AgileX Cobot Magic, AgiBot G2, 双臂Franka, 单臂AgileX）。
  - **对比对象（Baseline）**：VLA模型（$\pi_{0.5}$, GR00T N1.7），VLN模型（Uni-NaVid, InternVLA-N1），WAM模型（FastWAM）。
- **评价指标**: MAP导航的位置误差（$E_{pos}$，cm）和航向误差（$E_{head}$，度）；移动操作与纯操作的成功率（SR，%）。
- **主要结果**: 
  - **仿真停靠**：在MAP-Bench上，UniWAM-Scaled比最强基线（GR00T N1.7和$\pi_{0.5}$）的位置误差降低30.1%，航向误差降低44.0%，长距离导航优势尤为显著。

- **一句话总结**: 提出了一种“慢速宏观规划+快速残差修正”的双流VLA框架，通过引入光流感知和未来状态预测，解决了现有VLA在动态操作任务中因感知缺失、推理延迟和开环执行导致的失败问题。

**1. 整体逻辑**
- **研究任务**: 动态环境下的机器人视觉-语言-动作（VLA）操作任务（如传送带抓取、动态堆叠、移动倒水等）。
- **研究动机**: 现有VLA在动态场景中面临三个根本缺陷：1) 感知鸿沟（Perception Gap）：静态RGB输入缺乏速度等时间运动线索；2) 延迟鸿沟（Latency Gap）：VLA推理延迟导致基于过时观察生成的动作失效；3) 控制鸿沟（Control Gap）：动作块（action chunk）的开环执行缺乏实时闭环调整，无法应对执行期间的突发扰动。
- **本质改动**: 借鉴生物运动控制机制，将控制解耦为“慢-快”双流：慢速流（Flow-Planner）融合光流与未来状态预测做宏观规划，快速流（Res-Refiner）用轻量RL策略做高频实时残差修正。
- **技术溯源**: 基于 PI0.5 (Conditional Flow Matching 策略基座)、CLIP (视觉语义编码器)、RAFT-Large (光流提取网络)、RLPD (强化学习算法)。

**2. 技术拆解**
- **核心方法**: 
  1. **慢速流 (Flow-Planner, 2-3Hz)**：双分支视觉编码（RGB + 极坐标映射的光流图），通过运动学前向推演（Kinematics Rollout）预测执行时刻的本体状态以补偿延迟，生成全局一致的动作块。
  2. **快速流 (Res-Refiner, 30Hz)**：轻量级视觉-本体-动作融合的RL残差策略，在动作块执行期间注入高频闭环修正。
- **关键细节**: 
  - **光流处理**：用极坐标映射将2通道光流转为3通道RGB-like图像（色相代表方向，饱和度代表速度），以对齐CLIP的预训练语义空间。
  - **未来状态感知**：利用前向运动学计算延迟时间（$T_{lat}$）后的机械臂关节状态，作为VLA的条件输入，实现“过去视觉+未来本体状态 -> 未来动作”的映射。
  - **Res-Refiner架构**：ResNet-10 + 可学习空间嵌入 + MLP，输出动作残差被限制在总动作范围的10%以内，防止过度修正。
- **训练/优化目标**: 
  - **Stage 1 (Flow-Planner SFT)**：最小化条件流匹配（CFM）损失。采用时间偏移（Time-Shift）数据增强，强制模型学习当前视觉与未来本体状态/动作的因果关系。
  - **Stage 2 (Res-Refiner RL)**：冻结Flow-Planner，使用RLPD算法训练Res-Refiner。Critic最小化集成Q网络的Bellman误差，Actor最大化Q值并加入熵正则化，学习对开环误差和动态扰动的补偿。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：Kinetix（基于状态的动态基准），DynBench（作者自建的MuJoCo视觉动态基准，含9个任务），DOMINO（外部动态基准），LIBERO（静态基准）。
  - **真实世界**：4个动态任务（传送带抓取、动态掉落、动态堆叠、移动倒水），使用Agilex Piper 6-DOF机械臂。
  - **对比基线**：PI0.5, RTC, VLASH, DynamicVLA, PUMA。
- **评价指标**: 成功率 (Success Rate, SR)、操作得分 (Manipulation Score, MS)、失败率。
- **主要结果**: 
  - **Kinetix (高延迟 $\delta=4$)**：失败率从SOTA的13%降至3%，成功率维持在97%以上。
  - **真实世界动态任务**：平均成功率达49.0%，是PI0.5 (8.4%) 的约6倍。
  - **DynBench**：平均成功率48.4%，大幅领先PI0.5的9.7%和DynamicVLA的34.3%（约为PI0.5的5倍）。
  - **泛化与静态保持**：在LIBERO静态任务上性能持平或略优于PI0.5，未损害指令跟随能力；在DOMINO上SR和MS均超越SOTA方法PUMA。
  - **消融实验**：去除光流、未来状态预测或Res-Refiner均会导致成功率显著下降（如真实世界中去除Refiner降至25.0%，去除光流降至30.5%）。

- **研究机构**: `原文未提及`

**0. 论文标题**
- **英文标题**: Sparse-WAM: Accelerating World Action Models via Action-Guided Sparse Imagination
- **中文标题**: Sparse-WAM：通过动作引导的稀疏想象加速世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需训练的Token剪枝框架，通过计算动作Token对未来帧Token的注意力分布来筛选并复用关键Token，在几乎不损失机器人控制成功率的前提下，将世界动作模型的推理速度提升了约2倍。

**1. 整体逻辑**
- **研究任务**: 加速基于扩散模型的世界动作模型（WAMs）在机器人控制任务中的推理过程。
- **研究动机**: WAMs在去噪时联合预测未来视觉状态和动作，会产生大量未来帧Token，导致推理延迟极高。现有的Token剪枝方法多基于“视觉保真度”来保留Token，没有利用“动作相关性”来决定在联合去噪中保留哪些未来帧Token，导致大量计算资源浪费在与动作无关的区域。
- **本质改动**: 发现连续去噪步骤中“动作到未来帧”的注意力空间分布高度重叠，因此改用动作引导的注意力得分来筛选未来帧Token，并跨去噪步骤复用这些选择，同时配合轻量级执行引擎消除剪枝带来的额外调度开销。
- **技术溯源**: 基于世界动作模型（WAMs）架构（如 FastWAM-Joint, Cosmos 3）以及 Transformer 的自注意力机制。

**2. 技术拆解**
- **核心方法**: 
  1. **动作引导的Token选择**：将保留的未来帧Token分为两部分：“帧特定核心Token”（跟随每帧的注意力热点）和“共享空间锚点Token”（保留跨帧一致的上下文区域，如机械爪的非接触部分）。
  2. **Pilot 执行引擎**：为了抵消剪枝带来的重组开销，设计了轻量级注意力打分（直接复用原生的 QK 点积和归一化常数，不增加额外前向传播），并在连续去噪步骤中复用 Token 选择位置和缓存的预测值。
- **关键细节**: 
  - **输入输出**：输入为当前观测、任务指令和机器人状态；输出为未来视觉状态和动作块。
  - **模型结构**：基于共享 Transformer 序列联合去噪，保留所有观测和动作 Token，仅对未来的想象 Token 进行稀疏化。
  - **关键超参**：以 Cosmos 3 Nano 为例，每帧原始 360 个 Token，保留 80 个核心 Token 和 104 个共享锚点（共 184 个）；使用 6 个高质量层进行核心 Token 打分，所有层用于锚点打分。
- **训练/优化目标**: 这是一个无需训练（training-free）的推理加速框架，不涉及新的损失函数。其核心机制是在线计算注意力得分进行 Token 筛选，并在被剪枝的区域使用缓存的去噪预测值进行采样更新。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：LIBERO（4个操作套件）、LIBERO-Plus（7类扰动）、RoboLab-120（120个任务），以及真实世界的物体打包、杯子堆叠和电池插入任务。
  - **对比对象（baseline）**：ToCa, WorldCache, SpecPrune-VLA, C3ache。
  - **测试环境**：NVIDIA RTX 4090，使用 CUDA events 测量延迟。
- **评价指标**: 任务成功率（SR）、推理加速比（Speedup）、FLOPs 占比。
- **主要结果**: 
  - **LIBERO 数据集**：相比密集推理，Sparse-WAM 实现了 1.98 倍加速，FLOPs 降至 49.65%，平均成功率仅下降 0.3 个百分点（98.45% vs 密集推理的 98.75%），加速比和成功率均优于所有 baseline。
  - **RoboLab-120 数据集**：在 Cosmos 3 Edge 上实现 1.85 倍加速（成功率 23.00%，密集为 22.90%）；在 Cosmos 3 Nano 上实现 1.81 倍加速（成功率 35.50%，密集为 36.75%）。
  - **真实世界任务**：实现 2.08 倍加速（延迟从 501ms 降至 242ms），平均成功率保持在 75.00%（密集推理为 77.78%）。

- **英文标题**: Inline Memory Meets Reusable Skills: Memory-centric Framework for Vision-Language-Action Model
- **中文标题**: 内联记忆遇上可复用技能：面向视觉-语言-动作模型的以记忆为中心的框架

- **一句话总结**: 提出以记忆为中心的VLA框架Optimus-R，通过显式构建和微调“查询-技能”记忆库来替代传统的参数微调，实现机器人新任务的高效适应与终身学习，大幅降低训练成本并缓解灾难性遗忘。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的下游适应，包括域内小样本适应、跨域迁移（Sim-to-Real）以及终身学习。
- **研究动机**: 现有VLA模型适应新任务主要依赖参数微调（如LoRA或全量微调）。这种“参数中心”的范式导致适应成本高，新技能隐式编码在权重中难以复用，且在持续学习新任务时极易引发灾难性遗忘。
- **本质改动**: 将机器人适应从“参数中心”转向“记忆中心”。不再反复更新模型权重来学习新技能，而是把技能显式外化为可检索、可复用的“查询-技能”记忆对，仅通过微调轻量级的记忆接口和残差来适应新任务。
- **技术溯源**: 基于预训练的 $\pi_{0.5}$ (Physical Intelligence) 视觉-语言-动作模型基座。

**2. 技术拆解**
- **核心方法**: 提出 Optimus-R 框架，包含三个核心模块：内联记忆接口（提取特征）、查询-技能记忆库（存储与检索技能）、桥接与适应机制（跨域对齐）。
- **关键细节**: 
  1. **内联记忆接口**：在VLA的前缀流中插入可学习的记忆token，通过双头注意力池化和编码器，分离出用于检索的查询(query)向量和用于动作表示的技能(skill)向量。
  2. **查询-技能记忆库**：将技能聚类为键值对原型（query prototype 和 skill value）。推理时计算相似度检索Top-K技能，加权聚合后投影为技能token，输入给Flow Policy生成动作。
  3. **桥接与适应机制**：在跨域（如Sim-to-Real）时，使用线性适配器将目标域查询对齐到源域记忆坐标，并用低秩残差适配器修正检索到的技能，解决分布偏移。
  4. **规模与超参**：记忆token数 $m=4$，查询/技能维度 $d_q=d_s=256$，初始记忆库大小 $K_0=128$，检索Top-2。
- **训练/优化目标**: 分三阶段优化。Stage A（接口预训练）：联合优化Flow Matching损失、查询对比损失（InfoNCE）和技能重建损失（Huber）。Stage B/C（桥接与记忆适应）：优化Flow Matching损失、技能对齐损失（MSE）和原型残差正则化损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 LIBERO, CALVIN, RoboTwin 2.0；真实世界使用 9 个双臂操作任务（包含从单臂到双臂的终身学习设定）。
  - **对比对象 (baseline)**：$\pi_{0.5}$ (Full FT, LoRA), OpenVLA-OFT (LoRA), DP, ACT, DP3, RDT, MemoryVLA, DreamVLA, VLA-Adapter, ReconVLA, OpenVLA, UniVLA, $\pi_0$。
- **评价指标**: LIBERO平均成功率(%)、CALVIN平均完成长度(Avg. Len)、RoboTwin 2.0 Hard成功率(%)、真实世界任务成功率(%)、终身学习中的平均遗忘率(%)、训练GPU耗时。
- **主要结果**: 
  1. **域内小样本适应**：仅用30%训练数据，LIBERO平均成功率比 $\pi_{0.5}$ 提升16.5%（达到88.6%）；100%数据下达到97.8%，且训练仅需86 GPU hours（$\pi_{0.5}$ LoRA需128小时，Full FT需560小时），可训练参数约0.3B。
  2. **跨域迁移**：在9个真实世界任务中，每任务仅20个demos，成功率达33.3%，比 $\pi_{0.5}$ 高出13.9%。
  3. **终身学习**：新任务成功率比 $\pi_{0.5}$ 高11.0%；80个demos适应后，平均遗忘率从15.0%降至10.0%，验证了记忆库机制在保留旧技能和学习新技能上的有效性。

**0. 论文标题**
- **英文标题**: SkeleWAM: Skeleton World-Action Modeling for Efficient Robotic Manipulation
- **中文标题**: SkeleWAM：面向高效机器人操作的骨架世界动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种仅 57M 参数的轻量级世界动作模型，用稀疏 3D 骨架（机器人关节+物体中心+交互点）替代视频或视觉隐变量来表示场景，通过联合预测动作和未来骨架实现高效且鲁棒的机器人操作。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型驱动的机器人操作（基于当前 RGB-D 观测和语言指令生成动作序列）。
- **研究动机**: 现有的世界动作模型（WAMs）通常通过预测视频或视觉隐变量来提供未来状态监督。但这些表示隐式地包含交互几何信息，且保留了大量与控制无关的外观特征，导致模型臃肿，且未能直接隔离出控制机器人-物体交互所需的核心空间几何变量。
- **本质改动**: 抛弃了预测视频或视觉隐变量，改用稀疏的 3D 骨架作为统一的状态空间，直接对显式的几何结构（机器人关节、物体中心、交互点）进行动作生成和未来状态预测。
- **技术溯源**: 基于 Flow Matching（流匹配）生成框架；模型架构参考了 Fast-WAM 的双专家混合 Transformer（Mixture-of-Transformers）设计；视觉感知部分依赖冻结的预训练网络提取物体特征，并结合机器人正运动学（Forward Kinematics）。

**2. 技术拆解**
- **核心方法**: 
  1. **稀疏 3D 骨架状态表示**：将操作场景抽象为机器人关节点（由正运动学获取）和物体关键点（物体中心+交互点，由冻结的感知网络从 RGB-D 提取），构成显式的几何状态空间。
  2. **联合训练的双专家架构**：使用 World expert 处理当前和未来骨架，Action expert 处理动作。训练时联合优化动作生成和未来骨架预测，推理时直接丢弃未来预测分支。
  3. **中值动作共识（MAC）**：推理时的一种辅助策略。独立采样多条动作轨迹，计算它们在前 $h$ 步的 Frobenius 距离，选出平均距离最小（最具代表性/最居中）的轨迹，无需依赖奖励模型。
- **关键细节**: 
  - **输入输出**：输入当前 RGB-D、机器人本体感知和语言指令；输出动作块（Action chunk，默认 32 步）。
  - **模型规模**：仅约 57.1M 参数（对比 Baseline 动辄 2B~7.5B，极其轻量）。
  - **推理设置**：使用 10 步流积分，执行前 16 步后重新规划（replan）；MAC 策略默认采样 3 个候选，共识窗口为 10 步。
- **训练/优化目标**: 基于 Flow Matching 的均方误差（MSE）损失。联合损失函数为动作预测损失和未来骨架预测损失的加权和（$\mathcal{L} = \mathcal{L}_{action} + \lambda_s \mathcal{L}_{skeleton}$）。未来骨架预测在训练时作为辅助监督，推理时关闭。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Plus 仿真基准（包含 10030 个变体，涵盖相机、机器人、语言、光照、背景、噪声、布局 7 种扰动），以及 5 个真实世界桌面操作任务。
  - **对比对象（Baseline）**：VLA 模型（OpenVLA, OpenVLA-OFT, NORA, UniVLA, $\pi_0$, $\pi_0$-Fast, $\pi_{0.5}$）和 WAM 模型（WorldVLA, Fast-WAM, VLA-JEPA, GE-Act, Cosmos-Policy）。
- **评价指标**: 零样本（Zero-shot）任务成功率（Success rates）。
- **主要结果**: 
  - **仿真表现**：SkeleWAM (57.1M) 整体成功率达 85.9%，比最强观察基线 Cosmos-Policy (82.2%) 高 3.7%。在相机扰动下达到 93.4%（超 Cosmos-Policy 17.6%）。
  - **真实世界表现**：5 个任务平均成功率 89%，超过 Cosmos-Policy (87%)、Fast-WAM (83%) 和 $\pi_{0.5}$ (76%)。
  - **消融结论**：物体中心与交互点组合效果最好；未来骨架监督能带来 5.8% 的提升；MAC 策略（K=3）比单轨迹采样提升 1.7%。但在布局（Layout）扰动下表现仍有局限（66.6%），说明纯稀疏几何难以完全解决大尺度空间泛化问题。

### 39. 🔥 [UniWAM: Unified World-Action Model] (UniWAM：统一的世界-动作模型)
- **研究机构**: `香港科技大学（广州）、OLA Dimensions`
- **Arxiv ID**: `2610.02054` | [点击跳转](https://arxiv.org/abs/2610.02054)

**0. 论文标题**
- **英文标题**: UniWAM: Unified World-Action Model
- **中文标题**: UniWAM：统一的世界-动作模型
- **研究机构**: 香港科技大学（广州）、OLA Dimensions
- **一句话总结**: 提出了一种融合视觉语言模型和视频生成模型的统一架构 UniWAM，通过联合注意力机制和物理语言监督，同时实现物理世界的语义理解、视觉生成与动作预测，并在多项仿真和真机任务中达到 SOTA。

**1. 整体逻辑**
- **研究任务**: 构建通用机器人基础模型（Generalist robot foundation model），提升机器人在复杂、分布外（OOD）场景下的语义理解、物理动态推理和动作执行能力。
- **研究动机**: 现有的 VLA（视觉-语言-动作）模型仅靠动作监督，缺乏对世界动态的理解；而 WAM（世界-动作）模型虽然继承了视频生成的时空先验，但在分布外场景的语义理解和复杂任务推理能力受限。
- **本质改动**: 将基于 VLM 的物理推理器、基于视频生成模型的世界生成器和动作预测器整合到一个 Mixture-of-Transformers (MoT) 统一架构中，通过联合注意力机制让语义理解、视觉预测和动作生成相互促进。
- **技术溯源**: 基于 Qwen3-VL-2B-Instruct（作为物理推理器）和 Wan2.2-TI2V-5B（作为世界生成器）。

**2. 技术拆解**
- **核心方法**: 
  1. **MoT 统一架构**：三个专家（理解、视频、动作）通过联合注意力（Joint Attention）机制在 Transformer 层间进行特征交互。
  2. **多源数据与互补监督预训练**：混合 VQA、人类第一人称和机器人数据。用自然语言（物理语言）表示低级动作以保持 VLM 能力；VQA 数据监督物理推理器，人类数据监督推理器和生成器，机器人数据监督全部三个组件。
  3. **后训练优化**：引入未来视觉噪声增强（Future visual noise augmentation）和基于历史条件的流匹配（History-conditioned flow matching）。
- **关键细节**: 
  - **输入输出**：输入当前观察、本体状态和任务指令；输出语言序列、未来视觉流和动作块（action chunk）。
  - **模型结构**：物理推理器（隐层512）、世界生成器（隐层3072）、动作预测器（隐层1024），各30层。预测8帧未来画面（384×320分辨率），生成16步动作块。
  - **后训练细节**：未来视觉噪声增强以 0.5 概率对未来的视觉 latent 加噪；动作流匹配的起点从纯高斯噪声改为加噪的历史动作块（长度16，标准差0.02），推理时只需 2-4 步去噪。
- **训练/优化目标**: 
  - 总损失为动作流匹配损失、视觉流匹配损失和语言自回归损失的加权和（预训练权重比为 1:1:0.1）。
  - 视觉和动作均使用 Flow Matching 损失，预测速度场（velocity fields）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/仿真环境**：LIBERO 及 OOD 变体 LIBERO-Plus；RoboTwin 2.0（包含 Clean2Clean 和 Clean2Random 设置）。
  - **真机平台**：AgileX Piper 双臂机器人，配备腕部相机和第三人称相机。
  - **对比对象 (Baseline)**：$\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, GR00T-N1.7, Motus, Fast-WAM, Xiaomi-Robotics-0 等。
- **评价指标**: 
  - 仿真环境：任务成功率（Success Rate, SR）。
  - 真机环境：任务成功率（SR）、指令跟随率（Instruction-Following Rate, IFR）、长程任务进度（Task Progress，0-6分）。
- **主要结果**: 
  - **仿真表现**：在 LIBERO 平均成功率达 99.2%（SOTA）；在 LIBERO-Plus (OOD) 平均成功率 92.6%（SOTA）；在 RoboTwin 2.0 平均成功率 71.73%（C2R 设置下仅比 C2C 下降 6.82%，泛化能力显著优于 $\pi_{0.5}$ 等 baseline）。
  - **真机表现**：指令跟随任务平均 SR 67.5%、IFR 82.5%，分别比 $\pi_{0.5}$ 高出 13.1 和 21.9 个百分点；长程任务进度达 5.0，优于 $\pi_{0.5}$ (4.8) 和 Motus (3.2)。
  - **Scaling Law**：验证了人机协同预训练存在明显的对数线性缩放定律（log-linear scaling law），数据量增加能持续带来 OOD 性能提升。

### 40. 🔥 [ChunkVLA-AM: Parallel Action Chunking for Vision-Language-Action Robot Control in Additive Manufacturing] (ChunkVLA-AM：用于增材制造视觉-语言-动作机器人控制的并行动作分块)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.01856` | [点击跳转](https://arxiv.org/abs/2610.01856)

**0. 论文标题**
- **英文标题**: ChunkVLA-AM: Parallel Action Chunking for Vision-Language-Action Robot Control in Additive Manufacturing
- **中文标题**: ChunkVLA-AM：用于增材制造视觉-语言-动作机器人控制的并行动作分块
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套基于OpenVLA-OFT的云边协同部署流水线，通过定制数据转换、LoRA微调和动作分块（Action Chunking）机制，成功将VLA模型落地于增材制造工作站的零件抓取与转移任务。

**1. 整体逻辑**
- **研究任务**: 将视觉-语言-动作（VLA）模型部署到增材制造（AM）工作站的机械臂（FAIRINO FR3）上，执行打印后零件的识别、抓取与转移任务。
- **研究动机**: VLA模型直接迁移到AM场景面临两个痛点：一是不同机器人平台的数据格式、动作空间和坐标系差异大，适配成本高；二是AM环境的光照和背景变化会影响视觉特征，且单步自回归预测容易产生累积误差（协变量偏移），导致机械臂开环漂移。
- **本质改动**: 构建了一套完整的系统级部署流水线，通过定制TFDS/RLDS数据管道适配特定机器人，采用LoRA进行参数高效微调，并在推理时引入动作分块（Action Chunking）机制，用多步预测替代单步预测以提升轨迹连贯性和空间精度。
- **技术溯源**: OpenVLA-OFT, RLDS/TFDS, LoRA, FastAPI。

**2. 技术拆解**
- **核心方法**: 
  1. 数据转换管道：将单目RGB图像、笛卡尔末端状态、二值夹爪指令和语言指令转换为OpenVLA兼容的RLDS/TFDS格式，统一坐标系和动作语义。
  2. 动作分块推理：模型每次输入当前图像和指令，预测未来H步（实验中H=8）的7维动作，机器人开环执行完该chunk后再获取新观测进行闭环规划。
  3. 云边协同架构：边缘端（CPU）负责图像采集、动作解码、安全校验和执行；云端（GPU服务器）运行7B OpenVLA-OFT模型进行推理。
- **关键细节**: 
  - 动作表示：7维动作（3维平移增量、3维旋转增量、1维二值夹爪），平移和旋转增量在归一化前被裁剪到安全范围（如平移±5mm，旋转±0.05rad）。
  - 模型微调：使用LoRA（rank=32）微调OpenVLA-OFT，冻结预训练骨干，学习率5e-4，有效batch size 32，训练约30个epoch。
  - 图像输入：224x224 RGB图像，平方填充。
  - 安全过滤：客户端执行工作空间边界检查、最小高度检查、最大单步位移限制，拒绝NaN或超时指令。
- **训练/优化目标**: 基于分块动作的负对数似然损失（Chunked Imitation Loss），即最小化预测的H步动作序列与专家动作序列之间的负对数似然。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：原文未提及（仅说明使用自建的FAIRINO FR3单目演示数据集）；对比对象包括Zero-shot OpenVLA、Zero-shot OpenVLA-OFT以及单步微调的OpenVLA基线。
  - 测试环境：固定的FR3 AM工作站，云边架构（RTX 6000 Ada服务器 + CPU客户端），并额外进行了光照和色温的鲁棒性扫测。
- **评价指标**: 
  - 轨迹跟踪：各轴（X, Y, Z）的平均绝对误差（MAE）和3D欧氏距离误差。
  - 物理任务：A到B物体转移任务的成功率。
- **主要结果**: 
  - 轨迹精度：零样本模型完全失效（MAE达179-650mm）；单步微调模型平均MAE为9.50mm（X轴偏差达16.90mm），在物理环境中易发生碰撞；ChunkVLA-AM（8步分块+微调）平均MAE降至1.74mm（X轴0.37mm，Y轴0.97mm，Z轴3.87mm），实现了亚毫米级的横向精度。
  - 物理成功率：42次抓取转移任务成功39次（成功率92.9%），3次失败均因放置高度控制不足导致物体倾倒。
  - 光照鲁棒性：在中等亮度（85-125/0-255）下误差最低，极暗或极亮环境下Z轴和Y轴误差显著增加。

### 41. 🔥 [ActiveWAM: Evidence-Aware Active Vision for World-Action Models] (ActiveWAM：面向世界-动作模型的证据感知主动视觉)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.01698` | [点击跳转](https://arxiv.org/abs/2610.01698)

**0. 论文标题**
- **英文标题**: ActiveWAM: Evidence-Aware Active Vision for World-Action Models
- **中文标题**: ActiveWAM：面向世界-动作模型的证据感知主动视觉
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ActiveWAM，通过训练时历史反转和统一的世界-动作生成，让机器人策略在有限观察窗口内联合学习“保留关键视觉证据”与“主动控制相机获取新视角”，大幅提升了双臂操作在分布外和真实物理任务中的成功率。

**1. 整体逻辑**
- **研究任务**: 具备主动视觉（相机控制）的双臂机器人操作策略学习。
- **研究动机**: 在主动视觉操作中，相机运动决定了有限观察窗口内哪些视觉证据可见。获取新视角可能会丢失关键线索，而保持当前视角又会错过有用信息（即“保留-获取”权衡）。现有方法通常将观察控制和操作解耦，或在测试时进行高开销的视角搜索，无法有效处理这种时序上的证据保留与获取问题。
- **本质改动**: 将主动视觉操作建模为“证据感知的保留-获取问题”。在训练阶段通过任务引导的历史反转（TTI）教模型保留关键证据，在推理阶段通过统一的世界-动作模型（WAM）直接联合输出机械臂和相机头部动作，无需测试时反转或候选排序。
- **技术溯源**: 基于 Wan2.2-TI2V-5B (Wan T2V) 冻结视频先验、EasyWAM-Unified / Fast-WAM 等世界-动作模型框架，以及 DiT (Diffusion Transformer) 架构。

**2. 技术拆解**
- **核心方法**: 
  1. **训练时反转 (Training-Time Inversion, TTI)**：利用冻结的视频先验，在训练时对历史观测进行反转转换。通过提取语言指令中任务相关 token 的交叉注意力权重，约束反转过程保留任务关键证据和可见的时间动态变化。
  2. **感知视角的历史适配器 (View-aware history adapter)**：在视觉 token 中注入相机身份、位姿、曝光时间和有效性等元数据，使策略能区分相机运动和场景变化。
  3. **统一的头-臂联合生成**：在同一个 WAM 中，将头部动作（pan/tilt，包括保持不动和重新获取）与双臂动作拼接，通过流匹配（Flow Matching）联合去噪生成。
  4. **配对学习 (Paired Learning)**：原始历史和反转后的历史共享相同的未来视频和动作目标，并增加一致性损失，确保模型对视角变化具有鲁棒性。
- **关键细节**: 
  - **输入**：9帧 RGB 历史（240×320 分辨率）、语言指令、机器人状态、相机位姿及元数据。
  - **动作空间**：16维，包括左右臂各 6 维位姿增量 + 1 维夹爪，以及 2 维头部平移/俯仰增量。
  - **模型结构**：冻结视频 VAE 和 Wan T2V 先验，微调 DiT 模块和 16-token 适配器。未来视频预测仅作为辅助训练信号，推理时不需要解码未来视频。
- **训练/优化目标**: 
  - **TTI 损失**：任务加权余弦距离损失（保留任务证据） + 动态匹配损失（保留时间一致性）。
  - **策略训练损失**：流匹配损失（视频、手臂、头部预测误差） + 配对一致性损失（约束原始和转换分支的动作速度一致）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：TAVIS benchmark（评估空间/位姿 OOD），新提出的 RoboTwin-AV（50个任务，带 pan/tilt 控制），以及固定相机的 LIBERO / LIBERO-Plus。
  - **对比对象 (baseline)**：ACT, Diffusion Policy, $\pi_0$, $\pi_{0.5}$, Fast-WAM, EasyWAM-Unified, AV-ALOHA。
  - **真实物理环境**：AirbotPlay 双臂平台 + Realsense D455 + IQR 2-DOF 头部，执行切黄瓜、煎蛋、混合炒菜等复合任务。
- **评价指标**: 任务成功率 (Success Rate, SR%)，以及头部移动距离 (Travel)、共视率 (Co-visibility)、重获取时间等诊断指标。
- **主要结果**: 
  - **TAVIS**：在位姿 OOD 条件下，比最强 baseline 提升高达 17.0 个百分点（如 Head 任务在 GR1T2 上提升 13.0 pp，Hands 任务提升 12.0 pp）。
  - **RoboTwin-AV**：在复合分布偏移（Compound shifts）下，比 Fast-WAM 提升 20.0 个百分点（53.3% vs 33.3%）。消融实验证明历史反转和主动头部控制具有互补的增益（交互增益约 5.0 pp）。
  - **真实物理任务**：在厨房复合任务中，总任务成功率达到 50.0%，比 Fast-WAM (23.3%) 高出 26.7 个百分点。
  - **推理效率**：单步动作推理约 165ms (RTX 4090)，有效控制频率约 15Hz，部署时无需在线反转或信息增益计算。

### 42. 🔥 [Divide-and-Remember: Recursive Action-Relevant Memory for Long-Horizon VLA Policies] (分而记之：面向长时程VLA策略的递归动作相关记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00982` | [点击跳转](https://arxiv.org/abs/2610.00982)

**0. 论文标题**
- **英文标题**: Divide-and-Remember: Recursive Action-Relevant Memory for Long-Horizon VLA Policies
- **中文标题**: 分而记之：面向长时程VLA策略的递归动作相关记忆
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作把VLA模型在长时程任务里的“记忆机制”从手工设计的启发式规则，改成了基于信息论端到端优化的递归Token选择器，用极小的Token预算精准保留对当前动作有用的历史帧，大幅提升了复杂操控任务的成功率。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在长时程、部分可观测（POMDP）机器人操控任务中的“记忆问题”（即当前单帧观察不足以决定动作，必须依赖历史信息）。
- **研究动机**: 现有的VLA记忆方法存在明显短板：潜变量记忆（如HAMLET）会把历史压缩成稠密向量，丢失了VLA预训练Token宝贵的空间细节；感知记忆（如TokenDrop）靠“保留像素变化最大的帧”等手工启发式规则来筛选，没有针对控制任务优化，容易记住无用信息（如光照变化）而漏掉关键动作。
- **本质改动**: 将“记什么”从拍脑袋的启发式规则，转变为信息论指导下的优化问题。在VLA预训练的离散Token空间内，通过端到端训练一个轻量级的递归选择器，直接最大化记忆与动作之间的条件互信息。
- **技术溯源**: 基于 $\pi_{0.5}$ VLA基座模型、SigLIP视觉编码器、Gemma VLM，以及 RoboMME 基准测试。

**2. 技术拆解**
- **核心方法**: 提出 Divide-and-Remember (D&R) 方法。将全历史Token的选择递归地分解为多个子问题：每次从 $2K$ 个候选Token中选出 top-$K$ 个。所有递归层级共享同一个轻量级选择器（Selector），选出的Token保留在预训练的离散Token空间中，直接通过注意力机制输入给VLA策略。
- **关键细节**: 
  - **输入输出**：输入是历史观测的Patch Token序列（由冻结的SigLIP提取），输出是预算为 $K$ 个Token的记忆子集。
  - **模型结构**：选择器是一个包含N层Self-Attention和FFN的Transformer，使用多模态旋转位置编码（M-RoPE）保留时空结构。通过Gumbel-Top-K和Sigmoid松弛实现可导的硬选择（前向传播硬截断，反向传播通过软松弛传递梯度）。
  - **规模/超参**：仿真中记忆预算 $K=64$ tokens（真实机器人实验中为1024），候选池大小 $|\mathcal{H}|$ 在128到1024之间（均匀采样历史帧）。
- **训练/优化目标**: 优化目标是最大化动作与记忆的条件互信息 $I(a_t; m_t | o_t)$（即在给定当前观察下，保留历史中对动作有用且当前观察没有的信息）。实际训练中，通过最小化VLA策略的 Flow-matching 动作损失（即条件互信息的变分下界）来端到端联合训练策略参数和选择器参数，无需任何辅助损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboMME 基准（包含16个长时程操控任务，分为Counting, Permanence, Reference, Imitation四个Suite）。真实机器人实验包含4个长时程任务（PutBottles, TrackCube, RepickCube, DrawPattern）。
  - **对比对象 (baseline)**：无记忆 ($\pi_{0.5}$)、感知记忆 (FrameSamp, TokenDrop)、潜变量记忆 (HAMLET, RB-VLA)、参数化记忆 (TTT)。所有方法均基于 $\pi_{0.5}$ 骨干，且记忆预算严格统一为 64 tokens。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - **仿真表现**：在 64-token 预算下，D&R 取得了 38.6% 的平均成功率，显著优于 HAMLET (32.2%)、FrameSamp (27.9%) 和无记忆的 $\pi_{0.5}$ (17.9%)。在需要保留“帧级空间细节”（如模仿动作、视频参考）的任务上优势最明显；在需要跟踪“状态级事实”（如计数）的任务上与潜变量记忆持平。
  - **真机表现**：在真实机器人实验中，D&R 在40次试验中成功35次，远超 FrameSamp (22次) 和无记忆基线 (3次)，证明了其在长时程、有人为干预和感知噪声下的鲁棒性。
  - **效率优势**：D&R 训练只需约20小时，而需要递归更新信念的 RB-VLA 需要10天；且 D&R 在推理时单次前向传播的计算量（TFLOPs）基本不随历史长度增加，保持了极高的推理效率。

### 43. 🔥 [NarrativeFlow: Flow-Based Vision-Language-Action Model Using Robot Velocity Fields] (NarrativeFlow：使用机器人速度场的基于流的视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00981` | [点击跳转](https://arxiv.org/abs/2610.00981)

**0. 论文标题**
- **英文标题**: NarrativeFlow: Flow-Based Vision-Language-Action Model Using Robot Velocity Fields
- **中文标题**: NarrativeFlow：使用机器人速度场的基于流的视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种语言条件下的机器人流生成方法，用流匹配（Flow-Matching）建模连续速度场，并引入场景变化对齐的辅助损失，大幅提升了跨平台机器人操作的成功率。

**1. 整体逻辑**
- **研究任务**: 语言条件下的基于流的机器人操作（领域：机器人学习/具身智能；类型：方法创新）。具体任务是给定初始图像和自然语言指令，生成指导机器人运动的“机器人流（连续速度场）”，再由下游策略执行操作。
- **研究动机**: 现有的基于流的方法要么用稀疏关键点位移来粗略近似（缺乏物理连续性），要么只能处理目标图像条件而无法处理语言指令。此外，仅靠流生成损失训练，模型容易被背景、光照等无关视觉细节干扰，缺乏对任务相关语义的显式监督。
- **本质改动**: 把机器人流从“稀疏关键点位移”改为“基于流匹配的语言条件连续概率速度场”，并引入 Narrative Delta 辅助损失，强制模型中间表征与任务相关的场景变化对齐。
- **技术溯源**: 基于 Flow as Flow（密集速度场生成）、DiT（Diffusion Transformer）、Qwen3-Embedding（语言编码）、DINOv3-ViT（视觉编码）、CoTracker3（点追踪提取GT）。

**2. 技术拆解**
- **核心方法**: 
  1. 视觉-语言融合编码器：设计两个独立的子任务 Token，分别用于条件化流生成模块和计算辅助损失，避免多任务学习时的信号干扰。
  2. Narrative Delta Loss：利用大模型生成描述初始帧到目标帧之间“任务相关场景变化”的多个文本描述，将其编码后与辅助 Token 进行余弦相似度对齐，作为辅助训练目标。
  3. Flow-as-Flow 模块扩展：在图像上均匀撒点，利用 DiT 预测这些点的速度场，通过积分得到未来轨迹；将原有的目标图像条件替换为语言条件 Token。
- **关键细节**: 
  - 输入输出：输入为语言指令和初始图像，输出为 $10\times10$ 个点在 $T=8$ 个时间步的 2D 坐标轨迹（即机器人流）。
  - 模型结构：视觉语言融合编码器（4层 Transformer） + Flow-as-Flow 模块（基于 DiT），总参数量约 487M。
  - 关键超参：稳定系数 $k=1$，噪声标准差 $\sigma_0=0.05$；辅助损失权重 $\lambda$ 在前 30k 步为 0.1，之后降为 $10^{-5}$。推理耗时约 62ms。
- **训练/优化目标**: 总损失为条件流匹配损失（$\mathcal{L}_{FaF}$，监督速度场预测）与 Narrative Delta 损失（$\mathcal{L}_{ND}$，监督场景变化表征对齐）的加权和。

**3. 实验结果**
- **实验设置**: 
  - 数据集：Fractal (Google Robot) 和 Bridge V2 (WidowX) 两个跨平台真实机器人数据集。
  - Baseline：FLIP 和 Im2Flow2Act。
  - 真实世界测试：使用丰田 HSR 移动操作机器人，测试关抽屉、物品入篓、叠杯子等 3 个任务（附录扩展至 13 个任务）。
- **评价指标**: 
  - 离线：平均位移误差 (ADE，主指标)、最终位移误差 (FDE)、小于像素阈值的点比例 (LTDR)。评估区域限制在末端执行器附近。
  - 真实世界：任务成功率。
- **主要结果**: 
  - 离线定量：在 Fractal 和 Bridge V2 上，ADE 分别降至 21.68 和 30.59，比最优 Baseline (37.14 和 50.73) 分别降低了 15.46 和 20.14，FDE 和 LTDR 也全面占优。
  - 真实世界：在 3 个移动操作任务中，平均成功率达到 55%，比最强 Baseline Im2Flow2Act (42%) 高出 13 个百分点，与使用 Ground Truth 流的 Oracle 方法 (63%) 差距缩小至 8 个百分点。附录中 13 个任务的平均成功率达到 58%。

### 44. 🔥 [TOAST: Stochastic Robot Action Tokenization for Autoregressive Vision-Language-Action Models] (TOAST：用于自回归视觉-语言-动作模型的随机机器人动作Token化)
- **研究机构**: `原文未提及具体机构名称，致谢中提及日本JST CREST项目及FRONTia国家项目`
- **Arxiv ID**: `2610.00899` | [点击跳转](https://arxiv.org/abs/2610.00899)

**0. 论文标题**
- **英文标题**: TOAST: Stochastic Robot Action Tokenization for Autoregressive Vision-Language-Action Models
- **中文标题**: TOAST：用于自回归视觉-语言-动作模型的随机机器人动作Token化
- **研究机构**: 原文未提及具体机构名称，致谢中提及日本JST CREST项目及FRONTia国家项目
- **一句话总结**: 提出TOAST方法，在训练时对同一量化动作序列随机采样不同的Token分割方式，在不增加额外演示数据的前提下，显著提升自回归VLA模型在有限数据下的策略学习效率。

**1. 整体逻辑**
- **研究任务**: 自回归视觉-语言-动作（VLA）模型中的机器人策略学习（模仿学习）。
- **研究动机**: 现有的基于频率的动作压缩方法（如FAST）通常对量化后的动作序列分配单一的确定性Token序列。但同一个量化动作序列可以有多种合法的Token分割方式。确定性分词会让策略过度拟合特定的Token模式或分割边界，在训练数据（机器人演示）有限时容易导致过拟合，降低策略学习效率。
- **本质改动**: 将NLP中的子词正则化（随机分词）引入机器人动作Token化，在训练阶段对同一底层动作的多种等价Token序列进行随机采样，实现表示层面的正则化。
- **技术溯源**: 基于自回归VLA架构（骨干为PaliGemma-3B），动作压缩借鉴了FAST（基于DCT的频率压缩）和SentencePiece（Unigram语言模型）。

**2. 技术拆解**
- **核心方法**: 提出TOAST（Tokenization of Action Sequences with Stochastic Sampling）。首先对量化后的动作序列进行维度优先（dimension-major）展平，构建Unigram语言模型。在训练时，通过n-best搜索获取多个候选Token序列，并根据Unigram概率和温度参数进行随机采样，将采样到的序列作为训练目标。推理时则恢复为确定性解码。
- **关键细节**: 
  - **输入输出**：输入为量化并展平的动作序列，输出为采样的Token序列。
  - **模型结构**：基于PaliGemma-3B骨干的自回归VLA。
  - **规模与超参**：Unigram词表大小为512；n-best搜索候选数n=64；平滑参数$\alpha$在LIBERO设为0.1，真机设为0.5。动作块预测时长为1秒（LIBERO horizon=10，真机horizon=20）。
- **训练/优化目标**: 标准的下一个Token预测（Next-token prediction）交叉熵损失。网络结构和损失函数不变，仅将训练时的监督标签（Target）替换为随机采样的等价Token序列。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真使用LIBERO基准（包含Spatial, Object, Goal, Long 4个任务套件）；真机使用4个Franka机器人操作任务（Table Bussing, Grocery Bagging, Breakfast Setup, Drawer Stowing）。
  - **Baseline**：Binning, FAST+, FAST (rebuilt), VQ-VLA, BEAST, TOAST (deterministic)。
- **评价指标**: 平均成功率（Mean success rate），通过分层bootstrap计算95%置信区间评估显著性。
- **主要结果**: 
  - **仿真（LIBERO）**：在所有数据规模下均优于确定性版本，且数据越少优势越明显。在仅使用1/16训练数据时，成功率达到42.8%，比确定性版本（36.0%）提升6.8个百分点。
  - **真机**：在4个任务上，平均成功率达到50.8%，比确定性版本提升15.8个百分点，比FAST+提升20.0个百分点。在需要高精度操作（如抓取盘子边缘、准确触碰抽屉把手）的任务中鲁棒性提升明显。
  - **机制分析**：随机分词显著降低了策略对单一Token分割的敏感度（等价Token序列的损失差$\Delta_{tok}$降至接近0），且n-best搜索的计算开销几乎可忽略（每步仅增加0.4%时间）。

### 45. 🔥 [Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena] (前沿VLM智能体准备好成为通用机器人了吗？基于Embodied Agent Arena的实证研究)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00854` | [点击跳转](https://arxiv.org/abs/2610.00854)

**0. 论文标题**
- **英文标题**: Are Frontier VLM Agents Ready to Be Robot Generalists? An Empirical Study with the Embodied Agent Arena
- **中文标题**: 前沿VLM智能体准备好成为通用机器人了吗？基于Embodied Agent Arena的实证研究
- **研究机构**: 原文未提及
- **一句话总结**: 构建了包含1000个case的统一评测基准Embodied Agent Arena，解耦评估了7个前沿VLM在5大机器人能力域的局部感知与最终任务达成能力，指出局部能力向完整物理目标转化的缺失是当前通用机器人的核心瓶颈。

**1. 整体逻辑**
- **研究任务**: 评估前沿视觉语言模型（VLM）作为通用机器人智能体（Robot Generalists）的成熟度，具体涵盖几何估计、空间推理、可供性（Affordance）、任务规划和机械臂操作五个能力域。
- **研究动机**: 现有评测的平均分掩盖了模型在局部能力（如感知、定位）和完整任务目标（如最终物理状态达成）之间的差距；终端失败也可能掩盖有用的局部进展。需要一种能区分局部能力和最终任务完成度的统一评测视角，以诊断VLM到底“能做什么”以及“还缺什么”。
- **本质改动**: 构建了一个解耦评估局部指标精度、功能定位和原生目标完成度的统一评测基准，并引入新的几何估计基准GeoProbe，通过最小化执行框架（harness）在统一条件下诊断VLM的局部能力与全局任务鸿沟。
- **技术溯源**: 整合了32个现有机器人/视觉基准（如ALFRED, CALVIN, RLBench, ManiSkill等），新提出基于Blender渲染和真实图像的GeoProbe基准；评估对象为7个前沿VLM（Astra, Sol, Fable, Qwen-Max, Gemini, Qwen-397B, Qwen-27B）。

**2. 技术拆解**
- **核心方法**: 1) 构建5大能力域的1000个case评测集；2) 提出GeoProbe（168个case），通过控制相机运动、物体运动和尺度参考诊断几何估计的度量歧义；3) 设计统一Agent Harness，支持持久化的模型驱动交互（Python runtime或原生agent loop），独立计算连续误差、任务特定证据和终端成功率。
- **关键细节**: 输入包含图像、视频或符号状态，输出为数值、点/框坐标或动作序列。系统规模包含1000个case（660个固定输入，340个交互）。在匹配推理预算（Tokens）和执行步数限制下，对比了Baseline和RGB-expanded（每轮提供当前RGB图像）两种执行协议。
- **训练/优化目标**: 本文非学习类工作，无训练损失函数。核心机制为基于规则的独立评分系统：几何精度（MAE, RMSE, AbsRel, 姿态误差等）、空间推理（Pass@1）、Affordance（Mask IoU, 接触点有效性）、规划（终端谓词满足率）、操作（原生成功率、连续目标完成数）。

**3. 实验结果**
- **实验设置**: 使用自建的Embodied Agent Arena（含32个现有基准+GeoProbe）；对比对象为7个VLM（Astra, Sol, Fable, Qwen-Max, Gemini, Qwen-397B, Qwen-27B）；测试环境为统一的Python runtime及13个操作仿真器（如CALVIN, RLBench, ManiSkill等），在匹配预算下测试Baseline与RGB-expanded协议。
- **评价指标**: 任务成功率（Pass@1, Native success）、几何精度（连续误差如MAE, RMSE, AbsRel, 旋转/平移误差）、定位精度（IoU, 接触点有效性）、连续目标完成数（如CALVIN中的平均连续完成目标数）。
- **主要结果**: 
  1) Astra在精确几何估计（最低姿态误差）和可用接触定位（最高接触有效性60.3%）上优势最强，规划成功率最高（80.3%）。
  2) 核心Gap在于局部能力向完整目标的转化：Astra在复杂家庭场景操作（如RoboCasa, BEHAVIOR-1K）中几乎全部失败，轨迹追踪也常因终点放置失败而功亏一篑。
  3) 在匹配预算下，提供更丰富的视觉观察（RGB-expanded）会反转Astra在CALVIN上的领先优势（连续目标完成数从3.10降至1.10），但会在其他任务上带来收益。
  4) 多轮审查中，工具辅助审查能提升部分Affordance成功率，但对Geometry指标有正有负，表明单纯增加反思轮次无法系统性解决度量歧义。

### 46. 🔥 [Getting Out and Getting Back: World and Behavior Grounding in Real2Sim2Real Co-Training] (走出去与走回来：Real2Sim2Real联合训练中的世界与行为接地)
- **研究机构**: `Industrial Next`
- **Arxiv ID**: `2610.00821` | [点击跳转](https://arxiv.org/abs/2610.00821)

**0. 论文标题**
- **英文标题**: Getting Out and Getting Back: World and Behavior Grounding in Real2Sim2Real Co-Training
- **中文标题**: 走出去与走回来：Real2Sim2Real联合训练中的世界与行为接地
- **研究机构**: Industrial Next
- **一句话总结**: 将Real2Sim2Real中的仿真数据对齐解耦为“世界接地”和“行为接地”两个独立维度进行2x2析因实验，揭示了两者在联合训练中对策略性能的不同贡献及行为切换机制。

**1. 整体逻辑**
- **研究任务**: 移动传送带上的动态灵巧抓取与分拣任务（基于少量真实遥操作演示和大量仿真数据进行联合训练）。
- **研究动机**: 仿真能扩充稀缺的真实数据，但现有Real2Sim2Real流程同时改变了环境重建和动作优化，导致无法厘清“物理/视觉世界保真度”和“轨迹与人类动作相似度”各自对联合训练策略性能的具体影响。
- **本质改动**: 构建了一个可独立控制“世界接地（World Grounding）”和“行为接地（Behavior Grounding）”的数据生成流水线，通过2x2析因实验量化两者的独立与联合贡献，并分析了策略在真实与仿真状态间的行为切换机制。
- **技术溯源**: MuJoCo Warp（物理仿真）、Isaac Sim（渲染）、MimicGen（行为接地）、GraspGen-X（无行为接地轨迹生成）、SAM 2与FoundationPose（位姿估计）、Flow-matching Transformer（策略模型）、DINOv3与CLIP（特征提取）。

**2. 技术拆解**
- **核心方法**: 设计2x2析因实验的数据生成流水线，独立控制两个接地维度：
  1. 世界接地（World Grounding）：Grounded（进行相机几何与模糊校准、场景重建、机器人运动学与控制器系统辨识） vs Ungrounded（使用理想相机、标尺测量、标称运动学和计算增益）。
  2. 行为接地（Behavior Grounding）：Grounded（使用MimicGen将真实演示平移到新位姿/尺寸/速度，保留人类动作特征） vs Ungrounded（使用GraspGen-X和运动规划器生成无人类参考的机器生成轨迹）。
- **关键细节**: 物理仿真用MuJoCo Warp，渲染用Isaac Sim RTX。每种配置生成约1500条成功抓取并放置的仿真轨迹。策略模型采用条件Flow-matching Transformer（包含500M从头训练模型和2B预训练基础模型），输入为3个256x256 RGB视图、本体感觉、文本指令和具身标识，输出40步动作块。
- **训练/优化目标**: 模仿学习（Imitation Learning）。使用条件Flow Matching（两步Euler求解器，NFE=2）在50Hz动作网格上生成动作，最小化预测动作与真实/仿真演示动作之间的分布差异。

**3. 实验结果**
- **实验设置**: 硬件为双Flexiv Rizon 4S机械臂配Wuji Hand 2。数据集包含100条真实遥操作演示和约1500条仿真轨迹（4种接地配置）。对比对象（Baseline）为仅用100条真实数据训练的策略，以及用1000条真实数据微调的基础模型。评估在50次真实世界测试中进行（24次标称条件，26次包含光照、传送带速度、新物体等偏移条件）。
- **评价指标**: 真实世界Rollout的任务成功率（Success rate）。
- **主要结果**: 
  1. 联合训练显著提升性能：500M策略的成功率从纯真实数据的52%提升至完全接地联合训练的86%。
  2. 接地维度贡献：平均来看，世界接地提升18个百分点，行为接地提升10个百分点；世界接地在真实数据未覆盖的偏移条件下收益更大。
  3. 基础模型等效性：对于2B基础模型，100条真实数据+完全接地仿真数据的成功率（90%）至少匹配了使用1000条真实数据微调的效果。
  4. 行为切换机制：定性分析与隐空间分析表明，联合训练策略在真实数据覆盖的状态下模仿真实演示，在仿真覆盖的状态下依赖仿真行为（如两指捏合）；若世界接地不完善，策略进入仿真行为后难以切回真实行为（如无法释放物体）。

### 47. 🔥 [When Reasoning Helps Action: Monitoring and Steering Chain-of-Thought in Vision-Language-Action Policies] (当推理有助于行动：监控与引导视觉-语言-动作策略中的思维链)
- **研究机构**: `Stanford University`
- **Arxiv ID**: `2610.00601` | [点击跳转](https://arxiv.org/abs/2610.00601)

**0. 论文标题**
- **英文标题**: When Reasoning Helps Action: Monitoring and Steering Chain-of-Thought in Vision-Language-Action Policies
- **中文标题**: 当推理有助于行动：监控与引导视觉-语言-动作策略中的思维链
- **研究机构**: Stanford University
- **一句话总结**: 提出离线训练的价值模型在推理时监控并引导VLA模型的思维链，发现提升推理正确性不一定能改善具身动作表现，需严格区分“推理可纠正性”与“动作可行动性”。

**1. 整体逻辑**
- **研究任务**: 评估并提升带有思维链（CoT）的视觉-语言-动作（VLA）模型在运行时的安全性，即检测并纠正不可靠的推理，并验证纠正后的推理能否实质性地改变下游动作。
- **研究动机**: 现有的推理型VLA模型在推理出错时可能导致危险动作。虽然CoT提供了运行时安全监控的接口，但纠正推理是否真能改变动作（即推理对动作的因果影响力）尚不明确。如果模型“说一套做一套”，仅纠正推理将毫无意义。
- **本质改动**: 引入一个独立于策略的离线价值模型，在推理生成阶段进行token级别的正确性预测和分布重加权；同时在评估时，将“推理能否被纠正（Correctability）”和“纠正后动作是否按预期改变（Actionability）”解耦为两个独立的评价维度。
- **技术溯源**: 基于现有的推理型VLA基座（Alpamayo 1.5 和 DeepThinkVLA），以及价值增强采样（Value-Augmented Sampling, VAS）技术。价值模型的骨干网络使用了 Qwen3-VL-4B-Instruct 和 PaliGemma-2-3B。

**2. 技术拆解**
- **核心方法**: 提出 `trust` (Token-level Reward for Utility-Steered Chain-of-Thought)。包含两部分：1) 离线训练一个多模态价值模型，输入视觉观察和部分推理前缀，预测最终推理正确的概率；2) 推理时，当预测概率低于阈值，使用门控价值增强采样（Gated VAS）对候选token重新打分和重加权，引导生成正确的推理，且全程冻结原VLA策略权重。
- **关键细节**: 价值模型与策略模型共享tokenizer，但不访问策略权重或隐藏状态。训练数据通过让VLM Judge对同一场景下多个存在矛盾的推理轨迹进行打分获得。推理引导时，取原策略分布下Top-K（K=10）的候选token，用价值模型计算追加该token后的正确性log-odds，通过温度参数 $\beta$ 调整权重后重新采样。
- **训练/优化目标**: 价值模型使用轨迹归一化的二元交叉熵损失（trace-normalized binary cross-entropy），以VLM Judge标注的完整推理轨迹正确性（Yes/No）作为标签，对每个推理token位置进行监督。

**3. 实验结果**
- **实验设置**: 
  - 自动驾驶：基座策略 Alpamayo 1.5，在 AlpaSim 中使用 PhysicalAI-Autonomous-Vehicles-NuRec (public_2601) 数据集评估。对比 Baseline：Unsteered（默认解码）和 Best-of-4（匹配计算预算）。
  - 机械臂操作：基座策略 DeepThinkVLA，在 LIBERO-Plus 数据集评估。对比 Baseline：Unsteered 和 Best-of-32（匹配计算预算）。
- **评价指标**: 
  - 监控与纠正：推理正确率（由VLM Judge评估）、监控准确率（与Judge结论的一致率）。
  - 自动驾驶行为：最大轨迹距离误差、ADE（2.5s和5.0s）、碰撞率、偏离道路率、近距离相遇率。
  - 操作行为：LIBERO任务成功率、抓取/释放意图的实际执行率（夹爪移动距离）。
- **主要结果**: 
  - **可纠正性 (Correctability)**：两个任务均大幅提升。Alpamayo 1.5 推理正确率从 75.9% 提升至 90.0%（Best-of-4为85.9%）；DeepThinkVLA 的抓取状态正确率从 69.3% 升至 90.2%，动作选择从 68.8% 升至 85.9%。
  - **可行动性 (Actionability)**：表现因任务而异。在自动驾驶中，纠正有效，挑战性子集碰撞率降低 30.4%（15.33%降至10.67%），最大轨迹误差降低 11.5%，且刹车意图确实导致了车辆减速。但在机械臂操作中，尽管推理正确率提升，LIBERO-Plus 任务成功率几乎不变（78.86% 降至 78.26%），且推理中的抓取/释放意图极少被夹爪实际执行，说明该策略对推理纠正的响应较弱。

### 48. 🔥 [Token-World: World Modeling in Vision-Language Model Token Space for Robot Manipulation] (Token-World：在视觉语言模型Token空间中进行机器人操作的世界建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00575` | [点击跳转](https://arxiv.org/abs/2610.00575)

**0. 论文标题**
- **英文标题**: Token-World: World Modeling in Vision-Language Model Token Space for Robot Manipulation
- **中文标题**: Token-World：在视觉语言模型Token空间中进行机器人操作的世界建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出在VLM视觉Token空间内直接构建世界模型，通过语义VAE将高维Token压缩为紧凑状态进行动态预测，避免了生成中间RGB图像，大幅提升了长时程预测保真度、闭环策略评估准确性及模拟效率。

**1. 整体逻辑**
- **研究任务**: 为视觉-语言-动作（VLA）系统构建世界模型（World Model），用于模拟环境动态以支持策略评估、数据合成或强化学习。
- **研究动机**: 现有世界模型通常预测未来的RGB图像，再重新编码为VLA策略的输入。这种间接接口存在两个问题：一是RGB重建会浪费模型容量在策略不关心的视觉细节上；二是反复解码和重编码带来计算开销。直接在原始VLM Token空间建模可避免上述问题，但原始VLM Token维度太高，直接做自回归动态建模既困难又低效。
- **本质改动**: 不在像素空间或原始高维VLM Token空间建模，而是将VLM视觉Token压缩到一个紧凑的语义Token状态空间（保留空间布局，仅压缩特征维度），在这个紧凑空间里学习动作条件的动态演化，预测完再映射回原始VLM Token空间供策略使用。
- **技术溯源**: 基于视觉语言模型（Qwen3-VL）、Flow-matching DiT（用于动态建模）、Semantic VAE (S-VAE)（用于特征压缩）。

**2. 技术拆解**
- **核心方法**: 
  1. 特征压缩：使用单独训练的语义VAE（S-VAE）将高维VLM视觉Token压缩为紧凑的语义Token状态，保持空间Token数量和布局不变。
  2. 动态建模：使用基于Flow-matching的时空Transformer（带因果时间注意力和GRU循环记忆）在紧凑状态空间（结合本体感觉）中学习动作条件的状态转移。
  3. 自回归Rollout：推理时，在紧凑空间进行自回归预测，需要输入给下游策略时，再通过冻结的S-VAE解码器映射回原始VLM Token空间，全程不生成RGB。
- **关键细节**: 
  - 输入输出：动态模型输入为当前紧凑状态、本体感觉、动作；输出为下一步紧凑状态。最终输出映射回VLM Token。
  - 模型结构：S-VAE（压缩/解码） + 时空Transformer（带GRU记忆） + Flow-matching DiT。
  - 规模与超参：VLM空间Token数 N=108，原始维度 D0=2560，压缩维度 d=16。Flow-matching使用 x0 参数化，结合 shortcut forcing 支持少步生成（推理用16步）。
- **训练/优化目标**: 
  - S-VAE训练：MSE损失 + 余弦相似度损失 + KL散度正则化。
  - 动态模型训练：x0参数化的Flow-matching目标（带权重 shortcut forcing），预测干净的未来紧凑状态。VLM编码器和S-VAE在动态模型训练时保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集：仿真环境 RoboTwin（50个任务，5000条轨迹），真实环境 Franka 机械臂数据集（6个任务，600条轨迹）。
  - Baseline：IRASim (ICCV'25), Ctrl-World (ICLR'26), WorldGym (ICLR'26)。
  - 闭环评估策略：StarVLA variants (StarVLA-OFT, StarVLA-PIv3, StarVLA-GR00T)，基于 Qwen3-VL 骨干。
- **评价指标**: 
  - 开环：VLM特征保真度（余弦相似度、NMSE），策略-动作一致性（余弦相似度、NMSE）。
  - 闭环：模拟成功率与真实成功率的皮尔逊相关系数，单步模拟延迟（秒）。
- **主要结果**: 
  - 开环预测：在RoboTwin上，特征余弦相似度达到0.7714（IRASim 0.7372, Ctrl-World 0.7097），动作余弦相似度0.9439（IRASim 0.9260, Ctrl-World 0.9265）。长时程rollout特征和动作退化更慢。
  - 闭环评估：模拟成功率与真实成功率的相关系数 r=0.794（Ctrl-World为0.583），回归线更接近真实值。
  - 模拟效率：单步模拟延迟0.359秒，比IRASim快2.0倍，比Ctrl-World快5.3倍，比WorldGym快6.1倍。
  - 消融实验：证明紧凑状态维度 d=16 是动态预测的最佳折中（过高或过低都会降低预测性能）；S-VAE压缩后的状态比原始VLM特征和SDXL-VAE潜变量更容易被动态模型学习（特征NMSE从0.7851降至0.4892）。

### 49. 🔥 [Same Scene, Different Task: Skill Alignment for Compositional Generalization in VLAs] (同一场景，不同任务：视觉语言动作模型中用于组合泛化的技能对齐)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00524` | [点击跳转](https://arxiv.org/abs/2610.00524)

**0. 论文标题**
- **英文标题**: Same Scene, Different Task: Skill Alignment for Compositional Generalization in VLAs
- **中文标题**: 同一场景，不同任务：视觉语言动作模型中用于组合泛化的技能对齐
- **研究机构**: 原文未提及
- **一句话总结**: 提出 CRAFT 方法，通过构建反事实对和对齐技能表示，解决 VLA 模型微调时因“视觉捷径”导致的组合泛化失败问题，使其能重新组合已演示的基础技能来完成未见过的任务。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的组合泛化能力（Compositional Generalization），即让模型能重新组合微调演示中见过的基础技能（如“抓红块”、“放蓝盘”），去执行未见过的技能组合任务（如“抓红块放到蓝盘”）。
- **研究动机**: 现有 VLA 模型在微调后存在“视觉捷径”（vision shortcut）问题。模型倾向于把视觉观察当作指令的代理，直接执行与当前视觉场景相似的已演示任务组合，而不是真正根据指令去组合技能，导致在未见过的技能组合上成功率极低。
- **本质改动**: 不依赖合成新轨迹或在部署时拼接技能，而是在微调阶段引入可复用的“技能表示”和“状态表示”。通过构建反事实对（固定观察、改变指令为未见组合），将已演示技能的监督信号转移到未见组合上，强迫模型根据指令而非视觉捷径来预测动作。
- **技术溯源**: 基于 $\pi_0$、$\pi_{0.5}$ 和 GR00T N1.7 等 VLA 模型基座，以及 LIBERO 仿真环境。

**2. 技术拆解**
- **核心方法**: 提出 CRAFT (Counterfactual Skill-Representation Alignment for Fine-Tuning)。包含两个核心机制：
  1. **学习可复用的技能表示**：通过对比学习，让同一技能在不同执行中的表示在动作预测时产生相近的误差，同时拉开不同技能表示的误差，确保技能表示的独立性和可复用性。
  2. **反事实监督**：固定当前视觉观察，将指令改为未演示的组合。利用该指令对应的“技能表示”与已演示该技能的“状态表示”结合，用已演示的动作目标来监督模型，从而训练出正确的技能表示，无需为反事实对合成动作标签。
- **关键细节**: 
  - **模型结构**：在 VLM backbone 中加入两组可学习的查询 token（Skill queries 和 State queries）。Skill queries 关注图像和文本生成技能表示；State queries 只关注图像生成状态表示。两者共同条件化动作专家（Action expert）。
  - **反事实对构建**：分为改变当前技能（skill-changing）和保持当前技能（skill-preserving）两种情况，分别匹配不同的参考样本进行监督。
  - **关键超参**：对比学习温度 $\tau=0.1$；损失权重 $\beta=0.03$（技能对比损失），$\gamma=1.0$（反事实损失）。
- **训练/优化目标**: 总损失 $\mathcal{L}_{total} = \mathcal{L}_{fm} + \beta \mathcal{L}_{skill} + \gamma \mathcal{L}_{cf}$。
  - $\mathcal{L}_{fm}$：标准的 Flow Matching 损失，监督已演示动作。
  - $\mathcal{L}_{skill}$：对比损失，拉近同技能不同执行的预测误差，推开不同技能的预测误差。
  - $\mathcal{L}_{cf}$：反事实损失，包含 $\mathcal{L}_{change}$ 和 $\mathcal{L}_{preserve}$。用反事实技能表示和参考状态表示预测动作，并与参考动作目标计算 MSE。训练时使用特定的梯度路由（Gradient routing）来隔离状态表示和动作专家的更新。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的两个组合泛化基准 Pick-Place（4色方块和盘子，16种组合，演示4种同色组合）和 Pick-Place-Press（2色，8种组合，演示2种同色组合），基于 LIBERO 环境构建。真实机器人实验使用 Piper 6-DoF 机械臂。
  - **对比对象（baseline）**：标准微调（Full, LoRA, Frozen），CAG-VA（通过引导缓解视觉捷径），Skill Composition（部署时顺序执行已学技能）。
  - **基座模型**：$\pi_0$, $\pi_{0.5}$, GR00T N1.7。
- **评价指标**: 任务成功率（Task success rate），即在固定步数内完成指令指定所有阶段的比例。
- **主要结果**: 
  - **仿真环境**：CRAFT 在未见组合上大幅提升成功率，同时保持已演示组合的高成功率。例如在 Pick-Place 中，$\pi_{0.5}$ (Full) 的未见组合成功率仅 8.4%，CRAFT 提升至 84.2%；在 Pick-Place-Press 中，从 0.7% 提升至 62.6%。显著优于 CAG-VA 和 Skill Composition。
  - **真实机器人**：在 $\pi_{0.5}$ 上，Full 微调的未见组合成功率为 9/60，CRAFT 提升至 43/60，验证了其在真实物理环境中打破视觉捷径、实现组合泛化的能力。

### 50. 🔥 [DeepJEPA: Scaling World Models from Within] (DeepJEPA：从内部扩展世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00368` | [点击跳转](https://arxiv.org/abs/2610.00368)

**0. 论文标题**
- **英文标题**: DeepJEPA: Scaling World Models from Within
- **中文标题**: DeepJEPA：从内部扩展世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DeepJEPA，将世界模型的测试时计算扩展从“增加轨迹/步数”转变为“在单个状态转移内部动态分配计算深度”，以极低的额外算力开销提升了基于 CEM 的潜在规划器在视觉控制任务中的性能。

**1. 整体逻辑**
- **研究任务**: 视觉控制任务中的基于潜在空间的模型预测控制（Latent MPC）。
- **研究动机**: 现有世界模型规划器在测试时通常只向外扩展（增加候选轨迹或预测步数），对每个想象的状态转移分配固定的计算深度。这浪费了算力，因为有用的预测细化往往只集中在少数决策关键事件（如物理接触）上；实验证明统一加深预测不仅不能单调提升性能，反而可能破坏规划器依赖的候选排序。
- **本质改动**: 将“状态转移内部的计算深度”作为一个新的测试时扩展轴，让模型自己学习在什么时候、对哪些候选轨迹的转移进行更深的循环推理（即“向内扩展”），而不是全局统一加深或延长。
- **技术溯源**: 基于联合嵌入预测架构（JEPA），特别是动作条件化的 JEPA（如 V-JEPA 2-AC, LeWorldModel），以及交叉熵方法（CEM）规划器。

**2. 技术拆解**
- **核心方法**: DeepJEPA 将 JEPA 的状态转移从单次原子预测变为有预算的循环计算过程。使用权重共享的循环单元进行多次潜在状态更新，并引入一个“继续（continue）”头，独立决定每个候选轨迹在每个时间步是否需要再次计算。
- **关键细节**: 输入为过去 $L$ 个（$L=3$）潜在状态和动作；模型包含在线/目标视觉编码器、上下文网络、共享循环转移单元和线性 continue head。最大内部深度 $K_{\max}=4$。推理时，当 continue head 的输出概率低于阈值 $\eta$ 或达到最大深度时停止计算，全程不依赖未来真实帧。
- **训练/优化目标**: 训练时，利用目标编码器获取真实未来潜在状态，计算每次更新的预测误差相对改进率作为标签，用二元交叉熵训练 continue head。总损失包含最终深度预测损失、中间步监督损失和 continue 损失。推理时仅依赖当前循环状态做自适应停止。

**3. 实验结果**
- **实验设置**: 在五个视觉控制任务（Reacher, Cube Single, Cube Double, Cube Triple, PushT）上进行评估。对比基线包括固定深度（K=1, 2, 3, 4）的循环模型家族，以及非循环基线 LeWM。使用基于 CEM 的 MPC 规划器，固定候选数量、迭代次数和视界。
- **评价指标**: 平均成功率（Mean success rate, %）和平均选择深度（Mean selected depth $\bar{K}$）。
- **主要结果**: 
  1. 统一加深（K=4）并不比 K=1 好，甚至更差，证明统一深度不是可靠的 scaling law。
  2. DeepJEPA 在 4 个任务上超越最佳固定深度，1 个任务持平，同时平均深度仅为 1.00–1.26，实现了计算的高效分配。
  3. 机制分析表明，额外的计算集中在物理接触发生和持续交互阶段；且这种细化并没有提高全局状态特征的可解码性，而是通过微调候选成本，使其跨越 CEM 的精英集边界（elite boundary），从而改变最终的动作选择。

### 51. 🔥 [Continuous Conditioning of VLAs with Augmenting EMG and Visual Task Descriptors] (通过增强EMG和视觉任务描述符对VLA进行连续条件控制)
- **研究机构**: `Johns Hopkins Applied Physics Laboratory (JHU APL)`
- **Arxiv ID**: `2610.01794` | [点击跳转](https://arxiv.org/abs/2610.01794)

**0. 论文标题**
- **英文标题**: Continuous Conditioning of VLAs with Augmenting EMG and Visual Task Descriptors
- **中文标题**: 通过增强EMG和视觉任务描述符对VLA进行连续条件控制
- **研究机构**: Johns Hopkins Applied Physics Laboratory (JHU APL)
- **一句话总结**: 提出在VLA模型中用连续的肌电信号（EMG）或视觉分割掩码替代/增强传统的纯文本任务描述，显著提升了机器人在杂乱/模糊场景下的任务成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作（VLA）模型的机器人抓取与放置任务。
- **研究动机**: 现有VLA模型高度依赖前置的固定文本指令来定义任务。但在杂乱或模糊场景中，纯文本往往描述不清（underspecified），人类在表达复杂意图时，更自然地会通过肢体动作（如手势）或视觉指示（如指向、圈出目标）来补充细节，而不是写一长串文字。
- **本质改动**: 将任务条件（Task Conditioning）从单一的“固定文本”扩展为“多模态连续状态信号”。在本体感觉或视觉图像中引入连续的辅助条件（EMG或视觉掩码），同时弱化文本的指令细节。
- **技术溯源**: 基于 SmolVLA 和 $\pi_{0.5}$（两者均为 action-expert 架构的 VLA，底层是 VLM backbone，顶层是 flow-matching action head）。

**2. 技术拆解**
- **核心方法**: 
  1. **EC-VLA（肌电条件VLA）**：将8通道EMG信号包络拼接到本体感觉向量中作为连续条件。文本退化为通用指令（如“抓取方块并放入盒子”），具体抓哪个由人的手腕EMG手势（左移、右移、选择）实时控制。
  2. **VA-VLA（视觉注释VLA）**：在图像输入中加入视觉分割掩码（绿色高亮目标物体，蓝色高亮放置位置），文本同样退化为通用指令（如“拿起物体并放置”）。
- **关键细节**: 
  - **EC-VLA**：使用 SO-101 机械臂，15Hz控制频率，2个RGB相机。动作6维，本体感觉6维+EMG 8维。数据集由3名参与者佩戴 Myo armband 采集，每人105个demo。微调 SmolVLA 时冻结 backbone，仅微调 action expert 和 state projection（40k updates，batch size 64，action chunk size 50）。
  - **VA-VLA**：使用 Franka Panda 机械臂（带移动底盘），20Hz控制频率，3个RGB相机。动作12维，本体感觉16维。在 RoboCasa 仿真环境中进行16个任务，使用约1600个 teleoperated demonstrations。微调 $\pi_{0.5}$ 时进行全参数微调（70k updates，batch size 64，action chunk size 50，2xH200）。
- **训练/优化目标**: 流匹配损失（Flow-matching loss），将正态分布噪声传输到动作块（action chunks）的分布，公式为 $\mathcal{L}_{\mathrm{FM}}=\left\|v_{\theta}(a_{k},k,\ell,I,q)-(a_{t}-a_{0})\right\|_{2}^{2}$。

**3. 实验结果**
- **实验设置**: 
  - **EC-VLA**：真实物理环境，SO-101 桌面抓取4个相同方块任务。Baseline 为使用完整描述性文本的 SmolVLA。评估30次（20次无杂乱，10次有杂乱）。
  - **VA-VLA**：RoboCasa 仿真环境，16个 pick-and-place 任务。Baseline 为使用完整描述性文本的 $\pi_{0.5}$。评估800次（每任务50次），包含无杂乱和有杂乱（增加3个随机物体）设置。
- **评价指标**: 任务完成度得分（Task completion score，分4个阶段：失败0，触碰0.5，抬起0.75，成功1.0）和成功率（Success rate）。
- **主要结果**: 
  - 在常规（无杂乱/in-distribution）场景下，两种方法比纯文本 baseline 仅有轻微提升（几个百分点）。
  - 在杂乱（cluttered/out-of-distribution）场景下提升显著：
    - **EC-VLA**：杂乱场景成功率从 30% 提升至 50%（+20%），完全失败率（未触碰目标）从 50% 降至 4%。
    - **VA-VLA**：杂乱场景成功率从 11% 提升至 20%（+9%），完全失败率从 47% 降至 25%。

### 52. 🔥 [FutureWorlds: Learning Robotic World Models from Alternative Futures] (FutureWorlds：从替代未来中学习机器人世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.01019` | [点击跳转](https://arxiv.org/abs/2610.01019)

**0. 论文标题**
- **英文标题**: FutureWorlds: Learning Robotic World Models from Alternative Futures
- **中文标题**: FutureWorlds：从替代未来中学习机器人世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机器人学/计算机视觉领域的方法创新工作，提出了 FutureWorlds 框架与 MemSPO 算法，通过多样化束搜索构建候选未来、维护独立历史记忆，并利用组相对优势进行强化学习后训练，显著提升了机器人自回归世界模型的长时预测质量与动态一致性。

**1. 整体逻辑**
- **研究任务**: 训练机器人世界模型，以根据初始视觉观察、动作序列和语言指令，预测未来场景的视觉演化（即动作条件视频预测）。
- **研究动机**: 现有自回归世界模型多依赖监督学习（SFT），训练时使用 ground-truth 历史，推理时使用自回归历史，导致误差累积（exposure bias）。虽然引入强化学习（RL）能优化序列级奖励，但现有方法在构造有区分度的候选未来、维护分支历史，以及从相对质量中提取有效学习信号方面存在不足。
- **本质改动**: 将“构建多样化候选”、“维护独立历史记忆”与“基于相对质量的策略优化”统一到一个框架中。核心在于让模型在自身生成的、历史条件一致的“替代未来”中进行相互比较，并将比较结果转化为强化学习信号来更新世界模型。
- **技术溯源**: 基于多模态离散自回归模型（如 iVideoGPT），结合了有限标量量化（FSQ）、多样化束搜索（Diverse Beam Search）、GRPO（组相对策略优化）以及有界滚动记忆机制。

**2. 技术拆解**
- **核心方法**: 
  1. **多样化束搜索 (Diverse Beam Search)**：在 RL 阶段平衡模型置信度与候选多样性，构造不同的未来轨迹，避免候选趋同。
  2. **候选特定有界记忆 (Candidate-specific Bounded Memory)**：为每个候选分支保留初始场景锚点、状态锚点和近期滚动上下文，确保生成和打分使用匹配的历史，支持长时预测。
  3. **MemSPO (Memory-Conditioned Search-Guided Policy Optimization)**：将解码后的视频轨迹奖励转化为组内相对优势，通过基于 GRPO 的裁剪策略代理目标更新自回归骨干网络。
- **关键细节**: 
  - **输入输出**：输入为初始视觉条件、动作序列和可选语言指令；输出为未来 $H$ 帧的离散视觉 token 序列（每帧 $N$ 个动态 token）。
  - **模型结构**：冻结的视觉 Tokenizer（基于 FSQ）和 T5 文本编码器；可训练的 GPT 风格自回归骨干网络。
  - **规模**：推理参数量 0.257B（含视觉编解码器）。
  - **关键超参**：束搜索使用 4 个组，每组 2 个 beam；多样性惩罚系数 0.1；记忆窗口保留初始锚点及最近 6 个状态。
- **训练/优化目标**: 
  - **SFT 阶段**：负对数似然损失（仅针对目标动态 token）。
  - **RL 阶段 (MemSPO)**：最大化搜索引导的裁剪策略代理目标（包含对负优势的双裁剪）加上参考策略正则化项。奖励由像素误差（MAE）和感知距离（LPIPS）组成，并在组内进行标准化。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RT-1, BridgeV2, RoboCasa（涵盖真实与仿真机械臂操作）。
  - **对比对象 (Baseline)**：视频生成模型 (FitVid, iVideoGPT)；动作条件世界模型 (IRASim, Vid2World, Ctrl-World, DriftWorld, WEAVER)；RL 后训练方法 (RLVR-World, PersistWorld)；适配的视频基础模型 (Wan2.2-TI2V-5B, Cosmos-Predict2.5-2B, DreamDojo-2B)。
  - **测试环境**：16 张 NVIDIA H20 GPU 训练；推理在单张 H20 上评估。
- **评价指标**: 
  - **视觉质量**：PSNR, SSIM, LPIPS（评估 32 帧预测）。
  - **动态/运动一致性**：光流误差 (Flow error)、幅度差 (Magnitude gap)、DINO 特征相似度。
  - **资源消耗**：推理参数量、峰值显存、推理延迟。
- **主要结果**: 
  - **视觉质量**：在 32 帧预测中，相比各数据集最强 baseline，LPIPS 分别降低了 14.78% (RT-1)、20.84% (BridgeV2) 和 9.12% (RoboCasa)，PSNR 和 SSIM 也全面领先。
  - **后训练效率**：仅需 200 次 MemSPO 更新即可进一步提升生成质量，并支持超出训练 horizon 的长时预测。
  - **动态一致性**：光流误差相比 SFT 基线分别降低了 12.40%、4.57% 和 16.68%，物体状态和机械臂运动预测更准确。
  - **资源表现**：推理参数量仅 0.257B，峰值显存仅 1.89 GiB（在 BridgeV2 上对比），但自回归束搜索导致推理延迟较高（26.76s）。

### 53. 🔥 [MIKASA-Robo-VLA: Benchmarking Memory in VLA Models for Long-Horizon Manipulation] (MIKASA-Robo-VLA: 评估VLA模型在长视野操作中记忆能力的基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.00604` | [点击跳转](https://arxiv.org/abs/2610.00604)

**0. 论文标题**
- **英文标题**: MIKASA-Robo-VLA: Benchmarking Memory in VLA Models for Long-Horizon Manipulation
- **中文标题**: MIKASA-Robo-VLA: 评估VLA模型在长视野操作中记忆能力的基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个包含90个参数化任务的仿真基准MIKASA-Robo-VLA，专门用于系统评估VLA模型在长视野操作中对已消失视觉线索的记忆能力，并发布了2.25万条专家轨迹。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作（VLA）模型在长视野机器人操作任务中的记忆能力（即记住已消失的视觉线索并据此执行动作的能力）。本文属于基准测试与数据集类工作。
- **研究动机**: 现有VLA模型通常只输入最近一帧或几帧图像，难以评估其利用历史消失信息的能力；现有的操作基准（如CALVIN、LIBERO）侧重技能组合或知识迁移，没有系统性地控制“需要记什么”和“需要记多久”，且缺乏统一的VLA接口和大规模带密集奖励的演示数据。
- **本质改动**: 将原本用于强化学习的MIKASA-Robo扩展为语言条件的VLA基准，通过参数化设计显式控制10种记忆类型和信息缺口（Information gap）时长，并配套了标准化的VLA观测/动作接口和大规模专家数据集。
- **技术溯源**: 基于 ManiSkill 3 仿真器构建；参考 Baseline 使用了 $\pi_{0.5}$ 模型；相关VLA工作溯源了 OpenVLA、RT-1、Octo 等。

**2. 技术拆解**
- **核心方法**: 构建了包含90个语言条件操作任务的基准，其中80个任务要求记忆已隐藏的线索，10个为反应控制（线索不隐藏）。定义了“信息缺口（Information gap）”来量化线索消失到动作执行间的时间延迟。将任务按视野长度分为Short、Medium、Long三个切片，并提供统一的观测和动作空间。
- **关键细节**: 
  - **任务规模**：90个任务，涵盖10种记忆类型（如物体属性、空间位置、容量、时间、序列等），26个任务族。
  - **数据规模**：发布22,500条专家轨迹（约630万步，175.2小时），同时提供RLDS和LeRobotDataset v3两种格式。
  - **接口设计**：观测为双路128x128 RGB图像+7维本体感觉；动作为7维末端执行器增量+夹爪控制（10Hz）。
- **训练/优化目标**: 作为基准测试，其核心机制是提供标准化的评估协议（固定种子、50个episode/任务、success_once指标），以及用于模仿学习/强化学习的专家数据和密集奖励（Dense rewards）。

**3. 实验结果**
- **实验设置**: 使用 $\pi_{0.5}$ 作为参考 Baseline（仅输入当前双路图像和离散化本体感觉，无历史观测和显式记忆模块），在14个任务（涵盖7种记忆类型）的子集上进行全参数微调。对比对象包括随机动作策略（Chance floor）以及理论上的“遗忘线索但操作成功”的下限。
- **评价指标**: 任务成功率（Success rate，基于 success_once 指标），以及信息缺口（Information gap）与成功率的相关性分析。
- **主要结果**: 
  - $\pi_{0.5}$ 在14个任务上的平均成功率仅为 0.211 ± 0.044。
  - 在Long-split（长视野）任务上表现极差（成功率仅0.017），但作者指出这受到开环动作块（open-loop chunking）和记忆类型分布的混淆影响，不能单纯归咎于记忆能力。
  - 在需要离散选择的任务中，$\pi_{0.5}$ 的表现与“完全忘记线索只靠瞎猜”的理论下限（1/k）没有显著差异，说明该无记忆模块的Baseline并未真正学会利用历史线索。
