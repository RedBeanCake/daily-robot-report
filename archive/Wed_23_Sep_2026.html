### 71. 🔥 [Bridge3D: Enabling Vision-Language-Action Models to See and Act in 3D] (Bridge3D：使视觉-语言-动作模型能够在3D中观察与执行)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24525` | [点击跳转](https://arxiv.org/abs/2609.24525)

**0. 论文标题**
- **英文标题**: Bridge3D: Enabling Vision-Language-Action Models to See and Act in 3D
- **中文标题**: Bridge3D：使视觉-语言-动作模型能够在3D中观察与执行
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出了Bridge3D框架，通过隐式融合3D几何特征和显式引入3D语义点场来指导动作生成，解决了现有VLA模型在3D空间中感知不准、操作不精细的问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在3D物理世界中的空间感知与精细操作能力。
- **研究动机**: 现有主流VLA模型主要依赖2D图像输入，存在“3D感知到动作”的鸿沟：感知端缺乏空间几何信息，动作端缺乏显式的3D几何指导。现有的3D增强方法多局限于增强感知端的特征，未能在度量3D空间中显式约束动作生成，导致精细操作能力不足。
- **本质改动**: 在预训练的2D VLA模型中同时引入隐式3D空间先验（增强感知）和显式3D几何指导（约束动作），并通过逐层线性探测找到空间信息退化的关键层来插入动作条件模块，兼顾了性能与计算效率。
- **技术溯源**: 基于预训练的VLA模型（如RDT、GR00T-N1.5）、3D视觉几何基础模型（VGGT）、3D语义场构建方法（D3 Fields）、以及视觉基础模型（Grounded-SAM, DINOv3）。

**2. 技术拆解**
- **核心方法**: 提出包含隐式融合（IF）和显式条件化（EC）的分层3D增强框架。IF通过残差适配器将3D基础模型提取的特征融入VLM的视觉token中；EC构建3D语义点场，在动作专家的扩散模型中通过空间交叉注意力直接查询3D点场特征来指导动作去噪。
- **关键细节**: 
  - **IF（隐式融合）**: 采用双流编码，VLM提取语义token，VGGT提取几何token。通过两层MLP构成的残差适配器将几何token映射到VLM特征空间，并进行逐token的残差相加。
  - **EC（显式条件化）**: 利用Grounded-SAM和DINOv3处理头部RGB-D图像，将2D特征提升到3D空间构建3D语义点场（包含操作物体和背景点）。在动作专家中，对动作隐状态应用3D RoPE，并通过空间交叉注意力查询3D点场特征，将动作生成约束在度量3D空间内。
  - **逐层线性探测（Layer-wise Linear Probing）**: 冻结VLA主干，在各扩散块的隐藏状态上训练线性回归模型来预测末端执行器的3D坐标。发现第7-11层空间信息退化最严重，因此仅在这些关键层插入EC模块，避免破坏深层的高层动作建模能力。
- **训练/优化目标**: 训练时冻结VLM主干以保留通用知识，仅优化残差适配器和动作专家。动作生成基于扩散模型（Diffusion）或流匹配（Flow Matching），优化目标为标准的动作去噪损失（Action denoising loss）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**: 使用 RoboTwin 2.0 benchmark（10个双臂操作任务，包含clean和randomized场景）。对比Baseline包括 RDT, GR00T-N1.5, $\pi_0$, Spatial Forcing (SF), PointVLA, 3D Diffusion Policy。
  - **真机**: 使用 KEENON XMAN-R1（双臂人形机器人）和 AgileX PiPER 机器人，测试6个高精度空间操作任务（如插花、挂马克杯等），以及桌面高度变化（1-5cm）的零样本空间泛化测试。
- **评价指标**: 任务成功率（Success Rate, SR）。
- **主要结果**: 
  - **仿真**: 在 RoboTwin 2.0 上，RDT-Bridge3D 比 RDT 相对提升 26.1%，比 GR00T-N1.5 相对提升 34.6%。比 $\pi_0$ 高 14.0 个百分点，比 Spatial Forcing 最高高出 8.8 个百分点。数据效率显著提升，仅需约 1/6.1 的训练样本即可达到基线同等性能。
  - **真机**: 平均成功率达 49.0%，比 RDT 相对提升 42.9%，比 Spatial Forcing 高 11.7 个百分点。在需要厘米级精度的任务（如插花）中成功率接近基线的两倍。在桌面高度变化的零样本泛化测试中，性能下降幅度远小于 2D VLA 基线，展现出极强的空间鲁棒性。

### 72. 🔥 [ME-Brain-1.0: Memory, Cognition and Action for Evolving Embodied Intelligence] (ME-Brain-1.0：面向进化具身智能的记忆、认知与动作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24271` | [点击跳转](https://arxiv.org/abs/2609.24271)

**0. 论文标题**
- **英文标题**: ME-Brain-1.0: Memory, Cognition and Action for Evolving Embodied Intelligence
- **中文标题**: ME-Brain-1.0：面向进化具身智能的记忆、认知与动作
- **研究机构**: 原文未提及
- **一句话总结**: 提出ME-Brain具身智能系统，通过可进化记忆、认知核心和以交互事件为中心的动作模型，让机器人在部署后无需重训练，就能通过物理交互持续积累经验和自我进化。

**1. 整体逻辑**
- **研究任务**: 构建部署后可持续自我进化的具身智能系统，解决现有大模型参数冻结后无法从新环境和长时物理交互中持续学习的问题。
- **研究动机**: 现有具身大脑多为预训练模型能力的静态堆砌，参数冻结后能力固定。面对分布外场景只能依赖泛化，无法将部署期间积累的成功/失败经验反哺给模型，导致宝贵的学习信号被浪费。
- **本质改动**: 打破“训练后冻结”范式，设计了一个由可进化记忆、认知核心和动作模型组成的闭环系统，让机器人在物理交互中自主获取、提炼经验并指导后续动作，实现无需重训练的持续进化。
- **技术溯源**: 基于视觉-语言-动作（VLA）模型（如 $\pi_{0.5}$、OpenVLA）、视觉语言模型（VLM，如 PaliGemma）、多模态Agent架构以及 VideoVAE。

**2. 技术拆解**
- **核心方法**: 
  1. **可进化记忆 (Evolvable Memory)**: 构建独立于模型上下文窗口的外部记忆图，将多模态交互历史分层（短期、中期、长期）存储，通过“记录-巩固-抽象”机制实现经验的持续积累和跨任务复用。
  2. **认知核心 (Cognitive Core)**: 统一具身认知（场景理解、任务规划、动作理解、验证与重规划）与多模态Agent能力（多模态理解、长程任务理解、工具/技能调用、推理与归因），作为经验进化的中枢。
  3. **动作模型 (Focus-VLWA)**: 提出以交互事件为中心的视觉-语言-世界-动作模型。通过关键帧表示减少时间冗余，通过EventCell将世界模型预测限制在局部交互区域，并通过动作条件记忆调制在不增加主干上下文的情况下注入历史证据。
- **关键细节**: 
  - **记忆系统**：支持月级别时间跨度，可部署于边缘设备（如M100），检索复杂度从 $O(n^2)$ 降至 $O(n)$。
  - **认知核心**：通过SFT和RL联合训练具身认知和多模态Agent专家，再通过MOPO蒸馏平衡能力。提供 4B 和 35B-A3B（MoE）两种规模。
  - **动作模型**：基于 $\pi_{0.5}$ 骨干，当关节变化>1度或夹爪位移>5mm时采样关键帧，预测50个关键帧动作；世界模型预测10个chunk的局部EventCell（3x3邻域，减少85.9%的token）；记忆调制通过交叉注意力查询历史库（最多32帧/512 tokens），生成FiLM风格的scale和shift参数调制动作特征。
- **训练/优化目标**: 
  - 动作模型采用联合优化目标：$\mathcal{L} = \lambda_a \mathcal{L}_{action} + \lambda_w \mathcal{L}_{local-world} + \lambda_s \mathcal{L}_{state} + \lambda_e \mathcal{L}_{event}$，结合flow-matching进行联合去噪训练。冻结视觉语言骨干和VideoVAE，仅训练动作和世界模型专家及连接模块。

**3. 实验结果**
- **实验设置**: 
  - **认知核心（ME-VLM）**：在26个具身基准（物理/空间理解、规划、执行、纠错）和多个Agent基准上评测，对比 Hy-Embodied, RynnBrain1.1, Mimo-Embodied, PhysBrain 1.5。
  - **动作模型（ME-Brain）**：在RoboMME（记忆基准）、RoboDojo（仿真操作基准，ARX X5双臂）和自研ME-RealBench（Piper双臂真实机器人，6个任务）上评测，对比 $\pi_{0.5}$, DM0.5, xr-1 等。
- **评价指标**: 
  - **认知核心**：各基准的平均准确率/得分。
  - **动作模型**：任务成功率（SR）、任务完成得分（Score）、执行时间（TimeExpend）。
- **主要结果**: 
  - **认知核心（ME-VLM 35B-A3B）**：具身基准平均得分70.9（超第二名8.2分），Agent基准平均72.5（超第二名9.6分），在空间推理、执行纠错和多模态推理上全面领先。
  - **动作模型**：在RoboMME上平均成功率47.88%（超 $\pi_{0.5}$ 约29.8个百分点）；在RoboDojo仿真中平均Score 21.51，SR 16.03%，在Memory维度提升巨大（Score从5.78升至25.57）；在真实机器人ME-RealBench上，平均SR 66.7%，Score 69.5，显著优于DM0.5（SR 55.0%, Score 56.7）和 $\pi_{0.5}$（SR 50.0%, Score 52.2）。

### 73. 🔥 [When Does Touch Matter? Charting the Vision-Interaction Gap in Cluttered Dexterous Grasping] (触觉何时重要？描绘杂乱环境中灵巧抓取的视觉-交互差距)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24068` | [点击跳转](https://arxiv.org/abs/2609.24068)

**0. 论文标题**
- **英文标题**: When Does Touch Matter? Charting the Vision-Interaction Gap in Cluttered Dexterous Grasping
- **中文标题**: 触觉何时重要？描绘杂乱环境中灵巧抓取的视觉-交互差距
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过受控的真实世界实验，系统评估了触觉和力觉反馈在杂乱场景灵巧抓取中何时能弥补纯视觉的不足，证明随着任务难度增加，融合交互信号的策略能显著提升抓取成功率并改善闭环行为。

**1. 整体逻辑**
- **研究任务**: 杂乱场景下的目标物体灵巧抓取（Target-oriented dexterous grasping in clutter）。
- **研究动机**: 现有基于视觉的灵巧抓取策略在目标被遮挡、发生附带接触或视觉几何信息退化时，无法直接测量负载、支撑或滑动状态，导致抓取失败。目前缺乏对“视觉何时足够，何时必须引入交互感知（触觉和力觉）”的定量评估。
- **本质改动**: 采用严格的控制变量法，固定视觉输入、动作空间、底层柔顺控制器和训练数据，仅改变策略网络可见的感知模态（视觉、力觉、触觉及其融合方式），在真实世界中进行受控的消融实验，从而纯粹地隔离并量化交互信号本身带来的信息增益。
- **技术溯源**: 基于 LEAP hand（灵巧手）、PaXini tactile pads（触觉传感器）、DP3（点云编码器）、Diffusion Policy（扩散策略）、Grounding DINO & SAM 2（视觉分割）、Minimalist Compliance Control / MCC（力觉估计）。

**2. 技术拆解**
- **核心方法**: 构建了一个多模态感知与柔顺执行栈。视觉点云通过点编码器处理；508个触觉 taxel 通过两层自注意力 Transformer 编码；力觉（wrench）通过电机电流和雅可比矩阵估计；最后通过特征直接拼接输入到扩散策略中生成动作，并通过共享的导纳控制器（Admittance controller）执行。
- **关键细节**: 
  - **输入**：视觉（1024个点的目标-上下文点云）、本体感觉（23维）、力觉（30维，含4个指尖和1个腕部 wrench）、触觉（508个 taxel 的6维位置+力数据）。
  - **模型结构**：视觉用 DP3 风格的点编码器（输出128维）；触觉用带 cls token 的两层 Transformer（输出128维）；力觉和本体感觉归一化后直接拼接。策略骨干为 Diffusion Policy，预测16步动作序列（23维末端位姿+16维手部关节），执行前8步后重规划。
  - **底层控制**：所有策略共享同一个任务空间柔顺控制器。力觉反馈始终用于底层的物理柔顺控制，但仅当策略配置包含 W（力觉）模态时，力觉才作为策略网络的观测输入。
  - **规模**：320个真实世界专家演示（VR手臂+数据手套遥操作收集），训练300个 epoch。
- **训练/优化目标**: 模仿学习（行为克隆），使用扩散策略（Diffusion Policy）常规的去噪损失函数（Denoising loss）进行优化。

**3. 实验结果**
- **实验设置**: 
  - **数据集与场景**：自采的 320 个真实世界专家演示。设计了5种受控的桌面杂乱场景条件（S1-S5），难度递进：从单纯场景杂乱但目标易抓取（S1），逐渐增加到狭窄限制（S3）、周围密集杂乱（S4），以及边缘 packed 的小目标（S5）。
  - **对比对象（Baseline）**：内部消融包括 Vision only、Wrench (VW)、Taxel-Attn (VT)，以及不同的表示/融合方法（GNN、FC-full、PolicyConsensus、Reactive DP）；外部 Baseline 为 ClutterDexGrasp（基于视觉的 RL 蒸馏点云扩散策略）。
  - **硬件平台**：xArm7 机械臂 + LEAP-PaXini 触觉灵巧手，Intel RealSense L515/D455 相机。
- **评价指标**: 
  - 主要指标：目标抓取并稳定抬起的成功率（每种条件5次试验）。
  - 次要指标：执行效率（成功 episode 的持续时间，以及完整抬起尝试次数）。
- **主要结果**: 
  - **核心结论**：随着任务难度增加（S3-S5），纯视觉和融合策略的“视觉-交互差距”显著拉大。交互信号在简单场景下收益有限，但在高遮挡和高接触模糊度下至关重要。
  - **具体数值**：在整体25次试验中，Ours (VWT-Attn) 成功 24 次 (96%)，Vision only 成功 14 次 (56%)。在最难的三个条件 (S3-S5) 中，Ours 15/15 全成功，Vision only 仅 6/15。
  - **模态互补性**：力觉 (W) 帮助早期发现弱接触并触发重新抓取，触觉 (T) 帮助分辨接触分布以确认抓取质量，两者结合 (VWT) 效果最好，缺一不可。
  - **融合方式对比**：简单的特征直接拼接 (VWT-Attn) 优于复杂的 GNN、FC-full、PolicyConsensus 和 RDP，说明在现有数据规模下，简单的全局交互摘要比复杂的层次化融合更有效。
  - **外部 Baseline 表现**：复现的 ClutterDexGrasp 在 sim 中达 50.2% 成功率，但在 real world 部署时出现不安全动作，需要急停。
  - **行为改善**：Ours 能在抬起前通过交互反馈拒绝不良接触并重新抓取，减少了无效抬起次数，成功 episode 的平均耗时更短。

### 74. 🔥 [What Matters in Designing World Action Models: An Empirical Study] (设计世界动作模型的关键要素：一项实证研究)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24048` | [点击跳转](https://arxiv.org/abs/2609.24048)

**0. 论文标题**
- **英文标题**: What Matters in Designing World Action Models: An Empirical Study
- **中文标题**: 设计世界动作模型的关键要素：一项实证研究
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过严格的控制变量实验，系统解耦并评估了世界动作模型（WAMs）在因果结构、潜在表示和训练目标三个维度的核心设计选择，揭示了时序结构在分布内外场景下的不同作用机制。

**1. 整体逻辑**
- **研究任务**: 系统评估和解耦世界动作模型（WAMs）中的核心设计选择，厘清视频-动作因果结构、潜在世界表示、世界-动作建模目标这三个维度如何具体影响策略行为和学到的表示。
- **研究动机**: 现有的 WAM 系统通常将多种设计选择（如架构、训练策略）打包优化，难以隔离单一组件的贡献。领域内缺乏控制变量实验来分离这些因素，导致无法判断性能提升究竟来自于更好的世界表示、更有效的条件机制，还是单纯的系统堆叠。
- **本质改动**: 不提出单一的新架构，而是采用控制变量法（structurally controlled experiments），在固定基础模型和训练管线的前提下，系统对比多种 WAM 设计变体，找出真正起作用的设计原则。
- **技术溯源**: 基于现有的 WAM 和 VLA 框架（如文中引用的 [4], [10] 等），使用了 DINOv3、Qwen3-VL、SAM3、V-JEPA 2.1、VAE 等预训练视觉/视频模型作为潜在表示的基座。

**2. 技术拆解**
- **核心方法**: 围绕三个基本问题展开控制变量研究：
  1. **视频-动作因果结构**：对比 6 种结构（解耦/无条件、视频到动作、动作到视频、双向、联合、因果交错）。
  2. **潜在世界表示**：对比 4 大类 8 种表示（语义、几何、重建、预测），核心区分在于是否预编码了跨帧时序关系（帧间表示 inter-frame vs 逐帧表示 framewise）。
  3. **世界-动作建模目标**：对比行为克隆（BC）以及逆动力学（IDM）、前向动力学（FDM）、视频生成（VG）三种辅助目标及其组合。
- **关键细节**: 
  - **输入输出**：输入当前观察 $o_t$ 和任务指令 $\ell$，输出未来动作块 $a_{t+1:t+k}$ 和未来视觉潜在变量 $z_{t+1:t+k}$。
  - **干预实验**：在因果结构分析中，通过对生成的未来潜在变量进行“内容破坏（加噪）”和“时间反转（打乱时序）”干预，来测试模型到底依赖未来视频的精确内容还是时间组织。
- **训练/优化目标**: 
  - 行为克隆 (BC): $p(a_{t+1:t+k} | o_t, \ell)$
  - 逆动力学建模 (IDM): $p(a_{t+1:t+k} | o_t, z_{t+1:t+k}, \ell)$
  - 前向动力学建模 (FDM): $p(z_{t+1:t+k} | o_t, a_{t+1:t+k}, \ell)$
  - 视频生成 (VG): $p(z_{t+1:t+k} | o_t, \ell)$

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboCasa-GR1（分布内 ID 评估），LIBERO 和 LIBERO-Plus（分布外 OOD 评估，包含视角、布局、光照、传感器噪声等扰动），DROID（真实机器人数据离线评估）。
  - **对比对象（Baseline）**：各维度内的控制组。例如因果结构中的 Unconditional vs Causally Interleaved；潜在表示中的 DA3 (帧间) vs DINOv3 (逐帧)；训练目标中的 BC-only vs BC+VG 等。
- **评价指标**: 
  - 仿真环境：任务成功率（Success rate, %）。
  - 真实机器人 (DROID)：归一化动作空间的 MSE、L1、Accuracy@0.1、Accuracy@0.5。
- **主要结果**: 
  - **因果结构**：生成的未来视频主要通过其**时间组织**（而非精确内容）来影响动作生成（内容破坏对成功率影响极小，而时间反转会导致 OOD 成功率大幅下降）。在 OOD 下，因果视频生成（如 Causally Interleaved）带来的时序优势最明显。
  - **潜在表示**：**帧间表示 (inter-frame)** 在 ID 下表现更好，但**逐帧表示 (framewise)** 在 OOD 下更鲁棒。因为预编码的帧间时序关系在分布偏移时会变得脆弱，把时序建模推迟到策略网络中能获得更好的泛化性。
  - **训练目标**：辅助目标在 ID 下通常会降低性能（BC-only 最优）；但在 OOD 下，**视频生成 (VG)** 能显著提升鲁棒性，而动力学目标 (IDM/FDM) 收益有限甚至负迁移。直接联合训练所有目标会导致梯度干扰，**分阶段训练**（先训练 BC+VG 80%，最后 20% 加入动力学目标）效果最佳。
  - **真机验证**：在 DROID 数据集上验证了上述结论，Causally Interleaved、DINOv3 (逐帧) 和 BC+VG 在 MSE、L1 和 Accuracy 指标上均显著优于各自的 baseline。

### 75. 🔥 [Imagine-RL: Residual-Confidence-Guided Cross-Attention for World-Model-Augmented VLA Reinforcement Learning] (Imagine-RL：用于世界模型增强VLA强化学习的残差置信度引导交叉注意力机制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24033` | [点击跳转](https://arxiv.org/abs/2609.24033)

**0. 论文标题**
- **英文标题**: Imagine-RL: Residual-Confidence-Guided Cross-Attention for World-Model-Augmented VLA Reinforcement Learning
- **中文标题**: Imagine-RL：用于世界模型增强VLA强化学习的残差置信度引导交叉注意力机制
- **研究机构**: 原文未提及
- **一句话总结**: 提出 Imagine-RL，通过引入视觉-扭矩潜在世界模型和残差置信度引导的交叉注意力 critic，让冻结的 VLA 在潜在噪声空间 RL 后训练时能“想象”并评估动作的未来接触后果，大幅提升接触丰富任务的成功率。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作任务中，视觉-语言-动作（VLA）模型的强化学习后训练。
- **研究动机**: 现有 VLA 主要依赖视觉，缺乏对接触力/扭矩的感知；现有的潜在噪声空间 RL 方法（如 DSRL）的 critic 只看当前观测和候选动作，忽略了动作导致的未来视觉和接触后果，导致在视觉相似但结果不同的动作面前评估不可靠。
- **本质改动**: 引入一个不重建像素的视觉-扭矩潜在世界模型（VTLWM）来预测动作的未来后果，并设计残差置信度引导的交叉注意力 critic，让 critic 在评估时能结合当前状态与可靠的未来想象，同时保持 VLA 和世界模型冻结。
- **技术溯源**: 基于 $\pi_0$（作为冻结的 VLA 基座）、DSRL（潜在噪声 VLA-RL 框架基础）、LeWorldModel（无像素重建的紧凑物理表示预测基础）。

**2. 技术拆解**
- **核心方法**: 
  1. **视觉-扭矩潜在世界模型 (VTLWM)**：自回归预测紧凑的未来视觉和扭矩潜在表示，不进行像素级重建。
  2. **残差置信度引导的交叉注意力 Critic**：当前图像-状态-动作作为 Query，去 attend 观测历史和预测的未来。利用前一个预测窗口的残差（预测值与真实历史值的差）计算置信度，作为 attention bias 抑制不可靠的未来 token。
  3. **潜在噪声 RL 框架**：VLA 和世界模型冻结，训练轻量级噪声 actor 引导冻结的 VLA，通过 action critic 蒸馏出 noise critic 来监督 actor。
- **关键细节**: 
  - **输入**：多视角图像（128x128）、机器人状态、扭矩。
  - **模型结构**：VTLWM 历史长度 15，单步预测器自回归 rollout 10 步；Cross-attention 维度 256，4 个头；Action critic 使用 10 个 Q 函数的 ensemble。
  - **关键超参**：batch size 64，折扣因子 0.999，actor 学习率 5e-5，critic-encoder 学习率 1e-4，critic-head 学习率 3e-4。
- **训练/优化目标**: 
  - **VTLWM 训练**：MSE（视觉）+ SmoothL1（扭矩）+ SIGReg 损失。
  - **RL 训练**：Action critic 最小化基于未来预测特征的 TD error；Noise critic 通过 MSE 蒸馏 Action critic 的 Q 值；Noise actor 最大化 Noise critic 的 Q 值（带熵正则化）。

**3. 实验结果**
- **实验设置**: 
  - **任务**：4个真实机器人双臂协作的接触丰富任务（Socket Plug-in, Press-button, USB Plug-in, Peg-in-hole）。
  - **对比对象 (Baseline)**：$\pi_0$（预训练 VLA）、TA-VLA（扭矩感知 VLA）、DSRL（无世界模型的潜在噪声 RL）。
  - **测试环境**：PIPER 机械臂，Intel RealSense D435i 相机；2张 RTX 3090 跑 VLA server，1张 RTX 3090 跑 RL 本地训练。
- **评价指标**: 任务成功率、世界模型预测误差（视觉余弦相似度，扭矩 MAE/MSE/RMSE）、Critic 区分度（成功与失败轨迹的标准化 Q 值差 $\Delta Q$）。
- **主要结果**: 
  - **成功率**：相比 $\pi_0$ 和 TA-VLA 平均相对提升 60%，相比 DSRL 提升 23.6%（仅用 100 条 RL 轨迹）。在 Press-button 任务上增加交互数据后提升 46%。
  - **世界模型预测**：视觉预测平均余弦相似度达 0.913；扭矩预测 MAE 为 0.0441（仅为最大值的 1%）。
  - **Critic 区分度**：相比 DSRL，Imagine-RL 的 $\Delta Q$ 平均从 0.975 提升到 1.228，相对提升 26.0%，证明其能更好地区分成功与失败的动作。

- **研究机构**: `原文未提及（注：文中仅提及硬件提供方 Agility Robotics，未明确列出作者所属学术机构）`
- **Arxiv ID**: `2609.23968` | [点击跳转](https://arxiv.org/abs/2609.23968)

**0. 论文标题**
- **英文标题**: Opt2VLA: Force-Aware Vision-Language-Action for Contact-Rich Humanoid Whole-Body Manipulation
- **中文标题**: Opt2VLA：面向接触丰富的人形机器人全身操作的力感知视觉-语言-动作模型
- **研究机构**: 原文未提及（注：文中仅提及硬件提供方 Agility Robotics，未明确列出作者所属学术机构）
- **一句话总结**: 提出 Opt2VLA 框架，在人形机器人 VLA 模型的输出端引入显式的接触力指令，结合基于轨迹优化的强化学习全身控制器，实现了接触丰富任务下的精确力调节与语言条件控制。

**1. 整体逻辑**
- **研究任务**: 本文属于具身智能与人形机器人控制领域，是一篇方法创新与系统工程结合的工作。研究任务是人形机器人在接触丰富（contact-rich）日常任务中的全身操作（如擦拭、推挤、抓取），要求机器人不仅能完成几何运动，还要精确调节与环境的交互力。
- **研究动机**: 现有的人形 VLA 系统和全身控制器主要依赖几何运动目标（如末端位姿、关节位置），缺乏对交互力的显式规划。在接触丰富的任务中，相同的运动轨迹面对不同硬度或重量的物体时需要不同的接触力，且接触发生后视觉观测容易失效，纯运动控制无法胜任这类任务。
- **本质改动**: 在 VLA 与底层控制器的接口处解耦并显式暴露“接触力指令”。让高层 VLA 同时预测“去哪（几何运动）”和“用多大力（接触力参考）”，底层控制器则专门负责同时跟踪这两个目标，把任务级的力规划与关节级的力实现分开。
- **技术溯源**: 基于预训练的 VLA 基座模型（GR00T-N1.7）、强化学习（RL）全身控制、以及基于微分动态规划（DDP）的全身轨迹优化（TO，底层求解器使用 Crocoddyl 和 Pinocchio）。

**2. 技术拆解**
- **核心方法**: 
  1. **力感知 VLA 策略**：在 GR00T-N1.7 基础上，增加关节力矩历史输入和接触力输出。引入专用的力矩编码器（torque encoder）和辅助的未来力矩预测头，增强模型对物理交互状态的感知。
  2. **力条件全身控制器（FCT）**：采用非对称 Actor-Critic 架构的 RL 策略。Actor 根据运动目标、力参考和本体感觉输出关节位置指令，通过内部 PD 控制器转化为力矩。
  3. **轨迹优化（TO）数据生成**：利用 TO 离线生成满足动力学和接触约束的轨迹，提供物理一致的关节力矩参考，用于 FCT 训练和 VLA 微调数据的 Rollout 收集，免去大规模遥操作。
- **关键细节**: 
  - **VLA 输入输出**：输入为语言指令、视觉、机器人状态历史、关节力矩历史；输出为四肢末端 3D 位置序列和法向接触力序列。
  - **FCT 控制器**：Actor 输入包含带噪声的运动/力参考、本体感觉和力矩；Critic 包含特权状态和 TO 参考。动作空间为关节位置偏移，内部 PD 环在硬件上运行频率为 2kHz。
  - **训练数据**：通过改变目标力、物体位姿等条件在仿真中 Rollout 收集。语言指令使用“gently”、“firmly”、“strongly”对应不同的连续力范围（如 0-9N, 5-16N, 12-22N）。
- **训练/优化目标**: 
  - FCT 的 RL 奖励函数包含四部分：运动跟踪奖励（关节/基座/末端位姿等）、接触力跟踪奖励、TO 关节力矩跟踪奖励（仅在训练时作为特权监督提供物理引导）、以及运动正则化惩罚（动作平滑度、力矩限制等）。

**3. 实验结果**
- **实验设置**: 
  - **硬件平台**：Agility Robotics 的 Digit 人形机器人（48kg，20 个驱动关节）。
  - **任务**：擦桌子（Surface wiping）、推箱子到架子（Shelf-box pushing）、抓取不同重量的箱子（Box pickup）。
  - **Baseline**：底层控制对比 MO（仅运动控制）和 FC（力条件控制，无 TO 力矩监督）；VLA 层面对比了不同力矩编码方式、历史长度和辅助监督的 9 种配置（C0-C8）。
- **评价指标**: 
  - **底层控制**：力跟踪平均绝对误差（MAE）。
  - **VLA 闭环**：联合成功率（Joint success rate），要求同时满足任务完成、指令力带一致性（命令力在指定区间）、平均力一致性（命令力与实测力差值小于 5N）。
- **主要结果**: 
  - **底层控制**：FCT（本文方法）在三个任务上的力跟踪 MAE 均显著低于 MO 和 FC。例如推箱子任务平均误差降至 4.2±5.5 N，抓取任务降至 0.9±1.0 N，且力分布更集中。
  - **VLA 闭环**：配置 C7（专用力矩编码器 + 状态/力矩历史 + 辅助未来力矩监督 + 冻结 VLM）表现最佳，联合成功率达到 82.2%，显著优于纯运动基线 C0 的 40.0%。
  - **硬件部署**：在真实 Digit 机器人上验证了 Sim-to-Real 迁移。FCT 控制器能保持力调节的单调性，端到端系统能根据“gently/strongly”等语言指令成功调制实际接触力（如推箱子硬件 MAE 为 3.9 N，抓取为 1.7 N）。

### 77. 🔥 [Topology-Informed Visual Prompting For Vision Language Action Policies] (拓扑信息引导的视觉提示用于视觉-语言-动作策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23944` | [点击跳转](https://arxiv.org/abs/2609.23944)

**0. 论文标题**
- **英文标题**: Topology-Informed Visual Prompting For Vision Language Action Policies
- **中文标题**: 拓扑信息引导的视觉提示用于视觉-语言-动作策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于拓扑特征（虚拟h-signature）的视觉提示框架，通过微调VLM预测拓扑状态并生成图像空间的轨迹提示，引导VLA策略解决复杂障碍物几何下的操作任务。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）策略在部分可观测环境下，处理具有复杂拓扑约束（如绕障、穿线）的机器人操作任务。
- **研究动机**: 现有的VLA模型直接映射视觉和语言到动作，在局部视觉相似但全局拓扑结构不同（导致需要不同动作）的场景下容易失败。现有的基于VLM的视觉提示方法（如PEEK）在生成提示时，为了突出目标可能会遮蔽掉对拓扑推理至关重要的障碍物几何信息，导致推理失败。
- **本质改动**: 引入拓扑特征（虚拟h-signature）来量化环境的全局拓扑约束，利用近似仿真器生成拓扑纠正数据，并训练VLM在部署时预测当前拓扑状态和图像空间的末端执行器轨迹提示，从而在不改变VLA架构的情况下提供拓扑感知的视觉引导。
- **技术溯源**: 基于预训练的VLA模型（$\pi_0$, $\pi_{0.5}$）和VLM（Qwen3-VL-8B-Instruct），结合了拓扑运动规划中的h-signature（高斯链接积分）概念，以及现有的图像空间视觉提示（Visual Prompting）技术。

**2. 技术拆解**
- **核心方法**: 
  1. **拓扑感知数据增强**：在近似仿真器中，利用特权几何信息计算虚拟h-signature。通过扰动基策略的轨迹，收集“拓扑纠正”和“任务继续”数据，扩充VLA和VLM的训练集。
  2. **视觉提示构建**：将末端执行器的纠正和继续轨迹投影到图像空间，渲染成带箭头的轨迹图，叠加在原始观测上。
  3. **闭环VLM引导**：微调一个VLM，使其能从视觉观测中预测当前的虚拟h-signature，并预测图像空间的轨迹提示坐标。部署时，VLM先预测拓扑状态，再根据状态差异生成视觉提示，引导VLA输出动作。
- **关键细节**: 
  - **拓扑特征**：使用虚拟h-signature（高斯链接积分）。通过虚拟边连接机器人-物体路径的端点形成闭环，计算该闭环与障碍物闭环的链接数，以此判断是否需要绕障。
  - **模型配置**：VLA基座采用 $\pi_0$ 和 $\pi_{0.5}$；VLM基座采用 Qwen3-VL-8B-Instruct。
  - **训练细节**：VLA使用LoRA微调（视觉语言骨干rank 16，动作专家rank 32），动作预测horizon为10。VLM使用LoRA微调（rank 8），预测h-signature和图像空间waypoint坐标。
  - **部署流程**：VLM被调用两次。第一次预测当前 $h^v$；第二次结合预测的 $h^v$、任务指令和目标 $h^{v\star}$ 预测waypoint坐标序列。将坐标渲染成透明图层叠加到观测上输入给VLA。
- **训练/优化目标**: 
  - **VLA**：原文未提及具体损失函数形式，采用常规的基于专家动作轨迹的监督学习（Action chunk prediction）。
  - **VLM**：包含两个监督任务。一是根据观测预测 $h^v$ 标签；二是根据观测、指令、当前和目标 $h^v$ 预测图像空间waypoint坐标序列。

**3. 实验结果**
- **实验设置**: 
  - **仿真任务**：Rope Pulling（单拓扑状态，无需纠正）、Cable Threading（穿线，需从 $h^v=0$ 纠正到 $h^{v\star}=1$）、Box Pickup（抓箱子，需从 $h^v=1$ 纠正到 $h^{v\star}=0$ 以绕开货架立柱）。
  - **真实世界任务**：Box Pickup。
  - **对比基线**：Base Policy（仅用名义数据微调的VLA）、PEEK（现有的VLM视觉提示基线，会遮蔽无关区域）。
- **评价指标**: 任务成功率（Task success rate），真实世界中的拓扑纠正成功率（$h^v$-correction success rate），以及VLM的 $h^v$ 预测准确率。
- **主要结果**: 
  - **仿真结果**：在Cable Threading和Box Pickup等需要拓扑纠正的任务上，本文方法比Base Policy提升22%-53%，比PEEK提升16%-58%。在无需纠正的Rope Pulling任务上，性能与Base Policy相当，优于PEEK。VLM的 $h^v$ 预测准确率在Box Pickup上达到92%，Cable Threading上达到74%-76%。
  - **真实世界结果**：Box Pickup任务的整体任务成功率达到60%，比最强基线（Base Policy $\pi_0$ 的20%）高出40个百分点；拓扑纠正成功率达到83%，比最强基线高出53个百分点。

- **Arxiv ID**: `2609.23910` | [点击跳转](https://arxiv.org/abs/2609.23910)

**0. 论文标题**
- **英文标题**: ReVeal: A Reconstruction-Aware Real-to-Sim Framework for VLA Policy Evaluation
- **中文标题**: ReVeal：面向VLA策略评估的重建感知Real-to-Sim框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出了评估Real-to-Sim重建环境质量的框架ReVeal，并引入结合单目深度先验的PGSR-D重建管线，证实了重建保真度越高，VLA策略在仿真与现实中的表现一致性越强。

**1. 整体逻辑**
- **研究任务**: 评估基于现实场景重建的仿真环境（Real-to-Sim）在下游视觉-语言-动作（VLA）策略闭环评估中的可靠性。
- **研究动机**: 现有的Real-to-Sim方法（如2D/3D高斯溅射）在弱纹理或反光平面区域重建几何容易出错，导致仿真中VLA策略表现与现实脱节。且现有的纯图像相似度或全局几何指标，无法准确反映VLA模型感知和任务相关平面的重建质量。
- **本质改动**: 提出了一套专门针对VLA策略评估的Real-to-Sim重建质量评估框架（包含观察保真度和任务相关平面几何保真度两个维度的指标）；同时提出了一种引入单目深度监督的改进重建管线（PGSR-D），以提升弱视觉线索区域的几何重建质量。
- **技术溯源**: 基于2DGS、PGSR、Depth Anything V2、COLMAP、DINOv2、SigLIP、Genesis World。

**2. 技术拆解**
- **核心方法**: 
  1. PGSR-D重建管线：在PGSR基础上，引入Depth Anything V2预测的单目深度图。通过逐视图的仿射变换（scale和shift）将单目深度对齐到PGSR渲染的平面深度空间，作为辅助几何监督信号，在PGSR预热阶段后加入深度一致性损失。
  2. ReVeal评估框架：
     - NVMF (新视角网格保真度)：评估新视角网格渲染图像与保留的真实RGB图像的观察保真度。除传统图像指标外，引入VLA模型使用的视觉编码器（DINOv2, SigLIP）的特征余弦相似度。
     - APGF (标注平面几何保真度)：评估任务相关平面区域（如桌面、地板）的几何保真度，包含四个属性：平面度（RANSAC拟合后的点到面距离）、完整性（网格孔洞率）、连通性（最大连通分量比例）、局部粗糙度（局部点到面残差）。
- **关键细节**: 
  - 输入输出：输入为手机拍摄的多视角RGB视频（1-3分钟），输出为用于Genesis World仿真的重建环境网格。前景物体用TRELLIS和SAM 3D单独重建。
  - 模型规模：VLA策略包括SmolVLA (450M), GR00T N1.7 (3B), π0.5 (3B)。
  - 关键超参：深度监督在PGSR训练迭代 $k > k_d$ 时引入，权重为 $\lambda_d$。VLA训练使用4张A100，batch size 128，峰值学习率 $1 \times 10^{-4}$，训练10000步。
- **训练/优化目标**: PGSR-D的优化目标：预热阶段为 $\mathcal{L}_{\mathrm{PGSR}}$，引入深度监督后为 $\mathcal{L}_{\mathrm{PGSR}} + \lambda_d \mathcal{L}_{\mathrm{depth}}$，其中深度损失 $\mathcal{L}_{\mathrm{depth}}$ 为对齐后的单目深度与渲染平面深度之间的差异。

**3. 实验结果**
- **实验设置**: 
  - 数据集与场景：8个真实机器人工作空间（厨房、家庭、办公室、餐厅等，含42个标注平面区域），8个人形机器人操作任务。
  - 对比对象：重建管线对比 2DGS, PGSR, PGSR-D；VLA策略对比 SmolVLA, GR00T N1.7, π0.5。仿真平台Genesis World，实体机器人Dexmate Vega。
- **评价指标**: 
  - 重建保真度：NVMF（PSNR, SSIM, LPIPS, DINOv2相似度, SigLIP相似度）；APGF（平面度, 完整性/孔洞率, 连通性, 局部粗糙度）。
  - Real-Sim一致性：Pearson相关系数(r), 平均最大排序违规(MMRV), 平均绝对误差(MAE)。
- **主要结果**: 
  - 重建保真度排序一致为：PGSR-D > PGSR > 2DGS。例如PGSR-D在NVMF中DINOv2相似度达0.697（2DGS为0.502），APGF中平面度误差降至0.0454（2DGS为0.408）。
  - Real-Sim表现一致性排序与重建保真度完全一致：PGSR-D的Pearson r最高（0.960），MMRV（0.102）和MAE（0.050）最低。
  - 相关性分析表明，重建保真度越高，Real-Sim一致性越强。在NVMF指标中，DINOv2特征相似度与一致性关联最强（r=0.795）；在APGF指标中，完整性（r=0.759）关联最强。

### 79. 🔥 [HapticWAM: Distilling Imagined Touch into a World-Action Model without Inference-Time Tactile Sensing] (HapticWAM：将想象的触觉蒸馏到世界-动作模型中，实现无推理时触觉感知)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23888` | [点击跳转](https://arxiv.org/abs/2609.23888)

**0. 论文标题**
- **英文标题**: HapticWAM: Distilling Imagined Touch into a World-Action Model without Inference-Time Tactile Sensing
- **中文标题**: HapticWAM：将想象的触觉蒸馏到世界-动作模型中，实现无推理时触觉感知
- **研究机构**: 原文未提及
- **一句话总结**: 提出 HapticWAM，通过异构触觉编码和结构化接触预测构建世界-动作模型，并利用触觉想象蒸馏技术，训练出一个在部署时完全不需要指尖物理触觉输入，但能自主“想象”并预测接触状态的高成功率机器人操作策略。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作（如抓取和放置），核心是解决在部署时如何摆脱对指尖物理触觉传感器直接输入的依赖。
- **研究动机**: 光学触觉传感器能提供丰富的接触力学和几何信息，但推理时依赖物理传感器存在硬件限制和遮挡问题；此外，现有的世界模型通常只预测视觉画面，无法显式建模和预测接触事件（如滑动、受力变化、接触几何）。
- **本质改动**: 把触觉传感器的多模态原生信号（不仅是图像，还有力学场）结构化地融入世界-动作模型，并通过知识蒸馏让学生模型在推理时“想象”（预测）接触未来，从而在部署时彻底移除对物理触觉传感器的依赖。
- **技术溯源**: 基于 Cosmos 视频扩散 Transformer (Cosmos-Predict2.5-2B) 作为冻结的视觉/视频基座，结合了世界-动作模型 (WAMs) 和扩散策略 (Diffusion Policy) 的框架。

**2. 技术拆解**
- **核心方法**: 
  1. 异构触觉分词 (HHT)：把凝胶图像、机械场（形变/剪切/分布力）和接触状态（合力/压力中心/滑动）分别编码并融合进 Transformer。
  2. 结构化接触预测：模型不仅输出动作，还联合生成未来的“接触包”（包含接触事件类型和力学变化）。
  3. 预期接触耦合 (ACC)：用上一时刻预测的接触包来偏置注意力机制，让模型在没有实时触觉输入时，依然能关注接触相关的特征。
  4. 触觉想象蒸馏 (HID)：把带触觉输入的教师模型蒸馏成无触觉输入的学生模型。学生去掉了触觉输入分支，但保留了接触生成头，通过匹配教师预测的接触未来和动作来训练。
- **关键细节**: 
  - **输入**：场景图像、机器人状态、臂端力矩历史（由电机电流估计）、任务文本。教师额外输入双指尖的凝胶图像、机械场和接触状态。
  - **模型结构**：28层 DiT blocks 的 Cosmos 基座（2B参数），仅训练 LoRA 适配器、编码器、ACC 和接触读出头。教师可训练参数 27.9M，学生 26.4M。
  - **规模与超参**：预测未来 3 秒的接触和动作（12个未来 latent steps，4Hz），动作块包含 4 个时间步（10Hz）。
- **训练/优化目标**: 
  - **教师**：动作和视频的流速度匹配、接触重建损失（带异方差不确定性加权）、接触事件预测损失、ACC 辅助损失。
  - **学生 (HID)**：接触轨迹匹配（按事件显著性和教师不确定性加权）、事件分布 KL 散度、动作速度蒸馏。失败演示的动作损失权重为 0，防止学生学到错误动作。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自采数据集，包含 3 个任务（Waffles, Carton, Egg），每个任务 250 个正常演示和 35 个故意失败的演示（共 855 个 episode）。
  - **对比对象 (baseline)**：$\pi_{0.5}$ (VLA) 和 Diffusion Policy (DP)。
  - **测试环境**：UR3 机械臂，Robotiq 2F-85 夹爪，DM-Tac W2L 光学触觉指尖，RealSense D435 相机。推理在 RTX 5090 上进行。
- **评价指标**: 任务成功率（操作员评判的放置成功率），以及基于传感器数据的抓取质量（捏合力均值、过抓取/欠抓取次数、鸡蛋破损情况）。
- **主要结果**: 
  - 蒸馏后的学生模型（无触觉输入）取得了最高的平均成功率 77%（pooled 82%），在 Waffles 任务上达到 95%，甚至超过了使用真实触觉输入的教师模型（平均 57%，pooled 60%）以及两个 baseline。
  - 学生模型的抓取力控制更好，在 Waffles 任务上没有发生过抓取（over-grasp）和欠抓取（under-grasp）。
  - 消融实验：将学生模型生成的接触帧置零，成功率从 70% 暴跌至 13.3%，证明模型在部署时确实依赖其“想象”出的接触表征，而不是单纯靠视觉和力矩。

### 80. 🔥 [Grounded Action Model: 3D Grounding as a Foundation for Robotics] (Grounded Action Model：3D Grounding作为机器人学的基础)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23863` | [点击跳转](https://arxiv.org/abs/2609.23863)

**0. 论文标题**
- **英文标题**: Grounded Action Model: 3D Grounding as a Foundation for Robotics
- **中文标题**: Grounded Action Model：3D Grounding作为机器人学的基础
- **研究机构**: 原文未提及
- **一句话总结**: [领域：具身智能/机器人操作；类型：方法创新] 提出以可提示的3D Grounding模型替代传统的语言/视频生成基座，通过显式的目标三维几何与视觉表征来驱动动作预测，大幅提升了机器人在场景扰动和动态目标下的操作泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（Manipulation policy learning），即根据语言或视觉提示控制机械臂精准操作目标物体。
- **研究动机**: 现有的VLA（视觉-语言-动作）和WAM（世界-动作）模型依赖语言或视频生成预训练基座，这些基座的预训练目标不直接要求精确的度量三维定位（metric grounding）。这导致策略只能隐式地从演示中学习，容易受背景干扰、物体移动或目标改变的影响而失效（即退化为“死记硬背”训练布局的轨迹）。
- **本质改动**: 抛弃语言/视频生成基座，改用预训练的“可提示3D Grounding模型”作为感知基座。将任务提示（语言/点/框）转化为以目标物体为中心的显式3D几何和视觉表征，让动作头直接基于“目标在哪、长什么样”来预测动作，而不是基于整张图像。
- **技术溯源**: 基于预训练的3D Grounding模型（本文实例化为WildDet3D）；动作预测头采用多流Transformer（MM-DiT）；语言编码器采用Flan-T5；动作生成采用Flow Matching（流匹配）；目标跟踪采用CoTracker3；高层规划器采用Molmo2。

**2. 技术拆解**
- **核心方法**: 
  1. **统一提示接口**：接收语言、2D点或2D框提示，通过3D Grounding基座输出目标物体的2D框、3D框和度量深度图。
  2. **构建以物体为中心的表征（Object-centric representation）**：
     - *Image tokens*：只保留与目标物体2D框或机械臂轮廓重叠的视觉特征网格，屏蔽无关背景。
     - *Detection tokens*：利用深度图和3D框裁剪出物体点云，提取形状特征，并结合2D框、3D中心、尺寸、旋转等度量几何信息编码为token。
  3. **动作预测**：将上述表征与机器人状态历史融合，输入多流Transformer（MM-DiT），结合语言条件（通过AdaLN注入），预测绝对关节位置的动作块（action chunks）。
- **关键细节**: 
  - **输入输出**：输入为RGB图像 + 任务提示（语言/2D点/2D框）；输出为绝对关节位置目标 + 夹爪命令（动作块）。
  - **模型结构与规模**：图像特征网格 $G=16$；点云采样数 $P=512$；每个物体生成 $M=8$ 个detection tokens；MM-DiT包含12个blocks；语言嵌入维度768。3D Grounding基座在策略训练时保持冻结。
- **训练/优化目标**: 采用Flow Matching（流匹配）损失。对给定的演示动作块加噪，训练模型预测动作速度（velocity），从而通过积分生成动作。优化目标仅包含动作头（adapter、fusion layer、MM-DiT等），冻结3D Grounding基座。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：RoboTwin 2.0（50个双臂任务，含Easy和Hard/场景随机化设置）；LIBERO-PRO（16种扰动设置，包括物体外观/尺寸、位置、指令语义、新目标指定）。
  - **真机平台**：双臂YAM（测试视觉偏移鲁棒性）；单臂Franka（测试长程和依赖记忆的任务，结合Molmo2规划器）。
  - **Baselines**：RoboTwin上的DP, ACT, RDT, DP3, $\pi_0$, $\pi_{0.5}$, Spatial Forcing等；LIBERO-PRO上的NORA, MolmoAct, OpenVLA, Flex-$\pi$等；真机上的$\pi_{0.5}$, MolmoAct2。
- **评价指标**: 任务成功率（Success rate）、步骤完成率（Step completion rate）、分布外（OOD）性能保留率。
- **主要结果**: 
  - **RoboTwin 2.0**：平均成功率55.3%（超Spatial Forcing的52.0%）；在Hard（场景随机化）设置下达47.6%（远超Abot-M0的30.4%），且动作策略仅在clean-scene上训练。
  - **LIBERO-PRO**：平均成功率61%（超$\pi_{0.5}$的53%）。在目标位置改变（Pos）和新目标指定（Task）这两个最考验空间泛化的设置上提升最大（如Spatial-Task达0.88，而baseline均低于0.11）。
  - **真机YAM**：在视觉偏移（OOD）下保留17/20的成功率（$\pi_{0.5}$仅4/20），性能保留率达89%。
  - **真机Franka**：结合Molmo2规划器，OOD步骤完成率达49.8%（超$\pi_{0.5}$的24.0%和MolmoAct2的17.1%），证明其点提示接口能有效支持规划器驱动的长程和依赖记忆的任务。

### 81. 🔥 [Structured World-State Reasoning for Agentic Robotic Search] (面向智能体机器人搜索的结构化世界状态推理)
- **研究机构**: `Naval Postgraduate School (美国海军研究生院)`
- **Arxiv ID**: `2609.23841` | [点击跳转](https://arxiv.org/abs/2609.23841)

**0. 论文标题**
- **英文标题**: Structured World-State Reasoning for Agentic Robotic Search
- **中文标题**: 面向智能体机器人搜索的结构化世界状态推理
- **研究机构**: Naval Postgraduate School (美国海军研究生院)
- **一句话总结**: 提出 WORLDS 框架，通过维护仅由感知更新的结构化世界状态图，并结合并行推理智能体主动收集证据，解决了语言引导机器人搜索中证据不完整和指代歧义的问题。

**1. 整体逻辑**
- **研究任务**: 语言引导的长视野机器人搜索（根据自然语言指令，在部分已知环境中寻找特定目标并导航至该处）。
- **研究动机**: 现有方法在处理异构、不完整的证据（文本、先验地图、实时观测）时容易过早锁定单一解释（commit early），无法在多个竞争性假设中保留合理的替代方案，也缺乏主动收集物理观测来区分这些假设的机制。
- **本质改动**: 将世界事实（地图与感知）与推理判断解耦，构建一个仅由感知更新的结构化世界状态图；同时引入多个并行推理智能体提出竞争性假设和观测需求，通过共享的感知巡回收集证据，最后由裁判基于验证后的证据做出决策。
- **技术溯源**: 基于多模态大语言模型（Inkling-Small-NVFP4）、开放词汇分割模型（SAM 3.1）以及 OpenStreetMap (OSM) 地理空间先验。

**2. 技术拆解**
- **核心方法**: WORLDS (World-state Observation and Reasoning for Language-guided Discovery and Search) 框架。核心包含三个模块：1) 结构化世界状态（SWS）：基于 OSM 初始化、仅由感知更新的持久化图，存储客观事实而非判断；2) 并行推理机（Reasoners）：解释指令，在图中检索候选目标，并提出需要特定视角观测来验证的谓词问题；3) 检查员（Examiner）与裁判（Judge）：Examiner 对共享感知巡回获取的观测进行统一打分，Judge 综合证据选择最终目标或请求补充观测。
- **关键细节**: 
  - **输入输出**: 输入为自然语言指令、机器人位姿、OSM 先验和实时观测；输出为带有世界坐标的目标图节点或“无提交”状态。
  - **模型与架构**: 推理和判断使用 Inkling-Small-NVFP4 (276B 总参/12B 激活的 MoE 模型)；感知使用 SAM 3.1 进行开放词汇分割。SWS 图节点包含对象属性、空间关系（包含、重叠、相邻）和证据摘要。推理机通过 Find 和 Inspect 工具检索图信息。共享感知巡回通过集合覆盖问题（set-cover）最小化观测视角数量。
  - **规模与超参**: 默认启动 5 个 Reasoners 并保留前 3 个有效计划；分割概念提示词上限 32 个；主要动作预算为 200 步。
- **训练/优化目标**: 本文是无训练（Training-free）工作，无需优化损失函数。核心机制依赖于大模型的提示词工程（Prompting）、测试时计算（Test-time compute / reasoning effort 调节）以及多智能体协作与图结构检索。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: CityNav（5,311 个 test_unseen episodes），基于 SensatUrban 重建的伯明翰和剑桥城市场景，使用纯 OSM 先验（OSM-only protocol）。
  - **对比对象（Baseline）**: 已发表的 GeoNav、CLOSER-VLN、ViSA；以及在相同模型、先验、感知栈和移动预算下适配的 ViSA-inspired 和 GeoNav (adapted)。物理部署使用 PX4 四旋翼无人机。
- **评价指标**: 最终位姿成功率 (SR)、预言成功率 (OSR)、路径长度加权成功率 (SPL)。目标成功区域定义为标注目标周围 20 米半径。
- **主要结果**: 
  - 在 5,311 个 episode 上，WORLDS 达到 51.8% 的 SR，比已发表最好结果（ViSA 的 36.1%）高出 15.7 个百分点。
  - 在 1,000 个共享 episode 的严格控制对比中，WORLDS 达到 50.0% 的 SR，比最强适配 baseline（27.9%）高出 22.1 个百分点。
  - 消融实验表明，Examiner（基于观测的验证）贡献了 5.9% 的 SR 提升；Reasoner 数量从 1 增加到 8 时，候选覆盖率从 54.0% 提升至 77.2%，且感知停靠点仅从 1.13 微增至 1.39。
  - 在降低推理努力（reasoning effort）设置下，WORLDS 仍比适配的 GeoNav 高出 18.8% 的 SR，且生成的 token 数更少。
  - 物理部署中，成功在真实四旋翼上飞行生成的感知航点，并从机载图像中定位了地图上不存在的目标（如红色 SUV）。

### 82. 🔥 [Beyond Appearance Shifts: Task-Semantic Action Calibration for VLA Models] (超越外观偏移：面向VLA模型的任务语义动作校准)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23650` | [点击跳转](https://arxiv.org/abs/2609.23650)

**0. 论文标题**
- **英文标题**: Beyond Appearance Shifts: Task-Semantic Action Calibration for VLA Models
- **中文标题**: 超越外观偏移：面向VLA模型的任务语义动作校准
- **研究机构**: 原文未提及
- **一句话总结**: 提出 BAS-VLA 框架，通过在冻结的 VLA 基座上外挂轻量级非对称校准层，解决模型在“语义不变时动作乱飘”和“语义改变时动作不敏感”的可靠性问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在具身操作中的行为可靠性，使其在场景外观变化（任务语义不变）时保持动作稳定，在任务语义改变时能做出正确的动作调整。
- **研究动机**: 现有 VLA 模型存在两种互补的失败模式：1）在任务保留变化（如光照、风格、杂乱等外观改变但语义不变）下，策略会出现不必要的动作漂移；2）在语义破坏变化（如目标物体被替换）下，策略没能产生足够不同的行为，还在盲目执行原任务（缺乏旧任务抑制能力）。
- **本质改动**: 不动 VLA 基座权重，直接在动作输出端外挂一个轻量级非对称校准层：默认用“破坏中心”残差模块把语义改变的动作推开，并加个“证据门控”辅助模块，在检测到无害外观干扰时微调动作。
- **技术溯源**: 基于 OpenPI-pi0.5 和 OpenVLA-OFT 作为冻结基座（Carrier），在 LIBERO 系列仿真环境中进行评估。

**2. 技术拆解**
- **核心方法**: BAS-VLA 包含两个组件：1）破坏中心校准核心（Breaking-Centered Core）：作为默认路径，通过残差网络调整动作，用对比损失把语义改变的动作推离原始动作盆地；2）证据门控保留辅助（Preserving Auxiliary）：对观测做外观规范化，利用冻结视觉特征计算证据门，仅在检测到强干扰且语义一致时，把探测动作和基础动作做弱融合。
- **关键细节**: 
  - 输入输出：输入为当前观测、语言指令和 rollout 上下文，输出为校准后的动作或动作块。
  - 模型结构：冻结的 VLA 基座 + 轻量级残差校准器（仅训练此部分） + 可选的辅助分支（利用基座冻结特征）。
  - 部署模式：Default（仅用破坏核心）、Preserving（仅用辅助分支）、Full（两者结合，主要用于消融实验）。
- **训练/优化目标**: 
  - 破坏核心的损失函数包含三部分：模仿损失（让 clean 和 control 动作靠近 ground truth）、一致性损失（让 clean 和 control 动作互相靠近）、分离损失（带 margin，强制 break 动作远离 clean 动作）。
  - 辅助分支无需额外训练，通过计算阶段、视觉偏移、语义一致性和动作分歧四个门控因子，决定弱融合的权重。

**3. 实验结果**
- **实验设置**: 
  - 数据集：主要使用 LIBERO-Object（测语义破坏）和 LIBERO-Spatial（测任务保留），补充使用 LIBERO-10、LIBERO-Plus、LIBERO-PRO 等。
  - 对比对象（Baseline）：未校准的冻结基座（Frozen OpenPI-pi0.5 / OpenVLA-OFT），以及多种推理时策略（SGAC-AC, AAC, RTC, PCD, ST4-VLA, HAMLET）。
- **评价指标**: 任务成功率（Task success rate）。在语义破坏设置中，核心指标是 Break 条件下的“原任务成功率”（越低代表旧任务抑制和语义分离效果越好）；在任务保留设置中，关注干扰条件下的成功率。
- **主要结果**: 
  - 语义破坏（如 Milk-Swap）：Clean 成功率 98.0%，Control 97.5%，Break 条件下的原任务成功率降至 0.0%（Baseline 为 90.0%），实现了极强的旧任务抑制。
  - 任务保留（Style-shift）：在 Bowl-on-Ramekin 风格变化下，成功率从 42.0% 提升至 70.0%，且 Clean 性能不降。
  - 真机实验：在 4 个语义改变任务中，平均新任务成功率从 15.9% 提升至 51.9%。
  - 外部协议泛化：在 LIBERO-Plus 和 LIBERO-PRO 上无需微调，成功率分别提升 23.1 pts 和 34.5 pts。

### 83. 🔥 [CompVLA: A Variable Compliance Vision-Language-Action Model for Contact-rich Manipulation] (CompVLA：一种用于接触丰富操作的变柔顺视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23614` | [点击跳转](https://arxiv.org/abs/2609.23614)

**0. 论文标题**
- **英文标题**: CompVLA: A Variable Compliance Vision-Language-Action Model for Contact-rich Manipulation
- **中文标题**: CompVLA：一种用于接触丰富操作的变柔顺视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种双专家架构的VLA模型，通过联合预测运动轨迹、时变刚度和虚拟位移，结合几何阻抗控制器，解决了现有VLA在接触丰富任务中缺乏主动柔顺控制和力调节能力的问题。

**1. 整体逻辑**
- **研究任务**: 让机器人在接触丰富的操作任务（如擦白板、枢轴转动等）中，能够根据视觉和语言指令，不仅输出运动轨迹，还能输出合适的柔顺控制参数（刚度和虚拟位移），以安全、稳定地与环境进行物理交互。
- **研究动机**: 现有VLA模型只输出纯运动学指令（位置控制），在接触丰富任务中容易因跟踪误差导致失去接触或施加过大接触力。现有引入力/力矩输入的VLA（如ForceVLA、TA-VLA）最终仍输出位置指令，无法主动调节接触力；而固定刚度的柔顺控制无法同时满足自由空间的高精度跟踪和接触时的柔顺让步。
- **本质改动**: 在标准VLA架构中增加一个“柔顺专家（Compliance Expert）”，与“动作专家”并行，联合预测时变的对角线刚度（实现方向柔顺）和虚拟位移（实现力调节），并通过底层的几何阻抗控制器（GIC）执行。
- **技术溯源**: 基于 $\pi_0$ (pi0) VLA模型（使用 PaliGemma 作为 VLM backbone），结合了自适应柔顺策略（ACP）的数据处理启发，以及几何阻抗控制（GIC）理论。

**2. 技术拆解**
- **核心方法**: 
  1. 数据构建：从力反馈遥操作演示中，利用启发式规则（基于接触力/力矩大小和方向）提取时变对角线刚度和虚拟位移作为监督信号。
  2. 模型架构：采用双专家结构。动作专家预测参考TCP扭转和夹爪命令；柔顺专家以VLM特征和动作专家预测的参考轨迹为条件，预测对角线刚度和虚拟位移。
  3. 控制执行：将预测的虚拟位移用于偏移参考轨迹形成虚拟目标位姿（实现力调节），将预测的刚度结合接触力方向映射到任务空间刚度矩阵（实现方向柔顺），最后通过高频几何阻抗控制器计算关节扭矩。
- **关键细节**: 
  - 输入：3个相机的RGB图像、机器人状态（关节角、TCP位姿、夹爪状态）、语言指令。
  - 输出：动作块（Motion chunk，预测步长 T=25），包含参考TCP twist、夹爪命令、6维对角线刚度、6维虚拟位移。
  - 模型结构：VLM backbone为PaliGemma，动作专家和柔顺专家均为基于Gemma的Flow-matching架构。推理时去噪步数为10步。
  - 训练超参：训练100k步，batch size 32，bfloat16精度，AdamW优化器，峰值学习率 2.5e-5。
- **训练/优化目标**: 联合使用条件流匹配（Conditional Flow Matching）损失。动作专家损失和柔顺专家损失相加。柔顺专家额外以真实的TCP轨迹作为条件输入。同时引入关节角预测作为辅助任务，以更好地保留预训练VLM的权重信息。

**3. 实验结果**
- **实验设置**: 
  - 硬件：2个7-DoF Franka Research 3 (FR3) 机械臂（主从遥操作），3个Intel RealSense D435i相机，腕部ATI力/力矩传感器（仅采集数据，推理不用）。
  - 数据集：作者自采的接触丰富演示数据集（每个任务100个demo）。
  - 任务：擦白板（Erase Whiteboard）、枢轴转动（Pivot）、杯子分发（Cup Dispense），以及标准的抓取放置（Pick and Place）。
  - Baselines：$\pi_0$ (纯VLA), ForceVLA (输入增加6轴力), TA-VLA (输入增加关节力矩并预测力矩作为辅助)。
- **评价指标**: 任务成功率（Success rate），擦白板任务额外报告擦除字母的比例。
- **主要结果**: 
  - 接触丰富任务平均成功率：CompVLA达到 67.1%，比最强baseline（ForceVLA的54.4%）高出12.7个百分点。
  - 具体任务表现：擦白板 92.9%（vs ForceVLA 68.1%），枢轴转动 73.3%（vs ForceVLA 45.0%），杯子分发 35.0%（略低于ForceVLA的50.0%，但综合平均最高）。
  - 标准任务：Pick and Place 成功率 76.7%，与 $\pi_0$ 的 80.0% 相当，证明引入柔顺控制没有损害常规操作能力。
  - 消融实验：去掉虚拟位移成功率降至7%；去掉整个柔顺专家降至15.3%；固定刚度矩阵在Pivot任务上从70%降至40%。证明变刚度和虚拟位移缺一不可。

### 84. 🔥 [AR-WAM: A Visual-Conditioned Agent-Ready World Action Model for Robotic Manipulation] (AR-WAM：面向机器人操作的视觉条件化智能体就绪世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23578` | [点击跳转](https://arxiv.org/abs/2609.23578)

**0. 论文标题**
- **英文标题**: AR-WAM: A Visual-Conditioned Agent-Ready World Action Model for Robotic Manipulation
- **中文标题**: AR-WAM：面向机器人操作的视觉条件化智能体就绪世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种用视觉边界框和可学习操作token替代自然语言指令的轻量级世界动作模型，将高层规划与底层执行解耦，在保持极低推理延迟的同时显著提升了长程和真实机器人任务的成功率。

**1. 整体逻辑**
- **研究任务**: 智能体驱动的机器人操作控制（Agent-driven robotic control），核心在于设计高层智能体（Agent）与底层策略模型（Policy）之间的交互接口。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型和世界动作模型（WAM）高度依赖自然语言指令。在智能体驱动的场景下，文本指令存在指代模糊、空间定位不精确、与智能体自身的语言理解能力冗余，以及意图与执行黑盒耦合等问题，不适合作为底层策略的控制接口。
- **本质改动**: 彻底抛弃自然语言指令，改用“视觉边界框+原子操作token”作为底层策略的唯一条件输入，把高层的语言理解、长程规划和错误恢复全部交给外部Agent，让底层模型只做纯粹的视觉运动控制。
- **技术溯源**: 基于轻量级潜在世界动作模型（Latent WAM）范式（如 LiLa-WAM, Fast-WAM），使用冻结的预训练视觉编码器（DINOv3），并结合流匹配（Flow Matching）进行动作去噪。

**2. 技术拆解**
- **核心方法**: 
  1. 视觉与操作条件化：用归一化边界框指定目标位置，用可学习的嵌入向量表示原子操作（如 pick, place）。
  2. 推理专家与未来前瞻：引入推理专家输出可监督的意图信号（目标 mask、末端位姿、任务抽象），并通过离线提取的“前瞻摘要（foresight gist）”提供未来场景演化的紧凑潜在目标。
  3. 世界动作专家：使用流匹配联合去噪动作、视觉前瞻和语义前瞻，实现双层未来对齐，让动作生成具备未来预见性。
  4. 智能体兼容层：提供 detect（检测）、execute（执行）、query（查询）三个原语，外部智能体通过事件触发（如夹爪闭合、位移超阈值）来驱动策略，处理长程任务和失败重试。
- **关键细节**: 
  - 模型规模：总计 0.5B 参数（0.2B Transformer 共享推理和动作专家，0.3B 冻结的 DINOv3 视觉编码器）。
  - 输入输出：输入为单视角图像、本体感觉、边界框、操作 token 及辅助属性（如使用哪只手臂）；输出为动作块（action chunk）及推理信号。
  - 数据增强：训练时对边界框进行随机抖动，使策略对智能体给出的不精确框具有鲁棒性。
- **训练/优化目标**: 
  联合损失函数包含四部分：1) 动作损失（流匹配的插值速度回归）；2) 推理损失（BCE 计算 mask，CE 计算任务抽象，MSE 计算末端位姿）；3) 视觉前瞻损失（对齐离线提取的未来场景潜在特征）；4) 语义前瞻损失（对齐未来帧的推理 token）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：RoboTwin 2.0（10个双臂操作任务），RMBench（依赖记忆和推理的任务），以及真实 Astribot S1 双臂平台（3个长程任务）。
  - 对比对象：语言条件 VLA（$\pi_{0.5}$, X-VLA），WAM（Fast-WAM），潜在 WAM（Motus, LiLa-WAM），以及记忆增强策略（Mem-0, Goal2Skill, Cortex）。高层智能体使用了 Qwen3.8-27B 和 Kimi-K3。
- **评价指标**: 任务成功率（Success Rate），端到端推理延迟（Inference Latency）。
- **主要结果**: 
  - 在 RoboTwin 2.0 上，平均成功率达到 87.2%（clean）和 84.2%（random），与最强 baseline 持平或略低（clean 差 0.6%），但在随机设置下表现最好；消融实验证明视觉提示比文本提示成功率高 13.0%。
  - 在 RMBench（记忆依赖任务）上，结合智能体后，在 M(n) 任务上大幅超越所有 baseline（52.5%/63.5% vs 38.7%）。
  - 在真实机器人上，平均成功率 71.7%，远超 $\pi_{0.5}$ (35.0%) 和 LiLa-WAM (31.7%)。
  - 推理延迟极低，端到端延迟仅 14.09 ms/chunk，比 $\pi_{0.5}$ 快 4.4 倍，比 Fast-WAM 快 22.7 倍。

### 85. 🔥 [TaskAnchor: Grounding Task State in Reactive VLAs for Long-Horizon Manipulation] (TaskAnchor：在长程操作的反应式视觉语言动作模型中锚定任务状态)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23580` | [点击跳转](https://arxiv.org/abs/2609.23580)

领域与类型判断：本文属于具身智能/机器人操作（Embodied AI / Robotic Manipulation）领域，类型为方法创新。以下总结将使用视觉-语言-动作模型（VLA）与长程机器人操作相关的专业术语。

**0. 论文标题**
- **英文标题**: TaskAnchor: Grounding Task State in Reactive VLAs for Long-Horizon Manipulation
- **中文标题**: TaskAnchor：在长程操作的反应式视觉语言动作模型中锚定任务状态
- **研究机构**: 原文未提及
- **一句话总结**: 提出 TaskAnchor 轻量级适配器，通过引入历史视觉残差和任务进度标量，解决反应式 VLA 在长程操作中的任务状态混叠问题，在不增加显式规划器的情况下大幅提升长程任务成功率且几乎不增加推理延迟。

**1. 整体逻辑**
- **研究任务**: 解决反应式视觉-语言-动作（Reactive VLA）模型在长程机器人操作任务中，因视觉相似但任务阶段或历史依赖不同而导致的动作选择歧义（即“任务状态混叠”，task-state aliasing）问题。
- **研究动机**: 反应式 VLA 仅依赖当前观察和指令预测动作，缺乏对当前执行阶段和历史交互证据的感知。现有方法要么将阶段信息隐式编码在高维时序特征中（如历史感知策略），要么将历史压缩为粗粒度语义摘要（如规划方法），难以同时满足细粒度历史证据检索和显式阶段识别的需求。
- **本质改动**: 设计一个轻量级适配器（TaskAnchor），在不修改预训练 VLA 架构和动作生成机制的前提下，通过原生视觉和语言接口注入“历史条件视觉微调”和“任务状态坐标（标量）”两种信号，为策略提供执行历史的 grounding。
- **技术溯源**: 基于预训练的视觉-语言-动作模型（主要为 $\pi_{0.5}$ 和 X-VLA），结合了上下文自适应测试时训练（Context-Adaptive Test-Time Training, CA-TTT）机制来处理历史记忆。

**2. 技术拆解**
- **核心方法**: 
  1. 历史条件视觉适应：利用 L 层 CA-TTT 模块，通过当前观察查询历史键值记忆，进行单步测试时更新（test-time update）生成快速权重，提取相关历史证据并计算视觉残差偏移，以更新当前视觉 token。
  2. 任务坐标预测与条件化：预测一个连续标量（任务状态坐标，代表已完成语义里程碑的比例），将其序列化为文本提示拼接到原始指令中，通过语言接口输入 VLA。
- **关键细节**: 
  - 输入输出：输入为当前观察、历史记忆和任务指令；输出为未来动作块。
  - 模型结构：在预训练 VLA 外部增加 CA-TTT 层（包含查询、键、值投影和轻量级 MLP）以及坐标头，通过原生视觉和语言接口注入信号，不改变下游视觉-语言骨干网络。
  - 规模：增加 27.80M 可训练参数（占 3.3B 骨干网络的 0.84%）。
  - 关键超参/设置：CA-TTT 层数 $L$，内部学习率 $\eta_{ttt}$；历史记忆压缩函数 $\Phi(\cdot)$ 用于减少每帧存储的空间 token 数；动作块预测步长 $H$（如 RMBench 中为 20，RoboMemArena 中为 10）。
- **训练/优化目标**: 
  - 联合优化目标为 $\mathcal{L} = \mathcal{L}_{act} + \lambda_{coord} \mathcal{L}_{coord}$。其中 $\mathcal{L}_{act}$ 为基础 VLA 的动作损失，$\mathcal{L}_{coord}$ 为坐标分支的 L2 损失（预测进度与真实归一化里程碑完成度之间的误差）。CA-TTT 的内部损失 $\mathcal{L}_{TTT}$ 仅用于推理时构建快速权重，不参与外部参数更新。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RMBench（评估双臂操作中的早期证据检索，5 个任务）和 RoboMemArena（评估包含转移、遮挡、计数和顺序执行的长程任务，26 个任务）。
  - 对比对象（baseline）：DP, ACT, $\pi_{0.5}$, X-VLA, Mem-0, HiF-VLA, MemoryVLA, MemER, PrediMem。
- **评价指标**: 
  - RMBench：成功率（SR, Success Rate）。
  - RoboMemArena：任务成功率（TSR, Task Success Rate，需完成所有阶段）和累积成功率（CSR, Cumulative Success Rate，完成阶段的比例）。
- **主要结果**: 
  - 在 RMBench 上，TaskAnchor-$\pi_{0.5}$ 平均 SR 达到 0.68，比 $\pi_{0.5}$ (0.14) 提升约 4.9 倍，比 Mem-0 (0.53) 提升 0.15。
  - 在 RoboMemArena 上，平均 TSR 达到 44.4%，CSR 达到 60.5%，比 $\pi_{0.5}$ 分别提升 22.9 和 21.8 个百分点。
  - 效率方面，每个动作块仅增加 2.08 ms 推理延迟（从 62.00 ms 增至 64.08 ms，增幅 3.35%），验证了该方法在几乎不增加计算开销的情况下显著提升了长程操作性能。

### 86. 🔥 [SCULPT-VLA: Learning Structured Control through Staged Action Grounding] (SCULPT-VLA：通过分阶段动作接地学习结构化控制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23275` | [点击跳转](https://arxiv.org/abs/2609.23275)

**0. 论文标题**
- **英文标题**: SCULPT-VLA: Learning Structured Control through Staged Action Grounding
- **中文标题**: SCULPT-VLA：通过分阶段动作接地学习结构化控制
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种分阶段训练VLA模型的方法，先通过教师脚手架强制模型学习结构化的中间控制状态并屏蔽直接感知，再恢复感知访问来微调连续动作，从而在不增加推理成本的前提下显著提升机器人操作的泛化与控制精度。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的机器人操作策略学习。
- **研究动机**: 现有VLA模型引入了结构化中间监督（如任务分解、空间表示），但动作预测如何有效依赖这些中间表示仍是个问题。如果动作解码器一开始就无限制地访问所有多模态上下文，联合优化很难同时学好表示和动作条件化；如果只通过中间状态条件化动作，又要求该状态必须保留连续控制所需的所有细节，容易丢失高频感知信息。
- **本质改动**: 提出“分阶段动作接地（Staged Action Grounding）”，将结构化控制状态的形成与动作读取解耦。通过课程学习改变信息访问权限：先强制动作学习依赖结构化状态，再恢复直接感知访问以进行连续控制的微调。
- **技术溯源**: 基于 Qwen3-VL 作为视觉语言基座，结合了 FAST（离散动作token预测）、Flow matching（连续动作生成，类似 $\pi_0$）、DINOv2（视觉细节特征），并使用 Qwen3-Embedding、UniVLA、Depth Anything V2 作为训练时的教师脚手架（Teacher scaffolds）。

**2. 技术拆解**
- **核心方法**: 
  1. **结构化控制状态**：在VLA序列中插入特定的 latent slots，将控制状态解耦为三个互补因子：任务进度（subtask）、场景动态（dynamics）和空间接地（spatial）。每个因子配备专属的残差 FFN，并与动作读取（action readout）slots 分离。
  2. **分阶段动作接地**：
     - **Stage I（状态形成）**：使用冻结的教师模型提供 scaffold 输入，通过 MSE 损失对齐各个因子的表示。此时因子之间、因子与动作组之间不交互。
     - **Stage II（动作接地）**：因子之间双向交互，动作读取和 FAST 位置可以读取因子，但**屏蔽**对视觉和语言的直接访问。同时，教师 scaffold 输入线性退火（anneal）为可学习的 query embeddings，迫使模型从原始观测中推断因子状态。使用 FAST 进行离散动作的粗粒度监督。
     - **Stage III（连续微调）**：动作侧位置**恢复**对视觉和语言的直接访问。结合因子状态、动作读取状态和 DINOv2 视觉细节特征，使用 Flow matching 头进行连续动作 chunk 的生成。
- **关键细节**: 
  - 输入为当前观测和文本指令，输出为动作 chunk（仿真中 horizon=8，真机中 horizon=16）。
  - 因子 slots 数量分配：subtask(4), dynamics(4), spatial(8), action readout(4)。
  - 部署时不需要教师编码器，也不需要离散动作自回归，直接由连续头输出动作。
- **训练/优化目标**: 
  - Stage I：因子对齐损失（学生表示与教师 scaffold 的 MSE）。
  - Stage II：因子对齐损失 + FAST 离散动作自回归损失。
  - Stage III：Flow matching 连续动作损失 + 弱因子对齐损失 + 弱 FAST 辅助损失。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：LIBERO, SimplerEnv-WidowX, RoboTwin 2.0 Full。
  - 真机环境：4个桌面操作任务（Fruit Collecting, Paper Cup Stacking, Toothbrush Insertion, Cloth Folding），使用 UR5e 机械臂。
  - Baselines：共享 Qwen3-VL 基座的变体（FAST, OFT, $\pi_0$-style flow, GR00T-style），以及 OpenVLA, $\pi_0$, $\pi_{0.5}$ 等。
- **评价指标**: 闭环成功率（Success rate, %），平均开环得分（mOLS，衡量预测动作与专家动作在归一化空间内的误差）。
- **主要结果**: 
  - 仿真表现：在 SimplerEnv-WidowX 上平均成功率达 83.5%（对比同基线直接连续策略的 60.9% 和 GR00T 的 65.3%），其中 Stack 任务从 18.8% 大幅跃升至 75.3%。LIBERO 平均 98.5%，RoboTwin 2.0 Full 平均 92.2%，均优于同基线模型。
  - 真机泛化：在 4 个真机任务的分布偏移（OOD）测试中，平均成功率达 58.1%，显著优于 $\pi_{0.5}$ 的 45.6%。
  - 消融与机制验证：如果在 Stage II 直接开放视觉语言访问，SimplerEnv 成功率暴跌至 71.3%；移除任意一个结构化因子都会导致性能下降。推理时替换因子的干预实验证明，即使在 Stage III 恢复了直接感知，学到的结构化状态依然在控制中发挥核心作用，并非被旁路。

### 87. 🔥 [Robot World Models Are Not Invariant to How the Actions Are Written] (机器人世界模型对动作的表示方式不具备不变性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23252` | [点击跳转](https://arxiv.org/abs/2609.23252)

**0. 论文标题**
- **英文标题**: Robot World Models Are Not Invariant to How the Actions Are Written
- **中文标题**: 机器人世界模型对动作的表示方式不具备不变性
- **研究机构**: 原文未提及
- **一句话总结**: 发现机器人世界模型会因为动作的绝对/相对表示方式不同而彻底崩溃，并提出在损失函数层面进行轨道平均与一致性惩罚的修复方案。

**1. 整体逻辑**
- **研究任务**: 评估和修复条件动作的潜在动力学模型（世界模型）对动作参数化表示（绝对关节目标 vs 相对状态增量）的不变性。
- **研究动机**: 现有的模型不变性研究几乎都集中在视觉像素侧（如裁剪、抖动、相机位姿），忽略了动作通道。而在机器人控制中，绝对动作和相对动作在物理上是等价的（给定当前状态可互相推导），但世界模型会默默继承训练时的表示选择，导致换一种动作写法模型就崩溃。
- **本质改动**: 首次将不变性审计从视觉通道转移到动作通道，证明这种崩溃不是信息丢失导致的常规分布偏移，而是模型学到了“表示符号”而非“物理轨迹”，并针对性地提出了损失函数层面的修复法。
- **技术溯源**: I-JEPA (视觉特征编码器), LeRobot (机器人数据集), JEPA/无解码器世界模型框架。

**2. 技术拆解**
- **核心方法**: 
  1. 提出一套测试协议，通过验证“预测等价性”和“联合输入下的相互重构性”来区分真正的重参数化（信息无损）和有损变换。
  2. 提出在损失函数（objective）层面进行轨道平均（orbit averaging），并引入预测不一致性惩罚（disagreement penalty）来修复模型。
- **关键细节**: 
  - 视觉编码器使用冻结的 I-JEPA ViT-H/14，不更新梯度。
  - 预测器为2层MLP（隐藏层1024），输入当前latent和动作窗口（16个均匀采样的点），预测未来latent。
  - 理论证明（Proposition 3）：对于方向值预测（如latent空间中的单位向量），不能直接平均输出，因为归一化后的均值可能比任何单一预测都差；必须在Loss层面进行平均。
- **训练/优化目标**: 
  - 基础目标为 InfoNCE 对比损失（预测未来latent）。
  - 修复目标为两种动作表示下的 InfoNCE 损失平均值，加上两者预测结果之间的余弦不一致性惩罚（权重为 $\lambda$）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LeRobot 中的 ALOHA (mobile_cabinet, static_coffee) 和 PushT。
  - 对比对象（baseline）：单一编码训练的 Teacher、输出平均的 Student、仅在损失层面平均的 Pooled training ($\lambda=0$)、以及加入不一致性惩罚的修复模型 ($\lambda=1, 4, 16$)。
- **评价指标**: 检索排名（Retrieval rank）、跨编码预测的余弦相似度（均值与最差情况）、目标条件动作选择的 Top-1 准确率。
- **主要结果**: 
  - **崩溃现象**：用另一种动作表示测试时，检索排名恶化 2.6 到 13.4 倍，动作选择准确率从 53% 暴跌至 15%；在 PushT 上，两种表示的预测余弦相似度均值仅 0.067，最差达 -0.377（近乎正交甚至反向），说明模型没有优雅退化，而是回答了完全不同的问题。
  - **修复效果**：仅在损失层面平均（$\lambda=0$）即可恢复平均任务性能（如 ALOHA 检索排名从 61.5 降至 5.98，动作选择从 15.4% 升至 40.1%）。
  - **惩罚项的作用**：引入不一致性惩罚（如 $\lambda=16$）能将最差情况的一致性从 0.779 大幅提升至 0.995，并保证长程 rollout 中最坏情况不恶化。代价是可能轻微牺牲标准编码下的准确率（如 PushT 排名从 66.2 变为 79.2）。

### 88. 🔥 [H-VLA: Hierarchical Vision-Language-Action Model with Key-Action Reasoning and Motion Planning in a Unified Action Space] (H-VLA：在统一动作空间中进行关键动作推理与运动规划的分层视觉-语言-动作模型)
- **研究机构**: `Samsung AI Center / Samsung R&D Institute China-Beijing (SRCB)`
- **Arxiv ID**: `2609.22895` | [点击跳转](https://arxiv.org/abs/2609.22895)

**0. 论文标题**
- **英文标题**: H-VLA: Hierarchical Vision-Language-Action Model with Key-Action Reasoning and Motion Planning in a Unified Action Space
- **中文标题**: H-VLA：在统一动作空间中进行关键动作推理与运动规划的分层视觉-语言-动作模型
- **研究机构**: Samsung AI Center / Samsung R&D Institute China-Beijing (SRCB)
- **一句话总结**: 提出分层VLA框架H-VLA，将高层的关键动作推理与底层的密集运动生成解耦，并引入统一的相机中心动作空间，大幅提升了机器人在跨实体和空间变化下的操作泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作（根据视觉观察和语言指令生成机器人控制动作）。
- **研究动机**: 现有VLA模型通常直接将视觉和语言映射到密集动作，这不仅削弱了预训练VLM的语义推理能力，还导致模型在面对物体位置、场景布局、机器人实体和相机视角等空间变化时表现脆弱。
- **本质改动**: 将策略预测解耦为两步：先预测代表下一步操作子目标的“关键动作”（Key-Action），再以此为基础生成密集动作；同时将动作空间统一到第三人称相机坐标系下，消除不同数据集和实体的差异。
- **技术溯源**: 基于预训练的 Prismatic-7B VLM（视觉编码器采用 DINOv2 和 SigLIP，语言骨干采用 LLaMA-2），动作生成模块采用基于扩散的 Transformer（DiT）。

**2. 技术拆解**
- **核心方法**: 
  1. **关键动作模型（Key-Action Model）**：预测下一个操作子目标（即末端执行器的绝对位姿和夹爪状态）。
  2. **运动规划模型（Motion Planning Model）**：以预测的关键动作、当前状态和多模态特征为条件，生成密集的未来动作块（Action Chunks）。
  3. **统一的相机中心动作空间**：利用相机外参，将状态、关键动作和动作全部转换到第三人称相机坐标系下，使动作表示与视觉观察对齐。
  4. **两阶段训练策略**：预训练阶段侧重关键动作推理，微调阶段侧重密集运动生成。
- **关键细节**: 
  - **输入**：第三人称RGB、手腕视角RGB（可选，通过mask处理缺失）、语言指令、当前末端状态。
  - **模型结构**：VLM提取认知特征和全局视觉特征；Key-Action和Motion Planning模型均为DiT扩散模型。采用14维共享接口同时支持单臂（通过复制填充）和双臂数据。
  - **关键动作标签构建**：通过夹爪状态变化（开/关）和轨迹终点自动提取，作为下一步子目标的近似。
  - **规模**：VLM 7.5B，Key-Action Model 89M，Motion Planning Model 89M，总参数量约 7.7B。
- **训练/优化目标**: 扩散去噪损失（MSE）。第一阶段损失权重为 $\lambda_k=10, \lambda_a=1$（侧重关键动作推理）；第二阶段权重为 $\lambda_k=1, \lambda_a=1$（侧重密集动作生成）。

**3. 实验结果**
- **实验设置**: 
  - **预训练数据**：混合了 RoboCOIN Cobot Magic, DROID, BridgeDataV2, FractalData（共约 183K 轨迹）。
  - **仿真评估**：SimplerEnv 基准（Google Robot VM/VA, WidowX VM），对比 RT-1-X, OpenVLA, CogACT, $\pi_0$, $\pi_{0.5}$, MolmoAct2, DAM-VLA 等。
  - **真机评估**：Agilex 双臂机器人，150个demo（3个任务），对比 $\pi_0$, $\pi_{0.5}$, CogACT, MolmoAct2。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **SimplerEnv 仿真**：Google Robot VM 达 91%，VA 达 84%，WidowX VM 达 81%。在需要多步推理的复杂任务（如 Drawer+Apple）上达 98%，大幅领先 DAM-VLA (78%)。
  - **真机 Agilex**：在分布内（ID）平均成功率 93%（比最强 baseline $\pi_0$ 的 83% 高 10%）；在 OOD 位置偏移下平均 83%（比最强 baseline 高 47%）；在 OOD 场景/物体偏移下平均 66%（比 $\pi_{0.5}$ 的 50% 高 16%）。
  - **推理效率**：在 RTX 4090 上生成 16 步动作块的端到端延迟为 103 ms。

### 89. 🔥 [Stable and Efficient Real-World Online VLA Post-Training via Asynchronous Replay-Anchored Policy Improvement] (基于异步回放锚定策略改进的稳定高效真实世界VLA在线后训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.22888` | [点击跳转](https://arxiv.org/abs/2609.22888)

**0. 论文标题**
- **英文标题**: Stable and Efficient Real-World Online VLA Post-Training via Asynchronous Replay-Anchored Policy Improvement
- **中文标题**: 基于异步回放锚定策略改进的稳定高效真实世界VLA在线后训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RAPolicy 框架，通过异步执行与“回放锚定”的 Critic/Actor 更新机制，解决了 VLA 模型在真实世界在线后训练中因异步更新导致的价值估计偏差和策略崩溃问题，大幅提升了在线适应效率和稳定性。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在真实世界物理部署时的在线后训练（Online Post-Training），即让机器人在执行任务时边收集交互数据边持续优化策略。
- **研究动机**: 现有的在线学习多为串行（收集-训练-部署），导致机器人或计算资源闲置；若改为异步（边收集边训练），由于部署策略与学习策略不同步，当前策略生成的动作往往缺乏回放数据支持（OOD），会导致 Critic 价值估计错误和 Actor 策略崩溃。
- **本质改动**: 将异步执行与“回放锚定（Replay-Anchored）”结合，Critic 计算价值目标时不预测下一步动作，Actor 更新时复用 rollout 阶段的初始噪声，使两者的更新都严格锚定在已记录的回放数据上，避免依赖当前策略生成的无数据支持的动作。
- **技术溯源**: 基于预训练的 VLA 模型 $\pi_{0.5}$ 作为 Actor 基座，结合了 IQL（隐式 Q 学习）的样本内价值备份、AWAC（优势加权行为克隆）以及单步流生成（One-step Flow Matching）技术。

**2. 技术拆解**
- **核心方法**: RAPolicy 框架。包含异步执行机制（Rollout 和 Learning 并发），以及两个核心模块：Replay-Anchored Chunk Value Learning（回放锚定的块级价值学习）和 Replay-Anchored One-Step Policy Improvement（回放锚定的单步策略改进）。
- **关键细节**: 
  - **系统架构**：分布式部署，本地控制机器人，远程服务器（8张 RTX 3090，1张推理收集，7张训练）。每个更新组包含 20 次 Critic 和 5 次 Actor 更新。
  - **Critic 结构**：使用冻结的 VLM 和共享状态骨干提取状态特征，GRU 编码动作块（Action Chunk）。包含 Twin Q-heads 和 Value head。
  - **Actor 结构**：采用单步流 Actor（One-step flow actor）。在 rollout 时保存初始高斯噪声 $z_t$，在 update 时直接复用该 $z_t$ 计算条件似然，不重新采样。
  - **数据缓冲**：分为 online buffer（所有完成回合）和 demo buffer（人类干预及最快的成功轨迹），训练时按 50:50 比例采样。
- **训练/优化目标**: 
  - **Critic 目标**：最小化 Twin Q 函数的 MSE 损失，Bellman target 直接使用下一状态的 Value 目标值 $V'(s_{t+1})$，不采样 next action。Value 函数拟合 Q 值的上期望分位数（expectile，$\tau=0.7$）。
  - **Actor 目标**：优势加权的条件似然最大化。利用记录的 $z_t$ 计算当前 Actor 输出与记录动作的残差，通过优势 $A_t = \min Q - V$ 计算权重 $w_t$，最大化加权对数似然，直接监督 rollout 时使用的单步动作映射。

**3. 实验结果**
- **实验设置**: 
  - **任务与环境**：真实世界 Franka 机械臂环境（2个 RGB 相机）。4个单任务（Plug Charger, Pick Banana, Stack Blocks, Wipe Whiteboard）和 1个联合5任务（Joint Multi-Task）。单任务初始仅用 10 个 demo 做 SFT，多任务用 150 个 demo（每任务 30 个）做 SFT。
  - **对比对象 (Baseline)**：单任务对比 ALOE, EXPO-FT, HIL-SERL；多任务对比 HG-DAgger。
- **评价指标**: Rollout 成功率（Success Rate）、人类干预率（Intervention Rate），以及在固定在线训练时间（1-2小时）内的最终策略评估成功率。
- **主要结果**: 
  - **单任务**：在 1-2 小时在线预算内，RAPolicy 平均成功率达到 86.3%（Plug Charger 100%, Pick Banana 95%, Stack Blocks 70%, Wipe Whiteboard 80%），相比最强 baseline (EXPO-FT) 有显著提升（相对提升 72.5%），且人类干预更少。
  - **多任务**：联合 5 任务整体成功率从 SFT 的 52% 提升至 88%，显著优于 HG-DAgger 的 70%。在保持简单任务（如 PnP）100% 成功率的同时，大幅提升了困难任务（如 Stacking，从 15% 提升至 75%）的性能。
  - **消融实验**：验证了单步流策略（比 2/3 步更快收敛）、回放锚定 Critic（比预测动作 bootstrap 更稳定且训练快 3 倍以上）、以及复用 rollout 噪声的条件似然更新（比 flow-matching 更有效）的必要性。

### 90. 🔥 [PileBelief: Persistent Physical State for Interaction-Driven World Modeling] (PileBelief：面向交互驱动世界建模的持久物理状态)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.22858` | [点击跳转](https://arxiv.org/abs/2609.22858)

**0. 论文标题**
- **英文标题**: PileBelief: Persistent Physical State for Interaction-Driven World Modeling
- **中文标题**: PileBelief：面向交互驱动世界建模的持久物理状态
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种引入持久物理记忆的世界模型，通过记录历史挖掘造成的地形形变和物理响应，解决了机器人挖掘中因局部观测受限导致的物理状态歧义问题，显著提升了多步预测和动作评估的准确性。

**1. 整体逻辑**
- **研究任务**: [领域：机器人学/具身智能；类型：方法创新] 解决机器人挖掘（如装载机铲土）任务中的环境演化预测与动作评估问题。具体而言，根据局部观测和历史交互，预测地形变化和铲斗负载等物理结果，并对候选动作进行排序。
- **研究动机**: 挖掘作业会改变土壤的地下支撑和材料条件，且机器人的感知窗口是局部的。当感知窗口移开后，之前挖掘造成的隐藏物理变化无法被当前观测捕捉，导致“相同当前观测和动作，但物理结果不同”的歧义问题。现有仅依赖当前观测或简单拼接历史序列的世界模型，无法有效建立历史交互与未来动作之间的空间物理对应关系。
- **本质改动**: 将历史交互证据显式地组织为“世界坐标系下的空间形变记忆”和“物理响应记忆”，并通过动作对齐的稀疏读取和门控残差机制来修正局部观测先验，从而在固定模型权重下维护一个随交互演化的持久物理信念（Physical Belief）。
- **技术溯源**: 基于世界模型（World Models）框架，结合了空间记忆机制（如 Neural Map、MapNet 中的空间注册）和序列记忆（ConvGRU），以及局部观测编码（CNN+MLP）。

**2. 技术拆解**
- **核心方法**: PileBelief 世界模型架构。首先训练一个仅依赖当前局部观测的物理先验网络并冻结；然后引入持久物理状态（包含空间形变地图和物理响应缓存），在推理时根据候选动作从历史记忆中进行动作对齐的 Top-K 稀疏读取，计算有界残差来修正先验预测。执行真实动作后更新测量信念，推演假设动作时推进独立的想象状态。
- **关键细节**: 
  - 输入输出：输入为当前局部高度图（5m×5m, 33×25网格）、动作参数、历史形变和物理响应（体积、峰值力、边界流量、失效体积）。输出为符号地形变化图和标量物理结果。
  - 模型结构：先验网络为3层CNN+MLP；修正网络包含空间CNN（编码重采样后的历史形变）和响应MLP。
  - 记忆机制：世界地图30m×30m（0.25m分辨率），保留最近3次形变事件通道和3次响应向量；支持用空间ConvGRU压缩长期记忆。
  - 稀疏读取：根据平均绝对形变对历史Tile评分，Top-K选取最多12个Tile，重采样到候选动作的局部坐标系。
- **训练/优化目标**: 联合损失函数，包含归一化有效像素的高度 L1 损失、物理结果的 Smooth-L1 损失，以及核心的“匹配组损失（matched-group loss）”（在共享当前观测和动作的样本组内，计算预测与目标的均值中心化差异，迫使模型学习由历史引起的物理差异）。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：MiniSlope（2.5D降阶挖掘模拟器）、Newton/MPM（多材料物理仿真）、真实室内挖掘数据集。
  - 对比对象（baseline）：Local（仅当前观测）、ConvGRU（循环编码历史）、History Transformer（注意力机制处理历史空间事件Token）。
- **评价指标**: 联合预测误差（Joint prediction error，综合高度、体积、力等归一化误差）、离线动作选择遗憾（Regret，选择动作与最优动作的效用差）、高度/体积/力的 MAE。
- **主要结果**: 
  - 在 MiniSlope 中，相比 Local，PileBelief 将五步联合预测误差降低 10.8%，离线动作选择遗憾降低 65.5%（Top-1 准确率达 62.5%）。
  - 相比 History Transformer，单步和五步联合误差分别降低 8.2% 和 3.6%，遗憾降低 29.4%。
  - 在 Newton/MPM 仿真中，相比 Local，高度误差降低 32.3%，铲斗体积和力误差分别降低 6.0% 和 4.0%。
  - 在真实挖掘数据中，相比 Local，铲斗体积误差降低 6.8%，联合误差降低 4.8%。
  - 延迟重访实验表明，即使间隔 20 个动作后再次经过同一区域，持久空间记忆仍能使高度误差降低 20.4%。

### 91. 🔥 [SmoLSTM: A Compact Vision-Language-Action Model with Recurrent Memory that Persists] (SmoLSTM：一种具有持久循环记忆的紧凑型视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.22854` | [点击跳转](https://arxiv.org/abs/2609.22854)

**0. 论文标题**
- **英文标题**: SmoLSTM: A Compact Vision-Language-Action Model with Recurrent Memory that Persists
- **中文标题**: SmoLSTM：一种具有持久循环记忆的紧凑型视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出了一种紧凑型VLA模型SmoLSTM，通过引入贯穿整个任务episode的矩阵记忆LSTM（mLSTM）控制层，将观测和动作统一在一个不重置的因果流中，以O(1)的内存和计算复杂度解决了长程任务中的历史记忆依赖问题。

**1. 整体逻辑**
- **研究任务**: 解决机器人在执行长程操作任务时，因物体遮挡或视觉特征相似（如多个相同的碗）而需要依赖历史episode信息的视觉-语言-动作（VLA）控制任务。
- **研究动机**: 现有的VLA模型通常只根据当前观测预测动作，缺乏历史信息；而常规的增加观测窗口（如滑动窗口）的方法会导致计算和内存成本随窗口长度线性增长，且将窗口大小变成了难以调节的超参数。
- **本质改动**: 抛弃了不断增长的观测窗口或外部记忆库，直接在控制层引入固定大小的矩阵记忆LSTM（mLSTM），将观测token和动作查询（action queries）拼成一个永不重置的因果序列，使循环状态的存储和计算复杂度在episode长度上保持O(1)。
- **技术溯源**: 基于冻结的 SmolVLM (256M) 视觉语言基座、DINOv2-S 视觉编码器、ResNet-18，以及 mLSTM（矩阵记忆长短期记忆网络）和条件流匹配（Conditional Flow Matching）动作头。

**2. 技术拆解**
- **核心方法**: 
  1. **感知前端**：使用冻结的VLM和额外编码器提取多模态token（空间网格、指令、腕部相机、深度图、DINOv2特征、本体感觉）。
  2. **循环控制层**：使用6层mLSTM作为控制层，将217个观测token和10个可学习的动作查询拼接成单一的因果序列，在整个episode中持续更新矩阵记忆状态，不进行重置。
  3. **动作生成**：使用整流流匹配（Rectified-flow-matching）动作头，根据mLSTM输出的动作查询隐藏状态，并行预测包含10步末端执行器位姿增量和夹爪命令的动作块（action chunk）。
- **关键细节**: 
  - **模型规模**：总参数0.32B，可训练参数仅40.4M（12.7%），VLM和DINOv2完全冻结。
  - **输入输出**：每步输入217个token；输出10步的动作chunk。
  - **网络结构**：mLSTM为6层、512维、4个注意力头，维护矩阵记忆 $C_t$ 和归一化器 $n_t$；动作头参数量仅4.87M，推理时通过8步Euler积分生成动作，且每步只运行动作头，不重新进入mLSTM。
  - **训练设置**：单卡RTX Pro 5000 GPU训练30k步，batch按token budget（最多37,500 tokens）组装，保持内存恒定。
- **训练/优化目标**: 
  - **主损失**：流匹配损失（Flow matching loss），预测速度场。
  - **辅助损失**：预测未来5步和10步的DINOv2场景特征变化（权重0.5），逼迫模型推断动作对环境的影响。
  - **正则化机制**：引入15%的观测dropout和10%的模态dropout，强制模型在输入缺失时依赖循环记忆，防止走捷径。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Mem（包含10个需要记忆的任务，如物体运动、序列、关系、遮挡）和标准LIBERO（Spatial, Object, Goal, Long四个套件）。
  - **对比对象（Baseline）**：LIBERO-Mem上的 E.-S.SSM, MemoryVAM, 2AM；标准LIBERO上的 SmolVLA, $\pi_0$, OpenVLA-OFT, OpenVLA, Octo, Diffusion Policy, SlotVLA等。
  - **测试环境**：单模型联合训练所有套件，无大规模机器人数据预训练。
- **评价指标**: 
  - LIBERO-Mem：子目标覆盖率（Coverage / Mean subgoal completion）和完整任务成功率（Full-task success）。
  - 标准LIBERO：各套件及平均任务成功率（Average success rate）。
- **主要结果**: 
  - **LIBERO-Mem**：SmoLSTM (flow) 达到85.1%的子目标覆盖率和77.5%的完整任务成功率，全面超越2AM（63.0%成功率）和MemoryVAM（42.5%成功率）。
  - **标准LIBERO**：单模型联合训练达到79.6%的平均成功率。虽然略低于SmolVLA-0.24B（82.8%），但可训练参数更少（0.04B vs 0.24B），且在长程任务（LIBERO-Long）上比SmolVLA-0.24B高出6.4个百分点，同时远超 $\pi_0$ (71.8%)。
  - **消融实验**：如果每步重置循环状态（N=1），成功率暴跌至7.0%，证明策略强依赖于跨决策的循环上下文；遮挡任务（OO）对重置最敏感。此外，移除腕部相机会导致成功率骤降至12%，表明对第一人称视角的强依赖。

### 92. 🔥 [StateMem: Single-State Residual Memory with Adaptive Inference for Vision-Language-Action Policies] (StateMem：用于视觉-语言-动作策略的单状态残差记忆与自适应推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.22684` | [点击跳转](https://arxiv.org/abs/2609.22684)

**0. 论文标题**
- **英文标题**: StateMem: Single-State Residual Memory with Adaptive Inference for Vision-Language-Action Policies
- **中文标题**: StateMem：用于视觉-语言-动作策略的单状态残差记忆与自适应推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种单状态残差记忆框架，通过预测误差更新单一记忆token来保留历史上下文，并结合自适应前缀路由加速VLA模型的推理。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的历史记忆能力，同时降低推理时的计算冗余。
- **研究动机**: 现有VLA模型多依赖当前观测，缺乏历史记忆；多帧拼接会增加KV cache和计算开销；外部记忆库（如MemoryVLA）需要显式检索，计算复杂且易引入虚假相关。此外，连续的策略查询中视觉信息往往相似，全量刷新VLM前缀（prefix）存在计算冗余。
- **本质改动**: 摒弃多帧拼接和外部记忆库，用一个单状态残差记忆token来压缩和保留历史；利用预测误差不仅来更新这个记忆token，还用来判断是否复用VLM的KV cache（自适应前缀路由）。
- **技术溯源**: 基于 $\pi_{0.5}$ 模型（包含 PaliGemma-2B VLM 和 Gemma-300M 动作专家），借鉴了预测编码（Predictive coding）理论。

**2. 技术拆解**
- **核心方法**: 
  1. **单状态残差记忆**：将视觉感知特征和语言认知特征融合为一个记忆token。用轻量级预测器根据上一时刻记忆预测当前感知特征，将预测误差通过低秩矩阵投影后，以残差形式累加更新记忆。
  2. **自适应前缀路由与快速校正**：计算当前观测与缓存锚点（cache anchor）的预测误差作为路由得分。得分低于阈值时，复用VLM前缀的KV cache；复用期间，通过快速校正适配器根据当前状态与锚点的差异，对时间步和动作token的嵌入进行补偿修正。
  3. **免训练在线阈值控制**：利用路由得分的指数移动平均（EMA）和绝对偏差统计量，结合周期性的动作差异审计，在线动态调整路由阈值上限。
- **关键细节**: 
  - **输入**：3张 224×224 的RGB图像、语言指令、机器人本体感知状态。
  - **输出**：32维连续动作，动作块（action chunk）大小为10。
  - **模型结构**：基于 $\pi_{0.5}$，VLM为 PaliGemma-2B，动作专家为 Gemma-300M。推理时动作专家使用 Euler flow-matching 采样器，10步去噪。
- **训练/优化目标**: 
  - **记忆更新阶段**：策略损失（动作预测损失） + 辅助的感知预测损失（归一化的预测误差MSE）。
  - **快速校正阶段**：通过蒸馏全量刷新路径的预测（梯度截断）来训练，包含局部和全局动作一致性损失、速度一致性损失以及校正幅度的正则化。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（通用操作），RoboMemArena（记忆依赖操作），以及6个真实世界操作任务（4个通用，2个记忆依赖）。
  - **对比对象**：OpenVLA, $\pi_0$, $\pi_{0.5}$, MemoryVLA, CronusVLA, MemER, PrediMem, Diffusion Policy, Octo 等。
- **评价指标**: 
  - LIBERO和真实世界：平均成功率（SR）。
  - RoboMemArena：任务成功率（TSR）和累积成功率（CSR）。
  - 推理效率：VLM前缀刷新率、延迟（Latency）、吞吐量（Throughput）。
- **主要结果**: 
  - **LIBERO**：平均成功率 97.6%（比 $\pi_{0.5}$ 的 96.9% 高，比 OpenVLA 高 21.1%）；VLM前缀刷新率降至 79.75%（相对全量刷新降低了 20.25%）。
  - **RoboMemArena**：在单VLA方法中表现最好，平均 TSR 26.8%，CSR 44.4%（比 $\pi_{0.5}$ 分别高 5.3% 和 5.7%，比 MemoryVLA 分别高 11.8% 和 9.1%）。
  - **真实世界**：6个任务平均成功率 65%（比 $\pi_{0.5}$ 的 44% 高 21%，比 MemoryVLA 高 12%）。在记忆依赖任务上提升显著（Cover & Uncover 提升 60%，Pick & Count 提升 25%）。

**1. 整体逻辑**
- **研究任务**: [领域与类型：具身智能/机器人学习，方法创新。] 论文要解决的任务是机器人操作（Robot Manipulation），即利用人类视频和机器人轨迹数据，训练能够泛化到不同任务和新环境的机器人控制策略。
- **研究动机**: 现有的世界-动作模型（WAMs）通常用RGB或视觉隐变量来表示“世界”，这种表征侧重外观和场景演变，没有显式指出与任务相关的物体和交互区域。这导致人类视频和机器人数据在语义上难以对齐，直接引入人类视频甚至会因外观和具身差异（embodiment gap）引入噪声，反而降低机器人控制性能。
- **本质改动**: 将“可供性”（具体为标量可供性和可供性热力图）作为未来世界预测的显式目标，以此作为跨具身（人-机器人）的共享交互接口，替代单纯依赖RGB外观的世界预测。
- **技术溯源**: 基于预训练的视频扩散Transformer（具体为Wan2.2-TI2V-5B），采用Flow Matching（流匹配）生成框架。

**2. 技术拆解**
- **核心方法**: 
  1. **双专家架构**：包含预测未来世界的World Expert和生成连续动作的Action Expert。
  2. **可供性感知的世界表征**：World Expert联合预测三个未来世界流：RGB、标量可供性（Scalar Affordance，指示交互区域）和可供性热力图（Affordance Heatmap，将交互区域与视觉上下文绑定）。
  3. **掩码联合自注意力**：Action Expert通过逐层掩码注意力读取World Expert的RGB和标量可供性特征。掩码机制阻止了动作特征反向影响世界预测，并切断了可供性热力图到动作专家的特征流，防止动作生成走“RGB外观捷径”。
  4. **异构联合训练**：人类视频仅监督World Expert（预测世界和可供性），机器人轨迹同时监督两个专家。两者在“交互空间”而非“动作空间”对齐，无需人类动作标签或动作重定向。
- **关键细节**: 
  - **输入输出**：输入历史RGB帧、语言指令和当前本体感知状态；输出未来RGB、两种可供性表征以及12步×7维的连续机器人动作。
  - **模型规模**：World Expert 30层，隐藏维度3072；Action Expert 30层，隐藏维度1024，FFN维度4096；联合注意力24头×128维。
  - **数据与硬件**：训练片段为17帧（5帧历史+12帧未来），分辨率256×320，10 FPS。使用64张NVIDIA H200 GPU进行训练。
- **训练/优化目标**: 统一的流匹配（Flow Matching）目标。包括RGB、标量可供性、热力图的潜在速度MSE损失，以及标量可供性的编解码重建帧级MSE损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboCasa（家庭环境特定任务适应），CALVIN ABC→D（跨环境泛化），真实世界操作（5个基础任务，3个复杂任务）。
  - **对比对象（Baseline）**：GR00T-N1, UVA, UWM, $\pi_0$, Cosmos Policy, SuSIE, GR-1, OpenVLA, CLOVER, UniVLA, Seer, VPP等。
- **评价指标**: 
  - **RoboCasa**：平均任务成功率（Average SR %）。
  - **CALVIN**：完成1至5个连续任务的成功率，以及平均完成序列长度（Avg. Len.）。
  - **真实世界**：各任务成功率（%）。
- **主要结果**: 
  - **仿真基准**：在RoboCasa上平均成功率达到69.4%，超越Cosmos Policy（67.1%）和$\pi_0$（62.5%）；在CALVIN ABC→D上平均序列长度达到4.22，超越VPP（4.01）。
  - **消融实验**：证明了Affordance是核心桥梁。无Affordance时，加入人类视频反而使RoboCasa成功率从57.3%降至55.1%；有Affordance时，加入人类视频使成功率从63.7%大幅提升至69.4%。此外，性能随人类数据规模单调提升。
  - **真实世界**：在相同微调数据量（每任务50条轨迹）下，宏观平均成功率从Cosmos Policy的42.7%大幅提升至74.7%，复杂任务（如关抽屉、拿水果、插花）成功率均有显著增长。

### 94. 🔥 [MaskVLA: Visual Masking Against Trajectory Overfitting of Vision-Language-Action Model] (MaskVLA：通过视觉掩码对抗视觉-语言-动作模型的轨迹过拟合)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.23565` | [点击跳转](https://arxiv.org/abs/2609.23565)

**0. 论文标题**
- **英文标题**: MaskVLA: Visual Masking Against Trajectory Overfitting of Vision-Language-Action Model
- **中文标题**: MaskVLA：通过视觉掩码对抗视觉-语言-动作模型的轨迹过拟合
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种在微调阶段随机掩码主相机输入的VLA训练策略，迫使模型利用腕部相机信息，解决多视角VLA的轨迹过拟合问题，显著提升仿真和真机操作成功率。

**1. 整体逻辑**
- **研究任务**: [具身智能/机器人控制领域的方法创新] 提升多视角视觉-语言-动作（VLA）模型在机器人复杂操作任务中的泛化能力，解决其在有限数据集微调时出现的严重轨迹过拟合（trajectory memorization）问题。
- **研究动机**: 现有VLA（如OpenVLA-OFT）在单视角预训练后直接微调多视角任务时存在严重的域偏移。Grad-CAM分析显示，模型注意力过度集中在主相机（primary camera）的局部纹理上，忽略了腕部相机（wrist camera）等辅助视角。这导致模型死记硬背训练轨迹，在分布外场景（如光照变化、主视角被遮挡）下表现极其脆弱，且常规的数据增强无法解决此问题。
- **本质改动**: 在微调阶段对主相机的输入图像进行随机掩码（Random Masking），强迫模型在训练时依赖腕部相机等辅助视角，从而学习更平衡、鲁棒的多视角视觉特征，推理时恢复正常输入。
- **技术溯源**: 基于 OpenVLA-OFT 框架（单臂转双臂多视角微调），并借鉴了 VLM/LLM 中的掩码自监督机制（如 MAE、BERT、MaskGit）。

**2. 技术拆解**
- **核心方法**: MaskVLA（Random Masking on Primary Camera View）。在训练时，以一定概率将主相机图像完全置零（mask），与左右腕部相机图像和关节本体感受一起输入视觉编码器；推理时关闭掩码，输入完整多视角图像。
- **关键细节**: 
  - **输入**：本体感受（14维关节角）+ 主相机RGB + 左右腕部相机RGB。
  - **掩码操作**：$I_p^{t_i, input} = (1-M_i) \odot I_p^{t_i}$，其中 $M_i \sim Bernoulli(\rho)$，$\rho$ 为掩码概率。
  - **最优超参**：消融实验表明，主相机10%概率完全掩码（MaskVLA-main-10%）效果最佳。
  - **模型结构**：基于OpenVLA-OFT，使用并行解码、L1回归预测连续动作，并用FiLM模块处理多视角视觉输入。
- **训练/优化目标**: 基于 OpenVLA-OFT 的 L1 回归损失（连续动作预测），结合掩码策略进行多视角特征融合与策略学习。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RoboTwin 2.0 基准，ALOHA-AgileX 双臂系统。4个任务（Adjust bottle, Open laptop, Put object cabinet, Stack bowls three），分 Easy 和 Hard 模式。每任务50条 demo 微调。
  - **真机**：Airbot Mobile ALOHA 双臂平台。4个任务（Feed carrot, Adjust cups, Place orange, Stack bowls）。每任务50条 demo，20次评估。
  - **Baseline**：ACT, DP, DP3, RDT, $\pi_0$, OpenVLA-OFT。
- **评价指标**: 任务成功率（Success Rate %）。
- **主要结果**: 
  - **仿真**：在 RoboTwin 2.0 上，MaskVLA 平均成功率比 $\pi_0$ 提升 23.2%，比 OpenVLA-OFT 提升 16.8%。在 Hard 模式下比 OpenVLA-OFT 高 20.0%。对位置泛化要求高的 Stack bowls three 任务提升最显著（比 OpenVLA-OFT 高 60.0%）。
  - **真机**：在4个任务上均优于 OpenVLA-OFT，如 Feed carrot 和 Place orange 达到 85.0%，Adjust cups 达到 70.0%，有效缓解了长视野任务中的过拟合问题，证明了多视角特征平衡学习的实际收益。

### 95. 🔥 [StrataVLA: Hierarchical and Efficient 3D Geometric Grounding for Vision-Language-Action Models] (StrataVLA：面向视觉-语言-动作模型的分层且高效的3D几何接地)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.26071` | [点击跳转](https://arxiv.org/abs/2609.26071)

**0. 论文标题**
- **英文标题**: StrataVLA: Hierarchical and Efficient 3D Geometric Grounding for Vision-Language-Action Models
- **中文标题**: StrataVLA：面向视觉-语言-动作模型的分层且高效的3D几何接地
- **研究机构**: 原文未提及
- **一句话总结**: 提出 StrataVLA 框架，通过在 VLA 主干的多个网络层稀疏插入几何适配器，并结合任务感知路由与特征缓存，以极低的推理开销为机器人操作模型注入持续的 3D 几何感知能力。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的 3D 空间感知与几何理解能力。
- **研究动机**: 现有 VLA 模型主要依赖 2D 图像-文本预训练，缺乏可靠的 3D 空间感知，在遮挡或精细操作时极易失败。现有引入 3D 信息的方法（如显式点云输入、训练时蒸馏、仅在输入层融合或仅注入动作专家）要么计算成本高，要么破坏了预训练语义先验，要么导致 VLA 主干深层缺乏持续的几何信息访问能力。
- **本质改动**: 摒弃单点注入，在 VLM 主干的浅、中、深多个特定层稀疏插入独立的几何适配器（Geometry Adapters），通过交叉注意力按需从共享的 3D 几何特征中检索信息；同时引入任务感知路由和 LRU 缓存机制大幅降低推理时的 3D 模型调用开销。
- **技术溯源**: 基于 $\pi_0$（PaliGemma 视觉语言骨干 + Flow-matching 动作专家）和 OpenVLA-OFT（Prismatic VLM + Llama-2 7B）；3D 几何特征提取依赖冻结的 VGGT（Visual Geometry Grounded Transformer）基础模型。

**2. 技术拆解**
- **核心方法**: 
  1. **分层几何注入 (Hierarchical Geometric Injection)**：在 VLM 主干的特定层（如 $\pi_0$ 的第 2, 8, 13 层）插入 Geometry Adapter (GA)。GA 以当前层的视觉 token 为 Query，以 VGGT 提取的共享 3D 几何 token 为 Key/Value 进行多头交叉注意力计算，并通过零初始化的残差连接注入，避免破坏预训练权重。
  2. **任务感知路由与特征复用 (Task-Aware Routing and Reuse)**：设计双模态路由头（文本和视觉），根据指令语义和场景复杂度（遮挡、拥挤）预测几何注入强度；结合基于感知哈希的 LRU 缓存，利用固定相机场景的时间冗余性复用 3D 特征，跳过不必要的 VGGT 推理。
- **关键细节**: 
  - **输入输出**：输入为 RGB 图像、语言指令和机器人本体状态，输出为动作序列（action chunk）。
  - **几何特征提取**：将 RGB 图像输入冻结的 VGGT，提取 patch 特征并进行 stride-2 下采样，减少 73.6% 的序列长度，保留空间布局。
  - **GA 结构**：包含 LayerNorm、交叉注意力、投影层和可学习的层特定标量。初始时上投影权重和偏置为零，确保初始输出为零，让几何信息在训练中逐渐涌现。
  - **路由与缓存**：推理时若路由系数低于 0.10 则直接 bypass 几何分支。LRU 缓存容量为 8，利用 8x8 差分感知哈希作为 key。
  - **参数量**：GA 和路由头仅增加约 15M（$\pi_0$）或 22M（OpenVLA-OFT）参数，占基础策略不到 0.5%。
- **训练/优化目标**: 
  - **两阶段优化**：Stage 1 冻结主干，仅训练 GA 和路由头（强制路由系数为 1 进行 warm-up）；Stage 2 联合微调所有组件（VGGT 保持冻结）。
  - **损失函数**：主损失为动作生成的 Flow-matching 回归损失（$\pi_0$）或 $L_1$ 回归损失（OpenVLA-OFT）。辅以路由头的 BCE 损失，利用指令先验和离线任务增益估计作为弱标签。总损失为 $\mathcal{L} = \mathcal{L}_{act} + 0.05 \mathcal{L}_{gate}$。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 LIBERO（Spatial, Object, Goal, Long 四个子集）和 SimplerEnv（Google Robot 任务）；真实世界使用自研的 Kitchen 和 Room 操作套件（包含 Move, Grab, Pick, Long, Spatial 五类任务，FrankaResearch 3 机器人）。
  - **对比对象 (baseline)**：Octo, OpenVLA, $\pi_0$, $\pi_{0.5}$, SpatialVLA, GeoVLA, ForeAct, GeoPredict, RT-1-X, RT-2-X, RoboVLM, FALCON 等。
- **评价指标**: 任务成功率 (Success Rate, SR)，推理延迟 (Latency)，LRU 缓存命中率。
- **主要结果**: 
  - **仿真环境**：在 LIBERO 四个子集上平均成功率达到 98.53%（其中 Spatial 达到 100%），超越 $\pi_0$ 和 $\pi_{0.5}$ 等强 baseline。在 SimplerEnv Google Robot 任务上也取得 SOTA（PCC 91.7%, MN 82.0%, O/C 56.5%）。
  - **真实世界**：在 Kitchen 和 Room 场景的复杂任务（如 clutter 下的抓取、空间关系推理）中，StrataVLA 成功率显著高于 $\pi_{0.5}$（例如 Kitchen Move 80% vs 65%，Room Spatial 50% vs 15%）。
  - **效率与开销**：3 个稀疏 GA 仅增加 3.8% 的延迟（4.8ms）。结合路由和 LRU 缓存，VGGT 的调用频率平均降低 80.8%（最高 88%），摊销后的端到端延迟开销仅为 23.0%（153.8ms vs 125.0ms），且缓存复用对成功率影响极小（平均仅提升 0.04%）。
  - **泛化性**：在 OpenVLA-OFT 骨干上同样有效，平均成功率提升 2.55%。

### 96. 🔥 [Sample, Simulate, Select: Physics-in-the-Loop Text-to-Motion for Humanoids Without Training] (采样、仿真、选择：无需训练的物理在环人形机器人文本生成运动)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.26420` | [点击跳转](https://arxiv.org/abs/2609.26420)

**0. 论文标题**
- **英文标题**: Sample, Simulate, Select: Physics-in-the-Loop Text-to-Motion for Humanoids Without Training
- **中文标题**: 采样、仿真、选择：无需训练的物理在环人形机器人文本生成运动
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需训练的“采样-仿真-选择”（S3）框架，通过将部署控制器作为物理验证器来筛选冻结文本模型生成的多个候选动作，显著提升了人形机器人文本到运动生成的物理可行性和实机执行成功率。

**1. 整体逻辑**
- **研究任务**: 根据文本提示生成人形机器人可执行的全身运动（Text-to-humanoid motion generation）。
- **研究动机**: 现有的文本到运动模型不懂机器人动力学，而跟踪控制器无法修改不可行的参考动作。近期的语言到人形系统试图通过训练来弥补这一鸿沟，但缺乏一个“不训练直接组合现有公开组件”的基线，导致无法准确衡量训练到底带来了多少实质性提升。
- **本质改动**: 不训练任何模型，而是把部署控制器（物理仿真）直接作为验证器放入循环中。对每个提示词采样多个候选动作，在物理引擎中跑一遍，直接挑执行得最好的那个。
- **技术溯源**: MoMask（文本到运动生成模型）、SONIC（预训练的全身跟踪策略）、MuJoCo（物理仿真环境）、Unitree G1（人形机器人硬件）、HumanML3D（运动数据集与评估基准）。

**2. 技术拆解**
- **核心方法**: Sample-Simulate-Select (S3) 管道。1) Sample：从冻结的MoMask模型中为每个提示词采样N个候选动作；2) Retarget：使用方向匹配的逆运动学（IK）将人类动作重定向到机器人；3) Simulate：使用预训练的SONIC策略在MuJoCo中进行全刚体动力学仿真；4) Select：根据硬件安全门控级别和关节跟踪误差，选出执行最好的候选动作。
- **关键细节**: 输入为文本，输出为机器人关节轨迹。默认采样数N=8。重定向时只匹配肢体方向，不导入人类肢体长度。仿真采用SONIC的MuJoCo模型（50Hz控制，200Hz物理）。选择标准按字典序比较：先比门控级别（PASS > CAUTION > REJECT），再比平均关节跟踪误差。
- **训练/优化目标**: 全流程零训练（Nothing is trained）。核心机制是利用确定性物理仿真作为验证器，通过Best-of-N策略直接逼近并达到any-of-N的理论上限。

**3. 实验结果**
- **实验设置**: 数据集为HumanML3D测试集（包含200个分层提示词和完整的4184个提示词）。对比基线包括：Single（单样本不选择）、Kinematic best-of-N（基于运动学特征的风险评分）、Oracle（理论上限）、TEXEDO（在机器人数据上训练的生成器）。实机测试环境为真实的Unitree G1机器人。
- **评价指标**: 直立执行率（Upright execution rate，基于骨盆高度和倾斜度定义的跌倒标准）、硬件门控通过率（Hardware-gate passes）、平均关节跟踪误差（Mean joint tracking error）、语义保真度（Matching score, R-precision）。
- **主要结果**: 
  1. 在200个分层提示词上，S3将直立执行率从单样本的83.5%提升至89.5%（达到any-of-8上限），硬件门控通过数从33提升至85；在完整测试集（4184个提示词）上从80.5%提升至89.5%。
  2. 预测跌倒准确率很高（AUROC 0.90）的运动学验证器只能将通过率提升至85.0%，证明在排序同一提示词的候选时，物理仿真显著优于运动学特征。
  3. 选择机制无法修复“降低骨盆”的动作（如深蹲/弯腰），这类动作需要像TEXEDO那样在机器人数据上训练生成器才能解决。
  4. 语义保真度的损失主要发生在动作重定向阶段，而非选择阶段；真实动捕数据经过相同管道也会掉到相同的分数下限。
  5. 在真实G1上执行了177个通过门控筛选的片段，100%成功站立完成，且硬件跟踪误差与仿真结果高度一致（相关系数 r=0.94）。

### 97. 🔥 [RouteRLT: Learning When and Which RL Specialist Should Control a Vision-Language-Action Policy] (RouteRLT：学习何时以及由哪个强化学习专家来控制视觉-语言-动作策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.26467` | [点击跳转](https://arxiv.org/abs/2609.26467)

**0. 论文标题**
- **英文标题**: RouteRLT: Learning When and Which RL Specialist Should Control a Vision-Language-Action Policy
- **中文标题**: RouteRLT：学习何时以及由哪个强化学习专家来控制视觉-语言-动作策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种名为 RouteRLT 的路由框架，通过读取冻结 VLA 的内部紧凑特征来自动决定何时及切换至哪个针对高精度阶段训练的 RL 专家策略，在无需特权信号的情况下实现了通用 VLA 与多个 RL 专家的无缝协同。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在长视野、接触丰富的机器人操作任务（如线缆插入、连接器装配）中，高精度关键阶段容易失败的问题，实现通用 VLA 与多个特定阶段强化学习（RL）专家的自动协同控制。
- **研究动机**: VLA 模型通用性强但缺乏局部高精度；用 RL 微调 VLA 容易破坏其长视野通用行为。现有方法通常只针对单一阶段微调，且依赖人类操作员或仿真中的特权信号（privileged signal）来决定何时切换控制器，在真实部署时无法自动判断切换时机。
- **本质改动**: 将控制权的切换从“依赖外部特权信号或人工设定”改为“基于冻结 VLA 内部紧凑潜在特征（latent）的自动学习决策”，并解决了分块动作（chunked actions）执行过程中的中途切换与状态一致性问题。
- **技术溯源**: 基于 SmolVLA（作为冻结的通用 VLA 基座）和 RLT（用于提取紧凑特征和训练 RL 专家的基础工作）。

**2. 技术拆解**
- **核心方法**: 提出 RouteRLT 路由框架，包含三个核心组件：1) **阶段选择器（Phase selector）**：基于 VLA 的紧凑特征预测当前应激活的控制器（VLA 或某个 RL 专家）；2) **稳定器（Stabilizer）**：通过非对称阈值和驻留时间抑制控制器的频繁瞬态切换；3) **动作边界管理器（Action-boundary manager）**：在控制器切换时立即丢弃未执行的动作块后缀，实现跨 chunk 的无缝交接。
- **关键细节**: 
  - **特征提取**：在冻结的 SmolVLA 序列末尾添加可学习 token，经自注意力后提取紧凑状态 $z_t$，作为路由和 RL 专家的统一输入。
  - **RL 专家**：轻量级 Actor-Critic 网络，输入 $z_t$、本体感觉和 VLA 的参考动作，输出动作块。
  - **路由网络**：使用因果窗口（$W=2$）内的 $z_t$ 序列，通过共享权重的线性层输出控制器概率。每 $\Delta_r$ 步查询一次，独立于控制器的执行视野。
- **训练/优化目标**: 
  - **特征提取**：并行解码器重构 VLA 前缀 token 的自监督重建损失。
  - **RL 专家**：Actor 最大化 Q 值，同时最小化与 VLA 参考动作的 L2 距离以及动作间的时间平滑惩罚（$\mathcal{L}_{\Delta}$）；Critic 使用 TD 目标。
  - **路由选择器**：类别平衡的二分类/多分类交叉熵损失，并在验证集上通过网格搜索稳定器的超参数（进入/退出阈值和驻留步数）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：LIBERO Object 数据集的多物体抓取放置任务。对比基线：SmolVLA@5, SmolVLA@10, Oracle self-route, Oracle-routed RLT（使用特权阶段边界）。
  - **真机**：Trossen 机械臂平台的线缆抓取与 1mm 间隙端口插入任务。包含抓取和插入两个 RL 专家。对比基线：SmolVLA, Oracle-routed RLT（使用基于末端执行器高度的脚本化规则）。
- **评价指标**: 仿真中评估全任务成功率（Full-task success）、抓取成功率（Pickup success）和每千步成功数（Successes/1k steps）；真机中评估到达夹具成功率（Pickup-to-fixture success）和最终插入成功率（Final-insertion success）。
- **主要结果**: 
  - **仿真中**：RouteRLT 全任务成功率达 92.22%，显著优于 SmolVLA@10 的 85.00%，且匹配甚至略优于使用特权边界的 Oracle-routed RLT (91.11%)，同时每千步成功数相对 SmolVLA@10 提升 14.3%。
  - **真机中**：SmolVLA 最终插入成功率仅为 6.7%，RouteRLT 将其大幅提升至 35.0%，与使用特权高度规则的 Oracle-routed RLT (33.3%) 表现相当，验证了 learned routing 在真实多阶段高精度任务中无需人工干预即可达到专家级协同效果。

### 98. 🔥 [Imperfection for Precision: Upcycling Imperfect Data for High-Precision Robotic Manipulation] (以不完美成就精准：升级不完美数据用于高精度机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.26672` | [点击跳转](https://arxiv.org/abs/2609.26672)

**0. 论文标题**
- **英文标题**: Imperfection for Precision: Upcycling Imperfect Data for High-Precision Robotic Manipulation
- **中文标题**: 以不完美成就精准：升级不完美数据用于高精度机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出 $\epsilon$4P 方法，通过在 flow-matching 轨迹的不同时间步精准路由两类不完美数据，在不增加昂贵的高质量遥操作数据的前提下，显著提升 VLA 模型在高精度机器人操作中的成功率。

**1. 整体逻辑**
- **研究任务**: 训练视觉-语言-动作（VLA）模型以执行高精度的机器人操作任务（如亚毫米级公差的插接任务）。
- **研究动机**: 高精度操作极度依赖昂贵且耗时的任务特定高质量数据（如遥操作）。现有方法直接混合不完美数据（如低精度数据或非目标任务数据）会引入冲突的监督信号，反而导致高精度任务性能严重下降。
- **本质改动**: 摒弃全局混合或简单的损失权重调整，将不完美数据的训练贡献限制在 flow-matching 轨迹（flow time）的特定“准入区间”内，让不同缺陷的数据在各自能提供有效监督的噪声阶段发挥作用。
- **技术溯源**: 基于 Flow-matching 策略模型（如预训练的 $\pi_{0.5}$）和 VLA 架构。

**2. 技术拆解**
- **核心方法**: 提出 $\epsilon$4P 方法，通过离线诊断计算两个准入边界，将两类不完美数据分别路由到 flow-matching 轨迹的高噪声区间和低噪声区间进行训练。
- **关键细节**: 
  - 两类不完美数据：1) 精度不匹配的目标任务数据（$\mathcal{D}_{pm}$，如 UMI 收集的低精度数据）；2) 任务不匹配的高精度数据（$\mathcal{D}_{tm}$，如其他任务的遥操作数据）。
  - 准入边界计算：对于 $\mathcal{D}_{pm}$，训练一个 flow-time 条件分类器，找到其加噪动作与高精度数据无法区分的临界点 $t_{pm}$，准入区间设为 $[t_{pm}, 1]$（高噪声区），以保留高层任务上下文；对于 $\mathcal{D}_{tm}$，通过分析策略对加噪动作和任务上下文的依赖度随 flow time 的变化，找到动作依赖主导的临界点 $t_{tm}$，准入区间设为 $[0, t_{tm}]$（低噪声区），以传递底层动作精度。
  - 完美数据 $\mathcal{D}_{pt}$ 仍在 $[0, 1]$ 全区间训练。
- **训练/优化目标**: 保持标准的 flow-matching 目标函数和模型架构不变，仅改变训练时 flow time $t$ 的采样分布（即基于数据源的 flow-time 采样）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：在真实机器人（Rainbow Robotics RB-Y1）上评估三个任务：ATX 24针连接器插入（亚毫米级）、两阶段线缆插接（亚毫米级）、螺栓螺母分拣（粗粒度）。使用 UMI 收集低精度数据，遥操作收集高精度数据。
  - 对比对象（baseline）：仅使用完美数据、原生混合训练（Native co-training，全区间混合不完美数据）、全局损失重加权（Global loss reweighting）。
- **评价指标**: 真实机器人实验的二元成功率（每个任务 60 次试验）。
- **主要结果**: 
  - 原生混合训练下，不完美数据（尤其是低精度数据）会严重损害高精度任务性能（平均下降 34.2%）。
  - $\epsilon$4P 有效将不完美数据转化为性能提升，相比仅使用完美数据，成功率最高提升 31.7 个百分点（如 ATX 任务从 48.3% 提升至 80.0%）。
  - $\epsilon$4P 能够替代等量的额外高质量数据，平均性能下降仅为 4.2 个百分点。
  - 相比全局损失重加权，$\epsilon$4P 通过控制数据贡献的“位置”而非“数量”，取得了显著更好的效果。

### 99. 🔥 [RoboTwin-Phys: Do WAMs and VLAs Understand the Physical World?] (RoboTwin-Phys：WAMs和VLAs理解物理世界吗？)
- **研究机构**: `原文未提及`

**0. 论文标题**
- **英文标题**: RoboTwin-Phys: Do WAMs and VLAs Understand the Physical World?
- **中文标题**: RoboTwin-Phys：WAMs和VLAs理解物理世界吗？
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个关注物理条件多样性（如质量、摩擦、关节阻尼等）的机器人操作基准测试及配套数据集，揭示了当前主流WAMs和VLAs模型在物理参数变化下存在严重的鲁棒性缺陷。

**1. 整体逻辑**
- **研究任务**: 构建一个评估机器人操作策略在物理条件（如质量、摩擦、质心等）变化下鲁棒性的基准测试与数据集。
- **研究动机**: 现有的机器人操作基准测试虽然丰富了视觉外观和场景布局的多样性，但底层物理参数通常保持固定。这导致模型在真实世界中面对物理属性（如物体变重、摩擦力改变、机械磨损导致阻尼变化）变化时的鲁棒性未被充分测试和评估。
- **本质改动**: 将“物理条件多样性”作为一个显式的评估维度引入机器人操作基准测试，在原有视觉和布局随机化的基础上，连续采样13种物理属性，并配套提供带有物理参数真值标注的大规模专家演示数据集。
- **技术溯源**: 基于 RoboTwin-2.0 双臂仿真平台构建。

**2. 技术拆解**
- **核心方法**: 设计并实现了RoboTwin-Phys基准测试。在每个episode初始化时，从物理合理的范围内连续采样13种物理属性。引入任务感知的物理有效性检查（针对9个物理敏感任务缩小特定参数范围，避免产生违背几何常理的参数组合）和专家规划器可行性验证，确保采样的物理条件在物理和任务上都是可实现的，排除无解的“死局”。
- **关键细节**: 
  - 13种物理属性包括：物体质量、质心偏移、几何缩放、桌面倾斜/高度、外力、相机距离/角度、摩擦系数、恢复系数、物体关节阻尼、机械臂/夹爪关节阻尼等。
  - 发布了RoboTwin-Phys Training Set v1，包含超过5000个专家演示，每个样本附带13维物理参数的真值标注（JSON格式元数据），数据格式兼容官方RoboTwin（HDF5轨迹、MP4视频）。
- **训练/优化目标**: 非学习类工作。核心机制是物理条件的连续采样与可行性验证。数据集的设计目标是将物理条件作为显式的监督信号，支持下游的物理属性估计、条件感知表示学习和物理条件策略训练。

**3. 实验结果**
- **实验设置**: 
  - 测试环境：RoboTwin-Phys 基准测试（包含50个双臂操作任务）。
  - 对比对象：5个代表性模型，包括3个WAMs（Fast-WAM, Motus, FACT）和2个VLAs（π0.5, Galaxea-VLA）。
  - 评估协议：Clean（无随机化）、Official Random（仅视觉和布局随机化）、Physical Random（视觉/布局随机化 + 13种物理属性随机化）。
- **评价指标**: 任务成功率（Success rates, %）。
- **主要结果**: 
  - 在Physical Random设置下，所有5个模型的成功率均出现断崖式下降（从Clean/Official Random的76%~93%降至31.60%~44.24%）。
  - 相比之下，从Clean到Official Random的性能下降很小（0.10~5.98个点），证明视觉/布局鲁棒性不能代表物理鲁棒性。
  - 任务级分析显示，物理条件变化对依赖接触动力学、物体稳定性、质量分布或关节运动的任务（如beat_block_hammer, pick_diverse_bottles）影响尤为严重，表明该基准揭示了结构化的失败模式，而非随机失效。

- **研究任务**: 评估具身世界模型（Embodied World Models）在预测多视角（头部和双腕部）机器人操作视频时的质量与多视角一致性。
- **研究动机**: 现有的评估方法通常独立评估各个视角的视频质量，但单视角看起来合理（如头部视角）不代表多视角在物理和任务逻辑上是一致的（例如头部视角看着合理，但腕部视角可能显示抓取已滑脱）。缺乏一种能将多视角作为一个整体事件来评估其一致性和任务对齐度的方法。
- **本质改动**: 将同步的三视角视频视为一个整体预测，不仅评估单视角的视觉质量，更核心的是引入跨视角一致性检查，评估不同视角是否描述了同一个兼容的机器人和物体状态，并与具体任务对齐。
- **技术溯源**: 基于 RoboTwin 2.0 数据集构建；评估方法借鉴了现有的具身世界模型评估（如 WorldModelBench, EWMBench）和多视角预测工作；使用了视觉语言模型（VLM）、视觉问答（VQA）以及冻结的视频编码器（如 JEPA）等工具进行特征提取和一致性判断。

**2. 技术拆解**
- **核心方法**: 提出 TriWorldBench 评估协议。设计了19个评估指标，分为6个维度。通过参考轨迹推导动作阶段（如空闲、接近、抓取等）提供时间上下文，结合基于参考真值的比较和针对生成视频自身的判断，全面评估三视角的一致性、任务对齐度、物理/3D连贯性、运动质量、时间一致性和视觉质量。
- **关键细节**: 
  - **数据规模**：测试集包含500个episode，涵盖50个双臂操作任务（如抓取放置、堆叠、倒水、工具使用等），另有100个episode的验证集。包含干净和域随机化背景条件。
  - **输入输出**：输入为3张同步初始帧、自然语言指令和动作序列；输出为同步的头部视频和左右腕部视频。
  - **动作阶段划分**：基于夹爪开合和末端执行器位移，将参考轨迹分割为7个粗粒度阶段（idle, approach, grasp, hold, manipulation, release, completion），用于提供时间上下文和预期运动模式。
  - **指标设计**：针对相机特性分配指标（如头部看全局任务，腕部看局部接触）；使用VLM进行三种不同严格程度的跨视角一致性检查（容忍遮挡、强制双视角验证、基于样例校准）；最终将6个维度的得分聚合为 TWB-Score。
- **训练/优化目标**: 本文是基准测试（Benchmark）/评估系统类工作，不涉及模型训练。核心机制是设计多维度的评估指标体系（19个指标）和基于参考轨迹推导动作阶段的评估协议，以量化世界模型预测的合理性。

**3. 实验结果**
- **实验设置**: 测试集使用基于 RoboTwin 2.0 构建的 500 个双臂操作任务 episode。原文未提及具体的对比基线模型（baseline）。
- **评价指标**: 采用 19 个指标，分为三视角一致性（如 PSNR, SSIM, VLM/VQA 一致性）、任务对齐（如 Instruction Following, Semantic Alignment, JEPA Similarity）、物理和3D连贯性、运动质量、时间一致性和视觉质量。最终汇总为 TWB-Score。
- **主要结果**: 原文未提及具体的实验数值结果（因提供的文本未包含实验结果章节）。原文指出，该评估框架能够有效区分视觉外观差、任务不匹配和跨视角冲突，支持对三视角预测的失败原因进行针对性诊断，将世界模型的评估从单视角视觉质量扩展到了多视角事件一致性。

### 101. 🔥 [GDLAM: Group-Disentangled Latent Action Model for Highly Disentangled Embodied Pretraining] (GDLAM：用于高度解耦具身预训练的分组解耦潜动作模型)
- **研究机构**: `原文未提及`

**0. 论文标题**
- **英文标题**: GDLAM: Group-Disentangled Latent Action Model for Highly Disentangled Embodied Pretraining
- **中文标题**: GDLAM：用于高度解耦具身预训练的分组解耦潜动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种分组解耦的潜动作模型（GDLAM），通过独立的变分瓶颈和空间门控路由将隐动作因式分解为多个因果独立的组，在不损失动作信息的前提下大幅提升了下游世界模型和VLA策略的可控性与泛化能力。

**1. 整体逻辑**
- **研究任务**: 从无动作标签的视频中学习潜动作表征（Latent Action Models, LAMs），用于具身智能的预训练（下游用于世界模型和VLA策略）。
- **研究动机**: 现有 LAMs 将相机运动、物体动态、交互事件等异质视觉变化折叠到单一隐向量中，导致表征纠缠。这种纠缠使得下游模型无法显式操控单一因素，降低了世界模型的可控性以及 VLA 策略的泛化与组合能力。
- **本质改动**: 摒弃单一隐向量设计，将潜动作代码在结构上因式分解为 $N$ 个独立的组，并通过信息几何约束强制各组在因果上相互独立（干预一组不影响其他组），而非仅仅在统计上去相关。
- **技术溯源**: 基于冻结的视觉基础模型（DINOv2）作为 Tokenizer，结合了 VAE 的变分瓶颈机制、DiT（Diffusion Transformer）架构以及信息几何中的解耦表征学习思想。

**2. 技术拆解**
- **核心方法**: 提出 GDLAM 架构，包含分组动作编码器（独立变分瓶颈）、空间门控路由预测器（零初始化空间门），以及四种信息几何优化目标（互斥性、组稀疏性、门稀疏性、静态-动态正交性）。
- **关键细节**: 
  - **输入输出**：输入连续两帧图像，输出 $N$ 个潜动作组（默认 $N=4$，每组维度 $d=32$）及预测的未来帧特征。
  - **模型结构**：冻结的 DINOv2 ViT-Large 提取特征；轻量级 Delta Encoder 融合特征；6层 Grouped Encoder 提取潜动作；12层 Grouped Predictor（基于 grouped DiT blocks）预测未来特征。
  - **空间门控**：每个组通过一个零初始化的 MLP 生成 $14 \times 14$ 的空间掩码，控制该组在图像上的作用区域，让各组自动 specialize 到不同的图像区域（如前景物体或背景）。
- **训练/优化目标**: 总损失 = 重建损失（像素+特征） + 各组 KL 散度 + 四个解耦损失。四个解耦损失分别为：
  1. **互斥性**：惩罚组间余弦相似度，使各组在代码空间正交。
  2. **组稀疏性**：L1 惩罚潜动作幅度，使组在无变化时保持静默。
  3. **门稀疏性**：L1 惩罚空间掩码，使掩码紧凑，只覆盖其解释的区域。
  4. **静态-动态正交性**：强制指定的一组静态特征与其他动态组正交（唯一的语义先验）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：Open X-Embodiment, EgoExo4D, Assembly101（预训练）；Bridge V2, LIBERO, SIMPLER, WorldArena, 以及 AgiBot G1 真实机器人数据集（评估）。
  - **对比对象 (baseline)**：UniVLA, LAPA, Moto, MVP-LAM, DreamDojo。
- **评价指标**: 
  - **表征质量**：无标签解耦指标（Modularity, MIG, DCI）、互信息（MI）估计、线性探针 NMSE、因果干预响应矩阵（对角线强度、泄漏率）。
  - **下游任务**：世界模型的 16 项视频生成指标（如动作跟随、物理一致性等）；VLA 策略的任务成功率（%）。
- **主要结果**: 
  - **解耦与因果独立**：DCI 达到 0.88（MVP-LAM 为 0.60）；单组干预的泄漏率 (Leakage) 降至 0.05（baseline 在 0.24 以上），呈现强对角线响应，证明各组在因果上真正独立。
  - **信息保留**：解耦未损失动作信息，三种 MI 估计器和线性探针显示其动作信息量高于 monolithic baselines，且 OOD（分布外）泛化误差更小。
  - **下游世界模型**：在 WorldArena 的 16 个指标上取得 SOTA，尤其在可控性维度（如动作跟随、指令跟随）提升显著。
  - **下游 VLA 策略**：在 SIMPLER 上平均成功率达 66.7%（超 MVP-LAM 9.4%），LIBERO 上达 94.4%（超 MVP-LAM 2.0%），在数据受限和需要组合行为的任务中优势最大。
  - **真实机器人**：在 AgiBot G1 的 8 个桌面任务中，单任务/多任务平均成功率分别达到 53.1% / 41.3%，比无潜动作预训练的 baseline 提升约 10 个百分点。

### 102. 🔥 [An Action Is Worth One Patch: Unified World-Action Modeling with PatchWAM] (一个动作值一个Patch：使用PatchWAM进行统一的世界-动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.25961` | [点击跳转](https://arxiv.org/abs/2609.25961)

**0. 论文标题**
- **英文标题**: An Action Is Worth One Patch: Unified World-Action Modeling with PatchWAM
- **中文标题**: 一个动作值一个Patch：使用PatchWAM进行统一的世界-动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出PatchWAM，通过无参数的固定映射将连续动作编码为视觉latent patch，让单一视觉生成骨干网络联合去噪预测未来图像和动作，彻底去除了专门的动作头/专家，在多个机器人仿真基准上取得SOTA表现。

**1. 整体逻辑**
- **研究任务**: 语言条件化的机器人连续控制（基于视觉-语言-动作/世界动作模型的策略学习）。
- **研究动机**: 现有的WAM/VLA模型通常需要引入可训练的动作头（action head）或独立的动作专家（action expert）来桥接低维动作和高维视觉表示。作者质疑：如果动作能用兼容的表示形式表达，视觉骨干网络现有的容量是否足以直接支持控制，从而省去专门的动作模块。
- **本质改动**: 把连续动作直接当成另一种“视觉patch”。通过无参数的固定编解码器将动作映射到视觉latent空间，让动作和图像在同一个Transformer里用相同的流匹配（flow-matching）目标联合去噪。
- **技术溯源**: 基于预训练图像生成模型 FLUX.2 [klein] 4B Base（作为视觉DiT骨干），文本编码器使用 Qwen3-4B（RoboTwin/LIBERO）或 Qwen3-VL-4B-Instruct（RoboDojo），代码实现基于 ImageWAM。

**2. 技术拆解**
- **核心方法**: 
  1. **Action-as-Patch (AP) 编解码器**：无参数。将归一化后的动作向量通过重复（replication）和零填充（zero-padding）映射为与视觉patch维度（D=128）相同的token；解码时通过分组平均（即伪逆）恢复动作。
  2. **联合去噪机制**：未来帧token和动作token在训练时加入独立的高斯噪声但共享同一个噪声水平（noise level），由同一个DiT联合预测两者的速度（velocity）。推理时从纯噪声联合去噪，最后用固定解码器恢复动作，无需将未来帧解码回RGB。
- **关键细节**: 
  - **输入**：语言指令、机器人本体感知状态（投影为1个token）、当前多视角观测图像。
  - **输出**：16步的动作chunk（H=16）和1个未来帧（chunk结束时的观测）。
  - **模型结构**：FLUX.2 4B DiT。输入序列包含clean前缀和noisy块（未来帧+动作token，动作token仅占约2%）。动作维度A为14或7，对应的复制因子r为9或18，缩放常数α=1。
  - **规模**：骨干4B参数，无额外动作专家参数。
- **训练/优化目标**: 联合流匹配（Flow-matching）目标。对图像和动作分别计算MSE损失（权重分别为0.5和1.0），使用特定的噪声水平采样分布（偏移s=5）和权重函数。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboTwin 2.0（50个任务，分full-data和clean-to-random协议）, LIBERO / LIBERO-Plus（4个任务集）, RoboDojo（42个任务）。
  - **Baseline**：VLA（如 OpenVLA, $\pi_{0.5}$, QuoVLA等）, WAM（如 ImageWAM, MotuBrain, 4D-WAM等），以及控制变量实验中的 matched dual-expert control（带0.64B动作专家的ImageWAM）。
- **评价指标**: 成功率 (Success Rate, SR, %)；RoboDojo额外使用 Score。
- **主要结果**: 
  - **控制变量实验（核心结论）**：在RoboTwin 2.0 matched setting下，PatchWAM平均成功率88.0%，比带独立动作专家的baseline（78.4%）高9.6%，且收敛更快，证明不需要专门的动作专家。
  - **RoboTwin 2.0 Full-data**：平均成功率96.12%（SOTA，超MotuBrain的95.94%）。
  - **RoboTwin 2.0 C2R (Clean-to-Random)**：平均79.14%（SOTA），随机场景66.72%（略低于GigaBrain-0.7的67.90%，但clean场景高达91.56%）。
  - **LIBERO-Plus**：增强数据训练下平均91.8%（SOTA）。
  - **RoboDojo**：Score 29.39，平均SR 23.60%（截至2026.9.15 leaderboard SOTA）。
  - **推理成本**：因每步需过完整的4B Transformer（含prefix），单次推理（20步）耗时0.446s，比dual-expert（0.239s）慢约1.87倍。

### 103. 🔥 [Beyond Reconstruction Error: Analytical and Data-Driven Action Tokenization for Autoregressive Vision-Language-Action Models] (超越重建误差：用于自回归视觉-语言-动作模型的解析与数据驱动动作Tokenization)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.25820` | [点击跳转](https://arxiv.org/abs/2609.25820)

**0. 论文标题**
- **英文标题**: Beyond Reconstruction Error: Analytical and Data-Driven Action Tokenization for Autoregressive Vision-Language-Action Models
- **中文标题**: 超越重建误差：用于自回归视觉-语言-动作模型的解析与数据驱动动作Tokenization
- **研究机构**: 原文未提及
- **一句话总结**: 证明了在自回归VLA模型中，动作Tokenization的重建误差越低并不意味着闭环控制效果越好，序列可预测性和解码稳定性才是决定策略性能的关键。

**1. 整体逻辑**
- **研究任务**: 评估和选择自回归视觉-语言-动作（VLA）模型中的连续动作离散化（Tokenization）表示方法。
- **研究动机**: 现有动作Tokenizer主要靠重建误差（如MSE）来评估，但自回归控制还需要token序列具备可预测性，且离散预测误差不能导致解码动作剧烈变化。低重建误差不等于好的闭环控制。
- **本质改动**: 把动作Tokenization从单纯的压缩问题，转变为联合几何表示、自回归序列建模和误差传播的接口问题，提出必须联合评估几何保真度、序列可预测性、解码器稳定性和闭环性能。
- **技术溯源**: 基于 FAST (Temporal-DCT)、Qwen3-VL-4B、LIBERO。

**2. 技术拆解**
- **核心方法**: 在统一的固定标量Token接口下，控制变量对比三种动作表示族：固定解析的时序离散余弦变换（Temporal-DCT）、数据驱动的线性主成分分析（PCA）、以及非线性多层感知机自编码器（MLP Autoencoder）。
- **关键细节**: 输入为16步、7维（6D末端位姿+1D夹爪）展平后的112维动作块。使用Qwen3-VL-4B作为策略骨干，LoRA微调。Token预算K=14，8-bit均匀量化（词表256）。DCT保留每通道前2个频率分量，PCA取前14个主成分，AE瓶颈层14维。
- **训练/优化目标**: 离线分析关注率失真（重建MSE）和序列建模诊断（Token熵、n-gram困惑度）；下游策略采用自回归Next-token prediction（交叉熵损失），并通过引入扰动增益（Perturbation gain）评估解码器对离散token扰动的敏感度。

**3. 实验结果**
- **实验设置**: 数据集为LIBERO-Spatial（9个seen tasks）。对比对象为PCA、Temporal-DCT和Autoencoder。测试环境为Qwen3-VL-4B策略，3个随机种子，每任务50个初始状态，共3500次闭环rollout。
- **评价指标**: 离线指标包括重建MSE、Token熵、困惑度（PPL）和策略损失；在线指标为Seen-task平均闭环成功率，以及衡量解码器稳定性的扰动增益（$G_z$）。
- **主要结果**: 
  1. 离线重建：PCA常规MSE比DCT低8.3%，AE最低（比PCA低36.7%）。但在2-bit极限量化下DCT更鲁棒。
  2. 序列预测：DCT的Token熵更低，困惑度下降12.5%-20.7%，序列更易被自回归模型预测。
  3. 闭环控制：DCT平均成功率（86.2%）比PCA（83.2%）高3.0个百分点。AE成功率（82.7%）垫底。
  4. 扰动敏感性：AE的扰动增益最大（0.0431），对token扰动最敏感，而PCA和DCT较小（约0.0336）。
  5. 核心结论：重建误差最低的方法并未取得最高的闭环成功率，仅靠重建误差无法可靠选择动作表示。

### 104. 🔥 [MachEmbodied-U0: Unified Understanding and Generation Model for Embodied Intelligence] (MachEmbodied-U0：面向具身智能的统一理解与生成模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.25627` | [点击跳转](https://arxiv.org/abs/2609.25627)

**0. 论文标题**
- **英文标题**: MachEmbodied-U0: Unified Understanding and Generation Model for Embodied Intelligence
- **中文标题**: MachEmbodied-U0：面向具身智能的统一理解与生成模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出ME-U0，通过MoT架构将子任务/affordance理解与基于Flow Matching的多模态视觉-动作联合生成相结合，在统一动作空间下利用4200小时异构数据预训练，实现了强大的机器人操作控制与零样本场景理解能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作控制（根据语言指令和视觉观察，生成连续动作并预测未来场景的视觉与几何演变）。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型以动作为中心，没有显式捕捉交互过程中场景的动态演变；而WAM（世界-动作）模型虽然能联合预测未来视觉和动作，但缺乏任务相关的语义grounding、交互定位和长程任务分解能力。
- **本质改动**: 在Mixture-of-Transformers (MoT) 架构中，用“理解专家”显式预测子任务和affordance以提供语义/空间上下文，用“生成专家”通过Flow Matching联合生成多模态视觉动态（RGB/深度/法线/光流）和连续动作，并设计了MRPE解决视觉与动作的时间对齐问题。
- **技术溯源**: 基于Lance（统一多模态架构）初始化，动作与视觉生成基于Flow Matching（类似$\pi_0$），子任务监督参考了$\pi_{0.5}$。

**2. 技术拆解**
- **核心方法**: 
  1. **MoT双专家架构**：理解专家自回归预测子任务和affordance；生成专家联合去噪视觉latents和动作。两者通过共享的多模态注意力机制进行信息交互。
  2. **多模态视觉动态生成**：共享同一个视频VAE，统一生成RGB、深度、表面法线和光流，为操作提供显式的几何和运动监督。
  3. **MRPE（多速率旋转位置编码）**：针对视频帧时间压缩和动作步密集采样的问题，为视频帧和动作chunk分配不同的位置索引（视频共享时间索引，动作在chunk内分配高度轴索引），实现细粒度时间对齐。
  4. **统一动作表示**：将不同机器人的状态和动作映射到统一的规范接口（如关节角、末端执行器位姿、归一化夹爪开合度、底盘平面速度等），抹平异构数据的物理语义差异。
- **关键细节**: 
  - **输入输出**：输入当前RGB、任务指令、机器人状态；输出子任务文本、affordance bbox、未来视觉序列和连续动作。
  - **数据规模**：约4200小时预训练数据（含机器人和第一人称egocentric数据），涵盖4个开源机器人数据集和6种机器人形态。数据经过严格的三阶段清洗，并使用大模型（GPT-5.5、Qwen3.6等）进行子任务、affordance和几何/光流标注。第一人称数据通过Ego2Robot管线合成为机器人对齐数据。
- **训练/优化目标**: 
  - **理解专家**：自回归交叉熵损失（预测子任务和affordance文本）。
  - **生成专家**：联合Flow Matching损失（同时优化视觉latents和动作轨迹的速度场预测，使用shifted logit-normal分布采样噪声水平）。总损失为两者加权和。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboDojo（仿真），LIBERO和LIBERO-Plus（仿真）。
  - **对比对象（Baseline）**：VLA类（StarVLA, X-VLA, $\pi_{0.5}$, Spatial Forcing等），WAM类（Fast-WAM, AHA-WAM, OpenWAM-$\alpha$等）。
  - **后训练设置**：在RoboDojo和LIBERO上后训练时，**不**引入额外的子任务、affordance或几何/光流标注（减少监督设置），以验证预训练表征的鲁棒性。
- **评价指标**: 成功率 (Success Rate, SR) 和 过程得分 (Process Score，RoboDojo特有，0-100分，给予部分进度得分)。
- **主要结果**: 
  - **RoboDojo**：Overall Score达到17.66，SR为11.18%。在所有WAM模型中表现最好，在精度（23.95）和长程任务（36.98）上优势明显，整体性能与主流VLA基线具有竞争力。
  - **LIBERO**：平均成功率99.0%（Spatial 98.4%, Object 99.8%, Goal 99.0%, Long 98.6%），接近饱和，表现优异。
  - **LIBERO-Plus**：平均成功率82.5%。在光照和语言扰动下表现极强（97.6%和90.4%），但在相机视角和机器人初始状态变化下较弱（70.2%和75.7%）。
  - **零样本能力**：无需后训练即可zero-shot生成视觉动态（深度/法线/光流）、预测affordance和子任务，验证了统一架构带来的强泛化性。

- **英文标题**: JAMB: Joint Action-Motion Diffusion for Bimanual Manipulation
- **中文标题**: 用于双臂操作的联合动作-运动扩散策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种扩散策略，在去噪生成双臂动作的同时联合预测未来的3D点轨迹，让动作和场景运动预测在共享的Transformer中相互细化，大幅提升了双臂协调操作的成功率和泛化性。

**1. 整体逻辑**
- **研究任务**: 双臂机器人的视觉运动策略学习（根据当前单目RGB图像和机器人本体状态，预测未来的双臂动作序列）。
- **研究动机**: 现有的扩散策略只从当前观测重建动作，没有显式建模动作对未来场景几何和运动的影响。虽然有些工作引入未来预测（如未来图像、密集3D几何或2D轨迹），但它们要么缺乏3D度量信息，要么计算冗余，且通常只把未来预测作为辅助监督或固定的条件输入，没有在生成过程中让动作和运动假设相互指导。
- **本质改动**: 把“双臂动作”和“未来3D点轨迹”作为两个扩散变量放在同一个Transformer里联合去噪，并利用4D旋转位置编码（4D RoPE）将它们锚定在同一个物理时空坐标系中，实现动作和运动预测的相互细化。
- **技术溯源**: 基于 Diffusion Policy (DP), DP3, Diffusion Transformer (DiT), DINOv2, 4D RoPE, PointWorld (运动加权损失), CoTracker3, FoundationStereo 等已有工作。

**2. 技术拆解**
- **核心方法**: 
  1. 构建与视觉patch对齐的3D点轨迹：在图像patch中心初始化查询点，结合深度信息 lifting 到3D空间，预测其未来位移。
  2. 联合去噪架构：将DINOv2提取的视觉特征与带噪的3D轨迹特征融合；将融合token、双臂状态token、带噪动作chunk和扩散时间步token拼接成一个序列，输入DiT进行全自注意力计算。
  3. 时空接地（4D RoPE）：将视觉/轨迹token锚定在当前3D位置（时间0），状态token锚定在当前末端位置（时间0），动作token锚定在未来时间步，其空间坐标由当前带噪动作推导，并随去噪进度动态插值。
- **关键细节**: 
  - 输入：单目RGB图像，双臂本体状态。
  - 结构：4层DiT，隐藏层维度1024，8个注意力头。图像通过DINOv2（patch size 14）编码，产生391个（仿真）或276个（真机）patch对齐的3D轨迹查询点。
  - 规模/超参：动作和轨迹预测 horizon 均为16。训练100步扩散，推理10步DDIM。
- **训练/优化目标**: 
  动作的MSE损失 + 运动加权的轨迹MSE损失。参考PointWorld，根据轨迹最终的物理位移大小计算权重，降低几乎静止的背景点的损失权重。

**3. 实验结果**
- **实验设置**: 
  - 仿真：RoboTwin 2.0 基准，包含16个双臂任务（8个同步协调，8个顺序协调），附录还有16个主从选择任务。每个任务100条专家演示。
  - 真机：3个双臂任务（Store Block, Stack Basin, Place Duck Box），使用两个xArm和ZED Mini相机，50条遥操作演示。
  - Baselines：动作-only策略（DP, DP3），未来状态预测（DICP预测视觉，GAP预测密集3D几何），轨迹引导策略（ATM预测2D轨迹）。
- **评价指标**: 任务成功率（%），以及轨迹预测的平均位移误差（ADE）和最终位移误差（FDE）。
- **主要结果**: 
  - 仿真：16个任务平均成功率83.4%，比最强baseline高出23.9个百分点。
  - 真机：3个任务平均成功率85.6%，比GAP（64.4%）高21.2个百分点，比DP3（35.6%）高50.0个百分点。
  - 泛化性：在Easy-to-Hard（未见纹理和杂乱背景）设置下，JAMB平均成功率17.9%，远超最强baseline GAP的4.3%。
  - 消融实验证明，联合去噪比单独回归轨迹或固定条件轨迹效果更好，且4D RoPE带来的时空接地对性能至关重要。
