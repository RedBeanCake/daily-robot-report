### 36. 🔥 [Agile-WAM: An Agile Tactile World Action Model for Contact-Rich Robot Control] (Agile-WAM：一种用于接触丰富机器人控制的敏捷触觉世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20761` | [点击跳转](https://arxiv.org/abs/2609.20761)

本文属于**具身智能/机器人学习**领域，类型为**方法创新**。主要解决接触丰富操作任务中，多模态世界动作模型（WAM）推理效率低以及多模态信号时间尺度不匹配的问题。

**0. 论文标题**
- **英文标题**: Agile-WAM: An Agile Tactile World Action Model for Contact-Rich Robot Control
- **中文标题**: Agile-WAM：一种用于接触丰富机器人控制的敏捷触觉世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种轻量级的触觉世界动作模型，通过直接流匹配和多时间尺度预测机制，在保持极高推理速度（约10ms）的同时，大幅提升了机器人在接触丰富任务中的控制成功率和纠偏能力。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作任务（如插拔、装配等），需要结合视觉和触觉反馈进行高频、精确的控制。
- **研究动机**: 现有的触觉世界动作模型严重依赖大规模预训练的视频生成骨干网络，导致推理慢、难以在机器人端侧高频部署；此外，视觉和触觉信号的物理演化时间尺度不同（视觉变化慢且冗余，触觉在接触时突变），用统一的时间步长去预测两者会导致监督信号错位。
- **本质改动**: 抛弃笨重的大型预训练生成模型，从头训练一个轻量级的“视觉-触觉到动作”直接流匹配网络；并针对模态特性，设计了“多时间尺度多模态预测”，对视觉用长步长预测，对触觉用短步长（下一步）预测。
- **技术溯源**: 基于 VITA（视觉动作模型，采用了类似的无噪声流匹配和动作自编码器设计）、Flow Matching（流匹配生成范式）、ManiFeel（触觉操作仿真基准）。

**2. 技术拆解**
- **核心方法**: 
  1. **直接流匹配骨干**：将当前视觉、触觉和本体感觉编码融合为单一隐变量作为流匹配的源，目标隐变量包含动作、未来视觉和未来触觉。去除了传统流匹配中反复注入条件的交叉注意力机制，直接做映射，大幅降低计算量。
  2. **多时间尺度多模态预测**：视觉预测采用较长的时间偏移（与动作执行步长一致），以捕捉有意义的场景演化；触觉预测采用下一步（短步长），以保留高频突变的接触动态。预测在隐空间进行，避免了高维像素级重建的开销。
- **关键细节**: 
  - **输入**：RGB图像、TacFF触觉力场信号（如10x14x3或32x32）、机器人本体感觉。
  - **结构**：ResNet-18做视觉和触觉编码器（视觉用ImageNet预训练，触觉从头训练），MLP做动作自编码器和流网络。
  - **推理**：使用显式Euler求解器，仅需6步积分即可生成动作和预测隐变量。动作块（action chunk）长度为16，每次执行8步。
- **训练/优化目标**: 联合优化五个损失函数：流匹配速度场损失（$\mathcal{L}_{FM}$）、动作自编码器重建损失（$\mathcal{L}_{AE}$）、动作空间生成损失（$\mathcal{L}_{act}$）、视觉隐变量预测损失（$\mathcal{L}_{vis}$）和触觉隐变量预测损失（$\mathcal{L}_{tac}$）。其中动作自编码器用于提供结构化动作隐空间，防止动作生成崩溃。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：ManiFeel基准，9个任务，Franka Panda机械臂 + TacFF传感器。
  - **真实**：5个任务（齿轮装配、peg插入、网线插入/拔出、电源插头插入），Flexiv Rizon 4机械臂 + RealSense相机 + 压阻式压力传感器。每个任务50个遥操作示教。
  - **对比对象（Baseline）**：DP, DP-VT, Tactile-WAM, VITA（仅视觉）, VITA-VT（视觉+触觉）。
- **评价指标**: 任务成功率（Success rate）、推理延迟（Inference latency）、控制频率（Control frequency）。
- **主要结果**: 
  - **成功率**：在9个仿真和5个真实任务中均取得最优表现。真实世界5个任务总体成功率相比最强baseline相对提升29.4%。模型展现出极强的接触后纠偏恢复能力，在视觉被遮挡时能靠触觉反馈滑动找正。
  - **推理效率**：推理延迟极低（摘要提及11.9 ms，表III实测为10.35 ms），控制频率高达约96 Hz，比基于扩散模型的DP/DP-VT快约40倍，且与纯视觉的VITA延迟相当，证明了其架构的轻量化和敏捷性。

### 37. 🔥 [MoWAM: Explicit Future Motion Prediction for Efficient World Action Models] (MoWAM：用于高效世界动作模型的显式未来运动预测)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20709` | [点击跳转](https://arxiv.org/abs/2609.20709)

**0. 论文标题**
- **英文标题**: MoWAM: Explicit Future Motion Prediction for Efficient World Action Models
- **中文标题**: MoWAM：用于高效世界动作模型的显式未来运动预测
- **研究机构**: 原文未提及
- **一句话总结**: 提出MoWAM，在推理时用紧凑的“末端执行器结构化运动”替代昂贵的“未来视频生成”，在保持显式未来推理的同时，提升世界动作模型的推理效率和分布外（OOD）鲁棒性。

**1. 整体逻辑**
- **研究任务**: [领域：具身智能/机器人控制；类型：方法创新] 基于视觉-语言-动作（VLA）/世界动作模型（WAM）的机器人操作策略学习。
- **研究动机**: 现有WAM在推理时显式生成未来视频计算开销极大；而隐式使用未来动态（如Fast-WAM推理时不生成视频）虽快，但在分布偏移（OOD）下因缺乏针对当前场景的显式未来估计，导致鲁棒性明显下降。
- **本质改动**: 在推理阶段，用“结构化的机器人末端执行器运动”这一紧凑的显式表征，替代完整的“未来视频生成”，从而兼顾显式未来推理的收益与推理效率。
- **技术溯源**: 基于视频生成大模型（Wan2.2-5B）、Flow Matching、Transformer（DiT）架构，以及现有的WAM基线（如Fast-WAM, Joint-WAM）。

**2. 技术拆解**
- **核心方法**: 
  1. 训练时双分支解耦：采用Video Transformer学习未来视觉动态（生成视频），Action-Motion Transformer联合预测动作和结构化运动。
  2. 推理时关闭视频生成：冻结Video Transformer（仅提取一次观察特征的KV），Action-Motion Transformer基于观察特征联合去噪生成动作和运动。
  3. 结构化运动表征：提取末端执行器（夹爪）的指尖和掌心关键点，计算中心位移、指尖跨度变化和掌心相对偏移，作为紧凑的未来运动表征。
  4. 推理时扩展（Inference-time scaling）：采样多个“动作-运动”候选对，用训练好的运动感知验证器（Verifier）打分，选择最高分的动作执行。
- **关键细节**: 
  - 输入输出：输入当前观察图像、语言指令、机器人状态；输出动作序列（action chunk，horizon=32）和对应的结构化运动序列。
  - 模型结构：双分支Transformer，隐藏层维度1024。视频时间下采样4倍，每个chunk 9帧。
  - 规模与超参：基座为预训练的Wan2.2-5B；推理时使用10步去噪，CFG=1.0。
- **训练/优化目标**: 
  - 视频与动作/运动分支：基于Flow Matching的条件去噪损失（包含运动动态变化损失和结构几何损失）。
  - 验证器（Verifier）：成对排序损失（Pairwise ranking loss），正样本为成功演示的运动，负样本为扰动（如减少变化、平滑偏移、截断）后的运动。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（标准基准，4个suite），LIBERO-Plus（7种OOD分布偏移设置），真实世界操作任务（Franka Research 3机器人，3个任务）。
  - 对比对象（baseline）：VLA方法（OpenVLA, OpenVLA-OFT, UniVLA, π0, π0-FAST, π0.5），WAM方法（Lingbot-VA, Motus, LaWAM, Fast-WAM, IDM-WAM, Joint-WAM）。
  - 测试环境：训练用4张A100，推理延迟测试在单张RTX 5090上。
- **评价指标**: 任务成功率（Task success rate, %），动作生成延迟（Action latency, ms）。
- **主要结果**: 
  - 分布内（LIBERO）：MoWAM平均成功率98.9%，与生成完整视频的Joint-WAM (98.75%) 相当，优于Fast-WAM (96.5%)。
  - 分布外（LIBERO-Plus）：MoWAM平均成功率81.43%，显著优于Fast-WAM (70.43%)，超过使用具身预训练的Motus (76.0%)，接近显式生成视频的Joint-WAM (80.57%)。
  - 真实世界：平均成功率80%，大幅高于Fast-WAM (45%)，相比Motus (71.67%) 成功率更高且延迟从1621.9ms降至293.5ms。
  - 推理时扩展：增加候选数量（如从1到8）能持续提升成功率（如Pick Banana任务从65%升至80%），且延迟和显存增长远低于生成完整视频的WAM变体（IDM-WAM在K=32时显存溢出）。

### 38. 🔥 [Learning Foresight without Explicit Trajectories for 3D Diffusion Policies] (无需显式轨迹的3D扩散策略前瞻性学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20669` | [点击跳转](https://arxiv.org/abs/2609.20669)

**0. 论文标题**
- **英文标题**: Learning Foresight without Explicit Trajectories for 3D Diffusion Policies
- **中文标题**: 无需显式轨迹的3D扩散策略前瞻性学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种轻量级的“运动趋势引导”机制，通过训练时预测稀疏未来状态来塑造一个紧凑隐变量，推理时仅用该隐变量为3D扩散策略提供全局前瞻条件，在不引入显式轨迹规划的前提下显著提升多任务操作成功率。

**1. 整体逻辑**
- **研究任务**: 基于3D点云观测的机器人动作生成（3D扩散策略）。
- **研究动机**: 现有3D扩散策略只能根据当前观测生成动作，缺乏对未来交互走向的预判。如果直接预测显式的未来轨迹或关键点，不仅超出了控制器的实际需求，预测误差还会限制后续基于新观测的动作修正。
- **本质改动**: 不直接预测显式轨迹，而是学习一个紧凑的隐变量来表征“运动趋势”。训练时用稀疏的未来夹爪状态监督这个隐变量，推理时丢弃解码器，只把隐变量作为面向未来的条件注入扩散模型。
- **技术溯源**: DP3。

**2. 技术拆解**
- **核心方法**: 提出“运动趋势引导”（Movement Trend Guidance）。用一个轻量级MLP从短历史观测中提取256维的趋势隐变量。训练时，通过辅助解码器预测未来稀疏夹爪状态来监督该隐变量；推理时，隐变量通过全局条件路径和瓶颈层门控FiLM注入扩散UNet，不输出具体轨迹。
- **关键细节**: 
  - 输入输出：输入长度为3的观测窗口（点云+机器人状态），输出长度为8的动作序列，滚动执行其中6步后重新观测。
  - 模型结构：隐变量维度256。辅助解码器预测未来偏移量为 {5, 10, 15, 20} 的4个夹爪目标（包含3D位置和1维夹爪开合状态）。
  - 注入机制：隐变量投影后与观测特征融合，作为全局条件；同时增加一个门控FiLM分支，仅作用于扩散UNet的瓶颈层。该分支的缩放和偏置初始化为零（初始为恒等映射），并带有负偏置以限制调制强度。
  - 规模：比DP3基线增加3.52%的参数量（9.23M）。
- **训练/优化目标**: 联合优化。主损失为动作扩散的MSE损失（样本预测目标），辅助损失为未来夹爪状态的MSE损失。总损失为两者相加（辅助损失权重为1.0）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboTwin2.0（50个双臂任务）、LIBERO-40（40个单臂任务）、DexArt（4个灵巧手任务）以及5个SO101真实机器人双臂任务。
  - 对比对象：DP3、SimpleDP3、RDT、$\pi_0$、ACT、DP、IBC、BCRNN、FreqPolicy、VITA等。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - RoboTwin2.0（50任务混合训练）：成功率从 DP3 的 56.1% 提升至 62.8%（+6.7%）。
  - LIBERO-40：成功率从 37.08% 提升至 71.93%（+34.85%）。
  - DexArt：成功率从 52.0% 提升至 59.25%（+7.25%），优于所有对比方法。
  - 真实机器人（5个任务）：成功率从 49.0% 提升至 72.0%（+23.0%）。
  - 推理效率：参数量仅增加3.52%，推理延迟仅增加1.23%（从 50.28ms 增加到 50.90ms）。

### 39. 🔥 [DexTouch-WM: Learning Action-Conditioned Tactile World Models from Human Touch for Dexterous Robot Manipulation] (DexTouch-WM：基于人类触觉学习动作条件化触觉世界模型用于灵巧机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20649` | [点击跳转](https://arxiv.org/abs/2609.20649)

**0. 论文标题**
- **英文标题**: DexTouch-WM: Learning Action-Conditioned Tactile World Models from Human Touch for Dexterous Robot Manipulation
- **中文标题**: DexTouch-WM：基于人类触觉学习动作条件化触觉世界模型用于灵巧机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种视觉-触觉世界模型，通过在人机和机器人手上部署相同的触觉传感布局并对齐动作空间，利用100小时人类交互数据显著提升了机器人灵巧操作的接触动态预测能力。

**1. 整体逻辑**
- **研究任务**: 构建动作条件化的视觉-触觉世界模型，联合预测灵巧操作中的未来RGB图像和双侧全手触觉（接触压力）动态。
- **研究动机**: 接触丰富的灵巧操作依赖密集的触觉数据，但在真实机器人上收集成本极高且受限于特定传感器和硬件实体（embodiment），导致现有触觉数据集规模小且难以扩展。
- **本质改动**: 将触觉数据采集与机器人实体解耦。通过在人手和机器人手上部署相同布局的柔性压阻阵列，并将人类动作重定向到机器人动作空间，使得大规模人类交互数据能直接监督用于真实机器人预测的同一个动力学模型。
- **技术溯源**: 基于预训练的视频生成模型 Wan2.2-TI2V-5B 及其视频 VAE，结合了 Mixture-of-Transformers 架构与条件流匹配（Conditional Flow Matching）训练范式。

**2. 技术拆解**
- **核心方法**: 
  1. 共享触觉接口与动作对齐：人手和机器人手使用相同的320 taxel压阻布局。人类动作通过逆运动学重定向到机器人动作空间，形成统一的67维姿态表示。
  2. 解剖学感知触觉分词（Split-Hands tokenizer）：将指尖和手掌分开编码，保留解剖学拓扑结构，避免将物理上不相连的区域强行拼成一张规则图像。
  3. 锚定残差触觉潜变量：预测相对于初始触觉状态的残差，让模型聚焦于动作引起的接触变化，而非静态背景压力。
  4. 双速率动作条件化：视频和触觉流在各自的潜在时间分辨率下接收动作条件（视频4帧一chunk，触觉逐帧），通过AdaLN注入。
- **关键细节**: 
  - 输入：初始RGB、双侧触觉图、语言指令、未来67维姿态序列。
  - 输出：未来RGB和双侧触觉压力图。
  - 架构：预训练的视频专家与轻量级触觉专家通过 Mixture-of-Transformers 的掩码联合自注意力进行多模态交互，保留各自模态的AdaLN和前馈网络。
  - 数据规模：100小时人类交互数据（50个日常双手任务） + 5小时真实机器人数据（10个灵巧操作任务）。
- **训练/优化目标**: 条件流匹配（Conditional Flow Matching）损失。总损失为视频和触觉流匹配损失的加权和。触觉损失仅计算接触区域或随时间变化的token，以减少非接触区域的干扰。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自建的人类触觉数据集（100h，54个任务）和机器人数据集（5h预训练 + 下游任务数据）。
  - Baseline：触觉表征对比 Grid（将触觉图视为单一空间画布的CNN）；架构对比 V-only（仅预测视频）和 Cross-Attn（通过交叉注意力注入动作的联合模型）。下游策略评估对比了 FTP-1、$\pi_{0.5}$ 和 X-VLA。
- **评价指标**: 
  - 视觉：PSNR, SSIM, LPIPS, 轨迹准确性（Trajectory Accuracy）, 几何误差（Geometry Error）等。
  - 触觉/接触：PSNR_taxel, SSIM_taxel, 接触IoU（Contact-IoU）, 接触F1（Contact-F1）等。
  - 下游评估：策略评估的 Pearson 相关系数和 MMRV（平均最大排名违反率）；策略学习的真实世界任务成功率。
- **主要结果**: 
  - 架构消融：Split-Hands 比 Grid 收敛更快、重建误差更低；AdaLN 动作注入比 Cross-Attn 在视觉轨迹准确性和触觉接触预测上表现更好，有效减少了跨模态干扰。
  - 数据扩展（核心结论）：在固定5小时机器人数据的情况下，增加人类数据至100小时，视觉 PSNR 从 23.47 提升至 27.10，接触 IoU 从 0.42 提升至 0.59。证明人类数据能有效扩展机器人领域的预测能力，且人和机器人的任务集是不重叠的。
  - 策略评估：混合人类数据微调的世界模型（WM-Mix）作为代理环境，与真实世界评估的 Pearson 相关性（0.844）显著高于纯机器人微调（WM-Robot，0.646），且排名违反率（MMRV）更低。
  - 数据生成：用世界模型生成的合成数据训练策略，效果因具体策略和任务而异。混合数据模型能提供有用的演示，但合成数据的训练效用并不完全等同于其作为评估器的一致性。

### 40. 🔥 [V2-STRep: VLM-Grounded Structured Task Representations for Reusable Robot Skills Acquired from Generated Videos] (V2-STRep：基于VLM接地结构化任务表示从生成视频中获取可复用机器人技能)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20582` | [点击跳转](https://arxiv.org/abs/2609.20582)

**0. 论文标题**
- **英文标题**: V2-STRep: VLM-Grounded Structured Task Representations for Reusable Robot Skills Acquired from Generated Videos
- **中文标题**: V2-STRep：基于VLM接地结构化任务表示从生成视频中获取可复用机器人技能
- **研究机构**: 原文未提及
- **一句话总结**: 提出V2-STRep框架，利用VLM和RGB-D将生成视频中的物体运动抽象为包含最小几何约束和运动阶段的结构化任务表示，实现机器人操作技能的零样本跨场景复用与指令适应。

**1. 整体逻辑**
- **研究任务**: 从生成的操作视频中提取机器人操作技能，并实现该技能在未知场景下的零样本跨场景迁移，以及适应新的兼容指令。
- **研究动机**: 现有从生成视频恢复3D运动轨迹的方法，只捕捉了特定场景下的单一运动实现，把任务结构、几何关系和物理约束（如放倒瓶子与竖放瓶子的区别、擦桌子必须接触表面）隐式化了。这导致提取的技能缺乏可执行性，且难以在不同场景配置下复用。
- **本质改动**: 不再死磕视频里的绝对3D轨迹，而是用VLM把视频运动拆解为“结构化的任务表示”（包含最小目标几何、运动阶段参考系和方向约束）。把“视频里的具体动作”抽象为“满足几何约束的相对运动”，再通过轨迹优化求解出兼顾任务要求和机器人运动学可行性的关节动作。
- **技术溯源**: 视频生成模型（Wan 2.7）、视觉语言模型（原文提及 GPT-6 Astra）、3D运动恢复（Dream2Flow, SpatialTrackerV2, CoTracker3）、机器人运动学优化（PyRoKi）。

**2. 技术拆解**
- **核心方法**: 
  1) VLM推断结构化任务表示（定义目标几何、运动阶段及方向约束）；
  2) 基于RGB-D的2D到3D几何与抓取接地；
  3) 基于几何规则的运动迁移；
  4) 结合抓取选择的任务约束轨迹优化。
- **关键细节**: 
  - **目标几何**：VLM为任务选择5种最小几何结构之一：点（point）、点-法向量（point-normal）、轴（axis）、平面（plane）、完整6D位姿（full 6D pose）。
  - **运动阶段**：将视频分为多个阶段，每个阶段指定运动来源（保留视频运动 `retain_video` 或生成过渡运动 `transition`）和参考系（阶段初始位姿或目标几何）。
  - **方向约束**：分为自由（free）、轴约束（axis_constrained，允许绕特定轴旋转）、完全跟踪（full_tracking）。
  - **2D到3D接地**：利用深度图将VLM输出的2D像素/边界框反投影为3D目标几何。同时根据VLM提示的抓取像素和方向，重建最多6个候选抓取位姿。
  - **运动迁移**：根据目标几何类型计算源场景到部署场景的相对变换矩阵（例如：平面类型对齐法向并去除法向位移；轴类型对齐轴向并根据初始径向向量计算额外旋转角）。
- **训练/优化目标**: 无传统训练过程。核心是**任务约束的轨迹优化**。优化目标函数包含：位置跟踪误差（$E_{pos}$）、方向跟踪误差（$E_{ori}$，根据方向约束类型计算惩罚）以及机器人可行性代价（$E_{robot}$，包括关节极限、平滑度、自碰撞等）。使用 PyRoKi 联合优化抓取选择和完整关节轨迹，在满足任务约束的前提下，利用剩余的旋转自由度来适应机器人的关节极限。

**3. 实验结果**
- **实验设置**: 
  - **任务与硬件**：6个真实世界操作任务（苹果放置、瓶子放置、木条敲击、抽屉匹配、微波炉开门、擦桌子）。硬件为 Franka Emika Panda 机械臂 + Intel RealSense D435i RGB-D 相机。
  - **对比对象 (baseline)**：NovaFlow（从3D流恢复刚体运动并优化轨迹）、Dream2Flow（优化轨迹跟踪3D流）。
  - **数据设置**：每个任务共享5个生成的源视频，共进行30次试验（Baseline对比）；跨场景迁移测试中，每个任务生成1个额外源视频，在5个部署配置下测试（共30次试验）。
- **评价指标**: 任务执行成功率（Task success rates）。
- **主要结果**: 
  - **Baseline对比**：在30次试验中，V2-STRep 成功 25 次，显著优于 NovaFlow（12次）和 Dream2Flow（8次）。V2-STRep 在保持方向约束（如瓶子竖放）和平面接触（擦桌子）上表现更好，且利用剩余自由度更好地适应了关节极限。
  - **跨场景迁移**：在成功获取源技能的前提下，跨场景迁移成功率达到 96.7%（30次试验中成功 29 次）。唯一失败案例是擦桌子时深度测量不准导致抓取点落在了桌面上。
  - **指令适应**：定性验证了在不重新生成视频的情况下，通过更新VLM接地和约束，成功适应改变的操作物体（如苹果换柠檬）、改变交互目标（擦不同的标记）以及放松方向约束（允许瓶子任意朝向放置）。

### 41. 🔥 [MaskHarness-WAM: Instance-Grounded Harnessing for Long-Horizon Robot Manipulation] (MaskHarness-WAM：面向长时域机器人操作的实例锚定执行框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19974` | [点击跳转](https://arxiv.org/abs/2609.19974)

**0. 论文标题**
- **英文标题**: MaskHarness-WAM: Instance-Grounded Harnessing for Long-Horizon Robot Manipulation
- **中文标题**: MaskHarness-WAM：面向长时域机器人操作的实例锚定执行框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种外部闭环执行框架（Harness），通过动态生成和验证实例级目标Mask，在不修改底层策略的情况下，将有限时域的视觉动作模型扩展为能可靠处理多个外观相同物体序列操作的长时域系统。

**1. 整体逻辑**
- **研究任务**: 长时域机器人序列操作，特别是要求按特定顺序操作多个外观完全相同物体的任务（如按指定顺序抓取特定位置的相同方块或试管）。
- **研究动机**: 现有的VLA（视觉-语言-动作）或WAM（世界动作模型）等底层策略通常是有限时域的，依赖明确目标和稳定阶段。当面对多个外观相同的物体时，仅靠类别级语义无法区分具体实例；且局部动作完成不代表任务阶段有效转移。缺乏外部机制来维持目标身份、跟踪进度和协调执行，直接重复调用底层策略会引发目标错配和级联失败。
- **本质改动**: 不修改底层WAM策略本身，而是设计了一个外部的任务级闭环Harness系统，将目标Mask作为动态的实例级接口，在子任务边界持续更新和验证视觉条件，从而把有限时域技能组合成可靠的长时域行为。
- **技术溯源**: 底层策略基于Mask条件世界动作模型（Mask-conditioned WAM）；目标Mask由SAM3生成；Harness中的视觉评估（入口和出口门控）由Qwen3.5（视觉语言模型）实现。

**2. 技术拆解**
- **核心方法**: MaskHarness-WAM系统，包含任务级Harness和Mask条件WAM策略。Harness负责任务分解、状态记忆、视觉评估（验证目标Mask和完成度）、失败恢复和执行调度；底层WAM接收多视角RGB、机器人状态、局部指令和验证过的目标Mask，输出有限时域的动作块（action chunk）。
- **关键细节**: 
  - **输入输出**：输入多视角RGB、本体感觉、局部指令和目标Mask；输出14维（双臂7-DoF）的有限时域动作块（预测步长H=32）。推理时采用10步去噪。
  - **Mask应用**：Mask仅应用于提供全局视角的头部相机（head view），腕部相机（wrist view）的Mask通道置零，以保留局部几何信息。
  - **推理机制**：推理时不显式生成未来帧，仅用初始验证过的Mask作为整个动作块的实例级空间锚点，无需逐帧分割。
  - **Harness机制**：包含入口门（VLM验证Mask是否对准目标实例）和出口门（VLM对比前后观察评估子任务是否完成）。若验证失败或未完成，触发重新观察和恢复机制，防止错误状态传播。
- **训练/优化目标**: 联合预测未来RGB、未来Mask和动作。总损失为 $L = L_{rgb} + L_{mask} + L_{act}$。采用连续流匹配（continuous flow matching）目标进行优化（1000步，时间偏移5.0），使用AdamW优化器。

**3. 实验结果**
- **实验设置**: 
  - **平台与任务**：真实ARX双臂7-DoF机器人平台；任务为方块（block）和试管（test-tube）的序列操作。训练集为4个实例，测试集评估3、4、5个实例设置。
  - **对比对象（baseline）**：$\pi_0$（通用VLA策略）、Fast-WAM（世界动作模型）、MaskWAM（Mask条件WAM，因未开源由作者复现）。
  - **硬件环境**：训练使用8张NVIDIA H20 96GB GPU，推理使用单张NVIDIA RTX 5090 32GB GPU。
- **评价指标**: 成功率（SR，所有子任务按序完成的比例）和进度率（PR，按序完成的最长正确前缀占总体子任务的比例）。
- **主要结果**: 
  - **主实验**：在6个测试设置（3/4/5实例的方块和试管任务）中，MaskHarness-WAM的SR稳定在84.0%-96.0%，PR在91.2%-97.3%。baseline表现较差，例如$\pi_0$在5实例时SR为0%，MaskWAM在4实例方块任务中SR仅8.0%。
  - **OOD泛化**：在目标外观变化、场景组合变化、外观与几何联合变化三种分布外设置下，SR保持在83.3%-91.7%，显著优于baseline，证明实例级Mask条件在视觉分布偏移下依然有效。
  - **Zero-shot泛化**：在单步迁移任务中达到100% SR/PR；在未见类别（面包）的4步序列迁移中，SR达68.0%，PR达77.0%，证明其无需微调即可适应新任务结构和新物体类别。

### 42. 🔥 [Improving Cross-embodiment Transfer in Latent Action Models with Action-Similarity Supervision] (通过动作相似性监督改善潜在动作模型中的跨具身迁移)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19846` | [点击跳转](https://arxiv.org/abs/2609.19846)

**0. 论文标题**
- **英文标题**: Improving Cross-embodiment Transfer in Latent Action Models with Action-Similarity Supervision
- **中文标题**: 通过动作相似性监督改善潜在动作模型中的跨具身迁移
- **研究机构**: 原文未提及
- **一句话总结**: 在潜在动作模型（LAM）预训练时引入动作相似性监督，通过匹配潜在动作与真实动作序列的相似度，在低数据场景下大幅提升跨具身迁移的成功率。

**1. 整体逻辑**
- **研究任务**: 提升通用机器人策略（如VLA模型）在跨具身（不同机器人形态）场景下的迁移能力，解决目标具身缺乏动作标签（low-data）的问题。
- **研究动机**: 现有的潜在动作模型（LAM）通过无标签视频学习，对视觉噪声敏感，且相同动作在不同机器人上会被编码为不同的潜在表示。现有方法（如加辅助损失直接预测真实动作）会把潜在空间与特定具身的动作空间绑定，反而破坏了跨具身迁移能力。
- **本质改动**: 放弃让LAM直接回归真实动作，改为“动作相似性监督”——让潜在动作之间的相似度去匹配真实动作序列之间的相似度，从而保持潜在动作空间的抽象性，使其在不同具身间保持一致。
- **技术溯源**: 潜在动作模型（LAM，如AdaWorld的VAE骨干和LAOM的多步骨干）、视觉-语言-动作模型（VLA，如 $\pi_0$）、RoboTwin 2.0 仿真环境。

**2. 技术拆解**
- **核心方法**: 动作相似性监督（Action-similarity supervision）。在LAM的逆动力学模型（IDM）和正动力学模型（FDM）联合预训练阶段，引入一个辅助的相似性损失。计算batch内潜在动作的余弦相似度矩阵，以及真实动作序列的余弦相似度矩阵，最小化两者的Frobenius范数差异。
- **关键细节**: 
  - **输入输出**：输入为观测对 $(o_t, o_{t+H})$，输出为潜在动作 $z_t$。
  - **模型结构**：测试了两种骨干：AdaWorld（VAE，潜在维度64）和LAOM（多步CNN，潜在维度1024）。下游策略使用基于Flow-matching的 $\pi_0$ 或较小的Multi-Task DiT。
  - **动作空间处理**：真实动作转换为每步增量（deltas），并在batch和序列维度上标准化。使用末端执行器增量（end-effector deltas）比关节空间增量效果更好，且允许跨具身对（cross-embodiment pairs）参与计算。
  - **关键超参**：相似性损失权重 $\lambda=0.05$（LAOM），时间平移窗口 $s=\pm 2$（用于对齐时间步），batch size $B=128$。
- **训练/优化目标**: 
  - **阶段1（LAM预训练）**：总损失 $\mathcal{L} = \mathcal{L}_{recon} + \lambda \mathcal{L}_{sim}$。其中 $\mathcal{L}_{sim}$ 是潜在动作相似度矩阵与真实动作相似度矩阵的Frobenius范数平方差。
  - **阶段2（标注）**：用冻结的IDM为所有数据标注潜在动作。
  - **阶段3（策略训练）**：训练 $\pi_0$ 预测潜在动作序列（标准conditional flow-matching loss）。
  - **阶段4（解码器训练）**：为每个具身训练一个小型MLP解码器，将潜在动作映射回该具身的真实动作（MSE loss）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：RoboTwin 2.0 仿真环境。使用两个具身（Aloha 6-DoF 和 Franka 7-DoF）。每个具身演示3个任务（各50个demo），训练时混合所有数据。
  - **对比对象（baseline）**：直接预测真实动作的 $\pi_0$ (GT-$\pi_0$)、无监督LAM、带辅助预测头（+pred）的LAM、其他相似性/对比损失变体（如ViLA-style, ConLA-style, villa-X, CLAM等）。
  - **评估协议**：交叉评估。评估时，每个机器人在另一个机器演示的3个任务上进行闭环测试（跨具身），并在自己演示的任务上测试（具身内）。每个具身-任务对测50个episode。
- **评价指标**: 闭环成功率（Success Rate, SR）。
- **主要结果**: 
  - 相比直接预测真实动作（GT-$\pi_0$ 跨具身成功率24.0%），引入动作相似性监督的LAOM（LAOM+sim-EE-X）将跨具身成功率提升至61.3%，提升超过2.5倍，同时保留了88.5%的具身内性能（69.3%）。
  - 相比辅助预测真实动作（+pred，跨具身34.0%），相似性监督（+sim，跨具身46.0%）有12个点的绝对提升。
  - **标签效率**：仅使用10%的动作标签进行相似性监督，配合全量数据训练的解码器，仍能达到65.7%的跨具身成功率。
  - **策略规模**：在参数量小60倍的Multi-Task DiT策略上，潜在动作流水线依然将跨具身成功率从1.3%提升至33.7%。

### 43. 🔥 [Towards High-DoF Dexterous Manipulation through VLA Post-Training] (通过VLA后训练实现高自由度灵巧操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19666` | [点击跳转](https://arxiv.org/abs/2609.19666)

**0. 论文标题**
- **英文标题**: Towards High-DoF Dexterous Manipulation through VLA Post-Training
- **中文标题**: 通过VLA后训练实现高自由度灵巧操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套包含动作编解码、SFT、DAgger和潜在空间残差RL的四步后训练流水线，解决了预训练VLA模型难以直接适配高自由度灵巧手的问题，在5个真实机器人任务上达到了100%的成功率。

**1. 整体逻辑**
- **研究任务**: 将预训练的视觉-语言-动作（VLA）基础模型适配并部署到特定的高自由度（High-DoF）双臂灵巧手硬件平台上，执行具体的原子操作任务。
- **研究动机**: 现有开源VLA在适配高自由度灵巧手时面临三个核心障碍：1) 缺乏原生支持高自由度灵巧手的动作接口；2) 在人类遥操作接管（DAgger）时，绝对指令下的手势不匹配会导致控制跳变并污染纠正数据；3) 在高维原始关节空间直接做在线强化学习（RL）采样效率极低。
- **本质改动**: 训练一个时间手部动作编解码器（Codec），将高维灵巧手动作压缩到低维潜在空间，并让SFT、DAgger和残差RL全部在这个共享的低维潜在空间中进行，从而统一动作接口并约束RL的探索空间。
- **技术溯源**: 基于开源的 $\pi_{0.5}$ (flow-matching VLA模型) 作为基础策略；强化学习部分基于 TD3 算法和 RL Token 机制。

**2. 技术拆解**
- **核心方法**: 一个四步后训练流水线：1) 训练并冻结一个基于Transformer的时序手部动作VAE编解码器；2) 在潜在空间对 $\pi_{0.5}$ 进行SFT；3) 引入带缓冲回滚和指令平滑混合机制的DAgger收集人类纠正数据并继续SFT；4) 冻结策略，在潜在空间使用TD3训练残差RL策略。
- **关键细节**: 
  - **动作空间压缩**：硬件为双臂7-DoF + 双手20-DoF（共54维）。Codec将单手20维压缩到9维，双臂+双手共32维潜在动作，刚好适配 $\pi_{0.5}$ 的32维动作接口。
  - **平滑DAgger接管**：保留5秒状态缓冲，接管前进行姿态对齐，并在2秒内将机器人指令从策略指令线性混合过渡到遥操作指令，避免绝对指令下的控制跳变。
  - **潜在空间残差RL**：冻结VLA，使用RL Token提取观测特征，训练一个小MLP Actor在32维潜在空间输出有界残差，使用TD3优化。
- **训练/优化目标**: 
  - **Codec**：带时间差分惩罚的加权Huber重建损失 + KL散度正则。
  - **SFT**：条件Flow Matching损失（在潜在空间和解码后的关节空间进行双重监督）。
  - **RL**：TD3的Critic更新目标（带折扣的终端奖励） + Actor的Q值最大化 + 残差幅度正则化 + 时序平滑惩罚。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：5个真实的标记物操作任务（Pick Up, Transfer, Rotate, Uncap, Write），每个任务初始200条演示。
  - **对比对象（baseline）**：纯SFT、持续收集演示（Continued SFT/DAgger）、原始关节空间残差RL（Raw-space residual RL）、基于PCA的潜在空间残差RL。
  - **测试环境**：Tianji 7-DoF双臂 + Wuji 20-DoF灵巧手，3个RGB相机，30Hz控制频率。
- **评价指标**: 每个任务20次试验的成功率（Success rate）。
- **主要结果**: 
  - 最终pipeline在所有5个任务上均达到100%成功率（20/20）。
  - 在潜在空间做SFT没有损失原始关节空间的表现，且DAgger比单纯增加演示数据采样效率更高。
  - 潜在空间残差RL显著优于原始关节空间残差RL（例如Transfer任务中，潜在空间RL从70%提升到100%，而Raw-space RL只到80%且训练过程震荡）。
  - 消融实验证明时序Codec、时序平滑探索噪声、残差正则化和Critic预热都是保证RL稳定收敛的关键。

### 44. 🔥 [TacSushi: Tactile-Grounded World-Action Modeling for Dexterous Sushi Manipulation] (TacSushi：面向灵巧寿司操作的触觉驱动世界-动作建模)
- **研究机构**: `原文未提及（双盲审稿隐去）`
- **Arxiv ID**: `2609.19613` | [点击跳转](https://arxiv.org/abs/2609.19613)

**领域与类型判断**：具身智能/机器人操作（方法创新与系统工程）。

**0. 论文标题**
- **英文标题**: TacSushi: Tactile-Grounded World-Action Modeling for Dexterous Sushi Manipulation
- **中文标题**: TacSushi：面向灵巧寿司操作的触觉驱动世界-动作建模
- **研究机构**: 原文未提及（双盲审稿隐去）
- **一句话总结**: 提出了一种基于 Cosmos3 的机器人操作策略，通过特征级门控融合当前触觉以指导部署，并引入仅在训练时使用的多目标未来后果预测监督，显著提升了灵巧手处理易变形食物的成功率与质量。

**1. 整体逻辑**
- **研究任务**: 灵巧手操作易变形、易遮挡且接触状态不确定的食物（如捏饭团、包海苔、放置易碎 toppings）。
- **研究动机**: 视觉主导的策略在食物变形和遮挡时容易失效（外观正常但局部接触已失稳）；现有方法未能有效解耦部署时的当前触觉感知与训练时的未来状态预测，导致触觉信息利用不充分或引入额外的部署计算负担。
- **本质改动**: 将“当前触觉”通过特征级门控直接注入动作表征用于部署控制，同时将“未来视觉、触觉、进度和接触风险”等多目标后果预测作为仅在训练时使用的辅助监督信号，部署时彻底移除预测器。
- **技术溯源**: 基于 Cosmos3 (Cosmos3-Nano backbone) 视觉-语言-动作模型，硬件基于 Shadow Dexterous Hand Lite 及 Shadow Tactile Fingertip (STF) 传感器。

**2. 技术拆解**
- **核心方法**: 
  1. **部署路径（特征级门控触觉融合）**：将当前触觉特征投影到骨干网络特征空间，通过 sigmoid 门控机制缩放触觉残差，与视觉-语言-本体感觉表征融合后直接驱动动作头。
  2. **训练路径（动作条件后果预测）**：利用融合后的表征和演示的动作块（action chunk），预测未来的视觉、任务进度、相对接触风险和触觉摘要。失败轨迹的后果用于监督，但其动作被掩码（不参与模仿）。
- **关键细节**: 
  - **硬件与数据**：4指灵巧手（13个执行器，16个关节），每指17个三轴 taxel（共68个 taxel）。采集了340次成功和50次失败的真实遥操作数据。
  - **输入输出**：输入当前 RGB、语言指令、16维关节状态、68维触觉幅值及摘要；输出 16步的动作块（每步13维执行器目标）。
  - **架构**：Cosmos3-Nano 编码视觉/语言/本体感觉，紧凑型触觉编码器处理触觉。训练时增加动作编码器和后果解码器，部署时移除。
- **训练/优化目标**: 
  - **总损失**：$\mathcal{L}_{\rm train} = m_t \mathcal{L}_{\rm action} + \lambda_{\rm vis} \mathcal{L}_{\rm future-vis} + \mathcal{L}_{\rm aux}$。
  - $m_t$ 为模仿掩码（成功为1，失败为0），确保失败动作不参与模仿学习，但其记录的未来后果仍用于监督。
  - **辅助损失 $\mathcal{L}_{\rm aux}$**：包含任务进度、相对接触风险、触觉摘要的 MSE 回归损失，以及风险预测与触觉摘要中风险坐标的一致性损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：3个分布内任务（饭团、海苔、蛤蜊），2个分布外任务（换用黑米、三文鱼）。
  - **对比对象（Baseline）**：系统级基线 M1 (GR00T无触觉)、M2 (GR00T+触觉直接拼接)；消融变体 M3 (触觉直接拼接，无后果监督)、M4 (触觉直接拼接，有后果监督)、M5 (门控融合，无后果监督)、M6 (完整 TacSushi)。
  - **测试环境**：600次真实机器人 rollout（每个方法-任务组合20次），使用 guarded receding-horizon 执行器。
- **评价指标**: 
  - **成功率**：基于人类-VLM复合视觉质量评分（5个人类+3个VLM评分，加权平均，>=3分视为成功）。
  - **视觉质量得分**：人类和AI分别打分的5分制均值。
  - **辅助诊断**：未来视觉重建的 MAE, 1-SSIM, LPIPS。
- **主要结果**: 
  - 完整 TacSushi (M6) 在分布内平均成功率达 68.3%（饭团75%，海苔60%，蛤蜊70%），分布外达 37.5%（黑米35%，三文鱼40%）。
  - 相比无后果监督的门控融合 (M5)，M6 的 ID 成功率提升 31.7%（68.3% vs 36.7%），OOD 提升 27.5%。
  - 相比有后果监督的直接拼接 (M4)，M6 的 ID 成功率提升 43.3%（68.3% vs 25.0%），OOD 提升 20.0%。
  - 相比最强系统级基线 M2 (GR00T+触觉)，M6 的 ID 成功率提升 20.0%，OOD 提升 22.5%。
  - 人类和 AI 评估均给出最高视觉质量得分，且未来视觉重建误差（MAE, 1-SSIM, LPIPS）显著降低，验证了后果监督对表征学习的正向作用。

- **一句话总结**: 提出以接触为中心的神经物理世界模型 WorldContact，通过大时间步长和显式接触编码从少量轨迹快速生成可变形物体操作数据，将下游 VLA 策略的真机成功率从 65% 提升至 95%。

**1. 整体逻辑**
- **研究任务**: 可变形物体（如购物袋）操作中的机器人策略学习，具体是通过世界模型生成仿真数据来微调视觉-语言-动作（VLA）策略。
- **研究动机**: 机器人适应新任务需要大量交互数据，但传统物理仿真器因防穿透需极小时间步长导致数据生成慢；现有神经动力学方法缺乏显式接触建模和长程耦合处理，在自回归 rollout 中易出现穿透或物理上不合理的形变。
- **本质改动**: 用神经网络直接预测大时间步长（20倍）下的状态变化以跳过繁琐的小步长积分，并在输入端显式编码四类局部接触特征，结合分层 Token 机制处理长程物理耦合。
- **技术溯源**: 基于 WorldParticle 的分层 Token 架构、SimWeaver 的物理仿真器，以及 Pi05 预训练 VLA 策略。

**2. 技术拆解**
- **核心方法**: 
  1) 以接触为中心的顶点分词器（Contact-Centric Vertex Tokenizer）：对每个目标顶点，聚合其空间接触（欧氏距离近）、拓扑接触（UV空间近）、可控接触（机器人/抓取物近）和环境接触（桌面等近）的局部几何与运动特征。
  2) 分层 Token 编码器与全局解码器：通过自注意力和二分 Token 合并（bipartite token-merging）将顶点 Token 压缩为全局 Token 以捕捉长程耦合，再通过交叉注意力将全局上下文传回顶点级进行解码。
  3) 可微拓扑投影（Differentiable Topology Projection）：在自回归预测循环中引入拉普拉斯平滑和边长约束，限制拓扑边畸变，提升长时序 rollout 的稳定性。
- **关键细节**: 
  - 输入：物体状态（顶点位置、速度、静止拓扑、属性）和规定状态（机器人关节角、夹爪开合、运动学几何、环境采样点）。
  - 输出：下一时刻顶点位置和速度的变化量（ΔX, ΔV）。
  - 时间步长：使用 0.04s（源仿真器为 0.002s，放大 20 倍）。
  - 模型规模：总参数量约 2.00M。
- **训练/优化目标**: 
  - 损失函数：自回归 rollout 下所有预测步的顶点位置和速度均方误差（MSE）之和。
  - 优化机制：通过反向传播贯穿整个 rollout 序列和可微投影层，最小化累积误差；使用 AdamW 优化器。

**3. 实验结果**
- **实验设置**: 
  - 数据集：16 个购物袋操作任务（碰撞、抓取、抬起、放置、释放等），每个任务 25 条训练轨迹（共 400 条），由 GPT-5.6 Sol 驱动的自动化智能体在 SimWeaver 物理仿真器中生成并经过物理/视觉校验。
  - 对比 Baseline（神经动力学）：RoboCraft, RoboCook, AdaptiGraph。
  - 下游任务：使用生成的数据微调 Pi05 VLA 策略，在真机（AgileX PiPER 6-DoF 机械臂）上执行单臂抬袋子任务。
- **评价指标**: 
  - 动力学预测：顶点位置和速度的均方误差（MSE），以及穿透率（接触面积穿透 >1cm 的比例）。
  - 计算效率：状态 rollout 生成速度（对比源物理仿真器）。
  - 下游策略：真机单次尝试成功率。
- **主要结果**: 
  - 动力学预测：WorldContact 的位置 MSE（0.0002）和速度 MSE（0.0002）远低于 Baseline（如 AdaptiGraph 的 0.0323/0.0098），穿透率降至 0.35%（Baseline 在 10%-24% 之间）。
  - 计算效率：在单张 H100 GPU 上，生成速度比源物理仿真器快 10 倍（0.4s vs 0.04s 每秒墙钟时间）。
  - 下游策略：仅用 25 条源数据微调的 VLA 真机成功率为 65%（13/20）；使用 WorldContact 扩充至 150 条数据微调后，成功率提升至 95%（19/20）。

### 46. 🔥 [Predict Before You Deploy: Offline Prediction of Quantization-Induced Task Degradation for World Action Models] (部署前预测：离线预测世界动作模型量化导致的任务降级)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19441` | [点击跳转](https://arxiv.org/abs/2609.19441)

**0. 论文标题**
- **英文标题**: Predict Before You Deploy: Offline Prediction of Quantization-Induced Task Degradation for World Action Models
- **中文标题**: 部署前预测：离线预测世界动作模型量化导致的任务降级
- **研究机构**: 原文未提及
- **一句话总结**: 提出PreDE框架，利用少量闭环数据校准离线动作偏差阈值，从而在免跑完整闭环评估的情况下，准确预测世界动作模型（WAMs）的量化配置是否会导致任务性能降级。

**1. 整体逻辑**
- **研究任务**: 预测世界动作模型（WAMs）在后训练量化（PTQ）后，不同量化配置（位宽、分组、量化器等）是否会导致机器人控制任务性能下降，以替代昂贵的闭环评估。
- **研究动机**: WAMs部署需要大量内存和算力，PTQ是有效的压缩手段。但量化配置空间巨大，且标称位宽相同但配置不同的模型表现差异巨大。直接看离线动作偏差不可靠，因为不同策略对偏差的容忍度不同；而穷举闭环评估（在仿真或真机上跑）成本太高。
- **本质改动**: 不依赖单一的全局偏差阈值，而是用一个小规模开发集的闭环结果来“校准”特定策略和任务下的离线动作偏差阈值，将新配置划分为接受、拒绝或推迟闭环评估三类。
- **技术溯源**: 基于多种WAMs（Cosmos Policy, UVA, mimic-video, RynnVLA-002, Fast-WAM），并测试了多种PTQ方法（RTN, HQQ, ViDiT-Q, SVDQuant, QServe）。

**2. 技术拆解**
- **核心方法**: 提出PreDE（Predict Before You Deploy）框架。首先在开发集上计算各量化配置的离线动作偏差和闭环任务损失，据此标定“接受阈值”（可接受配置中的最大偏差）和“拒绝阈值”（降级配置中的最小偏差）。对于新配置，只需在固定观测日志上计算其离线动作偏差，若小于等于接受阈值则接受，大于等于拒绝阈值则拒绝，介于两者之间则推迟到闭环评估。
- **关键细节**: 
  - 输入输出：输入为参考策略与量化策略在固定观测日志上的动作序列，输出为平均绝对动作偏差（mean absolute component deviation）。
  - 模型与规模：评估了5个WAMs和4个基准设置（LIBERO, RoboCasa-24, PushT等）。
  - 关键超参：可接受损失容忍度设为1%（$\epsilon_A = 0.01$），降级阈值设为2%（$\epsilon_R = 0.02$），并引入了基于样本量的证据标准来防止误标。
- **训练/优化目标**: 非学习类工作。核心机制是基于“设定内单交叉假设”（within-setting single-crossing hypothesis）的阈值校准与决策规则。目标是最大化决策覆盖率，同时保证在已标定区间内不出现假接受和假拒绝。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：LIBERO、RoboCasa-24、PushT。
  - 对比对象（baseline）：隐式对比全量闭环评估；显式对比固定偏差阈值（如 $\bar{\delta} \le 0.009$）或固定位宽（如 $\ge 4$ bits）的启发式规则。真机实验使用 Franka Research 3 机器人。
- **评价指标**: 决策覆盖率（decision coverage），假接受/假拒绝率，闭环成功率（success rate），动作查询延迟（query latency），峰值内存（peak memory）。
- **主要结果**: 
  - 仿真预测：在28个保留配置中，PreDE做出了21个决策（75%覆盖率），全部与真实闭环标签一致（0假接受，0假拒绝）。推迟的7个配置中包含3个可接受、1个严重降级（损失33%）和3个未解决。而简单的启发式规则在100%覆盖下会产生5到6个假拒绝。
  - 真机验证：在450次Franka真机试验中，被提前划入高偏差组的配置均出现显著降级，低偏差组无显著降级。
  - 部署收益：W4A4量化配置在真机上实现了1.37倍的动作查询加速，峰值内存从5.19GB降至2.93GB（降低约44%）。

### 47. 🔥 [GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM Task Planning] (GAVEL：用于验证和高效长时程LLM任务规划的图世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19315` | [点击跳转](https://arxiv.org/abs/2609.19315)

**0. 论文标题**
- **英文标题**: GAVEL: Graph World Models for Verified and Efficient Long-Horizon LLM Task Planning
- **中文标题**: GAVEL：用于验证和高效长时程LLM任务规划的图世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出GAVEL框架，将场景图从“被动验证器”升级为“主动图世界模型”，在LLM生成长时程具身计划时进行前置验证与自动修复，并利用物体位置的概率分布在线动态重排多任务顺序，大幅提升规划成功率并降低搜索成本。

**1. 整体逻辑**
- **研究任务**: 具身智能中的长时程机器人任务规划，特别是处理部分可观测（partial observability）环境下的单任务和多任务指令。
- **研究动机**: LLM直接生成的长时程计划常违反具身约束且难以自我恢复。现有的场景图方法（如SayPlan）只是被动验证，遇到错误就让LLM重规划，成本高且易引入新错误；而纯图编辑规划（如EPoG）只能处理简单的空间重排，无法处理“洗盘子”等需要操作电器的复杂语义目标。此外，在多任务规划中，若将未观测物体的位置概率坍缩为点估计并固定任务顺序，会导致次优的搜索成本。
- **本质改动**: 把图从“被动验证器”转变为“主动世界模型”。它不仅能预测动作后果、直接修复（repair）那些由动作语义决定的错误（如没靠近就去抓，直接补一个导航动作），只把需要复杂语义推理的错误扔回LLM；还能在部分可观测下维护未观测物体位置的概率分布（belief），并据此在线动态重排多任务的执行顺序以最小化期望搜索成本。
- **技术溯源**: 基于BEHAVIOR-1K/OmniGibson环境；使用Qwen系列（Qwen3-1.7B/4B/8B）、GPT-5.6 Sol、Claude Sonnet 5等LLM；借鉴了SayPlan的验证反馈机制、EPoG的图编辑思想，以及SEEK的关系语义网络（RSN）进行位置预测。

**2. 技术拆解**
- **核心方法**: GAVEL框架包含五个核心模块：1) 任务理解：提取物体、关系和状态目标；2) 信念初始化：用RSN预测未观测物体在各房间的概率分布；3) LLM动作规划：生成初始动作序列；4) 图世界模型验证与修复：前向模拟动作，检查前置条件和安全性，直接插入修复动作，仅将未解决的语义错误交还LLM；5) 信念感知的多任务执行：计算期望搜索/导航成本，在线动态重排剩余任务顺序。
- **关键细节**: 
  - **输入输出**：输入自然语言指令和初始信念图，输出验证修复后的动作序列及动态任务执行顺序。
  - **模型结构**：使用Qwen3-1.7B的LoRA适配器进行任务理解；使用冻结的bge-small-en-v1.5加三层MLP构建RSN预测房间位置信念；图世界模型包含9个具身基础动作（如NavigateTo, Grasp, Open等），每个动作有严格的前置条件（如proximity, affordance）和效果定义。
  - **规模与超参**：LLM调用预算T=5；多任务数量N≤5，通过枚举所有排列（O(N^2) rollout）精确求解最小期望成本排序；RSN在11,218个放置数据上训练。
- **训练/优化目标**: 
  - **训练目标**：任务理解适配器在8,000个合成指令-目标对上训练；RSN使用加权二元交叉熵（weighted binary cross-entropy）损失训练，并用Platt scaling校准。
  - **优化目标/核心机制**：最小化期望物理执行距离。通过公式评估任务排列的期望成本（包含首任务搜索成本和任务间导航成本），并在每次任务完成后根据新观测更新信念，重新计算并优化剩余任务的执行顺序。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：BEHAVIOR-1K（使用轻量级2D执行器加速，并在OmniGibson中验证了抽象的一致性）。
  - **对比对象（baseline）**：llm-only（纯LLM）、sayplan（带验证反馈无修复）、epog（纯图编辑规划）、oracle（上帝视角参考），以及GAVEL的消融变体（gavel-basic仅修复、gavel-map固定最可能位置、gavel-static固定顺序）。
  - **测试负载**：100个单长时程任务，500个多任务指令（包含2-5个子任务）。
- **评价指标**: 成功率（Success）、机器人移动距离（Distance）、规划时间（Planning time）。
- **主要结果**: 
  - **单任务规划（Qwen3-8B）**：GAVEL将成功率从llm-only的41.2%大幅提升至91.8%，且平均LLM调用次数仅1.5次（sayplan需2.7次）。仅靠图修复（gavel-basic）就能达到76.2%，证明图世界模型直接修复的有效性。
  - **多任务执行（Qwen3-8B）**：GAVEL成功率从llm-only的19.9%提升至92.6%。相比sayplan，移动距离从83.01m降至78.01m，规划时间减少约12s。
  - **信念与排序优化**：保留概率分布并在线重排（gavel）相比固定顺序（gavel-map），移动距离减少约5.4%（从82.45m降至78.01m），且排序优化耗时仅17ms。
  - **模型扩展性验证**：在100个多任务子集上，Qwen3-4B+GAVEL（75.2%）远超单独使用的GPT-5.6 Sol（24.6%）和Claude Sonnet 5（38.6%）；加上GAVEL后，GPT-5.6 Sol和Claude Sonnet 5的成功率分别达到99.2%和99.4%，证明显式图世界模型推理与LLM能力扩展是互补的。

### 48. 🔥 [JEPA-WAM: Connecting Generated Visual Instructions to World Action Models through JEPA Latent Representations] (JEPA-WAM：通过JEPA潜在表示将生成的视觉指令连接到世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20277` | [点击跳转](https://arxiv.org/abs/2609.20277)

**0. 论文标题**
- **英文标题**: JEPA-WAM: Connecting Generated Visual Instructions to World Action Models through JEPA Latent Representations
- **中文标题**: JEPA-WAM：通过JEPA潜在表示将生成的视觉指令连接到世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 JEPA-WAM，通过引入文生图模型生成的多样化视觉指令，并利用冻结的 V-JEPA 提取对场景外观变化鲁棒的潜在语义，显著提升了世界动作模型在复杂场景和指令变化下的指令跟随能力。

**1. 整体逻辑**
- **研究任务**: 提升世界动作模型（World Action Models, WAMs）在机器人操作任务中的文本指令跟随能力（Instruction Following）。
- **研究动机**: 现有 WAMs 仅依赖文本指令时表现不佳。原因是机器人学习数据存在结构性不平衡：丰富的“视觉-动作轨迹”往往只对应稀疏且重复的“语言标注”。这导致模型走捷径，倾向于从视觉上下文和动作规律中识别任务，而不是真正理解和对齐文本指令（grounding the instruction）。
- **本质改动**: 不再仅依赖单一文本指令，而是利用现成的文生图模型为每条文本指令生成一个“视觉指令库”，并通过 V-JEPA 提取忽略外观差异的任务级潜在语义，以此作为额外的条件输入来指导视频和动作预测。
- **技术溯源**: 基于 World Action Models（如 Fast-WAM）、V-JEPA 2.1（视觉编码器）、DreamLite（文生图模型），并以 $\pi_0$ 作为 VLA（Vision-Language-Action）对比基线。

**2. 技术拆解**
- **核心方法**: 构建视觉指令库并进行潜在语义编码。具体为：1) 离线使用文生图模型根据文本指令和不同随机种子生成多张任务完成状态的图像，构成视觉指令库；2) 训练时随机采样一张，通过冻结的 V-JEPA 2.1 编码器提取特征，经池化和投影后得到紧凑的潜在表示（Goal tokens）；3) 将这些表示与文本指令、当前状态拼接，通过交叉注意力机制同时输入给 WAM 的视频专家和动作专家。
- **关键细节**: 
  - 文生图模型采用 0.39B 参数的 DreamLite，生成 768x768 图像。
  - 视觉编码器采用 80M 参数的 V-JEPA 2.1 ViT-B/16（保持冻结）。将静态图像复制为两帧以适配 V-JEPA 的时序输入，经过 8x8 空间池化压缩为 64 个 tokens，再经可学习投影层映射到 WAM 维度。
  - 视觉指令库默认大小为每条指令 1024 张生成图像。
  - 推理优化：仅在接收到新指令时生成图像并编码，后续控制步复用该表示。整个推理栈（含生成和编码）在单张 RTX 5090 上运行。
- **训练/优化目标**: 采用联合流匹配（Joint flow-matching）目标。损失函数为 $\mathcal{L}_{\mathrm{WAM}} = \lambda_v \mathcal{L}_{\mathrm{video}} + \lambda_a \mathcal{L}_{\mathrm{action}}$，即视频潜在预测损失和动作预测损失的加权和。训练时仅优化 WAM 参数和 JEPA 投影层，文生图模型和 V-JEPA 编码器保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集：作者构建的包含 11 个行为重叠（behaviorally overlapping）桌面操作任务的真实机器人 Benchmark（共 1370 条演示数据，包含 Give Me, Pick-and-Place, Sort Toys, Wipe Table 等任务）。
  - 对比对象 (Baseline)：$\pi_0$ (VLA 模型), Fast-WAM (WAM 模型)。
  - 评估设置：ID (分布内), OOD-S (分布外场景，引入干扰物和未见类别), OOD-I (分布外指令，使用语义相同但表述不同的指令)。
- **评价指标**: 真实机器人 rollout 的二元任务成功率（Success rate），每个任务-设置组合进行 10 次 rollout，无部分得分。
- **主要结果**: 
  - JEPA-WAM 在 ID、OOD-S、OOD-I 设置下的平均成功率分别为 87.3%、74.5%、80.9%。
  - 相比 $\pi_0$ 和 Fast-WAM，JEPA-WAM 在这三个设置下分别至少高出 10.0、27.3、14.5 个百分点。
  - 消融实验表明：视觉指令库从 64 扩大到 1024 能持续提升性能；使用生成的视觉指令比使用真实演示的关键帧（Keyframe-64）效果更好，因为生成图像能提供更密集的任务语义信号且外观多样性更高，减少了模型对训练特定视觉上下文的依赖。

- **一句话总结**: 基于 Wan2.2 构建了一个 5B 参数的视频世界模型，通过统一的相机/动作控制接口和五阶段低成本训练（仅需两张 L20），实现了支持实时流式交互的因果视频生成，性能媲美 13B-22B 的大模型。

**1. 整体逻辑**
- **研究任务**: 构建一个实时的、可控的交互式视频世界模型，能够根据文本、首帧、相机轨迹和连续动作指令生成连续的视频流，并为具身智能和自动驾驶预留后训练接口。
- **研究动机**: 现有视频扩散模型多用双向注意力，无法直接用于因果交互生成；仅靠文本和首帧无法提供精确的几何与动作控制；自回归展开会导致误差累积，引发运动衰减、几何漂移和细节丢失。
- **本质改动**: 在 Wan2.2 视频先验基础上，设计了融合 PRoPE 相机控制与 64 维动作调制的统一控制接口，并提出一套五阶段训练方案，将双向视频模型转化为支持 KV 缓存和少步采样的因果流式生成模型。
- **技术溯源**: Wan2.2-TI2V-5B（视频基座）、PRoPE（相机几何控制）、Causal Forcing/CF++（因果转换与蒸馏）、DMD/DMD2（分布匹配蒸馏）、UniPC（少步采样器）。

**2. 技术拆解**
- **核心方法**: 提出双向与因果双模型架构。双向模型保留全时序注意力，用于高质量生成和教师监督；因果模型将时序注意力改为块下三角掩码（block lower-triangular mask），结合局部窗口和持久 Attention Sink 实现流式 KV 缓存。控制方面，相机内外参通过 PRoPE 注入 Self-Attention，64 维连续动作和 Embodiment ID 通过 MLP 映射为 Scale/Shift/Gate 调制每一层。
- **关键细节**: 模型为 5B 参数，30 层 DiT 骨干。因果推理时，每个块生成 8 个 latent 帧，使用 8 步 UniPC 采样，关注 20 帧局部窗口和 4 帧持久 sink。支持在推理中途通过追加文本（Event Prompts）插入场景事件。预留了动作序列输出头用于下游后训练。
- **训练/优化目标**: 五阶段训练（全在 2 张 L20 48G 上完成）：
  1. 双向控制适应：Flow matching，加入相机和动作控制。
  2. 块因果转换：Block-causal teacher forcing，改用因果掩码。
  3. 在线轨迹蒸馏：Online UniPC trajectory distillation，25步教师蒸馏到12步学生。
  4. 混合域因果 SFT：结合游戏、驾驶、机器人数据，加入 rolling forcing。
  5. 非对称 DMD/DMD2：使用双向模型作 real-score 教师，加入运动保持项防止动作过度静态化。

**3. 实验结果**
- **实验设置**: 数据集包括 Control2V、DROID、CrossFPS、DrivingDojo 和 NVIDIA PhysicalAI。对比 Baseline 包括 Kairos 3.0 (4B)、YUME 1.5 (5B)、LongCat-Video (13.6B)、Helios (14B)、LTX-2.3 (22B) 等开源世界模型/视频模型。
- **评价指标**: WBench (Navi 158 和 Full 289 两个 split，包含质量、设定、交互、一致性、物理五个维度) 和 VBench 1.0。
- **主要结果**: 
  1. 在 WBench Full 289 上，Astronex-World (5B) 平均分 70.0，超过同基座的 YUME 1.5 (68.9) 和 4B 的 Kairos 3.0 (65.7)。
  2. 对比大模型，超越了 LongCat-Video (13.6B, 69.9) 和 Helios (14B, 69.7)，接近 LTX-2.3 (22B, 70.9)，且 Quality 得分最高。
  3. 训练和推理成本极低：后训练仅需 2 张 L20 48GB GPU，单卡 L20 推理可达 24fps 实时流式输出。
  4. 局限性：DMD 蒸馏导致运动幅度下降（内部诊断显示动作幅度仅为双向教师的 19%）；复杂交互（如多事件编辑、视角切换）能力较弱；长时序仍存在颜色和结构漂移。

### 50. 🔥 [SkelWAM: A Skeleton-Guided World-Action Model for Zero-Shot Cross-Embodiment Manipulation] (SkelWAM：一种用于零样本跨具身操作的骨架引导世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21983` | [点击跳转](https://arxiv.org/abs/2609.21983)

**0. 论文标题**
- **英文标题**: SkelWAM: A Skeleton-Guided World-Action Model for Zero-Shot Cross-Embodiment Manipulation
- **中文标题**: SkelWAM：一种用于零样本跨具身操作的骨架引导世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: [本文属于具身智能/机器人学习领域的方法创新与系统工程] 提出了一种基于25维全身骨架几何表示的世界-动作模型，通过统一视觉观测和动作空间的规范表示，实现了源机器人策略到多种目标机器人（含连续体臂）的零样本跨具身迁移。

**1. 整体逻辑**
- **研究任务**: 零样本跨具身机器人操作迁移（Source-only cross-embodiment transfer）。即仅使用源机器人的任务演示训练策略，直接部署到形态各异的目标机器人上，无需目标机器人的任务数据或策略微调。
- **研究动机**: 现有的世界-动作模型（WAM）在跨具身迁移时面临“视觉侧”（外观、形态差异）和“动作侧”（控制坐标、运动学冗余度差异）的具身鸿沟。仅靠末端执行器（TCP）重定向无法解决“相同TCP位姿对应不同全身构型”的问题，导致策略在目标机器人上失效。
- **本质改动**: 摒弃直接对齐末端位姿或关节角的做法，引入一个显式的25维全身骨架表示（中心线+TCP+夹爪），用同一套几何规范来统一视觉输入和动作输出，再通过特定具身的解码器还原为原生控制。
- **技术溯源**: 基于 Wan2.2 视频骨干网络（Wan model family），采用 Diffusion-Transformer (DiT) 架构构建视频和动作专家模型；动作生成采用 Flow Matching；基准测试基于 LIBERO 构建。

**2. 技术拆解**
- **核心方法**: 
  1. 规范骨架表示：将机器人形态抽象为6个中心线采样点、TCP位姿和夹爪命令，构成25维共享状态。
  2. 视觉规范：将原生图像中的机器人掩码，把骨架几何投影到外部和腕部视角，生成规范视觉观测。
  3. 骨架引导WAM：使用双流DiT（Video Expert + Action Expert），通过视频预测和骨架动作生成进行联合训练。
  4. 具身特定解码：推理时，将预测的骨架动作块输入到针对目标机器人定制的解码器（刚性臂用带约束的逆运动学IK，连续体臂用分段常曲率PCC），结合运动学反馈进行滚动时域控制。
- **关键细节**: 
  - 25维状态包含：15维身体坐标（6个采样点相对TCP的归一化位置）、3维TCP位置、6维TCP方向、1维夹爪状态。
  - 模型规模：30层Video Expert + 30层Action Expert，均使用DiT块。
  - 动作块长度：预测未来32步的25维绝对骨架状态（32×25 action chunk）。
  - 训练分两阶段：Stage A联合训练视频和动作；Stage B冻结Video Expert，仅用当前帧特征条件化训练Action Expert。
- **训练/优化目标**: 
  - Stage A：视频预测损失 + 25维骨架动作损失（$\mathcal{L}_A = \lambda_v \mathcal{L}_{video} + \mathcal{L}_{action}^{25D}$）。
  - Stage B：24维几何坐标的Flow Matching损失 + 夹爪状态切换的存在性与时间性分类损失（$\mathcal{L}_B = \mathcal{L}_{flow}^{24D} + \lambda_g(\mathcal{L}_{presence} + \mathcal{L}_{timing})$）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自建基准 LIBERO-Cross10（包含10个任务，10个目标具身：9个刚性臂和1个连续体臂）。源数据为Franka Panda的467个成功演示。
  - Baselines：Diffusion Policy, $\pi_{0.5}$, OpenVLA-OFT, FastWAM, LaWAM, Mirage, RoVi-Aug。
  - 真实世界部署：源机器人 JAKA mini2，目标机器人 Feagine A03（连续体臂）。
- **评价指标**: 零样本迁移成功率（Success Rate, SR）。每个“具身-任务”组合10次试验，共评估1000个episode，计算平均成功率。
- **主要结果**: 
  - 在 LIBERO-Cross10 上，SkelWAM 取得 43.3% 的平均成功率，比表现最好的 baseline（RoVi-Aug 的 7.1%）高出 36.2 个百分点。在10个目标具身中的9个上取得最高成功率。
  - 消融实验证明，骨架视觉输入和全身动作监督是核心贡献，移除后成功率降至0%左右。
  - 在真实世界零样本部署中，JAKA mini2 训练的策略成功迁移到 Feagine A03 连续体臂上，完成了桌面清理、圆环放置和 peg 插入任务。

### 51. 🔥 [GALA: Geometry-Aware Latent Action Modeling for Vision-Language-Action Model Pretraining across Embodiments] (GALA：面向跨具身视觉-语言-动作模型预训练的几何感知潜在动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21948` | [点击跳转](https://arxiv.org/abs/2609.21948)

**0. 论文标题**
- **英文标题**: GALA: Geometry-Aware Latent Action Modeling for Vision-Language-Action Model Pretraining across Embodiments
- **中文标题**: GALA：面向跨具身视觉-语言-动作模型预训练的几何感知潜在动作建模
- **研究机构**: 原文未提及
- **一句话总结**: [领域：具身智能/机器人学习 | 类型：方法创新] 提出GALA框架，在图像潜在动作基础上引入3D末端执行器点云几何运动，并设计统一运动表示（UEMR）消除形态差异，实现了跨具身VLA预训练中细粒度手指动作的有效共享与迁移。

**1. 整体逻辑**
- **研究任务**: 跨具身（人手、灵巧手、平行夹爪等）的视觉-语言-动作（VLA）模型预训练，旨在利用异构机器人数据和无动作标签的人类视频联合训练通用操作策略。
- **研究动机**: 现有的潜在动作模型（LAMs）主要依赖RGB图像，只能捕捉末端执行器的宏观位移，丢失了细粒度的手指关节运动；而直接引入3D点云等几何信息，又会因为不同具身的形态和坐标系差异，导致学到的潜在动作缺乏跨具身的共享语义，阻碍联合预训练。
- **本质改动**: 在图像潜在动作之外，引入末端执行器的3D点云几何运动作为补充监督，并设计统一末端执行器运动表示（UEMR），强制几何潜在动作学习跨具身共享的运动语义（相对几何变化），而非静态形态或绝对坐标。
- **技术溯源**: 基于VLA预训练范式（如UniVLA, OpenVLA等），视觉编码采用冻结的DINOv2和SigLIP，点云编码采用Point Transformer V3 (PTv3)，下游策略基于GR00T架构（VLM + Flow-matching DiT）。

**2. 技术拆解**
- **核心方法**: GALA框架包含两阶段：1) 几何感知潜在动作学习：联合学习视觉和几何潜在动作，通过UEMR统一不同具身的几何表示；2) 几何感知VLA联合训练：将学到的离散潜在动作作为监督信号，通过桥接token注入VLM，并用共享DiT和特定动作头生成原生连续动作。
- **关键细节**: 
  - 点云生成：人手用WiLoR重建MANO网格后采样，机器人用URDF/MJCF正运动学计算后采样，统一为以手腕/根部为中心的1024个点的局部坐标系无序点云。
  - UEMR设计：1) 统一双臂运动潜在表示（左右手共享一个几何潜在token序列，单臂则复用）；2) 配对一致的几何增强（对起点和终点施加相同的随机3D变换，消除绝对坐标系依赖）；3) 双向转移学习（同时预测前向和后向几何转移，捕捉相对时间动态）。
  - 下游VLA：VLM输入拼接视觉和几何桥接token，自回归预测离散潜在动作；动作专家采用共享DiT处理上下文和状态，末端接特定具身的动作头输出flow-matching连续动作。
- **训练/优化目标**: 
  - 阶段一（LAM）：视觉分支的VQ重建/码本/commit损失 + 几何分支的点云Chamfer Distance (CD) 重建损失 + commit损失，前向与后向损失相加。
  - 阶段二（VLA）：潜在动作预测的交叉熵损失（视觉+几何） + 特定具身的flow-matching连续动作生成损失（L2距离）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：EgoDex, HOI4D, DROID, RoboCasa-GR1, 以及自采的XHand和人手数据（涵盖人手、Fourier手、ROBOTERA XHand、Robotiq夹爪）。
  - 对比基线：UniVLA, METIS, OPFA, Native Kinematics, 以及GALA的消融版本（w/o PC, w/o UEMR）。
  - 评估环境：细粒度动作探针测试、跨具身检索、RoboCasa-GR1仿真（24个桌面任务）、真实世界XHand机器人（4个任务）。
- **评价指标**: 
  - 探针测试：位置误差（cm）、旋转误差（度）、手指误差（度）。
  - 跨具身检索：R@1, P@5, mAP。
  - 下游任务：仿真和真实世界任务的成功率（%）。
- **主要结果**: 
  - 探针测试：GALA在位置、旋转、手指误差上均取得最低值（如手指误差7.585度，显著低于无点云版本的15.113度），证明其保留了更多细粒度运动信息。
  - 跨具身检索：GALA在“人-机器人”和“纯机器人”两个track的R@1、P@5、mAP均最优（如全track R@1达45.67%），证明其学到了跨具身共享的运动语义。
  - 仿真（RoboCasa）：多具身联合预训练下，GALA在GR-1上达到68.3%成功率，比UniVLA（53.6%）提升14.7%，比次优的UniT（66.8%）高1.5%。
  - 真实世界：在XHand上平均成功率75.5%，比HARP-VLA（71.5%）高4.0%，比π0.5（68.0%）高7.5%。

### 52. 🔥 [CommitFlow: Semantic Commitment Verification and Local Correction for Long-Horizon Robot Manipulation VLA Execution] (CommitFlow：长程机器人VLA执行中的语义承诺验证与局部纠正)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21908` | [点击跳转](https://arxiv.org/abs/2609.21908)

**0. 论文标题**
- **英文标题**: CommitFlow: Semantic Commitment Verification and Local Correction for Long-Horizon Robot Manipulation VLA Execution
- **中文标题**: CommitFlow：长程机器人VLA执行中的语义承诺验证与局部纠正
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个闭环执行框架 CommitFlow，在 VLA 模型执行长程任务时，通过验证物理前提条件（语义承诺）并生成局部动作残差进行纠正，在不改变冻结基座策略的前提下，有效防止局部偏差在阶段间传播，显著提升长程任务成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长程机器人操作任务中的执行可靠性，解决长程任务中因物理前提条件未满足就进入下一阶段导致的错误累积和任务失败问题。
- **研究动机**: 现有的 VLA 模型在长程任务中，当前阶段可能没达到预期的物理效果（比如没抓稳就松手、没对齐就放置），但策略仍会盲目推进到下一阶段。现有的异常检测和恢复方法（如重规划、重试）往往在明显失败后才介入，此时状态已经破坏，恢复难度大且容易引发连锁失败。
- **本质改动**: 把长程执行变成“验证-纠正-再验证”的闭环。在关键阶段转换前引入“语义承诺”（即物理前提条件）监控，并在不修改冻结的基座 VLA 策略的情况下，通过局部残差纠正和增益校准来修复当前阶段的局部偏差。
- **技术溯源**: 基于视觉-语言-动作（VLA）模型（如 $\pi_{0.5}$, $\pi_0$, LingBot-VLA, RDT），在 RoboTwin 2.0 仿真环境中进行验证。

**2. 技术拆解**
- **核心方法**: CommitFlow 框架包含三个核心组件：语义承诺监控（SCM）、BoundaryFlow（局部纠正模块）和关系与增益校准（RGC）。
- **关键细节**: 
  - **SCM**：用 GRU 编码历史帧（RGB-D 特征、度量关系、关节状态），预测阶段、事件和物理条件（如接触、支撑、释放）概率。根据验证结果给动作分配权限（Hold 暂停、Correct 纠正、Keep 保持）。
  - **BoundaryFlow**：在冻结的基座动作基础上预测有界的局部残差。使用低秩 SVD 基（秩为 12）限制残差方向，结合视觉特征、物体-机械臂关系和基座动作前缀进行条件生成。
  - **RGC**：利用成功执行数据离线拟合参考区域（取 P95 分位数）。运行时通过前向运动学（FK）预测不同增益下的末端状态，选择满足几何约束和动作约束的最小增益，避免纠正过度。
- **训练/优化目标**: 
  - **SCM**：阶段/事件的交叉熵损失 + 物理条件的二元交叉熵损失。
  - **BoundaryFlow**：系数回归损失 + 纠正动作损失 + 流匹配去噪损失 + 几何收缩损失（惩罚终端误差和进度不足） + 零纠正正则化（名义状态下惩罚非零残差）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 RoboTwin 2.0 仿真环境的 11 个长程交互任务（如 Handover Block, Object Basket 等）和 2 个真实机器人任务上测试。Baseline 包括 RDT、$\pi_{0.5}$、$\pi_{0.5}$+TACO、$\pi_{0.5}$+CAPS，以及跨策略的 $\pi_0$ 和 LingBot-VLA。消融实验对比了逆运动学（IK）纠正。
- **评价指标**: 任务成功率（每个任务 100 次试验，随机场景）。
- **主要结果**: 
  - 在 RoboTwin 2.0 的 10 个常见任务上，CommitFlow（基于 $\pi_{0.5}$）平均成功率达 75.9%，比基线 $\pi_{0.5}$（53.2%）提升 22.7%，优于 TACO（58.7%）和 CAPS（61.5%）。
  - 跨策略实验显示，在 $\pi_0$ 和 LingBot-VLA 上也有显著提升（如 LingBot-VLA 平均从 81.4% 提升至 86.6%）。
  - 消融实验表明，局部纠正（Ours）平均成功率 80.0%，优于直接重查询基线（66.8%）和基于 IK 的纠正（69.0%）。
  - 纠正复用实验表明，在 Handover Block 上训练的纠正头可以直接复用到 Handover Mic 上（成功率从 58% 提升至 65%）。
  - 真实机器人实验中，黑板擦放置成功率从 50% 提升至 63%，堆叠三个碗从 40% 提升至 50%。

**0. 论文标题**
- **英文标题**: A Sim-to-Real Integration Pipeline for Training and Deployment of Chunk-Based VLA Manipulation Policies
- **中文标题**: 面向基于Chunk的VLA操作策略训练与部署的Sim-to-Real集成流水线
- **研究机构**: 原文未提及（代码库域名显示为 ISIR, Sorbonne University）
- **一句话总结**: 提出了一套开源的Sim-to-Real流水线，通过在真实机器人上开环重放仿真专家轨迹来零成本收集VLA训练数据，并利用轨迹一一对应关系在物理层面直接量化Sim-to-Real gap。

**1. 整体逻辑**
- **研究任务**: [领域：具身智能/机器人学；类型：系统工程] 解决VLA（视觉-语言-动作）模型训练数据收集成本高（依赖人工遥操作）的问题，以及现有方法难以精确量化Sim-to-Real物理差距（gap）的问题。
- **研究动机**: 现有的真实世界VLA数据集多靠人工遥操作，难以扩展且质量受限于操作员；现有的Sim-to-Real评估通常只看最终任务成功率，把策略质量、感知误差和物理不匹配混为一谈，无法定位误差的具体根源。
- **本质改动**: 把仿真里生成的专家轨迹直接“开环”搬到真实机器人上重放，同时记录真实的视觉和本体数据。这样既零成本获取了带仿真专家动作标签的真实数据，又因为真实执行和仿真轨迹严格对齐，能直接在轨迹级别算出物理gap，且复用同一套软硬件栈进行闭环策略评估。
- **技术溯源**: 基于预测Action Chunk的VLA模型范式（如Diffusion Policy），仿真器使用PyBullet，硬件使用Franka FR3机械臂和Orbec相机，软件架构基于ROS 2，验证基线模型为ORCHID。

**2. 技术拆解**
- **核心方法**: 构建了一套包含数据收集（开环重放）和策略评估（闭环推理）的统一ROS 2部署栈。核心在于将仿真中的相对Action Chunk转换为真实机器人基坐标系下的绝对目标位姿序列，并在两个世界共享同一坐标系原点以实现轨迹级对比。
- **关键细节**: 
  - **环境对齐**：仿真与真实世界共享同一世界坐标系原点，相机视角对齐。初始物体位置通过把真实机械臂当“笛卡尔指针”来对齐，误差约3.4cm。
  - **动作空间**：VLA输出大小为 $k$ 的action chunk，包含末端执行器在 $SE(3)$ 空间的相对位移和夹爪开合状态。
  - **坐标转换**：通过累积相对位移，将仿真的相对动作chunk转换为真实机器人基坐标系下的绝对目标位姿序列（$f_{chunk2traj}$）。
  - **控制执行**：使用MoveGroup在关节空间进行路径规划，笛卡尔路径按1cm最大步长插值，采用高增益关节位置控制器。夹爪状态变化时暂停轨迹执行。
- **训练/优化目标**: 本文非模型训练工作。核心机制为：1) **开环重放机制**：无需真实观测，将仿真相对Action Chunk通过累积位移转换为真实绝对位姿序列执行，并记录真实多模态数据；2) **闭环推理机制**：基于真实视觉反馈，在线预测Action Chunk并执行。

**3. 实验结果**
- **实验设置**: 
  - **任务与数据**：推方块任务（向左/向右推红/蓝方块）。生成并重放200条仿真专家轨迹（每任务50条），chunk size $k=8$，每条轨迹8个chunks（共64个动作）。
  - **策略评估**：在收集的200条真实数据上从头训练ORCHID模型，并在20次闭环试验中评估（每任务5次，目标方块随机放置）。
- **评价指标**: 
  - **Sim-to-Real Gap**：末端执行器路径平均偏差（Average eef path deviation）、离散Fréchet距离（衡量最大偏差）。
  - **任务表现**：任务成功率（Task success rate）。
- **主要结果**: 
  - **Sim-to-Real Gap量化**：200条重放轨迹的平均路径偏差小于1cm（0.93 cm），最大偏差（Fréchet距离）为3.30 cm。偏差主要集中在“接触阶段”，说明gap主要来自未建模的接触物理效应（如物体质量、桌面摩擦），而非全局漂移。重放任务成功率100%。
  - **VLA策略评估**：ORCHID模型在20次测试中成功6次（各任务成功率分别为3/5, 2/5, 1/5, 0/5）。作者指出，由于重放成功率是100%且物理偏差很小，有限的闭环成功率不太可能是物理gap导致的，更可能是因为单任务训练数据量太少（仅50条）以及收集与评估时的视觉环境（光照、阴影）存在差异。该实验仅作为部署可行性的概念验证。

### 54. 🔥 [Compact but Moving: Intervention-Relevant Geometry in Recurrent World Models] (紧凑但移动：循环世界模型中与干预相关的几何结构)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21787` | [点击跳转](https://arxiv.org/abs/2609.21787)

**0. 论文标题**
- **英文标题**: Compact but Moving: Intervention-Relevant Geometry in Recurrent World Models
- **中文标题**: 紧凑但移动：循环世界模型中与干预相关的几何结构
- **研究机构**: 原文未提及
- **一句话总结**: 揭示了循环世界模型中紧凑的反事实干预进入高维隐状态后，并非停留在固定的低维子空间，而是随着动态演化形成一种移动的、状态依赖的局部几何结构。

**1. 整体逻辑**
- **研究任务**: 分析循环世界模型（如 GRU/LSTM）中反事实干预信号进入高维隐状态后的几何演化与动力学行为。
- **研究动机**: 现有的循环世界模型即使隐状态维度很高，也能表现出紧凑的干预特性（例如前人发现的特定 checkpoint 下用于单次反事实速度干预的 rank-4 接口）。但研究者不清楚这种紧凑的修正信号进入模型后，在后续的自主 rollout 中是如何演化的，是否一直保持在固定的低维入口子空间内。
- **本质改动**: 打破“干预紧凑性等同于固定或动态封闭的低维状态”的直觉，证明干预结构实际上是顺着雅可比链“移动”的，表现为一种状态依赖的局部几何，且这种移动的几何依然能捕获大部分非线性修正。
- **技术溯源**: 基于 structured-GRU 模型和 parameter-matched LSTM 模型。

**2. 技术拆解**
- **核心方法**: 利用事实循环雅可比链（factual recurrent Jacobian chain）对入口方向进行传输（transport），计算低秩图像以捕获非线性修正；构建有限视界未来响应算子（finite-horizon future-response operator）来表征整个循环载体上的未来响应，并通过 patching 技术分析其方向变化。
- **关键细节**: 研究对象为独立训练的 structured-GRU 模型，以及一个使用特权紧凑修正初始化的 parameter-matched LSTM。重点分析了特定 checkpoint 下 rank-4 干预接口的几何演化，并在 3 个不同的 checkpoint 上进行了全振幅测试（full-amplitude assay）。
- **训练/优化目标**: 原文未提及（本文侧重于对已训练好的循环世界模型进行机制和几何分析，而非提出新的训练目标）。

**3. 实验结果**
- **实验设置**: 使用独立训练的 structured-GRU 模型和 parameter-matched LSTM 模型，在 3 个模型 checkpoint 上进行几何与动力学评估。
- **评价指标**: 评估切线预测修正（tangent-predicted correction）保留反事实未来功能的程度；评估局部算子对有限扰动效应排序的准确性；评估事实端点切线残差（factual-endpoint tangent residuals）。
- **主要结果**: 
  1. 尽管干预信号迅速离开固定的入口子空间，但通过雅可比链传输得到的切线预测修正，依然保留了大量的反事实未来功能。
  2. 这种“传输/功能”模式在独立训练的 structured-GRU 和 parameter-matched LSTM 中均稳定复现。
  3. Patching 操作使得未来敏感的主导方向向匹配的原生反事实组织偏移，且局部算子能够准确排序在 patched 和原生反事实基点处的有限扰动效应。
  4. 全振幅测试发现了明显的事实端点切线残差，并支持在 3 个 checkpoint 中的 2 个上进行响应重构（response reconfiguration）。

### 55. 🔥 [Scaling Vision-Language Reward Learning for Robot Manipulation in Parallel Simulation] (在并行仿真中扩展机器人操作的视觉语言奖励学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21767` | [点击跳转](https://arxiv.org/abs/2609.21767)

**0. 论文标题**
- **英文标题**: Scaling Vision-Language Reward Learning for Robot Manipulation in Parallel Simulation
- **中文标题**: 在并行仿真中扩展机器人操作的视觉语言奖励学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RAPID 系统，通过协同 GPU 并行仿真与 VLM 反馈调度（单次提示、自适应更新、奖励稳定早停、代表性采样），将基于 VLM 的机器人在线奖励学习训练时间缩短 8 倍，API 调用减少 95.5%，同时提升任务成功率。

**1. 整体逻辑**
- **研究任务**: [领域：机器人学习/强化学习；类型：系统工程/方法创新] 在机器人操作任务中，使用视觉语言模型（VLM）替代人工进行基于偏好的在线奖励学习（Preference-based reward learning）。
- **研究动机**: 现有方法（如 RL-VLM-F）依赖单环境收集和两阶段 VLM API 请求，导致训练极慢且 API 成本高昂。即使引入 GPU 并行仿真加速数据收集，也会带来数据冗余（相似图像多）、策略更新与数据收集比例失衡、以及 VLM 查询瓶颈等问题，无法真正加速奖励学习闭环。
- **本质改动**: 将原本割裂的“并行数据收集”与“串行 VLM 反馈”进行系统级协同，通过单次请求提示、基于预测稳定性的早停机制以及去重采样，大幅削减无效的 VLM 调用并加速策略收敛。
- **技术溯源**: 基于 RL-VLM-F（偏好学习框架）、PEBBLE（经验重标记）、IsaacLab（并行仿真环境）、SAC（策略优化算法）。

**2. 技术拆解**
- **核心方法**: 提出 RAPID (Reward learning with Adaptive Parallel Image Diversity) 系统，包含四个协同组件：1) 并行 Rollout 与自适应策略更新；2) 单次请求 VLM 标注；3) 自动奖励稳定监控；4) 代表性图像采样。
- **关键细节**: 
  - **并行与自适应更新**：在 50 个并行环境中收集数据，维护一个分数更新预算（fractional update budget），根据新收集的转移数量按比例分配 SAC 更新次数，防止 off-policy 网络出现首要偏差（primacy bias）。
  - **单次请求标注**：将原本“先分析图像、后输出标签”的两阶段 API 调用合并为一次请求，直接输出三分类偏好标签（0, 1, -1），API 调用减半。
  - **自动奖励稳定**：维护一个锚点图像集，每次更新奖励模型后计算预测分数的 Pearson 相关系数和绝对变化量。当连续两次满足高相关（≥0.99）且低变化（≤0.025）时，判定奖励模型收敛，冻结奖励模型并停止 VLM 查询，策略使用冻结奖励继续训练。
  - **代表性采样**：使用贪心最远点采样（基于 16x16 灰度图特征），从最近 5000 张候选图中挑选 50 张差异最大的图像送入 VLM，避免标注高度相似的冗余图像。
- **训练/优化目标**: 
  - **奖励模型**：基于 Bradley-Terry 模型，使用 3 个 CNN 组成的集成网络，通过最小化预测偏好分布与 VLM 标签之间的二元交叉熵来训练。
  - **策略模型**：使用 SAC 算法，以集成奖励模型的均值作为奖励信号进行策略优化。

**3. 实验结果**
- **实验设置**: 
  - **环境/数据集**：IsaacLab 中的 5 个 Franka Panda 操作任务（Open Drawer, Open Window, Push Button, Soccer, Sweep Into），基于 MetaWorld 改编。
  - **Baseline**：单环境、两阶段提示的 RL-VLM-F 实现（C1）。
  - **VLM**：训练使用 Gemma 3 12B，离线评估使用 GPT-4.1 mini。
- **评价指标**: 最终任务成功率（Final success %）、训练墙钟时间（Wall-clock time）、API 调用次数（API calls）。
- **主要结果**: 
  - **效率提升**：完整系统（C5）将平均训练时间从 9.18 小时降至 1.15 小时（8.0 倍加速）；API 调用从 19,840 次降至 896 次（减少 95.5%）。
  - **性能提升**：5 个任务的平均最终成功率从 86.3% 提升至 98.7%。
  - **消融分析**：并行环境 + 自适应更新带来 2.9 倍加速；单次提示、稳定早停和代表性采样进一步将时间从 2.74 小时压缩至 1.15 小时，调用次数从 9,920 降至 896。离线评估表明，单次提示在 GPT-4.1 mini 上准确率更高且更便宜，在 Gemma 上则存在准确率与效率的权衡。

### 56. 🔥 [Sandwich-Residuals: Parameter-Efficient Test-time Adaptation of World Models] (三明治残差：世界模型的参数高效测试时适应)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21740` | [点击跳转](https://arxiv.org/abs/2609.21740)

**0. 论文标题**
- **英文标题**: Sandwich-Residuals: Parameter-Efficient Test-time Adaptation of World Models
- **中文标题**: 三明治残差：世界模型的参数高效测试时适应
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种“三明治残差”方法，通过在世界模型预测器的输入输出端插入轻量级残差模块进行在线更新，在完全冻结预训练权重的前提下实现高效的测试时适应，大幅减少需更新的参数量。

**1. 整体逻辑**
- **研究任务**: 解决潜在世界模型（Latent world models）在测试时遭遇分布偏移（如外观变化、动力学变化）时预测失效的问题，实现高效的测试时适应（Test-time adaptation），以提升基于模型的预测控制（MPC）性能。
- **研究动机**: 现有的测试时适应方法（如 AdaJEPA）通过微调预训练模型的内部组件（如预测器块或编码器投影头）来纠正偏移。这需要更新数百万参数，计算开销大，容易破坏预训练表征，且需要人工选择具体更新哪些层。
- **本质改动**: 不修改预训练世界模型（编码器和预测器）的任何内部权重，仅在预测器的输入和输出接口处添加轻量级的残差模块（形成“三明治”结构），仅在线更新这些极少量的残差参数。
- **技术溯源**: 基于联合嵌入预测架构（JEPAs），具体使用了 AdaJEPA 和 DINO-WM 的预训练检查点与环境；视觉编码器底层依赖 ResNet（AdaJEPA中）和 DINOv2（DINO-WM中）。

**2. 技术拆解**
- **核心方法**: 在冻结的预测器前后插入可学习的残差模块。输入端残差用于修正视觉和动作嵌入（动作残差结合本体感受信息，以应对动力学偏移）；输出端残差用于修正预测器输出的视觉和本体感受潜在表示。利用模型自身的自监督潜在预测误差在线优化这些残差。
- **关键细节**: 
  - **网络结构**：视觉残差为两层 MLP（384->64->384），动作和本体感受残差为线性映射。
  - **参数规模**：AdaJEPA 中约 9.95 万参数（仅占原方法更新参数的 1.0%–2.7%），DINO-WM 中约 9.93 万参数（占 3.1%）。
  - **初始化与更新**：线性残差初始化为 0，MLP 末层初始化为极小方差，确保初始状态等同于冻结模型。每个“规划-执行”周期后，利用最近 5 个转移数据（transition）计算损失，通过 Adam 更新一次残差参数。
- **训练/优化目标**: 自监督潜在预测损失（Latent prediction loss）。计算预测的潜在表示与目标（由真实观测编码得到，且停止梯度 stop-gradient）之间的均方误差（MSE）。无需奖励、标签或源域数据。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：AdaJEPA 基准（包含 Medium Maze, Diverse Maze, PushT, PushObj 4个任务，涵盖 21 种主要偏移和 7 种复合偏移）；OGBench-Cube（3D 机械臂操作，使用 DINO-WM）。
  - **对比对象（baseline）**：Frozen（冻结模型无适应）；AdaJEPA 变体（`predlast+enclast` 更新最后一个预测器块及投影头，`predfirst+enclast` 更新第一个预测器块及投影头）。
- **评价指标**: 任务成功率（Success rate, %）。
- **主要结果**: 
  - 在 AdaJEPA 的 21 种主要条件下，本方法平均成功率 65.0%，比 Frozen（49.2%）提升 1.3 倍，与最强 baseline `predfirst`（68.2%）差距在 3.2% 以内，但仅更新其 1%–3% 的参数。
  - 在 7 种复合偏移下，成功率比 Frozen 提升 1.9 倍，与 `predfirst` 表现相当。
  - 在 DINO-WM (OGBench-Cube) 的 3 种测试偏移下，本方法是唯一在所有偏移条件下均优于 Frozen 模型的适应方法。
  - 消融实验表明，不同环境的主导修正路径不同（如 Medium Maze 主要依赖输出端修正，PushT 需要输入输出联合修正），证明了“三明治”全配置的必要性。

### 57. 🔥 [Outcome-Conditioned End-Effector Geometry Across Vision-Language-Action Policies] (跨视觉-语言-动作策略的基于结果条件的末端执行器几何分析)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21659` | [点击跳转](https://arxiv.org/abs/2609.21659)

**0. 论文标题**
- **英文标题**: Outcome-Conditioned End-Effector Geometry Across Vision-Language-Action Policies
- **中文标题**: 跨视觉-语言-动作策略的基于结果条件的末端执行器几何分析
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于联合任务结果条件化的跨VLA策略末端执行器轨迹对比方法，发现双成功策略对的物理轨迹高度相似且主要由任务决定，但低轨迹距离并不意味着策略在物理执行上可互换。

**1. 整体逻辑**
- **研究任务**: 评估和对比不同视觉-语言-动作（VLA）策略在相同任务配置下，物理执行轨迹（末端执行器路径）的几何差异。
- **研究动机**: 现有的VLA评估几乎只看“任务成功率”，但这掩盖了物理执行的差异。两个成功率相同的策略可能走完全不同的路径，直接替换策略会暗中改变机器人的运动和工作空间使用，且无法反映异构VLA管线是否收敛到相似的物理路径。
- **本质改动**: 摒弃单一的成功率指标，引入“联合结果条件化（outcome-conditioned）”的成对轨迹对比设计。通过动态时间规整（DTW）量化不同策略在相同配置下末端执行器路径的几何距离，并按双成功、混合、双失败进行分层分析，从而揭示结果与物理轨迹一致性之间的关联。
- **技术溯源**: 基于 LIBERO-Spatial 仿真环境；对比的基座策略包括 OpenVLA, OpenVLA-OFT (OFT), UniVLA, 和 $\pi_{0.5}$；使用动态时间规整（DTW）算法计算轨迹距离。

**2. 技术拆解**
- **核心方法**: 构建配置匹配（任务、初始状态、指令、视觉条件完全相同）的策略对，计算其末端执行器位置序列的归一化DTW距离。将策略对按联合结果划分为双成功（SS）、混合（SF）和双失败（FF）三个分层。引入成功状态替换控制（同任务换状态、跨任务换任务）和同策略基线，以剥离任务几何约束和策略自身方差的影响。
- **关键细节**: 
  - **输入输出**：输入为图像和任务指令，输出为机器人动作。提取执行过程中的末端执行器位置序列（每5步采样一次）。
  - **模型与规模**：测试了4种VLA策略，在LIBERO-Spatial的10个任务、20个初始状态、3种指令模板和5个视觉级别下收集了15,000次闭环rollouts，形成3,600个配置匹配的策略对。
  - **关键设置**：DTW计算时局部代价为L2距离，归一化分母为序列长度之和；视觉压力测试设置了L0-L4五个等级，叠加了亮度缩放、高斯像素噪声、平移和掩码等复合干扰。
- **训练/优化目标**: 本文非训练类工作，核心机制为基于DTW的轨迹几何距离计算与条件化分层统计分析。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：LIBERO-Spatial 仿真环境（10个任务，每个任务20个初始状态）。
  - **对比对象（baseline）**：四种VLA策略（OpenVLA, OpenVLA-OFT, UniVLA, $\pi_{0.5}$）。
- **评价指标**: 归一化动态时间规整（DTW）距离（单位：米），用于衡量末端执行器位置轨迹的几何差异；任务成功率。
- **主要结果**: 
  - 双成功（SS）策略对的轨迹距离中位数（0.0120 m）显著小于混合结果（SF）对（0.0380 m），该排序在所有任务、策略对和9种对齐表示中均稳定成立。双失败（FF）距离更大（0.0439 m），但样本量小且不稳定，仅作为探索性结果。
  - 控制实验表明，成功轨迹的相似性主要是“任务相关”的（同任务不同状态距离为0.0157 m，跨任务距离激增至0.0817 m）。
  - 同策略基线显示，跨策略差异仍大于同策略内不同状态的差异（存在残差策略差异），说明低跨策略距离不代表策略可互换。
  - 在复合视觉压力（L0-L4）下，策略的成功率排名发生改变（例如在L3级别时OFT的成功率超过UniVLA），且SS样本的组成和距离也随之变化，表明视觉压力会同时改变策略性能和对比群体的构成。

### 58. 🔥 [Adaptive Rollout Truncation Based on Epistemic Uncertainty for Efficient Offline World Model Training] (基于认知不确定性的自适应展开截断用于高效离线世界模型训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21482` | [点击跳转](https://arxiv.org/abs/2609.21482)

**0. 论文标题**
- **英文标题**: Adaptive Rollout Truncation Based on Epistemic Uncertainty for Efficient Offline World Model Training
- **中文标题**: 基于认知不确定性的自适应展开截断用于高效离线世界模型训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于认知不确定性的自适应 rollout 截断机制，在离线训练循环世界模型时，根据模型预测的置信度动态决定展开步数，在保持长程预测精度的同时大幅降低了计算开销。

**1. 整体逻辑**
- **研究任务**: 离线训练用于机器人控制的循环神经网络世界模型（Recurrent Neural World Models）。
- **研究动机**: 多步自回归训练（autoregressive multi-step prediction）能让模型学习长期依赖，但固定 rollout 长度在训练早期模型不准时会放大误差（compounding error），且浪费算力。现有方法从头到尾使用固定的 rollout 长度，没有根据模型当前的预测可靠性进行动态调整。
- **本质改动**: 把固定的 rollout 长度改成由“认知不确定性”动态控制的自适应截断。模型预测不准（不确定性高）时就提前截断，准的时候就展开长一点，从而在训练过程中实现一种自动的课程学习（auto-curriculum）。
- **技术溯源**: 基于 Li et al. 提出的循环世界模型（RWM / RWM-U），底层使用 GRU 骨干网络。

**2. 技术拆解**
- **核心方法**: 在自回归预测过程中实时估计认知不确定性（对比了 5-head Ensemble 和 MC Dropout 两种估计器）。设定一个通过 warm-up 阶段校准的阈值，当展开步数超过最小步数（$h_{min}=4$）且不确定性超过阈值时，立即终止当前 rollout，只用前面可靠的预测步数来计算 loss。
- **关键细节**: 
  1. 模型结构：共享 GRU backbone，接 5 个独立的 MLP 预测头（Ensemble）或带 Dropout 的 MLP（MC Dropout）。
  2. 阈值校准（Anchor 机制）：在 warm-up 阶段最后 10 次迭代，记录特定预测步数 $k$（如 anchor@2 的 $k=2$）处的不确定性中位数，作为截断阈值 $T$。
  3. 两阶段 Warm-up：先做 50 次单步 bootstrap 训练（学局部动力学），再做 10 次全长度 rollout 训练，之后才开启自适应截断，避免早期不确定性估计失效。
- **训练/优化目标**: 最小化截断前有效预测步数的状态预测均方误差（MSE/RMSE）。通过截断不可靠的长程预测来净化训练信号。

**3. 实验结果**
- **实验设置**: 
  1. 数据集：ANYmal-D（四足机器人，Isaac Lab 收集，约600万转移）和 ANT（MuJoCo 收集，约600万转移），均为离线轨迹数据。
  2. Baseline：RWM-U（Li et al. 的重实现）、fixed-32（固定32步展开）、fixed-8（固定8步展开）。
- **评价指标**: 验证集上的 32步和 160步 RMSE（衡量预测精度），累积 rollout 步数和 FLOPs（衡量计算效率）。
- **主要结果**: 
  1. 精度与算力双赢：在 ANYmal-D 上，Adaptive anchor@2 (Ensemble) 达到了与 fixed-32 和 RWM-U 相当甚至更好的预测精度（32步 RMSE 0.288 vs 0.314/0.321；160步 RMSE 0.389 vs 0.429/0.419）。同时，累积 rollout 步数减少 72%（924步 vs 3250步），FLOPs 减少 70%（18.0 PFLOP vs 60.2 PFLOP）。
  2. 长程预测更稳：相比 fixed-8，adaptive 方法在短步预测上稍逊，但在 160 步长程预测上误差增长更平缓，避免了 fixed-8 在超出训练步数后的误差崩溃。
  3. 不确定性估计器对比：MC Dropout 效果不如 Ensemble，仅在 dropout rate=0.8 时才能有效触发截断，且引入了额外超参，因此 Ensemble 是更优选择。

### 59. 🔥 [Robotic Multiphase Interaction: Manipulating Coupled Liquid and Solid Dynamics with a World Model] (机器人多相交互：利用世界模型操纵耦合的液体与固体动力学)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21448` | [点击跳转](https://arxiv.org/abs/2609.21448)

**0. 论文标题**
- **英文标题**: Robotic Multiphase Interaction: Manipulating Coupled Liquid and Solid Dynamics with a World Model
- **中文标题**: 机器人多相交互：利用世界模型操纵耦合的液体与固体动力学
- **研究机构**: 原文未提及
- **一句话总结**: 提出机器人多相交互（RMI）设定，通过构建多孔介质流固耦合仿真环境与动作条件世界模型，实现机器人对吸液海绵等复杂多相物体的精准挤压与状态预测。

**1. 整体逻辑**
- **研究任务**: 机器人对内部包含液体的多孔材料（如吸满水的海绵）进行物理操作（抓取、挤压、抬起），预测并控制其内部液体保留量与固体骨架的耦合状态变化。
- **研究动机**: 现有的机器人操作主要针对纯固体（刚体或可变形体），或液固空间分离的任务（如倒水、擦拭）。当液体存在于多孔固体内部时，挤压会改变孔隙体积并排出液体，同时影响抓取稳定性，现有方法无法描述这种空间重叠且机械耦合的多相交互过程。
- **本质改动**: 将操作对象从单一固体或空间分离的液固组合，拓展为空间重叠、力学耦合的“多孔固-液多相系统”，并引入动作条件世界模型来预测这种复杂耦合状态在机器人指令下的演化。
- **技术溯源**: 隐式不可压缩多孔流平滑粒子流体动力学（Implicit Incompressible Porous Flow with SPH）、Diffusion Policy、Rectified Flow Matching、Temporal UNet、GRU、Transformer。

**2. 技术拆解**
- **核心方法**: 
  1. **构建RMI仿真环境**：基于SPH物理引擎，增加机器人交互层，包括带接触记忆的库仑摩擦、混合速度-力控制器、以及判断抓取是否稳定的抬起门控（Stability gate）。
  2. **定义紧凑交互状态**：提取液固相变量、夹爪负载、接触状态和残余滑动等特征，替代高维的粒子状态，作为学习模型的输入。
  3. **训练动作条件世界模型（AC-GRU-WM）**：基于GRU架构，输入历史状态和动作序列，预测未来多相状态（连续变量、接触概率、摩擦类别）的演化。
  4. **策略生成与模型预测控制**：使用Temporal UNet生成多个候选动作序列，再用因果Transformer作为打分器，根据世界模型预测的终端状态选出最优动作。
- **关键细节**: 
  - **输入/状态**：包含18个连续变量（液体质量、饱和度、孔隙体积、海绵体积、夹爪宽度、受力、接触面积等）、1个接触指示器、4类摩擦状态。动作包含目标力和指令速度。
  - **模型结构**：世界模型采用2层、宽度128的GRU；策略网络采用通道宽度64/128/256的Temporal UNet；打分器采用宽度256、8头注意力、3层编码器+4层解码器的因果Transformer。
  - **规模与超参**：历史窗口 $L=16$，预测步长 $H=64$（对应1.28秒，时间步长20ms）。
- **训练/优化目标**: 
  - **世界模型**：Huber Loss（连续状态残差） + BCE Loss（接触概率） + CE Loss（摩擦类别），带时间衰减权重，训练时逐渐减少Teacher forcing。
  - **策略网络**：Diffusion Policy使用DDIM采样和余弦调度；Rectified Flow Matching使用Euler步预测速度场。
  - **打分器**：重点优化保留水质量的MAE，并结合峰值力、滑动概率和动作平滑度进行综合打分。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：基于SPH构建的仿真环境，测试3种尺寸（8, 10, 12 cm）和3种孔隙率（0.5, 0.6, 0.7）的海绵。收集了594条轨迹，其中410条稳定轨迹用于训练。
  - **对比对象（Baseline）**：最新状态传递（Baseline）、无动作输入的State-GRU-WM、Lookahead Linear-ARX、AC-MLP-WM。
- **评价指标**: 保留水质量MAE（克）、测量力MAE（牛顿）、摩擦类别平衡准确率（Balanced Accuracy）、预测终端水误差。
- **主要结果**: 
  - **世界模型预测**：在小号和中号海绵上，AC-GRU-WM相比Baseline将保留水预测误差降低了60%以上（例如8cm海绵从12.23g降至4.32g），同时提升了摩擦分类准确率。但在12cm大海绵上提升不明显（原文指出大尺寸下动作效应难以从轨迹中分辨）。
  - **动作选择**：通过Transformer打分器从8个候选动作中挑选，Flow Matching和Diffusion Policy生成的动作经挑选后，预测终端水误差进一步降低了约一半（例如10cm海绵从4.28g降至2.24g），验证了世界模型在复杂多相交互中的规划价值。

### 60. 🔥 [FAN: Foresight Action Normalization for Continual Adaptation of Vision-Language-Action Models] (FAN：面向视觉-语言-动作模型持续适应的前瞻动作归一化)
- **研究机构**: `香港大学 (HKU)`
- **Arxiv ID**: `2609.21358` | [点击跳转](https://arxiv.org/abs/2609.21358)

**0. 论文标题**
- **英文标题**: FAN: Foresight Action Normalization for Continual Adaptation of Vision-Language-Action Models
- **中文标题**: FAN：面向视觉-语言-动作模型持续适应的前瞻动作归一化
- **研究机构**: 香港大学 (HKU)
- **一句话总结**: 这篇工作指出VLA模型在持续学习时，动作归一化统计量的更新会导致严重的坐标漂移和性能崩溃，提出在预训练后用少量任务无关数据一次性算好归一化参数并全程冻结（FAN），大幅提升了持续适应的效果和鲁棒性。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在真实机器人操作中的持续适应（Continual Adaptation），即让预训练模型顺序学习新任务，同时避免灾难性遗忘。
- **研究动机**: 现有的持续VLA学习工作（如经验回放、参数高效微调等）都忽略了“动作归一化”这个基础细节。在持续学习中，如果随着新数据更新归一化统计量，会导致模型输出的物理意义发生偏移（坐标漂移）；如果只用第一个任务或当前任务的统计量，又会导致运动范围覆盖不够，或者训练和测试时的坐标系对不上，直接引发严重的失败模式。
- **本质改动**: 把动作归一化统计量的计算与下游具体任务解耦。在持续学习开始前，用少量任务无关的校准数据一次性算好统计量，并在整个持续微调和推理过程中将其冻结，为策略提供一个固定、统一且覆盖合理的动作坐标系。
- **技术溯源**: 基于 VLA 模型（如 OpenVLA 和 $\pi$ 系列使用的基于百分位数的归一化方法），以及持续学习中的经验回放（Experience Replay）机制。基座模型使用了 $\pi_{0.5}$。

**2. 技术拆解**
- **核心方法**: 提出前瞻动作归一化（Foresight Action Normalization, FAN）。遵循一致性、覆盖性、因果性（3C）原则。具体做法是：在任务流开始前，先手动分析预期场景提取运动原语，收集少量（如8条）任务无关的遥操作轨迹作为校准集。基于该校准集计算动作和状态的1st与99th百分位数统计量，然后在后续所有阶段的训练、回放和推理中，全程冻结使用这组统计量。
- **关键细节**: 
  - **输入输出**：输入为多视角RGB图像（480×640, 30Hz），输出为14维混合动作（每臂6维关节增量+1维绝对夹爪目标，双臂共14维）。
  - **模型与架构**：基座为预训练VLA模型 $\pi_{0.5}$。持续学习阶段结合经验回放（ER），回放缓冲区容量设为单任务数据量的20%，采样概率为20%。
  - **校准集**：8条遥操作轨迹，覆盖预期的工作空间、运动方向、手腕动作和双臂协调等，不包含下游任务指令或特定物体。
- **训练/优化目标**: 行为克隆损失（Action-prediction loss），即最小化预测动作与专家演示动作之间的误差。持续学习阶段联合优化当前任务数据和回放缓冲区数据。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：真实机器人平台（双臂 PiPER-X 6-DoF，4个 RealSense D435 相机）。自建了5个单臂任务和5个双臂任务，组成4个任务流（单臂2个流，双臂2个流，每个流包含5个任务，且单臂/双臂各有两种不同的任务顺序）。
  - **对比对象（baseline）**：4种基于任务数据的归一化策略（ANS-I: 各任务独立统计量；ANS-II: 始终使用第一个任务的统计量；ANS-III: 训练用各任务统计量，测试用第一个任务统计量；ANS-IV: 动态更新当前任务与回放数据的联合统计量），以及提出的 FAN。
- **评价指标**: 
  - **平均得分（AS）**：最终检查点在5个任务上的平均得分。
  - **反向迁移（BWT）**：衡量对过去任务的保留程度（负值表示遗忘）。
  - **前向迁移（FWT）**：衡量过去任务对后续任务学习的促进作用。
- **主要结果**: 
  - FAN 取得了最高的平均得分（AS=95.3），显著优于最强基线 ANS-II（AS=77.0）和其他策略。
  - FAN 在所有4个流中均实现了正的前向迁移（平均FWT=9.1），且反向迁移接近0（平均BWT=0.1），说明既学好了新任务，又没忘记旧任务。
  - 任务顺序敏感性极低：FAN在不同任务顺序下的得分平均绝对差异仅为4.2分，远低于基线的17.5~48.5分。
  - 覆盖度消融实验证明，归一化范围既不能太窄（导致后续动作被放大），也不能太宽（导致有效变化被压缩），FAN的校准集范围匹配度最好。

### 61. 🔥 [FOCAL-VLA: Subtask-Guided Geometry Distillation and Implicit World Modeling for Vision-Language-Action Models] (FOCAL-VLA：用于视觉-语言-动作模型的子任务引导几何蒸馏与隐式世界建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21228` | [点击跳转](https://arxiv.org/abs/2609.21228)

**0. 论文标题**
- **英文标题**: FOCAL-VLA: Subtask-Guided Geometry Distillation and Implicit World Modeling for Vision-Language-Action Models
- **中文标题**: FOCAL-VLA：用于视觉-语言-动作模型的子任务引导几何蒸馏与隐式世界建模
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机器人学/视觉-语言-动作（VLA）模型的方法创新，提出在训练时将几何与未来运动的特征蒸馏严格限制在当前子任务相关的实体区域内，从而增强模型的空间与时间理解，且推理时无需额外3D输入或教师模型。

**1. 整体逻辑**
- **研究任务**: 提升VLA模型在精确和长程机器人操作任务中的表现，解决模型缺乏足够空间和时间理解的问题。
- **研究动机**: 现有方法通过全场景的几何监督或未来状态预测来增强VLA，但这会引入大量与当前交互无关的冗余场景信息，分散模型注意力。此外，随着任务推进，所需关注的实体和动态是动态变化的（例如：把物体放进抽屉需要理解物体与抽屉的空间关系，而关上抽屉则需要预测抽屉的运动），全图或全任务级别的监督无法适应这种动态变化。
- **本质改动**: 将几何知识和未来运动知识的蒸馏范围从“全图/全任务”缩小并动态聚焦到“当前子任务相关的实体区域”，通过两个独立的隐变量分支分别捕获当前空间结构和未来交互动态，共同指导动作生成。
- **技术溯源**: 基于 $\pi_{0.5}$（VLA基座模型，底层为 PaliGemma），使用 VGGT（3D几何教师模型）和 Track4World（3D运动/场景流教师模型）。

**2. 技术拆解**
- **核心方法**: 提出子任务引导的几何蒸馏和基于未来信息的隐式世界建模（运动蒸馏）。在VLA骨干网络中引入两组可学习的Query Token，分别通过注意力机制提取几何隐变量和未来运动隐变量。利用离线标注的子任务实体Mask，对冻结教师模型的特征进行局部池化作为蒸馏目标。
- **关键细节**: 
  - **输入输出**：输入为多视角图像、任务指令、本体状态；输出为动作chunk。
  - **模型结构**：在 $\pi_{0.5}$ 的上下文中追加 8个几何Query ($Q_g$) 和 8个运动Query ($Q_m$)。几何隐变量 ($Z_g$) 和运动隐变量 ($Z_m$) 与上下文Token一起作为动作专家（Action Expert）的条件。
  - **教师模型与特征**：VGGT 提取当前帧的几何特征（维度2048）；Track4World 处理当前及未来帧提取3D场景流特征（维度256）。
  - **Mask生成**：离线使用 VLM（如 Qwen3-VL-8B-Instruct）和 Grounded-SAM-2 获取当前子任务相关实体的二值Mask，用于指导特征池化。
- **训练/优化目标**: 总损失为动作损失（Flow matching） + 几何蒸馏损失（MSE） + 运动蒸馏损失（Smooth L1） + 语义子任务预测损失（自回归Cross Entropy）。推理时仅保留主干和动作专家，丢弃教师模型、未来帧和Mask。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（仿真）、RoboCasa（仿真）、真实世界4个操作任务（Franka Panda机械臂，单固定RGB相机）。
  - **对比对象（Baseline）**：OpenVLA、$\pi_0$、$\pi_{0.5}$、OpenVLA-OFT、GR00T N1.7、SpatialVLA、DreamVLA、GeoPredict、Track4Action、KYC、GeoVLA、PointVLA 等。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - **LIBERO**：平均成功率 97.9%（比 $\pi_{0.5}$ 的 96.9% 提升 1.0%），Spatial 达到 100%，Long 提升显著（92.4% -> 95.0%）。
  - **RoboCasa**：平均成功率 63.4%（比 $\pi_{0.5}$ 的 55.2% 提升 8.2%），超越所有对比方法。
  - **真实世界**：总体成功率从 47.5% 提升至 63.8%。在需要切换交互实体的长程任务（如双水果重排、抽屉存储）上提升尤为明显。
  - **消融实验**：子任务级Mask监督（63.4%）显著优于全图监督（58.7%）和任务级实体监督（61.9%）；隐变量直接条件化动作专家（63.4%）优于仅作辅助监督（58.5%），证明了两条蒸馏分支的互补性以及局部聚焦的有效性。

### 62. 🔥 [Catch Me If You Can: Real-Time Feedback Denoising for Responsive VLAs] (抓我呀：面向响应式视觉-语言-动作模型的实时反馈去噪)
- **研究机构**: `Roboligent, Inc. (致谢中提及德州大学奥斯汀分校)`
- **Arxiv ID**: `2609.21022` | [点击跳转](https://arxiv.org/abs/2609.21022)

**0. 论文标题**
- **英文标题**: Catch Me If You Can: Real-Time Feedback Denoising for Responsive VLAs
- **中文标题**: 抓我呀：面向响应式视觉-语言-动作模型的实时反馈去噪
- **研究机构**: Roboligent, Inc. (致谢中提及德州大学奥斯汀分校)
- **一句话总结**: 提出 VLA-Feedback 架构，把扩散模型的最后一步去噪作为轻量级反馈接口，在动作块执行时利用高频视觉观测实时修正动作，解决了传统 VLA 动作块开环执行无法应对动态环境的问题。

**1. 整体逻辑**
- **研究任务**: [领域：具身智能/机器人学习；类型：方法创新] 语言条件下的机器人操作，重点解决执行过程中目标移动或场景变化时的实时响应问题。
- **研究动机**: 现有的基于扩散模型的 VLA 通常使用动作分块（action chunking）来降低推理延迟，但生成的动作块是开环执行的。在执行期间，如果目标移动，机器人无法利用新的观测修正动作。现有的双系统（快慢系统）方法存在延迟与容量的权衡，且往往仍是开环或需要重新运行完整模型。
- **本质改动**: 不重新跑完整的 VLM-DiT 规划器，也不单独训一个快策略，而是把扩散规划器的“最后一步去噪”抠出来当反馈接口。执行动作块时，拿最新的高频视觉观测去条件化这最后一步的去噪速度，直接在控制频率下修正动作。
- **技术溯源**: 基于 GR00T 基础模型（包含 VLM 和 Diffusion Transformer (DiT)），视觉编码器使用 NVIDIA Eagle-2。

**2. 技术拆解**
- **核心方法**: VLA-Feedback 双时间尺度架构。慢路径（低频）跑 VLM-DiT 规划器，生成个“接近最终”的动作块并缓存特征；快路径（高频）跑反馈去噪模块，每个控制步把缓存特征和最新观测融合，预测最后一步的去噪速度来修正动作。
- **关键细节**: 
  - **输入输出**：慢速规划器输入低频观测、语言指令和机器人状态，输出动作块；反馈模块输入缓存的动作特征和实时高频观测（手眼视角），输出修正后的最终动作。
  - **模型结构**：反馈模块包含动作分支（编码 near-final action）和观测分支（轻量级 ResNet-18 编码观测），通过 Transformer 融合。引入可学习的视觉残差缩放（visual residual scale）控制反馈强度，最后通过单层速度头预测去噪速度。
  - **规模**：反馈模块总参数约 12.4M（可训练参数约 1.19M），相比冻结的约 3B 规划器非常轻量。
  - **调度比例**：1:16:16（1次慢速规划，16次反馈更新，16次动作执行）。
- **训练/优化目标**: 分两阶段训练。第一阶段用 flow-matching 目标正常训规划器（掩码回归损失）。第二阶段把规划器冻住，只拿监督回归损失（预测动作和真实动作的 MSE）单训反馈模块。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：静态任务用 LIBERO-Object 和 LIBERO-Goal；动态仿真用 Robosuite（抓 1D/2D 移动机器人、把球扔进移动杯子，及 4 个未见过的动态变体）；真实世界用 Franka Emika Panda 机器人（抓面包、抓滚动易拉罐、把柠檬水倒进移动杯子）。
  - **对比对象（baseline）**：OpenVLA, GR00T, FiS-VLA。
- **评价指标**: 任务成功率（Success rate），以及反应延迟（Reaction latency，通过理论公式计算预期延迟）。
- **主要结果**: 
  - **仿真结果**：静态 LIBERO 任务上与 GR00T 持平（Goal 92% vs 92%，Object 95.5% vs 97.5%）；动态任务平均成功率从 GR00T 的 27.5% 大幅提升至 85.0%。在未见过的动态变体上表现最好。
  - **反应延迟**：预期反应延迟最低（反馈推理仅需约 2ms，且每步都更新）。
  - **真实世界结果**：平均成功率从 51% (GR00T) 提升至 73%。静态任务略有提升，动态任务提升显著。

### 63. 🔥 [ForeTac-VLA: A Forecasting-Based Tactile-Vision-Language-Action Model for Contact-Rich Robotic Manipulation] (ForeTac-VLA：一种用于富接触机器人操作的基于预测的触觉-视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20980` | [点击跳转](https://arxiv.org/abs/2609.20980)

**0. 论文标题**
- **英文标题**: ForeTac-VLA: A Forecasting-Based Tactile-Vision-Language-Action Model for Contact-Rich Robotic Manipulation
- **中文标题**: ForeTac-VLA：一种用于富接触机器人操作的基于预测的触觉-视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出ForeTac-VLA，通过双向交叉注意力融合触觉与视觉-语言特征，并利用Transformer预测多步未来触觉状态来指导动作生成，显著提升富接触机器人操作的成功率与视觉鲁棒性。

**1. 整体逻辑**
- **研究任务**: 富接触环境下的机器人操作（contact-rich robotic manipulation），如精密插拔、易碎品抓取、旋转拧盖、持续表面擦拭等。
- **研究动机**: 现有VLA（视觉-语言-动作）模型过度依赖视觉，在富接触场景中无法感知关键的物理交互状态（如机械卡死、接触力过大或接触减弱）。现有的引入触觉的VLA（TacVLA）方法多为“反应式”，仅利用当前观察到的触觉反馈，缺乏对接触状态未来演变的显式建模与预测。
- **本质改动**: 将触觉信息的利用方式从“被动反应”转为“主动预测”。不仅融合当前触觉，还显式预测多步未来触觉状态，并将预测的未来触觉状态作为条件输入（condition）来指导动作生成。
- **技术溯源**: 基于预训练的 $\pi_{0.5}$ VLA模型（视觉编码器SigLIP，语言/本体感受分词器PaliGemma），动作生成采用Flow-matching（流匹配）机制。

**2. 技术拆解**
- **核心方法**: 
  1. 触觉编码：将最近10步的触觉阵列数据及其相对首帧的变化拼接，经MLP编码为触觉token。
  2. 双向交叉注意力：触觉token与视觉-语言token进行双向交叉注意力计算，实现跨模态特征互相精炼。
  3. 多步未来触觉预测：将精炼后的双模态token拼接输入Transformer，预测未来4个时间步（约83ms至333ms）的触觉状态变化。
  4. 动作条件化：将精炼的视觉-语言token与预测的未来触觉token拼接，作为多模态前缀输入VLA骨干网络生成动作。
  5. 课程学习：训练前75%步数使用Ground-truth未来触觉，后25%切换为模型预测的未来触觉，以缓解早期预测不准导致的训练不稳定。
- **关键细节**: 
  - 输入：腕部与外部相机图像、语言指令、机器人本体感受、最近10步触觉（每指7×4阵列）。
  - 结构：在 $\pi_{0.5}$ 基础上增加MLP触觉编码器、双向交叉注意力模块、Transformer触觉预测器。
  - 规模与超参：控制频率60Hz；使用LoRA微调 $\pi_{0.5}$ 骨干，新增模块全参数训练；总训练步数60,000步。
- **训练/优化目标**: 
  - 动作生成：Flow-matching objective（流匹配损失）。
  - 触觉预测：预测未来触觉状态变化（文中提及预测误差MAE为6.48×10⁻³）。
  - 整体联合优化。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：自采280个遥操作演示（4个任务各70个），包括 peg insertion, chip handling, cap unscrewing, board wiping。
  - 对比对象（baseline）：微调的无触觉VLA、FiLM-fusion TacVLA、Concat-and-gating TacVLA、ACT。
  - 测试环境：UR7e机械臂 + Robotiq夹爪 + TSF-85触觉传感器 + 双RealSense相机。额外测试了低光照和视觉杂乱环境。
- **评价指标**: 任务成功率（Success rate，每任务20次试验）；触觉预测的平均绝对误差（MAE）。
- **主要结果**: 
  - 平均成功率达95.0%（Peg 100%, Chip 95%, Cap 95%, Board 90%）。
  - 相比微调VLA（58.75%）提升36.25%，相比FiLM-fusion（71.25%）和Concat-and-gating（72.50%）分别提升23.75%和22.50%。ACT仅为13.75%。
  - 鲁棒性：低光照下成功率80.0%（VLA 40.0%，TacVLA 55.0%）；视觉杂乱下81.25%（VLA 27.50%，TacVLA 53.75%），性能衰减最小。
  - 消融实验证实：无触觉(58.75%) -> 简单拼接(68.75%) -> 单向注意力+预测(81.25%) -> 双向注意力+预测(95.00%)，双向交互与未来预测是性能跃升的核心。

### 64. 🔥 [PRIME: Perception Feedback with Situational Memory Embeddings in VLA Models] (PRIME：VLA模型中基于情境记忆嵌入的感知反馈)

**1. 整体逻辑**
- **研究任务**: 自动驾驶领域的端到端视觉-语言-动作（VLA）模型推理与规划（属于方法创新/系统架构改进）。
- **研究动机**: 现有的VLA模型（如ORION）在“感知-推理-规划”层级中是纯前馈的。虽然感知模块内部有时间循环，但早期感知对下游的推理结果和导航目标是“盲目”的，无法利用先前的决策来优先处理视觉线索。这导致模型在需要长时序上下文（如合流、路口让行、遮挡后恢复）的场景中容易失败。
- **本质改动**: 打破前馈信息流，设计了一个“情境记忆（Situational Memory）”模块。把过去几步的感知、推理、意图和预测的隐状态提取出来，通过交叉注意力反馈给感知前端（QT-Former）的查询向量（Queries），实现“意图驱动的感知注意力”。
- **技术溯源**: 基于 ORION 架构（包含 QT-Former 感知编码器、LLM 推理器和轨迹规划器），使用 Think2Drive 的专家演示数据进行训练。

**2. 技术拆解**
- **核心方法**: 提出 Situational Memory 模块，维护一个长度为 $L$ 的滑动窗口，缓存6种反馈源（分三层：感知层的 Query 和 Motion，推理层的 Reasoning token 和 Planning command，预测层的 Ego-state 和 Trajectory）。通过两种整合模块处理不同基数的记忆：用 FiLMXAttn 处理紧凑 token（通过交叉注意力检索后用 FiLM 仿射变换调制），用 Attention Pooling 处理高基数 token（用可学习的 Extraction Queries 压缩记忆）。最后将各来源表征拼接，通过交叉注意力让当前感知 Queries 检索相关上下文，并通过门控残差连接注入。
- **关键细节**: 
  - 基座模型约 7.3B 参数，PRIME 仅增加 29.7M 参数（占比 0.41%）。
  - 记忆窗口长度 $L=12$。
  - 采用两阶段训练策略：先 Alignment（冻结 LLM 和 Planner，微调 QT-Former 和反馈模块），再 E2E（全参数微调，LLM 使用 LoRA）。
- **训练/优化目标**: 基于 Think2Drive 专家演示的端到端多任务训练，具体损失函数原文未提及。

**3. 实验结果**
- **实验设置**: 在 CARLA 仿真器中的 Bench2Drive 闭环基准上进行评估。对比的 baseline 包括前馈架构 ORION，以及 UniAD, VAD, SpaceDrive, AutoVLA, GeRo 等主流端到端模型。
- **评价指标**: 闭环指标 Driving Score (DS) 和 Success Rate (SR)；开环感知指标 NuScenes Detection Score (NDS)；轨迹误差 mL2。
- **主要结果**: 
  - PRIME-Full 取得 DS 82.47（比 ORION 提升 4.73），SR 60.00%（提升 5.38%），在基于 Think2Drive 训练的 VLA 模型中 DS 最高。
  - 核心消融结论：只有包含高层“推理状态（Reasoning Token）”的反馈能提升闭环驾驶性能；如果只反馈纯感知信息，虽然开环 NDS 提升，但闭环 DS 和 SR 会大幅下降。这证明反馈的核心价值在于提供“任务相关的意图上下文”来指导特征选择，而不是单纯给感知端塞入更多的历史信息。

### 65. 🔥 [MT-WAM: Reorienting the One-Pass Predictive Representation Toward Action Generation] (MT-WAM：将单次前向预测表示重新导向动作生成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.21474` | [点击跳转](https://arxiv.org/abs/2609.21474)

**0. 论文标题**
- **英文标题**: MT-WAM: Reorienting the One-Pass Predictive Representation Toward Action Generation
- **中文标题**: MT-WAM：将单次前向预测表示重新导向动作生成
- **研究机构**: 原文未提及
- **一句话总结**: 本文在无需推理时生成未来视频的前提下，通过引入未来2D点轨迹和视觉特征的辅助监督，并设计轻量级双流动态分支来优化单次前向预测表示，显著提升了机器人在分布偏移和真实世界中的操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（具体为基于世界动作模型 WAM 的视觉条件动作生成）。
- **研究动机**: 现有的世界动作模型（如 Fast-WAM）在推理时跳过未来视频生成，仅依赖单次前向传播产生的 KV cache 来条件化动作生成。但这种单次表示在训练时为了重建完整的未来观测，会编码大量与动作无关的视觉细节（如颜色、纹理、光照），没有显式地优先提取对控制至关重要的未来动态和视觉结构信息。
- **本质改动**: 在保留原有视频-动作联合训练和单次前向推理架构的基础上，增加了未来2D点轨迹和视觉特征预测作为互补监督信号，并设计了一个轻量级的双流动态分支进行目标特异性处理，从而让单次前向表示更聚焦于动作生成所需的动态和结构信息。
- **技术溯源**: 基于 Fast-WAM（世界动作模型架构）、Wan 2.2-TI2V-5B（视频骨干网络初始化）、CoTracker3（提供2D点轨迹目标）、DINOv2（提供视觉特征目标）、Action DiT（动作专家架构）。

**2. 技术拆解**
- **核心方法**: 引入多目标辅助监督（未来2D点轨迹和视觉特征）和双流动态分支（Dual-Stream Dynamic Branch）。通过复制 Video DiT 尾部的 $M$ 个模块（默认 $M=10$）构建动态分支，分支内包含运动流（Motion-stream）和视觉特征流（Visual-feature stream）。两者使用独立的 FFN 和结构化注意力掩码（Structured Attention Mask）防止跨流注意力。运动流 token 直接为动作专家提供额外的动态条件，而视觉特征流仅在训练时通过损失函数反向传播来优化共享的视频骨干网络，其 token 不参与推理时的动作条件化。
- **关键细节**: 
  - *输入输出*: 输入为当前多视角 RGB 观测、本体状态和语言指令；输出为动作块（action chunk）。
  - *模型结构*: 视频骨干（Video DiT）+ 动作专家（Action DiT）+ 动态分支。分支入口复制两份参考帧隐状态，分别初始化运动流和视觉特征流，并加上不同的可学习流嵌入（stream embeddings）。
  - *注意力机制*: 动作查询（Action queries）可以注意力到运动流 token，但被掩码屏蔽，不能注意力到视觉特征流 token。
  - *推理阶段*: 跳过未来视频预测，仅使用单次前向计算出的视频和运动 KV cache 进行动作去噪。
- **训练/优化目标**: 总损失为四部分之和：未来视频预测损失（Flow-matching）、动作生成损失（Flow-matching）、未来2D点轨迹预测损失（MSE，基于 CoTracker3 提取的累积位移）、未来视觉特征预测损失（Cosine loss，基于冻结的 DINOv2 提取的 patch 特征）。后两者不使用噪声插值或时间步加权。

**3. 实验结果**
- **实验设置**: 
  - *数据集*: LIBERO, LIBERO-Plus, RoboTwin 2.0 (Clean/Rand 和 Clean2Rand 设置), 以及 4 个真实世界单/双臂操作任务（使用 UR5 机械臂和 RealSense D405 相机）。
  - *对比对象 (baseline)*: Fast-WAM（核心 baseline），以及 OpenVLA, $\pi_0$, $\pi_{0.5}$, LingBot-VA, Motus, Fast-WAM-Joint, SG-WAM, ST-WAM, 4D-WAM, UniVLA, HALO, BagelVLA 等主流 VLA/WAM 方法。
- **评价指标**: 任务成功率（Success Rate, SR）。在 LIBERO-Plus 和 RoboTwin 2.0 C2R 中还关注了在不同扰动（相机、机器人、语言、光照、背景、噪声、布局）下的鲁棒性，以及 Clean 到 Random 环境的性能保留率。
- **主要结果**: 
  - *LIBERO*: 平均成功率 98.2%，略高于 Fast-WAM (97.6%)，在标准任务上保持同等水平。
  - *LIBERO-Plus (分布偏移)*: 整体成功率 73.66%，比 Fast-WAM (49.86%) 大幅提升 23.8 个百分点，在相机、噪声、语言等扰动下提升尤为显著。
  - *RoboTwin 2.0 Clean2Rand (OOD泛化)*: Random 环境成功率从 Fast-WAM 的 6.30% 提升至 19.40%（提升 13.1 个百分点），证明了辅助监督对泛化能力的提升。
  - *真实世界*: 4个任务平均成功率从 Fast-WAM 的 67.0% 提升至 77.8%（提升 10.8 个百分点），在多步交互和长视野任务中收益最大。
  - *推理效率*: 相比 Fast-WAM，延迟仅增加约 5.79%（313.48ms vs 296.32ms），FLOPs 增加 37.63%；但远低于需要联合去噪的 Fast-WAM-Joint（FLOPs 约为其 1/6），实现了性能与效率的良好平衡。
  - *消融实验*: 验证了双流非对称设计的必要性。如果让动作查询注意力到视觉特征流 token，成功率下降 2.8%；如果完全移除视觉特征流，成功率下降 4.9%。证明了视觉特征流主要通过训练时优化骨干网络起作用，而运动流直接提供推理时的动态条件。

### 66. 🔥 [DexTacWAM: A Visuo-Tactile World-Action Model for Dexterous Manipulation] (DexTacWAM：用于灵巧操作的视触觉世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24976` | [点击跳转](https://arxiv.org/abs/2609.24976)

**0. 论文标题**
- **英文标题**: DexTacWAM: A Visuo-Tactile World-Action Model for Dexterous Manipulation
- **中文标题**: DexTacWAM：用于灵巧操作的视触觉世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种视触觉联合预测的世界-动作模型，通过复用预训练视觉VAE和引入触觉压缩器，在极少触觉数据下将视频先验高效扩展到多指灵巧操作的接触动力学建模中。

**1. 整体逻辑**
- **研究任务**: 接触丰富的双臂灵巧操作（如遮挡抓取、双手交接、持续接触擦拭、工具使用、分离叠放物体、拧瓶盖等）。
- **研究动机**: 现有的世界模型和VLA模型多为“视觉中心”，无法预测被遮挡或隐藏的物理接触状态（如滑动、受力、抓取稳定性）；现有的视触觉模型多针对平行夹爪等简单末端，难以处理灵巧手多指分布式的触觉信号，且触觉数据收集成本极高、规模受限。
- **本质改动**: 把触觉信号从“策略的辅助条件输入”提升为“世界状态的一部分”进行联合预测，并通过“持续视觉到触觉学习”复用预训练视觉大模型的先验，解决触觉数据稀缺和冷启动问题。
- **技术溯源**: 预训练视频扩散模型（DiT）、预训练视觉VAE（LTX visual VAE）、流匹配（Flow-matching）。

**2. 技术拆解**
- **核心方法**: 
  1. **多指触觉编码**：复用冻结的预训练视觉VAE提取单指触觉特征（通过灰度转RGB适配器适配通道）。
  2. **触觉压缩**：设计手指与位姿感知压缩器，将单手5个手指的触觉特征压缩为1个手部特征，保留手指身份和位姿信息。
  3. **视触觉联合世界建模**：将压缩后的触觉latent与视觉latent沿视角维度拼接，输入视频扩散Transformer进行联合去噪预测。
  4. **动作生成**：动作专家通过带模态级K/V归一化的交叉注意力机制，基于世界模型的预测latent生成动作。
- **关键细节**: 
  - **输入输出**：输入为头部RGB、10个手指的单通道触觉图、手部本体感觉；输出为194维连续动作向量（含10指6D力、手臂相对位姿、手部目标等）。
  - **模型规模**：世界模型骨干2B参数，动作专家160M参数。
  - **压缩器结构**：采用5:1自注意力池化，注入可学习的手指身份embedding和手部位姿embedding，并辅以轻量级时空注意力细化。
- **训练/优化目标**: 
  - **世界模型**：模态分离的流匹配去噪损失（分别计算视觉和触觉预测的MSE）。
  - **动作专家**：统一动作向量的流匹配MSE损失（包含力、位姿等所有子项）。

**3. 实验结果**
- **实验设置**: 
  - **数据与任务**：6个真实机器人接触丰富任务，每任务约100个示教demo；预训练阶段使用约4小时的多样化双臂操作数据（diverse-488 corpus）。
  - **Baseline**：$\pi_{0.5}$（无触觉VLA）、ViTacFormer（带辅助触觉预测的ACT/CVAE）、RDP（直接注入触觉的扩散策略）、Genie Envisioner（纯视觉WAM）。
- **评价指标**: 真实机器人物理试验的任务得分/成功率（每任务20次试验）。
- **主要结果**: 
  - **性能提升**：DexTacWAM在所有6个任务上得分最高，平均得分70.6%，远超最强baseline RDP的38.0%。
  - **消融验证**：将接触演化作为世界状态预测是性能提升的核心（去掉触觉世界建模后平均分从74.7%降至26.6%），仅做触觉条件输入不够。
  - **视觉质量保持**：持续学习策略在赋予模型触觉预测能力的同时，视觉预测质量几乎无损（PSNR差异在0.5 dB以内）。
  - **效率优化**：触觉压缩器保留了89.4%的接触召回率，同时使训练速度提升2.26倍，推理延迟降低（1.29倍加速），满足实时控制需求。

### 67. 🔥 [DualWAM: Dual-System World Action Models for Asynchronous Global Planning and Local Refinement] (DualWAM：用于异步全局规划与局部细化的双系统世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24868` | [点击跳转](https://arxiv.org/abs/2609.24868)

**0. 论文标题**
- **英文标题**: DualWAM: Dual-System World Action Models for Asynchronous Global Planning and Local Refinement
- **中文标题**: DualWAM：用于异步全局规划与局部细化的双系统世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种双系统世界动作模型，通过将全局规划与局部细化解耦并异步执行，在保证长程视觉规划能力的同时大幅降低了关键路径延迟，提升了机器人零样本操作的成功率与响应速度。

**1. 整体逻辑**
- **研究任务**: 机器人零样本操作（Zero-shot robot manipulation），即根据语言指令在未见过的任务和场景中控制机械臂完成复杂交互。
- **研究动机**: 现有的世界动作模型（WAMs）预测未来视觉状态计算成本极高。为了摊销推理成本，现有方法通常使用长动作块（long action chunks），但这牺牲了闭环控制的响应性；若缩短动作块，则会导致推理过于频繁且容易陷入短视的局部最优。全局规划的高效性与闭环控制的响应性之间存在固有矛盾。
- **本质改动**: 将单一的世界动作生成过程解耦为“低频全局规划”和“高频局部细化”两个互补系统，让它们在共享的去噪轨迹上异步协作，分别处理高噪声的全局状态和低噪声的局部腕部动作。
- **技术溯源**: 基于 Cosmos3-Nano（System 2 全局规划）和 Cosmos3-Edge（System 1 局部细化）等预训练视频/世界模型基座；底层生成框架基于整流流（Rectified Flow）。

**2. 技术拆解**
- **核心方法**: 提出 DualWAM 双系统架构。System 2（全局规划）使用多视角观测，在高噪声区间进行双向去噪，生成粗粒度的全局世界-动作轨迹；System 1（局部细化）仅使用腕部相机（wrist-only）观测，从 System 2 的中间状态中截取时间对齐的短窗口，在低噪声区间结合最新交互反馈进行高频局部去噪细化。两者通过共享去噪轨迹阈值进行异步交接。
- **关键细节**: 
  - 输入输出：System 2 输入全局+腕部观测，输出全局与腕部视频潜变量及动作序列（长窗口 32 帧）；System 1 仅输入腕部观测，输出局部腕部潜变量与动作（短窗口 8 帧）。
  - 系统架构：System 2 和 System 1 均为基于 Transformer 的生成模型。
  - 关键超参：训练低噪声上界 $\tau_{train}=0.7$，System 2 刷新间隔为 32 个控制帧。
  - 系统级优化：采用三 GPU CFG 并行、异步执行调度、算子融合、CUDA Graph 编译、W8A8 混合精度量化，以及将 System 1 的在线去噪步数从 4 步压缩到 1 步（共享轨迹采样）。
- **训练/优化目标**: 基于整流流的速度场匹配损失。System 2 在高噪声区间监督全局视角、腕部视角和动作；System 1 在低噪声区间仅监督腕部视角和动作，并引入时间偏移增强（temporal offset augmentation）以应对异步执行中的轨迹未对齐问题。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：在 Franka FR3 和 Galbot G1 两种机器人本体上评估 20 个零样本真实机器人操作任务（每个本体 10 个任务，每个任务 10 次 rollout）。使用了自收集的 Galbot 机器人数据集（43,058 个子任务），以及额外的 1800 小时第一人称视频和 1200 小时 UMI 腕部演示数据。
  - 对比对象（baseline）：$\pi_{0.5}$, Cosmos3-Nano-Policy, Fast-WAM, AHA-WAM。
  - 测试环境：部署在 3 张 NVIDIA GeForce RTX 4090 GPU 上。
- **评价指标**: 任务进度（Task Progress，基于里程碑的百分比得分）、成功率（Success Rate, SR）、关键路径延迟（Critical-path Latency）、平均物理任务完成时间（Mean task-completion time）。
- **主要结果**: 
  - 相比最强 baseline (Cosmos3-Nano-Policy)，DualWAM 在 Franka 上成功率提升 5%（达到 54%），在 Galbot 上提升 4%（达到 45%），平均提升 4.5 个百分点。
  - 关键路径延迟降至 63 ms，相比 baseline 的 1043 ms 实现了 16.6 倍的加速。
  - 物理完成时间显著缩短（Franka 从 24.88s 降至 21.76s，Galbot 从 53.11s 降至 48.67s）。
  - 消融实验证明，双系统解耦和保留局部世界模型预测缺一不可；异步执行比同步执行延迟降低 13.5 倍且成功率更高。
  - 引入角色匹配的辅助数据（第一人称数据给 System 2，UMI 数据给 System 1）可使成功率进一步提升 14 个百分点（达到 59%）。
  - 在边云部署场景下，下行通信负载相比 AHA-WAM 降低了 104.6 倍。

### 68. 🔥 [D-JEPA: A Decision-Aligned Latent World Model] (D-JEPA：一种决策对齐的潜在世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.24749` | [点击跳转](https://arxiv.org/abs/2609.24749)

**0. 论文标题**
- **英文标题**: D-JEPA: A Decision-Aligned Latent World Model
- **中文标题**: D-JEPA：一种决策对齐的潜在世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 针对潜在世界模型在决策边界附近“预测距离”与“实际成败”倒置的问题，提出 D-JEPA 通过有界集合算子对齐候选未来的序数关系，并直接映射回原生潜在空间以改进动作选择。

**1. 整体逻辑**
- **研究任务**: 改进基于潜在世界模型（特别是 JEPA 架构）的动作规划与选择，提高机器人操作和自动驾驶等任务中的控制成功率。
- **研究动机**: 发现“决策局部预测鸿沟（decision-local prediction gap）”：现有的潜在世界模型全局预测可能很准，但在最终竞争执行的少数候选动作中，预测潜在距离最小的动作执行后反而失败，而距离稍大的却成功了。也就是说，预测的相对排序和实际执行的成败在候选短名单中发生了倒置。
- **本质改动**: 不追求全局预测误差最小化，而是利用实际执行结果作为监督信号，通过一个有界的排列等变算子，直接对候选未来的相对排序（序数证据）进行决策对齐修正，只改变决策边界附近的排序。
- **技术溯源**: 基于联合嵌入预测架构（JEPA），具体依赖 LeWM、TD-JEPA、JEPA-WM、DINO-WM 等预训练的潜在世界模型作为预测基座。

**2. 技术拆解**
- **核心方法**: 
  1. **关系决策对齐**：设计一个有界、排列等变的 Transformer 集合算子，输入各候选动作的目标相对特征和无尺度的序数排名，输出对基础得分的有界修正，集中优化决策边界附近的成功/失败排序。
  2. **互补预测几何融合**：通过共享的序数接口，将多个异构预测模型的证据融合；同时引入受限的预测器自适应（只微调预测器尾部和投影层）作为补充提议，通过校准组合门控决定最终选择。
  3. **表示提升**：通过有界的时间传输和精确的序数实现，将学到的决策排序结构直接编码到 JEPA 兼容的未来潜在表示中，使得对齐后的动作可以直接通过原生的潜在距离来读取。
- **关键细节**: 
  - **输入输出**：输入为上下文、目标和 K 个候选动作序列（如 K=63）；输出为修正后的候选得分或重构的未来潜在表示。
  - **模型结构**：共享编码器 + 两层无位置编码的排列等变 Transformer（4头，128维FFN），输出经零初始化的秩为8的修正头。
  - **规模与超参**：双模型输入特征维度为 386（包含描述符和归一化排名），四模型为 388；修正幅度限制在 $\epsilon=0.2$ 内；训练使用 AdamW，温度参数 $T=0.05$，局部排序权重 0.25，修正正则权重 0.1。
- **训练/优化目标**: 
  - **关系对齐损失**：包含全局成功质量奖励（最大化成功候选的概率质量）、局部边界排序损失（拉大决策边界附近成功与失败候选的得分差距），以及修正量的平方正则化（防止全局重排）。
  - **预测自适应损失**：结合成功奖励、边界排序、排名保持和潜在一致性惩罚，确保微调只发生在决策相关区域。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：模拟控制（PushT, Reacher, Granular）、VLA 机械臂操作（RoboTwin）、物理机器人（PiPER 机械臂）、自动驾驶（Drive-JEPA）。
  - **对比对象（Baseline）**：预训练世界模型（LeWM, TD-JEPA, JEPA-WM, DINO-WM），以及匹配优化目标（PEGrad, Var-JEPA, CVaR 等）和融合基线。
- **评价指标**: 任务成功率（Success %）、Chamfer Distance (CD)、PDMS（自动驾驶轨迹评分）。
- **主要结果**: 
  - **模拟控制**：PushT 成功率达 87.89%，Reacher 达 93.75%，显著优于各预训练基线及优化控制组。
  - **机械臂操作**：在 RoboTwin 的 4 个任务上，平均成功率从 61.72% 提升至 76.76%（+15.04%）；在物理 PiPER 机器人上，成功率从 64.0% 提升至 81.0%（+17%）。
  - **自动驾驶**：在 7 个困难场景下，PDMS 评分从 57.36 大幅提升至 95.34。
  - **泛化与消融**：在未见过的物体形状和视觉外观变化下，成功率均优于原生选择和校准融合基线；消融实验证实关系对齐算子和多几何证据融合是性能提升的核心来源。

### 69. 🔥 [Beyond Visual Quality: A Study of Test-Time Planning with World Action Models] (超越视觉质量：世界动作模型测试时规划研究)
- **研究机构**: `原文未提及具体机构名称（致谢中提及受 NVIDIA 和 EPSRC 资助）`
- **Arxiv ID**: `2609.24745` | [点击跳转](https://arxiv.org/abs/2609.24745)

**0. 论文标题**
- **英文标题**: Beyond Visual Quality: A Study of Test-Time Planning with World Action Models
- **中文标题**: 超越视觉质量：世界动作模型测试时规划研究
- **研究机构**: 原文未提及具体机构名称（致谢中提及受 NVIDIA 和 EPSRC 资助）
- **一句话总结**: 本文通过严格的同状态反事实评估框架，量化了世界动作模型在测试时通过视觉预测进行动作选择的理论上限，并实证揭示了现有的视觉和价值评分规则无法有效识别出能带来任务成功的动作候选。

**1. 整体逻辑**
- **研究任务**: 评估世界动作模型（WAMs）在测试时利用生成的视觉预测（imagined futures）进行动作选择（Test-Time Planning / Best-of-K）的实际潜力，以及现有评估指标的有效性。
- **研究动机**: WAMs 能同时输出动作和视觉预测，理论上可以通过比较预测结果来挑选最佳动作。但如何挑选、以及现有的基于视觉质量或物理一致性的评分能否真正挑出好动作，目前缺乏清晰的实证研究。
- **本质改动**: 本文没有提出新的模型或算法，而是设计了一套“同状态反事实分析（Same-state analysis）”的诊断框架。它将“理论上可选出的最优结果（Oracle upper bound）”与“现有评分规则实际选出的结果”剥离开来，从而诊断出评分规则失效的根本原因（是预测帧没体现出差异，还是评分器没认出来）。
- **技术溯源**: 基于 Cosmos Policy (2B) 模型，在 RoboCasa 仿真环境中进行测试，并使用了 Qwen3-VL-4B-Instruct 作为视觉语言模型（VLM）评分器，以及 CLIP、SSIM、VBench 等视觉评估组件。

**2. 技术拆解**
- **核心方法**: 设计了控制变量的测试时规划评估协议。包括：1) 轨迹级和同状态级的 Oracle 上限估计（固定状态，采样多个候选动作并执行，记录真实成功率）；2) 闭环节点与匹配候选集（Matched candidate sets）的评分规则对比；3) 反事实分支（Counterfactual branching）分析，考察动作多样性（Action spread）与结果覆盖率的关系。
- **关键细节**: 使用 Cosmos Policy 2B 模型，每次采样 $K=4$ 或 $K=16$ 个候选（包含预测视觉帧和动作序列）。执行前 16 步（或完整 32 步）动作后重新规划。对比的评分规则包括：模型自带的学习价值（Learned value）、图像相似度（SSIM）、拉普拉斯锐度、美学质量，以及基于 Qwen3-VL 的任务进度评分等。
- **训练/优化目标**: 本文非学习类工作。核心机制是通过固定 WAM 和采样器，仅改变选择规则（Selection rule），计算 $i_m^\star = \arg\max_i s_{m,i}$。通过对比不同规则在相同候选集上的终端成功率（Task success）和分支结果 AUC，来评估评分规则与真实任务结果的排序一致性（Ranking alignment）。

**3. 实验结果**
- **实验设置**: 数据集为 RoboCasa（24个任务，30个场景）。对比对象（Baseline）包括：均匀随机选择（Uniform selection）、Oracle 选择（选真实结果最好的）、以及多种基于视觉质量（如 SSIM、VBench 组件）、物理一致性和 VLM（Qwen3-VL）的评分规则。
- **评价指标**: 任务成功率（Task success rate / pass@K）、同状态下的局部选择空间（Local selection headroom / Oracle upper bound）、分支结果 AUC（衡量评分规则能否把成功候选排在失败候选前面）。
- **主要结果**: 
  1. **理论潜力大但难以利用**：在 $K=16$ 的同状态分析中，Oracle 选择将成功率从均匀随机的 68.9% 提升至 79.2%，证明采样确实能产生有用的备选动作。
  2. **现有评分器严重失效**：无论是 Learned value、SSIM 还是 VLM 进度评分，在匹配候选集上的成功率均未能显著超越随机选择（例如 Learned value 在完整动作块评估中仅达到 51.6%），远未达到 Oracle 上限，甚至有时不如随机。
  3. **失效原因诊断**：选择机会集中在少数“混合决策”（既有成功也有失败候选）状态中；增加动作空间的采样距离（Action spread）并不能增加成功候选的数量；视觉评分器往往无法在预测帧中识别出那些能导致成功的动作（即排序对齐失败）。这表明“生成视觉上合理的预测”与“识别出对控制有用的动作”是两码事。

### 70. 🔥 [Think Like a World Model, Act Like a VLA: Distilling World-Model Representations into Compact Robot Policies] (像世界模型一样思考，像VLA一样行动：将世界模型表征蒸馏到紧凑型机器人策略中)
- **研究机构**: `原文未提及（致谢中提及使用 University of Illinois Urbana-Champaign 计算资源）`
- **Arxiv ID**: `2609.24682` | [点击跳转](https://arxiv.org/abs/2609.24682)

**0. 论文标题**
- **英文标题**: Think Like a World Model, Act Like a VLA: Distilling World-Model Representations into Compact Robot Policies
- **中文标题**: 像世界模型一样思考，像VLA一样行动：将世界模型表征蒸馏到紧凑型机器人策略中
- **研究机构**: 原文未提及（致谢中提及使用 University of Illinois Urbana-Champaign 计算资源）
- **一句话总结**: 通过在VLA训练时引入与冻结世界模型特征对齐的辅助损失，让小型VLA在不增加推理成本的前提下继承世界模型的物理因果表征，从而在仿真和真机任务中显著提升性能。

**1. 整体逻辑**
- **研究任务**: 提升紧凑型视觉-语言-动作（VLA）模型在机器人控制任务中的鲁棒性和泛化能力，解决其因缺乏对世界演化建模而导致的数据依赖和脆弱性问题。
- **研究动机**: 标准VLA仅学习观测到动作的映射，缺乏对物理世界因果演化的显式建模，鲁棒性受限于数据覆盖率。世界模型（World Models）通过预测未来内化了时序和因果结构，表征更具物理基础，但自回归生成未来帧的推理成本极高（如DreamZero需3s/次，显存45.9GB），无法直接用于实时控制闭环。
- **本质改动**: 将世界模型的“物理知识”与其“生成未来的计算”解耦。不直接蒸馏动作或生成未来帧，而是让小型VLA在训练时通过一个简单的特征对齐损失，去模仿冻结世界模型内部的视觉表征，推理时直接丢弃对齐模块，实现零额外推理成本。
- **技术溯源**: 学生模型基于 StarVLA 代码库中的 QwenGR00T 策略（Qwen3-VL 骨干网络 + GR00T 风格的 flow-matching 动作专家）；教师模型主要使用 Cosmos 3（提取其理解塔中的 Qwen3-VL-8B），消融实验中还使用了 Fast-WAM (基于 Wan2.2) 和 V-JEPA2-AC。

**2. 技术拆解**
- **核心方法**: 表示级蒸馏（Representation-Level Distillation）。在常规VLA训练的损失函数中，增加一项学生视觉特征与冻结世界模型特征的对齐损失（Cosine Loss）。
- **关键细节**: 
  - **输入输出**：输入为多视角图像、语言指令和本体状态；输出为动作块（action chunk）。
  - **特征提取与对齐**：对学生模型最后层（或指定层）的图像token进行 mean-pooling，通过一个两层 MLP projector 映射到教师特征维度。
  - **离线缓存机制**：教师模型在训练前离线运行一次，将每个视角的 pooled 特征存入内存映射缓存（按 trajectory id 和 base index 索引）。训练时直接读取缓存，无需加载教师权重，且 projector 在训练结束后丢弃。
  - **推理部署**：部署的策略与未蒸馏的 baseline 架构完全相同，0.8B 模型在消费级 RTX 5090 上推理耗时 32ms，显存占用 1.86GB。
- **训练/优化目标**: 总损失为 $\mathcal{L}_{act} + \lambda_{align}\mathcal{L}_{align}$。其中 $\mathcal{L}_{act}$ 是 flow-matching 动作回归的 MSE 损失；$\mathcal{L}_{align}$ 是学生投影特征与教师缓存特征之间的余弦距离损失（$\lambda_{align}=0.5$），教师特征使用 stop-gradient。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：仿真使用 LIBERO（4个suite，约273k步，双视角）和 RoboCasa-GR1（24个环境，6.02M步，单视角）；真机使用 AgileX Nero（7-DoF单臂）和 TRIP-Bag（7-DoF双臂）。
  - **对比对象（Baseline）**：OpenVLA, Seer, $\pi_0$, SmolVLA, GR00T N1, WorldVLA, Fast-WAM 等，以及同架构未蒸馏的 QwenGR00T (0.8B, 4B)。
- **评价指标**: 仿真与真机任务均使用成功率（Success Rate, SR）。仿真环境采用多GPU、多种子多次评估取均值以消除随机性。
- **主要结果**: 
  - **LIBERO**：0.8B 蒸馏模型达到 97.9% 平均成功率，比未蒸馏的 0.8B 模型（95.3%）高 2.6%，在小于 4B 的模型中表现最佳。
  - **RoboCasa-GR1**：0.8B 蒸馏模型从 48.2% 提升至 50.5%，超越了多个 4B 模型（如 QwenFAST, QwenPI, Isaac-GR00T），逼近 4B 未蒸馏模型（54.8%）。
  - **真机实验**：单臂水果抓取任务达到 93.3%（28/30），匹配 4B $\pi$-style 策略；单臂抓鸡蛋任务从 46.7% 提升至 60.0%；双臂水果交接任务从 40.0% 提升至 46.7%。
  - **鲁棒性（消融实验）**：该方法对学生规模（0.8B, 1B, 4B）、骨干网络（Qwen, InternVL）、对齐层位置、教师模型（Cosmos3, Fast-WAM, V-JEPA2）均有效，证明其传递的是通用的表征先验，而非特定网络间的脆弱对齐。
