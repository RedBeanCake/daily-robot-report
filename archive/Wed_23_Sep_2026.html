            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Beyond Single-Axis Testing: Paired Evaluation of Compound Robustness in Vision-Language-Action Policies] (超越单轴测试：视觉-语言-动作策略复合鲁棒性的配对评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.15940` | [点击跳转](https://arxiv.org/abs/2609.15940)

**0. 论文标题**
- **英文标题**: Beyond Single-Axis Testing: Paired Evaluation of Compound Robustness in Vision-Language-Action Policies
- **中文标题**: 超越单轴测试：视觉-语言-动作策略复合鲁棒性的配对评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出LIBERO-CTRL配对评估协议，揭示了VLA策略在多重扰动下存在的“涌现失败”和“补偿成功”现象，证明仅靠单轴聚合成功率无法准确衡量复合鲁棒性。

**1. 整体逻辑**
- **研究任务**: 评估视觉-语言-动作（VLA）策略在多种扰动同时发生（复合扰动）时的鲁棒性。
- **研究动机**: 现有VLA鲁棒性评估多为单轴（每次只测一种扰动），且依赖聚合成功率。这掩盖了单轴脆弱性的重叠情况，也无法区分“单轴全成功但复合失败（涌现失败）”和“单轴有失败但复合成功（补偿成功）”这两种相反的现象，导致复合鲁棒性被错误估计。
- **本质改动**: 提出完全配对的评估协议，在相同的初始状态和扰动参数下，对比单轴扰动和同时施加所有扰动的结果，从而将单轴脆弱性重叠与复合扰动带来的额外状态翻转剥离开来。
- **技术溯源**: 基于LIBERO机器人操作基准（及其扩展如LIBERO-Plus），测试了多种开源VLA策略（如 $\pi_{0.5}$, OpenVLA-OFT, UniVLA, SmolVLA, VLA-JEPA, PredVLA 等）。

**2. 技术拆解**
- **核心方法**: 构建LIBERO-CTRL六轴配对扰动协议。针对每个初始状态，固定扰动预设，分别进行6个单轴扰动评估和1个同时施加6个扰动的评估。通过数学分解，定义并计算“涌现失败率（$R_e$）”和“补偿成功率（$R_c$）”，以量化复合扰动下的状态翻转。
- **关键细节**: 
  - 测试6个主流语言条件VLA策略（参数量从0.68M到7.54B不等），以及1个辅助策略MINERVA。
  - 六轴扰动包括：相机视角、光照、机器人初始位姿、传感器噪声、执行器扰动、语言改写。
  - 严重程度分为3个级别（L1, L2, L3），基于归一化坐标的L2范数定义。
  - 评估规模：LIBERO的4个套件共40个任务，每个任务10个初始状态，共400个配置。每个配置跑7种条件（6单轴+1同时），3个严重程度，每个策略总计10,400次rollout。
- **训练/优化目标**: 本文为评估基准类工作，无训练目标。核心机制是配对评估与指标分解：将同时扰动成功率与单轴联合成功率的差值（$I$）分解为补偿成功率（$R_c$）减去涌现失败率（$R_e$）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO基准（包含Spatial, Object, Goal, Long四个套件）。
  - 对比对象（baseline）：6个主流VLA策略（$\pi_{0.5}$, OpenVLA-OFT, UniVLA, SmolVLA, VLA-JEPA, PredVLA），辅助对比MINERVA。
  - 测试环境：LIBERO仿真环境，控制步数预算为220至520步不等。
- **评价指标**: 
  - 单轴及复合聚合成功率（$S_a$, $S_{sim}$）。
  - 单轴联合成功率（$S_{conj}$）与独立预期成功率（$S_{indep}$）。
  - 核心指标：涌现失败率（$R_e$）、补偿成功率（$R_c$）、总分歧率（$R_d$）。
- **主要结果**: 
  - 单轴鲁棒性呈现强烈的各向异性，不同策略对不同扰动的敏感度差异巨大。
  - 复合扰动下存在严重的“抵消效应”：例如OpenVLA-OFT在L2下，涌现失败率和补偿成功率均约为13.5%，总分歧率高达27.25%，但聚合差值$I$仅为+0.25%，在统计上无法与0区分。
  - 总分歧率最高可达34.5%（VLA-JEPA在L2下）。
  - 涌现失败占比较高：例如VLA-JEPA在L1下，75%的同时条件失败属于涌现失败（即单轴测试全成功，但复合测试失败）。
  - 通过独立重复评估控制策略随机性，证实$R_e$和$R_c$的变化在几个百分点以内，说明这种双向状态翻转是稳定的，并非单纯由策略随机性引起。

### 2. 🔥 [WLA$^3$: World Latent Action Modeling for Semantics, Dynamics, and Kinematics] (WLA$^3$：面向语义、动力学与运动学的世界潜在动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.15870` | [点击跳转](https://arxiv.org/abs/2609.15870)

**0. 论文标题**
- **英文标题**: WLA$^3$: World Latent Action Modeling for Semantics, Dynamics, and Kinematics
- **中文标题**: WLA$^3$：面向语义、动力学与运动学的世界潜在动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出WLA$^3$框架，通过构建世界潜在动作模型（WLAM）将多模态世界状态转移压缩为统一的潜在动作表示，并在语义、动力学和运动学三个层面复用，大幅提升了通用机器人策略模型在异构数据下的扩展性和真实任务成功率。

**1. 整体逻辑**
- **研究任务**: 训练通用机器人策略模型（Generalist policy models），使其能利用海量异构数据（人类视频、机器人轨迹、仿真等）学习并执行操作任务。
- **研究动机**: 异构数据缺乏统一且低噪声的动作监督。人类视频动作标签少且噪声大，机器人轨迹稀缺且绑定特定硬件。现有的潜在动作模型（LAM）多依赖单视图图像对，存在遮挡和视角歧义，且通常只为单一任务设计，未作为整个策略模型栈的共享接口。
- **本质改动**: 将“世界状态转移”作为跨数据源的统一动作监督。提出WLAM联合编码多视图和本体状态，提取紧凑的局部潜在动作和段级转移特征，并在动力学、语义和运动学三个粒度上复用这些表示来训练通用策略。
- **技术溯源**: 潜在动作模型（LAMs, 如LAPA, UniVLA, CLAP等），视觉语言模型（VLMs），条件流匹配（Conditional Flow Matching），世界模型（如DreamDojo, LAC-WM）。

**2. 技术拆解**
- **核心方法**: 包含两部分：1) WLAM预训练：从多模态世界状态转移中学习潜在动作表示；2) WLA$^3$策略训练：在三个层面复用WLAM的表示，分别是LAC-WM（学习动力学）、SLA（监督VLM学习语义）和LARA（联合预测潜在动作和原生机器人动作）。
- **关键细节**: 
  - **WLAM**：输入起始和结束的世界状态（同步相机视图+本体状态），输出32维连续潜在动作和1024维转移特征。训练时使用跨模态转移dropout（防止依赖单一模态）和重叠时间窗的余弦距离一致性正则化。
  - **LAC-WM（动力学）**：用32维局部潜在动作条件化，使用条件流匹配（Conditional Flow Matching）预测未来视觉特征。
  - **SLA（语义）**：将1024维转移特征在30步策略片段上均值池化，直接监督VLM预测该片段级特征。
  - **LARA（运动学）**：使用Perceiver架构和条件流匹配，联合预测32维潜在动作和特定embodiment的机器人原生动作（通过掩码处理不同硬件的维度差异）。
- **训练/优化目标**: 
  - **WLAM**：重建损失（像素、LPIPS、光流、DINO、深度、3D几何、状态等） + 重叠一致性损失（余弦距离） + VAE的KL散度正则化。
  - **策略模型**：LAC-WM的速度场回归与时间差分正则化；SLA的MSE损失；LARA的掩码流匹配损失（带EMA归一化以平衡不同分支的尺度）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：84.1K小时异构数据，包括人类第一人称视频（如EgoLive, Ego4D等）、真实机器人轨迹（如AgiBot World, ABC-130K等）、仿真轨迹和UMI演示。
  - **对比对象（Baseline）**：LARYBench基准上的DiLA, MVP-LAM, CLAP, DreamDojo, LAPA, UniVLA, villa-X；真实机器人任务上的 $\pi_{0.5}$。
  - **测试环境**：LARYBench表示评估基准；6个AgiBot G1桌面操作任务（包含空间、光照、背景三种泛化设置）。
- **评价指标**: LARYBench的语义分类准确率（top-1 accuracy）和控制回归MSE；真实机器人任务的成功率（SR）。
- **主要结果**: 
  - **表示能力**：WLAM的32D最终潜在动作在LARYBench上达到67.89%平均分类准确率和0.49的MSE，优于所有baseline；其1024D标准表示达到70.75%分类准确率和0.37的MSE。
  - **策略性能**：WLA$^3$在6个真实机器人任务上平均成功率达81.9%，比 $\pi_{0.5}$ (66.2%) 高出15.7%。
  - **数据Scaling**：mid-training数据从5K小时扩到20K小时，平均成功率从57.6%提升至81.9%。
  - **人机对齐**：在仅使用5%机器人数据时，加入任务匹配的人类视频数据可使成功率从40%提升至60%，部分弥补了机器人数据的不足。

### 3. 🔥 [DIDO: Distilling Interaction-Centric Dynamics into One-Step Denoising for World Action Models] (DIDO：将交互中心动态蒸馏到世界动作模型的单步去噪中)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.15570` | [点击跳转](https://arxiv.org/abs/2609.15570)

**0. 论文标题**
- **英文标题**: DIDO: Distilling Interaction-Centric Dynamics into One-Step Denoising for World Action Models
- **中文标题**: DIDO：将交互中心动态蒸馏到世界动作模型的单步去噪中
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DIDO，通过分布匹配蒸馏和交互中心视觉推理，将世界动作模型的多步视频去噪压缩为单步，在大幅降低推理延迟的同时保留了对机器人操作至关重要的夹爪-物体交互动态。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的世界动作模型（WAMs）推理加速与未来视觉动态预测。
- **研究动机**: WAMs 依赖多步视频扩散模型预测未来，导致闭环控制延迟高。若直接截断为单步去噪，虽能保留静态背景，但会丢失后续步骤才形成的、对操作至关重要的夹爪与物体交互动态（实证发现背景在第一步即收敛，而交互细节需多步才清晰）。
- **本质改动**: 将多步视频模型的收敛动态蒸馏至单步生成，并引入显式的交互中心视觉推理（通过边界框轨迹监督和多层视觉特征对齐），强制单步模型恢复并保留交互动态。
- **技术溯源**: 基于 Wan2.2-TI2V-5B 视频生成模型（及其四步蒸馏版本）、DMD（分布匹配蒸馏）、DINOv3 视觉编码器。

**2. 技术拆解**
- **核心方法**: 
  1. 单步动态蒸馏：使用 DMD 将四步教师模型的收敛分布蒸馏到单步学生模型，实现单次前向传播。
  2. 交互中心视觉推理：在视频 Transformer 中引入四类特定 token（物体、交互、夹爪、对齐）。通过边界框轨迹监督物体和夹爪的空间演化，并通过 DINOv3 特征对齐保留物体的判别性视觉信息。
  3. 交互感知动作预测：采用混合 Transformer 架构，动作专家直接访问世界模型的中间表示，并通过基于动态的 token 细化机制压缩冗余的未来视频 token。
- **关键细节**: 
  - 模型结构：视频模型基于 Wan2.2-TI2V-5B；动作专家与视频模型深度相同、隐藏层宽度为四分之一；引入 64 个交互中心 token（分 4 组，每组 16 个）。
  - 动作块长度 (Action chunk size) $H_a = 32$。
  - 动态 token 细化：将空间特征图划分为 $4 \times 5$ 网格，保留动态最强的 top-3 区域的全分辨率 token，其余 17 个区域进行 $2 \times 2$ 平均池化压缩，减少冗余。
- **训练/优化目标**: 
  - Stage I (单步交互中心动态学习)：联合优化分布匹配损失 ($\mathcal{L}_{\text{DMD}}$)、边界框轨迹监督损失 ($\mathcal{L}_{\text{inter}}$，包含 Smooth L1 和 GIoU) 和多层视觉对齐损失 ($\mathcal{L}_{\text{align}}$，L1 距离)。
  - Stage II (联合策略学习)：在 Stage I 基础上，加入视频生成损失 ($\mathcal{L}_{\text{video}}$，Flow Matching) 和动作生成损失 ($\mathcal{L}_{\text{act}}$，Flow Matching)，联合微调视频骨干、交互 token 和动作专家。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（空间、物体、目标、长程四个子集）、RoboTwin（双臂仿真）、LIBERO-Plus（鲁棒性/分布偏移）、真实机器人 Galbot G1。
  - 对比对象 (Baselines)：VLA 模型（$\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, X-VLA）和 WAM 模型（LingBot-VA, Motus, Faster-WAM, Flash-WAM, Fast-WAM, ST-WAM）。
- **评价指标**: 仿真环境使用任务成功率（Success rate, %）；真实世界使用归一化任务进度得分（Normalized task-progress scores）；系统效率使用端到端推理延迟（ms）。
- **主要结果**: 
  - 仿真性能：在 LIBERO 上平均成功率达 99.0%（SOTA，比 LingBot-VA 和 Faster-WAM 高 0.5%，比 Fast-WAM 高 1.4%）；在 RoboTwin 上达 92.0%（无具身预训练方法中的最佳，仅比 LingBot-VA 低 0.2%）。
  - 鲁棒性与泛化：在 LIBERO-Plus 上平均成功率 76.6%（比 Faster-WAM 高 1.6%）；在真实机器人 Galbot G1 的基础和高级协议下分别取得 80.8 和 66.0 的最高平均分。
  - 效率：端到端推理延迟为 384 ms，比四步教师模型（562 ms）降低 32%；相比完全去除未来想象的 Fast-WAM（356 ms）仅增加 28 ms 延迟，但 LIBERO 性能提升 1.4%，LIBERO-Plus 性能提升 25.1%。

### 4. 🔥 [IMPACT-VLA: Interaction-aware Multimodal Propagation Attribution via Counterfactual Trajectories for Vision-Language-Action Policies] (IMPACT-VLA：基于反事实轨迹的视觉-语言-动作策略交互感知多模态传播归因)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.15005` | [点击跳转](https://arxiv.org/abs/2609.15005)

**0. 论文标题**
- **英文标题**: IMPACT-VLA: Interaction-aware Multimodal Propagation Attribution via Counterfactual Trajectories for Vision-Language-Action Policies
- **中文标题**: IMPACT-VLA：基于反事实轨迹的视觉-语言-动作策略交互感知多模态传播归因
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于闭环反事实执行的归因框架 IMPACT-VLA，通过将动作转换与策略查询边界对齐来划分阶段，精准量化了 VLA 模型在多模态输入下各执行阶段的模态贡献及跨阶段交互依赖。

**1. 整体逻辑**
- **研究任务**: 分析 VLA（视觉-语言-动作）策略在闭环执行过程中，多模态输入（视觉、本体感觉、语言）在不同执行阶段对最终任务成功的贡献，以及输入干预的影响如何在后续状态和动作中传播。
- **研究动机**: 前人做归因，要么看单步的局部敏感度（如梯度/扰动），要么看整个 episode 的聚合重要性，这既没考虑动作在环境里的闭环传播效应，也没和 VLA 的 action-chunk 结构对齐。此外，独立测量各阶段无法解释跨阶段的互补或冗余交互。
- **本质改动**: 把时间轴切成了和动作 chunk 边界对齐的“行为阶段”，将“阶段+模态”打包成最小归因单元（Player），在闭环环境里算 Shapley 值，并引入了跨阶段非加性交互和轨迹传播分析，区分了行为恢复与功能恢复。
- **技术溯源**: 基于 OpenVLA-OFT 模型，使用 LIBERO 数据集，底层结合了 CUSUM 变点检测（用于阶段划分）和 Shapley 值（用于归因计算）。

**2. 技术拆解**
- **核心方法**: 
  1. **阶段构建**：基于参考成功轨迹中实际执行动作的转换，使用 CUSUM 统计量检测变点，并将变点对齐到策略查询边界（action-chunk boundaries），从而划分出行为阶段。
  2. **闭环归因**：将每个“阶段-模态”组合定义为一个归因玩家。通过替换（如均值、灰度、模糊、噪声）特定玩家的输入，在闭环中重新执行策略，计算其对最终任务成功的采样 Shapley 贡献。
  3. **跨阶段交互与恢复分析**：计算早期块和晚期块联合效应与各自独立效应之和的偏差，以衡量互补性或冗余性；通过对比干预后的轨迹偏差和最终成功率，区分行为恢复（轨迹收敛）和功能恢复（任务成功）。
- **关键细节**: 
  - **输入模态**：第三人称视觉、腕部视觉、本体感觉（8维）、语言。
  - **模型配置**：OpenVLA-OFT，动作块长度 $K=8$。
  - **阶段划分**：最小阶段长度设为 8 个动作步，变点检测阈值 $\lambda_C=5.0$。
  - **归因计算**：采样排列数 $L=128$，交互分析每个 pair 采样 32 个上下文。
  - **替换策略**：视觉使用均值/灰度(128)/模糊(半径12)/噪声(标准差40)，本体感觉使用均值，语言使用空字符串。
- **训练/优化目标**: 本文非模型训练工作，而是分析框架。核心机制是基于 Shapley 值的闭环反事实评估，目标是准确量化各阶段-模态块对最终任务成功的边际贡献及跨阶段交互效应。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO benchmark（30个任务：Spatial 10, Object 10, Goal 10）。
  - **对比对象（baseline）**：LOO (Leave-One-Out), Static Action Perturbation, Random, Phase-restricted Shapley, Modality-only Shapley, Uniform query-aligned phases。
- **评价指标**: 
  - **归因准确性**：MAE（平均绝对误差）, Spearman 相关系数（在受控随机闭环游戏中验证）。
  - **闭环保真度**：Deletion pAUC（删除曲线下面积）, Insertion pAUC（插入曲线下面积）。
  - **结构消融**：Top-modality removal effect（移除最重要模态后的成功率下降）。
- **主要结果**: 
  - **阶段主导模态动态变化**：在 30 个任务中，25 个（83.3%）表现出相邻阶段的主导模态转变，证明模态贡献是随阶段动态变化的，而非一成不变。
  - **闭环保真度更优**：IMPACT-VLA 在 Deletion 和 Insertion pAUC 上均显著优于 Static Action Perturbation 和 LOO，证明闭环归因比局部动作敏感度更忠实于实际任务结果。
  - **跨阶段交互效应**：对于负交互对，早期阶段输入替换使后期块的边际收益增加了约 3.3 倍，说明后期信息的价值高度依赖早期信息的可用性。
  - **功能恢复可独立于行为恢复**：在冗余交互组中，62.5% 的功能恢复没有伴随行为恢复（轨迹未收敛），表明后期信息可以补偿任务成功，而不需要完全恢复参考轨迹。

### 5. 🔥 [Channel-Adaptive Region Adjacency Graph Carriers for Semantic Image Communication] (用于语义图像通信的信道自适应区域邻接图载体)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.14616` | [点击跳转](https://arxiv.org/abs/2609.14616)

**0. 论文标题**
- **英文标题**: Channel-Adaptive Region Adjacency Graph Carriers for Semantic Image Communication
- **中文标题**: 用于语义图像通信的信道自适应区域邻接图载体
- **研究机构**: 原文未提及
- **一句话总结**: 提出用区域邻接图（RAG）替代密集张量或网格布局作为语义通信载体，并通过信道自适应图简化（CGS）动态控制传输节点数，在极低信道开销下实现了更高的语义重建质量。

**1. 整体逻辑**
- **研究任务**: 语义图像通信（在带宽和噪声受限的信道下，传输与下游任务相关的图像语义信息并重建图像）。
- **研究动机**: 现有的语义图像载体通常是密集的潜在张量（如DeepJSCC）或网格对齐的语义布局（如GESCO），它们没有显式编码区域级别的空间关系，且表示尺寸固定，无法根据信道条件自适应控制传输的语义实体数量。
- **本质改动**: 将语义载体从“固定尺寸的网格/张量”改为“由场景复杂度决定的区域邻接图（RAG）”，并引入基于信噪比的图简化机制（CGS）来动态裁剪传输的节点预算，实现语义速率自适应。
- **技术溯源**: 基于 SegFormer-B2（语义分割）、GAT（图注意力网络编码器）、Stable Diffusion 1.4 + ControlNet（接收端扩散重建）；对比基线借鉴了 DeepJSCC（联合信源信道编码）和 GESCO（布局基线与扩散重建架构）。

**2. 技术拆解**
- **核心方法**: 构建基于分割的区域邻接图（RAG）作为载体，使用图注意力网络（GAT）编码节点特征；设计信道自适应图简化（CGS），根据信噪比（SNR）计算保留比例，通过综合节点重要性得分进行Top-M节点选择；接收端使用语义信念传播（SBP）细化带噪图嵌入，最后通过ControlNet引导的扩散模型重建图像。
- **关键细节**: 
  - **节点特征**：采用低维可解释特征（类别one-hot、面积比例、质心、RGB直方图、视差等），维度为K+28（在Cityscapes下为47维）。
  - **图编码器**：3层GAT，隐藏层维度d=64。
  - **CGS机制**：保留比例随SNR线性变化（0到20dB映射到0.5到1.0），节点重要性由MLP输出、区域面积和类别逆频率加权计算。被丢弃的节点会合并到重要性最高的相邻节点中。
  - **传输与接收**：采用模拟JSCC传输实值符号（无数字信道编码），支持AWGN和Rayleigh衰落信道；SBP进行5次迭代消息传递以细化嵌入；扩散模型使用DDIM采样（20或25步）。
- **训练/优化目标**: 图模块、渲染器和ControlNet可训练参数使用扩散噪声预测的均方误差（MSE）进行优化；SegFormer和SD-1.4的VAE/U-Net保持冻结。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：Cityscapes（500张验证集图像，每张4次独立噪声实现，共2000个图像-噪声对）。
  - **对比对象（Baseline）**：DeepJSCC（5层CNN autoencoder，作为JSCC参考），GESCO-inspired layout baseline（网格对齐语义布局，使用相同的ControlNet+Diffusion解码器以控制变量）。
  - **测试环境**：AWGN (0-15 dB)，理想化Rayleigh衰落（完美CSI零迫衡），以及结构化节点擦除压力测试。
- **评价指标**: 语义一致性（mIoU，越高越好），感知质量（LPIPS和FID，越低越好），传输开销（Channel uses / 信道使用次数）。
- **主要结果**: 
  - **载体紧凑性**：RAG载荷（平均8170 bits）远小于无损压缩后的网格布局（平均45969 bits）。
  - **端到端性能（AWGN）**：在0-15 dB下，CA-RAG的mIoU显著高于两个Baseline；相比同解码器的Layout baseline，在0/10/15 dB下LPIPS更低，且所有SNR下FID更低。
  - **速率-质量权衡（10 dB）**：CA-RAG在约3300次信道使用下达到mIoU=0.329；而Layout baseline在最低速率（5300次）下mIoU仅0.108，即使拉满到160万次信道使用，mIoU也仅为0.268。证明图载体在低开销下具有压倒性的语义保留优势。
  - **消融与鲁棒性**：CGS有效控制了传输速率（去掉CGS传全图质量提升但开销翻倍）；SBP在AWGN下收益适中；GAT编码器比逐节点MLP在mIoU上表现更好；在理想化Rayleigh衰落和节点擦除测试中表现出良好的鲁棒性。

### 6. 🔥 [VLBiMan++: Expanding the Generalization Boundary of Vision-Language Anchored One-Shot Bimanual Manipulation] (VLBiMan++：扩展视觉-语言锚定的单样本双臂操作的泛化边界)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.14310` | [点击跳转](https://arxiv.org/abs/2609.14310)

**0. 论文标题**
- **英文标题**: VLBiMan++: Expanding the Generalization Boundary of Vision-Language Anchored One-Shot Bimanual Manipulation
- **中文标题**: VLBiMan++：扩展视觉-语言锚定的单样本双臂操作的泛化边界
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种免训练的单样本双臂操作框架，通过将人类演示分解为状态不变与状态依赖技能，结合视觉-语言模型提取几何锚点进行自适应，实现了在任务、物体、场景、机器人本体及长期部署五个维度的广泛泛化。

**1. 整体逻辑**
- **研究任务**: 解决双臂机器人操作中的单样本（one-shot）泛化问题，即仅凭一次人类演示，在无需重新收集数据和重训练策略的前提下，使机器人能适应新任务组合、新物体（含关节/柔性体）、杂乱场景、异构机器人本体以及长期执行中的动态扰动。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型或模仿学习方法高度依赖大规模遥操作数据，且跨场景迁移需重训；而现有的免训练模块化方法（如ReKep）多局限于刚体位姿迁移，难以处理非刚体形变、语义杂乱的场景、不同运动学构型的机器人本体，以及长时序执行中的累积误差和外部扰动。
- **本质改动**: 将单次人类演示视为“可复用的任务先验”，通过任务感知分解剥离出“状态不变”和“状态依赖”的原子技能；利用视觉-语言模型进行语义锚定，并针对刚体、关节体和柔性体设计专用的几何锚点提取与自适应机制；最后通过闭环重观测与局部轨迹重组，实现无需重训的广泛泛化。
- **技术溯源**: 基于作者前期的会议版本 VLBiMan，结合了预训练的视觉-语言模型（Florence-2）和视觉基础模型（SAM2），并融合了传统的图像矩（Image moments）、形态学处理、骨架提取等几何与计算机视觉方法。

**2. 技术拆解**
- **核心方法**: 框架包含三个核心模块：1) **任务感知双臂分解**：根据末端与物体的耦合关系，将演示轨迹分割为状态不变技能（如抓取后搬运）和状态依赖技能（如接近、对齐）；2) **视觉-语言锚定自适应**：用VLM/VFM分割目标，提取紧凑的几何锚点（刚体用质心/接触点，关节体用局部功能部件，柔性体用拓扑关键点），计算状态变化并映射调整依赖状态的轨迹；3) **自主轨迹重组**：通过渐进式IK求解、碰撞补偿和闭环重观测，生成并执行最终的双臂轨迹。
- **关键细节**: 
  - **输入输出**：输入为任务文本、单次人类演示（双目RGB及双臂6-DoF位姿/夹爪状态）和新场景观测；输出为适应新场景的可执行双臂轨迹。
  - **几何锚点提取**：刚体利用2D掩码质心或接触点，通过图像矩计算主轴方向；关节体仅提取局部功能部件的几何特征；柔性体（矩形/线形）通过形态学平滑、凸包多边形近似或骨架图论分析，提取等距采样的边界锚点。
  - **闭环机制**：执行中若物体状态偏差超过阈值 $\epsilon$，则触发重观测，仅对受影响的状态依赖技能进行重新实例化和局部轨迹重组。
- **训练/优化目标**: 纯免训练（Training-free）框架。无传统意义上的损失函数，核心优化目标是通过几何锚点变换（如刚体6-DoF变换、柔性体锚点映射）进行轨迹自适应，并结合运动学约束（渐进式IK）与物理约束（碰撞补偿）进行轨迹重组。

**3. 实验结果**
- **实验设置**: 
  - **任务与环境**：19个真实世界双臂操作任务（10个原有+9个新增），涵盖基础技能、长时序、工具使用、物体重排、关节体（拉链笔袋）和柔性体（线缆、毛巾）。
  - **硬件平台**：两个异构双臂平台。P1为对置式固定基座（Aubo-i5机械臂），P2为人形风格平台（Rokae xMate CR7机械臂）。
  - **对比对象 (Baseline)**：Robot-ABC, ReKep, ReKep+, Mechanisms, MAGIC。
- **评价指标**: 真实机器人实验的任务成功率（Task success rate）。在ID（同物体新位置）和OOD（新物体新位置）设置下评估，并测试了动态干扰、杂乱场景、跨本体迁移和超长时序执行。
- **主要结果**: 
  - **基础与长时序任务 (P1平台)**：在ID无干扰下，6个基础任务平均成功率达85.3%，4个长时序任务达52.0%，显著优于ReKep+（63.3%和34.0%）等baseline。在OOD和动态干扰下同样保持领先。
  - **新任务与非刚体 (P2平台)**：在9个新任务中，ID无干扰下重排任务平均成功率81.3%，非刚体任务56.0%，远超其他方法（如ReKep+的43.3%和16.0%）。
  - **跨本体与鲁棒性**：从P1迁移到P2的成功率保持在70%左右；在动态干扰测试中，成功率随干扰次数增加下降平缓；超长时序测试（连续20次执行）证明闭环机制能有效防止误差累积，维持稳定执行。

### 7. 🔥 [What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency] (是什么造就了高效的VLA？探索动作头设计、模型缩放与推理延迟)
- **研究机构**: `MindVLA Team`
- **Arxiv ID**: `2609.13984` | [点击跳转](https://arxiv.org/abs/2609.13984)

**0. 论文标题**
- **英文标题**: What Makes an Efficient VLA? Navigating Action-Head Design, Scaling, and Latency
- **中文标题**: 是什么造就了高效的VLA？探索动作头设计、模型缩放与推理延迟
- **研究机构**: MindVLA Team
- **一句话总结**: 本文通过严格控制变量并配对推理延迟的消融实验，发现VLA模型中动作头（Action Head）直接复制语言骨干权重是决定性能的最核心因素，并据此提炼出了一个极简、高效且极具鲁棒性的EffVLA构建配方。

**1. 整体逻辑**
- **研究任务**: 探究模块化视觉-语言-动作（VLA）模型中，动作头（Action Head）的架构设计、损失函数、初始化方式以及各模块缩放对模型性能和端侧推理延迟的真实影响。
- **研究动机**: 现有VLA模型（如OpenVLA、$\pi_0$等）的设计多靠试错，各自固定不同的组件、数据和评测集。领域内缺乏在统一协议下控制变量，并严格考量实际推理延迟（latency-paired）的对比分析，导致大家不知道到底哪个设计选择真正起了作用。
- **本质改动**: 属于**系统设计/消融实验（Design-space study）**。本文没有提出全新的网络架构，而是做了一项极其严谨的“控制变量+配对延迟”的设计空间探索，揭示了“表示对齐（Representation alignment）”在VLA设计中的决定性作用，把复杂的VLA设计简化为三条直观的工程法则。
- **技术溯源**: 视觉编码器采用 SigLIP2，语言骨干采用 Qwen2.5，预训练数据使用 DROID，评估基准为 LIBERO / LIBERO-Plus。对比的基线思路包括自回归解码（FAST）、MLP回归（OpenVLA-OFT）和流匹配（$\pi_0$）。

**2. 技术拆解**
- **核心方法**: 固定视觉和语言骨干，独立 sweeping 动作头的四个轴（解码器结构、损失函数、权重初始化、推理次数）以及三个模块（V/L/A）的缩放规模。提出三条设计法则：
  1. **怎么建**：用语言骨干的最后几层初始化动作头（VLM-init），并保持简单的单步L1回归。
  2. **怎么缩放**：对齐后，将缩放预算优先给动作头（Action Head）。
  3. **堆多大**：模型达到约3.75B参数时停止缩放，再大只增延迟不涨点。
- **关键细节**: 
  - **动作头设计**：测试了8种substrate。发现随机初始化时，复杂的解码器和Flow matching能弥补对齐的缺失；但一旦使用VLM-init（复制Qwen2.5最后4层Transformer），复杂的解码器、Flow matching loss和4次推理迭代都不再带来收益，甚至掉点（Flow matching掉4.4%）。
  - **机制分析**：通过CKA（中心核对齐）和注意力分析证明，VLM-init让动作头在权重空间和注意力分布上与语言骨干保持高度一致，直接继承了VLM对指令名词的接地（grounding）能力，无需从头学习如何读取特征。
  - **EffVLA配置**：SigLIP2-So400m (视觉) + Qwen2.5-3B (语言) + 4层Transformer动作头 (从Qwen2.5复制)，单步L1回归，输入分辨率256像素，action chunk size为8，总参数约3.75B。
- **训练/优化目标**: 两阶段训练。Stage A：在DROID数据集上预训练动作头（冻结骨干）；Stage B：在LIBERO数据集上全参数微调（100k steps）。针对EffVLA，优化目标为单步L1回归损失（L1 regression loss）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（标准）和 LIBERO-Plus（包含7个零样本扰动轴，如背景、相机视角、语言指令、传感器噪声等）。
  - **对比对象**：OpenVLA, $\pi_0$, OpenVLA-OFT, ABot-M0 等开源SOTA。
  - **测试环境**：NVIDIA RTX 5090，bf16精度，测量端到端推理延迟。
- **评价指标**: 任务成功率（Success Rate, %）和 端到端推理延迟（Latency, ms）。
- **主要结果**: 
  - **消融结论**：VLM-init 比随机初始化在LIBERO-Plus上高出 7.1% 成功率，且无额外延迟。对齐后，动作头缩放收益最高（每增加1ms延迟换约4个点成功率），但在3.75B参数处收益饱和。
  - **对比SOTA**：EffVLA 在标准 LIBERO 上达到 98.2%（匹配最强开源）；在 LIBERO-Plus 的 7 个扰动轴中领先 6 个（特别是相机视角和语言指令轴），且推理延迟极低（仅 39.2 ms）。
  - **真机部署**：配方零修改直接迁移到低成本 SO-ARM101 机械臂，仅替换训练数据，50次多物体抓取排序任务成功40次，验证了该配方在真实物理世界的泛化性。

### 8. 🔥 [ReWeight: Leveraging Human Data for VLA Post-Training via Demonstration Retrieval and Sample Weighting] (ReWeight：通过演示检索与样本加权利用人类数据进行VLA后训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.13851` | [点击跳转](https://arxiv.org/abs/2609.13851)

**0. 论文标题**
- **英文标题**: ReWeight: Leveraging Human Data for VLA Post-Training via Demonstration Retrieval and Sample Weighting
- **中文标题**: ReWeight：通过演示检索与样本加权利用人类数据进行VLA后训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ReWeight 框架，通过学习跨具身视觉-运动表征，在演示级别检索和样本级别加权，解决了直接混合人类与机器人数据导致的跨具身差异干扰问题，显著提升了 VLA 模型的后训练效果。

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的后训练（Post-training），具体是如何利用低成本、大规模的第一人称人类视频数据，来增强特定机器人平台在目标任务上的表现。
- **研究动机**: 机器人数据收集成本高，人类数据虽然丰富，但直接混合人类和机器人数据会引入“跨具身差异”（cross-embodiment discrepancies），反而导致策略性能下降。现有的数据检索或加权方法要么只关注任务层面的相似度，要么只在机器人域内评估样本重要性，没有解决跨具身迁移时细粒度的行为相关性问题。
- **本质改动**: 把“用人类数据微调 VLA”拆解为“选哪些演示”和“每个样本占多大权重”两个联合决策。通过学习一个结合视觉和未来动作的跨具身表征，用最优传输（OT）距离在演示级别筛选出最相关的人类数据，并在样本（帧）级别根据跨具身差异分配连续权重。
- **技术溯源**: 基座模型采用 $\pi_{0.5}$；动作重定向用了 LeVR；表征学习用了 InfoVAE 和对抗学习；相似度度量用了最优传输（Optimal Transport）；动作精炼用了 PPO 强化学习。

**2. 技术拆解**
- **核心方法**: ReWeight 框架包含三个核心模块：1) 具身感知的人类动作精炼（用 RL 修正重定向后的人类动作，使其符合机器人动力学）；2) 跨具身视觉-运动编码器（结合视觉观察和未来动作，用对抗学习和 OT 对齐，学习域不变的表征）；3) 演示级检索与样本级加权（基于 OT 距离计算检索分数和帧级权重，直接作用于 VLA 的后训练 Loss）。
- **关键细节**: 
  - **动作精炼**：先用 LeVR 将人手运动学映射到机器人动作空间，再训练一个残差 RL 策略（PPO）来修正速度/加速度等动态约束违规。
  - **视觉-运动编码器**：ResNet-18 + 时序 Transformer。输入 8 帧图像和 20 帧未来动作块。预热阶段用 SwAV/TCN/TCC 提取视觉特征；对齐阶段加入对抗损失和 OT 对应损失（带时序不匹配惩罚）来消除具身差异。最后用 InfoVAE 融合视觉和动作，并加入阶段预测辅助损失来对齐任务进度。
  - **检索与加权**：计算人类演示与所有机器人演示的 OT 距离，取 Top-5 最小距离的平均值作为检索分数，按 1:1 比例选出最相关的人类演示。对保留的演示中的每一帧，计算帧级 OT 距离，通过一个校准参数（$\alpha=0.5$）将其转换为 0 到 1 之间的连续权重。
- **训练/优化目标**: 
  - **视觉编码器**：最小化包含对比损失、时序损失、OT 对应损失和对抗损失的联合损失。
  - **视觉-运动编码器**：最小化 VAE 的重建损失、正则化损失以及潜在空间的阶段对齐/分离损失。
  - **VLA 后训练**：最小化加权动作预测损失，其中机器人数据权重固定为 1，人类数据权重为计算出的帧级权重。

**3. 实验结果**
- **实验设置**: 
  - **仿真环境**：RoboTwin 2.0 基准，8 个双臂操作任务（如堆叠、抓取放置等）。人类数据来自 EgoDex。
  - **真实环境**：DoBot 双臂平台，4 个任务（堆叠碗、放泰迪熊、摘水果、按订书机）。
  - **对比基线（Baseline）**：Robot-Only（仅用机器人数据），Naive Mixing / Random 1.0（随机等量混合人类和机器人数据），以及不同固定权重的 Retrieval 变体（Retrieval 0.4/0.7/1.0）。
- **评价指标**: 任务成功率（Success rate）。在 Clean（干净）和 Randomized（加入光照变化、视觉干扰物等扰动）设置下评估。消融实验还评估了阶段准确率（Stage Acc.）和关键帧距离（KF Dist.）。
- **主要结果**: 
  - **仿真**：Clean 设置下，ReWeight 平均成功率达到 57%，比 Robot-Only (39%) 和 Random Mixing (44%) 分别提升 18% 和 13%。Randomized 设置下，ReWeight (42%) 也显著优于 Baseline (34% 和 32%)。
  - **真实世界**：Clean 设置下平均成功率 68.8%，比 Robot-Only (40.0%) 和 Naive Mixing (55.0%) 分别高出 28.8% 和 13.8%。在 Randomized（扰动）设置下，ReWeight 成功率高达 60.0%，远超 Robot-Only (28.8%) 和 Naive Mixing (41.3%)。
  - **结论验证**：证明了单纯堆砌人类数据不仅没用反而有害；通过跨具身检索和细粒度样本加权，能有效过滤干扰样本，显著提升 VLA 模型的泛化和鲁棒能力。

### 9. 🔥 [GeomVLA: Unifying Scene, Motion, and Action in 3D] (GeomVLA：在3D空间中统一场景、运动与动作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.13812` | [点击跳转](https://arxiv.org/abs/2609.13812)

**0. 论文标题**
- **英文标题**: GeomVLA: Unifying Scene, Motion, and Action in 3D
- **中文标题**: GeomVLA：在3D空间中统一场景、运动与动作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种在机器人中心3D坐标系下统一场景感知、潜在运动预测和动作生成的视觉-语言-动作（VLA）模型，通过保持全链路的几何一致性提升了机器人操作性能。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作（根据多视角视觉观察和语言指令，生成机器人末端执行器或关节角的控制动作）。
- **研究动机**: 现有VLA模型多在2D图像空间操作，而机器人控制本质需要3D几何推理；现有的3D VLA或未来预测方法要么只关注静态3D场景，要么在2D像素空间做未来预测，导致场景理解、运动推理和动作控制之间存在几何表示不匹配。
- **本质改动**: 摒弃在2D图像空间或分离坐标系中进行推理的做法，将场景表示、潜在的未来运动推理和动作生成统一在同一个以机器人为中心的度量3D坐标系（metric 3D coordinate frame）中。
- **技术溯源**: 基于预训练的视觉-语言模型（Florence-2），结合了流匹配（Flow Matching / Rectified Flow）生成范式与3D点追踪伪标签（SpatialTrackerV2）。

**2. 技术拆解**
- **核心方法**: 
  1) 3D场景特征提升：利用深度图和相机标定，将VLM的2D特征映射到机器人基座坐标系，生成带有3D空间位置的3D场景token。
  2) 3D场景轨迹去噪器：在3D空间中预测未来场景点的运动位移增量，提取中间运动特征。
  3) 3D动作去噪器：不直接执行预测的轨迹，而是从轨迹去噪器的中间状态（初始噪声状态下的一次速度场评估）提取运动token，通过几何感知注意力融合到场景token中，条件化基于流的3D动作去噪器生成动作。
- **关键细节**: 
  - 输入：多视角RGB-D图像、语言指令、机器人本体感知（proprioception）。
  - 结构：VLM编码器提取语义；3D轨迹去噪器使用局部几何感知注意力和序列化空间注意力（基于Morton码）处理20x20的3D锚点网格，预测15个未来时间步；3D动作去噪器使用3D RoPE和几何感知Transformer块，预测10或16个动作的chunk。
  - 规模：模型总参数量约1.2B至1.3B（依具体变体而定），VLM部分在第二阶段联合微调。
- **训练/优化目标**: 
  - 第一阶段：使用SpatialTrackerV2提取的伪标签，通过运动加权的整流流（rectified-flow）目标训练3D场景轨迹去噪器。
  - 第二阶段：联合微调动作去噪器、轨迹去噪器和VLM，仅使用动作损失（末端执行器平移和旋转的流匹配速度预测L2损失 + 夹爪状态的BCE损失）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：CALVIN（长视野操作）, LIBERO（组合泛化）, RoboTwin2.0（单/双臂控制），以及真实世界ALPHA2机器人平台的8个桌面操作任务。
  - 对比对象（baseline）：2D VLA（如 OpenVLA, FLOWER, X-VLA, pi_0.5等）, 3D VLA（如 3D-VLA, SpatialVLA, PoseVLA等）, 运动引导VLA（如 TraceVLA, FlowVLA, LaMP等）。
- **评价指标**: 
  - CALVIN：连续完成任务的平均数量（ABC_D）。
  - LIBERO & RoboTwin2.0：任务成功率（Success Rate）。
  - 真实世界：20次试验中的成功次数及平均成功率。
- **主要结果**: 
  - 在CALVIN上达到SOTA（4.624），超越FLOWER（4.480）和X-VLA（4.430），且无需额外的机器人动作预训练。
  - 在LIBERO上，在无强化学习微调的方法中取得最佳平均性能。
  - 在RoboTwin2.0的50个任务上，Easy/Hard设置下的成功率（78.6%/76.2%）超越了完全微调的 pi_0.5（75.9%/75.7%）。
  - 在真实世界8个任务中，平均成功率达到62.5%，大幅超越 pi_0.5（29.4%）和无运动模块的GeomVLA（44.4%）。
  - 消融实验证明：保持场景、运动和动作之间的几何一致性（都在同一个3D坐标系下）是性能提升的核心原因；在2D图像空间做运动预测再输入3D动作生成器反而会导致性能下降。

### 10. 🔥 [How to Better Train VLAs: Lessons Learned From the REAL-I Challenge at ICRA 2026] (如何更好地训练VLA：来自ICRA 2026 REAL-I挑战赛的经验教训)
- **研究机构**: `原文未提及单一主导机构（涉及新加坡国立大学 NUS-CLEAR、RCL-Lab、Deeptouch.ai 及乐聚机器人等）`
- **Arxiv ID**: `2609.13679` | [点击跳转](https://arxiv.org/abs/2609.13679)

**0. 论文标题**
- **英文标题**: How to Better Train VLAs: Lessons Learned From the REAL-I Challenge at ICRA 2026
- **中文标题**: 如何更好地训练VLA：来自ICRA 2026 REAL-I挑战赛的经验教训
- **研究机构**: 原文未提及单一主导机构（涉及新加坡国立大学 NUS-CLEAR、RCL-Lab、Deeptouch.ai 及乐聚机器人等）
- **一句话总结**: 总结了ICRA 2026 REAL-I挑战赛中在固定数据预算下训练和部署VLA模型的经验，揭示了数据清洗、持续微调、动作空间掩码等工程细节对真机部署成功率的决定性影响。

**1. 整体逻辑**
- **研究任务**: 在固定数据预算（禁止收集额外数据）下，如何从有限的示教数据中训练出能在真实双足人形机器人（Kuavo）上稳定部署的视觉-语言-动作（VLA）策略。
- **研究动机**: 真实世界机器人数据收集成本极高，现有方法在固定数据下受限于闭环执行时的状态分布偏移（distribution shift）；同时，离线动作预测指标难以准确预测真机闭环成功率，亟需一套标准化的“离线到真机（offline-to-real）”评估与优化框架来指导实际部署。
- **本质改动**: 本文并非提出单一的新模型架构，而是通过构建标准化的全链路竞赛基准，并提炼冠军团队在数据过滤、分阶段持续微调、无关维度掩码等方面的系统性工程经验，将机器人学习从单纯的“模型拟合”转化为“数据-适配-评估-部署”的集成问题。
- **技术溯源**: 基于开源的视觉-语言-动作基座模型（如 $\pi_{0.5}$、NVIDIA Isaac GR00T N1.7）以及扩散策略（Diffusion Policy），底层控制基于乐聚（Kuavo）机器人的 ROS 控制栈（MPC/WBC）。

**2. 技术拆解**
- **核心方法**: 提出了一套标准化的离线到真机部署流水线，并总结了三种核心优化策略：1) 基于轨迹长度或运动统计特征的细粒度数据清洗；2) 从大场景到小场景、跨阶段分布的持续微调（Continual Adaptation）；3) 对单臂任务中闲置机械臂的观测和动作维度进行掩码（Masking）。
- **关键细节**: 
  - **数据与接口**：使用 LeRobot 格式，输入为同步的多视角 RGB/深度图和关节状态，输出为 16 维动作（双臂各 7 个关节位置 + 1 个末端执行器命令）。
  - **控制架构**：策略输出任务级关节位置设定点，底层由 ROS 控制栈通过 MPC/WBC（二次规划）转换为电机扭矩，保证全身运动可行性。
  - **数据清洗**：NUS-CLEAR 使用轨迹长度分位数（剔除前后 5%）过滤犹豫或失败的异常轨迹；Deeptouch.ai 结合 TCP 位置和夹爪命令统计特征过滤特定动作（如翻面）。
  - **维度掩码**：对于实际只需单臂的任务，直接屏蔽闲置臂的 RGB 观测、本体感知状态和动作维度，防止误差累积导致分布偏移。
- **训练/优化目标**: 主要是行为克隆（Behavior Cloning）的均方误差（MSE）损失。优化目标是在有限的固定示教数据上最小化动作预测误差，同时通过留出集（held-out set）的离线开环预测误差来选择检查点，防止在少量现场数据上过拟合。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：主办方提供的固定工业级双足人形机器人示教数据集（ROS bags 转换），分为 Stage 2（真机阶段，约 1000 条轨迹）和 Stage 3（现场决赛阶段，约 100 条轨迹）。
  - **对比对象**：参赛队伍包括 NUS-CLEAR（基于 $\pi_{0.5}$）、RCL-Lab（基于 GR00T N1.7）、Deeptouch.ai（基于 $\pi_{0.5}$ 和 Diffusion Policy）。
  - **测试环境**：仿真环境 -> 真实机器人环境 -> ICRA 2026 现场决赛环境（光照、布局有自然变化）。任务包括金属零件翻面、日化瓶抓取放置、快递包裹扫描。
- **评价指标**: 任务完成度得分（如抓取、交接、放置的得分），最终成绩为仿真（20%）、真机（30%）和现场决赛（50%）的加权归一化总分。
- **主要结果**: 
  - NUS-CLEAR 以 71.0 分夺冠，RCL-Lab 以 69.1 分获亚军。两者在现场决赛中得分接近（34.3 vs 33.0），说明前沿 VLA 基座模型能力相近时，数据适配和部署细节比单纯选择大模型更重要。
  - 验证了持续微调的有效性：直接部署 Stage 2 模型在现场表现很差，使用少量 Stage 3 数据微调后性能大幅提升。
  - 验证了维度掩码的必要性：保留闲置臂维度会导致部署时因微小扰动引发策略崩溃。
  - 揭示了离线指标的局限性与模型选择的权衡：开环动作预测误差能作为检查点选择的实用代理指标，但不能完美预测闭环真机成功率；此外，小模型（Diffusion Policy）在特定窄分布任务（如日化瓶双手交接）上能击败大 VLA 模型拿满分，说明模型规模应与环境变化程度相匹配。

### 11. 🔥 [PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models] (PhysBrain 1.5：从视觉语言模型到物理基础模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.14973` | [点击跳转](https://arxiv.org/abs/2609.14973)

**0. 论文标题**
- **英文标题**: PhysBrain 1.5: From Vision-Language Models to Physical Foundation Models
- **中文标题**: PhysBrain 1.5：从视觉语言模型到物理基础模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 PhysBrain 1.5，将具身理解、动作生成和未来状态预测统一为离散 token 的自回归 next-token prediction 任务，在 28 个具身理解 benchmark 上达到 8B 开源模型 SOTA。

**1. 整体逻辑**
- **研究任务**: 构建统一的物理基础模型，同时支持具身环境理解、机器人动作生成和未来物理状态预测。
- **研究动机**: 物理智能依赖“观察-交互-环境改变”的物理循环，但现有通用 VLM 缺乏物理交互能力，而专用具身模型（如 VLA、世界模型）往往各自为战。此外，不同任务（语言、动作、视觉）在监督信号、数据模态和时间粒度上存在差异，缺乏一个能统一处理这些异构信号的联合学习框架。
- **本质改动**: 扩展 VLM 词表，将语言响应、末端执行器（end-effector）运动轨迹和密集视觉目标（RGB/深度/掩码）全部编码为离散 token，通过统一的自回归 next-token prediction 目标进行联合优化。
- **技术溯源**: 基于 Qwen3-VL Instruct (8B) 基座模型；动作离散化采用 ActionPiece，视觉离散化采用 VQ-VAE。

**2. 技术拆解**
- **核心方法**: 
  1. **统一词表与自回归目标**：扩展 Qwen3-VL 词表，加入动作 token 和视觉 token。使用带 mask 的 next-token prediction 损失，让三类任务共享同一个 LM backbone 和 output head。
  2. **动作生成（Embodied Action Generation）**：将人类/机器人动作统一为 16 步的末端执行器相对轨迹。使用 ActionPiece 将轨迹离散化。引入前 16 步动作历史作为局部上下文，让模型隐式推断局部坐标系和运动趋势，从而避免跨数据源全局坐标系对齐的困难。
  3. **视觉状态生成（Visual-Foundation Generation）**：用共享 VQ-VAE 将未来的 RGB、深度图和机器人掩码 tokenize。在空间位置上按 RGB-depth-mask 顺序交错排列，保持严格的空间对齐。
- **关键细节**: 
  - **模型规模**：8B 参数。
  - **动作表示**：预测 16 步 chunk，每步 10 维（3维相对平移，6维相对旋转，1维绝对夹爪开合）。ActionPiece 词表大小 512，将单侧手腕轨迹编码为 32 个离散 token。
  - **视觉表示**：VQ-VAE 目标分辨率 128×128，codebook 大小 16,384。每个模态下采样得到 256 个 token，三种模态交错排列共 768 个 token，加上 2 个边界 token，总计 770 个 token。
  - **训练框架**：基于 ms-swift 和 Megatron-Core 后端，最大序列长度 32,768，开启 sequence packing。
- **训练/优化目标**: 带 mask 的自回归 next-token prediction 损失（Cross-entropy）。训练分两阶段：Physical-aware pre-training（监督信号全部来自人类交互视频）和 Embodied SFT（混合人类演示、真实机器人轨迹和仿真经验）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：预训练使用约 3 万小时人类交互视频（如 Xperience-10M, Ego4D, PhysBrain-Human 等）；SFT 使用 17 个真实机器人/仿真源（如 OpenGalaxea, DROID, RoboCasa 等）及 500 小时高质量人类运动数据。
  - **对比对象（baseline）**：闭源模型（Gemini 3.6 Flash, GPT-6-Astra, Claude Opus 5），开源模型（Hy-Embodied-VLM-1.0, Embodied-R1.5, RynnBrain1.1, RoboBrain2.5, MiMo Embodied, Cosmos3 Nano, ACE-Brain-0.5, Qwen3-VL-Instruct 8B）。
- **评价指标**: 
  - **具身理解**：28 个 benchmark 的平均分（0-100 scale），涵盖视觉空间感知、多视角理解、具身推理规划、空间定位与可供性、视觉轨迹推理 5 大类。
  - **通用多模态**：12 个通用 benchmark（如 MME, MMStar, VideoMME, POPE 等）的准确率或 F1 分数。
- **主要结果**: 
  - 在 28 个具身理解 benchmark 上平均得分 72.5，达到开源 SOTA（比第二名 Hy-Embodied-VLM-1.0 高 6.5 分），在 14 个 benchmark 排名第一，10 个排名第二。
  - 性能逼近闭源 SOTA（GPT-6-Astra 73.3, Gemini 3.6 Flash 73.0），并超过 Claude Opus 5 (67.9)。
  - 在 12 个通用多模态 benchmark 上，性能与基座 Qwen3-VL-Instruct (8B) 相当，证明联合训练没有遗忘通用多模态能力。
  - 定性实验验证了模型能够生成符合物理趋势的末端执行器轨迹，并能预测空间对齐的未来 RGB、深度图和机器人掩码。

### 12. 🔥 [Modality-Autoregressive World-Action Models] (模态自回归世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.17524` | [点击跳转](https://arxiv.org/abs/2609.17524)

**0. 论文标题**
- **英文标题**: Modality-Autoregressive World-Action Models
- **中文标题**: 模态自回归世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ModAR，在预测机器人动作前自回归地逐个去噪多种未来观测模态（如点轨迹、DINO特征、深度），以紧凑结构特征引导细节特征生成，在少样本和真实世界任务中均超越了联合去噪架构和超大参数量的基线模型。

**1. 整体逻辑**
- **研究任务**: 训练机器人策略（世界-动作模型 WAMs），通过联合预测未来多模态观测和机器人动作，利用无动作标签数据（actionless data）提升策略性能。
- **研究动机**: 现有 WAM 多依赖预测未来 RGB 图像，忽略了深度、DINO 特征和点轨迹等能更高效捕捉几何/语义/运动特征的表示；且现有方法在结合多模态时多采用联合去噪或独立预测，未能利用模态间的条件依赖和“先结构后细节”的生成先验。
- **本质改动**: 将多模态未来观测的生成从“联合/同步去噪”改为“模态自回归生成”，按“点轨迹 $\rightarrow$ DINO $\rightarrow$ 深度 $\rightarrow$ RGB $\rightarrow$ 动作”的顺序逐个去噪，让后续模态的预测以已生成的模态为条件。
- **技术溯源**: 基于 Diffusion Transformer (DiT)、Flow Matching、DINOv2、CoTracker3 和 RoPE。

**2. 技术拆解**
- **核心方法**: 模态自回归世界建模。将多模态联合分布分解为条件分布序列，采用块因果掩码（Block-causal mask）确保生成第 $k$ 个模态时只能看到前 $k-1$ 个模态；训练时引入上下文噪声注入（Injecting context noise）缓解自回归带来的级联误差；最终的动作预测步作为逆动力学模型（IDM），将完全生成的未来观测映射为动作。
- **关键细节**: 
  - **输入输出**: 输入单目 RGB（168×224）、14维双臂本体感受、任务标签；输出 2 个稀疏未来观测帧（horizon=16, stride=8）和 16 步密集动作 chunk。
  - **模型结构**: 共享 DiT 骨干（6层 width-384 Transformer 块）+ 模态特定专家块（width-384 用于 DINO/depth/RGB，width-128 用于 tracks/actions），总参数量 30.1M。
  - **生成顺序**: tracks $\rightarrow$ DINO $\rightarrow$ depth $\rightarrow$ RGB $\rightarrow$ actions（从紧凑结构化表示向高维细节表示过渡）。
- **训练/优化目标**: 基于 Flow Matching 的 x-prediction（预测干净样本）目标，最小化预测干净样本与真实干净样本的加权 L2 距离。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**: RoboTwin 的 6 个双臂操作任务。数据规模分为 50、250、1250 个 demonstrations（固定 50 个有动作标签，其余为无动作标签）。
  - **真实世界数据集**: 3 个桌面双臂任务。包含 100 个遥操作机器人 demo、200 个域内无动作人类 demo、1000 个 EgoDex 域外无动作人类视频。
  - **对比基线**: Action-only, Independent-noise, Disjoint, Unified（代表 DreamZero 等联合生成架构），以及 6B 参数的视频预训练大模型 Flex-$\pi$。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **架构对比**: ModAR 在所有数据规模下平均成功率最高（如 250 demo 时达 75%），显著优于 Unified 和 Disjoint 等基线，且对无动作数据的扩展性最好（增加 1200 个无动作 demo 提升 10%，而 Unified 仅提升 1%）。
  - **模态消融**: 预测点轨迹、DINO 和深度能带来累加收益，但额外预测 RGB 无一致收益（引入了高方差的外观细节但信息增益有限）。
  - **对比大模型**: 30.1M 参数的 ModAR（无预训练）成功率达 75%，略高于 6B 参数、有视频预训练且训练 FLOPs 多 20 倍的 Flex-$\pi$（72%）。
  - **真实世界**: ModAR 整体成功率达 83.3%（Unified 为 66.7%，Action-only 为 52.2%），且随着加入域内/域外人类无动作数据，成功率从 70.0% 逐步提升至 81.1% 和 83.3%。

### 13. 🔥 [XPACE: Joint World and Action Modeling from Heterogeneous Experience] (XPACE：基于异构经验的联合世界与动作建模)
- **研究机构**: `XPENG Robotics（小鹏机器人）`
- **Arxiv ID**: `2609.17372` | [点击跳转](https://arxiv.org/abs/2609.17372)

**0. 论文标题**
- **英文标题**: XPACE: Joint World and Action Modeling from Heterogeneous Experience
- **中文标题**: XPACE：基于异构经验的联合世界与动作建模
- **研究机构**: XPENG Robotics（小鹏机器人）
- **一句话总结**: 提出XPACE框架，通过共享视频骨干网络联合训练机器人策略与世界模拟器，利用异构人类/机器人数据进行粗到细训练，并使用模拟器生成的“偏离-恢复”轨迹实现策略的自我提升。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人学习。训练通用机器人策略，使其能从异构经验（无标签人类视频、人类动作、机器人遥操作）中学习，同时具备动作执行和未来视频模拟能力，以提升真实机器人的控制性能和鲁棒性。
- **研究动机**: 1) 人类视频覆盖广但缺动作标签，机器人数据有标签但收集成本高且覆盖窄，简单混合难以让模型有效学习控制；2) 纯模仿学习缺乏对执行误差（偏离专家轨迹）的纠正监督，导致闭环执行时容易失败。
- **本质改动**: 共享一个视频Transformer骨干同时做策略（动作预测）和模拟器（视频预测），设计四层数据金字塔融合异构数据，并在训练后期用模拟器合成“偏离-恢复”轨迹对策略进行DAgger式的自我微调。
- **技术溯源**: 基于预训练视频Transformer（消融实验提及以 Wan2.2-TI2V-5B 为初始化基座），使用 Flow-matching 进行视频和动作预测，使用 Self-Gradient Forcing (SGF) 进行模拟器适应。对比的 baseline 包括 GR00T（VLA策略）和 DreamZero（基于世界模型的策略）。

**2. 技术拆解**
- **核心方法**: 
  1. **数据金字塔**：构建四层数据（L1无标签第一人称视频、L2带人体动作的人类视频、L3任务/外观对齐的桥接数据、L4机器人遥操作）及失败/恢复数据集（仅用于训练模拟器）。
  2. **非对称混合Transformer (MoT) 架构**：共享因果视频Transformer，动作Transformer通过非对称多层读取机制获取视频特征，实现策略与模拟器的参数共享。
  3. **粗到细课程学习与自我提升**：分阶段训练，逐渐增加机器人数据比重但保留人类数据防遗忘；后期用SGF适应模拟器，生成恢复数据微调策略。
- **关键细节**: 
  - **输入输出**：策略模式输入视觉历史、当前状态、语言指令，输出动作块和未来视频；模拟模式输入视觉历史、2D骨架控制、相机位姿，输出未来视频。
  - **模型结构**：视频和动作均分块（chunk）预测，每个块包含16个视频帧/16步动作。骨架控制通过 Token addition（零初始化patch embedding后逐元素相加）注入视频token。动作Transformer有15个block，读取视频Transformer后15个block的特征。
  - **规模**：使用 5000 小时具身视频进行训练。
- **训练/优化目标**: 
  - 使用 Flow-matching 损失（$\mathcal{L}_v$ 和 $\mathcal{L}_a$）。
  - **Stage I**：纯视频预测（$\mathcal{L}_v$）。
  - **Stage II**：联合训练（$\mathcal{L}_v + \mathcal{L}_a$），数据混合比例从宽泛人类数据逐渐过渡到目标机器人数据。
  - **Stage III-sim**：使用 Self-Gradient Forcing (SGF) 优化模拟器，使其适应自生成的视觉上下文。
  - **Stage III-policy**：使用模拟器生成的过滤后的“偏离-恢复”轨迹（占8%）混合原始数据进行 DAgger 式微调。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：19个子集的评估数据集（包含分布内和分布外场景，与训练集独立）。
  - **对比对象（baseline）**：GR00T, DreamZero。
  - **测试环境**：XPENG 的 IRON 人形机器人，真实物理环境闭环执行（每个任务20次试验）。
- **评价指标**: 
  - **模拟器**：PSNR, SSIM, OFS (光流相似度), DINO特征相似度，推理延迟和显存。
  - **策略**：任务进度得分（Task-progress score，按里程碑给分），成功率（Success rate）。
- **主要结果**: 
  - **模拟器表现**：Token addition 条件注入效果最好。使用 SGF 训练后，长序列(193帧)预测质量提升，且推理步数从50步降至8步，速度提升约3倍。
  - **策略对比**：XPACE 在真实机器人上的平均成功率为 68.3%，显著优于 DreamZero (40.0%) 和 GR00T (6.7%)，平均任务进度为 0.84（baseline分别为 0.68 和 0.36）。
  - **数据消融**：全数据训练比纯机器人数据在空间鲁棒性和抗干扰能力上显著提升；在机器人适配阶段保留人类数据（co-training）比中途丢弃的动作损失降幅更大（14.0% vs 8.5%），且能有效迁移人类数据中独有的技能（如推抽屉、叠碗）。
  - **自我提升**：使用模拟器生成的恢复数据微调后，平均任务进度从 0.81 提升至 0.93，平均成功率从 61.7% 提升至 86.7%（绝对提升 25%）。

### 14. 🔥 [FluxVLA Engine: A One-Stop VLA Engineering Platform for Embodied Intelligence] (FluxVLA Engine：面向具身智能的一站式VLA工程平台)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.17210` | [点击跳转](https://arxiv.org/abs/2609.17210)

**0. 论文标题**
- **英文标题**: FluxVLA Engine: A One-Stop VLA Engineering Platform for Embodied Intelligence
- **中文标题**: FluxVLA Engine：面向具身智能的一站式VLA工程平台
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作不提出新的VLA模型，而是开源了一个配置驱动的全栈工程平台，通过标准化数据、模型、推理和部署的接口契约，把碎片化的具身智能算法整合成了可复现的“数据到真机部署”工作流。

**1. 整体逻辑**
- **研究任务**: 构建一个统一的具身智能策略（VLA/WAM/离线RL）工程平台，打通从数据处理、模型训练、仿真评估到物理机器人部署的全链路。
- **研究动机**: 现有的具身算法在数据格式、训练栈、评估协议和推理运行时上高度碎片化。把算法变成可靠的机器人系统需要处理大量模型外的工程细节（如推理延迟、动作块边界不连续、远程GPU通信等），这些细节通常耦合在特定项目的代码里，导致复现和部署极其困难。
- **本质改动**: 不卷模型架构，而是做系统级抽象。通过注册表机制和严格的“接口契约”，将异构的组件解耦，用一套配置驱动整个生命周期，让不同模型和硬件能在同一个工程栈里跑通。
- **技术溯源**: 集成了主流的VLA（如OpenVLA, $\pi_0$, $\pi_{0.5}$, GR00T, SmolVLA等）、WAM（如DreamZero, DiT4DiT, FastWAM等）、离线RL/奖励引导方法，以及底层推理加速（Triton, CUDA Graph）和轨迹后处理（MPC, Ruckig）技术。

**2. 技术拆解**
- **核心方法**: 基于配置驱动和注册表的模块化系统架构。定义了四大稳定契约：数据契约（统一字典边界和Transform）、模型契约（统一的forward/predict接口）、执行生命周期契约（Runner管逻辑，Operator管硬件通信）、配置构建契约。同时集成了Real-Time Chunking (RTC) 和轨迹后处理来解决异步推理和动作平滑问题。
- **关键细节**: 
  - **架构分层**：Launcher构建Dataset和Runner；Runner拥有Model、Collator、Optimizer等；Model拥有Backbone和Action Head。
  - **部署解耦**：Inference Runner负责预处理、预测、RTC和轨迹后处理；Operator负责传感器同步和硬件命令下发，两者通过明确的契约交互。
  - **推理与后处理**：结合RTC处理动作块（Action Chunk）边界的不连续问题；使用Joint MPC或Ruckig filter进行轨迹后处理，以满足机器人运动学约束。
- **训练/优化目标**: 作为工程平台，其本身无固定优化目标，取决于接入的具体模型（如VLA的自回归Next-token预测、WAM的流匹配/扩散去噪、离线RL的奖励/优势加权回归等）。平台的核心机制是“配置解析与组件注册”。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：LIBERO (Spatial, Object, Goal, Long) 和 RoboCasa GR-1。集成了14种策略（包括GPT-6 API, SmolVLA, GR00T N1.5/N1.7, $\pi_0$, $\pi_{0.5}$, DiT4DiT等）。
  - **推理加速**：在A100, RTX 5090, RTX 4090, AGX Orin上测试GR00T和$\pi_{0.5}$。
  - **真机**：ALOHA (5个任务) 和 Oli (3个任务)，测试GR00T N1.5和$\pi_{0.5}$。
- **评价指标**: 仿真用任务成功率（Success rate）；推理用模型推理频率（Hz）和数值对齐度（余弦相似度）；后处理用CPU延迟（ms）；真机用试验成功率。
- **主要结果**: 
  - **仿真**：LIBERO上平均成功率从37.50% (GPT-6) 到 98.65% (DiT4DiT)；RoboCasa上从8.75% (SmolVLA) 到 57.25% (DiT4DiT)。验证了平台能跑通各种异构模型且性能符合预期。
  - **推理加速**：加速后频率提升2.31x到9.64x（例如A100上GR00T从5.96Hz提至32.6Hz，$\pi_{0.5}$从2.20Hz提至21.2Hz）。数值对齐测试显示余弦相似度>0.99999，证明加速没改变模型计算逻辑。
  - **后处理**：Ruckig filter平均延迟1.17ms，比Joint MPC (4.90ms) 快约4.19倍。
  - **真机**：ALOHA上GR00T N1.5成功率32.73%，$\pi_{0.5}$为63.64%。Oli和毛巾折叠任务（companion ARM study）也验证了部署和离线策略提升能力（成功率从BC的62.1%提升至AW-BC的99.4%）。

- **中文标题**: 具身智能中的世界模型：从合理性到可控性再到可行动性
- **研究机构**: 原文未提及
- **一句话总结**: 本文是一篇综述，提出以决策为中心的能力阶梯（合理-可控-可行动）和3×4矩阵，系统梳理了具身智能中世界模型从状态保持、干预预测到下游决策优化的发展脉络与评估体系。

**1. 整体逻辑**
- **研究任务**: 梳理具身智能中世界模型（World Models）的研究进展，建立统一的分类框架和评估协议，明确世界模型在具身交互中的核心价值。
- **研究动机**: 现有综述多按网络架构、表示方法或应用场景分类，未能体现世界模型在“保持状态-响应干预-改善决策”上的能力递进；同时，许多工作过度追求视频生成的视觉逼真度，忽视了世界模型帮助智能体预测后果、比较干预和指导决策的本质作用。
- **本质改动**: 摒弃传统的按架构分类，提出以决策为中心的能力阶梯（Plausible → Controllable → Actionable），并引入3×4的Grounding-Improvement矩阵，将预测内容的物理/几何/动作属性与数据/奖励/策略/模型自更新的闭环机制正交结合。
- **技术溯源**: 涵盖了从早期的视觉预测（Deep Visual Foresight）、潜在动力学模型（Dreamer系列）、基于价值的规划（MuZero），到近期的视觉-语言-动作模型（VLA）、视频生成模型以及联合世界-动作模型（World-Action Models）。

**2. 技术拆解**
- **核心方法**: 构建“能力阶梯”与“Grounding-Improvement矩阵”双轴分类框架。
  1. **Plausible（合理性）**：保持任务相关的几何、物理或时序结构，预测未来状态不漂移、不违背物理规律。
  2. **Controllable（可控性）**：准确预测动作干预（如电机指令、轨迹、语言）对环境状态的改变，满足反事实一致性。
  3. **Actionable（可行动性）**：预测结果能切实改善下游决策（如规划搜索、策略学习、执行验证与恢复），产生可测量的效用增益。
  矩阵则交叉了3种Grounding（几何、物理、动作）和4种Improvement loops（数据、奖励、策略、模型自更新）。
- **关键细节**: 
  - **Plausible阶段**细分为：紧凑潜在/物体中心状态、度量场景状态（占据栅格/点云）、物理接地动力学、持久记忆与长时稳定性。
  - **Controllable阶段**细分为：动作条件预测、开放/潜在/语言指定干预、结构接地控制（几何/轨迹/接触）、交互式推演与联合世界-动作模型。
  - **Actionable阶段**细分为：基于价值的搜索与规划、从想象中解码动作的策略学习、用于策略训练/评估的学习型模拟器、运行时验证/纠正与恢复。
- **训练/优化目标**: 作为综述，本文总结了各阶段模型的优化方向演进：从早期的像素/特征重建、对比学习，到引入物理约束（PDE/接触/碰撞）、动作条件扩散/自回归生成，再到结合逆动力学奖励、安全约束（拉格朗日方法）以及预测误差反馈的闭环优化。

**3. 实验结果**
- **实验设置**: 本文为综述，无自身实验。文中梳理了具身智能常用的数据集与基准，包括RoboNet, BridgeData V2, DROID, RLBench, CALVIN, LIBERO, DriveArena, WorldGym等。针对三个能力层级设定了不同的测试控制变量：Plausible需长时推演与记忆测试；Controllable需共享初始状态的动作分支（含掩码/打乱动作对照）；Actionable需闭环控制并设置matched baseline（无世界模型输入的同等计算/数据预算基线）。
- **评价指标**: 
  - Plausible: SSIM, LPIPS, FVD, 深度/占据误差, 物体/接触准确率, 误差随时间漂移曲线。
  - Controllable: 动作遵循度, 状态改变误差, 轨迹ADE/FDE, 反事实排序, 未改变区域一致性。
  - Actionable: 任务成功率/回报, 规划遗憾(regret), 碰撞/安全代价, 推理延迟, 检测与恢复成功率。
- **主要结果**: 原文未提及（本文为综述，无具体实验数值）。主要结论为：评估必须与能力声明严格匹配，单一视觉指标无法衡量世界模型的真实能力；高级别的Actionable声明必须包含匹配基线的对比，并严格控制数据、计算和延迟预算；当前领域在长时一致性、不确定性校准、因果干预测试和跨具身迁移方面仍面临开放挑战。

### 16. 🔥 [SAVLA: Symmetry-Aware Vision-Language-Action Models for Robotic Manipulation] (SAVLA：用于机器人操作的对称感知视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.16641` | [点击跳转](https://arxiv.org/abs/2609.16641)

**0. 论文标题**
- **英文标题**: SAVLA: Symmetry-Aware Vision-Language-Action Models for Robotic Manipulation
- **中文标题**: SAVLA：用于机器人操作的对称感知视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出了一种对称感知的视觉-语言-动作模型（SAVLA），通过在冻结的VLM主干外引入等变流匹配动作头和图像规范化器，将旋转对称性直接融入架构，提高了机器人操作在视角和场景旋转下的鲁棒性与数据效率。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作（根据视觉观察和自然语言指令生成机器人动作）。
- **研究动机**: 现有的VLA模型缺乏显式的旋转对称性架构先验，其空间能力完全依赖从演示数据中学习。这导致模型只在演示数据覆盖的场景姿态下可靠，对物体布局、相机视角和机器人初始状态的旋转变化非常敏感。
- **本质改动**: 不修改冻结的、非等变的视觉-语言主干网络，而是通过一个类型化接口将其输出视为不变特征，并结合一个等变的流匹配动作头和一个学习到的图像规范化器，从架构层面保证端到端的旋转等变性。
- **技术溯源**: 基于 GR00T N1.5（包含 SigLIP2 视觉编码器和 Qwen3-1.7B 语言模型），结合了流匹配（Flow matching）、向量神经元（Vector Neuron）以及等变神经网络设计。

**2. 技术拆解**
- **核心方法**: 
  1. 等变流匹配动作头：将内部特征分为标量（不变）和向量（等变）轨道，设计了保持等变性的归一化、调制、注意力机制和FFN（通过将向量投影到特定方向来应用GELU）。
  2. 类型化条件接口：将VLM特征作为不变条件，将基于相机反投影的固定参考点根据场景旋转角度进行旋转，作为等变几何条件。
  3. 学习到的规范化器：使用轻量级CNN估计场景绕重力轴的旋转角度，利用单应性矩阵将斜视角的第三人称图像扭曲（warp）到规范视角，并同步旋转几何参考点。
- **关键细节**: 
  - 输入：第三人称图像、腕部图像、8维本体感受状态（末端位置、方向、夹爪状态）、语言指令。
  - 输出：动作块（位置增量、旋转增量、夹爪命令）。
  - 模型规模：等变动作头包含16层block，标量/向量通道宽度256，8个注意力头，动作horizon为16，流积分步数为4；规范化器为0.09M参数的3层CNN。
  - 状态与动作表示：状态包含4个等变向量（位置、旋转矩阵前两列、重力方向）和2个不变标量（夹爪状态）；动作包含2个等变向量（位置增量、旋转增量）和1个不变标量（夹爪命令）。
- **训练/优化目标**: 
  - 动作头：流匹配损失，预测连接噪声和真实动作的恒定速度场（L2损失）。
  - 规范化器：自监督损失，将原始演示帧作为规范姿态，对合成旋转帧预测旋转角度，最小化预测角度与真实偏移之间的余弦距离。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO 仿真基准（包含 Spatial, Object, Goal, Long 四个套件），以及基于 SO-101 机器人的真实世界操作任务（pick-and-place, block stacking, block sorting）。
  - 对比对象（baseline）：主要对比参数量匹配的 GR00T N1.5，同时对比了 Diffusion Policy, Octo, OpenVLA, SmolVLA 等。
- **评价指标**: 任务成功率（Success rate, %）；在旋转泛化实验中，评估场景在 -30° 到 +30° 范围内以 5° 为步长旋转（共13个角度）的平均成功率。
- **主要结果**: 
  - 标准任务：在 LIBERO 四个套件上的平均成功率比 GR00T N1.5 提高 5.1 个点（从 86.5% 到 91.6%）。
  - 旋转泛化：在 LIBERO-Goal 上，场景旋转下的平均成功率从 41.5% 提高到 90.4%，高于旋转数据增强方法。
  - 数据效率：在 10% 和 25% 的演示数据下，相比 baseline 的优势分别扩大到 8.8 个点和 5.8 个点。
  - 真实机器人：平均成功率从 61.7% 提高到 71.7%，旋转鲁棒性（pick-and-place 平均）从 47.9% 提高到 57.1%。
  - 消融与误差分析：等变动作头和规范化器两者均必要；大角度下的性能下降主要源于前端图像几何近似规范化带来的视差和视场误差，而不是旋转角度估计错误。

### 17. 🔥 [rMuscle: Robotic Muscle Memory for Efficient Vision-Language-Action Model Inference] (rMuscle：用于高效视觉-语言-动作模型推理的机器人肌肉记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19104` | [点击跳转](https://arxiv.org/abs/2609.19104)

**0. 论文标题**
- **英文标题**: rMuscle: Robotic Muscle Memory for Efficient Vision-Language-Action Model Inference
- **中文标题**: rMuscle：用于高效视觉-语言-动作模型推理的机器人肌肉记忆
- **研究机构**: 原文未提及
- **一句话总结**: 提出rMuscle推理框架，通过双阶段缓存复用VLA模型跨任务执行的内部状态相似性，在不掉点的情况下显著降低机器人推理延迟。

**1. 整体逻辑**
- **研究任务**: 加速具身智能中视觉-语言-动作（VLA）模型的推理延迟。
- **研究动机**: 现有VLA推理框架未充分利用工厂等结构化场景下机器人重复执行相似任务的特性；且未区分VLA推理两阶段（VLM prefill计算受限，action denoising访存受限）的异构瓶颈，导致端到端加速受限。
- **本质改动**: 借鉴人类“肌肉记忆”，设计双阶段缓存机制，分别复用VLM阶段的视觉token特征和去噪阶段的神经元激活模式，将跨任务执行的内部状态相似性转化为计算和访存的节省。
- **技术溯源**: 基于主流VLA模型（$\pi_{0.5}$, GR00T N1.6, X-VLA）及现有推理引擎（FlashRT, torch.compile）。

**2. 技术拆解**
- **核心方法**: 设计双阶段缓存（Dual-phase cache）与配套缓存管理系统。Context Cache针对计算受限的VLM prefill，通过输入漂移筛选并重算变化大的视觉token，复用其余token的FFN输出；Action Cache针对访存受限的action denoising，利用历史相似任务的神经元激活mask预测重要神经元，仅加载计算其权重，其余用锚点步的稠密结果近似。
- **关键细节**: 
  - Context Cache：计算当前输入与参考输入的RMS差异，按阈值（如$\rho_p=0.4$）截断，仅重算变化最大的top视觉token，指令和机器人状态行始终重算。
  - Action Cache：将连续去噪步分组共享mask，每组首步为dense anchor，后续步仅计算mask内神经元的隐藏状态并叠加到anchor输出上，避免重复计算。
  - 缓存管理：利用机器人物理执行时间异步在线重构缓存；利用时间局部性维护滑动窗口（如保留4个候选episode及未来4个位置）控制GPU显存占用；连续去噪步共享mask减少权重gather开销。
- **训练/优化目标**: 非学习类工作。核心机制是通过缓存复用减少FLOPs（Context Cache）和内存访问量（Action Cache），优化目标是最小化端到端推理延迟，同时保持策略输出与原始密集计算等价（不掉点）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：LIBERO（40个任务）、RoboTwin（50个任务）以及2个物理机器人任务（ALOHA双臂抓取、DOBOT+Franka流水线装箱），共92个具身任务。
  - 模型：$\pi_{0.5}$, GR00T N1.6, X-VLA。
  - 硬件：RTX 4090, Jetson Thor。
  - 对比对象（Baseline）：FlashRT, torch.compile, vla.cpp, NIRVANA, DP-Cache, rMuscle w/o Cache Repo。
- **评价指标**: 推理延迟（Hz及相对加速比）、任务成功率（SR）、平均策略调用次数、内存开销。
- **主要结果**: 
  - 加速比：在RTX 4090上相比SOTA引擎实现 1.20 - 1.50 倍加速（摘要概括为 1.29 - 1.42 倍）；在Jetson Thor上实现 1.23 - 1.43 倍加速。模型参数规模越大，加速收益越高。
  - 精度保持：在LIBERO、RoboTwin及真实物理机器人任务上，成功率与原始密集执行（Vanilla）持平，显著优于DP-Cache和NIRVANA等跳步方法。
  - 开销控制：显存占用增加极小，RTX 4090上增加不到13%，Jetson Thor上增加最多6个百分点。

### 18. 🔥 [Learning Holistic Whole-Body Loco-Manipulation with a Bipedal Mobile Manipulator] (基于双足移动机械臂的全身协同移动操作学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18930` | [点击跳转](https://arxiv.org/abs/2609.18930)

**0. 论文标题**
- **英文标题**: Learning Holistic Whole-Body Loco-Manipulation with a Bipedal Mobile Manipulator
- **中文标题**: 基于双足移动机械臂的全身协同移动操作学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于强化学习的双足移动机械臂全身控制器，仅凭末端执行器的 6-DoF 位姿目标，即可自动协调手臂、躯干姿态和双足迈步来完成操作任务。

**1. 整体逻辑**
- **研究任务**: 双足移动机械臂的全身协同移动操作（Loco-Manipulation），即在保持动态平衡的同时，通过协调手臂、躯干和双腿来追踪末端执行器目标。
- **研究动机**: 现有的移动操作通常需要高层策略显式指定基座速度、步态或躯干姿态，这限制了控制器的通用性；此外，末端追踪、移动和平衡对同一系统存在竞争需求，且在部分观测下需要推断动力学相关信息。
- **本质改动**: 将任务指令简化为单一的瞬时 6-DoF 末端执行器目标，通过引入“奖励门控”和“时序上下文估计”的强化学习框架，让底层控制器自主决定何时动手、何时动身。
- **技术溯源**: 基于 RFM (Reward Fusion Module) 的奖励设计思路；使用 Transformer 和 GRU 处理时序观测；使用 PPO 算法进行强化学习训练；基于 Isaac Lab 进行仿真。

**2. 技术拆解**
- **核心方法**: 
  1. **奖励门控训练 (Reward-Gated Training)**：在 RFM 基础上，引入相位特定的安全分数（带下界的门控）和“历史最佳进度”奖励，动态调节末端追踪、移动和平衡之间的权衡，避免在恢复平衡时丢失任务学习信号。
  2. **时序上下文估计器 (Temporal Context Estimator)**：结合窗口化 Transformer（提取短期依赖）和 GRU（跨窗口传递记忆），并通过辅助任务（预测下一步观测和基座线速度）来提取与动力学相关的隐状态，解决部分观测下的动力学适应问题。
- **关键细节**: 
  - **输入输出**：输入为 58 维本体感知观测和 9 维末端执行器目标（6D 位姿 + 任务进度参考）；输出为 14 维关节位置偏移（8 个下肢关节 + 6 个上肢关节）。
  - **网络架构**：采用非对称 Actor-Critic 结构。Actor 仅使用可部署输入，Critic 使用特权信息（如真实基座速度、接触参数等）。时序估计器输出 67 维上下文（3 维速度估计 + 64 维动力学隐变量）。
  - **控制频率**：策略推理 50 Hz，底层 PD 关节控制器 500 Hz。
- **训练/优化目标**: 
  - **策略优化**：使用 PPO 算法最大化总奖励。总奖励包含任务奖励（位置/姿态追踪、参考追踪、进度奖励）、安全奖励和正则化项（惩罚过大扭矩、功率、动作突变、足端打滑等）。
  - **估计器优化**：最小化基座速度预测误差、下一步观测预测误差（L1 损失），以及隐变量的 KL 散度正则化。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：在 Isaac Lab 中使用 8192 个并行环境训练，单张 RTX 5090 GPU 训练约 28 小时。对比基线包括：匹配加性奖励、无隐变量、DreamWaQ/CENet、仅 GRU、仅 Transformer，以及特权先知（Privileged oracle）。
  - **真机**：硬件平台为 LimX TRON 1 双足机器人 + ARX L5 机械臂 + Jetson Orin NX。对比基线为传统的 floating-base + IK（逆运动学）控制器。
- **评价指标**: 仿真中评估任务成功率、末端位置/姿态追踪误差（均值和 P95 分位数）、动作变化率（衡量平滑度）。真机中额外评估垂直可达工作空间（Vertical reachability）。
- **主要结果**: 
  - **仿真消融**：奖励门控将成功率从 82.73% 提升至 88.30%，位置 P95 误差从 14.35 cm 降至 5.38 cm。时序上下文估计（Transformer+GRU）将成功率从无隐变量的 69.87% 提升至 88.30%，接近特权先知的 94.53%。
  - **真机部署**：同一控制器成功作为统一接口，无需修改即可执行 VR 遥操作、扩散策略（Diffusion Policy）和脚本轨迹生成的任务。
  - **工作空间扩展**：相比 floating-base + IK 基线（垂直范围 38-163 cm），该控制器通过自主蹲起和迈步，将垂直可达范围扩展至 3-191 cm，且在工作空间边界处表现出更好的稳定性，没有明显的振荡。

### 19. 🔥 [KINO: A Keyframe Interface for VLM Planning and Whole-Body Control in Humanoid Loco-Manipulation] (KINO：一种用于人形机器人移动操作中VLM规划与全身控制的关键帧接口)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18869` | [点击跳转](https://arxiv.org/abs/2609.18869)

**0. 论文标题**
- **英文标题**: KINO: A Keyframe Interface for VLM Planning and Whole-Body Control in Humanoid Loco-Manipulation
- **中文标题**: KINO：一种用于人形机器人移动操作中VLM规划与全身控制的关键帧接口
- **研究机构**: 原文未提及
- **一句话总结**: 提出用“运动关键帧”作为VLM高层规划和RL底层控制的中间接口，解决了人形机器人长视野移动操作任务中语义推理与全身运动控制难以对齐的问题。

**1. 整体逻辑**
- **研究任务**: 人形机器人的移动操作（Loco-manipulation），即根据自然语言指令，在移动中完成物体的抓取、搬运和放置（如双手搬箱子、单手提水桶）。
- **研究动机**: 端到端VLA模型需要大量昂贵的机器人专属数据；而纯RL方法难以处理需要多步规划的长视野任务。VLM擅长高层语义推理，RL擅长底层运动控制，但VLM输出的开放语言指令无法直接作为RL控制器需要的精确结构化目标，两者存在接口鸿沟。
- **本质改动**: 引入“运动关键帧（Motion Keyframes）”作为中间表示，将VLM的语义规划降维成离散的关键帧选择，再将关键帧重定向为RL策略的结构化目标。
- **技术溯源**: 视觉语言模型（VLM，具体使用 Qwen3.6:27B）、强化学习（PPO算法）、DeepMimic（参考动作跟踪）、AMASS 与 OmniRetarget（动作捕捉数据集）。

**2. 技术拆解**
- **核心方法**: 
  1. 层次化规划与控制：VLM根据指令和视觉观察从预定义库中选择关键帧；关键帧经逆运动学（IK）重定向适配当前场景后，输入给RL策略生成关节动作。
  2. 显著性关键帧采样：在训练底层RL策略时，通过计算机器人身体和物体的加速度峰值，提取代表任务阶段转换（如抓取、放置瞬间）的显著帧，过滤掉周期性行走帧，替代传统的均匀采样。
- **关键细节**: 
  - 输入输出：VLM输入文本指令、第三视角图像和机器人状态上下文，输出JSON格式的关键帧名称及控制标志。RL策略输入包含机器人本体状态、物体状态、历史动作和关键帧目标（历史10帧），输出29维关节目标位置。
  - 系统架构：采用非对称Actor-Critic结构，Critic包含特权信息（参考状态、目标误差等）。使用多Critic结构分别评估跟踪、目标到达和正则化奖励。VLM推理耗时<0.2s，关键帧重定向约5ms。
  - 规模与硬件：VLM参数量27B（单张4090运行），部署于Unitree G1人形机器人。
- **训练/优化目标**: 基于PPO算法训练。奖励函数包含三部分：参考动作跟踪奖励（基于DeepMimic）、关键帧目标到达奖励（仅在目标时刻激活）、正则化奖励（惩罚力矩、动作变化率等）。结合域随机化（摩擦力、质量、延迟等）进行Sim2Real训练。

**3. 实验结果**
- **实验设置**: 
  - 数据集：AMASS（52个移动片段）、OmniRetarget（105个双手搬箱子片段）、自采数据（120个单手提水桶片段）。
  - 对比对象（Baseline）：均匀关键帧采样策略（Uniform sampling，固定1.5秒间隔）。
  - 测试环境：MuJoCo仿真环境与Unitree G1真机环境。任务包括双手搬箱子和单手提水桶的抓取-运输-放置。
- **评价指标**: 端到端任务成功率（物体最终放置误差小于0.3m即算成功），以及各任务阶段（接近、抓取、放置）的目标到达误差（Root位置误差、Joint RMSE、Object位置误差）。
- **主要结果**: 
  - 显著性关键帧采样将端到端任务成功率从均匀采样的44%大幅提升至92%。
  - 在接近和抓取阶段，显著性采样的目标到达误差显著低于均匀采样。
  - 真机实验表明，系统能成功执行任务，且能泛化到训练数据覆盖范围之外的放置位置。VLM还能根据上下文检测失败并自主重试恢复。

### 20. 🔥 [FIERCE: From Generalist Robot Policies to Fast Specialists via Progress-Failure Feedback] (FIERCE：通过进展-失败反馈将通用机器人策略转化为快速专用策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18651` | [点击跳转](https://arxiv.org/abs/2609.18651)

**0. 论文标题**
- **英文标题**: FIERCE: From Generalist Robot Policies to Fast Specialists via Progress-Failure Feedback
- **中文标题**: FIERCE：通过进展-失败反馈将通用机器人策略转化为快速专用策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FIERCE 框架，通过训练一个统一的“进展-失败”评估器来提供密集的强化学习反馈，从而在有限的真实物理交互下，将庞大的通用机器人策略高效微调为低延迟、高性能的紧凑型专用策略。

**1. 整体逻辑**
- **研究任务**: 在有限的真实物理交互预算下，将通用机器人策略（如 VLA）微调/特化为满足低延迟和计算约束的紧凑型专用策略（Compact specialists）。
- **研究动机**: 通用策略虽然泛化性好，但推理延迟高、计算开销大。用通用策略初始化专用策略后，仅靠稀疏的终端成功/失败奖励无法有效指导中间决策；而单纯的“进展”反馈有时会与最终成功相悖（例如盲目推进看似有进展，但会导致物理卡死），因此需要区分“局部进展”和“ prospective failure（ prospective 失败风险）”。
- **本质改动**: 设计了一个统一的、任务自适应的“进展-失败”评估器，将基于历史的“进展估计”和基于动作条件的“失败风险预测”解耦并联合训练，以此作为强化学习的密集奖励信号来指导专用策略的学习。
- **技术溯源**: 视觉-语言表示基座采用 Cosmos 3 Edge；监督信号设计借鉴了 Robometer（进展和偏好监督）和 Foresight（动作条件预测潜在变量用于失败检测）；强化学习算法采用结合 RLPD 的 SAC-style 框架。

**2. 技术拆解**
- **核心方法**: FIERCE 框架包含两个核心模块：1) **进展-失败评估器**，用于在训练时生成密集反馈；2) **紧凑型专用策略**，通过行为克隆（BC）初始化后，利用评估器提供的奖励进行在线 RL 微调。两者在真实交互中交替更新。
- **关键细节**: 
  - **评估器架构**：共享 Cosmos 3 Edge 编码器。分为两支：1) 观察进展头（Observed-progress head），仅依赖历史观测评估任务推进程度；2) 动作条件潜在预测器（Action-conditioned latent predictor），预测未来隐状态，其预测历史输入到因果序列头（Causal sequence head）输出失败风险估计。
  - **策略架构**：紧凑型策略使用冻结的 DINOv2-small 编码器提取视觉特征，结合本体感知，通过三层 512 单元的 MLP 输出动作块（Action chunking）。
  - **数据与部署**：使用 RBM-1M 数据集并进行动作数据恢复（Action restoration）进行多任务后训练；部署时仅保留紧凑型策略，移除通用策略和庞大的评估器。
- **训练/优化目标**: 
  - **评估器损失**：包含进展损失、偏好损失、动力学预测损失（L1）、失败标签的 BCE 损失，以及基于模拟器分支的动作排序损失（Ranking loss）。
  - **策略优化目标**：基于评估器给出的密集奖励（包含进展增量塑形、失败风险惩罚、时间惩罚和独立验证的终端奖励），使用 SAC-style 的 RL critic 通过 Bellman 更新来优化策略。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：仿真环境包括 LIBERO-90 (Tasks 6, 28, 33, 73) 和 ManiSkill3 (StackCube, PegInsertionSide)；真实世界任务为 Franka 机器人执行的 peg-in-hole（插孔）和 cup stack（杯子堆叠）。
  - **对比对象 (Baseline)**：通用策略（Original/Task-adapted $\pi_{0.5}$），纯 BC 初始化的专用策略，Robometer-guided RL，去除失败惩罚的 FIERCE，以及仅用稀疏终端奖励的 RL。评估器对比了 ReWiND, RoboReward, Robometer, FAIL-Detect, RND, SAFE-LSTM, Gauge, Foresight-Transformer。
- **评价指标**: 
  - **评估器**：OOD 进展/质量排序（VOC, Kendall's $\tau_a$），失败预测（Rollout AUROC, Prefix AUROC @50%, Balanced accuracy）。
  - **策略**：真实任务成功率（%），端到端 P95 推理延迟（ms），学习曲线 AUC，达到 80% 成功率所需的 rollout 数量（$N_{80}$）。
- **主要结果**: 
  - **评估器性能**：FIERCE 评估器在 OOD 进展排序（VOC 0.96, $\tau_a$ 0.66）和 Prefix AUROC（0.693）上均优于 Robometer 和 Foresight-Transformer 等 baseline。
  - **策略性能**：在真实任务（peg-in-hole 和 cup stack）中，完整 FIERCE 平均成功率达到 92%，显著高于 Robometer-guided RL（83%）和去除失败惩罚的 FIERCE（85%）。
  - **部署效率**：FIERCE 部署时的端到端 P95 延迟约为 21.9 ms，与纯 BC 初始化（21.7 ms）相当，远低于通用策略（约 94.3 ms），证明了其作为“快速专用策略”的优势。
  - **消融实验**：在真实任务中，加入失败风险惩罚比不加能更快达到 80% 成功率（$N_{80}$ 从 270/210 降至 185/147），验证了失败反馈在有限交互预算下对加速策略收敛的关键作用。

### 21. 🔥 [DeformSmith: Physics Harness-Guided Hierarchical Generation of Deformable Assets for Robot Manipulation] (DeformSmith：物理测试工具引导的可变形资产分层生成用于机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18620` | [点击跳转](https://arxiv.org/abs/2609.18620)

**0. 论文标题**
- **英文标题**: DeformSmith: Physics Harness-Guided Hierarchical Generation of Deformable Assets for Robot Manipulation
- **中文标题**: DeformSmith：物理测试工具引导的可变形资产分层生成用于机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出DeformSmith框架，通过分层智能体架构和基于物理仿真的反馈闭环，从文本或单图自动生成能扛住机器人抓取操作的高保真可变形3D资产。

**1. 整体逻辑**
- **研究任务**: 从文本描述或单张图像自动生成具备物理可信度、可直接用于机器人仿真与操作的可变形3D资产（需同时搞定几何、外观和物理属性）。
- **研究动机**: 现有的单图/文本生成方法（如PhysGen3D）只能推断物理属性的初始估计，无法直接揭示模拟交互所需的底层材料参数和接触属性；且可变形物体的几何、物理属性和接触条件高度耦合，单次前馈生成根本保证不了物理合理性和操作可行性。
- **本质改动**: 摒弃单次前馈生成，引入分层递进构建（L0-L3）与基于物理仿真的反馈闭环（Harness），把机器人实际抓取、搬运的交互反馈纳入生成循环，用仿真探针一步步验证和修正物理参数。
- **技术溯源**: 基于 Qwen-Image-2512（文生图）、SAM 3/SAM 3D（分割与网格/高斯重建）、MoGe-2（几何估计）、CoACD（凸分解）、Warp MPM（可变形仿真后端）、SAPIEN（机器人仿真）、GraspNet（抓取生成）以及 GPT-5.6 Sol（作为规划、设计与评判智能体）。

**2. 技术拆解**
- **核心方法**: 
  1. **分层资产生成（L0-L3）**：L0重建3D几何并对齐网格、高斯与粒子；L1初始化物理模型（质量、体积、接触条件）；L2通过MPM（物质点法）仿真探针配置材料参数（如杨氏模量）；L3通过机器人 pick-and-place 反馈调整动作与材料。
  2. **共享物理测试工具（Harness）**：由 Planner、Designer、Prober、Critic 和 Orchestrator 组成。Prober 跑仿真，Critic 解释证据，Orchestrator 执行规则检查，通过仿真证据指导参数修正，并强制执行物理规则与修改预算。
  3. **机器人交互与接触建模**：在 MPM 网格节点层面校正速度以处理非穿透与摩擦接触，并估计抓取反作用力。
- **关键细节**: 
  - **输入输出**：输入为文本或单图，输出为基于粒子的物理表示、高斯外观、物理配置及交互数据。
  - **模型结构**：采用各向同性 neo-Hookean 材料模型；使用粒子驱动的高斯变形来更新渲染。
  - **规模/超参**：测试了39个案例；Harness 平均每个资产调用14次仿真；使用 GPT-5.6 Sol 作为 LLM 智能体。
- **训练/优化目标**: 非端到端学习训练。核心机制是基于规则的仿真反馈与 LLM 智能体引导的启发式搜索。优化目标是使生成的资产在独立物理测试中满足目标材料行为（如刚度、恢复），并在机器人操作任务中成功完成抓取与放置，同时保持视觉与语义一致性。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：39个自构建案例（30个文本驱动的适合抓取的体积可变形物体，9个图像驱动的来自 PhysGen3D 公开资产的目标物体）。
  - **对比对象（baseline）**：PhysGen3D、PhysGM、PhysX-Omni。
  - **测试环境**：SAPIEN 机器人仿真环境，RealMan RM65-6F 机械臂，Warp MPM 物理后端。
- **评价指标**: 
  - **自动化评估**：使用 GPT-6 Astra 对物理真实感、照片真实感、语义一致性打分（0-1分）。
  - **人类评估**：盲测偏好对比（物理合理性、视觉质量、语义一致性胜率）。
  - **消融指标**：资产交付率、物理测试通过率、目标满足率、硬故障率、任务成功率、联合成功率。
- **主要结果**: 
  - 相比 baseline，DeformSmith 在 GPT-6 评估中物理真实感达 0.70（PhysGen3D 为 0.46），照片真实感达 0.58（PhysGen3D 为 0.34）。
  - 人类偏好对比中，视觉质量胜率达 88%-96%，物理合理性胜率达 68%-75%。
  - 消融实验证明：分层结构将资产交付率从 83% 提升至 93%；物理 Harness 将材料目标满足率从 40% 提升至 73%，硬故障率从 17% 降至 7%；操作引导细化将机器人任务联合成功率从 27% 提升至 57%。

### 22. 🔥 [ActionPiece: Rethinking Action Tokenization for Autoregressive Vision-Language-Action Models] (ActionPiece：重新思考自回归视觉-语言-动作模型的动作分词)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18487` | [点击跳转](https://arxiv.org/abs/2609.18487)

**0. 论文标题**
- **英文标题**: ActionPiece: Rethinking Action Tokenization for Autoregressive Vision-Language-Action Models
- **中文标题**: ActionPiece：重新思考自回归视觉-语言-动作模型的动作分词
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合物理距离排序监督的动作分词器 ActionPiece，并引入 PRC 指标评估动作相对关系的保留程度，显著提升了自回归 VLA 模型在分布内及分布外任务中的执行成功率。

**1. 整体逻辑**
- **研究任务**: 领域与类型：具身智能/机器人基础模型，方法创新。论文要解决的任务是：自回归视觉-语言-动作（VLA）模型中的动作分词（Action Tokenization），即将连续的机器人动作块（action chunks）压缩为离散的 token 序列，以便视觉语言大模型进行自回归预测。
- **研究动机**: 现有的动作分词器（如坐标离散化、频域压缩、向量量化）通常用均方误差（MSE）等逐点重建指标来评估。但 MSE 小并不代表动作间的相对调整被忠实保留。压缩后，相似动作可能聚集，但针对不同上下文所需的微小动作调整（如精确对齐、抓取）会被削弱、扭曲甚至反转。这导致策略即使预测对了 token，解码出的动作也会因为丢失了相对物理关系而执行失败。
- **本质改动**: 摒弃仅关注单点重建误差的思路，在动作分词器的表示学习和量化分配阶段，显式引入物理距离排序监督，确保离散化后的 token 能够保留原始连续动作之间的“远近”物理拓扑关系。
- **技术溯源**: 基于残差向量量化（RVQ）和 Transformer 编解码器架构；下游策略基座采用 Qwen3-VL-4B；对比的基线动作分词器包括 ActionCodec、OAT、FASTer、FAST 和 Standard RVQ。

**2. 技术拆解**
- **核心方法**: 
  1. 提出物理秩一致性（PRC）指标，在解码后的动作空间计算物理距离近邻排序的 Spearman 相关系数，用于衡量分词器对局部物理关系的保留程度。
  2. 提出 ActionPiece 分词器，在标准 RVQ 的基础上，联合优化物理秩保持（PRP）和量化正则化（QR）两个损失函数。
- **关键细节**: 
  - 物理距离定义：综合了归一化的平移距离、SO(3) 上的最短测地线旋转角以及夹爪状态差异。
  - 模型结构：浅层 Transformer 编码器/解码器 + 深度为 1 的 RVQ（码本大小 512）。输入 8 步动作块，输出 16 个离散 token（16 个 latent slots）。
  - PRP（物理秩保持）：在编码特征和量化特征距离上，利用对比学习思想，拉近物理距离近的动作（batch 内 5th percentile），推远物理距离远的动作（95th percentile）。
  - QR（量化正则化）：在码本分配的软概率分布上计算 Jensen-Shannon 散度，要求物理距离近的动作具有相似的码本分配分布，距离远的分布差异大。
- **训练/优化目标**: 
  - 分词器总损失：$\mathcal{L}_{tok} = \mathcal{L}_{MSE} + \lambda_{vq}\mathcal{L}_{commit} + \lambda_r\mathcal{L}_{rank}(PRP) + \lambda_q\mathcal{L}_{quant}(QR)$。
  - 下游 VLA 策略训练目标：标准的 next-token prediction（交叉熵损失）。分词器训练完成后冻结，为 VLA 提供离散 token 目标。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（分布内仿真）、LIBERO-Plus（7种分布外扰动）、SimplerEnv（基于 BridgeData V2 的 real-to-sim 迁移）、VLA-Arena（L0-L2 难度递进的仿真泛化测试）。
  - 对比对象（Baseline）：动作分词器对比了 ActionCodec、OAT、FASTerVQ、FAST、Standard RVQ；下游策略在 SimplerEnv 和 VLA-Arena 中还对比了 RT-1-X、Octo、OpenVLA-OFT、$\pi_0$、$\pi_{0.5}$、GR00T 等主流 VLA 模型。所有对比实验均统一使用 Qwen3-VL-4B 作为策略基座。
- **评价指标**: 任务成功率（Success Rate, SR）、物理秩一致性（PRC）、重建均方误差（MSE）、累积安全成本（Cumulative Cost, CC）。
- **主要结果**: 
  - 在统一基座下，ActionPiece 在 LIBERO 上达到 94.8%（超最强基线 ActionCodec 1.1%），在 LIBERO-Plus 上达到 68.8%（超基线 4.5%），证明保留物理关系对 OOD 泛化尤为重要。
  - 在 SimplerEnv real-to-sim 测试中，平均成功率达 71.9%，超越所有对比方法（如 $\pi_{0.5}$ 的 57.1%）。
  - 在 VLA-Arena L0-L2 测试中，平均成功率达 51.5%，同样取得 SOTA。
  - 相关性分析表明，PRC 与下游成功率的 Spearman 相关系数（0.681）显著高于传统 MSE 指标（0.544）。消融实验证实 PRP 和 QR 联合使用能同时提升 PRC（从 0.902 提升至 0.953）和策略成功率。

- **一句话总结**: 本文属于具身智能/机器人学习领域的方法创新工作，针对自回归VLA模型中的动作离散化问题，提出在表示学习和量化阶段联合监督物理动作的远近排序关系，解决了传统MSE重建无法保留动作微调差异的缺陷，显著提升了下游策略的控制成功率。

**1. 整体逻辑**
- **研究任务**: 自回归视觉-语言-动作（VLA）模型中的连续动作离散化（动作分词/Action Tokenization），即将连续的机器人动作块压缩为离散的token序列，供大模型进行自回归预测。
- **研究动机**: 现有的动作分词器通常用均方误差（MSE）来评估重建质量，但MSE小并不意味着动作之间的相对物理关系被保留。在压缩过程中，相似动作可能依然聚集，但不同上下文所需的微调差异（如对齐、抓取时的微小调整）会被削弱、扭曲甚至反转。这导致即使策略预测出了正确的token，解码出的动作也会因为丢失了物理相对关系而执行失败。
- **本质改动**: 放弃单纯依赖点对点重建误差（MSE），引入物理秩一致性（PRC）来衡量局部物理距离排序的保留程度；在分词器训练时，加入物理排序监督，强制模型在特征空间和码字分配概率上保持物理动作的“近远”相对关系。
- **技术溯源**: 基于残差向量量化（RVQ）、浅层Transformer架构，下游策略基于Qwen3-VL-4B视觉语言基座。

**2. 技术拆解**
- **核心方法**: 提出 ActionPiece 分词器，在传统的MSE重建和RVQ commitment损失之外，引入两个物理排序监督目标：
  1. **物理秩保留（PRP）**：在编码器和量化特征距离上监督近远排序，使用排序损失（softplus）拉近物理距离近的动作特征，推远物理距离远的特征。
  2. **量化正则化（QR）**：在码字分配概率分布（Jensen-Shannon散度）上应用相同的近远排序，约束离散词汇的分配逻辑。
- **关键细节**: 
  - 架构：浅层Transformer编码器/解码器 + 1层RVQ（Q=1）。
  - 输入输出：将8步动作块（包含平移、SO(3)旋转、夹爪状态）压缩为16个离散token。
  - 物理距离定义：结合了归一化的平移、SO(3)上的最短测地线旋转和夹爪差异。
  - 采样策略：在训练batch内，对每个anchor动作，选取物理距离5%分位数的样本作为近样本（positive），95%分位数的样本作为远样本（negative）进行对比监督。
- **训练/优化目标**: 
  - 分词器总损失 = MSE重建损失 + RVQ commitment损失 + PRP排序损失 + QR散度排序损失。
  - 下游VLA策略训练采用标准的 next-token prediction（交叉熵损失），分词器在策略训练阶段被冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集/Benchmark：LIBERO（分布内）、LIBERO-Plus（分布外/未见扰动）、SimplerEnv（真机到仿真迁移，BridgeData V2）、VLA-Arena（L0-L2难度）。
  - 对比Baseline：在LIBERO上对比了ActionCodec, OAT, FASTerVQ, FAST, Standard RVQ；在SimplerEnv和VLA-Arena上对比了RT-1-X, Octo, OpenVLA-OFT, $\pi_0$, $\pi_{0.5}$, GR00T等主流VLA方法。
  - 控制变量：在LIBERO对比中，统一使用Qwen3-VL-4B作为策略骨干，固定训练数据、prompt、优化器和训练步数。
- **评价指标**: 任务成功率（Success Rate, %），以及提出的物理秩一致性（PRC，衡量解码后动作局部物理距离排序的Spearman相关系数）。
- **主要结果**: 
  - 在LIBERO上达到94.8%（最强baseline FAST为94.7%/ActionCodec为93.7%）；在分布外的LIBERO-Plus上达到68.8%，比最强baseline（FAST, 64.3%）高出4.5个百分点。
  - 在SimplerEnv真机到仿真迁移任务中，平均成功率达到71.9%（SOTA）。
  - 在VLA-Arena L0-L2难度中，平均成功率达到51.5%（SOTA）。
  - 消融实验表明，PRP和QR联合使用能同时提升PRC指标（从Standard RVQ的0.902提升至0.953）和下游策略成功率，验证了物理关系监督的有效性。

### 24. 🔥 [Decoupling Vision, Language, and Action for Efficient Multi-Task Robot Policies] (解耦视觉、语言与动作以实现高效的多任务机器人策略)

**0. 论文标题**
- **英文标题**: Decoupling Vision, Language, and Action for Efficient Multi-Task Robot Policies
- **中文标题**: 解耦视觉、语言与动作以实现高效的多任务机器人策略
- **研究机构**: 原文未提及
- **一句话总结**: 抛弃庞大的联合预训练VLM主干，采用独立的视觉与语言编码器搭配MeanFlow动作头，在保持多任务操作成功率的同时，将推理速度提升十倍以上并大幅降低能耗。

**1. 整体逻辑**
- **研究任务**: 构建用于多任务机器人操作的视觉-语言-动作（VLA）策略模型。
- **研究动机**: 现有VLA模型多依赖数十亿参数的VLM主干，每次推理延迟高（约100ms）、能耗大，无法满足低级操作任务中25-50Hz的高频控制需求。
- **本质改动**: 将VLM主干解耦为独立的视觉编码器和语言编码器，仅在动作头中进行特征融合，并用MeanFlow实现单次前向传播生成动作块，从而大幅降低推理计算量。
- **技术溯源**: 基于 DINOv3（视觉编码器）、NeoBERT（语言编码器）、MeanFlow（动作头），对比了 OpenVLA、$\pi_{0.5}$、GR00T N1.7 等VLA基线。

**2. 技术拆解**
- **核心方法**: 提出解耦具身模型（DEM）。视觉端使用微调的 DINOv3 ConvNeXt-B 提取图像特征；语言端使用冻结的 NeoBERT 提取文本特征（指令不变时缓存复用）；动作端使用 MeanFlow 动作头，通过交叉注意力融合多模态上下文，单次前向传播直接输出动作块。
- **关键细节**: 
  - 输入输出：输入为场景/腕部相机图像、语言指令和本体感觉状态；输出为包含16个动作的动作块（每8个控制步重规划一次）。
  - 模型结构：视觉编码器输出512个token，语言编码器输出32个token，加上本体感觉token，共545个上下文token。动作头包含8个Transformer块，参数量107M。总参数量417M（每步激活195M）。
  - 关键超参：图像输入256像素，语言截断/填充至32 token，动作头隐藏层维度768。
- **训练/优化目标**: 视觉编码器微调，语言编码器冻结，动作头从零训练。动作头优化目标为MeanFlow损失函数，通过预测插值区间的平均速度，利用闭式解和Jacobian向量积计算总导数，结合自适应权重进行回归训练。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboCasa（18个模拟厨房任务，每任务500个demo），FurnitureBench（3个真实机器人组装任务，每任务200个demo）。
  - 对比对象（baseline）：OpenVLA, Octo, SmolVLA, $\pi_{0.5}$, GR00T N1.7, TurboVLA, ReactVLA。
  - 测试环境：模拟在RoboCasa评估；真实机器人使用xArm 7加线性导轨（8自由度）。推理硬件为单张 RTX PRO 6000 GPU。
- **评价指标**: 任务成功率（%），单次推理延迟（ms），最大吞吐量（calls/s），单次推理GPU能耗（J）。
- **主要结果**: 
  - 成功率：在RoboCasa 18个任务上，DEM成功率55.6%，与GR00T N1.7（56.9%）和$\pi_{0.5}$（54.6%）处于同一水平；在3个真实机器人任务上，DEM达66.0%，GR00T N1.7为68.0%。
  - 效率：在单卡RTX PRO 6000上，DEM单次推理仅需6.1ms，吞吐量162.7 calls/s，能耗2.07 J。相比VLM主干策略（如GR00T N1.7延迟51.8ms，19.3 calls/s，13.71 J），吞吐量提升8-17倍，能耗降低6-15倍。
  - 消融结论：微调视觉编码器对成功率提升巨大（+23%），而微调语言编码器无明显变化；MeanFlow动作头在保持相近成功率的前提下，将推理速度提升了数倍（相比Diffusion/Flow matching）。

### 25. 🔥 [M2Tok: Multi-head Multi-codebook Discrete Action Tokenization for Vision-Language-Action Models] (M2Tok：面向视觉-语言-动作模型的多头多码本离散动作分词器)

**0. 论文标题**
- **英文标题**: M2Tok: Multi-head Multi-codebook Discrete Action Tokenization for Vision-Language-Action Models
- **中文标题**: M2Tok：面向视觉-语言-动作模型的多头多码本离散动作分词器
- **研究机构**: 原文未提及（仅提及受上海市“浦江计划”资助，未写明具体依托单位）
- **一句话总结**: 本文是具身智能/VLA领域的方法创新工作，提出了一种多头多码本的动作离散化方法，通过子空间分解和组合量化打破了现有VLA模型的“离散化瓶颈”，大幅降低了动作重建误差并显著提升了机器人操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 将连续的高维机器人动作信号（如双臂14自由度）离散化为紧凑的离散token，以便输入到自回归的视觉-语言-动作（VLA）大模型中进行策略学习。
- **研究动机**: 现有的动作tokenize方法（如单步分箱、频域压缩或基于残差向量量化RVQ的方法）存在“离散化瓶颈”：一是语义纠缠，把6-DoF位姿和夹爪状态混在一个共享空间；二是表达能力受限，RVQ的码本大小限制了组合密度，无法覆盖高频动作空间，导致重建误差大、丢失精细控制细节。
- **本质改动**: 放弃传统的残差向量量化（RVQ）或单码本设计，将潜在动作特征分解为正交子空间（多头），并为每个头分配独立的码本进行量化，利用多码本的组合特性指数级扩大token的表达能力。
- **技术溯源**: 基于 VQ-VAE 框架构建 tokenizer；VLA 模型基座采用 Qwen2.5-0.5B 作为 LLM，SigLIP 作为视觉编码器。

**2. 技术拆解**
- **核心方法**: 
  1. 双臂分解：将14维双臂动作拆分为两个独立的7维单臂序列，学习机械臂无关的运动基元。
  2. 时空混合编码器：交替使用1D因果卷积和Transformer，提取局部高频动态和全局时序依赖。
  3. 多头多码本量化：将latent vector切分为 $h$ 段，每段用独立的码本（大小为 $N/h$）量化。组合表达能力从 $N$ 提升至 $(N/h)^h$。
  4. 转换模块：在VLA自回归解码时，不使用普通的embedding层，而是从M2Tok的码本中取出量化后的连续embedding，通过MLP映射到LLM的语义空间，保留动作语义。
- **关键细节**: 
  - 输入输出：输入为单臂7维动作chunk，输出为固定长度的离散token序列。
  - 模型规模：总码本大小2048，分为8个码本（$h=8$），每个码本256个entry，embedding维度256。
  - 序列构造：使用特殊功能token（如 `la_bos`/`la_eos`）界定文本、状态、图像和左右臂动作的边界，实现统一的多模态自回归接口。
- **训练/优化目标**: 
  - Tokenizer训练：标准VQ-VAE损失，包括重建损失（L_rec）、嵌入损失（L_emb）和承诺损失（L_com）。
  - VLA训练：自回归解码的负对数似然损失（交叉熵），基于视觉、语言和状态上下文预测下一个动作token。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboTwin仿真（12个任务，19200条轨迹），Simpler-Env仿真（基于BridgeV2数据集训练，4个任务），真实世界（3个零样本sim-to-real任务，使用AgileX Cobot Magic双臂平台）。
  - 对比对象（baseline）：Binning, FAST, VQ-BET, VQ-VLA。
- **评价指标**: 动作重建L1 Loss，以及各任务的成功率（Success rate）。
- **主要结果**: 
  - 重建精度：M2Tok的重建L1 Loss降至0.0024，显著低于FAST (0.0055)、VQ-BET (0.0044) 和 VQ-VLA (0.0032)。
  - 仿真表现：在RoboTwin上平均成功率达51%，比最强baseline VQ-VLA (45%) 相对提升13%；在Simpler-Env上平均成功率28%，比VQ-VLA (21%) 相对提升33%。
  - 真实世界：在3个零样本任务中平均成功率达33%，优于VQ-VLA的28%。
  - 推理效率：在单张4090上推理频率达8.2Hz，结合vLLM引擎可达56.2Hz，满足实时控制需求。

- **研究任务**: 接触丰富的机器人操作（如USB插入、拔插头、按压按钮等），要求策略能根据实时的接触反馈快速调整末端执行器的位姿。
- **研究动机**: 现有的力感知VLA模型通常将全局任务规划和局部接触调整耦合在同一个动作预测中。演示数据只记录了最终动作，没有提供“参考动作”和“接触修正”的显式标签。如果将两者解耦，让慢速路径生成参考动作，快速路径根据力反馈进行修正，可以避免等待完整动作块（action chunk）重新生成带来的延迟，但难点在于如何从现有演示中构建修正的监督信号。
- **本质改动**: 不直接让策略端到端预测绝对动作，而是将动作解耦为“慢速生成的参考动作”和“快速预测的修正量”。为解决演示数据缺乏修正标签的问题，利用冻结教师模型在“输入力反馈”和“不输入力反馈”两种模式下的预测差值，构建显式的力修正监督目标；同时引入延迟修正目标来补偿参考动作更新滞后带来的状态偏移。
- **技术溯源**: 基于 ForceVLA（作为教师骨干网络）、FAVLA（使用因果时间卷积网络TCN编码力历史）、以及 Flow-matching（流匹配，用于动作生成）。

**2. 技术拆解**
- **核心方法**: 提出 ForceDelta-VLA 框架。训练分三步：1）训练一个输入力历史的时序VLA教师；2）冻结教师，通过引入可学习的空力token和适配器，训练一个“力无关”模式来生成参考动作；3）利用教师在相同上下文下的成对预测计算修正目标，训练轻量级修正策略。部署时，教师异步生成并缓存参考动作，修正策略高频读取缓存和实时力历史，输出位姿修正量叠加到参考动作上。
- **关键细节**: 
  - **输入输出**: 输入多视角图像、语言指令、机器人TCP位姿、100ms的力/力矩（wrench）历史；输出5步位姿修正量（叠加在教师生成的50步参考动作块上）。
  - **模型结构**: 教师基于ForceVLA，用因果TCN编码力历史。修正策略包含因果力编码器、共享Transformer注意力模块和两个独立输出头（分别预测力修正和延迟修正）。
  - **规模与超参**: 控制频率100Hz，教师推理约190ms，修正策略推理约2.4ms。
- **训练/优化目标**: 
  - **力修正目标**: 当前状态下，教师的“力条件预测”与“力无关预测”的位姿差值。
  - **延迟修正目标**: 当前“力无关预测”与“缓存的参考动作（插值到当前时间）”的差值，加上参考状态对齐项（将状态偏移转换到动作坐标空间）。
  - **损失函数**: 带时间衰减权重的归一化坐标均方误差（MSE）。采用异步调度回放（Asynchronous schedule replay）模拟推理延迟进行训练。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**: 自采真实机器人操作数据集，包含5个单臂（Franka Panda）和4个双臂（X Square Robot）接触丰富任务，每任务200条演示。
  - **对比对象（baseline）**: ForceVLA、π0.5、TA-VLA、ImplicitRDP，以及直接执行 Stage-1 Temporal Teacher（教师模型直接推理）。
- **评价指标**: 任务成功率（Success rate）、成功试验中的平均峰值接触力（Mean peak contact force）、任务完成时间（Completion time）。
- **主要结果**: 
  - **成功率**: ForceDelta-VLA 平均成功率达 82.2%，显著优于 ForceVLA (54.4%)、TA-VLA (57.2%)、π0.5 (47.2%) 和 ImplicitRDP (45.0%)，也比直接执行教师模型 (70.6%) 高出 11.6%。
  - **接触力与速度**: 相比 ForceVLA，单臂和双臂平台的平均峰值接触力分别降低 4.2N 和 4.3N（降幅约 26%）。修正策略单次推理仅需 2.43 ms，远低于教师模型的 189.7 ms，完美适配 100Hz 控制频率。
  - **泛化能力**: 在未见物体上测试，成功率比教师模型高 26.7%，峰值接触力降低 8.2N。

**0. 论文标题**
- **英文标题**: WholeBodyWAM: Learning Whole-Body World Action Models with Scalable Motion Priors
- **中文标题**: WholeBodyWAM：利用可扩展运动先验学习全身世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 WholeBodyWAM，通过超4000小时异构运动数据预训练运动专家，并将其与视频、动作专家融合，为人形机器人全身控制提供可扩展的未来动态预测先验，大幅提升控制性能和数据效率。

**1. 整体逻辑**
- **研究任务**: 人形机器人的全身操作与控制（包括姿态转换、移动和物体交互）。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型主要依赖当前观测，缺乏对未来动态的显式建模；而世界动作模型（WAM）在人形控制中探索不足。此外，收集目标机器人的全身轨迹成本极高，但人类和异构人形机器人的大规模运动数据虽然丰富，却无法直接作为特定机器人的动作指令。
- **本质改动**: 将大规模异构运动数据转化为可迁移的预测先验，在 WAM 架构中引入显式的“未来全身运动”预测模态，与未来视觉动态共同指导特定具身（embodiment-specific）的动作生成。
- **技术溯源**: 基于 Wan2.2（视频生成/文本编码）、GVHMR（3D运动恢复）、SMPL-X（人体参数化模型）、Mixture-of-Transformers (MoT) 注意力机制、Flow Matching（流匹配）。

**2. 技术拆解**
- **核心方法**: 采用两阶段训练框架。Stage I：构建 UniMotion-4K 数据集，将异构运动数据统一到无根节点的 63D 关节旋转空间，预训练语言条件的 Motion Expert 以预测未来运动。Stage II：将预训练的 Motion Expert 与 Video Expert、Action Expert 通过非对称的 MoT 注意力机制融合，进行联合后训练。
- **关键细节**: 
  - 输入：当前视觉观测、最近16帧运动历史、语言指令。
  - 输出：未来32帧全身运动（仅作预测表征，推理时不反馈）、32步可执行动作块（34维）。
  - 模型结构：Motion Expert 为 30层 Transformer (512维)；Action Expert 为 30层 DiT (1024维)；Video Expert 基于 Wan2.2-TI2V-5B。
  - 部署：单张 NVIDIA RTX 5090 GPU，30Hz 控制频率，4步 Euler 采样。
- **训练/优化目标**: 采用连续流匹配（Continuous Flow Matching）。Stage I 仅优化 Motion Expert 预测未来运动的速度场；Stage II 联合优化 Video、Motion、Action 三个专家的流匹配损失（权重均为1），并使用非对称注意力掩码防止未来视觉信息泄露到动作预测中。

**3. 实验结果**
- **实验设置**: 
  - 平台与数据：TianGong 3.0 全尺寸人形机器人，每个任务 100 条演示数据。
  - 任务：6个真实世界全身任务（如玩具抓取、洗衣装载、抱枕转移、跪姿收纳、玩具转移、箱子转移）。
  - Baselines：FastWAM, $\pi_{0.5}$, GR00T N1.7, $\tau_0$-WM。
- **评价指标**: 
  - 任务得分：基于完成子任务（里程碑）的归一化得分（%）。
  - 运动预测：平均关节旋转误差（MPJRE, 度）。
  - 推理延迟：端到端策略推理时间（ms）。
- **主要结果**: 
  - 性能超越：平均任务得分 72.2%，比最强 baseline (GR00T N1.7 的 60.8%) 高出 11.4%，且在空间偏移和未见物体泛化上表现更好。
  - 消融验证：Motion 预训练和 Motion-to-Action 注意力流缺一不可；将预训练的 Motion Expert 插入 $\tau_0$-WM 也能使其得分从 39.4% 提升至 62.7%，证明先验的通用性。
  - Scaling 与数据效率：预训练数据从 0 增至 4K+ 小时，MPJRE 降低 27.5%；仅用 50% 目标机器人数据的 4K+ 预训练模型（46.9%），超越了使用 100% 数据的 FastWAM（42.9%）。
  - 推理效率：端到端延迟 363ms，比 DreamZero 和 LingBot-VA 快一个数量级以上，略慢于 $\tau_0$-WM (313ms)。

### 28. 🔥 [A Comprehensive Review of Generative Physical Artificial Intelligence] (生成式物理人工智能综合综述)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18111` | [点击跳转](https://arxiv.org/abs/2609.18111)

**0. 论文标题**
- **英文标题**: A Comprehensive Review of Generative Physical Artificial Intelligence
- **中文标题**: 生成式物理人工智能综合综述
- **研究机构**: 原文未提及
- **一句话总结**: 本文是一篇综述，系统梳理了生成式物理人工智能（GPAI）的五大核心模型范式，全面总结了其在具身智能中的架构基础、应用场景及实际部署挑战。

**1. 整体逻辑**
- **研究任务**: 梳理生成式物理人工智能（GPAI）系统，理清其架构基础、当前应用和关键局限性，为具身智能提供统一的分类框架和端到端视角。
- **研究动机**: 现有的GPAI综述比较碎片化，大多只局限于机器人操作、物理感知或单一基础模型，缺乏对“感知-认知-执行”全链路的整合视角，而且忽略了安全、数据稀缺、sim2real（仿真到现实）等跨领域的实际部署挑战。
- **本质改动**: 提出了一种包含五种生成式模型（RFMs、VLAs、LBMs、DPMs、WFMs）的统一分类法，把散落的具身智能研究整合到闭环控制框架里，并补齐了部署评估和风险评估的视角。
- **技术溯源**: 基于大语言模型（LLMs）、视觉语言模型（VLMs）、扩散模型（Diffusion Models）、强化学习（RL）以及各类机器人基础模型（如 RT-1, RT-2, PaLM-E, Gato 等）。

**2. 技术拆解**
- **核心方法**: 提出GPAI五分类法：1) 机器人基础模型（RFMs）用于跨平台技能迁移；2) 视觉语言动作模型（VLAs）用于端到端多模态感知与控制；3) 大行为模型（LBMs）用于类人动作生成；4) 扩散策略模型（DPMs）用于基于扩散模型的时间连贯动作生成；5) 世界基础模型（WFMs）用于符合物理规律的仿真与数据生成。
- **关键细节**: 
  - **RFMs**：多模态编码器融合动作、文本、传感器和视觉输入，通过Transformer处理（如 PaLM-E, Gato）。
  - **VLAs**：双模型结构，结合VLM和动作解码器（如 RT-1, RT-2, OpenVLA），实现从多模态输入到电机命令的端到端映射。
  - **LBMs**：通过RL和双反馈机制（真实性和物理合理性）学习类人行为，支持零样本全身控制（如 Meta Motivo）。
  - **DPMs**：利用迭代去噪过程从高斯噪声生成高维动作序列，解决多模态分布下的模式崩溃问题。
  - **WFMs**：基于自回归或扩散架构预测未来状态（rollouts），用于MPC（模型预测控制）规划和合成数据生成（如 NVIDIA Cosmos）。
- **训练/优化目标**: 各模型目标不同：RFMs/VLAs采用多模态自回归/交叉熵损失；DPMs采用去噪预测损失（如L2或epsilon预测）；WFMs采用下一步/下一段状态预测损失；LBMs采用基于RL的奖励最大化（结合判别器和物理一致性反馈）。

**3. 实验结果**
- **实验设置**: 作为综述，本文没有跑新实验，主要是汇总了现有代表性模型在各大benchmark上的表现。提到的数据集/基准包括：LIBERO, RLBench, Open X-Embodiment, RoboMimic, CALVIN, WorldScore, WorldModelBench, WorldSimBench。对比的baseline包括传统行为克隆（如 LSTM-GMM, IBC）及 vanilla VLA 等。
- **评价指标**: 任务成功率、多模态动作分布覆盖率、时间一致性、实时推理性能、跨平台泛化能力、抗扰动鲁棒性，以及WFM的生成质量、物理合理性和可控性。
- **主要结果**: 
  - RT-1 在700多个操作任务中达到67%的成功率。
  - DPMs 在12个机器人任务中平均成功率比 baseline 提升47%，有效避免了行为克隆的模式崩溃。
  - 结合扩散组件的 VLA 架构在操作任务中成功率超80%，而 vanilla VLA 不到40%。
  - OpenVLA 在29个基准上超越了参数量大7倍的 RT-2-X。
  - 文章指出一个关键结论：当前基准指标与真实世界鲁棒性存在弱相关性，在控制环境下跑分高，但实际泛化失败依然频发。

### 29. 🔥 [Beyond Pixel Similarity: Task-Aware Evaluation of GAN-Based Synthetic Sonar Data for Robotic Perception] (超越像素相似性：面向机器人感知的基于GAN的合成声呐数据的任务感知评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18100` | [点击跳转](https://arxiv.org/abs/2609.18100)

**0. 论文标题**
- **英文标题**: Beyond Pixel Similarity: Task-Aware Evaluation of GAN-Based Synthetic Sonar Data for Robotic Perception
- **中文标题**: 超越像素相似性：面向机器人感知的基于GAN的合成声呐数据的任务感知评估
- **研究机构**: 原文未提及
- **一句话总结**: 本文发现传统的像素级图像保真度指标（如SSIM、PSNR）无法准确反映GAN生成的合成声呐数据在下游目标检测中的实际效用，证明了引入下游任务性能进行“任务感知评估”的必要性。

**1. 整体逻辑**
- **研究任务**: 评估基于GAN生成的合成声呐图像数据质量，特别是验证其是否真正适用于下游的机器人感知（目标检测）任务。
- **研究动机**: 传统的图像保真度指标（SSIM、PSNR、MSE）只衡量像素级或局部结构相似度，无法反映合成声呐图像中是否保留了下游检测所需的关键特征（如目标边界、声学阴影）。实践中发现，像素得分高的生成图像往往视觉上更模糊，而得分低的图像反而保留了更多检测所需的锐利细节。
- **本质改动**: 将合成声呐数据的评价标准从单一的“像素级图像保真度”拓展为“下游任务感知性能”，通过控制GAN判别器的感受野变量，实证了“像素相似度高不等于下游任务表现好”这一核心结论。
- **技术溯源**: Pix2Pix（条件GAN框架）, YOLOX (YOLOX-S, YOLOX-L), Faster R-CNN。

**2. 技术拆解**
- **核心方法**: 在Pix2Pix框架下，通过控制变量改变判别器的感受野（PixelGAN, PatchGAN-16, PatchGAN-70, ImageGAN）来生成合成声呐图像。随后，分别使用传统图像保真度指标和下游目标检测器对生成图像进行评估，对比两种评估体系下的排名差异。
- **关键细节**: 
  - **数据与条件**：使用 Marine Debris（水池环境）和 UATD（河流环境）两个声呐数据集，以对象掩码（mask）作为条件输入。
  - **生成模型**：生成器固定为 U-Net，判别器分为4种感受野配置，以隔离空间尺度对生成图像的影响。
  - **下游检测器**：YOLOX-S, YOLOX-L, Faster R-CNN。这些检测器**仅在真实声呐数据上训练**，然后直接在生成图像上测试，以此评估生成图像的“任务相关真实性”（task-relevant realism）。
- **训练/优化目标**: 
  - **生成模型**：条件对抗损失结合 L1 重建损失（$L_{cGAN} + \lambda L_{L1}$）。
  - **评估指标**：图像保真度采用 SSIM、PSNR、MSE；任务级评估采用 AP（IoU阈值0.50至0.95的平均值）和 Recall。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：Marine Debris dataset 和 Underwater Acoustic Target Detection (UATD) dataset。
  - **对比对象（baseline）**：四种不同感受野的 Pix2Pix 判别器配置（PixelGAN, PatchGAN-16, PatchGAN-70, ImageGAN）。下游检测基线为 YOLOX-S, YOLOX-L, Faster R-CNN。
- **评价指标**: 图像保真度（SSIM, PSNR, MSE）；下游任务性能（AP@[0.50:0.95] 和 Recall）。
- **主要结果**: 
  - **指标不一致性**：图像保真度排名与下游检测性能排名存在显著错位。例如在 UATD 数据集上，ImageGAN 取得了最高的 SSIM (0.760) 和 PSNR (32.034)，但 PatchGAN-70 在 YOLOX-S 和 YOLOX-L 上取得了更高的 AP（分别为 0.72 和 0.74）。在 Marine Debris 数据集上，PixelGAN 保真度最高，但 PatchGAN-16 和 70 的检测 AP 更高。
  - **核心结论**：PatchGAN 配置虽然像素级相似度得分不是最高，但能保留更清晰的局部结构，从而在下游检测中表现更好。这证明仅靠 SSIM/PSNR 等像素级指标不足以评估合成声呐数据的质量，必须引入任务感知评估。

### 30. 🔥 [Not All Layers Need Tuning: Diagnosing and Directing Adaptation in Vision-Language-Action Models] (并非所有层都需要微调：视觉-语言-动作模型中自适应的诊断与引导)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18084` | [点击跳转](https://arxiv.org/abs/2609.18084)

**0. 论文标题**
- **英文标题**: Not All Layers Need Tuning: Diagnosing and Directing Adaptation in Vision-Language-Action Models
- **中文标题**: 并非所有层都需要微调：视觉-语言-动作模型中自适应的诊断与引导
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种在微调前仅用少量无标签数据诊断VLA模型各模块适应成本的方法，通过动态分配非均匀的LoRA参数，在极低参数量下实现了媲美全参数微调的抗分布偏移能力。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在新部署环境下的参数高效微调（PEFT），以应对外观、空间、新物体、指令等分布偏移。
- **研究动机**: 现有的LoRA等PEFT方法通常对所有网络层施加统一秩的适配器，隐含假设所有区域需要同等调整。但实际上，不同模态的偏移只影响特定的功能区域（如视觉偏移主要影响视觉编码器），统一分配会导致“该调的没调够，不该调的浪费参数”，且在少样本微调时容易过拟合。
- **本质改动**: 摒弃“先微调再观察”或“训练中动态剪枝”的思路，在微调前直接利用少量无标签目标数据预测各功能模块的微调需求，据此分配非均匀的LoRA秩并冻结无需微调的区域。
- **技术溯源**: 基于5种异构VLA架构（OpenVLA-OFT, $\pi_0$, SmolVLA, DTP, Octo），使用LoRA作为基础适配器，结合了CKA（Centered Kernel Alignment）、Fisher信息矩阵、MC Dropout、Fréchet距离等表征与不确定性度量方法。

**2. 技术拆解**
- **核心方法**: 提出“观察-诊断-分配-微调”四阶段流水线。核心在于“两层诊断与门控融合”机制：Tier 1 利用缓存的源域参考计算表征偏移（CKA）并结合Fisher敏感度；Tier 2 利用无参考的代理损失梯度范数和MC Dropout不确定性；通过Fréchet距离计算门控权重，动态融合两层得分以估计各区域的适应成本。最后根据成本得分和参数预算，计算各区域应分配的LoRA秩。
- **关键细节**: 
  - 输入：10个无标签目标观测（用于诊断），20个带标签演示（用于微调）。
  - 模型结构：将VLA按原生模块边界划分为视觉编码器、语言骨干、跨模态投影、动作头等独立区域。
  - 规模：测试了93M到7B参数量的5种架构。
  - 关键超参：冻结阈值 $\delta=0.1$，门控温度 $\gamma=1$，秩-得分增益 $\beta=32$。源域参考缓存大小约30-250MB。
- **训练/优化目标**: 诊断阶段无训练，仅通过前向和一次反向传播计算统计量；微调阶段使用各VLA原生的动作预测损失（如自回归的交叉熵、扩散/Flow-matching的匹配损失），仅优化分配了可变秩LoRA的参数。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（主要，40个操作任务），CALVIN（次要），以及物理xArm-7机械臂真机环境。
  - 对比对象（baseline）：No Adaptation, Full Fine-Tuning, Uniform LoRA (rank 32及匹配参数量), Oracle Allocation, DoRA, $(IA)^3$, AdaLoRA, LoRA-SP, Surgical, Random Allocation。
- **评价指标**: 任务成功率（Success rate %），诊断得分与真实参数位移的Spearman相关系数及 $R^2$。
- **主要结果**: 
  - 诊断准确性：在5种架构上，仅用10个无标签样本，诊断得分与真实微调成本的中位Spearman相关系数达到0.91，$R^2$达0.89。
  - 仿真性能：在LIBERO和CALVIN的匹配参数预算下，Adaptive方法在所有架构上均显著优于Uniform LoRA matched、AdaLoRA等baseline；在约一半的rank-32预算下即可达到Uniform LoRA rank-32的平均成功率，接近Full Fine-Tuning。
  - 真机性能（xArm-7）：在指令偏移下，仅使用0.04%的可训练参数（3.1M），达到21/30成功率（Full FT为22/30）。在5个未见场景（Scene B）中不重训评估，Adaptive成功率达11-23/30，显著优于Full FT（2-11/30）和最强PEFT baseline（8-18/30）。

### 31. 🔥 [Causal-History Test-Time Scaling for Failure Recovery in Autoregressive World-Action Models] (自回归世界-动作模型中用于失败恢复的因果历史测试时扩展)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.18016` | [点击跳转](https://arxiv.org/abs/2609.18016)

**0. 论文标题**
- **英文标题**: Causal-History Test-Time Scaling for Failure Recovery in Autoregressive World-Action Models
- **中文标题**: 自回归世界-动作模型中用于失败恢复的因果历史测试时扩展
- **研究机构**: 原文未提及
- **一句话总结**: 提出无需训练的 FaRe 框架，将自回归世界-动作模型的失败恢复转化为对 KV cache 因果历史的测试时扩展，通过触发、前缀恢复和假设验证三步在推理时修正错误历史，显著提升仿真与真机任务成功率。

**1. 整体逻辑**
- **研究任务**: 解决自回归世界-动作模型 (WAMs) 在机器人操作执行中，因局部误差导致失败后的在线恢复问题。
- **研究动机**: 现有 WAMs 主要在成功轨迹上训练，遇到执行偏差时，自回归模型会将错误的视觉-动作历史保留在 KV cache 中，导致后续预测持续出错（例如抓空后仍执行拉拽动作）。现有的恢复方法要么需要额外收集失败数据进行训练，要么依赖外部符号规划或 VLM 推理，难以直接无缝应用于自回归 WAM。
- **本质改动**: 首次将自回归 WAM 的持久化 KV cache（因果历史）本身作为测试时扩展 (Test-Time Scaling) 的变量。不同于以往只在推理时搜索未来动作或轨迹，该工作直接在推理时修正和评估历史上下文。
- **技术溯源**: 基于自回归世界-动作模型 LingBot-VA（作为冻结的基座策略），以及 Robo-Dopamine GRM-2.0-8B-Preview（作为冻结的进度奖励模型）。

**2. 技术拆解**
- **核心方法**: 提出 FaRe (training-free framework)，包含三个串联阶段：1) 进度感知恢复触发器（决定何时改）；2) 历史前缀恢复（决定改哪里）；3) 假设验证（决定选哪种历史配置）。
- **关键细节**: 
  - **触发器**：计算累积任务进度，当检测到持续停滞（短期连续无进度或长期未突破历史峰值）且机器人当前状态允许中断（非抓取/接触活跃期）时触发恢复。
  - **前缀恢复**：利用进度定位可靠的历史边界，再通过多视角视觉 MSE 检索与当前物理状态最匹配的历史锚点，截断不可靠后缀，用 WAM 原生流程重建前缀 KV cache。
  - **假设验证**：并行评估三种历史假设（保留全历史 Continue、恢复前缀 Prefix、完全重置 Reset），根据预测进度、视觉连续性和动作有效性打分，选最优配置。
- **训练/优化目标**: 无需训练（Training-free）。核心机制是基于冻结的进度奖励模型计算有界相对累积进度，并构建综合打分函数 $J_q$（结合预测进度、多视角视觉 MSE 差异、动作 chunk 最大位移）来评估和选择最优的历史假设。

**3. 实验结果**
- **实验设置**: 
  - 仿真：使用 RoboTwin 2.0 基准，对比基线包括 X-VLA、$\pi_0$、$\pi_{0.5}$、ABot-M0、Motus 和 LingBot-VA。
  - 真机：使用双臂 SO-101 机器人平台，执行 Fold Towel、Stack C-shaped Blocks 和 Organize Vegetables 三个任务，每个任务 20 次独立试验。
- **评价指标**: 任务成功率 (Success Rate, SR)；动作 chunk 推理延迟 (Latency)。
- **主要结果**: 
  - 仿真 (RoboTwin 2.0)：在 LingBot-VA 基线上，Easy 设置成功率从 91.5% 提升至 93.2%，Hard 设置从 90.2% 提升至 92.4%（失败率相对降低约 20%-22%）。
  - 真机：平均成功率从 71.7% 提升至 83.3%（其中 Stack C-shaped Blocks 提升最大，从 65.0% 到 80.0%）。
  - 消融实验证明触发器、前缀恢复、假设验证三个模块均不可或缺；三种历史假设（Continue, Prefix, Reset）在不同场景下互补。
  - 延迟：每个 action chunk 推理延迟从 6200.7 ms 增加至 6872.4 ms，由于假设并行评估且仅在恢复步触发，额外计算开销可控。

### 32. 🔥 [Vision-Language Grounded Task-Context-Aware Imitation Learning for Robotic Disassembly] (面向机器人拆卸的视觉-语言接地与任务上下文感知模仿学习)
- **研究机构**: `原文未提及（仅提及 rros-lab，未写明具体高校或研究所全称）`
- **Arxiv ID**: `2609.17714` | [点击跳转](https://arxiv.org/abs/2609.17714)

**0. 论文标题**
- **英文标题**: Vision-Language Grounded Task-Context-Aware Imitation Learning for Robotic Disassembly
- **中文标题**: 面向机器人拆卸的视觉-语言接地与任务上下文感知模仿学习
- **研究机构**: 原文未提及（仅提及 rros-lab，未写明具体高校或研究所全称）
- **一句话总结**: 提出了一种结合 VLM 层级任务规划和反事实损失目标接地的扩散策略框架，解决了机器人长序列拆卸中多目标歧义和时序冻结问题。

**1. 整体逻辑**
- **研究任务**: 真实世界机器人的长序列拆卸任务（如拔除各种连接器），需要在多目标场景中进行正确的技能选择和目标物体定位（Grounding）。
- **研究动机**: 1) 场景中有多个相似目标，单靠视觉/力觉难以推断意图，数据需求呈组合爆炸；2) 长序列演示中的空闲动作会导致行为克隆策略出现“时序冻结”（机器人卡住不动）；3) 现有方法依赖固定场景和显式物体标注，泛化能力差。
- **本质改动**: 用 VLM 替代人工进行高层语义任务规划，并在底层扩散策略中引入交叉注意力和反事实损失（Counterfactual loss），将语言指令与视觉特征接地，实现无显式标注的多目标消歧。
- **技术溯源**: 视觉基座 DINOv2，语言基座 CLIP，动作解码器 Diffusion Transformer (DiT)，高层规划器 VLM (GPT-5 / Qwen3-VL)。

**2. 技术拆解**
- **核心方法**: 
  1. **VLM 辅助的轨迹标注与在线任务选择**：用 VLM 自动为演示数据打子任务标签；执行时异步调用 VLM，结合视觉和机器人状态进行下一步子任务的语义推理，支持故障恢复。
  2. **反事实损失目标接地**：训练时保持动作、图像等不变，仅将语言条件中的目标物体替换为错误目标。通过 Hinge loss 强迫模型在错误语言条件下的预测误差大于正确条件，迫使策略关注正确的语言-物体关联，避免梯度干扰。
  3. **多模态 DiT 动作头**：将父任务、子任务、力觉等作为独立 token 输入 DiT，通过交叉注意力动态学习视觉、力觉和语言模态的相对权重。
- **关键细节**: 
  - **输入输出**：输入为本体感觉、腕部相机视觉、力觉、语言描述；输出为机器人动作序列。
  - **模型结构**：DINOv2 提取图像 patch，CLIP 提取文本特征，两者通过 cross-attention 融合。融合后的特征连同子任务 embedding 和力觉输入一起送入 DiT 进行动作预测。
  - **规模与超参**：Batch size 128，学习率 1e-4，权重衰减 1e-4。单张 RTX 4080 训练约 22 小时。反事实损失 margin $\delta=0.1$。
- **训练/优化目标**: 
  标准扩散模型 MSE 损失 + 反事实 Hinge 损失。反事实损失仅在特定的子任务阶段（如“接近”阶段）应用，防止后续物理接触阶段失效。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自定义拆卸测试台，包含 USB, D-sub, terminal-block, BNC 等连接器，共 456 个演示轨迹。
  - **对比对象（Baseline）**：单任务扩散策略 (DP-S)、基于 CNN 的多任务上下文感知策略 (DP-M-C-CNN)、基于规则/CNN 子任务选择的 Transformer 多任务策略。
  - **测试环境**：KUKA LBR IIWA14 机械臂。评估了 seen 和 held-out（未见过的电源插头、USB hub、魔术贴等）配置。
- **评价指标**: 端到端任务成功率（50步内完成拆卸并正确选择任务）、子任务预测准确率、目标物体选择正确率、任务切换所需的动作步数。
- **主要结果**: 
  1. **成功率**：VLM-V2 (GPT-5) 版本平均成功率达 94%，比 baseline DP-S (59%) 提升 35 个百分点，比 DP-M-C-CNN (19%) 提升 75 个百分点。
  2. **泛化性**：在未见过的连接器（held-out mechanisms）上，VLM 规划器比 CNN 规划器平均高出 48 个百分点（如 USB Hub 任务 90% vs 40%）。
  3. **目标接地消融**：加入反事实损失和交叉注意力后，目标选择正确率从 13/30 提升至 30/30。
  4. **缓解时序冻结**：VLM 规划器在任务切换时所需的空闲动作步数最少，有效克服了行为克隆的时序冻结问题。

### 33. 🔥 [In-Context Robot Learning with VLM Agents] (基于视觉语言模型智能体的机器人上下文学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.19138` | [点击跳转](https://arxiv.org/abs/2609.19138)

**0. 论文标题**
- **英文标题**: In-Context Robot Learning with VLM Agents
- **中文标题**: 基于视觉语言模型智能体的机器人上下文学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 GPT-Policy 框架，在不微调模型参数的前提下，通过闭环工具调用接口让通用 VLM 直接利用人类视频、动作序列等上下文信息进行机器人上下文学习（ICL），并指导物理执行。

**1. 整体逻辑**
- **研究任务**: 探究现成的通用视觉语言模型（VLM）在不进行专门机器人策略训练和参数更新的情况下，能在多大程度上利用测试时提供的上下文信息（如演示视频、目标图像、交互历史）来指导机器人在陌生任务中的物理操作。
- **研究动机**: 现有的专用机器人基础模型（如 GEN-1.5, S1）已展现出一定的上下文学习能力，但通用 VLM 的上下文理解能力与专用具身模型的能力边界尚不清晰。需要验证通用 VLM 是否能直接通过上下文适应新任务，从而区分“通用任务理解”和“专用具身学习”的贡献。
- **本质改动**: 摒弃了训练专用机器人策略网络的传统范式，转而构建一个共享的闭环接口（GPT-Policy），将通用 VLM 作为“大脑”直接输出参数化的底层工具调用（如笛卡尔位姿），并通过上下文编译器将多模态参考信息注入提示词中，实现基于提示和工具调用的零样本/少样本物理适应。
- **技术溯源**: 基于通用多模态大模型（如文中提到的 GPT-6 Astra 等）的上下文学习与工具调用（Tool use）能力，结合传统的机器人运动学规划（如 Ruckig 轨迹插值、逆运动学求解）。

**2. 技术拆解**
- **核心方法**: GPT-Policy 框架。系统分为三层：1) 上下文构建：将任务指令、多视角图像、上下文参考（目标图像、人类/机器人视频、对齐的动作序列、交互历史）编码为交织的图文输入；2) VLM 决策：VLM 解析当前状态与上下文，输出结构化的工具请求（如 `move_to`, `set_gripper`），包含目标位姿和夹爪状态；3) 约束执行与闭环：底层适配器将位姿请求转化为关节指令，执行后返回测量状态和误差，更新上下文供 VLM 进行下一步重规划。
- **关键细节**: 
  - 输入输出：输入为按时间排序的图像块与文本记录（JSON 格式）；输出为严格的工具调用 JSON，包含目标位姿（位置+四元数）和动作意图说明。
  - 执行层架构：笛卡尔适配器对目标位姿进行线性位置插值和四元数球面线性插值（SLERP），随后调用逆运动学（IK）求解关节角，最后通过 Ruckig 进行时间缩放，确保满足速度、加速度和加加速度（jerk）限制。
  - 闭环机制：执行层不检查碰撞，但会返回 IK 残差、端点误差和关节稳定状态。VLM 根据这些物理反馈和实时图像判断是否到达或需要重规划。
- **训练/优化目标**: 本文非学习类工作，VLM 参数冻结，无梯度更新。核心机制是基于提示工程（Prompt Engineering）和工具调用（Tool use）的闭环推理。底层优化目标为运动学约束（如 IK 位置残差 < 0.002m，姿态残差 < 1°，以及关节限位和动力学限制）。

**3. 实验结果**
- **实验设置**: 
  - 任务与上下文：涵盖 5 类上下文场景，包括跨具身模仿（拿毛巾/笔记本，用人类视频）、接触敏感操作（拧瓶盖/拔插头，用机器人视频+动作）、目标图像跟随（排积木/水果）、主动探索（找盘子/移动探索，用自身历史）、人机交互（井字棋/指物抓取，用在线交互）。
  - 对比对象（baseline）：无上下文（None） vs 各类上下文条件；模型层面横向对比了 GPT-6 Astra、Fable 5.1、Kimi K3。
  - 测试环境：真实物理机器人平台（YAM, ARX X5, Morphi Kino 等双臂/移动机器人），配备多视角 RGB 相机。
- **评价指标**: 
  - 成功率（Success Rate, S/T）：满足几何与语义成功标准的试验比例。
  - 决策次数（Decisions）：单 episode 内生成的动作目标/动作块数量。
  - 执行时间（Execution Time）：完成任务的总耗时。
- **主要结果**: 
  - 上下文显著提升成功率并降低执行成本：例如“拿红毛巾”任务中，加入人类视频后成功率从 0/3 升至 2/3，决策次数从 96.3 降至 76.7，时间从 24.6 分钟降至 18.9 分钟。
  - 动作参考对接触敏感任务至关重要：在“拧瓶盖”任务中，仅有视频成功率为 2/3，加入对齐的动作序列（Robot Video + Action）后成功率达 3/3，且执行轨迹与演示更贴合。
  - 目标图像能有效指导空间排列：“排列 T 型积木”等任务在目标图像指导下达到 3/3 成功率。
  - 模型差异：在拿毛巾任务中，GPT-6 Astra 在人类视频下任务进度达 100%，而 Fable 5.1 和 Kimi K3 仅达 30% 和 20%。
  - 核心结论：上下文能有效改善 VLM 的任务理解和高层规划，但无法解决精确接触、结果验证和物理安全问题（实验中观察到双臂碰撞）。VLM 擅长推理与适应，但在快速底层控制上仍不及专用的 VLA/WAM 模型。

### 34. 🔥 [Workspace Models: Lightweight Robotic Memory via Saliency-Driven Supervision] (工作空间模型：通过显著性驱动监督实现轻量级机器人记忆)
- **研究机构**: `Improbable AI Lab`
- **Arxiv ID**: `2609.20820` | [点击跳转](https://arxiv.org/abs/2609.20820)

**0. 论文标题**
- **英文标题**: Workspace Models: Lightweight Robotic Memory via Saliency-Driven Supervision
- **中文标题**: 工作空间模型：通过显著性驱动监督实现轻量级机器人记忆
- **研究机构**: Improbable AI Lab
- **一句话总结**: 提出在训练时用VLM提取显著历史帧特征，推理时仅用轻量级Transformer编码“工作空间Token”的机器人记忆方法，在大幅降低推理延迟的同时，比推理时调用VLM选帧的方法取得了更高的任务成功率。

**1. 整体逻辑**
- **研究任务**: 视觉模仿学习中的长时记忆机器人操作任务（如部分遮挡下的计数、空间回忆、上下文自适应）。
- **研究动机**: 直接输入全历史帧会导致策略过拟合和虚假相关；现有方法在推理时（in-the-loop）调用VLM提取关键帧或生成摘要，会引入高延迟和高成本，且VLM提取的摘要如果不全会导致任务灾难性失败。
- **本质改动**: 将推理时昂贵的VLM历史特征提取过程“摊销”（amortize）到训练时，训练一个轻量级的自回归编码器来生成紧凑的潜在记忆表示（workspace token），推理时完全脱离大模型。
- **技术溯源**: Diffusion Policy（下游动作预测）、DINOv3（视觉特征提取）、DETR（集合重建损失框架）、Qwen3-VL / MolmoPoint（训练时的VLM显著性标注）。

**2. 技术拆解**
- **核心方法**: 
  1) 训练时，用VLM（Qwen3-VL判断事件发生，MolmoPoint定位）从历史帧中选出显著图像patch集合；
  2) 训练一个带因果掩码的Transformer编码器（Workspace Encoder），输入当前及历史的图像和本体感知token，输出“workspace token”；
  3) 使用DETR风格的解码器，通过匈牙利匹配和集合重建损失，强迫workspace token重构VLM选出的显著patch集合；
  4) 推理时，冻结编码器，下游策略仅使用短历史的workspace token和本体感知来预测动作。
- **关键细节**: 
  - **输入输出**：每步输入包含DINOv3提取并池化后的图像token、MLP映射的本体感知token，以及一个可学习的padding token（其对应的输出即为workspace token）。
  - **模型结构**：Workspace Encoder为因果Transformer（2-3层，隐藏层512/768）；Decoder为交叉注意力Transformer（2层），输出 $m$ 个slot，每个slot预测一个patch特征及其是否被激活的概率。
- **训练/优化目标**: 集合重建损失（Set-reconstruction loss）。包含两部分：1) 特征重建损失（MSE，计算预测patch与真实显著patch的距离，由匈牙利算法进行二分图匹配）；2) 激活状态损失（交叉熵，预测slot是否被占用，处理显著集合大小可变的问题）。总损失为这两项沿时间步的加权和。

**3. 实验结果**
- **实验设置**: 
  - **环境与任务**：仿真环境 ManiSkill3 和真机环境（Franka FR3 机械臂）。任务包括 CubeDrop（仿真，遮挡计数）、DrawerRecall（仿真，空间回忆）、BalanceBar（仿真，上下文自适应/重心估计）和 HalfAndHalf（真机，遮挡计数）。
  - **对比对象（Baseline）**：VanillaDP（仅用当前+前一帧）、HistoryDP（全历史帧堆叠）、Keyframe（推理时用VLM选帧，类似 Mark et al. 的方法）。
- **评价指标**: 推理延迟（Latency, ms），任务成功率（Success rate, %），以及失败模式分析（记忆错误 vs 控制错误）。
- **主要结果**: 
  - **延迟大幅降低**：Wksp 推理延迟为 94.9ms（结合Batch和KV cache可降至 49.2ms），远低于 Keyframe 的 302ms，接近无记忆 VanillaDP 的 41.3ms。
  - **成功率显著反超**：Wksp 跨任务平均成功率达 91.5%，显著高于 Keyframe 的 66.8% 及其他 baseline。
  - **机制验证**：消融与分析表明，显式选帧方法（如 Keyframe）会引入“控制混叠（control aliasing）”，导致细粒度控制失败；而 Wksp 的潜在表示由于全局注意力和训练时的平滑标签处理，具有更好的平滑性和泛化能力，从而在成功率上实现了反超。

### 35. 🔥 [GeoAAC: Geometry-Based Adaptive Action Chunking from Denoising Trajectories in VLA Policies] (GeoAAC：基于VLA策略去噪轨迹几何特征的自适应动作分块)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.20776` | [点击跳转](https://arxiv.org/abs/2609.20776)

**0. 论文标题**
- **英文标题**: GeoAAC: Geometry-Based Adaptive Action Chunking from Denoising Trajectories in VLA Policies
- **中文标题**: GeoAAC：基于VLA策略去噪轨迹几何特征的自适应动作分块
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种免训练的自适应动作分块方法GeoAAC，利用Flow Matching单次去噪轨迹的几何特征来评估动作预测可靠性并动态调整动作视界，显著提升了VLA策略在仿真和真实机器人任务中的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）策略中的动作分块（Action Chunking）执行策略优化，具体是动态调整动作视界（Action Horizon）。
- **研究动机**: 现有VLA策略大多使用固定的动作视界，但在实际执行中，不同任务阶段对动作连续性和闭环反馈的需求不同（例如靠近目标需要短视界频繁纠错，平移需要长视界保持连续）。现有的自适应方法要么需要额外训练数据，要么依赖多次采样的动作熵，无法有效区分“多模态有效动作”和“预测不可靠”。
- **本质改动**: 不依赖外部多次采样或额外网络，而是直接挖掘Flow Matching单次生成过程中的“去噪轨迹几何特征”（过程级信息），用它来表征不同动作前缀的预测可靠性，从而免训练地自适应截断动作序列。
- **技术溯源**: 基于Flow Matching（流匹配）动作生成机制，应用于GR00T N1.5、$\pi_{0.5}$等基于流匹配的VLA策略。

**2. 技术拆解**
- **核心方法**: GeoAAC方法。在Flow Matching推理时，计算不同动作前缀（候选视界）对应的局部速度预测差异（几何变化），引入时间权重进行校正（因为中间去噪阶段的几何变化更可靠），构建“视界级几何剖面”。最后通过计算该剖面的相对几何增长累积分布，取中位数（0.5处）作为执行边界，并辅以基于运动幅度的下限保护。
- **关键细节**: 
  - **输入**: 当前观测，以及Flow Matching去噪过程中的中间速度预测序列。
  - **输出**: 自适应的动作视界 $k^*$（执行前 $k^*$ 个动作后重新观测并规划）。
  - **规模与超参**: 预测视界 $H$（仿真中设为16或10，真实世界设为50），去噪步数 $T$（4到10不等）。
- **训练/优化目标**: 无需额外训练（Training-free）。核心机制是利用推理时去噪轨迹的几何变化率（速度预测的差分）及其时间加权累积分布，直接通过数学统计计算执行边界。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**: LIBERO, LIBERO-Pro, RoboCasa365 仿真基准，以及真实世界双臂操作任务（酒精灯熄灭、橡胶管断开、试管拔盖）。
  - **对比对象（baseline）**: 固定动作视界（Fixed-h），多采样自适应方法（MS），自注意力自适应方法（SA）。
  - **系统环境**: 真实世界使用双臂PiperX机器人，3个RealSense相机，底层策略为基于Qwen3-VL-2B-Instruct的VLA模型。
- **评价指标**: 任务成功率（Success rates (%)）。
- **主要结果**: 
  - **LIBERO**: GR00T N1.5平均成功率达95.5%（超最佳固定基线94.7%），$\pi_{0.5}$达98.0%（超固定基线97.1%）。
  - **LIBERO-Pro**: $\pi_{0.5}$在位置扰动下平均成功率达36.2%（超固定基线5.3个百分点）。
  - **RoboCasa365**: GR00T N1.5平均成功率达75.1%（超最佳固定基线8.7个百分点）。
  - **真实世界**: 平均成功率从固定视界的53.3%大幅提升至74.4%（提升21.1个百分点），在需要精细闭环调整的阶段（如抓取、拔盖）效果尤为明显，且不同动作原语（如对齐、平移、旋转）被自动分配了符合其物理特性的动作视界。
