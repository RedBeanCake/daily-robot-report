            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [LoopWAM: Closed-Loop Generalist Policy Improvement from Deployment Rollouts] (LoopWAM：基于部署轨迹的闭环通用策略改进)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18873` | [点击跳转](https://arxiv.org/abs/2610.18873)

**0. 论文标题**
- **英文标题**: LoopWAM: Closed-Loop Generalist Policy Improvement from Deployment Rollouts
- **中文标题**: LoopWAM：基于部署轨迹的闭环通用策略改进
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种闭环世界-动作模型（LoopWAM），能直接从包含成功与失败的混合质量部署轨迹中学习，通过并行去噪和质量感知机制，实现通用机器人策略在真实部署中的持续自我改进。

**1. 整体逻辑**
- **研究任务**: 机器人通用操作策略（Generalist robot manipulation policies）的持续学习与闭环自我改进。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型缺乏对物理动态的显式学习目标，导致次优和失败轨迹只能提供行为目标，无法直接监督物理后果的学习；而现有的世界动作模型（WAM）或动作条件世界模型（ACWM）通常将两者分离，或通过共享表征间接利用失败数据，无法在单一模型中让学到的物理后果直接指导动作生成。
- **本质改动**: 将世界建模（预测未来视频）和动作生成统一在同一个双流扩散模型的并行去噪过程中，并引入“依赖数据源的噪声采样”、“质量引导”和“质量加权监督”。这使得单一模型能直接从全质量谱（成功、次优、失败）的部署轨迹中学习，且学到的物理后果能直接参与动作生成。
- **技术溯源**: 基于视频生成模型 Wan2.2-TI2V-5B（作为视频骨干网络初始化），结合了流匹配（Flow Matching）和扩散 Transformer（DiT）架构。参考了 VLA（如 π0, π0.5）和 WAM/ACWM（如 FACT, τ0-WM）的相关思路。

**2. 技术拆解**
- **核心方法**: LoopWAM（闭环世界-动作模型）。核心机制包括：
  1) **联合世界-动作建模**：视频和动作 token 在双流 Transformer 中通过双向注意力进行交互。
  2) **依赖数据源的噪声采样**：专家数据采用高视频噪声+基础动作噪声（强调恢复专家未来状态），部署数据采用低动作噪声+基础视频噪声（保留记录的动作以预测其视觉后果），从而在单一训练阶段统一行为学习和后果学习。
  3) **质量引导（Quality steering）**：将轨迹质量分数拼接到语言指令中作为条件，推理时使用专家质量分数引导生成高质量行为。
  4) **质量加权监督**：保留所有质量轨迹的视频预测监督，但根据质量分数对动作监督进行加权（失败轨迹的动作权重为0），避免模仿劣质动作。
- **关键细节**: 
  - **模型结构**：Mixture-of-Transformer (MoT) 架构，视频和动作流有独立的 token 投影、Transformer 参数和预测头，但在每一层通过联合注意力连接。
  - **输入输出**：输入为当前视觉观察、机器人状态和语言指令；输出为动作块（Action chunk，如 64 步）和对应的未来观察（如 9 帧 RGB 图像）。
  - **规模**：视频骨干为 5B 参数（Wan2.2-TI2V-5B），动作 DiT 隐藏层维度为 1024。
- **训练/优化目标**: 基于 Flow Matching 的联合去噪损失。总损失 = 世界监督损失（所有轨迹的视频预测 MSE） + 质量加权动作监督损失（根据质量分数 λ(q) 加权的动作预测 MSE）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmark**：RoboChallenge Table30-V2（真实机器人，30个桌面操作任务，4种机器人形态），RoboTwin 2.0（仿真，50个双臂操作任务），RoboCasa365（仿真，50个家庭厨房操作任务）。
  - **对比对象（Baseline）**：RoboChallenge 榜单模型（如 VLA-DM0.5）；RoboTwin 2.0 上的 π0, X-VLA, π0.5, ABot-M0, Motus, LingBot-VA, Fast-WAM, AHA-WAM, LingBot-VA 2.0；RoboCasa365 上的 Diffusion Policy, π0, π0.5, GigaWorld-Policy, GR00T N1.5/N1.6, RLDX-1, PRTS, ABot-M0.5, ABot-M0.6。
- **评价指标**: 成功率（Success Rate, SR）和综合得分（Score，针对 RoboChallenge）。
- **主要结果**: 
  - **RoboChallenge Table30-V2**：经过 3 轮部署和训练闭环，整体成功率从 23.67% 提升至 43.33%（提升 19.7 个百分点），最终得分 56.80，在对比方法中排名第一。
  - **RoboTwin 2.0**：平均成功率达到 94.5%（Clean 94.6%, Rand 94.4%），超越 LingBot-VA 2.0（93.6%）等 baseline，且无需额外的具身预训练（Embodied PT）。
  - **RoboCasa365**：整体成功率 49.5%，超越 ABot-M0.6（46.6%），同样无需额外具身预训练。
  - **单任务后训练（衬衫折叠）**：2 轮部署改进后，成功率从 13.20% 大幅提升至 55.56%，验证了该方法在单任务微调后的持续改进能力。

### 2. 🔥 [What Matters in Quality-Aware VLA Pretraining: A Benchmark and Empirical Study] (质量感知VLA预训练中什么最重要：一个基准与实证研究)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18869` | [点击跳转](https://arxiv.org/abs/2610.18869)

**0. 论文标题**
- **英文标题**: What Matters in Quality-Aware VLA Pretraining: A Benchmark and Empirical Study
- **中文标题**: 质量感知VLA预训练中什么最重要：一个基准与实证研究
- **研究机构**: 原文未提及
- **一句话总结**: 提出了 AXIS-Bench 基准，并系统实证了不同质量信号定义、标签粒度及学习策略（加权/过滤/条件化）对 VLA 模型下游任务微调性能的具体影响。

**1. 整体逻辑**
- **研究任务**: 研究在视觉-语言-动作（VLA）模型预训练中，如何有效利用自然次优人类演示的质量信息，以提升下游目标任务微调后的性能（属于机器人学习领域的基准构建与实证研究）。
- **研究动机**: 现有的质量感知预训练在如何利用质量信号（加权/过滤/条件化）、质量定义和标签粒度（chunk级或episode级）上有很多选择，但缺乏在共享数据和统一评估协议下的系统性对比证据，不清楚这些选择如何交互以及在不同基座模型上的表现。
- **本质改动**: 构建了支持重计算质量标签和重渲染的 AXIS-Bench 基准，并在三个主流 VLA 模型上严格控制变量，系统对比了质量定义、标签粒度、预训练方法和微调/推理协议的组合效果。
- **技术溯源**: 基于 VLA 模型（$\pi_{0.5}$、SmolVLA、X-VLA），数据基于 AXIS 众包仿真遥操作数据集，仿真环境基于 MuJoCo/robosuite，动作接口兼容 DROID。

**2. 技术拆解**
- **核心方法**: 
  1. **构建 AXIS-Bench**：提供带有物体和接触状态记录的仿真轨迹，支持离线重算进度奖励，并支持重渲染以对齐真实世界工作空间和相机视角。
  2. **状态衍生的质量标签**：设计两种基于进度的奖励（物体中心奖励和考虑接近过程的奖励），将其转化为 chunk 级和 episode 级质量分数，并量化为5个质量等级。
  3. **预训练策略对比**：在统一数据和时间预算下，对比损失加权（Weighting）、数据过滤（Filtering）和质量条件化（Conditioning，即在语言指令后拼接质量标签）。
- **关键细节**: 
  - **输入输出**：输入为图像（外部+腕部相机）、任务指令和本体感知状态；输出为动作（7个关节速度+1个夹爪命令，15Hz）。
  - **数据规模**：仿真预训练使用 5,000 条演示（约35.3小时），包含24个目标任务和354条微调演示。真实世界实验使用 19,250 条演示。
  - **模型结构**：$\pi_{0.5}$（全参数微调/LoRA）、SmolVLA（冻结VLM，训练动作专家）、X-VLA（全参数，VLM学习率降低至十分之一）。
- **训练/优化目标**: 行为克隆（Behavioral Cloning）损失，具体为动作块的流匹配（flow-matching）损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：AXIS-Bench（基于 AXIS 仿真数据集）。
  - **对比对象（Baseline）**：Plain BC（普通行为克隆）、FT-only（仅微调无预训练）。
  - **测试环境**：仿真环境评估24个桌面任务；真实世界环境（Franka FR3 机械臂）评估10个操作任务。
- **评价指标**: 目标任务的平均成功率（Mean task success rate）。
- **主要结果**: 
  1. **条件化方法最优**：考虑接近过程的 episode 级条件化（Approach-aware episode conditioning）在三个 VLA 上均稳定提升了平均成功率（相比 plain BC）。
  2. **粒度与方法存在交互**：Conditioning 平均更偏好 episode 标签，Filtering 平均更偏好 chunk 标签，但存在依赖具体模型和奖励定义的反转现象。
  3. **微调协议的影响**：在条件化预训练后，使用恒定质量标签进行微调（constant-tag FT）比 plain FT 能获得更高的平均成功率，无论推理时是否保留标签。
  4. **真实世界验证**：使用 19,250 条仿真数据进行预训练，将 $\pi_{0.5}$ 模型的真实世界任务成功率从 9.6% 提升至 31.7%。

### 3. 🔥 [WorldOracle: Benchmarking Action-Conditioned World Models against Real-World Executions] (WorldOracle：针对真实世界执行对动作条件世界模型进行基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18826` | [点击跳转](https://arxiv.org/abs/2610.18826)

领域与类型判断：本文属于具身智能/机器人学习领域，类型为基准测试（Benchmark）/数据集。

**0. 论文标题**
- **英文标题**: WorldOracle: Benchmarking Action-Conditioned World Models against Real-World Executions
- **中文标题**: WorldOracle：针对真实世界执行对动作条件世界模型进行基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能领域的基准测试工作，核心贡献是提出了WorldOracle，通过对比真实物理执行结果，从物理状态、空间对齐、局部保真度和多视角一致性四个维度，严格评估动作条件世界模型（ACWM）的执行连贯性。

**1. 整体逻辑**
- **研究任务**: 构建一个基准测试（Benchmark），评估动作条件世界模型（ACWM）在给定初始观察和底层动作序列时，其生成的视频是否真实反映了物理世界的执行结果（即执行连贯性）。
- **研究动机**: 现有的视频生成模型或世界模型虽然视觉逼真，但容易产生“幻觉”（如真实抓取失败却预测成功）。现有的具身世界模型基准要么只评估视觉质量，要么依赖仿真环境，缺乏在真实物理执行层面、针对底层动作轨迹的严格对齐评估，尤其是缺乏对长时程、包含失败动作以及跨具身形态的评估。
- **本质改动**: 摒弃依赖仿真器或高层任务指令的传统评估方式，直接收集真实世界中“相同初始状态+相同底层动作序列”的真实执行视频作为Ground Truth，设计了因果服从、分布迁移和时间耐力三个压力测试维度，并配套四个具体指标来衡量预测视频与真实物理执行的连贯性。
- **技术溯源**: 评估了7个现有的ACWM（IRASim, Ctrl-World, DreamDojo, Cosmos 3, GE-Sim 2.0, JointControlVideo, OSCAR）。在评估流水线中，使用了视觉语言模型（VLM）进行物理状态判断，使用SAM3进行交互区域掩码提取，使用DINOv3进行特征匹配。

**2. 技术拆解**
- **核心方法**: 构建了WorldOracle基准，包含数据收集、标注流水线和评估指标体系。数据分为训练集和评估集，涵盖多种具身形态（AgiBot G2, YAM, 人手）和动作来源（人类操作、策略闭环执行）。评估指标包括：物理状态正确性、交互空间对齐、关键交互区域保真度和多视角动作连贯性。
- **关键细节**: 
  - 数据集规模：评估集共335个episode（AgiBot G2人类操作100个、策略执行60个；YAM 75个；人手100个）。训练集包含新收集的1779个AgiBot G2 episode和公开的ABC-130K数据集。
  - 任务设计：4个任务（pick fruit, hang towel, pour water, pull drawer），涵盖刚体、柔性体、流体和关节物体交互。每个episode包含多个交互片段，同时包含成功和失败的动作。
  - 标注流水线：人工标注交互片段边界和结果关键帧；VLM生成物理状态判断标准；SAM3提取操作对象和机械臂/人手的帧级掩码。
  - 评估指标计算：物理状态正确性由VLM对结果关键帧进行二分类判断；交互空间对齐基于DINOv3特征在掩码区域内匹配计算位移和置信度；关键交互区域保真度在掩码区域内计算PSNR、LPIPS和V-JEPA相似度的几何平均；多视角动作连贯性在多个同步视角下独立计算空间对齐后聚合。
- **训练/优化目标**: 本文为基准测试工作，不涉及自身模型的训练。被评估的ACWM模型使用各自的原始训练配置，在提供的训练集上进行微调适配（如AgiBot用专属训练集，YAM用ABC-130K，人手模型进行zero-shot评估）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：WorldOracle评估套件（包含AgiBot G2, YAM, Human hand的人类操作分布，以及AgiBot G2的策略执行分布）。
  - 对比对象（baseline）：7个代表性ACWM模型（IRASim, Ctrl-World, DreamDojo, Cosmos 3, GE-Sim 2.0, JointControlVideo, OSCAR）。
  - 测试环境：在8张NVIDIA H100 GPU上进行模型适配和推理评估。
- **评价指标**: 
  - 物理状态正确性（Physical Correctness）、交互空间对齐（Spatial Alignment）、关键区域保真度（Key Area Fidelity）、多视角连贯性（Multi-View Coherence）。
  - 综合指标：WorldOracle-SV（单视角前三者平均）和 WorldOracle-MV（多视角四者平均），分数范围[0, 100]。
  - 时间维度：短时长（前30秒）和长时长（完整episode）。
- **主要结果**: 
  - 整体表现：GE-Sim 2.0在AgiBot G2和YAM上表现最好（得益于像素对齐的动作条件机制），但在长时程预测中所有模型性能均显著下降。
  - 失败模式发现：1) 视觉逼真的预测仍会错误表征物体动力学和交互结果；2) 强空间对齐不保证正确的物理结果（如GE-Sim 2.0空间对齐得分高，但物理正确性和局部保真度较低）；3) 短视距性能好不代表长时程可靠（如DreamDojo和Cosmos 3在30秒内表现好，但长episode得分骤降）；4) 物体动力学比机械臂运动更难建模（所有模型在物体掩码上的得分远低于机械臂掩码）。
  - 指标有效性验证：通过人类研究和控制变量分析，证明四个指标与人类判断高度一致（Spearman相关系数0.72-0.82），且各自能敏感捕捉特定的失败模式（如物理状态正确性对结果替换敏感，多视角连贯性对视角延迟敏感）。

### 4. 🔥 [GreenWAM: A World Foundation Model for Robotics] (GreenWAM：面向机器人的世界基础模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18774` | [点击跳转](https://arxiv.org/abs/2610.18774)

**0. 论文标题**
- **英文标题**: GreenWAM: A World Foundation Model for Robotics
- **中文标题**: GreenWAM：面向机器人的世界基础模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 GreenWAM，通过统一多机器人的动作空间并解耦“动作专家”，让单一世界基础模型同时胜任跨本体的场景预测（世界模型）和动作生成（策略）任务。

**1. 整体逻辑**
- **研究任务**: 构建跨机器人本体的统一世界基础模型，使其既能预测动作如何改变场景（世界模型），又能直接选择控制动作（策略）。
- **研究动机**: 现有模型通常只针对“世界预测”或“动作策略”单一角色构建和评估，且不同机器人记录动作的格式各异，缺乏通用的统一框架。
- **本质改动**: 设计共享解剖学动作空间来统一多机器人的动作表示，并在生成模型中分离出独立的“动作专家”分支，从而让单一模型兼顾世界预测与策略控制。
- **技术溯源**: 原文未提及具体基座模型架构（仅提及与 $\pi_{0.5}$ 和 Cosmos 3 Edge 等模型进行对比）。

**2. 技术拆解**
- **核心方法**: 
  1. 共享解剖学动作空间：用统一的关节坐标表示 20 个机器人家族（涵盖双臂到灵巧人形）的动作。
  2. 多模式联合训练：在视觉、动作条件和世界-动作三种模式下对多机器人数据进行联合训练。
  3. 动作专家分离：在模型架构中拆分出独立的动作专家模块来专门输出策略。
- **关键细节**: 覆盖 20 个机器人家族；支持蒸馏为单步策略以实现实时控制；包含视觉、动作条件、世界-动作三种训练模式。
- **训练/优化目标**: 在视觉、动作条件和世界-动作模式下进行联合训练（具体损失函数原文未提及）。

**3. 实验结果**
- **实验设置**: 
  - 评测数据集/环境：WorldArena 1.0、RoboTwin 2.0、LIBERO-plus、CALVIN、LIBERO，以及真实人形机器人环境。
  - 对比对象（baseline）：其他世界-动作模型、视频生成器、专用 VLA（视觉-语言-动作）策略、世界-动作策略、$\pi_{0.5}$ 和 Cosmos 3 Edge。
- **评价指标**: 世界模型评估轨迹、深度和 3D 精度；策略评估任务成功率（如零样本成功率）。
- **主要结果**: 
  1. 世界模型能力：在 WorldArena 1.0 上取得顶级的轨迹、深度和 3D 精度，超越所有对比的世界-动作模型和视频生成器。
  2. 策略能力：在 RoboTwin 2.0 排行榜名列前茅；在 LIBERO-plus 取得最高零样本成功率；在 CALVIN 和 LIBERO 上与专用 VLA 和世界-动作策略表现相当。
  3. 真机部署：在真实人形机器人上的成功率高于基于 $\pi_{0.5}$ 和 Cosmos 3 Edge 微调的策略。
  4. 控制实验结论：机器人特化（针对特定机器人数据训练）能同时提升世界预测和控制能力；在微调初期分离出动作专家能带来正向收益；在策略微调阶段保留世界模型的训练模式，能维持模型对场景变化的鲁棒性。

### 5. 🔥 [UniW(A)M: A Unified Mixture-of-Experts Framework for World and World-Action Models] (UniW(A)M：一个用于世界模型与世界-动作模型的统一混合专家框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18697` | [点击跳转](https://arxiv.org/abs/2610.18697)

**0. 论文标题**
- **英文标题**: UniW(A)M: A Unified Mixture-of-Experts Framework for World and World-Action Models
- **中文标题**: UniW(A)M：一个用于世界模型与世界-动作模型的统一混合专家框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出基于扩散Transformer的MoE框架UniW(A)M，通过视频-动作掩码和专家路由统一了动作条件世界建模与多种世界-动作模型接口，并结合自适应接口路由器（PAIR）在真实机器人任务中实现了高泛化与高效率的统一部署。

**1. 整体逻辑**
- **研究任务**: 具身智能中未来世界预测（World Modeling）与可执行动作生成（Action Generation）的统一建模与部署。
- **研究动机**: 现有的世界模型（WMs）和世界-动作模型（WAMs）通常孤立训练，限制了物理动力学知识在预测和控制间的复用；现有统一框架在联合训练时，难以在复用共享动力学的同时，保留不同WAM范式所需的特定条件依赖路径。
- **本质改动**: 将AC-WM和四种WAM变体统一在同一个扩散Transformer中，利用视频-动作可见性掩码（visibility masks）显式解耦各接口的条件依赖，并引入能力对齐的Token路由（CATR）和即插即用的自适应接口路由器（PAIR）实现联合训练与动态推理。
- **技术溯源**: 基于预训练的扩散Transformer（如Wan2.1 / Wan2.2系列视频生成模型）以及Flow Matching（流匹配）生成范式。

**2. 技术拆解**
- **核心方法**: 
  1. **统一掩码建模**：将5种范式（AC-WM及4种WAM）定义为不同的视频-动作可见性掩码，显式控制未来视频与动作Token间的注意力依赖。
  2. **MoE与CATR路由**：将Dense FFN替换为包含1个共享专家和4个原子能力专家（VGM/VLA/WM/IDM）的MoE层。CATR根据Token的模态和预测角色，将其分配给合格的专家集并学习组级混合权重。
  3. **PAIR自适应部署**：推理时冻结主干，训练一个轻量级分类头（PAIR），基于当前上下文为每个执行chunk动态选择最合适的WAM接口。
- **关键细节**: 
  - **输入输出**：输入历史观测、语言指令、机器人状态；输出未来视频latent和动作序列。
  - **模型结构**：扩散Transformer主干，MoE层包含5个FFN专家。
  - **规模**：主干参数量约16.2B - 16.4B（基于Wan2.1/2.2初始化）。
  - **关键超参**：扩散去噪步数配置为16步，Classifier-Free Guidance (CFG) scale在联合/IDM接口视频阶段为5，快接口为1。
- **训练/优化目标**: 
  - **主干训练**：基于Flow Matching的均方误差损失。5种接口按1:1:1:1:1均匀采样优化；Action-centric/only接口的动作损失权重放大5倍。
  - **PAIR训练**：基于各接口预测动作与Ground Truth的MAE归一化误差，构建软标签或偏好快接口的硬标签，使用交叉熵损失训练分类头。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：仿真使用LIBERO和RoboTwin 2.0；真实世界使用折衣服、折盒子、桌面清理3个任务；视频预测评估使用WorldArena。Baseline包括$\pi_{0.5}$, DreamZero, WorldScape Policy 2.0, Cosmos-Predict 2.5, CtrlWorld等。
- **评价指标**: 
  - **动作生成**：任务成功率（Success Rate）。
  - **世界预测**：WorldArena的EWM Score-P（综合JEPA相似度、运动平滑度等）。
  - **部署效率**：推理延迟与成功率的Pareto前沿。
- **主要结果**: 
  - **真实世界任务**：IDM-WAM接口达到88.3%的平均成功率，比最强baseline（WorldScape Policy 2.0的76.7%）提升约11.7个百分点。
  - **世界预测**：在WorldArena的所有3个真实世界任务中，EWM Score-P均取得第一。
  - **OOD与效率**：PAIR将OOD平均成功率从单接口的63.3%提升至76.7%；通过动态切换快/慢接口，在Reach阶段选快接口，Contact/Core阶段选具备视觉前瞻的慢接口，实现了成功率与推理延迟的最佳Pareto权衡。
  - **消融实验**：AC-WM的联合训练显著提升了所有WAM接口的动作生成能力；CATR相比sample-level routing解决了Action-Centric/Only接口性能崩溃的问题（从10%提升至80%以上）。

### 6. 🔥 [Grid or Nodes? Probing Object Memory in World Models Under Partial Observability] (网格还是节点？探究部分可观测下世界模型中的物体记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18637` | [点击跳转](https://arxiv.org/abs/2610.18637)

**0. 论文标题**
- **英文标题**: Grid or Nodes? Probing Object Memory in World Models Under Partial Observability
- **中文标题**: 网格还是节点？探究部分可观测下世界模型中的物体记忆
- **研究机构**: 原文未提及
- **一句话总结**: 本文对比了世界模型中“基于网格的隐式特征记忆”与“基于节点的显式状态记忆”在物体离开视野后的追踪能力，揭示了网格记忆高度依赖探针设计且难以泛化到未见运动模式，而显式节点记忆在内存占用和泛化性上更具优势。

**1. 整体逻辑**
- **研究任务**: 评估机器人世界模型在部分可观测环境（物体离开相机视野）下，对移动物体的记忆与位置预测能力。
- **研究动机**: 现有的视频世界模型（如FloWM）使用空间网格存储特征，将运动先验硬编码在内存布局中。这种隐式记忆的位置信息需要复杂的探针网络才能读取，且评估结果受探针设计影响极大；同时，当物体运动模式超出模型预设的内置速度时，其记忆能力会严重退化。
- **本质改动**: 引入一个基于节点的显式记忆系统（带Oracle输入的卡尔曼滤波追踪器）作为Baseline，与FloWM的网格记忆进行严格对比，并系统性地剖析了探针机制、运动先验限制以及长时遮挡对两种记忆架构的实际影响。
- **技术溯源**: FloWM（网格记忆基线）、Kalman filter / SORT（节点追踪器基线）、Dynamic Block World / Miniworld（仿真环境）。

**2. 技术拆解**
- **核心方法**: 
  1. 网格记忆（FloWM）：维护以智能体为中心的33x33特征网格，包含5个速度副本（静止及四向移动）。通过Move、Mix、Render和Write（含预测阶段的write-back）操作更新，位置信息隐式存储在特征中。
  2. 节点记忆（Tracker）：每个物体分配一个节点，显式存储位置、速度（数值形式）和不确定性。使用卡尔曼滤波进行状态预测与更新，采用SORT风格的数据关联，并引入“速度吸附（speed snapping）”机制来抑制噪声带来的速度估计误差。
  3. 探针评估（Probes）：设计了单细胞线性探针（仅读取当前网格特征）和全网格卷积探针（结合邻域特征），用于从冻结的网格记忆中解码物体位置。
- **关键细节**: 
  - 环境：Dynamic Block World，包含6个颜色不同的滑块，70步上下文观测+70步纯动作预测。
  - 规模与开销：FloWM网格状态约5.6MB（模型12.8M参数）；Tracker节点状态仅14KB。探针方面，卷积探针达7.06M参数（超过FloWM自身一半），单细胞探针仅1282参数。
  - 输入差异：FloWM从像素端到端学习；Tracker使用Oracle提供的真实mask、带1像素噪声的位置和真实墙壁信息。
  - 运动设置：Standard setting（每步1格，沿坐标轴）和 Varied setting（包含对角线1格/步，以及速度2格/步）。
- **训练/优化目标**: 
  - FloWM：端到端训练，使用MSE损失预测相机帧。
  - Tracker：无神经网络训练（纯规则+卡尔曼滤波），速度吸附的允许速度参数在训练集上无监督拟合。
  - 探针：在冻结的记忆状态上训练，预测物体所在的具体网格单元（分类任务）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：Dynamic Block World（包含Standard和Varied两种运动设置）。
  - 对比对象：FloWM（配合单细胞探针和卷积探针） vs Tracker（卡尔曼滤波追踪器）。
- **评价指标**: 位置预测准确率（Accuracy %），即预测的网格单元是否恰好是物体中心所在的真实单元。区分视野内（In view）和视野外（Out of view）进行统计。
- **主要结果**: 
  1. 探针决定评分：在Standard设置下，单细胞探针视野外准确率仅66%，而卷积探针达89%，证明网格本身并未完好保存位置，是卷积探针“计算”出了位置。Tracker视野外准确率达91%，与卷积探针相当，但状态开销仅为FloWM的1/400（14KB vs 5.6MB）。
  2. 视野内评分虚高：FloWM视野内准确率比视野外高8分，原因是其“write-back”机制（将渲染的预测帧写回内存），而非记忆本身的提升。
  3. 泛化能力差：在Varied设置下，当物体运动超出FloWM的5种内置速度时，其准确率暴跌至4%-13%（即使微调也仅提升至13%）。而Tracker只需将允许速度重新拟合为0,1,2，即可在对角线和速度2下保持94%的准确率。若要用网格覆盖Varied设置的所有速度，需要25个网格副本。
  4. 长时遮挡表现：Tracker在10-19步遮挡时领先FloWM 6分，但在100步以上长时遮挡落后10分。原因是Tracker对仅观测到1次的物体无法推断速度，且容易受后续错误匹配干扰；而FloWM似乎能从单次观测中隐式推断出运动方向。

### 7. 🔥 [WAVE-0: Bridging VLA Policies and WAMs with Lightweight Latent Future Prediction] (WAVE-0：通过轻量级潜在未来预测桥接VLA策略与WAM)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18568` | [点击跳转](https://arxiv.org/abs/2610.18568)

**0. 论文标题**
- **英文标题**: WAVE-0: Bridging VLA Policies and WAMs with Lightweight Latent Future Prediction
- **中文标题**: WAVE-0：通过轻量级潜在未来预测桥接VLA策略与WAM
- **研究机构**: 原文未提及
- **一句话总结**: 提出WAVE-0框架，通过引入轻量级潜在世界模型，让VLA在输出动作前先“预判”未来状态并以此指导决策，在不依赖昂贵视频生成或大规模视频预训练的情况下，大幅提升了机器人操作的成功率和泛化能力。

**1. 整体逻辑**
- **研究任务**: 通用机器人操作（generalist robotic manipulation）。
- **研究动机**: 现有的VLA模型做动作决策时缺乏对环境后果的显式建模（即不会“预判”）。而现有的世界动作模型（WAMs）要么依赖昂贵的视频生成来做预测；要么仅把潜在未来预测当作辅助任务，或者需要烧大量数据做大规模视频预训练，才能从次优的视觉过渡中推断出潜在动作。
- **本质改动**: 引入一个轻量级的潜在世界模型，直接把VLA的语义理解和显式的未来预测打通。让模型在生成动作前，先预测动作执行后的未来潜在状态，并用这个预测结果来条件化（condition）动作生成，从而把“预判”直接用在动作决策上，且避开了像素级重建和大规模视频预训练。
- **技术溯源**: 基于预训练的VLA（Vision-Language-Action）模型（原文未提及具体基座名称，仅提及预训练VLA及真实世界任务中的基线 $\pi_{0.5}$）。

**2. 技术拆解**
- **核心方法**: WAVE-0（World-model-Augmented VLA Execution）框架。通过一个轻量级潜在世界模型连接VLA和WAM，将潜在规划、未来预测和动作生成统一在一个流程中。
- **关键细节**: 世界模型参数量为257M。输入为VLM生成的潜在动作计划，输出为预测的未来状态表示（predicted future representations），该表示作为条件输入给动作专家（action expert）以指导最终的动作生成。
- **训练/优化目标**: 采用反事实排序目标（counterfactual ranking objective），直接在真实机器人动作（ground-truth robot actions）上进行训练，无需像素级重建（pixel reconstruction）或大规模视频预训练。

**3. 实验结果**
- **实验设置**: 仿真测试环境包括 RoboTwin 2.0、LIBERO 及其变体（LIBERO-Plus, LIBERO-Pro, LIBERO-Para），以及真实世界任务。仿真部分原文未提及具体对比基线，真实世界任务的对比基线为 $\pi_{0.5}$。
- **评价指标**: 任务成功率（success rates）。
- **主要结果**: 在 RoboTwin 2.0 上成功率达 91.47%，LIBERO 上达 98.7%；在 LIBERO-Plus、LIBERO-Pro 和 LIBERO-Para 上分别为 88.0%、61.4% 和 75.0%。在真实世界任务中，将基线 $\pi_{0.5}$ 的成功率从 38.3% 提升至 73.3%，证明了其在多种分布偏移下具备强操作性能与泛化能力。

### 8. 🔥 [Cross-Embodiment Affordance Transfer for Robotic Manipulation] (机器人操作中的跨具身可供性迁移)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18194` | [点击跳转](https://arxiv.org/abs/2610.18194)

**0. 论文标题**
- **英文标题**: Cross-Embodiment Affordance Transfer for Robotic Manipulation
- **中文标题**: 机器人操作中的跨具身可供性迁移
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合机器人物理约束与3D点云的可供性预测框架，通过仿真执行结果修正人类标注，解决了人类可供性数据向不同物理形态机器人迁移时因硬件限制导致的不可执行问题。

**1. 整体逻辑**
- **研究任务**: 预测物体表面哪些区域对特定物理形态的机器人是真正可执行（如可抓取、可环抱抓取）的可供性（affordance）区域。
- **研究动机**: 现有可供性数据集（如UMD）基于人类视角标注，但人类手能操作的区域，受限于夹爪开口、臂长、关节限位等物理约束的机器人未必能操作（即 human-to-robot affordance gap）。直接迁移人类标注会导致机器人规划出物理上不可行的动作。
- **本质改动**: 将可供性预测从“仅依赖物体几何”转变为“物体几何与机器人物理属性联合推理”，通过引入具身描述符（embodiment descriptor）并在网络中逐层调制特征，使模型能感知并适应不同机器人的物理限制。
- **技术溯源**: PointNet++ (3D点云特征提取), FiLM (特征调制), PyBullet (物理仿真), UMD Part Affordance Dataset (人类标注数据), YCB dataset (评估数据)。

**2. 技术拆解**
- **核心方法**: 提出具身条件化的可供性学习框架（Embodiment-conditioned affordance learning framework）。1) 构建具身描述符编码机器人物理属性；2) 在仿真环境中通过机械臂实际采样抓取，根据执行成功与否将人类标注中不可执行的区域重新标记为背景，生成具身条件化标签；3) 设计基于PointNet++和FiLM的分段特征调制网络，将具身描述符注入点云特征提取的各个阶段。
- **关键细节**: 
    - 输入：2048个点的物体3D点云 + 21维具身描述符（4维工作空间 + 5维末端几何 + 12维关节限位）。
    - 网络：PointNet++ (MSG) 作为编码器，包含3个SA阶段和3个FP阶段。在每个SA阶段后接FiLM模块，将描述符映射为scale和shift参数对特征进行仿射调制。最后接1D卷积分类头输出3类（grasp, wrap-grasp, background）。
    - 数据生成：在PyBullet中用UR5e+Robotiq夹爪，对UMD标注的候选点进行5次approach尝试。根据IK解、碰撞、稳定抓取等结果判定pass/partial/mismatch/miss。只要有1次pass则保留原标签，否则标为background。
- **训练/优化目标**: 使用加权交叉熵损失函数（Weighted Cross-Entropy）处理背景与可供性点的类别不平衡问题。权重计算基于各类别点数量的反比立方根（$w_k = (\max(N_j)/N_k)^{1/3}$）。

**3. 实验结果**
- **实验设置**: 
    - 数据集：训练使用 UMD Part Affordance Dataset 结合 PyBullet 仿真生成的执行结果；评估使用 YCB dataset。
    - 硬件/环境：PyBullet仿真，UR5e机械臂搭配 Robotiq 2F-85 和 2F-140 两种平行夹爪。
    - Baseline：no-embodiment baseline（不输入具身描述符的消融模型）。
- **评价指标**: 逐点预测的 Precision, Recall, F1-score, IoU，以及宏平均 mIoU。
- **主要结果**: 
    - 具身条件化模型比 no-embodiment baseline 的 mIoU 提升了 1.18 个百分点，证明了显式建模机器人物理约束的必要性。
    - 跨具身迁移实验揭示了不对称性：从大开口夹爪（2F-140）迁移到小开口（2F-85）效果较好，反之则 wrap-grasp 的 IoU 暴跌（从 63.26% 降至 26.63%），因为小开口夹爪在训练时无法提供大物体环抱抓取的监督信号。
    - 定性结果表明，模型在训练未见过的物体类别上也能正确预测符合当前夹爪物理限制的可供性区域。

### 9. 🔥 [SkipWorld: Latent Skip Planning with Distilled World Models for Efficient Visual Navigation] (SkipWorld：用于高效视觉导航的基于蒸馏世界模型的潜在跳跃规划)
- **研究机构**: `The Chinese University of Hong Kong (香港中文大学)`
- **Arxiv ID**: `2610.18135` | [点击跳转](https://arxiv.org/abs/2610.18135)

**0. 论文标题**
- **英文标题**: SkipWorld: Latent Skip Planning with Distilled World Models for Efficient Visual Navigation
- **中文标题**: SkipWorld：用于高效视觉导航的基于蒸馏世界模型的潜在跳跃规划
- **研究机构**: The Chinese University of Hong Kong (香港中文大学)
- **一句话总结**: 提出 SkipWorld 框架，通过在隐空间进行闭环训练和跳跃蒸馏，结合“先粗筛后精排”的规划策略，大幅降低了基于世界模型的视觉导航长视界规划的计算成本，同时提升了轨迹预测精度。

**1. 整体逻辑**
- **研究任务**: 基于世界模型的视觉导航（Visual navigation with world models），即通过预测候选动作轨迹下的未来视觉状态，评估并选择最优动作序列。
- **研究动机**: 现有视觉世界模型在长视界规划中面临两个痛点：1) 训练时依赖真实历史帧，而推理时是闭环预测，导致误差随步数累积（train-test mismatch）；2) 评估大量候选轨迹需要逐步自回归预测，计算成本随视界长度和候选数量急剧增长。
- **本质改动**: 将状态预测和规划转移到隐空间（latent space），并通过知识蒸馏将逐步预测的教师模型压缩为跳跃预测的学生模型，在推理时采用“先跳跃粗筛，后逐步精排”的机制来打破精度与速度的权衡瓶颈。
- **技术溯源**: 基于 Navigation World Models (NWM)、预训练 VAE 编码器（如 Stable Diffusion 的 VAE）、条件扩散 Transformer (conditional diffusion transformer)。

**2. 技术拆解**
- **核心方法**: 
  1. Latent AutoRoll：在隐空间进行闭环自回归训练。训练时把模型自己预测的隐状态作为下一步的输入，强制模型适应推理时的闭环分布，消除误差累积。
  2. SkipDistill：将上述自回归教师模型蒸馏为跳跃学生模型。学生模型接收累积动作和时间间隔，直接预测多步之后的隐状态端点，跳过中间步骤。
  3. Skip-then-Refine Planning：推理时采用粗到细的规划。先用跳跃学生模型以大步长快速评估所有候选轨迹并筛选出 Top-P，再用自回归教师模型对保留的轨迹进行多步精细评估和重排。
- **关键细节**: 
  - 输入输出：输入 RGB 帧上下文和 goal image，通过预训练 VAE 编码为隐状态 token；输出最终预测的隐状态，解码后与 goal image 计算 LPIPS 距离作为规划代价。
  - 模型结构：基于条件扩散 Transformer 的隐空间世界模型。
  - 关键超参：预测视界 H=8 帧（2秒，4 FPS）；采样候选数 N=120；粗筛保留数 P=20；跳跃步长 s=8；教师模型重复评估次数 R=3。
- **训练/优化目标**: 
  - Latent AutoRoll：扩散去噪损失（diffusion denoising objective），在闭环隐状态上下文中预测未来真实隐状态。
  - SkipDistill：SmoothL1 损失，让学生模型预测的端点隐状态与冻结教师模型多步自回归预测的端点隐状态对齐（Teacher endpoint distillation）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RECON, HuRoN, SCAND, TartanDrive（涵盖室内、以人为中心、越野、社交导航等场景）。
  - 对比对象（baseline）：GNM, NoMaD, NWM (original & pretrained), CompACT, RAE-NWM。
- **评价指标**: 绝对轨迹误差 (ATE) 和 相对位姿误差 (RPE)（越低越好）；每次查询的平均规划时间（秒）。
- **主要结果**: 
  - 相比 NWM (pretrained)，SkipWorld 平均 ATE 降低 4.2%，RPE 降低 2.7%。
  - 规划时间从 2220.5 秒降至 834.5 秒（减少 62.4%），实现 2.7 倍加速。
  - 消融实验表明：Latent AutoRoll 提升了精度但耗时，SkipDistill 大幅降低了耗时，两者结合（SkipWorld）在保持精度的同时实现了最佳的效率。跳跃步长 s=8 和保留候选数 P=20 是兼顾精度与速度的最优配置。

### 10. 🔥 [Data-Free Continual Learning for World Action Model with Rectified Generative Replay] (基于修正生成回放的无数据世界动作模型持续学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18038` | [点击跳转](https://arxiv.org/abs/2610.18038)

**0. 论文标题**
- **英文标题**: Data-Free Continual Learning for World Action Model with Rectified Generative Replay
- **中文标题**: 基于修正生成回放的无数据世界动作模型持续学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 R2-WAM，仅凭任务指令让 WAM 重新生成旧任务轨迹并进行物理与逻辑修正，在完全不保留旧任务数据的情况下，实现了媲美经验回放的持续学习效果。

**1. 整体逻辑**
- **研究任务**: 机器人策略的持续学习（Continual Learning），具体解决基于预训练视频生成模型的世界动作模型（WAMs）在顺序微调学习新任务时的灾难性遗忘问题。
- **研究动机**: 现有的经验回放（ER）方法需要保留旧任务的真实演示数据，但在实际部署中，机器人策略往往只交付模型权重，旧任务数据不可用。因此需要一种“无数据（data-free）”的持续学习方案。
- **本质改动**: 不存储旧任务的真实数据，而是让 WAM 仅根据任务指令自回归地重新生成（regenerate）旧任务的完整轨迹，并通过“感知完成的自适应截断”和“基于光流的物理一致性过滤”对生成轨迹进行修正（rectify），再用于回放训练。
- **技术溯源**: 基座模型采用 LingBot-VA（基于 Wan 系列视频扩散 Transformer）；使用 VLM（如 GPT-5.6 Terra）作为任务完成评估器；使用 Track4World 进行密集 3D 光流估计；使用 MuJoCo 进行无环境的纯机器人物理仿真。

**2. 技术拆解**
- **核心方法**: 修正生成回放（Rectified Generative Replay）。包含两个核心修正机制：1) 感知完成的自适应截断（Completion-aware adaptive truncation）；2) 基于光流的物理一致性过滤（Flow-based physical-consistency filtering）。
- **关键细节**: 
  - **输入输出**：输入仅为旧任务的语言指令，输出为修正后的视觉观测和机器人动作轨迹（rollouts）。
  - **模型结构/规模**：基座 LingBot-VA 包含 5.1B 参数的 DiT（结合动作分支），采用因果自回归架构交错预测观测和动作 token。
  - **截断细节**：由于 WAM 无法识别任务完成，会生成无意义的后续动作。方法使用 VLM 作为评估器，输入任务指令、一个带有人工标注截断范围的上下文示例，以及候选轨迹后段的抽帧（附带步数、夹爪命令、末端速度等），精准定位任务完成点并截断。
  - **过滤细节**：开环生成会导致动作和观测漂移。方法在仅有机器人 URDF 的仿真器中执行生成的动作得到仿真光流，同时用 Track4World 从生成的观测视频中估计光流。计算两者在 2D 图像空间和 3D 相机空间的差异作为物理一致性得分，保留得分最高（最一致）的 Top-N 轨迹。
- **训练/优化目标**: 优化目标与标准行为克隆（Behavior Cloning）一致，即最大化给定历史观测和指令下，未来观测和动作联合条件分布的对数似然。训练时，将修正后的生成回放数据与新任务的真实演示数据按相等权重混合进行微调。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 LIBERO 的 4 个 suite（Spatial, Object, Goal, 10，每个 suite 包含 10 个任务）；真实世界使用 5 个顺序学习的做三明治任务（7-DoF 机械臂 + 20-DoF 灵巧手）。
  - **对比对象（baseline）**：无回放类（Seq-FT, Seq-LoRA, EWC, LwF）；有回放类（ER 经验回放作为使用真实数据的上限，R-WAM 无修正的生成回放）。
- **评价指标**: 持续学习标准指标：SR（最终平均成功率/进度率）、NBT（负向后向转移，衡量遗忘程度，越低越好）、Plasticity（可塑性，衡量学习新任务的能力）。
- **主要结果**: 
  - 在 LIBERO 上，R2-WAM 平均 SR 达到 92.7%，NBT 为 2.33。相比 Seq-FT 减少了 90% 以上的遗忘，且仅比使用真实数据的 ER（上限，SR 94.6%）低 1.9 个百分点。
  - 在真实世界 5 个任务中，R2-WAM 的 SR 为 89.5%，NBT 为 3.45，同样几乎达到了 ER（SR 91.8%）的水平，远优于 Seq-FT（SR 28.5%）。
  - 消融实验证明截断和过滤两者缺一不可；诊断分析表明，WAM 的遗忘主要集中在逆动力学建模（动作预测），而视频预测（观测生成）能力大部分保留，这解释了为何 WAM 能重新生成过去任务的合理观测，也指明了需要验证动作一致性的根本原因。

### 11. 🔥 [ReEnvision: Future-Guided Selective Action Repair for Long-Horizon Manipulation] (ReEnvision：面向长视界操作的未来引导选择性动作修复)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17977` | [点击跳转](https://arxiv.org/abs/2610.17977)

**0. 论文标题**
- **英文标题**: ReEnvision: Future-Guided Selective Action Repair for Long-Horizon Manipulation
- **中文标题**: ReEnvision：面向长视界操作的未来引导选择性动作修复
- **研究机构**: 原文未提及
- **一句话总结**: 提出ReEnvision框架，通过构建“联合未来-动作信念”并使用时序影响模型预测偏差对缓存动作块的具体影响，在长视界机器人操作中实现动作的选择性局部修复，避免了全局重规划带来的误差累积。

**1. 整体逻辑**
- **研究任务**: 长视界机器人操作（Long-horizon robotic manipulation）中的执行偏差纠正与动作序列修复。
- **研究动机**: 现有方法在处理动作块（action chunk）执行偏差时存在明显缺陷。全局重规划会破坏原本没问题的动作（尤其在分布外偏差下容易放大误差）；逐步纠正反应太慢，无法预见偏差对后续动作的影响。核心痛点在于：现有方法没有显式评估“当前的执行偏差到底影响了缓存动作块里的哪几个未执行动作”。
- **本质改动**: 引入“联合未来-动作信念（joint future-action belief）”机制，利用执行反馈更新信念后，通过一个轻量级时序卷积网络（TCN）预测信念变化对缓存动作块中每个动作的具体影响，从而实现“只修该修的，保留没问题的”选择性修复（selective repair）。
- **技术溯源**: 基于 Stable Video Diffusion (SVD) 预测未来视觉演化，基于 Recurrent State-Space Model (RSSM) 进行信念动态更新，底层动作生成基于 Diffusion Policy（扩散策略），实验骨干网络使用了 DeFI 和 BridgeVLA。

**2. 技术拆解**
- **核心方法**: 
  1. **构建联合信念**：用SVD提取未来视觉表征，结合MLP提取的动作意图表征，组成联合信念来条件化扩散策略，生成多步动作块。
  2. **信念修正**：执行一步后，用RSSM的prior（先验）和posterior（后验）分支计算信念差异，将后验与先验的差值作为“信念修正（belief revision）”。
  3. **选择性修复**：用TCN（时序影响模型）根据信念修正量，预测剩余动作的修正值、有效性和不确定性。通过优化一个二元掩码（综合考虑有效性、修改代价、碎片化惩罚和不确定性），决定对缓存动作块是保留、局部修复还是触发全局重规划。
- **关键细节**: 
  - **输入输出**：输入为RGB观测、语言指令和本体感觉；输出为多步动作块（如10步，7-DoF相对动作）。
  - **模型结构**：包含SVD（未来预测）、MLP（动作意图）、RSSM（信念动态）、TCN（时序影响预测）和Diffusion Policy（动作生成）。
  - **关键超参**：动作影响阈值 $\tau$（用于离线监督）、最大修复比例 $\rho$、不确定性阈值 $\eta$、最大修复片段数 $s_{max}$。
- **训练/优化目标**: 
  - 扩散策略使用标准的扩散动作预测损失。
  - RSSM使用Smooth L1 loss预测信念位移（teacher latent displacement）。
  - TCN（时序影响模型）使用联合损失（修正量L1 + 有效性BCE + 不确定性L1）。其监督信号来自“结果引导的动作对（outcome-guided action pairs）”，即在同等观测和噪声条件下，低回报动作块与高回报动作块的差异。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：仿真使用 CALVIN (ABC->D 5步), L-CALVIN (10步), RLBench (18个任务)；真实世界使用 ARX X5 机械臂完成5个操作任务。
  - **对比对象（baseline）**：CALVIN/L-CALVIN上对比 $\pi_{0.5}^*$, VPP, REMAC, PALM, DeFI, VITA, Long-VLA 等；RLBench上对比 HDFlow, TVVE, SpatialActor, BridgeVLA。
- **评价指标**: 连续完成任务的成功率（如1-step到5-step/10-step success rate）、平均序列长度（Avg. Len.）、平均成功率（Avg. SR）。
- **主要结果**: 
  - **CALVIN**：5步成功率达到 86.6%，平均序列长度 4.62，在长序列上优势明显。
  - **L-CALVIN**：10步成功率从 56% (Long-VLA) 提升至 63%，平均长度 8.36。
  - **RLBench**：18个任务平均成功率 88.8%（对比BridgeVLA的85.7%）。
  - **真实世界**：5个任务平均成功率 82.8%（相比基线有约12.5%的相对提升）。
  - **消融与机制验证**：选择性修复显著优于全局重规划和随机修复；TCN能精准定位受影响动作（Mask F1达0.861，预测受影响比例20.6%与真实20.8%高度吻合）；统计显示86.8%的缓存后缀被直接保留，仅2.1%触发全局重规划，证明了局部修复的有效性。

### 12. 🔥 [WoVR+: World Model as Reliable Simulator for Versatile VLA Policy Optimization with RL] (WoVR+：将世界模型作为可靠仿真器用于通用VLA策略的强化学习优化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17922` | [点击跳转](https://arxiv.org/abs/2610.17922)

**0. 论文标题**
- **英文标题**: WoVR+: World Model as Reliable Simulator for Versatile VLA Policy Optimization with RL
- **中文标题**: WoVR+：将世界模型作为可靠仿真器用于通用VLA策略的强化学习优化
- **研究机构**: 原文未提及
- **一句话总结**: 提出WoVR+框架，通过构建对齐VLA接口的多视角几何世界模型、引入分块时序连贯探索噪声以及阶段局部想象训练，解决了世界模型幻觉和长视野任务中的误差累积问题，显著提升了VLA策略在真实机器人上的成功率。

**1. 整体逻辑**
- **研究任务**: 使用基于世界模型的强化学习（WM-RL）对视觉-语言-动作（VLA）模型进行后训练（post-training），以减少真实机器人交互成本，并支持长视野、多阶段的机械臂操作任务。
- **研究动机**: 动作条件世界模型（ACWM）存在“幻觉”（生成视觉合理但物理错误的rollout），直接用于RL会让策略利用模型误差而非真实任务进展。此外，将其扩展到现代VLA接口（多视角+本体感觉）和长视野任务时，面临时空与跨模态一致性难保证、探索噪声引发预测退化、以及自回归rollout误差累积三大挑战。
- **本质改动**: 在WoVR的防幻觉WM-RL框架基础上，重新设计了学习环境和想象交互协议：构建了对齐VLA接口的几何多视角世界模型，引入了保持时序连贯性的分块探索噪声，并提出了针对长视野任务的阶段局部想象训练机制。
- **技术溯源**: 基于WoVR框架；视频生成骨干使用Wan2.2-TI2V-5B，控制分支使用VACE，推理加速使用DMD2；RL优化使用GRPO和Flow-SDE（基于$\pi_{RL}$）。

**2. 技术拆解**
- **核心方法**: 
  1. **VLA对齐的多视角世界模型**：使用几何条件（动作地图和相机光线地图）注入到视频生成模型中，支持多视角预测和本体感觉更新，缓解幻觉。
  2. **时序连贯的探索（Chunk-wise Flow-SDE）**：在基于Flow的action-chunk策略中，用分块共享的噪声替代独立同分布（I.I.D.）噪声，保持探索幅度的同时抑制导致预测退化的动作抖动。
  3. **阶段局部想象训练（Stage-Local Imagined Training）**：针对长视野任务，使用阶段入口重置、阶段特定奖励、局部视野和可控采样，缩短生成的前缀并平衡各阶段的训练。
- **关键细节**: 
  - **世界模型输入与结构**：输入为稀疏采样的多视角历史（首帧锚点+固定步长近期观测）和绝对关节/夹爪命令。将关节命令通过正运动学转为末端执行器（EEF）姿态，投影为特定视角的动作地图（Action Maps）；直接在视频latent网格上构建相机光线地图（Camera Raymaps）。通过并行的DiT控制分支（VACE）注入几何条件。
  - **本体感觉更新**：采用基于命令的近似，将绝对关节目标在时间上平移一步，避免学习额外的本体感觉转移模型。
  - **规模与超参**：视频骨干Wan2.2-TI2V-5B，预测视野8帧，上下文5帧；RL中GRPO group size为8，每次更新512条想象轨迹。
- **训练/优化目标**: 
  - **世界模型**：Flow-matching objective（流匹配目标）。训练时引入几何感知局部腐蚀（模糊操作相关区域）和时序步长采样，提升自回归预测的鲁棒性。
  - **策略优化**：Clipped GRPO objective（截断的GRPO目标），结合阶段平衡的奖励和局部rollout进行优化。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：RoboTwin仿真环境（50个任务，2000条轨迹训练），真实机器人环境（ARX-5双臂平台，6个多任务操作，1个4阶段长视野手机包装任务）。
  - **对比对象（Baseline）**：Ctrl-World, EVAC, WoVR (单/三视角), Direct RL, Full-start WM-RL, KIR等。
- **评价指标**: 
  - **世界模型**：LPIPS, FID, FVD, SSIM, PSNR, FPS。
  - **策略**：任务成功率（Success rate），包括固定/随机初始状态下的成功率，以及长视野任务中各阶段的条件成功率。
- **主要结果**: 
  - **世界模型预测**：WoVR+在多视角预测和策略诱导动作下的保真度均优于Ctrl-World、EVAC和原版WoVR，且通过DMD2实现单步生成（15 FPS）。
  - **常规策略优化**：在RoboTwin上，WoVR+的多视角VLA成功率显著优于其他WM-RL环境，逼近无预算限制的Direct RL。在6个真实机器人任务上，WM-RL将平均成功率从SFT的39.2%提升至55.8%（相对SFT提升16.7%）。
  - **长视野任务**：在4阶段手机包装任务中，阶段局部均匀采样训练将端到端成功率从SFT的30%提升至75%，显著优于Full-start和KIR方法，且每小时有效更新组数（吞吐量）提升1.58倍。

### 13. 🔥 [OccWAM: Occupancy World-Action Models with Joint Scene-to-Ego Flow Matching] (OccWAM：基于场景到自车联合流匹配的占据世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17688` | [点击跳转](https://arxiv.org/abs/2610.17688)

**0. 论文标题**
- **英文标题**: OccWAM: Occupancy World-Action Models with Joint Scene-to-Ego Flow Matching
- **中文标题**: OccWAM：基于场景到自车联合流匹配的占据世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于占据栅格的原生世界-动作模型，通过两阶段流匹配在场景和自车坐标系下联合生成未来占据和规划轨迹，实现了两者的双向交互，在自动驾驶闭环和开环任务中取得SOTA。

**1. 整体逻辑**
- **研究任务**: 端到端自动驾驶中的未来场景预测（世界模型）与轨迹规划（动作生成）的联合建模。
- **研究动机**: 现有的占据感知规划器在耦合“占据预测”和“动作生成”时，通常采用分层（先生成世界再规划，或动作条件生成世界）或并行多任务的方式。这些方法存在显式的生成顺序依赖或角色不对称，限制了世界预测和动作生成的双向交互。此外，场景中心（scene-centric）坐标系利于稳定的世界预测，而自车中心（ego-centric）坐标系利于局部规划，现有方法难以在生成过程中兼顾这两种坐标系的需求。
- **本质改动**: 摒弃了像素级视频生成或离散token序列化，采用连续的条件流匹配（Flow Matching），在统一的生成过程中联合输出密集的度量占据栅格和连续轨迹；并设计了“场景中心到自车中心”的两阶段坐标转换与联合精化机制，让占据和动作在生成过程中实时双向交互。
- **技术溯源**: 基于条件流匹配（Conditional Flow Matching / Rectified Flow）、混合专家Transformer（Mixture-of-Transformers, 借鉴了AutoMoT的架构思想）、以及视觉语言模型（使用Qwen3-VL-2B-Instruct作为冻结的语义理解基座）。

**2. 技术拆解**
- **核心方法**: 提出OccWAM，采用三专家混合Transformer骨干（Understanding, World, Action Experts），其中World和Action Experts在每一层进行双向注意力交互。核心生成机制是“场景到自车”的两阶段流匹配（Scene-to-Ego World-Action Flow Matching），将世界预测和动作生成耦合在同一个速度场中。
- **关键细节**: 
  - **Stage 1 (Scene-centric)**: 在固定于当前自车的场景坐标系下，从高斯噪声出发，联合生成场景占据和绝对累积轨迹（1步Euler求解）。
  - **坐标转换 (Scene-to-Ego)**: 将Stage 1预测的轨迹转换为相邻位姿增量，并将预测的占据栅格重索引（warp）到由该轨迹诱导的未来自车坐标系中。由于自车向前运动，warp后会产生未覆盖区域，模型用自由空间占位，并计算覆盖率掩码（coverage mask）作为Stage 2的条件输入。
  - **Stage 2 (Ego-centric)**: 以转换后的占据和位姿增量为源（不引入新高斯噪声），在自车中心坐标系下通过第二个联合流精化占据和动作，输出最终的自车中心占据和相对增量轨迹。
  - **模型结构**: Understanding Expert（基于Qwen3-VL-2B-Instruct微调）保持冻结提供语义上下文；World和Action Experts共享骨干，但各自拥有特定于表示的速度头（velocity heads）。
- **训练/优化目标**: 
  - 主要损失为两阶段的流匹配损失（Flow Matching Loss），Stage 1和Stage 2的损失权重比为2:1。
  - 引入辅助的世界-动作耦合损失（Occupancy-based trajectory cost）：用预测的占据场评估轨迹的碰撞/越界惩罚。关键细节是对占据概率使用停止梯度（stop-gradient），防止模型为了降低碰撞惩罚而“幻觉”抹除障碍物。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: Bench2Drive（闭环驾驶），nuScenes（开环规划 + 未来体积占据预测）。
  - **对比对象 (Baseline)**: Bench2Drive对比了UniAD, DiffusionDrive, AutoMoT+, KnowVal-SimLingo等；nuScenes开环规划对比了VAD, AutoMoT, OmniDrive等；nuScenes占据预测对比了OccWorld, OccLLaMA, COME等。
- **评价指标**: Bench2Drive使用 Driving Score (DS) 和 Success Rate (SR)；nuScenes开环规划使用 L2位移误差 和 碰撞率（Collision）；nuScenes占据预测使用 mIoU 和 IoU。
- **主要结果**: 
  - **Bench2Drive闭环**: DS达到90.45，SR达到77.27%，超越AutoMoT+ (89.42 / 74.09%) 和 KnowVal-SimLingo (88.42 / 69.03%)。
  - **nuScenes开环规划**: Avg L2降至0.30m，Avg Collision降至0.07%，均为SOTA。
  - **nuScenes未来占据**: Avg mIoU达到24.23%，Avg IoU达到33.88%，均为SOTA。
  - **消融实验验证**: 两阶段流匹配使Bench2Drive的DS从88.21提升至90.45；在推理时切断World到Action的信息流，会导致nuScenes的碰撞率从0.07%暴增至0.23%，证明了双向交互和联合生成的必要性。

### 14. 🔥 [From Pixels to Executable Physics: Behavior-Grounded World Models for Embodied Action Consequence Prediction] (从像素到可执行物理：基于行为校准的具身动作后果预测世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17630` | [点击跳转](https://arxiv.org/abs/2610.17630)

**0. 论文标题**
- **英文标题**: From Pixels to Executable Physics: Behavior-Grounded World Models for Embodied Action Consequence Prediction
- **中文标题**: 从像素到可执行物理：基于行为校准的具身动作后果预测世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DR-WM 框架，通过真实机器人数据校准地形物理参数，将物理仿真与视频生成耦合，准确预测四足机器人在复杂地形下的动作后果，辅助大模型进行安全导航决策。

**1. 整体逻辑**
- **研究任务**: 预测四足机器人在复杂户外地形中执行特定动作后的运动状态和视觉观测，以支持导航规划和动作选择。
- **研究动机**: 现有视频世界模型只关注视觉合理性，缺乏对机器人动力学和地形接触属性（如摩擦力、刚度等空间变化特性）的物理建模，导致在低摩擦或松软地形上的预测过于乐观（例如在冰面预测出平稳前进，实际会打滑失稳）。仅靠3D几何也无法区分物理属性不同的相似表面。
- **本质改动**: 将物理演化（接触动力学决定机器人怎么动）和视觉补全（视频模型预测看到什么）解耦，但通过共享的机器人状态轨迹进行耦合。核心在于用真实机器人的“动作-响应”数据来校准视觉推导出的地形物理先验，使其成为可执行的仿真参数，而不是纯靠视觉先验或固定物理参数。
- **技术溯源**: 基于 MapAnything（3D重建与特征提取）、Genesis（物理仿真器）、Wan（视频生成基座），并结合 CLIP、DINOv2、DPT、VACE 和 ControlNet 等技术。

**2. 技术拆解**
- **核心方法**: 提出 DR-WM 框架，包含三个核心模块：1) PhyMap：从RGB重建几何并预测密集的物理先验，利用真实数据校准为仿真参数；2) 物理引导的视频生成：用Genesis仿真出机器人运动和相机轨迹，结合3D渲染，通过双ControlNet引导视频模型生成未来帧；3) 因果自回归Rollout：用生成的视频帧更新PhyMap，支持长时域预测。
- **关键细节**: 
  - 输入输出：输入初始RGB、机器人初始状态和候选动作序列；输出未来机器人状态、相机轨迹和视觉观测帧。
  - 模型结构：PhyMap 使用冻结的 MapAnything 骨干提取多尺度特征，通过可训练解码器输出摩擦、粗糙度、刚度3个归一化物理通道。视频模型基于 Wan 骨干，使用 VACE 注入3D几何控制，并引入独立的 Action ControlNet 注入相机位姿。
  - 数据集：构建 Physcene 数据集，包含 Physcene-Image（2.58M 带密集物理先验的图像）和 Physcene-Robot（100K+ 包含RGB、LiDAR、状态和控制信号的机器人交互片段）。
- **训练/优化目标**: 
  - PhyMap：带掩码的 Smooth-L1 损失（预测物理先验与基于语义查找表得到的物理目标之间），加上辅助的地形分类交叉熵损失。
  - 视频模型：两阶段训练。第一阶段优化空间 VACE 分支和 LoRA；第二阶段引入动作 ControlNet 联合优化。采用 Flow Matching 损失，仅计算未来 latent token 的误差。
  - 行为校准：通过最小化 Genesis 重放轨迹与真实机器人轨迹、速度、姿态等响应的归一化差异，学习物理先验到仿真参数的单调分段插值映射。

**3. 实验结果**
- **实验设置**: 
  - 数据集：Physcene-Robot 的 held-out 场景。
  - 对比对象：视频世界模型包括 CogVideoX1.5、Wan2.2-TI2V、WorldStereo、Matrix-Game 3.0、Cosmos 3、EgoWM、LingBot-World-Base、NWM；物理消融对比 Geometry Only、Uniform PhyMap、Full PhyMap；VLM动作选择对比无上下文、Generic WM (Wan) 和 DR-WM，使用的VLM为 Qwen3-VL-8B 和 32B。
- **评价指标**: 
  - 视频质量：GPT-5.5 评估的6个维度（成像、美学、运动、时间一致性、动作遵循、物理真实性），以及参考对齐指标（PSNR、LPIPS、DINO Sim、Flow EPE、FVD-16、RotErr、ATE），外加人工盲评。
  - 物理/运动预测：Base ATE、Vertical RMSE、Roll/Pitch RMSE、Velocity RMSE。
  - VLM动作选择：目标进度、路径效率、倾斜RMS、倾斜T10、滑动、到达时间。
- **主要结果**: 
  - 视频生成：DR-WM 在 GPT-5.5 评估的6个维度及所有参考对齐指标上均取得最优（如动作遵循从 0.913 提升至 0.949，物理真实性从 0.870 提升至 0.913，相比 Matrix-Game 3.0）。人工盲评也全面领先。
  - 物理预测：Full PhyMap 相比 Geometry Only 将 Base ATE 降低 18.0%，垂直运动 RMSE 降低 54.5%，Roll/Pitch RMSE 降低 58.2%。相比 Uniform PhyMap 也有显著提升，验证了空间变化物理参数的必要性。
  - VLM动作选择：在90个困难场景中，配备 DR-WM 的 Qwen3-VL-8B 在6个指标中的5个上超越了无辅助的 Qwen3-VL-32B（如进度从 0.8586 提升至 0.8754，倾斜和滑动显著降低）。

### 15. 🔥 [Box-WAM: Box Trajectories as Compact State Representations for World Action Models] (Box-WAM：将边界框轨迹作为世界动作模型的紧凑状态表示)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17526` | [点击跳转](https://arxiv.org/abs/2610.17526)

**0. 论文标题**
- **英文标题**: Box-WAM: Box Trajectories as Compact State Representations for World Action Models
- **中文标题**: Box-WAM：将边界框轨迹作为世界动作模型的紧凑状态表示
- **研究机构**: 原文未提及
- **一句话总结**: 提出用物体中心的3D边界框轨迹替代密集视频帧作为世界动作模型的未来状态表示，在大幅降低计算成本的同时提升了机器人操作的动作预测性能。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的策略学习，具体是构建世界动作模型（World Action Models, WAMs），即让模型同时预测未来环境状态和机器人动作。
- **研究动机**: 现有WAM通常用全帧视频预测未来状态，计算成本极高且包含大量对操作无关的背景、光照等细节；而隐式特征（latent representations）虽然维度低，但难以可靠学习且缺乏可解释性。需要一种既紧凑、可解释，又能保留未来预测监督优势的状态表示。
- **本质改动**: 放弃预测密集图像帧或隐式特征，改用任务相关物体的“3D定向边界框在图像平面的投影轨迹”作为紧凑的未来状态，并设计了状态与动作的因果注意力交互机制，让边界框轨迹作为物体运动计划来引导动作生成。
- **技术溯源**: 基于世界动作模型（WAMs）范式，视觉编码器使用冻结的 DINOv3，生成模型基于 Rectified Flow（整流流）和 Transformer 架构，多任务实验中基于 $\pi_{0.5}$ 预训练VLA模型进行微调。

**2. 技术拆解**
- **核心方法**: BoxWAM。将未来状态定义为被操作物体的最小体积3D定向边界框（OBB）的8个角点在相机图像平面的2D坐标（16维向量）。模型使用基于Transformer的整流流生成模型，联合去噪未来的边界框token和动作token。通过设计结构化的因果注意力掩码，让动作token可以关注未来的边界框token，但边界框token不能关注未来的动作token。
- **关键细节**: 
  - **输入**：当前RGB图像（经DINOv3编码）、当前本体感知状态、任务条件（单任务为空，多任务为语言指令）。
  - **输出**：未来H步的边界框轨迹和动作序列（action chunk）。
  - **状态表示**：每个时间步每个被操作物体16维坐标。双臂情况下分左右槽位，无操作时置零并掩码。
  - **动作表示**：相对关节位置控制（归一化到[-1, 1]）或末端执行器控制。
  - **模型结构**：Transformer backbone，通过adaptive layer normalization注入本体感知和流时间步。包含线性未来状态头和动作头。
  - **规模与超参**：预测步长H在特定任务仿真中为15，多任务和真实世界为50。去噪步数N=10，采用二次积分调度。
- **训练/优化目标**: 联合整流流（Rectified-flow）目标。对联合变量（未来框+动作）加高斯噪声并插值，模型预测从噪声到数据的速度场。损失函数为状态速度预测误差和动作速度预测误差的L2范数加权和（权重相等）。时间步采样基于Beta分布，偏向较小的时间步（更noisy的点）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：仿真使用 RoboTwin2.0（包含clean和randomized设置），涵盖单任务（50 demos）和多任务（50个任务，共2500 demos）。真实世界使用 UFACTORY xArm7 单臂机器人，3个任务（做咖啡、浇花、放玩具），每个任务50 demos。
  - **对比对象（Baselines）**：仿真对比 ACT, Diffusion Policy, DP3, $\pi_0$, 纯动作Flow模型；多任务对比 $\pi_{0.5}$ 及其BoxWAM增强版；真实世界对比 Diffusion Policy 和 纯动作Flow模型。还对比了基于Mink和M2T2的Differential IK baseline。
- **评价指标**: 任务成功率（Success Rate, SR）。真实世界额外报告基于子目标的进度率（Progress Rate）。系统层面评估推理延迟（Latency, ms）。
- **主要结果**: 
  - **单任务仿真**：在clean设置下，BoxWAM平均成功率超越除DP3（需深度输入）外的所有baseline；在randomized设置下，BoxWAM取得最高平均成功率（37.8% vs 纯动作Flow的32.6%）。
  - **多任务仿真**：在2500个demo微调下，$\pi_{0.5}$ + BoxWAM 在clean设置下成功率从52.6%提升至61.5%，randomized设置从26.9%提升至34.0%。推理延迟仅增加约2.4ms（55.3ms -> 57.7ms）。
  - **真实世界**：BoxWAM平均成功率/进度率达到60.9%，显著优于纯动作Flow模型（51.1%）和Diffusion Policy（23.7%）。
  - **消融与效率**：证明了3D OBB比VAE、DINO特征、6D位姿等表示在综合性能和效率上更好；证明了“未来状态引导动作”的注意力设计最优。相比预测密集视频帧，BoxWAM推理延迟仅约170ms，远低于VAE/DINO的250ms+。在27500 demo的大规模实验中，BoxWAM以3.35B参数和64.9ms延迟达到了87%+的成功率。

### 16. 🔥 [Can a Frontier VLM Serve as a Robot Policy for Memory-Dependent Manipulation?] (前沿视觉语言模型能否作为依赖记忆的机器人操作策略？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17350` | [点击跳转](https://arxiv.org/abs/2610.17350)

**0. 论文标题**
- **英文标题**: Can a Frontier VLM Serve as a Robot Policy for Memory-Dependent Manipulation?
- **中文标题**: 前沿视觉语言模型能否作为依赖记忆的机器人操作策略？
- **研究机构**: 原文未提及
- **一句话总结**: 本文在具身智能领域做了一个硬核的实验评估，直接把冻结的 GPT-6-Astra 当作机器人底层控制策略，靠全 episode 上下文在 RoboMME 记忆任务基准上跑出 92.1% 的成功率，干掉了人类玩家和各类微调/分层系统。

**1. 整体逻辑**
- **研究任务**: 评估冻结的前沿视觉语言模型（VLM）在需要依赖记忆（时间、空间、物体、程序记忆）的长视野机器人操作任务中的直接闭环控制能力。
- **研究动机**: 现有的机器人操作任务往往需要记忆历史信息（如计数、追踪被遮挡物体、模仿动作）。现有方法要么需要针对特定任务训练策略，要么将 VLM 仅用作高层规划器配合底层训练好的策略，缺乏对“单一通用模型直接包揽长视野规划、记忆和底层控制”能力的直接评估。
- **本质改动**: 不做任何参数微调，也不使用分层架构，而是把整个交互 episode 的历史观测和模型自身回复全部塞进 VLM 的上下文窗口，让模型直接输出末端执行器的笛卡尔坐标 waypoint 和夹爪动作。
- **技术溯源**: 基于 GPT-6-Astra（前沿视觉语言模型），基于 RoboMME 基准（包含 16 个记忆依赖的桌面操作任务），基于 ManiSkill 仿真器。

**2. 技术拆解**
- **核心方法**: 将 VLM 作为直接的闭环控制策略（Waypoint-Policy）。在每个决策步，模型接收语言目标、任务演示视频、历史帧（按步长下采样）、当前腕部相机图像以及本体感受，结合上下文中之前的所有回复，直接输出下一个末端执行器位姿（TCP位置、姿态）和夹爪开合指令。
- **关键细节**: 
  - **输入**：语言目标、任务视频、按步长 $k=3$ 下采样的前置相机历史帧（保留最新帧）、当前腕部相机帧、TCP位姿、手指位置、控制步数、相机内外参。不包含深度图或特权状态（privileged state）。
  - **输出**：笛卡尔空间 waypoint $(x, r, \gamma)$，即 TCP 位置、RPY 姿态和夹爪指令（-1关, 0保持, 1开）。由 RoboMME 的运动规划器执行。
  - **上下文管理**：整个 episode 的所有采样观测和模型历史回复（包含自由文本描述和动作）串联在一个对话中，不做摘要或丢弃。
  - **超参**：API 默认采样设置，temperature 1, top-p 0.98，禁用截断。
- **训练/优化目标**: 无训练/优化。直接使用冻结的预训练模型进行零样本推理，通过 Prompt 描述动作格式、坐标系和硬件约定（如提示模型前置相机看到的左右是镜像的）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboMME 基准的 800 个测试 episode（16 个任务，每个 50 个 episode），涵盖 Counting, Permanence, Reference, Imitation 四个记忆类别。
  - **对比对象（Baseline）**：人类玩家（使用 oracle skill interface，90.5%）、PonderPounce-9B（Leaderboard 最佳，60.8%）、三层分层系统（GPT-6-Astra 规划 + 训练好的 VLA，79.1%），以及在 oracle-planner 设置下的 GPT-4o、Gemini-2.5-Pro、Qwen3-VL-32B。
- **评价指标**: 任务成功率（Success rate），由仿真环境判定。同时进行了 episode 级别的失败原因人工审计（Failure Analysis）。
- **主要结果**: 
  - 在 Waypoint 控制设置下，GPT-6-Astra 单次运行成功率达 92.1%（737/800），超过人类参考的 90.5%（人类使用的是 oracle 接口），大幅领先 PonderPounce-9B (60.8%) 和分层系统 (79.1%)。在 16 个任务中的 13 个达到或超过人类水平。
  - 失败分析：63 个失败主要集中在 MoveCube（23个过早宣布完成，因未松开夹爪）和 StopCube（23个误触或按压时机不对）。其他失败包括超出 reach 的 waypoint、运动规划失败和格式解析错误。
  - Oracle-planner 诊断：在将执行交给 oracle 的设置下，GPT-6-Astra 基础得分为 77.8%。通过增加帧密度（D）和修正 prompt（G），成功率提升至 92.3%。这些修正对 GPT-6-Astra 的提升（+119 episodes）远大于对 GPT-4o 的提升（+26 episodes），证明修正提供的是信息而非直接给答案。

### 17. 🔥 [D-World: An Explicit World-Language-Action Model with Recursive Self-Improvement under Dual Control] (D-World：双重控制下具备递归自改进能力的显式世界-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.17114` | [点击跳转](https://arxiv.org/abs/2610.17114)

**0. 论文标题**
- **英文标题**: D-World: An Explicit World-Language-Action Model with Recursive Self-Improvement under Dual Control
- **中文标题**: D-World：双重控制下具备递归自改进能力的显式世界-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出D-World框架，将机器人的世界模型显式化为可执行的数字孪生程序，并在执行动作后利用真实测量残差在线修正物理参数（递归自改进），在冻结LLM的情况下持续提升世界模型精度。

**1. 整体逻辑**
- **研究任务**: 机器人在未知物理场景中的操作任务（如抓取毛巾、操作烤面包机），要求系统能理解场景几何与物理属性并执行精确操作。
- **研究动机**: 现有的世界-语言-动作模型（如基于视频预测或网络权重的隐式模型）在预测与真实场景不符时，无法直接追溯到具体的物理量进行修正，只能依赖重新收集数据训练。
- **本质改动**: 摒弃隐式网络权重，将“世界”显式表示为包含几何和物理参数的可执行数字孪生程序；感知和规划模块通过孪生和语言交互，并在每个动作块执行后，直接通过测量残差在线修正孪生中的物理参数和状态。
- **技术溯源**: 基于经典的 Sense, Plan and Act (SPA) 分解架构；依赖前沿多模态大语言模型（LLMs）作为编码智能体生成视觉/几何代码和规划代码；底层依赖物理引擎（如MuJoCo）进行仿真和重放。

**2. 技术拆解**
- **核心方法**: 
  1. **显式数字孪生构建**：Sense模块让LLM编写视觉和几何代码，从图像生成包含物体几何、物理参数（尺寸、质量、摩擦等）和状态的可执行孪生，并输出不确定性范围。
  2. **递归自改进（RSI）**：Plan模块在孪生中搜索并提交动作块（chunk）。执行后，对比真实测量值与仿真预测值的残差。若存在偏差，提出参数或状态修正。Harness（控制框架）通过重放最新chunk验证修正，仅当修正后的残差不超过容忍度时才接受。若结构不匹配则退回重构。
  3. **双重控制（Dual Control）**：将动作选择建模为双重控制问题，动作不仅推进任务，还通过主动探测（probing）暴露模型误差。理论证明局部修正（RSI）降低了探测成本，鼓励规划器主动消除不确定性。
- **关键细节**: 
  - **输入输出**：输入为RGB/RGB-D图像、机器人本体感觉、语言指令；输出为动作序列（chunks）及修正后的孪生参数。
  - **系统架构**：双机械臂机器人（带头部RGB和腕部RGB-D相机）。Sense和Plan作为独立的LLM编码智能体在沙盒中运行，通过Harness进行上下文管理、工具调用和硬检查。
  - **关键超参/容忍度**：基于传感器规格设定操作容忍度，如末端执行器位置容忍度6.6mm，深度容忍度随距离动态计算（如0.5m处约10mm），夹爪闭合容忍度0.02。
- **训练/优化目标**: 本文不涉及神经网络训练（LLM保持冻结）。在线优化目标是通过RSI（如最小二乘法或rollout search）最小化测量残差以拟合物理参数；系统级优化目标是最小化完成任务的期望时间（双重控制目标）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：在真实双机械臂机器人上执行毛巾处理（towel handling）和烤面包机操作（toaster manipulation）任务。无任务特定训练或预准备试验。
  - **对比对象（baseline）**：原文未提及具体的对比baseline模型，主要对比系统内部机制（如局部参数修正 vs 全局重构）。
- **评价指标**: 渲染深度残差（绝对值中位数）、夹爪闭合残差、末端执行器运动残差，以及任务执行的时间消耗分析。
- **主要结果**: 
  - **局部修正显著提升孪生精度**：例如，将面包厚度从20mm修正为12mm后，深度残差从201mm降至11mm，夹爪闭合残差从0.076降至0.035；将烤面包机槽内支撑物抬高2cm，面包深度残差从22.4mm降至1.5mm。
  - **避免耗时的全局重构**：在毛巾任务中，一次全局重构耗时约20分钟，而规划调用仅需3-6分钟。RSI通过低成本的局部修正吸收了探测结果，避免了频繁重构，大幅提升了执行效率。
  - **验证了双重控制理论**：证明了局部修正降低了将证据纳入模型的成本，从而提高了规划器在成功率较低时主动进行探测（probing）的意愿，有效克服了保守控制器的“关闭（turn-off）”现象（即因为害怕不确定性而只采取保守动作）。

### 18. 🔥 [UniLAP: A Unified Latent Action Policy for Cross-Embodiment Manipulation] (UniLAP：一种用于跨具身操作的统一隐式动作策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.16969` | [点击跳转](https://arxiv.org/abs/2610.16969)

**0. 论文标题**
- **英文标题**: UniLAP: A Unified Latent Action Policy for Cross-Embodiment Manipulation
- **中文标题**: UniLAP：一种用于跨具身操作的统一隐式动作策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于流匹配（Flow Matching）的连续隐式动作策略，通过无标签运动监督解耦外观干扰，在海量无动作标签视频上预训练，并能高效迁移到人手及多种机器人操作任务中。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人学习领域的视频预训练与模仿学习。具体任务是从海量无动作标签的人手和机器人视频中学习通用的操作动力学先验，并将其跨具身（Cross-Embodiment）迁移到具体的机器人控制任务中。
- **研究动机**: 现有的隐式动作模型（LAMs）存在两个核心痛点：1）离散隐变量（如 VQ-VAE）存在粒度瓶颈，无法表达操作所需的连续、多模态动作分布；而现有的连续隐变量通常依赖未来帧（非因果），需要额外的规划步骤才能执行。2）基于像素重建的隐动作学习容易与相机运动等无关外观特征纠缠，导致隐空间被污染。
- **本质改动**: 抛弃离散 token 和依赖未来帧的设定，直接用 Flow Matching 建模连续隐动作空间作为因果策略；同时摒弃像素重建和外部光流估计器，利用冻结 ViT 的跨帧特征对应关系（Feature Correspondence）提供无标签的运动监督，强制隐动作只编码纯粹的运动学信息。
- **技术溯源**: 基于 Flow Matching (Lipman et al., 2022) 生成范式，视觉骨干采用 DINOv2 和 SigLIP2，语言骨干采用 Flan-T5，并使用 DreamDojo 作为冻结的 LAM teacher 提供后验分布。

**2. 技术拆解**
- **核心方法**: 采用两阶段训练框架。Stage 1 在无标签视频上预训练统一的连续隐动作策略和运动预测器；Stage 2 针对特定具身（如单臂、人形、人手）训练专属的动作解码器，并轻量微调隐动作策略。
- **关键细节**: 
  - **模型规模**：总参数 1.1B，可训练参数 590M（冻结了视觉和语言骨干）。
  - **隐动作策略**：16 层 Transformer，单次前向传播预测 16 步、维度为 32 的连续隐动作 chunk。
  - **运动监督机制**：利用冻结 DINOv2 的 key 向量计算跨帧 Softmax 对应矩阵，将下一帧特征 warp 到当前帧，计算特征空间残差作为运动目标，无需外部光流网络。
- **训练/优化目标**: 
  - **Stage 1 损失**：$\mathcal{L}_{total} = \mathcal{L}_{FM} + \lambda_d \mathcal{L}_{distill} + \lambda_m \mathcal{L}_{motion}$。
  - $\mathcal{L}_{FM}$（流匹配损失）：拟合 LAM teacher 边缘化未来帧后的后验分布，保留动作多模态性。
  - $\mathcal{L}_{distill}$（流自适应蒸馏损失）：用逆协方差矩阵对齐后验均值，惩罚权重随 flow timestep $\tau$ 变化，避免在噪声较大时过早将速度场拉向均值而破坏传输路径。
  - $\mathcal{L}_{motion}$（运动预测损失）：监督隐动作预测特征空间残差，将隐动作锚定在物理运动上。
  - **Stage 2 损失**：$\mathcal{L}_{act}$，动作解码器输出真实动作的 MSE 损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：EgoDex（人手姿态预测），SimplerEnv（WidowX 和 Google Robot 单臂 real-to-sim 操作），RoboCasa-GR1（人形机器人桌面操作），以及真实 xArm7 物理机器人部署。
  - **对比对象（Baseline）**：RT-1-X, Octo, OpenVLA, $\pi_0$, GR00T-N1, UniVLA, mimic-video 等主流 VLA 和隐式动作方法。
- **评价指标**: EgoDex 使用平均/最终位移误差（ADE/FDE, 单位：米）；机器人操作和真实部署使用成功率（Success Rate, %）。
- **主要结果**: 
  - **人手预测 (EgoDex)**：S=10 时 ADE 降至 0.029m，比最强 baseline 降低 24%，能精准捕捉手指级细微运动。
  - **单臂操作 (SimplerEnv)**：WidowX 平均成功率 52.1%（比 UniVLA 高 4.2%，比 mimic-video 高 5.2%）；Google Robot 成功率 57.1%，在视觉扰动（Variant Aggregation）下性能仅下降 2.5%，证明运动解耦极大提升了抗视觉干扰能力。
  - **人形操作 (RoboCasa-GR1)**：平均成功率 42.7%，以极低的微调成本实现了向 29 自由度人形机器人的跨具身迁移，性能与端到端大模型相当。
  - **真实部署 (xArm7)**：平均成功率 28.0%，优于 $\pi_{0.5}$ 的 22.7%。在需要精细对齐的任务（如叠杯子）上，成功率达到 28%，是 $\pi_{0.5}$ (14%) 的两倍，验证了连续隐动作空间对精细运动区分的保留能力。

- **英文标题**: What Limits Cross-Task Generalization in World Action Models?
- **中文标题**: 什么限制了世界动作模型的跨任务泛化？

- **研究任务**: 评估并提升世界动作模型（WAMs）/世界模型（WMs）在未见任务和环境中的跨任务泛化与物理执行能力。

**2. 技术拆解**
- **核心方法**: 
  1. **AoE (Align Once, Evaluate Everywhere)**：在 9637 小时机器人数据上预训练的相机空间 IDM。它将动作表示为相机空间中的 2D 投影位移、深度变化、方向变化和夹爪命令，解耦了环境特定的世界坐标系，实现零样本跨任务动作恢复。
  2. **VITA (Vision-to-Action) loss**：将 WM 生成的未来视频和真实记录视频分别输入冻结的 AoE，计算恢复动作的差异（匹配损失）以及与真实动作的差异（GT损失），通过反向传播指导 WM 优化对动作恢复敏感的视觉细节。
- **关键细节**: 
  - **AoE 架构**：基于 DINOv3 ViT-L/16 提取双帧视觉特征，结合本体感觉状态，通过 Transformer 预测 12 维的相机空间动作目标（4个投影端点坐标、1个深度变化、6个旋转坐标、1个夹爪值）。总参数量约 11.4 亿。
  - **VITA 损失组成**：$\mathcal{L}_{VITA} = \mathcal{L}_{match} + \mathcal{L}_{GT}$，实际实现中还包含一个基于高斯空间权重的 ROI 重建项用于稳定梯度。AoE 在训练和评估中始终保持冻结。
- **训练/优化目标**: 
  - **AoE 预训练**：使用 Flow Matching 预测动作更新向量，最小化预测动作流与真实相机空间动作目标的差异。
  - **WM/WAM 训练**：在原生视频/动作预测损失基础上，增加 VITA 损失，最小化生成视频和真实视频在 AoE 动作空间中的差异，梯度穿过冻结的 AoE 传回 WM。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-90 (训练), LIBERO/LIBERO-Plus (评估), RoboTwin 2.0 (评估)。
  - **对比对象 (Baseline)**：世界模型 Cosmos, WAN2.2；世界动作模型 LingBot-VA, FastWAM。使用真实记录视频/动作回放作为上限参考。
- **评价指标**: 跨任务/跨环境零样本执行成功率 (Success Rate, %)，包括 pass@1 和 pass@50。
- **主要结果**: 
  - **问题诊断**：未加干预的 WM (Cosmos/WAN2.2) 生成的未来视频，跨任务执行成功率极低（LIBERO 上 pass@1 仅约 0.4%），而真实视频回放可达 57.0%。失败主要集中在夹爪和交互几何区域。
  - **WM 提升**：加入 VITA loss 后，生成视频的跨任务执行成功率大幅提升。WAN2.2 在 LIBERO 上的平均成功率从 1.3% 提升至 47.0%，Cosmos 提升至 51.7%。在跨环境 LIBERO-Plus 上也从不到 4% 提升至约 30%。
  - **WAM 提升**：VITA loss 同样提升了 LingBot-VA 和 FastWAM 的原生动作预测能力。例如 LingBot-VA 在跨环境 LIBERO-Plus 上的成功率从 35.1% 提升至 47.2%；FastWAM 在 RoboTwin 困难任务上从 9.3% 提升至 17.5%。

### 20. 🔥 [Trust-Calibrated VLA Policy Post-Training with Evolving Imagination] (基于信任校准与演化想象的VLA策略后训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.16517` | [点击跳转](https://arxiv.org/abs/2610.16517)

**0. 论文标题**
- **英文标题**: Trust-Calibrated VLA Policy Post-Training with Evolving Imagination
- **中文标题**: 基于信任校准与演化想象的VLA策略后训练
- **研究机构**: 原文未提及
- **一句话总结**: 给VLA的强化学习后训练加了一个“信任校准层”，通过评估在线世界模型的预测误差，动态控制想象数据的使用比例和梯度权重，解决了模型用想象数据训练时容易学偏的问题。

**1. 整体逻辑**
- **研究任务**: VLA（视觉-语言-动作）模型的强化学习后训练，旨在提升策略在超出模仿学习演示分布的扰动环境中的鲁棒性和适应性。
- **研究动机**: 现有的VLA后训练存在“可靠性-效率”矛盾。无模型RL（Model-free RL）全靠真实交互，样本效率太低；基于模型的RL（Model-based RL）用世界模型生成想象数据来降本，但静态世界模型会过时。即使让在线更新的世界模型跟上策略分布，它生成的想象数据依然有视觉和奖励预测误差，直接拿来训练会把策略带偏。
- **本质改动**: 不卷世界模型本身的预测精度，而是在“在线更新的世界模型”和“策略优化”之间加了一个信任校准接口。根据世界模型当前的预测误差，动态决定想象数据用多少、rollout 多长，以及具体哪些想象片段（chunk）能用、权重多大。
- **技术溯源**: 策略基座基于 OpenVLA-OFT；仿真评估基于 LIBERO-PRO 数据集；真机验证基于 AgileX PiPER X 机械臂平台。

**2. 技术拆解**
- **核心方法**: 提出 MeRL (Model-Evolving RL) 框架。核心包含一个在线更新的模拟器（视觉世界模型 + 奖励代理头），以及两级信任校准机制：阶段级调度（Stage-level trust）和块级回放控制（Chunk-level trust）。
- **关键细节**: 
  1. **在线模拟器**：世界模型预测未来视觉帧，奖励代理头预测局部任务进度（用截断的成功到达目标监督）。两者随策略收集的真实数据在线更新。
  2. **阶段级信任**：计算全局的视觉和代理预测误差，映射为想象数据的混合比例（$\rho_s$）和 rollout 长度（$h_s$）。误差大就少用、短用；误差小就多用、长用。
  3. **块级信任**：对于没有真实未来帧做对比的递归想象 chunk，用一个残差预测器（residual predictor）估算局部误差。根据误差决定该 chunk 被 replay 的概率（$p_{s,i}$）和在策略梯度里的权重（$w_{s,i}$）。
- **训练/优化目标**: 
  1. **模拟器损失**：视觉预测损失 + 代理头损失。
  2. **策略损失**：混合真实和想象数据的 GRPO 风格策略梯度损失。想象分支的 loss 受阶段级比例（$\rho_s$）控制，且每个 chunk 的 loss 乘以块级信任权重（$w_{s,i}$）。

**3. 实验结果**
- **实验设置**: 
  1. **仿真**：使用 LIBERO-PRO 的四个扰动套件（Spatial, Object, Goal, Long）。对比基线包括 SFT、MFRL（无模型）、Static-MBRL（静态基于模型）、Online-Updated MBRL（在线更新但无信任控制），以及外部方法 SimpleVLA-RL、WMPO、WoVR。
  2. **真机**：AgileX PiPER X 机械臂，两个任务（Block-to-Box, Lid-to-Pot），每个任务仅用 50 个 demo 进行离线微调后闭环测试。
- **评价指标**: 成功率（SR）、学习曲线下面积（AUC）、达到高阈值所需训练阶段数（S2T-H，越小代表收敛越快）。
- **主要结果**: 
  1. **仿真表现**：MeRL 平均 SR 达到 79.7%，比无信任控制的 Online-Updated MBRL 高 3.5%。S2T-H 降至 92.1，比匹配的 MFRL 收敛速度快 10.9%。
  2. **真机表现**：仅用固定 50 个 demo 离线微调，MeRL 在两个真机任务上平均 SR 达到 80.0%。
  3. **机制验证**：消融实验证明阶段级调度和块级回放控制缺一不可；且残差预测器在没有未来真实数据的情况下，依然能有效区分想象数据的质量（Top 30% 低误差 chunk 的精确率达 0.77）。

### 21. 🔥 [Same Goal, Different Words: Spatial Instruction Sensitivity in World-Action Models] (同一目标，不同表述：世界-动作模型中的空间指令敏感性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.16242` | [点击跳转](https://arxiv.org/abs/2610.16242)

**0. 论文标题**
- **英文标题**: Same Goal, Different Words: Spatial Instruction Sensitivity in World-Action Models
- **中文标题**: 同一目标，不同表述：世界-动作模型中的空间指令敏感性
- **研究机构**: 原文未提及
- **一句话总结**: 本文通过控制初始状态并改变等价空间指令的表述，揭示了现有世界-动作模型在指令理解上的严重不一致性，并指出了传统空间放置评估指标的漏洞。

**1. 整体逻辑**
- **研究任务**: 本文属于具身智能/机器人学习领域的评估与分析类工作。主要任务是评估世界-动作模型（WAMs）在桌面操作任务中，对等价但表述不同的空间指令的响应一致性及底层语言理解能力。
- **研究动机**: 1) 现有评估通常只测单一指令的成功率，忽略了模型对等价指令（如改变参考系主语）的敏感度；2) 传统空间评估指标有漏洞，例如移动了错误的物体也能算作成功，或者放置后在episode结束前关系丢失。
- **本质改动**: 设计了“配对空间评估”协议，在完全相同的物理初始状态下，对比模型在“目标优先”和“参考优先”两种等价指令下的表现；同时改进了评估指标，区分了“任意时刻达成”和“最终保持”，并排查是否移动了正确物体。
- **技术溯源**: 基于 RoboLab 仿真基准；评估的模型包括 Cosmos3 Nano、Cosmos3 Edge 和 FLUX 3 Action；其视觉语言骨干网络涉及 Qwen3-VL-8B/4B-Instruct 和 Cosmos3-Edge reasoner。

**2. 技术拆解**
- **核心方法**: 
  1) 配对空间评估（Paired Spatial Evaluation）：在4个RoboLab场景中，固定初始状态，对每个目标分别使用直接（DIR）、目标优先（TF）和参考优先（RF）三种指令进行rollout对比。
  2) 独立语言理解测试：剥离动作生成，单独测试各模型视觉语言骨干网络对纯文本和图文指令的理解准确率。
- **关键细节**: 
  - 输入：腕部相机、两个外部相机视角及机器人本体状态。
  - 规模：3个模型，4个场景，12个目标，8个初始状态，共864个episode（每个20-40秒）。
  - 指令设计：TF以目标物体为主语描述关系（如“把芥末放在盒子右边”），RF以参考物体为主语描述反向关系（如“移动芥末，使盒子在芥末左边”）。
- **训练/优化目标**: 本文为评估分析类工作，不涉及模型训练。核心机制是通过对比相同初始状态下的不同指令rollout结果，计算稳定放置率，并分析语言骨干网络的指令解析准确率。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：RoboLab 仿真基准（包含cube, butter, mustard, bowl等4个场景）。
  - 对比对象：无传统意义上的外部baseline，主要为模型内部不同指令形式（TF vs RF, DIR vs TF）的配对对比，以及单独测试VLM骨干网络。
- **评价指标**: 
  1) 稳定放置率（Stable placement rate）：分为“任意时刻达成（any-time）”和“episode结束时保持（episode-end）”。要求目标物体被支撑、速度<2cm/s持续1秒且脱离夹爪。
  2) 语言理解准确率：在约束解码下，正确识别移动物体、参考物体和目标空间关系的比例。
- **主要结果**: 
  1) 指令敏感性：3个模型在TF指令下的稳定放置率平均比RF指令高12.2个百分点。但该优势因具体空间关系而异（如mustard-right中TF远好于RF，而cube-behind中RF更好），整体平均分掩盖了局部敏感性。
  2) 评估指标缺陷：整体放置率从“任意时刻”的43.2%下降到“episode结束”的21.8%；且存在移动错误物体（如移动参考物体而非目标物体）导致关系偶然满足的情况。
  3) 语言理解缺陷：VLM骨干网络在纯文本下也会误解RF指令（如FLUX的文本编码器将RF指令的关系反转）；且给Nano添加图像后，反而破坏了其原本正确的纯文本理解（RF准确率从100%降至89.9%）。

### 22. 🔥 [FlowVLA: Enabling World Dynamics Understanding through Pluggable 3D Flow Learning] (FlowVLA：通过可插拔的3D光流学习实现世界动态理解)
- **研究机构**: `原文未提及具体高校（仅提及韩国电子通信研究院 ETRI 等机构资助）`
- **Arxiv ID**: `2610.16160` | [点击跳转](https://arxiv.org/abs/2610.16160)

**0. 论文标题**
- **英文标题**: FlowVLA: Enabling World Dynamics Understanding through Pluggable 3D Flow Learning
- **中文标题**: FlowVLA：通过可插拔的3D光流学习实现世界动态理解
- **研究机构**: 原文未提及具体高校（仅提及韩国电子通信研究院 ETRI 等机构资助）
- **一句话总结**: 提出一种即插即用的3D光流训练框架（方法创新），仅在训练期利用RGB重建的3D光流作为监督信号，让现有2D VLA模型学会理解3D物理动态，且推理时零额外开销。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中对3D物理世界动态的理解和控制能力。
- **研究动机**: 现有VLA模型过度依赖2D图文预训练先验，容易过拟合到静态视觉线索（如背景、相机视角），缺乏对物理操作相关的3D动态演化的准确表征；而现有引入3D信息的方法通常需要额外的3D传感器输入，且多关注静态3D几何，忽略了与操作直接相关的动态演化，同时面临3D-动作配对数据稀缺和重训成本高的问题。
- **本质改动**: 将3D光流（3D flow）仅作为训练期的特权监督信号，通过双层流监督机制将场景级3D动态蒸馏到控制级（TCP）表示中，从而在不改变推理架构和不增加3D传感器输入的前提下，为2D VLA注入3D动态理解能力。
- **技术溯源**: 基于现有的VLA模型（如 Seer, $\pi_{0.5}$）以及前馈动态重建模型 VDPM（用于从RGB序列恢复时间一致的3D点轨迹）。

**2. 技术拆解**
- **核心方法**: 提出一个由重建引导的、可插拔的3D光流学习框架。利用VDPM从RGB序列中提取时间对齐的3D点轨迹并计算3D位移作为光流目标。设计双层3D光流学习机制：点级光流（Point-Level Flow）监督任务关键3D点的未来位移；TCP级光流（TCP-Level Flow）通过注意力机制将这些点级运动聚合为与机器人末端执行器（TCP）轨迹对齐的控制信号。
- **关键细节**: 
  - 输入输出：输入为历史RGB观测、语言指令和本体感觉状态；输出为动作潜在表示（action latent）及未来的动作序列。
  - 模型结构：在VLA骨干网络外增加轻量级的辅助头（包括点级流预测头和TCP级权重预测头）。训练时附加这些头，推理时完全丢弃。
  - 规模/超参：根据运动幅度选取Top-K个3D点（K=2048表现最佳）进行监督；损失权重 $\lambda_{point}$ 和 $\lambda_{tcp}$ 在仿真和真实世界中分别设为0.005和0.05。
- **训练/优化目标**: 总损失函数为动作损失、点级光流损失（Smooth L1 loss，预测选定3D点的未来位移）和TCP级光流损失（Smooth L1 loss，预测加权聚合后的TCP位移）的加权和。通过TCP级的softmax加权聚合，将场景级动态蒸馏为控制相关的动态。

**3. 实验结果**
- **实验设置**: 
  - 数据集：仿真环境使用 LIBERO 和 LIBERO-Plus 基准；真实世界使用基于 UR5e 机械臂搭建的环境，包含4个长视野基础任务和3个3D感知任务。
  - 对比对象（baseline）：仿真中对比了 Diffusion Policy, OpenVLA, $\pi_0$, CoT-VLA, $\pi_0$-FAST, SpatialVLA, Octo, UniVLA, Seer, $\pi_{0.5}$ 等；真实世界中主要对比 Seer 和 $\pi_{0.5}$ 基线。
- **评价指标**: 任务成功率（Success rate, %），以及在 LIBERO-Plus 和真实世界视角/高度变化下的零样本鲁棒性。
- **主要结果**: 
  - 仿真表现：在 LIBERO-Long 上，Seer 成功率从 80.4% 提升至 87.8%（+7.4%p），$\pi_{0.5}$ 从 92.4% 提升至 94.8%。在 LIBERO-Plus 零样本鲁棒性测试中，Seer 平均成功率从 36.1% 提升至 41.1%。
  - 真实世界表现：在3D感知任务中提升显著，如 Basketball 提升约 20%p（60.0% -> 80.0%），Hang Cup 从 46.7% 提升至 86.7%。在视角变化下，Baseline 成功率为0，FlowVLA达到46.7%；高度变化下从46.7%提升至73.3%。
  - 效率开销：推理时零额外开销，训练时仅增加0.34%参数量，总训练时间增加约1.26倍。

### 23. 🔥 [StreamingWAM: Streaming World Action Modeling via Chunk-Wise Staircase Flow Matching] (StreamingWAM：基于分块阶梯流匹配的流式世界动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.15585` | [点击跳转](https://arxiv.org/abs/2610.15585)

**0. 论文标题**
- **英文标题**: StreamingWAM: Streaming World Action Modeling via Chunk-Wise Staircase Flow Matching
- **中文标题**: StreamingWAM：基于分块阶梯流匹配的流式世界动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出StreamingWAM，将流式扩散范式引入世界动作模型（WAM），通过维护持久动作缓冲区实现单步流式推理，大幅降低稳态重规划延迟并显著提升动作连续性和动态任务成功率。

**1. 整体逻辑**
- **研究任务**: 解决基于预训练视频生成模型的世界动作模型（WAMs）在机器人闭环控制中实时部署的问题，具体为生成平滑、低延迟的连续动作序列。
- **研究动机**: 现有WAM采用非流式推理，每次重规划都从头多步去噪生成完整动作块，并丢弃未执行的尾部。这导致两个耦合问题：1）多步去噪和庞大视频骨干带来高计算成本和推理延迟；2）独立生成的动作块在重规划边界处不一致，导致执行抖动。现有方法通常只能单独优化推理效率或跨块连续性，无法兼顾。
- **本质改动**: 打破“每次从头生成”的范式，引入流式扩散（Streaming Diffusion），将推理过程改为在持久动作缓冲区上进行单步滚动更新，同时利用已执行动作和密集视觉历史作为条件约束，联合解决延迟和连续性问题。
- **技术溯源**: 基于预训练视频生成模型（具体为 Wan2.2-TI2V-5B），架构上基于 Fast-WAM（采用 Mixture-of-Transformers 包含 Video 和 Action 专家）。

**2. 技术拆解**
- **核心方法**: 
  1) 噪声阶梯（Noise Ladder）：将未来动作按执行宽度K分块，分配递增的噪声级别形成阶梯。每次重规划只需单步Euler更新，最前端块去噪至0执行，后端块补充新噪声，实现流式推理。
  2) 前缀回滚模块（Prefix Rollout）：将最近实际执行的干净动作作为无噪声前缀输入，条件化未来动作的去噪过程，保证跨块动作平滑过渡。
  3) 密集视频历史记忆（Dense Video-History）：输入最近m帧视觉观测，提供短期视觉动态上下文，辅助模型感知状态变化。
- **关键细节**: 
  - 模型结构：Mixture-of-Transformers (MoT)，包含30层对齐的Video和Action DiT blocks。Action DiT隐藏层维度1024，24个注意力头。
  - 输入输出：输入为最近视觉观测、任务指令、已执行动作历史（前缀）、未完成的计划（持久缓冲区）。输出为当前可执行的K个动作及更新后的缓冲区。
  - 规模：Video和Action DiT各30层，基于5B参数的视频生成基座。
  - 关键超参：预测视界 H=16，执行宽度 K 训练时从 {1, 2, 4, 8} 均匀采样，推理时通常设为4或8。总噪声级别数 N=32。
- **训练/优化目标**: 
  - 采用加权流匹配（Weighted Flow Matching）。
  - 视频分支：标准流匹配速度回归损失。
  - 动作分支：阶梯动作目标（Staircase action objective）。每个未来动作槽位根据其所在的噪声块分配特定的噪声级别和权重，前缀动作仅作为条件不参与Loss。训练时80% batch使用阶梯目标，20%使用共享时间步目标（用于首帧warm-up）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：仿真使用 LIBERO、LIBERO-Plus（含10,030个扰动实例）、RoboTwin 2.0（双臂，含clean和随机化设置）；真机使用 Franka Research 3 机械臂，包含静态（如叠块、开抽屉）和动态（如传送带交接、追车、打地鼠）任务。
  - 对比对象：13个baseline，包括VLA（如 $\pi_0$, $\pi_{0.5}$, OpenVLA-OFT 等）和WAM（如 Fast-WAM, Fast-WAM-Joint, Faster-WAM 等）。核心直接对比基线为 Fast-WAM-Joint。
  - 测试环境：仿真在 RTX 5090 GPU 上运行；真机控制频率 15Hz，配备 2个外部 RealSense 和 1个腕部 ZED Mini 相机。
- **评价指标**: 
  - 任务成功率（%），打地鼠任务为有效按压次数。
  - 延迟指标：首次动作时间（TTFA）和稳态重规划延迟（steady-state replanning latency）。
  - 连续性指标：边界与内部跳跃比（boundary-to-interior jump ratio）、全局平移加速度代理（global translation jerk）。
- **主要结果**: 
  - 成功率：在无具身预训练的WAM中表现最好。LIBERO 98.7%，LIBERO-Plus 79.4%（比 Fast-WAM-Joint 高 10.6%）。真机5个操作任务总成功率 67.2%（168/250），大幅领先 baseline 的 48.0%（120/250），在动态任务（传送带 32/50，追车 20/50）优势尤为明显。
  - 延迟：稳态重规划延迟降至仿真的 72.9 ms 和真机的 57.3 ms，相比 10步的 Fast-WAM-Joint 分别加速 5.2倍 和 6.4倍。
  - 连续性：动作更平滑，LIBERO-Plus 上边界跳跃比从 1.840 降至 1.105，全局平移 jerk 降低 59.0%。对执行horizon K的敏感性（Spread）从 35.75 个百分点大幅压缩至 6.50 个百分点。

### 24. 🔥 [CoLA: Multi-VLA Coordination via Learned Adapters] (CoLA：通过学习的适配器实现多VLA协调)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.15337` | [点击跳转](https://arxiv.org/abs/2610.15337)

**0. 论文标题**
- **英文标题**: CoLA: Multi-VLA Coordination via Learned Adapters
- **中文标题**: CoLA：通过学习的适配器实现多VLA协调
- **研究机构**: 原文未提及
- **一句话总结**: 在冻结的VLA骨干网络上外挂轻量级消息通道与动作头，实现多机械臂的去中心化协调，并实证了显式通信仅在任务信息私有（部分可观测）时才不可或缺。

**1. 整体逻辑**
- **研究任务**: 多机械臂/多智能体协作操作（如物品交接、托盘传递），要求多个基于VLA（视觉-语言-动作）模型的机械臂在共享工作区中进行实时、去中心化的行为协同。
- **研究动机**: 现有的VLA模型通常作为单智能体策略部署，缺乏多智能体间的自然协调能力。端到端训练多臂策略需要稀缺的多机器人数据且会破坏单智能体预训练；基于LLM的协调器延迟太高（0.5-1 Hz）无法满足实时操作；且实际部署的机器人通常使用固定的设备端骨干网络，权重难以修改或微调成本过高。
- **本质改动**: 保持每个智能体的VLA骨干网络完全冻结，仅在其上训练轻量级的消息编码器/解码器（通信通道）和基于扩散模型的动作头，通过显式的消息传递在去中心化执行下实现协调。
- **技术溯源**: 基于预训练的 VLA 骨干网络（如 Octo-Base, $\pi_{0.5}$），结合了扩散策略（Diffusion Policy）的动作生成机制（1D temporal U-Net）和模仿学习（行为克隆）。

**2. 技术拆解**
- **核心方法**: 提出 CoLA (Coordination via Learned Adapters) 架构。丢弃原VLA骨干的默认动作头，为每个智能体训练三个模块：潜在消息编码器（将本地特征压缩为低维消息向量）、伙伴消息解码器（将接收到的消息映射回本地特征空间）、以及条件化的扩散动作头（将自身特征与解码后的伙伴特征拼接，通过FiLM条件化U-Net预测动作块）。
- **关键细节**: 
  - **输入输出**: 输入为本地RGB图像、本体感觉状态和任务指令；输出为 $K=10$ 步的动作块（7维：6维关节目标+1维二值化夹爪）和夹爪开合的logits。
  - **模型结构**: 消息编码器为2层MLP（输出维度 $d_m=64$）；解码器为每个有序智能体对独立训练的2层MLP；动作头为带FiLM条件化的1D时序U-Net，外加一个独立的二值分类头预测夹爪。
  - **规模**: 可训练参数量极小（如基于Octo-Base时约14.5M，其中通信通道仅占0.33M），骨干网络（93M的Octo或3.3B的$\pi_{0.5}$）完全冻结且特征离线缓存。
  - **关键超参**: 控制频率50Hz，推理频率5Hz（每0.2s预测一次），动作块长度 $K=10$，扩散步数 $S=100$（推理时用10步DDIM），本体感觉Dropout率0.1以防策略走捷径。
- **训练/优化目标**: 基于行为克隆（Behavioral Cloning）的模仿学习。损失函数包括两部分：基于余弦调度扩散模型的关节动作噪声预测MSE损失，以及夹爪二值分类的BCE损失（权重 $\lambda=0.25$）。梯度通过通信通道反向传播，使得编码器学习发送伙伴所需的消歧信息。采用离线特征缓存（Offline Feature Caching）大幅降低训练算力消耗。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: MuJoCo仿真环境中的三个任务（遮挡托盘交接、双臂交接、三臂交接链），使用脚本专家生成的多智能体演示数据。
  - **对比对象（baseline）**: 独立去中心化策略（仅训练动作头或全量微调）、集中式策略（共享所有观测）、CoLA零消息消融（验证通信必要性）、以及基于 $\pi_{0.5}$ 的LoRA微调基线。
- **评价指标**: 任务成功率（Success rate），即是否成功完成交接或放置到正确托盘。对于托盘任务，还评估了放置到正确托盘的条件概率。
- **主要结果**: 
  - **通信的必要性取决于信息结构**: 在信息私有（遮挡托盘交接，仅一臂可见颜色标记）时，CoLA成功率达76.0%，远超无通信的22.7%；若将CoLA的消息置零，成功率暴跌至1.3%，证明通信在此场景下不可或缺。在信息完全共享（双臂/三臂交接，带全局顶部相机）时，CoLA（90.6% / 63.5%）与消息置零版本（88.3% / 60.0%）表现相近，说明在完全可观测时显式通信是冗余的，性能提升主要来自CoLA的动作头架构。
  - **跨骨干泛化与参数效率**: 在冻结的 $\pi_{0.5}$ 骨干上，CoLA仅用8.5M参数（训练0.2 GPU小时）即达到37.3%的整体成功率，且正确放置率达71.8%；而全量LoRA微调（467M参数，24.4 GPU小时）虽放置率100%但选对托盘仅34.7%（随机水平），整体成功率34.7%。CoLA用极小代价实现了有效的私有信息传递。

### 25. 🔥 [RM-WAM: Reliable Memory-Augmented World Action Models for Long-Horizon Robot Manipulation] (RM-WAM：用于长视野机器人操作的可靠记忆增强世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.15305` | [点击跳转](https://arxiv.org/abs/2610.15305)

**0. 论文标题**
- **英文标题**: RM-WAM: Reliable Memory-Augmented World Action Models for Long-Horizon Robot Manipulation
- **中文标题**: RM-WAM：用于长视野机器人操作的可靠记忆增强世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种带双尺度记忆和反事实效用评估的世界动作模型（WAM），通过自适应过滤历史记忆中的无用或干扰信息，显著提升了机器人在长视野操作任务中的世界预测与决策能力。

**1. 整体逻辑**
- **研究任务**: 长视野机器人操作任务中的世界状态预测与动作生成（World Action Modeling）。
- **研究动机**: 现有的世界动作模型（WAM）或视觉-语言-动作模型（VLA）主要依赖当前帧做决策，在长视野任务中，视觉相似的状态可能处于完全不同的任务阶段，导致决策错误。现有的记忆增强方法（如 MemoryVLA）直接把历史观测塞进模型，但没有评估这些记忆是否真的“有用”。过时、阶段错位或被闭环误差污染的历史信息，反而会严重干扰世界状态的预测。
- **本质改动**: 把记忆从“默认有用的全局上下文”转变为“依赖当前上下文评估效用的选择性预测资源”。通过反事实学习让模型自己判断历史记忆在当前决策点到底有没有用，并只注入有用的部分。
- **技术溯源**: 基于 Wan2.2-TI2V-5B（视频生成基座）、Diffusion Transformer (DiT)、Flow Matching 以及 Mixture-of-Transformers (MoT) 架构。

**2. 技术拆解**
- **核心方法**: 提出 RM-WAM 框架，核心包含两部分：一是双尺度记忆表示（短期视觉记忆 + 潜在事件记忆），分别捕捉局部交互和长期状态转换；二是基于反事实记忆学习的效用感知门控机制，用于自适应控制记忆的注入强度。
- **关键细节**: 
  - **输入输出**: 输入当前观测、语言指令、本体感觉和历史记忆；输出未来视觉状态（世界预测）和动作块（动作生成）。
  - **模型结构**: 视频分支采用 Wan2.2-TI2V-5B (Video DiT)，动作分支采用 30层 Expert DiT，两者通过 MoT 交互。
  - **短期视觉记忆**: 取最近 4 帧，用共享 VAE 编码后，通过时间编码器在空间位置上聚合，经门控机制注入当前视觉 token，补充局部交互状态（如遮挡、小位移）。
  - **潜在事件记忆**: 在潜在空间按 16 步间隔采样历史状态转换，构建 4 个事件候选。用当前视觉做 Query 进行注意力聚合，通过 AdaLN-Zero 风格调制注入未来视觉 token，捕捉长期状态转换。
  - **规模与超参**: 动作块长度为 32，控制频率 30Hz。
- **训练/优化目标**: 
  - **联合损失**: 动作和视觉的 Flow Matching 损失 + 潜在事件记忆的未来转换预测损失 (SmoothL1) + 记忆效用门控的二分类交叉熵损失 (BCE)。
  - **反事实学习**: 构造四种历史条件（因果对齐的参考、时间过时的、阶段错位的、跨 episode 的），赋予不同的软效用标签（如 1.0 或 0.01）。模型在保持当前输入和目标不变的情况下，学习区分这些条件，从而让门控网络学会根据当前上下文动态调节记忆注入强度。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmarks**: 仿真环境使用 LIBERO（含 Spatial, Object, Goal, Long 四个子集）和 RMBench（强依赖记忆的双臂操作）；真实世界使用双臂桌面整理任务（Organize Table，含 Standard, Disturbance, Unseen 三种测试设置）。
  - **对比对象 (Baseline)**: Diffusion Policy (DP), $\pi_{0.5}$, FastWAM, HiMem-WAM。
- **评价指标**: 任务成功率 (Success rate, %)。
- **主要结果**: 
  - **LIBERO**: RM-WAM 平均成功率 98.5%，在 Long 子集达到 97.0%，优于 HiMem-WAM (97.7%) 和 FastWAM (97.6%)，证明双尺度记忆对长视野决策有帮助。
  - **RMBench**: RM-WAM 平均成功率 55.8%，大幅领先 HiMem-WAM (26.3%) 和 $\pi_{0.5}$ (10.4%)。这表明在强依赖历史的任务中，评估“记忆是否有用”比单纯“增加记忆”关键得多。
  - **真实世界**: 在 Standard、Disturbance、Unseen 设置下，成功率分别达到 90.0%、83.3%、86.7%，均显著优于 FastWAM（80.0%、70.0%、76.7%）。特别是在 Disturbance（抗干扰）设置下，RM-WAM 能利用可靠的历史上下文重新评估任务状态并从干扰中恢复。

### 26. 🔥 [BridgeWAM: Bridging Video and Action Experts via Latent Bridge Queries] (BridgeWAM：通过潜在桥接查询连接视频与动作专家)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.14746` | [点击跳转](https://arxiv.org/abs/2610.14746)

**0. 论文标题**
- **英文标题**: BridgeWAM: Bridging Video and Action Experts via Latent Bridge Queries
- **中文标题**: BridgeWAM：通过潜在桥接查询连接视频与动作专家
- **研究机构**: 原文未提及
- **一句话总结**: 提出Bridge-of-Experts架构，利用32个潜在桥接查询（LBQs）在紧凑潜在空间内解耦视频与动作专家，在保持高任务成功率的同时大幅降低推理计算开销。

**1. 整体逻辑**
- **研究任务**: 具身智能中的世界动作模型（World Action Models, WAMs）训练与推理，即根据视觉观察、语言指令和本体状态预测机器人动作。
- **研究动机**: 现有WAM（如基于MoT的模型）通过逐层密集注意力耦合视频和动作专家，导致动作预测易受无关视觉特征干扰，且强制两者深度匹配带来大量冗余参数和计算开销。
- **本质改动**: 摒弃逐层密集耦合，引入由32个潜在桥接查询（LBQs）构成的紧凑潜在空间作为信息桥梁，解耦视频和动作专家的网络深度。
- **技术溯源**: 基于视频生成模型 Wan2.2-TI2V-5B（作为Video Expert基座），以及现有的世界动作模型范式（如Fast-WAM、Motus等）。

**2. 技术拆解**
- **核心方法**: 提出Bridge-of-Experts (BoE) 架构。在Video Expert内部，32个LBQs聚合当前帧视觉、语言和状态先验；Action Expert通过交叉注意力从LBQs中读取信息。联合视频-动作监督使动作梯度通过LBQs反向传播，引导Video Expert学习对动作有用的视觉表示。
- **关键细节**: 
  - Video Expert：30层Video DiT，LBQs在每层只读取当前帧和LBQ的K/V，屏蔽未来视频token。
  - Action Expert：极轻量的2层Action DiT，采用交替的交叉注意力（读LBQs）和自注意力（协调动作chunk）。
  - 规模：总参数量5.06B。
  - 推理优化：LBQs在动作去噪的每一步中复用，无需重复计算。
- **训练/优化目标**: 联合优化视频和动作的Flow-matching损失（权重相等）。视频损失更新Video Expert和LBQs，动作损失通过可微的LBQ路径更新Action Expert、投影层、LBQs以及Video Expert。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO, LIBERO-Plus, LIBERO-Pro, RoboTwin 2.0，以及真实机器人操作任务（PiPER X平台）。
  - 对比对象（baseline）：OpenVLA, $\pi_0$, $\pi_{0.5}$, LingBot-VA, Motus, Fast-WAM, Faster-WAM, OpenWAM-$\alpha$。
  - 测试环境：仿真环境及NVIDIA H20Z / RTX 5090 GPU上的真机部署。
- **评价指标**: 任务成功率（%），推理延迟（ms），计算量（FLOPs），以及视频生成质量（FID, FVD等）。
- **主要结果**: 
  - 仿真任务：在LIBERO上平均成功率98.25%（比Fast-WAM高1.45%）；在LIBERO-Plus零样本泛化中达72.24%（Fast-WAM为49.5%）；在RoboTwin 2.0随机化设置下成功率90.22%。
  - 真机部署：在多种扰动下稳定执行任务，推理延迟降至77.1 ms。
  - 效率提升：相比Fast-WAM，单样本推理FLOPs减少28.72%（1.460T vs 2.048T），H20Z推理延迟从405.91 ms降至88.05 ms（4.61倍加速）；相比Faster-WAM，参数量减少约9%（5.06B vs 5.56B），延迟降低至约1/3.65。

### 27. 🔥 [CAG-WAM: Causal Action-Gain World Action Models for Robot Manipulation] (CAG-WAM：用于机器人操作的因果动作增益世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.14720` | [点击跳转](https://arxiv.org/abs/2610.14720)

**0. 论文标题**
- **英文标题**: CAG-WAM: Causal Action-Gain World Action Models for Robot Manipulation
- **中文标题**: CAG-WAM：用于机器人操作的因果动作增益世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 针对机器人世界模型中环境自身演变干扰动作评估的问题，引入因果推断计算“因果动作增益”，通过对比动作未来与环境自然未来，在训练和推理阶段更精准地评估和修正机器人动作。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的动作评估与策略学习（基于世界动作模型 World Action Models, WAMs）。
- **研究动机**: 现有的 WAMs 在预测未来时，预测结果混杂了“动作引起的变化”和“环境自身演变（如被动运动、外部干扰）”。直接评估这个混合未来会导致误判（例如：动作本身搞砸了，但环境自然演变很好，导致整体评分依然很高；反之亦然）。
- **本质改动**: 用因果推断（结构因果模型 SCM）剥离环境演变的混淆变量，通过计算“动作条件未来”与“环境自然未来”的评估差值（因果动作增益 CAG），来纯粹衡量动作本身带来的收益。
- **技术溯源**: World Action Models (WAMs), Flow-matching (DiT 架构), Group Relative Policy Optimization (GRPO)。

**2. 技术拆解**
- **核心方法**: 提出 CAG-WAM 框架，包含动作生成模型（FC-AM）和成对未来预测模型（PF-WM）。PF-WM 同时预测“执行该动作的未来”和“不执行该动作的环境自然未来”。两者的评估差值即为因果动作增益（CAG）。训练时用 CAG 作为 GRPO 的优势函数；推理时用 CAG 判断是否需要利用未来预测反馈进行动作修正。
- **关键细节**: 
  - **FC-AM**：基于 DiT 骨干的 Flow-matching 模型，生成动作块（action chunks），并支持接收未来反馈进行二次生成。
  - **PF-WM**：动作条件视频世界模型，预测未来观测序列。
  - **关键超参**：训练时采样 K=8 个候选动作；推理时修正阈值 δ=0.05，反馈权重 γ=1.0，动作融合权重 λ=0.30。
- **训练/优化目标**: 
  - **训练阶段**：将 CAG 作为 Group Relative Policy Optimization (GRPO) 中的 advantage（优势），通过 clipped objective 优化策略，鼓励正增益动作，抑制负增益动作。
  - **推理阶段**：计算初始动作的 CAG，若低于阈值，则提取动作未来与环境未来表征的差异作为反馈，输入 FC-AM 生成修正动作，并与初始动作加权融合后执行。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmarks**：RoboCasa（24个任务，涵盖 Pick&Place、Door 等 7 类操作技能）和 LIBERO（4 个任务套件：Spatial, Object, Goal, Long）。
  - **Baselines**：3D Diffuser Actor, DP3, Diffusion Policy, GR00T N1, FPV, Octo, OpenVLA, TraceVLA, SpatialVLA, UniVLA, UVA, Video Policy, LingBot-VA, Cosmos Policy-Predict2, Cosmos Policy-Predict2.5。
- **评价指标**: 任务成功率 (Task success rate, %)。
- **主要结果**: 
  - **RoboCasa**：平均成功率 74.2%，在各类操作技能上均取得领先（如 Pick&Place 60.8%, Door 92.0% 等），优于 Cosmos Policy-Predict2.5 (71.5%)。
  - **LIBERO**：平均成功率 99.8%，在 Object 和 Goal 套件上达到 100%，优于 Cosmos Policy-Predict2.5 (98.3%) 和 LingBot-VA (98.5%)。
  - **定性分析**：可视化案例表明，在发生滑动等干扰时，模型能通过未来修正机制调整后续动作并恢复完成任务。

### 28. 🔥 [PRISM: Precision Forcing for Generalist Vision-Language-Action Policies] (PRISM：面向通用视觉-语言-动作策略的精度强制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.14704` | [点击跳转](https://arxiv.org/abs/2610.14704)

**0. 论文标题**
- **英文标题**: PRISM: Precision Forcing for Generalist Vision-Language-Action Policies
- **中文标题**: PRISM：面向通用视觉-语言-动作策略的精度强制
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出一种仅修改训练过程的“精度强制”策略（PRISM），通过离线评估物理精度需求并重加权流匹配损失与正则化VLM表征，大幅提升通用VLA模型在亚毫米级高精度操作任务中的成功率，且不改变推理架构。

**1. 整体逻辑**
- **研究任务**: 提升通用视觉-语言-动作（VLA）策略在需要高精度物理交互（如亚毫米级连接器插入、螺丝拧紧）任务中的可靠性与成功率。
- **研究动机**: 现有VLA模型在常规任务上表现良好，但在高精度任务中容易失败。根本原因是训练时的流匹配（flow-matching）目标在上下文和流时间上平均分配误差惩罚，导致决定任务成败的少数高精度关键时刻分配到的监督信号严重不足（作者将其定义为“流时间饥饿” Flow-Time Starvation）。
- **本质改动**: 提出“精度强制”训练范式，根据上下文相关的物理精度需求，动态调整动作监督的分配权重，并强迫VLM的条件表征学习并编码这种精度需求，让模型在训练时“知道”何时需要更高精度。
- **技术溯源**: 基于预训练视觉语言模型（VLM）结合流匹配（Flow-matching）动作专家的VLA架构（如 $\pi_0$, $\pi_{0.5}$, StarVLA 等）。

**2. 技术拆解**
- **核心方法**: PRISM 包含三个核心组件：
  1. **PPS（本体感觉精度评分）**：离线从机器人轨迹（关节位移、末端执行器位移、夹爪状态）中计算帧级别的精度需求标签。
  2. **PSW（精度缩放加权）**：结合离线精度需求、流时间强调（clean-end emphasis）和信噪比(SNR)门控，对flow-matching损失进行重加权，把监督集中在精度要求高且动作信号从噪声中可见的地方。
  3. **CPR（条件精度正则化）**：在VLM条件表征上增加一个轻量级MLP头来预测精度需求，使VLM的表征能够感知并编码精度需求。
- **关键细节**: 输入为视觉、语言和机器人本体感觉，输出为动作chunk。VLM骨干使用 Qwen3-VL-4B 或 PaliGemma (2B)，动作专家为流匹配网络。PSW 引入超参控制干净端强调和SNR可见性门控，确保只在动作信号显现时才放大监督。推理时完全丢弃辅助头和离线标签，不改变ODE求解器和模型架构。
- **训练/优化目标**: 总损失为 PSW 重加权后的流匹配损失（$\mathcal{L}_{PSW}$）加上 CPR 的均方误差辅助损失（$\mathcal{L}_{CPR}$）。核心机制是通过数据驱动的代理指标估算物理容差需求，从而指导梯度分配，而非直接修改网络结构。

**3. 实验结果**
- **实验设置**: 仿真使用 RLBench-10 和 LIBERO 数据集；真机使用自建的 MSSM（多阶段亚毫米容差操作）环境，包含三个任务：驱动器连接器插入（0.15mm容差）、双臂连接器对接（0.1mm容差）和螺丝拧紧（0.2mm容差）。对比基线包括 OpenVLA, SpatialVLA, $\pi_0$, StarVLA, CoT-VLA 等主流VLA模型，以及 DAgger 方法。
- **评价指标**: 任务端到端成功率（Success Rate, SR）和成功 trials 的平均完成时间。
- **主要结果**: 在保持或提升通用任务（RLBench/LIBERO）性能的同时，真机 MSSM 任务的平均端到端成功率从 38.3% 大幅提升至 86.7%。具体而言，连接器插入成功率从 35% 升至 95%，双臂对接从 35% 升至 80%，螺丝拧紧从 45% 升至 85%，显著优于 DAgger（平均 65%），且成功 trials 的平均耗时更短，证明了该方法在不增加新传感器的前提下有效拓展了VLA策略的精度边界。

### 29. 🔥 [Remembering What Matters for Long-Horizon Robotic World Models] (长时程机器人世界模型中记住真正重要的信息)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.14583` | [点击跳转](https://arxiv.org/abs/2610.14583)

**0. 论文标题**
- **英文标题**: Remembering What Matters for Long-Horizon Robotic World Models
- **中文标题**: 长时程机器人世界模型中记住真正重要的信息
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种免训练的推理期上下文调度方法 ReCAP，通过保留初始场景锚点和最近的视觉-动作块、剔除陈旧历史，解决了长时程自回归机器人视频世界模型中的“记忆角色冲突”问题，在提升长时程预测质量的同时大幅降低了 KV Cache 显存占用。

**1. 整体逻辑**
- **研究任务**: 提升基于离散视觉 token 的自回归机器人视频世界模型在长时程（long-horizon）推理时的预测质量和计算效率。
- **研究动机**: 现有的全上下文（Full Context）解码策略保留了所有生成的历史。但随着上下文变长，持久的场景信息、最近的视觉-动作状态和陈旧的生成历史会竞争注意力（即“记忆角色冲突”）。这导致模型对最近状态的关注度下降，预测出现结构缺失、动作响应减弱和运动漂移，同时 KV Cache 无限增长。
- **本质改动**: 在推理阶段（免训练、不改模型参数）重新组织上下文，只保留初始场景锚点和最近的连续视觉-动作块，直接驱逐中间陈旧的生成历史，把长时程推理从“保留更多历史”转变为“保留正确的历史”。
- **技术溯源**: 基于自回归 Transformer 架构的机器人视频世界模型（如 RLVR-World, iVideoGPT, RobotAlign-R1），以及离散视觉 tokenizer（如 RT-1 tokenizer）。

**2. 技术拆解**
- **核心方法**: ReCAP (Receding Context with Anchor Preservation)。在推理时，将上下文分为三部分：固定的初始场景锚点（包含真实初始观察的场景上下文和初始动力学/动作 token）、最近的 W 个完整视觉-动作块、以及被驱逐的陈旧历史。每次生成新块后，滑动窗口更新最近块，保持上下文长度有界。
- **关键细节**: 
  - 输入输出：输入为初始观察序列和动作序列，输出为未来观察的视觉 token。
  - 模型结构：冻结的预训练 tokenizer、自回归世界模型（如 127.1M 参数的 Transformer）和视觉解码器。
  - 规模/超参：在评估的 1931-token 配置中，Anchor 包含 1280 个场景 token 和 1 个 93-token 的初始动力学-动作块，最近窗口 W=6（每个块 93 tokens）。
  - 操作在 token 和 KV-cache 空间进行，不将生成的 token 解码回图像再重新编码，保持块内结构和时间顺序。
- **训练/优化目标**: 无需训练。优化目标是在有限的上下文预算内，最小化长时程预测误差，同时保持模型参数固定。

**3. 实验结果**
- **实验设置**: 
  - 数据集：BridgeV2, RT-1, LIBERO-90, CALVIN。
  - 对比对象（baseline）：Full Context（全上下文解码）。
  - 骨干模型：RLVR-World, iVideoGPT, RobotAlign-R1。
  - 系统测试环境：单张 NVIDIA H20 GPU，使用 vLLM 0.13.0 (BF16) 进行效率测试。
- **评价指标**: 
  - 视觉保真度：PSNR, SSIM, LPIPS。
  - 机器人结构与轨迹一致性：Arm Score, Shape IoU, nDTW。
  - 语义与交互质量：使用 VLM（Qwen3-VL, InternVL3, GPT-5.5）进行盲评打分。
  - 系统效率：逻辑 KV Cache 大小，p50 延迟，并发吞吐量。
- **主要结果**: 
  - 预测质量：在所有 36 个数据集-骨干-指标组合中均优于 Full Context。例如在 BridgeV2 上，RLVR-World 的 LPIPS 从 0.390 降至 0.143（降低 63.3%），nDTW 从 0.199 升至 0.590。在长时程（H=64）鲁棒性上，RT-1 的 LPIPS 从 0.233 降至 0.204。
  - 语义评价：三个 VLM judges 在所有 12 个评判标准上均给 ReCAP 更高分数。
  - 效率提升：在 H=64 时，活跃 token 从 7232 降至 1931（减少 73.3%），逻辑 KV Cache 从 254.25 MiB 降至 67.89 MiB（减少 73.3%），p50 延迟降低 6.51%（从 312.95ms 降至 292.57ms），256 并发请求下吞吐量提升 4.28 倍。

### 30. 🔥 [PILOT: Guiding Long-Horizon World-Model Planning for Robot Manipulation with Visual Subgoals and Policy Priors] (PILOT：通过视觉子目标与策略先验引导机器人操作的长时域世界模型规划)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.14335` | [点击跳转](https://arxiv.org/abs/2610.14335)

**0. 论文标题**
- **英文标题**: PILOT: Guiding Long-Horizon World-Model Planning for Robot Manipulation with Visual Subgoals and Policy Priors
- **中文标题**: PILOT：通过视觉子目标与策略先验引导机器人操作的长时域世界模型规划
- **研究机构**: 原文未提及
- **一句话总结**: 提出 PILOT 框架，通过视频模型生成中间视觉子目标，并用微调的策略网络初始化 CEM 优化器，解决了机器人长时域操作中世界模型规划缺乏中间引导和动作搜索效率低的问题。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人操作领域的方法创新工作。任务是让机器人根据最终目标图像，完成包含靠近、抓取、搬运、放置等多个交互阶段的长时域目标条件操作。
- **研究动机**: 现有的潜在世界模型规划在长时域任务中面临两个痛点：1）遥远的最终视觉目标无法为准备动作提供有效的中间引导，导致规划器陷入局部最优（例如为了暂时减少视觉距离而放弃必要的抓取动作）；2）基于采样的优化器（如 CEM）在庞大的动作空间中进行盲目采样，导致局部优化效率极低。
- **本质改动**: 将长时域规划解耦为“任务推进”和“局部动作优化”：用视频预测模型生成中间视觉子目标提供时间引导，同时用学习到的策略先验来初始化 CEM 的动作搜索空间，从而在短预测视界内实现高效的长时域规划。
- **技术溯源**: 基于 JEPA-WM（动作条件世界模型与编码器）、Wan2.1-1.3B（视频预测模型）、$\pi_0$（策略先验网络）以及 CEM（交叉熵方法优化器）。

**2. 技术拆解**
- **核心方法**: PILOT 框架。包含三个核心组件：1）视频模型生成中间视觉子目标；2）策略先验初始化 CEM；3）动作条件世界模型进行在线局部动作优化（MPC）。
- **关键细节**: 
  - 输入输出：输入当前视觉观测和语言指令，输出机械臂的末端执行器位移和夹爪动作。
  - 视频模型：使用微调后的 Wan2.1-1.3B 预测未来视频，并从中均匀采样 $K$ 个视觉子目标（真实世界实验中 $K=6$）。
  - 策略先验：使用微调后的 $\pi_0$ 网络预测动作序列，作为 CEM 的初始均值。
  - 世界模型与优化：使用 JEPA-WM 在潜在空间预测未来状态。CEM 在策略先验初始化的高斯分布上采样，计算候选动作到当前子目标的潜在 L2 距离作为 Cost，迭代更新分布。
  - 执行机制：采用后退视界控制，预测视界 $h=2$，每次执行 $h_{exec}=1$ 步。每个子目标分配固定的 $R=2$ 次规划-执行周期。
- **训练/优化目标**: 
  - 模型训练：视频模型和策略网络在少量专家演示（真实世界40个，仿真中更多）上进行微调；世界模型在演示和随机交互数据上训练。
  - 规划优化目标：最小化预测的潜在状态与当前视觉子目标潜在表示之间的 L2 距离（$J_k = \|\hat{z}_{t+h} - z_{g_k}\|_2^2$）。

**3. 实验结果**
- **实验设置**: 
  - 真实世界：UR5e 机械臂，4个桌面抓取放置任务（Cup, Pencil Case, Bowl-Box, Bowl-Bowl），每个任务20次试验。对比方法包括：Flat WM（无子目标无先验）、Policy only（纯策略执行）、PILOT w/o prior（有子目标无先验）、PILOT。
  - 仿真：Push-T（改变任务长度）和 LIBERO-10（10个语言条件桌面操作任务）。对比方法增加了 Flat WM + prior 和 PILOT (oracle，使用专家子目标)。
- **评价指标**: 任务成功率（Success rate），以及规划效率（成功率与平均规划时间的权衡，CEM 迭代过程中的 Cost 下降速度）。
- **主要结果**: 
  - 真实世界：PILOT 平均成功率 68.8%，显著优于 PILOT w/o prior (55.0%)、Policy only (13.8%) 和 Flat WM (0.0%)。
  - 仿真 Push-T：在长任务中，PILOT (53.3%) 比直接执行同一策略 (23.3%) 高出 30 个百分点；比 PILOT w/o prior (40.0%) 也有显著提升。
  - 仿真 LIBERO-10：PILOT 成功率 60.0%，比 Policy only (38.0%) 高 22 个百分点。
  - 规划效率：策略初始化大幅加速局部优化。在 Push-T 中，CEM 使用策略初始化仅需 4 次迭代即可达到通用初始化 10 次迭代的 Cost，且在相同采样预算下最终 Cost 降低 24.1%。在有限规划时间预算下，策略初始化能维持更高的成功率。

### 31. 🔥 [Axiom-0: Hierarchical Self-Refinement for Vision-Language-Action Policies] (Axiom-0：视觉-语言-动作策略的层次化自精炼)
- **研究机构**: `4Axiom Robotics`
- **Arxiv ID**: `2610.14155` | [点击跳转](https://arxiv.org/abs/2610.14155)

**0. 论文标题**
- **英文标题**: Axiom-0: Hierarchical Self-Refinement for Vision-Language-Action Policies
- **中文标题**: Axiom-0：视觉-语言-动作策略的层次化自精炼
- **研究机构**: 4Axiom Robotics
- **一句话总结**: 提出了一种VLA策略Axiom-0，通过在训练时对齐VLM中间层特征与空间基础模型特征，并在推理前对VLM输出的条件特征进行递归精炼，在不明显增加延迟的情况下，大幅提升了机器人在复杂和未见任务中的操作成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在未见任务组合和分布偏移下的泛化能力与操作可靠性。
- **研究动机**: 现有VLA模型（如π0、Xiaomi-Robotics-1）在中间多模态表征的信息保留上存在不足，且动作生成器无法充分、有效地利用这些表征，导致在面对未见过的任务组合时性能下降。
- **本质改动**: 将“训练时的表征监督”与“推理前的接口特征递归精炼”结合，并进行联合优化，实现“先精炼特征、再生成动作”的层次化策略。
- **技术溯源**: 基于 Xiaomi-Robotics-1 的 VLM-DiT 架构（视觉语言模型 + 扩散Transformer），引入空间基础模型（Spatial foundation model）作为对齐参考，以及循环Transformer（Looped Transformer）进行特征精炼。

**2. 技术拆解**
- **核心方法**: 
  1. **IVRR（VLM内表征精炼）**：训练阶段，通过可学习投影层将VLM选定中间层的视觉特征，与预训练空间基础模型提取的参考特征进行一致性对齐监督。
  2. **VAIR（VLM-动作接口精炼）**：推理阶段（动作生成前），将VLM输出的条件键值对（K, V）中的V投影到紧凑潜空间，通过共享参数的循环Transformer进行多次递归更新，计算残差修正并通过门控机制加回原V，从而精炼输入给DiT动作生成器的条件特征。
- **关键细节**: 
  - **输入输出**：输入多视角观测、指令和机器人状态，输出动作块（Action chunk）。
  - **架构与规模**：VLM生成条件特征，DiT预测流匹配（Flow-matching）的速度场。VAIR在每次观测更新时运行一次，精炼后的缓存（Cache）在DiT的5步Euler采样中复用，不增加每步计算。
  - **训练策略**：分两阶段。Stage I（16000步）联合优化VLM、DiT和IVRR投影；Stage II（2000步）固定部分VLM层，联合优化被监督的VLM层、VAIR和DiT。推理时移除IVRR辅助分支。
- **训练/优化目标**: 
  - **Stage I**：动作损失（DiT速度回归） + λ × 一致性对齐损失（投影后的VLM特征与空间基础模型特征的距离）。
  - **Stage II**：仅动作损失，但联合优化指定的VLM层、VAIR参数和DiT参数。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboCasa365 (target-50 multi-task evaluation suite)，包含 Atomic-Seen, Composite-Seen, Composite-Unseen 三个子集，共评估2500个episode。RoboCasa特定训练仅使用 pretrain_human300 数据。
  - **对比对象（baseline）**：Paimon-0, Xiaomi-Robotics-1, Phasor-m7, π0, π0.5 等 RoboCasa365 榜单方法。
  - **测试环境**：推理延迟测试在单张 NVIDIA RTX PRO 5000 (72GB) 上进行，batch size为1。
- **评价指标**: 任务成功率（%），以及推理延迟（Mean/Median/P95 latency）、参数量、FLOPs、显存占用。
- **主要结果**: 
  - 在 RoboCasa365 上，Axiom-0 整体成功率达到 62.32%，比榜单最高分 Paimon-0 (58.1%) 高 4.22 个百分点，比基座 Xiaomi-Robotics-1 (57.4%) 高 4.92 个百分点。在未见组合（Composite-Unseen）上提升尤为明显（相比基座提升 5.52 个百分点）。
  - 消融实验证明 IVRR 和 VAIR 各自有效且互补，结合后效果最好。
  - 推理开销极小：相比 Xiaomi-Robotics-1，平均延迟仅增加 2.30 ms（1.73%），参数量增加 14.7M（0.287%），显存增加 55 MiB。

### 32. 🔥 [Thinker-WM: A Unified World Model with Shared Multimodal Representations for Embodied Intelligence] (Thinker-WM：用于具身智能的共享多模态表示统一世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.18447` | [点击跳转](https://arxiv.org/abs/2610.18447)

**0. 论文标题**
- **英文标题**: Thinker-WM: A Unified World Model with Shared Multimodal Representations for Embodied Intelligence
- **中文标题**: Thinker-WM：用于具身智能的共享多模态表示统一世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个在共享中间表示层联合建模 RGB、深度和机器人动作的统一世界模型，通过单一参数化支持多种具身生成与控制功能，并在多个主流具身世界模型基准测试中取得第一。

**1. 整体逻辑**
- **研究任务**: 构建一个能同时预测未来视觉外观、物理几何结构和可执行机器人动作的具身世界模型，并支持联合生成、策略推理、条件生成等多种功能。
- **研究动机**: 现有的具身世界-动作模型（WAMs）通常是碎片化的，视觉、几何和动作往往通过独立的接口、条件机制或特定参数化进行耦合，缺乏在共享表示空间中的联合演化，导致物理结构与视觉/动作的交互不够深入。
- **本质改动**: 将多模态统一从“输入/输出接口层”下沉到“中间表示层”。通过一个共享的统一动态 Transformer（UDT），让 RGB、深度和动作 token 在同一个潜在空间内通过共享参数进行联合演化和交叉注意力交互，而不是仅仅在网络的输入输出端做拼接。
- **技术溯源**: 基于预训练的 Wan2.2 TI2V-5B 视频生成骨干网络，使用冻结的 Wan2.2 VAE 进行视觉和深度的潜在空间压缩，并使用冻结的 Qwen3-VL-2B 提取任务级语言条件。

**2. 技术拆解**
- **核心方法**: 
  1. **表示层统一架构**：各模态通过特定编码器映射到共享中间表示，由 UDT 联合建模，再通过特定解码器输出。
  2. **统一动作空间**：将异构机器人的动作统一映射到 20 维的相对末端执行器（EEF）空间，并通过有效性掩码处理不同机器人的自由度差异。
  3. **面向功能的训练模式**：通过控制各模态的噪声时间步（如设为 0 表示干净输入，直接省略表示不参与），在单一模型中实现联合生成、视觉预测、策略推理、动作/视频条件生成等 6 种功能。
  4. **几何作为原生生成状态**：将深度图作为与 RGB 共享时空拓扑的原生生成模态。预训练时深度单向读取 RGB/动作，后训练时开启双向交互。
- **关键细节**: 
  - **输入输出**：输入为当前观测和结构化任务提示（Task-Scene-Action），输出为未来 H 步的 RGB、深度和动作。
  - **模型结构**：UDT 包含 14 个继承自 Wan2.2 的 block。视觉/深度编码器与解码器各 8 个 block，动作编码器与解码器各 8 个 block（初始化），语言理解模块 4 个 MLP block。
  - **规模与超参**：视觉分辨率 640×480，49 帧映射为 3900 个 token；动作通过时间卷积压缩为 48 个 token。推理时 RGB/深度用 50 步去噪，动作用 10 步去噪。
- **训练/优化目标**: 
  - 采用流匹配（Flow-Matching）的统一速度场参数化，RGB/深度和动作使用不同的噪声调度（shift）。
  - 损失函数为各生成模态的流匹配回归损失（L2 范数），动作损失通过有效性掩码屏蔽无效维度。
  - 采用分阶段课程学习（Staged Curriculum）：从纯视觉先验 -> 引入机器人/自我中心视频 -> 引入动作与深度 -> 目标机器人微调，并伴随轻量级回放（rehearsal）防止灾难性遗忘。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：约 20K 小时自我中心视频，10K 小时真实机器人数据，1K 小时仿真数据（其中约 4K 小时带对齐的深度监督）。
  - **对比对象（Baseline）**：通用视频模型（Veo3, Wan2.6, Kling26, LTX-2, Sora2），具身世界模型（Cosmos, GigaWorld, LVP, Vidar, WoW, Qwen-RobotWorld, RynnWorld-4D 等）。
  - **测试环境**：EWMBench, WorldOlympiad (Robotics), WorldArena Track-1，以及 RoboTwin 仿真闭环测试。
- **评价指标**: 
  - **EWMBench**：8 个维度的总和（Overall），包括场景一致性、动作正确性、语义对齐等。
  - **WorldOlympiad**：物理忠实度、3D 一致性、交互保真度的等权平均（All）。
  - **WorldArena**：12 项指标的平均分（12-Metric EWMScore）。
  - **其他**：闭环成功率、深度生成误差（AbsRel, RMSE）、动作恢复 RMSE。
- **主要结果**: 
  - **基准第一**：在 EWMBench (Overall 4.66)、WorldOlympiad (All 0.740) 和 WorldArena (12-Metric 71.73) 均排名第一，超越 Qwen-RobotWorld 等强力 Baseline。
  - **动作条件控制**：提供 GT 动作作为条件时，EWMBench Overall 从 4.66 提升至 5.03，动作轨迹对齐指标（HSD 从 0.5638 升至 0.7369，nDTW 从 0.7102 升至 0.8736）显著提升，证明模型真正消费了动作条件。
  - **深度双向交互**：在 RoboTwin 闭环任务中，开启 RGB-Depth 双向交互使成功率从 60.0% 提升至 75.0%。
  - **梯度兼容性**：6 种功能模式在共享 UDT 上的梯度余弦相似度最小约为 -0.005，证明多任务联合训练无显著优化冲突。
  - **表示质量**：冻结的视频表示中可恢复出动作信息，且随训练推进探针 MSE 单调下降，证明共享表示学到了动作相关的运动特征。

### 33. 🔥 [TacitVLA: Reasoning Vision-Language-Action Models Without Reasoning Latency] (TacitVLA：无推理延迟的推理视觉-语言-动作模型)
- **研究机构**: `NVIDIA`
- **Arxiv ID**: `2610.17540` | [点击跳转](https://arxiv.org/abs/2610.17540)

**0. 论文标题**
- **英文标题**: TacitVLA: Reasoning Vision-Language-Action Models Without Reasoning Latency
- **中文标题**: TacitVLA：无推理延迟的推理视觉-语言-动作模型
- **研究机构**: NVIDIA
- **一句话总结**: 提出 TacitVLA，通过在部署时切断动作专家对当前推理文本的注意力依赖，将文本生成异步化或直接省略，从而在保持甚至提升 VLA 模型性能的同时，彻底消除自回归推理带来的延迟。

**1. 整体逻辑**
- **研究任务**: 解决现有推理型视觉-语言-动作（VLA）模型在部署时，因自回归生成推理文本（如场景描述、计划、子任务）而导致的严重推理延迟问题。
- **研究动机**: 现有的推理 VLA（如 Embodied CoT）在输出动作前先生成推理文本，虽然提升了泛化能力和长程任务表现，但文本生成占用了单次调用 53% 到 70% 的延迟。作者发现，动作其实不需要等待或条件化于*当前*生成的推理文本，因为推理监督在训练阶段已经改善了骨干网络的表征；且对于需要长程记忆的任务，文本完全可以在动作执行期间异步生成。
- **本质改动**: 训练时保留推理文本的监督信号，但在部署时修改注意力掩码（Attention Mask），让动作专家（Action Expert）永远不关注当前步生成的推理 token。非记忆任务直接跳过文本生成，记忆任务将文本生成推迟到动作执行窗口内异步进行。
- **技术溯源**: 基于近期的推理 VLA 架构（如 $\pi_{0.5}$, RynnBrain, Qwen3-VL），采用 Vision-Language Backbone 结合 Flow-matching Action Expert 的 Mixture-of-Transformers 架构。

**2. 技术拆解**
- **核心方法**: 
  1. **注意力掩码解耦**：训练时保持与显式推理（Explicit Reasoning）完全相同的数据、序列和损失函数，仅在推理时改变注意力模式。显式推理的动作专家关注上下文 $c_t$ 和推理文本 $r_t$；TacitVLA 的动作专家只关注上下文 $c_t$。
  2. **延迟生成/省略生成**：对于非记忆任务（如 LIBERO、自动驾驶），部署时直接不生成推理文本；对于记忆任务（如 RoboMME、RMBench），先计算动作，在机器人执行动作的物理时间窗口（Execution window）内，异步生成文本并追加到记忆账本（Ledger）中，供下一步使用。
- **关键细节**: 
  - **模型结构**：Backbone（如 PaliGemma, RynnBrain-2B, Qwen3-VL-2B）生成推理文本和 tokenized actions；Action Expert（独立权重的 Transformer）通过 Flow Matching 去噪生成连续动作 chunk。两者共享注意力机制（Action expert 逐层 attend to backbone 的 K, V）。
  - **规模**：模型总参数量在 2.5B 到 3.9B 之间。
- **训练/优化目标**: 联合优化目标 $\mathcal{L} = \mathcal{L}_{\text{flow-matching}}(a_t) + \lambda \mathcal{L}_{\text{cross-entropy}}(r_t, \tilde{a}_t)$。即动作专家的 Flow matching 去噪损失，加上骨干网络的推理文本和离散动作的交叉熵损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：4 个 Benchmark。记忆任务：RoboMME（机械臂计数等）、RMBench（长程操作）。非记忆任务：LIBERO/LIBERO-Plus（机械臂操作）、PhysicalAI-AV（自动驾驶）。
  - **对比对象（Baseline）**：同架构的 No Reasoning（无推理监督）、Explicit Reasoning（部署时等待文本生成），以及各榜单 SOTA（如 RoboMME 的 FrameSamp+Modulator，RMBench 的 WLA-0，LIBERO 的 DreamVLA/MergeVLA 等，PhysicalAI-AV 的 Alpamayo-R1/VaVAM）。
- **评价指标**: 
  - **性能**：任务成功率（Success rate %），自动驾驶的 minADE、Scene score 等。
  - **延迟**：单次调用的延迟时间（Latency per call, ms），对比 Explicit Reasoning 的延迟倍数。
- **主要结果**: 
  - **性能匹配/超越**：TacitVLA 在所有 4 个基准上匹配 Explicit Reasoning，并显著优于 No Reasoning。绝对指标上，RoboMME Counting 达 89.5%（仅训练 Counting）/ 82.7%（全任务，SOTA 为 66.8%），RMBench 达 77.5%（SOTA WLA-0 为 56.5%），LIBERO-Plus 达 72.9%，PhysicalAI-AV 闭环 Scene score 达 52.5%（接近 10B 模型 Alpamayo-R1 的 55.0%）。
  - **延迟大幅降低**：TacitVLA 的延迟与 No Reasoning 完全一致。相比 Explicit Reasoning，在非记忆任务上延迟降低高达 3.4 倍（如 LIBERO 从 495ms 降至 147ms），在记忆任务上降低 1.4 到 1.7 倍（因为文本生成被隐藏在动作执行窗口内，不阻塞动作输出）。

### 34. 🔥 [Vision-Predictor-Action: Towards Efficient Embodied AI via Neuro-Symbolic JEPA Predictors] (视觉-预测-动作：基于神经符号JEPA预测器的高效具身智能)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.15556` | [点击跳转](https://arxiv.org/abs/2610.15556)

**0. 论文标题**
- **英文标题**: Vision-Predictor-Action: Towards Efficient Embodied AI via Neuro-Symbolic JEPA Predictors
- **中文标题**: 视觉-预测-动作：基于神经符号JEPA预测器的高效具身智能
- **研究机构**: 原文未提及
- **一句话总结**: 提出VPA框架，用轻量级的神经符号选择器、JEPA潜在预测器和Flow-Matching求解器替换VLA模型中自回归的LLM解码器，将每步推理延迟与动作视界解耦，实现高频闭环控制。

**1. 整体逻辑**
- **研究任务**: 机器人视觉-语言-动作（VLA）模型的高频闭环控制与长程操作。
- **研究动机**: 现有VLA模型依赖LLM解码器逐token自回归生成动作，推理延迟随动作序列长度线性增长（如RT-2仅1-5Hz），无法满足机器人高频、动态反应的控制需求。
- **本质改动**: 摒弃自回归的LLM解码器，改用非自回归的“潜在控制循环”（神经符号技能选择 + JEPA潜在状态预测 + Flow-Matching动作块生成），使每个决策步的顺序网络评估次数与动作视界（action horizon）彻底解耦。
- **技术溯源**: CLIP（冻结文本编码器）、JEPA（联合嵌入预测架构）、VICReg（防表征坍塌正则化）、Conditional Flow-Matching (CFM)、Vision Transformer (ViT)。

**2. 技术拆解**
- **核心方法**: 提出Goal-Conditioned VPA框架，包含四个串联模块：1) 潜在多模态编码（共享ViT编码图像，冻结CLIP编码文本）；2) 神经符号原语选择器（基于潜在距离阈值和文本条件，分类选择离散技能）；3) JEPA潜在预测器（预测下一步潜在状态及不确定性，用VICReg防坍塌）；4) Flow-Matching动作求解器（基于统一条件向量，通过少量ODE积分步直接生成整个动作块）。
- **关键细节**: 
  - 输入输出：输入当前视觉观测、目标图像、文本指令和本体感觉；输出连续的多步动作块（Action Chunk）。
  - 模型规模：可训练参数<20M，检查点<75MB（不含63.4M的冻结CLIP文本编码器）。
  - 推理深度：动作块长度 $H=16$，Flow-Matching积分步数 $K \in \{1,2,3\}$，每个决策步仅需 $K+3$ 次顺序网络评估，与 $H$ 无关。
  - 动态阈值：里程碑完成阈值 $\tau$ 根据VICReg训练中的方差裕量（variance margin）动态缩放，避免固定阈值在潜在空间尺度漂移时失效。
- **训练/优化目标**: 分两阶段。阶段一：用VICReg损失（潜在L2预测损失 + 方差/协方差正则化）联合训练视觉编码器和JEPA预测器，训后冻结；阶段二：用交叉熵损失训练技能选择器，用Flow-Matching目标（回归向量场）训练动作求解器。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-10（长程操作基准）。
  - 对比对象：原文未提及（作者明确声明未进行受控的baseline对比）。
  - 测试环境：单卡NVIDIA L4 GPU训练（<3小时）；Apple M4上进行延迟测试。
- **评价指标**: 任务成功率（%）、推理延迟（ms）。
- **主要结果**: 
  - 延迟表现：在Apple M4上，单相机配置下完整决策步耗时约 10.5–14.2 ms（$K \in \{1,2,3\}, H \le 64$），验证了延迟与动作视界解耦的理论分析。
  - 任务成功率：在LIBERO-10上，双相机配置下200个评估episode的成功率为40.0%（单相机为10.5%）。
  - 结论定性：证明了该轻量级潜在控制循环可行且具备低延迟潜力，但作者坦承成功率仍低于该基准上先前报道的方法，且未进行严格的baseline对比，仅作为概念验证（Proof of Concept）。
