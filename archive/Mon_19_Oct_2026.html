### 35. 🔥 [Learning Transferable World-Action Models from Task-Paired Human Videos] (从任务配对的人类视频中学习可迁移的世界-动作模型)
- **研究机构**: `NAVER AI Lab`
- **Arxiv ID**: `2610.14351` | [点击跳转](https://arxiv.org/abs/2610.14351)

**0. 论文标题**
- **英文标题**: Learning Transferable World-Action Models from Task-Paired Human Videos
- **中文标题**: 从任务配对的人类视频中学习可迁移的世界-动作模型
- **研究机构**: NAVER AI Lab
- **一句话总结**: 提出 WATCH 跨视频预训练方法，仅用跨场景/跨人的人类视频配对数据，逼迫视频模型放弃拟合外观而学习可迁移的物理交互表征，大幅提升了下游机器人策略在未见环境中的泛化成功率。

**1. 整体逻辑**
- **研究任务**: 机器人基础模型（世界-动作模型，World-action models）的预训练，旨在提升策略在跨场景、跨机器人本体（embodiment）下的泛化与迁移能力。
- **研究动机**: 现有的世界-动作模型通常用 within-video（单视频内）的下一帧预测做预训练。这会导致模型“偷懒”，去拟合特定场景、视角或演示者的外观特征（appearance），而不是学习真正的物理交互。当后续微调（post-training）到不同环境或不同机器人时，模型很难泛化。此外，如果要学跨具身表征，通常需要昂贵的“人类-机器人”配对数据。
- **本质改动**: 将预训练目标从“单视频内的下一帧预测”改为“跨视频的条件预测”——用一段人类演示（reference）作为条件，去预测另一段同任务但不同场景/视角/演示者的人类演示（query）的动作和未来帧。因为两段视频的外观不共享，模型被迫学习任务本质的交互逻辑，且完全不需要昂贵的机器人配对数据。
- **技术溯源**: 基于 Cosmos-Predict2.5 和 Cosmos3 视频生成骨干网络（Video backbone），以及 Cosmos Policy 的联合动作-视频预测范式。

**2. 技术拆解**
- **核心方法**: WATCH (World-Action model Training from Cross-Human videos)。通过构建跨源人类视频对，利用跨视频条件生成进行预训练，学习具身不变（embodiment-invariant）的交互表征。
- **关键细节**: 
  - **数据配对**: 从 EgoVerse 等数据集提取人类视频，利用任务分类和基于 DTW（动态时间规整）的动作轨迹相似度，构建 query-reference 对（包含同源和跨源对，共约 10.99M 对，10K 小时）。动作统一映射到共享的 57 维笛卡尔任务空间（末端执行器位姿+手指位置）。
  - **模型输入输出**: 输入 6 个 slot：query 当前帧、query 状态、reference 视频、reference 动作；输出：query 未来视频、query 动作。使用连续时间位置编码和 slot-type 嵌入来区分模态和时间。
  - **规模**: 预训练使用约 10.99M 个 query-reference 链接（10K 小时窗口数据），在 32 张 GPU 上训练 8K iterations。
- **训练/优化目标**: 联合动作-视频预测的 Rectified-flow（整流流）目标函数。对生成的 slot（未来视频和动作）计算速度匹配损失（velocity matching），条件 slot 不加 loss。动作损失权重 $\lambda=48$。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**: 预训练用 EgoVerse 人类视频；下游微调与评估用 MimicDroid (GR1 人形机器人, 测 in-context/context-free), TableTop-Sim (双臂 ALOHA), RoboCasa (单臂 Franka)。
  - **对比对象 (Baseline)**: 无预训练 (Original model), Within-video 预训练, Co-training (混合人类与机器人数据), 以及 Vid2Robot, HAND, MimicDroid, $\pi_{0.5}$, GR00T-N1.7, MolmoAct2 等现有策略。
- **评价指标**: 机器人任务执行成功率 (Success rate, %)；表征分析用动作 MSE、检索排名 (Retrieval rank)、Spearman 相关系数、注意力可视化。
- **主要结果**: 
  - **表征层面**: 跨视频预训练使模型注意力从背景/边缘转移到“手-物”交互区域；学到了跨具身不变的动作表征，在未见过的机器人数据上也能准确检索和对齐动作，其特征空间与直接用机器人数据训练的模型高度重合。
  - **下游成功率 (In-context MimicDroid)**: 基于 Cosmos Policy，平均成功率从 40.9% 提升至 68.3%；基于 Cosmos3，从 59.8% 提升至 77.7%。在未见过的布局 (L3) 上提升最为显著（如 Cosmos3 的 L3 从 30.8% 升至 55.0%），且能处理 2 倍速的不可行参考演示。
  - **下游成功率 (Context-free)**: 即使微调时不给 reference，MimicDroid 成功率也分别从 49.3% 升至 69.0% (Cosmos Policy) 和 49.7% 升至 63.4% (Cosmos3)。在 TableTop-Sim 和 RoboCasa 上同样取得一致提升。
  - **对比结论**: 显著优于 within-video 和 co-training 基线，证明了仅用人类视频跨源配对就能学到极具迁移性的表征，且比收集机器人数据更具成本效益。

### 36. 🔥 [ObjDream: Guiding Vision-Language-Action Models with Object-Level Understanding and Future State Prediction] (ObjDream：通过物体级理解和未来状态预测引导视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.20223` | [点击跳转](https://arxiv.org/abs/2610.20223)

**0. 论文标题**
- **英文标题**: ObjDream: Guiding Vision-Language-Action Models with Object-Level Understanding and Future State Prediction
- **中文标题**: ObjDream：通过物体级理解和未来状态预测引导视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出ObjDream框架，通过解耦物体身份与动态状态的表征，并引入训练时预测未来物体状态的辅助监督，显著提升了VLA模型在分布外场景和真实机器人操作中的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中的泛化能力和鲁棒性，特别是在物体布局、背景等发生分布外（OOD）变化时。
- **研究动机**: 现有VLA模型多依赖VLM的图像级视觉表征，缺乏细粒度的物体级理解，导致物体身份、空间状态与外观/背景耦合，在OOD场景下鲁棒性差；且现有物体级方法常将持久身份与动态状态混在一个token里，状态变化容易干扰身份识别。
- **本质改动**: 将物体表征解耦为“持久身份”和“动态状态”两个独立通道注入VLM，并在训练阶段引入动作条件的未来物体状态预测作为辅助监督，推理时则直接输出动作。
- **技术溯源**: 基于 Qwen3-VL (VLM基座)、CLIP、DINOv2、SAM2、Grounding DINO 等预训练模型，动作解码采用 Flow-matching。

**2. 技术拆解**
- **核心方法**: 
  1. **时空物体编码器**：提取并解耦物体的持久身份（语义+初始视觉参考）和动态状态（外观、几何、时间信息），生成结构化的物体槽（object slots）。
  2. **身份引导路由**：将解耦后的物体token插入VLM序列，利用缓存的身份参考计算匹配分数，通过加性偏置调制VLM对相应物体token的注意力。
  3. **物体动力学模块**：在训练时预测紧凑的未来物体状态（几何、可见性等），提供辅助监督，推理时跳过该模块直接输出动作。
- **关键细节**: 
  - **输入输出**：输入为语言指令、多视角图像、本体感知状态和物体级嵌入；输出为连续的动作块（action chunks）。
  - **模型结构**：VLM基座为 Qwen3-VL-4B，动作专家为 flow-matching。物体编码器使用 SAM2 提取空间特征，CLIP/DINOv2 提取语义/视觉身份。
  - **关键超参**：动作预测步长 $H_a$，未来预测步长 $H_f=8$。物体槽数量 $N_s$，前瞻物体token数 $N_p=2$。
- **训练/优化目标**: 
  - **编码器预训练**：使用自动生成的离线标注，优化分割掩码、几何、可见性以及区域-文本对比损失。
  - **VLA联合训练**：物体编码器冻结。优化目标为 Flow-matching 动作模仿损失 + 辅助损失（包含当前物体状态解码、未来物体状态预测、动作提案、门控正则化）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与Benchmark**：LIBERO, LIBERO-Plus (7种受控分布偏移), RoboTwin 2.0 (8个任务子集), 4个真实机器人任务。
  - **对比对象 (Baseline)**：OpenVLA, OpenVLA-OFT, UniVLA, $\pi_0$, $\pi_{0.5}$, AVA-VLA, X-VLA, WorldVLA, VLA-JEPA, OA-WAM, StarVLA, ControlVLA。
  - **测试环境**：训练使用 8张 NVIDIA H100 GPU，推理评估使用 NVIDIA RTX 4090 GPU。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **LIBERO & LIBERO-Plus**：在标准LIBERO上平均成功率达 98.6%（最优）；在LIBERO-Plus (OOD) 上平均 84.4%（第二），在语言、光照、背景扰动下表现最佳。
  - **RoboTwin 2.0**：Easy 设置 60.25%，Hard 设置 22.75%。相比 StarVLA，Easy 提升 12.87%，Hard 提升 15.62%。
  - **真实机器人**：ID 成功率 74%，OOD 55%。ID 下比 $\pi_{0.5}$ 高 8%，比 ControlVLA 高 14%；OOD 下比 ControlVLA 高 24%。

### 37. 🔥 [Atomic-WAM: Execution-Grounded Atomic-Motion Reasoning for World Action Models] (Atomic-WAM：面向世界动作模型的可执行原子动作推理)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.20157` | [点击跳转](https://arxiv.org/abs/2610.20157)

**0. 论文标题**
- **英文标题**: Atomic-WAM: Execution-Grounded Atomic-Motion Reasoning for World Action Models
- **中文标题**: Atomic-WAM：面向世界动作模型的可执行原子动作推理
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种“先理解后执行”的具身智能框架，通过视觉语言模型推理出细粒度的“原子动作”描述来引导世界动作模型（WAM）生成视频和动作，并利用下游物理执行反馈闭环优化推理器，显著提升了机器人在模糊指令下的任务成功率。

**1. 整体逻辑**
- **研究任务**: 基于视觉和语言指令的机械臂操作任务（具身智能/机器人控制）。
- **研究动机**: 现有的世界动作模型（WAM）直接接收高层任务指令时存在两个问题：一是语义接地鸿沟（抽象指令难以直接映射到具体物体交互）；二是时间粒度鸿沟（任务指令在执行全程不变，但局部动作如接近、抓取、释放需要随状态动态变化）。
- **本质改动**: 在任务指令和底层动作生成之间，插入一个视觉语言推理器，将高层任务语义逐步翻译为状态相关的“原子动作”描述作为WAM的条件；同时引入基于执行反馈的强化学习，让推理器根据WAM的实际物理执行结果来优化动作选择。
- **技术溯源**: 基于 Cosmos3-Nano（世界动作模型基座）、DROID 数据集（用于构建原子动作数据）、Qwen 家族模型（用于数据标注管线）、GRPO（强化学习算法）。

**2. 技术拆解**
- **核心方法**: 
  1) 构建原子动作监督数据：通过末端执行器速度和夹爪状态变化切分物理片段，利用多视角和时序上下文合并为原子动作，并补充抓取点等接触细节。
  2) “先理解后执行”框架：推理器（VLM）根据任务指令和视觉上下文预测下一步的原子动作描述；WAM根据该描述、当前观测和机器人状态，联合预测未来视频隐变量和动作块（action chunk）。
  3) 基于执行反馈的推理器自适应（EG-GRPO）：固定WAM，推理器采样多个候选原子动作，WAM分别执行，评估器根据“动作合理性”和“执行成功率”给出奖励，通过GRPO更新推理器的LoRA参数。
- **关键细节**: 
  - 数据规模：从57k个DROID演示中提取369k个原子动作片段。
  - 模型结构：推理器是自回归VLM（带LoRA），WAM是基于Cosmos3-Nano的扩散模型。
  - 输入输出：推理器输入任务指令和视觉上下文（当前及历史帧，多视角拼接），输出原子动作描述。WAM输入描述、当前观测、状态，输出视频latents和32步的action chunk。
  - 训练规模：在32张A800上训练。WAM训练14000步（batch size 768）；推理器训练3000步（LoRA r=128, alpha=256）。EG-GRPO阶段采样4个候选，进行30次更新。
- **训练/优化目标**: 
  - 监督阶段：推理器使用交叉熵损失预测原子动作描述；WAM使用联合流匹配（Joint Flow Matching）损失预测视频和动作。两者并行训练。
  - 强化学习阶段（EG-GRPO）：奖励函数由任务奖励（动作是否合理，0或1）和执行奖励（是否成功执行，0或1）层级结合而成（不合理直接0，合理且执行成功得1）。使用GRPO目标函数更新推理器LoRA。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：RoboLab-120（包含120个任务，涵盖视觉、关系、程序能力），采用真实到仿真（real-to-sim）评估，分为默认指令和模糊指令（vague instructions）两种设置。
  - 对比对象（baseline）：Cosmos3-Nano-Policy, Phoenix, BiMind v0.1, π0.5, DreamZero, Cosmos3-Edge-Policy, π0-FAST, GR00T N1.6, π0。
- **评价指标**: 任务成功率（SR）和子任务进度得分（Score，即子任务进度×100）。
- **主要结果**: 
  - 默认指令下：Atomic-WAM达到39.6% SR和53.7 Score，优于Cosmos3-Nano-Policy（36.8% SR）。
  - 模糊指令下：Atomic-WAM达到31.6% SR和46.7 Score，比Cosmos3-Nano-Policy（20.6% SR）大幅提升11个百分点；且成功率下降幅度（8.0%）远小于baseline（16.2%），证明原子动作推理能有效补充模糊指令缺失的信息。
  - 消融实验：引入原子动作监督提升SR（30.0%->32.5%），加入接触细节进一步提升至36.7%。EG-GRPO相比纯监督（36.7%）和去掉执行奖励的GRPO（34.2%）提升至39.2%，验证了执行反馈闭环的有效性。

### 38. 🔥 [MorphAct: Robot Policies Morphing with the Worlds They Act In] (MorphAct：随交互世界动态变形的机器人策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.20019` | [点击跳转](https://arxiv.org/abs/2610.20019)

**0. 论文标题**
- **英文标题**: MorphAct: Robot Policies Morphing with the Worlds They Act In
- **中文标题**: MorphAct：随交互世界动态变形的机器人策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出MorphAct框架，通过两个耦合的生成器为VLA模型的视觉-语言和动作模块动态生成依赖当前上下文的低秩参数更新，解决了多任务共享静态参数导致的梯度冲突问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）机器人在多样化物理环境和复杂交互操作中的泛化与适应能力。
- **研究动机**: 现有VLA模型使用共享且固定的参数（包括全参数微调或静态LoRA）。作者在RoboCasa365上的原子任务诊断发现，不同操作在VLM和动作模块上的梯度更新方向存在严重冲突，改善一个任务的参数更新会损害其他任务，静态参数无法调和这种异构需求。
- **本质改动**: 摒弃固定参数或静态LoRA，设计了一个上下文感知的参数生成框架，根据当前交互状态动态生成VLM和动作模块的低秩权重更新。
- **技术溯源**: 基于VLA基座模型（X-VLA, $\pi_0$, $\pi_{0.5}$），底层低秩合成使用了HY-WU的结构化原语（structured synthesis primitive）。

**2. 技术拆解**
- **核心方法**: 提出MorphAct，包含两个耦合的参数生成器（Generator）。VLM生成器根据多模态输入生成VLM模块的低秩更新；动作生成器则以上游VLM模块更新后产生的自适应特征（adapted representations）为条件，生成动作模块的低秩更新。两者通过原生动作目标联合训练，无需任务标签或专家适配器目标。
- **关键细节**: 
  - 输入输出：输入为当前观测（图像、语言指令）和机器人状态；输出为选定Transformer层投影矩阵的低秩A/B因子。
  - 模型结构：生成器包含跨层注意力、层内参数注意力和交叉注意力。采用结构化低秩合成，按注意力头或矩阵级别输出因子，避免实例化稠密矩阵。
  - 规模与精度：生成器参数量约300M，每次推理激活的低秩因子约50M。生成器参数使用FP32存储，内部计算使用BF16。
- **训练/优化目标**: 直接使用基座模型的 native action loss 进行端到端联合优化（$\pi_0/\pi_{0.5}$ 使用条件流匹配的速度预测损失，X-VLA 使用动作空间损失）。生成的低秩因子作为可微中间变量参与反向传播，基座模型参数保持冻结。

**3. 实验结果**
- **实验设置**: 
  - 数据集：仿真环境使用 LIBERO（4个suite共40个任务）和 Meta-World（MT50，50个任务）；真实世界使用4个操作任务（如Sort Letters、Sort Hardware等）。
  - Baseline：对应的 VLA 基线（X-VLA, $\pi_0$, $\pi_{0.5}$ 的原始版本或 Shared LoRA）。
- **评价指标**: 闭环任务成功率（Closed-loop task success rate）。
- **主要结果**: 
  - LIBERO：X-VLA、$\pi_0$、$\pi_{0.5}$ 的平均成功率分别提升 4.15%、2.50%、1.75%。
  - Meta-World：平均成功率分别提升 7.57%、16.30%、15.72%（其中 $\pi_0$ 在 Very Hard 任务上从 20.00% 跃升至 58.00%）。
  - 真实世界（基于 $\pi_{0.5}$）：4个任务成功率提升 8.00% - 14.00%（如 Sort Hardware 从 8.00% 提升至 22.00%）。
  - 推理开销：由于每个规划上下文只生成一次参数并在动作块内复用，端到端推理延迟仅增加约 18.00%–21.00%（如 $\pi_{0.5}$ 从 138.71ms 增至 164.00ms）。

### 39. 🔥 [What Matters for World Modeling in Vision-Language-Action Models?] (视觉-语言-动作模型中，世界建模的哪些因素最关键？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.19825` | [点击跳转](https://arxiv.org/abs/2610.19825)

**0. 论文标题**
- **英文标题**: What Matters for World Modeling in Vision-Language-Action Models?
- **中文标题**: 视觉-语言-动作模型中，世界建模的哪些因素最关键？
- **研究机构**: 原文未提及
- **一句话总结**: 本文在统一框架下对VLA中的四种世界模型整合范式与多种世界表示进行了严格的控制变量评估，揭示了2D语义表示的通用性、解耦架构在应对分布偏移和微调预训练VLA时的优势，以及世界模型在长视野和动态任务中的显著增益。

**1. 整体逻辑**
- **研究任务**: 评估和对比不同世界模型（World Models）整合到视觉-语言-动作模型（VLAs）中的设计选择（世界表示、整合范式、策略骨干）对机器人操作任务的实际影响。
- **研究动机**: 现有将世界模型引入VLA的工作在世界表示、网络结构和骨干网络上各不相同，变量相互耦合，导致“到底什么设计真正有效”这个问题被掩盖，领域内缺乏系统性的控制变量对比。
- **本质改动**: 这篇工作本质上是一个大规模的实证研究（Empirical Study）。它没有提出单一的新模块，而是将现有工作解耦并归纳为四种世界模型整合范式，在共享策略骨干、训练协议和损失函数的统一框架下进行控制变量实验，找出影响VLA世界建模的核心因素。
- **技术溯源**: 基于 Qwen3-VL-2B（标准VLM骨干）、$\pi_{0.5}$（预训练机器人VLA骨干）、DINOv3 / SigLIP / V-JEPA 2.1 等（世界表示编码器），以及 Flow-matching（动作生成目标）。

**2. 技术拆解**
- **核心方法**: 提出并实现了四种世界模型整合范式，按“世界动态如何与策略耦合/解耦”进行分类：
  1. **隐式未来对齐 (WM-Align)**：耦合设计。无专门模块，用辅助损失让VLM的中间视觉特征对齐未来世界表征，推理时丢弃预测头。
  2. **显式未来查询 (WM-Query)**：耦合设计。引入可学习的未来 query tokens 聚合上下文，用 decoder 重建未来表征。推理时丢弃 decoder，保留 query tokens 参与动作生成。
  3. **MoT未来专家 (WM-MoT)**：解耦设计。并行训练一个 Future Expert（Transformer流），Action Expert 在每一层交叉注意力融合 VLM 和 Future Expert 的中间状态。推理时保留该专家流。
  4. **外部世界预测器 (WM-Ext)**：解耦设计。独立的外部 Transformer 预测器，用 VLM 的 query tokens 调制，预测未来特征并直接拼接到 Action Expert 的上下文中。推理时保留预测器。
- **关键细节**: 
  - **输入输出**：输入当前多视角观测和语言指令，输出连续动作块。世界模型负责预测未来 $T$ 步的表征。
  - **世界表示**：测试了像素级 (ImageVAE, WanVAE)、2D语义 (DINOv3, SigLIP)、3D几何 (VGGT) 和时空视频动态 (V-JEPA 2.1)。
  - **模型规模**：主实验采用 Qwen3-VL-2B + 28层 cross-DiT 动作专家；泛化实验采用 3B 参数的 $\pi_{0.5}$。动作块大小 $K=8$，预测视野 $T=16$。
- **训练/优化目标**: 联合优化目标。动作损失采用 Flow-matching loss ($\mathcal{L}_{action}$)；世界模型损失采用预测表征与冻结编码器提取的真实未来表征之间的余弦相似度损失 ($\mathcal{L}_{world} = 1 - \cos(\hat{z}, z)$)。总损失为 $\mathcal{L} = \mathcal{L}_{action} + \lambda_{world}\mathcal{L}_{world}$（权重设为0.1）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（域内多任务）、LIBERO-Plus（域外鲁棒性，包含7种视觉/语言/布局扰动）、RoboTwin 2.0（双臂操作，按步骤分为短/中/长视野）、DOMINO（动态物体操作）、真实世界 Franka 机械臂（静态与动态任务）。
  - **对比对象 (baseline)**：Action-only baseline（仅动作预测），以及在特定榜单中对比的 OpenVLA-OFT, 4D-WAM, starVLA, AHA-WAM, GalaxeaVLA, InternVLA-M1, Isaac-GR00T 等。
- **评价指标**: 成功率 (Success Rate, SR, %)，动态任务辅以操作得分 (Manipulation Score, MS)。
- **主要结果**: 
  1. **世界表示**：没有绝对最优的表示，但 **2D语义表示（DINOv3, SigLIP）** 在所有范式下都能提供稳健的域内和域外增益；像素级和3D表示则对架构敏感，容易在域外掉点。
  2. **整合范式**：解耦的 **WM-MoT** 整体表现最具竞争力，尤其在域外鲁棒性上提升显著（LIBERO-Plus 平均提升 4.4%）；WM-Ext 在少样本（50%数据）的域内任务中样本效率最高。
  3. **骨干兼容性**：世界建模对从头训练的标准 VLM (Qwen3-VL) 普遍有效；但对于预训练 VLA ($\pi_{0.5}$)，**只有解耦设计 (WM-MoT, WM-Ext) 能带来正向增益**。耦合设计 (WM-Align) 会破坏预训练特征空间，导致成功率下降超 5%。
  4. **任务场景**：世界建模在**长视野任务**（RoboTwin 长视野提升 16.5%-26.3%）和**动态任务**（DOMINO 解耦范式达 15.1%-15.5%）中收益巨大；但在短视野任务中收益极小，甚至因引入预测噪声导致轻微掉点。在真实世界中，平均成功率从基线的 45.0% 提升至 56.3%-73.8%。

### 40. 🔥 [Robota-Embed: Unified VLA Embeddings for Robot In-Context Learning and Evolution] (Robota-Embed：用于机器人上下文学习与进化的统一视觉-语言-动作嵌入)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.19495` | [点击跳转](https://arxiv.org/abs/2610.19495)

**0. 论文标题**
- **英文标题**: Robota-Embed: Unified VLA Embeddings for Robot In-Context Learning and Evolution
- **中文标题**: Robota-Embed：用于机器人上下文学习与进化的统一视觉-语言-动作嵌入
- **研究机构**: 原文未提及
- **一句话总结**: 提出首个在查询端和候选端都联合编码视觉、语言和原生动作（VLA）的嵌入模型，将动作直接融入物理经验检索的键中，并基于此设计了机器人上下文学习与记忆进化框架，大幅提升了策略成功率并降低了Token消耗。

**1. 整体逻辑**
- **研究任务**: 机器人物理经验检索（根据当前状态检索历史轨迹的后续执行片段），并将其应用于机器人的上下文学习（ICL）和任务局部记忆进化。
- **研究动机**: 现有的视觉-语言嵌入模型（如CLIP）缺乏对“动作”的感知。在机器人控制中，仅靠视觉和指令相似性是不够的（例如“伸手拿碗”和“放置后撤回”视觉和指令可能相似，但后续动作完全不同）。检索系统必须同时理解任务意图和当前的执行阶段（动作状态）。
- **本质改动**: 打破以往只把动作当作“返回内容”的做法，首次将“原生动作”直接作为检索键（Retrieval Key）的一部分。在查询端（当前状态）和候选端（历史后续片段）都联合编码VLA三种模态，让动作信息直接参与相似度计算。
- **技术溯源**: 基座模型采用 Cosmos3-Edge 4B，视觉处理使用 SAM3 进行交互区域裁剪；下游应用结合了 DreamZero、Fast-WAM 和 GPT-6 Astra 等策略模型。

**2. 技术拆解**
- **核心方法**: 
  1. **Robota-Embed 模型**：利用多源数据（人类、仿真、真机）训练，通过预测性对齐、多模态判别和表示正则化三个目标，将VLA模态压缩为统一的归一化向量。
  2. **Embed2ICL**：将检索到的经验转化为策略上下文。提供无训练接口（为 DreamZero 初始化视频缓存）和有训练接口（为 Fast-WAM 提供 Context Tokens 进行微调）。
  3. **Embed2Evolve**：在冻结的 GPT-6 Astra 策略外构建上下文管理框架。利用执行反馈不断扩充任务局部记忆，并自动搜索最优的检索数量、刷新频率和历史保留策略。
- **关键细节**: 
  - **输入输出**：查询端输入为“指令 + 当前交互区图像(SAM3裁剪) + 同步原生动作”；候选端输入为“指令 + 未来4秒视频 + 未来动作”。输出为用于余弦相似度计算的嵌入向量。
  - **模型结构**：基于 Cosmos3-Edge 4B（28层Transformer，隐藏层2048）。查询和候选端共享主干，但各自带有残差适配器（Adapter）。针对不同数据集（如DROID, EgoDex）动作维度和频率的差异，设计了特定的动作投影器（Projector）。
  - **数据规模**：构建了包含 1,695,684 个清洗后“当前-未来”配对数据的多源语料库。提出 Robota-Embed-Bench（4000个查询，8000个候选片段）。
- **训练/优化目标**: 
  总损失函数 $\mathcal{L} = \mathcal{L}_{\mathrm{align}} + \mathcal{L}_{\mathrm{ground}} + \mathcal{L}_{\mathrm{reg}}$：
  1. **预测性对齐 ($\mathcal{L}_{\mathrm{align}}$)**：双向 InfoNCE 损失，以精确的未来片段为正样本，以任务/物体/动作存在语义冲突的片段为负样本。
  2. **多模态接地与判别 ($\mathcal{L}_{\mathrm{ground}}$)**：结合任务/物体辅助损失，并引入模态交换（如替换文本或图像）和硬语义冲突的边际损失，确保模型对输入变化敏感。
  3. **表示正则化 ($\mathcal{L}_{\mathrm{reg}}$)**：对批次进行中心化，并约束方差和有效秩，防止表示坍塌。

**3. 实验结果**
- **实验设置**: 
  - **检索评测**：在自建的 Robota-Embed-Bench 上，对比了 CLIP ViT-L/14、Qwen3-VL-Embedding-2B、Gemini Embedding 2 等 8 个无动作的视觉-语言/视频基线模型。
  - **下游评测**：在 DROID-Sim 和 LIBERO 困难子集上测试 Embed2ICL；在 ManiSkill 的 5 个任务上测试 Embed2Evolve，对比 GPT-6 Astra Direct（裸跑）以及基于 Omni-Embed-Nemotron-3B 独立演化的系统。
- **评价指标**: 
  - **检索**：Clip-level R@1（精准定位后续片段）、Episode-level R@1（找对整段经验）、MRR。
  - **下游**：任务成功率（%）、任务进度（Task progress）、策略 Token 消耗量。
- **主要结果**: 
  - **检索性能**：Robota-Embed 的 Clip-level R@1 达到 47.33%，Episode-level R@1 达到 81.77%，比最强的无动作基线 Gemini Embedding 2 分别大幅高出 22.09 和 33.47 个百分点。消融实验证实，在控制变量下，移除原生动作对检索的降级幅度（18.9%）大于移除视觉（1.9%），证明动作是检索的核心信息。
  - **Embed2ICL 效果**：在 DROID-Sim 中成功率从 47.0% 提升至 56.3%；在 LIBERO 困难子集上从 86.4% 提升至 92.8%。在真实机器人评估中也显著提升了任务进度。
  - **Embed2Evolve 效果**：在 ManiSkill 的 5 个任务中达到 68% 的成功率，而 GPT-6 Astra Direct 仅为 24%，基于 Omni-Embed-Nemotron-3B 演化的系统为 33%。相比后者，Embed2Evolve 每次测试 rollout 减少了约 79.5% 的策略 Token 消耗。

### 41. 🔥 [LIBERO-PeRM: Benchmarking Personalized Robotic Manipulation] (LIBERO-PeRM：个性化机器人操作基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.22372` | [点击跳转](https://arxiv.org/abs/2610.22372)

**0. 论文标题**
- **英文标题**: LIBERO-PeRM: Benchmarking Personalized Robotic Manipulation
- **中文标题**: LIBERO-PeRM：个性化机器人操作基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 提出了首个将“用户偏好”与“任务目标”解耦的机器人操作仿真基准 LIBERO-PeRM，并系统评估了当前主流 VLA 模型在零样本偏好遵循、偏好微调、泛化及冲突处理上的能力瓶颈。

**1. 整体逻辑**
- **研究任务**: 构建一个用于评估具身智能体“个性化操作（PeRM）”的基准数据集与评估协议，解决现有基准只看重“任务是否完成”，而忽略“是否按用户偏好完成”的评估缺失问题。
- **研究动机**: 1）现有研究对“个性化”的定义和评估标准碎片化，难以横向对比；2）现有操作基准（如 LIBERO、RLBench）缺乏对细粒度操作偏好（如抓取姿势、避障轨迹、语义选择）的建模，且没有多偏好冲突的评估场景。
- **本质改动**: 把“用户偏好”拔高到和“任务”、“场景”同等重要的基础维度，提出了一套可控的仿真偏好分类体系，并构建了一套自动化流水线来生成偏好数据和评估指标，从而在仿真里把“完成目标”和“满足偏好”彻底解耦。
- **技术溯源**: 基于 LIBERO 仿真框架；数据生成依赖 VLM（如 Claude Opus/Gemini）进行布局编辑和规划，结合 OMPL 规划器生成启发式轨迹；评估的基座模型为各类主流 VLA（如 $\pi_{0.5}$, OpenVLA 等）。

**2. 技术拆解**
- **核心方法**: 
  1. **定义三类可观察偏好**：运动偏好（轨迹物理约束，如避开某区域）、技能偏好（执行策略，如抓把手）、用户画像（语义选择，如偏好特定颜色物品）。
  2. **自动化数据生成流水线**：用 VLM 最小化修改场景布局 -> 生成偏好条件子任务计划 -> 调用启发式技能库生成轨迹 -> 自动计算偏好满足度指标。
  3. **构建专项任务套件**：设计了 5 个 suite（单偏好、数据规模、冲突、组合、综合推理），共 312 个偏好条件任务。
- **关键细节**: 
  - **输入输出**：模型输入为 AgentView 和 Eye-in-Hand 图像，以及拼接的提示词（`Task: {task}. Preference: {pref}.`），输出为动作。
  - **数据规模**：37 个单偏好实例，18 个多偏好组合；总计 40.8k 条轨迹，平均每个任务 100+ 条。
  - **评估标签**：将连续的满足度分数映射为 4 级离散标签 $\{0, 1/4, 3/4, 1\}$，兼顾训练反馈和推理评估。
- **训练/优化目标**: 
  - **数据生成阶段**：通过 VLM 和 OMPL 生成满足特定偏好约束且任务成功的轨迹。
  - **模型微调阶段**：使用 LoRA 对 VLA 模型进行监督微调（SFT），优化目标为行为克隆（模仿学习），即在给定视觉和语言（任务+偏好）输入下预测动作序列。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 LIBERO-PeRM（包含 5 个 suite）。
  - **对比对象（Baseline）**：零样本测试了 6 个 SOTA VLA 模型（OpenVLA-OFT, $\pi_0$-fast, $\pi_{0.5}$, GR00T-N1.6, SmolVLA, UniVLA）；微调实验以 $\pi_{0.5}$ 为基座，对比了仅偏好微调（LoRA）、顺序微调（Seq-LoRA，先 LIBERO 后偏好）和混合微调（Mix-LoRA，混合偏好与无偏好数据）。
- **评价指标**: 
  - **任务成功率（SR）**：衡量任务是否完成。
  - **偏好满足率（SA）**：衡量偏好满足程度（仅在任务成功时计算，基于 4 级离散标签）。
- **主要结果**: 
  - **零样本能力差**：现有 SOTA VLA 在零样本下几乎无法遵循偏好（SA 极低）。例如 $\pi_{0.5}$ 在运动/技能偏好下 SR 高达 97.5%/100%，但 SA 仅为 24.38%/25%，说明模型只是在“盲目做任务”；而 User Profile 偏好甚至会显著降低 SR。
  - **微调有效但存在 Trade-off**：SFT 能让模型学会偏好。混合训练（Mix-LoRA）比顺序训练更好地保留了无偏好任务的性能，且对上下文提示更鲁棒，但会削弱“运动偏好”的学习效果。
  - **数据效率与泛化**：增加“场景布局多样性”比单纯堆同一布局的数据量更有效；加入无偏好数据有助于解耦。但在未见布局或未见任务上的泛化依然困难，SR 和 SA 均大幅下降。
  - **组合与冲突是硬伤**：多偏好组合只能部分学会，偏好分解完全失败；面对偏好冲突或任务-偏好冲突时，模型性能显著下降，且没有表现出明显的偏好主导性，往往直接导致执行失败。

### 42. 🔥 [CoDA: Co-Evolution of Data Engines and Action Policies] (CoDA：数据引擎与动作策略的协同进化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.22362` | [点击跳转](https://arxiv.org/abs/2610.22362)

**0. 论文标题**
- **英文标题**: CoDA: Co-Evolution of Data Engines and Action Policies
- **中文标题**: CoDA：数据引擎与动作策略的协同进化
- **研究机构**: 原文未提及
- **一句话总结**: 提出CoDA框架，通过共享异构记忆让仿真环境生成和机器人策略训练形成闭环，利用VLM诊断失败原因并自动生成针对性的环境变体和密集训练信号（Text2potential），大幅提升策略的泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Manipulation）的仿真数据生成与策略训练，重点解决策略在分布外（OOD）环境下的泛化问题。
- **研究动机**: 现有的生成式仿真能自动建环境，但“物理合法”不等于“对训练有用”。现有方法（如按成功率分配预算或均匀采样）无法衡量策略通过训练到底能提升多少，容易把生成预算浪费在策略已经掌握或根本学不会的环境上，缺乏指导“下一步生成什么环境”和“用什么信号教策略”的闭环反馈。
- **本质改动**: 建了一个数据引擎和策略共享的“异构记忆”。把视觉-语言模型（VLM）对策略失败原因的诊断，编译成两套代码：一套用来“复现这个困难”（生成新环境），一套用来“教策略克服这个困难”（提供密集监督信号），并根据策略的实际学习进度来决定下一轮练什么。
- **技术溯源**: 策略基座使用 $\pi_{0.5}$ 和 OpenVLA-OFT；VLM诊断和代码生成主要使用 GPT-5.5（也测试了 Claude Opus 5、InternVL3、Qwen3-VL）；仿真器基于 MuJoCo；资产库来自 Objaverse、ArtiCraft-10K 等；价值评论家（Value Critic）使用了 DINOv2-B 和 T5-base。

**2. 技术拆解**
- **核心方法**: 
  1. **共享异构记忆**：分三层。情景层存 rollout 和生成记录；语义层把失败原因聚类成“困难模式”（评估其难度和重要性）；程序层把验证过的困难模式编译成“场景生成程序”和“训练程序”。
  2. **记忆引导的场景生成**：根据困难模式的难度和学习进度分配生成预算。生成目标变体和控制变体，通过对比成功率来验证这个困难模式是不是真的有效。
  3. **Text2potential**：把失败诊断转化为子目标和模拟器状态上的势函数（potential），给动作块（action chunk）的价值学习提供密集反馈，且在理论上不改变原任务稀疏奖励的最优策略。
- **关键细节**: 
  - 环境解耦为任务（task）、空间布局（spatial）、物体属性（attribute）三个因子，可独立扰动。
  - 策略每次输出长度为8的动作块，采样8个候选块，用价值评论家打分后加权平均执行。
  - 价值评论家基于 DINOv2 和 T5 编码，使用分类价值回归（categorical value regression）训练。
  - 势函数只在动作块的端点计算，节省计算开销。
- **训练/优化目标**: 
  - **价值评论家**：带势函数塑造的时序差分（TD）目标。
  - **策略更新**：优势加权回归（Advantage-Weighted Regression），利用价值评论家算出的优势来加权行为克隆损失（BC loss）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：4个操作任务族（pick-place, articulated, put-inside, stack/insert），以及 LIBERO-Pro 基准（包含 Object, Goal, Spatial suites）。
  - **对比基线 (Baseline)**：预训练零样本、种子演示监督微调（SFT）、域随机化、均匀变体生成、标量反馈协同进化、无记忆的本文 critic、ASPIRE（在 LIBERO-Pro 上）。
  - **测试环境**：MuJoCo，Franka Panda 7-DoF 机械臂。
- **评价指标**: 分布外（OOD）成功率、LIBERO-Pro 的位置扰动（Position）和指令扰动（Task）成功率、达到特定成功率所需的策略更新步数。
- **主要结果**: 
  - 在4个任务族上，CoDA 的 OOD 成功率达 27.6%，比 SFT 基线（5.3%）大幅提升，比同等生成预算下的标量反馈基线（18.1%）高出 9.5 个百分点。
  - 在 LIBERO-Pro 上，经过15轮训练，位置扰动成功率从 25% 升至 84%，指令扰动成功率从 1% 升至 76%。
  - Text2potential 让达到 25% OOD 成功率所需的策略更新步数减少了约 32%（21k步 vs 31k步）。
  - 记忆支持跨任务族迁移（生成程序复用）和跨策略骨干迁移（用 $\pi_{0.5}$ 积累的记忆直接让 OpenVLA-OFT 的 OOD 成功率从 3.8% 涨到 21.1%，无需额外生成环境）。

### 43. 🔥 [REKI: Registering Knowledge in VLAs] (REKI：在视觉-语言-动作模型中注册知识)
- **研究机构**: `原文未提及（代码库指向 Kyutai Labs）`
- **Arxiv ID**: `2610.22178` | [点击跳转](https://arxiv.org/abs/2610.22178)

**0. 论文标题**
- **英文标题**: REKI: Registering Knowledge in VLAs
- **中文标题**: REKI：在视觉-语言-动作模型中注册知识
- **研究机构**: 原文未提及（代码库指向 Kyutai Labs）
- **一句话总结**: 提出一个2.4B参数且完全基于公开数据预训练的VLA模型REKI，通过引入极低开销的Register Token记忆机制解决动作振荡问题，在多个机器人基准上达到同规模最优，并全栈开源。

**1. 整体逻辑**
- **研究任务**: 语言条件驱动的机器人控制（构建视觉-语言-动作模型 VLA）。
- **研究动机**: 现有最强VLA依赖私有数据且不开源，难以复现和归因；大多数VLA仅依赖当前帧观测，缺乏历史上下文，容易因“感知混淆”导致动作在两个姿态间反复振荡；而现有的引入历史上下文的方法（如堆叠图像帧、RNN、独立记忆模块）会带来巨大的计算或训练开销。
- **本质改动**: 在Action Expert中引入可学习的Register Tokens作为轻量级记忆，通过KV Cache跨帧传递历史上下文。这使得VLM无需重复编码历史帧，训练时支持并行批处理，几乎不增加推理延迟。
- **技术溯源**: 基于 Qwen3.5-2B (VLM) 和 Flow-matching (动作生成)；记忆机制借鉴了 Darcet et al., 2024 的 Register tokens。

**2. 技术拆解**
- **核心方法**: REKI 由 VLM 和 Flow-matching Action Expert 组成。在 Expert 的输入流前拼接 32 个可学习的 Register Tokens。这些 Tokens 通过 Cross-Attention 读取当前帧的 VLM 编码特征，通过 Self-Attention 聚合当前及历史帧的 Register Tokens。历史帧的 Register K/V 被缓存在 Expert 中（滑动窗口 K=3）。
- **关键细节**: 
  - VLM 采用 Qwen3.5-2B，输出最后一层隐状态作为 Context。
  - Action Expert 为 10 层 Transformer（隐藏层 768，12 注意力头）。
  - 支持多种机器人形态，动作通过 10 步 Euler 积分的 Flow-matching 生成；机器人状态通过 Adaptive Normalization 注入。
  - 预训练混合了公开机器人、第一人称人类和 VQA 数据。
- **训练/优化目标**: Flow-matching 损失（预测从干净动作到噪声的恒定速度），结合 VLM 的子任务/视觉问答交叉熵损失（权重 0.1）。采用 8 次独立采样的多 draw 方差缩减以优化训练效率。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO-Plus (OOD), RoboTwin Clean2Rand (OOD), RoboCasa365, RoboCasa-GR1 及真机 UR5 实验。
  - Baseline：$\pi_{0.5}$, GR00T, ABot-M0, InternVLA-A1.5, Qwen-RobotManip, RLDX-1 等。
- **评价指标**: 任务成功率 (Success rate)。
- **主要结果**: 
  - 在公开数据预训练的 VLA 中取得 SOTA（LIBERO-Plus 90.4，Clean2Rand 73.4），性能仅次于两倍参数量的闭源/大模型。
  - 消融实验证明，引入 K=3 的记忆窗口使成功率提升 1.5-5.5 个点，且让动作振荡的发生率降低了约 4 倍。
  - 推理极快：编译为 CUDA graph 后，单 H100 上预测一个 action chunk 仅需 21.8 ms，是对比模型中最快的。
  - 真机实验：在 5 个操作任务上，带记忆的 REKI 比 $\pi_{0.5}$ 胜率高 7-37.5 个百分点，且在长视野任务上显著优于无记忆版本。

### 44. 🔥 [TS-WAM: Temporal Latent Actions and World-Action Coupling for Vision-Language Robot Control] (TS-WAM：用于视觉-语言机器人控制的时间潜在动作与世界-动作耦合)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21922` | [点击跳转](https://arxiv.org/abs/2610.21922)

**0. 论文标题**
- **英文标题**: TS-WAM: Temporal Latent Actions and World-Action Coupling for Vision-Language Robot Control
- **中文标题**: TS-WAM：用于视觉-语言机器人控制的时间潜在动作与世界-动作耦合
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种端到端训练的轻量级师生世界-动作模型，通过融合无动作标签的人类视频来学习潜在动作并预测未来视觉特征，从而指导机器人动作生成，显著提升了控制性能与泛化鲁棒性。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）策略下的机器人控制，即根据语言指令和视觉场景生成具有时间连贯性的动作序列。
- **研究动机**: 现有VLA策略高度依赖带动作标签的机器人演示，缺乏预测未来视觉状态的显式机制，导致难以利用大量无动作标签的视频数据，且容易过拟合演示条件，削弱泛化能力。此外，现有的潜在动作模型（LAM）或世界模型通常采用“先预训练再微调”的两阶段流程，不仅计算成本高，也无法保证学到的潜在表示对下游动作解码器真正有用。
- **本质改动**: 摒弃了单独预训练潜在动作或世界模型的多阶段流程，将时间表示学习、视觉动力学预测和机器人控制统一到一个端到端架构中；引入非对称的师生（JEPA）架构，利用未来视觉帧作为仅用于训练的教师信号，推理时直接丢弃教师分支以保持模型轻量。
- **技术溯源**: 视觉-语言模型（VLM）、联合嵌入预测架构（JEPA）、DINO（冻结的视觉特征提取器）、条件流匹配（Conditional Flow-Matching）。

**2. 技术拆解**
- **核心方法**: 
  1. **vlm-jepa（时间潜在动作学习）**：采用非对称VLM分支。在线学生分支仅输入当前观测和指令，通过轻量Transformer预测潜在动作；EMA教师分支输入当前和未来观测，提供目标潜在动作。通过L1损失对齐两者，推理时剪枝教师分支。
  2. **delta-lwm（潜在世界-动作耦合）**：使用冻结DINO提取特征，训练一个从头初始化的AdaLN条件Transformer解码器，以当前特征和潜在动作（经池化投影）为条件，预测下一步的特征位移（$\Delta F_t$）。加入排序约束确保预测严格依赖正确的潜在动作。
  3. **流匹配动作策略**：动作头采用条件流匹配，将当前特征、预测的未来特征、VLM上下文和机器人状态拼接作为条件，生成动作块。
- **关键细节**: 
  - **输入输出**：输入为当前图像、语言指令、（训练时）未来图像、机器人本体感觉；输出为动作块（Action chunk）。
  - **模型结构**：在线VLM + 预测器（学生），EMA VLM（教师），冻结DINO，从头初始化的delta-lwm解码器，条件Transformer流匹配动作头。模型参数量为1.2B。
  - **规模与部署**：训练使用4张NVIDIA A100 GPU，推理部署在单张消费级NVIDIA RTX 4090 GPU上，推理频率为30Hz。
- **训练/优化目标**: 端到端联合优化，无独立预训练阶段。
  - **机器人样本损失**：$\mathcal{L}_{robot} = \mathcal{L}_{flow} + \lambda_T \mathcal{L}_{temp} + \lambda_W \mathcal{L}_{world}$（包含动作流匹配损失、时间潜在动作对齐L1损失、世界模型特征位移预测L2损失及依赖排序损失）。
  - **人类视频（无动作）样本损失**：$\mathcal{L}_{ego} = \lambda_T \mathcal{L}_{temp} + \lambda_W \mathcal{L}_{world}$（仅计算时间和世界损失，无动作损失）。两者混合训练，共享底层模块。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真使用 LIBERO, LIBERO-Plus, SimplerEnv。真实世界使用 Franka Research 3 (单臂) 和 RevoTron (双臂灵巧手)。
  - **对比对象（baseline）**：仿真对比了 $\pi_0$, $\pi_{0}$-FAST, $\pi_{0.5}$, WorldVLA, LAPA, Mantis, UniVLA, VLA-JEPA, RT-1-X, Octo-Base, OpenVLA, Magma, RoboVLMs, TraceVLA, Spatial Forcing, Fast-WAM等。真实世界对比了 $\pi_{0.5}$。
  - **测试环境**：仿真评估标准任务及零样本泛化（LIBERO-Plus包含7种扰动）；真实世界评估分布内（IND）及三种分布外（OOD：光照、物体布局、背景纹理）条件。
- **评价指标**: 任务成功率（Success rates, %）。
- **主要结果**: 
  - **仿真基础控制（LIBERO）**：平均成功率97.0%，略优于 $\pi_{0.5}$ (96.9%) 和 VLA-JEPA (96.1%)。
  - **仿真跨实体/任务（SimplerEnv）**：平均成功率63.83%，在Visual Matching和Visual Aggregation任务上均优于RoboVLMs等基线。
  - **仿真零样本泛化（LIBERO-Plus）**：整体成功率75.7%，显著优于 VLA-JEPA (62.9%) 和 $\pi_0$ (53.6%)，在背景扰动下优势最大。
  - **真实世界表现**：IND平均成功率72.50%，OOD平均62.92%，均大幅优于 $\pi_{0.5}$ (IND 55.00%, OOD 35.00%)。IND到OOD的性能下降幅度仅为9.58%，远小于 $\pi_{0.5}$ 的20.00%，证明混合无动作视频数据有效提升了鲁棒性。
  - **消融实验**：去除人类视频、去除vlm-jepa架构、去除预测未来特征（Pred $\Delta F$）均会导致基础控制和泛化性能明显下降，验证了各核心模块的有效性。

### 45. 🔥 [What Should Robot Policies Learn to Predict? Rethinking Supervision Targets in Vision-Language-Action Learning] (机器人策略应该学习预测什么？重新思考视觉-语言-动作学习中的监督目标)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21915` | [点击跳转](https://arxiv.org/abs/2610.21915)

**0. 论文标题**
- **英文标题**: What Should Robot Policies Learn to Predict? Rethinking Supervision Targets in Vision-Language-Action Learning
- **中文标题**: 机器人策略应该学习预测什么？重新思考视觉-语言-动作学习中的监督目标
- **研究机构**: 原文未提及
- **一句话总结**: 在固定训练预算下，通过样本级路由器将部分训练样本分配给潜在动作（LA）或未来视觉（FV）预测，能比纯动作预测训练出性能更好的VLA机器人策略。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）机器人策略学习中的监督目标分配与优化。
- **研究动机**: 现有VLA模型通常以直接预测动作（Action Prediction）为主导，将潜在动作（LA）和未来视觉（FV）预测作为辅助目标。但这些辅助目标会与动作预测竞争相同的训练预算（训练样本量）。在固定预算下，把大量样本分给辅助目标而非全分给动作预测，是否能提升策略性能尚不明确。
- **本质改动**: 打破“动作预测必须占据绝对主导”的默认设定，引入样本级路由器（sample-level router），在统一的VLA框架下显式控制动作预测与辅助预测（LA/FV）之间的训练样本分配比例，让每个样本只计算单一目标的损失，而非传统的多任务加权求和。
- **技术溯源**: 基于预训练VLM（MiniCPM-V-4.6）、双流多模态扩散Transformer（MMDiT），以及多种视觉编码器（LAPA, DINOv2, DINOv3, V-JEPA 2, Wan2.2 VAE）。

**2. 技术拆解**
- **核心方法**: 提出一个统一的VLA训练框架，包含双流MMDiT预测头（动作专家与辅助专家通过联合自注意力交互）和样本级路由器。路由器以伯努利分布将每个训练样本分配至动作损失或单一的辅助损失（LA或FV），实现监督预算的显式分配（如P25/P50/P75/P100代表分配给动作预测的样本比例）。
- **关键细节**: 
  - **输入输出**：输入当前视觉、语言指令和机器人状态，输出未来8步的动作块（action chunk）。
  - **模型结构**：VLM提取条件特征，双流MMDiT包含动作专家（预测带噪动作）和辅助专家（LA预测离散token，FV预测未来视觉特征的flow velocity）。
  - **辅助目标实例化**：测试了3种LA目标（LAPA, LAPA-DINOv2, LAPA-DINOv3）和3种FV目标（DINOv3, V-JEPA 2, Wan2.2）。
- **训练/优化目标**: 
  - **动作目标**：基于数据集定义的损失（如L1或MSE），预测去噪后的动作块。
  - **LA目标**：交叉熵损失（CE），预测离散潜在动作token。
  - **FV目标**：Flow matching的L2损失，预测未来视觉特征的流速度（flow velocity）。
  - **路由目标**：每个样本仅计算其被路由到的单一损失，通过路由概率控制总预算分配。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真基准 LIBERO（Spatial/Object/Goal/Long）和 CALVIN（ABC->D），以及4个真实机器人操作任务（Pick-out, Place-in, Rearrange-cups, Rearrange-objects）。
  - **对比对象（Baseline）**：全预算纯动作预测（Action-only full budget）、半预算纯动作预测（Action-only half budget），以及各FV配置对应的源匹配P100控制组（仅路由不同，其他设置完全一致）。
- **评价指标**: 
  - **LIBERO**：任务成功率（Success Rate）及四个子集平均成功率（Avg.）。
  - **CALVIN**：平均任务链长度（Avg. Len.）和五任务成功率（SR-5）。
  - **真实机器人**：部分积分任务完成得分（Partial-credit scores，单任务满分160）。
- **主要结果**: 
  - 在相同预算下，合适的LA和FV监督能超越全预算纯动作训练，即使动作预测只分到50%甚至25%的样本（例如V-JEPA 2在CALVIN P25分配下，平均任务链长度达到4.522，显著超越全预算纯动作基线的4.091）。
  - FV整体表现优于LA：在LIBERO和所有4个真实机器人任务上，FV（尤其是Wan2.2和V-JEPA 2）均领先；但在CALVIN上，最强的LA（LAPA-DINOv3）与最佳FV（V-JEPA 2）表现相当。
  - 机制分析表明：LA（特别是LAPA-DINO）更强调相对运动（relative motion），而FV更强调绝对位置（absolute position）和任务身份（task identity）；两者都能将策略的视觉注意力引导至任务相关区域，从而提供有效的间接动作监督。

### 46. 🔥 [Cross-Embodiment Causal Transfer from Human Videos to Robot Manipulation] (从人类视频到机器人操作的跨具身因果迁移)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21798` | [点击跳转](https://arxiv.org/abs/2610.21798)

**0. 论文标题**
- **英文标题**: Cross-Embodiment Causal Transfer from Human Videos to Robot Manipulation
- **中文标题**: 从人类视频到机器人操作的跨具身因果迁移
- **研究机构**: 原文未提及
- **一句话总结**: 提出CBST方法，利用因果束理论从人类视频中动态筛选出维持局部任务效果所必需的语义依赖，跨具身迁移给冻结的世界-动作模型（WAM），从而提升机器人操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Robot Manipulation），具体为利用人类操作视频辅助机器人策略学习，解决人类到机器人的跨具身（Cross-Embodiment）迁移问题。
- **研究动机**: 真实机器人交互数据收集成本极高，而人类操作视频丰富多样。但由于人类和机器人在形态、动作空间和控制机制上存在巨大差异（具身差异），人类的具体动作无法直接作为机器人的监督信号。核心痛点在于：人类视频中究竟哪些抽象知识（而非具体动作轨迹）应该被提取并迁移给机器人。
- **本质改动**: 引入因果推断中的“因果束（Causal Beams）”视角。不直接迁移人类动作，也不保留所有上下文，而是通过因果约束动态筛选出维持局部任务效果所必需的最小语义条件和依赖关系，实现任务级抽象与上下文选择的解耦。
- **技术溯源**: 基于世界-动作模型（World-Action Models, WAMs，如 LingBot-VA, Cosmos Policy）；理论基于 Judea Pearl 的结构因果模型与因果束（Causal Beams）；视觉-时间基座采用 ResNet18-GRU。

**2. 技术拆解**
- **核心方法**: 提出因果束引导的子任务迁移（CBST）。包含四个阶段：1) 在人类视频上预训练视觉-时间编码器，学习操作相关的时序表征；2) 用机器人演示数据微调，预测任务级语义变量（如前置条件、操作尝试、状态变化、最终效果）；3) 在预定义的结构因果模型（SCM）中，利用因果束约束（维持性+响应性）选择当前上下文下最相关的父节点子集；4) 将选出的语义依赖渲染为文本条件，输入给冻结的WAM，指导机器人从自身观测生成动作。
- **关键细节**: 
  - **输入输出**: 输入为机器人观测历史和任务指令，输出为动作块（Action chunk）和预测的未来观测。
  - **模型结构**: ResNet18（视觉）+ GRU（时序）编码器，语义预测头，因果束选择器，确定性文本渲染器，以及冻结的WAM和原生文本编码器。
  - **规模/超参**: 人类预训练使用 SSv2 数据集（174类动作分类）；参考机制（Reference mechanisms）在训练中保持冻结，用于验证因果束条件的合法性。
- **训练/优化目标**: 
  - **人类预训练**: 交叉熵损失（动作分类）。
  - **机器人适配损失**: 语义状态损失 + 机制一致性损失（要求预测的父变量在冻结的参考机制下能复现标注输出） + 因果束损失（确保选择的父集满足因果束的维持性和非平凡响应性条件） + 尺寸正则化（偏好更紧凑的父集选择，减少冗余）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: SSv2（人类视频预训练）；RoboTwin 2.0、LIBERO-Long、RoboCasa（仿真评估）；AgileX双臂平台（真实世界评估）。
  - **对比对象（Baseline）**: 底层WAM（LingBot-VA, Cosmos Policy/Predict2.5），以及其他公开策略（X-VLA, $\pi_0$, $\pi_{0.5}$, Motus, GR00T-N1.5, Video Policy等）。
- **评价指标**: 任务成功率（Success Rate, SR %）。
- **主要结果**: 
  - **仿真环境**: 在 RoboTwin 2.0 (Easy/Hard) 上，LingBot-VA + CBST 达到 94.00% / 92.54%（Baseline为 92.93% / 91.55%）；在 LIBERO-Long 上，LingBot-VA + CBST 达 98.60%（Baseline 98.5%），Predict2.5 + CBST 达 97.33%（Baseline 96.6%）；在 RoboCasa 上，Predict2.5 + CBST 达 72.44%（Baseline 71.1%）。
  - **真实世界**: 在 AgileX 双臂平台的10个物体放置任务中，Predict2.5 + CBST 相比 Baseline 在多个任务上有显著提升（例如 Cup 任务从 70% 提升至 85%，Spoon 任务从 55% 提升至 70%）。
  - **消融实验**: 验证了人类视频时序预训练、上下文结构选择（因果束）以及机制一致性监督的必要性。若移除人类预训练、打乱时序、仅使用状态信息或随机选择父节点，均会导致成功率下降。

### 47. 🔥 [Trajectory-based Diffusion from One-shot Human Video for Generalizable Manipulation] (基于单次人类视频的轨迹扩散模型用于泛化操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21792` | [点击跳转](https://arxiv.org/abs/2610.21792)

**0. 论文标题**
- **英文标题**: Trajectory-based Diffusion from One-shot Human Video for Generalizable Manipulation
- **中文标题**: 基于单次人类视频的轨迹扩散模型用于泛化操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出TDV框架，将人类视频解析为6D位姿轨迹作为中间表示进行数据增强，并训练轨迹扩散策略，实现了从单次人类视频到跨具身、跨视角的机器人泛化操作。

**1. 整体逻辑**
- **研究任务**: 从人类视频中学习机器人操作策略（Imitation learning from human videos），解决视觉域差异和缺乏动作标签导致的跨具身、跨视角泛化难题。
- **研究动机**: 现有模仿学习依赖昂贵的遥操作数据。人类视频虽多，但直接迁移面临视觉域鸿沟和动作缺失。现有基于图像编辑或光流的方法，要么物理一致性差，要么要求部署视角与采集视角严格对齐，无法实现跨视角和跨具身的泛化。
- **本质改动**: 抛弃直接处理RGB图像或光流，采用以物体为中心的6D位姿轨迹作为模态无关的中间表示。通过轨迹级别的插值与缩放实现高效数据增强，并直接基于轨迹序列训练扩散策略。
- **技术溯源**: 扩散概率模型（DDPM）、Transformer（DiT-block）、6D位姿估计（FoundationPose）、手部姿态估计（HaMeR）、3D生成（TRELLIS）、分割与跟踪（GroundingSAM, SAM2）、语言模型（BERT）。

**2. 技术拆解**
- **核心方法**: TDV（Trajectory-based Diffusion Framework）框架。包含三个阶段：1) 视频解析：区分手部任务和物体任务，分别提取末端执行器和物体的6D位姿轨迹；2) 轨迹生成：通过随机化初始位姿并进行平滑插值，从单次演示生成大规模轨迹数据集；3) 策略训练：训练基于轨迹的扩散Transformer策略以及用于子任务切换的分类策略。
- **关键细节**: 
  - **输入输出**：输入为历史轨迹序列、任务描述（文本）和子任务信号；输出为未来轨迹序列和子任务切换信号。
  - **视频解析**：手部任务用HaMeR提取手部关节并映射为夹爪位姿；物体任务先用TRELLIS生成3D模型，结合SAM2跟踪mask，再用FoundationPose估计6D位姿。所有轨迹均转换到参考物体坐标系下，消除视角影响。
  - **轨迹生成**：在XY平面投影并缩放位置轨迹，使用Slerp算法插值姿态，在原始和新初始位姿间生成平滑过渡的增强轨迹，实现数据扩增。
  - **模型结构**：扩散策略使用两层MLP将历史轨迹映射到隐空间，文本用BERT编码，通过Transformer编码器融合特征，解码器采用DiT-block。切换策略为简单的MLP分类器。
  - **规模与部署**：闭环执行频率30Hz，单张RTX 4090 GPU即可运行。
- **训练/优化目标**: 
  - **扩散策略**：预测未来轨迹的噪声，损失函数为预测噪声与真实噪声的均方误差（MSE）。
  - **切换策略**：二分类交叉熵损失，针对正负样本不平衡设置1:100的权重比。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RLBench基准，12个任务。对比基线包括OpenVLA、RVT2、3D-DA和SPOT。
  - **真机**：UR5机械臂+Robotiq夹爪+RealSense D435相机。包含3个物体任务（如倒水、放杯子）和3个手部任务（如拉抽屉、拔插头）。
- **评价指标**: 任务成功率（%）。
- **主要结果**: 
  - **仿真**：TDV在12个任务中的8个排名第一，平均成功率达91.8%，大幅领先SPOT（79.4%）等baseline（原文表述为提升13.4%）。在Insert Peg和Sort Shape等高精度任务上成功率超20%。
  - **真机空间泛化**：仅用1条轨迹训练时容易过拟合导致碰撞；通过轨迹生成增强到50条后，物体任务的位置和位姿泛化成功率接近100%（如13/13或12/13）。
  - **真机视觉域泛化**：在3种部署视角和4种背景扰动下，各任务平均成功率极高（如Cup-Coaster位置泛化35/35，位姿泛化34/35），证明对视角和背景变化具有强鲁棒性。

### 48. 🔥 [Fast-VLA: You Only Think Once for Robot Manipulation] (Fast-VLA：机器人操作只需思考一次)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21389` | [点击跳转](https://arxiv.org/abs/2610.21389)

**0. 论文标题**
- **英文标题**: Fast-VLA: You Only Think Once for Robot Manipulation
- **中文标题**: Fast-VLA：机器人操作只需思考一次
- **研究机构**: 原文未提及
- **一句话总结**: 把VLA模型里的大参数视觉语言模型从闭环控制循环中移出，仅在每集开头调用一次生成固定的KV记忆，后续用轻量级Actor查表控制，在保持高成功率的同时将推理速度提升了10倍以上。

**1. 整体逻辑**
- **研究任务**: 加速视觉-语言-动作（VLA）模型在机器人操作任务中的闭环推理速度。
- **研究动机**: 现有的VLA策略在每次预测新动作时，都要把几十亿参数的大模型放在反馈循环里重新编码图像和指令。但实际上，任务指令和全局上下文变化得很慢，每次都重跑大模型计算冗余极大，导致控制延迟高。
- **本质改动**: 将“任务理解”和“闭环控制”在时间尺度上解耦。大模型只在Episode开始时执行一次（Think Once）提取固定KV记忆，后续控制循环全权交给轻量级Actor处理。
- **技术溯源**: 基于冻结的 4B VLM (DM0.5) 作为记忆提取器，视觉编码器采用 DINOv2。

**2. 技术拆解**
- **核心方法**: 提出一种基于固定KV记忆和轻量级在线Actor的VLA架构。大模型预填充（prefill）后退出循环，在线Actor通过融合当前视觉、本体感觉和可学习Query，从固定记忆中检索上下文并一次性解码动作chunk。
- **关键细节**: 
  - **任务记忆**: 冻结的4B VLM处理指令和初始多视角图像，保留全部34层Transformer的KV张量作为固定记忆。
  - **在线Actor**: 包含DINOv2视觉编码器、Query融合模块、4层Action Decoder和线性Action Head。
  - **Query融合**: 将带时间/手臂索引的可学习Query，与当前手臂本体感觉状态（7维）、手腕视角CLS token融合，生成Action Queries。
  - **动作解码**: Decoder包含Self-attention、Cross-Visual attention（读当前和历史视觉token）、Cross-Memory attention（通过KV adapter从34层记忆中按层检索，用RoPE对齐位置）和FFN。最后通过线性Head一次性预测50步双臂动作chunk（LIBERO配置为10步单臂）。
- **训练/优化目标**: 冻结VLM，只训练在线Actor（含视觉编码器）。优化目标是预测动作与真实动作之间的 L1 损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: RoboTwin 2.0 (Clean和Randomized设置), LIBERO (Standard), LIBERO-Plus。
  - **Baseline**: $\pi_0$, $\pi_{0.5}$, DM0.5, Fast-WAM, Faster-WAM (Noah/HUST), OpenVLA-OFT 等主流VLA和加速方法。
- **评价指标**: 任务成功率 (%)，摊销推理时间 (Amortized ms/step)，单次调用延迟 (ms/chunk)，在线驻留内存 (GiB)。
- **主要结果**: 
  - **RoboTwin 2.0**: 成功率 Clean 92.46%、Randomized 92.40%。相比 Faster-WAM (HUST)、DM0.5 和 Fast-WAM，摊销推理时间降低了 10.9 到 17.1 倍，VLM卸载后的在线驻留内存仅 1.22 GiB。
  - **LIBERO**: Standard 成功率 95.95%，LIBERO-Plus 成功率 79.11%。在 LIBERO-Plus 上比 Faster-WAM 成功率高 4-5 个百分点，且推理速度快 3.1 到 21.2 倍。
  - **消融与验证**: 记忆替换实验证明 Actor 强依赖当前 Episode 匹配的 KV 记忆（换错记忆成功率暴跌）；输入消融证明手腕视觉（wrist vision）是闭环反馈的关键；长 horizon 任务（如1700步）验证了固定记忆在长程任务中不会失效。

### 49. 🔥 [LTM: Latent Transition Based In-Context Memory for Vision-Language-Action Models] (LTM：基于潜在转移的视觉-语言-动作模型上下文记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.21362` | [点击跳转](https://arxiv.org/abs/2610.21362)

**0. 论文标题**
- **英文标题**: LTM: Latent Transition Based In-Context Memory for Vision-Language-Action Models
- **中文标题**: LTM：基于潜在转移的视觉-语言-动作模型上下文记忆
- **研究机构**: 原文未提及
- **一句话总结**: 提出用冻结的潜在动作模型（LAM）将相邻帧的视觉变化编码为紧凑的潜在转移token，作为VLA模型的上下文记忆，在不增加外部推理模型负担的情况下大幅提升具身智能的历史依赖任务表现。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在需要记忆历史交互（如遮挡物追踪、计数、状态交换）的机器人操作任务中的控制。
- **研究动机**: 现有VLA记忆机制存在明显的 trade-off：密集视觉历史太占上下文，稀疏采样会丢失中间交互，语言总结会丢失细粒度动作细节，而循环状态又难以决定该保留什么。VLA需要一种既能紧凑存储，又能精准捕捉环境交互变化的记忆表示。
- **本质改动**: 放弃直接存储视觉帧或语言总结，改用冻结的潜在动作模型（LAM）提取相邻两帧的“变化（transition）”编码成紧凑的潜在token，作为有序的情景记忆直接喂给策略。
- **技术溯源**: 基于 $\pi_{0.5}$ (VLA基座), PaliGemma-3B (VLM骨干), 以及冻结的潜在动作模型 CD-LAM 和 DreamDojo。

**2. 技术拆解**
- **核心方法**: 提出 Latent Transition Memory (LTM)。用冻结的LAM编码器将相邻观测对编码为32维的潜在转移向量，再通过轻量级MLP适配器映射为VLM语义空间中的记忆token，插入到语言指令和当前视觉token之间。
- **关键细节**: 
  - **输入输出**: 输入为历史观测对、当前观测、语言指令和机器人状态；输出为动作块（action chunk）。
  - **模型结构**: 基于 $\pi_{0.5}$ 实例化为 LTM-$\pi$。使用PaliGemma-3B作为VLM骨干，记忆token插入在语言和当前视觉token之间。
  - **推理优化**: 引入延迟机制（lag $k$），允许LAM编码与动作执行异步重叠；使用因果注意力（causal attention）和持久KV缓存（persistent KV cache）支持增量推理，降低计算阻塞。
  - **上下文压缩**: 提出在线相邻token合并策略，在固定token预算（如200）下合并最相似的相邻记忆token，限制记忆长度。
- **训练/优化目标**: 策略和适配器直接从机器人演示数据中学习动作预测损失（如 flow matching），无需记忆特定的语义注释或外部推理模型参与。LAM的训练目标是重建距离（给定前一帧和潜在code重建当前帧），但在本方法中LAM保持冻结。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: RoboMME（16个历史依赖操作任务）和 LIBERO-Mem（10个长视界记忆任务）。
  - **对比对象 (baseline)**: 无记忆 $\pi_{0.5}$、OpenVLA-OFT、MemoryVLA、SAM2Act+、PonderPounce、SimpleMemVLA 等。
  - **真机环境**: Galbot G1 人形机器人，重复抓取计数任务。
- **评价指标**: 任务成功率（Success Rate, %），以及推理延迟/阻塞时间、上下文token数量。
- **主要结果**: 
  - **仿真表现**: 在 RoboMME 上，LTM-$\pi$ (DreamDojo) 达到 58.54% 成功率（无外部推理模型/无特定注释组第一），远超无记忆 $\pi_{0.5}$ 的 17.93%；在 LIBERO-Mem 上达到 80.5%，远超最强 baseline MemoryVAM (UNet) 的 42.5%。
  - **数据 Scaling**: RoboMME 数据扩充 10 倍后，成功率从 57.67% 飙升至 87.50%，证明更广泛的演示覆盖对利用紧凑转移记忆有显著帮助。
  - **效率与消融**: 引入 lag $k=5$ 将 LAM 阻塞时间从 114.25ms 降至 9.47ms，成功率几乎无损（57.88% -> 57.67%）。200 token 预算下，成功率保持在 84.00%（仅降 3.5%），平均 token 数减少至少 38.26%。
  - **真机表现**: 在 Galbot G1 抓取计数任务中，成功率从无记忆的 11.25% 大幅提升至 82.50%。

### 50. 🔥 [A Phenomenology of Neural Geometry in Vision-Language-Action Models] (视觉-语言-动作模型中神经几何的现象学分析)
- **研究机构**: `Goodfire`
- **Arxiv ID**: `2610.20840` | [点击跳转](https://arxiv.org/abs/2610.20840)

**0. 论文标题**
- **英文标题**: A Phenomenology of Neural Geometry in Vision-Language-Action Models
- **中文标题**: 视觉-语言-动作模型中神经几何的现象学分析
- **研究机构**: Goodfire
- **一句话总结**: 本文系统分析了VLA模型内部任务变量的“神经几何”结构，发现物理约束和任务需求会塑造多维且非线性的内部表征（如距离的双尺度正交编码、关节限位导致的开弧表征），并在多个真实机器人VLA模型中验证了该现象的普适性。

**1. 整体逻辑**
- **研究任务**: 分析视觉-语言-动作（VLA）模型内部表征的几何结构（Neural Geometry），即任务相关变量（如位置、距离、姿态等）在模型激活空间中实际描绘的具体形状和拓扑结构。
- **研究动机**: 现有的VLA可解释性工作（如线性探针、稀疏自编码器）只关注变量是否“线性可读（存在性）”，或默认概念是单一方向（线性表征假设）。这忽略了变量在激活空间中实际描绘的几何形状（可能是弯曲或多维的），而后者对于理解模型如何控制机器人以及如何进行有效的激活干预（Steering）至关重要。
- **本质改动**: 将VLA的可解释性研究从“概念是否可读（Readability）”推进到“概念的几何实现（Realized Geometry）”，通过控制变量扫描和激活干预，揭示了物理约束和任务需求如何塑造模型内部的多维/非线性几何结构。
- **技术溯源**: 基于 MolmoBot、$\pi_{0.5}$、MolmoAct2 等 VLA 模型；使用了 MolmoSpaces (基于 ProcTHOR) 仿真环境和 DROID 真实机器人数据集；方法上借鉴了机制可解释性中的线性探针（Linear Probes）、主成分分析（PCA）、激活干预（Activation Interventions）和回拉（Pullback）技术。

**2. 技术拆解**
- **核心方法**: 
  1. **概念形式化**：严格区分“概念实现”（能否通过读出器提取信息）和“实现几何”（概念变化时激活值描绘的轨迹/形状）。
  2. **受控扫描与自然Rollout**：在仿真中通过“瞬移（Teleport）”单变量并固定其他变量来绘制激活轨迹；在真实数据中通过自然轨迹分析。
  3. **子空间与正交性分析**：使用Ridge回归、LDA拟合变量，并通过秩分析、擦除测试（Erasure test）确定子空间维度及正交性。
  4. **激活干预（Steering）与因果验证**：通过训练自编码器映射到流形，或使用Pullback方法从动作梯度反推干预向量，测试干预是作用于模型的“信念（Belief）”还是直接改变“动作指令（Action）”。
- **关键细节**: 
  - 分析了7个控制概念：末端执行器(EE)位置、目标物体位置、目标距离、接触状态、任务阶段、手腕朝向、夹爪开合。
  - 模型架构以 MolmoBot 为例，包含处理图像和文本的 VLM（无本体感觉输入）和处理本体感觉及生成动作的 Action Expert（通过交叉注意力连接 VLM）。
  - 干预细节：手腕朝向干预通过训练 MLP 自编码器将激活映射到圆上实现旋转；夹爪干预通过 Pullback 优化动作输出梯度，寻找仅翻转夹爪状态且保持手臂关节不动的干预向量。
- **训练/优化目标**: 本文非训练新模型，而是分析已有模型。探针使用 Ridge 回归/LDA 的均方误差/分类交叉熵；Pullback 干预的优化目标为：最小化动作输出中夹爪状态与目标状态的误差，同时正则化手臂关节的变化（保持手臂不动）和动作 chunk 的平滑度。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真环境使用 MolmoSpaces (基于 ProcTHOR) 构建的抓取/放置任务数据（包含自然 rollout、物体瞬移、手臂-物体交叉瞬移等）；真实数据使用 DROID 数据集。
  - **对比对象**：主要在 MolmoBot 上进行深度分析，并在 $\pi_{0.5}$ 和 MolmoAct2 上进行跨模型和跨虚实（Sim-to-Real）验证。
- **评价指标**: 探针的 $R^2$（回归）和 Accuracy/AUC（分类）；子空间的 Procrustes 相似度（衡量跨模型几何结构的一致性）；干预后的动作翻转率及关节泄漏率。
- **主要结果**: 
  1. **空间几何**：EE 和目标位置在 VLM 中被编码为近似欧氏的 3D 子空间（$R^2$ 分别达 0.92 和 0.75）；**目标距离**被编码为两个几乎正交的子空间（以 15cm 为界，分为米级粗尺子和厘米级细尺子），打破了单一标量方向的假设。
  2. **任务结构**：接触状态在 VLM 中有鲁棒的二分类方向（即使非计划内的接触也能解码，准确率 91.3%）；任务阶段在 Action Expert 中被编码，但模型依赖运动推断阶段，静止会导致阶段误判为抓取（Grasp）。
  3. **动作几何与干预**：手腕朝向受物理关节限位影响，在 Action Expert 中被编码为**开弧**而非闭合圆；对其进行几何匹配的干预会引发“补偿效应”（作用于信念，模型会反向补偿）。夹爪控制是一维的，通过 Pullback 从动作梯度推导的干预向量可以直接改变动作指令。
  4. **跨模型与虚实迁移**：在真实 DROID 数据上，MolmoBot、$\pi_{0.5}$ 和 MolmoAct2 展现出高度一致的几何结构（特别是夹爪和双尺度距离编码，Procrustes 相似度显著高于随机基线），证明这些几何特征不是仿真假象或单一模型特有，而是 VLA 模型处理操作任务的通用表征方式。

### 51. 🔥 [Multi-Dimensional Featurizers Yield Fine-Grained Steering and Data Shaping in Robot Foundation Models] (多维特征提取器在机器人基础模型中实现细粒度行为引导与数据塑形)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.20767` | [点击跳转](https://arxiv.org/abs/2610.20767)

**0. 论文标题**
- **英文标题**: Multi-Dimensional Featurizers Yield Fine-Grained Steering and Data Shaping in Robot Foundation Models
- **中文标题**: 多维特征提取器在机器人基础模型中实现细粒度行为引导与数据塑形
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机械可解释性领域的方法创新工作，通过在视觉-语言-动作（VLA）模型中引入块稀疏特征提取器（BSF）替代传统稀疏自编码器（SAE），利用多维子空间匹配物理与视觉变量的真实流形几何，实现了对机器人内部表征的细粒度因果干预与训练数据的精准归因。

**1. 整体逻辑**
- **研究任务**: 理解和控制视觉-语言-动作（VLA）模型的内部计算机制，具体包括发现模型内部的可解释特征、通过特征干预引导机器人行为（Steering），以及通过特征归因定位并修改训练数据（Data Shaping）。
- **研究动机**: 现有VLA可解释性工作多依赖线性表征假设（LRH），使用稀疏自编码器（SAE）将特征假设为单一方向（标量）。但这不符合视觉感知和连续物理变量（如视角、位置、关节状态）自然生成的低维流形几何结构，导致特征发现碎片化，行为干预效果往往不一致、偏离目标或过于微弱。
- **本质改动**: 放弃SAE的“单向量/标量”特征假设，改用块稀疏特征提取器（BSF），将特征表示为稀疏的低维子空间（块），以自然契合VLA模型中连续物理和视觉变量的多维几何结构。
- **技术溯源**: 基于块稀疏特征提取器（BSF）、稀疏自编码器（SAE）、线性表征假设（LRH），以及前沿开源VLA模型（MolmoAct2、$\pi_{0.5}$、MolmoBot）和 DROID 数据集。

**2. 技术拆解**
- **核心方法**: 训练块稀疏特征提取器（BSF）。BSF将特征码从标量扩展为向量（块），解码器从单方向扩展为子空间矩阵。通过组稀疏（Group Sparsity）保证整个块作为整体激活或失活，从而在一个块内捕获多维连续变化（如用单个3维块重构螺旋线，而非用多个标量特征拼接）。同时引入Fisher加权优化，使重建误差更关注对动作预测有实际影响的方向。
- **关键细节**: 
  - **输入输出**：输入为VLA模型各层未池化（unpooled）的独立token激活（图像、文本、状态token），输出为重构的激活及特征码。
  - **模型与规模**：在 MolmoAct2、$\pi_{0.5}$、MolmoBot 等模型上训练。收集了约5200万个未池化的token激活（来自约4.5万个episode），比此前 pooled 激活数据大两个数量级。
  - **关键超参**：BSF块维度 $b=3$，活跃块数 $k=21$（对应SAE的 $b=1, k=63$，保证总坐标数一致）；使用 BatchTopK 进行稀疏选择。
- **训练/优化目标**: 
  - **Vanilla BSF**：标准的均方重建误差（MSE）。
  - **Fisher-weighted BSF**：功能重建误差。利用经验Fisher矩阵（基于动作token的对数似然梯度）对重建误差加权，惩罚那些会改变策略输出的方向上的误差，从而保留对控制真正重要的表征。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DROID 数据集（用于训练特征提取器和数据归因），以及各VLA模型自带的仿真/真实训练分布。
  - **对比对象（baseline）**：在相同数据和pipeline下训练的 TopK SAE；数据归因基线包括 TRAK（影响函数）、kNN、差分均值（Diff. means）和随机掩码（Random）。
  - **测试环境**：真实机器人物理环境（用于闭环引导和数据塑形后的评估）。
- **评价指标**: 
  - **特征发现**：激活重建 $R^2$、动作对数似然变化、块内稳定秩（衡量内在维度）、任务变量可解码性（Ridge-probe $R^2$）、单特征消融因果效应。
  - **行为引导**：开环下的“所需特征数量”和“留出集恢复率”；闭环下的“目标选择率”、“抓取成功率”和“任务完成率”。
  - **数据塑形**：掩码特定数据后，机器人重新打开夹爪的时间（衡量 failure recovery 行为的抑制程度），以及正常任务的成功率和完成时间。
- **主要结果**: 
  - **特征发现更优**：BSF在任务变量可解码性和单特征因果消融效应上显著优于SAE。BSF能用更紧凑的块捕获多维流形（如1个3维BSF块即可达到99.7%的几何引导恢复率，而SAE需要更多特征）。
  - **细粒度行为引导**：在闭环目标重定向任务中，BSF平均仅需干预2.3个特征即可达到93.3%的任务完成率，显著优于SAE的2.5个特征和75.0%完成率。
  - **精准数据塑形**：通过BSF发现的“failure recovery”特征（F1515）定位了 DROID 数据集中约6.5%的episode。仅掩码约1.4%的微调token，就能使机器人失败恢复的平均重新打开夹爪时间从1.89秒大幅延长至14.25秒（有效抑制了该行为），同时保持了正常抓取任务100%的成功率，效果全面优于 TRAK 等数据归因基线。

### 52. 🔥 [HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents] (HexaShell：一个用于探索VLM智能体作为机器人编码智能体极限的薄壳系统)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23479` | [点击跳转](https://arxiv.org/abs/2610.23479)

**0. 论文标题**
- **英文标题**: HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents
- **中文标题**: HexaShell：一个用于探索VLM智能体作为机器人编码智能体极限的薄壳系统
- **研究机构**: 原文未提及
- **一句话总结**: 本文构建了一个极简的机器人控制外壳HexaShell，让VLM编码智能体通过编写和修复视觉测量工具来控制机器人，并探明了当前VLM智能体在物理操作中的能力边界（瓶颈在于精密接触而非逻辑推理）。

**1. 整体逻辑**
- **研究任务**: 评估并提升基于视觉语言模型（VLM）的编码智能体在控制双臂机器人执行复杂操作任务时的能力上限，并摸清其在物理世界中的能力边界。
- **研究动机**: 现有的机器人操作排行榜多由端到端的学习策略（如VLA）主导。VLM智能体虽然开始参与竞争，但通常依赖固定外壳或每次生成后即丢弃的代码。此外，VLM在将2D像素转化为精确的3D物理坐标时表现很差，且现有单目深度估计网络误差较大（厘米级），限制了VLM智能体在需要精确物理交互任务中的表现。
- **本质改动**: 摒弃让大模型直接输出动作或每次重新生成完整策略的做法，改为提供一个“只翻译不决策”的极简命令行外壳，让智能体像修bug一样，把学到的物理感知和运动逻辑沉淀为可复用的“工具（小段代码）”，并通过多视角几何（三角测量）替代深度网络来获取精确3D坐标。
- **技术溯源**: 基于 Codex 命令行智能体、GPT-6-Astra 模型、RoboDojo 仿真基准、cuRobo（逆运动学求解）、OpenCV（多视角几何计算）。

**2. 技术拆解**
- **核心方法**: 提出 HexaShell 系统，包含三个核心模块：1) 极简控制外壳（Thin Harness），仅提供基础命令行接口和RGB图像，将指令转为关节运动，不替智能体做决策；2) 视觉测量工具（Tools），利用相机标定和多视角几何（三角测量、平面相交）将2D像素转为3D坐标，必要时主动移动腕部相机获取第二视角（Active Perception）；3) 代码进化循环（Evolution Loop），执行失败后，优化器智能体读取日志诊断错误，修改工具代码并补充单测，实现闭环修复。
- **关键细节**: 
  - 输入输出：输入3个640×480 RGB图像及相机内外参、机械臂状态；输出为机械臂关节轨迹。无深度图输入。
  - 模型配置：使用 GPT-6-Astra (medium reasoning effort)。
  - 工具限制：工具只能使用机器人观测到的信息，严禁硬编码场景先验或读取仿真器Ground Truth。主动获取第二视角会消耗任务的动作步数预算（Step limit）。
  - 修复循环：每个布局最多修复5次，每轮修复中位数耗时6.3分钟。
- **训练/优化目标**: 非传统梯度训练。优化目标是让智能体生成的工具代码能够成功通过当前布局的任务检查器（Checker）。优化器智能体通过阅读失败日志和工具反馈，以“通过任务检查”和“通过单元测试”为信号来修改代码。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboDojo 仿真基准（42个任务，包含双臂ARX X5机器人，涵盖泛化、记忆、长程、精密和开放5大类）。
  - Baselines：排行榜上的顶尖学习策略 VPP2 (World Action Model) 和 PhysicalRSI (VLA)；无工具的 GPT-6-Astra (固定外壳)；使用 Depth Anything V2 深度网络的 HexaShell 变体。
- **评价指标**: 成功率 (Success rate) 和 进度分数 (Progress score)，按 RoboDojo 官方排行榜的五大类任务等权平均计算。
- **主要结果**: 
  - HexaShell 在排行榜指标上达到 39.7% 成功率和 48.0 进度分数，刷新 RoboDojo SOTA，显著优于 VPP2 (32.3%, 39.3) 和 PhysicalRSI (31.4%, 36.3)。
  - 三角测量比 Depth Anything V2 深度网络在排行榜指标上高出 8.7 分（在成对布局比较中赢57输23），证明几何测量比单目深度网络更可靠。
  - 能力边界明确：瓶颈在于物理接触而非推理。推物任务成功率达 92.5%，记忆任务 65.0%，但需要毫米级精度的紧密插入任务仅 8.3%。失败多因动作步数耗尽（执行 gap）或视觉误判（感知 gap），而非逻辑推理错误。

### 53. 🔥 [Look Before You Act: Bridging Active Perception and Vision-Language-Action Models via Observation-Aligned Data Adaptation] (行动前先观察：通过观察对齐的数据适应连接主动感知与视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23378` | [点击跳转](https://arxiv.org/abs/2610.23378)

**0. 论文标题**
- **英文标题**: Look Before You Act: Bridging Active Perception and Vision-Language-Action Models via Observation-Aligned Data Adaptation
- **中文标题**: 行动前先观察：通过观察对齐的数据适应连接主动感知与视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 ActiveAlign 数据适应框架，通过离线生成与主动感知终点状态对齐的演示数据来微调 VLA 模型，解决了主动相机运动导致的初始状态分布偏移问题，大幅提升了机器人在遮挡环境下的操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人在杂乱或遮挡环境下的视觉-语言-动作（VLA）策略操作任务。
- **研究动机**: 在操作前移动相机寻找目标（主动感知）会改变机器人的视觉和关节状态。这种“首帧分布敏感”问题会导致推理时的初始状态严重偏离 VLA 模型的训练分布。直接拼接主动感知和 VLA 会导致成功率暴跌（例如 $\pi_{0.5}$ 从 46.3% 骤降至 11.5%）。
- **本质改动**: 不修改 VLA 模型架构，而是改变训练数据。在离线数据构建阶段，让主动感知的终点与现有演示的早期状态对齐，用闭环控制补齐残差并重放后续操作，仅保留成功的轨迹来微调 VLA，使其适应主动感知带来的新状态分布。
- **技术溯源**: 基于视觉-语言-动作模型（$\pi_0$, $\pi_{0.5}$, OpenVLA, GR00T N1），主动感知模块使用了 CLIP 特征提取和自回归解码器。

**2. 技术拆解**
- **核心方法**: ActiveAlign 数据适应框架。包含一个学习到的视点模块（用于生成相机轨迹）和一套离线数据对齐流程（前缀匹配、闭环对齐、重放过滤）。
- **关键细节**: 
  - **视点模块**：输入场景 RGBD 和语言指令，通过 CLIP 分支和条件自回归解码器输出相机位姿序列（默认生成 30 个位姿，插值到 120 个平滑执行）。
  - **数据对齐流程**：在可重置环境中执行相机轨迹，在演示前缀窗口（默认 $[0.05T, 0.30T]$）内寻找最近的末端执行器状态。使用操作空间控制（OSC）或笛卡尔控制进行闭环对齐（默认 20 步预算），然后重放后续操作。
  - **规模与超参**：视点模块训练使用了 2 万条仿真数据和 1200 条物理数据。
- **训练/优化目标**: VLA 的标准监督学习目标（Token 预测或连续动作损失）。ActiveAlign 本身不直接优化，而是提供经过“可行性过滤”的对齐微调数据集。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：LIBERO（4 个 suite 共 40 个任务）、LIBERO-Occ（初始遮挡）、RLBench（仅用于感知零样本迁移可视化）、物理环境（ARX X5 和 ARCHER-Y6 机械臂，配 RealSense D435 相机）。
  - **对比对象（Baseline）**：Standard（原始 VLA 训练，无主动感知）、Naive Active（推理时直接加主动感知，不重训）、Matched-state control（固定状态但用默认视角）、Random-view adaptation（随机视角适应）、Broad viewpoint jitter（宽泛视角抖动）。
  - **VLA 骨干**：$\pi_0$, $\pi_{0.5}$, OpenVLA, GR00T N1。
- **评价指标**: 任务成功率（%），物理实验使用 Wilson 95% 置信区间。
- **主要结果**: 
  - **解决分布偏移**：在 LIBERO 扰动起点设置下，Naive Active 导致 $\pi_0$ 和 $\pi_{0.5}$ 成功率暴跌至 7.0% 和 11.5%；而 ActiveAlign 将其分别拉升至 70.7%（+40.0%）和 72.7%（+26.4%）。
  - **控制实验验证**：Matched-state control（54.6%）、Random-view（58.0%）和 Broad jitter（61.4%）均显著低于 ActiveAlign（78.2%），证明收益来自于“部署匹配的视点适应”，而非单纯的数据增加或缩短前缀。
  - **跨骨干有效**：OpenVLA 提升 13.2%，GR00T N1 提升 16.0%，说明该方法与不同的动作参数化方式兼容。
  - **物理遮挡表现**：在 90 次物理遮挡测试中，ActiveAlign 成功 83 次（92.2%），远超 Standard 的 35 次（38.9%）和 Naive Active 的 17 次（18.9%）。

### 54. 🔥 [Beyond Success Rate: Interventional Evaluation of Memory in Vision-Language-Action Systems] (超越成功率：视觉-语言-动作系统中记忆的干预性评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23372` | [点击跳转](https://arxiv.org/abs/2610.23372)

**0. 论文标题**
- **英文标题**: Beyond Success Rate: Interventional Evaluation of Memory in Vision-Language-Action Systems
- **中文标题**: 超越成功率：视觉-语言-动作系统中记忆的干预性评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套干预性记忆评估协议（IMEP）和新基准ChainBench，通过控制变量和分离决策与执行，揭示了现有VLA系统的记忆模块往往只是改变了输出结果，但并未真正利用到“任务相关事实”。

**1. 整体逻辑**
- **研究任务**: 评估具身智能（VLA）系统中“记忆（Memory）”模块的真实有效性，判断模型是否真的用到了历史中的关键事实，还是仅仅走了捷径。
- **研究动机**: 现有的VLA记忆评估只看“成功率”的消融实验，这存在三个盲区：1) 开启记忆同时改变了信息和计算图；2) 总体成功率不变会掩盖部分trial中“成与败”的相互抵消；3) 无法证明模型是真的用到了“任务相关事实”，可能只是产生了因果混淆或模仿行为。
- **本质改动**: 抛弃单一的成功率指标，提出干预性记忆评估协议（IMEP）。在检索接口处做细粒度的控制变量干预（如替换事实、保留事实、微小数值扰动），并严格分离“决策正确性”和“动作执行成功率”，从而验证记忆是否真正提供了“事实特异性”的收益。
- **技术溯源**: 基于现有的VLA记忆架构（如MemoryVLA、learned banks、event keyframes等），在MIKASA-Robo、SimplerEnv（Fractal/Bridge）和LIBERO等仿真环境中进行评估。

**2. 技术拆解**
- **核心方法**: 提出干预性记忆评估协议（IMEP）和配套基准ChainBench。IMEP围绕四个问题展开：净收益、适用条件、结果敏感性、事实特异性。通过在固定检索接口注入不同的干预，计算决策和执行的翻转率。ChainBench则专门构造了“当前观测缺失关键信息，必须依赖历史记忆”的多episode任务链。
- **关键细节**: 
  - **干预设计**：对比参考记忆(A)、阻断记忆(N)、提供正确事实(O)。控制组包括精确重复(C)和1-ULP（最小浮点精度）数值扰动(U)。替换组包括同事实替换(S)和异事实替换(T)。
  - **评估解耦**：将“决策准确率（Decision accuracy）”和“任务/动作执行成功率（Task success/Motor execution）”分开统计，避免物理执行误差掩盖决策层面的问题。
  - **ChainBench细节**：基于LIBERO，包含写入episode和干扰episode，查询时抽屉关闭且目标外观一致，强制要求回忆历史事实。使用冻结的 $\pi_{0.5}$ 策略执行动作，并共享物理执行记录以控制变量。
- **训练/优化目标**: 本文非训练类工作，核心机制是“干预与归因分析”。通过计算净收益 $D_X$、结果敏感性 $\rho_X$（干预导致的outcome flip比例），以及事实特异性 $\theta = \rho_T - \rho_S$（异事实替换与同事实替换的敏感性差值）来进行量化评估。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：MIKASA-Robo (Shell Game, Remember Color), SimplerEnv (Fractal, Bridge), LIBERO (ChainBench)。
  - **对比对象（Baseline）**：无记忆、初始事实基线、打乱记录、Oracle决策、以及各类控制干预（C/U/S/T）。
- **评价指标**: 任务成功率（SR）、决策准确率（Decision accuracy）、结果敏感性（$\rho$）、事实特异性（$\theta$）。
- **主要结果**: 
  - 在现有的learned banks（如MIKASA, SimplerEnv）中，虽然干预（如1-ULP扰动或替换）会改变部分结果（例如Remember Color中1-ULP改变了11.9%的结果），但**未能建立“事实特异性”**（改变关键事实并没有比保留事实的替换产生明显的额外影响），且多数净收益未达到显著标准。
  - 在ChainBench中，完整记忆配置将任务成功率从39.1%大幅提升至74.3%，决策准确率达到100%，匹配了共享记录执行下的Oracle上限，证明了正确历史确实能支持机器人决策。
  - 在ChainBench的独立scripted reader实验中，只有异事实替换（T）改变了所有决策（401/401），证明了在curated records下该读取器具备严格的事实特异性。

### 55. 🔥 [LAW: Unifying Language, Action, and World Modeling for Agentic Physical Intelligence] (LAW：统一语言、动作与世界建模以实现智能体物理智能)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23334` | [点击跳转](https://arxiv.org/abs/2610.23334)

**0. 论文标题**
- **英文标题**: LAW: Unifying Language, Action, and World Modeling for Agentic Physical Intelligence
- **中文标题**: LAW：统一语言、动作与世界建模以实现智能体物理智能
- **研究机构**: 原文未提及
- **一句话总结**: 提出LAW框架，以“语义子任务进度”为核心接口，通过混合频率的VLM-WAM闭环协同和MoTE架构，解决了长视野机器人操作中语言规划与底层控制脱节的问题。

**1. 整体逻辑**
- **研究任务**: 长视野（long-horizon）机器人双臂操作任务，即包含多个语义子任务的复杂序列操作（如整理物品、多米诺骨牌等）。
- **研究动机**: 现有的VLA或WAM模型在长视野部署时，推理（规划）和控制（动作生成）无法保持对齐。一次性生成的语言计划无法感知中间步骤是否完成，而仅依赖当前观测的动作生成器缺乏全局目标上下文，导致误差随时间累积。传统的“Planner+Policy”串联架构在进度更新、动作评估和历史记忆保留上存在接口缺陷。
- **本质改动**: 将“语义子任务进度”作为连接语言推理（VLM）和世界-动作建模（WAM）的时间接口。设计了一个混合频率的闭环控制机制，让规划、状态评估和动作生成在不同频率下协同工作，而不是在每个控制步都调用大模型。
- **技术溯源**: VLM基座采用 Qwen3-VL-2B-Instruct；WAM基座采用 Wan2.2-TI2V-5B（视频分支）和 ActionDiT（动作分支），并兼容 Fast-WAM 和 OpenWAM-$\alpha$。

**2. 技术拆解**
- **核心方法**: 
  1. **混合专家VLM (Hybrid-Expert VLM)**：共享冻结骨干，通过LoRA适配器分离出规划（Planner）、状态评估（State）和价值评估（Value）三个专家，各司其职。
  2. **混合频率协调 (Mixed-Frequency Coordination)**：Planner仅在子任务边界触发；WAM生成和Value评估同步进行；State专家异步非阻塞运行，实时判断子任务是否完成并触发状态切换。
  3. **MoTE (Mixture-of-Transformer Experts)**：在WAM的混合注意力后引入MoE层，包含模态私有专家和共享专家，增强视频和动作特征的联合非线性变换。
  4. **双流分层记忆 (Dual-Stream Hierarchical Memory)**：为VLM和WAM分别维护记忆流，保留近期高分辨率观测和子任务边界观测，对长期历史进行空间压缩。
  5. **子任务局部价值学习 (Subtask-Local Value Learning)**：在语义子任务边界截断TD目标，保留失败轨迹中已完成子任务的正向监督信号。
- **关键细节**: 
  - **输入输出**：输入为多视角RGB图像（1场景+2腕部）和16维末端执行器(EEF)状态；输出为32步的动作块（Action chunk，含位置、四元数和夹爪状态）。
  - **模型规模**：VLM骨干2B参数，LoRA增加约100M参数。WAM基于5B视频模型。
  - **关键超参**：动作块长度H=32，WAM采样N=32个候选，Value专家保留Top-K=8，融合温度T=1。State专家单次推理约60ms。
- **训练/优化目标**: 
  - **Planner**：自回归生成剩余子任务序列的交叉熵损失。
  - **State**：二分类交叉熵（子任务完成度预测 + 辅助的失败预测）。
  - **WAM**：视频预测损失 + 动作预测损失 + MoE路由正则化（负载均衡和logits正则）。
  - **Value**：基于子任务局部回报的分类交叉熵（101个bin的分布回归），使用高斯核构建软标签。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboTwin（50个双臂仿真任务），RoboDojo（35个仿真能力基准），真实机器人任务（Puzzle, Domino, Organize，基于AgileX Cobot Magic平台）。
  - **Baseline**：X-VLA, $\pi_{0.5}$, Qwen-RobotManip, Motus, Fast-WAM, LingBot-VA 2.0, Embodied-R1.5, GPT-5.5 High等。
- **评价指标**: 
  - 仿真（RoboTwin）：Clean和Rand设置下的平均成功率（%）。
  - 仿真（RoboDojo）：五个能力维度（Generalization, Precision, Long-Horizon, Memory, Open）的Score和Success。
  - 真实机器人：完整任务成功率（SR）和任务进度得分（Score，按完成子任务比例计算，0-100）。
- **主要结果**: 
  - **RoboTwin**：LAW+Fast-WAM平均成功率94.21%（比Fast-WAM高2.38%）；替换WAM骨干为OpenWAM-$\alpha$后达到95.56%，创下开源SOTA。
  - **VLM对比**：2B参数的LAW VLM（93.80%）显著优于同等框架下的 Embodied-R1.5（88.8%）和 GPT-5.5 High（88.7%），证明专用小模型在闭环控制中更有效。
  - **RoboDojo**：在无额外机器人预训练的方法中，各维度得分和成功率全面领先（平均Score 6.47 / Success 3.82%），尤其在Long-Horizon和Memory维度优势明显。
  - **真实机器人**：3个长视野任务（最多9个子任务）平均成功率65%（$\pi_{0.5}$为28.33%，Fast-WAM为25%），进度得分84.06，验证了其在复杂物理世界中的长视野执行能力。

- **实验设置**: 原文未提及（本文为综述，无具体实验设置；对比对象为各类代表性的VLA记忆系统）。

- **主要结果**: 发现了一个明显的工程权衡：VLA记忆系统的架构复杂度越高，其开源成熟度通常越低。此外，明确了构建全生命周期记忆系统的两大核心挑战：高效的记忆管理和终身知识演化。

### 57. 🔥 [LY-GWM-RoboCasa-Human300: Prediction-Guided Action Selection with a Graph Dynamics Model] (LY-GWM-RoboCasa-Human300：基于图动力学模型的预测引导动作选择)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23274` | [点击跳转](https://arxiv.org/abs/2610.23274)

**0. 论文标题**
- **英文标题**: LY-GWM-RoboCasa-Human300: Prediction-Guided Action Selection with a Graph Dynamics Model
- **中文标题**: LY-GWM-RoboCasa-Human300：基于图动力学模型的预测引导动作选择
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种在机器人推理阶段结合图动力学模型和奖励评分器进行多动作候选预测与选择的策略，通过“先预测后选择”的机制提升具身智能任务的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人在复杂环境（如 RoboCasa 厨房）中的策略控制与操作任务执行。
- **研究动机**: 现有的动作生成策略在推理时通常直接输出动作，缺乏对未来状态的预测和评估，容易在长视野或复杂任务中因累积误差或次优动作序列导致任务失败。
- **本质改动**: 在推理阶段引入“预测-选择”机制。不再盲目执行动作生成器的直接输出，而是生成多个动作候选，利用图动力学模型推演未来状态，并挑选预测奖励最高的动作执行，将开环生成转变为闭环的预测引导选择。
- **技术溯源**: 基于 GR00T-N1.5（动作生成基座，使用 Human300 数据集微调）、图动力学模型（Graph Dynamics Model）以及二元状态奖励评分器。

**2. 技术拆解**
- **核心方法**: 推理时的预测引导动作选择（Prediction-Guided Action Selection）。系统在推理时采样多个动作块，利用图动力学模型预测每个候选动作对应的未来潜在特征和机器人状态，然后通过二元状态奖励评分器计算每个预测状态的奖励 logit，最终执行得分最高的候选动作。
- **关键细节**: 
  - 系统包含三个核心组件：经 Human300 微调的 GR00T-N1.5 动作生成器、动作条件图动力学模型、二元状态奖励评分器。
  - 推理时每次采样 4 个动作块（action chunks）作为候选。
  - 预测视野（prediction horizon）设定为 16 步。
  - 在评估期间，所有三个组件均保持冻结，不进行在线更新。
- **训练/优化目标**: 原文未提及具体的损失函数形式。机制上，图动力学模型的优化目标是预测未来的潜在特征和机器人状态；二元状态奖励评分器的优化目标是拟合预测状态的二元奖励并输出 logit。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboCasa 1.0.1 的 pretrain kitchen split。
  - 对比对象（baseline）：历史自训练的 GR00T-N1.5 基线。
  - 评估规模：本地评估在 50 个任务上进行，每个任务 50 个 episode（共 2500 次）；官方评估由 RoboCasa 维护者在 50 个任务上进行（共 1500 次）。
- **评价指标**: 任务成功率（成功次数 / 总评估次数）。
- **主要结果**: 
  - 本地评估：系统成功率为 8.28% (207/2500)，相比 baseline 的 7.24% (181/2500) 提升了 1.04 个百分点（多出 26 次成功）。其中原子任务组（atomic group）从 141/900 提升至 150/900。
  - 官方评估：在 50 个任务上的整体成功率为 23.6% (354/1500)。在排行榜细分指标上，Atomic-Seen、Composite-Seen 和 Composite-Unseen 的成功率分别为 48.3%、16.3% 和 3.1%。
  - 机制验证：本地审计记录了 212,700 个被改变的环境输入块（其中原子任务 28,223 个），证明预测选择机制确实改变了实际输入环境的动作序列，并带来了正向的性能提升。

### 58. 🔥 [NestedVLA: Learning to Consolidate and Generate Skills for Vision-Language-Action Models] (NestedVLA：学习整合与生成视觉-语言-动作模型的技能)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23271` | [点击跳转](https://arxiv.org/abs/2610.23271)

**0. 论文标题**
- **英文标题**: NestedVLA: Learning to Consolidate and Generate Skills for Vision-Language-Action Models
- **中文标题**: NestedVLA：学习整合与生成视觉-语言-动作模型的技能
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出用嵌套超网络直接“生成”VLA模型动作专家的参数更新，来替代传统的参数“合并”，在仅1.5倍存储开销下实现了多任务技能的高效整合，性能大幅碾压现有的模型合并方法。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的多任务技能整合（Skill consolidation）。即在不重新训练或合并底层数据的情况下，将多个独立微调的VLA策略整合到一个紧凑的模型中，以支持多任务部署。
- **研究动机**: VLA模型搞多任务联合训练时，数据往往凑不到一起（数据孤岛），且容易互相干扰。如果事后把独立微调的模型合并起来，传统的参数平均或动态掩码会导致严重的参数冲突和性能崩溃。作者分析发现，不同任务在动作专家（action expert）部分的参数更新方向几乎正交（弱对齐），硬合并根本行不通。
- **本质改动**: 把传统的“参数聚合（直接合并权重增量）”改成了“参数生成”。不再把多个任务的权重delta硬凑在一起，而是训练一个嵌套的超网络，根据任务ID直接“算出”动作专家的参数增量。
- **技术溯源**: 基于开源的VLA基座 $\pi_{0.5}$（包含VLM和action expert），借鉴了超网络（HyperNetworks）生成参数的思想，以及 drop-and-rescale 的稀疏化压缩方法。

**2. 技术拆解**
- **核心方法**: NestedVLA框架分三步走：1) 独立微调获取任务向量，用 drop-and-rescale 压缩成稀疏技能；2) 训练一个嵌套超网络，以任务ID为条件，吸收所有动作专家的稀疏目标；3) 推理时，超网络生成动作专家增量，与保留的VLM增量一起叠加到冻结的基座上。
- **关键细节**: 
  - **基座模型**：$\pi_{0.5}$（约3.61B参数，拆成3.21B的VLM和0.40B的action expert）。
  - **超网络设计**：把参数空间切成2D patch，通过任务ID和patch坐标（参数类型、层数、空间坐标）进行条件生成。网络包含 per-task patch embeddings、2D conv task encoder、shared FC trunk，以及每个任务独立的 multi-head output。
  - **存储策略**：VLM部分保留 per-task 的 top-10% 压缩增量，action expert 部分由超网络生成（仅存mask），总存储约为单模型的1.5倍。
- **训练/优化目标**: 多任务掩码均方误差（masked MSE）损失。只在 mask 为1（保留的 top-K 参数）的位置计算 L2 距离。基座 VLA 全程冻结，仅训练超网络参数。（消融实验发现去掉 out-of-mask penalty 效果最好）。

**3. 实验结果**
- **实验设置**: 
  - **数据集/Benchmarks**：MetaWorld（32个任务）、ManiSkill（25个任务）、CALVIN ABC-D（长视野语言条件任务）。
  - **对比对象（Baseline）**：静态合并（Averaging, TIES, WUDI, TSV-Merging），动态合并（TALL-Mask, EMR-Merging, Twin-Merging, Free-Merging），以及独立微调的上界（Per-task FlowSDE）。
- **评价指标**: MetaWorld和ManiSkill用 `success_once`（轨迹中任意时刻到达目标的比例），CALVIN用 `success_at_end`（完成整个任务链的比例）。同时评估存储开销（相对于单模型的倍数）。
- **主要结果**: 
  - NestedVLA平均成功率达到66.7%，比最强的动态合并baseline（Free-Merging的25.6%）高出41.1个百分点。
  - 在ManiSkill上达到87.2%，距离独立微调上界（88.1%）仅差0.9个百分点（within 1 pp）。
  - 在CALVIN上达到75.0%，大幅缩小了与独立微调的差距。
  - 存储开销仅为1.5倍，是支持任务条件生成的方法中最省的。MetaWorld上的性能gap主要受限于10%稀疏度本身的理论上界，而不是超网络容量不够。

### 59. 🔥 [ORD-WM: Learning Object-Centric Rigid Dynamics for 3D World Modeling in Robotic Manipulation] (ORD-WM：学习以物体为中心的刚体动力学用于机器人操作中的3D世界建模)
- **研究机构**: `哈尔滨工业大学（深圳）`
- **Arxiv ID**: `2610.23156` | [点击跳转](https://arxiv.org/abs/2610.23156)

**0. 论文标题**
- **英文标题**: ORD-WM: Learning Object-Centric Rigid Dynamics for 3D World Modeling in Robotic Manipulation
- **中文标题**: ORD-WM：学习以物体为中心的刚体动力学用于机器人操作中的3D世界建模
- **研究机构**: 哈尔滨工业大学（深圳）
- **一句话总结**: 提出了一种以物体为中心的3D世界模型，通过在隐空间中直接施加解析的SE(3)刚体变换来预测物体运动，解决了多步推演中的形状漂移问题，并支持高效的实时模型预测控制。

**1. 整体逻辑**
- **研究任务**: 机器人操作任务中的3D世界建模、多步动力学预测以及基于模型的预测控制（MPC）。
- **研究动机**: 现有的基于图像或密集3D（点云/粒子/高斯）的世界模型缺乏显式的物体级刚体运动约束。在多步推演（multi-step rollout）时，局部元素的独立更新难以协调，容易累积误差，导致物体形状漂移（shape drift）或几何不一致。
- **本质改动**: 放弃直接预测无约束的下一帧隐状态，改为预测物体级的 SE(3) 运动增量，并利用等变向量神经元（Vector Neurons）的特性，将预测的刚体变换解析地（analytically）应用到当前的几何隐状态上，从而在结构上保证物体几何的持久性。
- **技术溯源**: Vector Neurons (VN), Variational Autoencoder (VAE), Signed Distance Fields (SDF), Transformer, Segment Anything Model 3 (SAM 3), LIBERO, RoboCasa。

**2. 技术拆解**
- **核心方法**: 
  1) 训练一个由SDF监督的向量神经元变分自编码器（SDF-VNVAE），将物体点云编码为具有SO(3)等变性的3D向量特征隐状态；
  2) 使用Transformer动力学模型预测物体级的SE(3)运动增量；
  3) 将预测的旋转和平移解析地应用到隐状态向量上，实现无几何失真的多步推演。
- **关键细节**: 
  - **输入与感知**：多视角RGB-D图像，通过SAM 3分割并融合为物体级点云。
  - **隐状态表示**：每个物体由 $K$ 个3D向量特征（后验均值）和物体中心坐标组成。向量特征随物体旋转而等变旋转。
  - **动力学模型架构**：将浮动物体、固定物体、夹爪部件和动作（夹爪部件的相对刚体变换）tokenize 后输入4层 Transformer。输出浮动物体的平移增量和6D旋转表示，并映射为合法的旋转矩阵。
- **训练/优化目标**: 
  - **SDF-VNVAE**：SDF重建损失（L1） + Eikonal 正则化（保证SDF梯度范数为1） + KL 散度正则化。
  - **动力学模型**：浮动物体的 SE(3) 位姿损失（旋转矩阵F范数平方 + 平移L2） + 辅助距离损失（预测物体到夹爪和最近浮动物体的距离，MSE）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO (Spatial, Object, Goal, Long) 和额外的1000条仿真物体推动轨迹。
  - **对比对象（baseline）**：PointWorld 及其在 LIBERO 上微调的版本 PointWorld (ft)；以及多个消融变体（w/o SE(3) update, w/o VN and SE(3) update, w/o VN, Decoupled Geo.+Pose）。
  - **真实环境**：Franka Research 3 机械臂，3个 RealSense D435 相机。
- **评价指标**: 
  - **多步预测**：移动/静止点的逐点 L2 误差，形状一致性倒角距离（Shape Consistency CD，衡量全轨迹的形状漂移），表面 CD。
  - **控制性能**：MPC 成功率、最终位置误差、平均执行步数、单次规划时间。
- **主要结果**: 
  - **多步预测**：ORD-WM 在 1步、10步和全轨迹的 L2 误差和形状一致性 CD 上均显著优于 PointWorld。例如在全轨迹 Shape Consistency CD 上，ORD-WM 为 0.00（残差<0.05mm），而 PointWorld 为 19.87，微调后的 PointWorld (ft) 为 3.58。
  - **消融实验**：直接预测隐状态（w/o SE(3)）会导致严重的几何变形和误差累积；使用 VN 表示结合 SE(3) 更新不仅保持了形状，还避免了每步重新编码点云，大幅提升了推演速度（Batch=1 时 FPS 从 162 提升到 784）。
  - **真实世界 MPC**：在推动任务中，使用 1024 个候选动作时，成功率达 90%，平均位置误差降至 0.972 cm，单次重规划时间在 RTX 3090 上低于 0.3 秒（269.9 ms），证明了其支持高效闭环控制的能力。

### 60. 🔥 [BeJEPA: A Goal-Conditioned Humanoid Behavior World Model via Unsupervised RL] (BeJEPA：一种通过无监督强化学习实现的目标条件人形行为世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23127` | [点击跳转](https://arxiv.org/abs/2610.23127)

**0. 论文标题**
- **英文标题**: BeJEPA: A Goal-Conditioned Humanoid Behavior World Model via Unsupervised RL
- **中文标题**: BeJEPA：一种通过无监督强化学习实现的目标条件人形行为世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能与机器人控制领域的方法创新工作，提出了一种解耦单步物理动态与长期后继特征预测的无监督强化学习世界模型（BeJEPA），解决了人形机器人在全身控制中难以同时兼顾身体姿态与世界坐标系绝对位姿的难题。

**1. 整体逻辑**
- **研究任务**: 人形机器人的全身控制（Whole-body control, WBC），具体为目标条件下的长程运动跟踪（motion tracking）和目标到达（goal reaching），要求机器人同时协调身体姿态与在世界坐标系中的绝对位置和朝向。
- **研究动机**: 主流控制器通常在根坐标系（root frame）下模仿轨迹，一旦机器人发生位移，就很难在目标世界姿态下恢复正确位置。现有的无监督RL方法（如BFM-Zero）多基于身体相对特征，忽略了绝对位置和朝向；而基于重建的世界模型容易受无关细节干扰，且长程想象展开（long imagined rollouts）极易累积误差。
- **本质改动**: 将世界模型解耦为“单步物理动态预测（Dynamic）”和“目标条件长期后继特征预测（Successor）”。在共享的联合嵌入空间（JEPA）中，用单步物理预测接地表征，用后继特征总结长期行为，从而避免长程想象展开，直接指导策略改进。
- **技术溯源**: 联合嵌入预测架构（JEPA / I-JEPA）、后继特征（Successor Features / Forward-Backward representations）、无监督强化学习（Meta Motivo / BFM-Zero）、模型预测控制（Dream-MPC）。

**2. 技术拆解**
- **核心方法**: 提出 BeJEPA 框架，包含共享状态编码器、Dynamic Predictor、Successor Predictor 以及 Actor。通过组合这两个预测器计算动作价值（Q值）来指导策略更新。同时，利用 Dynamic 进行在线基于梯度的潜在模型预测控制（MPC），实现时间索引的跟踪与动作细化。
- **关键细节**: 
  - **输入输出**：输入包含本体感知、估计的根姿态（位置+朝向）、近期传感器和动作历史；输出为29个关节目标（用于底层PD控制器）。
  - **模型结构**：共享潜在空间维度 $d=256$。State/goal encoder (7.12M), Dynamic (27.44M, 2个ensemble), Successor (53.57M, 2个ensemble), Actor (31.64M)。使用 History Encoder 将特权状态蒸馏到仅依赖可部署观测的表征中，便于 Sim2Real。
  - **规模**：4096个并行 Isaac Sim 环境预训练，Replay buffer 容量 5.12M。
- **训练/优化目标**: 
  - **Dynamic 损失**：预测下一步状态嵌入（MSE），提供物理监督，使表征 grounded 于真实的物理转移。
  - **Successor 损失**：使用TD目标预测折扣未来状态嵌入（MSE），组织长期行为，评估动作的长期目标对齐度。
  - **Actor 损失**：最大化组合Q值（Dynamic预测的下一步状态输入Successor后与目标嵌入的内积），结合运动先验（CPR）和物理执行惩罚（AUX）。
  - **表征正则化**：正交损失防止特征冗余，手腕/根姿态重建损失保留精细控制细节。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：AMASS 和 LAFAN（选取20秒的非交互片段进行长距离跟踪评估，保留大空间偏差轨迹以公平评估世界坐标误差）。
  - **对比对象（baseline）**：SONIC, Humanoid-GPT, BFM-Zero (retrained with world-pose inputs)。
  - **硬件环境**：Unitree G1 人形机器人（配备LiDAR和FAST-LIO提供位置/朝向估计）。
- **评价指标**: 全局和局部平均每关节位置误差（MPJPE_G, MPJPE_L），根平移和朝向误差（Root err.），局部手腕位置和朝向误差（Wrist err.）。
- **主要结果**: 
  - 在 AMASS 数据集上，BeJEPA 的全局身体位置误差（Root err.）相比 BFM-Zero (world) 降低 61.7%，相比 SONIC 降低 58.7%（全局 MPJPE 也显著降低）。
  - 在 LAFAN 数据集上，BeJEPA 同样在所有评估的 baseline 中取得了最低的 Root err. 和全局 MPJPE。
  - 结合在线 MPC 细化（BeJEPA-MPC），所有6项误差指标进一步降低，且显著减少了时间跟踪延迟（AMASS上平均延迟从 94.8ms 降至 21.2ms）。
  - 硬件部署验证：Unitree G1 成功实现了姿态与世界位姿的联合控制，展示了受扰动后的闭环恢复、从地面起身的恢复能力，以及连续目标切换下的空间参考保持。

- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于随机核的、与架构无关的概率框架，将 VLA 和 WAM 等具身基础模型的输出分布、动作解码与预/后训练过程统一映射为闭环机器人控制策略。

**1. 整体逻辑**
- **研究任务**: 为具身基础模型（如 VLA 和 WAM）建立一个统一的数学与概率描述框架，打通从模型预训练、后训练到最终闭环控制策略（Policy）的完整链路。
- **研究动机**: 现有的 VLA（视觉-语言-动作模型）和 WAM（世界-动作模型）在模型架构、输出表示（如直接输出动作、输出视频+动作、输出动作 token 等）和学习目标上差异巨大。非具身大模型只需拟合固定数据分布，而具身模型需要诱导一个能在闭环交互中表现良好的策略，现有文献缺乏一个统一视角来连接模型输出、动作实现机制（解码/调度）与训练目标。
- **本质改动**: 引入“条件输出分布”和“动作实现核（action-realization kernel）”两个随机核概念，将异构的模型输出统一转化为可执行动作，并在概率层面上与预训练/后训练的损失函数对齐。

**2. 技术拆解**
- **核心方法**: 提出基于随机核的统一公式：1) 用条件输出分布 $f_\theta$ 表征模型输出，用动作实现核 $q_\theta$ 表征从输出到可执行动作的映射（包含解码、调度、平滑等），两者结合诱导任务条件策略 $\pi_\theta$；2) 统一了预训练（纯离线）和后训练（离线+在线混合）的经验损失函数形式；3) 抽象了 6 种主流输出范式（直接动作、联合视频动作块、动作 token、动作块、隐式动作、视频计划）。
- **关键细节**: 
  - **框架实例化 1 (OpenVLA)**：视觉用 DINOv2+SigLIP 提取特征，经 MLP 投影后与语言 token 拼接，输入 Llama 2 7B 自回归预测 7 个动作 token，解码为 7 维连续动作。部署时采用贪心解码（确定性动作实现）。
  - **框架实例化 2 (DreamZero)**：基于 Wan2.1 的 DiT 骨干，将视频 VAE 潜变量与归一化动作拼接，通过 Flow matching 联合生成未来视频帧和动作块。部署时采用异步生成与执行（随机性/调度动作实现）。
- **训练/优化目标**: 
  - **预训练**：最小化基于离线数据集的经验预训练损失（如 OpenVLA 的动作 token 交叉熵损失，DreamZero 的联合 Flow matching 速度预测损失）。
  - **后训练**：最小化混合离线与在线数据的经验后训练损失（通过权重 $\alpha_k$ 控制比例，文中实例化均使用了纯离线 SFT，即 $\alpha_k=0$）。

**3. 实验结果**
- **实验设置**: 原文未提及（本文为理论框架/公式化工作，未设计新的对比实验或消融实验，仅对 OpenVLA 和 DreamZero 进行了数学实例化）。
- **评价指标**: 原文未提及。
- **主要结果**: 原文未提及（文章核心贡献是提出统一的概率语言和理论框架，澄清了预/后训练如何塑造闭环策略，未提供具体的性能提升数值）。

### 62. 🔥 [Robotic Spatiotemporal Editing: A Unified Interface for Controllable Action Generation via Masked Action Reconstruction] (机器人时空编辑：通过掩码动作重构实现可控动作生成的统一接口)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.23002` | [点击跳转](https://arxiv.org/abs/2610.23002)

**0. 论文标题**
- **英文标题**: Robotic Spatiotemporal Editing: A Unified Interface for Controllable Action Generation via Masked Action Reconstruction
- **中文标题**: 机器人时空编辑：通过掩码动作重构实现可控动作生成的统一接口
- **研究机构**: 原文未提及
- **一句话总结**: 提出掩码动作空间（MAP）统一接口，将各类异构的时空控制信号转化为动作补全（inpainting）问题，使单一机器人策略能灵活处理并组合多种时空约束来生成可控动作。

**1. 整体逻辑**
- **研究任务**: 机器人可控操作（Controllable robot manipulation），即根据用户或上游模型指定的多样化时空约束（如关键点、光流、位姿等），生成符合约束的机器人执行动作。
- **研究动机**: 现有的生成式策略虽然能合成复杂行为，但难以通过多样化的时空参考进行精确控制和编辑。现有方法通常针对特定信号（如仅关键点或仅轨迹）设计特定的策略或条件注入机制，缺乏一个能统一转换各类异构时空参考为可控机器人行为的通用接口。
- **本质改动**: 将各种异构的时空控制参考视为同一个时间笛卡尔动作空间（Temporal Cartesian Action Space）的部分指定（partial specifications），把可控动作生成问题转化为掩码动作补全（masked action inpainting）问题。
- **技术溯源**: 基于 Diffusion Policy (DP) / Diffusion Transformer (DiT) 等扩散模型策略，结合 SARM（用于任务进度估计）、RePaint（用于推理时免训练补全），以及 CLIP / DINOv2（用于视觉特征提取）。

**2. 技术拆解**
- **核心方法**: 提出掩码动作空间（MAP）接口和补全策略（Inpainting Policy, IP）。MAP 将异构参考映射为部分指定的动作 token 和二元掩码；IP 通过重构缺失的动作维度来生成完整轨迹。框架包含三个核心组件：进度引导的滑动窗口对齐、多掩码联合训练策略、以及免训练的 RePaint 推理策略。
- **关键细节**: 
  - **输入输出**：输入为视觉观测、机器人本体感觉、局部 MAP 窗口（包含掩码和指定的动作 token）；输出为完整的 7 维笛卡尔动作块（6维末端执行器位姿 + 1维夹爪状态）。
  - **模型结构**：基于轻量级 49M 参数的 DiT（用于 ManiSkill）或 118M 参数的 U-Net 扩散模型（用于 LIBERO-10 和真实世界）。MAP 窗口通过 2D 卷积编码器映射为 128 维特征，与视觉和本体感觉特征拼接后，作为条件输入到去噪网络中。
  - **进度引导**：使用归一化的任务进度（progress value）而非原始时间步来对齐控制参考和当前任务阶段，通过基于 CLIP 特征的进度网络进行实时估计，解决执行速度变化导致的对齐问题。
- **训练/优化目标**: 采用加权的重建损失（Weighted reconstruction objective）。对已知区域（掩码为1）和未知区域（掩码为0）的噪声预测误差分别计算加权均方误差，鼓励模型在遵循指定参考的同时学习重构未指定的动作。联合训练使用三种掩码模式：结构化掩码（$\alpha$）、无参考掩码（$\beta$）和随机 token 掩码（$\gamma$），以实现对未见过的时空约束组合的零样本泛化。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：ManiSkill（单任务，DiT 骨干），LIBERO-10（多任务，U-Net 骨干），以及真实世界环境（Franka R3 机械臂，执行杯子摆放和液体倾倒任务）。
  - **Baseline**：Diffusion Policy (DP, U-Net 骨干), DiT Policy, Spatiotemporal Conditioning (STC, 将时空信号展平作为条件注入 DiT)。
- **评价指标**: 
  - **任务成功率 (SR)**：衡量任务完成情况。
  - **控制误差 (CE)**：生成的轨迹点与指定控制信号之间的最小平均距离，衡量对约束的遵循程度。
  - **物理误差**：真实世界中的位置误差（mm）和旋转/倾斜误差（度）。
- **主要结果**: 
  - **仿真表现**：在 ManiSkill 上，IP 平均 SR 达到 92.67%，CE 为 0.023，显著优于 DP (75.11%) 和 STC (76.67%)。在 LIBERO-10 上，IP 平均 SR 达到 64.67%（比 DP baseline 提升 4.67 个百分点），CE 为 0.045；而 STC 的表现反而劣于基础策略，证明直接条件注入会干扰任务成功率。
  - **泛化能力**：在训练时未见过的混合掩码 (Mix0) 上，IP 达到了 80.56% 的 SR，验证了模型对未见时空约束组合的泛化能力。
  - **免训练 RePaint 变体**：在推理时采用 RePaint 策略（IP-RePaint）可进一步将 CE 降低约 40%（ManiSkill 降至 0.014，LIBERO-10 降至 0.026），但牺牲了部分 SR（ManiSkill 降至 80.04%），体现了控制精度与任务完成度之间的 trade-off。
  - **真实世界表现**：在提供 3 个及以上参考点时，SR 超过 93%，平均位置误差为 44.3 mm，平均旋转误差为 7.8°，证明了系统在真实物理环境中的时空编辑与控制能力。

### 63. 🔥 [GR-VIP: Geometric representation conditioning for precise visuomotor policy] (基于几何表征条件化的精确视觉运动策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.22997` | [点击跳转](https://arxiv.org/abs/2610.22997)

**0. 论文标题**
- **英文标题**: GR-VIP: Geometric representation conditioning for precise visuomotor policy
- **中文标题**: 基于几何表征条件化的精确视觉运动策略
- **研究机构**: 原文未提及
- **一句话总结**: 该工作提出 GR-VIP，通过“截胡”预训练位姿估计模型中用于跨视角交互的密集几何特征来条件化扩散策略，在不增加额外传感器或目标特定处理的情况下，实现了移动机器人毫米级精度的零样本对接与跨环境泛化。

**1. 整体逻辑**
- **研究任务**: 移动机器人基于单目 RGB 视觉的精确末端对接（docking）与目标对齐，要求达到毫米级的位置和航向角物理对齐精度。
- **研究动机**: 现有的通用视觉表征（如 DINOv3）或导航策略（如 NoMaD）没有针对“当前视角与目标视角间的细粒度空间几何差异”进行专门设计。这导致它们在需要极高物理对接精度的任务中表现不佳，且难以在不重新训练的情况下泛化到背景或对接站发生变化的新环境。
- **本质改动**: 摒弃了直接使用通用视觉特征，也摒弃了直接使用位姿回归的最终数值结果，转而提取预训练相对位姿估计模型（Reloc3r）在回归位姿前产生的**密集跨视角关系特征（dense relational features）**，将其作为扩散策略的条件输入，从而保留细粒度的几何先验。
- **技术溯源**: 基于预训练相对相机位姿估计模型 Reloc3r，以及基于扩散模型的视觉运动策略架构（Diffusion Policy / NoMaD）。

**2. 技术拆解**
- **核心方法**: 
  1) 使用冻结的 Reloc3r 处理当前观测与目标图像对，提取解码后的密集关系 Token（仅保留观察指向目标方向的信息流）。
  2) 通过基于查询的重采样器和 Transformer，将视觉 Token 与轮速历史（本体感受）进行多模态融合。
  3) 使用条件扩散模型（DiT）生成未来的线速度和角速度控制指令。
- **关键细节**: 
  - **输入**：5 帧历史 RGB 图像（时间步长固定）、1 帧目标图像，以及 60 步的轮速历史。
  - **模型结构**：Reloc3r 参数完全冻结；下游包含线性投影、查询重采样器、运动编码器、融合 Transformer 和扩散去噪器（DiT）。
  - **推理执行**：使用 DPM-Solver++(2M) 进行采样，采用滑动窗口（receding-horizon）机制执行，并将当前生成的动作序列与历史序列进行混合（blending）以保证时间连续性。动作 horizon ($H_a$) 和运动历史 ($H_m$) 均设为 60 步。
- **训练/优化目标**: 扩散模型的标准噪声预测损失（MSE），即预测添加到归一化动作序列上的高斯噪声（使用余弦噪声调度）。优化目标是联合训练重采样器、运动编码器、融合 Transformer 和扩散去噪器。推理时使用指数移动平均（EMA）权重。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建真实世界对接数据集，包含在单一环境（4F-H）下收集的约 2 小时、150 条遥操作对接轨迹。
  - **对比对象 (Baseline)**：端到端训练的 GC-DP（基于 NoMaD 改编，使用 EfficientNet-B0）、冻结 DINOv3 编码器的策略，以及 Reloc3r 的消融变体（使用解码前特征、直接输出相对位姿）。
  - **测试环境**：训练环境（4F-H）、未见背景环境（4F-I）、未见对接站和背景环境（5F-I），以及非对接目标和暗光条件。
- **评价指标**: 
  1) **对接成功率**：完成机械物理接触即算成功。
  2) **末端对齐精度**：通过底部相机和标记物测量的横向误差（mm）、纵向误差（mm）和航向角误差（度）。
- **主要结果**: 
  - **训练环境表现**：GR-VIP 成功率 100%（16/16），横向误差 2.53±2.24 mm，纵向误差 1.95±1.41 mm，航向误差 2.28±1.64°；而 Baseline 成功率仅为 50%~56%，误差在 10mm 以上。
  - **零样本泛化**：在 4F-I 和 5F-I 环境中，GR-VIP 成功率分别为 100% 和 93.8%，且保持毫米级精度；Baseline 在 5F-I 中直接失败（0%），在 4F-I 中即使使用新环境数据专门训练，成功率（31.3%~50.0%）也远不及零样本的 GR-VIP。
  - **消融实验**：使用 Reloc3r 解码后的密集关系特征（GR-VIP 的做法）效果最好；若使用解码前特征，在未见环境中成功率骤降；若直接使用相对位姿输出，成功率和精度均显著下降，证明密集几何特征比单一位姿数值包含更有效的控制先验。
  - **补充实验**：对训练集外的非对接目标也能实现毫米级对齐；在暗光条件下 10 次对接全部成功。

### 64. 🔥 [Embodiment-Classifier Guidance: Transferring Frozen VLAs Across Robot Dynamics without Demonstrations] (本体分类器引导：在无演示情况下跨机器人动力学迁移冻结的VLA)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.22576` | [点击跳转](https://arxiv.org/abs/2610.22576)

**0. 论文标题**
- **英文标题**: Embodiment-Classifier Guidance: Transferring Frozen VLAs Across Robot Dynamics without Demonstrations
- **中文标题**: 本体分类器引导：在无演示情况下跨机器人动力学迁移冻结的VLA
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种无需微调或额外演示的迁移方法，通过训练轻量级分类器并在冻结VLA的去噪采样阶段注入梯度，将视觉-语言-动作模型适配到动力学特性不同的新机器人本体上。

**1. 整体逻辑**
- **研究任务**: 将基于流匹配（Flow-matching）的冻结视觉-语言-动作（VLA）策略（如 $\pi_0$）迁移到具有不同动力学特性（如控制器刚度改变、命令延迟、手腕电机变弱等）的新机器人本体上。
- **研究动机**: 现有的VLA策略在固定本体上训练，当部署到动力学不同的新本体时，即使任务和场景不变也会失败。现有迁移方法通常依赖目标本体的演示数据或进行参数微调，数据成本高且效率低。
- **本质改动**: 不修改冻结VLA的任何参数，而是训练一个仅输入动作块的轻量级“本体分类器”，在VLA的流匹配去噪采样过程中，利用该分类器的梯度来引导（guide）动作生成方向，使其偏向目标本体的成功动作分布。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_0$（3B参数的VLA模型）；借鉴了扩散模型中的分类器引导（Classifier Guidance）和密度比校正（Density-ratio correction）思想。

**2. 技术拆解**
- **核心方法**: 训练一个噪声条件Transformer作为本体分类器，用于区分源本体和目标本体的成功动作块（action chunks）。在 $\pi_0$ 的10步去噪采样中，计算分类器对加噪动作块的梯度，将其缩放后叠加到 $\pi_0$ 原始的速度场（velocity field）上，从而在每一步去噪时将动作分布向目标本体的成功分布“推”。
- **关键细节**: 
  - **输入输出**：分类器输入为加噪的动作块（隐式包含末端执行器位姿），输出对数密度比；$\pi_0$ 输入为图像、状态和指令，输出50步的动作块（实际执行前5步）。
  - **模型规模**：分类器约0.8M参数（4层Transformer），$\pi_0$ 为3B参数。
  - **数据需求**：仅需在目标本体上运行少量校准任务（每个任务约23个成功rollout），无需任务演示或奖励模型。
  - **关键超参**：引导权重 $w \in \{1, 2, 4\}$，并在梯度上施加 clamp 和 cap（限制单步引导幅度不超过 $\pi_0$ 步长的20%）。
- **训练/优化目标**: 分类器使用逻辑回归损失（logistic loss）训练，优化目标是准确估计源本体和目标本体成功动作块在加噪路径上的对数密度比（log density ratio）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：LIBERO 仿真基准测试（包含Object, Spatial, Goal, 10四个套件），基于 robosuite/MuJoCo 物理引擎。
  - **对比对象（Baseline）**：无引导的冻结 $\pi_0$（unguided $\pi_0$），以及消融实验中的 Best-of-N 采样和 LoRA 微调。
  - **测试变量**：修改控制器（刚度缩放、命令延迟）、弱手腕电机（KUKA, Kinova, Sawyer等）、其他故障（速度限制、慢夹爪、锁定关节等）。
- **评价指标**: 迁移任务（transfer tasks）的成功率（Success rate），以及通过配对bootstrap计算的置信区间和相对失败率降低幅度。
- **主要结果**: 
  - **控制器改变**：在12个“套件-控制器”组合中，11个组合的平均成功率从72%提升至80%（相对减少31%的失败率）。
  - **弱手腕及其他故障**：效果混合。对Kinova（10%手腕）提升显著（70%至85%），但对Sawyer、Panda（10%手腕）有害，对锁定手腕严重有害（68.5%降至36%，因引导生成了物理上无法执行的关节动作）。
  - **数据效率与消融**：同等数据预算下，梯度引导显著优于 Best-of-N 重排和未调优的 LoRA 微调。
  - **引导自收集**：使用引导后的 $\pi_0$ 收集目标本体数据来重训分类器，可将KUKA手臂（25%手腕）的成功率从52.5%进一步提升至70.7%。

### 65. 🔥 [When Plans Change, Remember: Replanning-Guided Visual Memory for Vision-Language-Action Models] (当计划改变时，请记住：面向视觉-语言-动作模型的重规划引导视觉记忆)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.22556` | [点击跳转](https://arxiv.org/abs/2610.22556)

**0. 论文标题**
- **英文标题**: When Plans Change, Remember: Replanning-Guided Visual Memory for Vision-Language-Action Models
- **中文标题**: 当计划改变时，请记住：面向视觉-语言-动作模型的重规划引导视觉记忆
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RePlanMem-VLA，利用 VLA 策略在重规划时对同一未来动作的预测差异作为内部信号，来自动触发和过滤视觉记忆的更新，解决长时域操作中的历史视觉信息保留问题。

**1. 整体逻辑**
- **研究任务**: 长时域多阶段机器人操作任务中，如何为视觉-语言-动作（VLA）模型设计一个有界的视觉记忆机制，决定何时、将哪些历史视觉帧存入记忆。
- **研究动机**: 长时域任务需要历史视觉线索（如物体属性、早期环境状态），但保留完整历史计算成本高且冗余。现有方法依赖外部信号（如 VLM 打分、启发式规则、专门的检测器）来选择关键帧，没有利用策略自身的内部信号，且通常需要额外的标注或特权状态。
- **本质改动**: 不再依赖外部检测器，而是直接把 VLA 策略在重规划（replanning）时，对同一未来动作的预测差异（plan disagreement）作为“任务相关事件”的内部信号，用来触发视觉记忆的写入。
- **技术溯源**: 基于预训练的 OpenVLA-OFT 和 π_0.5 策略，以及从头训练的自回归（autoregressive）和 Flow-Matching Transformer。任务基于 MIKASA-Robo-VLA 基准。

**2. 技术拆解**
- **核心方法**: 提出 RePlanMem-VLA。在每次查询时，先基于当前记忆做一次前向传播得到“预写动作块”。然后计算它与上一个动作块在时间重叠部分的预测差异。将差异特征输入到一个基于马氏距离和任务校准的惊喜度（surprise）检测器中。如果差异超过阈值，则触发帧选择机制，更新 FIFO 视觉记忆，并进行第二次前向传播得到最终动作。
- **关键细节**: 
  - 动作块长度 K=8，执行步长 H=1 或 4，因此相邻动作块有 K-H 步的重叠。
  - 差异特征：提取 10 个指标（如重叠 L2 距离、因果 Z-score、EMA 偏差、平移/旋转/夹爪差异、VLM 视觉特征 L2 等）。
  - 检测器：对特征进行标准化，计算正则化马氏距离，通过任务特定的经验累积分布函数（CDF）转换为百分位数。当百分位数超过阈值（如 τ=0.99）时触发事件。
  - 帧选择与去重：触发事件后，对历史短窗口内的帧进行完整链接聚类（complete-link clustering）。结合机器人掩码（robot-masked）过滤掉因机械臂运动导致的视觉冗余，只将新颖的簇代表帧写入有界 FIFO 记忆。
- **训练/优化目标**: 采用标准的监督微调（SFT）动作损失（如 Masked action MSE 或 velocity MSE），仅作用于最终动作块。检测器、记忆更新决策和统计量均不参与梯度计算（stop-gradient），推理时也无需专家动作或特权状态。

**3. 实验结果**
- **实验设置**: 
  - 数据集与任务：MIKASA-Robo-VLA 基准（包含 19 个需要记忆的任务，如 RememberColor 等）。
  - 对比对象/基座：从头训练的自回归和 Flow-Matching 模型（用于筛选指标），以及预训练的 OpenVLA-OFT 和 π_0.5。事件检测器对比了 XGBoost、CatBoost 和 causal LSTM。
- **评价指标**: 
  - 事件检测：ROC-AUC、PR-AUC、event_recall@1（在真实事件 ±1 步内是否检测到）。
  - 记忆保留：关键帧写入率、保留率、FIFO 驱逐（eviction）次数。
- **主要结果**: 
  - 指标筛选：Flow-Matching 策略下分布度量（如 Energy distance, Wasserstein-1）表现更好，自回归策略下因果 Z-score 和 EMA 偏差更稳定。
  - 事件检测：在 OpenVLA-OFT 和 π_0.5 上，ROC-AUC 达到 0.981–0.997，PR-AUC 达到 0.924–0.996，event_recall@1 均达到 1.0，证明预测差异能极准确地捕捉任务阶段转换。
  - 记忆更新：在 RememberColor 任务中，结合聚类和机器人掩码的去重机制，在 OpenVLA-OFT 上将内存写入次数从 336 减半至 169，FIFO 驱逐次数从 186 骤降至 19，同时在 50 个 episode 中 100% 成功写入并保留任务相关的关键帧直到需要时。真实机器人回放数据也验证了该机制在去重和事件选择上的有效性。

### 66. 🔥 [EmbodiedMidtrain: Bridging the Gap between Vision-Language Models and Vision-Language-Action Models via Mid-training] (EmbodiedMidtrain：通过中间训练弥合视觉-语言模型与视觉-语言-动作模型之间的鸿沟)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2604.20012` | [点击跳转](https://arxiv.org/abs/2604.20012)

**0. 论文标题**
- **英文标题**: EmbodiedMidtrain: Bridging the Gap between Vision-Language Models and Vision-Language-Action Models via Mid-training
- **中文标题**: EmbodiedMidtrain：通过中间训练弥合视觉-语言模型与视觉-语言-动作模型之间的鸿沟
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于特征空间接近度评估的数据筛选与中间训练框架，通过重塑VLM的数据分布来弥合其与VLA之间的分布鸿沟，显著提升了下游机器人操作任务的性能。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言模型（VLM）在下游视觉-语言-动作模型（VLA）机器人操作任务中的初始化质量与最终控制性能。
- **研究动机**: 现有VLA大多直接复用通用VLM作为骨干网络，但VLM的预训练数据分布（广泛、分散）与VLA的具身操作数据分布（紧凑、集中）存在显著的分布鸿沟（distribution gap），导致VLM的内部表征难以直接适应具身推理和动作生成。
- **本质改动**: 不直接修改模型架构或盲目堆砌具身数据，而是通过训练一个轻量级分类器来评估VLM样本与VLA领域的“接近度”，筛选出最对齐的VLM子集进行中间训练（mid-training），从而在特征空间重塑VLM的数据分布。
- **技术溯源**: 基于 InternVL3.5、Qwen3VL 等开源 VLM 骨干网络，以及 VLM4VLA 框架、OpenVLA、$\pi_0$ 等已有 VLA 工作。

**2. 技术拆解**
- **核心方法**: 构建一个中间训练数据引擎（Mid-training data engine）。在冻结的VLM特征空间上，以VLA数据为正样本、候选VLM数据为负样本，训练一个轻量级二分类器（proximity estimator）。利用该分类器输出的概率作为接近度得分，筛选出Top-K的VLM样本构建 `EmbodiedMidtrain-1M` 数据集，并以此对VLM进行中间训练。
- **关键细节**: 
  - **输入输出**：分类器输入为冻结VLM的last-token last-hidden-state特征，输出为样本属于VLA领域的概率得分。
  - **模型结构**：分类器为单层线性层+sigmoid；VLM中间训练采用全参数微调（解冻视觉编码器、多模态投影层和语言模型）。
  - **规模**：从通用和具身导向的VLM数据池中筛选出 1.28M (1280k) 样本。
  - **关键超参**：分类器训练 batch size 128，验证集准确率>=90%时早停；VLM中间训练全局 batch size 256，训练5000步，峰值学习率 5e-5。
- **训练/优化目标**: 分类器使用二元交叉熵损失（Binary Cross-Entropy）优化；VLM中间训练使用标准的自回归语言建模损失（通过 LLaMA-Factory 框架进行全参数 SFT）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真基准 Calvin ABC-D, SimplerEnv Bridge, Libero-10；真实世界 Franka 机器人桌面操作任务。
  - **对比对象 (baseline)**：Expert VLA (OpenVLA, $\pi_0$)；Off-the-shelf VLMs (Qwen2.5VL, Qwen3VL, Paligemma-1/2, KosMos-2)；以及随机选择数据、手工特征距离、困惑度等替代筛选方法。
- **评价指标**: Calvin 评估连续完成任务的平均长度（Avg. Len.）；SimplerEnv 和 Libero 评估平均成功率（%）；真实世界评估任务成功率（%）。
- **主要结果**: 
  - **仿真任务**：相比原始 off-the-shelf 检查点，InternVL3.5-1B (1.1B) 在 Calvin 平均任务长度提升 0.541，SimplerEnv 成功率提升 19.8%，Libero-10 提升 15.2%。Qwen3VL-2B (2.1B) 也有显著提升。
  - **真实世界**：整体成功率从 54% 提升至 72%。
  - **消融与分析**：学习的接近度评估器显著优于随机选择及手工指标（特征空间平均距离、VLA条件困惑度等）；中间训练的优势从微调第一步就开始显现并随训练扩大；筛选的数据在数据集和样本级别上更偏好空间推理任务，同时保留了原始VLM数据的多样性。
