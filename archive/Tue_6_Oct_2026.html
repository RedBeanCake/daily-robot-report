### 35. 🔥 [H-JEPA: End-to-End Learning of Hierarchical World Models for Visual Planning] (H-JEPA：用于视觉规划的分层世界模型的端到端学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.06805` | [点击跳转](https://arxiv.org/abs/2610.06805)

**0. 论文标题**
- **英文标题**: H-JEPA: End-to-End Learning of Hierarchical World Models for Visual Planning
- **中文标题**: H-JEPA：用于视觉规划的分层世界模型的端到端学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种分层联合嵌入预测架构（H-JEPA），通过在多个时间尺度和独立的潜在空间中进行端到端预测与自顶向下的规划，解决了长视界视觉规划中误差累积和抽象目标匹配困难的问题。

**1. 整体逻辑**
- **研究任务**: 长视界（long-horizon）视觉规划与机器人控制。
- **研究动机**: 现有的无任务 JEPA 世界模型（如 LeWM）在单一潜在空间和单一时间尺度下进行预测与规划。这导致两个致命问题：一是长视界预测时细粒度步骤过多，误差严重累积且动作搜索空间爆炸；二是单一潜在空间难以兼顾底层精细动力学和高层抽象目标匹配，如果潜在变量保留了所有快速变化的细节，会导致抽象目标（如“到达某地”）匹配时的代价计算失效。
- **本质改动**: 构建一个分层的 JEPA 架构，每一层在独立的潜在空间中以不同的时间步长进行预测。高层丢弃快速不可预测的细节，保留慢速任务相关状态；规划时自顶向下分解，高层生成子目标指导低层控制。
- **技术溯源**: 基于 JEPA（Joint-Embedding Predictive Architectures），具体基线和对比方法包括 LeWM（单层 JEPA）、HWM（共享单一潜在空间的分层 JEPA），使用了 SIGReg 正则化防止表示崩溃。

**2. 技术拆解**
- **核心方法**: 
  1. **分层预测学习**：底层处理细粒度观测，高层以更大的时间步长（stride）和窗口（window）池化底层的潜在状态和动作，每层拥有独立的编码器和预测器。
  2. **自顶向下规划**：顶层优化宏观动作以逼近最终目标，其预测的潜在轨迹作为子目标；下层优化原始动作，使其预测状态经上层编码器映射后与子目标对齐。
  3. **逆动力学正则化**：在场景多变的真实数据中，为防止编码器只预测背景而丢弃移动的机器人（慢特征崩溃），引入逆动力学模型（IDM）损失。
- **关键细节**: 
  - **输入输出**：输入为视觉观测（可选本体感知）与动作，输出为动作序列。
  - **模型结构**：Level 1 采用 ViT-Tiny 编码器 + 因果 Transformer 预测器；高层采用 2层 MLP 编码器 + 因果 Transformer 预测器。
  - **关键超参**：高层时间步长 $s_l=2$，窗口 $w_l=1$；各层使用统一的 SIGReg 系数。
- **训练/优化目标**: 
  - **模拟环境**：每层的潜在预测损失（MSE） + SIGReg 正则化损失。
  - **真实环境（DROID）**：上述损失 + 逆动力学模型（IDM）损失（通过连续状态预测动作）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：4个模拟环境（FourRoomDistractors, Visual AntMaze, Push-T, OGBench Cube）；1个真实机器人数据集（DROID）。
  - **对比对象（Baseline）**：LeWM（单层 Flat JEPA），HWM（共享单一潜在空间的分层 JEPA）。
- **评价指标**: 
  - **模拟环境**：任务成功率（Success rate），规划器计算量（Planner FLOPs）。
  - **表征分析**：MLP 探针的方差归一化均方误差（NMSE），评估快/慢特征的保留情况。
  - **DROID（离线）**：Fréchet fidelity（衡量规划路径与专家路径的离散 Fréchet 距离）。
- **主要结果**: 
  - **性能提升**：在 Visual AntMaze 上，三层 H-JEPA 将成功率从 LeWM 的 18% 提升至 73%，且消耗更少的规划器计算量。
  - **对比 HWM**：在 AntMaze 上，三层 H-JEPA 的成功率几乎是 HWM 的两倍，证明“独立的分层潜在空间”比单纯的“时间分解”带来更大收益。
  - **机制验证**：高层确实丢弃了快速变化的特征（如 AntMaze 的腿部姿态），保留了慢速特征（Agent 位置）；高层抽象空间提供了更平滑的目标成本几何形状，时间分解使子目标跟踪成本下降更单调。
  - **真实数据泛化**：在 DROID 数据集上，加入 IDM 损失后，H-JEPA 的离线规划保真度（Fréchet fidelity）显著优于 LeWM 和 HWM，且计算效率更高。

### 36. 🔥 [RealtimeWAM: One-Step Asynchronous World Action Models] (RealtimeWAM：单步异步世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.06617` | [点击跳转](https://arxiv.org/abs/2610.06617)

**0. 论文标题**
- **英文标题**: RealtimeWAM: One-Step Asynchronous World Action Models
- **中文标题**: RealtimeWAM：单步异步世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RealtimeWAM，通过教师锚定一致性蒸馏实现单步动作生成，并设计跨专家波前流水线实现视频与动作专家的 Block 级异步重叠，在几乎不损失性能的前提下将 MoT 架构世界动作模型的推理速度提升 14~25 倍。

**1. 整体逻辑**
- **研究任务**: 加速基于混合 Transformer（MoT）架构的世界动作模型（WAMs）的推理过程，实现机器人操作任务的实时动作生成。
- **研究动机**: 现有的 MoT-based WAMs（如 Fast-WAM）虽然视频特征只计算一次，但仍存在两个推理瓶颈：1）专家内迭代：动作专家需要多步去噪，占据近 90% 的端到端延迟；2）专家间等待：视频专家和动作专家串行执行，动作专家必须等待视频专家生成完整的 KV cache，产生大量无用等待。
- **本质改动**: 算法与系统协同优化。算法上，引入带教师终点约束的一致性蒸馏，将多步去噪压缩为单步；系统上，将粗粒度的专家级串行执行改为基于 Block 级数据依赖的细粒度异步流水线。
- **技术溯源**: 基于 Mixture-of-Transformers (MoT) 架构的世界动作模型（如 Fast-WAM, Faster-WAM），以及一致性蒸馏（Consistency Distillation）。

**2. 技术拆解**
- **核心方法**: 
  1. Teacher-Anchored Consistency Distillation (TACD)：传统一致性蒸馏只约束局部一致性，存在“局部-全局误差差距”（局部误差小不代表全局动作终点准确）。TACD 引入冻结 Teacher 的多步 rollout 终点作为数值代理，显式监督 Student 的速度预测，实现高精度的单步动作生成。
  2. Cross-Expert Wavefront Pipelining (CEWP)：通过依赖分析发现，动作 Block 仅需对应视频 Block 的 KV cache。利用 CUDA streams，视频专家在 Q/K/V 投影后立即发布 KV cache，动作专家仅在计算 Attention 前同步等待，从而将两个专家的执行在 Block 级别进行波前重叠。
- **关键细节**: 
  - 冻结 Video Expert，仅对 Action Expert 进行 rank-128 的 LoRA 微调。
  - TACD 中 Teacher rollout 步数设为 K=10，教师锚定损失权重 λ=0.2。
  - 系统层面结合了 CUDA Graph 和 LightX2V 的高效算子（如融合 RMSNorm、RoPE、Q/K/V 投影打包等）以进一步降低开销。
- **训练/优化目标**: 总损失 $\mathcal{L} = \mathcal{L}_{CD} + \lambda \mathcal{L}_{TA}$。其中 $\mathcal{L}_{CD}$ 为局部一致性损失；$\mathcal{L}_{TA}$ 为教师锚定损失，直接约束学生速度预测与教师区间平均速度对齐（数学上等价于带 $1/t^2$ 权重的终点误差约束），从而同时控制局部与全局误差。

**3. 实验结果**
- **实验设置**: 
  - 数据集/Benchmark：LIBERO（4 个子集）、RoboTwin 2.0（Clean/Random）、LIBERO-Plus（7 种 OOD 扰动子集），以及真实世界双臂折叠衣服任务。
  - 对比对象 (Baseline)：原始多步模型（Fast-WAM, Faster-WAM）、其他高效 WAM（Flash-WAM, Light-WAM）及少步蒸馏方法（DMD, MeanFlow, Consistency Distillation）。
  - 测试环境：主要在 NVIDIA H100 上测试，部分在 RTX 5090 和 RTX 4090D 上测试。
- **评价指标**: 任务成功率（Success Rate, %）和推理延迟（Inference Latency, ms）/ 端到端加速比。
- **主要结果**: 
  - 性能几乎无损：在 RoboTwin 2.0 和 LIBERO 上，RealtimeWAM（单步）的成功率与原始 10 步模型相比下降均 < 1%（例如 RoboTwin 2.0 上 RealtimeWAM† 仅下降 0.29%，LIBERO 上 RealtimeWAM* 持平），且在 LIBERO-Plus 的 OOD 扰动下保持了鲁棒性，显著优于 Flash-WAM 等 Baseline。
  - 推理大幅加速：在 H100 上，RealtimeWAM 基于 Fast-WAM 和 Faster-WAM 分别实现了 24.55 倍和 13.56 倍的端到端加速，单次推理延迟分别降至 12.2 ms 和 16.1 ms，完全满足 30Hz 等实时控制频率的需求。

### 37. 🔥 [KineWorld: Action-Induced Transport Fields for Embodied World Modeling] (KineWorld：用于具身世界建模的动作诱导传输场)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.06349` | [点击跳转](https://arxiv.org/abs/2610.06349)

**0. 论文标题**
- **英文标题**: KineWorld: Action-Induced Transport Fields for Embodied World Modeling
- **中文标题**: KineWorld：用于具身世界建模的动作诱导传输场
- **研究机构**: 原文未提及
- **一句话总结**: 提出 KineWorld 框架，利用机器人运动学构建传输场，不仅在生成时作为条件，还在训练时重新加权视频生成损失，让具身世界模型更关注动作引起的局部关键变化。

**1. 整体逻辑**
- **研究任务**: 具身世界模型（Embodied World Models），即根据当前观测、语言指令和候选动作序列，预测未来视觉世界的变化（动作条件视频生成）。
- **研究动机**: 现有动作条件世界模型在训练时通常对视觉生成目标进行均匀加权。当动作引起的画面变化只占很小一部分（空间稀疏）时，均匀加权会导致模型优化偏向静态外观，忽略了交互关键的局部变化。即使引入了显式的运动条件，也没有改变主 RGB 生成目标的空间权重分配。
- **本质改动**: 将机器人运动学先验从单纯的“生成条件”扩展为“空间监督分配先验”，通过运动学传输场直接重新加权未来 RGB 的流匹配损失，引导模型优先学习动作后果。
- **技术溯源**: 基于 Wan2.2 (Wan2.2-TI2V-5B) 视频生成基座，结合 RAFT (光流估计) 和 RoboTwin 2.0 数据集。

**2. 技术拆解**
- **核心方法**: 提出包含两个核心组件的 KineWorld 框架：1) 运动学传输提升 (KTL)：从机器人命令运动构建相机对齐的传输场，作为无噪的结构条件输入模型；2) 传输感知世界扩散 (TAWD)：在视频隐空间网格上校准运动支持区域，计算归一化的混合分布来重新加权流匹配损失。
- **关键细节**: 
  - **输入输出**：输入当前 RGB 观测、语言指令、14维双臂动作序列（每臂6-DoF末端位姿+1维夹爪）；输出未来 RGB 视频帧。
  - **模型结构**：基于因果视频 VAE 和条件流匹配（Conditional Flow Matching）模型。KTL 将传输场编码为 HSV 图像（方向为色调，大小为饱和度），通过 VAE 编码后与 RGB 隐变量拼接，在 Transformer 中进行联合自注意力。
  - **规模与超参**：基座模型为 5B 参数（KineWorld 为 5.001B）。采样 9 个关键帧，时间步长为 4。TAWD 中的混合强度参数 β 设为 1。
- **训练/优化目标**: 
  - **主损失**：加权后的条件流匹配损失（$\mathcal{L}_{Kine}$）。TAWD 根据传输场大小计算每个 token 的权重，混合均匀分布和传输聚焦分布，保持总权重归一化（均值为 1），仅改变空间分配，不增加推理步数。
  - **辅助损失**：保留原有的动作预测头，在停止梯度（stop-gradient）的世界模型特征上计算动作损失，但不反向传播到世界模型生成器。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboTwin 2.0 ALOHA–AgileX 双臂操作数据 (Clean-50)。
  - **Baseline**：单视图对比了 JF_World, BWM-Super, BWM-Turbo, FlowWAM-FiveAges, WoVR_Plus, WorldScape-0.2, PF-Cosmos, Wan2.2, GigaWorld-0, Vidar, IRASim；多视图对比了 BWM, WoVR_Plus, DreamDojo, Motus, Genie Envisioner, Ctrl-World。
- **评价指标**: 
  - **单视图**：EWMScore-P（包含视觉、运动、控制、物理等子项）及局部诊断指标（如交互质量 INT、指令遵循 IF 等）。
  - **多视图**：TWB-Score（TriWorldBench 综合得分）。
- **主要结果**: 
  - **单视图**：EWMScore-P 达到 68.95，显著优于基线 Wan2.2 (49.21) 和 IRASim (44.97)，在物理合理性和控制准确性上提升明显。
  - **多视图**：TWB-Score 达到 54.82，在物理/3D 一致性和时间一致性上取得最高分。
  - **消融实验**：仅加 KTL 即可将 EWM 从 49.21 提升至 65.99，NFE（去噪评估次数）减半；加入 TAWD 后进一步提升至 68.95。模型参数量几乎不变，推理速度达 3.02 FPS。

### 38. 🔥 [Beyond In-Distribution Preservation: Recovering Generalization in Quantized VLAs via Vulnerability-Oriented Tuning] (超越分布内保持：通过面向脆弱性的微调恢复量化VLA的泛化能力)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.05745` | [点击跳转](https://arxiv.org/abs/2610.05745)

**0. 论文标题**
- **英文标题**: Beyond In-Distribution Preservation: Recovering Generalization in Quantized VLAs via Vulnerability-Oriented Tuning
- **中文标题**: 超越分布内保持：通过面向脆弱性的微调恢复量化VLA的泛化能力
- **研究机构**: 原文未提及
- **一句话总结**: 发现VLA模型量化后在环境扰动下泛化能力严重下降，提出PIVOT-Q框架，通过识别并稀疏纠正rollout中动作偏差最大的“脆弱状态”来恢复泛化能力，仅用7.4%的蒸馏预算即可超越全局蒸馏。

**1. 整体逻辑**
- **研究任务**: 恢复后训练量化（PTQ）后的视觉-语言-动作（VLA）策略在环境扰动（分布外）下的泛化能力与鲁棒性。
- **研究动机**: 现有VLA量化方法在分布内评估中性能保持良好，但在环境发生微小扰动（如光照、视角、初始位姿变化）时，量化策略的成功率会大幅下降，存在明显的“量化后泛化鸿沟”。分析发现，量化引起的动作偏差呈对数正态分布，集中在少数状态上；全局纠正所有状态不仅低效，纠正低偏差状态甚至会损害性能。
- **本质改动**: 放弃全局密集的状态级知识蒸馏，转而计算状态的“脆弱性”（结合当前与未来短时序的动作偏差），仅对量化学生模型在rollout中遇到的少数高脆弱性状态进行稀疏的On-Policy蒸馏，并引入行为锚点防止已保留的良好行为发生漂移。
- **技术溯源**: 基于VLA基座模型（GR00T-N1.5、$\pi_{0.5}$、OpenVLA-OFT）与现有量化方法（QuantVLA、HoloQ-VLA、QVLA），在LIBERO及LIBERO-Plus机器人操作基准上进行。

**2. 技术拆解**
- **核心方法**: 提出 Policy-Induced Vulnerability-Oriented Tuning (PIVOT-Q) 框架。包含三个核心机制：1) 学生控制的On-Policy Rollout与脆弱性评估；2) 阶段平衡的稀疏状态选择；3) 脆弱性加权蒸馏与行为锚点（Behavioral Anchor）正则化。
- **关键细节**: 
  - **输入输出**：输入为观察 $o_t$、语言指令 $x$ 和随机噪声 $\xi_t$，输出为动作块（实际执行第一个动作）。
  - **脆弱性评分**：结合当前动作偏差 $q_t$ 和折扣累积未来偏差 $r_t^+$（未来窗口 $H=4$，折扣因子 $\gamma=0.9$）。
  - **状态选择**：将轨迹分为 $K=4$ 个阶段，每阶段选 $M=4$ 个状态，共16个状态/episode。选择时强制最小时间间隔以防状态聚集。
  - **蒸馏权重**：对选出的状态按脆弱性得分进行归一化和截断（clip到 $[0.5, 2.0]$）加权。
  - **行为锚点**：维护一个包含256个原始分布干净状态的replay buffer，每次更新采样4个，用辅助损失（权重 $\lambda=0.1$）约束学生模型，防止遗忘。
  - **模型结构**：使用 LoRA（rank=16）对动作头或相关投影层进行微调。
- **训练/优化目标**: 总损失为脆弱性加权蒸馏损失（$\mathcal{L}_{\text{distill}}$，最小化选中状态下学生与教师动作的L2距离）加上行为锚点损失（$\mathcal{L}_{\text{anchor}}$，最小化参考状态下学生与教师动作的L2距离）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO-Plus（包含7种环境扰动：相机视角、初始位姿、语言、光照、背景、传感器噪声、物体布局）。
  - **对比对象（Baseline）**：原始全精度模型（Original）、直接量化模型（Quantized）、全状态蒸馏（Full State Distillation, FSD）。
  - **模型与量化设置**：GR00T-N1.5 + QuantVLA (W4A8)、$\pi_{0.5}$ + QuantVLA (W4A8)、GR00T-N1.5 + HoloQ-VLA (W4A4)、OpenVLA-OFT + QVLA (Mixed-bit)。
- **评价指标**: 任务成功率（Task Success Rate, %），在7种分布偏移下的平均成功率。
- **主要结果**: 
  - PIVOT-Q在所有4种模型-量化设置下均一致提升了量化策略的泛化能力。
  - 以 GR00T-N1.5 + QuantVLA 为例，量化使平均成功率从 81.4% 降至 66.6%，FSD 恢复至 76.9%，而 PIVOT-Q 恢复至 81.3%，几乎完全弥补了量化带来的泛化损失。
  - PIVOT-Q 仅使用了 FSD 7.4% 的状态级蒸馏预算（每episode 16个状态 vs FSD平均210个状态），证明了面向脆弱性的稀疏监督比密集蒸馏更高效。
  - 消融实验证明：阶段平衡选择、未来偏差预测以及行为锚点均对最终性能和训练稳定性有显著贡献。

### 40. 🔥 [GeoBridge-VLA: Geometry-Aware Residual Adaptation for Vision-Language-Action Models] (GeoBridge-VLA：用于视觉-语言-动作模型的几何感知残差自适应)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.05026` | [点击跳转](https://arxiv.org/abs/2610.05026)

**0. 论文标题**
- **英文标题**: GeoBridge-VLA: Geometry-Aware Residual Adaptation for Vision-Language-Action Models
- **中文标题**: GeoBridge-VLA：用于视觉-语言-动作模型的几何感知残差自适应
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种两阶段方法，在不增加额外图像编码器和视觉token的前提下，通过深度监督从冻结的VLA视觉特征中提取几何信息，并以残差形式注入动作预测，显著提升了机器人在仿真和真实环境中的操作成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在语言条件下的机器人操作任务中的空间推理与几何感知能力。
- **研究动机**: 现有VLA模型擅长语义理解，但缺乏物理交互所需的精确几何属性（如深度、相对位置）。现有改进方法通常依赖额外的深度/3D观测、外部空间表征或引入第二图像编码器，增加了部署负担和计算量。
- **本质改动**: 将几何信息集成转化为“几何改造”问题，直接从冻结的VLA原生视觉编码器的中间特征中挖掘深度监督的几何特征，并通过门控残差接口将其无缝融入原生视觉token空间，部署时无需深度观测。
- **技术溯源**: 基于 SmolVLA（策略骨干）、SPACE-CLIP（借鉴其K4几何解码器）、Depth Anything 3（真实世界实验的伪深度教师模型）。

**2. 技术拆解**
- **核心方法**: 提出两阶段几何获取与动作迁移策略。Stage I：训练特征桥和几何解码器，利用深度监督从冻结的视觉特征中学习几何表征；Stage II：冻结上述模块，训练门控残差接口，将几何特征作为残差加到原生视觉token上，用于动作学习。
- **关键细节**: 
  - Stage I：特征桥对选定的中间视觉特征进行空间重采样和线性投影，输入到基于SPACE-CLIP改进的K4几何解码器（固定局部token聚合）。
  - Stage II：几何特征图池化后经1x1卷积投影，通过标量门控（初始值约0.002，初始残差为0）加到原生视觉token上，不增加token数量。
  - 部署：仅需RGB、机器人状态和语言，无需深度输入，教师模型在部署时移除。
- **训练/优化目标**: 
  - Stage I：结合尺度不变对数深度损失（SILog）、结构相似性损失（SSIM）以及多尺度辅助深度监督。LIBERO使用仿真真实深度，真实机器人使用教师模型生成的伪深度。
  - Stage II：基于流匹配（flow-matching）的动作损失，加上残差正则化惩罚项（限制对原生视觉表征的过度改变）。

**3. 实验结果**
- **实验设置**: 
  - 仿真：LIBERO数据集（包含Spatial, Object, Goal, Long四个子集，共40个任务，2000个评估episode）。
  - 真实世界：ROBOTIS OMY机器人，4个任务（cube transfer, drawer closing, bowl transfer, block stacking），每个任务50次试验。
  - 对比基线：SmolVLA。
- **评价指标**: 任务成功率（Success Rate, SR），以及深度预测指标（AbsRel, RMSE, $\delta_1$）。
- **主要结果**: 
  - LIBERO仿真：GeoBridge-VLA整体成功率达70.9%，比SmolVLA（60.0%）提升10.9个百分点（Object和Long提升最显著）。
  - 深度预测：共享编码器能较好恢复深度（AbsRel 0.030, RMSE 0.1316m），整体布局准确，但物体边界较平滑。
  - 残差消融：在同一checkpoint下关闭残差（设为0），整体成功率从70.9%降至69.85%，说明推理时残差接口确实起到了作用（但在Object和Goal上略有下降，效果混合）。
  - 真实机器人：GeoBridge-VLA整体成功率74.0%（148/200），比SmolVLA（54.0%，108/200）大幅提升20个百分点。

### 41. 🔥 [PermVLA: Factorization Order as a Regularizer for VLA Learning] (PermVLA：将因式分解顺序作为VLA学习的正则化方法)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.04659` | [点击跳转](https://arxiv.org/abs/2610.04659)

**0. 论文标题**
- **英文标题**: PermVLA: Factorization Order as a Regularizer for VLA Learning
- **中文标题**: PermVLA：将因式分解顺序作为VLA学习的正则化方法
- **研究机构**: 原文未提及
- **一句话总结**: 提出在VLA训练时随机打乱动作块的预测顺序（保留时间前缀）作为正则化手段，在不增加推理成本的前提下，显著提升了机器人的闭环控制能力和分布外泛化性。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的动作块（action chunk）自回归预测与闭环控制。
- **研究动机**: 现有的VLA在训练时，通常固定使用从左到右（LTR，即按物理时间顺序）的因式分解来预测动作。这种单一的 teacher-forced 路径容易让模型过度依赖特定的条件生成路径，导致在视觉、语言或具身上下文发生偏移时缺乏鲁棒性。
- **本质改动**: 将动作的“因式分解顺序”从隐藏的建模选择变为一种训练期的正则化手段。训练时让模型基于随机采样的已知动作子集来预测剩余动作，而部署时依然保持标准的 LTR 顺序。
- **技术溯源**: 基于 Qwen3-VL-4B（视觉语言基座）、XLNet（双流注意力机制/排列语言模型思想），以及标准的 VLA 动作块预测范式。

**2. 技术拆解**
- **核心方法**: 提出因果锚定排列（CAP, Causally Anchored Permutation）。引入“条件集增强”（conditional-set augmentation），在训练时采样不同的动作揭示顺序（reveal orders），并设定一个可调的时间前缀长度 $K$（前 $K$ 个动作固定按时间顺序）。利用类似 XLNet 的双流注意力机制（content 和 query streams）来构建不同顺序下的注意力掩码，防止目标泄露，从而用同一个 expert chunk 构造出多个条件预测问题。
- **关键细节**: 
  - **输入输出**：输入为语言指令、双视角 RGB 图像、本体感知；输出为长度 $H$（如 8 或 16）的对角高斯分布动作块。
  - **模型结构**：Qwen3-VL-4B (LoRA) 编码多模态上下文，Perceiver resampler 压缩特征，后接 8 层 67M 参数的条件 Transformer 解码器。
  - **关键超参**：前缀长度 $K=1$，CAP 损失权重 $\lambda=0.25$，每个样本采样的排列数 $M=1$（消融实验中测试了 $M=4$）。
- **训练/优化目标**: 联合损失函数 $\mathcal{L} = (1-\lambda)\mathcal{L}_{LTR} + \lambda\mathcal{L}_{CAP}$。其中 $\mathcal{L}_{LTR}$ 是标准的按时间顺序的负对数似然，$\mathcal{L}_{CAP}$ 是在采样的排列顺序下的负对数似然。部署时仅使用确定性的 LTR 推理，不增加额外计算量。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（分布内控制）、LIBERO-Plus（零样本分布外鲁棒性，包含相机、机器人、语言、光照等 7 种扰动）、CALVIN（跨数据集长程指令链）。
  - **对比对象（baseline）**：严格控制的 LTR-1pass（标准单遍）、LTR-2pass（匹配计算量的双遍），以及作为上下文参考的 Diffusion Policy, Octo, OpenVLA, $\pi_0$ 等。
- **评价指标**: 闭环控制成功率（Success rate %），不同扰动下的零样本成功率，以及 CALVIN 中的 Success@k。
- **主要结果**: 
  - 在 LIBERO 上，CAP（均值 71.7%）显著优于 LTR-1pass（62.6%）和 LTR-2pass（62.2%），特别是在长程任务（Long）上提升巨大（32.2% vs 6.4%），证明 varied conditioning 有助于长程依赖。
  - 在 LIBERO-Plus 的 7 种零样本扰动下，CAP 全面优于两个 LTR baseline，在语言、背景等语义和视觉偏移下表现出更强的鲁棒性。
  - 在 CALVIN 跨数据集评估中，CAP 在长指令链（Success@k）上的优势随深度增加而扩大（Success@5 时 CAP 是 LTR-1pass 的 2.65 倍）。
  - 诊断实验表明，CAP 显著降低了模型对特定揭示顺序的敏感度（联合对数似然在不同顺序下更一致）；且离线拟合度与闭环成功率解耦（CAP 离线拟合略低，但闭环控制更好，说明其学到了更有效的动作延续和恢复能力）。

### 42. 🔥 [Video2World: Benchmarking Coding Agents for Interactive World Modeling from Embodied Videos] (Video2World：评估编程智能体从具身视频中进行交互式世界建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.04432` | [点击跳转](https://arxiv.org/abs/2610.04432)

**0. 论文标题**
- **英文标题**: Video2World: Benchmarking Coding Agents for Interactive World Modeling from Embodied Videos
- **中文标题**: Video2World：评估编程智能体从具身视频中进行交互式世界建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出了Video2World基准，将视频到仿真环境构建转化为软件工程任务，全面评估了9个前沿编程智能体在几何、动态和功能三个维度上端到端重建可交互物理世界的能力。

**1. 整体逻辑**
- **研究任务**: 评估编程智能体（Coding Agents）能否端到端地自动将具身交互视频转化为可执行的物理仿真环境（Video-to-Simulation），并实现相应的机器人控制行为。
- **研究动机**: 现有的Real-to-Sim流程高度依赖人工构建和校准；且现有基准只评估空间理解或场景重建等孤立能力，缺乏对智能体整合感知、物理推理和代码生成能力以端到端构建可交互世界的全面评估。
- **本质改动**: 将自主的Video-to-Sim任务形式化为一个端到端的软件工程任务，并构建了包含222个实例的Video2World基准，从几何、动态和功能三个维度对编程智能体进行系统性评估。
- **技术溯源**: 基于9个前沿编程智能体系统（如Fable-5.1, GPT-6 Astra, Claude Opus 5等），以及多个现有具身数据集（FurnitureBench, DROID, RoboDojo, HOI4D, HOT3D, DexYCB, OakInk2等）。

**2. 技术拆解**
- **核心方法**: 
  1. 任务形式化：智能体观察RGB视频，在沙盒中利用模拟器API和工具编写代码构建仿真环境（场景几何）和机器人行为（控制策略），并通过执行反馈迭代优化。
  2. 基准构建（Video2World）：收集189个视频构建222个重建实例，提供以对象为中心的隐藏标注（场景几何、对象运动、任务要求）作为评估基准。
  3. 多维评估体系：设计了可执行性、几何保真度（场景与对象级误差）、动态保真度（对象运动轨迹误差）和功能正确性（任务成功率与进度）四大类指标。
- **关键细节**: 
  - 输入输出：输入为RGB具身视频、目标模拟器和通用工具；输出为仿真环境配置（$\eta$）和机器人行为策略（$\pi$）。
  - 规模：189个视频，222个实例，39个任务族。涵盖机器人执行、第一人称和第三人称人类演示。
  - 系统架构：智能体在隔离沙盒中工作，包含视频、模拟器API、文档、资产和代码工具，限制180分钟墙钟时间。
- **训练/优化目标**: 本文是基准测试工作，无模型训练。核心机制是智能体通过执行反馈（物理模拟渲染和诊断信息）迭代修改代码，优化目标是最大化V2WScore（综合Build、功能、几何和动态的0-100分）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：Video2World基准（222个实例）。
  - 对比对象：9个前沿编程智能体系统（Fable-5.1, GPT-6 Astra, Claude Opus 5, Kimi K3, GPT-5.6 Sol, DeepSeek-V4.1 Flash, Gemini-3.8 Flash, Qwen-3.8 Max, GLM-5.3 Flash），以及人类辅助重建（Human-Assisted Reference, HAR）作为强参考。
  - 测试环境：每个实例分配独立的沙盒和物理模拟器，智能体在180分钟限制内自主构建，评估时使用单张NVIDIA L40S GPU运行物理模拟和指标计算。
- **评价指标**: 
  - V2WScore（0-100综合得分）。
  - Build Rate（可执行性/构建成功率）。
  - Functionality（Task Success 任务成功率，Task Progress 任务进度）。
  - Geometry（Scene CD 场景倒角距离，Shape CD 形状倒角距离，Size err. 尺寸误差）。
  - Dynamics（T-APE 平移绝对误差，R-APE 旋转绝对误差，T-RPE 平移相对误差）。
- **主要结果**: 
  1. 智能体能构建可执行世界，但任务完成率低：大多数重建环境可成功运行（Build Rate > 87%），但任务成功率（Task Success）最高仅为25.5%（Fable-5.1），远低于人类辅助重建的58.8%。
  2. 几何保真度不等于功能正确性：几何重建最准的模型（如GPT-6 Astra在Shape CD上表现最好）不一定任务成功率最高；反之，部分几何误差较大的重建仍能成功完成任务（looks better could work worse）。
  3. 模型能力差异显著：从Claude Opus 5等模型开始，任务成功率有显著提升（从不到5%提升至15%以上），但距离完美重建仍有巨大差距。不同模型在几何、动态和功能维度上各有优劣，整体性能是多种能力组合的结果。

- **英文标题**: WAMJET: A Harness for World Action Model Acceleration
- **中文标题**: WAMJET：一个用于世界动作模型推理加速的自动化框架

**1. 整体逻辑**
- **研究任务**: 加速世界动作模型（World Action Models, WAMs）的推理过程，降低机器人控制中的推理延迟。
- **研究动机**: WAM 结合了视频生成和动作预测，模型大且推理链路长（涉及去噪、视觉语言处理等），计算开销极大。现有的加速技术（编译、算子融合、缓存、量化等）很多，但针对不同模型和硬件的组合调优需要大量人工工程；且优化一个瓶颈往往会暴露另一个，同时必须保证机器人动作质量不下降，手动调优难以泛化。

- **技术溯源**: 基于预训练视频基础模型构建的 WAMs（如 Fast-WAM, DreamZero, Cosmos-Policy, LingBot-VA, OpenWAM 等）；底层依赖 GPT-5.6-sol, GPT-6-astra, Claude-opus-5 等 Coding Agent 进行代码生成与优化。

**2. 技术拆解**
- **核心方法**: 提出瓶颈驱动（bottleneck-driven）的自动化优化工作流。Agent 首先建立 baseline 并降低启动开销，然后通过 Trace 分析定位 GPU 热点和内存瓶颈，优先尝试无损加速（如 prompt 复用、去同步、CUDA graphs、算子融合），在允许的情况下再尝试近似加速（如量化、特征缓存），每次修改后严格验证。
- **关键细节**: 
  - **输入输出**：输入为策略代码、checkpoint、推理配置和质量要求；输出为加速后的代码实现及验证报告。
  - **验证机制**：分三层。Tier A（无损，要求数学等价，容忍极小浮点误差）、Tier B（验证过的近似，需通过配对任务评估）、Tier C（改变工作量的近似）。
  - **状态检查**：使用 A->B->A 输入序列检测缓存失效或脏数据，确保循环状态正确。
  - **任务评估**：在相同 episode 上运行 baseline 和 candidate，使用 McNemar 检验比较成功率差异。
- **训练/优化目标**: 非学习类工作。核心机制是 Agent 的迭代搜索与验证，优化目标是在给定搜索预算内，最小化推理延迟（Latency），同时满足用户设定的动作质量和任务成功率约束。

**3. 实验结果**
- **实验设置**: 
  - **模型**：6 个 WAMs（Fast-WAM, DreamZero, Cosmos-Policy, LingBot-VA, Cosmos3-Nano-Policy-DROID, OpenWAM）。
  - **Agent**：3 个 Coding agents（GPT-5.6-sol, GPT-6-astra, Claude-opus-5）。
  - **硬件**：NVIDIA H100 和 B200 GPU。
  - **数据集/任务**：RoboLab（20个任务，每任务10个episode），LIBERO，LIBERO-plus。
- **评价指标**: 推理延迟（Latency，ms）、加速比（Speedup）、任务成功率（Success Rate）。
- **主要结果**: 
  - **无损加速**：在 H100 上，WAMJET 结合 GPT-6-astra 对 LingBot-VA 实现了 9.95 倍加速；所有 12 组 Agent+WAM 组合均优于 baseline 和无 WAMJET 的 Agent 独立优化。
  - **近似加速与硬件感知**：在 B200 上，DreamZero 结合 NVFP4+FP8 量化达到 2.21 倍加速，Cosmos3 结合 MXFP8 达到 1.47 倍加速。
  - **质量保持**：近似加速下任务成功率基本无损（如 DreamZero 在 RoboLab 上 baseline 为 25.0%，近似加速后为 25.0%-26.0%）。
  - **强基线优化**：对已高度优化的 OpenWAM，在 B200 上进一步实现 2.67 倍（无损）和 2.75 倍（近似）加速。
  - **启动加速**：DreamZero 启动时间从 208.1s 降至 30.3s，OpenWAM 从 79.6s 降至 8.2s。
