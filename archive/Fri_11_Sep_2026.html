            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Motus2: A Self-Evolving General World Model for Dexterous Manipulation] (Motus2：用于灵巧操作的自进化通用世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.30237` | [点击跳转](https://arxiv.org/abs/2608.30237)

**0. 论文标题**
- **英文标题**: Motus2: A Self-Evolving General World Model for Dexterous Manipulation
- **中文标题**: Motus2：用于灵巧操作的自进化通用世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出了一种用于灵巧操作的通用世界模型，通过单一共享参数网络同时实现策略生成、未来状态模拟和结果评估，结合大规模自我中心人类数据与基于模型的强化学习，实现了机器人策略的闭环自进化。

**1. 整体逻辑**
- **研究任务**: 构建用于灵巧操作的通用世界模型，使机器人能够在统一系统中完成感知、预测、执行、评估与自我改进。
- **研究动机**: 现有机器人基础模型主要依赖监督模仿学习，缺乏判断动作好坏的机制，无法从自身结果（包括失败和次优交互）中改进策略；此外，收集大规模机器人演示数据成本高昂，而人类自我中心数据虽丰富但难以直接迁移。
- **本质改动**: 将策略（动作生成）、模拟器（未来预测）和评估器（价值评估）统一在一个共享参数的视频-动作扩散模型中，通过掩码和损失路由机制，让成功数据监督动作学习，让失败/次优数据监督动态和价值学习，从而形成闭环自我进化。
- **技术溯源**: 基于 UniDiffuser 风格的视频-动作联合建模、前作 Motus、Wan 2.2-TI2V-5B（视频基础模型）、DiffusionNFT（用于基于模型的强化学习策略更新）。

**2. 技术拆解**
- **核心方法**: 
  1. **统一世界模型架构**：设计单一共享参数模型，通过“动作优先（action-first）”的注意力掩码和依赖路由，同时暴露三个控制接口：世界-动作模型（策略）、动作条件世界模型（模拟器）和价值模型（评估器）。
  2. **数据缩放与路由**：构建从单目到双目再到机器人领域的自我中心数据金字塔。在训练中，成功轨迹用于监督动作，失败和次优轨迹作为条件变量监督未来视频预测和价值评估。
  3. **闭环自进化**：推理时使用 Best-of-N 规划选择最优动作块；训练时利用评估器的价值分数，通过 DiffusionNFT 算法将标量分数转化为流匹配的策略更新（MBRL）。
  4. **长上下文与触觉扩展**：引入全局自回归和混合记忆机制处理长视野遮挡问题；引入轻量级触觉专家，复用主干网络的中间状态和 KV 缓存，进行触觉条件动作细化和力预测。
- **关键细节**: 
  - **输入输出**：输入为语言指令、当前本体感觉、视觉历史（及可选触觉流）；输出为动作块（Action chunk）、未来视频潜在状态、离散化的任务进度价值。
  - **模型结构**：核心主干为基于 Transformer 的条件流匹配（Flow Matching）模型。触觉专家为 30 层 Transformer，与主干层一一对应并读取解耦的 KV 缓存。
  - **规模**：预训练使用约 130K 小时的自我中心人类数据，中训练（Mid-training）使用 100+ 小时的机器人及人-机器人对齐数据。
- **训练/优化目标**: 
  - **统一损失函数**：包含视频速度场损失、动作速度场损失和价值分类交叉熵损失。通过损失门控（loss gates）和独立的噪声级别，在同一个模型中切换三种训练模式：策略模式（联合监督动作和视频）、模拟模式（仅监督视频）、评估模式（仅监督价值）。
  - **MBRL 优化目标**：使用 DiffusionNFT 损失，将候选动作的价值分数归一化为权重，拉近高价值候选动作的隐式速度场，推远低价值候选动作，从而在不改变模拟器和评估器参数的前提下更新策略网络。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：使用约 130K 小时的自我中心语料库（包含 Egocentric-100K、Ropedia 等开源与采购数据）进行预训练。下游测试包含 5 个主任务（如 Place Ball, Put Phone）、2 个长上下文记忆任务（Find Square, Press Button）和 2 个触觉任务（Pull Out the Paper Cup, Tear Paper）。
  - **对比对象（Baseline）**：$\pi_{0.5}$、WAN-SFT、Pretrain-SFT（后两者仅初始化不同），以及消融实验中的 Hybrid memory、w/o Tactile 等变体。
  - **测试环境**：真实机器人平台（Tianji 机械臂搭配 Wuji/Sharpa 灵巧手）及仿真环境。
- **评价指标**: 任务成功率（Success Rate, SR）。每个任务在真实机器人上执行 20 次 rollout（仿真中 25 次），计算各任务成功率的宏观平均值。
- **主要结果**: 
  - **主实验**：Motus2 (Midtrain-SFT) 的平均成功率达到 84%，显著优于 Pretrain-SFT (51%)、WAN-SFT (0%) 和 $\pi_{0.5}$ (0%)，验证了自我中心预训练和机器人领域中训练的有效性。
  - **自进化与规划**：在 Put Phone 和 Multi-Finger 任务上，结合 MBRL 和 Best-of-N Planning 后，平均成功率从基线的 65.0% 提升至 75.0%，证明闭环自我进化和测试时规划均能带来实质性收益。
  - **长上下文机制**：在记忆任务中，全局自回归（Global autoregression）在真实机器人上的平均成功率（57.5%）显著优于混合记忆（Hybrid memory，25.0%）。
  - **触觉反馈**：引入触觉专家后，接触敏感任务的平均成功率从 60.0% 提升至 72.5%。
  - **Scaling Law**：验证了双目自我中心人类数据规模与动作预测误差之间呈现对数线性下降关系（$\mathcal{L} \approx 0.101 - 0.005 \ln D$）。

### 2. 🔥 [CometVLA: Co-Training on an Embodied Data Pyramid towards Physical Understanding] (具身数据金字塔上的协同训练：迈向物理理解)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.30289` | [点击跳转](https://arxiv.org/abs/2608.30289)

**0. 论文标题**
- **英文标题**: CometVLA: Co-Training on an Embodied Data Pyramid towards Physical Understanding
- **中文标题**: 具身数据金字塔上的协同训练：迈向物理理解
- **研究机构**: 原文未提及
- **一句话总结**: 构建了与机器人动作数据严格对齐的具身物理VQA数据集与基准，并设计了GAP token作为信息瓶颈，通过多源数据协同训练让VLA模型具备物理常识，从而显著提升真实机器人操作性能。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在需要物理常识的复杂机器人操作任务中的表现。
- **研究动机**: 现有的物理VQA数据通常是“非具身”的（来自网页图片或第三方视角），与机器人动作域不对齐；且现有工作往往将感知与动作解耦，或仅将第一人称视频作为辅助预训练。目前尚不清楚提升VLM的物理理解能力是否真的能转化为下游动作生成的性能提升。
- **本质改动**: 在数据、模型和训练三个层面进行系统性改进：构建与机器人动作数据分布严格对齐的具身物理VQA数据集（CometData）和基准（CometBench）；在模型中引入全局动作先验（GAP）token作为信息瓶颈；采用具身数据金字塔进行单阶段协同预训练。
- **技术溯源**: 基于 Qwen3-VL（具体为 Qwen3-VL-4B-Instruct）作为视觉语言骨干，结合 FAST 动作分词器和 DiT-B（流匹配动作专家）。

**2. 技术拆解**
- **核心方法**: 
  1. **数据层面**：构建 CometData 和 CometBench。通过物理感知中间件（提取关键帧、检测交互事件、将本体感觉和动作信号转化为语义物理状态描述），从遥操作、仿真、第一人称视频等多源轨迹中自动生成具身物理VQA数据（涵盖5个领域，16个类别）。
  2. **模型层面**：引入全局动作先验（GAP）token。作为一个紧凑的可学习瓶颈，插入骨干token序列中，与视觉语言流解耦，用于聚合任务无关的运动规律，并作为自回归骨干和扩散动作专家之间的唯一通信接口。
  3. **训练层面**：利用知识隔离（knowledge isolation）和停止梯度屏障（stop-gradient barrier），在单阶段预训练中联合训练VLM骨干（自回归）和动作专家（流匹配），同时使用具身数据金字塔（VQA、第一人称视频、仿真、遥操作）进行协同训练。
- **关键细节**: 
  - **输入输出**：输入多视角视觉观测、本体感觉状态、语言指令；输出离散 FAST 动作 token 和连续流匹配（FM）动作。
  - **模型结构**：Qwen3-VL-4B 骨干 + FAST 动作分词器 + DiT-B 流匹配动作头 + 1个 1024 维的 GAP token。动作空间 pad 到 32 维，action chunk size 为 30。
  - **数据规模**：CometData 包含 100 万 QA 对和 180 万张图像。CometBench 包含 2,000 个 QA 对。
  - **训练设置**：4 个节点，每节点 8 张 H200 GPU。预训练 100k 步，基础学习率 3e-5。VLA 和 VLM 损失权重分别为 1.0 和 0.1。推理时使用 4 个 flow-matching 步。
- **训练/优化目标**: 
  - 总损失函数为：$\mathcal{L}_{\text{total}} = \mathcal{L}_{\text{AR}} + \mathcal{L}_{\text{fast}} + \mathcal{L}_{\text{fm}}$。
  - $\mathcal{L}_{\text{AR}}$：语言生成的交叉熵损失。
  - $\mathcal{L}_{\text{fast}}$：离散 FAST 动作 token 的监督损失。
  - $\mathcal{L}_{\text{fm}}$：基于流匹配（flow-matching）的连续动作速度回归损失（通过 Beta 采样时间步，预测真实流场）。
  - 通过 stop-gradient barrier 隔离动作专家，确保 $\mathcal{L}_{\text{fm}}$ 只更新动作头和 GAP token 参数，防止梯度泄漏，从而保护 VLM 骨干的预训练多模态推理能力。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：预训练混合使用 AgiBot-World-Beta, InternData-A1, EgoLive, EgoDex, 通用 VQA 和 CometData。后训练使用真实机器人遥操作数据和 RoboTwin 仿真数据。
  - **对比对象（baseline）**：$\pi_0$, $\pi_{0.5}$, RDT, X-VLA, Motus, JEPA-VLA, HALO, LingBot-VLA，以及消融实验中的 w/o phys. VQA 和 w/o GAP。
  - **测试环境**：RoboTwin 2.0 仿真环境（Easy/Hard split）；真实世界 G1 双臂机器人（AgiBot Robotics）梳妆台整理场景。
- **评价指标**: 
  - 仿真和真实机器人：任务成功率 (Success Rate, SR%)。
  - VQA 基准 (CometBench)：使用 LLM 作为裁判，从正确性、逻辑连贯性、相关性、完整性、物理推理 5 个维度打分，总分 100。
  - 相关性分析：VLM 在 CometBench 上的表现与 VLA 在 RoboTwin 上的成功率之间的皮尔逊相关系数 (Pearson r)。
  - 线性探测 (Linear probing)：在动作相关标签（夹爪状态、运动方向、运动幅度）上的分类准确率。
- **主要结果**: 
  - **仿真表现**：CometVLA 在 RoboTwin Easy split 达到 89.24%，Hard split 达到 88.38%，显著优于 $\pi_{0.5}$ (62.86% / 60.30%) 等其他 baseline。消融实验证明，移除物理 VQA 数据（w/o phys. VQA）导致性能下降最大，移除 GAP token 也会降低性能。
  - **真实机器人表现**：在 5 个梳妆台整理任务中，BB cream 成功率 75.00%，liquid foundation 31.25%，lotion 37.50%，makeup sponge 93.75%，serum 43.75%。
  - **相关性验证**：VLM 在 CometBench 上的物理理解能力与 VLA 下游操作成功率呈显著正相关。其中空间推理（Spatial Reasoning, r=0.721）相关性最强，物理与动力学（Physics & Dynamics, r=0.645）次之，证明了物理常识预训练对下游操作的实质性帮助。
  - **GAP token 分析**：t-SNE 可视化显示 GAP token 学到了语义级表示；线性探测显示，相比 VLM 均值池化，GAP token 在夹爪状态预测上提升 +7.0%，在运动幅度预测上提升 +3.9%，证明其有效蒸馏了控制相关的物理信息。

### 3. 🔥 [Temporal Forcing: 4D Representation Alignment for Vision-Language-Action Models] (Temporal Forcing：面向视觉-语言-动作模型的4D表示对齐)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.30643` | [点击跳转](https://arxiv.org/abs/2608.30643)

**0. 论文标题**
- **英文标题**: Temporal Forcing: 4D Representation Alignment for Vision-Language-Action Models
- **中文标题**: Temporal Forcing：面向视觉-语言-动作模型的4D表示对齐
- **研究机构**: 原文未提及
- **一句话总结**: 提出Temporal Forcing方法，通过引入历史路径并将VLA模型的隐式表示与预训练4D基础模型的时序几何特征对齐，解决了VLA在长视界和视觉混淆操作任务中缺乏时间信息的问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长视界（long-horizon）和存在视觉混淆（如物体被遮挡后当前帧无法区分状态）的机械臂操作任务中的表现。
- **研究动机**: 现有的VLA表示对齐方法（如Spatial Forcing）仅依赖当前帧的3D场景几何，缺乏时间维度信息。这导致模型无法追踪物体状态随时间的演变，在处理需要记忆历史状态的长视界任务，或面对视觉相似但历史状态不同的情况时容易失败。
- **本质改动**: 将VLA的训练时表示对齐范式从“单帧3D几何”扩展到“时序4D几何”，通过监督历史隐式表示来捕捉场景随时间的演变。
- **技术溯源**: 基于Qwen3-VL-4B（通过QwenOFT recipe实现的StarVLA基座模型）、预训练的4D基础模型StreamVGGT、冻结的DINOv2视觉编码器以及Q-Former。

**2. 技术拆解**
- **核心方法**: 
  1) 构建历史路径（History Pathway）压缩历史观测；
  2) 使用预训练4D模型提取时序一致的几何特征作为监督目标；
  3) 设计时序对齐损失和当前帧对齐损失，在训练时约束VLA的隐式表示。
- **关键细节**: 
  - **输入输出**：输入为当前图像、历史K帧图像（K=7）和语言指令，输出为动作chunk。
  - **模型结构**：基座为Qwen3-VL-4B。History Pathway使用冻结的DINOv2和Q-Former将历史帧压缩为gist tokens，再通过因果Transformer和16个可学习查询生成固定数量的history tokens，最后通过零初始化的门控交叉注意力注入主干网络的第一个decoder层。
  - **推理部署**：训练结束后，4D模型和对齐头被全部丢弃，仅保留History Pathway和门控模块。不增加主干序列长度，推理延迟仅从45ms微增至58ms。
- **训练/优化目标**: 总损失为动作损失（L1）、当前帧对齐损失（余弦相似度，对齐当前帧token与4D密集几何特征）和时序对齐损失（余弦相似度，对齐历史表示与4D因果几何特征）。时序对齐损失包含三项：State term（匹配单步状态）、Change term（匹配相邻步差分以隔离时序变化）和Readout term（约束summary复现最近时间步）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（包含Spatial, Object, Goal, Long四个套件）、RoboTwin 2.0（12个双臂任务）、真实机器人长视界隐藏放置任务（UR3机械臂）。
  - **对比对象（Baseline）**：OpenVLA, $\pi_0$, Spatial Forcing, GLaD, HAMLET, MemoryVLA, 4D-VLA, StarVLA-OFT (base) 等。
- **评价指标**: 任务成功率（Success rate %）。
- **主要结果**: 
  - **LIBERO**：单模型联合训练平均成功率达98.8%，比基线（96.6%）提升2.2%，在依赖历史的Long套件提升最大（93.8% -> 97.2%）。
  - **RoboTwin 2.0**：12个任务平均成功率从53.5%提升至62.8%，在9个任务上超越基线，尤其在物体被遮挡的handover任务中提升显著（如handover block从0提升至44，handover mic从39提升至79）。
  - **真实机器人**：在孤立单阶段任务中与基线表现相当（78/90 vs 75/90），但在长视界顺序任务中，全流程成功率从20.0%大幅提升至43.3%，证明模型有效保留了任务进度。
  - **消融实验**：证实单独提供历史输入无法让模型利用历史信息（门控几乎为0），必须结合4D时序对齐监督，才能激活历史路径并使其在推理时真正发挥作用。

### 4. 🔥 [DriftingVLA: Native One-Step Vision-Language-Action Generation via Per-Dimension Temporal Drifting] (DriftingVLA：基于逐维度时间漂移的原生单步视觉-语言-动作生成)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.29749` | [点击跳转](https://arxiv.org/abs/2608.29749)

**0. 论文标题**
- **英文标题**: DriftingVLA: Native One-Step Vision-Language-Action Generation via Per-Dimension Temporal Drifting
- **中文标题**: DriftingVLA：基于逐维度时间漂移的原生单步视觉-语言-动作生成
- **研究机构**: 原文未提及
- **一句话总结**: 把需要多步积分的 Flow VLA 改成训练时算分布漂移、推理时单步直出的原生单步模型，并针对动作块提出按通道拆分计算漂移的 PDTD 机制，在保持或提升控制性能的同时把推理延迟降了 3 倍多。

**1. 整体逻辑**
- **研究任务**: 加速基于 Flow matching 的视觉-语言-动作（VLA）大模型，实现机器人控制时的单步动作块（action chunk）生成。
- **研究动机**: 现有的 Flow VLA（如 $\pi_{0.5}$）推理时需要多步数值积分来生成动作块，导致在线控制延迟高。现有的单步加速方法（如 SnapFlow、MeanFlowVLA）本质上还是对多步 flow 的蒸馏或截断，没有摆脱推理时迭代计算的包袱。
- **本质改动**: 抛弃推理时的迭代积分，改用“分布漂移”思想，在训练时通过多个兄弟样本计算分布修正并吸收进参数，推理时只需一次前向传播（噪声到动作）；同时针对动作块的时空结构，提出逐维度时间漂移（PDTD），为每个动作通道独立计算漂移几何，避免不同物理量（如平移、旋转、夹爪）混在一起互相干扰。
- **技术溯源**: 基于预训练的 $\pi_{0.5}$ (LeRobot $\pi_{0.5}$ base) 多模态骨干，以及 DBPO/DBP 中的分布漂移（Distribution Drifting）框架。

**2. 技术拆解**
- **核心方法**: 
  1) 原生单步生成接口：保留预训练 VLM，重新初始化动作专家（Action Expert），将其从预测 flow 速度场改为直接预测“噪声->动作块”的映射。
  2) 逐维度时间漂移（PDTD）：把动作块按动作维度（通道）拆成 $D$ 个独立的漂移单元，每个单元包含完整的 $H$ 步时间轨迹，独立计算距离和漂移力，但模型依然联合生成整个动作块以保留跨通道依赖。
- **关键细节**: 
  - 输入：多视角图像、语言指令、本体状态（条件），以及动作形状的高斯噪声。
  - 输出：完整的动作块（默认步长 $H=50$）。
  - 模型结构：预训练 VLM + 新初始化的动作专家。训练时 VLM 提取的共享上下文被多个独立采样的噪声兄弟样本（siblings，默认 $G=8$）复用，避免重复计算。
- **训练/优化目标**: PDTD 损失。对每个动作通道，利用当前生成的兄弟样本和真实演示计算吸引-排斥的漂移场，将其转为带 stop-gradient 的回归目标，计算 MSE 损失。通过反复优化把分布修正“吃”进网络参数里，推理时则完全去掉这套机制。

**3. 实验结果**
- **实验设置**: 
  - 数据集：仿真环境 LIBERO（40个任务）和 RoboTwin 2.0（50个任务，含 Easy/Hard 设置）；真实世界 6 个操作任务（2 个单臂，4 个双臂）。
  - 对比对象（baseline）：多步 $\pi_{0.5}$ (10-NFE)、单步截断 $\pi_{0.5}$-1step、SnapFlow、MeanFlowVLA，以及 DBP 的 Chunk-wise 和 Step-wise 漂移变体。
- **评价指标**: 任务成功率（%），推理延迟（ms），训练 GPU 时间和显存占用。
- **主要结果**: 
  - LIBERO 上成功率 98.32%（超 $\pi_{0.5}$ 1.22%，超 SnapFlow 0.84%）。
  - RoboTwin 2.0 上 81.09%（超 $\pi_{0.5}$ 1.51%，超 SnapFlow 2.56%）。
  - 真实世界整体 77.67%（超 $\pi_{0.5}$ 3.45%），单臂和双臂任务均有提升。
  - 推理延迟从 227.61 ms 降到 67.67 ms，加速 3.36 倍。
  - 训练开销可控：兄弟样本从 $G=2$ 加到 $G=8$，训练时间仅增加 3.78%，显存增加 9.54%。

### 5. 🔥 [Behavior-Skill: A Fine-Grained Benchmark for Evaluating Vision-Language-Action Policies in Long-Horizon Tasks] (Behavior-Skill：用于评估长视野任务中视觉-语言-动作策略的细粒度基准)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.30536` | [点击跳转](https://arxiv.org/abs/2608.30536)

**文章领域与类型**: 具身智能 / 机器人学习 —— 数据集与基准测试 (Benchmark)

**0. 论文标题**
- **英文标题**: Behavior-Skill: A Fine-Grained Benchmark for Evaluating Vision-Language-Action Policies in Long-Horizon Tasks
- **中文标题**: Behavior-Skill：用于评估长视野任务中视觉-语言-动作策略的细粒度基准
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作把长视野机器人任务的评估从“看整体任务成没成”改成了“拆解到每个子技能独立评估”，建了一个新基准，扒出了当前主流 VLA 模型在复杂接触操作上的具体短板。

**1. 整体逻辑**
- **研究任务**: 构建一个用于评估长视野（long-horizon）移动操作任务中视觉-语言-动作（VLA）策略的细粒度基准测试。
- **研究动机**: 现在的具身基准主要靠整体任务 rollout 和任务级指标。长视野任务中，前面一步失败后面就全断了，传统评估根本看不到中间步骤到底死在哪，掩盖了模型的真实能力分布，没法定位长视野任务失败的真正原因。
- **本质改动**: 把评估和学习的颗粒度从“完整任务”降维到“可独立执行的子技能（constituent skills）”，通过恢复中间状态让子技能可以脱离前置失败被独立评估。
- **技术溯源**: 基于 BEHAVIOR-1K 数据集构建；数据标注用了 Qwen3-VL-235B-A22B-Instruct 和 ChatGPT-5；评估了 π0.5 和 GR00T N1.7 等代表性 VLA 模型。

**2. 技术拆解**
- **核心方法**: 
  1. 技能数据集构建：给 BEHAVIOR-1K 的每个子技能打上多模态上下文（文本、视觉、动作摘要）标签。
  2. 独立技能评估框架：通过轨迹重建恢复每个技能执行前的中间模拟器状态，在满足前置条件下独立跑单个技能。
  3. 技能成功条件定义：用 BDDL（Behavior Domain Definition Language）定义符号化的技能成功目标，并扩展了部分谓词来支持导航、抓取等中间行为的评估。
- **关键细节**: 
  - 数据规模：10,000 个演示切出 235,492 个技能实例，涵盖 50 个家庭任务和 34 个语义技能类别，平均时长 16.6 秒。
  - 视觉与动作处理：视觉采用时长自适应采样（每技能最多 64 帧，拼接头/左腕/右腕三视角）；动作把密集的 23-DoF 序列聚合成紧凑描述（如“左臂移动，夹爪闭合”）。
  - 评估机制：评估 horizon 设为原始演示技能时长的两倍；基于 BDDL 引擎每步判定，满足谓词即成功，超时算失败。
- **训练/优化目标**: 
  - VLA 模型微调使用任务指令（Task）或技能指令（Skill）作为语言条件，原文未提及具体损失函数，仅说明与原始预训练优化目标一致。
  - 评估目标为最大化 BDDL 符号化技能目标的满足率。

**3. 实验结果**
- **实验设置**: 
  - 数据集：完整的 50-task Behavior-Skill 基准（以及 12-task 子集）。
  - 对比对象（baseline）：对比了传统全任务评估（BEHAVIOR-1K）与 Behavior-Skill 评估；测试了 π0.5 和 GR00T N1.7 两种 VLA 策略；对比了 Task（任务指令）和 Skill（技能指令）两种训练/推理设置。
- **评价指标**: 
  - TSCR (Task Skill Completion Rate)：任务技能完成率，衡量单个演示中子技能完成的平均比例。
  - STSR (Skill-Type Success Rate)：技能类型成功率，衡量特定语义技能类别的执行成功率。
- **主要结果**: 
  - 整体能力：在 Skill 设置下，π0.5 和 GR00T N1.7 的 TSCR 分别只有 48.4% 和 42.5%，说明子技能执行依然是长视野任务的最大瓶颈。
  - 瓶颈分析：失败分布极度不均。简单的空间推理技能成功率高，但接触丰富的操作技能（如开/关盖子/门、精确拾取、倒水）是死穴。
  - 评估协议对比：传统全任务评估会因为中间失败导致后续技能没机会执行（比如 QScore 为 0% 的任务，其 TSCR 其实有 80%），严重掩盖模型真实能力；Behavior-Skill 能独立评估每个技能，把中间能力分布扒得清清楚楚。
  - 任务依赖性：同一个语义技能在不同任务里的成功率差异巨大（比如“开门”在不同任务中成功率从 9% 到 78% 不等），说明技能难度不仅看语义标签，还受物体几何、目标关系和场景上下文影响。

### 6. 🔥 [AnyWorld: Factorized Egocentric World Models for Cross-Embodiment Generalization] (AnyWorld：用于跨具身泛化的分解式第一人称世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.29242` | [点击跳转](https://arxiv.org/abs/2608.29242)

**0. 论文标题**
- **英文标题**: AnyWorld: Factorized Egocentric World Models for Cross-Embodiment Generalization
- **中文标题**: AnyWorld：用于跨具身泛化的分解式第一人称世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 AnyWorld 框架，通过将人类第一人称视频显式分解为动作、相机和具身条件，零样本生成跨具身的机器人原生视频数据，从而有效提升下游 VLA（视觉-语言-动作）模型的泛化与适应能力。

**1. 整体逻辑**
- **研究任务**: 利用人类第一人称视频，零样本生成跨具身（cross-embodiment）的机器人原生视频数据（rollouts），以缓解机器人接触丰富（contact-rich）操作任务的数据收集瓶颈。
- **研究动机**: 收集大规模机器人操作数据昂贵且难以跨场景和具身扩展。人类第一人称视频虽包含丰富的物理交互，但受限于单一具身、视角和场景，且与机器人数据存在视觉和异构具身的 gap。现有方法缺乏统一接口来显式控制动作、相机和具身以生成多样化的 rollouts。
- **本质改动**: 将交互过程显式分解为动作（action）、相机（camera）和具身（embodiment）三个独立条件，使得单一人类视频可以在不依赖配对的人机数据的情况下，被重新组合（recompose）成不同机器人具身、视角和场景下的原生视频。
- **技术溯源**: 基于 WAN Fun-Control 14B 视频生成模型，使用 EgoDex 数据集进行人类视频预训练，并在 RoboCasa GR1 和 IRON 机器人数据上进行混合具身微调。

**2. 技术拆解**
- **核心方法**: 提出 AnyWorld，一个分解式的潜在扩散视频模型（latent diffusion video model）。将交互分解为：1) 动作控制（渲染的骨骼控制视频，编码为潜空间张量）；2) 相机控制（相机内外参转换为 Plücker 射线嵌入）；3) 具身与场景上下文（由初始帧和文本标签指定）。
- **关键细节**: 
  - **输入输出**：输入为初始视觉状态（首帧）、动作控制序列、相机控制序列、具身文本标签；输出为目标具身的视频 rollouts。
  - **模型结构**：基于 DiT（Diffusion Transformer）。动作潜变量沿通道维度与噪声视频潜变量拼接（输入通道条件）；相机嵌入通过轻量级适配器加到 patch embedding 上（加性几何条件）；具身和文本嵌入通过交叉注意力（cross-attention）注入每个 transformer block。
  - **规模与超参**：基座为 14B 参数模型。预训练 30K steps（200K EgoDex clips），混合微调 5K steps。人类与机器人数据混合比例最优为 2:1。
- **训练/优化目标**: 
  - **预训练**：在大规模人类第一人称交互视频（EgoDex）上学习动作-相机条件下的视频先验。
  - **微调**：在无配对的人机多具身数据上进行混合微调，学习将不同具身外观与兼容的交互动力学关联。
  - **损失函数**：标准的潜在扩散模型去噪损失（预测扩散噪声）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：EgoDex（人类），RoboCasa GR1（仿真机器人），IRON（真实人形机器人）。
  - **Baseline**：WAN Fun-Control（基于 WAN 2.1 14B 的动作控制视频生成模型），Cosmos-Predict2.5（14B 世界基础模型）。
  - **下游任务**：RoboCasa GR1 仿真中的 18 个 Pick-and-Place 任务，以及真实 IRON 机器人的 20 次抓取试验。VLA baseline 为 UniT。
- **评价指标**: 
  - **可控性代理指标**：ActionAlign（前景光流相似度），CameraAlign（背景光流相似度），EmbodAcc（基于 CLIP 的具身分类准确率）。
  - **视频质量指标**：VBench（主体一致性、背景一致性、闪烁、平滑度）。
  - **下游任务指标**：任务成功率（%）。
- **主要结果**: 
  - **可控性与质量**：AnyWorld 在 ActionAlign (0.659)、CameraAlign (0.789)、EmbodAcc (0.886) 上均显著优于 Cosmos-Predict2.5 和 WAN Fun-Control，平均可控性得分达 0.778。VBench 视频质量平均得分（0.971）也略高于 baseline。
  - **下游 VLA 适应**：在 RoboCasa GR1 仿真中，成功率从 49.8% 提升至 54.6%（+4.8%）；在真实 IRON 机器人上，抓取成功率从 20.0% 提升至 55.0%（+35.0%）。
  - **针对性能力迁移**：通过重新组合视觉和动作，成功修复了机器人在部分完成状态下的“虚假完成先验”（spurious completion prior），并实现了基于语言的空间目标选择。仅添加动作而不改变视觉的消融实验失败了，证明了视觉重组（visual recomposition）的必要性。

### 7. 🔥 [RoboPhys-3D: A Comprehensive Embodied World Model Evaluation via 3D Reconstruction] (RoboPhys-3D：基于3D重建的全面具身世界模型评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2608.28718` | [点击跳转](https://arxiv.org/abs/2608.28718)

**0. 论文标题**
- **英文标题**: RoboPhys-3D: A Comprehensive Embodied World Model Evaluation via 3D Reconstruction
- **中文标题**: RoboPhys-3D：基于3D重建的全面具身世界模型评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个基于3D重建的具身世界模型评估基准，通过将生成视频与真实视频置于统一的3D重建管线下进行对比，解耦了重建误差与生成误差，从像素、3D几何、状态理解和任务执行四个层级全面衡量模型能力。

**1. 整体逻辑**
- **研究任务**: 评估具身世界模型（EWMs）生成的视频是否准确保留了底层的3D场景物理状态，以及这些生成的视频能否被转化为下游机器人可执行的有效动作。
- **研究动机**: 现有的具身世界模型基准缺乏统一的基于3D的评估协议。很多模型在像素级感知或大语言模型（VLM）判断中得分很高，但生成的视频在物理上不可能或上下文错误，导致下游任务失败。此外，现有方法在评估3D一致性时，无法区分视频评估中的“3D重建误差”和“视频生成误差”。
- **本质改动**: 核心思路是让生成的视频和真实的视频通过完全相同的3D重建管线进行处理，在重建后的共享3D场景空间中进行对比。这种设计将重建引入的误差与模型生成引入的误差剥离开来，实现了公平的3D级别评估。
- **技术溯源**: 基于 RoboTwin 2.0 仿真平台构建数据集；使用 Qwen3-VL 生成视角感知的自然语言提示；采用 4 种 3D/4D 重建方法（VGGT, VGGT-Ω, 4DGS, 4C4D）；测试了 4 种视频世界模型（Wan 2.2, CogVideoX 1.5, Cosmos 3, RoboDreamer）；使用逆动力学模型（IDM，如 DreamGen）将视频解码为机器人动作。

**2. 技术拆解**
- **核心方法**: 构建了一个包含50个操作任务、5000个episode的多视角视频数据集。设计了统一的3D评估协议：对每个episode的主视角视频（包括真实视频和模型生成的视频）使用相同的4种3D/4D重建方法重建出3D场景，然后在重建后的3D空间中进行几何和物理一致性打分。同时，通过逆动力学模型（IDM）将生成的视频解码为关节空间动作，在仿真器中回放以评估任务成功率。
- **关键细节**: 
  - 数据集规模：50个任务，4种操作机制（单/双臂，有/无目标位置），每任务100个episode，共5000个episode，25000个多视角真实视频。
  - 评估层级：分为4个层级、18个子维度、50个指标。1) 像素级保真度（图像质量、美学、分布相似度、运动质量、内容一致性）；2) 3D几何一致性（基于重建的几何、深度一致性、相机轨迹几何、往返一致性）；3) 状态级理解（物体定位、轨迹精度、交互质量、事件/动作遵循、物理定律遵循、语义遵循）；4) 任务级完整性（指令遵循、碰撞安全、任务成功）。
  - 综合得分：提出了平均满分（AFS，分层平均所有50个归一化指标）和 RoboPhyscore（挑选出与任务成功率皮尔逊相关系数>0.7的8个核心指标进行平均，作为紧凑的任务对齐得分）。
- **训练/优化目标**: 本文是评估基准与数据集工作，不涉及模型训练。其核心机制是通过统一的3D重建管线和IDM解码，计算50个维度的评估指标，并利用分层平均和皮尔逊相关性筛选来构建AFS和RoboPhyscore综合得分体系。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自建的 RoboPhys-3D 数据集（基于 RoboTwin 2.0）。
  - 对比对象（baseline）：评估了4个代表性视频世界模型，包括通用世界模型（GWM）Wan 2.2 和 CogVideoX 1.5，以及具身世界模型（EWM）Cosmos 3 和 RoboDreamer。
  - 重建方法：VGGT, VGGT-Ω, 4DGS, 4C4D。
  - 逆动力学模型（IDM）：对比了 DreamGen, J-IDM, MIDM，最终选用 DreamGen 进行执行层面的评估。
- **评价指标**: 50个细分指标构成的4级评估体系，以及两个综合指标：Average Full Score (AFS) 和 RoboPhyscore。同时使用人工评估（70名标注者）来验证 RoboPhyscore 与人类判断的一致性。
- **主要结果**: 
  - Cosmos 3 表现最好，RoboPhyscore 达到 0.6330（达到真实值的 92.7%），在所有重建方法和任务类别中均排名第一。Wan 得分为 0.5359，RoboDreamer 为 0.3492，CogVideoX 为 0.3363。
  - 揭示了“感知/语义合理性”与“正确具身预测”之间的系统性差距：模型在像素级、VLM判断或碰撞安全上得分很高，但在物体定位、轨迹精度和下游任务成功率上存在严重缺陷。例如 CogVideoX 碰撞安全得分最高，但任务成功率仅为真实值的 16.5%。
  - 证明了分离重建误差的必要性：不同的3D重建方法会导致 RoboPhyscore 产生高达 21.8% 的波动。前馈重建方法（VGGT系列）比动态表示（4DGS/4C4D）保留了更多的状态和任务级信息。
  - RoboPhyscore 与人工评估高度一致（Pearson r = 0.9761, Spearman ρ = 0.8962）。
  - 提示词的具体程度能显著提升模型表现：使用视角感知提示（view-aware prompt）相比原始指令，使 Wan 的 RoboPhyscore 提升了 16.5%。

### 8. 🔥 [Facet-0: A Robotic Foundation Model for Contact-Rich Precise Manipulation] (Facet-0：一个用于接触丰富精密操作的机器人基础模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.01596` | [点击跳转](https://arxiv.org/abs/2609.01596)

**0. 论文标题**
- **英文标题**: Facet-0: A Robotic Foundation Model for Contact-Rich Precise Manipulation
- **中文标题**: Facet-0：一个用于接触丰富精密操作的机器人基础模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出Facet-0模型，通过将“接触力”作为动作的预测后果而非单纯输入，结合价值引导的后训练与局部适应，解决了机器人在亚毫米级间隙精密装配中最后几毫米的接触失败问题。

**1. 整体逻辑**
- **研究任务**: 解决机器人在精密装配（如电脑零件组装）中，最后几毫米接触丰富（contact-rich）且存在亚毫米级间隙的精确操作与力控问题。
- **研究动机**: 现有的视觉-语言-动作（VLA）模型在自由空间表现良好，但在精密装配的最后阶段，视觉相似的动作可能导致完全不同的物理结果（如顺利插入或暴力卡死）。现有方法通常将接触力视为历史记录或低级反馈，未能将其作为动作的未来后果进行预测和价值评估。
- **本质改动**: 将“接触（腕部力/力矩）”从观测输入转变为动作的联合预测目标（predicted consequence），并通过部署时的价值函数（Critic）对“动作-接触”对进行打分和筛选，从而指导策略优化。
- **技术溯源**: 基于 PaliGemma（视觉-语言骨干网络）和 flow-matching（流匹配）动作专家。

**2. 技术拆解**
- **核心方法**: 
  1. **语义-接触对齐**：联合预测未来的动作块（action chunk）和腕部力/力矩，构建语义-接触表征。
  2. **价值引导的策略优化**：训练一个动作-力矩评论家（Action-Wrench Critic），评估预测动作及其预期力矩的质量，区分“顺利对齐”和“暴力卡死”，利用接触选择性信用分配（contact-selective credit）微调策略。
  3. **有界局部适应**：冻结主干网络，训练一个轻量级局部执行器，利用辅助的力矩预测保持动作-接触耦合，以适应不同零件的动态特性。
- **关键细节**: 
  - **输入**：3个视角的RGB图像、任务指令、7维运动学状态（末端位姿+夹爪开合）、过去10步（K=10）的6维腕部力/力矩历史。
  - **输出**：联合预测未来50步（H=50）的7维笛卡尔动作和6维腕部力/力矩。推理时只执行动作，力矩仅作为预测后果。
  - **架构与规模**：采用粗到细的解码机制，粗专家以5-10Hz生成约5mm分辨率的动作-力矩块，精专家以20Hz在接触阶段更新为0.5mm分辨率。
- **训练/优化目标**: 
  - **预训练**：条件流匹配（Conditional flow matching）损失，联合优化动作和力矩预测；与VQA交叉熵损失交替优化（更新比例4:1），使用结构化掩码防止目标泄露。
  - **后训练（RL）**：分布式动作-力矩评论家的时序差分（TD）损失；基于接触选择性信用的流匹配微调损失（对接触帧进行加权）。
  - **局部适应**：TD3 actor-critic 损失（仅评估7维可执行动作），结合成功干预的行为克隆（BC）锚定损失和辅助的一步力矩预测损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 ManuFacet-1K（约1000小时力同步数据，涵盖3种机器人本体和多个制造单元）。
  - **测试环境**：5个精密电脑组装任务（RAM, CPU, Disk, GPU, LEVER），包含23个子目标，关键接触间隙为0.10-0.30mm。
  - **对比对象（Baseline）**：π0.5, π0.5+F（力作为输入）, π0.5+RECAP-style, GR00T N1.7, TA-VLA。
- **评价指标**: 成功率（Success rate）、违规率、人工干预率、故障恢复率、峰值偏轴力、周期时间和推理延迟。
- **主要结果**: 
  - Facet-0 在5个任务上的平均成功率达到 82%，而最强 baseline（π0.5+RECAP-style）仅为 15%（提升5.5倍）。
  - 保持 0.5 mm 的放置精度和 50 ms 的推理延迟。
  - 消融实验表明，仅语义-接触对齐成功率为 16%，加入价值引导后提升至 38%，加入局部适应后达到 82%。
  - 相比优势加权行为克隆（AWR），价值引导后训练将人工干预率从 47% 降至 24%，故障恢复率从 44% 提升至 81%。
  - 在未见过的内存模块上，仅用10个演示和3小时训练（更新6.6%参数），局部适应达到 45% 成功率，而最强 baseline 为 5%。

### 9. 🔥 [Knowing When to Stop: Adaptive Action Chunking via Internal Cross-Attention Dynamics in VLAs] (知道何时停止：通过VLA内部交叉注意力动态实现自适应动作分块)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.00908` | [点击跳转](https://arxiv.org/abs/2609.00908)

**0. 论文标题**
- **英文标题**: Knowing When to Stop: Adaptive Action Chunking via Internal Cross-Attention Dynamics in VLAs
- **中文标题**: 知道何时停止：通过VLA内部交叉注意力动态实现自适应动作分块
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种免训练的自适应动作分块策略，通过监控VLA模型内部交叉注意力熵的饱和情况来动态决定动作执行长度，在几乎不增加计算开销的情况下提升了机器人操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 优化视觉-语言-动作（VLA）模型在机器人操作任务中的动作执行策略（Action Chunking），解决固定执行步长带来的效率与精度权衡问题。
- **研究动机**: 现有VLA模型推理时通常采用固定的动作执行步长（execution horizon）。步长太短会导致频繁推理、计算开销大且动作振荡；步长太长则会导致后续动作与当前视觉观测脱节，预测误差急剧增加。且最优步长随任务和任务阶段动态变化，固定步长无法兼顾。
- **本质改动**: 发现动作专家中动作token对VLM token的交叉注意力分布会随着预测步数增加而变得分散，其信息熵升高并趋于饱和，这与动作预测误差高度相关。利用这一内部注意力熵的动态变化作为信号，免训练地动态截断动作序列，自适应决定执行步长。
- **技术溯源**: 基于主流的VLA架构，具体在 $\pi_{0.5}$（解耦架构）和 X-VLA（耦合架构）上进行验证。动作生成底层依赖 Flow matching 或 Diffusion 等生成式技术。

**2. 技术拆解**
- **核心方法**: 提出一种基于交叉注意力熵的自适应动作截断机制。在推理时，计算动作token对VLM token的交叉注意力权重，将其沿层聚合归一化后计算信息熵。当检测到熵值达到理论上限的特定比例（如95%）且在一个滑动窗口内保持稳定（梯度极小）时，判定注意力已完全分散，当前观测无法继续支撑后续动作的准确预测，从而在此处截断，将截断点作为当前的执行步长。
- **关键细节**: 
  - 输入输出：输入为VLA模型推理时产生的注意力权重矩阵；输出为动态决定的执行步长。
  - 模型结构：适用于解耦和耦合架构。解耦架构直接提取动作到VLM的注意力子矩阵；耦合架构提取拼接后注意力矩阵中动作query到VLM key的块。
  - 关键超参：平滑窗口大小 $k=5$（LIBERO上为3），归一化高熵阈值 $\eta=0.95$，稳定性阈值 $\tau=0.01$。这些超参在所有任务中通用，无需针对特定任务调参。
- **训练/优化目标**: 无需重新训练或修改模型架构（Training-free）。核心机制是在推理阶段直接利用策略网络已计算出的注意力权重，通过滑动窗口检测高熵平台期来确定截断点，不引入额外的采样或前向传播。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：仿真环境使用 RoboTwin 2.0（10个任务）和 LIBERO（4个suite）；真实世界使用双臂ARX机器人完成3个任务（Hang mug, Stack cups, Tidy pens）。
  - 对比对象：固定步长（Fixed chunk）、基于自注意力权重的自适应方法（SA）、基于多次采样估计不确定性的方法（MS）。
  - 测试模型：$\pi_{0.5}$ 和 X-VLA。
- **评价指标**: 任务平均成功率（Success Rate, %）、平均动作执行长度（Avg. Len.）、单步推理延迟（Latency）。
- **主要结果**: 
  - 在 RoboTwin 2.0 上，$\pi_{0.5}$ 的平均成功率达到 62.9%，优于所有固定步长和 SA/MS baseline，且平均执行长度达到 18.11 步，有效减少了推理频率。
  - 在 X-VLA 上，平均成功率达到 79.0%，同样优于所有 baseline。
  - 在 LIBERO 上，$\pi_{0.5}$ 的平均成功率从 fixed baseline 的 94.88% 提升至 97.25%，在长程任务上提升最明显（+4.5%）。
  - 在真实世界任务中，平均成功率达到 61.7%，比最佳固定步长高 10%，比 SA 高 6.7%。
  - 效率方面，相比 MS 方法增加约 30ms 延迟，本方法仅增加不到 7ms 延迟（0.2725s vs 0.2661s），几乎无额外开销。

### 10. 🔥 [DSG: Dynamic 3D Scene Graph Construction for Embodied Agents in Changing Indoor Environments] (DSG：面向变化室内环境中具身智能体的动态3D场景图构建)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.00619` | [点击跳转](https://arxiv.org/abs/2609.00619)

**0. 论文标题**
- **英文标题**: DSG: Dynamic 3D Scene Graph Construction for Embodied Agents in Changing Indoor Environments
- **中文标题**: DSG：面向变化室内环境中具身智能体的动态3D场景图构建
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于3D高斯和双视角渲染比对的动态3D场景图构建框架DSG，并发布了动态场景图评测基准Dyn-THOR，解决了动态环境中物体移动导致的场景图失效和空间关系推理不准的问题。

**1. 整体逻辑**
- **研究任务**: 在物体位置会因人类或机器人活动而频繁变化的动态室内环境中，为具身智能体构建并实时更新3D场景图（包含物体节点和空间关系边）。
- **研究动机**: 1) 现有方法难以在线更新场景图，且基于单视角未优化渲染的物体变化检测容易因渲染伪影和视角遮挡误删有效物体；2) 现有空间关系推理多依赖物体标签和几何信息，缺乏视觉上下文导致预测不准；3) 缺乏评估动态环境下场景图一致性的基准数据集。
- **本质改动**: 将物体变化检测从“直接比对未优化渲染图”改为“先优化高斯再比对，并引入最优视角二次验证”；将空间关系推理从“纯几何/标签驱动”改为“融合多粒度视觉上下文与几何信息驱动”。
- **技术溯源**: 3D Gaussian Splatting (3DGS), GroundingDINO, Segment Anything (SAM), CLIP, Describe Anything Model (DAM), LLM (Qwen3-VL-Plus), AI2-THOR 仿真平台。

**2. 技术拆解**
- **核心方法**: 
  1. 语义感知3D高斯地图构建与物体关联。
  2. 基于双视角渲染的物体变化检测（当前视角比对 + 优化视角验证）。
  3. 视觉上下文增强的空间关系推理（VLM生成多粒度描述 + LLM推理）。
- **关键细节**: 
  - **物体关联**：用 GroundingDINO 检测，SAM 分割，CLIP 提特征。通过渲染掩码与检测掩码的 IoU（几何相似度）和 CLIP 特征余弦相似度（语义相似度）进行贪心匹配，并加权更新全局语义特征。
  - **双视角变化检测**：先用当前视角渲染优化后的高斯图，计算通道级 SSIM，将物体分为 Stable/Uncertain/Missing。对 Uncertain 的物体，优化一个虚拟相机位姿（最大化物体在画面中心的可见度，同时约束距离），从该最优视角再次渲染历史与当前地图进行 SSIM 比对，最终确定物体状态。
  - **关系推理**：用 DAM 生成物体本身和扩大 2.5 倍区域的上下文文本描述。根据 3D 包围盒 IoU 和点云重叠率（FAISS）筛选候选边。将几何信息、语义标签和多粒度文本描述输入 LLM 推理空间关系。
- **训练/优化目标**: 
  本工作为系统框架而非端到端训练模型，核心优化目标包括：
  1. **高斯参数优化**：通过可微渲染损失优化高斯 primitives 的位置、颜色、缩放、旋转和不透明度。
  2. **虚拟视角优化**：优化相机位姿 $(R^*, t^*)$，最小化视锥损失 $L_{frustum}$（让不确定物体的投影靠近图像中心以最大化覆盖）和可见度损失 $L_{vis}$（防止相机跑得太远，保持目标物体占据较大图像区域）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 Dyn-THOR（基于 AI2-THOR，包含物体移动前后的序列及标注），3RScan（真实世界 RGB-D 数据集），以及自采真实世界数据集。
  - **对比对象 (Baseline)**：ConceptGraphs, DynamicGSG。
  - **测试环境**：NVIDIA RTX 3090 GPU。
- **评价指标**: 
  - **节点级（物体）**：Precision, Recall, F1 score（基于 3D IoU 和 CLIP 语义相似度匹配），Missing Residual Rate (MRR，未删除的缺失物体比例，越低越好)。
  - **边级（关系）**：Predicted Edges (PE，预测边数), Evaluable Edges (Eval.，可评估边数), Coarse Matches (CM，粗粒度匹配，关系存在即算对), Fine Matches (FM，细粒度匹配，主谓宾全对才算对)。
- **主要结果**: 
  - **节点级**：在 Dyn-THOR 上，DSG (Full) 的 MRR 降至 2.1%（DynamicGSG 为 3.0%，ConceptGraphs 为 14.9%），F1 达到 40.3%。在 3RScan 上，F1 从 DynamicGSG 的 11.7% 提升至 22.8%。双视角策略有效减少了因渲染伪影导致的误删和因遮挡导致的漏删。
  - **边级**：在 Dyn-THOR 上，DSG 预测的有效边数（PE）达到 15.5（DynamicGSG 5.2，ConceptGraphs 3.1），粗粒度匹配（CM）达到 1.8，细粒度匹配（FM）达到 0.8，均显著优于 Baseline。消融实验表明，引入视觉上下文有效增加了预测边数（13.6 提升至 15.5）和粗粒度准确率。

- **英文标题**: IMPACT: Attention Is the Interaction Map for Scalable Interaction-Aware World Model Training
- **中文标题**: IMPACT：注意力即交互图，用于可扩展的交互感知世界模型训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出 IMPACT 训练框架，利用模型内部的交叉注意力构建交互图来重加权去噪损失，无需外部先验即可解决世界模型训练中交互区域监督不足的问题，显著提升物理交互的生成质量。

**1. 整体逻辑**
- **研究任务**: 训练具身智能体的视频世界模型（World Models），使其能根据动作指令（如机械臂轨迹、人手姿态）预测未来，生成物理合理且交互逼真的视频。

- **本质改动**: 抛弃外部辅助表示，直接利用模型前向传播中“被操作物体 token”的交叉注意力（cross-attention）作为交互区域的时空先验，通过重加权机制让去噪损失在训练时更关注交互区域。
- **技术溯源**: 基于大规模预训练视频生成骨干（如 Wan 2.2、Cosmos-Predict 2.5）、DiT 架构、Flow Matching（流匹配）训练目标，以及冻结的 Qwen2.5-0.5B 文本编码器。

**2. 技术拆解**
- **核心方法**: IMPACT 框架，包含前向的注意力分布采样（ADS）和反向的交互加权监督（IWS），并结合梯度解耦优化策略。
- **关键细节**: 
  - **输入输出**：输入为文本指令、参考帧、动作信号，输出为去噪后的视频 latent。
  - **Object-Token Grounding**：用冻结的 Qwen2.5-0.5B 从指令中提取被操作物体的名词短语，并对齐到 text tokens。
  - **ADS（前向）**：聚合上述 object tokens 的 cross-attention 生成先验分布；采样 K 个（K=8）候选区域，用 detach 的局部预测误差（local prediction error）对候选区域进行打分和加权，生成精确的 interaction map。
  - **IWS（反向）**：利用 interaction map 对每个空间位置的去噪损失进行重加权（权重在 $[1, \gamma]$ 之间，$\gamma=5$），增强交互区域的监督。
  - **梯度路由**：交叉注意力参数用全局 MSE 目标更新，其余 DiT 参数用 IWS 目标更新，防止先验分布为了迎合局部损失而崩溃。
- **训练/优化目标**: 基础目标是 Flow Matching 的全局 MSE 去噪损失；IMPACT 引入交互加权去噪目标 $\mathcal{L}_{IWS}$，通过梯度解耦分别优化注意力参数（全局目标）和主干参数（交互加权目标）。所有额外操作仅在训练时进行，推理时无开销。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：机械臂操作使用 RoboTwin（训练，约 350K 视频）和 WorldArena（测试）；人手操作使用 EgoDex（训练，约 256K 视频，及测试）。
  - **对比对象（Baseline）**：通用世界模型（CogVideoX, Veo 3.1, Wan 2.6, HunyuanVideo-1.5 等）、具身世界模型（GigaWorld-0, Genie Envisioner, Vidar, IRASim, CtrlWorld）、表示引导模型（TesserAct, RoboMaster, WoW）、姿态控制模型（MimicMotion, MagicPose, VACE, LOME），以及同骨干的 MSE 训练基线（Wan 2.2-AC, Cosmos-Predict 2.5 (action)）。
- **评价指标**: 
  - **WorldArena**：EWMScore（16项归一化指标均值），及 Visual Quality, Motion Quality, Content Consistency, Physics Adherence, 3D Accuracy, Controllability 6个维度。
  - **EgoDex**：FVD, FID（视觉指标），CLIP-Hand, Hand IoU（手部交互指标）。
- **主要结果**: 
  - **机械臂（WorldArena）**：在 Wan 2.2-AC 上，EWMScore 从 58.65 提升至 62.46（+3.81）；在 Cosmos-Predict 2.5 (action) 上，从 55.91 提升至 62.53（+6.62）。在物理合理性（Physics Adherence）、3D 精度和可控性上显著优于各类 baseline。
  - **人手（EgoDex）**：在 Wan 2.2-AC 上，FVD 从 366.12 大幅降至 110.94，FID 从 44.71 降至 5.79；CLIP-Hand 从 0.921 提升至 0.952，Hand IoU 从 0.693 提升至 0.772。交互保真度和手部定位全面领先同骨干基线及姿态控制模型。

### 12. 🔥 [Do Better Imagined Rollouts Mean Better Robot Control? A Controlled Study of World-Model Evaluation Under Feedback] (更好的想象推演意味着更好的机器人控制吗？反馈控制下世界模型评估的受控研究)
- **研究机构**: `Georgia Institute of Technology`
- **Arxiv ID**: `2609.02811` | [点击跳转](https://arxiv.org/abs/2609.02811)

**0. 论文标题**
- **英文标题**: Do Better Imagined Rollouts Mean Better Robot Control? A Controlled Study of World-Model Evaluation Under Feedback
- **中文标题**: 更好的想象推演意味着更好的机器人控制吗？反馈控制下世界模型评估的受控研究
- **研究机构**: Georgia Institute of Technology
- **一句话总结**: 本文通过受控实验证明，在机器人闭环控制中，仅靠无测量更新的长步开环推演误差无法准确预测模型的实际闭环表现，离线评估协议必须同时匹配实际系统的预测步长和测量更新频率。

**1. 整体逻辑**
- **研究任务**: 探究机器人预测模型（世界模型/状态估计器）的离线评估指标（如多步推演误差）与其在闭环反馈控制中的实际表现之间的相关性。
- **研究动机**: 现有工作通常用开环、无测量更新的长步推演误差（measurement-free rollout）来评估预测模型。但在实际闭环中，机器人会高频接收传感器测量并更新状态。开环推演误差小的模型，其误差分布可能恰好对反馈控制器不利；而推演误差大的模型，可能因为能很好地利用间歇性测量更新而在闭环中表现更好。现有的离线评估指标无法反映这种差异。
- **本质改动**: 没有提出新的模型架构，而是设计了一套严格的受控实验平台，将“预测步长（rollout horizon）”和“测量更新频率（measurement-update interval）”解耦，系统量化了不同离线评估协议与闭环控制表现之间的秩相关性。
- **技术溯源**: 基于经典状态估计（Dead Reckoning, Extended Kalman Filter）和序列模型（GRU, SSM）构建的残差状态估计器。

**2. 技术拆解**
- **核心方法**: 构建差速驱动机器人的路径跟踪仿真环境，设计6种状态估计器（DR, EKF, 及基于DR/EKF的GRU/SSM残差估计器）。在24种传感器退化条件下，对比三种评估协议：1) 轨迹回放（有测量更新，固定真实轨迹）；2) 无测量更新的多步推演；3) 闭环路径跟踪（估计器直接驱动控制器，误差会改变后续轨迹）。通过计算离线指标与闭环指标的Spearman秩相关系数和Top-1选择失败率来衡量评估协议的有效性。
- **关键细节**: 
  - 机器人状态为2D位姿 $(x, y, \theta)$，使用Pure-pursuit控制器。
  - 传感器包含带偏差的轮式里程计和间歇性的路标距离/方位测量。
  - 核心控制变量：推演步长 $H \in \{5, 20, 80\}$，测量更新间隔 $k \in \{1, 5, 20, \infty\}$。
- **训练/优化目标**: 学习型估计器（GRU/SSM）使用BPTT训练，优化目标为最小化状态估计残差。部分模型在训练时引入了更长的传感器盲区（longer sensing outages）以测试鲁棒性。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: 自建的差速机器人仿真环境，200条域随机化专家轨迹用于训练，24种传感器退化条件（路标数量、噪声、陀螺仪偏差、完全盲区）用于测试。
  - **对比对象**: 离线评估指标（Replay position RMSE, Measurement-free rollout RMSE） vs 闭环控制指标（Cross-track RMSE）。对比的模型包括DR, EKF及四种RNN/SSM残差模型。
- **评价指标**: Spearman秩相关系数（$\rho$），Top-1选择失败率（离线指标选出的最优模型与闭环实际最优模型不一致的比例），选择遗憾（Selection regret，选出的模型与最优模型的闭环误差差值）。
- **主要结果**: 
  1. 轨迹回放（Replay）误差与闭环表现的秩相关性（$\rho=0.923$）显著高于20步无测量推演（Rollout）（$\rho=0.774$）。Rollout在24个条件中有18个选错了最优模型，而Replay只选错了5个。
  2. 解耦实验表明，长步推演本身不是问题，问题在于“无测量更新”。当推演步长固定为20时，随着测量更新间隔增大，与闭环的秩相关性从0.916（每步更新）下降到0.774（无更新）。当步长增加到80且无更新时，相关性暴跌至0.32。
  3. 训练更长盲区的模型在综合退化条件下能降低GRU-EKF的闭环误差（1.72 m降至1.06 m），但在单一盲区测试中表现不一致，说明单纯延长训练盲区不能保证闭环鲁棒性。

### 13. 🔥 [ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation] (ZETA：桌面操作零样本跨具身VLA迁移的对照研究)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.02546` | [点击跳转](https://arxiv.org/abs/2609.02546)

**0. 论文标题**
- **英文标题**: ZETA: A Controlled Study of Zero-Shot Cross-Embodiment VLA Transfer for Tabletop Manipulation
- **中文标题**: ZETA：桌面操作零样本跨具身VLA迁移的对照研究
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于基准评测与实证分析类工作，构建了一个严格控制非具身变量的对照基准，系统量化了状态-动作表示、预训练具身多样性、辅助协同训练和目标具身暴露对VLA模型零样本跨具身迁移的影响，并给出了提升迁移性能的实用指导。

**1. 整体逻辑**
- **研究任务**: 评估和提升视觉-语言-动作（VLA）模型在桌面操作任务中的零样本跨具身（zero-shot cross-embodiment）迁移能力，即让在一个机器人上训练的模型直接泛化到形态不同的新机器人上。
- **研究动机**: 现有文献对“零样本迁移”的定义含糊不清（有的预训练时见过目标机器人，有的完全没见过），且现有评估往往把具身变化与任务、场景、相机、数据量等变量耦合在一起，导致无法将性能下降准确归因于“具身不匹配”本身。
- **本质改动**: 明确区分了“严格零样本迁移”（目标具身完全不在训练集中）和“预训练暴露零样本迁移”（目标具身仅在预训练中出现），并构建了一个严格控制非具身变量的对照基准，对影响迁移的四个核心因素进行解耦分析。
- **技术溯源**: 基于 $\pi_{0.5}$ (Mixture-of-Transformers) 等VLA基座模型架构，仿真环境使用MuJoCo和IsaacSim，数据构造参考了Franka系列机械臂。

**2. 技术拆解**
- **核心方法**: 构建包含14个未见目标具身（7个仿真+7个真机）的对照基准。将具身变化细分为外观（appearance-only）、夹爪（gripper-only）、机械臂（arm-only）和全具身（full-embodiment）四类。通过控制变量法研究四个问题（RQ）：1) 状态-动作表示的选择；2) 预训练源具身多样性与数据预算的权衡；3) 辅助协同训练目标的作用；4) 目标具身在预训练中的暴露比例。
- **关键细节**: 
  - **状态-动作表示**：对比了绝对末端执行器（Abs. EEF）和末端执行器增量（EEF-Delta）状态，以及世界坐标系增量（World-Delta）和局部坐标系增量（EEF-Delta）动作。
  - **数据构造**：程序化生成512个Franka风格的源具身用于预训练（总预算640K轨迹），7个商用机器人作为严格零样本测试目标。
  - **模型结构**：采用 $\pi_{0.5}$ 架构（视觉-语言流+动作专家），输入为224x224的腕部和第三人称视角图像及4步状态历史，输出12步动作块。
  - **辅助任务**：包括EEF坐标系下的语言-动作预测、混合坐标系语言-动作预测、子目标预测和任务条件边界框预测。
- **训练/优化目标**: 主任务是模仿学习（Flow-matching action loss），辅助任务使用交叉熵损失（权重0.25）。预训练在16张H800上跑120K步，后训练在8张H800上跑100K步。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的程序化生成Franka源具身数据集（512个变体），以及7个未见过的商用机器人（仿真如UR5e+UMI、GoogleRobot等；真机如Humanoid、Piper-on-Quadruped等）。下游任务仿真3个，真机2个。
  - **对比对象（Baseline）**：不同状态-动作表示组合、不同源具身数量（1, 8, 32, 128, 512）、无辅助训练 vs 有辅助训练、0% vs 5% vs 30% vs 100% 目标具身预训练暴露。
- **评价指标**: 任务进度（Task progress），范围[0, 100]%。完全完成得100%，达到必要交互子目标（如接触到物体）得50%，否则0%。采用宏平均计算各类别和任务的平均分。
- **主要结果**: 
  1. **状态-动作表示**：局部EEF-Delta状态和EEF-Delta动作表现最好。相比基线，EEF-Delta状态将大跨度迁移（arm-only和full-embodiment）提升了约30个百分点，整体平均提升约15个百分点。真机实验中该组合达到了89.9%的平均进度，远超其他表示。
  2. **源具身多样性**：在固定总预算（640K）下，使用512个源具身比单源具身平均提升约18个百分点，且在夹爪、机械臂和全具身变化上增益最大。但在固定单具身预算下，性能随源具身数量（32->128->512）单调上升，说明多样性和数据密度需要联合考量。
  3. **辅助协同训练**：所有辅助任务均优于纯模仿学习。其中任务条件边界框预测（Task-conditioned BBox）效果最好，将平均进度从75.7%提升至82.3%（提升约7个百分点）。
  4. **目标具身暴露**：在预训练中仅加入5%的目标具身数据，就能将目标具身的平均进度提升13.4个百分点（如UR5eUMI从69.3%升至78.6%），证明“严格零样本”和“预训练暴露零样本”难度差异巨大，未来论文必须将两者分开报告。

### 14. 🔥 [Modeling What Changes: Sparse, Residual World Models for Object-Centric Manipulation] (建模变化之物：用于以物体为中心的操作的稀疏残差世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.02046` | [点击跳转](https://arxiv.org/abs/2609.02046)

**0. 论文标题**
- **英文标题**: Modeling What Changes: Sparse, Residual World Models for Object-Centric Manipulation
- **中文标题**: 建模变化之物：用于以物体为中心的操作的稀疏残差世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种带逐物体变化门控和残差增量头的稀疏世界模型，通过只预测运动物体的位姿增量来避免对静止物体的误差注入，在桌面推物任务中大幅减少 rollout 误差累积并提升参数效率。

**1. 整体逻辑**
- **研究任务**: 领域与类型：机器人学/基于模型的强化学习，方法创新。研究任务：机器人操作任务中的前向动力学预测（世界模型），具体为桌面推物场景下的物体位姿预测与基于模型的规划（Model-based planning）。
- **研究动机**: 现有的单体（monolithic）世界模型在每一步都预测整个场景的下一个状态。这导致两个问题：1）浪费模型容量和计算资源去重新预测场景中静止的多数物体；2）产生“误差注入”（error injection），即回归器会扰动那些本应保持不变的物体，在闭环 rollout 中导致误差累积和轨迹漂移。
- **本质改动**: 将世界模型的预测目标从“预测绝对全量状态”改为“预测变化”。引入显式的逐物体变化门控（判断动没动）和残差增量头（只预测动了的物体的位姿增量），静止物体直接复制（verbatim）。
- **技术溯源**: 基于以物体为中心（object-centric）的因子化动力学模型思想，以及稀疏编码和条件计算（conditional computation）中的门控机制（如 Gumbel straight-through estimator）。

**2. 技术拆解**
- **核心方法**: 稀疏/残差（sparse/residual）物体中心世界模型。对每个物体提取特征，通过门控网络输出离散的变化决策（0或1），再通过增量头输出残差位姿增量。最终预测位姿为当前位姿加上被门控掩码后的残差增量。
- **关键细节**: 输入包含推杆位置、每个物体的平面位姿(x,y,θ)和速度、目标位置及动作。门控和增量头均为2层、宽度128的MLP，权重在所有物体间共享（与物体数量解耦）。门控使用 Gumbel straight-through estimator 进行离散采样，推理时硬截断。模型极小，参数量 < 0.1M（约 6k-10k），单台笔记本即可运行。
- **训练/优化目标**: 联合损失函数。包括：1）针对变化掩码的类别平衡二元交叉熵（BCE）损失；2）仅在变化物体上计算的残差 L2 回归损失；3）针对门控平均激活值的稀疏性惩罚项（用于权衡 precision 和 recall）。

**3. 实验结果**
- **实验设置**: 数据集为程序化生成的 MuJoCo 桌面推物基准（3-8个自由方块）。对比基线包括：Dense MLP（直接回归所有物体下一时刻绝对位姿的密集模型）、No-op（预测无变化的基线）以及 Parameter-matched dense（参数量匹配的密集模型）。
- **评价指标**: 预测精度（整体及变化/未变化物体的位姿 L2 误差）、变化检测（Precision, Recall, F1）、效率（参数量、FLOPs、延迟）、下游任务（基于 CEM 的规划器成功率与最终距离）。
- **主要结果**: 
  1. **预测与误差抑制**：Sparse 整体 L2 误差比 Dense 低 2.5–4.6 倍，参数量少 8.6–11.1 倍。但其优势完全来自于对静止物体的误差抑制（未变化物体 L2 降至接近 0），而在真正移动的物体上，预测精度仅与 No-op 基线持平。
  2. **变化检测**：Sparse 的 F1 达 0.80–0.87（Precision 0.92–0.97），而 Dense 模型发生退化。
  3. **Rollout 表现**：自回归 rollout 中，Sparse 误差累积远小于 Dense（好 3.4–6.4 倍），但整体误差仍高于 No-op。
  4. **泛化与样本效率**：门控网络在不同物体数量间零样本迁移（F1 保留 99.4%），且只需 25% 数据即可达到 90% 的满数据 F1。
  5. **下游规划**：加入接触感知特征后，Sparse 规划成功率达 0.23±0.06，显著优于 Dense（0.00），但未显著优于 Random（0.15）。

**0. 论文标题**
- **英文标题**: Spatially Aware World Action Model via Geometric Latent Diffusion
- **中文标题**: 基于几何潜在扩散的空间感知世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 SA-WAM，通过将深度图进行对数归一化后作为额外 latent frame 注入冻结的视频扩散模型，在不增加 3D 编码器的前提下实现了具备 3D 空间感知能力的联合世界与动作预测，显著提升了机器人操作策略的成功率。

**1. 整体逻辑**
- **研究任务**: 机器人策略学习（Robot policy learning），具体为基于世界动作模型（WAM）的联合未来观测与动作预测。
- **研究动机**: 现有的 WAM（如 Cosmos-Policy）仅依赖 RGB 观测，缺乏 3D 几何信息。而在操作密集型任务中，物体的几何形状和空间关系对策略至关重要，纯 RGB 输入在存在视觉干扰时容易失效。
- **本质改动**: 在预训练的 Latent Video Diffusion Model (DiT) 的潜在序列中直接注入深度信号（作为额外的 latent frames），并通过非线性（对数）归一化将无界深度映射到冻结 VAE 的输入域，免去了训练专用 3D 编码器的开销。
- **技术溯源**: 基于 Cosmos-Predict2（2B 参数的 DiT 视频模型）和 Wan2.1 时空 VAE tokenizer。

**2. 技术拆解**
- **核心方法**: 采用潜在帧注入策略（latent-frame injection）。将多视角的深度图通过相机特定的对数归一化（log-scale normalization）转换为 3 通道伪图像，输入冻结的 VAE 得到几何 latent frames。在 DiT 的输入序列中，RGB 和深度占据相邻的 latent-frame 位置，本体感觉（proprioception）和动作（action chunk）占据专用位置。模型在任务指令和当前观测的条件下，联合去噪动作 chunk 和未来的 RGB-D 观测。
- **关键细节**: 
  - **输入**：任务指令、当前本体感觉、多视角（腕部、左、右）当前 RGB-D 观测。
  - **输出/去噪目标**：动作 chunk（长度 H=32，实际执行前 16 步）及未来 RGB-D 观测。
  - **深度处理**：使用训练集深度的 2% 和 98% 分位数作为边界进行截断，然后进行对数归一化映射到 [-1, 1] 并复制为 3 通道，以保留近场操作精度同时兼顾远场。
  - **模型规模**：2B 参数的 DiT 骨干。
- **训练/优化目标**: 基于 EDM（Elucidating the Design Space of Diffusion-Based Generative Models）公式的扩散损失函数，联合监督动作、未来 RGB 和未来深度，无特定模态的独立损失。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：RoboCasa（24 个任务，每任务 50 个 demo）、LIBERO 和 LIBERO-Plus（在 7 种扰动下进行零样本评估）。
  - **真实世界平台**：UR5 机械臂 + RG6 夹爪 + Orbbec RGB-D 相机，10 个任务（每类 20 个 demo），在干净和随机化（加入干扰物和视觉扰动）环境下评估。
  - **Baselines**：仿真对比 $\pi_0$、Cosmos-Policy、UWM、GR00T 等；真机对比 $\pi_0$ 和 Cosmos-Policy。
- **评价指标**: 
  - **策略性能**：任务成功率（Success Rate, SR, %）。
  - **世界模型质量**：未来 RGB 预测的 PSNR、SSIM 和 LPIPS。
  - **真机性能**：任务完成得分（Task-completion score，按子目标完成度给部分分）。
- **主要结果**: 
  - **RoboCasa**：在仅用 50 demos/task 的情况下，SA-WAM 达到 76.6% 的平均 SR，比同等数据量的 Cosmos-Policy（67.1%）高出 9.5 个点。
  - **LIBERO-Plus**：达到 86.6% 的加权平均 SR，比强基线 $\pi_{0.5}$（84.6%）高 2.0 个点，比 Cosmos-Policy（81.4%）高 5.2 个点。
  - **真机 UR5**：在随机化环境下，SA-WAM 保持 77.5% 的完成得分，而 Cosmos-Policy 降至 48.8%，$\pi_0$ 降至 11.3%，证明深度信息在视觉混淆时提供了关键的空间线索。
  - **世界模型质量**：SA-WAM 的未来 RGB 预测在 PSNR、SSIM、LPIPS 上全面优于 Cosmos-Policy，且在腕部视角和机械臂/物体掩码区域（操作相关区域）提升最明显。
  - **分析结论**：基于深度预测计算的对象级 3D 误差与 rollout 成功率强相关（AUC ≈ 0.88），可作为 WAM 失败模式的定量诊断指标。

### 16. 🔥 [GIFT: Guided Intermediate Feature Training via Action-Oriented Structural Supervision for Robotic Manipulation] (GIFT：通过面向动作的结构化监督引导中间特征训练用于机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.04193` | [点击跳转](https://arxiv.org/abs/2609.04193)

**0. 论文标题**
- **英文标题**: GIFT: Guided Intermediate Feature Training via Action-Oriented Structural Supervision for Robotic Manipulation
- **中文标题**: GIFT：通过面向动作的结构化监督引导中间特征训练用于机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出GIFT框架，通过在训练时给VLA和WAM模型的中间视觉特征施加几何、可供性和目标区域三种结构化监督，在不改变动作生成接口的前提下，大幅提升机器人策略在分布偏移和高精度操作下的零样本鲁棒性。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型和世界-动作（WAM）模型在机器人操作任务中的泛化能力，特别是解决模型在视角、光照、布局等分布偏移（distribution shifts）下性能下降的问题。
- **研究动机**: 现有的VLA和WAM模型存在“动作充分性鸿沟（action-sufficiency gap）”：端到端的动作监督或视觉预测容易让模型学到背景纹理等捷径，导致中间特征虽然视觉丰富，但丢失了对控制至关重要的物理和任务结构（如3D几何、交互关系、目标区域）。
- **本质改动**: 不修改模型的动作生成接口，也不把辅助预测作为额外条件喂给动作头（采用no-injection设计），而是纯粹在训练阶段通过三种结构化损失来约束和塑造共享的中间视觉特征，强迫其保留控制所需的物理与任务结构。
- **技术溯源**: 基于现有的VLA架构（如StarVLA-OFT, Qwen3-VL）和WAM架构（如Fast-WAM的视频/动作扩散Transformer）；使用冻结的VGGT几何基础模型作为几何特征对齐的教师。

**2. 技术拆解**
- **核心方法**: 提出GIFT（Guided Intermediate Feature Training）框架，在策略的中间视觉token上附加三个辅助训练目标：1) 几何对齐（Geometry Alignment）；2) 可供性预测（Affordance Prediction）；3) 目标区域重建（Goal-region Reconstruction）。
- **关键细节**: 
  - **几何监督**：作用于浅层特征（如第6层），用冻结的VGGT提取特征，将其分解为方向和幅度，分别计算角度对齐和尺度对齐损失，让模型学习场景几何结构。
  - **可供性监督**：作用于深层特征，使用 learned queries 预测指令相关对象的20维交互目标（包含对象角色、相对位姿、末端执行器闭合状态），编码对象中心的交互配置。
  - **目标监督**：作用于深层特征，预测指令相关操作区域的二值掩码，提供图像空间的任务相关定位。
  - **非注入设计（No-injection）**：辅助预测头仅在训练时通过反向传播塑造中间特征，推理时直接丢弃，不改变动作头的输入，避免引入额外的推理开销和条件依赖。
- **训练/优化目标**: 总损失为原生动作/视频预测损失加上三个辅助损失（几何的角度+尺度损失、可供性的Smooth L1损失、目标的BCE+Dice损失）。

**3. 实验结果**
- **实验设置**: 
  - 仿真数据集：LIBERO（及包含7种分布偏移的LIBERO-Plus）、RoboCasa（包含关节物体任务）。
  - 真实世界平台：xArm7单臂和ARX X5双臂，包含4个操作任务。
  - 对比对象（baseline）：StarVLA-OFT, Fast-WAM, Fast-WAM-IDM等。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - 在LIBERO-Plus的7种零样本分布偏移下，GIFT-VLA、GIFT-WAM-Fast和GIFT-WAM-IDM分别达到79.6%、72.6%和87.8%，比对应baseline提升4.6、12.6和5.2个百分点。
  - 在RoboCasa上，三个变体分别达到61.4%、83.6%和82.3%，比baseline提升12.6、9.0和8.4个百分点，在关节物体（articulated-object）任务上优势尤为明显。
  - 真实世界中，面对光照、背景和物体位姿扰动，GIFT-WAM-IDM在双臂高精度插入任务中成功率达87.5%，远超baseline的52.5%。
  - 消融实验证明，三种监督信号互补；且“非注入（no-injection）”设计效果优于将辅助特征注入动作头，证明单纯塑造中间特征即可提升性能，无需依赖辅助预测作为额外动作条件。

### 17. 🔥 [Adaptive Vision-Language Grasping via Composable Foundation Priors and Generalizable Grasp Synthesis] (通过可组合基础先验与泛化抓取合成的自适应视觉-语言抓取)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.04096` | [点击跳转](https://arxiv.org/abs/2609.04096)

**0. 论文标题**
- **英文标题**: Adaptive Vision-Language Grasping via Composable Foundation Priors and Generalizable Grasp Synthesis
- **中文标题**: 通过可组合基础先验与泛化抓取合成的自适应视觉-语言抓取
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种将“任务理解”与“物理抓取”解耦的自适应抓取框架，通过基础模型先验动态构建结构化抓取接口，配合跨手型泛化的基础策略，实现了免重训底层策略的跨手型、多场景（杂乱/功能/动态）自适应抓取。

**1. 整体逻辑**
- **研究任务**: 复杂场景（杂乱、动态）及特定任务意图（功能性）下的自适应视觉-语言机器人抓取，且要求系统能无缝泛化到不同构型的机械手（如两指夹爪到五指灵巧手）。
- **研究动机**: 现有的视觉-语言抓取（VLG）方法多采用端到端架构，将基础模型与抓取策略紧耦合。这种设计导致策略性能严重受限于训练数据的覆盖度，且缺乏泛化能力——一旦更换任务意图或机械手构型，就必须重新收集数据并训练整个策略。
- **本质改动**: 摒弃端到端映射，将系统拆分为“任务理解”和“物理抓取”两个独立模块，中间通过一个“结构化抓取接口（包含物体几何、接触抓取表示CGR、抓取类型）”进行桥接。任务理解交给可插拔的基础模型先验去更新接口，物理抓取交给一个与手型无关的基础策略去执行。
- **技术溯源**: DINOv3（空间语义特征提取）、SAM3（实例分割与掩码跟踪）、Seed-1.8 (LLM) 结合 RAG 与 CoT（认知推理）、Contact-GraspNet（场景级接触原语预测）、PointTransformer（点云特征提取骨干）。

**2. 技术拆解**
- **核心方法**: 
  1. **结构化抓取接口与基础策略**：定义手型无关的接触抓取表示（CGR，包含接触点、接近/闭合方向、宽度等）和抓取类型。基础策略分两步：先通过显式运动学映射（查表法）将接口转为特定手型的候选位姿；再通过基于手-物交互（HOI）表示的决策模型评估力闭合稳定性，筛选最优位姿。
  2. **可组合的基础模型先验**：
     - *空间先验*：利用 DINOv3 提取多视图特征并 3D 化，结合 Contact-GraspNet 预测场景级 CGR，为杂乱场景提供无碰撞的接触约束。
     - *认知先验*：利用 LLM+RAG+CoT 推理目标物体、功能部件和抓取类型，结合 SAM3 进行 3D 视觉定位，为功能性抓取提供语义和几何约束。
     - *时间先验*：结合 SAM3 掩码跟踪与 DINOv3 跨帧特征一致性，通过优化估计目标 6DoF 位姿，实时更新抓取接口，实现动态抓取。
- **关键细节**: 
  - *HOI 表示*：提取手-物接触界面的点坐标和法向量，将复杂的力闭合条件抽象为紧凑的特征点云，作为跨手型稳定性评估的统一输入。
  - *运动学映射*：将抓取宽度离散化，离线求解各抓取类型下的关节配置并建立查找表，推理时直接查表计算，保证高效性。
  - *抓取决策模型*：基于 PointTransformer，引入 CAMP（Contact-Aware Max/Mean/Std Pooling）机制处理变长接触点，输出连续的稳定性得分。
- **训练/优化目标**: 
  - *抓取决策模型*：使用二元交叉熵（BCE）损失训练，预测抓取成功概率。训练数据来自 Isaac Sim 中 440 万次试错生成的合成数据（涵盖 DH3, Allegro, Inspire 三种手型）。
  - *时间先验位姿估计*：基于语义一致性优化目标，最小化初始语义描述符与当前帧隐式场查询特征的差异，通过梯度下降求解最优旋转和平移。

**3. 实验结果**
- **实验设置**: 
  - *数据集/Benchmark*：DexGraspNet 2.0（杂乱抓取）、GraspClutter6D 和 GraspNet-1Billion（功能抓取与动态抓取）。
  - *对比对象 (Baseline)*：AnyDexGrasp 及其变体 AnyDexGrasp*、D(R,O)-Grasp、AnyGrasp、BundleTrack、Target-referenced、MotionGrasp 等。
  - *硬件平台*：仿真使用 Isaac Sim / Isaac Gym；真机使用 KEENON XMAN-R1、TianJi Marvin、AgileX Piper，末端执行器包括 ROHand（灵巧手）和平行夹爪。
- **评价指标**: 
  - *杂乱抓取*：抓取成功率 (Success Rate)。
  - *功能抓取*：功能部件准确率、抓取类型准确率、抓取成功率。
  - *动态抓取*：多目标跟踪准确率 (MGTA)、平均平移误差、平均旋转误差。
- **主要结果**: 
  - *基础策略泛化性*：HOI 表示显著加速了网络收敛；联合三种手型数据训练的决策模型在 DH3/Allegro/Inspire 上分别达到 82.95%/88.02%/91.07% 的准确率，特征分布高度重合，验证了强跨手型泛化能力。
  - *杂乱抓取 (DexGraspNet 2.0)*：在 Random 和 Loose 划分上，三种手的平均成功率比 AnyDexGrasp 分别提升 3.0% 和 9.2%，展现出对复杂场景更好的适应性。
  - *功能抓取*：LLM+RAG+CoT 使功能部件和抓取类型推理准确率达到 94.0% 和 87.0%；在 GraspClutter6D 和 GraspNet-1Billion 上，平均抓取成功率比 AnyDexGrasp 提升 2.7% 和 2.5%，比 D(R,O)-Grasp 大幅提升 23.7% 和 27.1%。
  - *动态抓取 (GraspNet-1Billion)*：实现完美的跟踪关联准确率 (MGTA=1.0)，平移误差最低（如 Seen 划分下仅 0.22 cm），旋转误差具有竞争力。
  - *真机实验*：在静态杂乱场景下，102 个日常物品的 510 次抓取中，整体成功率达 83.3%；在动态传送带及 4 种人为干扰（如遮挡、快速移动）下，平均成功率达 89.7%，且支持 5 Hz 的在线抓取更新。

### 18. 🔥 [Toward Unified Robot Learning: Bridging Representation, Vision-Language-Action, and World Models] (迈向统一的机器人学习：桥接表示学习、视觉-语言-动作模型与世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.03927` | [点击跳转](https://arxiv.org/abs/2609.03927)

**0. 论文标题**
- **英文标题**: Toward Unified Robot Learning: Bridging Representation, Vision-Language-Action, and World Models
- **中文标题**: 迈向统一的机器人学习：桥接表示学习、视觉-语言-动作模型与世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 这是一篇机器人学习领域的综述，首次把表示学习、VLA模型和世界模型放到一个统一的框架里盘了一遍，重点讲这三块怎么拼起来以及现在拼不起来导致的痛点。

**1. 整体逻辑**
- **研究任务**: 梳理现代机器人学习的三大核心模块（环境表示、VLA动作生成、世界模型推理），建立统一的分类体系并分析它们的交互机制。
- **研究动机**: 以前大家搞表示学习、VLA和世界模型都是各玩各的，导致系统碎片化。机器人到了真实环境里，泛化差、长时序规划不行、遇到没见过的场景就抓瞎。而且现有的综述都只盯着一两个点，没人把这三者怎么交互、怎么统一起来讲清楚。
- **本质改动**: 提出了一个“理解（表示）-行动（VLA）-推理（世界模型）”三轴统一的分类框架（Taxonomy），不再孤立看单点技术，而是重点剖析这三者之间的耦合方式（比如World Action Models）以及缺乏耦合带来的瓶颈。
- **技术溯源**: 视觉-语言大模型（VLM）、Transformer、扩散模型（Diffusion）、流匹配（Flow Matching）、循环状态空间模型（RSSM，如Dreamer系列）等。

**2. 技术拆解**
- **核心方法**: 对三大模块进行了系统性拆解和分类。VLA分为端到端、带生成动作头（扩散/流匹配）、分层推理三类；世界模型分为语言条件、动作条件、世界动作模型（WAMs）和仿真引擎四类，并详细梳理了各架构的输入输出和耦合方式。
- **关键细节**: 
  - VLA：端到端直接出动作；生成动作头把感知和控制解耦，用扩散或流匹配来处理多模态动作分布（解决行为克隆的模式平均问题）；分层VLA加上了中间推理或子目标规划。
  - 世界模型：语言条件模型主要用来生成高保真视频做数据增强或高层规划；动作条件模型（如RSSM）在隐空间预测动力学用于策略优化；WAMs把动作生成和视频预测联合起来；仿真引擎直接拿来当神经仿真器跑RL或做安全过滤。
- **训练/优化目标**: 
  - VLA：主要是行为克隆损失，或者扩散/流匹配的生成损失。
  - 世界模型：隐状态重构损失（让解码器能还原观测）加上动力学对齐损失（用KL散度让预测的隐状态转移和真实转移对齐），或者视频生成的扩散/流匹配损失。

**3. 实验结果**
- **实验设置**: 本文是综述，没有提新模型跑常规对比。但在分析世界模型局限性时，作者用 CALVIN 数据集微调了 Stable Video Diffusion 做了一个小型的诊断实验（Diagnostic experiment）。
- **评价指标**: 通过定性评估（Qualitative evaluation）来检查视觉预测的物理合理性（比如是否保持物体恒常性、是否违反物理碰撞约束）。
- **主要结果**: 诊断实验证实了当前世界模型的根本缺陷：它们只是在学视觉序列的统计相关性，没学到因果结构。比如物体被挡住时，模型预测的未来帧不会保留被挡物体的信息（缺乏物体恒常性）；输入训练集里没见过的动作时，预测的视频会出现机械臂穿模等违反物理约束的现象。这说明现在的想象空间还不足以支撑可靠的策略学习。

### 19. 🔥 [WISE: World-model-guided Imagination Scheduling for Efficient Post-training of Vision-Language-Action Models] (WISE：面向视觉-语言-动作模型高效后训练的世界模型引导想象力调度)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.03681` | [点击跳转](https://arxiv.org/abs/2609.03681)

**0. 论文标题**
- **英文标题**: WISE: World-model-guided Imagination Scheduling for Efficient Post-training of Vision-Language-Action Models
- **中文标题**: WISE：面向视觉-语言-动作模型高效后训练的世界模型引导想象力调度
- **研究机构**: 原文未提及
- **一句话总结**: 提出WISE框架，通过轻量级调度器仅在机器人交互关键状态触发世界模型想象，并利用反事实轨迹的相对得分来优化VLA策略，在提升后训练效果的同时砍掉了约80%的世界模型计算开销。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的后训练（Post-training），即在不依赖昂贵专家演示或高风险真实世界试错的前提下，提升预训练VLA策略在特定操作任务中的表现。
- **研究动机**: 现有的世界模型引导方法虽然能通过“想象”未来来评估动作，但存在两个痛点：1）长程想象会累积预测误差，导致学习信号不可靠；2）并非所有执行阶段都需要想象（粗粒度运动预训练模型已经能搞定，只有在交互关键状态才需要 predictive reasoning），无差别的全局想象计算成本极高且收益递减。
- **本质改动**: 将世界模型的“想象”从全局均匀使用改为按需调度（只在交互关键状态触发），并将想象出的轨迹仅用于反事实评估（给候选动作打分算优势），而不直接作为合成数据去监督策略。
- **技术溯源**: 基于预训练VLA模型（$\pi_0$ 和 $\pi_{0.5}$），世界模型基于 Open-Sora 改编，视觉特征提取基于 DINOv2，策略优化借鉴了 GRPO（Group-Relative Policy Optimization）的相对优势思想。

**2. 技术拆解**
- **核心方法**: WISE框架包含四个协同模块：1）想象力调度（判断何时想象）；2）有界反事实想象（生成候选未来）；3）反事实轨迹评估（给候选未来打分）；4）基于真实上下文的策略优化（利用相对得分更新策略）。
- **关键细节**: 
  - **调度器**：使用冻结的 DINOv2 和轻量 MLP，通过弱监督（抓取/操作信号）训练，输出交互相关性得分，超过阈值才触发想象。
  - **世界模型**：基于 Open-Sora 改编的动作条件多视角（腕部+第三人称）视频预测模型。在触发状态采样 $M$ 个候选动作块，进行有限步数（$L$ 个 chunk，共 $LH$ 帧）的闭环展开（closed-loop rollout），限制误差累积。
  - **奖励模型**：同样基于 DINOv2，预测进度（progress）、置信度（confidence）和完成度（completion），综合计算轨迹奖励。
  - **优化机制**：每个候选动作想象两次取平均奖励。通过排名一致性等条件过滤后，计算相对优势。策略更新时，仅用真实上下文中的第一个动作块进行监督，想象出的轨迹纯粹用于算优势，不参与直接监督。
- **训练/优化目标**: 
  - **世界模型**：Rectified-flow 损失（仅对未来帧的 VAE 隐变量进行监督）。
  - **调度器**：加权二元交叉熵损失（基于执行信号的弱监督）。
  - **奖励模型**：排序损失（进度）+ 绝对进度损失 + 置信度交叉熵 + 完成度符号损失 + 增强一致性损失。
  - **策略优化**：基于相对优势的 Flow Matching 损失，加上参考策略的正则化损失（$\mathcal{L}_{ref}$）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：MimicGen 数据集的 5 个操作任务（Stack, Coffee, Square, Threading, Mug Cleanup）。
  - **真机**：Galaxea R1 Lite 机器人，4 个任务（Pick-and-Place, Two-Cube Stacking, Open, Open-and-Close）。
  - **Baselines**：针对 $\pi_0$ 对比了 GRPO, DSRL, DPO，以及基础 $\pi_0$ 和 $\pi_{0.5}$。
- **评价指标**: 任务成功率（Episode-level success rates），包括标准设置和泛化设置（改变高度、光照、干扰物、语言指令）下的成功率。
- **主要结果**: 
  - **仿真性能**：$\pi_0$ + WISE 平均成功率从 49.7% 提升至 59.5%（+9.8%），比最强的 DPO baseline 高 5.7%。$\pi_{0.5}$ + WISE 从 52.3% 提升至 60.2%（+7.9%）。
  - **计算效率**：相比全量想象（Full Imagination），WISE 减少了约 80% 的 GPU 计算时间（世界模型推理调用减少约80%），同时成功率反而更高（68.3% vs 60.4%），证明了“好钢用在刀刃上”。
  - **真机泛化**：$\pi_0$ + WISE 标准设置成功率提升 17.5%（60.0% -> 77.5%），泛化设置提升 26.3%（42.5% -> 68.8%）。$\pi_{0.5}$ + WISE 也有类似显著提升，证明世界模型引导的后训练能有效提升模型在分布偏移下的鲁棒性。

### 20. 🔥 [Scaling Bimanual Household Manipulation from 1,500 hours of Demonstrations to On-Policy Corrections] (从1500小时演示到在策略修正：扩展双臂家庭操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.03591` | [点击跳转](https://arxiv.org/abs/2609.03591)

**0. 论文标题**
- **英文标题**: Scaling Bimanual Household Manipulation from 1,500 hours of Demonstrations to On-Policy Corrections
- **中文标题**: 从1500小时演示到在策略修正：扩展双臂家庭操作
- **研究机构**: 原文未提及
- **一句话总结**: 发布了1500小时双臂家庭操作数据集并训练了5B参数的VLA模型XR-2，验证了离线专家数据与DAgger在策略修正数据在提升双臂操作成功率上的互补缩放规律。

**1. 整体逻辑**
- **研究任务**: 训练具备强泛化能力的双臂家庭操作通用策略（Generalist policies for robust bimanual manipulation），解决长时序、复杂交互的双臂协调控制问题。
- **研究动机**: 高质量大规模人类演示数据稀缺限制了双臂策略的学习；同时，单纯增加离线专家数据会遇到分布外（OOD）状态导致的性能瓶颈，需要研究专家数据与部署时修正数据（on-policy corrections）如何互补以突破性能上限。
- **本质改动**: 构建了包含遥操作和UMI的大规模混合数据集，提出在专家数据预训练后，引入基于DAgger的在策略修正数据进行后训练，并通过动态预算分配机制解决技能遗忘和长尾失败问题。
- **技术溯源**: 视觉语言基座采用 Qwen3-VL-4B-Instruct；动作生成采用基于 Flow Matching 的扩散 Transformer；数据收集与后训练借鉴了 UMI (Universal Manipulation Interface) 和 DAgger (Dataset Aggregation) 框架。

**2. 技术拆解**
- **核心方法**: 
  1. 构建大规模双臂操作数据集（531.7小时真机遥操作 + 1000小时UMI数据），包含细粒度子任务语言标注。
  2. 设计XR-2模型架构，采用VLM+动作扩散Transformer的Mixture-of-Transformer结构。
  3. 提出两阶段训练范式：Stage 1 在专家数据上用条件流匹配（CFM）训练；Stage 2 收集DAgger在策略修正数据，按轨迹1:1混合，并根据子任务成功率动态分配修正数据预算进行后训练。
- **关键细节**: 
  - **硬件与数据**：X2W移动双臂机器人（25自由度，89维本体状态，25维控制），配备头部和腕部相机。UMI数据采用纯视觉、无编码器设计，支持超长时间连续采集。
  - **模型结构**：XR-2 共 5B 参数。动作专家为 18 层 Transformer（hidden dim 1024，8个注意力头，采用GQA机制含4个KV头），通过深度对齐的交叉注意力与VLM特征交互。支持 action prefix conditioning 实现异步推理，生成 50x25 的 action chunk。
  - **数据分配策略**：DAgger数据与专家数据按轨迹数1:1混合（保持技能分布）；根据子任务成功率 $s_i$ 动态计算分配权重 $w_i$，将更多修正数据倾斜给成功率低的子任务，同时设置最小权重 $w_{min}=0.05$ 防止强技能遗忘。
- **训练/优化目标**: 
  - Stage 1 优化目标为条件流匹配（Conditional Flow Matching, CFM）损失，预测目标流 $(a - \epsilon)$。
  - Stage 2 沿用 CFM 损失，但在混合了专家数据和 DAgger 修正数据的数据集上进行后训练，对齐策略自身的状态分布。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 1500 小时双臂家庭操作数据集（包含真机遥操作和 UMI 数据）。
  - **对比/消融设置**：研究专家数据量缩放（10h 到 160h）以及 DAgger 修正数据轮次缩放（1到3轮）。未引入外部开源baseline模型对比。
  - **测试环境**：RTX 4090 推理（10Hz），底层 1000Hz 全身运动控制。测试包含材质、颜色、初始位置等泛化条件。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **专家数据缩放**：在叠衣服任务中，成功率随专家数据增加从 30小时的 34% 提升至 120小时的 84%，但在 160小时时降至 82%，表明纯专家数据存在饱和点，无法覆盖测试时的OOD失败状态。
  - **DAgger 缩放**：从 58% 成功率的 checkpoint 开始，经过 3 轮 DAgger 后训练，成功率分别提升至 74%、82% 和 93%（相比纯专家基线提升35个点），证明在策略修正数据能有效突破专家数据的性能瓶颈，两者呈现互补的缩放特性。

### 21. 🔥 [Sensing Which Modality Matters: Evidence-Gated Regularization for Robust VLA Policies] (感知哪种模态重要：用于鲁棒VLA策略的证据门控正则化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.03142` | [点击跳转](https://arxiv.org/abs/2609.03142)

**0. 论文标题**
- **英文标题**: Sensing Which Modality Matters: Evidence-Gated Regularization for Robust VLA Policies
- **中文标题**: 感知哪种模态重要：用于鲁棒VLA策略的证据门控正则化
- **研究机构**: 原文未提及
- **一句话总结**: 提出证据门控正则化（EGR）训练目标，利用任务先验结构计算传感器相关性，动态引导VLA模型忽略无用模态并依赖关键模态，解决多传感器融合时的“模态纠缠”问题，提升鲁棒性且零推理开销。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）策略在多传感器输入下的鲁棒性，解决因训练数据有限和同质化导致的“模态纠缠”（modality entanglement）问题。
- **研究动机**: 现有的VLA策略在早期融合多模态数据时容易陷入“捷径学习”，学到虚假的跨模态相关性。这导致两种状态依赖的失败模式：1) 烦恼敏感性（nuisance sensitivity）：对当前任务无用的传感器受到干扰时，策略会崩溃；2) 单模态不充分（single-modality insufficiency）：当多个传感器都有用但仅有一个未被破坏时，策略无法退回到该单一有效传感器上继续工作。现有的随机模态丢弃或端到端注意力机制无法显式地基于任务结构进行状态依赖的模态选择。
- **本质改动**: 摒弃了让模型端到端学习模态权重或随机丢弃模态的做法，转而利用任务先验（如可见的目标几何或接触特征）为每个传感器计算“证据分数”（evidence score），并以此作为软归纳偏置，在训练时门控两个一致性正则化目标（低证据时要求不变性，高证据时要求单模态充分性）。
- **技术溯源**: 基于 $\pi_{0.5}$ (pi-0.5) 策略（基于 flow-matching 的 VLA 模型），使用 BEHAVIOR-1K 仿真环境；视觉骨干网络为 PaliGemma (gemma_2b)，动作专家为 gemma_300m（均使用 LoRA 微调）。

**2. 技术拆解**
- **核心方法**: 证据门控正则化（Evidence-Gated Regularization, EGR）。分为两步：1) 计算证据分数：根据任务结构评估每个传感器在当前帧的任务相关性（视觉看目标物体像素面积，触觉看接触状态或特征匹配）；2) 门控正则化：根据分数高低，分别施加“不变性损失”（让模型对低证据传感器的扰动不敏感）和“充分性损失”（让模型在只有高证据传感器时也能输出与全模态一致的正确动作）。
- **关键细节**: 
  - 输入输出：输入为多传感器观测（如多个RGB相机、GelSight触觉传感器），输出为动作分布。
  - 证据计算：视觉证据通过 focal object（操作对象）和 interaction object（交互对象）的像素面积比例计算，需依赖实例分割（如 Grounding DINO v2 + SAM2）；触觉证据在稀疏接触下为二值接触指示，在丰富接触下为与参考特征的相似度。
  - 关键超参：门控阈值 $\tau_{low}=0.2$, $\tau_{high}=0.5$；损失权重 $\lambda_{inv}=0.2$, $\lambda_{suff}=0.1$。
  - 优化技巧：使用重要性采样（Importance Sampling），将每个样本计算正则化损失所需的额外前向传播次数从 $2|\mathcal{M}|$ 降低到固定的 2 次，大幅降低训练开销。
- **训练/优化目标**: 总损失为 $\mathcal{L} = \mathcal{L}_{flow} + \lambda_{inv}\mathcal{L}_{inv} + \lambda_{suff}\mathcal{L}_{suff}$。其中 $\mathcal{L}_{flow}$ 是基础的 flow-matching 模仿学习损失；$\mathcal{L}_{inv}$ 是低证据模态的不变性损失（约束受扰动后的动作与干净动作的MSE）；$\mathcal{L}_{suff}$ 是高证据模态的充分性损失（约束仅保留该模态时的动作与全模态动作的MSE）。推理时这些正则化项被移除，无额外开销。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：基于 BEHAVIOR-1K 构建的包含 47 个 rollout 技能（11个导航+36个操作）的基准测试，包含推理诊断（Suite 1）和 rollout 评估（Suite 2）。
  - 对比对象（baseline）：vanilla $\pi_{0.5}$（原版），ModDrop（在 $\pi_{0.5}$ 训练中加入随机模态 token 替换/dropout）。
  - 真实机器人测试：双臂平台（2个Kinova臂+3个RGB相机）和 视觉-触觉平台（1个MELFA ASSISTA臂+1个RGB相机+2个GelSight触觉传感器）。
- **评价指标**: 
  - Suite 1 (推理): $\Delta$（受扰动输入相对于全模态输入的每帧动作MSE增加量）。
  - Suite 2 (Rollout): 任务成功率 (SR)，末端执行器接触率 (EC)，末端到目标的最小距离 (Dist)。
- **主要结果**: 
  - 仿真环境 (MAN操作任务)：EGR将全模态SR从12.5%提升至16.4% (+31%)；无用传感器受损(NoUseless)时SR从9.4%提升至16.5% (+75%)；仅保留单一有用传感器(UsefulOnly)时SR从2.8%提升至6.1% (+120%)。
  - 仿真环境 (NAV导航任务)：SingleUseful条件下的SR从15.5%大幅提升至37.3% (+141%)。
  - 真实机器人 (双臂视觉平台)：在物理干扰物(RealDistractor)条件下，SR从30%大幅提升至85% (+183%)。
  - 真实机器人 (视觉-触觉平台)：在物理干扰物条件下，SR从55%提升至70% (+27%)；SingleUseful条件下从40%提升至90% (+125%)。
  - 结论：EGR有效缓解了模态纠缠，显著提升了模型在传感器受损或存在物理干扰时的鲁棒性，且没有牺牲干净输入下的基础性能。

### 22. 🔥 [Towards Neuro-Symbolic Procedural Reasoning for Long-Horizon Vision-Language-Action Manipulation] (面向长视野视觉-语言-动作操作的神经符号过程推理)
- **研究机构**: `Fraunhofer`
- **Arxiv ID**: `2609.05369` | [点击跳转](https://arxiv.org/abs/2609.05369)

**0. 论文标题**
- **英文标题**: Towards Neuro-Symbolic Procedural Reasoning for Long-Horizon Vision-Language-Action Manipulation
- **中文标题**: 面向长视野视觉-语言-动作操作的神经符号过程推理
- **研究机构**: Fraunhofer
- **一句话总结**: 提出了一种结合显式任务图、事件记忆与稀疏视觉显著性引导的神经符号框架，解决了现有VLA模型在长视野机器人操作中缺乏状态追踪、依赖推理和可靠空间接地的问题。

**1. 整体逻辑**
- **研究任务**: 解决长视野（long-horizon）机器人操作任务中的持久状态追踪、动作依赖推理、条件分支决策以及可靠的空间目标接地（grounding）问题。
- **研究动机**: 现有的VLA模型（如OpenVLA, $\pi_{0.5}$）能执行短视野操作，但在长视野程序性任务中表现脆弱。它们难以维持持久的任务状态、处理动作依赖和条件分支，且在空间目标接地上容易失败。
- **本质改动**: 跳出纯数据驱动的端到端VLA范式，引入显式的符号结构（任务图和事件记忆）来约束高层决策与状态验证，并结合人类演示衍生的稀疏过程显著性（伪注视）来指导底层VLA的空间接地。
- **技术溯源**: 基于 $\pi_{0.5}$（VLA基座模型）和 DINOv2（用于提取时序特征和密集空间对应关系以进行显著性转移）。

**2. 技术拆解**
- **核心方法**: 
  1. **任务图与事件记忆**：构建有向任务图编码动作依赖、前置/后置条件和执行者角色（机器人/人类）；使用只追加的事件记忆记录决策、状态转换和视觉证据，形成“观察-接地-记忆-选择-执行-验证”的闭环。
  2. **稀疏过程显著性引导**：在遥操作视频的基础相机视角中注释“伪注视”点（代表过程相关性），通过DINOv2和光流进行稳定与转移。提供两种VLA引导接口：一是作为输入（在RGB图像上叠加视觉提示环），二是作为监督（在微调时通过KL散度对齐动作条件注意力分布）。
- **关键细节**: 
  - 任务图节点包含指令、执行者角色、视觉可检查条件及状态。
  - 感知采用固定基座相机（全局视角）和腕部相机（局部视角）的双视角输入。
  - 显著性引导的正则化损失为动作损失加上注意力分布与伪注视目标分布的KL散度。推理时，正则化模型使用无提示的干净图像。
- **训练/优化目标**: 
  - 底层VLA微调时，若使用正则化方法，优化目标为动作预测损失与注意力正则化损失（KL散度）之和；若使用视觉提示方法，则直接在带提示的RGB输入上计算动作损失。高层任务图通过前置条件验证和状态更新来驱动子目标分发，无额外可学习参数。

**3. 实验结果**
- **实验设置**: 
  - 数据集：231个七步手术器械处理过程的遥操作episode（包含固定基座和腕部相机视角）。
  - 对比对象（baseline）：微调后的 $\pi_{0.5}$ 模型（无视觉提示，prompt-finetuned），带视觉提示的同一模型（+ Visual-prompting），以及使用注意力正则化微调的模型（Regularization，推理时无提示）。
  - 测试环境：真实机器人（Real-robot）环境，每个子目标在每种条件下进行5次试验（共75次试验）。
- **评价指标**: 容器路由得分（Container scores，评估空间模糊情况下的目标选择）、目标文本得分（Destination text）、整体得分（All）。
- **主要结果**: 
  - 两种引导方法（Visual-prompting 和 Regularization）在所有试验中均成功完成任务（25/25 和 10/10）。
  - 未加引导的 baseline 在空间模糊的容器路由任务中成功率降至 5/10，失败原因均为错误目标放置。
  - 两种引导方法在行为表现上打平，但机制不同：视觉提示在推理时提供显式的RGB空间线索，而正则化方法将监督内部化，在干净图像推理时展现出与任务相关区域对齐的注意力热力图。

### 24. 🔥 [TacPAC: Tactile Prediction and Real-Time Action Correction in World-Action Models for Contact-Rich Manipulation] (TacPAC：接触丰富操作世界-动作模型中的触觉预测与实时动作校正)
- **研究机构**: `原文未提及（代码仓库显示为 Logos Robotics Group）`
- **Arxiv ID**: `2609.05266` | [点击跳转](https://arxiv.org/abs/2609.05266)

**0. 论文标题**
- **英文标题**: TacPAC: Tactile Prediction and Real-Time Action Correction in World-Action Models for Contact-Rich Manipulation
- **中文标题**: TacPAC：接触丰富操作世界-动作模型中的触觉预测与实时动作校正
- **研究机构**: 原文未提及（代码仓库显示为 Logos Robotics Group）
- **一句话总结**: 提出 TacPAC，通过缓存世界-动作模型预期的触觉接触状态，并在执行期用触觉专家对比当前反馈进行实时动作增量校正，解决了触觉反馈时序不匹配的问题，大幅提升了接触丰富操作的成功率。

**1. 整体逻辑**
- **研究任务**: 接触丰富操作（Contact-rich manipulation），如精密插入、易碎物抓取等，要求机器人根据物理交互（局部接触和形变）实时调整动作。
- **研究动机**: 现有的视觉中心世界-动作模型（WAMs）忽略了决定接触丰富操作的局部接触线索。虽然 naive 地让模型预测未来触觉观测能提升效果，但只恢复了约三分之一的增益。根本原因是时序不匹配（timing mismatch）：预测发生在动作块（action chunk）规划时（执行前），而关键的触觉反馈发生在执行中，导致规划好的动作无法被修正。
- **本质改动**: 将触觉预测从“生成未来观测”转变为“执行期的实时动作校正”。不再单纯依赖预测的触觉图像，而是将规划动作时预期的触觉接触状态缓存下来，让触觉专家在执行时对比“当前触觉反馈”与“预期触觉”，输出动作增量（delta action）来修正未执行的步骤。
- **技术溯源**: 基于世界-动作模型（WAMs），具体架构最接近 LingBot-VA（使用 Mixture-of-Transformers 耦合视觉和动作 token），底层生成框架采用条件流匹配（Conditional Flow Matching）。

**2. 技术拆解**
- **核心方法**: TacPAC 采用三专家 Mixture-of-Transformers (MoT) 架构：视频专家预测未来视觉和触觉，动作专家基于预测生成动作块，触觉专家负责实时校正。基模型规划出动作块后，系统缓存其预期的触觉和动作 KV 状态。执行期间，触觉专家读取新到的触觉图像与缓存进行注意力计算，输出未执行步骤的动作增量。
- **关键细节**: 
  - **输入输出**：输入为任务指令、当前视觉、本体感觉、触觉图像；输出为动作块（7维关节命令+1维夹爪命令）及未来视觉/触觉观测。
  - **模型结构**：三个专家共享 30 层 Transformer 深度和相同的注意力几何结构（24头，维度128），确保触觉专家能直接消费基模型的逐层 KV cache。
  - **规模与超参**：动作块 horizon $H=48$（控制频率 30Hz，跨度 1.6s）。视觉分辨率 256×256，触觉 128×128。
- **训练/优化目标**: 
  - **Stage 1（基模型）**：训练视频和动作专家。使用条件流匹配，损失函数为视频（含视觉和触觉）和动作流匹配损失的加权和。
  - **Stage 2（触觉专家）**：冻结基模型，仅训练触觉专家。在基模型自己生成的规划（而非 ground-truth）上进行训练，随机采样执行偏移量 $m$，监督未执行部分的动作残差（即 预测动作+增量 与 真实动作 的 MSE），迫使专家学会输出修正量。

**3. 实验结果**
- **实验设置**: 
  - **测试环境**：5个真实机器人接触丰富任务（充电器插头插入、多目标水果转移、易碎薯片转移、空瓶直立、扩展卡插入）。硬件为 Flexiv Rizon 4 机械臂，配 InTac S1 触觉传感器和 RealSense 相机。
  - **对比对象（baseline）**：通用 VLA ($\pi_{0.5}$)、动作分块模仿 (ACT)、视触觉策略 (VITaL)、世界-动作模型 (LingBot-VA)、触觉世界-动作模型 (Dream-Tac, T-Rex)。
- **评价指标**: 每个任务 20 次真实世界试验的 episode 成功率（Success rate）。
- **主要结果**: 
  - **整体性能**：TacPAC 在所有 5 个任务上取得最高成功率，平均成功率从纯视觉基模型的 22% 提升至 64%，比最强 baseline T-Rex (48%) 高 16 个百分点。
  - **消融实验**：仅做触觉预测（37%）或仅做反应式校正（33%）效果相近且有限；必须结合缓存的预期触觉（47% -> 64%），证明“带着预期去校正”是核心收益来源。
  - **推理效率**：单次触觉校正耗时仅 30.4 ms（32.9 Hz），比重新生成动作块快 20.7 倍，满足高频实时校正需求，且未观察到动作抖动。

### 25. 🔥 [One Word, Different Action: A Real-Robot Benchmark for Language-Conditioned Embodied Reasoning] (一个词，不同动作：面向语言条件具身推理的真实机器人基准)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.05260` | [点击跳转](https://arxiv.org/abs/2609.05260)

**0. 论文标题**
- **英文标题**: One Word, Different Action: A Real-Robot Benchmark for Language-Conditioned Embodied Reasoning
- **中文标题**: 一个词，不同动作：面向语言条件具身推理的真实机器人基准
- **研究机构**: 原文未提及
- **一句话总结**: 构建了一个固定物理状态和动作空间的真实机器人评测基准，专门测试大模型在自然语言指令微调时，能否准确区分“任务不变需保持动作”和“任务改变需更新动作”。

**1. 整体逻辑**
- **研究任务**: 评测语言条件具身推理系统（如多模态大模型、VLA）在指令变化时的动作决策稳定性与敏感性。
- **研究动机**: 现有的具身评测多关注最终任务成功率，缺乏对“指令变化如何影响单一物理状态下的动作决策”的细粒度诊断。当用户换种说法（任务不变）或修改条件（任务改变）时，机器人需要分别保持或更新动作，现有基准没有将这两种能力解耦并控制物理变量进行评测。
- **本质改动**: 摒弃了传统的“不同任务测不同模型”范式，转而固定物理决策状态和可执行动作空间，通过构造“任务保持”和“任务改变”的指令对（反事实对），直接评测模型对指令语义变化的选择性响应能力。
- **技术溯源**: 借鉴了 RoboBench、VLABench、ManipBench 等具身评测思路，结合了 CxMP（受控语言变量）和 LIMP（可验证约束）的设计理念。评测的基座模型包括 Qwen3.5-27B、GLM-5-FP8 和 Gemma4-31B。

**2. 技术拆解**
- **核心方法**: 构建“物理决策锚点（Physical Decision Anchors）”和“受控任务族（Controlled Task Families）”。每个锚点固定真实的物理状态和候选动作空间，在此基础上生成任务保持（改写指令但正确动作不变）和任务改变（修改约束导致正确动作改变）的指令对。
- **关键细节**: 
  - **规模**: 85个物理决策锚点（21个对象中心，64个动作序列中心），988个完整任务族，3952个单约束任务实例，以及84个多约束实例。
  - **输入输出**: 输入为结构化物理状态（或真实RGB图像）+ 候选动作元数据 + 自然语言指令；输出为严格机器可读的确定性动作决策（如目标对象、动作集合或有序动作序列）。
  - **任务分类**: 单约束推理（动作抑制、集合约束、基数约束、时序约束）和多约束推理（同时满足多个条件，如基数+抑制）。
- **训练/优化目标**: 本文为评测基准，无训练过程。核心评价机制是“精确动作决策准确率（Exact Action-Decision Accuracy）”以及基于任务族的成对决策指标（Pair Success, Decision Invariance, Decision Sensitivity, Over-Invariance, Over-Sensitivity），要求模型输出与确定性 Ground Truth 完全一致。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 自建的 One Word, Different Action 基准。
  - **对比对象**: Qwen3.5-27B、GLM-5-FP8、Gemma4-31B。设置了文本接地（Text-grounded）和视觉接地（Real-RGB）两种输入条件。控制实验包括符号执行器（Oracle）、多数类基线、随机有效基线以及关键信息掩码（Operator-masked）。
- **评价指标**: 精确动作决策准确率（Exact）、成对成功率（Pair Success）、决策不变性（Invariance）、决策敏感性（Sensitivity）、过度不变性（Over-Invariance）、过度敏感性（Over-Sensitivity）和解析成功率（Parse Success）。
- **主要结果**: 
  - **单约束推理接近饱和**: 主流模型在单约束指令变化下表现极好（如 Gemma4-31B 达到 100%），能准确区分任务是否改变，Over-Invariance 和 Over-Sensitivity 极低。
  - **多约束推理存在短板**: 当需要同时满足多个约束时，Qwen3.5-27B 和 GLM-5-FP8 出现明显性能下降（GLM-5-FP8 的 Sensitivity 下降达 13.1%），而 Gemma4-31B 保持稳定。
  - **视觉接地影响不大**: 将结构化状态替换为真实 RGB 图像，模型性能未出现显著下降（Delta 均在 1.1% 以内）。
  - **核心结论**: 当前大模型识别单一指令变化的能力已接近饱和，真正的挑战在于将多个语言约束可靠地组合并映射到单一的机器人动作决策中。

- **一句话总结**: 提出了一套针对大型VLA模型的真实世界在线RL框架，通过非对称协同自举算法解决价值估计偏差导致的策略漂移，并设计了专用的状态生命周期管理系统将大模型在线RL吞吐量提升10.9倍，在9个高精度化学操作任务上达到98.3%的平均成功率。

- **研究任务**: 大型视觉-语言-动作（VLA）模型在真实世界物理交互中的在线强化学习（Online RL）后训练，聚焦于高精度、可重复的机器人操作任务。
- **研究动机**: 1) 算法上，真实世界在线RL中不可靠的价值（value）信号会导致策略漂移，现有方法仅靠行为克隆约束无法有效校准价值估计；2) 系统上，大型VLA模型计算开销大，传统的重放（replay）密集型优化导致训练吞吐量极低，新经验无法及时反馈到部署策略中。
- **本质改动**: 算法上，用“非对称协同自举”在快时间尺度用人类干预快速提升策略，慢时间尺度渐进校准价值，用相对优势代替绝对Q值最大化来防漂移；系统上，提出ACoB-Stream架构，通过解耦不变状态和按需流式传输，解决大模型前向计算冗余、KV Cache存储/访问慢、全模型同步延迟等系统瓶颈。
- **技术溯源**: 基于预训练的流匹配（flow-based）大型VLA模型（如 $\pi_0$ 和 $\pi_{0.5}$），采用 OpenPI 动作空间归一化，使用 LoRA 微调动作专家（Action Expert）。

**2. 技术拆解**
- **核心方法**: 
  1. **ACoB算法**：包含渐进式价值校准（全局TD回报传播 + 局部状态匹配偏好排序）和相对优势策略改进（结合Flow-Matching行为克隆和冻结参考正则化）。
  2. **ACoB-Stream系统**：四阶段闭环架构，管理经验和策略状态的生命周期（经验上下文形成、持久化、访问、策略状态同步）。
- **关键细节**: 
  - **模型结构**：冻结多模态前缀参数，仅用LoRA微调动作专家。Critic采用集成（Ensemble）结构，将Q值分解为Value和Advantage。
  - **系统架构**：
    - *形成*：复用Actor推理时生成的冻结前缀KV Cache，去除无效位置，避免重复计算。
    - *持久化*：上下文去重，采用磁盘支持+滑动窗口采样（利用Linux page-cache），避免内存溢出。
    - *访问*：目标对齐检索（Value更新只取后继上下文，Actor更新取当前上下文），后台CPU按需预取。
    - *同步*：Actor端只接收并合并可训练的LoRA参数，跳过全模型序列化与传输。
- **训练/优化目标**: 
  - **Critic目标**：全局TD损失（传播长视野回报） + 局部偏好排序损失（强制人类纠正动作的Advantage高于原提议动作，解决局部信用分配模糊）。
  - **Actor目标**：Flow-Matching行为克隆损失（快速吸收成功/纠正经验） + 相对优势软边界损失（用相对优势代替绝对Q值最大化，抑制漂移） + 参考正则化损失（约束动作坐标不偏离冻结的Stage-I参考策略）。

**3. 实验结果**
- **实验设置**: 
  - **任务与硬件**：9个高精度化学实验室操作任务（分接触丰富、轻微、无接触、双臂4类），在4种硬件平台（UR5e+平行夹爪/灵巧手、双臂UR5e、Franka+平行夹爪）上测试。
  - **Baseline**：真实世界RL方法（HIL-SERL, ConRFT, Robo-Dopamine），大型VLA基线（$\pi_0$, $\pi_{0.5}$ 仅做SFT）。系统对比了去除KV Cache复用、全随机磁盘采样、朴素上下文访问、动态CPU RAM等变体。
- **评价指标**: 
  - **算法**：平均成功率、平均Episode时间、自主成功率、干预率。
  - **系统**：更新吞吐量（CTA cycles/s）、平均CTA（Critic-to-Actor）周期延迟。
- **主要结果**: 
  - **算法表现**：VLA-Precision在9个任务上平均训练45.8分钟，达到98.3%的平均成功率（7个任务100%，最差90%），平均episode时间27.6秒。相比最强RL baseline (Robo-Dopamine, 10%成功率) 和 纯SFT大模型 ($\pi_{0.5}$, 67.8%成功率) 有巨大提升。执行速度比 $\pi_0$ 和 RL baselines 分别快 1.2× 和 1.8×。
  - **系统表现**：ACoB-Stream 在150分钟内完成15666个CTA周期，吞吐量达1.74 CTA/s。相比无KV Cache复用（No KV Cache），吞吐量提升10.9倍，延迟降低90.9%；相比全随机磁盘采样，吞吐量提升1.53倍。

### 27. 🔥 [TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model] (TANGO：基于全身视觉-语言-动作模型的杂乱环境人形机器人导航)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.09158` | [点击跳转](https://arxiv.org/abs/2609.09158)

**0. 论文标题**
- **英文标题**: TANGO: Humanoid Navigation in Cluttered Environments with a Whole-Body Vision-Language-Action Model
- **中文标题**: TANGO：基于全身视觉-语言-动作模型的杂乱环境人形机器人导航
- **研究机构**: 原文未提及
- **一句话总结**: 提出首个直接预测29自由度全身关节动作的VLA框架TANGO，通过自动化数据管线和端到端训练，实现人形机器人在杂乱室内环境中的语言指令引导与全身协调避障导航。

**1. 整体逻辑**
- **研究任务**: 根据自然语言指令和第一人称RGB视觉，控制人形机器人在杂乱的3D室内环境中进行无碰撞的全身导航。
- **研究动机**: 现有的视觉语言导航（VLN）方法多将导航视为2D路径规划，忽略了人形机器人高维关节体在3D空间中的几何约束（如手臂、躯干避障）；而现有的全身VLA系统多采用解耦设计（高层发速度指令，底层执行），无法在导航决策时显式推理全身的可通行性（traversability）。
- **本质改动**: 摒弃传统的2D轨迹或高层速度指令输出，直接让VLA模型端到端预测29自由度的全身关节空间动作（29-DoF joint-space actions），将高层语义导航与底层全身物理可行性统一在一个模型中。
- **技术溯源**: 视觉语言骨干基于 Qwen2.5VL-7B（用 InternVLA-N1 权重初始化）；动作专家基于 Flow-matching 的多模态扩散 Transformer (MM-DiT)；底层执行器采用现成的 SONIC 全身动作跟踪器。

**2. 技术拆解**
- **核心方法**: 
  1. 提出 Plan-Edit-Track (PET) 自动化数据生成管线，合成大规模无碰撞的全身避障轨迹。
  2. 构建三系统架构的 TANGO 模型：System-2 处理多模态感知，System-1 预测全身动作块，System-0 负责高频物理执行。
- **关键细节**: 
  - **PET数据管线**：Plan阶段用A*规划2D路径，在窄通道加入90度侧身行走（crab-walking）逻辑，用SONIC生成基础步态；Edit阶段通过全身逆运动学(IK)和势场伪力，编辑出跨越、侧身、下蹲等避障动作；Track阶段用SONIC过滤动力学不可行的轨迹，并用编辑后的参考动作（而非跟踪后的动作）作为监督信号，以保留人类动作的自然性。
  - **模型输入输出**：输入为前后/向下相机的RGB图像序列、本体感觉和语言指令；输出为包含29个关节角和基座6D旋转的未来动作块（Action Chunk）。
  - **视觉处理**：使用 BATS (Budget-Aware Token Sampling) 和 GridPool 处理长时序视频历史，平衡显存占用与近期观测的分辨率。
  - **动作表示与推理**：引入相对偏航角和平面位移增量来稳定训练；采用训练时实时分块（RTC）技术，让模型在训练时适应在线流式推理的随机前缀。
- **训练/优化目标**: 联合优化目标。System-2 附加文本解码分支进行 VideoQA 任务（交叉熵损失 $\mathcal{L}_{CE}$），System-1 进行 Flow-matching 动作生成（Flow-matching损失 $\mathcal{L}_{FM}$）。总损失 $\mathcal{L} = \mathcal{L}_{CE} + 20 \cdot \mathcal{L}_{FM}$。同时对罕见全身动作（如大转弯、下蹲、跨越）进行数据上采样和逐维度损失加权。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: VLNVerse benchmark，以及作者增强的包含各类障碍物的 VLNVerse 和 SAGE-3D 场景（共 64,633 条轨迹）。
  - **对比对象 (Baselines)**: 离散/连续动作模型 (CMA, Seq2Seq, RDP, HNR)，SOTA VLA模型 (InternVLA-N1, Uni-NaVid)，以及模块化全身导航基线 (InternVLA-N1 + Unitree WBC / HumanoidPF)。
  - **测试环境**: IsaacSim/MuJoCo 仿真环境，以及 Unitree G1 人形机器人真机环境。
- **评价指标**: Success Rate (SR), Success weighted by Path Length (SPL), Navigation Error (NE), Oracle Success Rate (OSR), Collision Rate (CR)。
- **主要结果**: 
  - **VLN性能**: 在 VLNVerse 上，TANGO 取得最高 SR (52.89%) 和最低 NE (3.72)，SPL (40.18) 和 OSR (71.07) 与 SOTA RDP 相当，且在具有物理约束的设置下表现最优。
  - **杂乱环境穿越**: 在增强场景仿真中，TANGO 的 SR 最高 (43.75%)，CR 最低 (9.90%)，显著优于 InternVLA-N1 + HumanoidPF (SR 41.88%, CR 15.81%)，且仅依赖纯 RGB 输入（对比基线使用了 LiDAR）。
  - **真机部署**: Zero-shot 部署到 Unitree G1。在短/长 2D 导航和 3D 杂乱障碍物场景中，成功率最高且碰撞最少，成功展示了侧身过窄道、下蹲避顶障、跨越地障等全身协调能力。
  - **消融实验**: 证实了全身动作预测（对比 2D 变体）、RTC 机制（去掉后 SR 暴跌至 10.94%）以及动作编辑（Motion Editing）的关键作用。

### 28. 🔥 [DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination] (DeCAL：通过接触感知潜在联合想象迈向物理接地的灵巧视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.09119` | [点击跳转](https://arxiv.org/abs/2609.09119)

**0. 论文标题**
- **英文标题**: DeCAL: Towards Physically-Grounded Dexterous Vision-Language-Action Models via Contact-Aware Latent Co-Imagination
- **中文标题**: DeCAL：通过接触感知潜在联合想象迈向物理接地的灵巧视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出DeCAL，一个基于MoT架构的VLA模型，通过接触感知门控机制自适应融合触觉信息，并联合预测未来视觉与触觉动态，显著提升了接触丰富的灵巧手操作任务的成功率与泛化能力。

**1. 整体逻辑**
- **研究任务**: 接触丰富的灵巧手操作（contact-rich dexterous manipulation），即需要细粒度物理交互、克服视觉遮挡并依赖触觉反馈的机器人控制任务。
- **研究动机**: 现有VLA模型以视觉为主，缺乏对物理接触动态的显式建模；现有引入触觉的方法多为简单的同质多模态融合，缺乏自适应调节机制（容易在非接触阶段引入噪声），且无法预测未来交互动态（缺乏对物理世界的“想象”能力），导致在复杂接触任务中表现受限。
- **本质改动**: 将触觉感知深度融入VLA的世界模型中，通过“接触感知门控”动态决定何时依赖触觉，并通过“视觉-触觉潜在联合想象”预测未来物理交互状态，赋予策略隐式的物理世界知识。
- **技术溯源**: 基于 Mixture-of-Transformers (MoT) 架构；理解专家基于 Qwen3-VL，生成和动作专家基于 Qwen3；视觉潜在空间使用 Cosmos VAE tokenizer；动作生成基于 Flow Matching；模型权重初始化自 InternVLA-A1-3B。

**2. 技术拆解**
- **核心方法**: 
  1. **MoT架构与单向信息流**：包含理解、生成、动作三个专家，通过块级注意力掩码（blockwise attention mask）实现“理解 -> 生成 -> 动作”的单向知识传递，避免信息反向干扰。
  2. **自适应视觉-触觉融合**：提取局部和全局触觉token，通过交叉注意力注入视觉-语言特征中。引入接触感知门控机制，利用全局触觉token计算门控权重，在非接触阶段抑制触觉噪声，在接触阶段放大触觉信号。
  3. **视觉-触觉潜在联合想象**：生成专家以非自回归方式并行预测未来的视觉和触觉潜在表示。视觉特征经Cosmos VAE编码并压缩，触觉特征由6-DoF力编码，从而隐式学习物理动态。
  4. **分解流匹配 (Factorized Flow Matching)**：在动作专家中，将机械臂和灵巧手的动作从独立噪声初始化并解耦生成，解决高自由度下的臂手协调问题。
- **关键细节**: 
  - **输入**：多视角视觉（2个腕部+1个头部相机）、10个指尖的触觉（原始图像、变形图、6-DoF力）、机器人本体状态、语言指令。
  - **输出**：长度为50的动作块（action chunk），控制56-DoF的双臂双手系统。
  - **规模**：基于3B参数规模的InternVLA-A1初始化。
- **训练/优化目标**: 
  - 总损失为三项加权和：$\mathcal{L}_{total} = \lambda_v \mathcal{L}_{visual} + \lambda_t \mathcal{L}_{tactile} + \mathcal{L}_{action}$。
  - **视觉前瞻损失**：预测的视觉latent与Cosmos VAE编码的未来真实特征计算MSE。
  - **触觉前瞻损失**：预测的多种触觉表征（图像、变形图、力）与真实值计算重建损失。
  - **动作损失**：基于Flow Matching范式，学习从噪声到目标动作的传输向量场。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：作者自采的6个接触丰富的灵巧操作任务（擦花瓶、擦白板、组装零件、拧瓶盖、移液、拧灯泡），每任务100个遥操作demo。
  - **硬件平台**：双UR5机械臂 + 双22-DoF SharpaWave五指灵巧手（带Sharpa视觉触觉传感器）。
  - **对比对象 (Baseline)**：GR00T N1.6, InternVLA-A1, ViTacFormer, DECO, 以及作者为公平对比魔改加入触觉输入的 InternVLA-A1_t。
- **评价指标**: 
  - 操作性能：成功率 (SR) 和 进度成功率 (PSR)。
  - 生成质量：Cosmos特征相似度 (Cos) 和 LPIPS。
- **主要结果**: 
  - **操作性能**：DeCAL 取得 SOTA，平均成功率 71%，平均 PSR 83.4%。比最强 baseline 平均成功率高出 15% 以上。在组装零件等强接触任务中优势明显。
  - **泛化能力**：在4种 OOD 场景（未见背景、杂乱环境、未见光照、未见物体）下鲁棒性更强，特别是在“未见物体”设定下成功率达 75%，大幅领先 baseline。
  - **生成质量**：未来视觉帧生成的 Cos 和 LPIPS 指标均优于 InternVLA-A1，证明联合想象能更准确地捕捉物理接触下的状态演变。
  - **推理效率**：在单张 RTX 4090 上推理延迟为 0.27s/动作块，满足实时控制需求。

### 29. 🔥 [ICI-VLA: In-Context Imitation with Spatiotemporally Aligned Demonstrations for Vision-Language-Action Models] (ICI-VLA：基于时空对齐演示的视觉-语言-动作模型上下文模仿)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.07581` | [点击跳转](https://arxiv.org/abs/2609.07581)

**0. 论文标题**
- **英文标题**: ICI-VLA: In-Context Imitation with Spatiotemporally Aligned Demonstrations for Vision-Language-Action Models
- **中文标题**: ICI-VLA：基于时空对齐演示的视觉-语言-动作模型上下文模仿
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作搞了个不用测试时微调的VLA上下文学习框架，通过检索时空对齐的子任务微演示和加动作掩码，让冻结参数的纯文本VLA能照着当前观测准确出动作。

**1. 整体逻辑**
- **研究任务**: VLA模型的少样本测试时适应（few-shot test-time adaptation），也就是不更新模型参数，靠给上下文演示来让模型适应新的机器人操作任务。
- **研究动机**: 现在的VLA换新任务得重新收集数据并微调，成本太高。如果直接拿长轨迹做上下文引入VLA，会面临两个坑：一是长轨迹和短动作块有时间错位（temporal aliasing），二是视觉相似的动作可能根本不兼容（semantic-dynamic mismatch）。这会导致模型直接“抄”上下文动作，而忽略当前观测。
- **本质改动**: 不改VLA网络结构，保留纯文本生成接口。把长轨迹切成带语义标签的“微演示”，用DTW（动态时间规整）训练检索器找回时空对齐的上下文；训练时加上目标动作掩码（Target Action Masking），逼着模型看当前观测，别直接抄上下文动作。
- **技术溯源**: 基于 VLA-0（纯文本生成动作范式），策略基座用的是 Qwen3-VL-4B，检索器基座用的是 Qwen3-VL-Embedding-2B。

**2. 技术拆解**
- **核心方法**: 
  1. 微演示库构建：用VLM把长轨迹切成短动作块（微演示），并打上子任务级别的语义标签。
  2. 时空检索对齐（RD-Encoder）：先做语义硬过滤，再用DTW算轨迹几何相似度，挖掘正负样本训练对比学习检索器。
  3. 目标动作掩码（Target Action Masking）：微调策略时，随机遮住上下文演示里的部分动作token，让模型根据当前观测和剩下的上下文去预测被遮住的，防止直接抄动作。
- **关键细节**: 
  - 策略模型：Qwen3-VL-4B，无动作头，动作和本体感觉全转成文本字符串。动作块长度设为25步。推理时参数冻结，每次检索3个微演示。当策略置信度低于0.65时自动刷新检索上下文。
  - 检索器：Qwen3-VL-Embedding-2B。推理时只输入当前查询（全局指令、子任务指令、观测、状态），不输入动作。
  - 掩码细节：训练时掩盖目标动作的部分位置，损失只算未掩盖位置，且预测前缀里包含被掩盖的token。
- **训练/优化目标**: 
  - 检索器：InfoNCE对比损失。正样本是DTW代价最小的，负样本是同语义但相位错位的样本。
  - 策略模型：自回归交叉熵损失，但只计算未掩码token的损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（仿真，物体/空间操作），RoboTwin 2.0（仿真，长时序双臂任务），物理双机械臂 Aloha（4个任务）。总计约11200条长轨迹。
  - Baseline：Octo, OpenVLA, $\pi_0$-FAST, MolmoAct, $\pi_0$, $\pi_{0.5}$-KI, OpenVLA-OFT, VLA-0。
- **评价指标**: 任务成功率（SR）。仿真每个任务10次rollout，物理每个任务250次rollout。检索器单独评估用 Recall@K。
- **主要结果**: 
  - LIBERO：平均成功率 97.7%（比 OpenVLA-OFT 的 96.4% 高，在 Long 等子项上表现最好）。
  - RoboTwin 2.0：平均成功率 60.4%，比最高 baseline（OpenVLA-OFT 的 41.1%）高出 19.3 个百分点。同等条件下的 VLA-0 Naive ICL 只有 10.7%。
  - 物理 Aloha：平均成功率 83.2%，比 $\pi_0$ (66.4%) 和 VLA-0 (63.0%) 高出一大截。
  - 消融实验：去掉 Target Action Masking 在 RoboTwin 上直接掉到 10.7%，去掉 DTW 掉到 31.4%，去掉语义过滤掉到 38.1%，说明这几个模块缺一不可。

- **研究任务**: 构建和预训练用于具身智能控制的世界-动作模型（WAMs），把视频生成的先验知识转化为机器人可执行的控制信号。
- **研究动机**: 现有的 WAM 系统都是“单体架构”，生成骨干、视觉表示、网络结构、信息流、推理流程和训练数据全绑在一起，导致大家搞不清到底哪些设计选择真正起作用、为什么起作用。

**2. 技术拆解**
- **核心方法**: 提出 OpenWAM 开源研究栈，包含三部分：1) OpenWAM-Infra（基础设施）：将 WAM 拆解为可组合模块，统一训练、推理、部署和评估流程；2) OpenWAM-Study（受控实验）：通过控制变量实验探究知识继承、世界与动作学习的交互及扩展规律，总结出三条设计原则；3) OpenWAM-α（预训练模型）：基于上述原则在大规模数据上训练出的最终模型。

  1. 模块化解耦：分离生成骨干、视觉表示、信息流等组件。
  2. 三条设计原则：① 上游知识需要通过足够强的生成骨干和紧凑且信息丰富的隐空间（latent space）来传递；② 世界与动作的协同需要专属的动作容量（action capacity）、显式的世界到动作信息流、以及同步联合去噪（joint denoising）；③ 具身预训练主要提升域外泛化能力，采用单阶段共训练（one-stage co-training）融合第一人称人类数据和机器人数据，以同时兼顾世界覆盖和动作基础。

- **实验设置**: 在 8 个仿真基准和真实机器人实验上进行评估；涵盖单臂操作、双臂操作和灵巧手等多种具身形态（embodiments）；对比对象（baseline）原文未提及。

- **主要结果**: OpenWAM-α 在 8 个仿真基准和真实机器人实验中均表现出持续优异的性能，从仿真到物理世界均保持顶级水平；验证了所总结的设计原则（特别是单阶段共训练）能有效提升模型的域外泛化能力。

### 31. 🔥 [Beyond Task Success: Stage-Wise Reliability of World Model Planning under Sensing Degradation] (超越任务成功：感知退化下世界模型规划的逐阶段可靠性)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.07126` | [点击跳转](https://arxiv.org/abs/2609.07126)

**0. 论文标题**
- **英文标题**: Beyond Task Success: Stage-Wise Reliability of World Model Planning under Sensing Degradation
- **中文标题**: 超越任务成功：感知退化下世界模型规划的逐阶段可靠性
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于实证分析与评估框架类工作，提出了一种逐阶段（Stage-Wise）的诊断框架，追踪视觉与时间感知扰动在世界模型规划流水线中的传播与衰减，证明仅看最终任务成功率无法准确反映感知退化的真实影响。

**1. 整体逻辑**
- **研究任务**: 评估世界模型规划（World Model Planning）在面临视觉和时间感知退化（Sensing Degradation）时的可靠性与鲁棒性。
- **研究动机**: 现有的鲁棒性评估通常只关注最终任务成功率（Task Success），但这掩盖了感知干扰在模型内部流水线中是衰减了还是持续存在了，无法定位具体是哪个功能环节（如表征、预测或规划）出了问题。
- **本质改动**: 打破“只看最终结果”的黑盒评估，构建了一个配对的逐阶段（Stage-Wise）评估框架，将世界模型规划拆解为表征、预测、规划偏好和最终结果四个阶段，定量追踪扰动在其中的传播路径。
- **技术溯源**: 基于 DINO-WM（主要）和 LeWM（次要）世界模型，使用 CEM（Cross-Entropy Method）作为规划器，在 OGBench（OGBScene Drawer, OGB-Cube）机器人操作环境中进行验证。

**2. 技术拆解**
- **核心方法**: 构建四阶段（Stage 1-4）配对诊断机制。在相同的任务上，对干净条件和退化条件进行对比：
  - Stage 1（表征）：测量冻结视觉编码器对干净和退化输入的潜在表征距离（归一化）。
  - Stage 2（预测）：注入相同的动作序列，测量预测未来表征的差异，使用相对残差（相对于初始上下文差异）来衡量扰动在自回归预测中的衰减或持续。
  - Stage 3（规划）：固定 CEM 初始迭代生成的候选动作池，在两种上下文中评估，衡量规划器动作偏好的变化。
  - Stage 4（结果）：独立运行规划器，比较最终任务成功率。
- **关键细节**: 
  - 10种感知退化条件：5种视觉（Low-light, Overexposure, Motion blur, Transient occlusion, Water-drop），5种时间（Random frame loss, Substitution-Prior, Substitution-Current, Delay-5, Delay-10）。
  - 主要环境：OGBench OGBScene Drawer（goal offset 20），固定50个任务。
  - 次要环境：OGB-Cube。
  - 关键超参示例：Random frame loss 丢帧率 p=0.40；Motion blur kernel 11；Transient occlusion 遮挡 patch 45×45。
- **训练/优化目标**: 本文非学习类工作，无训练目标。核心机制是上述四阶段的度量指标设计，特别是 Stage 2 的相对残差（$D_5/D_{context}$）和 Stage 3 的共享候选池评估，以隔离上下文诱导的差异和动作选择带来的差异。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：主要使用 OGBench OGBScene Drawer，次要使用 OGB-Cube。
  - 对比对象：以干净条件（Clean condition）为配对基准，对比10种感知退化条件。模型层面主要对比 DINO-WM 和 LeWM。
- **评价指标**: 
  - Stage 1：归一化表征距离。
  - Stage 2：预测相对残差（$D_5/D_{context}$），接近0表示衰减，越大表示持续。
  - Stage 3：干净最优动作的排名中位数（Median rank）、保持第一的比例（Same-top）。
  - Stage 4：成功率（SR）、成功率差异（$\Delta SR$）、95% Tango score 置信区间。
- **主要结果**: 
  - **扰动传播非均匀**：感知退化的相对影响在各阶段不保持一致。例如，Low-light 和 Overexposure 在 Stage 1 引起大偏移（1.384和2.224），但在 Stage 2 强烈衰减（降至0.054和0.083）；而 Substitution-Current 在 Stage 1 偏移较小（0.792），但在 Stage 2 持续存在（0.571）且导致规划排名中位数降至19。
  - **内部响应与物理结果解耦**：内部阶段的大变化不一定导致任务成功率大幅下降。例如，Delay-5 和 Delay-10 内部变化大，但 Stage 4 成功率反而上升至66.0%。且所有主要条件的 $\Delta SR$ 95%置信区间均包含0，说明仅看点估计无法得出显著性结论。
  - **视觉与时间退化模式不同**：视觉退化通常降低 Stage 4 成功率，而部分时间退化反而增加了成功率（主要体现为减少了从成功到失败的翻转）。
  - **时间退化的位置与新鲜度效应**：时间扰动的影响不仅取决于整体历史变化，还取决于信息在历史中的位置。例如，Substitution-Prior 和 Substitution-Current 在 Stage 1 的表征变化几乎相同，但下游预测和规划响应差异巨大，表明规划器对最新观测的新鲜度更敏感。
  - **跨模型/任务泛化**：在 OGB-Cube 上的 DINO-WM 和 LeWM 次要评估中，同样观察到了阶段异质性（Stage-wise heterogeneity），证明该现象不局限于单一模型或任务。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.07002` | [点击跳转](https://arxiv.org/abs/2609.07002)

**0. 论文标题**
- **英文标题**: WM-Craftnet: World Synesthesia Model for Generalizable and Robust Dexterous In-Hand Manipulation
- **中文标题**: WM-Craftnet：用于泛化且鲁棒的灵巧手手内操作的世界联觉模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于世界模型的视触觉灵巧手操作框架，通过“噪声输入-干净重建”的循环状态空间模型提取跨模态物理先验，并将其作为策略上下文，显著提升了多物体手内旋转的鲁棒性与 Sim-to-Real 泛化能力。

**1. 整体逻辑**
- **研究任务**: 接触丰富的灵巧手手内操作（如多物体手内旋转），要求策略在部分可观测和传感器噪声下，准确推断物体位姿、几何、接触状态和滑动风险。
- **研究动机**: 现有视触觉强化学习方法在受控环境下表现良好，但在位姿偏移、外力干扰和物体变化时鲁棒性差。简单拼接传感器流无法让策略从噪声融合观测中有效学习时序接触动态，且策略容易过拟合到特定物体的固定手指动作（finger gaits）。
- **本质改动**: 不直接用世界模型做轨迹想象或策略优化，而是将其学到的确定性循环隐状态截断梯度后，作为非对称 actor-critic 策略的循环任务上下文；同时引入“噪声深度输入-干净深度重建”机制，强制世界模型学习去噪的几何与接触状态。
- **技术溯源**: 基于 Dreamer 风格的循环状态空间模型（RSSM），结合 PPO（Proximal Policy Optimization）强化学习算法。

**2. 技术拆解**
- **核心方法**: 提出 WM-Craftnet 框架，核心是 World Synesthesia Model (WSM)。WSM 接收本体感觉、噪声深度、触觉和动作历史，通过多模态编码器融合后输入 RSSM。WSM 的确定性隐状态被投影后，作为 PPO Actor 的循环任务上下文，提供去噪的几何与接触演化特征。
- **关键细节**: 
  - **输入输出**：Actor 输入为堆叠的本体感觉、二值触觉、噪声腕部深度图、上一时刻动作及 16 维 WSM 投影特征；输出为 22-DoF 关节的相对目标增量。
  - **模型结构**：MLP 处理本体/触觉，CNN 处理深度。RSSM 包含 512 维确定性隐状态和 32 维随机隐状态。
  - **规模与超参**：控制频率 10Hz，物理仿真 60Hz；WSM 使用 Adam 优化器（学习率 1e-4）；PPO 使用 1024 个并行环境，batch size 4096。
- **训练/优化目标**: 
  - **WSM 优化**：干净深度图重建损失、本体感觉重建、触觉预测、奖励预测、位姿/价值/形状辅助预测，以及 Dreamer 风格的动力学和表示 KL 散度正则化。
  - **策略优化**：PPO 的标准优势估计和裁剪目标函数。WSM 与策略的优化路径通过截断梯度（stopped gradient）完全解耦。

**3. 实验结果**
- **实验设置**: 
  - **测试环境**：仿真环境及 22-DoF Sharpa Wave 五指灵巧手硬件（配 RealSense L515 腕部深度相机和触觉皮肤）。
  - **对比对象 (baseline)**：Open-loop Replay, Blind RL Policy, Touch Dexterity, RL Policy (w/ depth), In-Hand Rotation。
- **评价指标**: 仿真指标包括 Return, Episode Length, Rotation Rate (RotR), Off-axis motion, Fall rate；真实机器人指标包括 20秒内的旋转弧度 (RR) 和成功率 (SR，要求旋转超过半圈)。
- **主要结果**: 
  - **仿真多物体 z 轴旋转（9个物体）**：Full WSM 的 Return 达到 753.3，RotR 1.293，显著优于基线（如 Touch Dexterity 的 386.9 和 In-Hand Rotation 的 236.1）。
  - **Sim-to-Real 真实机器人测试**：在 20 个物体（含 11 个未见物体）的 200 次试验中，WM-Craftnet 成功 175 次（87.5%），而基线最高仅成功 53 次。
  - **难例与扰动恢复**：在 y 轴和 x 轴旋转中，Return 和 RotR 近乎翻倍，掉落率降至最低；在强扰动恢复测试中，成功率达 14.1%（基线最高 6.2%），平均恢复时间缩短至 2.56 秒。
  - **先验复用**：在 9 个物体上预训练的 WSM 用于 49 个新物体的下游学习，平均旋转弧度从 3.28 rad 提升至 9.37 rad，掉落率从 6% 降至 0.3%。

### 33. 🔥 [Where Success Breaks: Failure-Boundary Learning for Robust Vision-Language-Action Models] (成功在何处破灭：面向鲁棒视觉-语言-动作模型的失败边界学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.06114` | [点击跳转](https://arxiv.org/abs/2609.06114)

**0. 论文标题**
- **英文标题**: Where Success Breaks: Failure-Boundary Learning for Robust Vision-Language-Action Models
- **中文标题**: 成功在何处破灭：面向鲁棒视觉-语言-动作模型的失败边界学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出 DLS 框架，利用仿真器的特权状态精准定位任务失败的具体阶段，并在 Flow 模型的速度场中直接进行对比塑造，无需 Critic 和动作似然估计即可大幅提升机器人操作的鲁棒性。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在下游机器人操作任务中的后 SFT（监督微调）优化与适应。
- **研究动机**: 传统的 SFT 存在结构缺陷：专家示范只教了“成功”的动作，没教“失败”的边界。在闭环执行时，微小误差会导致机器人偏离示范分布，而模型不知道如何恢复或避开错误。现有的后 SFT 方法（如 RL）要么需要复杂的似然估计，要么依赖容易过拟合的 Critic，或者只能提供粗糙的二值成功/失败奖励，无法指导模型在哪个具体环节纠错。
- **本质改动**: 把 VLA 的后 SFT 优化从“拟合专家成功分布”转变为“学习闭环执行中的失败边界”。直接在 Flow 模型的速度场（velocity field）空间做推/拉优化，绕开了计算动作似然和训练 Critic 的难题。
- **技术溯源**: 基于 Flow-based VLA（如 $\pi_0$、$\pi_{0.5}$），结合了 Sim-Real 协同训练、Flow-SDE 采样器，以及 ManiSkill 仿真环境和 MimicGen 数据生成工具。

**2. 技术拆解**
- **核心方法**: 提出 Discover-Localize-Shape (DLS) 两阶段 Pipeline。Stage 1 通过少量真实数据和大量仿真数据协同训练建立行为先验；Stage 2 在仿真中进行 on-policy 探索，通过语义进度定位（SPL）给轨迹打上阶段级标签，再通过方向边界塑造（DBS）直接优化 Flow 速度场。
- **关键细节**: 
  - **语义进度定位 (SPL)**: 利用仿真器的特权状态（如末端执行器位姿、抓取力等），将任务划分为多个有序阶段。计算阶段内的连续进度，从而将整条轨迹的失败精确定位到具体是哪个阶段卡住了（failure locus），而不是简单的 0/1 二值标签。
  - **方向边界塑造 (DBS)**: 针对 Flow-based VLA，在速度场空间构建镜像分支。计算当前策略预测速度与旧策略 rollout 速度的偏差，利用马哈拉诺比斯距离和 SPL 给出的符号标签（正代表成功方向，负代表失败方向），通过 Softplus 损失函数拉/推速度场。整个过程不需要计算 action likelihoods，也不需要 Critic 网络。
  - **防遗忘机制**: 使用真实数据的 SFT loss 作为正则化项，防止模型在仿真探索中遗忘基础操作技能。
- **训练/优化目标**: 
  - Stage 1: Sim-Real 混合 SFT 损失（最小化预测速度与专家速度差的 L2 范数）。
  - Stage 2: DBS 损失（基于镜像分支马哈拉诺比斯距离差的 Softplus 排序损失） + $\lambda$ 倍真实数据 SFT 正则化损失。

**3. 实验结果**
- **实验设置**: 
  - **任务与环境**: 3 个真实机器人操作任务（Pick & Place, Sweep, Plugin）。使用 Franka 机械臂和 RealSense 相机。每个任务 50 条真实遥操作数据，利用 MimicGen 生成 1000 条仿真数据。
  - **对比对象 (baseline)**: Full-SFT（仅用 50 或 100 条真实数据微调），Few-shot SFT + RL（Sim-Real SFT, +GRPO, +PPO）。
  - **基座模型**: 开源 Flow-matching VLA（$\pi_0$ 和 $\pi_{0.5}$）。
- **评价指标**: 真实机器人上的任务成功率（Success Rate, %），分为同分布（ID.）和未见分布（Unseen.，改变光照、背景、初始位置）两种条件。
- **主要结果**: 
  - DLS 在 $\pi_{0.5}$ 上达到 84.4% (ID.) / 72.2% (Unseen.)，在 $\pi_0$ 上达到 78.9% / 71.1%，全面超越 SFT 和 PPO/GRPO 等 RL baseline。
  - 在 Unseen 条件下优势显著扩大（例如 $\pi_{0.5}$ 上比 PPO 高出 4.4%），证明该方法学到了结构化的鲁棒性而非死记硬背。
  - 数据效率极高：仅用 50 条真实数据的 DLS，在 Unseen 条件下超越了使用 100 条真实数据的 Full-SFT（绝对提升 17.8%）。
  - 消融实验证明：SPL 的阶段级定位比二值奖励收敛更快、最终成功率更高；DBS 的速度场塑造有效抑制了导致失败的特定去噪扰动。

### 34. 🔥 [CR-VLA-Force: Learning Control-aware Compliance VLA Model for Robust Contact-rich Robotic Manipulation] (CR-VLA-Force：学习控制感知的柔顺VLA模型以实现鲁棒的接触丰富机器人操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.05832` | [点击跳转](https://arxiv.org/abs/2609.05832)

**0. 论文标题**
- **英文标题**: CR-VLA-Force: Learning Control-aware Compliance VLA Model for Robust Contact-rich Robotic Manipulation
- **中文标题**: CR-VLA-Force：学习控制感知的柔顺VLA模型以实现鲁棒的接触丰富机器人操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种控制感知的柔顺VLA分层框架（CC-VLA），通过多阶段MoE融合和自适应柔顺控制器，解决了现有VLA模型在接触丰富任务中力跟踪不准和响应延迟的问题。

**1. 整体逻辑**
- **研究任务**: 提升机器人在接触丰富（contact-rich）操作任务（如按压、插拔、擦拭等）中的力感知与精确力-位置跟踪能力。
- **研究动机**: 现有VLA模型（如ForceVLA）受限于动作块（action-chunk）执行策略和低频控制，导致力跟踪精度差且延迟高，容易引发过大交互力；此外，视觉与力信号在信息密度和时序动态上高度异构，直接端到端融合会导致视觉模态主导，且过早引入噪声力信号会破坏VLA原有的通用空间感知能力。
- **本质改动**: 采用“慢-快”分层架构，上层用多阶段训练的MoE-VLA进行力感知与动作预测，下层用VLA引导的自适应柔顺控制器进行高频力-位置闭环控制，并配合对抗共享遥操作策略采集高质量力数据。
- **技术溯源**: 基于 $\pi_0$ (pi0) 视觉语言动作基础模型，借鉴了 ForceVLA 的 MoE 跨模态融合机制以及 Causal Observation Perceiver 的序列编码思想。

**2. 技术拆解**
- **核心方法**: 
  1. **历史力序列编码器**：将历史力信号分块（patch）编码，通过交叉注意力聚合为紧凑的力token，捕捉接触状态的时序动态（如接触丢失、力峰值）。
  2. **多阶段MoE特征融合**：Stage 1 微调 $\pi_0$ 骨干网络对齐视觉-语言-本体感觉空间，保留空间感知；Stage 2 引入跨模态融合专家（稀疏MoE），利用力残差对动作进行修正，避免模态竞争。
  3. **VLA引导的自适应柔顺控制器**：接收VLA预测的期望位置和力，通过启发式阻抗适应律（基于力跟踪误差动态调整刚度）和高频插值，实现高频力-位置跟踪。
  4. **对抗共享遥操作**：通过补偿虚拟阻抗降低等效环境刚度，使遥操作系统在接触时表现得更“软”，提高数据采集的安全性和交互性。
- **关键细节**: 
  - **输入**：多视角RGB图像、语言指令、本体感觉（TCP位姿、夹爪宽度、实时末端力）、历史力序列。
  - **输出**：动作块（包含未来H步的位姿、夹爪宽度、期望力）。
  - **模型与系统规模**：基于 $\pi_0$，包含4个专家的稀疏MoE结构。VLA推理频率1Hz（动作horizon 40），力采样频率10Hz（0.1s），底层控制频率500Hz。刚度边界限制在 400~2500 N/m。
- **训练/优化目标**: 
  - 动作预测采用基于 Flow Matching 的损失函数（最小化预测速度场与真实噪声的MSE）。
  - 多阶段训练中，Stage 1 优化基础动作预测，Stage 2 联合优化共享专家以学习接触动态微调。

**3. 实验结果**
- **实验设置**: 
  - **硬件**：UR5e机械臂，RealSense D435腕部相机，侧面相机，UMI式夹爪，6轴力矩传感器。
  - **任务与数据**：按压急停按钮（PB）、插入充电插头（PI）、打开旋转窗（OW）、恒力擦拭白板（WB）。使用自采数据（原文未提及公开数据集名称，PB/OW/WB各50条演示，PI 100条演示）。包含基础分布（Base）、OOD高度泛化（OOD）和近端起始（Pro）设置。
  - **Baseline**：Diffusion Policy (DP), $\pi_0$, $\pi_0$ wi F (直接拼接力), $\pi_{0.5}$, ForceVLA。
- **评价指标**: 任务成功率（Success rate）、Z轴力跟踪误差（实际力与期望40N力的偏差百分比）。
- **主要结果**: 
  - CC-VLA在6个测试条件下的平均成功率达到 **89.2%**，显著优于 DP (31.3%), $\pi_0$ (47.3%), $\pi_{0.5}$ (44.7%), $\pi_0$ wi F (60.2%), ForceVLA (73.2%)。
  - 在擦拭任务（WB）中，CC-VLA是唯一能鲁棒跟踪40N期望力的方法，Base和OOD下的力跟踪误差分别为 **5.52%** 和 **8.78%**，远低于 ForceVLA (35.57%, 52.33%) 等baseline。$\pi_0$ 和 $\pi_{0.5}$ 因力过大直接触发保护停机。
  - **消融实验**：多阶段训练使PB成功率提升12%（误按率从28%降至8%），PI提升8%（达76%）；历史力编码器使PI-Pro成功率从72%提升至92%；自适应柔顺控制器将擦拭力跟踪误差从17.73%大幅降至5.52%。
