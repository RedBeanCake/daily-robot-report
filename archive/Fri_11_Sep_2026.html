### 35. 🔥 [GE-Act 2.0: Pretraining and Scaling a World-Action Model for Robotic Manipulation] (GE-Act 2.0：预训练与扩展用于机器人操作的世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.05588` | [点击跳转](https://arxiv.org/abs/2609.05588)

**0. 论文标题**
- **英文标题**: GE-Act 2.0: Pretraining and Scaling a World-Action Model for Robotic Manipulation
- **中文标题**: GE-Act 2.0：预训练与扩展用于机器人操作的世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种从头预训练的机器人世界-动作模型，通过控制导向自编码器、单步视觉规划器和知识对齐选择性优化（KASO），解决了视觉预测与动作监督的模态冲突，实现了在大规模异构数据上的有效扩展和零样本跨场景泛化。

**1. 整体逻辑**
- **研究任务**: 机器人操作（根据多视角视觉观察和语言指令，预测未来视觉状态并生成机器人动作）。
- **研究动机**: 现有世界-动作模型（WAM）多直接继承预训练视频生成器，没搞清楚 WAM 本身该怎么从头预训练和扩展。此外，把独立生成的未来视觉状态和记录的动作直接配对训练，会引发“有效性差距”（validity gap）——生成的未来可能描绘了和记录动作完全不同的行为模式，导致监督信号冲突，把动作多样性给抹平了。
- **本质改动**: 抛弃直接套用视频生成器的做法，所有组件从头初始化。设计了解耦的两阶段架构：先用自编码器压缩特征，再让视觉规划器和逆动力学模型在各自互补的数据上分别预训练，最后端到端联合训练；提出 KASO 算法，在联合训练时只挑出跟记录动作行为兼容的生成状态来算损失，解决监督冲突。
- **技术溯源**: 视觉自编码器基于 DC-AE 初始化；单步生成基于 MeanFlow / improved MeanFlow；多模态理解基于 Qwen3.5 VLM；特征对齐使用 SigLIP 2、V-JEPA 2.1 和 DINOv3。

**2. 技术拆解**
- **核心方法**: 
  1. **CoAE（控制导向自编码器）**: 采用 64x64 的激进空间下采样，结合像素重建与三个冻结视觉教师（SigLIP 2, V-JEPA 2.1, DINOv3）的特征对齐。在极低 token 数量下，保留动作恢复和指令接地所需的信息。
  2. **SVP（单步视觉规划器）**: 使用条件 MeanFlow，通过一次前向传播完成多视角未来视觉潜变量的完全去噪。这使得 SVP 和 IDM 可以先解耦预训练，再通过可导的单步生成接口进行端到端联合训练，避免了多步扩散带来的梯度回传开销。
  3. **KASO（知识对齐选择性优化）**: 针对“有效性差距”，在联合训练时，SVP 采样多个候选未来状态，利用当前 IDM 在动作空间（高噪声水平下）评估它们与记录动作的兼容性，仅选择 Top-k 兼容的候选状态计算动作损失并回传梯度，保留动作多样性。
- **关键细节**: 
  - **输入输出**: 输入为多视角观察、本体感觉和语言指令；输出为密集（用于控制执行）和稀疏（用于长程意图）的动作序列。
  - **模型结构/规模**: CoAE 将 256x384 帧压缩为 4x6 的 512 通道潜变量（每帧 24 个 token）。SVP 采用多视角 DiT 架构，融合 VLM 的文本跨度状态。IDM 通过交叉注意力结合当前和预测的视觉潜变量。
  - **数据规模**: SVP 预训练 39,000 小时（含无动作视频），IDM 预训练 32,000 小时（含失败和部署轨迹），联合训练 30,000 小时。
- **训练/优化目标**: 
  - **CoAE**: 像素/LPIPS/GAN 重建损失 + 与三个视觉教师的余弦相似度对齐损失。
  - **SVP**: 基于 MeanFlow 的速度场回归损失（包含平均速度和辅助瞬时速度）。
  - **IDM**: 基于 Flow-Matching 的动作速度场回归损失。
  - **联合训练 (KASO)**: 选中的 Top-k 候选状态的端到端动作损失 + SVP 视频损失 + IDM 记录数据损失。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**: 真实机器人评估使用 100 个任务（20 个技能组），涵盖 G1-OP 和 G2-90D 两种形态，测试时保持场景、背景、光照和物体实例未见（零样本 OOD），无直接 baseline 对比，主要看数据扩展曲线。仿真评估对比了 StarVLA, GR00T N1.7, π0, π0.5, LingBot-VLA 2.0, ACoT-VLA。
- **评价指标**: 真实机器人评估使用经验成功率（SR）和跟随得分（Follow score，仅接触正确目标）；仿真评估使用任务平均成功率或归一化任务得分。
- **主要结果**: 
  - **数据扩展效应**: 联合训练数据从 300 小时扩展到 30,000 小时，G1-OP 成功率从 17.1% 提升至 44.1%，G2-90D 从 13.4% 提升至 31.1%。G2-90D 仅占联合训练数据不到 2%，但提升了 17.7 个百分点，证明了跨形态迁移能力。技能覆盖率与零样本 OOD 成功率强相关（Pearson r = 0.80）。
  - **KASO 消融**: 在受控真实机器人消融中，相比 E2E+PT，KASO 将四物体宏观平均拾取成功率从 22.5% 提升至 37.5%，单物体从 12% 提升至 40%。
  - **仿真 OOD 泛化**: 在 RoboTwin Clean-to-Random 的 Hard 条件下，成功率达 60.52%（领先 π0.5 的 47.90%）；在 GenieSim-Instruction 中平均得分 0.770（SOTA）；在 LIBERO-Plus 中总体成功率 80.4%。
  - **指令接地**: 在零样本 OOD 协议下，模型在 90% 以上的测试中正确接地物体、颜色、形状和位置引用，且能遵循与常规场景关联冲突的显式指令。

### 36. 🔥 [MobileVLA-R1 2.0: RL-Enhanced Reasoning for Mobile Robot Control] (MobileVLA-R1 2.0：用于移动机器人控制的强化学习增强推理)
- **研究机构**: `北京大学 (Peking University)`
- **Arxiv ID**: `2609.06251` | [点击跳转](https://arxiv.org/abs/2609.06251)

**0. 论文标题**
- **英文标题**: MobileVLA-R1 2.0: RL-Enhanced Reasoning for Mobile Robot Control
- **中文标题**: MobileVLA-R1 2.0：用于移动机器人控制的强化学习增强推理
- **研究机构**: 北京大学 (Peking University)
- **一句话总结**: 提出了一种带有“推理条件动作解码器”的VLA框架，通过多粒度思维链（CoT）监督和GRPO强化学习，将高层语义推理显式对齐到移动机器人的任务级动作控制上，提升了长序列导航和移动操作的成功率。

**1. 整体逻辑**
- **研究任务**: 移动机器人的视觉-语言-动作（VLA）控制，具体涵盖语言引导的视觉导航（VLN）、四足机器人控制以及人形机器人的移动操作。
- **研究动机**: 现有VLA模型多依赖隐式推理，难以在长序列任务中保持决策连贯性；而近期引入显式推理（如System-2式CoT）的方法，大多只关注生成人类可读的文本理由，缺乏将高层推理表征与底层可执行机器人控制显式耦合的接口，导致推理与物理执行脱节。
- **本质改动**: 设计了一个“推理条件动作解码器”作为显式接口，将多模态推理表征直接映射为任务级动作目标（如速度和控制原语），并结合多粒度CoT监督与GRPO强化学习来优化推理到动作的一致性，从而解耦高层语义决策与底层机器人执行。
- **技术溯源**: 基于 NaVILA（LLaMA3-8B 主干）、DepthAnything V2、Point Transformer V3，以及前作 MobileVLA-R1。

**2. 技术拆解**
- **核心方法**: 
  1. 构建多粒度CoT数据集（MobileVLA-CoT），包含Episode（全局）、Navigation（导航）和Step（单步）三个时间尺度的推理监督。
  2. 提出推理条件动作解码器，利用交叉注意力机制从观测和推理表征中提取特征，分别预测连续运动指令和离散行为原语。
  3. 采用两阶段训练：先进行监督微调（SFT）对齐推理与动作，再使用GRPO（Group Relative Policy Optimization）进行离线强化学习，通过动作奖励提升推理到动作的一致性。
- **关键细节**: 
  - **输入输出**：输入为RGB图像、深度图、点云和语言指令；输出为任务级动作（平移速度 $V_x, V_y$、偏航速度 $\omega$ 以及离散行为原语 $\alpha$），由底层特定机器人控制器翻译为关节指令。
  - **模型结构**：LLaVA风格架构，冻结模态编码器，优化投影层、VLA主干（LoRA, r=16）和动作解码器。动作解码器包含两个可学习查询（loc和beh），单头交叉注意力（8 heads, dim=4096），后接轻量级回归和分类头。
- **训练/优化目标**: 
  - **SFT阶段**：自回归交叉熵损失（监督CoT文本） + 连续动作L1损失 + 离散动作交叉熵损失。
  - **GRPO阶段**：基于组相对优势的策略梯度目标。奖励函数包含三部分：运动奖励（预测与目标速度向量的余弦相似度）、行为奖励（离散原语的精确匹配）和格式奖励（确保输出符合 `<think>...<answer>...` 格式）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与Baseline**：VLN-CE (R2R-CE, RxR-CE) 用于导航评估，对比 CorrectNav、StreamVLN 等；QUARD 用于四足控制评估，对比 MoRE、QUART 等；真实世界部署在 Unitree Go2（四足）和 Unitree G1（人形）上，对比 NaVILA 和 MobileVLA-R1。
  - **系统测试环境**：Go2和G1采用混合部署架构（端侧Jetson进行感知与预处理，远程H20 GPU运行8B VLA主干和动作解码器）。G1的评估为Zero-shot迁移，训练时未使用任何G1特定数据。
- **评价指标**: 
  - 导航：导航误差 (NE)、成功率 (SR)、成功率加权路径长度 (SPL)、nDTW 等。
  - 四足控制：各任务及平均成功率 (Success Rate)。
  - 真实世界：导航成功率、操作成功率、全任务成功率 (Full-task success rate)，以及端到端延迟和失败原因统计。
- **主要结果**: 
  - **VLN-CE 导航**：在 R2R-CE 和 RxR-CE 上，SR 分别达到 69.8 和 73.1，比前作 MobileVLA-R1 平均提升 1.6 个点，并超越最强 baseline CorrectNav。
  - **QUARD 四足控制**：平均成功率从 MobileVLA-R1 的 0.70 提升至 0.76，比外部 baseline MoRE (0.60) 高出 16 个点，在复杂任务（如避障、爬行）上提升尤为明显。
  - **真实世界 Go2**：在复杂长序列指令下成功率提升明显（如 Workspace 复杂任务 SR 从 0.91 升至 0.94），端到端延迟约 205-245 ms。
  - **真实世界 G1 人形操作**：在 Zero-shot 迁移下，全任务平均成功率从 MobileVLA-R1 的 46.7% 提升至 56.7%（绝对提升 10.0 个点），验证了该推理-动作接口在不同机器人形态间的泛化能力。

- **中文标题**: SimpleMemVLA：一种简单但有效的视觉-语言-动作模型原生视频记忆方法
- **研究机构**: 原文未提及
- **一句话总结**: 这篇工作提出 SimpleMemVLA，不使用专门的记忆模块，而是直接将带时间戳的分钟级历史视频以原生格式输入给 VLM 骨干网络，利用其原生注意力机制处理历史信息，在长视野机器人操作任务中取得了 SOTA 效果，同时通过 KV cache 复用将推理延迟控制在单帧级别。

**1. 整体逻辑**
- **研究任务**: 解决长视野（long-horizon）机器人操作中的部分可观测性问题，即当前动作需要依赖几分钟前的历史视觉信息。
- **研究动机**: 现有的 VLA 记忆机制（检索、压缩、循环状态）存在“写入时承诺（write-time commitment）”问题，在不知道未来需求的情况下提前丢弃或压缩信息，容易丢失关键细节；而现代 VLM 骨干网络的上下文窗口（如 262k tokens）已足够大，无需强行压缩分钟级历史。
- **本质改动**: 取消专门的记忆模块，直接将采样的历史视频保持原样，以带时间戳的原生视频格式输入给预训练好的 VLM 骨干网络，让模型在“读取时”通过原生自注意力机制自行决定关注哪些历史信息。
- **技术溯源**: 基于 Qwen3.5-4B 骨干网络（使用其原生视频接口），动作生成部分基于 flow-matching 架构。

**2. 技术拆解**
- **核心方法**: 
  1. 原生视频输入：将历史帧降采样后保留时间顺序和明文时间戳，直接通过 VLM 的视频通道输入。
  2. 窄文本通道：VLM 生成当前子任务（sub-task）文本，利用该文本的隐藏状态（hidden states）和 token embeddings 作为唯一通道，将历史上下文传递给下游的动作头。
  3. 流式推理（Streaming Inference）：利用连续决策间历史前缀高度重合的特点，在机器人执行动作时预填充（prefill）共享的 KV cache，下次决策只处理新增帧。
- **关键细节**: 
  - 输入包含历史头部相机帧（带时间戳视频）、当前腕部相机帧（无时间戳图像）和语言指令。
  - 模型结构为 Qwen3.5-4B 骨干网络 + DiT-style flow-matching 动作头。
  - 60秒历史约占用 5.6k tokens，子任务文本解码限制在 64 tokens 以内。
- **训练/优化目标**: 联合损失函数包含两部分：子任务文本的 token 级交叉熵损失（由离线云端大模型生成标签监督），以及条件流匹配（conditional flow-matching）损失（用于训练动作头生成动作块）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：4 个记忆基准（RMBench, RoboMME, MIKASA-Robo, RoboMemArena）和 2 个通用控制基准（LIBERO, LIBERO-Plus）。
  - 对比对象（baseline）：现有记忆 VLA（如 Mem-0, EventVLA, MemoryWAM 等）、通用 VLA（如 OpenVLA, $\pi_0$ 等），以及在相同骨干和训练设置下复现的检索、压缩、循环状态变体。
  - 测试环境：单张 H100 GPU，bf16 精度。
- **评价指标**: 任务成功率（TSR）、阶段完成率（CSR）和决策延迟（Latency）。
- **主要结果**: 
  1. 记忆任务 SOTA：在 RoboMME 上达到 88.3%（比最强非 oracle baseline 高 43.7 个点）；在 RMBench 9 个任务平均达到 94.0%；在 MIKASA-Robo 达到 74.0%，RoboMemArena 达到 63.6% TSR。
  2. 通用任务不降点：在 LIBERO 上达到 97.5%（持平最优），在 LIBERO-Plus 零样本鲁棒性迁移上达到 78.4%。
  3. 机制归因：在相同设置下，原生视频上下文（88.3%）显著高于检索（31.5%）、Token 压缩（22.6%）和循环状态（20.6%）变体。
  4. 效率：在 60 秒历史下，流式推理将决策延迟从 1.02s 降至 0.68s，满足实时控制需求。
  5. 因果验证：遮蔽或替换历史帧会直接改变模型输出，证明模型确实依赖特定历史帧，并展现出视觉上下文学习（Visual In-Context Learning）能力。

### 38. 🔥 [CST-WM: A Causally Structured World Model for Embodied Visual Tracking] (CST-WM：一种用于具身视觉跟踪的因果结构化世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.06302` | [点击跳转](https://arxiv.org/abs/2609.06302)

**0. 论文标题**
- **英文标题**: CST-WM: A Causally Structured World Model for Embodied Visual Tracking
- **中文标题**: CST-WM：一种用于具身视觉跟踪的因果结构化世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 针对具身视觉跟踪中通用世界模型容易把动作直接“抄捷径”注入目标状态导致的“因果幻觉”问题，本文通过架构掩码强行解耦状态转移，迫使动作只能通过改变机器人位姿来影响未来观测，显著提升了机器人在遮挡和目标丢失情况下的跟踪与重捕获能力。

**1. 整体逻辑**
- **研究任务**: 具身视觉跟踪（Embodied visual tracking），即让机器人在复杂、部分可观测的环境中，通过自我运动持续跟踪移动目标，并在目标被遮挡或丢失时进行重新捕获。
- **研究动机**: 现有的通用动作条件世界模型在预测时，会利用机器人控制与目标观测之间的强相关性，产生“因果幻觉”（causal hallucination）——模型直接把当前动作注入到目标证据的隐状态更新中，而不是通过改变机器人位姿来间接改变观测。这导致预测的未来虽然看似合理，但赋予了目标证据错误的语义，无法正确指导跟踪和重捕获规划。
- **本质改动**: 对世界模型的隐状态转移进行因果结构上的因式分解，将状态拆分为目标证据、机器人和观测三个分支，并在网络架构上严格阻断动作对目标证据分支的直接注入，迫使动作只能通过机器人分支影响未来的观测。
- **技术溯源**: 基于扩散模型（DDPM/DDIM）进行状态转移预测，使用预训练的 VAE 提取视觉隐变量，使用 GroundingDINO 提取目标检测置信度和边界框面积，使用交叉熵方法（CEM）进行模型预测控制（MPC）规划。

**2. 技术拆解**
- **核心方法**: 提出因果结构化世界模型（CST-WM）。将隐状态分解为三个分支：目标证据分支（$H$）、机器人分支（$x$）和观测分支（$Z$）。在单层因果架构中，按固定顺序（目标证据 -> 机器人 -> 观测）进行去噪更新，并通过严格的注意力掩码（architectural masking）确保目标证据分支的更新不读取当前动作 $a_\ell$，而动作信息仅通过机器人分支传递给观测分支。
- **关键细节**: 
  - **输入输出**：输入为自我中心视角的 RGB 图像 $O_\ell$ 和动作 $a_\ell$；输出为下一时刻的结构化状态 $S_{\ell+1} = [H_{\ell+1}, Z_{\ell+1}, x_{\ell+1}]$。
  - **目标证据表示**：不使用完整的外部状态估计，而是使用 GroundingDINO 的检测置信度和归一化边界框面积作为紧凑的目标证据，反映目标的可观测性和表观尺度（距离代理）。
  - **模型规模**：视觉 VAE 隐变量维度 256，目标证据维度 32，机器人状态维度 32；转移骨干网络为 6 层 Transformer 块（隐藏层 512，8 头）。
  - **规划器**：使用 CEM 进行 MPC，规划步长 $T=10$，候选序列 $N=128$，精英数 $K=16$，迭代 $M=4$ 次。
- **训练/优化目标**: 主要使用扩散模型的均方误差去噪损失（$\mathcal{L}_{\mathrm{diff}}$）。此外，引入一个辅助的距离感知损失（$\mathcal{L}_{\mathrm{dist}}$），利用仿真器中的真实相对距离（仅在训练时可用）对目标证据分支进行二分类监督，使其更好地反映距离信息。总损失为 $\mathcal{L} = \mathcal{L}_{\mathrm{diff}} + 0.2 \mathcal{L}_{\mathrm{dist}}$。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：EVT-Bench 和 Habitat 3.0（包含标准跟踪和目标丢失恢复协议）。
  - **对比对象（Baseline）**：反应式跟踪器（Uni-NaVid, TrackVLA, TrackVLA++, SDA-S2）和通用世界模型（Habitat 3.0 baseline, 适配后的 NWM）。
- **评价指标**: 
  - **在线跟踪指标**：成功率 (SR)、跟踪率 (TR)、碰撞率 (CR)、跟随率 (F)、距离范围成功率 (DRS)、情节成功率 (ES)。
  - **恢复指标**：重捕获成功率 (Re-acq.)、重捕获时间 (TTR)、重捕获后跟随率 (Post-F)。
  - **离线诊断指标**：多步 rollout 保真度（潜在预测误差、目标可见性 AUROC）、规划价值一致性（Spearman's $\rho$, Kendall's $\tau$）、动作泄漏诊断（雅可比矩阵泄漏、动作交换干预分析）。
- **主要结果**: 
  - **在线性能**：在 EVT-Bench 和 Habitat 3.0 上，CST-WM 在跟踪质量、距离控制、安全性和目标重捕获方面均显著优于所有 baseline。例如在 Habitat 3.0 标准跟踪中，F 达到 0.53，DRS 达到 0.70，明显优于 adapted NWM 的 0.41 和 0.61；在目标丢失恢复任务中，重捕获成功率（Re-acq.）和重捕获后跟随率（Post-F）也全面领先。
  - **离线诊断**：多步 rollout 的潜在误差更低，目标可见性 AUROC 更高；规划价值与仿真器真实排序的秩相关性更强（Spearman's $\rho$ 达到 0.68，baseline 为 0.47）；通过雅可比矩阵和干预实验证实，目标证据分支对当前动作的直接泄漏降至几乎为 0（$|\partial H_{\ell+1}/\partial a_\ell| = 0.00$），验证了因果结构的有效性。

### 39. 🔥 [Show-Harness: Just a VLM Agent Can Play Robots] (Show-Harness：仅凭VLM智能体即可操控机器人)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.10522` | [点击跳转](https://arxiv.org/abs/2609.10522)

**0. 论文标题**
- **英文标题**: Show-Harness: Just a VLM Agent Can Play Robots
- **中文标题**: Show-Harness：仅凭VLM智能体即可操控机器人
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种紧凑的离散语义动作接口（Show-Harness），让VLM无需底层微调即可直接进行细粒度的机器人物理控制，并配套了无需专用遥操作硬件的GUI数据收集工具（GUMI）。

**1. 整体逻辑**
- **研究任务**: 将基础视觉语言模型（VLM）的世界知识转化为机器人的细粒度物理控制。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型将VLM的语义知识坍缩为不透明的“像素到连续动作”映射，泛化差且需要大量特定具身形态的数据；而分层/程序化系统（如Code-as-Policy）让VLM只做高层规划，物理控制交给下游控制器，削弱了语义意图与物理执行的直接联系。
- **本质改动**: 设计了一个离散、细粒度且与具身形态无关的“语义动作空间”（如前后左右平移、旋转、抓取），VLM直接在此语义空间做决策，由特定机器人的解释器将其确定性地转化为底层物理控制。
- **技术溯源**: 基于基础视觉语言模型（如 Gemini-3.1 Pro, Qwen3.5-2B），对比了 VLA 范式（如 $\pi_{0.5}$, GR00T）和 Agentic 范式（如 CaP-X, RATS）。

**2. 技术拆解**
- **核心方法**: 
  1. **Show-Harness 框架**：将控制循环分为感知、推理、动作三个阶段，通过插件（如多视角引导、本体感觉、子任务规划等）处理上下文。核心是语义动作接口和具身解释器。
  2. **GUMI 接口**：将同一套语义动作暴露为GUI，支持人和Agent直接通过键盘或界面收集数据，无需专用遥操作硬件。
- **关键细节**: 
  - **语义动作空间**：包含增量式移动（如 MV_FWD）、旋转、抓取等离散单元。具备三个特性：增量式（每次产生局部物理变化）、可解释且与具身形态无关（不暴露底层控制变量）、视觉接地（方向相对于可观测视角定义）。
  - **具身解释器**：将语义动作确定性地映射为 6-DoF 笛卡尔位姿增量，隔离了底层控制（如 Franka 用阻抗控制，AgileX 用逆运动学），并内置安全边界。
  - **双模式支持**：Zero-shot（闭源大模型直接控制）和 Fine-tuning（开源小模型如 2B 级别，仅需几小时 LoRA 微调）。
- **训练/优化目标**: 在微调（FT）模式下，优化目标是最小化目标语义动作单元的 token 级交叉熵损失。利用 VLM 原生词汇表预测动作，无需额外的动作头（action heads）或特殊 token。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：10个真实机器人抓取放置任务（5种物体×2种容器），包含164个真实机器人 episode 和230个仿真 episode。
  - **硬件**：Franka (7-DoF) 和 AgileX (双 6-DoF)。
  - **Baselines**：VLA ($\pi_{0.5}$, GR00T)、VLA-centric agents (H-VLA, G-VLA)、Code-as-policy (CaP-X, RATS)。
- **评价指标**: 任务成功率 (Success rate) 和 平均步数 (Average steps per episode)。
- **主要结果**: 
  - **泛化性**：ZS 和 FT 模式在跨任务、跨环境（包括 sim-to-real）和跨具身形态上均显著优于 baseline。FT 模式仅用仿真数据即可实现 sim-to-real 迁移，而 VLA baseline 失败。
  - **物理适应性**：仅通过调小解释器步长（无需重训模型）即可适应精细操作（如 peg insertion，ZS 成功率从 60% 升至 82%，而 $\pi_{0.5}$ 仅 18%）；支持动作组合和旋转外推。
  - **语义适应性**：支持推理密集型任务（如隐藏物体搜索，ZS 成功率 85%）和基于视频的上下文学习（ZS 成功率 100%）。
  - **消融实验**：验证了多视角引导、本体感觉、子任务规划等插件的必要性；证明带有明确物理约定的语义动作名称比纯符号或无约定的名称更有效，避免了模型从视觉变化中盲目推断动作物理效果的歧义。

### 40. 🔥 [DUET-DINO: Simultaneous Cross-View World Modeling for Latent Planning in Robot Manipulation] (DUET-DINO：用于机器人操作潜在规划的同步跨视角世界建模)
- **研究机构**: `原文未明确列出主要机构，致谢中提及德国埃尔朗根-纽伦堡大学 (FAU) 与德国机器人研究所 (RIG)`
- **Arxiv ID**: `2609.10506` | [点击跳转](https://arxiv.org/abs/2609.10506)

**0. 论文标题**
- **英文标题**: DUET-DINO: Simultaneous Cross-View World Modeling for Latent Planning in Robot Manipulation
- **中文标题**: DUET-DINO：用于机器人操作潜在规划的同步跨视角世界建模
- **研究机构**: 原文未明确列出主要机构，致谢中提及德国埃尔朗根-纽伦堡大学 (FAU) 与德国机器人研究所 (RIG)
- **一句话总结**: 提出了一种结合侧面与腕部双视角的潜在世界模型 DUET-DINO，通过跨视角注意力机制融合全局与局部特征，实现了基于全 7-DoF 动作空间的高精度零样本机器人操作规划。

**1. 整体逻辑**
- **研究任务**: 基于潜在世界模型的机器人零样本目标条件规划，特别是需要全 7-DoF（平移、旋转、夹爪）末端执行器控制的精细操作任务（领域：机器人操作/具身智能；类型：方法创新）。
- **研究动机**: 现有的单视角潜在世界模型（如 V-JEPA 2）主要只能捕捉短视界的粗粒度平移运动，对细粒度旋转和夹爪动作的预测不可靠，导致无法胜任需要全 7-DoF 控制的复杂操作任务（如特定角度抓取）。
- **本质改动**: 摒弃单视角或简单拼接双视角的做法，在潜在空间引入交叉注意力机制，让全局侧视角和局部腕视角的特征互相条件化（Cross-view conditioning），从而联合预测双视角的未来潜在状态。
- **技术溯源**: 基于冻结的 DINOv3 视觉编码器提取特征，预测器架构借鉴了 V-JEPA 2-AC，规划算法采用交叉熵方法（CEM）。

**2. 技术拆解**
- **核心方法**: 
  1. 特征提取：使用冻结的 DINOv3 编码器分别提取侧视和腕视图像的 patch 级潜在表示。
  2. 跨视角条件化：通过可学习的 Cross-Attention 模块，让每个视角的潜在特征作为 Query 去查询另一个视角的特征（Key/Value），实现信息互补。
  3. 动作条件预测：将融合后的特征与 7-DoF 动作及末端状态输入视角特定的预测头，预测下一时刻的潜在表示。
  4. 双视角规划：在部署时，使用 CEM 算法在双视角潜在空间中联合优化动作序列，通过最小化归一化的双视角目标代价来生成 7-DoF 动作。
- **关键细节**: 
  - 输入：8帧同步的侧视和腕视图像（224x224），以及 7 维动作（3维平移+3维旋转+1维夹爪）。
  - 模型结构：冻结的 DINOv3 (ViT-H+/16, 840M) 作为编码器；Cross-Attention 块和预测头从头训练。
  - 规模与超参：自回归 rollout 步长 K=2；CEM 规划时采样 800 个动作序列，保留 top-50 更新分布，迭代 2 次（仿真）/ 1 次（硬件）。
- **训练/优化目标**: 联合优化 Cross-Attention 和预测头。损失函数为双视角预测损失，包含单步 Teacher-forcing 的 L1 损失和 K=2 步自回归 Rollout 的 L1 损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：DROID (62,877 条轨迹) 和 RoboArena (5,856 条轨迹)。
  - 对比对象：单视角预测器（侧视/腕视）、独立双视角预测器（无 Cross-Attention）、官方 V-JEPA 2-AC checkpoint、以及使用 V-JEPA 2 编码器的 DUET-VJEPA。
  - 测试环境：RoboLab 仿真器（包含 Reach、Angled Reach、Angled Lift 任务）及真实 DROID 硬件（Franka 机械臂 + ZED 相机）。
- **评价指标**: 任务成功率（SR）、最终位置误差（FPE）、最终角度误差（FAE）。
- **主要结果**: 
  - 在 Reach 任务中，DUET-DINO 成功率达 92%（FPE 5.4cm），远超单视角和独立双视角基线。
  - 在强调旋转的 Angled Reach 任务中，成功率达 72.5%（FAE 22.7°）；在视觉分布偏移（换背景/加干扰物）下仍有 63% 成功率；真实硬件上达 26.7%（受限于 CEM 推理延迟）。
  - 在连续的 Angled Lift 任务中，成功率达 60%。
  - 表征分析表明，DINOv3 编码器比 V-JEPA 2 更好，因为 V-JEPA 2 的腕部预测器会低估细粒度动作引起的视觉动态变化，而 DINOv3 能更准确地捕捉动作条件的场景变化。

### 41. 🔥 [Frequency-Conditioned Flow Matching for Vision-Language-Action Models] (面向视觉-语言-动作模型的频率条件化流匹配)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.10405` | [点击跳转](https://arxiv.org/abs/2609.10405)

**0. 论文标题**
- **英文标题**: Frequency-Conditioned Flow Matching for Vision-Language-Action Models
- **中文标题**: 面向视觉-语言-动作模型的频率条件化流匹配
- **研究机构**: 原文未提及
- **一句话总结**: 提出 FreqFM 框架，将动作频率作为显式条件维度贯穿 Flow Matching 的源分布、训练目标和推理引导全流程，在不改变 VLA 骨干网络的情况下显著提升机器人动作生成的鲁棒性和平滑度。

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作（VLA）模型的机器人多步动作块（action chunk）生成。
- **研究动机**: 机器人动作是时间相关的轨迹，其频率成分能量分布极度不均（低频占主导，高频能量极小）。现有基于 Flow Matching 的 VLA 模型在时间坐标下生成动作，隐式学习频率特征会导致密集的跨时间步耦合，且无法显式利用这种频率异质性，导致高频细节（如精细位置对齐）难以被有效优化。
- **本质改动**: 将动作频率从隐式的轨迹属性提升为显式的条件维度，在离散余弦变换（DCT）频率坐标下重构 Flow Matching 的源分布、损失函数和无分类器引导（CFG）机制。
- **技术溯源**: 基于 Flow Matching 理论，具体实例化于 $\pi_0$ 和 $\pi_{0.5}$ 这两个 VLA 动作专家（Action experts），使用 LeRobot 代码库。

**2. 技术拆解**
- **核心方法**: 提出 FreqFM 框架，包含三个频率条件化模块：1) 频谱匹配源分布（Spectrum-Matched Source）；2) PSD 归一化自适应目标（PSD-Normalized Adaptive Objective）；3) 频谱传输预算的无分类器引导（STB-CFG）。
- **关键细节**: 
  - **输入输出**：输入视觉和语言条件，输出动作块（如 horizon H=10 或 30，维度 D）。对平滑动作维度应用 DCT-II 转换到频率坐标，推理后通过逆 DCT 恢复时域动作。
  - **模型结构**：即插即用，不修改 VLA 骨干网络（backbone），仅修改 Flow Matching 动作专家。
  - **规模与超参**：训练 20k 步，全局 batch size 64，2 张 A800 GPU。PSD 归一化指数 $\rho=0.25$，条件丢弃概率 $p_{drop}=0.05$。
- **训练/优化目标**: 在频率坐标下计算速度回归误差，先通过功率谱密度（PSD）归一化去除能量尺度影响（防止低频高能量主导损失），然后采用基于似然的多任务加权机制，为每个频率和自由度学习一个自适应的对数缩放因子（log scale），联合优化速度模型和缩放因子。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真使用 LIBERO, LIBERO-Plus, VLA-Arena；真机使用 AgiBot Expedition A2 平台的 6 个任务。
  - **对比对象（baseline）**：配对的时域 Flow Matching baseline（即原版 $\pi_0$ 和 $\pi_{0.5}$），以及 UniVLA, OpenVLA-OFT, $\pi_0$-Fast, GR00T N1, VLA-JEPA, FreqPolicy, RIPT-VLA, OpenVLA, Qwen3-VL-Fast, Motus 等。
- **评价指标**: 仿真和真机均使用成功率（Success Rate, SR），真机额外评估子任务成功率（Sub-SR）；消融实验中评估轨迹的平均绝对加加速度（mean absolute jerk）。
- **主要结果**: 
  - **仿真**：在 LIBERO-Plus 上提升最显著（$\pi_0$ 提升 5.5%，$\pi_{0.5}$ 提升 9.3%），尤其在 Camera、Robot、Noise 等 baseline 较弱的扰动下增益明显；在 VLA-Arena 上 Total 提升 2.6% 和 4.2%，但在 Extrapolation 类别上退化（因频谱先验是全局固定的，不随条件变化）。
  - **真机**：基于 $\pi_{0.5}$ 的平均 SR 从 57.8% 提升至 67.8%，在需要精细位置对齐的任务（如 Cup Stacking）上 SR 大幅提升 23.3%。
  - **消融**：Matched Source 贡献最大（移除掉 4.2%）；Transport Budget 对成功率影响较小（移除掉 1.9%），但能将执行轨迹的 mean absolute jerk 降低 56%（从 0.442 降至 0.193），显著提升动作平滑度。

**1. 整体逻辑**
- **研究任务**: 从视觉演示（特别是生成的视频）中学习通用灵巧手操作技能（如抓取、推拉、姿态调整），实现从高层视频规划到底层物理执行的闭环。
- **研究动机**: 真实世界视频包含大量噪声且缺乏3D物理状态，现有方法依赖昂贵的人工采集或只能处理少量视频，难以扩展（scalability）到大规模、多任务的灵巧控制；同时，直接将视频运动学参考映射到机器人动作缺乏物理可行性。
- **本质改动**: 将“视频生成模型”作为大规模、可控的运动参考数据源，结合“手-物联合重建”提取3D轨迹，并在仿真中用“多轨迹跟踪式RL”训练统一的底层控制器，打通从生成视频到物理执行的链路。
- **技术溯源**: 视频生成模型（Seedance 2.0）、感知模型（SAM2, MoGe-2, FoundationPose, WiLoR, HOI-DETR）、物理仿真器（Isaac Gym / PhysX）、RL优化器（SAPG）、手部模型（MANO）。

**2. 技术拆解**
- **核心方法**: GALATEA系统包含两阶段：1) 视频生成与3D手-物轨迹重建；2) 基于仿真的跟踪式RL训练与策略蒸馏。
- **关键细节**: 
  - **重建阶段**：用真实首帧RGB-D和语言提示生成视频。利用MoGe-2和首帧立体深度进行度量对齐；FoundationPose和WiLoR做初始位姿估计；最后通过联合手-物优化（包含轮廓匹配、接触损失、时间平滑等）精炼3D轨迹。
  - **RL训练阶段**：在Isaac Gym中仿真Sharp Wave Hand和Franka机械臂。对参考轨迹进行数据增强（扰动接近和接触后运动）。采用非对称Actor-Critic，Actor输入包含冗余的手-物相对几何误差以简化探索。
  - **策略蒸馏**：先按物体类别训练多个专家策略，再通过行为克隆和DAgger蒸馏成单一统一策略，以解决多轨迹训练的算力瓶颈和分布偏移。
- **训练/优化目标**: 
  - **重建优化目标**：最小化轮廓误差、关键点重投影误差、接触距离误差以及时间平滑惩罚。
  - **RL优化目标**：最大化包含手/物位姿跟踪、多指接触、抬起奖励及平滑/能耗正则化的综合奖励，使用SAPG（Split and Aggregate Policy Gradients）进行策略优化。

**3. 实验结果**
- **实验设置**: 
  - **重建评估**：在生成的视频（人工盲评）和真实数据集（H2O, HO-Cap）上与VideoManip, EgoInfinity, DO AS I DO对比。
  - **RL与仿真评估**：在42个训练物体和10个基准物体上，与PPO、Two-stage、ManipTrans、ReGrind、DO AS I DO对比。
  - **真实世界实验**：在4个未见任务（罐颈姿态调整、罐顶抓取移动、杯沿推、杯把拉）上进行闭环测试，共40次试验。
- **评价指标**: 
  - **重建**：ADD-S（物体对齐）, MRRPE（相对几何）, CDev（接触偏差）, 人工排名。
  - **RL仿真**：成功率（基于位姿和关键点误差阈值），跟踪误差（位置、旋转、手部关键点）。
  - **真实世界**：任务成功率。
- **主要结果**: 
  - **重建**：人工评估中87%排名第一；在H2O和HO-Cap上取得最佳综合排名和最低的ADD-S（分别为4.82 cm和3.88 cm）。2500个生成视频中成功重建约2000个（83%），远超现有方法在野生视频中的有效率。
  - **RL仿真**：专家策略在42个训练物体上平均成功率78.6%；蒸馏策略在未见轨迹和新物体上分别达到66.6%和54.2%。在10个基准物体上，比ManipTrans平均高13.2%，跟踪误差（位置和手部）最低。
  - **真实世界**：在40次未见视频规划测试中，总体成功率达到67.5%（27/40），成功实现了多种抓取和非抓握操作（non-prehensile manipulation）。

### 43. 🔥 [RoboDrop: Curating VLA Post-Training Data via Local Gradient Compatibility] (RoboDrop：通过局部梯度兼容性筛选VLA后训练数据)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.10021` | [点击跳转](https://arxiv.org/abs/2609.10021)

**0. 论文标题**
- **英文标题**: RoboDrop: Curating VLA Post-Training Data via Local Gradient Compatibility
- **中文标题**: RoboDrop：通过局部梯度兼容性筛选VLA后训练数据
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RoboDrop 框架，在 VLA 模型后训练的 warm-up 阶段，通过计算候选数据与“语义+视觉”局部匹配的验证数据之间的梯度兼容性，在线评估并自动过滤低质量轨迹，显著提升真实机器人任务的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型后训练（post-training）阶段的数据清洗与质量筛选。
- **研究动机**: VLA 后训练对数据质量极度敏感，但真实收集的机器人数据常包含局部错误（如执行失误、传感器漂移、时间戳不对齐）。现有方法要么依赖人工，要么只能做粗粒度筛选（如看轨迹长度或全局检索相似度），无法精准识别局部不可靠的“观测-动作”对，且难以适应未知的数据污染率。
- **本质改动**: 摒弃全局或静态 checkpoint 的验证梯度参考，改为在训练过程中动态构建“任务语义+视觉上下文”匹配的局部验证梯度参考，以此计算候选样本的梯度兼容性来评估数据质量。
- **技术溯源**: 基于 Flow-matching VLA 架构（如 $\pi_{0.5}$-Base, GR00T, X-VLA），使用 T5 提取指令语义特征，DINO 提取视觉特征，以及 CountSketch 进行梯度压缩。

**2. 技术拆解**
- **核心方法**: RoboDrop 数据筛选框架。在单 epoch 的 warm-up 训练中，对每个候选样本，先通过 T5 和 DINO 检索出语义和视觉最相似的局部验证样本，计算这些验证样本的加权梯度作为“局部参考梯度”；然后计算候选样本梯度与该参考梯度的余弦相似度作为质量得分；最后将得分聚合到轨迹（episode）级别，并通过基于 BIC（贝叶斯信息准则）的高斯混合模型自动决定过滤阈值。
- **关键细节**: 
  - **局部参考构建**：用 T5 匹配任务指令，用冻结的 DINO 特征计算视觉相似度，取 Top-K（默认 $K_{vis}=10$）验证样本，用 softmax 加权聚合其梯度。
  - **在线打分**：warm-up 训练每 $M$ 步（默认 200 步）刷新一次验证梯度缓存，候选样本在进入 minibatch 时计算一次得分，捕捉训练动态。
  - **梯度压缩**：仅对 action expert 参数求梯度，并用 CountSketch 压缩到 4096 维以节省显存。
  - **自动过滤**：用 BIC 准则在单高斯和双高斯混合模型中选择，若为双高斯，则过滤掉属于低分组件且后验概率大于阈值 $q=0.8$ 的轨迹，无需预设过滤比例。
- **训练/优化目标**: 核心机制基于影响函数（Influence functions）的一阶近似。通过最大化候选样本梯度与局部验证梯度的余弦相似度（方向一致性），来代理验证集 loss 的下降，从而评估该样本对后训练策略更新的贡献。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO（合成时间/动作损坏）、Robomimic-MH（人类遥操作自然次优演示）、Real-robot（真实机械臂非专家收集数据）。
  - **对比基线 (Baseline)**：Episode Length, Behavior Retrieval, DataMIL, Scizor, QoQ。
  - **基座模型**：主要使用 $\pi_{0.5}$-Base，也测试了 GR00T 和 X-VLA。
- **评价指标**: 区分好坏数据的 AUROC 和 Best balanced accuracy；下游策略的实际 rollout 成功率 (Success rate)。
- **主要结果**: 
  - 在 LIBERO 合成损坏数据上，RoboDrop 区分时间/动作损坏的 AUROC 分别达到 96.1% 和 98.7%，后训练成功率从 84.0%/91.3% 提升至 91.6%/95.1%。
  - 在 Robomimic-MH 自然次优数据上，平均 AUROC 达 88.33%，比最强 baseline (QoQ 的 83.67%) 高出近 5 个点。
  - 在真实机器人数据上，识别非专家数据的 AUROC 高达 98.38%。
  - 真实机器人下游任务中，使用 RoboDrop 筛选数据后，平均 rollout 成功率从 35.0% (未过滤) 提升至 63.75% (固定过滤 20%) 或 67.5% (BIC 自动过滤)。

### 44. 🔥 [JEPA Policy: Diffusion-Free Imitation Learning via Paired Action and Future Representation Prediction] (JEPA Policy：通过配对动作与未来表示预测的无扩散模仿学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.09630` | [点击跳转](https://arxiv.org/abs/2609.09630)

**0. 论文标题**
- **英文标题**: JEPA Policy: Diffusion-Free Imitation Learning via Paired Action and Future Representation Prediction
- **中文标题**: JEPA Policy：通过配对动作与未来表示预测的无扩散模仿学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种无扩散的机器人模仿学习框架，在同一个共享Transformer中联合预测动作和对应的未来观测表示，在保持极低推理延迟的同时显著提升了操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人模仿学习（从专家演示中学习视觉运动策略，完成抓取、推动、插入等复杂操作任务）。
- **研究动机**: 标准行为克隆只监督动作，忽略了动作导致的未来状态，容易因分布偏移积累误差；Diffusion Policy 等生成式策略虽能处理多模态，但需要多步迭代去噪，推理延迟极高；现有的 JEPA 方法（如 ACT-JEPA）使用独立分支预测未来，动作与未来路径耦合松散，且纯自监督 JEPA 容易表示坍塌，需要依赖 EMA 等额外机制。
- **本质改动**: 将动作序列和对应的未来观测表示作为配对目标，放在同一个共享的 Transformer 中进行联合预测，并利用动作监督作为任务驱动的抗坍塌约束，同时采用无扩散的两步粗到细推理机制，彻底摆脱迭代采样。
- **技术溯源**: 基于 MIP (Minimal Iterative Policy) 的两步预测机制，结合了 JEPA (Joint Embedding Predictive Architecture) 的未来表示预测思想；视觉编码器默认使用 ResNet-18（端到端训练），也支持冻结的 DINOv2。

**2. 技术拆解**
- **核心方法**: 
  1. **共享 Transformer 联合预测**：将动作 token 和未来表示 token 拼接在同一个序列中，在每一层进行无掩码的自注意力交互，让未来预测目标在训练时直接塑造生成动作的表示。
  2. **MIP-style 两步无扩散推理**：第一步输入零向量预测粗粒度结果，第二步输入加噪目标（训练时）或第一步输出（推理时）进行细化。只需两次前向传播，无需扩散模型的长链去噪。
  3. **任务驱动抗坍塌**：利用动作预测损失约束共享表示，防止表示坍塌，无需 EMA 目标编码器或显式方差正则化。
- **关键细节**: 
  - **输入输出**：输入当前观测（图像+本体感觉），输出动作序列（Horizon $H=10$ 或 $16$）和未来观测表示（Horizon $k=4$）。
  - **模型结构**：共享 Transformer 策略网络（约 44.0M 参数），包含观察编码器、动作/未来输入 token、共享 Transformer 主干、两个预测头。
  - **关键超参**：插值参数 $\tau=0.9$，未来损失自适应权重比例 $\rho=0.10$。
- **训练/优化目标**: 
  - **联合损失函数**：动作预测的均方误差（MSE） + 未来表示预测的目标归一化均方误差（NMSE）。
  - **两步训练目标**：第一步和第二步的残差分别按区间长度（$\tau$ 和 $1-\tau$）缩放后进行联合优化，自适应调整两项损失的权重比例。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：9个仿真操作任务（来自 LIBERO, robomimic, MimicGen 基准，基于 robosuite/MuJoCo）；5个实机操作任务（使用双臂 ARX-5 机器人）。
  - **对比对象（Baseline）**：MIP (仅动作), Diffusion Policy (100步 DDPM), Dual-independent (ACT-JEPA 风格的独立分支), Dual-cross (交叉注意力分支)。
- **评价指标**: 任务成功率（Success rate），推理延迟（Latency/ms），表示坍塌审计指标（TE32 等），部署诊断的 AUROC。
- **主要结果**: 
  - **仿真性能**：9个任务平均成功率比 MIP 提升 5.6 个百分点（77.4% -> 83.0%），全面超越 Diffusion Policy（75.1%）。
  - **推理延迟**：平均决策延迟仅 13.2 ms，比 100步 Diffusion Policy (439.5 ms) 快 33 倍，仅比 MIP 慢 0.29 ms。
  - **消融实验**：证明性能提升核心来自于“共享注意力拓扑”（Shared stack），独立分支（Dual-independent）即使参数量更大也没有带来提升，说明未来目标必须进入动作生成的计算图中才有效。
  - **实机表现**：5个任务 pooled 成功率达到 66.9%，显著优于 MIP (54.7%) 和 Diffusion Policy (DP-16: 31.8%, DP-100: 18.7%)。
  - **诊断信号**：未来一致性误差（Future-consistency error）在测试中能有效区分成功与失败 episode（AUROC > 0.5），可作为部署时的风险监测和人工干预触发信号。

**1. 整体逻辑**
- **研究任务**: 在严格的力预算（最大接触力不超过8N）约束下，结合视觉和触觉信号完成刚性盒子的抓取与抬起任务。
- **研究动机**: 现有的视触觉世界模型预测指标好，但不一定能改善力约束控制（预测准不代表动作效果预测准，策略可能超限或奖励饱和）。需要剥离并诊断感知、想象策略优化、反馈保护等模块在力约束任务中的真实决策贡献。
- **本质改动**: 不提出新网络架构，而是设计了一套极其严格的受控实验协议（冻结数据、控制器和测试条件），将紧凑世界模型管线与反应式离线RL进行正交对比，并分离了“模型辅助动作选择”与“实测力硬保护”的独立贡献。

**2. 技术拆解**
- **核心方法**: 构建了一个包含紧凑视触觉世界模型（WM）、行为克隆（BC）、想象强化学习（WM-RL）以及独立反应式IQL的对比管线。在控制端，设计了共享的反应式基线控制器，并正交组合了“基于5步开环预测的模型辅助动作选择器”和“基于实测力的安全护栏（guard）”。
- **关键细节**: 
  - 输入输出：输入为3个64x64 RGB图像、6维触觉（法向/切向力）和9维本体感觉；输出为2维动作（垂直位移和夹爪速率）。
  - 模型规模：WM仅652,157个参数；反应式IQL总训练参数约785,751个。
  - 任务约束：要求物体相对抬起0.1m，且整个episode（含下降阶段）最大法向力≤8N。
- **训练/优化目标**: 
  - WM训练：联合优化力、高度预测的Huber损失，支撑/接触的二分类损失，RGB重建及隐空间一致性。
  - WM-RL优化：在想象轨迹中最小化负折扣回报，采用高度对齐且包含力惩罚的奖励函数，并约束与冻结BC先验的MSE偏差。
  - IQL优化：基于真实转移数据，使用expectile value和优势加权策略目标。

- **实验设置**: 在MuJoCo中扩展的robosuite Panda Lift环境。包含120个测试环境（涵盖同分布ID、几何OOD、物理参数OOD及混合OOD），以及12个用于独立动作分支重放的ID环境。对比基线包括脚本控制、力反馈、纯反应式控制、WM-BC、WM-RL和IQL等。
- **评价指标**: 核心指标为“联合成功率”（Joint success，即成功抬起且全程最大力≤8N），辅以严格抬起率和力违规率；预测层面评估端点力/峰值力的MAE及动作效果（action-effect）MAE。
- **主要结果**: 
  - 模型辅助选择在ID环境下将联合成功率从73.3%提升至93.3%（+20.0个百分点），几何OOD下也有显著提升，但提升主要来源于减少了“脚本下降阶段”的力违规；在物理参数OOD下表现不如反应式基线，池化（Pooled）整体提升不显著。
  - 想象RL（WM-RL）的池化联合成功率（11.9%）显著低于反应式IQL（25.0%）。
  - 世界模型在预测“动作效果”上优于持久性（persistence）基线（MAE从0.413N降至0.338N），但绝对力预测误差与持久性基线相近。
  - 实测力保护护栏（guard）触发极其稀疏，未能证明其具有实际的力保护收益。

### 46. 🔥 [Identifying Habit, Physics, and Nuisance in Robot World Models] (机器人世界模型中的习惯、物理与干扰因素识别)
- **研究机构**: `Harvest Praxis（注：原文未在作者列表标明机构，致谢中提及）`
- **Arxiv ID**: `2609.09210` | [点击跳转](https://arxiv.org/abs/2609.09210)

**0. 论文标题**
- **英文标题**: Identifying Habit, Physics, and Nuisance in Robot World Models
- **中文标题**: 机器人世界模型中的习惯、物理与干扰因素识别
- **研究机构**: Harvest Praxis（注：原文未在作者列表标明机构，致谢中提及）
- **一句话总结**: 本文是一篇机器人学习与世界模型方向的方法与理论分析工作，通过结构因果模型将操作员习惯、物理动力学和视觉干扰解耦，提出在少样本适应时冻结共享物理动力学并仅微调薄接口，从而提升模型在数据稀缺或受污染情况下的迁移鲁棒性。

**1. 整体逻辑**
- **研究任务**: 解决机器人世界模型和模仿学习中，由于操作员习惯、物理规律和视觉干扰（如光照、相机视角）纠缠导致的预测多模态和少样本适应脆弱的问题。
- **研究动机**: 现有的单一预测器 $P(o'|o)$ 会将操作员习惯（动作选择偏好）、共享物理（状态转移）和观测干扰（外观变化）混为一谈。这导致模型在微调时，容易为了拟合新用户的习惯或新相机的外观而破坏原有的物理动力学规律，造成适应脆弱。
- **本质改动**: 引入结构因果模型（SCM）将习惯、物理和干扰进行因果解耦，并据此提出“冻结共享物理动力学，仅微调策略/残差接口”的少样本适应规则，而不是从头训练或全参数微调。
- **技术溯源**: 基于结构因果模型（SCM），在仿真环境（ManiSkill StackCube）、本体感觉数据集（DROID, RH20T）以及视觉数据集（DROID exterior RGB）上进行验证。涉及世界模型（World Models）、模仿学习（Imitation Learning）和物理动力学建模。

**2. 技术拆解**
- **核心方法**: 提出一个结构因果模型 $a = g(h, z, u)$, $z' = f(z, a)$, $o = r(z, c)$。其中 $h$ 是习惯，$u$ 是指令接口，$c$ 是干扰。基于此设计干预实验（如固定状态打乱动作、更换操作员、改变外观）来验证解耦。在适应阶段，冻结物理动力学 $f$（或视觉编码器），只训练薄接口 $g$ 或残差 $\delta$。
- **关键细节**: 
  - 本体感觉与核模型：在StackCube中使用物理核（编码器输出 $z_p$，动力学 $f$，指令到动作的映射 $g$）；在DROID/RH20T使用MLP $f(j,a) \mapsto j'$。
  - 像素模型：通过结构读出 $z = Enc(o)$，预测关节 $\hat{j} = probe(z)$，下一步关节 $\hat{j}' = \hat{j} + delta(z,a)$。
  - 干预设计：物理面读出强调下一步状态误差（打乱动作）；习惯面读出强调策略残差和排序（反向打分）。
- **训练/优化目标**: 
  - 像素模型训练目标：对齐 $probe(z)$ 到当前关节，通过 $delta$ 回归下一步关节，并施加一个铰链损失（hinge loss）要求打乱动作必须增加误差。可加入轻量级外观一致性项。保留 $||\Delta j||$ 上分位数的转移以避免空闲帧主导。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**: 使用 ManiSkill StackCube（仿真），DROID（本体感觉与外部RGB），RH20T（多操作员本体感觉）。对比基线为“冻结动力学+训练接口（freeze）”、“全参数微调（finetune）”和“从头训练（scratch）”。
  - **测试环境与负载**: 少样本适应（如N=16, 32, 64, 128），受污染数据适应（动作放大2倍），多步预测，反向打分，跨相机评估。
- **评价指标**: 动作/外观干预下的下一步状态/关节均方误差（MSE）比率，操作员识别准确率，反向打分的后验质量提升（mass lift），闭环任务成功率（StackCube stacked success）。
- **主要结果**: 
  - **归因验证**: 在固定状态下打乱动作会使下一步状态误差急剧增加（StackCube约10.4倍，DROID约13倍，RH20T约1362倍），而外观改变对误差影响极小（约0.99倍），验证了物理与干扰的解耦。
  - **少样本适应**: 在N=16~64等少样本情况下，“冻结+微调接口”的误差显著低于“从头训练”，且与“全参数微调”持平或更优。在StackCube闭环中，N=128时freeze成功率0.22，scratch为0.10。
  - **抗污染能力**: 当适应数据被故意污染（动作放大2倍）时，冻结物理动力学能保持干净的物理误差（比全参数微调好约两个数量级），因为全参数微调会把错误的习惯吸收进动力学中。
  - **视觉与多步**: 在DROID像素输入中，冻结编码器和probe仅微调delta在低样本下优于scratch；多步预测中，动作误差随步数累积，而外观干扰不累积。

### 47. 🔥 [Time-Frequency Geometric Cross-Attention for Chunked Vision-Language-Action Models] (面向分块视觉-语言-动作模型的时频几何交叉注意力)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.09925` | [点击跳转](https://arxiv.org/abs/2609.09925)

**0. 论文标题**
- **英文标题**: Time-Frequency Geometric Cross-Attention for Chunked Vision-Language-Action Models
- **中文标题**: 面向分块视觉-语言-动作模型的时频几何交叉注意力
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种即插即用的时频几何交叉注意力模块（TFGCA），通过小波变换解耦动作块的多尺度频率特征，并引入楔积（wedge product）补充点积对正交关系的敏感性，显著提升了VLA模型在分布外（OOD）条件下的动作预测鲁棒性。

**1. 整体逻辑**
- **研究任务**: 改进视觉-语言-动作（VLA）模型中动作块（action chunk）的表征与解码方式，提升机器人连续动作预测的准确性与泛化能力。
- **研究动机**: 现有VLA模型将动作块视为无结构的通用隐藏token序列，忽略了动作轨迹的两个核心物理结构：1）频率结构（全局平滑趋势与局部高频修正动作纠缠在单一token中）；2）跨阶段几何关系（不同操作阶段如到达、接触、抓取在表征空间中近乎正交，而传统的点积注意力对正交关系最不敏感，导致模型需要绕弯学习跨阶段依赖）。
- **本质改动**: 在VLA的Transformer输出和动作头之间插入一个即插即用模块，利用平稳小波变换（SWT）将动作分解为时频token，并设计一种结合点积（相似度）和楔积（正交敏感度）的几何交叉注意力机制。
- **技术溯源**: 基于 Flow-matching VLA（如 $\pi_{0.5}$），结合了时间序列预测中的平稳小波变换（SWT）与几何代数中的楔积（wedge product）概念。

**2. 技术拆解**
- **核心方法**: TFGCA（Time-Frequency Geometric Cross-Attention）模块，包含三个主要阶段：1）动作空间投影，将隐藏token映射到具有物理意义的控制维度空间；2）逐维度可学习平稳小波变换（SWT）分词，将每个控制维度的轨迹分解为多分辨率的时频token；3）点积+楔积交叉注意力，时间token作为Query，时频token作为Key/Value，通过可学习权重融合点积和楔积注意力分数。
- **关键细节**: 
  - 输入输出：输入为Transformer输出的隐藏动作token，输出为融合后的 refined tokens。
  - 模型结构：使用 Daubechies-2 (db2) 可学习小波基，进行逐维度的去直流（DC removal）和可选的差分预处理。交叉注意力中，点积和楔积分别计算并经过各自的 softmax 后，通过一个全局可学习标量 $\beta$ 进行混合。
  - 零初始化残差：输出投影矩阵零初始化，确保模块在初始状态下等价于恒等映射，不破坏预训练权重，且仅增加约 4.23M 参数（约占 $\pi_{0.5}$ 骨干的 0.10%）。
- **训练/优化目标**: 主要的损失函数为 Flow-matching 损失，加上一个辅助的动作空间对齐损失（使用 stop-gradient 的 ground-truth action 作为目标，监督动作空间投影层）。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象（baseline）：主要对比同源复现的 $\pi_{0.5}$ 基线模型。使用的数据集包括 LIBERO（包含 Spatial, Object, Goal, Long 四个 suite）、LIBERO-Plus（7种 OOD 扰动）、RoboTwin 2.0（clean 和 domain randomization）、以及 AgiBot A2 真实机器人数据集（3个任务）。
  - 测试环境：仿真环境（基于 LeRobot 框架）与真实机器人（AgiBot A2）。
- **评价指标**: 任务成功率（Success Rate, SR%）。
- **主要结果**: 
  - LIBERO（近饱和的 ID 场景）：平均成功率提升 +1.5%（从 96.7% 到 98.2%）。
  - LIBERO-Plus（OOD 场景）：总成功率提升 +6.3%（从 66.7% 到 73.0%），在 Noise、Robot、Camera 等困难扰动上提升显著。
  - RoboTwin 2.0：clean 场景平均提升 +3.7%，domain randomization（零样本 OOD）场景平均大幅提升 +28.5%（从 14.2% 到 42.7%）。
  - AgiBot A2 真实机器人：3个任务的整体成功率提升 +11.67 个百分点（从 50.00% 到 61.67%），其中“抽纸巾”任务提升最大（+15 个百分点）。

- **英文标题**: UniMPA: A Unified Memory-Prediction-Action Model via Action-Grounded Transition Modeling
- **中文标题**: UniMPA：通过基于动作的转换建模实现统一的记忆-预测-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 UniMPA 模型，通过统一的“基于动作的转换接口”将未来预测、双向记忆检索和动作生成耦合起来，解决了 VLA 模型中状态转换歧义和物理不可执行的问题，在多个仿真和真机任务上以极少的训练 epoch 达到了 SOTA。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型在机器人操作任务中的策略学习（即从视觉观察到物理动作的映射）。
- **研究动机**: 现有 VLA 模型在从观察到动作的学习中存在“转换可实现性差距”，具体表现为三个耦合问题：1）转换歧义（视觉相似的场景可能处于不同操作阶段，隐含不同的后续转换）；2）预测-执行不匹配（预测出的未来画面在视觉上合理，但物理上无法通过连贯的动作序列实现）；3）经验-实现不匹配（历史上可执行的动作模式在当前场景的几何或接触条件下可能失效）。
- **本质改动**: 不再将预测、记忆和动作生成作为独立的辅助模块，而是设计了一个共享的“基于动作的转换接口”（action-grounded transition interface）。让未来预测指导记忆检索，记忆检索为动作生成提供物理上可执行的先验，并在当前场景下进行自适应微调，形成“预测-锚定-细化”的闭环。
- **技术溯源**: 基于 $\pi_{0.5}$ 基座模型（包含 PaliGemma-2B 视觉语言骨干和 Gemma 动作专家），结合了 V-JEPA 2（用于潜在视觉特征预测）和 Mamba（用于时序记忆建模）。

**2. 技术拆解**
- **核心方法**: 
  1. **持续-选择性未来预测**（解决转换歧义）：使用持续的潜在流（latent stream）跟踪任务级进度，同时通过一个触发门（Trigger Gate）在发生关键交互（如接触、释放、夹爪状态改变）时选择性激活像素级预测，捕捉细粒度交互变化。
  2. **双向视觉-动作记忆库**（解决预测-执行不匹配）：用预测的转换特征去查询“视觉-动作记忆库”，检索历史上成功实现的视觉-动作轨迹作为可执行证据；同时用历史动作查询“动作-视觉记忆库”，获取带有视觉语义的动作原型。
  3. **原型偏置流**（解决经验-实现不匹配）：不直接复制执行检索到的历史动作，而是将其作为流匹配（Flow-matching）生成的初始偏置，将流源向历史支持的动作流形偏移，再结合当前上下文进行细化。
- **关键细节**: 
  - **模型结构**：引入 World Expert（18层 Transformer，16个可学习的 world tokens），与 Action Expert 通过分层共享注意力机制进行逐层交互。推理时缓存 World Expert 的 KV，避免重复计算。
  - **记忆库设计**：隐藏维度 512，使用 2层 Stateful Mamba 进行时序建模，最大因果历史长度为 32，检索使用余弦相似度。
  - **触发门机制**：当潜在变化分数超过阈值（20%-50%），或检测到平移、旋转、夹爪状态变化时，激活像素级未来预测。
- **训练/优化目标**: 
  - 分两阶段训练。Stage 1 预训练记忆库，优化目标包括视觉/动作未来重建损失、检索损失和跨模态对齐损失。
  - Stage 2 冻结记忆库微调策略，优化目标包括潜在未来特征重建（基于冻结的 V-JEPA 2 特征）、选择性像素未来重建以及动作生成的流匹配损失。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：LIBERO（基础操作）, LIBERO-Plus（7种零样本扰动泛化）, RoboTwin 2.0（双臂复杂操作）, VLABench（语义与长程操作）。
  - **真实世界平台**：GALAXEA R1 Lite 和 AgileX Cobot Magic（两款双臂移动机器人），涵盖 7 大类 21 个操作任务套件。
  - **对比对象（Baseline）**：OpenVLA, OpenVLA-OFT, $\pi_0$, $\pi_{0.5}$, Fast-WAM, MemoryVLA, X-VLA, DreamVLA 等主流 VLA 及预测/记忆增强模型。
- **评价指标**: 仿真环境使用任务成功率（Success Rate）；真实世界使用任务成功率（TSR，最终检查点）和累积成功率（CSR，所有中间检查点的进度汇总）。
- **主要结果**: 
  - **LIBERO**：平均成功率 98.6%（比 $\pi_{0.5}$ 高 1.7 个百分点），且仅使用了 $\pi_{0.5}$ 25% 的训练 epoch。
  - **LIBERO-Plus**：零样本泛化平均成功率 85.3%（比 $\pi_{0.5}$ 高 11.7 个百分点），性能下降幅度最小。
  - **RoboTwin 2.0 Hard**：在随机化困难设置下，比 $\pi_{0.5}$ 高 18.5 个百分点。
  - **真实世界**：在 GALAXEA 平台上 TSR 达 77.7%，在 AgileX 平台上 TSR 达 74.9%（比 $\pi_{0.5}$ 高 12.6 个百分点）。整体训练预算仅为基线模型的 25%-50%。

### 49. 🔥 [Memory as Plans: World-Action Modeling with Memory-Grounded Planning] (记忆即计划：基于记忆锚定规划的世界-动作建模)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.11561` | [点击跳转](https://arxiv.org/abs/2609.11561)

**0. 论文标题**
- **英文标题**: Memory as Plans: World-Action Modeling with Memory-Grounded Planning
- **中文标题**: 记忆即计划：基于记忆锚定规划的世界-动作建模
- **研究机构**: 原文未提及
- **一句话总结**: 提出 MaP-WAM 框架，将长程多模态记忆解耦为“记忆锚定规划”和“计划条件执行”，通过联合预测动作与执行进度，在保持执行器上下文固定和推理延迟恒定的同时，大幅提升了非马尔可夫机器人操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 解决依赖长期记忆的复杂机器人操作任务（非马尔可夫决策过程），即当前观测不足以做出正确决策，必须利用历史视觉和语言信息的任务。
- **研究动机**: 现有处理长程记忆的方法存在两难：使用语言摘要会丢失细粒度的视觉和空间证据；使用不断增长的视觉窗口则会导致推理延迟和显存随历史长度线性爆炸，无法兼顾长程记忆保留与执行效率。
- **本质改动**: 将“处理长程视觉历史”与“短程动作生成”解耦。不再让执行器直接读取所有历史帧，而是把长程记忆压缩为“记忆锚定的计划（语言计划+视觉计划）”，让执行器只依赖固定的当前计划进行动作生成，从而打破历史长度对推理效率的限制。
- **技术溯源**: 语言规划基于 Qwen3.5-4B；视觉规划（CWM）和执行器（WAP）的视频专家基于 WAN-2.2-5B；整体架构采用了 Mixture-of-Transformers (MoT) 和条件流匹配 (Conditional Flow Matching)。

**2. 技术拆解**
- **核心方法**: MaP-WAM (Memory-as-Plans) 框架。核心包含三个机制：1) 结构化多模态情景记忆（将历史按片段压缩为稀疏视觉帧和语言指令）；2) 记忆锚定规划（VLM生成语言计划，因果世界模型CWM生成视觉计划）；3) 进度感知的执行与闭环（WAP模型联合预测动作和进度，通过计划-观测对齐校准进度，触发片段转换）。
- **关键细节**: 
  - **记忆表示**：每个完成的片段记录包含语言指令和8帧均匀采样的稀疏视觉上下文。
  - **规划阶段**：VLM (Qwen3.5-4B) 预测下一段语言计划；CWM (基于WAN-2.2) 使用 block-causal mask 生成视觉计划，已完成片段的 KV 状态可被缓存。
  - **执行阶段**：WAP 模型（MoT架构，视频专家5B，动作专家1.02B，进度专家207M）。输入当前观测、本体状态和当前进度，联合预测未来视觉动态、动作块（预测 horizon=32，实际执行前8个）和进度序列。
  - **闭环控制**：通过计算当前观测与视觉计划帧的像素差异来校准预测进度，防止长程累积误差。进度均值超过阈值（0.95）时触发片段转换，更新情景记忆并重新规划。
- **训练/优化目标**: 采用条件流匹配 (Conditional Flow Matching, FM)。规划阶段 CWM 优化视觉计划的 FM loss；执行阶段 WAP 联合优化未来视觉状态、动作块和进度序列的 FM loss（三者权重均设为 1.0）。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：RMBench（包含依赖单次历史 M(1) 和多次历史 M(n) 的长程记忆操作任务）。
  - **真机环境**：7-DoF Franka Research 3 机械臂，配备第三视角和腕部 RealSense D435i 相机。任务包括 Find Button 和 Press Buttons。
  - **对比 Baseline**：DP, $\pi_{0.5}$, X-VLA, Mem-0, WLA-0, LingBot-VA。
- **评价指标**: 任务成功率 (Success rate) 和 推理延迟/显存占用 (Inference latency / GPU memory)。
- **主要结果**: 
  - **仿真表现**：在 RMBench 上达到 83.3% 的平均成功率，显著优于所有 Baseline（如 LingBot-VA 的 77.1%）。在需要精确记忆和状态解歧的困难任务（如 Swap T, Press Button）上达到 96% 的成功率。
  - **真机表现**：在 Find Button 和 Press Buttons 任务上分别达到 88% 和 68% 的成功率（平均 78.0%），而 Baseline 在复杂的 Press Buttons 任务上基本失败。
  - **效率优势**：得益于固定上下文和 KV cache，执行器每个动作块的推理延迟保持在约 827ms 恒定；而全上下文方法在 1500 帧时延迟增加 4 倍，在 1700 帧时显存超限（OOM）。

### 50. 🔥 [IMLE-VLA: Fast Single-Step Action Generation for Vision-Language-Action Policies] (IMLE-VLA：视觉-语言-动作策略的快速单步动作生成)
- **研究机构**: `原文未提及（致谢中提及受加拿大NSERC、CIFAR AI等机构资助，未列出具体高校名称）`
- **Arxiv ID**: `2609.10915` | [点击跳转](https://arxiv.org/abs/2609.10915)

**0. 论文标题**
- **英文标题**: IMLE-VLA: Fast Single-Step Action Generation for Vision-Language-Action Policies
- **中文标题**: IMLE-VLA：视觉-语言-动作策略的快速单步动作生成
- **研究机构**: 原文未提及（致谢中提及受加拿大NSERC、CIFAR AI等机构资助，未列出具体高校名称）
- **一句话总结**: 用基于条件隐式最大似然估计（cIMLE）的单步生成器替换VLA策略中多步迭代的扩散/流匹配动作头，在消除推理延迟的同时避免模式崩溃，大幅提升了机器人的控制频率和任务成功率。

**1. 整体逻辑**
- **研究任务**: 加速视觉-语言-动作（VLA）策略的推理过程，解决连续动作生成带来的高延迟和机器人控制卡顿（stop-and-go）问题。
- **研究动机**: 现有的VLA（如 $\pi_{0.5}$）用扩散或流匹配生成连续动作，需要多步迭代采样（如10步Euler步），导致推理慢，机器人控制循环中需要等待模型计算，产生卡顿。如果直接换成单步回归头，又会在多模态动作分布下发生模式崩溃（mode collapse），退化为输出条件均值，导致任务失败。
- **本质改动**: 抛弃多步迭代采样，改用条件隐式最大似然估计（cIMLE）训练一个单步条件生成器作为动作头。通过引入多噪声采样和最近邻分配机制，在单次前向传播中实现多模态动作覆盖，把算法层面的多步瓶颈直接抹平。
- **技术溯源**: 基于预训练的视觉-语言模型（VLM）骨干网络（具体为 $\pi_{0.5}$ 的3B骨干），以及条件隐式最大似然估计（cIMLE）理论。

**2. 技术拆解**
- **核心方法**: 提出 IMLE-VLA 框架。冻结VLM骨干网络，仅训练一个轻量级的单步动作头。动作头接收VLM的特征嵌入和高斯噪声，单次前向传播直接输出动作块（action chunk）。训练时采用 cIMLE 目标函数来保证多模态覆盖。
- **关键细节**: 
  - **输入输出**: 输入为视觉和语言指令（经VLM编码为特征嵌入）及高斯噪声；输出为动作块 $A \in \mathbb{R}^{C \times D}$。
  - **模型结构**: 冻结的VLM骨干（3B参数） + 从 $\pi_{0.5}$ 动作头初始化的轻量级单步生成器 $G_\theta$。
  - **关键超参**: 样本因子 $m$（每个训练样本生成的候选动作数），实验取 $m=2$ 兼顾效果与效率；执行 horizon $H$（每次前向传播后开环执行的动作数），仿真取 $H=10$ 或 $30$，真机取 $H=12$。
- **训练/优化目标**: cIMLE 损失函数，分两步交替进行：1) 无梯度分配步：对每个真实动作，从 $m$ 个候选动作中找出L2距离最近的候选；2) 更新步：仅计算真实动作与分配到的最近候选动作之间的L2距离并反向传播更新生成器。这避免了 $m=1$ 时退化为普通L2回归导致的模式崩溃。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**: 仿真使用 LIBERO 基准（40个桌面操作任务）和带测试时扰动的 LIBERO-plus；真机使用 Franka Emika Panda 机械臂，测试4个桌面任务（单步、多步、动态反应），训练数据为 DROID。
  - **对比对象 (Baseline)**: $\pi_{0.5}$（JAX原版、PyTorch+compile、Triton优化版）、$\pi_0$、OpenVLA-OFT、CogVLA、SmolVLA、Shallow-$\pi_{0.5}$-L9、Shallow-$\pi_{0.5}$-L6。
  - **硬件**: 仿真推理测试在 NVIDIA L40S GPU；真机测试在 NVIDIA A6000 GPU。
- **评价指标**: 
  - **推理效率**: 推理频率（Hz）和动作吞吐量（推理频率 $\times H$）。
  - **任务质量**: 任务成功率（%）。
  - **延迟指标**: VLA纯推理时间（VLA-WC，每个成功episode中纯VLA前向传播的耗时）。
  - **平滑度**: 本体感知加加速度（Proprioceptive jerk）。
- **主要结果**: 
  - **推理效率**: 在 L40S 上推理频率达 55 Hz，比 $\pi_{0.5}$ 原版（15 Hz）提升 3.67 倍；结合 $H=30$，动作吞吐量提升 11.0 倍。
  - **仿真成功率**: 在 LIBERO 上平均成功率达 98.0%（$H=10$），是所有对比方法中最高的，且推理频率最快。在 LIBERO-plus 的分布偏移下，保持了与 $\pi_{0.5}$ 相当的鲁棒性，而 OpenVLA-OFT 等 baseline 显著下降。
  - **推理耗时**: $H=10$ 时 VLA-WC 降低 3.6 倍；$H=30$ 时降低 10.5 倍。
  - **真机表现**: 在4个任务上成功率均高于 $\pi_{0.5}$，VLA-WC 降低 3.9 倍至 6.6 倍，动作平滑度提升（jerk 降低 2.2 倍至 3.0 倍），且在动态跟踪任务中因重规划周期更短而表现更好。

### 51. 🔥 [HuRo: Robotizing Human Videos for Scalable VLA Pretraining] (HuRo：将人类视频机器人化以实现可扩展的VLA预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2609.10706` | [点击跳转](https://arxiv.org/abs/2609.10706)

**0. 论文标题**
- **英文标题**: HuRo: Robotizing Human Videos for Scalable VLA Pretraining
- **中文标题**: HuRo：将人类视频机器人化以实现可扩展的VLA预训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一套自动化Pipeline，将大规模异构人类第一视角视频转化为机器人对齐的观测和动作数据，构建了HuRo数据集，并验证了其在VLA预训练中的Scaling效果。

**1. 整体逻辑**
- **研究任务**: 利用大规模人类视频进行视觉-语言-动作（VLA）策略的预训练，以解决真实机器人数据稀缺的瓶颈。
- **研究动机**: 人类视频丰富且易获取，但存在“具身鸿沟”（观测和动作与机器人不匹配）。现有方法要么只在特定任务下做转换，要么在大规模预训练时只对齐观测或动作之一，缺乏联合对齐且可扩展的通用预训练数据构建方案。
- **本质改动**: 设计了一套端到端的自动化Pipeline，同时完成视觉机器人化（擦除人手并渲染机器人）和动作重定向（将人手运动转化为机器人关节轨迹），从而将异构人类视频大规模转化为标准的VLA预训练数据。
- **技术溯源**: 基于 GR00T-N1.6-3B (VLA基座)；使用了 DROID-SLAM, HAWOR, PyRoKi, SAM2, ProPainter, Isaac Sim, Qwen3.5 等工具链；数据来源包括 Ego4D, EPIC-Kitchens, EgoDex, EgoVerse, Ego10K。

**2. 技术拆解**
- **核心方法**: 包含三个阶段的机器人化Pipeline：1) 人类视频标注（估计相机参数、手部3D姿态、相机轨迹，并用VLM生成指令）；2) 动作转换（利用PyRoKi将人手运动重定向为目标机器人的关节轨迹）；3) 视觉转换（用SAM2和ProPainter擦除人手，用Isaac Sim渲染目标机器人并叠加到背景上）。
- **关键细节**: 构建了HuRo数据集，包含约630K个机器人化episode和142M帧（约1317小时），目标机器人实体为ALLEX（双臂7-DoF，灵巧手15-DoF）。VLA策略采用GR00T-N1.6-3B架构，输出40步的动作chunk（包含手腕相对位姿和手部绝对关节角）。预训练80k步，batch size 2048；下游微调30k步，batch size 128。
- **训练/优化目标**: VLA预训练采用 flow-matching（流匹配）目标，联合微调视觉编码器；动作预测基于相对位姿和绝对关节角。Pipeline中的动作重定向使用运动学和视角一致性目标进行优化。

**3. 实验结果**
- **实验设置**: 在4个真实世界操作任务（Apple Pick-and-Place, Cup Stacking, Cup-Noodle Handover, Microwave Loading）上评估，使用ALLEX机器人。对比对象包括：不同比例的HuRo预训练（0%, 10%, 50%, 100%）、无视觉叠加变体（no-overlay）、仅视觉迁移（Visual-only）、以及基线模型 $\pi_{0.5}$、GR00T N1.6、I2V+IDM（视频生成基线）、Human-HRDT、Human-VITRA。
- **评价指标**: 任务完成率（Completion score），分为同分布（ID）和分布外（OOD，包含空间和视觉偏移）进行评估。
- **主要结果**: 
  1. Scaling效应：随着预训练规模增加，整体完成率从51.5%提升至80.3%，OOD完成率从34.9%提升至72.2%。
  2. 视觉机器人化的必要性：no-overlay变体的OOD性能（55.7%）显著低于完整HuRo（72.2%），甚至低于10%规模的完整HuRo（59.5%）。
  3. 端到端VLA预训练的优势：包含动作监督的端到端预训练（Visual+Action）在ID和OOD下均大幅优于仅迁移视觉特征的Visual-only变体。
  4. 对比视频生成基线：HuRo在0.7M帧的预训练预算下，ID和OOD表现均已超过I2V+IDM在7.0M帧下的表现，展现出更好的Scaling趋势。
