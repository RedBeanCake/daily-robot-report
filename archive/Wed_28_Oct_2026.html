### 37. 🔥 [X-World: Transferring Video Priors to Variable-View Robot Control] (X-World：将视频先验迁移到可变视角的机器人控制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34105` | [点击跳转](https://arxiv.org/abs/2610.34105)

**0. 论文标题**
- **英文标题**: X-World: Transferring Video Priors to Variable-View Robot Control
- **中文标题**: X-World：将视频先验迁移到可变视角的机器人控制
- **研究机构**: 原文未提及
- **一句话总结**: 提出X-World框架，通过残差跨视角注意力和固定长度token序列，将预训练的视频扩散模型先验解耦并迁移到支持可变相机视角和异构动作接口的机器人控制策略中。

**1. 整体逻辑**
- **研究任务**: 将视频扩散模型提供的视觉交互表征迁移到机器人控制策略中，解决不同数据集间相机视角数量可变以及动作接口异构的问题。
- **研究动机**: 视频数据能提供丰富的物体运动和任务进展信息，但收集带动作标签的轨迹数据成本高。直接迁移视频表征面临两个接口难题：视觉接口上，数据集的相机数量和视角各不相同；控制接口上，视频隐状态包含大量时空token，而策略需要生成短动作块，直接暴露会导致视觉与动作的异构性耦合。
- **本质改动**: 在视频骨干网络和动作专家之间引入固定长度的token序列以解耦相机处理和动作解码；同时保留预训练的单视角自注意力路径，通过零初始化的残差分支添加跨视角注意力，从而兼容1到3个视角的输入。
- **技术溯源**: 基于预训练的 LTX-Video 视频扩散骨干网络、Q-Former、Flow-matching（流匹配）动作专家（DiT架构），以及异步实时分块（RTC）执行机制。

**2. 技术拆解**
- **核心方法**: 
  1. 可变视角视频表征：保留LTX-Video预训练的每视角自注意力，添加零初始化的残差跨视角注意力分支。使用视图嵌入、随机化视图顺序和掩码复制（处理1-3个视角）来支持异构相机输入。
  2. 视频到动作接口：使用层对齐的Q-Former将视频骨干的多层特征聚合为固定长度的token序列，作为动作专家的上下文。
  3. 共享动作专家与异构接口：使用DiT风格的transformer作为共享动作专家，周围包裹数据集特定的状态和动作投影层，处理不同数据集的原生状态和动作参数化。
  4. 三阶段训练：Stage 1 视频适应（用视频预测损失训练视频骨干）；Stage 2 动作预训练（冻结视频骨干，用动作损失训练Q-Former和动作专家）；Stage 3 目标域后训练（联合视频和动作损失微调所有模块）。
  5. 异步执行：推理时只进行一次骨干前向传播提取特征（不生成/解码未来视频），结合异步实时分块（RTC）重叠策略查询与执行。
- **关键细节**: 
  - 输入输出：输入为1-3个相机的RGB图像、语言指令、本体感受状态；输出为长度为16的动作块。视频预测范围为24帧，分辨率256x256。
  - 模型结构：视频VAE空间压缩16倍、时间压缩8倍。Q-Former逐层通过交叉注意力聚合特征。
  - 训练数据与采样：Stage 1 使用机器人和人类视频混合数据；Stage 2 使用异构VLA轨迹，采用温度缩放采样（温度T=2.0，权重与数据集步数的平方根成正比）。
- **训练/优化目标**: 
  - Stage 1：视频扩散损失（预测噪声的L2损失）。
  - Stage 2：动作流匹配损失（Flow-matching loss，预测噪声的L2损失）。
  - Stage 3：视频损失与动作损失之和。

**3. 实验结果**
- **实验设置**: 
  - 仿真数据集：LIBERO（4个suite，10个任务，每个50个episode），LIBERO-Plus（零样本评估7种分布偏移）。
  - 真实世界平台：双臂UR5e机器人，配备2个腕部RealSense D405和1个第三人称D455相机。6个双臂任务，每个任务20次试验。
  - 对比对象（Baseline）：仿真中对比了Diffusion Policy, OpenVLA, SpatialVLA, CoT-VLA, $\pi_0$, GR00T-N1, F1, InternVLA-M1, Genie-Envisioner, $\pi_{0.5}$, OpenVLA-OFT, X-VLA等。真实世界对比了X-VLA, Genie-Envisioner, $\pi_{0.5}$。
- **评价指标**: 任务成功率（%），推理延迟（ms）。
- **主要结果**: 
  - LIBERO：平均成功率98.5%（X-VLA为98.1%）。
  - LIBERO-Plus（零样本）：总成功率76.5%（OpenVLA-OFT为69.6%）。在机器人、语言、光照和布局偏移上显著提升（如机器人偏移72.5% vs 31.9%），但在相机、背景和噪声偏移上弱于OpenVLA-OFT。
  - 真实世界：6个任务平均成功率81.7%，显著优于X-VLA（58.3%）、Genie-Envisioner（51.7%）和$\pi_{0.5}$（45.0%）。
  - 延迟：单张H100上，缓存模型响应46ms，部署刷新（含通信等）91ms，动作以30Hz执行。
  - 消融实验：移除残差跨视角注意力导致LIBERO成功率降至83.1%，真实世界Fold Towel任务从12/20降至0/20。移除视频适应或跨视角融合导致最大的成功率下降。

### 38. 🔥 [I Won't Know Until I Try: Interactive Information Gathering for Long-Horizon Manipulation] (试了才知道：长视野操作中的交互式信息收集)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.33959` | [点击跳转](https://arxiv.org/abs/2610.33959)

**0. 论文标题**
- **英文标题**: I Won't Know Until I Try: Interactive Information Gathering for Long-Horizon Manipulation
- **中文标题**: 试了才知道：长视野操作中的交互式信息收集
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合交互式信息收集与恢复重规划（recovery replanning）的TAMP框架，让机器人通过物理交互探索未知属性，并在交互改变物理状态后通过局部重规划复用有效动作后缀，避免昂贵的全局重规划。

**1. 整体逻辑**
- **研究任务**: 解决长视野操作（Long-horizon manipulation）中，机器人需要通过物理交互来获取无法仅凭视觉推断的物体属性（如是否可移动、笔是否有墨、抽屉是否锁住、容器是否空），且交互会改变物理状态导致后续动作失效的问题。
- **研究动机**: 现有的任务与运动规划（TAMP）方法在处理部分可观测性时，通常假设感知不改变物理世界，或者在交互导致状态改变后直接从头全局重规划（global replanning），计算代价大且无法有效复用之前的规划结果。
- **本质改动**: 将任务导向的交互式信息收集动作引入TAMP，采用乐观假设（optimistic planning）进行初始规划，并在执行时通过“恢复重规划”机制，保留仍适用的计划后缀（plan suffix），仅规划必要的局部桥接动作（bridge actions），而不是从头重规划。
- **技术溯源**: 基于 PDDLStream（一种先进的TAMP框架），使用 PDDL（Planning Domain Definition Language）进行符号化状态与动作建模。

**2. 技术拆解**
- **核心方法**: 
  1. **交互式信息收集建模**：为未知属性引入 `CheckedX`（已测试）和 `IsX`（测试为正）两个谓词，严格区分“未测试”和“测试为假”。规划时采用乐观效果（假设交互成功），执行时进行验证。
  2. **交织规划与执行**：执行时通过 `ObserveState` 更新状态，`Validator` 前向传播剔除因物理碰撞或符号前序条件失效的动作。
  3. **恢复重规划（Recovery Replanning）**：当保留动作的前序条件不满足时，不直接全局重规划，而是调用 PDDLStream 寻找从当前状态到下游某个保留动作前序条件的“桥接动作”。若找不到，再回退到全局重规划。
- **关键细节**: 
  - **输入输出**：输入为初始状态（物体类型、位姿、机器人构型，部分属性未知）和目标事实集合；输出为离散动作序列及连续参数（如抓取位姿、运动轨迹）。
  - **系统架构**：基于 PDDLStream，纯 CPU 计算。包含 `Plan`, `ObserveState`, `Validator`, `Precheck`, `RecoveryReplan`, `Execute`, `Aftercheck` 等核心模块。
  - **关键超参**：状态匹配容差（如构型误差阈值 $\delta_q$），局部恢复规划超时 120s，全局重规划超时 400s。
- **训练/优化目标**: 非学习类工作。核心机制是基于符号逻辑的规划与状态验证。优化目标是找到满足几何、运动学和物理约束的动作序列，最小化在线规划时间。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：在 PyBullet 仿真环境中测试，并在真实机器人（Franka Emika FR3，配 Realsense D435i 相机和 FoundationPose）上进行演示。对比 baseline 为 Global replanning（每次状态不匹配时从头全局重规划）。
  - **测试任务**：4个交互域（物体可移动性、笔的功能性、抽屉可打开性、容器空否），每域分 Easy（2-3个物体）和 Hard（4-6个物体）两个难度。
- **评价指标**: 
  - **任务完成率**（Task completion rates）。
  - **效率指标**：离线规划时间 ($T_{off}$)、在线规划时间 ($T_{on}$)、执行时间 ($T_{exec}$)、总完成时间 ($T_{total}$)。
  - **恢复有效性**：局部恢复回退到全局重规划的事件次数。
- **主要结果**: 
  - **任务完成率**：在 Hard 难度下优于 Global baseline（如 Object-Movability Hard 20/20 vs 18/20，Container-Emptiness Hard 19/20 vs 13/20）。
  - **效率**：8个设置中有7个总完成时间 ($T_{total}$) 更短，Hard 难度下提升显著（如 Object-Movability Hard 减少约 44%，Container-Emptiness Hard 减少约 65%）。在线规划时间 ($T_{on}$) 最高降低 91%，因为生成短桥接动作比全局重规划快得多。
  - **恢复有效性**：152次成功试验中仅发生14次局部恢复失败而回退到全局重规划，证明局部恢复能有效处理大多数执行偏差。此外，框架能处理未建模的外部干扰和动作失败（100%完成率），并在组合所有4种交互的复杂任务中达到 5/5 成功率。真机实验成功验证了物体可移动性和笔的功能性任务。

### 39. 🔥 [RoboWorM: Evaluating Movement Realism, Consistency and Acceleration Affects in Embodied Video World Models] (RoboWorM：评估具身视频世界模型中的运动真实性、一致性与加速影响)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.33807` | [点击跳转](https://arxiv.org/abs/2610.33807)

**0. 论文标题**
- **英文标题**: RoboWorM: Evaluating Movement Realism, Consistency and Acceleration Affects in Embodied Video World Models
- **中文标题**: RoboWorM：评估具身视频世界模型中的运动真实性、一致性与加速影响
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个面向具身机器人部署的视频世界模型评估基准 RoboWorM，利用机器人运动学和相机几何先验设计了无需VLM的确定性物理评估指标，并首次大规模审计了推理加速技术对生成视频物理一致性的隐性破坏。

**1. 整体逻辑**
- **研究任务**: 构建面向具身机器人部署的视频世界模型（VWM）评估基准，设计确定性的物理评估指标，并审计推理加速技术对生成视频物理保真度的影响。
- **研究动机**: 现有基准仅将VWM视为通用视频生成器，依赖视觉语言模型（VLM）进行主观打分，缺乏严格的3D空间和运动学推理能力；同时，实际部署要求低延迟，但现有的加速技术（如缓存、稀疏注意力）在提升速度的同时，会暗中破坏对部署至关重要的物理约束，而常规视觉指标（如FVD）无法察觉这些破坏。
- **本质改动**: 摒弃依赖VLM的开放式评估，转而利用已知的硬件先验（如机器人运动学树、固定相机内外参）构建确定性的、基于物理规律的评估指标，并将评估维度从单纯的视觉质量扩展到“质量-效率”权衡。
- **技术溯源**: 基于三个主流视频世界模型（DreamGen, DreamDojo, Ctrl-World），以及五个公开机器人数据集（DROID, RoboChallenge, AIST Bimanual, RoboCOIN, NVIDIA GR00T Teleop GR1）。

**2. 技术拆解**
- **核心方法**: 1) 构建包含1605个真实世界episode的 RoboWorM 基准数据集，覆盖单臂/双臂/人形形态及单/多视角、马尔可夫/长时序非马尔可夫任务；2) 提出 KIVA（单视角运动学稳定性评估）和 RIGIS（多视角几何一致性评估）两个确定性算法指标；3) 设计严格的加速审计协议，量化9种加速策略在3个基座模型上的速度-物理质量权衡。
- **关键细节**: 
  - **KIVA**：将机器人关节动作映射到关键点，计算刚度和抖动（rigidity and jerk）误差。当误差超过真实视频参考的95th percentile阈值时，即判定为运动学违规。
  - **RIGIS**：利用同步多视角构建统一3D场景，评估相机内外参的时序稳定性与跨视角几何一致性。
  - **加速审计**：评估了3类共9种SOTA加速方法，包括 token reduction (SiTo, ITM)、step caching (WorldCache, DiCache, FasterCache) 和 sparse attention (PISA, SVG等)。
- **训练/优化目标**: 本文非学习类工作，核心机制为基于物理先验的确定性度量算法（KIVA计算运动学违规率，RIGIS计算多视角一致性得分），以及严格的推理耗时与物理质量联合评估协议（加速比基于单segment生成时间计算，排除模型加载等固定开销）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboWorM 基准（1605个episode，生成超29000个rollouts）。
  - **对比对象（Baseline）**：常规视觉指标（FVD, PSNR, Visual Integrity等）以及4种主流VLM裁判（Gemini 3.6 Flash, Qwen 3.6 Plus, Gemma 4 31B, Qwen 3.6 35B，含Zero-shot和CoT设置）。
  - **基座模型**：DreamGen (2B/14B), DreamDojo (2B), Ctrl-World (1.5B)。
- **评价指标**: 
  - **人类对齐度**：Spearman相关系数、分类重合度（Overlap）。
  - **物理指标**：KIVA（单视角运动学违规率，越低越好）、RIGIS（多视角一致性得分，越高越好）。
  - **效率指标**：推理加速比（Speedup）。
- **主要结果**: 
  - **指标优越性**：KIVA 在幻觉检测上与人类标注的对齐度比最强VLM（Gemma 4 31B + CoT）高25.8%（从58.4%提升至73.5%）；RIGIS 与人类偏好的Spearman相关性比最强VLM高130%（从0.326提升至0.749），且计算延迟极低（0.356秒/视频秒，远低于VLM的数秒延迟）。
  - **长时序漂移**：VWM在长时序（非马尔可夫）生成中物理一致性显著下降，KIVA能准确捕捉这种随生成chunk增加而累积的误差。
  - **加速审计结论**：Caching（如WorldCache）是最稳健的加速方式，实现1.7x平均加速且物理质量损失极小（-0.004 RIGIS），在DreamGen人形/单臂多视角下最高可达2.3x加速；而Token pruning会导致较高的物理错误（13.4% NR loss）且加速较慢（1.2x）。常规视觉指标完全无法察觉这些物理约束的破坏。

### 40. 🔥 [EXE: Egocentric Cross-Embodiment Pretraining via Factorized Latent Actions for VLA Models] (EXE：通过分解隐式动作实现VLA模型的第一人称跨具身预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.33685` | [点击跳转](https://arxiv.org/abs/2610.33685)

**0. 论文标题**
- **英文标题**: EXE: Egocentric Cross-Embodiment Pretraining via Factorized Latent Actions for VLA Models
- **中文标题**: EXE：通过分解隐式动作实现VLA模型的第一人称跨具身预训练
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出了一种具身智能领域的方法创新，通过将人类视频中的动作分解为“共享位置空间”和“特有运动学空间”，并结合语言引导对齐，将人类操作知识有效迁移到夹爪和灵巧手等不同形态的VLA模型中。

**1. 整体逻辑**
- **研究任务**: 利用大规模第一人称（egocentric）人类操作视频预训练视觉-语言-动作（VLA）模型，以缓解机器人真实操作数据稀缺的瓶颈。
- **研究动机**: 人类和机器人存在具身差异（运动学不同）。现有跨具身方法要么将全部动作强行映射到单一共享空间，导致具身特有的几何信息污染任务语义；要么从视频帧差分学习隐式动作，导致动作信号与背景、光照等视觉噪声纠缠，无法提取纯粹的操作技能。
- **本质改动**: 将连续动作按语义分解为“跨具身共享的位置子空间（如3D末端位置）”和“具身特有的运动学子空间（如关节角、夹爪状态）”，仅在共享空间进行跨具身对齐，并利用语言信号解决“空间轨迹不同但任务语义相同”的动作对齐问题。
- **技术溯源**: 基于 Florence-2-large（VLM基座）、X-VLA（训练框架）、MANO（人手运动学模型）、Qwen3-Embedding-8B（冻结的语言编码器）。

**2. 技术拆解**
- **核心方法**: 提出三阶段预训练管线：1) 训练分解动作分词器（Factorized Action Tokenizer），将动作路由到共享或私有码本；2) 跨具身VLM预训练，让VLM学习预测共享动作token；3) VLA微调，通过动作专家（Action Expert）将VLM特征解码为连续机器人动作。
- **关键细节**: 
  - **动作分解**：共享组包含第一人称视角下的3D手腕/末端执行器位置；特有组包含旋转、手指关节或夹爪状态。
  - **分词器结构**：共享组使用跨域共享的残差向量量化（RVQ）码本（大小64），特有组使用每个域独立的码本（大小64）。
  - **对齐机制**：共享码本训练时，使用InfoNCE拉近空间轨迹相似的跨域样本；使用冻结的Qwen3语言嵌入计算文本相似度矩阵，通过关系蒸馏（Relational Distillation）拉近空间轨迹不同但任务语义相同的跨域样本。
  - **模型结构**：Stage 2 扩展 Florence-2-large 的 LM head 以预测共享 token；Stage 3 引入 Action Transformer 作为动作专家，并拼接 Bridge Features（VLM在动作占位符处的隐藏状态）进行连续动作回归。
- **训练/优化目标**: 
  - **Stage 1 (Tokenizer)**: 共享/特有组的重构损失 (MSE) + VQ承诺损失 + 多样性正则化 + 跨域对比损失 (InfoNCE) + 语言引导关系蒸馏损失 (L2距离)。
  - **Stage 2 (VLM Pretraining)**: 交叉熵损失，预测共享动作token（人类数据）或共享+特有动作token（机器人数据）。
  - **Stage 3 (Fine-tuning)**: 连续动作回归损失（L1损失）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：人类数据使用 EgoLive（主实验）、VITRA-1M、EgoDex；机器人仿真使用 RoboTwin 2.0（双臂夹爪）和 RoboCasa GR1（灵巧手）；真实世界使用 AgileX Piper 双臂平台（扫垃圾任务）。
  - **Baseline**：EXE_base（无Stage 1/2预训练的X-VLA）、SmolVLA、X-VLA（带大规模机器人预训练）、TurboVLA、StarVLA-GR00T。
- **评价指标**: 仿真任务评估平均成功率（包含Easy和Hard split）；真实世界任务评估10次rollout的成功率。
- **主要结果**: 
  - **RoboTwin 2.0**：EXE平均成功率达76.2%，超越无预训练的EXE_base (66.8%)、带机器人预训练的X-VLA (72.9%)、SmolVLA (60.0%) 和 TurboVLA (60.2%)。
  - **RoboCasa GR1**：EXE平均成功率达56.6%，超越EXE_base (52.0%) 和 StarVLA-GR00T官方结果 (47.8%)。
  - **真实世界**：在分布内数据上EXE成功率80%（EXE_base 60%）；在包含未见物体的干扰场景下，EXE成功率30%（EXE_base 10%）。
  - **消融实验**：证明InfoNCE对比学习、语言引导对齐、以及Stage 3的Bridge Features均带来独立且显著的性能提升。此外，人类与机器人数据1:1混合预训练效果最佳。

### 41. 🔥 [WorldFailBench: Do World Models Understand Policy Failures?] (WorldFailBench：世界模型能理解策略的失败吗？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.33565` | [点击跳转](https://arxiv.org/abs/2610.33565)

**0. 论文标题**
- **英文标题**: WorldFailBench: Do World Models Understand Policy Failures?
- **中文标题**: WorldFailBench：世界模型能理解策略的失败吗？
- **研究机构**: 原文未提及
- **一句话总结**: 提出了WorldFailBench基准，从失败原因、失败阶段和失败边界三个维度评估世界模型对机器人策略失败行为的复现能力，揭示了现有模型在失败诊断上的严重缺陷。

**1. 整体逻辑**
- **研究任务**: 构建评估基准，测试世界模型在闭环交互中是否能忠实模拟机器人策略的失败行为，而不仅仅是评估任务最终的成功率。
- **研究动机**: 现有的世界模型评估（如WorldArena等）只关注基于结果的成功率对齐。但这掩盖了模型是否真正理解策略“如何失败”、“在哪失败”以及“在什么条件下失败”的问题。错误模拟失败会导致对策略弱点的误判，让策略在微小场景变化下实际会失败却显得可以部署。
- **本质改动**: 将世界模型的评估从单一的“结果/成功率对齐”拓展到细粒度的“失败行为对齐”，引入了失败原因、失败阶段和失败边界三个维度的诊断性评估任务。
- **技术溯源**: 基于现有的机器人世界模型（如Ctrl-World, Cosmos, BWM等）和策略评估框架，依托LIBERO、RoboTwin仿真环境以及G1人形机器人真实环境。

**2. 技术拆解**
- **核心方法**: 构建WorldFailBench基准，包含三个闭环评估任务：1) Failure Reason（失败原因）：对比模型与参考环境中策略的失败类型（任务规划失败 vs 动作执行失败）频率及跨策略相关性；2) Failure Stage（失败阶段）：对比失败发生的具体任务阶段分布及跨策略相关性；3) Failure Boundary（失败边界）：在受控场景变化（位置、朝向、尺寸）下，测试模型能否复现策略成功率从成功到失败的突变条件。
- **关键细节**: 
  - 输入输出：输入为任务指令、RGB图像和机器人状态；输出为预测的下一帧观测。策略在生成的观测上进行闭环推理。
  - 规模与环境：涵盖LIBERO（单臂仿真，10个任务）、RoboTwin（双臂仿真，20个任务）和G1真实机器人（2个任务）。共评估7个世界模型和多种策略变体。
  - 标注机制：使用VLM（Doubao-Seed-2-1-Pro和ChatGPT）结合专家仲裁进行结果和失败类型的细粒度标注。
- **训练/优化目标**: 本文是基准测试（Benchmark）工作，不涉及模型训练。核心机制是通过对比参考环境（真机/仿真器）和世界模型生成的闭环轨迹，计算特定指标（如频率误差、皮尔逊相关系数、顺序准确率等）来衡量失败分布和趋势的一致性。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：LIBERO、RoboTwin仿真环境，以及G1人形机器人真实环境。
  - 对比对象（baseline）：Ref-Ref（参考环境自身的重复执行，用于提供随机变异基线），以及7个主流世界模型（Ctrl-World, Cosmos-Predict-2.5, BWM, DreamDojo, GE-Sim 2.0, A2World, DW05）。
- **评价指标**: 
  - Failure Reason: TFE (类型频率误差，越低越好), TPC (类型特定策略相关性，越高越好)。
  - Failure Stage: SFE (阶段频率误差，越低越好), SPC (阶段特定策略相关性，越高越好)。
  - Failure Boundary: OA (顺序准确率，越高越好), GE (差距误差，越低越好)。
- **主要结果**: 
  - 7个世界模型在理解策略失败上存在巨大差距，成功率对齐不等于失败行为对齐。
  - 在RoboTwin上，模型预测的规划和执行失败频率的平均绝对误差（TFE）高达15.9%到33.5%，严重扭曲了对策略弱点的诊断。
  - 所有7个模型在特定阶段的策略相关性（SPC）都很弱（最高仅0.095，甚至出现负相关），远低于Ref-Ref基线的0.903，说明模型无法准确预测策略在哪个阶段崩溃。
  - 在场景变化下，模型无法可靠捕捉成功到失败的转换：在测试的RoboTwin边界对中，95.2%的模型响应低估了参考成功率变化的幅度（GE误差大，OA低），导致对策略鲁棒性的过度乐观估计。

- **研究动机**: 现有具身记忆系统虽然保留了观测证据，但固定的记忆接口和工具集无法应对动态变化的任务需求（例如需要OCR读取门牌文字，或跨帧推理物体停留时间）。执行智能体在有限的在线预算内，常因缺乏特定的处理工具而暴露出“能力缺口”，导致任务失败。
- **本质改动**: 将记忆的原始证据与衍生字段解耦（延迟绑定），并引入“执行-编码”双智能体架构。通过探索-蒸馏-挂载（EDM）机制，让编码智能体在离线阶段开发新工具并挂载给执行智能体，实现记忆处理能力的按需自扩展。
- **技术溯源**: 基于VLM（如GPT-5.6、Qwen）进行场景与物体描述标注，使用SigLIP2提取视觉特征，e5提取文本特征，结合倒数秩融合（RRF）进行多通道检索。

**2. 技术拆解**
- **核心方法**: 
  1. **时空证据记忆**：保留RGB关键帧及其时空关联（位姿、深度等），将原始观测与衍生字段分离，支持对已存储观测的延迟重处理。
  2. **非对称双智能体架构**：执行智能体通过注册工具在受限的在线预算内访问数据库视图；编码智能体拥有可编程工作空间和更大的探索预算，可编写代码、下载模型来开发新能力。
  3. **探索-蒸馏-挂载（EDM）**：编码智能体先探索解题并记录轨迹；蒸馏阶段对比执行智能体的失败/低效轨迹以定位能力缺口，将探索代码封装为工具（Tools）和记忆构建器（Builders）；挂载阶段将新工具和技能（Skills）注册给执行智能体。
- **关键细节**: 
  - **记忆结构**：包含原始记录、初始字段（如VLM生成的场景/物体描述）和扩展字段（如OCR、事件、几何索引）。
  - **渐进式检索**：先返回紧凑的文本和元数据，仅在需要验证细节时才调用原图，以节省在线上下文和调用预算。
  - **EDM流程**：Explore（编码智能体写代码解题） -> Flag & Diagnose（对比执行与探索轨迹，定位缺口） -> Build（封装工具/构建器） -> Refine（可选的重放微调） -> Skill（生成指导执行智能体调用新工具的Prompt）。
- **训练/优化目标**: 非参数梯度训练，而是基于大模型的代码生成与工具合成。优化目标是在固定在线预算和执行模型的前提下，最大化挂载新能力后在“能力缺口”任务上的得分提升。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：GOAT-core（基础记忆访问），OC-NaVQA（能力扩展，时空问答），FindingDory（能力扩展，长视觉记忆），以及真实机器人（AGIBOT A3）巡逻记忆。
  - **Baseline**：GOAT-core对比MoM等；OC-NaVQA对比DAAAM、RAVEN、ReMEmbR等；FindingDory对比RAVEN、ReMEmbR等。
- **评价指标**: 
  - **GOAT-core**：SR@5（1.5m阈值内的定位成功率）。
  - **OC-NaVQA**：位置平均误差、10m内成功率、时间误差。
  - **FindingDory**：官方高级别成功率（涵盖空间、时间、多目标任务），以及单次查询的Token消耗。
  - **真实机器人**：任务成功率、平均工具调用次数、Token消耗。
- **主要结果**: 
  - **GOAT-core**：ReSight检索配置SR@5达90.8%，智能体配置达90.6%，显著优于MoM视觉检索的81.5%。
  - **OC-NaVQA**：EDM将平均位置误差从33.10m降至24.72m，10m内成功率从19.7%提升至36.6%。
  - **FindingDory**：EDM将ReSight整体高级别成功率从38.3%提升至63.8%（多目标和时间任务提升显著），单次查询Token从130k降至43k。在排除于探索之外的episode上，冻结工具仍使成功率提升28.3个百分点（37.5%至65.8%）。
  - **真实机器人**：挂载EDM后，6个任务的成功率从12/30提升至30/30，平均在线工具调用次数从5.10降至1.20。

### 43. 🔥 [OSWAM: An Effective World Action Model with One-Step Action Generation] (OSWAM：一种具有单步动作生成的高效世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.35850` | [点击跳转](https://arxiv.org/abs/2610.35850)

**0. 论文标题**
- **英文标题**: OSWAM: An Effective World Action Model with One-Step Action Generation
- **中文标题**: OSWAM：一种具有单步动作生成的高效世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出OSWAM，通过引入想象token和特权信息蒸馏，将世界动作模型的动作生成从多步扩散去噪压缩到单步，在保持自动驾驶和具身控制性能的同时大幅降低推理延迟。

**1. 整体逻辑**
- **研究任务**: 自动驾驶和具身智能中的端到端物理控制（根据当前视觉观测和指令，预测未来的动作序列）。
- **研究动机**: 现有的世界动作模型（WAMs）为了利用视频生成先验，要么在推理时实际生成未来视频（imagine-then-execute），延迟极高；要么采用直接策略（direct-policy）不生成视频，但动作生成仍依赖多步扩散去噪。如果强行将去噪步数减为一步（从纯高斯噪声起步），动作质量会大幅下降，无法满足自动驾驶等实时控制需求。
- **本质改动**: 摒弃从纯高斯噪声开始的多步去噪，通过在视频扩散模型中引入结构化的“想象token”作为动作去噪的初始化先验，并结合特权信息蒸馏注入未来上下文，实现单步高质量动作生成。
- **技术溯源**: 基于预训练视频生成模型 Wan2.2-5B (Video DiT)、T5 文本编码器、视频 VAE，以及 Flow Matching / Diffusion Transformer (DiT) 架构。

**2. 技术拆解**
- **核心方法**: 
  1. **想象Token (Imagination Tokens)**：在Video DiT中引入动作想象token (AIT) 和场景想象token (SIT)。它们与第一帧视觉特征交互，AIT生成结构化的动作先验，替代Action DiT中无结构的高斯噪声初始化。
  2. **特权信息蒸馏 (Privileged-Information Distillation)**：训练一个能看到完整未来视频序列的Teacher模型，指导只能看到第一帧的Student模型（OSWAM）的AIT，将长时域上下文转移到AIT中。
  3. **角色感知3D RoPE**：为视频、AIT、SIT分配不同的空间位置编码，以区分它们在注意力机制中的不同功能。
- **关键细节**: 
  - **输入输出**：输入当前帧（及可选指令/自车状态），输出动作块 (action chunk)。
  - **模型结构**：Mixture-of-Transformer (MoT) 架构，Video DiT 和 Action DiT 共享注意力。AIT和SIT通过LoRA适配到Video DiT中，token数量远少于第一帧视觉token。
  - **规模**：Video DiT 基于 Wan2.2-5B (50亿参数)，Action DiT 隐藏层维度降为1024。
  - **关键超参**：AIT扩散时间步 $t_{max}=1000$，Action DiT 重新加噪时间步 $\tau_r=500$ ($\sigma_r=0.5$)，蒸馏权重 $\lambda_{dist}=10$。
- **训练/优化目标**: 
  - 视频流匹配损失 ($\mathcal{L}_{vid}$)。
  - AIT动作速度预测损失 ($\mathcal{L}_{AIT}$)。
  - 特权特征蒸馏损失 ($\mathcal{L}_{dist}$)，对齐Student和Teacher在特定层的AIT特征。
  - 单步动作去噪损失 ($\mathcal{L}_{act}$)，以AIT生成的结构化中间状态为起点，单步预测速度目标。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：NAVSIM (自动驾驶，1192训练/136测试), RoboTwin 2.0 (具身双臂操作，50个任务), nuScenes (自动驾驶开环规划)。
  - **对比对象 (Baseline)**：自动驾驶包括 UniAD, TransFuser, DiffusionDrive, DriveVLA-W0, Epona, DriveLaW, DriveVA, SimWAM, Metis 等；具身控制包括 $\pi_0$, $\pi_{0.5}$, X-VLA, Motus, LingBot-VA, Flash-WAM, Efficient-WAM, Fast-WAM, Light-WAM 等。
  - **测试环境**：NVIDIA H20 GPU / RTX 5090 GPU (编译优化测试)。
- **评价指标**: 
  - NAVSIM/NAVSIM-v2：PDMS / EPDMS (综合驾驶评分)，推理延迟 (Latency)。
  - RoboTwin 2.0：平均任务成功率 (Success Rate)，推理延迟。
  - nuScenes：L2 位移误差 (L2 Displacement Error)，碰撞率 (Collision Rate)。
- **主要结果**: 
  - **NAVSIM**：OSWAM 达到 90.3 PDMS，延迟 136 ms。相比 10 步去噪的 SimWAM，PDMS 持平且速度提升 3.01 倍；相比 Metis，PDMS 高 1.2 且速度提升 3.24 倍。
  - **RoboTwin 2.0**：平均成功率 90.00%，延迟 142 ms。相比 10 步的 Fast-WAM，速度提升 2.80 倍，成功率仅微降 1.83%；相比同为单步的 Flash-WAM，成功率提升 8.59%，速度提升 4.29 倍。
  - **推理加速**：使用 `torch.compile` 和 CUDA Graph 优化后，RoboTwin 延迟降至 40.81 ms，NAVSIM 降至 52.64 ms，支持 >10Hz 实时推理。
  - **nuScenes**：平均 L2 误差 0.41 m（匹配最优），平均碰撞率降至 0.03%（最优）。
  - **真机实验**：在 PiPER 机械臂上，相比 Fast-WAM，放面包和擦除器任务的成功率分别提升 5% 和 5%，完成时间分别缩短 34.2% 和 21.8%。

### 44. 🔥 [Video World Models Need Predictable Latents] (视频世界模型需要可预测的隐变量)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34663` | [点击跳转](https://arxiv.org/abs/2610.34663)

**0. 论文标题**
- **英文标题**: Video World Models Need Predictable Latents
- **中文标题**: 视频世界模型需要可预测的隐变量
- **研究机构**: 原文未提及
- **一句话总结**: 通过在自编码器微调中引入时间预测目标并设计过去帧条件解码器，使视频世界模型的隐空间兼具高可预测性与高重建质量，从而大幅提升长时程推演与OOD泛化能力，并显著降低训练和推理成本。

**1. 整体逻辑**
- **研究任务**: 训练用于机器人物理世界交互的视频世界模型（Video World Models），解决长时程推演（long-horizon rollouts）、分布外（OOD）泛化差以及推理计算成本高的问题。
- **研究动机**: 现有视频世界模型通常在基于重建目标训练的自编码器隐空间中进行预测，但重建目标并未针对动力学建模优化，导致隐空间难以预测；而专为隐空间规划设计的模型虽可预测性强，但放弃了像素级精确重建且易发生表示坍塌。
- **本质改动**: 在自编码器微调时引入时间预测目标（如隐空间预测）以优化隐空间的动力学可预测性，同时引入“过去帧条件解码器”来分担重建压力，从而打破“信息保留”与“可预测性”的权衡，实现两者的兼得。
- **技术溯源**: 基于 FLUX.1 预训练自编码器（Black Forest Labs），使用 Bridge V2 数据集进行微调，世界模型采用 action-conditioned diffusion-forcing transformer。

**2. 技术拆解**
- **核心方法**: 
  1. **时间目标微调 (Temporal Objectives)**：在自编码器重建损失之外，加入隐空间预测（Latent prediction）或逆动力学（Inverse dynamics）等时间目标，迫使隐变量在时间上具备简单的动力学结构（降低内在维度和高频成分）。
  2. **过去帧条件解码器 (Past-conditioned Decoder)**：在预训练解码器中插入交叉注意力适配器（cross-attention adapters），使其在解码当前帧时条件于过去的上下文帧。由于相邻帧高度相似，隐变量只需编码帧间变化，从而在相同训练预算下大幅提升重建质量。
- **关键细节**: 
  - **自编码器**：基于 FLUX.1-schnell VAE（16个隐通道，8倍空间下采样）。
  - **解码器改造**：在解码器的 middle block 和 4 个上采样块后加入 5 个 8 头的交叉注意力适配器，上下文特征来自过去帧的像素 patch 和冻结编码器的中间特征。
  - **世界模型**：Diffusion-forcing transformer，在冻结的隐空间上进行动作条件生成。
  - **规模/超参**：自编码器微调 80,000 步，世界模型训练 100,000 步；时间目标权重 $\lambda=0.7$。
- **训练/优化目标**: 
  - **自编码器**：重建损失（MAE + LPIPS） + 时间目标损失（如 Latent prediction 的 MSE，或 Inverse dynamics 的动作预测损失）。
  - **世界模型**：基于 diffusion-forcing 的速度预测损失（velocity prediction loss），通过噪声水平和动作进行自适应层归一化调制。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：训练和分布内（ID）测试使用 Bridge V2；分布外（OOD）测试使用 AutoEval 基准。
  - **对比对象 (Baseline)**：Standard practice，即仅使用重建损失微调 FLUX 自编码器，并使用普通解码器（ordinary decoder）。
  - **策略评估环境**：WorldGym（包含 17 个 Bridge 任务），使用 VLM (Claude Opus 5.5) 作为裁判评估任务成功率。
- **评价指标**: 
  - **视觉与生成质量**：Pixel MSE, LPIPS, SSIM, FID, FVD。
  - **隐空间可预测性**：Latent MSE（世界模型单步预测下一帧隐变量的误差）。
  - **策略评估一致性**：模拟世界与真实世界策略成功率的 Pearson/Spearman 相关系数。
- **主要结果**: 
  - **生成质量与泛化**：在相同训练预算下，OOD 和长时程（long-horizon）推演的像素和感知误差（MSE, LPIPS）比 baseline 降低 15–24%。
  - **训练与推理加速**：世界模型训练速度提升 7 倍以上（达到 baseline 最终 LPIPS 所需时间缩短 7.6 倍）；在匹配生成质量的前提下，推理采样步数减少 5 倍（2步采样效果优于 baseline 的 10步）。
  - **策略评估**：与真实世界策略评估的 Pearson 相关性从 0.51 提升至 0.62（latent prediction）；在 2 步采样预算下，baseline 的相关性暴跌至 0.15-0.21，而本文方法仍能保持 0.51-0.67 的高相关性。
  - **隐空间特性**：Latent MSE 降低 33–80%，隐空间内在维度更低，空间更平滑，时间轨迹更直。

### 45. 🔥 [World Dreamer v5-lite: A Multi-Robot World Action Model with One Dreamer] (World Dreamer v5-lite：一种基于单一世界模型的多机器人世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.37518` | [点击跳转](https://arxiv.org/abs/2610.37518)

**0. 论文标题**
- **英文标题**: World Dreamer v5-lite: A Multi-Robot World Action Model with One Dreamer
- **中文标题**: World Dreamer v5-lite：一种基于单一世界模型的多机器人世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种多机器人世界-动作模型，核心是将多视角视频特征投影到统一的3D工作空间构建共享世界状态，并配合掩码视角训练策略，解决了多机器人协同中的视角拼接与遮挡问题。

**1. 整体逻辑**
- **研究任务**: 多机器人协同操作控制（根据语言指令和多视角视觉观测，预测多个机器人的动作序列）。
- **研究动机**: 现有的VLA和World-Action模型主要针对单机器人。扩展到多机器人时面临三个痛点：1. 观察是分布式的，直接拼接多视角token无法建立物理空间对应关系；2. 机器人本体可能异构，控制独立但决策耦合；3. 存在视角遮挡，单机器人观测往往不完整。
- **本质改动**: 放弃直接拼接多视角token，而是利用相机标定将视频特征lift到统一的3D工作空间坐标系中，构建一个固定大小的“共享世界状态”；同时引入掩码视角（masked-view）训练，强迫机器人学习利用队友的观测来弥补自身视角的缺失。
- **技术溯源**: Qwen3-VL（视觉语言基座）、预训练视频模型（视频编码器）、Conditional Flow Matching（动作生成）、3D特征平面表示（类似PDFactor/EG3D的平面分解思路）。

**2. 技术拆解**
- **核心方法**: 
  1. **构建共享世界状态 $\phi$**：用预训练视频编码器提取特征，结合相机内外参，将2D patch特征投影到3D空间（有深度则直接投影，无深度则沿光线采样8个候选点）。特征融合几何位置信息后，通过双线性splatting写入三个正交平面（XY, XZ, YZ）。使用可见性门控（visibility-gated update）机制进行时序更新，防止被遮挡区域的历史信息被错误覆盖。
  2. **动作解码与多智能体交互**：每个机器人分配一个可学习的agent query输入VLM获取语义上下文。动作解码器中，每个机器人保持独立的动作流，通过Field Injection Block读取共享状态 $\phi$，通过Agent Interaction Block利用相对位姿偏置（pose-aware attention）与其他机器人的query交换信息。
  3. **掩码视角协同训练**：训练时随机mask掉部分相机视角（同时从VLM和视频编码器中剔除），但保留所有机器人的动作标签，迫使模型利用未被遮挡的队友视角进行决策。
- **关键细节**: 
  - **输入/输出**：输入为语言指令、当前及历史RGB观测、各机器人本体感知（proprioception）、相机标定参数；输出为每个机器人未来30步的动作块（action chunk）。
  - **模型结构**：VLM处理当前图像和指令，视频编码器处理历史观测。共享状态 $\phi$ 分辨率为 $3 \times 16 \times 16 \times 256$（3个平面，16x16网格，256通道）。动作解码器共36层。
  - **关键超参**：无深度时沿光线采样 $S=8$ 个点；动作解码器层数 $L=36$；动作块长度 $H=30$。
- **训练/优化目标**: 
  - **主损失**：条件流匹配（Conditional Flow Matching）的动作速度预测误差（加权平方速度误差）。
  - **辅助损失1**：未来视频latent的预测误差（用于训练视频编码器，推理时不需要）。
  - **辅助损失2**：状态构建的渲染损失（预测观测特征的随机投影，用于约束3D状态构建的质量）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：预训练使用超10000小时轨迹（包含20种仿真机器人、RoboFactory和真实机器人数据）。评估在 RoboFactory（多机器人仿真，3个任务）、RoboCasa365（单机器人家庭仿真，50个任务）和 4个真实机器人任务（LeKiwi和OpenArm组合）上进行。
  - **对比对象（baseline）**：RoboFactory/真机对比 Diffusion Policy, ACT, $\pi_{0.5}$, Fast-WAM, Global/Local GauDP；RoboCasa365对比 PatchWAM, ABot-M0.5, PRTS, RLDX-1, GigaWorld-Policy 0.1, $\pi_{0.5}$, Diffusion Policy。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - **RoboFactory**：平均成功率 74.0%，比最强 baseline $\pi_{0.5}$ (50.3%) 高出 23.7 个百分点。
  - **RoboCasa365**：整体成功率 58.08%，比最强 baseline PatchWAM (47.6%) 高出 10.48 个百分点。
  - **真实机器人**：4个任务平均成功率 78.8%，比最强 baseline $\pi_{0.5}$ (65.0%) 高出 13.8 个百分点。

### 46. 🔥 [PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations] (PDRVLA：一种具有物理动态表征的视觉-语言-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.37381` | [点击跳转](https://arxiv.org/abs/2610.37381)

**0. 论文标题**
- **英文标题**: PDRVLA: A Vision-Language-Action Model with Physical Dynamics Representations
- **中文标题**: PDRVLA：一种具有物理动态表征的视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能领域的方法创新与系统工程工作，核心贡献是提出了一种带有轻量级物理动态模块的VLA模型，通过预测未来多模态特征并结合视频世界模型辅助监督来学习物理表征，在不增加推理延迟的情况下显著提升了机器人操作的成功率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型驱动的机器人操作控制（根据视觉观察和语言指令生成机器人动作）。
- **研究动机**: 现有VLA模型对物理世界动态的理解有限；虽然视频世界模型能捕捉场景动态，但在控制循环中在线生成未来视频会引入高延迟。
- **本质改动**: 在VLM的中间层特征上增加一个轻量级的物理动态模块，提取紧凑的物理token来辅助动作生成。训练时通过预测未来特征和冻结的视频世界模型进行监督，推理时直接使用该物理token，避免了在控制循环中在线生成视频带来的高延迟。
- **技术溯源**: 基于 Qwen3.5-4B VLM 作为骨干网络，结合了 LingBot-Video (Wan VAE, LingBot-Video-Dense-1.3B) 等预训练视频世界模型，动作专家基于 Diffusion Transformer (DiT) 和 conditional flow matching。

**2. 技术拆解**
- **核心方法**: 
  1. 物理动态模块（Physical Dynamics Module）：从VLM中间层（第8层）提取特征，通过可学习query和Transformer块提取固定数量的物理token。
  2. 训练策略：物理预训练阶段结合直接未来特征预测（RGB、深度、光流的VAE latent）和冻结视频世界模型的辅助流匹配监督；联合策略训练阶段保留直接预测损失，结合动作和VL目标进行端到端微调。
  3. 数据工程：构建跨具身训练语料，包含真实机器人、UMI、仿真数据及通用/空间VL数据，并通过第一人称人-机器人合成、子任务标注和具身思维链（ECoT）标注进行数据增强。
- **关键细节**: 
  - 物理模块包含4个Transformer块，50个可学习query，隐藏层宽度1024，输出50个宽度为2560的物理token，增加约57.3M参数（占4B骨干的1.4%）。
  - 动作专家为150M参数的DiT，预测包含8个动作的chunk。
  - 动作表示：统一为58维向量（左右机械臂各29维，包含关节、EEF位姿、灵巧手、夹爪），EEF动作表示为相对于chunk起始位姿的相对平移和旋转。
  - 数据规模：VLA数据包含约435万条轨迹（真实126万，UMI 122万，仿真187万），VL数据约3168万条。合成与标注数据包含90万条合成轨迹，17.9亿帧子任务标注，256万帧ECoT标注。
- **训练/优化目标**: 
  - 物理预训练：$\mathcal{L}_{pre} = \mathcal{L}_{WM} + \lambda(k)\mathcal{L}_{direct}$，其中 $\mathcal{L}_{WM}$ 是视频世界模型辅助的流匹配速度预测损失，$\mathcal{L}_{direct}$ 是未来RGB/深度/光流latent特征的MSE损失。
  - 联合策略训练：$\mathcal{L}_{policy} = \mathcal{L}_{act} + 0.1\mathcal{L}_{VL} + 0.1\mathcal{L}_{direct}$，其中 $\mathcal{L}_{act}$ 是动作chunk的masked velocity-matching loss（基于conditional flow matching），$\mathcal{L}_{VL}$ 是VL数据的交叉熵损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集与基准：LIBERO（单臂操作），LIBERO-Plus（带扰动的LIBERO），RoboTwin 2.0（双臂操作），SimplerEnv（WidowX视觉匹配任务）。
  - 对比对象（baseline）：$\pi_0$, $\pi_{0.5}$, OpenVLA-OFT, GR00T-N1.7, Cosmos-Policy, LingBot-VLA 1.0, LingBot-VLA 2.0, LingBot-VA, Xiaomi-Robotics-0, Qwen-VLA-Instruct, Qwen-RobotManip, InternVLA-A1.5。
- **评价指标**: 任务成功率（Success Rate, %）。
- **主要结果**: 
  - PDRVLA在四个基准上均取得最优或极具竞争力的聚合成功率：LIBERO 99.3%（对比Qwen-RobotManip 99.1%），LIBERO-Plus 89.9%（对比Qwen-RobotManip 89.0%），RoboTwin 2.0 93.6%（对比InternVLA-A1.5 93.2%），SimplerEnv 81.5%（对比InternVLA-A1.5 80.8%）。
  - 消融实验表明，引入视频世界模型辅助监督能显著降低未来特征预测的MSE（RGB和深度预测误差分别降低4.06%和2.12%，平均降低1.32%）。
  - 子任务条件化（Subtask conditioning）和ECoT训练能有效提升长视野任务和抗扰动任务的成功率，且ECoT的收益主要来自训练阶段而非推理时生成。

### 47. 🔥 [GAWM: A Compact Latent World-Action Model for Multi-Task Robot Manipulation] (GAWM：面向多任务机器人操作的紧凑型潜在世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.37091` | [点击跳转](https://arxiv.org/abs/2610.37091)

**0. 论文标题**
- **英文标题**: GAWM: A Compact Latent World-Action Model for Multi-Task Robot Manipulation
- **中文标题**: GAWM：面向多任务机器人操作的紧凑型潜在世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种参数量不到100M的潜在世界-动作模型，通过在冻结视觉特征空间预测未来场景布局来指导动作解码，在无需大模型和视频生成器的情况下，以极低延迟在多任务操作基准和真机实验中超越了数十亿参数的基线。

**1. 整体逻辑**
- **研究任务**: 多任务机器人操作（Multi-Task Robot Manipulation），具体为给定当前多视角观测和任务标识，预测未来动作序列（Action Chunking）。
- **研究动机**: 现有的世界-动作模型（WAMs）大多依赖数十亿参数的视觉语言模型（VLM）或视频生成器作为骨干，导致训练成本高、推理延迟大（如需迭代去噪），难以部署在算力受限的机载平台上。而现有的紧凑型联合嵌入预测架构（JEPA）世界模型通常依赖动作条件预测并需要在线搜索（Planning），限制了控制频率。
- **本质改动**: 摒弃庞大的VLM和视频生成器，采用JEPA思想，在冻结的视觉编码器潜在特征空间中，使用一个由“任务条件”而非“动作条件”引导的轻量级预测器来预测未来特征，从而将“预见性（foresight）”引入反应式（reactive）控制，免去了在线动作搜索。
- **技术溯源**: 基于 DINOv3（视觉编码器）、JEPA（联合嵌入预测架构）、ACT（Action Chunking with Transformers，动作解码器架构）、LiLa-WAM（潜在特征监督目标与任务代码设计）。

**2. 技术拆解**
- **核心方法**: GAWM包含三个核心模块：1) 视觉编码器：使用冻结的DINOv3提取多视角图像特征并压缩为少量token；2) 潜在预测器（Latent Predictor）：以任务代码（Task code）为条件，并行预测两个未来时间步（动作块的中点和终点）的潜在token；3) 动作解码器（Action Decoder）：基于当前token、预测的未来token、机器人状态和任务代码，直接回归出未来动作块。
- **关键细节**: 
  - **输入输出**：输入为多视角RGB图像、机器人状态、任务标识（Task ID）；输出为未来动作块（Action chunk）。
  - **模型结构**：冻结的DINOv3 ViT-S提取特征，Query Adapter将每个视角压缩为64个token；轻量级双向Transformer预测器（仅4-6M参数）以任务代码为条件，输出对当前token的残差更新；ACT风格的Transformer解码器融合当前token、预测token、状态和任务token，通过MLP回归动作。
  - **规模**：LIBERO配置38M参数，RoboTwin 2.0配置77M参数。
- **训练/优化目标**: 
  1. **动作损失**：预测动作与真实动作的L1损失。
  2. **未来特征重建损失**：训练时通过Patch Decoder将预测token映射为patch特征，与冻结编码器提取的真实未来帧patch特征计算余弦相似度损失（迫使预测特征编码未来的空间几何布局，即Geometry-aware）。
  3. **正则化损失**：VICReg风格的方差和协方差惩罚，防止特征坍塌。
  总损失为上述各项的加权和。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：LIBERO（40个任务，Standard和Extended数据设置）和 RoboTwin 2.0（50个双臂任务，Clean和Randomized设置）。真机实验使用Tianji Marvin Pro双臂机器人收集数据。
  - **对比对象（Baseline）**：数十亿参数的VLA（OpenVLA, $\pi_0$, $\pi_{0.5}$），数十亿参数的WAM（Fast-WAM, LingBot-VA, LaWAM），紧凑型策略（TurboVLA, LiLa-WAM）。真机对比微调的 $\pi_{0.5}$。
- **评价指标**: 
  - **仿真**：任务成功率（Success Rate, %）。
  - **真机**：关节误差（Joint error）、夹爪误差（Gripper error）、闭环成功率（Closed-loop success rate）、推理延迟（Inference latency, ms）。
- **主要结果**: 
  1. **仿真性能**：在RoboTwin 2.0上，77M参数的GAWM在Clean和Randomized设置下成功率分别达93.9%和93.1%，超越所有数十亿参数WAM（最高约92.9%）及紧凑型策略。在LIBERO上，38M参数达95.6%，超越3.2B参数的$\pi_0$。
  2. **推理延迟**：单次动作块查询在RoboTwin 2.0上仅需8.8ms，远低于其他紧凑型策略（17-143ms）和WAM（114-3763ms）。
  3. **消融实验**：在训练数据或时间受限时，世界模型模块带来巨大提升（如RoboTwin缩短训练步数时，去除世界模型导致成功率从90.7%暴跌至18.8%）。
  4. **真机表现**：双臂抓取任务中，GAWM的关节误差比微调的3.4B参数 $\pi_{0.5}$ 低20%以上，闭环成功率达92%（$\pi_{0.5}$为78%），推理延迟仅9.3ms（$\pi_{0.5}$为63.8ms）。

### 48. 🔥 [Trace-WAM: Learning to Act via 3D Motion Prediction for World Action Models] (Trace-WAM：基于3D运动预测的世界动作模型学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.36840` | [点击跳转](https://arxiv.org/abs/2610.36840)

**0. 论文标题**
- **英文标题**: Trace-WAM: Learning to Act via 3D Motion Prediction for World Action Models
- **中文标题**: Trace-WAM：基于3D运动预测的世界动作模型学习
- **研究机构**: 原文未提及
- **一句话总结**: 在世界动作模型（WAM）训练中引入未来3D运动预测作为辅助监督目标，通过三分支Transformer架构联合学习，推理时丢弃预测分支以保持单步前向传播，显著提升了少样本和分布外泛化能力。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作策略学习（基于世界动作模型 WAM）。
- **研究动机**: 现有的WAM通过预测未来RGB视频来辅助动作生成，但RGB预测需要重建整个场景的纹理和背景，而成功的操作其实只关心机器人和任务物体的演变。现有的几何或语义辅助监督（如深度、语义特征）缺乏对同一物理位置随时间演变的时序对应关系的显式建模。
- **本质改动**: 把“未来3D运动预测（包含2D图像位移和深度变化）”作为WAM表示学习的辅助目标。训练时用它来监督特征学习，推理时直接砍掉这个预测分支，只保留“当前观测->动作”的策略路径。
- **技术溯源**: 基于 Fast-WAM 代码库和训练设置，视频骨干网络使用预训练的 Wan2.2-5B，动作和运动专家采用类似的视频 Transformer 架构。

**2. 技术拆解**
- **核心方法**: 提出三分支混合 Transformer（Tri-MoT）架构，包含视频、运动和动作三个专家。通过结构化的注意力掩码控制信息流：当前视频特征只和自己交互，而未来视频、运动和动作特征可以 attend 到当前视频特征。训练时三个目标联合优化，推理时动作专家直接利用缓存的当前视觉特征、语言和本体感觉（proprioception）进行动作去噪。
- **关键细节**: 
  - 运动表示：在当前主相机图像上划分固定网格（默认20x20，400个锚点），预测未来32步的位移。位移包含图像平面坐标变化和深度变化。
  - 紧凑化：使用三次 B 样条（cubic B-spline）控制点（每个锚点10个控制点）来拟合和表示运动序列，降低预测难度。
  - 模型规模：动作和运动专家的隐藏层维度为 1024，动作和运动 horizon 均为 32，视频时间维度下采样 4 倍（每个 chunk 9 帧）。
- **训练/优化目标**: 使用 Flow Matching（流匹配）进行联合训练。总损失包括视频预测损失、动作预测损失、运动预测损失和静态运动正则化损失。其中运动损失对移动和静态锚点分别计算并加权平衡，静态正则化损失专门惩罚静态锚点的残余运动，防止模型在背景区域产生虚假预测。训练分两阶段：先用视频和运动目标预热，再加入动作目标联合优化。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboCasa-GR1（少样本和全数据）、LIBERO（4个任务套件）、LIBERO-Plus（零样本迁移，7种扰动）。
  - 对比对象（baseline）：Fast-WAM, Joint-WAM, DIAL, OpenVLA 系列, UniVLA, $\pi_0$ 系列, LAWA, 4D-WAM 等。
  - 硬件环境：16 或 32 张 NVIDIA H20 GPU。
- **评价指标**: 任务成功率（%），以及运动预测的图像平面平均位移误差（ADE）和深度平均绝对误差（MAE）。
- **主要结果**: 
  - RoboCasa-GR1：少样本下成功率 63.6%（比 Fast-WAM 的 44.8% 高 18.8%），全数据下 80.3%（比 Fast-WAM 高 5.7%）。OOD 泛化平均达到 58.6%。
  - LIBERO：4个套件平均成功率 98.7%（Fast-WAM 为 97.6%）。
  - LIBERO-Plus（零样本）：平均成功率 84.5%（比 Fast-WAM 的 66.2% 高 18.3%），在机器人初始状态和背景扰动下提升尤为明显。
  - 真实机器人：在 Piper 机械臂上 3 个任务平均成功率 85.0%（Fast-WAM 为 63.3%）。
  - 消融实验证明：加入深度（3D运动）比纯2D运动好（84.5% vs 82.4%）；B样条表示比直接预测原始轨迹好；辅助监督方式比直接把运动特征注入动作专家或做双向注意力效果更好。

### 49. 🔥 [TAPESTRY: A Single Backbone for Video Generation and Robot Control] (TAPESTRY：用于视频生成与机器人控制的单一主干模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.36823` | [点击跳转](https://arxiv.org/abs/2610.36823)

**0. 论文标题**
- **英文标题**: TAPESTRY: A Single Backbone for Video Generation and Robot Control
- **中文标题**: TAPESTRY：用于视频生成与机器人控制的单一主干模型
- **研究机构**: 原文未提及
- **一句话总结**: 将预训练视频扩散模型的VAE潜空间patchify层直接复用来tokenize机器人动作，实现无需生成视频的共享主干单步推理策略，在保持高泛化性的同时将推理速度提升数十倍。

**1. 整体逻辑**
- **研究任务**: 基于预训练视频生成模型的机器人视觉控制策略学习（具体为从海量视频和少量机器人演示中学习通用操作策略）。
- **研究动机**: 现有基于视频先验的机器人控制方法存在两难：要么在推理时生成完整视频再用逆动力学提动作（误差累积且推理极慢）；要么提取视频特征后从头训练动作头（无法充分利用预训练权重）；即使共享主干，推理时仍需生成视频，或者动作token化方式与预训练分布不匹配，导致多步去噪时产生严重的高频抖动。
- **本质改动**: 把机器人动作直接视为视频VAE潜空间中的单个patch token，复用预训练的patchify卷积层，使动作和视频共享同一个DiT主干；推理时完全跳过视频生成，利用扩散模型在最大噪声步的数学特性，单步直接去噪输出动作。
- **技术溯源**: 预训练视频扩散Transformer (DiT, 具体为CogVideoX-2B)、3D-VAE、T5-XXL文本编码器、DDPM/DDIM扩散模型。

**2. 技术拆解**
- **核心方法**: 
  1. **动作Token化**：通过轻量级线性投影和无仿射LayerNorm（匹配VAE潜空间的均值和方差），将动作向量对齐到预训练分布，再经过共享的2D patchify卷积转为DiT token。整个动作通路仅增加1280个参数。
  2. **三目标联合训练**：在同一个DiT上混合训练视频扩散（学物理先验）、联合视频+动作扩散（使用非对称注意力掩码，动作attend视频但视频不attend动作）、纯动作扩散（匹配推理分布）。
  3. **单步推理机制**：利用zero terminal SNR和v-prediction特性，在最大噪声步（t=T）直接从纯噪声单步预测动作的条件均值。这规避了视频预训练模型在低噪声阶段偏好生成高频细节（对动作信号有害）的缺陷，消除了多步去噪带来的高频抖动。
- **关键细节**: 
  - **输入输出**：输入为当前RGB观测和语言指令；输出为16步、20维的双臂动作chunk。
  - **模型结构**：基于2B参数量的CogVideoX-2B，冻结3D-VAE和T5-XXL。动作token与视频token共享相同的3D正弦位置编码。
  - **规模**：主干网络2B，动作通路新增参数仅1280个。
- **训练/优化目标**: 三个扩散损失（v-prediction MSE）的加权和。Video loss权重0.1，Action loss权重1.0。联合模式下视频和动作共享耦合的扩散时间步，并使用非对称注意力掩码。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：大规模跨具身视频（DROID, BridgeData v2, AgiBot-World, Ego4D, Epic Kitchens, SSv2, Panda-70M等）+ 少量双臂遥操作演示。
  - **对比对象 (Baseline)**：行为克隆（Diffusion Policy, QueST, BAKU），基于视频学习（AMPLIFY, Cosmos Policy, DreamZero）。
  - **测试环境**：LIBERO仿真基准（Learning-from-video协议），以及真实世界20-DoF双臂YAM机器人平台。
- **评价指标**: 仿真中的任务成功率（%），真实世界中的In-distribution和Out-of-distribution（新物体放置、新运动基元、新物体组合）任务成功率，以及推理延迟和显存占用。
- **主要结果**: 
  - **仿真 (LIBERO)**：平均成功率76%，显著优于Cosmos Policy和DreamZero (70%) 以及AMPLIFY (61%)。
  - **真机表现**：In-distribution成功率93%（Diffusion Policy为50%）；OOD泛化成功率67%（DreamZero为27%），是唯一能完成新物体组合任务的方法。
  - **推理效率**：在单张RTX 5090上，生成16步动作chunk仅需84ms（显存9GB），比优化后的DreamZero（3.7s）快约44倍。

### 50. 🔥 [RynnWorld-Latent: A Cross-Embodiment World Model Conditioned on Universal Latent Actions] (RynnWorld-Latent：以通用潜在动作为条件的跨具身世界模型)
- **研究机构**: `阿里巴巴达摩院 (Alibaba DAMO Academy)`
- **Arxiv ID**: `2610.36791` | [点击跳转](https://arxiv.org/abs/2610.36791)

**0. 论文标题**
- **英文标题**: RynnWorld-Latent: A Cross-Embodiment World Model Conditioned on Universal Latent Actions
- **中文标题**: RynnWorld-Latent：以通用潜在动作为条件的跨具身世界模型
- **研究机构**: 阿里巴巴达摩院 (Alibaba DAMO Academy)
- **一句话总结**: 提出了一种以连续潜在动作为共享条件接口的跨具身视频世界模型，解决了异构机器人和人类视频动作空间不统一的问题，并能作为数据引擎生成高质量合成数据来显著提升下游机器人策略。

**1. 整体逻辑**
- **研究任务**: 构建一个跨具身（cross-embodiment）的视频世界模型，用于在给定初始帧和动作条件下预测未来视觉动态，并将其作为数据生成引擎辅助机器人策略学习。
- **研究动机**: 现有的文本条件视频模型缺乏帧级细粒度控制，无法精确指导接触丰富的操作；而直接使用原始机器人动作作为条件，会面临不同机器人动作空间不兼容（维度、坐标系、频率不同）的瓶颈，且大量人类交互视频缺乏机器人动作标签，导致无法进行联合预训练。
- **本质改动**: 放弃使用原生机器人动作或文本作为条件，改用自监督提取的“连续潜在动作（latent actions）”作为统一的共享条件接口，将人类视频、机器人演示和仿真数据映射到同一空间进行联合预训练。
- **技术溯源**: 视频生成基座基于 Cosmos3 (Mixture-of-Transformers)；潜在动作提取基于 RynnLAM (3D-grounded latent action representation)；下游策略评估基于 $\pi_0$ 和 $\pi_{0.5}$ 等 VLA (Vision-Language-Action) 模型。

**2. 技术拆解**
- **核心方法**: 
  1) 使用冻结的 RynnLAM 从相邻视频帧中提取 608 维的连续潜在动作（包含运动、全局动作和相机分量）作为统一条件；
  2) 设计全局动作 token 与局部帧对齐注入相结合的条件机制，将动作描述符精准对齐到未来的视频 latent 上；
  3) 构建两条数据生成路线：数字遥操作（用目标机器人动作条件生成视频）和潜在动作合成（提取源视频潜在动作，编辑首帧替换为机器人/新环境后生成 rollout）。
- **关键细节**: 
  - **输入输出**: 输入初始帧 latent 和潜在动作序列，输出未来视频 latent 序列。
  - **模型结构**: 基于 Cosmos3-Edge，使用 causal video VAE (4x16x16 时空压缩)。动作条件通过全局 self-attention 注入，同时在第一个 Transformer block 前，通过 identity-initialized 的局部调制路径（类似特征调制）直接作用于对应未来帧的 vision tokens 上。
  - **规模**: 预训练数据包含 23 个数据集，约 5.535 亿帧（6190 小时）。
  - **关键超参**: 训练 chunk 长度 T=81 帧（对应 21 个 latent frames，20 个动作步）；推理时 classifier-free guidance scale 为 1.15。
- **训练/优化目标**: 基于 Rectified Flow 的去噪均方误差损失。只有未来视频 latent 被加噪和去噪，初始帧和动作条件保持 clean。训练时以 0.1 的概率随机 drop 动作序列或其子部分（操作/相机），以支持 classifier-free guidance。

**3. 实验结果**
- **实验设置**: 
  - **视频预测**: 基准包括 DreamDojo (In-lab, EgoDex, DreamDojo-HV) 和自建真实机器人基准。Baseline 包括 Cosmos-Predict2.5, DreamDojo-2B/14B, Cosmos3-Edge/Nano, RynnWorld-Teleop。
  - **下游策略**: 仿真基准为 LIBERO 和 LIBERO-Plus；真实机器人基准为 Marvin-WUJI (灵巧手) 和 Astribot-S1 (移动双臂) 上的 4 个任务。Baseline 包括 Ego2Robot。
- **评价指标**: 视频预测使用 PSNR, SSIM, LPIPS；策略学习使用任务闭环成功率 (Success Rate)。
- **主要结果**: 
  - **视频预测**: 在 DreamDojo 和真实机器人基准上，各项指标均优于所有 baseline（例如在 EgoDex Eval 上，LPIPS 从 DreamDojo-14B 的 0.21 降至 0.19，PSNR 和 SSIM 也有提升）。
  - **定性控制**: 固定首帧输入不同的潜在动作序列，模型能生成符合对应动作序列的视觉动态，证明了潜在动作的细粒度控制能力。
  - **下游策略**: 在仿真中，使用合成数据 mid-training 使 $\pi_0$ 在 LIBERO-Plus 上的成功率从 53.6% 大幅提升至 79.4%；在真实机器人中，数字遥操作数据和大规模合成数据（RynnWorld-Latent-80M，约 8480 万帧）均显著提升了 $\pi_0$ 和 $\pi_{0.5}$ 的成功率（例如 $\pi_{0.5}$ 在 Astribot-S1 的 Steak-Serving 任务上，成功率从 40.00% 提升至 60.00%）。

### 51. 🔥 [Rollback: Experience Backtracking in World Models for Policy Improvement] (Rollback：世界模型中的经验回溯用于策略改进)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.36068` | [点击跳转](https://arxiv.org/abs/2610.36068)

**0. 论文标题**
- **英文标题**: Rollback: Experience Backtracking in World Models for Policy Improvement
- **中文标题**: Rollback：世界模型中的经验回溯用于策略改进
- **研究机构**: 原文未提及
- **一句话总结**: [方法创新/系统工程] 本文属于机器人学习与强化学习领域。提出Rollback范式，利用世界模型的“经验回溯”能力进行反事实树搜索与价值估计，并结合真实数据持续在线微调世界模型，大幅提升了机器人策略在复杂物理任务中的学习效率和成功率。

**1. 整体逻辑**
- **研究任务**: 基于动作条件世界模型的机器人策略改进（Action-conditioned world models for robot policy improvement）。
- **研究动机**: 现有方法把世界模型仅当作单向（前向）的物理环境代理，浪费了世界模型独有的“倒带”能力。这导致三个问题：1）探索效率低，未集中在关键决策点；2）决策级监督稀疏，轨迹级反馈无法揭示哪个中间动作决定了结果；3）世界模型预测有偏，策略探索容易超出训练分布，导致预测误差累积。
- **本质改动**: 将世界模型从被动的前向模拟器改为可回溯的“反事实引擎”，通过树搜索在关键决策点分支对比替代动作，并利用真实交互数据持续在线微调世界模型（测试时物理接地）以纠正分布偏移。
- **技术溯源**: 基于 GE-Sim 2.0（世界模型基座）、$\pi_{0.5}$（策略基座），借鉴了 AlphaGo/Expert Iteration（MCTS搜索）、RECAP（优势条件训练）、DMD（分布匹配蒸馏）和 LoRA。

**2. 技术拆解**
- **核心方法**: 
  1. **经验回溯树搜索**：缓存世界模型上下文，利用蒙特卡洛树搜索（MCTS）从真实轨迹的中间决策点回溯并分支，集中模拟预算探索有信息量的替代动作。
  2. **树结构价值估计**：对比同一上下文下兄弟分支的下游结果，计算相对动作质量并离散化为bin，直接作为策略更新的优势监督信号，无需额外训练价值模型。
  3. **世界模型-策略协同进化**：用真实收集的轨迹通过 LoRA SFT 和 DMD 持续微调世界模型，纠正策略探索带来的动力学预测偏差。
- **关键细节**: 
  - **输入输出**：输入为多视角RGB图像、本体感知状态和语言指令；输出为16维动作块（每侧7个关节+1个夹爪，30Hz）。世界模型预测下一帧多视角图像和本体感知状态。
  - **系统架构**：云-边-端异步架构。云端40张H200做搜索，8张H200做策略训练；边缘侧跑推理；1台物理机器人收集数据。各进程通过Experience Fabric异步交换数据和模型快照，互不阻塞。
  - **规模与超参**：动作块长度50步，想象预算B=256个动作块，价值离散化bin数K=5。
- **训练/优化目标**: 
  - **策略优化目标**：基于流匹配（Flow-matching）的优势条件策略更新损失，结合树搜索生成的相对价值bin标签、离线演示和真实轨迹进行训练。
  - **世界模型优化目标**：动作条件预测损失（SFT）+ 分布匹配蒸馏损失（DMD）。

**3. 实验结果**
- **实验设置**: 
  - **任务与硬件**：三个真实机器人操作任务（Block Extraction 积木抽取, Ball Tossing 抛球入桶, Tabletop Curling 桌面冰壶）；使用 AGIBOT Genie-02 机器人和 48张 NVIDIA H200 GPU。
  - **对比对象（baseline）**：SFT (在$\pi_{0.5}$上微调), RECAP (在$\pi_{0.5}$上结合价值模型), RISE w/ GE-Sim2 (在相同世界模型 GE-Sim 2.0 上复现的 RISE)。
- **评价指标**: 任务成功率（Success rate, %），目标接触率（Target contact），连续抽取次数（Consecutive extractions），以及世界模型保真度指标（PSNR, RGB L1 error）。
- **主要结果**: 
  - 相比最强baseline (RISE w/ GE-Sim2)，Rollback在三个任务上的成功率分别绝对提升了 10.67%、11.11% 和 11.85%，平均成功率提升 11.21%。
  - 训练8小时内，在抛球入桶和桌面冰壶任务上超越了人类玩家的平均成功率。
  - 消融实验表明，禁用世界模型自适应（冻结世界模型）会使连续抽取次数从 2.60 降至 1.90；禁用树结构价值估计（直接用单条轨迹奖励）会使任务成功率从 69.33% 降至 59.33%。
  - 协同进化显著降低了世界模型在策略探索状态下的 RGB L1 误差（从 19.52 降至 12.96），有效减少了长序列预测漂移。

### 52. 🔥 [E0.5: From Reconstructive to Future-Predictive 3D Foundations for Robotic World-Action Modeling] (E0.5：从重建到未来预测的3D基础模型用于机器人世界-动作建模)
- **研究机构**: `中山大学 (Sun Yat-sen University)`
- **Arxiv ID**: `2610.36011` | [点击跳转](https://arxiv.org/abs/2610.36011)

**0. 论文标题**
- **英文标题**: E0.5: From Reconstructive to Future-Predictive 3D Foundations for Robotic World-Action Modeling
- **中文标题**: E0.5：从重建到未来预测的3D基础模型用于机器人世界-动作建模
- **研究机构**: 中山大学 (Sun Yat-sen University)
- **一句话总结**: 提出了一种以3D基础模型为主干的“几何原生”世界-动作模型E0.5，通过联合预测未来3D几何状态与动作，在仿真和真机操作中展现出比视频/VLM主干更强的空间动态捕捉与OOD泛化能力。

**1. 整体逻辑**
- **研究任务**: 机器人世界-动作建模（World-Action Modeling, WAM），即联合建模机器人动作与未来世界状态，以支持具身智能操作。
- **研究动机**: 现有的WAM主要依赖视频或视觉语言模型（VLM）作为主干，3D几何仅作为辅助输入；少数基于3D主干的方法（如VGA）仅做当前场景重建且限制参数更新（如LoRA），导致模型无法有效学习物理空间动态，在分布偏移（OOD）下泛化能力差。
- **本质改动**: 将3D基础模型（而非视频/VLM）作为核心主干并进行全参数微调，同时将训练目标从“重建当前3D场景”改为“显式预测动作执行后的未来3D几何状态”。
- **技术溯源**: 基于3D基础模型 VGGT-Omega，动作生成部分借鉴 DiT (WAN2.2) 架构与 Flow-matching，语言条件使用冻结的 T5 (UMT5-XXL) 编码器。

**2. 技术拆解**
- **核心方法**: 构建“几何原生（geometry-native）”架构。使用3D基础模型处理多视角图像和语言指令提取几何特征；通过原生几何预测头预测未来（动作序列末端）的深度图、点云和相机参数；同时使用基于Flow-matching的动作专家（ActionDiT）生成动作序列。两者通过层级几何-动作注意力机制（Layer-wise geometry-action attention）深度融合。
- **关键细节**: 
  - **输入输出**：输入当前多视角RGB、语言指令和机器人本体状态；输出32步动作序列（horizon=32）。
  - **模型结构**：VGGT-Omega作为视觉/几何主干，ActionDiT作为动作专家（30层，隐藏层1024）。两者通过MoT架构连接，ActionDiT的首尾各3层独立，中间24层与VGGT进行层级注意力交互。
  - **关键机制**：未来3D状态（深度、点图、相机参数）仅用于训练时的监督信号，推理时完全不需要，不增加推理负担。
- **训练/优化目标**: 联合优化动作生成损失（基于Flow-matching的均方误差）和未来几何预测损失（深度、点图、相机参数的加权损失，总权重设为0.01）。全参数微调3D骨干和动作专家，冻结语言编码器。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RoboTwin 2.0 基准（双臂操作，50个任务），采用 clean-to-random 协议（用50个clean demo训练，在clean和randomized场景评估）。对比基线包括主流 VLA（如 π0.5, Spatial Forcing）和 WAM（如 PatchWAM, MWA-Phoenix）。
  - **真机**：AgileX Piper (双臂) 和 Zerith H1 (人形) 机器人，3个任务（鼠标放置、充电器收纳、垃圾丢弃），分 ID (EASY) 和 OOD (HARD) 设置。对比 π0.5。预训练使用了 AgiBotWorld-Beta 数据集（160k轨迹，约2645小时）。
- **评价指标**: 仿真使用任务成功率 (Success Rate, SR)；真机使用成功率 (SR) 和平均完成度得分 (Completion Score, CS，用于衡量部分完成的情况)。
- **主要结果**: 
  - **仿真表现**：在无具身数据预训练的情况下，E0.5 (2.32B参数) 在 Clean 和 Randomized 设置下分别达到 89.90% 和 50.09% 的成功率，超越了众多更大参数或经过预训练的 VLA/WAM 基线。
  - **消融结论**：预测未来几何比无重建或预测当前几何分别带来约 9.43% 和 7.93% 的平均成功率提升；在 OOD 设置下，E0.5 的精度约为基于视频预测的 WAM 基线的 30 倍。
  - **真机表现**：在 AgiBotWorld-Beta 预训练后，E0.5 在 AgileX Piper 和 Zerith H1 上的平均真实操作成功率分别比无预训练版本提升了约 15% 和 7%。在 OOD 场景下，E0.5 的泛化能力显著优于 π0.5（如 Piper OOD SR 73.3% vs 63.3%，H1 OOD SR 76.7% vs 46.7%）。

### 53. 🔥 [Vision-Language-Action or World-Action? Just Action Models] (视觉-语言-动作还是世界-动作？仅需动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.37219` | [点击跳转](https://arxiv.org/abs/2610.37219)

**0. 论文标题**
- **英文标题**: Vision-Language-Action or World-Action? Just Action Models
- **中文标题**: 视觉-语言-动作还是世界-动作？仅需动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出JAM框架，通过解耦视觉backbone初始化与未来观测监督，用仅训练时使用的“前瞻损失”替代视觉生成损失，在不增加推理负担的前提下统一了VLA和WAM并提升了机器人控制性能。

**1. 整体逻辑**
- **研究任务**: 具身智能/机器人操作控制策略学习（基于预训练视觉/语言/生成模型先验的模仿学习）。
- **研究动机**: 当前VLA（继承VLM先验）和WAM（继承视觉生成先验）的争论混淆了三个独立选择：backbone初始化、对未来观测的优化目标、推理时是否保留生成模块。现有WAM（如FastWAM, ImageWAM）虽然去掉了推理时的视觉生成，但训练时仍依赖视觉生成损失，且将策略与特定的生成式backbone强行绑定。
- **本质改动**: 将“学习未来观测”与“视觉生成”彻底解耦。训练时引入一个额外的“前瞻损失（foresight loss）”来预测冻结的未来特征，训练结束后直接丢弃该预测分支；推理时只做动作预测，且backbone可以自由选择（生成式、自监督或VLM均可）。
- **技术溯源**: 基于 FastWAM (Wan2.2-5B), ImageWAM (Yak18/Ovis-U1, FLUX.2), DINOv2, Qwen3.5-2B 等预训练视觉/语言模型，以及 Flow Matching 动作专家机制。

**2. 技术拆解**
- **核心方法**: Just Action Model (JAM) 训练范式。策略由预训练视觉backbone和动作专家组成。训练时联合优化动作损失（Action loss）和前瞻损失（Foresight loss）。前瞻损失通过一个额外的预测头，让当前观测特征去对齐冻结的未来观测编码（Future anchor）。推理时丢弃预测头和未来分支，仅保留backbone和动作专家。
- **关键细节**: 
  - **输入输出**：输入包含当前观测、机器人状态、文本指令、动作块和记录的未来观测；输出为动作块。
  - **模型结构**：视觉backbone编码当前观测，动作专家（基于Flow Matching）结合视觉上下文、状态和指令预测动作。预测头是一个小型的token-mixing transformer。
  - **未来锚点（Future anchor）**：可以是同架构的冻结预训练模型、随机初始化模型或直接用VAE tokenizer。未来目标特征可以提前计算并缓存，不占用在线计算资源。
- **训练/优化目标**: 总损失为 $\mathcal{L}_{\mathrm{JAM}} = \mathcal{L}_{\mathrm{act}} + \lambda_{\mathrm{F}} \mathcal{L}_{\mathrm{F}}$。动作损失 $\mathcal{L}_{\mathrm{act}}$ 使用 Flow Matching 监督动作块；前瞻损失 $\mathcal{L}_{\mathrm{F}}$ 计算预测头输出与冻结未来锚点特征之间的余弦距离，通过 stop gradient 确保梯度不回传给锚点。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO, LIBERO-Plus, RoboTwin 2.0。
  - **对比对象（Baseline）**：FastWAM, ImageWAM, OpenVLA, $\pi_0$, $\pi_{0.5}$, Motus, LingBot-VA 等。
- **评价指标**: 任务成功率（Success rate），以及在线训练的计算成本（FLOPs和GPU时间）。
- **主要结果**: 
  - **替换生成损失**：在固定架构下，用前瞻损失替换生成损失，LIBERO-Plus 成功率显著提升（FastWAM 55.31% 提升至 JAM(Wan) 64.54%；ImageWAM 65.27% 提升至 JAM(Ovis-U1) 79.95%）。
  - **跨Backbone验证**：JAM框架适用于生成式（Ovis-U1）、自监督（DINOv2-L）和VLM（Qwen3.5-2B）backbone，且表现均优于对应的生成式baseline（如ImageWAM），证明强前瞻性能不依赖于生成式backbone。
  - **计算效率**：通过缓存前瞻目标，相比FastWAM减少 73% 的在线训练 FLOPs，相比ImageWAM减少 36.8%。
  - **综合性能**：在 RoboTwin 2.0 上，JAM(Qwen3.5-2B) 达 89.8%，JAM(Wan) 达 91.4%，JAM(FLUX.2) 达 93.1%，在同组别（VLM/视频生成/图像生成）中取得领先或极具竞争力的表现，且无需推理时的视觉生成开销。
