            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Progress Probes $P^2$: Lightweight Runtime Monitoring for Vision-Language-Action Models] (进度探针 $P^2$：视觉-语言-动作模型的轻量级运行时监控)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31613` | [点击跳转](https://arxiv.org/abs/2610.31613)

**0. 论文标题**
- **英文标题**: Progress Probes $P^2$: Lightweight Runtime Monitoring for Vision-Language-Action Models
- **中文标题**: 进度探针 $P^2$：视觉-语言-动作模型的轻量级运行时监控
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种仅依赖VLA内部激活值和成功演示数据的轻量级线性探针，通过解码任务进度偏差来实时检测机器人策略失败，在保持高检测精度的同时比外部VLM监控方案快上万倍。

**1. 整体逻辑**
- **研究任务**: 为视觉-语言-动作（VLA）模型构建运行时监控器（Runtime Monitor），在机器人执行任务时实时检测策略是否发生失败或偏离预期。
- **研究动机**: 现有的运行时监控方法存在两个痛点：一是依赖外部大型VLM进行监督，计算开销极大，无法满足实时性；二是依赖失败数据来训练分类器，而收集失败数据成本高且难以覆盖所有长尾失败模式。
- **本质改动**: 抛弃外部模型和失败数据，直接利用VLA推理时自带的内部特征（激活值）。通过训练一个极简的线性探针来预测“任务剩余进度”，通过对比预测进度与名义（成功）进度的偏差来触发失败警报。
- **技术溯源**: 基于开源VLA模型 $\pi_{0.5}$（其视觉-语言骨干网络为 PaliGemma），以及机械可解释性（Mechanistic Interpretability）中的线性探针（Linear Probing）技术。

**2. 技术拆解**
- **核心方法**: 
  1. **构建进度标签**：在成功演示数据中，将每个时间步的任务进度定义为归一化的剩余时间（从1线性递减到0）。
  2. **训练线性探针**：提取VLA特定中间层的内部激活值，训练一个线性回归模型（线性探针）来预测该进度。
  3. **运行时监控**：在部署时，计算当前时间步探针预测的进度，减去基于成功轨迹平均长度计算出的“名义预期进度”。当偏差超过设定阈值（即预测进度显著落后于预期进度）时，判定为执行失败。
- **关键细节**: 
  - **输入输出**：输入为VLA中间层的内部激活值（形状为 $d \times k$，在token维度求平均池化得到 $d$ 维向量），输出为标量任务进度值。
  - **模型规模**：极简，仅训练约 2K 个参数（即线性层的权重和偏置）。
  - **预期进度计算**：名义预期进度 $\zeta^{\text{nom}}_{t} = 1 - \frac{t}{\mu_T}$，其中 $\mu_T$ 是成功轨迹的平均长度。监控得分为 $\hat{\zeta}(o_t) - \zeta^{\text{nom}}_{t}$，得分大于阈值 $\delta$ 则报警（不惩罚执行过快的情况）。
- **训练/优化目标**: 均方误差（线性回归）。优化目标是让探针输出的进度值尽可能拟合基于时间步归一化计算出的真实进度标签，且训练仅使用成功轨迹数据。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：仿真环境使用 VLABench（6个任务）；真实硬件环境使用 Franka 机械臂配合 DROID 相机（6个任务，如倒咖啡、堆叠等），数据来自 StressDream 等。
  - **对比对象（baseline）**：
    - 输入级监控：FIPER (RND-OE), FAIL-Detect (logPO)
    - 特征级监控（内部激活）：FAIL-Detect (logpZ0), SAFE-MLP, SAFE-LSTM
    - 输出级监控（动作分布）：FIPER (ACE), STAC
    - 外部VLM监控：Robometer (zero-shot 和 fine-tuned)
- **评价指标**: 
  - 推理延迟（Latency, ms）
  - 失败检测的 AUROC（分为 Episode 整段级别和 State 单步级别）
  - 检测时间（Detection Time，在5% FPR下的 TPR 及平均检测时间占比）
  - 进度预测的 $R^2$
- **主要结果**: 
  - **极致轻量与高效**：推理延迟仅为 $2.6 \times 10^{-2}$ ms，比 SAFE 系列快约 5-10 倍，比外部 VLM (Robometer) 快 10,000 到 20,000 倍。
  - **检测精度媲美/超越 SOTA**：在仿真中，无需失败数据，Episode AUROC 达到 0.909，State AUROC 达到 0.788，表现优于或持平于需要失败数据训练的 SAFE 和微调后的 Robometer。在真实硬件中，平均 State AUROC 达到 0.78，同样全面优于所有 baseline。
  - **泛化能力强**：在未见任务（Unseen tasks）上，仿真和硬件的 State AUROC 分别达到 0.794 和 0.81，泛化能力优于或持平于其他特征级监控器。
  - **VLA 内部表征优于纯 VLM**：基于 VLA 动作数据微调的激活值训练的探针，其进度预测 $R^2$ (0.83) 和 AUROC (0.93) 显著优于基于纯 VLM (如 PaliGemma 或 Robometer) 激活值训练的探针，证明动作数据对表征任务进度的关键作用。

### 2. 🔥 [Echo: Coupled Action and Task Status Signal Denoising for Vision Language Action Models] (Echo：面向视觉语言动作模型的耦合动作与任务状态信号去噪)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31569` | [点击跳转](https://arxiv.org/abs/2610.31569)

**0. 论文标题**
- **英文标题**: Echo: Coupled Action and Task Status Signal Denoising for Vision Language Action Models
- **中文标题**: Echo：面向视觉语言动作模型的耦合动作与任务状态信号去噪
- **研究机构**: 原文未提及
- **一句话总结**: 提出Echo框架，将任务状态信号（停止与失败）作为动作块的额外维度与动作联合去噪，无需帧级进度标注即可实现高精度状态预测，并通过异步去噪让状态信号直接指导动作生成与失败恢复。

**1. 整体逻辑**
- **研究任务**: 在视觉语言动作（VLA）模型中联合预测任务执行状态（进行中、成功、终端失败、可恢复失败）并生成机器人动作，利用状态信号直接指导动作生成（特别是触发失败恢复行为）。
- **研究动机**: 现有VLA状态预测方法依赖细粒度的帧级监督、外部监控模型或复杂的架构设计；且预测出的状态信号通常只用于事后监控，未能直接用于条件化动作生成。
- **本质改动**: 将停止信号（SS）和失败信号（FS）拼接到动作块（action chunk）的特征维度中，在单一VLA内与动作联合去噪；通过控制注意力交互和异步去噪（信号先于动作去噪完成），使后续的动作去噪步骤能够直接条件化于干净的状态估计。
- **技术溯源**: 基于流匹配（Flow Matching）的VLA策略，具体以 $\pi_{0.5}$ 作为策略骨干（backbone）。

**2. 技术拆解**
- **核心方法**: 
  1. **状态表示与联合去噪**：将SS和FS作为action chunk的最后两维，与动作一起通过Flow Matching进行联合去噪。
  2. **无帧级标注的监督构造**：利用成功演示、失败rollout、干预前失败片段和恢复演示，结合子任务级别的padding mask和片段级成功/失败标签来构造SS和FS的监督目标，完全免去帧级进度标注。
  3. **状态引导的动作生成**：设计受控的注意力掩码（动作attend信号，信号attend动作，但阻断SS和FS之间的直接交互以保留各自语义），并采用异步去噪策略，让信号先达到clean状态，从而在后续动作去噪步骤中提供更干净的条件。
- **关键细节**: 
  - **输入输出**：输入为视觉观测、机器人状态和语言指令；输出为动作块（维度 $d_a$）+ SS（1维）+ FS（1维），总维度 $d_a+2$。
  - **模型结构**：共享Transformer架构，但动作、SS、FS有独立的输入投影、MLP和输出投影。时间嵌入（time embeddings）扩展为支持每个token具有独立的flow time。
  - **关键超参**：动作块长度 $H=60$，信号干净端点时间 $\tau_{clean}=0.5$，SS和FS的判定阈值均为0.5。
- **训练/优化目标**: 
  - 基于Flow Matching的速度预测损失（匹配预测速度与 $\epsilon - x_0$）。
  - 损失函数包含动作、SS、FS的预测误差，通过二值掩码 $\mathbf{M}^q$ 和权重 $\lambda$ 控制不同数据类型的监督区域（例如：失败数据的动作不参与模仿学习，仅监督其信号预测）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：5个真实世界操作任务（Insert Flower, Capsule Toy, Insert Pen, Make Tanghulu, Open Drawer）以及 LIBERO-Recovery 仿真环境。
  - **对比对象（baseline）**：仅动作的 $\pi_{0.5}$ 基线，以及 CycleVLA、VLA-Corrector、Robometer。
- **评价指标**: 
  - **任务完成得分（Task Completion Score）**：0-10分，衡量任务执行质量。
  - **帧级宏平均F1（Frame-level Macro-F1）**：评估细粒度的逐帧状态识别准确率。
  - **轨迹级F1（Trajectory-level F1）**：评估在固定时间窗口（15帧/3秒）内识别成功/失败结果的及时性和准确性。
- **主要结果**: 
  - **状态预测**：Echo在5个真实任务上实现了高精度的状态预测（Frame F1 约 88%-92%，Traj F1 约 90%-100%），在 Insert Flower 任务上显著优于 CycleVLA（Frame F1 92.18% vs 43.10%）和 Robometer（Traj F1 96.67% vs 90.00%）。
  - **任务执行**：相比仅动作的 $\pi_{0.5}$ 基线，Echo在所有任务上均提升了任务完成得分（如 Insert Flower 从 5.67 提升至 8.33，Open Drawer 从 5.40 提升至 7.90），且在分布外（OOD）场景下提升更为显著（如 Insert Flower OOD 得分从 2.00 跃升至 8.00）。
  - **消融结论**：信号到动作的注意力（S->A）、信号分离（不共享MLP、阻断SS-FS直接注意力）以及异步去噪是提升性能的关键；信号干预实验直接验证了状态输入能引导动作生成向纠正行为偏移。

### 3. 🔥 [Skeleton-Grounded Latent Action Model for Robot World Models] (用于机器人世界模型的骨架引导潜在动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31474` | [点击跳转](https://arxiv.org/abs/2610.31474)

**0. 论文标题**
- **英文标题**: Skeleton-Grounded Latent Action Model for Robot World Models
- **中文标题**: 用于机器人世界模型的骨架引导潜在动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出SkeLAM，通过骨架监督将视频学习的潜在动作解耦为纯粹的运动学分量和场景残差，解决了机器人动作映射受场景变化干扰的问题，显著提升了动作条件世界模型的轨迹准确性和视觉保真度。

**1. 整体逻辑**
- **研究任务**: 构建动作条件的机器人世界模型（根据当前视觉观测和机器人动作预测未来视频帧），用于支持策略评估和基于模型的规划。
- **研究动机**: 现有的潜在动作模型通过重建未来帧来学习，导致学到的潜在动作混合了“机器人自身运动”和“物体响应/场景变化”。这导致在将真实的机器人控制动作映射到潜在空间时，目标受到场景依赖变化的干扰（例如相同的末端运动在不同接触状态下会产生不同的物体响应），难以建立准确的对应关系。
- **本质改动**: 将潜在动作显式解耦为“运动学分量”（由骨架序列监督，只编码机器人运动）和“残差分量”（编码互补的场景动态）。推理时丢弃残差，仅通过轻量级适配器将机器人动作映射到运动学空间来驱动世界模型。
- **技术溯源**: 潜在动作学习基于 Transformer VAE，世界模型骨干网络采用 Cosmos-Predict2.5-2B。

**2. 技术拆解**
- **核心方法**: 
  1. 骨架引导的潜在动作解耦：使用配对的RGB和骨架图像，通过Transformer VAE提取运动学和残差潜在变量。冻结骨架分支，用骨架解码器监督RGB的运动学潜在变量。
  2. 跨模态交换重建：在RGB解码时，将RGB的运动学输入替换为配对的骨架运动学均值，保留残差，强制RGB解码器学会兼容骨架的运动条件。
  3. 动作条件世界模型与分支Dropout：世界模型通过独立路径接收两个分量。训练时使用分支Dropout（如丢弃残差），让模型适应推理时残差为零的情况。
  4. 动作适配：训练轻量级MLP适配器，将机器人动作回归到运动学潜在空间，随后微调世界模型。
- **关键细节**: 
  - 输入输出：输入当前观测和动作，输出未来12步观测（分辨率480x640）。
  - 模型结构：潜在动作模型中运动学和残差维度均为32维。世界模型骨干为 Cosmos-Predict2.5-2B（DiT架构）。动作适配器为3层MLP（7->256->256->32）。
  - 规模与算力：训练在8张A100 GPU上进行，单次完整训练约需2天。
- **训练/优化目标**: 
  - 潜在动作阶段：RGB重建MSE + KL散度正则化 + 骨架Grounding损失 + 对齐损失 + 交换重建MAE损失 + 方差/协方差正则化。
  - 世界模型阶段：视频生成损失；动作适配阶段使用动作到运动学均值的MSE回归损失。

**3. 实验结果**
- **实验设置**: 
  - 数据集：主要在 DROID 数据集上训练和评估（评估400个视频片段），训练时补充了 AgiBot 数据集。
  - 对比对象（baseline）：潜在动作世界模型 DreamDojo、CD-LAM；其他条件策略包括 IRASim、Ctrl-World、Cosmos-Predict2.5、Cosmos3、EnerVerse-AC、GE-Sim、OSCAR 等。
- **评价指标**: 
  - 视觉保真度：PSNR、SSIM、LPIPS、tLPIPS。
  - 运动准确性：2D末端执行器平均位移误差（ADE）、方向宏平均F1（F1_dir）、归一化幅度MAE（L1_mag）、幅度皮尔逊相关系数（r_mag）。
- **主要结果**: 
  - 在DROID上，相比DreamDojo，SkeLAM将末端执行器ADE降低了19.5%（51.11降至41.15），LPIPS降低了11.1%（0.1473降至0.1310），在8个指标中7个排名动作条件模型第一。
  - 消融实验证明骨架监督、跨模态交换、残差分支和动作适配均不可或缺。
  - 线性探测（Linear probing）表明，运动学分量仅用一半的维度就达到了接近完整表征的机器人运动解码精度。
  - 定性结果显示支持零样本的人到机器人动作迁移。
  - 在RoboArena上的开环策略评估显示，预测的成功率与真实机器人执行的成功率具有较高的一致性（Spearman相关系数0.5347，成功率MAE为4.76%）。

### 4. 🔥 [FastHarness: Experience-Driven Review Scheduling for Vision-Language-Action Policies] (FastHarness：面向视觉-语言-动作策略的基于经验的审查调度)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31427` | [点击跳转](https://arxiv.org/abs/2610.31427)

**0. 论文标题**
- **英文标题**: FastHarness: Experience-Driven Review Scheduling for Vision-Language-Action Policies
- **中文标题**: FastHarness：面向视觉-语言-动作策略的基于经验的审查调度
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个基于历史执行经验的动态调度框架，通过自适应减少大模型对 VLA 策略动作块的审查频率并优化错误恢复路径，在不微调模型的前提下显著降低了 Agent 机器人系统的推理开销并提升了任务成功率。

**1. 整体逻辑**
- **研究任务**: 降低具身智能 Agent 系统（VLA 策略 + 大模型审查）在重复执行任务时的大模型推理开销，同时保证或提升任务成功率。
- **研究动机**: 现有的 GPT-as-Policy 等架构对每个动作块（action chunk）都调用大模型进行审查，导致巨大的计算和时间开销。即使在策略已经能可靠完成的熟悉阶段，这种逐块审查也是冗余的；此外，常规执行和错误恢复需要不同的监督逻辑。
- **本质改动**: 引入基于历史经验的动态审查调度机制和针对性的错误恢复机制，让大模型只在“上下文陌生”或“发生错误”时介入，实现策略冻结情况下的系统级效率与可靠性优化。
- **技术溯源**: $\pi_{0.5}$ (VLA 策略基座), GPT-6 Astra (大模型审查器), RoboDojo (仿真环境)。

**2. 技术拆解**
- **核心方法**: FastHarness 包含两个互补路径：1) **经验驱动的快路径**：利用下采样 RGB 和状态特征进行阶段识别与匹配，基于历史成功/失败统计计算保守得分，动态调整大模型审查的间隔；2) **错误恢复路径**：检测到错误时触发连续审查，先尝试局部修复，失败则回退到历史验证过的子目标（waypoint），验证恢复后重置调度并保留错误记忆以防复发。
- **关键细节**: 
  - **输入输出**：输入为当前观测（3个视角的RGB和关节/末端状态），输出为动作块（包含1-15个控制步）。
  - **记忆与匹配**：将观测压缩为 590 维特征（576维RGB + 12维关节 + 2维夹爪），每个阶段保留最多 128 个特征样本，使用均方根距离进行匹配（未知阈值 0.06，模糊阈值 0.01）。
  - **调度逻辑**：基于 Wilson 区间计算保守成功率得分，结合样本量和连续成功次数计算审查间隔。基础允许 120 个控制步，未知上下文、阶段切换或靠近历史错误点会强制触发审查。
- **训练/优化目标**: 无额外模型训练（策略和审查器权重均冻结）。核心机制是基于规则的自适应调度算法和基于经验记忆的状态机，通过最大化审查跳过率（review-skip rate）和优化恢复成功率来控制系统运行。

**3. 实验结果**
- **实验设置**: 
  - **数据集/环境**：RoboDojo 仿真环境中的 4 个操作任务（Build tower, Fold clothes, Bottle disposal, Classify objects）。
  - **对比对象（baseline）**：GPT-as-Policy（即 $\pi_{0.5}$ + GPT-6 Astra 的逐块审查架构）。
- **评价指标**: 大模型审查调用次数、审查跳过率、Token 消耗量、单集（episode）墙钟时间（wall-clock time）、任务原生成功率。
- **主要结果**: 
  - **效率提升**：随着经验积累，平均 Token 消耗下降 57.2%（从 1.83M 降至 0.93M），平均单集执行时间从 85.5 分钟降至 52.0 分钟（降低约 39%）。
  - **成功率提升**：4 个任务的平均成功率从 baseline 的 80% 提升至 97.19%（其中 Build tower 从 60% 升至 93.75%，Classify objects 从 60% 升至 100%）。

### 5. 🔥 [FocusVLA: Future-Intent Guided Dynamic View Routing for Vision-Language-Action Models] (FocusVLA：面向视觉-语言-动作模型的未来意图引导动态视角路由)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31423` | [点击跳转](https://arxiv.org/abs/2610.31423)

**0. 论文标题**
- **英文标题**: FocusVLA: Future-Intent Guided Dynamic View Routing for Vision-Language-Action Models
- **中文标题**: FocusVLA：面向视觉-语言-动作模型的未来意图引导动态视角路由
- **研究机构**: 原文未提及
- **一句话总结**: 针对多视角 VLA 模型静态融合导致的“视角依赖惯性”问题，本文提出 FocusVLA，通过预测未来动作意图来动态路由全局与局部视觉特征，非侵入式地提升了策略在不同操作阶段的适应性。

**1. 整体逻辑**
- **研究任务**: 提升多视角输入下视觉-语言-动作（VLA）模型在机器人操作任务中的策略适应性和鲁棒性。
- **研究动机**: 现有 VLA 模型通常将多视角（全局场景和局部腕部）视觉观测静态融合。这会导致“视角依赖惯性”（view-dependency inertia），即策略在任务早期形成的视角偏好（如过度依赖局部视角）会一直延续到后期，无法根据任务阶段的变化（如从全局规划切换到局部精细交互）动态调整视角权重，造成阶段与视角的错位（stage-view misalignment）。
- **本质改动**: 在动作生成侧引入轻量级的动态视角路由模块。利用历史动作和多模态上下文预测未来动作意图（是需要局部交互还是全局移动），并将其转化为逐步的视角路由权重，从而非侵入式地动态调节全局和局部视觉特征的贡献，无需修改预训练的 VLA 骨干网络。
- **技术溯源**: 基于 $\pi_{0.5}$ (pi 0.5) 多视角 VLA 基座模型。

**2. 技术拆解**
- **核心方法**: 提出 FocusVLA 框架，包含两个核心模块：未来意图桥（Future Intent Bridge）和动作侧动态路由（Action-Side Dynamic Routing）。前者预测未来动作步的交互意图并生成路由权重和意图 token；后者在动作生成过程中，利用这些权重对全局和局部视觉上下文进行逐步融合。
- **关键细节**: 
  - **输入输出**：输入全局/局部观测、语言指令、机器人状态和短期动作历史；输出未来 $H$ 步的动作 chunk。
  - **意图预测**：Future Intent Bridge 使用语言特征作 query，视觉/状态/历史特征作 key/value 进行交叉注意力，预测未来 $H$ 步的意图序列（0 为全局移动，1 为局部交互）。
  - **路由权重**：意图概率通过固定边界线性映射转为逐步路由权重（限制在 0.25 到 0.75 之间，避免完全丢弃某视角），同时聚合出 chunk 级意图 token 提供全局进度条件。
  - **弱监督标签**：无需人工标注，通过末端执行器轨迹的运动学启发式规则（速度、路径长度、夹爪闭合等）自动构建二分类意图标签。
  - **动作侧融合**：动作特征作 query，分别与全局和局部视觉特征做交叉注意力得到上下文，用路由权重加权融合后，通过门控残差连接注入动作特征。
  - **规模与开销**：在 $\pi_{0.5}$ 基础上增加 70.13M 参数，单 chunk 推理延迟增加 13.19 ms（约 16.6%）。
- **训练/优化目标**: 联合优化动作生成损失（L2）和意图预测损失（带类别权重的 BCE）。采用意图预热（intent warmup）策略，先单独训练意图分支 5K 步，再联合训练，并配合 teacher forcing 稳定优化。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RoboTwin 2.0 基准的 50 个操作任务（涵盖短、中、中长、长、超长/灵巧任务）。
  - **真实世界**：Piper 机械臂，配备两个 RealSense D435i 相机（全局和局部），6 个代表性操作任务。
  - **对比对象（baseline）**：RDT, $\pi_0$, $\pi_{0.5}$。
- **评价指标**: 任务成功率（Success Rate, SR）。
- **主要结果**: 
  - **仿真**：在 RoboTwin 2.0 的 50 个任务上，FocusVLA 平均成功率达到 76.92%，比最强 baseline $\pi_{0.5}$（66.82%）提升 10.10 个百分点，在中长和长序列任务上提升尤为明显。
  - **真实世界**：平均成功率从 $\pi_{0.5}$ 的 71.7% 提升至 85.0%（提升 13.3 个百分点），比 $\pi_0$ 提升 25.6 个百分点。
  - **消融实验**：证明多模态未来意图预测、显式意图监督、chunk 级意图 token 以及动作侧路由缺一不可；性能提升不能仅用随机视角 dropout、静态路由或当前视觉特征路由来解释。

### 6. 🔥 [Learning Robot Behavior Priors from Non-Robotic Synthetic Data] (从非机器人合成数据中学习机器人行为先验)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31275` | [点击跳转](https://arxiv.org/abs/2610.31275)

**0. 论文标题**
- **英文标题**: Learning Robot Behavior Priors from Non-Robotic Synthetic Data
- **中文标题**: 从非机器人合成数据中学习机器人行为先验
- **研究机构**: 原文未提及
- **一句话总结**: 证明了仅使用纯数学抽象（如马尔可夫决策过程、线性动力系统）生成的非机器人合成数据，就能预训练出在未见过的物理机器人任务上具备零样本上下文动作预测能力的模型。

**1. 整体逻辑**
- **研究任务**: 机器人动作预测（给定上下文状态-动作对，预测下一步动作）。
- **研究动机**: 真实机器人数据收集昂贵，物理仿真器只是将成本转移到了特定领域的工程上。现有具身基础模型严重依赖大规模真实或仿真数据，作者想探索能否从完全无具身的通用数学抽象中学习控制先验。
- **本质改动**: 抛弃物理仿真和真实数据，使用程序化生成的纯数学抽象作为先验数据，预训练基于Transformer的上下文学习模型，使其具备跨具身形态的零样本迁移能力。
- **技术溯源**: Prior-Data Fitted Networks (PFNs) / TabPFN。

**2. 技术拆解**
- **核心方法**: 将机器人动作预测转化为上下文分类问题。设计三种纯数学抽象的合成数据生成器（Control Priors）来生成预训练数据：1) MDP（捕捉时序和目标导向的序列决策）；2) Contextual Bandit（捕捉单步状态-动作关联）；3) LDS（捕捉物理系统特有的平滑状态演化和高时间自相关性）。在生成数据时随机置换特征维度，迫使模型通过上下文推断结构。
- **关键细节**: 基于TabPFN早期开源版本（12层Transformer，4个注意力头）。连续动作空间通过K-means离散化为64个bin（VMAS等原生离散动作为10个类别）。每次采样任务时，数据集特征维度被随机置换，输入为上下文状态-动作对和查询状态，输出为动作预测分布。
- **训练/优化目标**: 标准负对数似然（NLL）损失函数。

**3. 实验结果**
- **实验设置**: 数据集包括6个VMAS（仿真多智能体）、5个RoboMimic（仿真操作）和4个真实机器人数据集（DROID, A2D2, GrandTour, Aerial）。对比对象包括：仅使用通用因果先验的Tabular prior、仅使用三种控制先验的Control priors、混合先验，以及计算量匹配的在部分真实/仿真数据上训练的Embodied baselines。
- **评价指标**: Accuracy（准确率）、NLL（负对数似然）、RCD（相对质心距离，衡量连续动作空间恢复程度，0为完美，1为随机猜测）。
- **主要结果**: 
  1. 在真实机器人数据上，通用Tabular prior准确率跌至接近随机（约3.9%），而Control priors达到约16.6%，显著优于随机和通用先验；RCD指标也从0.905降至0.706。
  2. 消融实验表明，LDS（线性动力系统）是最强的单一先验，说明局部时间连续性比长期价值结构或单步关联更易于迁移。
  3. 与Embodied baselines对比，后者在训练过的任务上表现更好，但在未见过的任务上性能崩溃至随机水平；而本文模型在所有未见任务上保持一致且高于随机的表现。
  4. 开环预测测试中，模型对无人机300步轨迹的预测最终状态平均误差小于0.48米。
  5. 发现反直觉的微调现象：用少量真实数据微调预训练模型，在仅看到1000到5000个域内样本后，其性能提升速度不如直接从零训练，表明预训练和微调的目标可能存在冲突。

### 7. 🔥 [Memory before Goal: Role of Pre-History Memory for Humanoid Loco-Manipulation] (目标之前的记忆：前历史记忆在人形机器人运动操作中的作用)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31166` | [点击跳转](https://arxiv.org/abs/2610.31166)

**0. 论文标题**
- **英文标题**: Memory before Goal: Role of Pre-History Memory for Humanoid Loco-Manipulation
- **中文标题**: 目标之前的记忆：前历史记忆在人形机器人运动操作中的作用
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种由物体事件引导的感知记忆机制（WholeBodyMem），让人形机器人VLA模型能够精准记住离开视野的关键历史帧，从而在动态场景的全身运动操作任务中大幅提升决策准确率，并发布了配套的HuMeGo基准。

**1. 整体逻辑**
- **研究任务**: 解决人形机器人在动态场景下全身运动操作（loco-manipulation）中，因目标物体离开视野或状态改变导致的非马尔可夫决策问题（属于具身智能/机器人VLA领域的方法创新与基准构建）。
- **研究动机**: 现有的全身VLA模型只依赖当前观测，当机器人转头或走动导致关键线索（如物体被遮挡、状态改变）离开视野时，模型会直接“失忆”。现有的记忆方法（如均匀采样或长序列压缩）要么计算成本高、稀释短暂线索，要么丢失细节，且目前缺乏针对人形机器人全身运动的记忆基准。
- **本质改动**: 放弃传统的均匀采样或全局特征压缩，改用“物体事件”（如出现、消失、显著移动）来因果选择并保留最关键的历史帧，结合物体级token，让动作专家直接读取“前历史记忆”。核心思想是“保留对的帧比保留更多的帧更重要”。
- **技术溯源**: 基于全身VLA策略框架（如 $\Psi_0$、$\pi_{0.5}$、GR00T），视觉语言骨干网络使用 Qwen3-VL-2B，目标跟踪使用冻结的 SAM3，动作专家基于流匹配（flow-matching），底层全身控制器使用 AMO 和 SONIC。

**2. 技术拆解**
- **核心方法**: WholeBodyMem 机制。包含三个核心模块：1) 使用 SAM3 跟踪任务物体并检测物体事件（出现、消失、移动>3%图像对角线、形状改变IoU<65%）；2) 根据事件得分因果选择关键帧，填入自适应记忆预算；3) 动作专家通过交叉注意力（Cross-Attention）和 FiLM 调制读取记忆帧的视觉 token 和物体 token。
- **关键细节**: 
  - **输入输出**：输入为头部相机图像、本体感受状态、语言指令；输出为36维全身动作（上肢关节目标+下肢运动指令），控制频率 50Hz，动作预测步长 H=30。
  - **记忆预算与结构**：最大保留 7 帧（包含首、中、当前 3 帧，以及最多 4 个高分事件帧）。每帧保留 77 个 native tokens（7x11 网格），总计最多 539 个记忆 token，外加最多 14 个物体 token。
  - **模型架构**：冻结 Qwen3-VL-2B 视觉塔，动作专家包含 6 个 DiT 块。在每个块中，动作 token 通过 Multi-query attention 读取记忆 token，随后通过 FiLM 对动作 token 进行 scale 和 shift 调制。
- **训练/优化目标**: 联合优化流匹配损失（flow-matching loss）和决策头的交叉熵损失（权重 $\lambda=0.5$）。冻结视觉骨干，从头训练记忆编码器、记忆注意力模块和 FiLM 权重（FiLM 权重初始化为接近 0，以保证训练初期等价于无记忆基线）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：自建的 HuMeGo 基准（6个仿真记忆任务 + 6个真实 Unitree G1 任务），以及标准的 14 个 SIMPLE 全身操作任务。
  - **对比对象（baseline）**：无记忆策略（$\Psi_0$, $\pi_{0.5}$, GR00T, ACT, DP 等），以及均匀记忆策略（Uniform memory，即 RoboMME 风格的等间隔采样帧，保持相同的 token 预算）。
- **评价指标**: 任务成功率（Success rate），以及在记忆任务中单独评估的“记忆决策准确率”（Memory-decision accuracy，即决策头选对提示答案的比例）。
- **主要结果**: 
  - **记忆任务（仿真）**：WholeBodyMem 成功率从基线的 29.1% 大幅提升至 72.6%，记忆决策准确率达 94%（无记忆基线仅 39%，均匀记忆仅 50%）。消融实验证明，基于物体事件选帧贡献了最大的性能增益。
  - **常规任务（仿真）**：在 14 个不需要记忆的标准 SIMPLE 任务中，成功率从 70.2% 提升至 86.9%，证明引入记忆机制不会损害常规的 reactive 技能。
  - **真实机器人部署**：在 6 个真实的 Unitree G1 任务中（包含机器人转身离开线索的困难场景），成功率从 36.7% 提升至 88.3%。

### 8. 🔥 [UniFlowWAM: A Unified World-Action Model with Visual Semantics and 4D Geometry] (UniFlowWAM：融合视觉语义与4D几何的统一世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30991` | [点击跳转](https://arxiv.org/abs/2610.30991)

**领域与类型**：具身智能/机器人操作（Embodied AI / Robot Manipulation），方法创新。

**0. 论文标题**
- **英文标题**: UniFlowWAM: A Unified World-Action Model with Visual Semantics and 4D Geometry
- **中文标题**: UniFlowWAM：融合视觉语义与4D几何的统一世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 将场景级3D流作为与视觉、动作平等的第三模态引入扩散Transformer，通过多目标联合训练提升机器人策略的泛化与操作成功率。

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（根据视觉观察、本体状态和语言指令预测动作序列）。
- **研究动机**: 现有的世界-动作模型（WAM）通常只预测未来的视觉语义，缺乏对场景3D几何和点位移（即4D几何/3D流）的显式建模。以往工作要么把3D流当作独立模块，要么只作为推理时的先验或额外的辅助输出，没有将其作为核心模态与动作和视觉特征进行深度融合。
- **本质改动**: 把场景级3D流提升为与视觉特征、动作平等的第三模态，在同一个扩散Transformer中通过独立的Expert和联合注意力机制进行多模态联合建模。
- **技术溯源**: 基于LDA（Latent-dynamics variants）等统一模型架构，视觉特征提取基于冻结的DINOv3，语言视觉条件基于Qwen3-VL-4B，3D流提取基于Track4World，3D流编解码基于MotionCrafter的4D VAE，基础网络为MMDiT（Multimodal Diffusion Transformer）。

**2. 技术拆解**
- **核心方法**: 提出UniFlowWAM架构，包含视觉、动作、3D流三个独立的Expert，通过联合自注意力（Joint Self-Attention）交互。设计了包含10个训练目标的“角色网格”（Role Grid），为每个模态分配目标（Target）、条件（Condition）或缺失（Absent）角色，实现策略学习、正/逆动力学、视觉预测和流预测的联合训练。
- **关键细节**: 
  - **输入输出**：输入为当前视觉观察、本体状态、语言指令；输出为动作序列、未来视觉特征（DINOv3潜变量）、3D流潜变量。
  - **模型结构**：基于MMDiT，每个模态有独立的归一化、QKV投影和FFN，仅在联合自注意力层交互。使用MM-RoPE进行时空位置编码。
  - **规模与超参**：视觉-语言条件由Qwen3-VL-4B提供，视觉目标由DINOv3提供（均冻结）。3D流由Track4World离线提取并用4D VAE编码。训练在48张H200 GPU上进行，全局batch size 1536。
- **训练/优化目标**: 采用Flow-Matching（流匹配）速度损失函数。10个目标覆盖所有模态组合（如仅预测动作、以流为条件预测动作、预测流等），其中4个目标恢复基础模型的预训练任务，6个目标引入3D流的预测或条件作用。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：仿真使用RoboCasa-GR1、LIBERO和LIBERO-Plus；真实世界使用ALOHA风格双臂机器人的4个操作任务。中训练（mid-training）数据包括RoboCOIN、RoboMIND 2.0和MolmoAct2-BimanualYAM。
  - **对比对象（baseline）**：仿真对比UWM, GR00T-N1.6, StarVLA, FLARE, LDA, OpenVLA-OFT, π_0.5, Track4Action等；真实世界对比π_0.5, DreamZero, LDA。
- **评价指标**: 仿真环境使用任务成功率（Success Rate, SR）；真实世界使用完整任务成功率（Full-task success rate）和过程得分（Process score，完成里程碑的比例）。
- **主要结果**: 
  - **RoboCasa-GR1**：加入中训练后，成功率从基线LDA的52.1%提升至56.4%，在基线较弱的任务上提升更明显。
  - **LIBERO & LIBERO-Plus**：在LIBERO上保持98.1%的分布内成功率；在LIBERO-Plus（分布外扰动）上零样本成功率达到87.7%，显著优于最强基线（如Track4Action的82.3%），特别是在相机视角扰动下达到96.9%（基线76.6%）。
  - **真实世界**：4个任务平均成功率达到87.0%（过程得分92.3），大幅超越最强基线π_0.5的68.5%。消融实验表明，完整的10目标训练比仅用策略目标在真实任务上提升12-18个百分点，尤其在演示数据稀疏的边缘区域提升显著。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30876` | [点击跳转](https://arxiv.org/abs/2610.30876)

**0. 论文标题**
- **英文标题**: LocoManiLab: A Unified Testbed for Data, Policies, Controllers, and Deployment in Humanoid Loco-Manipulation
- **中文标题**: LocoManiLab：人形机器人移动操作中数据、策略、控制器与部署的统一测试平台
- **研究机构**: 原文未提及
- **一句话总结**: 构建了一个涵盖数据、策略、控制器和真机部署的统一测试平台，全面评估了12种主流策略和5种全身控制器在人形机器人复杂家庭移动操作任务中的泛化能力与运动质量。

**1. 整体逻辑**
- **研究任务**: 构建人形机器人移动操作（Loco-Manipulation）的统一基准测试平台，评估不同策略、控制器和数据配置在复杂家庭场景中的任务完成度与运动质量。
- **研究动机**: 现有评估工作缺乏统一框架，单纯的任务成功率掩盖了稳定性和运动质量的差异，且无法全面反映策略在未见任务/场景下的泛化能力，以及策略与不同控制器接口匹配时的真实表现。
- **本质改动**: 将任务设计、多源数据生成、多策略与多控制器适配、以及Sim-to-Real部署整合到一个端到端的测试床中，并引入了运动质量与任务成功率并重的多维评估体系。
- **技术溯源**: 基于MuJoCo仿真器，结合RoboCasa、Objaverse、iTHOR等场景资产；评估了多种现有VLA（如 $\pi_{0.5}$, GR00T N1.7）、WAM（Fast-WAM）和模仿学习基线（Diffusion Policy）；使用了5种全身控制器（SONIC, AMO, HEFT, ALMI, ScaleBFM）；数据生成基于Kimodo运动扩散模型。

**2. 技术拆解**
- **核心方法**: 设计了包含234个原子和组合任务的5类家庭场景任务集；构建了包含VR遥操作、运动合成和轨迹增强的数据管线；设计了适配不同控制器接口的策略评估协议；并提出了结合任务成功率与运动质量指标的综合评价体系。
- **关键细节**: 
  - **任务与数据**：234个任务（102个原子任务+132个组合任务），51.5小时仿真遥操作数据+9小时真机数据。
  - **策略与控制器**：评估12种策略（10种VLA，1种WAM，1种IL基线），在5种全身控制器下运行，控制频率50Hz。
  - **评估维度**：涵盖Seen task、Unseen task、Unseen scene，以及Low/Mid/High三个等级的Domain Randomization (DR) 视觉扰动。
- **训练/优化目标**: 
  - **策略训练**：各策略保留其原有的优化目标（如Diffusion Policy的去噪损失，VLA的flow-matching或action expert loss等）。
  - **数据生成（Kimodo微调）**：使用PPO算法，结合手掌到达目标的距离奖励和躯干倾斜惩罚，对运动扩散模型的去噪器进行微调（对比了LoRA和Full微调）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的LocoManiLab仿真与真机数据集。
  - **Baseline**：12种策略（XR-1, DM0.5, $\pi_{0.5}$, GR00T N1.7, InternVLA-A1.5, SmolVLA, Fast-WAM, PRTS, $\Psi_0$, X-VLA, StarVLA-$\alpha$, Diffusion Policy）。
  - **测试环境**：MuJoCo仿真环境（包含不同DR等级）及Unitree G1真机环境（3个匹配任务）。
- **评价指标**: 任务成功率（SR）；运动质量指标（绝对机械输出功率、脚部滑动、动作频率、跌倒率、相对完成时间）；生成模型的目标误差（Root/Palm error）。
- **主要结果**: 
  - **泛化与鲁棒性**：所有策略在未见任务和未见场景下成功率断崖式下降（如XR-1从80.2%降至25.2%和8.2%）；随着视觉扰动增加，成功率普遍下降，但DM0.5等模型在高扰动下表现更稳。
  - **控制器影响**：最高成功率的控制器不一定运动质量最好（如ALMI成功率最高但跌倒率高，SONIC功耗最低）。
  - **数据与生成**：增加演示数据通常提升成功率，但混合数据源不一定优于纯遥操作；对Kimodo进行Full微调显著提升了运动生成精度和任务成功率（Approach任务SR从39.7%提升至90.7%）。
  - **Sim-to-Real**：仿真和真机上的策略平均排名基本一致，验证了仿真评估对真机部署的指导价值。

### 10. 🔥 [Adaptive Aerial Loco-Manipulation Policy Learning via LLM-Assisted Proactive Task Generation] (基于LLM辅助主动任务生成的自适应空中移动操作策略学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30810` | [点击跳转](https://arxiv.org/abs/2610.30810)

**0. 论文标题**
- **英文标题**: Adaptive Aerial Loco-Manipulation Policy Learning via LLM-Assisted Proactive Task Generation
- **中文标题**: 基于LLM辅助主动任务生成的自适应空中移动操作策略学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出ALMA框架，通过预测监督约束策略上下文以保留历史动态响应信息，并利用LLM主动生成机械臂难任务进行针对性训练，大幅提升了带臂无人机在三维空间中的轨迹跟踪与抗扰动能力。

**1. 整体逻辑**
- **研究任务**: 解决空中移动操作（Aerial Loco-Manipulation，即带机械臂的无人机）在机械臂运动或受外部指令时，因质心偏移、惯量变化和反作用力导致的三维轨迹跟踪控制问题。（本文属于机器人控制与强化学习交叉领域的方法创新与系统工程）
- **研究动机**: 传统基于模型的方法依赖精确的物理建模；现有的基于学习的方法仅靠控制奖励无法为历史状态表征提供直接的监督信号，且固定的任务采样策略会导致模型在持续存在的跟踪难点上探索不足。
- **本质改动**: 引入基于JEPA思想的预测监督（Predictive Supervision），用未来测量表征作为直接目标来训练策略的上下文（Context），使其保留与飞行控制相关的历史响应信息；同时利用LLM分析控制困难的执行记录，主动生成新的机械臂运动结构来扩充训练经验。
- **技术溯源**: 强化学习（PPO）、预测状态表示（PSD/RPSP）、联合嵌入预测架构（JEPA）、非对称Actor-Critic架构、LLM辅助课程学习/任务生成。

**2. 技术拆解**
- **核心方法**: ALMA框架包含两个核心模块：1) 上下文飞行策略与预测上下文学习：使用GRU处理历史观测和动作形成上下文，并通过预测未来K步的测量表征来监督GRU隐藏状态的更新；2) 主动任务生成：利用LLM分析跟踪失败的episode，提出新的机械臂关节运动程序（结构、顺序）和参数，通过进化选择保留难任务加入训练。
- **关键细节**: 
  - 策略输入：CNN编码轨迹预览，MLP编码当前测量（速度、重力、关节位置）和上一动作，GRU输出上下文。动作空间为4个归一化转子命令（绕过名义分配器，直接端到端控制）。
  - 预测监督：预测步长K=5（对应50ms），使用余弦距离计算预测损失，目标编码器通过EMA（衰减率0.85）更新。
  - LLM任务生成：LLM根据执行证据提出运动程序，Sobol采样探索参数空间。根据跟踪失败率和RMSE评估难度，保留难任务。生成任务采样概率根据策略表现动态调整（0.05到0.20）。
- **训练/优化目标**: 总损失为 $\mathcal{L} = \mathcal{L}_{\mathrm{PPO}} + \lambda_{\mathrm{pred}} \mathcal{L}_{\mathrm{pred}}$。PPO损失优化跟踪奖励（位姿误差、动作平滑度、防碰撞），预测损失（余弦距离）约束历史表征以准确预测未来测量特征。

**3. 实验结果**
- **实验设置**: 
  - 仿真环境：NVIDIA Isaac Sim（训练），MuJoCo（硬件在环评估）。
  - 对比基线：PID (PX4), PID-INDI, PID+L1, NMPC, Zhang et al. (基于学习的潜在动态推断)。
  - 测试任务：Hover及多种复杂轨迹（Figure-eight, Polynomial等），分静态机械臂指令和周期性机械臂指令。
- **评价指标**: 位置RMSE (cm), 偏航角RMSE (度), 成功率 (SR)。
- **主要结果**: 
  - 仿真对比：ALMA在静态和周期性指令下的位置RMSE比最强基线NMPC分别降低24.5%和24.7%。相比Zhang et al.，周期性指令下位置和偏航RMSE分别降低76.9%和79.7%，成功率达100%。
  - 消融实验：预测监督（K=5）相比无预测的GRU，位置RMSE降低11.0%；LLM主动任务生成在分布外（OOD）机械臂运动上的泛化能力显著优于随机进化。
  - 真机零样本迁移：在周期性机械臂运动下的悬停实验中，位置RMSE从PID的15.55 cm降至3.17 cm（降低79.6%），单步推理延迟仅1.7ms。

### 11. 🔥 [Self-Distilling Future Video Representations for World Action Models] (面向世界动作模型的未来自视频表示自蒸馏)
- **研究机构**: `RLWRLD Inc.`
- **Arxiv ID**: `2610.30320` | [点击跳转](https://arxiv.org/abs/2610.30320)

**0. 论文标题**
- **英文标题**: Self-Distilling Future Video Representations for World Action Models
- **中文标题**: 面向世界动作模型的未来自视频表示自蒸馏
- **研究机构**: RLWRLD Inc.
- **一句话总结**: 提出 FRED 框架，通过自蒸馏和历史上下文条件，提升世界动作模型（WAMs）在单步去噪中生成的未来视频表示质量，从而大幅提高机器人策略的零样本泛化和人类技能迁移能力。

**1. 整体逻辑**
- **研究任务**: 基于预训练视频扩散模型（VDM）的世界动作模型（WAMs）的机器人策略学习。
- **研究动机**: 现有 WAMs 为提升推理效率，将视频去噪减至单步，用中间隐状态作为动作解码条件。但这导致动作预测极度依赖该隐状态（未来表示）的质量，而从纯噪声单步生成的表示与真实干净未来观测的表示之间存在明显差距，限制了控制性能。
- **本质改动**: 将 VDM 视为“未来表示生成器”，引入自蒸馏机制，用带噪的真实未来观测提取的表示作为目标，去对齐单步纯噪声生成的表示，并加入历史观测序列作为时间上下文条件。
- **技术溯源**: 基于预训练视频扩散模型（如 Wan2.2-TI2V-5B, Wan2.1-I2V-14B）和 Diffusion Transformer (DiT) 架构，属于 World Action Models (WAMs) 范式（如 DiT4DiT）。

**2. 技术拆解**
- **核心方法**: FRED (Future RE presentation learning via self-Distillation with temporal context)。包含两个核心机制：1) 自蒸馏对齐：学生网络从纯噪声生成中间表示，动量教师网络（EMA）从带噪的真实未来观测中提取目标表示，通过最小化两者分布的 KL 散度进行对齐；2) 历史上下文条件：将 VDM 的条件输入从单帧扩展为包含历史观测的短序列，提供时间动态线索以更好地推断未来运动。
- **关键细节**: 
  - 输入输出：输入为当前及历史观测、文本指令、纯噪声（学生）或带噪未来观测（教师）；输出为中间隐状态（用于动作解码）和动作序列。
  - 模型结构：视频骨干（Wan 5B/14B）+ 动作解码器（DiT）。特征提取层：5B 模型取第 19 层，14B 模型取第 25 层。
  - 关键超参：教师噪声水平 $\tau=0.25$，自蒸馏损失权重 $\lambda_{SD}=0.01$，温度参数 $\gamma_1=0.1, \gamma_2=0.04$，历史帧数 4 帧。
- **训练/优化目标**: 联合优化视频 Flow-Matching 损失和自蒸馏 KL 散度损失，动作解码器使用 Flow-Matching 损失。关键机制：自蒸馏损失只更新视频骨干参数，动作损失不反向传播到视频骨干（Stop-gradient），实验证明这比联合优化效果更好。

**3. 实验结果**
- **实验设置**: 
  - 数据集：DROID（零样本环境泛化），OpenArm（人机协同训练），RoboCasa Kitchen / GR-1 Tabletop / LIBERO（仿真消融）。
  - 对比对象（Baseline）：WAMs (DiT4DiT, Fast-WAM, AGRA, DreamZero)，VLAs ($\pi_{0.5}$, GR00T N1.7)，以及表示学习方法 (VideoREPA, SRA, Self-Flow)。
- **评价指标**: 任务成功率（Success Rate）、任务进度率（Task Progress Rate）、指令跟随率（Instruction Following）、推理延迟（Inference latency）。
- **主要结果**: 
  - 零样本泛化（DROID, 14B规模）：长程任务成功率从 61.7% (DreamZero) 提升至 81.7%，域外任务从 10.4% 提升至 52.1%。
  - 人类技能迁移（OpenArm）：任务成功率从 19.4% (DiT4DiT) 提升至 50.0%，指令跟随率达 97.2%。
  - 效率与消融：5B 模型推理延迟 0.136s（处理 5 帧），14B 模型 0.406s，比 DreamZero (3.255s) 快约 8 倍。消融实验证明自蒸馏和历史上下文均带来互补收益，且从噪声生成的表示质量与最终控制性能高度正相关（相关系数 r=0.89）。

### 12. 🔥 [Externalise the Memory: A Pre-Registered Study of Where an Embodied Agent's Experience Should Live] (外部化记忆：关于具身智能体经验应存储于何处的预注册研究)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30478` | [点击跳转](https://arxiv.org/abs/2610.30478)

**0. 论文标题**
- **英文标题**: Externalise the Memory: A Pre-Registered Study of Where an Embodied Agent's Experience Should Live
- **中文标题**: 外部化记忆：关于具身智能体经验应存储于何处的预注册研究
- **研究机构**: 原文未提及
- **一句话总结**: 通过预注册的严格对照实验证明，在具身任务中，将智能体经验作为外部上下文检索比将其蒸馏进模型权重表现好得多，因为权重只能拟合静态的边际先验，而检索能提供动态的条件修正。

**1. 整体逻辑**
- **研究任务**: 探究具身智能体积累的经验（记忆）应该存储在策略权重中（参数化记忆/蒸馏），还是保留在外部并在推理时检索（上下文记忆/RAG）。
- **研究动机**: 在语言模型中，RAG和微调各有优劣，但在具身智能体领域，由于检索上下文会随经验增长而权重固定，哪种方式更好一直缺乏受控条件下的实证研究。现有工作往往同时改变模型和记忆模块，无法孤立出“记忆存储位置”这一单一变量。
- **本质改动**: 设计了一个控制单一变量的实验框架，在**完全相同的模型权重**下，对比“将记忆蒸馏进权重”和“在推理时挂载冻结的检索缓冲区”两种协议，并引入预注册（Pre-registration）机制来严谨地解释和对待零结果（null result）。
- **技术溯源**: 基于 Gemma-4-31B-it (VLM基座), Isaac Lab (仿真环境), DINOv2 (图像特征检索), LoRA (参数高效微调), KTO (偏好优化)。

**2. 技术拆解**
- **核心方法**: 
  1. 构建一个带外部记忆的Teacher（VLM），在任务中生成轨迹，Teacher在推理时检索过去的经验（文本+图像）。
  2. 从Teacher的轨迹中蒸馏Student策略（LoRA adapter），设计不同的训练目标（仅动作、带思考、带经验摘要等）。
  3. 设计严格的推理协议对比：核心是“相同权重对比”，即使用同一个Student权重，对比“无检索”和“挂载Teacher冻结检索缓冲区”的表现。
  4. 采用预注册机制，在训练前锁定假设、对比组和统计检验方法，防止p-hacking。
- **关键细节**: 
  - 环境：Isaac Lab 双臂操作环境（右臂冻结，仅左臂执行单臂reach任务）。
  - Teacher：Gemma-4-31B-it (4-bit)，使用 DINOv2 提取图像特征进行 top-K 经验检索。
  - Student：基于 Gemma-4-31B-it 的 LoRA adapter (rank-16)，训练分两阶段：SFT (992个正向轮次) + composable-KTO (992正向+1799负向轮次)。
  - 数据控制：所有训练臂共享相同的 2791 轮轨迹池（SHA-256 校验），确保训练样本数量一致。
- **训练/优化目标**: 
  - 训练目标：SFT 最小化行为克隆损失，KTO 优化偏好对齐（以冻结的 SFT adapter 为参考）。
  - 核心分析机制：通过行为探针（R1 ΔX probe）分析第一轮动作的均值和方差，探究蒸馏和检索分别转移了哪种知识（边际先验 vs 条件修正）。

**3. 实验结果**
- **实验设置**: 
  - 任务：Isaac Lab 中的视觉条件单臂 reach 任务 (L0a-Left)，以及更难的双臂 position-goal reach 任务 (L2)。
  - 对比对象 (baseline)：A_action_only (仅动作蒸馏), A_ctrl_rat (带思考蒸馏), B_main (带经验摘要和思考蒸馏), C_retrieval (A_ctrl_rat权重 + 推理时挂载冻结检索缓冲区)。
- **评价指标**: 任务成功率 (Success Rate, SR)，以及预注册的统计检验（如双比例 z 检验、McNemar 检验），并报告了 auto-reset sensitivity。
- **主要结果**: 
  - **参数化记忆失败（零结果）**：将带记忆Teacher的行为蒸馏进权重（B_main）相比仅动作蒸馏（A_action_only）仅提升 +1 pp（不显著），根据预注册规则撤回“记忆可烘焙进权重”的假设。机制探针表明，蒸馏只学到了静态的边际先验（所有episode采用相同的动作偏移），丢失了条件结构。
  - **上下文记忆显著成功**：在固定权重上挂载检索缓冲区（C_retrieval）相比无检索（A_ctrl_rat）成功率大幅提升 +34 pp (z=5.15)，达到了Teacher的参考水平（49% vs 49.3%）。预注册的协议对比（C_retrieval vs B_main）也提升了 +23 pp。
  - **跨任务验证 (L2)**：在更难的双臂任务上，检索优势方向一致（+6 pp），但未达到显著性，诊断表明效果衰减与记忆缓冲区覆盖率（数据量较少）及起始距离门控有关。
  - **核心结论**：边际知识（平均修正）可以转移进权重，但条件知识（依赖具体情境的修正）必须保留在外部上下文中，即系统设计应“外部化记忆”。

### 13. 🔥 [Alpha: Systematic Fault Injection and Robustness Evaluation for LLM-Driven Embodied Manipulation] (Alpha：面向LLM驱动具身操作的系统性故障注入与鲁棒性评估)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.30197` | [点击跳转](https://arxiv.org/abs/2610.30197)

**0. 论文标题**
- **英文标题**: Alpha: Systematic Fault Injection and Robustness Evaluation for LLM-Driven Embodied Manipulation
- **中文标题**: Alpha：面向LLM驱动具身操作的系统性故障注入与鲁棒性评估
- **研究机构**: 原文未提及
- **一句话总结**: 提出Alpha故障注入框架与确定性对照基线，证明LLM机器人在物理/运动学故障下的失败率与完美脚本控制器完全一致，其整体性能劣势仅源于JSON序列化接口的脆弱性。

**1. 整体逻辑**
- **研究任务**: 评估大语言模型（LLM）驱动的具身机器人在感知、规划、运动学和执行等底层物理栈遭遇故障时的鲁棒性，并对失败原因进行精准归因。
- **研究动机**: 现有的具身LLM评估只看名义环境下的端到端成功率，无法定位失败原因（是物理环境限制、传感器延迟，还是LLM自身的推理/序列化缺陷）。缺乏严格对照导致物理故障和LLM认知缺陷被混为一谈。
- **本质改动**: 把软件工程里的“混沌工程”引入具身操作，构建模块化的故障注入中间件，并设计了一个共享完全相同物理种子和环境的“确定性脚本基线（Scripted Oracle）”与LLM进行反事实对照评估，从而把物理限制和接口缺陷剥离开。
- **技术溯源**: 基于 PyBullet 物理仿真引擎、Llama-3 (via Ollama) 作为 LLM planner、Pydantic 用于 JSON schema 验证。

**2. 技术拆解**
- **核心方法**: 
  1. 故障注入中间件 (ChaosRoboticsWrapper)：在四个边界注入故障：感知层（传感器延迟）、执行层（抓取滑动）、运动学层（不可达的IK目标）、序列化层（规划输出损坏）。
  2. 匹配的反事实评估方法：让 LLM agent 和确定性 Scripted Oracle 在完全相同的 episode（相同种子、几何、物理参数）下运行，以隔离环境物理限制和规划器接口敏感性。
  3. 高频安全监控与去重：240Hz 的 PyBullet 安全监控，通过时间窗口去重避免接触力震荡导致的误报。
- **关键细节**: 
  - 任务：单物体桌面 pick-and-place（7-DOF 机械臂）。
  - 故障强度：归一化标量 $I \in \{0.33, 0.66, 1.00\}$ 对应低、中、高。
  - 实验矩阵：共 150 个 episode（75个给 LLM，75个给 Oracle），包含 10 个无故障 baseline，12 个单故障条件（4类故障*3强度），5 个并发故障条件。
  - LLM 配置：Llama-3，本地 Ollama 推理，温度 0.0，贪心解码。
- **训练/优化目标**: 非学习类工作。核心机制是通过控制变量法（相同的物理种子和故障参数）对比两个 planner 的成功率，并使用 McNemar 检验进行配对统计显著性分析。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：PyBullet 仿真环境中的桌面抓取放置任务。
  - 对比对象（baseline）：确定性脚本规划器（Scripted Oracle），它直接读取 ground-truth 并生成运动学轨迹，绕过 JSON 序列化。
- **评价指标**: 任务成功率（Task success rate）、连续放置误差（Continuous placement error）、安全事件数（Safety incidents）。
- **主要结果**: 
  - 整体矩阵中，Oracle 成功率 64.0%，LLM 为 44.0%（p=3.01e-4）。
  - **核心发现**：排除序列化故障（F4）后，在剩余的 60 个物理/运动学/感知故障 episode 中，两者成功率完全相同，均为 55.0%（33/60），且不一致对数为 0（p=1.00）。
  - 结论：物理执行器滑动、运动学边界和感知延迟对确定性控制器和 LLM 的影响是等效的。LLM 整体性能的下降完全是由 F4（规划输出损坏导致 Pydantic schema 验证失败）引起的，暴露了 prompt-to-JSON 接口的脆弱性，而非 LLM 内在的空间/物理推理缺陷。

### 14. 🔥 [Inside-JEPA: From Prediction to Relational Grounding in Latent World Models] (Inside-JEPA：在潜在世界模型中从预测走向关系接地)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31194` | [点击跳转](https://arxiv.org/abs/2610.31194)

**0. 论文标题**
- **英文标题**: Inside-JEPA: From Prediction to Relational Grounding in Latent World Models
- **中文标题**: Inside-JEPA：在潜在世界模型中从预测走向关系接地
- **研究机构**: 原文未提及
- **一句话总结**: 在JEPA世界模型的潜在状态中显式引入实体间的“关系通道”，并证明仅通过逆动力学损失（无需关系标签）就能让这些通道学到有意义的空间关系，从而支持基于关系的预测和规划。

**1. 整体逻辑**
- **研究任务**: 改进潜在世界模型（Latent World Models），使其潜在状态能够显式表达并预测实体间的空间/几何关系（如包含、重叠、左右等），以解决世界模型状态不透明、难以直接用关系词汇设定目标的问题。
- **研究动机**: 现有的JEPA等世界模型在潜在空间中预测，状态向量是不透明的。虽然可以用线性探针从中读出关系，但状态中并没有专门的部分来“承诺”表示这些关系（即符号接地问题），导致无法直接用关系词汇来表达模型信念或设定规划目标。
- **本质改动**: 在JEPA的潜在状态中为有序实体对显式构建“关系通道”（relational channels，即软符号向量），并引入逆动力学损失，强制这些通道的变化必须能解释动作的发生，从而在没有关系标签的情况下实现“关系接地”。
- **技术溯源**: 基于联合嵌入预测架构（JEPA）和 V-JEPA 2，使用 ResNet-18 或 V-JEPA 2 作为视觉编码器，结合 Grounding DINO 和 SAM 2.1 进行物体检测与跟踪。

**2. 技术拆解**
- **核心方法**: 
  1) **状态构建**：将实体特征与边界框坐标结合，通过关系头（MLP+Sigmoid）为每对实体生成0-1之间的软符号向量（关系通道），与实体潜在向量拼接构成完整状态。
  2) **逆动力学接地**：在标准JEPA预测损失之外，增加一个逆动力学头，要求从当前和未来的“关系通道”中恢复出中间执行的动作。这使得关系通道的变化必须携带动作信息，从而迫使通道去编码那些随动作变化的真实空间关系（如接触、包含）。
- **关键细节**: 输入为两帧图像及实体边界框（或自动跟踪的框）及中间动作。实体框裁剪至96x96，通过冻结的ResNet-18提取特征，结合框坐标的傅里叶特征。关系头输出8或16个通道。预测器为两层MLP。5关系模型约91万可训练参数。目标编码器使用动量0.996的EMA。
- **训练/优化目标**: 主损失为JEPA潜在预测损失（L2距离）；辅助损失为逆动力学损失（对动作分类使用交叉熵，对机器人连续控制使用MSE），权重λ=1。优化器为AdamW，学习率2e-4。

**3. 实验结果**
- **实验设置**: 数据集包括 Something-Something V2 (配合Something-Else边界框)、RH20T (机器人操作数据集) 以及 Blocks2D (2D控制环境)；也测试了使用 Grounding DINO + SAM 2.1 自动检测跟踪的物体。对比基线包括：仅预测的 PRED、打乱动作标签的 INV-SHUF、逆动力学头读取实体特征的 INV-R、读取全状态的 INV-Z，以及无监督损失（AOT, InfoNCE）。
- **评价指标**: 
  1) **匹配关系AUROC (mAUROC)**：通过匈牙利匹配将通道与真实关系对齐，并与随机初始化的关系头对比计算Margin，衡量接地效果。
  2) **关系变化预测AUROC**：衡量预测未来关系变化的准确性。
  3) **一步规划Top-5准确率**：给定目标关系，从候选动作模板中选出正确动作的Top-5命中率。
- **主要结果**: 
  1) 纯预测（PRED）无法让关系通道学到有意义的关系（mAUROC甚至不高于随机头）。
  2) 加入逆动力学（INV-S）后，在SSv2的10种设置中mAUROC提升0.065–0.103；在RH20T机器人数据上提升0.081；在使用自动检测跟踪物体的设置中提升0.050–0.061。
  3) 消融证明，必须是逆动力学头直接读取“关系通道”且使用“正确的动作标签”（需数千对）才能接地，仅解码动作（INV-R）或无监督损失均无效。
  4) 接地后的通道能很好地预测关系变化（AUROC 0.599 vs 真实未来0.621），并在一步规划中，基于通道的探针Top-5准确率达到43%（0.425），远超纯预测模型的24%（0.244）和频率先验的17%（0.174）。

### 15. 🔥 [RynnUnify: Towards Unified Embodied Brain] (RynnUnify：迈向统一的具身大脑)
- **研究机构**: `Alibaba DAMO Academy`
- **Arxiv ID**: `2610.32965` | [点击跳转](https://arxiv.org/abs/2610.32965)

**0. 论文标题**
- **英文标题**: RynnUnify: Towards Unified Embodied Brain
- **中文标题**: RynnUnify：迈向统一的具身大脑
- **研究机构**: Alibaba DAMO Academy
- **一句话总结**: 提出了一个 16B 的统一具身多模态模型 RynnUnify，通过交错的视频-语言推理实现长视野视觉规划，并扩展出智能体推理和机器人控制能力。

**1. 整体逻辑**
- **研究任务**: 构建统一的具身大脑，使模型能够同时具备物理世界理解、长视野视觉规划以及机器人动作控制能力。
- **研究动机**: 现有的统一多模态模型（UMMs）在处理长视野任务时，场景变化和预测误差容易累积，且静态视觉预测会忽略中间动态过程。此外，目前缺乏评估持续视觉规划以及视频预测对未来状态推理贡献的专用基准。
- **本质改动**: 将自回归推理与扩散视频生成结合，通过“交错视频-语言推理”让推理器指导连续的视频预测，并用预测结果反哺后续子任务规划；同时通过强化学习和联合训练，把这种“理解+预测”能力直接转化为智能体决策和机器人控制。
- **技术溯源**: 基于 Cosmos3 的 Mixture-of-Transformers (MoT) 架构，以及 RynnBrain 的预训练语料。

**2. 技术拆解**
- **核心方法**: 
  1. **基础架构**：采用 MoT 架构，包含 8B 自回归推理器和 8B 扩散生成器（基于 rectified flow），两者通过联合注意力（joint attention）进行交互。
  2. **跨块场景记忆**：引入 4 个参考帧（初始帧、历史关键帧、最近步）和连续时间前缀，解决长视野生成中物体移出视野或上下文丢失的问题，支持 I2V、FL2V 和跨块视频续写。
  3. **智能体扩展（Agentic extension）**：在推理器基础上用强化学习微调出 8B 智能体，使其能动态决定是直接回答，还是调用冻结的生成器生成视频来推理未观察状态。
  4. **世界-动作扩展（WAM）**：通过潜在规划和联合视频-动作训练，将完整的 RynnUnify 扩展为机器人控制模型。
- **关键细节**: 
  - **视觉分词**：使用因果视频 VAE，空间和时间压缩比分别为 16 和 4。
  - **记忆机制**：4 个参考帧独立编码为视觉 token 组，拼接在推理器文本上下文和主视频 token 之间，不破坏主视频的时间轴。
  - **条件控制**：生成器接收包含子任务指令、预期视觉演变描述和时长的结构化文本条件；支持 $4n+1$ 帧的可变长序列，使用 3D RoPE 和帧率调制处理时空坐标。
  - **数据与训练**：理解数据使用 RynnBrain 10% 子集；生成数据涵盖第一人称活动和机器人操作，训练时引入场景记忆和 self-forcing 策略以提升长视野生成的视觉一致性。
- **训练/优化目标**: 
  - **生成器**：仅对需要预测的视频位置计算去噪/生成损失。
  - **智能体扩展**：使用带最终答案反馈的强化学习（RL with final-answer feedback）进行后训练。
  - **世界-动作扩展**：联合视频-动作训练（joint video-action training）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：公共具身理解基准，以及新提出的 Rynn-VP（长视野视觉规划）和 Rynn-GEU（预期推理，含直接和生成辅助设置）。机器人控制使用 RoboCasa365（仿真）和 Astribot S1（真机）。
  - **对比对象**：Cosmos 3 Nano 等现有统一多模态模型（UMMs）。
- **评价指标**: 
  - **具身理解**：平均理解得分。
  - **视觉规划**：Rynn-VP 总分。
  - **预期推理**：Rynn-GEU 平均分。
  - **机器人控制**：任务成功率（Success rate）。
- **主要结果**: 
  - **具身理解**：在评估的 UMMs 中取得最高的平均具身理解得分。
  - **视觉规划**：在 Rynn-VP 上比 Cosmos 3 Nano 提高 9.75 分。
  - **预期推理**：智能体扩展在 Rynn-GEU 上比直接推理提高 6.0 分。
  - **机器人控制**：世界-动作扩展在 RoboCasa365 的 20 个复合任务上达到 51.5% 成功率；在 Astribot S1 的 3 个真机任务上平均成功率达 46.7%。

### 16. 🔥 [If at First You Don't Succeed, Backtrack: Lightweight Recovery for Frozen VLAs] (初次失败就回溯：面向冻结 VLA 的轻量级恢复机制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.32941` | [点击跳转](https://arxiv.org/abs/2610.32941)

**0. 论文标题**
- **英文标题**: If at First You Don't Succeed, Backtrack: Lightweight Recovery for Frozen VLAs
- **中文标题**: 初次失败就回溯：面向冻结 VLA 的轻量级恢复机制
- **研究机构**: 原文未提及
- **一句话总结**: 给冻结的 VLA 加一个极小的失败预测头，发现要失败时就让机械臂原路退回几步再重试，无需重训模型或收集恢复数据就能显著降低长序列任务的失败率。

**1. 整体逻辑**
- **研究任务**: 提高视觉-语言-动作（VLA）模型在机器人操作任务中的鲁棒性，解决其因进入训练数据未覆盖状态（OOD）而导致的任务失败问题。
- **研究动机**: VLA 模型在遇到分布外状态时很脆弱。现有的失败恢复方法通常需要收集昂贵的恢复演示数据、重训策略，或者在推理时引入额外的庞大模型，成本太高且难以泛化。
- **本质改动**: 不改变原 VLA 策略，也不学习新的恢复策略，而是通过一个轻量级的失败预测头监测内部特征，在预测到失败时直接让机械臂“原路退回”到之前的状态，把控制权交还给原策略重试。
- **技术溯源**: 基于现有的 VLA 模型（SmolVLA, $\pi$0.5, $\pi$0-FAST）以及 LeRobot 代码库。

**2. 技术拆解**
- **核心方法**: 包含两部分：1) 失败预测头（FPH）：读取 VLA 前向传播时已有的内部特征，预测当前 episode 失败的概率；2) 回溯控制器（Backtracking Controller）：当失败概率超阈值时暂停策略，从缓冲区读取机械臂实际执行的位移并逆向回放，让机械臂退回之前的构型，然后交还控制权。
- **关键细节**: 
  - FPH 结构：多层注意力池化（MAP）层 + 3层前馈网络（FFN），输出单一标量（失败概率）。
  - 特征来源：主要使用 VLM 处理前缀后的输出表示（`post` 特征），复用已有计算，无需额外前向传播。
  - 参数开销：FPH 仅增加原策略 0.48%–0.88% 的参数量。
  - 回溯机制：记录的是机械臂实际发生的位移（achieved delta）而非指令位移，以应对物理遮挡等情况；支持固定步数回溯或自适应回溯（退到失败概率低于低阈值为止）。
- **训练/优化目标**: FPH 的训练目标是二分类（预测 episode 最终成功或失败）。训练数据完全来自冻结策略在 LIBERO 上的自主 rollout，采用平衡采样以应对不同任务套件间失败率极度不均的问题。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（包含 Spatial, Object, Goal, Long 四个套件）和 MetaWorld。
  - 对比对象（baseline）：未加辅助的冻结 VLA 策略（SmolVLA, $\pi$0.5, $\pi$0-FAST）。
  - 测试环境：仿真环境，步数预算翻倍以容纳回溯步数，回溯步数计入总步数预算。
- **评价指标**: 成功率（Success Rate）、成功率提升（Uplift，百分点）、失败率降低比例（Recovery rate）。
- **主要结果**: 
  - 在失败率最高的 LIBERO-Long 套件上，Backtrack 将 SmolVLA、$\pi$0.5 和 $\pi$0-FAST 的失败率分别降低了 19.0%、30.3% 和 48.2%（成功率分别提升 7.40、1.60 和 7.08 个百分点）。
  - 在 LIBERO 四个套件平均来看，失败率降低了 19.6%–26.2%。
  - 在 MetaWorld 数据集上，测试的 12 种控制器配置全部提升了 SmolVLA 的表现（成功率提升 2.44–5.20 个百分点）。
  - 消融实验表明，单纯增加执行步数（不回溯）只能带来 2.3-3.7% 的提升，证明回溯机制本身是有效的；在短序列任务（基线成功率已达 85-99%）中提升较小，主要收益来自长序列任务。

### 17. 🔥 [Adaptive World-Models for Anomaly Recognition (AWARE): A Framework for Robot Dynamics Prediction and Introspection] (用于异常识别的自适应世界模型（AWARE）：机器人动态预测与内省框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.32742` | [点击跳转](https://arxiv.org/abs/2610.32742)

**0. 论文标题**
- **英文标题**: Adaptive World-Models for Anomaly Recognition (AWARE): A Framework for Robot Dynamics Prediction and Introspection
- **中文标题**: 用于异常识别的自适应世界模型（AWARE）：机器人动态预测与内省框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出 AWARE 框架，通过联合训练潜在动态估计器和世界模型，在仅使用高噪声外部摄像头监控的情况下，实现了对机器人系统异常（如电机退化、负载碰撞）的鲁棒检测与故障源定位。

**1. 整体逻辑**
- **研究任务**: 在无法获取机载传感器（如电机编码器）的严格安全或老旧硬件场景下，仅依靠外部摄像头进行机器人系统的异常检测与故障诊断。
- **研究动机**: 传统异常检测依赖精确的机载传感器状态估计，而纯视觉的外部被动监控会引入巨大噪声，导致现有方法失效；同时，基于大模型（LLM/VLM）的方法虽然不依赖精确状态，但缺乏对细微时间动态（如机械逐渐退化）的感知能力，容易漏报。
- **本质改动**: 抛弃对完美系统识别的依赖，引入“潜在动态估计器+世界模型”的双信号架构，将高噪声视觉状态转化为对系统内在动态参数（如电机强度）的潜在表征，从而在噪声中剥离出真实的物理异常。
- **技术溯源**: 基于 Regularized Online Adaptation (ROA) 的潜在动态估计思路，以及 Dreamer 系列 / Robotic World Model (RWM) 的循环状态空间模型 (RSSM) 和 Transformer 世界模型架构。

**2. 技术拆解**
- **核心方法**: AWARE 框架包含两个核心模块：1) 潜在动态估计器（学生网络），从状态-动作历史中推断系统动态的潜在表示；2) 世界模型，以该潜在表示和当前动作为条件，预测下一状态。通过计算“世界模型预测误差”和“潜在动态偏差”两个独立的异常分数来进行决策，并增加了一个解码器用于内省（故障定位）。
- **关键细节**: 
  - 输入输出：输入为历史 $H$ 步的状态-动作对和当前动作；输出为下一状态的高斯分布预测，以及系统动态的潜在编码。
  - 模型结构：世界模型骨干测试了 Transformer 和 RSSM 两种架构。去除了 ROA 原方法中的教师正则化和潜在瓶颈（latent bottleneck）以保留更多动态信息，并增加了系统参数解码器以支持内省。
  - 规模与超参：历史窗口 $H=64$，预测窗口 $N=20$。Transformer 和 RSSM 参数量分别为 60万和 40万，估计器参数量 50万。
- **训练/优化目标**: 
  - 完全在仿真（MuJoCo）中通过域随机化（Domain Randomization）训练，无需真实系统的完美参数识别或异常先验。
  - 估计器损失：最小化学生网络预测的潜在表示与教师网络（基于真实动态参数）生成的潜在表示之间的均方误差（MSE）。
  - 世界模型损失：最小化下一状态预测的负对数似然（NLL）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：自建的 240 条真实世界机器人起重机（robotic crane）轨迹（80条正常，40条负载碰撞，120条电机退化）。
  - 对比对象（baseline）：Isolation Forest, Statistical Anomaly Detection, 基础模型 (AESOP, AnyAnomaly), 物理仿真器 (MuJoCo), 纯世界模型 (RSSM, Transformer), ROA, RWM。
  - 测试环境：分为低噪声（Motion Capture 动捕质量）和高噪声（Camera Only 纯外部摄像头）两种状态估计管线。
- **评价指标**: 轨迹级别的平均精度（Average Precision, AP）和 F1 分数。
- **主要结果**: 
  - 低噪声下：Transformer AWARE 的 AP 达到 0.93，比最强 baseline (RWM) 提升 3%。
  - 高噪声（纯摄像头）下：Transformer AWARE 的 AP 达到 0.77，比最强 baseline (RWM) 显著提升 26%。纯预测误差方法在高噪声下 AP 平均下降 44%，而 AWARE 的双信号架构有效抵抗了噪声。
  - 故障定位（内省）：在高噪声下，模型能以 88% 的准确率解码并定位发生退化的具体电机。
  - 结论验证：基于语义的基础模型（AESOP, AnyAnomaly）表现远差于基于动态的方法，证明在机器人异常检测中，精确的时间动态建模比视觉语义泛化更关键。

### 18. 🔥 [HGWM: Hierarchical Graph-Guided World Model for Zero-Shot Object Navigation via Graph Matching] (HGWM：通过图匹配进行零样本目标导航的分层图引导世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.32554` | [点击跳转](https://arxiv.org/abs/2610.32554)

**0. 论文标题**
- **英文标题**: HGWM: Hierarchical Graph-Guided World Model for Zero-Shot Object Navigation via Graph Matching
- **中文标题**: HGWM：通过图匹配进行零样本目标导航的分层图引导世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种结合分层目标先验图与持久空间语义记忆的世界模型，通过粗到细的符号图匹配机制评估候选方向，有效提升了零样本目标导航的成功率。

**1. 整体逻辑**
- **研究任务**: 零样本目标导航（Zero-shot Object Navigation），即智能体在未知室内环境中，仅根据目标物体的类别名称寻找并导航至该物体。
- **研究动机**: 现有的基于大模型的导航智能体虽然能识别物体，但容易受模糊观察和不完整空间记忆的干扰，导致无效搜索。现有方法（如WMNav）缺乏对“目标可能出现在哪些房间及周围有哪些锚点物体”这一常识关系先验的显式利用，难以在观察中区分真实证据和误导性解释。
- **本质改动**: 把找东西的逻辑从“单纯看当前画面像不像”改成了“拿着常识关系图去和当前观察做符号匹配”。前人主要靠VLM直接打分和好奇心地图，这篇工作引入了LLM生成的房间-锚点先验图，并在导航中维护一个空间语义图，通过显式的图结构匹配（计算房间、物体、空间关系的重合度）来修正和补充VLM的视觉打分。
- **技术溯源**: 基于预训练的视觉语言模型（VLM，如Gemini-1.5-Pro）进行场景理解和粗打分，基于大语言模型（LLM，如Qwen2.5-7B-Instruct）生成先验图和推荐方向。系统架构继承了WMNav的地图与策略结构。

**2. 技术拆解**
- **核心方法**: 
  1. **目标先验与观察记忆**：LLM根据目标类别生成包含可能房间、锚点物体及连接关系的先验图。同时，利用RGB-D观测构建并更新持久的空间语义图记忆。
  2. **粗视觉语义打分**：VLM对全景图的6个候选方向进行0-10的打分，评估目标可见性和探索潜力。
  3. **细符号兼容性匹配**：计算当前观察图与先验图在房间、物体、空间、语义和深度5个维度的符号特征重叠度（如Jaccard相似度），得到0-1的兼容性分数。
  4. **阶段依赖融合**：根据细分数判断当前处于目标验证、聚焦搜索还是边界探索阶段，动态调整粗分数、细分数和LLM方向推荐值的融合权重，更新好奇心地图并选择移动方向。
- **关键细节**: 
  - **输入输出**：输入为RGB-D图像、平面位姿和目标类别；输出为6个候选方向（30至330度，间隔60度）的融合得分。
  - **模型选择**：VLM使用Gemini-1.5-Pro，LLM使用Qwen2.5-7B-Instruct。
  - **关键超参**：最大导航步数40步，成功阈值1.0m，地图分辨率100像素/米。融合权重为启发式系数，非概率分布，且根据阶段动态调整。
- **训练/优化目标**: 非学习类工作，无需训练。核心机制是基于启发式规则的符号图匹配算法和阶段依赖的分数融合策略。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：HM3D v0.1、HM3D v0.2 和 MP3D。
  - **对比对象（baseline）**：Habitat-Web、OVRL-V2、ZSON、VLFM、UniGoal、SG-Nav、WMNav等（主要对比WMNav）。
- **评价指标**: Success Rate (SR, 成功率) 和 Success weighted by Path Length (SPL, 路径长度加权成功率)。
- **主要结果**: 
  - 在HM3D v0.1上，HGWM达到62.6% SR和31.5% SPL，比WMNav（58.1% SR, 31.2% SPL）分别提升4.5和0.3个百分点。
  - 在MP3D上，达到46.8% SR和17.9% SPL，比WMNav提升1.4和0.7个百分点。
  - 在HM3D v0.2上的消融实验表明，完整模型达到74.4% SR和31.9% SPL；移除目标先验、关系细化、LLM仲裁或改用非自适应权重，会导致SR下降0.9–2.3个百分点，SPL下降0.6–1.5个百分点，验证了各组件的有效性。

### 19. 🔥 [LogLook: Execution-Grounded Memory for Frontier-Model Robot Planners] (LogLook：面向前沿大模型机器人规划器的执行锚定记忆机制)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.32348` | [点击跳转](https://arxiv.org/abs/2610.32348)

**0. 论文标题**
- **英文标题**: LogLook: Execution-Grounded Memory for Frontier-Model Robot Planners
- **中文标题**: LogLook：面向前沿大模型机器人规划器的执行锚定记忆机制
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种执行锚定记忆机制，让系统负责记录执行日志防丢失，让大模型自主决定看哪些关键帧省 token，在 RoboMME 基准上以不到一半的视觉成本达到了极高的任务成功率。

**1. 整体逻辑**
- **研究任务**: 解决前沿视觉语言大模型（VLM）在长序列机器人操作任务中，如何高效、准确地维持 episode 级别的记忆（记住做过的事和看过的信息）。
- **研究动机**: 现有的“每步重写笔记”记忆方式有两个致命缺点：一是重写容易丢失关键信息（如数错次数、遗忘被遮挡物体的颜色）；二是无法让模型按需查看图像，全量输入太贵，固定步长采样又容易漏掉转瞬即逝的关键动作。
- **本质改动**: 将记忆的“记录”和“查看”解耦。系统负责硬性记录执行日志和历史笔记（保证信息不丢），模型负责主动预测并选择查看哪些变化帧和演示片段（大幅省 token）。
- **技术溯源**: 基于前沿视觉语言模型 GPT-6 Astra 作为零样本规划器，结合 RoboMME 基准测试中的运动规划器或 $\pi_{0.5}$ 执行器。

**2. 技术拆解**
- **核心方法**: 提出执行锚定记忆（Execution-grounded memory）。包含系统维护的“执行日志+笔记历史”，以及模型主动选择的“期望门控帧”和“先略读后细看”的演示查看机制。
- **关键细节**: 
  - **输入输出**：模型接收当前观测、指令和记忆，输出包含自由文本笔记和动作（如 move, wait, sequence）的 JSON。
  - **系统记录（防丢失）**：每执行一个动作，系统追加一行日志（包含命令、步数、夹爪和末端状态），并保留所有历史笔记原文，不依赖模型重写。
  - **模型选择（省 token）**：模型在动作中指定“watch”点（最多 8 个像素点），系统只返回这些点附近（28px 半径）像素变化超过阈值的帧。对于演示视频，模型先以固定步长略读并写摘要，再请求特定范围的细看。
- **训练/优化目标**: 无需训练（冻结大模型），纯系统机制与提示工程设计。核心机制是通过系统级日志防止大模型重写遗忘，通过主动感知（Active perception）降低视觉 token 开销。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboMME 基准测试（16 个桌面操作任务，800 个测试 episode，包含计数、 permanence、参考和模仿四类）。
  - **对比对象**：Note-only memory（仅笔记记忆，每步重写，全量帧输入）、Per-chunk planner、RoboMME 的 learned memory policies (MemER, FrameSamp-Modul) 等。
  - **测试环境**：使用 RoboMME 自带的运动规划器（直接控制）和 学习到的 $\pi_{0.5}$ 执行器。
- **评价指标**: 成功率、每 episode 消耗的 token 数、输入图像数量、模型调用次数。并将失败原因细分为“运动规划失败”和“其他失败（记忆/观察导致）”。
- **主要结果**: 
  - 与 Note-only memory 相比，在使用运动规划器时，LogLook 达到了相近的成功率（92.6% vs 91.4%），但 token 消耗减少了 43%（40.5k vs 71.3k），图像数量减少了一半以上（46 vs 114）。
  - **失败分析**：Note-only memory 因记忆/观察导致的失败有 12 次，而 LogLook 只有 4 次（主要因为 Note-only 在重写时丢失了计数、事实，或误读了演示动作）。
  - 在直接控制下，LogLook 解决了 RoboMME 测试集 93.5% 的任务，接近人类水平，且 token 消耗仅为每步重规划（per-chunk planner）的四分之一（51k vs 203k）。
  - 使用 $\pi_{0.5}$ 执行器时，两者成功率相同（81.2%），因为执行器本身的失败（如空抓、卡顿）掩盖了记忆机制的差异，但 LogLook 依然节省了大量 token。

### 20. 🔥 [DynaSlots: Slot-Centric 3D Dynamics Pretraining for Robot Manipulation] (DynaSlots：面向机器人操作的以Slot为中心的3D动力学预训练)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.32330` | [点击跳转](https://arxiv.org/abs/2610.32330)

**0. 论文标题**
- **英文标题**: DynaSlots: Slot-Centric 3D Dynamics Pretraining for Robot Manipulation
- **中文标题**: DynaSlots：面向机器人操作的以Slot为中心的3D动力学预训练
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种无需动作和分割标签的3D点云预训练框架，把场景级的动力学建模拆成了局部Slot级，通过时间Slot传播和跨Slot交互，大幅提升了机器人操作的成功率和抗干扰能力。

**1. 整体逻辑**
- **研究任务**: 机器人操作中的3D视觉预训练，目的是从无标签点云序列里学出动力学感知的表征，用来初始化下游的操作策略。
- **研究动机**: 现有的动力学感知3D预训练（如AFRO）都是在场景级（全局）建模状态转移，把整个场景压成一个全局潜在动作。这会导致三个问题：一是语义混叠，不同区域的相似运动会产生相似的全局特征差异；二是隐式交互依赖，单一全局向量没法显式表达区域间的变化关系；三是对任务无关的干扰物太敏感。
- **本质改动**: 把动力学建模的粒度从“场景级”下放到“Slot级（局部软分割区域）”，给每个Slot分配独立的潜在动作，并显式学习Slot间的成对交互关系。
- **技术溯源**: 基于 Point Transformer（点云特征提取）、Slot Attention（Slot分配机制）、VICReg（自监督正则化）、Diffusion Transformer / DiT（扩散前向动力学）、Neural Relational Inference（神经关系推断）。最直接的对比基线是 AFRO。

**2. 技术拆解**
- **核心方法**: DynaSlots 框架。包含三个核心模块：1) 时间Slot传播模块，用上一帧的Slot当Query去绑定当前帧的点，保证跨帧Slot分配一致；2) 逆动力学模型（IDM），从相邻帧的Slot特征差异里提取每个Slot的潜在动作；3) 跨Slot扩散前向动力学模型（FDM）加上自监督交互头，预测每个Slot的未来状态，并学习Slot间的邻近与协同运动关系。
- **关键细节**: 
  - 输入输出：输入为无标签的坐标点云序列（步长为 $k$），输出为用于条件化下游扩散策略的Slot表征。
  - 模型结构：骨干网络用 Point Transformer，不搞FPS或邻居分组，直接全局自注意力，把点映射成64维token。设定 $K=6$ 个软Slot，潜在动作维度16。
  - 时间Slot传播：通过竞争注意力、加权聚合和残差MLP refinement，每帧迭代3次绑定步骤。
  - FDM与交互头：FDM用3层Transformer和DiT，每个Slot独立加噪去噪，但条件编码包含跨Slot上下文；交互头用轻量MLP预测Slot对的邻近-运动关系，伪标签靠运动学距离和位移阈值计算。
- **训练/优化目标**: 端到端优化。总Loss包括：前向和反向扩散噪声预测损失、Slot级的VICReg正则化（方差、不变性、协方差）、交互损失（BCE）和Slot分配熵损失。使用动量0.996的EMA目标编码器，AdamW优化器（lr=1e-4），训练300个epoch。

**3. 实验结果**
- **实验设置**: 
  - 仿真数据集：MetaWorld（14个任务）和 Adroit（Door和Pen任务）。
  - 真实世界数据集：RealMan RM65-B 机械臂，4个操作任务（放牛奶、放球、球入碗、放巧克力），每个任务100条专家轨迹。
  - 对比对象：大规模预训练（CLIP, DINOv2），静态3D（PointNet, PointMAE, PointDif），纯策略（DP3），2D动力学（DynaMo），3D场景级动力学（DynaMo-3D, FVP, AFRO）。
- **评价指标**: 仿真和真实世界任务的成功率（Success Rate, %）。
- **主要结果**: 
  - 仿真表现：在MetaWorld上平均成功率80.8%（比AFRO高4.8%），在Adroit上88.0%（比AFRO高5.0%），全面优于静态3D和场景级动力学baseline。
  - 消融实验：时间Slot传播贡献最大（移除后成功率下降12%以上），交互头和反向一致性也有稳定收益，$K=6$ 为最佳Slot数量。
  - 真实世界表现：在4个任务上平均成功率79.0%（比AFRO高8.5%）。
  - 鲁棒性验证：在杂乱场景下，成功率仅下降8.0%（AFRO下降28.0%）；在包含未见物体的场景下，成功率仅下降6.0%（AFRO下降14.0%），展现出极强的抗干扰和泛化能力。

### 21. 🔥 [MAST-VLA: Skill-Conditioned Adaptation with Trajectory-Affordance Priors for Multi-Skill Robot Manipulation] (MAST-VLA：基于技能条件化适应与轨迹可供性先验的多技能机器人操作)
- **研究机构**: `华东师范大学、浙江大学`
- **Arxiv ID**: `2610.32312` | [点击跳转](https://arxiv.org/abs/2610.32312)

**0. 论文标题**
- **英文标题**: MAST-VLA: Skill-Conditioned Adaptation with Trajectory-Affordance Priors for Multi-Skill Robot Manipulation
- **中文标题**: MAST-VLA：基于技能条件化适应与轨迹可供性先验的多技能机器人操作
- **研究机构**: 华东师范大学、浙江大学
- **一句话总结**: 提出双条件VLA框架MAST-VLA，通过LLM骨干中的技能条件化LoRA-MoE和动作头中的轨迹可供性空间先验，解决多技能长视野操作中的技能混淆与空间交互定位问题。

**1. 整体逻辑**
- **研究任务**: 多技能长视野机器人操作（Multi-skill long-horizon robot manipulation），即让单个VLA（视觉-语言-动作）策略在连续指令下稳定执行并切换多种基础操作技能。
- **研究动机**: 现有VLA模型在处理长视野任务时，对“执行哪种基础技能”和“在哪里/如何与物体交互”这两个语义建模不足，导致连续子任务切换时误差累积、执行不稳定。
- **本质改动**: 将多技能VLA适应转化为双条件（dual-grounding）问题：在LLM骨干用技能条件化的LoRA-MoE对齐基础技能结构，在动作头用轨迹衍生的可供性热力图强化交互空间定位。
- **技术溯源**: 基于 VLA-Adapter-Pro（底层为 Qwen2.5-0.5B 语言模型和 DINO/SigLIP 视觉骨干），结合了 LoRA-MoE 和 3D 点云/深度图几何先验。

**2. 技术拆解**
- **核心方法**: 
  1) **技能条件化 LoRA-MoE**：在LLM的FFN层插入LoRA-MoE适配器。将细粒度指令映射为7种粗粒度基础技能（如抓取、推、放等），用技能标签检索对应的技能查询token拼接到输入端，并提取路由偏置（routing bias）加到MoE的门控路由上，实现软性的技能特化。
  2) **轨迹可供性空间先验**：利用RGB-D深度图和未来夹爪轨迹计算3D表面点到轨迹的最小距离，生成可供性热力图（Affordance Heatmap）作为监督。推理时，预测的热力图被转化为patch级别的空间偏置，以加性方式注入动作头视觉token的注意力计算中，引导模型关注交互区域。
- **关键细节**: 
  - 技能分类：7种粗粒度基础技能（旋转、滑动/推、关节操作、抓取、放置、堆叠、开关）。
  - MoE配置：每个LoRA-MoE包含6个低秩专家，Top-2路由，LoRA rank为64。
  - 动作表示：预测8步的连续动作块（7维：6-DoF末端执行器+1维夹爪）。
  - 视觉输入：静态第三人称RGB-D + 腕部RGB。
- **训练/优化目标**: 联合损失函数，包括动作块的L1回归损失、可供性热力图的加权二元交叉熵（WBCE）损失，以及MoE路由的负载均衡和z-loss正则化。

**3. 实验结果**
- **实验设置**: 
  - 仿真：CALVIN ABC→D 基准（在A-C训练，D测试，评估5个连续子任务的长视野泛化）。直接Baseline为 VLA-Adapter-Pro。
  - 真机：Franka Research 3 机械臂，双RealSense相机，评估2个桌面场景下的8个长度-3的多技能序列。
- **评价指标**: 
  - 仿真：Success@1~5（连续完成k个子任务的成功率）和 Avg. Len（平均完成序列长度）。
  - 真机：Success@1~3 和 Avg. Len。
- **主要结果**: 
  - 仿真：在CALVIN ABC→D上达到SOTA，Avg. Len 4.65，Success@5 从Baseline的80.0%提升至84.7%，长视野后期的鲁棒性提升显著。
  - 真机：在160次真实试验中，Avg. Len 达到 2.62，Success@3 达到 70.6%，相比VLA-Adapter-Pro（Avg. Len 2.02）有显著提升，验证了在真实感知和控制噪声下的部署能力。

### 22. 🔥 [WorldMirror: Agentic Real-to-Sim Generation of Interactive Worlds from In-the-Wild Robot Demonstrations] (WorldMirror：基于野外机器人演示的交互式世界智能体Real-to-Sim生成框架)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31834` | [点击跳转](https://arxiv.org/abs/2610.31834)

**0. 论文标题**
- **英文标题**: WorldMirror: Agentic Real-to-Sim Generation of Interactive Worlds from In-the-Wild Robot Demonstrations
- **中文标题**: WorldMirror：基于野外机器人演示的交互式世界智能体Real-to-Sim生成框架
- **研究机构**: 原文未提及
- **一句话总结**: 提出WorldMirror框架，利用编码智能体协调专用3D/图像生成工具，并通过验证反馈迭代修正，将野外机器人视频转化为可直接回放原始轨迹的交互式仿真数字孪生环境。

**1. 整体逻辑**
- **研究任务**: 将野外（in-the-wild）机器人操作演示（RGB视频和对应轨迹）自动转化为可用于机器人学习和评估的交互式仿真环境（Real-to-Sim / 数字孪生构建）。
- **研究动机**: 现有的Real-to-Sim方法多为前馈式（feed-forward）流水线，难以同时满足视觉、几何和物理约束；而通用大模型智能体单独使用又缺乏生成高保真几何和外观的能力。此外，不同的重建错误（如物体放错、缺失、碰撞几何不对）需要不同的修正方式，固定的工具调用顺序无法自适应处理这些错误。
- **本质改动**: 将Real-to-Sim构建过程建模为“可执行世界程序”的迭代修正过程。引入一个路由智能体（Router Agent），根据验证反馈自适应地调度工具，并在发现错误时回退（rewind）到特定的前置重建步骤进行针对性修正，而非走固定的单向流水线。
- **技术溯源**: 基于 DINOv2（用于相机位姿初始化的图像匹配）、Meshy（刚性物体重建）、Articraft（关节物体重建）等生成工具，并在 Isaac Sim 中进行物理仿真与轨迹回放验证。

**2. 技术拆解**
- **核心方法**: 提出一个基于智能体的Real-to-Sim框架。核心是一个路由智能体维护一个结构化的世界状态内存，将重建任务分解，并调用四个专用智能体（重建、标定、布局、回放）作为工具。通过验证驱动的闭环修正机制，如果某一步验证失败，路由智能体会根据失败类型回退到依赖的前置阶段。同时采用相机位姿锚定的坐标系（Camera Pose-Anchored Coordinate System），确保场景、物体和机器人在同一全局坐标系下，支持原始轨迹直接回放。
- **关键细节**: 
  - **输入输出**：输入为RGB视频序列和机器人轨迹；输出为包含静态视觉上下文（高斯表示+碰撞几何）、可编辑交互资产、校准相机和机器人配置的仿真就绪数字孪生。
  - **世界状态内存**：持久化记录静态场景状态、交互物体状态（几何、尺度、位姿、物理属性）、空间关系和验证反馈，供所有智能体共享。
  - **构建技能库**：包括相机标定（DINOv2匹配+渲染到图像优化）、场景和资产重建（调用Meshy/Articraft）、相机锚定装配（统一尺度与坐标系）。
- **训练/优化目标**: 非端到端学习类工作，核心是智能体驱动的迭代修正机制。优化/验证目标包括：视觉一致性（渲染图像与真实图像的光度/结构对齐）、空间一致性（掩码IoU、位置/相对向量误差）、物理与交互一致性（仿真回放中的接触F1和轨迹执行成功率）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DROID（野外机器人操作演示数据集）。
  - **对比对象（Baseline）**：RoLA、RoboSnap、SimFoundry（开源），以及 GPT-6 Astra（闭源）。
  - **测试环境**：在 Isaac Sim 中直接回放原始机器人轨迹，不进行任何运动重规划或轨迹重定向。
- **评价指标**: 
  - **视觉保真度**：PSNR, SSIM, LPIPS, DISTS, 美学评分。
  - **空间保真度**：Mask IoU, 位置误差, 相对向量误差, 相对距离误差。
  - **回放与交互保真度**：位移误差, 最终位置误差, 方向误差, DTW误差, 接触F1, 回放成功率（SR）。
- **主要结果**: 
  - **视觉质量**：在感知指标上表现最优，LPIPS（0.427）和 DISTS（0.168）均为最低，PSNR（13.57）和美学评分（0.570）与baseline持平或更具竞争力。
  - **空间布局**：在相对距离误差上表现最好（0.219，优于GPT-6 Astra的0.331），但在Mask IoU（0.469）和位置误差（9.66）上略逊于GPT-6 Astra（IoU 0.598，误差 8.72）。
  - **轨迹回放与交互**：在Isaac Sim中直接回放原始轨迹，运动误差大幅低于baseline（如位移误差1.79cm vs GPT-6 Astra的11.17cm）。接触F1达到0.873（GPT-6 Astra为0.653），回放成功率达到100%（GPT-6 Astra仅为40%）。
  - **消融实验**：验证了“自适应路由”和“反馈驱动修正”是成功回放的关键。单纯的单次执行（One-pass）或无诊断的固定迭代（Fixed Iterative）均无法成功完成交互任务，只有完整的闭环修正机制能实现100%成功率。

### 24. 🔥 [Does LeWorldModel Preserve Local Action Geometry?] (LeWorldModel 是否保留了局部动作几何？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.31716` | [点击跳转](https://arxiv.org/abs/2610.31716)

**0. 论文标题**
- **英文标题**: Does LeWorldModel Preserve Local Action Geometry?
- **中文标题**: LeWorldModel 是否保留了局部动作几何？
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出了一种基于 Gram 矩阵的有限尺度评估方法，通过对比模型预测与真实模拟器在微小动作扰动下的响应，定量分析了预训练世界模型在局部动作几何（动作敏感度）上与真实环境的偏差。

**1. 整体逻辑**
- **研究任务**: 评估预训练世界模型（LeWM）在微小动作变化下，其预测的局部动作几何（即动作敏感度）与真实物理环境的吻合程度。
- **研究动机**: 现有世界模型通常只关注在采样动作上的单点预测准确性，但这无法保证模型在邻近动作方向上具有正确的相对效应（即局部几何结构是否正确），而这对于基于模型的规划至关重要。
- **本质改动**: 前人主要评估单点预测误差或下游控制成功率，这篇工作转而评估局部邻域的动作敏感度。通过引入基于有限差分的 Gram 矩阵来度量动作敏感度，并对比模型与环境的相对几何差异，实现了多尺度、多输出空间的局部动作几何诊断。
- **技术溯源**: LeWorldModel (LeWM), V-JEPA 2, Joint-Embedding Predictive Architectures (JEPA), MuJoCo, OGBench。

**2. 技术拆解**
- **核心方法**: 在给定上下文和动作序列的基础上，对动作施加共享的归一化微小扰动。分别计算模型预测的下一时刻 embedding 和模拟器渲染终点对应的 embedding。利用有限差分计算雅可比矩阵，进而构建 Gram 矩阵（$G = J^T J$）来表征动作敏感度。通过计算迹归一化后的 Gram 矩阵 Frobenius 范数差异（$D_G$）来衡量相对几何偏差，并在留出方向上验证 Gram 矩阵预测响应大小的能力。
- **关键细节**: 
  - 评估环境为 Reacher（动作维度 d=2）和 OGBench Cube（d=5）。
  - 使用共享的冻结编码器（frozen encoder）将物理状态映射到统一的 embedding 空间。
  - 扰动尺度设置为 $\epsilon = 10^{-3}$（主要）、$3 \times 10^{-3}$ 和 $10^{-2}$。
  - 数据包含 458 个 Reacher 锚点和 500 个 Cube 锚点。
  - 对比了物理姿态（Physical pose）、像素（Pixels）和嵌入（Embeddings）三种输出空间。
- **训练/优化目标**: 本文非训练类工作，无损失函数。核心机制是基于有限差分的几何度量（Gram 矩阵）构建、多尺度对比分析，以及与校准基线（各向同性、随机正交旋转、状态打乱）的误差评估。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：Reacher 和 OGBench Cube 模拟器。
  - 对比对象（baseline）：各向同性参考（Isotropic）、随机正交旋转（Rotation）、状态打乱（Shuffle），以及不同输出空间（物理姿态、像素、嵌入）和不同扰动尺度下的对比。
- **评价指标**: 
  - 相对几何差异：迹归一化的 Gram 矩阵差异（$D_G$）。
  - 方向对齐：最敏感动作方向的中位角度差（median angles）。
  - 响应大小预测误差：加权绝对百分比误差（WAPE）。
- **主要结果**: 
  - 模型捕获了部分动作结构，但存在方向未对齐。在主要尺度（$\epsilon=10^{-3}$）下，模型与环境最敏感动作方向的中位角度差在 Reacher 上约为 36°，在 Cube 上约为 42°。
  - 几何度量具有强烈的尺度依赖性。将扰动尺度增大 10 倍，会使 Reacher 和 Cube 上的中位 $D_G$ 分别降低约 70% 和 47%。
  - 在像素和 embedding 空间测量的几何随尺度变化远大于物理状态空间。
  - 在留出方向上，环境 Gram 矩阵预测 embedding 响应大小的 WAPE 中位数为 17%（Reacher）和 28%（Cube），优于各向同性参考（26% 和 38%）；而 LeWM 的直接预测误差更高（33.2% 和 56.4%），但若引入环境的迹进行增益校正（oracle gain correction），误差可显著降低至 26.6% 和 32.3%。
  - 结论表明，支持对动作敏感度进行特定尺度的评估，但其对下游控制任务的实际影响仍是一个开放问题。

### 25. 🔥 [Profiling a Frontier Agent with EBench: From Direct Control to Harness with Policy] (使用EBench评估前沿Agent：从直接控制到结合策略的Harness架构)
- **研究机构**: `原文未提及（注：据项目主页域名推断为 Intern Robotics / 上海人工智能实验室，但正文未显式声明机构全称）`
- **Arxiv ID**: `2610.35832` | [点击跳转](https://arxiv.org/abs/2610.35832)

**0. 论文标题**
- **英文标题**: Profiling a Frontier Agent with EBench: From Direct Control to Harness with Policy
- **中文标题**: 使用EBench评估前沿Agent：从直接控制到结合策略的Harness架构
- **研究机构**: 原文未提及（注：据项目主页域名推断为 Intern Robotics / 上海人工智能实验室，但正文未显式声明机构全称）
- **一句话总结**: 在EBench基准上全面摸底了GPT-6-Astra作为机器人Agent的能力边界，对比了“直接输出动作”与“调用后训练策略”两种架构，明确了前沿大模型在任务规划与物理执行间的长短板及当前系统协同的局限。

**1. 整体逻辑**
- **研究任务**: 评估前沿多模态大模型（MLLM）作为机器人Agent在复杂操作任务中的能力，并系统对比“直接控制”与“结合后训练策略（Harness with policy）”两种Agent架构的性能差异与失败模式。
- **研究动机**: 现有的VLA（视觉-语言-动作）和WAM（世界-动作模型）等后训练策略高度依赖机器人数据，泛化能力受限；而前沿MLLM具有强大的涌现能力和空间理解，无需特定后训练即可控制机器人。但两者在不同操作需求（如任务视野、精度、移动性）下的能力边界，以及大模型与后训练策略结合时的实际交互效果，此前缺乏全面的诊断与评估。
- **本质改动**: 本文并非提出新模型，而是构建了一个标准化的评估框架。在完全相同的观测协议下，精准定位了纯MLLM直接控制与MLLM调用后训练策略的能力边界，揭示了“大模型负责高层规划+小模型负责底层执行”这一主流Harness架构在实际物理执行中的具体痛点。
- **技术溯源**: 基于 GPT-6-Astra (OpenAI) 作为Agent核心；评估基准为 EBench；对比的后训练策略包括 VLA 模型（如 $\pi_{0.5}$, Qwen-RobotManip 等）和 WAM 模型（如 InternW0-$\Delta$, OpenWAM-$\alpha$ 等）。

**2. 技术拆解**
- **核心方法**: 设计了两种Agent配置进行对比评估：
  1) **直接控制 (Direct Control)**：Agent仅接收RGB和本体感受观测，直接输出末端执行器(EEF)和基座的waypoint指令，所有动作均由大模型生成。
  2) **结合策略的Harness (Harness with policy)**：Agent除了直接控制，还可以调用冻结的后训练策略（如 $\pi_{0.5}$ 或 InternW0-$\Delta$）来执行动作。Agent自身保留任务规划、进度监控和错误恢复，决定何时调用策略及调用步数。
- **关键细节**: 
  - **输入输出**：输入为3个RGB相机视角（全局、左右腕部）和机器人本体状态（无深度、无相机标定、无GT），采用单样本上下文学习（提供1个标注的演示轨迹）。输出为EEF/基座waypoint，或调用后训练策略的指令（需指定执行步数）。
  - **系统架构**：Agent核心为GPT-6-Astra（开启高推理模式）。在Harness架构中，策略在固定任务指令下自主执行，Agent无法向策略传递修改后的子目标。
  - **规模与设置**：在EBench的26个任务、510个测试episode上进行评估，涵盖移动/桌面、短/长视野、低/中/高精度等维度。
- **训练/优化目标**: 本文为评估与分析工作，无训练过程。核心机制在于Agent的In-context learning（基于单条演示的提示）和闭环控制（通过工具调用获取观测反馈并调整策略）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: EBench（包含26个任务，510个测试episode，涵盖4种泛化维度：未见物体、未见背景、重述指令及其混合）。
  - **对比对象 (Baseline)**: 8种后训练策略（OpenWAM-$\alpha$, InternW0-$\Delta$, Qwen-RobotManip, $\pi_{0.5}$, InternVLA-A1.5, $\pi_{0}$, GigaBrain-0.7, Fast-WAM）。
- **评价指标**: 任务成功率 (Success Rate, SR) 和 阶段完成得分 (Stage-completion score，给予部分进度分数)。同时分析了Token消耗成本。
- **主要结果**: 
  - **直接控制表现**：整体SR达46.7%，得分0.654，超越多数后训练策略。在短视野任务（SR 73.2%）和泛化维度（成功率波动最小）上表现最优，视觉定位和零样本技能组合能力强。但在长视野（27.3%）、桌面操作（20.0%）和高精度接触任务（11.3%）上表现不佳。失败原因主要在于：动作块执行期间缺乏连续的物理反馈导致误差累积，以及仅凭RGB图像难以精确推断接触几何。
  - **Harness with Policy表现**：结合 InternW0-$\Delta$ 时整体SR提升至56.0%（超越所有对比策略），结合 $\pi_{0.5}$ 提升至53.0%。该架构显著降低了长视野任务的Token成本（降低一半以上），并弥补了直接控制在长视野和双臂任务上的短板。
  - **Harness的局限与失败模式**：结合策略后仍达不到单一组件的理论上限。主要痛点包括：1) 高精度接触任务依然失败（大模型和策略都搞不定）；2) Agent调用策略时未考虑策略的能力边界（在策略不擅长的任务上盲目调用）；3) 策略只遵循固定指令而不遵循Agent的子目标；4) Agent在接管控制权时未能维持抓取状态，导致物体掉落频率增加。

### 26. 🔥 [RoboDoctor: Training-Free Recursive Self-Improvement for Robot Policies] (RoboDoctor：面向机器人策略的免训练递归自我改进)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.35604` | [点击跳转](https://arxiv.org/abs/2610.35604)

**0. 论文标题**
- **英文标题**: RoboDoctor: Training-Free Recursive Self-Improvement for Robot Policies
- **中文标题**: RoboDoctor：面向机器人策略的免训练递归自我改进
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个免训练框架RoboDoctor，在模型权重冻结的情况下，利用物理交互反馈在控制分配、动作干预和物理操作三个层级进行递归自我改进，从而提升通用机器人策略的任务执行能力。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型和语言模型Agent在物理交互中的任务执行与适应能力，解决策略和Agent共享执行责任时的协调与修正问题。
- **研究动机**: 现有的VLA和Agent虽然具备强大的能力，但在实际物理执行中，局部成功（如抓取成功）可能导致后续步骤失败（如物体位置不对）。当Agent和连续策略共同执行任务时，现有方法难以在修正局部错误（如对齐）的同时保留有用的策略行为（如保持抓取），且缺乏将物理反馈有效转化为跨回合可复用经验的机制。
- **本质改动**: 将“执行过程”本身作为适应的发生地，在模型权重完全冻结的前提下，通过连接诊断、基于物理证据的动作和持久化经验，在控制分配、干预和操作三个层级实现递归自我改进（RSI）。
- **技术溯源**: 基于视觉-语言-动作（VLA）模型/世界动作模型（WAM）（如PrismWAM）、多模态语言Agent，以及现有的具身递归自我改进系统（如PhysicalRSI、EmbodiedRSI等）。

**2. 技术拆解**
- **核心方法**: 提出RoboDoctor框架，包含三个耦合的修改目标和一套经验机制：
  1. Harness RSI（控制分配）：在初始Warmup阶段后，根据平均成功率决定后续使用Hybrid（策略主导，Agent审查纠正）还是Direct（Agent主导规划和动作）控制器。
  2. Intervention RSI（干预）：在Hybrid模式下，Agent审查策略提出的动作和纯运动学（FK）预览，决定是保留部分策略动作，还是替换为基于物理证据的纠正动作。
  3. Operation RSI（操作）：Agent通过视觉和深度信息构建接触方法，执行后验证物理效果，并根据反馈修正物理方法（如改变抓取姿态）。
  4. 经验机制（Experience）：将诊断原因、保留的行为、尝试的方法和观察到的效果链接起来，形成结构化记录，用于指导后续决策。
- **关键细节**: 
  - **输入输出**：输入为头部和腕部RGB视图、度量深度、关节状态和末端位姿（无特权物体位姿）；输出为双臂14维动作（每臂6个绝对关节目标+1个夹爪开合），动作块长度H=32。
  - **系统架构**：使用冻结的多模态Agent（Doctor）和冻结的策略（PrismWAM）。Hybrid控制器限制每次纠正最多5步，释放策略前缀最多16步；Direct控制器可分配更长预算。
  - **经验更新**：通过结构化验证，追加新记录或替换旧记录，保留相对顺序，并在重新使用时基于当前场景几何重新计算动作目标。
- **训练/优化目标**: 无需训练（Training-free）。不涉及梯度更新，核心机制是基于物理反馈的外部状态（经验文档）更新和离散控制器选择，优化目标是提高当前及后续动作的物理执行效果和任务成功率。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：RoboDojo-Sim的54个任务条目，涵盖泛化性（Generalization）、精度（Precision）、长视野（Long-Horizon）、记忆（Memory）和开放指令跟随（Open instruction following）五个维度。
  - **对比对象（baseline）**：公开排行榜上的HexaShell-Preview、WorldScape-R2SI、EmbodiedEvo、VPP2、PhysicalRSI和GPT-6-Astra。
- **评价指标**: 五个维度的平均得分（Overall score）和原生成功率（Native success rate）。
- **主要结果**: 
  - RoboDoctor在Refinement阶段的Overall score达到57.10（Warmup阶段为49.74），原生成功率为49.44%（Warmup阶段为40.83%）。
  - 超越了排行榜第一的HexaShell-Preview（53.18分，46.85%成功率），在Generalization和Open instruction following维度上提升显著。
  - 任务级别表现存在差异：54个任务中24个提升，20个下降，10个不变；Long-Horizon维度性能略有下降（从54.58降至52.92）。

### 27. 🔥 [VISTA: Active Exploration for Self-Improvement in Embodied Agents] (VISTA：具身智能体自我改进的主动探索)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.35051` | [点击跳转](https://arxiv.org/abs/2610.35051)

**0. 论文标题**
- **英文标题**: VISTA: Active Exploration for Self-Improvement in Embodied Agents
- **中文标题**: VISTA：具身智能体自我改进的主动探索
- **研究机构**: 原文未提及
- **一句话总结**: 提出 VISTA 框架，让元智能体在环境中主动交互收集诊断证据，迭代修改具身系统的执行“外壳”（harness），在不微调底层模型权重的情况下大幅提升长视野操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 提升具身智能体（Embodied Agents）在长视野、多阶段物理环境操作任务中的成功率和可靠性。
- **研究动机**: 现有具身系统的性能高度依赖“执行外壳”（harness，即指令、技能、协调逻辑等）。以往方法大多把智能体的运行轨迹当作静态日志进行事后反思，缺乏在环境中主动测试假设和收集新证据的能力，导致面对复杂失败时难以有效修复。
- **本质改动**: 将事后的“静态反思”转变为“主动环境探索”。让元智能体在开发阶段直接与环境交互，探测执行失败并收集诊断证据来修改 harness，同时用版本控制图（DAG）管理 harness 的演化历史。
- **技术溯源**: 基于多模态视觉-语言-动作（VLA）模型（如 $\pi_{0.5}$, RLDX-1, LingBot-VLA）、大语言模型（GPT-5.6 Sol, Codex, GPT-6）以及现有的 HarnessVLA 等具身智能体架构。

**2. 技术拆解**
- **核心方法**: VISTA 包含四个核心机制：
  1. **Harness DAG**：用类似 Git 的有向无环图记录 harness 的版本、分支和合并历史，保留所有候选版本（含失败版本）及其执行证据。
  2. **证据引导的修改**：元智能体（coding agent）基于历史证据形成假设，修改 harness 的组件（如指令、感知处理、技能终止条件等）。
  3. **主动诊断探索**：在提交候选版本前，元智能体可启动私有模拟器会话，主动调用感知和控制能力来探测执行失败边界，获取新证据。
  4. **自主验证与选择**：提交后冻结候选 harness，在全新的自主 episode 中评估，根据成功率决定是否替换当前最优版本（incumbent）。
- **关键细节**: 在线智能体包含语言模型规划器、VLA 模型和公共能力接口。元智能体由 Codex 和 GPT-6 实现。harness 被实例化为 Git 版本控制的代码包。环境交互方面，LIBERO-Pro 和 RoboTwin 的 episode 最大步数为 10,000 步，RoboCasa365 为 300-2900 步，每个 episode 最多允许 100 次 planner turns。
- **训练/优化目标**: 不更新底层模型权重，而是优化 harness $H$。目标函数是最大化任务成功率 $J(H) = \mathbb{E}[S(H; x, \xi)]$。选择规则是基于开发集上的经验成功率 $\widehat{J}_{dev}(H)$ 进行贪心更新（若候选版本成功率大于当前 incumbent 则替换）。

**3. 实验结果**
- **实验设置**: 在 LIBERO-Pro（包含 Spatial, Object, Goal, LIBERO-10 的指令重定向和位置交换扰动）、RoboCasa365（Composite Seen/Unseen）和 RoboTwin 三个基准上测试。Baseline 包括端到端 VLA 模型（OpenVLA, $\pi_0$, $\pi_{0.5}$, RLDX-1, LingBot-VLA）以及 HarnessVLA。消融实验中对比了主动探索（Active）与仅依赖静态日志的被动反思（Passive）。
- **评价指标**: 任务成功率（Success rate, %），以及元智能体消耗的 Token 数量（用于衡量 rollout 效率）。
- **主要结果**: 
  1. **LIBERO-Pro**：整体成功率从初始 harness 的 17.5% 提升至 95.0%（提升 77.5 个百分点），在 T 和 S 扰动设置下分别达到 97.0% 和 93.4%。
  2. **RoboCasa365**：Composite Seen 成功率从 16.4% 提升至 24.2%，Unseen 从 4.7% 提升至 13.3%。
  3. **RoboTwin**：成功率从 48.5% 提升至 74.0%。
  4. **消融实验**：在 LIBERO-Goal 任务上，两轮迭代后，主动探索的成功率提升（85.9%）显著高于被动反思（56.3%），且消耗的 Meta tokens 更少（91.6M vs 137.7M），证明主动探索能用更少的 rollout 获得更好的效果。

### 28. 🔥 [JevVLA: Jev-Inspired Energy-Based Adaptation for Vision-Language-Action Policies] (JevVLA：受Jev启发的视觉-语言-动作策略基于能量的适配)

本文属于**机器人学习/具身智能**领域，是一篇**方法创新/系统工程**类型的工作。

**0. 论文标题**
- **英文标题**: JevVLA: Jev-Inspired Energy-Based Adaptation for Vision-Language-Action Policies
- **中文标题**: JevVLA：受Jev启发的视觉-语言-动作策略基于能量的适配
- **研究机构**: 原文未提及（开源代码仓库为 ZJU4EmbodiedAI，推测为浙江大学）
- **一句话总结**: 提出一个仅约8万参数的轻量级能量适配模块，在冻结VLA基座模型的前提下，用同一个标量能量函数同时实现离散候选动作的排序和连续动作的梯度修正。

**1. 整体逻辑**
- **研究任务**: 在冻结预训练视觉-语言-动作（VLA）策略的前提下，轻量级地提升其在离散动作选择（如pick-and-place）和连续动作控制（如motion control）两种接口下的决策成功率。
- **研究动机**: VLA模型在特定场景下易受微小几何误差影响导致失败，而全参数微调计算成本高昂且需要大量任务特定数据。现有方法通常将离散动作评估和连续动作引导分开处理，缺乏一个统一的轻量级评估架构来同时适配不同动作接口的冻结策略。
- **本质改动**: 受Jev结构化决策接口启发，设计了一个轻量级的条件标量能量网络。利用该网络输出的能量值进行离散候选动作的比较，同时利用其对动作的梯度进行连续动作的修正与生成引导，实现“一个核心网络，两种决策接口”。
- **技术溯源**: 基于各类VLA模型（如VIMA, CLIPort等），借鉴了Jev的结构化概率决策接口概念，以及基于能量的动作评估（Energy-based action selection）和推理时梯度引导（如Score matching/Denoising）技术。

**2. 技术拆解**
- **核心方法**: 冻结基座策略和特征编码器，训练一个约8万参数的条件标量能量核心（包含条件二次势与非线性残差）。训练时，根据执行反馈、专家纠正或演示偏好，使用偏好排序损失拟合能量值，或使用得分匹配/去噪损失拟合能量梯度。推理时，离散任务通过比较能量值选出最优候选；连续任务通过计算能量的负梯度，对动作进行有界修正或引导迭代生成。
- **关键细节**: 
  - **输入输出**: 输入为上下文编码（128维，含观测、指令、基座策略特征）和动作编码（32维），输出为标量能量值。
  - **模型结构**: 能量核心由上下文网络、动作网络及融合层组成，包含对角曲率项、低秩耦合项（8维）和非线性残差项，总可训练参数为79,817个。
  - **规模与超参**: 各benchmark独立训练权重；优化器为AdamW，学习率通常在 $2\times10^{-4}$ 到 $3\times10^{-4}$ 之间。
- **训练/优化目标**: 
  - **离散选择**: 最小化偏好交叉熵损失（$\mathcal{L}_{\mathrm{pref}}$）或成对偏好软间隔损失（$\mathcal{L}_{\mathrm{pair}}$）。
  - **连续控制**: 最小化基于得分匹配/去噪的梯度回归损失（$\mathcal{L}_{\mathrm{grad}}$ / $\mathcal{L}_{\mathrm{DSM}}$），使能量梯度指向专家或优选动作。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**: 在 MetaWorld MT50, VIMA L1, LanguageTable, LIBERO Plus, CLIPort 五个Benchmark上测试。Baseline包括对应的冻结基座策略（Direct），以及MetaWorld上的Shared linear value probe和RAS rule，CLIPort上的Logistic regression, Shared MLP, TabM, FT-Transformer, TabNet等。
  - **测试环境**: 单台服务器，8张 NVIDIA A100-SXM4 (80GB) GPU，2个 Intel Xeon Platinum 8338C CPU。
- **评价指标**: 任务成功率（Task success rate），以百分比（%）及相比基线的提升百分点（pp）衡量。
- **主要结果**: 
  - 在5个Benchmark的测试集上，JevVLA相比冻结基线（Direct）的成功率分别提升了1.28, 2.31, 1.60, 1.52和1.28个百分点。
  - 在CLIPort上，JevVLA（35.50%）优于TabM（34.83%）等表格分类器基线。
  - 消融实验表明，能量结构中的二次项、非线性残差和低秩耦合，以及偏好监督信号，对最终性能均有实质性贡献。

### 29. 🔥 [SceneAgent: An Agentic Pipeline from 3D and 4D Captures to Simulation Environments] (SceneAgent：从3D和4D捕获到仿真环境的智能体流水线)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34745` | [点击跳转](https://arxiv.org/abs/2610.34745)

**0. 论文标题**
- **英文标题**: SceneAgent: An Agentic Pipeline from 3D and 4D Captures to Simulation Environments
- **中文标题**: SceneAgent：从3D和4D捕获到仿真环境的智能体流水线
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种基于Agent的自动化流水线，通过“模拟器内视觉检查与修复”机制纠正多阶段重建误差，将3D/4D视觉捕获高保真地转化为包含物理属性和动态交互的可交互仿真环境，大幅提升了机器人策略的Sim2Real效果。

**1. 整体逻辑**
- **研究任务**: 将静态3D捕获（RGB视频、3DGS、LiDAR等）和动态4D捕获（视频）转换为包含几何、物理参数、关节和可变形属性的交互式物理仿真环境，用于机器人策略的训练与评估（Real-to-Sim）。
- **研究动机**: 现有的Real-to-Sim系统（如SimFoundry）在多阶段处理（分割、网格生成、位姿对齐、物理建模）中容易产生累积误差（如错误的mask、scale或transform），导致生成的物体在仿真中不可用；此外，现有方法缺乏对4D动态场景（流体、变形、断裂）物理参数拟合的自动化协调机制。
- **本质改动**: 引入Agent机制，在目标仿真器中进行“视觉检查与修复（visual inspection and repair）”来闭环纠正中间阶段的累积错误；并将流水线扩展至4D视频，通过让Agent拟合视频中的动态运动来反推物理参数和求解器配置。
- **技术溯源**: 3D重建基于 3D Gaussian Splatting (3DGS) / COLMAP / Nerfstudio；分割与特征提取基于 SAM / SAM3D / OpenCLIP / DINOv2；物理与关节估计基于 PartSAM / Articulate Anything；仿真器基于 Isaac Lab / MuJoCo / NVIDIA Warp/Newton/Blast；策略基座为 $\pi_{0.5}$ (VLA模型)。

**2. 技术拆解**
- **核心方法**: 
  1. **Agent编排与视觉修复**：Orchestrator Agent规划流程，Runner Agent执行工具。引入Actor-critic机制，在Isaac Lab中渲染中间结果，检查对齐、分割和装配错误。若不满足几何阈值（如ICP残差、轮廓匹配），Agent会自动重试并修正位姿或资产。
  2. **物理属性与关节估计**：结合语义特征、基于高斯的物理先验模型（MLP）和VLM，通过加权投票估计材质和物理属性（质量、摩擦、刚度等）。使用PartSAM进行部件分解，Articulate Anything生成URDF关节。
  3. **4D动态场景扩展**：针对视频输入，Agent提取参考帧估计相机，选择求解器（MPM/FLIP/断裂模型），拟合初始状态和物理参数。通过渲染模拟序列与输入视频进行侧边/叠加对比，迭代修正参数直到动态IoU达标。
  4. **场景增强与自动化研究循环**：生成“数字姐妹（digital sisters）”（几何微扰或生成式变体）进行数据增强；构建自动化循环：发现真实机器人失败 -> 生成仿真变体 -> 代码Agent修正控制器 -> 微调VLA策略。
- **关键细节**: 
  - **输入支持**：RGB序列、现有3DGS、摄影测量资产、LiDAR、AI生成场景、4D视频。
  - **场景表示**：静态场景表示为背景3DGS + K个物体（高斯集合、网格、位姿、物理属性、关节）；4D场景增加相机参数、动态材质初始状态、物理参数和求解器状态。
  - **物理先验MLP**：输入DINOv2/OpenCLIP特征和16个几何量，输出10种材质、6种刚体类型、8种碰撞图元及9个数值属性。
  - **修复阈值**：使用trimmed similarity ICP，检查归一化中位数/90%分位点距离、覆盖率和轮廓一致性，四项全过才接受候选结果。
- **训练/优化目标**: 
  - **非端到端学习**，核心是Agent的迭代修复机制（基于几何对齐阈值和渲染对比）。
  - **物理先验MLP训练**：在GSO/YCB/ABO数据集上，使用VLM生成的标签（而非真实物理测量）作为监督信号，回归材质分类和物理属性（如质量/密度取对数回归）。
  - **策略微调目标**：使用仿真生成的专家演示，通过LoRA微调 $\pi_{0.5}$ VLA模型，结合元学习策略（逐步增加任务复杂度和减少随机性）优化真实世界成功率。

**3. 实验结果**
- **实验设置**: 
  - **静态重建**：使用 MessyKitchens 和 GraspClutter6D (hard/000091, 20个YCB物体)。对比多种Coding Agent harness（带/不带SceneAgent skills），以及Baseline SimFoundry。
  - **动态重建**：使用 4DCodeBench 的3个合成场景（液体溃坝、凝胶/液体与刚体交互、西瓜摔碎）。对比5种Agent harness。
  - **真实世界策略迁移**：Franka Emika Panda + UMI夹爪，执行“将玩具茄子放入篮子”的pick-and-place任务。基线为预训练的 $\pi_{0.5}$ VLA策略。
- **评价指标**: 
  - **静态**：1 cm阈值下的 F1 score ($F_{1cm}$)，对称平均最近点距离 (Chamfer distance, CD)。
  - **动态**：平均动态 IoU (mean dynamic IoU)。
  - **策略**：仿真和真实世界的任务成功率 (Success rate)。
- **主要结果**: 
  - **静态重建**：在GraspClutter6D上，SceneAgent使所有可评分harness的F1大幅提升。最佳配置（Codex）F1从9.51%提升至60.75%，Chamfer distance从6.20-9.89cm降至1.43-3.43cm。对比之下，SimFoundry的F1仅为6.9%，Chamfer distance为4.29cm，全面落后于SceneAgent。
  - **动态重建**：在4DCodeBench上，SceneAgent使Gemini 4 Argon的平均动态IoU从0.86%飙升至99.09%，其他harness也有显著提升（如Grok 4.7从11.10%到66.50%），远超benchmark参考表中的最高基线（30.57%）。
  - **策略迁移**：在真实世界任务中，单纯增加仿真数据量会导致过拟合（40个episode时成功率最高48%，1000个降至20%）。采用元学习策略（先在单任务带随机性数据上训练，再在多任务上训练，最后在单任务无随机性数据上微调）的Policy 3，在真实世界取得了88.0%（44/50）的最高成功率。

- **研究机构**: `原文未提及`

- **英文标题**: RobotAgentBench: Towards Open-world Robot Autonomy

- **一句话总结**: 提出了一个评估开放世界家庭环境中机器人自主性的综合基准 RobotAgentBench，通过多层级任务揭示了当前 VLA/WAM 模型在自主决策上的短板，并验证了代码 Agent 与策略混合架构的有效性。

**1. 整体逻辑**
- **研究任务**: 构建一个评估开放世界机器人自主性（涵盖任务发现、上下文推理、物理操作、故障恢复和鲁棒性）的基准测试。
- **研究动机**: 现有基准多评估预定义任务的操作能力，忽略了自主任务发现和上下文决策；且推理、规划与操作常被孤立评估，无法反映真实世界中闭环交互的复杂性。
- **本质改动**: 将评估重点从“单一操作技能”转向“完整自主交互闭环”，构建了包含多层级任务和开放场景的基准，并支持在统一框架下对比独立模型与各类 Agent 架构。
- **技术溯源**: 基于 AgiBot G1 机器人硬件，以及主流的 VLA（如 $\pi_{0.5}$, InternVLA-A1.5）和 WAM（如 $\tau_0$, OpenWAM-Alpha）基座模型。

**2. 技术拆解**
- **核心方法**: 构建 RobotAgentBench (RAB)。1) 通过 Agent 辅助、人在回路的 real-to-sim 管线构建 50 种家庭布局；2) 设计多层级评估：任务级（5 个维度）和场景级（4 个开放场景）；3) 建立统一的规划-执行-验证框架，支持纯代码、纯策略及混合 Agent 架构的对比。
- **关键细节**: 
  - 规模：50 种布局，90 个原子任务，18 个短周期、8 个长周期任务，4 个开放场景。
  - 接口：AgiBot G1，22 维全身动作空间（双臂、躯干、头、夹爪、底盘），23 维状态空间；1 个头戴 + 2 个腕部 RGB 相机。
  - Agent 设计：评估了纯代码（C/C/C）、纯策略（-/L/C, C/L/-）和混合（C/H/C）架构。代码 Agent 包括 Codex, Claude Code, Antigravity CLI，策略执行器包括 InternVLA-A1.5 等。
- **训练/优化目标**: 基准本身无损失函数。评估的策略模型使用 RAB 提供的 101.8 小时仿真数据集微调，优化目标为各模型原生的模仿学习/动作预测目标（如连续/离散动作预测、视频-动作联合目标等）。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RAB 仿真环境及 101.8 小时仿真数据集。
  - 对比对象：8 个 VLA 模型（$\pi_{0.5}$, Xiaomi Robotics-1, InternVLA-A1.5, MolmoAct2, LingBot-VLA2, HY-VLA, Galaxea G0.5, X-VLA），3 个 WAM 模型（$\tau_0$, OpenWAM-Alpha, LingBot-VA），以及不同 Harness 设计的 Agent（Codex, Claude Code, Antigravity CLI）。
  - 测试环境：包含 50 种布局的仿真环境（开启全随机化）及真实物理环境（AgiBot G1）。
- **评价指标**: 
  - 任务级：操作、任务发现、上下文推理、故障恢复、鲁棒性 5 个维度的得分及平均分（Average）。
  - 场景级：开放场景总分（Open-Ended），及行为指标（任务覆盖率、任务进度、恢复率、停滞时间）。
- **主要结果**: 
  - 独立 VLA/WAM 策略在任务发现和上下文推理上表现极差（接近随机），暴露了操作能力与自主性间的巨大鸿沟。
  - 引入代码 Agent 大幅提升性能，混合架构（C/H/C，代码控制+选择性调用学习策略）表现最优（任务级平均 48.5，场景级 15.4）。
  - 规划器生成简短、高层级的指令（如 Antigravity CLI）比详细指令更利于 VLA/WAM 执行器跟随。
  - 递归自我改进（RSI）通过工具细化和经验积累，能持续提升代码 Agent 的任务和场景表现。
  - 真实世界评估中性能普遍下降，但相对排名与仿真一致，验证了基准的有效性。

- **英文标题**: What Does World Modeling Actually Improve in Robot Action Learning?
- **中文标题**: 世界模型究竟改善了机器人动作学习中的什么？

- **一句话总结**: 本文通过严格的消融实验与行为分析，揭示了未来视频预测能显著提升机器人在熟悉任务上的执行成功率，但该收益无法泛化至分布偏移场景，且获取此收益无需依赖庞大的预训练视频生成模型。

**1. 整体逻辑**
- **研究任务**: 探究世界模型（未来视频预测）在机器人动作学习（VLA/WAM）中具体改善了什么，以及其收益的边界和模型设计需求。
- **研究动机**: 现有工作仅通过聚合成功率证明视频预测的有效性，这掩盖了预测监督究竟如何改变执行行为（是改变了轨迹模式还是提高了模式内成功率），且无法证明这种收益在任务或环境分布偏移下依然有效。此外，尚不清楚获取这种收益是否必须依赖庞大的预训练视频生成主干网络。
- **本质改动**: 在保持模型架构、初始化、数据和训练步数严格一致的前提下，对 WAM 进行视频预测损失的消融实验；引入轨迹聚类进行行为级归因；并将轻量级视频预测器作为辅助训练目标引入现有 VLA（$\pi_{0.5}$）以验证大模型的必要性。
- **技术溯源**: FastWAM, OpenWAM, $\pi_{0.5}$ (VLA), RoboTwin 2.0, Wan2.2 (视频生成模型/VAE)。

**2. 技术拆解**
- **核心方法**: 
  1) **控制变量消融**：在 FastWAM 和 OpenWAM 中仅改变未来视频预测损失的权重（$\lambda_{video}=0$ vs $1$），隔离预测监督的纯收益。
  2) **行为模式分析**：对轨迹特征进行 K-means 聚类，对比不同设置下的模式频率和模式内成功率，区分收益来源。
  3) **辅助预测设计**：为 $\pi_{0.5}$ 添加仅用于训练的轻量级 Transformer 预测器或预训练 Wan DiT 分支，通过视频损失更新共享的视觉-语言前缀表示，推理时直接移除视频分支。
- **关键细节**: 
  - 数据采用 RoboTwin 2.0 仿真平台的双臂操作数据（40个任务）。
  - 评估涵盖 Seen/Unseen 任务与 Clean/Randomized 环境的 4 种组合。
  - $\pi_{0.5}$ 轻量级分支为 6层 Transformer（隐藏层512，8个注意力头），在冻结的 Wan2.2 VAE 潜空间进行 flow-matching 预测。
  - $\pi_{0.5}$ 大模型分支使用预训练的 Wan2.2-TI2V-5B DiT，结合冻结的 T5 文本特征进行条件生成。
- **训练/优化目标**: 总损失为动作损失与视频预测损失之和（$\mathcal{L}=\mathcal{L}_{\mathrm{action}}+\lambda_{\mathrm{video}}\mathcal{L}_{\mathrm{video}}$）。在 $\pi_{0.5}$ 辅助分支中，视频损失仅用于更新共享的视觉-语言前缀和预测分支，不直接更新动作专家。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: RoboTwin 2.0 双臂操作数据。
  - **对比对象 (Baseline)**: FastWAM 和 OpenWAM 的无视频损失版本（$\lambda_{video}=0$）；$\pi_{0.5}$ 原版、加轻量级预测器版、加 Wan2.2-5B DiT 版。
- **评价指标**: 任务成功率（Success Rate, SR），轨迹模式频率（Mode Share），模式内成功率（Within-Mode SR）。
- **主要结果**: 
  1) **熟悉任务提升显著**：在 Seen+Clean 条件下，FastWAM 和 OpenWAM 的成功率分别提升 24.38% 和 72.91%。
  2) **行为级改善**：轨迹聚类表明，收益不仅来自轨迹模式分布的改变，更主要体现在相同粗粒度轨迹模式内成功率的大幅提升（例如 FastWAM 的 stack_blocks_two 任务中，主模式频率几乎不变，但模式内成功率从 50.2% 飙升至 89.5%）。
  3) **泛化性差**：在未见任务和环境随机化（分布偏移）下，收益不持久且绝对成功率极低（地板效应），视频预测未带来一致的鲁棒性优势。
  4) **无需大模型**：为 $\pi_{0.5}$ 添加仅训练时使用的轻量级 Transformer 预测器，成功率从 82.94% 提升至 89.19%，优于使用 5B 参数 Wan DiT 分支的 86.97%。证明获取辅助预测收益不一定需要庞大的预训练视频生成主干网络。

### 32. 🔥 [How High Can GPT-6 Astra Climb in Contact-Rich Manipulation? PhysLadder: A Hierarchical, Matched Sim-Real Benchmark for Physical Interaction] (GPT-6 Astra 在接触丰富操作中能爬多高？PhysLadder：一个用于物理交互的分层、匹配仿真-真实基准)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34527` | [点击跳转](https://arxiv.org/abs/2610.34527)

**0. 论文标题**
- **英文标题**: How High Can GPT-6 Astra Climb in Contact-Rich Manipulation? PhysLadder: A Hierarchical, Matched Sim-Real Benchmark for Physical Interaction
- **中文标题**: GPT-6 Astra 在接触丰富操作中能爬多高？PhysLadder：一个用于物理交互的分层、匹配仿真-真实基准
- **研究机构**: 原文未提及
- **一句话总结**: 提出了基于物理交互维度（接触构型与力调节）分层的 PhysLadder 基准，并在严格匹配的仿真与真实环境中对 GPT-6 Astra 进行零样本评估，揭示了其在接触丰富操作中的能力边界与四大交互瓶颈。

**1. 整体逻辑**
- **研究任务**: 评估通用基础大模型（GPT-6 Astra）在接触丰富（contact-rich）机器人操作任务中的零样本闭环执行能力，并构建分层基准以系统分析其物理交互瓶颈。
- **研究动机**: 现有具身基准多关注语义理解或简单抓取，缺乏对复杂物理交互（如力调节、接触重构）的系统评估；仅靠总体成功率无法定位具体是哪种物理需求限制了性能；此外，缺乏物理和视觉严格匹配的 Sim-Real 环境来验证仿真结论在真实世界中的有效性。
- **本质改动**: 摒弃按任务名称或长度分类的传统设计，转而基于“接触构型”和“力调节”两个物理维度构建累积式的三级（L1-L3）任务层级，并构建了物理与视觉严格匹配的仿真-真实环境对。
- **技术溯源**: GPT-6 Astra, Codex, NVIDIA Isaac Sim, ARX R5 机械臂, cuRobo。

**2. 技术拆解**
- **核心方法**: 
  1) 设计 PhysLadder 分层基准：将 16 个家庭操作任务按物理交互需求分为 L1（接触选择与几何对齐）、L2（持续接触中的力调节）、L3（接触重构与力调节的协调）。
  2) 构建匹配的 Sim-Real 环境：以真实 ARX R5 平台为参考，在 Isaac Sim 中重建场景，严格匹配工作区布局、物体几何/外观/物理属性（如用有限元模拟果冻变形）、机器人运动学及相机视角。
  3) 零样本闭环评估：利用 GPT-6 Astra 结合 Codex 运行时，仅依靠 RGB 图像和本体感觉反馈进行闭环决策与执行。
- **关键细节**: 
  - 硬件：双臂 ARX R5，配二指夹爪（无直接力传感器，仅控制开合度），1个外部相机和2个腕部相机（仅提供 RGB 图像）。
  - 仿真：基于 Isaac Sim 5.1.0，使用 cuRobo 进行碰撞检查的轨迹规划。
  - 评估协议：每个任务在真实和仿真中各进行 3 次零样本试验。仿真限制 150 次模型调用和 5 小时墙钟时间，真实世界无预设限制。
- **训练/优化目标**: 本文为基准评测工作，不涉及模型训练。核心机制是基于大模型的零样本闭环决策：模型接收自然语言指令和接口描述，通过 RGB 图像和本体感觉反馈进行推理，输出结构化动作（仿真）或工具调用（真机），执行后通过视觉和状态反馈验证结果，再决定下一步动作。

**3. 实验结果**
- **实验设置**: 使用自建的 PhysLadder 基准（16个家庭操作任务，分 L1/L2/L3）；无外部 baseline，主要对比 GPT-6 Astra 在仿真与真实环境中的表现，以及不同物理交互层级（L1 vs L2 vs L3）的表现；测试环境为真实世界双臂 ARX R5 平台与物理/视觉严格匹配的 NVIDIA Isaac Sim 仿真环境。
- **评价指标**: 任务成功率（Success Rate），以及中间交互过程的四大瓶颈（空间推理与执行精度、接触构型选择与建立、力调节、跨交互协调）。
- **主要结果**: 
  - 成功率随物理交互难度增加显著下降：真实世界 L1 为 80.0%，L2 为 47.6%，L3 为 0.0%；仿真中分别为 66.7%、47.6%、0.0%。
  - 仿真与真实表现高度一致：16个任务中有10个在两个环境中的成功次数完全相同，其余6个仅相差1次，证明物理/视觉匹配的仿真能有效反映真实世界的交互瓶颈。
  - 识别出核心瓶颈：模型能完成局部动作（如转动盖子、拉开抽屉），但难以将局部进展累积为完整的任务成功，在复杂空间推理、接触构型选择、力调节及跨交互协调上存在明显短板。

### 33. 🔥 [Scaling Dexterous Manipulation via Action Representation Pretraining] (通过动作表示预训练扩展灵巧操作)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34453` | [点击跳转](https://arxiv.org/abs/2610.34453)

**0. 论文标题**
- **英文标题**: Scaling Dexterous Manipulation via Action Representation Pretraining
- **中文标题**: 通过动作表示预训练扩展灵巧操作
- **研究机构**: 原文未提及
- **一句话总结**: 提出ARPG框架，将动作表示预训练与下游动作生成解耦，利用大规模人类数据构建动作表示空间，使下游仅需130M参数的轻量模型即可大幅提升复杂双臂灵巧操作的成功率。

**1. 整体逻辑**
- **研究任务**: 复杂灵巧操作（特别是双臂协调）的机器人动作生成。
- **研究动机**: 现有端到端策略从稀缺的机器人演示中同时学习动作表示和动作分布，导致动作表示学不好，限制了复杂动作的生成能力；且单纯扩大机器人数据和模型容量成本高昂。
- **本质改动**: 将动作表示的学习与下游条件动作生成显式解耦，先在大规模人类数据上预训练动作表示空间，再在冻结的表示空间内训练轻量级生成模型。
- **技术溯源**: V-JEPA 2.1（视觉基座）、DiT（生成骨干）、Flow Matching（生成算法）、SigLIP（对齐损失设计）、EgoDex/EgoVerse（人类预训练数据）、DexJoCo（仿真评测基准）。

**2. 技术拆解**
- **核心方法**: ARPG (Action Representation Pretraining and Generation) 框架。分为三个阶段：1) 视觉-动作对齐预训练动作编码器；2) 训练动作解码器；3) 在冻结的动作表示空间内训练条件生成策略。
- **关键细节**: 
  - **统一动作格式**：将不同来源的人类和机器人数据统一为324维双臂动作格式（含关节旋转、手腕位置等），缺失维度用mask处理。
  - **动作编码器**：Transformer结构，聚合最后K层特征输出512维表示。冻结V-JEPA 2.1提取视觉特征，用基于SigLIP的sigmoid损失对齐视频和动作序列。
  - **动作解码器**：将生成的表示解码为198维的可执行机器人动作，训练时加入噪声增强鲁棒性。
  - **生成骨干**：130M参数的条件DiT，使用Flow Matching在预训练的动作表示空间生成未来动作chunk。
- **训练/优化目标**: 
  - **预训练阶段**：pairwise sigmoid alignment loss（视觉-动作对比对齐）。
  - **解码器训练**：Smooth-L1 reconstruction loss（带噪声增强）。
  - **生成策略训练**：Flow Matching loss + REPA（中间特征对齐） + 解码动作监督 + 动作平滑约束。

**3. 实验结果**
- **实验设置**: 
  - **数据集与基准**：仿真基准 DexJoCo（11个任务，含6个单臂5个双臂），真实机器人平台（3个长视野双臂灵巧操作任务）。
  - **对比对象 (baseline)**：$\pi_{0.5}$（大规模VLA）、GR00T N1.5（大规模人形机器人基座模型）。
- **评价指标**: 任务成功率（单臂、双臂、总体宏观平均成功率），推理成本（参数量、显存、延迟）。
- **主要结果**: 
  - **仿真表现**：在DexJoCo多任务联合训练下，ARPG总体成功率达57.8%，双臂平均成功率从 $\pi_{0.5}$ 的10.1%大幅提升至44.7%。
  - **部署效率**：生成骨干仅约130M参数（系统总参数0.46B），显存占用和推理延迟均显著低于 $\pi_{0.5}$ 和 GR00T N1.5。
  - **真实机器人**：在3个长视野任务上成功率均高于 $\pi_{0.5}$。
  - **Scaling规律**：扩大预训练数据的行为覆盖率（而非单纯增加同类数据量）能有效提升下游性能；单纯增加编码器大小或预训练算力收益不明显。

### 34. 🔥 [AuRA: From Atoms to Bits through Autonomous Robot Interaction] (AuRA：通过自主机器人交互实现物理实体到数字资产的重建)
- **研究机构**: `NSF TRAILS Institute 等（原文未明确具体单一高校，致谢中提及受 NSF TRAILS Institute、Open Philanthropy 和 Apple 支持）`
- **Arxiv ID**: `2610.34452` | [点击跳转](https://arxiv.org/abs/2610.34452)

**0. 论文标题**
- **英文标题**: AuRA: From Atoms to Bits through Autonomous Robot Interaction
- **中文标题**: AuRA：通过自主机器人交互实现物理实体到数字资产的重建
- **研究机构**: NSF TRAILS Institute 等（原文未明确具体单一高校，致谢中提及受 NSF TRAILS Institute、Open Philanthropy 和 Apple 支持）
- **一句话总结**: 提出 AuRA 系统，通过自主抓取、基于关节状态的夹爪轨迹推导和交互前静态先验，自动化采集数据并重建可变形物体的物理数字孪生，大幅降低人工成本并提高重建成功率。

**1. 整体逻辑**
- **研究任务**: 自动化采集真实世界物体的交互数据，并重建包含几何、外观和物理动力学属性的数字孪生（Digital Twin）资产，主要针对可变形物体。
- **研究动机**: 现有的 Real-to-Sim 重建高度依赖人工遥操作或手动标注，限制了资产收集规模。若改用机器人自主采集，会面临三个问题：1) 抓取需满足机器人运动学和防碰撞约束；2) 视觉追踪夹爪轨迹易受遮挡和深度误差影响，导致物理参数推断偏差；3) 机器人自身会遮挡物体，导致几何和外观信息缺失。
- **本质改动**: 将“人工遥操作+视觉追踪夹爪”改为“基于约束过滤的自主抓取 + 基于机器人关节状态推导夹爪轨迹 + 利用交互前静态先验补全被遮挡区域”。
- **技术溯源**: 基于 PhysTwin（弹簧质点模型重建）、AnyGrasp（抓取生成）、Grounded-SAM2（目标分割）、MV-TAP / CoTracker3（目标追踪）、3D Gaussians（外观表示）。

**2. 技术拆解**
- **核心方法**: 
  1) 自主数据采集：用 AnyGrasp 生成抓取候选，通过运动学（PyRoki）和碰撞检测过滤，执行抓取并同步记录 RGB-D 和关节状态。
  2) 数据后处理：用 Grounded-SAM2 和 MV-TAP/CoTracker3 追踪物体轨迹；直接从记录的机器人关节状态和标定夹爪几何推导控制器轨迹（Controller trajectories），避免视觉追踪夹爪；将交互前的静态点云通过 PCA+ICP 配准到交互首帧，补全被机器人遮挡的几何。
  3) 资产重建：利用补全的几何和轨迹，通过 PhysTwin 的弹簧质点优化拟合物理模型；用交互前的 RGB-D 训练静态 3D 高斯模型表示外观，并通过配准的变换对齐到物理模型上，实现几何、外观、动力学的统一。
- **关键细节**: 
  - 硬件：Franka 机械臂 + 3 个 OAK-D RGB-D 相机。
  - 规模：13 个可变形物体（原文未提及具体数据集名称）。
  - 物理模型：Spring-mass model（弹簧质点模型）。
  - 外观模型：3D Gaussians。
  - 关键设置：点云预处理体素大小 0.003m，统计滤波邻居数 35；抓取候选需通过末端执行器中心及指尖位置的桌面净空检查，以及路径采样点的关节极限检查。
- **训练/优化目标**: 
  - 物理模型：通过弹簧质点优化（Spring-mass optimization），用追踪到的物体轨迹监督，夹爪连接的弹簧驱动。
  - 外观模型：通过预交互 RGB-D 训练 3D 高斯，然后绑定到物理节点上进行渲染。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：13 个可变形物体（原文未提及具体数据集名称）；Baseline 为人工收集的 PhysTwin 流程。
  - 测试环境与负载：RTX 5090（数据收集与 PhysTwin 训练），RTX A5000（AuRA 重建）。
- **评价指标**: 
  - 效率与可靠性：端到端重建成功率、平均失败检测时间、每个成功资产的挂钟时间（wall-clock time）和人工干预时间。
  - 重建质量：重仿真（Resimulation）和未来预测（Future Prediction）的 PSNR, SSIM, LPIPS, Mask IoU, Precision, Recall, Depth MAE, Depth Coverage, One-way L1 Chamfer distance，以及未见交互（Unseen Interaction）的类似指标。
- **主要结果**: 
  - 效率与可靠性：相比人工，人工干预时间减少 88.5%，挂钟时间减少 55.4%。端到端重建成功率从 26.9% 提升至 74.3%，平均失败检测时间从 133.0s 降至 88.3s。
  - 重建质量：在未来预测（Future Prediction）的 9 个指标中，AuRA 在 7 个上优于 PhysTwin（如 One-way L1 Chamfer 距离降低 28.1%，Depth Coverage 提升 9.9%）。在未见交互（Unseen Interaction）中，两者的平均 Mask IoU 和 Chamfer 距离相当。在重仿真（Resimulation）中，PhysTwin 略好（因其保留的追踪点更密，达 1493 个，而 AuRA 为 615 个，监督信号更丰富）。

### 35. 🔥 [RynnVLA-Latent: Scaling Robotic Manipulation Foundation Models with 3D-Grounded Latent Actions] (RynnVLA-Latent：利用3D几何约束的隐式动作扩展机器人操作基础模型)
- **研究机构**: `Alibaba DAMO Academy（据项目与代码链接）`
- **Arxiv ID**: `2610.34356` | [点击跳转](https://arxiv.org/abs/2610.34356)

**0. 论文标题**
- **英文标题**: RynnVLA-Latent: Scaling Robotic Manipulation Foundation Models with 3D-Grounded Latent Actions
- **中文标题**: RynnVLA-Latent：利用3D几何约束的隐式动作扩展机器人操作基础模型
- **研究机构**: Alibaba DAMO Academy（据项目与代码链接）
- **一句话总结**: 提出RynnLAM和RynnVLA-Latent框架，通过3D几何约束和相机运动解耦学习隐式动作，将海量无原生动作标签的异构视频转化为机器人策略的大规模预训练监督信号，并在多个仿真和真实机器人平台上取得领先性能。

**1. 整体逻辑**
- **研究任务**: 扩展视觉-语言-动作（VLA）模型，解决机器人操作策略预训练中动作标注数据稀缺，以及不同机器人实体（embodiments）控制空间不兼容的问题。
- **研究动机**: 人类和网络视频提供了丰富的交互数据，但缺乏机器人原生控制指令。现有的隐式动作（latent actions）方法仅依赖视觉重建，容易混淆相机自运动和物体的物理运动，导致学到的表征对底层控制预测不够有效。
- **本质改动**: 引入3D几何监督（3D光流、深度、相机位姿）和相机运动解耦机制，从纯视觉过渡中学习物理上合理的连续隐式动作。以此作为跨实体、跨数据源的统一预训练接口，将大规模视频预训练与特定机器人的原生动作对齐彻底解耦。
- **技术溯源**: 基于 Depth-Anything-3（深度与位姿估计）、DPFlow（光流估计）、Qwen3-VL（视频描述生成）；VLA策略基座采用 RynnBrain 视觉语言模型，架构为 Mixture-of-Transformers (MoT)，动作生成采用 Flow Matching 范式。

**2. 技术拆解**
- **核心方法**: 框架分为两部分。1) **RynnLAM**：隐式动作提取器，将视频帧对编码为分解的连续隐式动作（运动tokens、全局动作latent、相机latent）。2) **RynnVLA-Latent**：VLA策略模型，预训练阶段使用 Flow Matching 从多视角观察和语言指令预测隐式动作chunks；后训练阶段复用预训练权重，将输出层重定向（retarget）至特定机器人的原生动作空间。
- **关键细节**: 
  - RynnLAM 输出 608 维描述符（512维运动tokens + 64维全局动作 + 32维相机latent）。
  - 预训练数据规模：整合25个数据源（人类、机器人、仿真），约 30.1K 小时、3.057B 帧，离线生成 745.52M 隐式动作描述符。
  - RynnVLA-Latent 规模：提供 2B 和 4B 参数版本（VLM backbone 分别为 2.13B 和 4.44B，加上较窄的 Action Expert）。
  - 支持最多 6 个相机视角的 slot conditioning，缺失视角通过 mask 处理。
- **训练/优化目标**: 
  - **RynnLAM 损失**：残差未来特征预测（保留过渡信息）、相机补偿的 3D 光流预测（捕捉物理运动）、对比特征扭曲（防止恒等映射）、相机位姿解码，以及基于梯度反转（GRL）的相机解耦（迫使全局动作latent不包含相机自运动信息）。
  - **RynnVLA-Latent 预训练**：Flow Matching 损失，预测隐式动作 chunks 的速度场，此阶段不需要本体感觉和原生动作。
  - **后训练**：同样的 Flow Matching 目标，但预测目标改为原生机器人动作，并引入本体感觉（proprioception）。

**3. 实验结果**
- **实验设置**: 
  - **表征评估**：LARY benchmark（冻结表征预测底层控制）。
  - **仿真评估**：LIBERO（基础操作）、LIBERO-Plus（鲁棒性）、VLABench（语义接地）、RoboTwin 2.0（双臂操作）。
  - **真实世界评估**：Marvin-WUJI（固定双臂灵巧手）和 Astribot-S1（移动双臂夹爪）两个平台上的 6 个任务。
  - **Baselines**：OpenVLA, $\pi_0$, $\pi_{0.5}$, GR00T-N1.7, InternVLA-M1, Motus, Fast-WAM, Xiaomi-Robotics-0, LingBot-VLA, LAPA, Moto, DreamDojo 等。
- **评价指标**: 
  - 表征质量：MSE（均方误差，越低越好）。
  - 策略性能：Success Rate（成功率, %），以及 VLABench 的 Progress Score 和 Intention Score。
- **主要结果**: 
  - **表征质量**：在 LARY 相对动作预测中，RynnLAM 的 MSE 降至 0.38，显著优于 LAPA (0.93)、Moto (0.77) 和 DreamDojo (0.55)。
  - **仿真表现**：4B 模型在 LIBERO 达到 98.8%；在 LIBERO-Plus 达到 84.7%（无需 benchmark 特定适配，鲁棒性领先）；在 VLABench 5 个 track 平均成功率达 51.9%（跨类别成功率 48.0% 远超 $\pi_{0.5}$ 的 38.2%）；在 RoboTwin 2.0 Native 协议下平均成功率达 88.6%。
  - **真机表现**：在 6 个真实任务中，4B 模型均取得对比方法中的最高成功率。例如在 Astribot-S1 平台上，Table-Cleaning 从 $\pi_{0.5}$ 的 25.71% 提升至 40.00%，Steak-Serving 从 40.00% 提升至 57.14%。
  - **消融与扩展**：验证了 3D 光流监督、相机解耦和残差特征预测对表征质量的决定性作用；数据扩展实验表明，增加隐式动作预训练数据量（从 10% 到 100%）能持续提升下游策略的鲁棒性。

### 36. 🔥 [RoboDuo: Attempt, Check and Atomic Recovery through Code for Vision-Language-Action Models] (RoboDuo：通过代码为视觉-语言-动作模型实现尝试、检查与原子恢复)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.34108` | [点击跳转](https://arxiv.org/abs/2610.34108)

**0. 论文标题**
- **英文标题**: RoboDuo: Attempt, Check and Atomic Recovery through Code for Vision-Language-Action Models
- **中文标题**: RoboDuo：通过代码为视觉-语言-动作模型实现尝试、检查与原子恢复
- **研究机构**: 原文未提及
- **一句话总结**: 提出 RoboDuo 双系统框架，用代码让大模型先检查全任务 VLA 的执行结果，失败后无缝切换给原子 VLA 完成剩余步骤，无需重训基座模型即可大幅提升长视野任务成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在长视野（long-horizon）机器人操作任务中的成功率，重点解决单步执行失败导致整个任务崩溃的问题。
- **研究动机**: 现有 VLA 模型是开环的，执行时不检查当前状态是否满足目标。长视野任务中一旦中间某步失败（如物体滑落），模型仍会按原指令继续执行，导致后续步骤全部白费。现有的双系统（用 token 或 latent 传递信息）无法实现执行器的切换和重试；而让单一大模型直接输出动作又太慢，达不到物理部署的控制频率。
- **本质改动**: 引入代码（Code）作为控制流接口，构建“尝试-检查-恢复”的双系统。先让全任务 VLA 跑一遍，用 Judge 检查是否成功；如果失败了，就切给专门在短片段上训练的原子 VLA，用原子技能把剩下的步骤干完。
- **技术溯源**: 基于 X-VLA 和 $\pi_{0.5}$（作为冻结的全任务 VLA 基座），以及 Qwen3.5-2B / GPT-6-Astra（作为 Coding Agent 和 Judge）。

**2. 技术拆解**
- **核心方法**: RoboDuo 框架包含一个慢系统（Coding Agent 和 Completion Check）和两个快系统（Full-task VLA 和 Atomic VLA）。Agent 生成一段两层 Python 代码：第一层调用 full-task VLA 执行并检查；若失败，第二层将剩余任务拆解为原子指令，调用 atomic VLA 逐步执行（每步最多重试 3 次），且控制权不再交还给 full-task VLA。
- **关键细节**: 
  - 输入输出：输入为语言指令和当前视觉观测；输出为底层机器人动作。
  - 模型结构：两个 VLA 在测试时保持冻结（frozen），不更新权重。Agent 和 Judge 使用 VLM（如微调的 Qwen3.5-2B 或 GPT-6-Astra）。
  - 原子技能：系统定义了 5 种基础原语（如 move_to_and_grasp, place_and_release 等），原子 VLA 仅在这些短指令下工作。
- **训练/优化目标**: 
  - 数据构建：从 LIBERO 演示数据中，用 VLM 和规则切分出“效果完成”的短片段，构建 LIBERO-Atomic（训练原子 VLA）、LIBERO-Code（训练 Agent 写代码）、LIBERO-Judge（训练 Judge 做二分类检查）。
  - 优化目标：Atomic VLA 在切分后的短片段上训练；Coding Agent 通过最大化目标代码序列的似然（Next-token prediction）进行微调；Completion Check 作为视觉-语言分类器，通过问答对（观测+子目标 -> 是否完成）进行训练。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（包含 Spatial, Object, Goal, Long 四个子集），LIBERO-PRO（带位置 S 和任务 T 扰动的鲁棒性测试），以及真实机器人环境（双臂 AgileX Piper 水果摆放）。
  - 对比对象：冻结的 X-VLA 和 $\pi_{0.5}$ 单模型（核心是加 RoboDuo 前后的自身对比），以及部分开源 VLA 的公开数据。
- **评价指标**: 闭环任务成功率（%），以及真机实验中的平均放入水果数量。
- **主要结果**: 
  - LIBERO：在长视野任务（Long）上提升最显著。X-VLA 在 Long 上从 87.4% 升至 91.6%；$\pi_{0.5}$ 从 93.6% 升至 96.2%。其他子集性能不降。
  - LIBERO-PRO：$\pi_{0.5}$ 平均成功率从 32.05% 升至 39.33%，在 Object-T（任务扰动）上提升最大（25.2% -> 55.8%）。
  - 真机实验：在 3 种布局的水果摆放任务中，整体成功率从 36.7% (11/30) 提升至 53.3% (16/30)，平均放入水果数增加，且全程无需在真机上更新 VLA 权重。
