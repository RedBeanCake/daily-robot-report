            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [Robot-Factored World Models via Robot Rendering] (基于机器人渲染的具身因素解耦世界模型)
- **研究机构**: `Seoul National University (首尔大学), RLWRLD`
- **Arxiv ID**: `2607.22535` | [点击跳转](https://arxiv.org/abs/2607.22535)

**0. 论文标题**
- **英文标题**: Robot-Factored World Models via Robot Rendering
- **中文标题**: 基于机器人渲染的具身因素解耦世界模型
- **研究机构**: Seoul National University (首尔大学), RLWRLD

**1. 整体逻辑**
- **研究任务**: 动作条件视频世界模型（给定初始画面和动作序列，预测未来的交互视频）。
- **研究动机**: 现有的视频世界模型通常直接把控制指令（如关节目标位置）作为条件输入，导致模型既要学“指令怎么转化为机械臂运动”，又要学“场景怎么响应运动”，学习负担太重；如果直接用记录的真实未来状态（logged states）做条件，又会把接触、形变等交互结果提前泄露给模型，导致模型学不到真正的物理响应。
- **本质改动**: 把“动作到运动”的转化和“机器人外观”从神经网络中剥离出来。先用机器人自带的控制器把动作算成无碰撞的“名义轨迹（nominal trajectory）”，再把这个轨迹用URDF渲染成带深度的3D网格画面，作为视觉条件喂给视频模型，让模型只专注学“场景如何响应可见的机器人运动”。
- **技术溯源**: 基于视频扩散模型（Wan 2.1 14B / SVD 1.5B）和视频补全（Video Inpainting）骨干网络，借鉴了 Dexterous World Models 的残差动力学设定。

**2. 技术拆解**
- **重点改进**: 提出了一个解耦的视觉世界模型接口。1) 动作实现解耦：在输入模型前，把原始动作通过机器人控制器和运动学正解，转化为物理上可跟踪的“名义轨迹”，避免泄露真实交互结果。2) 机器人渲染解耦：把名义轨迹通过URDF渲染成相机视角下的机器人RGB网格和末端执行器深度图，结合场景的静态RGB和深度，共同作为条件输入。
- **架构细节**: 
  - **输入**: 4个条件流（静态场景RGB、静态场景深度、渲染的机器人RGB网格、末端执行器深度）+ 仅描述场景的文本提示。
  - **结构**: 使用 Latent Video Diffusion Model。所有条件流通过预训练的 Video VAE 编码器提取特征后，在通道维度与加噪的视频 latent 拼接。使用 Video Inpainting 架构，静态上下文作为条件，对预测时段的视频进行全掩码生成。
  - **规模**: 实验用了两个骨干，SVD 1.5B（分辨率 192×320）和 Wan 2.1 14B（分辨率 480×832）。
- **核心 Loss**: 潜空间 Flow Matching 损失（Latent flow-matching objective），即标准的扩散模型速度预测 MSE Loss（预测目标速度 $u = \epsilon - z_0$），没有使用额外的辅助重建 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: DROID（真实机械臂数据）和 RoboCasa-GR1（仿真双足机器人数据）。定性评估用了 HRDexDB 和 DexYCB。
  - **Baseline**: Ctrl-World（基于SVD的7-DoF笛卡尔位姿条件）和 AdaLN state vector（把名义轨迹作为数值向量通过AdaLN注入的基线）。
- **评价指标**: 视频重建质量指标：PSNR（越高越好）、SSIM（越高越好）、LPIPS（越低越好）。
- **实验结果**: 
  - **定量对比**: 在 SVD 1.5B 上，渲染网格接口比 Ctrl-World 位姿条件 PSNR 提升约 1.9；在 Wan 2.1 14B 上，渲染网格+深度接口比 AdaLN 数值向量基线在 DROID 上 PSNR 提升 3.3，在 RoboCasa-GR1 上提升近 7.0，各项指标均大幅领先。
  - **消融实验**: 用“名义轨迹”渲染比直接用“原始动作”渲染效果好；加上“末端和场景深度”比只用 RGB 网格效果好（解决了 2D 图像平面重叠导致的深度和接触误判）。
  - **定性与泛化**: 支持反事实轨迹编辑（改渲染轨迹就能改预测结果）；具备零样本跨具身泛化能力（换个没见过的机械臂 URDF 渲染也能正常预测）；能把人类手部演示动作重定向渲染为机器人几何，直接生成机器人操作视频。

### 2. 🔥 [ViTacWorld: Scaling Visuo-Tactile World Models for Contact-Rich Robot Manipulation] (ViTacWorld：面向接触丰富机器人操作的视觉-触觉世界模型扩展)
- **研究机构**: `ShanghaiTech University (上海科技大学), InstAdapt`
- **Arxiv ID**: `2607.22530` | [点击跳转](https://arxiv.org/abs/2607.22530)

**0. 论文标题**
- **英文标题**: ViTacWorld: Scaling Visuo-Tactile World Models for Contact-Rich Robot Manipulation
- **中文标题**: ViTacWorld：面向接触丰富机器人操作的视觉-触觉世界模型扩展
- **研究机构**: ShanghaiTech University (上海科技大学), InstAdapt

**1. 整体逻辑**
- **研究任务**: 利用世界模型生成视觉-触觉联合轨迹数据，用于接触丰富机器人操作（如插拔、剥离）下游策略的数据增强和评估。
- **研究动机**: 接触丰富的操作极度依赖触觉反馈，但真实的视触数据收集成本高、规模小，而纯仿真数据存在 Sim-to-Real gap。现有的机器人世界模型大多只生成视觉，缺乏对触觉物理接触状态的建模，导致触觉策略缺乏大规模、高质量的训练数据。
- **本质改动**: 将触觉传感器信号视为一种额外的“相机视角”，在动作条件视频生成模型中加入跨视角注意力机制，实现视觉和触觉时序对齐的联合生成；并设计了“大规模真实+仿真数据预训练 -> 真实策略 rollout 微调”的训练范式，生成高质量的“梦境”数据（dream data）喂给下游策略。
- **技术溯源**: 基于预训练的动作条件机器人视频世界模型（Action-conditioned robot video world model），核心生成骨干为 DiT (Diffusion Transformer)，使用 VAE 进行潜空间编码。

**2. 技术拆解**
- **重点改进**: 
  1. 将触觉作为一等观测流，引入流身份嵌入（stream identity embeddings）和跨视角注意力（cross-view attention），防止视觉和触觉 token 在普通自注意力中无序混合，保证接触状态的跨模态物理一致性。
  2. 引入任务对齐的仿真数据（Isaac Sim + Xense 触觉渲染）作为预训练的补充，利用触觉信号 Sim-to-Real gap 较小的特性，弥补真实接触数据的不足。
- **架构细节**: 
  - **输入**: 当前多视角观测（主相机、腕部相机、触觉图像）、未来 H 步的动作序列（相对末端执行器位姿 + 夹爪命令）、视角掩码（处理缺失视角）。
  - **结构**: 各视角图像经 VAE 编码为 latent tokens。DiT 的每个 block 内，先进行流内自注意力（Stream-aware self-attention），再进行跨视角注意力（Cross-view attention）交换接触信息。动作条件通过 AdaLN 注入。
  - **输出**: 未来 H 步的视觉和触觉 latent，经 VAE Decoder 还原为图像。
- **核心 Loss**: 
  - 主 Loss 为潜空间扩散去噪损失（Latent denoising objective，L2 Loss），即预测加噪 latent 的去噪目标。Loss 仅对未来预测帧和有效的视角流计算，无额外的辅助重建任务。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 自建 4 个接触丰富任务（充电器插入、黄瓜削皮、U型块插入、长方体插入），收集 300 条真实专家演示和 50 条真实策略 rollout。
  - **Baseline**: 仅使用真实专家数据训练的 ACT+触觉、纯视觉 π0.5、触觉 π0.5 策略。
- **评价指标**: 
  - **策略评估**: 真实机器人上的任务成功率（每个任务 10 次尝试）。
  - **世界模型评估**: 生成图像与真实图像对比的 PSNR、SSIM、LPIPS。
- **实验结果**: 
  - **策略提升**: 使用 ViTacWorld 生成的 rollout 数据增强后，触觉 π0.5 策略的平均成功率从 42.5% 显著提升至 67.5%（绝对提升 25%）。在难度最大的充电器插入任务上，成功率从 20% 提升至 40%。
  - **模型质量**: 消融实验表明，加入预训练和任务对齐仿真数据后，主视角 LPIPS 从 0.0781 降至 0.0513，触觉流 LPIPS 从 0.0211 降至 0.0157，证明生成的感知一致性和物理合理性得到有效提升。

### 3. 🔥 [Ordered Action Tokenization] (有序动作Token化)
- **研究机构**: `摘要未提供（注：此类工作通常出自斯坦福、UC Berkeley等北美头部高校或具身智能专业实验室）`
- **Arxiv ID**: `2607.21670` | [点击跳转](https://arxiv.org/abs/2607.21670)

**0. 论文标题**
- **英文标题**: Ordered Action Tokenization
- **中文标题**: 有序动作Token化
- **研究机构**: 摘要未提供（注：此类工作通常出自斯坦福、UC Berkeley等北美头部高校或具身智能专业实验室）

**1. 整体逻辑**
- **研究任务**: 机器人视觉运动策略（Visuomotor Policies）中的动作Token化，即把连续的机械臂动作序列（action chunks）压缩映射为离散的token。
- **研究动机**: 现有的动作token化方法存在两个痛点：一是用传统的解析离散化（如均匀分桶），会导致token序列太长，自回归模型生成太慢；二是用VAE/VQ-VAE等学出来的隐空间tokenizer，虽然序列短但内部缺乏结构，跟下游策略配合效果不好。
- **本质改动**: 提出OAT（Ordered Action Tokenization），给动作token引入“顺序结构”。让排在前面的token负责粗略的动作控制，后面的token负责补充残差细节。这样在推理时，可以根据算力随时截断生成，实现推理速度和动作精度的灵活权衡。
- **技术溯源**: 基于带Registers的Transformer架构，结合有限标量量化（FSQ, Finite Scalar Quantization），下游适配了自回归策略和基于Flow Matching的动作专家模型。

**2. 技术拆解**
- **重点改进**: 核心是引入“有序（Ordered）”和“前缀可解码”机制。打破了传统离散化方法中各个token地位平等的设定，让token序列变成“从粗到细”的渐进式编码。
- **架构细节**: 
  - **输入输出**: 输入连续动作块，输出离散的动作token序列。
  - **模型结构**: 编码器和解码器均采用带Registers的Transformer。量化层使用FSQ（Finite Scalar Quantization），避免了传统VQ-VAE常见的codebook坍塌问题。
  - **模型规模**: 摘要未提及具体参数量，但强调该方法即插即用，适配了3种不同的策略骨干网络（backbones）。
- **核心 Loss**: 
  - **主 Loss**: 动作重建Loss（解码出的动作与真实动作的误差）。
  - **关键训练机制（前缀重建）**: 训练时，强制要求**任意长度的token前缀**都能解码出有效的动作块。也就是说，只给第1个token，模型要解码出大致动作；给前2个token，解码出更准的动作。通过这种前缀监督，逼迫模型把核心控制信息压缩到序列前部。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 5个仿真Benchmark加上真实世界机器人设置，总共涵盖60多个任务。
  - **Baseline**: 现有的解析离散化方法、无结构的隐空间Tokenizer，以及不同的下游策略架构。
- **评价指标**: 任务成功率（策略性能），以及推理时的灵活性（即减少生成token数量时的性能衰减情况）。
- **实验结果**: 
  - **整体性能**: 在3种策略骨干和60多个任务上，OAT的策略成功率稳定优于传统解析离散化和无结构tokenizer。
  - **推理灵活性**: 这是最大的收益点。因为粗粒度控制信息集中在前几个token，推理时即使提前停止生成（截断token序列），动作保真度也不会断崖式下跌。这在自回归策略中显著降低了推理延迟，真正做到了推理成本与动作精度的随时权衡（anytime tradeoff）。

### 4. 🔥 [Learning Diverse Humanoid Tasks via Synthetic Video Scenarios without Real World Data] (无需真实世界数据：通过合成视频场景学习多样化的人形机器人任务)
- **研究机构**: `台湾国立成功大学 (NCKU)`
- **Arxiv ID**: `2607.21648` | [点击跳转](https://arxiv.org/abs/2607.21648)

**0. 论文标题**
- **英文标题**: Learning Diverse Humanoid Tasks via Synthetic Video Scenarios without Real World Data
- **中文标题**: 无需真实世界数据：通过合成视频场景学习多样化的人形机器人任务
- **研究机构**: 台湾国立成功大学 (NCKU)

**1. 整体逻辑**
- **研究任务**: 人形机器人的复杂全身动作模仿与跟踪控制。
- **研究动机**: 传统的模仿学习（如DeepMimic）高度依赖真实世界的动捕数据。动捕不仅成本高、场景受限，而且很难覆盖人类执行同一任务时的动作多样性（不同的人做法不同）。
- **本质改动**: 用“文本到视频”的生成式AI模型代替真实动捕。通过文本Prompt生成大量包含不同动作变体的人类视频，提取骨骼轨迹并重定向给机器人，直接作为强化学习的参考动作。
- **技术溯源**: RL框架基于 DeepMimic 和 PPO；视频生成使用 Google Veo 3/3.1；3D人体姿态估计基于 ViT 和 SMPL-X；动作重定向使用 GMR。

**2. 技术拆解**
- **重点改进**: 
  1. **视频驱动的数据管线**：用结构化Prompt（限制全身可见、静态相机等）加用户动作Prompt，驱动视频模型生成同一任务的多种动作变体，解决数据多样性问题。
  2. **动作拼接机制（Motion Stitching）**：独立生成的视频在拼接时会出现根节点跳变和关节角不连续。作者加入了根节点坐标对齐和关节角平滑插值缓冲，保证拼接后的多段参考轨迹在物理上连续。
- **架构细节**: 
  - **输入输出**：Actor输入相对根节点的全身状态（各link相对位置、四元数、线/角速度、跟踪误差、上一动作），输出目标关节角度（底层接PD控制器）；Critic采用非对称设计，额外输入无噪声的特权参考姿态。
  - **模型结构**：Actor和Critic都是3层全连接网络 [512, 256, 128]，激活函数用ELU。
  - **训练规模**：在 Isaac Lab 仿真环境中，使用 Unitree G1 机器人，4096个并行环境进行训练。
- **核心 Loss**: 
  - 主要是RL的Reward函数，由模仿奖励和正则惩罚组成：
  - **模仿奖励**：计算关节位置、关节速度、末端执行器位置、质心位置与参考轨迹的误差，采用指数衰减形式（$e^{-\alpha \cdot error}$）。
  - **正则惩罚**：包含关节极限惩罚（超出边界的二次函数惩罚）、动作平滑惩罚（相邻动作差值的L2范数）、自碰撞惩罚（非法接触计数）。

**3. 实验结果**
- **数据集和baseline**: 
  - **场景**：Isaac Lab仿真中的4个任务（躺下起立、打拳、带负载的抓取放置等）。
  - **Baseline**：论文主要评估生成视频的质量和RL策略对参考轨迹的跟踪能力，对比了空载和带0.5kg负载的情况，未横向对比其他SOTA模仿学习算法的具体数值。
- **评价指标**: 
  - 视频生成的物理合理性与意图一致性（人工评估成功率）。
  - 关节位置的平均绝对误差（MAE）。
- **实验结果**: 
  - **视频生成**：测试了50个日常任务Prompt，大部分能生成合理且多样的动作，但高速动作（如后空翻）存在时序不一致的问题。
  - **动作跟踪**：在打拳和抓取放置等动态任务中，全身关节位置的MAE控制在 0.04m 到 0.07m 之间，空间跟踪较准。
  - **负载鲁棒性**：在增加0.5kg负载后，下半身跟踪误差基本不变，上半身通过自动增加关节扭矩来补偿负载，展现了较好的适应性。

### 5. 🔥 [$\tau$: Learning Touch-Augmented Vision-Language-Action Models from Future Visual Supervision] ($\tau$：通过未来视觉监督学习触觉增强的视觉-语言-动作模型)
- **研究机构**: `北京交通大学 (Beijing Jiaotong University)`
- **Arxiv ID**: `2607.24485` | [点击跳转](https://arxiv.org/abs/2607.24485)

**0. 论文标题**
- **英文标题**: $\tau$: Learning Touch-Augmented Vision-Language-Action Models from Future Visual Supervision
- **中文标题**: $\tau$：通过未来视觉监督学习触觉增强的视觉-语言-动作模型
- **研究机构**: 北京交通大学 (Beijing Jiaotong University)

**1. 整体逻辑**
- **研究任务**: 在接触密集型机器人操作任务（如插拔、盖章、擦白板）中，将高维视觉触觉信号有效融入预训练的视觉-语言-动作（VLA）模型。
- **研究动机**: 现有的VLA模型主要依赖视觉，在做接触密集任务时容易失败。虽然引入触觉能缓解这个问题，但现有方法大多只关注瞬时的接触状态，或者只用低维的6D力矩数据，没能利用好高维视觉触觉传感器（如GelSight）的时空动态特征。此外，在有限数据下，如何让触觉特征和VLA的语义空间有效对齐也是个难题。
- **本质改动**: 增加了一个仅在训练时使用的 JEPA 风格自监督预测分支。用当前的触觉特征加上未来的动作，去预测未来视觉特征的“变化量”。通过这种方式逼迫触觉编码器学到与动作相关的物理交互动态，并且不增加推理时的计算开销。
- **技术溯源**: 基于 Physical Intelligence 提出的 VLA 基座模型 $\pi_{0.5}$。

**2. 技术拆解**
- **重点改进**: 
  1. **触觉编码与适配模块**：把视觉触觉图像编码后，通过一个 Adapter 映射到 VLA 的多模态语义空间，和视觉、文本 token 拼在一起送给大模型。
  2. **JEPA风格预测分支**：在潜空间里做预测，不重建像素。将当前触觉 token 和未来动作 token 拼接，通过 MLP 预测未来视觉特征的“变化量”（未来特征减去当前特征），而不是预测绝对特征。
- **架构细节**: 
  - **输入**：多视角 RGB 图像、语言指令、本体感知状态、左右手指的视觉触觉图像。
  - **模型结构**：主干是 $\pi_{0.5}$（包含视觉编码器、LLM 和动作专家）。新增了触觉编码器（提取触觉特征）+ 适配器（对齐到 LLM 空间），以及一个 3层 MLP 构成的预测器和 2层 MLP 构成的动作编码器。
  - **动作生成**：动作专家使用条件流匹配（Conditional Flow Matching）从噪声中生成动作序列（Action Chunk）。
  - **模型规模**：在 2张 A800 80GB GPU 上训练 30k 步，推理在单张 RTX 4090 上进行。
- **核心 Loss**: 
  - **主 Loss ($\mathcal{L}_{IL}$)**：基于条件流匹配的模仿学习 Loss，计算预测的去噪向量场与真实目标方向的 MSE。
  - **辅助 Loss ($\mathcal{L}_{SSL}$)**：加权余弦对齐 Loss。计算预测的未来视觉特征变化量与真实变化量的余弦相似度。权重由“触觉特征的变化幅度”决定（做了 clip 截断），目的是让模型更关注接触状态发生剧烈变化的时刻。总 Loss 是主 Loss 和辅助 Loss 的加权和。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建 TacAura 数据集，包含 4 个接触密集任务（插头插入、USB插入、盖章、擦白板），每个任务 100 条示教（共 400 条），多模态数据严格同步。
  - **Baseline**：纯视觉 VLA 模型（$\pi_0$, $\pi_{0.5}$），以及结合力觉/触觉的模型（ForceVLA, ForceFlow）。
- **评价指标**: 
  - 真实机器人测试，每个任务 20 次。
  - 评价指标为任务各阶段（如抓取/对齐/插入）的成功率，以及整体任务的完全成功率（Full success rate）。
- **实验结果**: 
  - $\tau$ 模型（使用腕部视角监督的变体）平均完全成功率达到 71.25%。
  - 相比最强的 baseline ForceVLA（30.00%）和纯视觉的 $\pi_{0.5}$（28.75%），平均成功率提升了 41.25 个百分点，优势显著。
  - 在未见过的物体和场景配置下也验证了较好的泛化能力。

### 6. 🔥 [FeelWorld: Visuo-Tactile World Model for Hierarchical Contact Prediction and Planning] (FeelWorld：用于分层接触预测与规划的视触觉世界模型)
- **研究机构**: `中国科学院自动化研究所、Imprintx Robotics、北京人工智能研究院`
- **Arxiv ID**: `2607.24267` | [点击跳转](https://arxiv.org/abs/2607.24267)

**0. 论文标题**
- **英文标题**: FeelWorld: Visuo-Tactile World Model for Hierarchical Contact Prediction and Planning
- **中文标题**: FeelWorld：用于分层接触预测与规划的视触觉世界模型
- **研究机构**: 中国科学院自动化研究所、Imprintx Robotics、北京人工智能研究院

**1. 整体逻辑**
- **研究任务**: 结合视觉和触觉的世界模型，用于接触丰富的机器人操作任务（如易碎品抓取、USB插入）的未来状态预测和动作规划。
- **研究动机**: 现有的视觉世界模型只管“看起来合理”，不管“物理上合理”，忽略了决定接触物理的触觉状态。此外，机器人在空中运动（未接触物体）时的触觉信号其实是传感器噪声，如果直接和视觉特征融合，会严重干扰视觉预测的准确性。
- **本质改动**: 把触觉信号拆成三个物理层级（是否接触、3D受力形变、是否滑动）进行分层预测；加了一个“接触门控”，没碰上物体时只走视觉预测，碰上了才融合触觉；规划时也根据是否接触来动态切换代价函数。
- **技术溯源**: 视觉编码器基于 V-JEPA 2，3D触觉点云编码器基于预训练的 FG-CLTP。

**2. 技术拆解**
- **重点改进**: 
  1. **分层触觉建模**：将触觉预测分为接触状态（二分类，判断是否碰上）、3D触觉隐变量（回归局部受力和形变）和滑动状态（时序判断是否打滑）。
  2. **接触门控非对称注意力**：触觉token去查询视觉token以获取全局上下文；视觉token是否查询触觉token由预测的“接触概率”决定。没接触时门关闭，防止触觉噪声污染视觉特征。
  3. **接触感知CEM规划**：在CEM规划中，接触前只优化视觉目标距离，预测到发生接触后，才激活触觉目标距离和滑动惩罚，避免在空中时优化不可达的物理状态。
- **架构细节**: 
  - **输入**：2路224x224的RGB图像、3D触觉点云、机器人本体感觉和7维动作。
  - **结构**：时空Transformer作为动态预测主干。接触状态用2层MLP预测，滑动状态用kernel=3的因果1D卷积预测（捕捉时序变化）。
  - **规模**：8张H100训练，batch size 64，上下文窗口为9帧（1.5秒）。
- **核心 Loss**: 
  - **主Loss**：视觉和3D触觉隐变量用 L1 Loss（在隐空间计算，不重建像素）；接触状态用 BCE Loss；滑动状态用 Focal Loss（因为滑动样本极少，仅占0.93%），且滑动Loss只在接触发生时才计算。
  - **辅助训练**：加入了多步自回归Rollout训练，并在输入的隐变量中注入高斯噪声（Context Noise Injection），强迫模型在带噪输入下预测，缓解长步预测的误差累积。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建的Imeta-Y1机器人数据集，包含芯片抓取（易碎/多尺寸）、水果抓取（多几何/顺从性）、USB插入（视觉遮挡）三个任务，每个任务200条训练轨迹，40条测试轨迹。
  - **Baseline**：纯视觉世界模型（DINO-WM, JEPA-WM等）和简单的视触觉直接拼接基线。
- **评价指标**: 
  - 视觉预测质量（LPIPS, SSIM, PSNR）。
  - 触觉状态预测准确率（F1 Score）。
  - 零样本规划成功率（Zero-shot planning success rate，在真机上跑）。
- **实验结果**: 
  - **视觉预测**：10步预测的LPIPS从0.084降到0.058；80步长程预测的LPIPS比纯视觉基线低61%。消融实验显示，去掉接触门控后，SSIM从0.884掉到0.876，PSNR从28.89掉到27.52，证明门控机制确实保护了视觉预测。
  - **触觉预测**：接触状态F1达98.1%，滑动状态F1达83.4%。
  - **规划效果**：三个任务的平均零样本真机规划成功率达到81.7%，比纯视觉基线绝对提升了32.5个百分点。

### 7. 🔥 [DeVA: Decoupled Video-Action Model with physical guidance for robot policy learning] (DeVA：带有物理引导的解耦视频-动作模型用于机器人策略学习)
- **研究机构**: `University of California, Irvine (UCI), Georgia Institute of Technology (Georgia Tech)`
- **Arxiv ID**: `2607.24159` | [点击跳转](https://arxiv.org/abs/2607.24159)

**0. 论文标题**
- **英文标题**: DeVA: Decoupled Video-Action Model with physical guidance for robot policy learning
- **中文标题**: DeVA：带有物理引导的解耦视频-动作模型用于机器人策略学习
- **研究机构**: University of California, Irvine (UCI), Georgia Institute of Technology (Georgia Tech)

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作策略学习（根据当前视觉观察和语言指令生成机器人动作序列）。
- **研究动机**: 现有的 VLA 模型主要靠静态图文预训练，缺乏对物理动态和时序因果的理解。虽然引入视频生成模型（VAM）能提供时空先验，但现有 VAM 要么把视频和动作预测放在同一个 backbone 里导致策略难以优化，要么只利用视频模型某一层的特征来指导动作，没有充分利用视频网络不同层级的互补信息，也缺乏对操作关键的物理信号（如交互区域和深度几何）的显式利用。
- **本质改动**: 将视频预测和动作预测解耦为两个独立的专家网络，通过多层级特征交叉注意力进行信息传递，并引入 affordance（交互热力图）和深度图作为物理引导信号，显式指导动作生成。
- **技术溯源**: 视频专家基于 Cosmos-Predict2（视频扩散 Transformer），动作专家采用类似的 DiT（Diffusion Transformer）架构。

**2. 技术拆解**
- **重点改进**: 
  1. 解耦双专家架构：视频专家和动作专家参数独立，避免视觉生成和动作控制共享同一个特征空间导致优化困难。
  2. 多层级特征交互：不只取视频模型最后一层的特征，而是通过逐层交叉注意力（layer-wise cross-attention）和可学习的桥接 token，把视频 backbone 多个中间层的特征传给动作专家。
  3. 物理显著性引导：在视频特征上增加 affordance（末端执行器在图像上的概率分布）和相对深度的辅助监督，并将解码出的物理特征拼接到动作专家的交叉注意力中，直接引导动作预测。
- **架构细节**: 
  - 视频专家：基于 Cosmos-Predict2，包含时空 VAE 将视频编码为 latent token，再用 Transformer 预测未来视频帧。
  - 动作专家：DiT 风格架构，在动作空间预测动作序列（action chunk）。
  - 物理引导模块：轻量级 DPT 风格解码器，包含交错的时间注意力层，输出 affordance map 和 depth map。
- **核心 Loss**: 
  - 分两阶段训练。
  - 阶段 1（视频与解码器预热）：主 Loss 为视频 EDM 去噪 Loss，辅助 Loss 为 affordance 的噪声加权 BCE Loss 和 depth 的噪声加权 Masked L1 + 梯度 Loss。
  - 阶段 2（联合训练）：冻结物理解码器参数（但保留梯度回传以继续塑造视频特征），加入动作专家的 Flow-matching Loss。总 Loss = 视频 Loss + 辅助 Loss + 动作 Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - 仿真数据集：RoboCasa（厨房场景）、LIBERO（桌面操作）、LIBERO-plus（鲁棒性测试）。
  - 真实世界：双臂机器人平台（I2RT YAM Ultra），执行传递物品、抬锅、抓瓶子等任务。
  - Baselines：Diffusion Policy，各种 VLA（OpenVLA, $\pi_0$, GR00T-N1 等），以及其他 Video-Action 模型（Cosmos-Policy, UVA 等）。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - RoboCasa：每个任务仅用 50 个 demo，成功率达到 72.0%，比同等数据量的 baseline 高出最多 22 个点，甚至超过了使用 300-3000 个 demo 的 VLA 模型。
  - LIBERO & LIBERO-plus：LIBERO 平均成功率 99.0%；在加入各种扰动的 LIBERO-plus 中达到 80.8%，比 OpenVLA-OFT 高 11.2%。
  - 真实世界：每个任务 30 个 demo，平均成功率 74%，大幅领先 GR00T-N1.6（48%）和 Cosmos-Policy（34%）。
  - 训练效率：解耦架构比统一 backbone 架构收敛快得多（40-50K 步时解耦架构成功率达 66-71%，统一架构仅 34%），且数据效率比 Cosmos-Policy 高约 20 倍。

### 8. 🔥 [LeapBot-WA: World-Anchor Action Models via Predictive Latent Alignments] (LeapBot-WA：基于预测性隐空间对齐的世界锚点动作模型)
- **研究机构**: `香港科技大学 (HKUST)、南方科技大学 (SUSTech) 等`
- **Arxiv ID**: `2607.23969` | [点击跳转](https://arxiv.org/abs/2607.23969)

**0. 论文标题**
- **英文标题**: LeapBot-WA: World-Anchor Action Models via Predictive Latent Alignments
- **中文标题**: LeapBot-WA：基于预测性隐空间对齐的世界锚点动作模型
- **研究机构**: 香港科技大学 (HKUST)、南方科技大学 (SUSTech) 等

**1. 整体逻辑**
- **研究任务**: 机器人操作策略学习（根据多视角视觉观测、语言指令和本体状态，生成机器人动作轨迹）。
- **研究动机**: 现有的世界动作模型（WAMs）大多依赖像素级的视频生成来学习环境动态。这导致模型把大量算力浪费在重建纹理、光照等对操作无用的视觉细节上，一旦遇到没见过的背景或光照就容易失效。此外，把 JEPA 等提取的非高斯预测特征直接塞进扩散模型，会导致分布不匹配，生成过程不稳定。而且，如果在推理时保留庞大的世界模型分支，计算开销太大。
- **本质改动**: 放弃像素级视频生成，改为在“预测性语义隐空间”中进行动态建模。用 JEPA 提取抽象物理特征，通过自编码器将其转换为适合扩散模型的高斯分布；训练时让预测动态的模型指导动作模型，推理时直接砍掉预测模型分支，实现零额外开销。
- **技术溯源**: 基于 V-JEPA 2.1（视觉预测基础模型）和 Diffusion Transformer (DiT) / Flow Matching 框架。

**2. 技术拆解**
- **重点改进**: 
  1. 引入 ISAE（各向同性语义自编码器），解决 JEPA 特征与扩散模型先验分布不匹配的问题。
  2. 设计非对称 MoT（混合 Transformer）架构，解耦世界建模和策略执行，解决推理慢的问题。
- **架构细节**: 
  - **输入输出**: 输入为多视角图像、语言指令和机器人本体状态；输出为连续的动作轨迹。
  - **特征提取**: 使用在机器人数据上微调的 V-JEPA 2.1 提取语义 token。
  - **ISAE 模块**: 将高维的 JEPA 特征压缩到 96 维的隐空间。为了区分不同相机视角，在输入 DiT 前加入了可学习的视角残差（View-Aware Residual）。
  - **非对称 MoT**: 包含 Anchor DiT（负责预测语义动态）和 Action DiT（负责生成动作），两者均为 30 层 Transformer，隐藏维度 1664，24 个注意力头。训练时采用非对称掩码注意力：Anchor DiT 看不到动作 token，Action DiT 能看到语义 token。
- **核心 Loss**: 
  - **ISAE 训练 Loss**: 重建损失（L2 + 余弦相似度） + KL 散度 + SIGReg（切片各向同性高斯正则化，强制隐空间呈现各向同性，防止维度坍塌）。
  - **策略联合训练 Loss**: 动作和语义的 Flow Matching 速度预测损失 + 未来语义预测的辅助损失（Smooth L1，约束 Anchor DiT 关注前向动态）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: RoboTwin 2.0（双臂，50个任务），LIBERO 及 LIBERO-Plus（单臂，40个任务），以及真实世界 UR5 机械臂测试。
  - **Baseline**: 各类 VLA（如 $\pi_0$, OpenVLA-OFT, Qwen-VLA）和 WAMs（如 Fast-WAM, JEPA-VLA, ImageWAM）。
- **评价指标**: 任务成功率（Success Rate），以及在随机化视觉环境/未见过的扰动（如换背景、光照、相机视角）下的零样本泛化成功率。
- **实验结果**: 
  - **RoboTwin 2.0**: 在没有大规模机器人轨迹预训练的情况下，平均成功率达到 91.46%，匹配了顶级的生成式 WAMs（如 Fast-WAM 的 91.85%），远超未预训练的 JEPA-VLA (45.60%)。
  - **LIBERO**: 在预测类 WAMs 中取得 SOTA（平均 97.3%），性能接近计算更昂贵的生成式 WAMs。
  - **LIBERO-Plus (零样本泛化)**: 在背景、光照、相机等扰动下，总成功率大幅领先其他预测性模型，展现出极强的抗视觉干扰能力。
  - **推理效率**: 由于推理时剪枝了 Anchor DiT 分支，模型没有额外的计算开销，推理速度与纯 VLA 相当。真机实验也验证了其良好的 Sim-to-Real 迁移能力。

### 9. 🔥 [Embodied GPT-5.1: Evidence of a World Model?] (具身GPT-5.1：世界模型存在的证据？)
- **研究机构**: `PECE - Graduate Studies in Artificial Intelligence (关联巴西圣保罗大学)`
- **Arxiv ID**: `2607.23899` | [点击跳转](https://arxiv.org/abs/2607.23899)

**0. 论文标题**
- **英文标题**: Embodied GPT-5.1: Evidence of a World Model?
- **中文标题**: 具身GPT-5.1：世界模型存在的证据？
- **研究机构**: PECE - Graduate Studies in Artificial Intelligence (关联巴西圣保罗大学)

**1. 整体逻辑**
- **研究任务**: 用未经任何具身或仿真训练的多模态大模型（GPT-5.1）直接作为高层控制器，驱动真实物理机器人完成导航、寻找目标并发生物理交互（如接触、推倒玩具）的任务。
- **研究动机**: 传统认知科学和机器人学认为“智能必须依赖物理身体和感觉运动经验”。作者想验证一个核心问题：仅靠文本和图像训练出来的“脱具身”大模型，在首次接入真实物理环境时，能不能涌现出理解物理规律和空间关系的“世界模型”能力。
- **本质改动**: 没有改动模型权重或网络结构。本质改动在于系统设计，搭建了一个基于大模型上下文记忆的感知-动作闭环系统，把GPT-5.1直接当高层策略网络用，通过Prompt约束其输出离散动作。
- **技术溯源**: 基于 GPT-5.1（多模态大语言模型）。

**2. 技术拆解**
- **重点改进**: 不改模型，改系统交互协议。利用大模型的长上下文能力，把历史图像和推理过程拼接到当前输入中，充当机器人的“短期空间记忆”，以此弥补单帧图像缺乏时间动态信息的缺陷。
- **架构细节**: 
  - **输入**: 系统提示词（设定角色和任务）、当前低分辨率第一人称图像（960×576），以及累积的历史图像和文本推理轨迹。
  - **输出**: 先输出简短的思维链（推理过程），再输出离散控制指令（前进/后退 $t$ 秒，或旋转 $\theta$ 度）。
  - **硬件平台**: 普通的差速驱动轮式机器人，只有前置摄像头和基础里程计，没有触觉传感器，低层电机由微控制器执行。
- **核心 Loss**: 无。本文是纯推理的探索性实验（Zero-shot），不涉及模型训练或微调，没有Loss函数。

**3. 实验结果**
- **数据集和baseline**: 在真实物理环境中实测。没有对比其他模型（无传统baseline），主要评估GPT-5.1在“寻找并接触企鹅”和“寻找并用头部推倒企鹅”两个真实机器人任务上的表现。
- **评价指标**: 任务成功率（5次实验的成功/失败数），以及定性行为分析（空间推理、路径规划效率、物理因果理解）。
- **实验结果**: 
  - **接触任务**: 5次中4次成功。模型能推断出离开视野的物体位置（具备物体恒存性概念），但运动控制较笨拙（喜欢走螺旋线靠近而不是先对齐再前进），且偶尔会把远处的干扰物认错。1次失败是因为撞上桌腿（无触觉反馈导致卡死）。
  - **推倒任务**: 5次中2次完全成功，1次部分成功（找到但没推倒），2次失败（没找到）。亮点是模型展现了物理因果理解：撞击目标后会主动后退，通过视觉确认企鹅是否倒下，如果发现没倒下就再撞一次。
  - **总结**: 证明了纯视觉-语言预训练的GPT-5.1确实涌现出了初级的空间和物理理解能力，具备一定的“世界模型”特征，挑战了“必须具身才能产生此类智能”的传统观点。但其在精细运动控制和抗视觉干扰方面仍有明显局限。

### 10. 🔥 [Memory for Attention: Language-Conditioned Re-Perception with a Vision–Language–Motion Map] (用于注意力的记忆：基于视觉-语言-运动地图的语言条件重感知)
- **研究机构**: `论文文本未明确标注（研究中使用了 AI2-THOR 和 CLIP）`
- **Arxiv ID**: `2607.23797` | [点击跳转](https://arxiv.org/abs/2607.23797)

**0. 论文标题**
- **英文标题**: Memory for Attention: Language-Conditioned Re-Perception with a Vision–Language–Motion Map
- **中文标题**: 用于注意力的记忆：基于视觉-语言-运动地图的语言条件重感知
- **研究机构**: 论文文本未明确标注（研究中使用了 AI2-THOR 和 CLIP）

**1. 整体逻辑**
- **研究任务**: 机器人在动态环境中如何分配有限的感知预算（即决定重新观察地图中的哪些物体，以保持地图信息的准确性和新鲜度）。
- **研究动机**: 以前大家用带行为标注的地图（如VLMM）主要是为了规划路径（绕开经常移动的物体），但作者实验发现这在闭环执行中收益极小，因为底层控制就能处理避障。地图真正的价值在于“资源分配”——在感知算力或时间受限时，利用地图记住的“特定物体历史变化规律”来决定现在该去重新看谁。如果每次都按需去问 VLM（视觉语言模型），VLM 只能给出“椅子一般不怎么动”这种类别级别的废话，无法知道“眼前这把特定的椅子”是否经常被人挪动。
- **本质改动**: 将“重新观察”建模为一个注意力调度问题（多臂老虎机）。利用地图中每个物体的历史变化记录（记忆）结合语言指令（决定物体对当前任务的重要性），计算出动态的感知调度频率，代替传统的按需 VLM 查询或简单的基于时间的轮询。
- **技术溯源**: 基于 VLMM (Vision-Language-Motion Maps)、AI2-THOR (仿真环境)、CLIP (用于零样本可移动性先验和语言-视觉相关性计算)。

**2. 技术拆解**
- **重点改进**: 将重感知频率的计算依据，从“依赖 VLM 的类别级平均先验”改为了“依赖单实例的历史观察记忆”。通过贝叶斯更新估计每个物体的实际变化率，并结合语言指令给出的任务权重，使用平方根法则（$\sqrt{\cdot}$-law）或 Whittle 索引来分配每步的感知预算。
- **架构细节**: 
  - **输入**: 地图中 $N$ 个物体的观察历史、语言指令、每步的感知预算 $K$。
  - **处理过程**: 通过 CLIP 计算语言指令与物体的相关性权重 $w_i$；通过历史观察计算单实例变化率 $\hat{\lambda}_i$；调度器按照 $f_i \propto \sqrt{w_i \hat{\lambda}_i}$ 计算每个物体的重感知频率，选出预算 $K$ 内的物体进行重新观察。
  - **输出**: 被选中的物体重新感知后，更新地图状态。整个流程是运筹调度逻辑，不涉及神经网络参数的前向/反向传播。
- **核心 Loss**: 没有传统深度学习的训练 Loss，而是最小化运筹学中的“价值加权陈旧度”（value-weighted staleness），即 $S = \sum_i w_i g(\lambda_i \tau_i)$，其中 $g$ 是陈旧度函数，$\tau_i$ 是距离上次观察的时间步。目标是让重要且易变的物体尽可能保持信息最新。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: AI2-THOR 仿真环境（包含 40 个场景的 951 个可移动物体实例，以及 8 个场景的 322 个物体用于真实 CLIP 先验测试）。
  - **Baseline**: 按需 VLM 先验（类别级移动率）、最旧优先（oldest-first，纯按时间）、加权轮询、无记忆的 Thompson 采样、以及“相关性加权+最近观察时间”的启发式策略。
- **评价指标**: 价值加权的陈旧度（越低越好），以及下游取物任务中的无效行程次数（wasted trips）。
- **实验结果**: 
  - 在物体变化规律差异较大（异质性高）的场景中，基于记忆的调度比按需 VLM 先验降低了约 4.9%~6.5% 的陈旧度；对于 Top 10% 的重要物体，收益更集中，陈旧度降低达 7.7%。
  - 使用真实的 CLIP 作为先验时（CLIP 仅靠外观猜不准移动率），记忆策略比 CLIP 先验大幅降低了 21%~26% 的陈旧度。
  - 在语言条件重感知任务中，结合了开放词汇相关性和动态记忆的 VLMM，比最强的“相关性+最近观察时间”基线好 2.5%，比按需 VLM 好 8.9%，证明运动记忆通道提供了超越单纯时间戳的价值。
  - 在下游取物任务中，减少了高达 5% 的无效行程。理论和实验均证明，记忆带来的收益严格正比于场景变化率的方差（根波动率方差）。

### 11. 🔥 [𝒩₀-TWAM: Scaling Tactile-Native World Action Model for Contact-Rich Manipulation] (𝒩₀-TWAM：面向接触丰富操作任务的触觉原生世界动作模型规模化)
- **研究机构**: `NeoteAI, 复旦大学 (Fudan TEAI Team)`
- **Arxiv ID**: `2607.23783` | [点击跳转](https://arxiv.org/abs/2607.23783)

**0. 论文标题**
- **英文标题**: 𝒩₀-TWAM: Scaling Tactile-Native World Action Model for Contact-Rich Manipulation
- **中文标题**: 𝒩₀-TWAM：面向接触丰富操作任务的触觉原生世界动作模型规模化
- **研究机构**: NeoteAI, 复旦大学 (Fudan TEAI Team)

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作任务（如拧螺丝、从叠放的杯子中剥离单个杯子、抓取软体物体等）。
- **研究动机**: 现有的VLA模型缺乏对未来状态的预测，而纯视觉的世界模型在接触密集的任务中表现差，因为这类任务高度依赖指尖的触觉反馈。现有的触觉策略要么只把触觉当输入不预测，要么用独立的模块预测，要么在注意力机制中限制触觉以保护视觉特征，导致触觉没有被真正融入未来预测中。
- **本质改动**: 提出一个原生的触觉世界动作模型。把触觉作为和视觉同等重要的原生模态，在同一个生成目标下联合预测未来的视觉和触觉，然后基于预测出的“未来视觉+未来触觉”来生成动作。同时引入了非对称的MoT（混合Transformer）架构来降低计算和推理成本。
- **技术溯源**: 骨干网络基于视频扩散Transformer（Video-diffusion Transformer），文本编码器使用 umT5，图像/触觉编码器使用 Wan VAE，触觉力空间表示基于预训练的 NeoForce。

**2. 技术拆解**
- **重点改进**: 
  1. **双路径触觉设计**：触觉分为“预测路径”和“观察路径”。预测路径在VAE隐空间生成未来触觉作为前视目标；观察路径在力空间读取当前真实触觉（通过NeoForce编码），通过交叉注意力直接条件化动作生成。
  2. **非对称MoT架构**：视频专家保持全宽度以继承视觉先验，动作和触觉专家采用窄维度从头训练，三个专家只在Self-Attention层共享计算，既隔离了模态容量又实现了充分交互。
  3. **触觉感知的子任务分段**：利用触觉接触事件（如抓取、释放）对长序列演示进行子任务切分，推理时根据预测和观察到的触觉事件来推进子任务阶段。
- **架构细节**: 
  - **模型规模**：总参数量约7.16B，包含30层Transformer。
  - **非对称设计**：视频专家隐层维度3072（5B参数，从预训练视频模型warm-start）；动作和触觉专家隐层维度1024（各约1B参数，从头训练）。共享的Self-Attention维度为3072。
  - **输入输出**：输入多视角RGB、触觉流、语言指令。输出未来视频、未来触觉和动作。动作空间为20维（双臂，单臂10维：3D位置+6D姿态+1D夹爪），采用相对于chunk起始位姿的delta表示。
  - **推理级联**：通过因果掩码（Causal mask）实现“先预测后执行”。在一个chunk内，视频和触觉专家共同生成未来，动作专家基于刚预测出的干净视频和触觉token进行去噪。
- **核心 Loss**: 
  - **主Loss**：条件Flow-matching Loss。对视频、触觉、动作三个模态的隐帧计算速度回归Loss。其中触觉预测采用残差形式（预测相对于初始帧的变化量），因为触觉在无接触时基本不变，变化量更有信息量。
  - **辅助任务**：在post-training阶段开启观察路径时，包含一个可选的触觉力场重建Loss，用于将微调的触觉表示锚定到物理力场。

**3. 实验结果**
- **数据集和baseline**: 
  - **预训练数据**：自建的数万小时真实机器人操作数据（包含同步的指尖触觉流），涵盖6种具身形态和450个任务。
  - **评测数据集**：仿真环境 UniVTAC 和 NeoSim；真实机器人环境下的8个接触丰富任务。
  - **Baseline**：最强的视觉-语言-动作（VLA）基线模型，以及纯视觉的世界动作（World-Action）基线模型。
- **评价指标**: 任务成功率（Success Rate）。
- **实验结果**: 
  - **仿真环境**：在 UniVTAC 上达到 84.5%，在 NeoSim 上达到 49.4%。
  - **真实机器人**：8个任务平均成功率达到 46.3%。
  - **对比提升**：真实环境中，最强VLA基线成功率为 30.0%，纯视觉世界动作基线分别为 21.9% 和 14.4%。𝒩₀-TWAM 显著优于所有基线，且在分布偏移下表现出更好的鲁棒性。消融实验证明预测触觉和观察触觉两条路径都对性能提升有实质贡献。

### 12. 🔥 [𝒩₀-VTLA: Scaling Vision–Tactile–Language–Action Model with Latent Tactile Tokens] (𝒩₀-VTLA：利用潜在触觉Token扩展视觉-触觉-语言-动作模型)
- **研究机构**: `NeoteAI, 复旦大学 (Fudan University)`
- **Arxiv ID**: `2607.23782` | [点击跳转](https://arxiv.org/abs/2607.23782)

**0. 论文标题**
- **英文标题**: 𝒩₀-VTLA: Scaling Vision–Tactile–Language–Action Model with Latent Tactile Tokens
- **中文标题**: 𝒩₀-VTLA：利用潜在触觉Token扩展视觉-触觉-语言-动作模型
- **研究机构**: NeoteAI, 复旦大学 (Fudan University)

**1. 整体逻辑**
- **研究任务**: 富接触操作（Contact-rich manipulation），即结合视觉、语言、触觉和动作的机器人精细控制策略。
- **研究动机**: 现有的VLA（视觉-语言-动作）模型缺乏触觉感知，在插孔、抓取等富接触任务中表现不佳。以往融合触觉的方法存在两个问题：一是把触觉图当成普通RGB拼在视觉前缀里，但触觉信号稀疏且多为空，浪费模型容量；二是把当前触觉直接注入动作网络，但当前触觉只反映“已经发生”的接触，等感觉到滑动再调整动作已经晚了，存在滞后性。
- **本质改动**: 将触觉从“当前观测”转变为“未来预测”。模型不直接使用当前触觉，而是预测执行未来动作块后“触觉会发生什么变化”（潜在触觉Token），并用这个预测值去条件化动作生成网络。此外，引入ALTER算法利用机器人部署过程中的历史数据进行离线强化学习。
- **技术溯源**: 视觉-语言基座基于 PaliGemma；动作生成专家基于 Flow-matching 架构（继承自 π0.5 的跨具身标准动作空间）；预训练数据基于自研的大规模视觉-触觉数据集 NeoData。

**2. 技术拆解**
- **重点改进**: 
  1. **潜在触觉预测路径**：增加一个轻量级预测器，将当前触觉和视觉-语言上下文融合，输出代表未来触觉变化的潜在Token，直接指导动作生成。
  2. **三阶段训练配方**：通过分阶段冻结和解冻，将新的触觉路径平稳地接入预训练好的VLA模型，避免破坏原有能力。
  3. **ALTER离线RL算法**：利用部署数据中的相对进度和事件对比生成二元优势标签，进行离线策略优化，提升长程任务表现。
- **架构细节**: 
  - **输入**：相机视图、语言指令、机器人状态（离散化）构成视觉-语言前缀；触觉输入为“当前帧 - 初始无接触帧”的差值图像。
  - **触觉编码**：使用冻结的自监督视觉编码器处理触觉差值图，每张图输出10个Token。
  - **预测器与动作专家**：预测器读取视觉-语言上下文和当前触觉Token，输出10个潜在触觉Token $z$（预测未来50步的触觉变化）。动作专家（Flow-matching）在生成50步动作块时，通过注意力机制同时 attend 到视觉-语言前缀和潜在触觉Token $z$。
- **核心 Loss**: 
  - **阶段1（预测器接地）**：对称 InfoNCE 对比损失（拉近预测的 $z$ 和真实的未来触觉变化 $z^*$） + L1 重建损失（重建粗粒度的未来触觉差值场）。
  - **阶段2（动作专家对齐）**：基础 Flow-matching 动作损失。此时遮蔽视觉-语言前缀，强制动作专家只能从潜在触觉Token $z$ 中学习动作。
  - **阶段3（端到端微调）**：基础 Flow-matching 动作损失，取消遮蔽，全模型联合训练。
  - **ALTER（离线RL）**：基于成对进度模型的二元优势条件损失（Advantage-conditioned loss）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：NeoData（大规模多平台预训练数据），NeoReal（9个真实机器人任务），UniVTAC/NeoSim（20个仿真富接触任务）。
  - **Baseline**：纯VLA基线以及外部最强的触觉专家基线。
- **评价指标**: 任务成功率（Success rate），以及潜在Token检索未来触觉目标的Top-1准确率。
- **实验结果**: 
  - **表征能力**：阶段1训练后，潜在Token检索真实未来触觉目标的Top-1准确率达到 92.3%（随机基线为3.2%），证明预测器学到了真实的接触物理意义。
  - **仿真任务**：在20个NeoSim仿真任务中，平均成功率达到 63.8%，远超最强基线的 44.0%。
  - **真实任务**：在9个NeoReal真实机器人任务中，成功率全面领先，赢下所有9个任务。
  - **离线优化**：结合ALTER算法后，在3个长程真实机器人任务（如柔性物体操作）上，成功率达到 75%–95%。

### 13. 🔥 [The Curse of Precision: A Data Scaling Law for High-Precision Robotic Manipulation] (精度的诅咒：高精度机器人操作的数据缩放定律)
- **研究机构**: `清华大学 (Tsinghua University)、OpenMind (芜湖) 机器人有限公司`
- **Arxiv ID**: `2607.23108` | [点击跳转](https://arxiv.org/abs/2607.23108)

**0. 论文标题**
- **英文标题**: The Curse of Precision: A Data Scaling Law for High-Precision Robotic Manipulation
- **中文标题**: 精度的诅咒：高精度机器人操作的数据缩放定律
- **研究机构**: 清华大学 (Tsinghua University)、OpenMind (芜湖) 机器人有限公司

**1. 整体逻辑**
- **研究任务**: 探究在封闭世界的高精度机器人操作任务（如紧密插孔、堆叠细长方块）中，模仿学习所需的数据量与任务物理精度之间的定量关系。
- **研究动机**: 现有的具身智能缩放定律主要在研究如何提高开放世界的泛化能力（广度），但在工业装配等要求极高精度的场景中，把成功率从 99% 提升到 99.9% 需要多少数据？作者在实践中发现，标准模仿学习在高精度任务上表现很差，稍微放宽一点精度要求成功率就暴涨，因此想搞清楚“精度”本身的数据成本到底怎么算。
- **本质改动**: 这篇工作没有改网络结构或提新算法，而是提出并验证了“精度缩放定律”。揭示了在固定成功率下，所需数据量随目标精度逼近系统极限而呈超指数级增长；并证明这个“极限精度”不是固定的物理常数，而是由传感器、专家数据质量等决定的系统涌现属性。
- **技术溯源**: 实验基于 ManiSkill3 仿真环境，学习算法固定使用 Diffusion Policy（扩散策略），视觉特征提取使用 ResNet-18，去噪网络使用 1D U-Net。

**2. 技术拆解**
- **重点改进**: 提出了两个缩放定律假设并进行实证。第一，成功率缩放定律：在固定精度下，失败率与数据量呈幂律关系（双对数坐标下呈线性）。第二，精度缩放定律：在固定成功率下，所需数据量的对数与 $1/(P-c)$ 呈线性关系，其中 $P$ 是目标精度，$c$ 是系统的极限精度。当 $P$ 逼近 $c$ 时，数据需求会超指数爆炸。
- **架构细节**: 
  - **输入**: 多模态观测，包括两个 256x256 的 RGB-D 图像（全局第三人称视角和局部腕部相机），以及机器人本体状态（关节角和末端位姿）。
  - **输出**: 7 自由度的末端执行器增量位姿（delta pose）。
  - **模型**: 标准的 Diffusion Policy，100 步 DDPM 推理。为了控制变量，全文固定算法和模型结构，只改变数据量、任务精度和系统配置。
- **核心 Loss**: 使用 Diffusion Policy 标准的去噪损失（预测噪声或动作的 MSE/L1 Loss），没有引入额外的辅助任务或魔改 Loss，核心工作量在于通过大规模训练和评估来拟合缩放曲线。

**3. 实验结果**
- **数据集和baseline**: 在 ManiSkill3 中设计了三个高精度任务：Peg Insertion（插孔，考察接触与对齐）、Stack Cuboid（堆叠长方体，考察放置稳定性）、Roll Ball（滚球，考察欠驱动动力学）。Baseline 是固定算法下的标准系统配置，对比项为不同的系统配置（如去掉腕部相机、更换专家策略、改变域随机化程度）。
- **评价指标**: 主要指标是任务成功率（Success Rate）。通过拟合缩放曲线，提取极限精度 $c$（系统能达到的最高精度物理极限）和决定系数 $R^2$（拟合优度）来评价系统能力。
- **实验结果**: 
  - 两个缩放定律在三个任务中均得到验证，精度缩放定律的拟合 $R^2$ 均大于 0.97，说明公式非常准。
  - 极限精度 $c$ 能准确反映系统能力。消融实验表明：
    1. **去掉腕部相机**: 极限精度 $c$ 从 2.35mm 恶化到 3.85mm，证明局部视觉对高精度操作至关重要。
    2. **更换专家策略**: 使用动作更直接、无歧义的“激进”专家（虽然专家自身成功率只有 50%，但成功轨迹非常干净），极限精度 $c$ 从 2.35mm 大幅提升到 1.27mm。这说明演示数据的清晰度比专家自身的绝对成功率更影响模型上限。
    3. **降低任务复杂度**: 减少域随机化后，极限精度 $c$ 提升至 1.00mm。
  - 此外发现模型容量是缩放定律成立的前提，如果网络容量不足（如滚球任务中使用了较小的 U-Net），缩放定律会直接失效。

### 14. 🔥 [WorldDiT: A Unified Diffusion Architecture for World and Action Modeling] (WorldDiT：一种用于世界模型与动作建模的统一扩散架构)
- **研究机构**: `Bagel Research（根据作者邮箱 research@bagel.com 推断）`
- **Arxiv ID**: `2607.23909` | [点击跳转](https://arxiv.org/abs/2607.23909)

**0. 论文标题**
- **英文标题**: WorldDiT: A Unified Diffusion Architecture for World and Action Modeling
- **中文标题**: WorldDiT：一种用于世界模型与动作建模的统一扩散架构
- **研究机构**: Bagel Research（根据作者邮箱 research@bagel.com 推断）

**1. 整体逻辑**
- **研究任务**: 机器人语言条件操作策略学习（根据多视角视觉观察、机器人本体状态和语言指令，生成连续的机械臂控制动作）。
- **研究动机**: 当前的 VLA（视觉-语言-动作）模型普遍采用数十亿参数的预训练视觉语言模型（VLM）作为动作生成的骨干网络。这导致模型臃肿，且难以剥离性能提升的真实来源（很难说清是动作头设计得好，还是单纯靠 VLM 骨干的参数量堆出来的）。作者希望验证：如果不依赖庞大的 VLM 骨干，仅靠一个轻量级的统一架构同时做动作生成和世界模型预测，能否达到优秀的控制效果。
- **本质改动**: 抛弃大型 VLM 骨干，使用一个共享的、参数量较小的扩散 Transformer（DiT）同时建模“连续动作”和“未来视觉图像块（世界模型）”。训练时两者联合优化，推理时直接剥离视觉预测分支，只保留动作生成以保证推理速度。
- **技术溯源**: 视觉编码器基于冻结的 MAE 和 Perceiver Resampler，文本编码器基于冻结的 CLIP；生成框架基于 Flow Matching（流匹配）和 DiT，没有使用 Llama 或 OpenVLA 等自回归大语言模型基座。

**2. 技术拆解**
- **重点改进**: 将动作生成与未来视觉预测统一到一个 DiT 网络中。利用未来图像的 RGB patch 预测作为辅助监督信号，增强模型对物理世界动态的理解（即世界模型能力），但在推理阶段将其剥离，实现“训练时做世界模型，推理时只做策略”的解耦。
- **架构细节**: 
  - **输入**: 3 步历史上下文（包含主视角和腕部视角的图像、机器人状态）加上语言指令。图像和文本通过冻结的编码器提取特征，状态通过可训练编码器提取，拼接后作为条件输入。
  - **骨干网络**: 一个统一的 DiT，包含 4 层 Transformer block，隐藏层维度 1024，16 个注意力头，外加 4 个 register tokens。总参数量约 399M（其中可训练参数仅 135M）。
  - **输出**: 预测 7 步的连续动作 chunk，以及 128 个未来归一化 RGB patch tokens（主视角和腕部视角各 64 个，取自未来第 7 步的帧）。推理时通过 20 步 Euler 积分生成动作，执行前 3 步后滑动窗口重新规划。
- **核心 Loss**: 基于 Flow Matching 的流速回归损失（L_flow）。总 Loss 是动作流速损失和未来 RGB patch 流速损失的加权和，权重分别设为 0.1 和 0.001。没有复杂的视频重建或感知损失，直接回归归一化后的 patch 向量。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: LIBERO 操作基准测试（包含 Spatial, Object, Goal, Long 四个难度递增的子集，以及在 libero_90 上进行预训练）。
  - **Baseline**: 对比了 24 种主流方法，包括依赖大 VLM 骨干的（如 OpenVLA, π0, GR00T N1, MMaDA VLA 等）和不依赖大 VLM 骨干的（如 Diffusion Policy, Octo, DiT Policy, DreamVLA 等）。
- **评价指标**: 任务成功率（Success Rate）。每个子集评测 500 个 episode，计算平均成功率。同时结合模型总参数量（含冻结模块），分析“参数量-成功率”的帕累托前沿（Pareto frontier）。
- **实验结果**: 
  - WorldDiT 在四个子集上的成功率分别为：Spatial 98.0%, Object 97.0%, Goal 92.8%, Long 91.8%，平均成功率达到 94.9%。
  - 在参数效率上表现极佳：模型总参数量仅为 399M。在对比的 24 种方法中，所有平均成功率高于 94.9% 的模型（如 98.5% 的 ACoT VLA）参数量都远大于它（通常在数十亿级别）；而在同等或更小参数量级下，WorldDiT 的成功率是最高的，位于帕累托前沿上。这证明了在 LIBERO 这类任务上，不依赖超大参数的 VLM 骨干也能达到第一梯队的表现。

### 15. 🔥 [DC-WAM: Dynamic-Centric Visual Supervision and Reasoning for World-Action Models] (DC-WAM：面向世界-动作模型的以动态为中心的视觉监督与推理)
- **研究机构**: `清华大学 (Tsinghua University) 等`
- **Arxiv ID**: `2607.25918` | [点击跳转](https://arxiv.org/abs/2607.25918)

**0. 论文标题**
- **英文标题**: DC-WAM: Dynamic-Centric Visual Supervision and Reasoning for World-Action Models
- **中文标题**: DC-WAM：面向世界-动作模型的以动态为中心的视觉监督与推理
- **研究机构**: 清华大学 (Tsinghua University) 等

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型中的机器人操作策略学习，特别是结合未来视频预测的世界-动作模型（WAM）。
- **研究动机**: 现有的 WAM 在预测未来 RGB 视频时，模型把大量容量浪费在重建纹理、光照、背景等跟动作选择关系不大的外观特征上。这导致模型在遇到光照变化、背景干扰等分布外（OOD）视觉扰动时鲁棒性很差，且生成完整视频计算成本高。
- **本质改动**: 不增加额外的模态（如深度或光流），而是通过修改监督信号和注意力机制，让现有的 RGB 视频分支只关注与交互相关的动态变化（如夹爪运动、物体位移），忽略静态的外观干扰。推理时视频分支只跑一次，后续动作生成复用缓存。
- **技术溯源**: 基于 Wan2.2（视频生成基座）和 Fast-WAM（高效 WAM 推理框架）。

**2. 技术拆解**
- **重点改进**: 
  1. **监督层面**：用时间差分（Temporal-Difference）和基于跟踪器的加权流匹配（Tracker-guided Flow Matching）替代均匀的 RGB 重建 Loss，迫使模型关注动态变化区域。
  2. **推理层面**：引入 DynaRoute 模块，预测每个未来视觉 token 的动态相关性，并将其转化为 Attention Bias，引导模型将注意力集中在与交互相关的未来 token 上。
- **架构细节**: 
  - 采用视觉-动作 MoT (Mixture-of-Transformers) 架构，包含 RGB 视觉分支和动作分支。视觉分支通过 Attention Mask 以动作为条件（未来 token 能看动作，动作不能看未来，防止信息泄露）。
  - **离线构建动态热力图**：用现成的点跟踪器在训练视频上跟踪特征点，计算帧间位移，生成反映运动剧烈程度的动态相关性热力图（仅在训练时使用）。
  - **DynaRoute 模块**：输入停止梯度的视觉、动作和条件 token，输出每个 token 的重要性分数，转为 log-space bias 加到 Attention 的 Key 上。
  - **推理机制**：在初始扩散步执行一次视频分支和 DynaRoute，构建 routed visual KV 缓存，后续去噪步骤只跑动作分支并复用该缓存。
- **核心 Loss**: 包含四部分：
  1. **动作 Flow Matching Loss**：监督动作生成。
  2. **视觉时间差分 Loss**：匹配相邻帧视觉速度场的差分，抑制时间上不变的外观成分。
  3. **跟踪器引导的视觉 Flow Matching Loss**：用离线生成的动态热力图对视觉重建误差进行空间加权，让 Loss 集中在夹爪、物体等运动区域。
  4. **DynaRoute 预测 Loss**：使用 BCE + Dice Loss，监督 DynaRoute 输出的相关性分数逼近下采样后的动态热力图。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：仿真使用 LIBERO（4个子集，测分布内 ID）和 LIBERO-Plus（包含光照、背景、语言等7种 OOD 扰动）；真机使用 Agilex Piper 双臂平台执行3个长程操作任务。
  - **Baseline**：FastWAM 和 FastWAM-AC（同基于 Wan2.2 骨干，FastWAM-AC 保留了动作条件视觉交互但去掉了动态中心目标）。
- **评价指标**: 任务成功率（Success Rate, %），以及分布内到分布外的性能下降幅度（ID-OOD drop，越低越好）。
- **实验结果**: 
  - **仿真 ID (LIBERO)**：DC-WAM 成功率达到 98.1%，比 FastWAM-AC 高 1.4%，比 FastWAM 高 0.5%。
  - **仿真 OOD (LIBERO-Plus)**：DC-WAM 成功率达到 60.9%，比两个 baseline 分别高出 7.1% 和 9.4%。ID-OOD 性能下降幅度最小（37.2%，而 baseline 为 42.9% 和 46.1%），在语言、背景、光照扰动上提升最明显。
  - **真机实验**：在干净、光照扰动、背景扰动条件下，DC-WAM 的成功率均一致高于 FastWAM-AC。例如在叠碗任务的光照扰动下，DC-WAM 成功率比 baseline 高 14%，且整体性能衰减更小。

### 16. 🔥 [SAM3D-Guided Object-Centric Representation Alignment for Vision-Language-Action Models] (SAM3D引导的以物体为中心的视觉-语言-动作模型表征对齐)
- **研究机构**: `香港大学、中科院深圳先进技术研究院、华中科技大学、北京航空航天大学、Infiforce`
- **Arxiv ID**: `2607.25912` | [点击跳转](https://arxiv.org/abs/2607.25912)

**0. 论文标题**
- **英文标题**: SAM3D-Guided Object-Centric Representation Alignment for Vision-Language-Action Models
- **中文标题**: SAM3D引导的以物体为中心的视觉-语言-动作模型表征对齐
- **研究机构**: 香港大学、中科院深圳先进技术研究院、华中科技大学、北京航空航天大学、Infiforce

**1. 整体逻辑**
- **研究任务**: 基于视觉-语言-动作（VLA）模型的通用机器人操作，特别是涉及遮挡、姿态变化和长程多子任务的精细操作。
- **研究动机**: 现有的VLA模型主要吃2D RGB图像，对目标物体的3D属性（形状、姿态、空间布局）理解不够，遇到遮挡或需要精确放置时容易失败。如果直接在推理时引入深度图或点云等显式3D输入，又会改变原有的推理管线，增加硬件和部署成本。
- **本质改动**: 训练时引入SAM3D作为“冻结的3D老师”，提取目标物体的3D特征来监督VLA模型的中间层视觉特征；推理时直接扔掉所有3D模块和掩码，保持原有的“纯RGB+语言->动作”的推理管线。针对长程任务，还加入了子任务分解，让模型在不同阶段关注不同物体的3D特征。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_0$ 模型（SigLIP视觉编码器 + Gemma语言模型），使用 SAM3D 作为3D教师模型，结合 Grounding DINO/YOLO 和 SAM2 进行目标检测与掩码生成。

**2. 技术拆解**
- **重点改进**: 提出“以物体为中心的3D表征对齐”机制。不改变VLA的输入输出接口，而是通过特征层面的知识蒸馏，把SAM3D的3D几何先验注入到VLA的中间层特征中。
- **架构细节**: 
  - **输入输出**: 输入为多视角RGB图像、语言指令和机器人本体状态；输出为连续的动作序列（Action Chunk）。
  - **教师端（SAM3D）**: 将多视角图像展平，结合子任务对应的物体掩码输入冻结的SAM3D，提取密集的3D特征。通过双线性插值将教师特征的分辨率对齐到学生端（VLA）的视觉Token网格。
  - **学生端（$\pi_0$）**: 提取Gemma特定中间层的视觉特征，通过一个线性投影层将其维度映射到SAM3D的特征空间。
  - **推理端**: 完全沿用 $\pi_0$ 的原始管线，不需要深度图、点云、掩码或SAM3D模块。
- **核心 Loss**: 
  - **主 Loss**: $\pi_0$ 原有的 Flow Matching 动作预测Loss（$\mathcal{L}_{action}$），用于生成连续动作。
  - **辅助 Loss**: 掩码归一化均方误差（Masked Normalized MSE）对齐Loss（$\mathcal{L}_{align}$）。利用物体掩码，只在目标物体对应的Token区域计算Loss，并将特征进行L2归一化，强制学生特征在方向上与SAM3D特征对齐，忽略背景干扰和尺度差异。总Loss为两者的加权和。

**3. 实验结果**
- **数据集和baseline**: 
  - **仿真数据集**: LIBERO（4个子任务集）和 CALVIN（长程连续任务 ABC->D）。
  - **真实世界**: Piper-X 双臂移动平台（包含叠碗、挂杯子、做饭、插花等基础与长程任务）。
  - **Baseline**: 2D VLA（$\pi_0$, OpenVLA, Octo等）、显式3D VLA（GeoVLA, 3D-CAVLA等）、隐式3D VLA（Spatial Forcing）以及以物体为中心的方法（ReconVLA）。
- **评价指标**: 
  - LIBERO：各子集及平均成功率（SR）。
  - CALVIN：完成连续5个子任务的平均长度（Avg. Len）及各阶段成功率。
  - 真实世界：标准设置（ST）和遮挡/干扰设置（OC）下的任务成功率。
- **实验结果**: 
  - **LIBERO**: 平均成功率达到 99.1%（SOTA），在长程任务（LIBERO-Long）上达到 98.4%，显著优于 $\pi_0$ 基线（94.2%）。
  - **CALVIN**: 平均完成长度达到 4.11（SOTA），5步连续成功率 71.6%，长程一致性明显优于 ReconVLA（3.95）和 UniVLA（3.80）。
  - **真实世界**: 在标准设置（ST）下，平均成功率从 $\pi_0$ 的 50.2% 提升至 65.2%；在加入遮挡和干扰的困难设置（OC）下，从 21.3% 大幅提升至 44.3%，在做饭、插花等长程任务上提升尤为明显，证明了3D先验对鲁棒性的实际帮助。

### 17. 🔥 [HiFi-UMI: Learning Deployable Manipulation Policies from High-Fidelity UMI Data Alone] (HiFi-UMI：仅从高保真UMI数据学习可部署的操作策略)
- **研究机构**: `Simple AI (Simple World Lab)`
- **Arxiv ID**: `2607.25895` | [点击跳转](https://arxiv.org/abs/2607.25895)

**0. 论文标题**
- **英文标题**: HiFi-UMI: Learning Deployable Manipulation Policies from High-Fidelity UMI Data Alone
- **中文标题**: HiFi-UMI：仅从高保真UMI数据学习可部署的操作策略
- **研究机构**: Simple AI (Simple World Lab)

**1. 整体逻辑**
- **研究任务**: 机器人双臂操作策略学习（从人类演示数据中学习策略并部署到真实机器人）。
- **研究动机**: 真实机器人遥操作数据成本高、难规模化；现有的UMI（手持式无机器人采集设备）虽然便宜，但数据保真度差（SLAM易漂移、双手相对位姿靠重建误差大、传感器靠软件对齐、相机视野有盲区）。这导致目前UMI数据只能用于预训练，后训练（微调）阶段仍必须依赖少量真机遥操作数据作为“锚点”来兜底。
- **本质改动**: 提出 HiFi-UMI 软硬件协同采集系统，大幅提升UMI数据的保真度。核心验证了“零真机后训练”（Zero-robot post-training）：只要UMI数据质量足够高，后训练阶段完全可以抛弃真机遥操作数据，仅用高保真UMI数据微调即可直接在真机上部署。
- **技术溯源**: 基于 StarVLA-QwenPI、OpenPI-π0.5（VLA架构）和 LingBot-VA（WAM架构）等开源或公开的具身智能基座模型。

**2. 技术拆解**
- **重点改进**: 
  1. **硬件端**：用头戴式离线双目惯性SLAM替代手腕VIO，解决长序列漂移；通过头戴相机直接观测双手标记物，获取原生的双手相对位姿；使用共享GPIO硬件触发实现微秒级多传感器同步；每只手配备两个非平行广角相机，实现约200°超宽视野。
  2. **软件端**：构建自动化数据处理流水线，包含轨迹重建、仿真回放验证、质量筛选等，最终能保留96%的高质量可用数据。
- **架构细节**: 
  - **输入**：头部双目图像、每只手2个超广角图像（共6个视角）、语言指令。
  - **输出**：双臂末端6D位姿及夹爪开合度。
  - **模型结构**：验证了三种主流架构，包括纯反应式的VLA（StarVLA-QwenPI、OpenPI-π0.5，后者使用Flow Matching动作头）和结合未来预测的WAM（LingBot-VA）。
- **核心 Loss**: 
  - VLA模型主要使用动作预测Loss（如L1/L2或Flow Matching Loss）。
  - WAM模型（LingBot-VA）除了动作解码Loss外，还包含因果世界建模的未来帧/状态预测辅助Loss。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建并开源的 HiFi-UMI-2K（2000小时微秒级同步、超宽视野的UMI数据），以及用于预训练的4000小时同源数据。
  - **Baseline**：在评估场景中专门采集的真实机器人双臂遥操作（Teleoperation）数据训练的策略。
- **评价指标**: 
  - 真实机器人部署的任务成功率（Success Rate）。
  - 未见任务上的离线动作预测误差（Action Error）。
- **实验结果**: 
  - 仅用 HiFi-UMI 数据进行后训练，在三个基座模型上的真机成功率与遥操作Baseline几乎持平（差异仅为 -2.5%、+3.1%、-0.6%），在精密插入任务上最高达到85%的成功率。
  - 使用4000小时数据进行预训练，使10个未见任务的动作预测误差降低41%；在StarVLA-QwenPI上，使真机成功率进一步提升18.1%。
  - 验证了预训练数据量与动作误差之间存在清晰的幂律缩放关系（α=0.268, R²=0.993）。

### 18. 🔥 [When Does Legacy Data Start to Help? Emergent Transfer in Cross-Configuration Robot Learning] (旧数据何时开始起作用？跨构型机器人学习中的涌现式迁移)
- **研究机构**: `清华大学 (Tsinghua University)`
- **Arxiv ID**: `2607.25593` | [点击跳转](https://arxiv.org/abs/2607.25593)

**0. 论文标题**
- **英文标题**: When Does Legacy Data Start to Help? Emergent Transfer in Cross-Configuration Robot Learning
- **中文标题**: 旧数据何时开始起作用？跨构型机器人学习中的涌现式迁移
- **研究机构**: 清华大学 (Tsinghua University)

**1. 整体逻辑**
- **研究任务**: 机器人硬件升级（如更换相机和夹爪）后，如何有效复用旧硬件收集的演示数据（Legacy Data）来训练新硬件的策略。
- **研究动机**: 硬件迭代导致传感器和执行器发生变化，产生域偏移。业界通常认为“数据越多越好”，但直接混合新旧数据往往无效甚至导致负迁移。需要搞清楚旧数据到底在什么条件下才能真正帮到新硬件，避免盲目收集或盲目混用数据。
- **本质改动**: 没有修改网络结构，而是揭示了跨构型联合训练中的“三阶段迁移规律”（类似大模型中的 grokking 涌现现象），并推导出一个“感知阶段的数据收集规则”，明确指导何时该采新数据、何时该混入旧数据。
- **技术溯源**: 基于 Physical Intelligence 的 $\pi_{0.5}$ (pi-0.5) 视觉-语言-动作 (VLA) 基座模型。

**2. 技术拆解**
- **重点改进**: 提出“迁移阈值”（Transfer Threshold）概念。从梯度对齐和残差不确定性的角度给出理论解释：只有当新硬件策略学到基本的任务阶段结构（成功率超过阈值）后，新旧数据的梯度才会对齐，旧数据才会产生正向收益；当成功率接近饱和时，残差不确定性变小，收益递减。
- **架构细节**: 
  - **输入**：多视角 RGB 图像、本体感知状态、语言指令。
  - **输出**：60步的动作块（action chunk），用于闭环执行。
  - **硬件差异处理**：Gen-1（单目RGB+位置控制夹爪）和 Gen-2（鱼眼相机+力位混合控制夹爪）共享归一化的机械臂动作空间，夹爪控制差异由底层控制器处理，策略网络本身不输入硬件代差标签。
- **核心 Loss**: 标准的行为克隆（Behavior Cloning）损失，没有添加额外的辅助任务（如视频重建或对比学习）。论文的核心不在于改 Loss，而在于分析联合训练时新旧数据梯度的内积（对齐程度）。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**：自建的桌面操作任务（抓笔、插笔、抓花、插花）和移动双臂浇水任务，包含 Gen-1 旧数据和不同质量的 Gen-2 新数据。
  - **Baseline**：仅使用新硬件（Gen-2）数据训练的单构型策略。
- **评价指标**: 端到端任务成功率（Success Rate），以及联合训练带来的成功率绝对提升值（$\Delta SR$），并使用 Fisher 精确检验评估显著性。
- **实验结果**: 
  - **阶段一（低基线 <20%）**：旧数据无效。插花任务新数据基线 10.0%，混入 17 小时旧数据后仍为 10.0%。
  - **阶段二（中等基线 20%-75%）**：旧数据带来巨大提升。插花任务新数据基线 23.3%，联合训练后飙升至 86.7%（提升 63.4%）；插笔任务从 71.7% 提升至 98.3%。
  - **阶段三（高基线 >75%）**：收益递减。插笔任务基线达 85.0% 时，联合训练仅提升 8.3%。
  - **实践效果**：应用提出的“感知阶段数据收集规则”（先采新数据直到越过阈值，再混入旧数据），在留出的浇水任务中，将新硬件的数据收集时间从 88 小时大幅缩减至 1.5 小时。

### 19. 🔥 [Temporal-Distance JEPA: Plan-Aware Representation Learning for Latent World Model Predictive Control] (时间-距离JEPA：用于潜在世界模型预测控制的规划感知表示学习)
- **研究机构**: `香港浸会大学 (Hong Kong Baptist University)`
- **Arxiv ID**: `2607.25337` | [点击跳转](https://arxiv.org/abs/2607.25337)

**0. 论文标题**
- **英文标题**: Temporal-Distance JEPA: Plan-Aware Representation Learning for Latent World Model Predictive Control
- **中文标题**: 时间-距离JEPA：用于潜在世界模型预测控制的规划感知表示学习
- **研究机构**: 香港浸会大学 (Hong Kong Baptist University)

**1. 整体逻辑**
- **研究任务**: 基于无奖励的离线演示日志，训练潜在世界模型并进行模型预测控制（Latent MPC）。
- **研究动机**: 现有的JEPA世界模型（如LeWM）在训练时只优化短时程的潜在状态预测，但在规划时却直接用潜在空间的欧氏距离来衡量“离目标还有多远”。这种欧氏距离只是表示学习的副产品，无法真实反映到达目标的步骤进度，导致“训练目标”和“规划需求”之间存在脱节。
- **本质改动**: 从离线轨迹中挖掘出“有向时间代价”（directed temporal cost），用它来替代或辅助欧氏距离作为规划时的代价函数。利用同轨迹的步数差作为正样本，跨轨迹作为负样本，让模型学到真实的“进度”而非单纯的几何距离。
- **技术溯源**: 基于 LeWM（基于JEPA和SIGReg的潜在世界模型）骨干，规划部分使用 CEM / iCEM（交叉熵方法）。

**2. 技术拆解**
- **重点改进**: 引入了一个有向代价头（Directed cost head），采用度量-残差网络（MRN）参数化，使其能够输出非对称的代价（即从A到B的代价不等于从B到A），更符合真实物理世界的可达性。同时根据任务类型动态选择规划代价：拓扑导航任务用学到的有向时间代价，接触丰富的操作任务用欧氏距离（但其底层表示已被时间监督优化过）。
- **架构细节**: 
  - 骨干网络保持LeWM的Encoder-Predictor结构，输入观测和动作，输出下一步的潜在表示。
  - 新增的有向代价头接收当前状态和目标状态的潜在表示，通过对称特征和非对称残差特征计算有向距离。
  - 规划器在潜在空间进行H步开环rollout，使用CEM或iCEM搜索最小化终端代价的动作序列。
- **核心 Loss**: 
  - 主Loss包含三部分：1) 骨干的下一步潜在预测Loss（L2）+ SIGReg防坍缩正则；2) 时间距离监督Loss（同轨迹步数差回归 + 跨轨迹负样本Hinge Loss）；3) 视界对齐的Rollout一致性Loss（在H步开环预测上加teacher-forcing，让训练和规划的视界匹配）。

**3. 实验结果**
- **数据集和baseline**: 
  - 环境：Two-Room（导航）、Reacher（到达）、OGB-Cube和Push-T（接触丰富的机械臂操作）。
  - Baseline：LeWM、RC-aux（同期工作）、Value-guided JEPA等。
- **评价指标**: 任务成功率（Success Rate），以及潜在距离与真实时间步数的Spearman秩相关系数（用于评估进度对齐程度）。
- **实验结果**: 
  - 进度对齐：在Push-T上，TD-JEPA学到的代价与真实时间步数的Spearman相关系数达到0.95，而LeWM的欧氏距离只有0.65。
  - 任务表现：在Two-Room导航任务中，使用挖掘出的时间代价将成功率从LeWM的97.4%提升至100.0%；在接触丰富的OGB-Cube任务中，使用时间监督训练的特征配合欧氏距离规划，成功率比LeWM高出14.2个百分点，Push-T也有明显提升。
  - 综合对比：在严格的锁定评估下，TD-JEPA在所有测试环境上均匹配或超越了LeWM和RC-aux。消融实验证实了有向头、跨轨迹负样本和Rollout一致性Loss缺一不可。

### 20. 🔥 [VisualPatchWorld: Code World Models as Latent Structured Representations for Planning] (VisualPatchWorld：将代码世界模型作为规划的潜在结构化表示)
- **研究机构**: `Hong Kong Baptist University (香港浸会大学)`
- **Arxiv ID**: `2607.25236` | [点击跳转](https://arxiv.org/abs/2607.25236)

**0. 论文标题**
- **英文标题**: VisualPatchWorld: Code World Models as Latent Structured Representations for Planning
- **中文标题**: VisualPatchWorld：将代码世界模型作为规划的潜在结构化表示
- **研究机构**: Hong Kong Baptist University (香港浸会大学)

**1. 整体逻辑**
- **研究任务**: 从交互数据中自动挖掘可执行的代码世界模型（Code World Models），并将其作为内部模拟器用于机器人的闭环运动规划。
- **研究动机**: 现有的世界模型主要分两派。神经网络派（如 Dreamer）能从数据中学习但像个黑盒，预测错了无法人工检查和修改；代码派（如 WorldCoder）能生成可解释的 Python 代码，但它们通常只盯着“单步预测误差”去拟合，很容易学错物理本质（比如没学到摩擦力或接触力），导致在长序列规划时误差累积，完全无法用于实际控制。
- **本质改动**: 把学习代码模型拆成两步：先通过“主动探测”选定正确的物理公式结构（比如判断是接触模型还是自由运动），再去拟合公式里的具体参数。这样保证学出来的代码在物理定性上是正确的，能直接塞进 MPC（模型预测控制）里做规划。
- **技术溯源**: 实验环境和设定基于 LeWM (Latent Embodied World Models)。核心的代码模型构建没有依赖大语言模型进行开放式代码生成，而是基于预定义的 Python 物理模板做参数优化（对比实验中使用了 Qwen3-Coder 和 Qwen3.5-VLM 作为 baseline 和视觉感知模块）。

**2. 技术拆解**
- **重点改进**: 核心是“两级程序归纳”（Two-level program induction）。第一级用短促的主动交互（active probing）来判断环境属于哪种动力学草图（sketch）；第二级固定草图后，用多步展开的损失函数去优化代码里的未知常数。这解决了端到端代码生成容易陷入局部最优或学错物理定律的问题。
- **架构细节**: 
  - **输入**: RGB 图像（通过 CV 工具或 VLM 提取场景图）或 Oracle 真实状态，以及动作。
  - **输出**: 可执行的 Python 状态转移程序。
  - **具体结构**: 分为 4 个阶段。Stage 1 视觉抽象（提取场景图）；Stage 2 轨迹导出（构建状态-动作-下一状态三元组）；Stage 3 两级程序归纳（Level 1 主动探测选结构，Level 2 拟合参数）；Stage 4 规划协议（把生成的 Python 函数当成模拟器，用 CEM-MPC 做滚动时域规划）。
  - **模型规模**: 不涉及庞大的神经网络训练，主要是轻量级的 Python 代码模板和参数优化。
- **核心 Loss**: 
  - **主 Loss**: 多步展开误差（Multi-step rollout loss），即在规划视野内累积的状态预测误差，专门用来惩罚那些“单步看着准、多步全跑偏”的模型。
  - **辅助任务**: Level 1 结构选择中，使用主动探测（active probing）的匹配误差来挑选最佳动力学草图。

**3. 实验结果**
- **数据集和baseline**: 
  - **数据集**: 使用 LeWM 的四个经典具身环境：Two-room（2D 导航）、Reacher（机械臂到达）、PushT（2D 推箱子，强接触）、Cube（3D 多物体操作）。
  - **Baseline**: 对比了神经网络世界模型（LeWM, DINO-WM）、离线强化学习策略（GCBC 等），以及多个代码世界模型基线（PatchWorld, WorldCoder, POMDP-Coder 等）。
- **评价指标**: 闭环规划成功率（Success %）。固定使用 CEM-MPC 规划器，每个环境测 50 个随机起点，评估在限定步数内达到目标的成功率。
- **实验结果**: 
  - VPW (使用 Oracle 状态) 平均成功率达到 69.0%，比最强的代码基线（POMDP-Coder 的 45.5%）高出 23.5 个百分点。
  - 在高度依赖正确动力学结构的 Reacher 任务上，成功率从基线的 8% 提升至 72%。
  - 在接触丰富的 PushT 任务上，从基线的 0% 提升至 22%（与真实引擎的 96% 仍有差距，但通过引入真实引擎对候选计划进行二次打分，可以弥补大部分差距）。
  - 在 Two-room 和 Cube 任务上，表现接近真实物理引擎的上限（分别为 96% 和 86%）。
