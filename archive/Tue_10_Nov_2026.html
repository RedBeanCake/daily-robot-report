            <script type="text/markdown" id="raw-markdown">### 1. 🔥 [On Agentic Manipulation Policies] (论代理操作策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.09892` | [点击跳转](https://arxiv.org/abs/2611.09892)

**0. 论文标题**
- **英文标题**: On Agentic Manipulation Policies
- **中文标题**: 论代理操作策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出“代理操作策略（AMP）”范式，让通用大模型直接处于机器人控制闭环中通过代码生成动态指挥机械臂，在零样本下大幅超越传统VLA/WAM等专家策略，并展现出丰富的涌现操作技能。

**1. 整体逻辑**
- **研究任务**: 机器人通用物理操作（如抓取、放置、推、使用工具等），即让机器人根据自然语言指令完成复杂的多步骤交互任务。
- **研究动机**: 现有的专家策略（如VLA、WAM）依赖大量演示数据，泛化能力差且对指令变化脆弱；而现有的通用模型应用（技能编排或离线代码合成）要么受限于预定义的低级技能，要么模型不在控制闭环中，无法在执行中根据物理反馈动态调整策略。
- **本质改动**: 摒弃预训练的动作策略或离线写死的代码，将通用大模型直接置于控制闭环中（in the control loop），通过持久化解释器直接生成底层运动轨迹代码，并在执行中根据视觉和物理反馈实时反思和修改动作。
- **技术溯源**: 基于通用多模态大模型（如 Gemini 4 Argon, Claude Opus 5.5 等），结合传统机器人学工具（逆运动学、点云处理、碰撞检测）构建的 AMP1 参考系统（Harness）。

**2. 技术拆解**
- **核心方法**: 提出 AMP1 系统架构。系统提供感知、场景建模和底层运动执行的 SDK。大模型在持久化 Python 解释器中编写代码，调用 SDK 获取多模态感官输入，生成带时间戳的末端执行器（TCP）位姿轨迹和夹爪指令。模型在闭环中不断“观察-思考-写代码-执行-反思”，自主构建操作技能。
- **关键细节**: 
  - 输入：多相机 RGB、深度图、相机内外参、机器人本体状态及分割后的场景点云模型。
  - 输出：TCP 位姿序列（含位置、姿态、到达时间）和夹爪指令。
  - 系统架构：包含 SDK、机器人服务器（处理点云分割、碰撞检查、轨迹插值与逆解）和持久化 Python 解释器（保留变量和函数）。
  - 规模：实验测试了 13 个前沿大模型（闭源如 Gemini, Claude 系列；开源如 Qwen, GLM, DeepSeek, Kimi）。
- **训练/优化目标**: 无梯度训练（Zero-shot / Gradient-free）。优化目标为最大化自然语言指定任务的成功率。在经验学习（AMP1+）中，通过持久化记忆库（保存 Markdown 笔记和 Python 代码）进行无梯度的 few-shot 和 continual learning。

**3. 实验结果**
- **实验设置**: 
  - 数据集：RoboLab-120（仿真，120个任务），CaP-Gym（含 LIBERO-PRO, robosuite, BEHAVIOR-1K），RoboDojo（双臂仿真，42个任务，用于经验学习），以及 12 个真实世界物理任务（Franka 机械臂）。
  - 对比对象（Baseline）：VLA（如 $\pi_{0.5}$）、WAM（如 FLUX 3 Action）及其他 Agent（如 CaP-Agent0, HarnessPAI, ASPIRE, Astranomy）。
- **评价指标**: 任务成功率（Success rate）、平均成功时间（Average time to success）、模型调用次数（Number of model calls，衡量效率）。
- **主要结果**: 
  - **零样本性能**：在 RoboLab-120 上，AMP1（配 Gemini 4 Argon）成功率达 85.6%（Opus 5.5 为 82.8%），远超 VLA（$\pi_{0.5}$ 49.2%）和 WAM（FLUX 42.9%），且对模糊指令极具鲁棒性。在 CaP-Gym 中，LIBERO-PRO 达 95.2%，robosuite 达 100%。
  - **真实世界**：在 12 个复杂任务的 108 次试验中，成功率达 96.3%，相比 FLUX（45.4%）和 $\pi_{0.5}$（27.8%），失败率降低了 15 到 20 倍。
  - **经验学习**：在 RoboDojo 上，引入持久化记忆的 AMP1+ 通过 few-shot 学习将成功率从 26.4% 提升至 84.1%（超越榜单第一），通过 continual learning 提升至 57.6%，且模型调用次数显著减少。
  - **涌现行为与消融结论**：模型自主涌现出搜索遮挡物、利用工具、推物体创造抓取条件、自我校准相机等行为。消融实验验证了：模型能力对性能影响最大；强模型在基础接口（无辅助抓取例程）下表现更好；强模型能通过主动感知补偿缺失的深度/标定信息；直接输入图像的效果远好于文本描述。

### 2. 🔥 [SURE:Spatiotemporal Uncertainty Representation for Efficient Vision-Language-Action Learning] (SURE：面向高效视觉-语言-动作学习的时空不确定性表征)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.09684` | [点击跳转](https://arxiv.org/abs/2611.09684)

**0. 论文标题**
- **英文标题**: SURE:Spatiotemporal Uncertainty Representation for Efficient Vision-Language-Action Learning
- **中文标题**: SURE：面向高效视觉-语言-动作学习的时空不确定性表征
- **研究机构**: 原文未提及
- **一句话总结**: 提出SURE框架，通过引入转置卷积概率动作解码器和Soft-DTW对齐监督，显式建模VLA策略中动作空间的结构化时空不确定性，大幅提升了机器人操作任务的数据与训练效率。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）策略的机器人端到端操作控制（核心在于提升数据与训练效率）。
- **研究动机**: 机器人操作动作空间存在结构化的时空不确定性（多个相近动作均可成功，且不同演示的执行速度不同）。现有的逐点监督（pointwise supervision）将演示动作视为精确目标，导致模型对演示者的特定姿态和速度过拟合，需要海量数据才能学会。
- **本质改动**: 放弃对单一精确动作标签的回归，改用概率分布解码器建模空间局部相关性，并引入Soft-DTW损失容忍时间轴上的速度差异，从而降低对精确时空标签的敏感度。
- **技术溯源**: 基于 OpenVLA-7B 视觉语言模型基座。

**2. 技术拆解**
- **核心方法**: 
  1. **轻量级转置卷积概率动作解码器（处理空间不确定性）**：将连续动作离散化为256个有序区间（bins），利用转置卷积的权重共享特性捕捉相邻动作区间的局部相关性，最后通过期望值（expectation）解码为连续动作。
  2. **Soft-DTW对齐监督（处理时间不确定性）**：利用可微的动态时间规整（Soft-DTW）计算预测动作序列与演示序列的累积轨迹对齐损失，容忍局部执行速度的差异。
- **关键细节**: 
  - **输入输出**：输入为视觉观测、本体感觉状态和语言指令；输出为动作块（action chunk），LIBERO和真实世界任务chunk长度为8，RoboTwin 2.0为25。
  - **模型结构**：VLA基座输出动作token后，经过分组1x1卷积融合，分为平移、旋转和夹爪三个分支。平移和旋转使用转置卷积上采样（1 -> R/4 -> R，R=256），夹爪使用轻量级MLP。
  - **规模**：动作头极其轻量，参数量仅为16.93M。
- **训练/优化目标**: 
  - **空间损失**：L1损失（主） + 弱KL散度正则化（辅，权重0.05），以离散化高斯分布为目标分布。
  - **时间损失**：Soft-DTW散度 + 端点L1损失（权重0.5）。
  - **总损失**：上述各项的加权和。Soft-DTW的平滑系数 $\gamma$ 在训练初期进行退火（annealing）处理。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO (4个任务套件), RoboTwin 2.0 (5个双臂任务), 真实世界 (6个桌面操作任务，使用LeRobot SO-101机械臂)。
  - **对比对象 (baseline)**：Diffusion Policy, Octo, OpenVLA, GR00T-N1, $\pi_0$, OpenVLA-OFT, RDT。
- **评价指标**: 任务成功率（%），动作头参数量，FLOPs，动作解码延迟（ms）。
- **主要结果**: 
  - **训练效率**：在LIBERO上，SURE仅训练10k步即达到97.0%平均成功率，超过训练50k步的OpenVLA-OFT（94.3%）。在RoboTwin 2.0上，20k步达到72.2%，超过 $\pi_0$（60.2%）。真实世界20k步达到57.5%，超过OpenVLA-OFT 50k步的41.7%。
  - **数据效率**：在LIBERO-Spatial上，仅使用25%的演示数据即达到95.0%成功率，超过OpenVLA-OFT使用100%数据的94.4%；仅用10%数据也能达到93.8%。
  - **推理效率**：动作头解码延迟仅1.57ms（JAX实现下0.69ms），比 $\pi_{0.5}$ 快12.7倍（JAX下快28.8倍），且无需迭代去噪，兼顾了不确定性建模与推理速度。

### 3. 🔥 [Can LLMs Debug Robots by Editing Their Weights?] (大语言模型能通过编辑权重来调试机器人吗？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.09376` | [点击跳转](https://arxiv.org/abs/2611.09376)

**0. 论文标题**
- **英文标题**: Can LLMs Debug Robots by Editing Their Weights?
- **中文标题**: 大语言模型能通过编辑权重来调试机器人吗？
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出让大模型（GPT-6 Astra）直接修改机器人视觉-语言-动作（VLA）策略的少量词嵌入权重，以修复因指令同义替换导致的执行失败，全程无需梯度更新或新演示数据。

**1. 整体逻辑**
- **研究任务**: 修复机器人基础策略中因自然语言指令措辞变化（如使用同义词或描述性语言）导致的“词汇指令接地（lexical instruction grounding）”失败问题。
- **研究动机**: 机器人策略往往已经具备完成某项物理操作的能力（如开火），失败原因仅仅是当前指令的措辞与策略预训练时的规范指令不匹配（例如把“打开炉灶”说成“激活烹饪设备的热源”）。现有方法通常需要重新微调或收集新数据，缺乏一种轻量级、无需梯度的直接“修bug”手段。
- **本质改动**: 将“权重空间编程（weight-space programming）”引入机器人基础策略调试：让 LLM 直接读取并修改目标策略的权重（具体为 token embedding 行），通过模拟器反馈进行静态代数计算，完全绕过梯度优化。
- **技术溯源**: 基于 Takehi et al. 提出的权重空间编程框架；目标策略包括 openpi 的 $\pi_{0.5}$ (pi05_libero checkpoint) 和 FastWAM；评估环境基于 LIBERO 系列基准（LIBERO-Goal, LIBERO-Plus, LIBERO-PRO, LIBERO-RECOVER）；编辑工具为 LLM GPT-6 Astra。

**2. 技术拆解**
- **核心方法**: LLM Editor 接收策略的张量名称、形状、原始权重和分词器，在一个持久化的 CPU Python 工作区中进行静态线性代数操作。它通过预算内的前向工具（forward tool）运行模拟器回合（rollouts）和重放探测（replay probes）来获取反馈，诊断出导致错误的源 token，并将其 embedding 向量向目标任务锚点（task anchors）进行插值或替换。
- **关键细节**: 
  - **输入输出**：输入为策略权重、CPU 工作区、模拟器反馈（观察和结果）；输出为修改后的权重张量。
  - **模型结构/规模**：以 $\pi_{0.5}$ 为例，包含 36.2 亿参数（SigLIP 视觉编码、PaliGemma 风格 VLM 前缀、流匹配动作专家）。
  - **具体修改**：在最佳实验（Run C）中，仅修改了 257,152 行词嵌入表中的 65 行（占总参数 0.00367%）。修改公式为 $E'_i = (1-\alpha_i)E_i + \alpha_i \bar{E}_{T_i}$，将源 token 的 embedding 向目标 anchor token（如 stove, bowl, wine）的 embedding 质心进行线性插值，插值强度 $\alpha$ 在 0.5 到 1.0 之间。
  - **约束**：禁止梯度更新、训练循环；每次会话限制 40-50 次前向请求，CPU 执行限时 900 秒/96GB 内存。
- **训练/优化目标**: 非梯度学习类工作。核心机制是 LLM 基于模拟器实践回合的反馈，通过静态代数计算（如 SVD 投影、质心计算）直接构造替换张量。优化目标是最大化固定 held-out 语言变体上的任务成功率，同时保证未修改 token 的输入产生完全相同的动作（结构局部性）。

**3. 实验结果**
- **实验设置**: 
  - **数据集与对比对象**：主要使用 LIBERO-Goal 的 paraphrases（同义替换指令），以及 FastWAM、LIBERO-Plus、LIBERO-PRO、LIBERO-RECOVER。Baseline 为原始未修改的 $\pi_{0.5}$ 和 FastWAM 权重；控制组包括随机方向编辑（matched norm）和全量替换（full destination replacement）。
  - **系统环境**：仿真环境，固定输入下的确定性执行与闭环模拟相结合。
- **评价指标**: 配对测试下的任务成功率（Success rate），使用精确的双侧 McNemar 检验（exact paired p-value）衡量修改前后的差异，统计修复数（repairs, $g$）和退化数（regressions, $l$）。
- **主要结果**: 
  - 在 $\pi_{0.5}$ 的 765 个 held-out 语言变体上，Run C（修改 65 行 embedding）将整体成功率从 86.3% 提升至 92.0%（修复 48 个，退化 4 个，p = 1.31e-10）。
  - **局部性验证**：在包含被编辑 token 的 335 条指令中，成功率从 74.3% 升至 87.5%；其余 430 条未包含被编辑 token 的指令结果零变化，证明了修改的精确性。
  - **控制实验**：随机方向编辑无效；全量替换能解释大部分收益，但 LLM 的插值方法产生的退化更少。
  - **拒绝无效编辑**：在另外 13 个针对 FastWAM 和 LIBERO 其他故障（如相机扰动、恢复任务、新位置/任务）的编辑会话中，LLM 拒绝了 12 个候选编辑，唯一保留的编辑在 held-out 集上无显著提升。这证明该方法能有效区分“可修复的词汇障碍”和“缺失的动作能力”，不会盲目修改权重。

### 4. 🔥 [MDF++: Visuo-Tactile World Action Model with End-to-end Representation Learning] (MDF++：具有端到端表征学习的视觉-触觉世界-动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.09293` | [点击跳转](https://arxiv.org/abs/2611.09293)

**0. 论文标题**
- **英文标题**: MDF++: Visuo-Tactile World Action Model with End-to-end Representation Learning
- **中文标题**: MDF++：具有端到端表征学习的视觉-触觉世界-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出 MDF++，通过跨模态预测和选择性梯度回传机制，在视觉-触觉世界-动作模型中实现端到端的表征学习，解决了直接微调导致的特征坍塌问题，大幅提升了接触丰富操作任务的成功率。

**1. 整体逻辑**
- **研究任务**: 接触丰富的机器人操作任务（如拧螺丝、螺母配合、精密插拔等），需要联合建模动作生成与未来多模态（视觉、触觉、力、本体感觉）观测的预测。
- **研究动机**: 现有的世界-动作模型（WAMs）主要依赖视觉，且通常使用冻结的预训练编码器（如用于像素重建的 VAE）。这些表征未对齐控制目标；若直接端到端联合微调，会导致特征坍塌（编码器和扩散模型共适应，产生容易去噪但对控制无用的隐变量）。
- **本质改动**: 引入多任务学习与选择性梯度回传（Selective Gradient Flow）策略，阻断各模态自身的去噪损失更新其编码器，仅利用跨模态预测损失来更新编码器，从而端到端学习出对控制友好的多模态表征。
- **技术溯源**: 基于 Multimodal Diffusion Forcing (MDF)、Diffusion Transformer、预训练 ViT。

**2. 技术拆解**
- **核心方法**: 
  1. **多任务结构化掩码**：在 2D 时间-模态噪声矩阵中，采样策略学习、世界-动作建模、正向/逆向动力学等结构化条件分布，引导模型学习控制相关的时序和跨模态依赖。
  2. **选择性梯度回传（Selective Gradient Flow）**：在计算某模态的去噪损失时，截断该损失对其自身编码器的梯度回传；仅允许其他模态和动作的去噪损失（跨模态预测）来更新该编码器。这迫使视觉编码器去预测触觉、力和动作，从而学到对控制有用的表征，避免只关注自身重建的捷径。
- **关键细节**: 
  - **输入**：RGB 和触觉图像（224×224，ViT-Tiny 提取 CLS token），力/力矩、本体感觉和动作（线性投影）。
  - **模型结构**：12 层 Diffusion Transformer，隐层维度 512，8 个注意力头。
  - **训练规模与超参**：AdamW 优化器，batch size 64，训练 200k 步；扩散步数 1000，推理 10 步（DDIM）。编码器学习率（1e-5）低于主干网络（1e-4），并采用余弦退火。
- **训练/优化目标**: 标准 DDPM 去噪损失（预测 $x_0$），结合多任务结构化掩码；各模态损失加权（动作 4.0，力/本体感觉 1.0，RGB/触觉 0.01）。

**3. 实验结果**
- **实验设置**: 
  - **仿真环境**：Isaac Lab Factory (PegInsert, GearMesh, NutThread) 和 ManiFeel (ObjectSearch, BallSorting)。对比 MDF, UWM, DP w/ tactile 及多种冻结/朴素微调变体。
  - **真实世界**：Franka 机械臂 + WSG-50 夹爪 + GelSight Mini 触觉传感器。任务：Bolt Screwing, Nut Mating。对比 UWM, MDF++(frozen-ViT)。
- **评价指标**: 仿真中的任务成功率（Success rate）；真实世界中的基于阶段的评分（Stage-based scores）和成功率；表征分析中的方差、有效秩（Effective rank）和线性探针动作预测 MSE。
- **主要结果**: 
  - **仿真表现**：MDF++ 平均成功率 86.9%，比 adapted MDF (68.4%) 高 18.5%，比朴素端到端微调 (64.1%) 高 22.8%，比冻结编码器变体 (约 58%) 和 UWM (74.2%) 显著更好。
  - **真实世界表现**：Bolt Screwing 成功率 80%（UWM 50%，frozen-ViT 30%）；Nut Mating 成功率 40%（UWM 25%，frozen-ViT 15%）。
  - **表征分析**：MDF++ 的表征有效秩更高，且动作预测 MSE 降至 0.043（朴素端到端为 0.520），证明其有效避免了特征坍塌，且隐变量中包含了更多线性可分的动作相关信息。

### 5. 🔥 [Toward the Era of Agentic Embodied Intelligence] (迈向智能体具身智能时代)
- **研究机构**: `上海交通大学 (Shanghai Jiao Tong University) / AutoLab`
- **Arxiv ID**: `2611.09124` | [点击跳转](https://arxiv.org/abs/2611.09124)

**0. 论文标题**
- **英文标题**: Toward the Era of Agentic Embodied Intelligence
- **中文标题**: 迈向智能体具身智能时代
- **研究机构**: 上海交通大学 (Shanghai Jiao Tong University) / AutoLab
- **一句话总结**: 提出 $A^2$-MEAS 多智能体具身框架，通过“代码作为扩展接口”将大模型的高层推理与底层动作策略结合，并配套了高效的训练与评估基础设施，在长序列机器人操作任务中实现了显著的性能提升和故障恢复能力。

**1. 整体逻辑**
- **研究任务**: 解决机器人在长序列物理任务（如复杂家务操作）中的持续自主控制、故障诊断与动态恢复问题。
- **研究动机**: 现有的基础模型能指导机器人动作，但在长序列执行中缺乏高效的底层控制；且当遇到物理失败（如抓取滑落、物体错位）时，系统难以自主诊断物理状态并修正行为，导致任务直接中断。
- **本质改动**: 将大模型的“推理指导”转化为一种可学习的“修正代码（correction code）”，通过残差适配器（Adapter）在不更新底层动作策略权重的情况下，动态修正连续动作轨迹，实现了高层推理与底层控制的解耦与高效结合。
- **技术溯源**: 基于 VLA（Vision-Language-Action）架构，大模型推理部分使用 Qwen 系列（Qwen3.8-27B / Qwen3.5-2B），连续动作生成基于 Flow Matching（流匹配），并以 $\pi_{0.5}$ 等主流 VLA 模型作为对比基线和系统参考实现。

**2. 技术拆解**
- **核心方法**: 提出 $A^2$-MEAS 框架，包含三个协同智能体组：MetaBrain（负责高层任务推理和恢复指令）、Diagnostic agents（负责感知、时空接地和物理交互评估）、以及底层动作模型 $A^2$-WLA。核心创新是 Correction interface，将恢复语言、空间证据、执行历史和基础动作提案编码为“修正代码”，输入到 Adapter 中生成残差调整。
- **关键细节**: 
  - **$A^2$-WLA 架构**：包含视觉-语言骨干网络、运动感知历史编码器（motion-aware history encoder）和潜在世界模型（latent world model，用于预测未来视觉特征）。
  - **动作生成**：预测多步连续动作块（action chunk，如预测50步，执行前32步）和局部阶段进度估计。
  - **修正机制**：Adapter 读取修正代码，在动作专家的隐藏状态中注入门控残差（gated residual），部署时所有底层权重保持冻结。
  - **基础设施**：针对长序列训练和评估进行了深度系统优化，包括 Arrow 共享内存缓存、Prefix 计算共享、Sharded Local Muon 优化器以及动态仿真调度。
- **训练/优化目标**: 动作模型使用 Flow Matching（流匹配）目标进行连续动作优化，结合动作预训练和任务特化；Adapter 使用流匹配目标在修正片段上进行训练；MetaBrain 在训练阶段提供修正监督信号。

**3. 实验结果**
- **实验设置**: 
  - **长序列仿真**：BEHAVIOR 2026（100个家务任务，1000个 episodes）。
  - **双臂短序列仿真**：RoboTwin 2.0（50个任务，Clean/Randomized 设置）。
  - **真机实验**：12个桌面任务（5个家庭场景），以及长序列手冲咖啡任务。
  - **Baseline**：$\pi_{0.5}$、RLC（2025年竞赛冠军）、Comet、G0.5 等。
- **评价指标**: Task-macro Q-score（目标条件满足比例）、Complete-task success rate / SR（完整任务成功率）、Successful task coverage（至少成功一次的任务覆盖数）。
- **主要结果**: 
  - **BEHAVIOR 2026 (100 tasks)**: 完整系统 $A^2$-MEAS 达到 0.6411 Q-score 和 45.40% SR，覆盖 88 个任务。仅底层 $A^2$-WLA (多模型配置) 在 50-task 子集上就达到 0.5755，是 2025 冠军 RLC (0.2605) 的 2.21 倍。
  - **RoboTwin 2.0**: $A^2$-WLA 平均成功率 93.98%，完整系统 95.05%，显著超越 $\pi_{0.5}$ (79.75%) 和 G0.5 (93.25%)。
  - **真机 12 tasks**: $A^2$-WLA 平均成功率 57.92%，大幅高于 $\pi_{0.5}$ 的 26.67%。
  - **真机长序列 (手冲咖啡)**: 引入 Adapter 后，失败后的步骤完成率从 14% 提升至 94%，从 8% 提升至 82%。
  - **系统效率**: 训练吞吐率达 427.1 samples/s，是 $\pi_{0.5}$ 参考实现的 4.03 倍；评估基础设施将 1000 episodes 的评估时间从约 159.4 小时降至 18.1 小时（加速约 8.8 倍）。

### 6. 🔥 [DobotTrack: Target-Grounded Vision-Language-Action Learning for Embodied Person Tracking] (DobotTrack：面向具身人跟踪的目标锚定视觉-语言-动作学习)
- **研究机构**: `Dobot`
- **Arxiv ID**: `2611.09041` | [点击跳转](https://arxiv.org/abs/2611.09041)

**0. 论文标题**
- **英文标题**: DobotTrack: Target-Grounded Vision-Language-Action Learning for Embodied Person Tracking
- **中文标题**: DobotTrack：面向具身人跟踪的目标锚定视觉-语言-动作学习
- **研究机构**: Dobot
- **一句话总结**: 提出了一种结合 Mask 和 Box 双重辅助监督以及目标条件历史压缩模块（Q-identity）的 VLA 框架，在 0.8B 小参数量下大幅提升了具身人跟踪的抗干扰能力，并开源了基于四足机器人的真实世界跟踪数据集。

**1. 整体逻辑**
- **研究任务**: 语言引导的具身人跟踪（根据自然语言描述，控制移动机器人持续跟踪特定目标人物）。
- **研究动机**: 1）现有 VLA 模型多依赖轨迹模仿，缺乏对目标外观和位置的显式表征，遇到遮挡或干扰物容易跟错人；2）保留完整历史视觉 token 计算开销大，直接压缩又会丢失目标身份特征和空间线索。
- **本质改动**: 在 VLA 中引入目标分割（Mask）和边界框（Box）作为辅助监督以强化目标锚定（Grounding），并设计 Q-identity 模块，利用预测的 Box 引导历史视觉 token 的压缩，从而在极低 token 预算下保留目标身份特征。
- **技术溯源**: 视觉语言基座 InternVL3，分割解码器 SAM2，仿真基准 EVT-Bench（基于 Habitat 3.0）。

**2. 技术拆解**
- **核心方法**: 
  1）目标锚定监督：在自回归序列中插入 Mask token 和 Box token。Mask token 结合当前帧特征通过 SAM2 解码器输出分割掩码；Box token 回归归一化边界框坐标。两者与轨迹预测联合优化，迫使模型显式学习目标表征。
  2）Q-identity 历史压缩：利用上一帧预测的 Box 提取目标区域特征，通过目标条件自注意力（Target-conditioned self-attention）和全图交叉注意力（Full-image cross-attention），将历史帧压缩为固定数量的 query tokens。
- **关键细节**: 
  - 输入输出：输入 8 帧 RGB（5Hz 采样）和文本指令；输出 8 个未来路点（10Hz），以及当前帧的 Mask、Box 和可见性。
  - 模型规模：0.8B 参数。
  - 压缩细节：每帧历史图像压缩为 16 个 token，当前帧保留 256 个 dense tokens。8 帧的总 token 数从 2048 降至 368。
- **训练/优化目标**: 
  - 联合损失函数：轨迹预测 MSE 损失 + Mask 分割损失（BCE + Dice + IoU-score + 目标存在分类） + Box 回归损失（SmoothL1 + GIoU + 可见性分类）。
  - 训练策略：冻结视觉编码器，微调多模态投影层、LLM、Q-identity 及各任务 Head。训练时对输入 Box 进行 80% 概率的扰动，并以 30% 概率对当前帧也进行压缩以增强鲁棒性。

**3. 实验结果**
- **实验设置**: 
  - 数据集：EVT-Bench 仿真数据（约 180 万样本） + 真实世界四足机器人采集数据（126 个 episode，约 59.6 万帧 Mask 标注）。
  - Baseline：OmTrackVLA (1B), TrackVLA (7B), TrackVLA++ (7B), ReferTrack (4B) 等。
- **评价指标**: 成功率 (SR, Success Rate)、跟踪率 (TR, Tracking Rate)、碰撞率 (CR, Collision Rate)。
- **主要结果**: 
  - 在 EVT-Bench 上，0.8B 的 DobotTrack 在单目标 (STT)、干扰 (DT)、歧义 (AT) 三个任务上的 SR 分别为 90.2%、72.5%、70.9%，平均 SR 达 77.9%，比 1B 的 OmTrackVLA 高出 16.9 个百分点；相比 7B 的 TrackVLA++，SR 也全面领先。
  - 消融实验表明，Mask+Box 联合监督效果优于单一监督或未来帧预测；Q-identity 在 16 token 预算下比直接 Pooling 的 SR 显著提升（DT 任务提升 6.3%）。
  - 推理效率：在 Orin Nano 上，16 token 压缩的 P95 延迟为 93.4ms，比 256 token 的 203.9ms 快一倍多，仅比无压缩的 16 token Pooling (91.0ms) 慢 2.4ms。
  - Sim-to-Real：加入真实世界数据后，仿真测试的 SR 进一步提升（如 STT 从 87.6% 升至 90.2%），并在真实四足机器人上实现了稳定的室外跟拍。

### 7. 🔥 [PRISM: Primitive Routing via In-context Skill Mixing for Retentive VLA Adaptation] (PRISM：通过上下文技能混合进行原语路由以实现保留性的VLA适配)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.08917` | [点击跳转](https://arxiv.org/abs/2611.08917)

**0. 论文标题**
- **英文标题**: PRISM: Primitive Routing via In-context Skill Mixing for Retentive VLA Adaptation
- **中文标题**: PRISM：通过上下文技能混合进行原语路由以实现保留性的VLA适配
- **研究机构**: 原文未提及
- **一句话总结**: 提出PRISM框架，将VLA模型的原子技能参数化为冻结的低秩原语库，并通过上下文路由和残差适配来实现长程任务组合，同时有效避免技能遗忘。

**1. 整体逻辑**
- **研究任务**: 视觉-语言-动作（VLA）模型的持续适配，具体解决技能保留（不遗忘已学技能）和长程任务组合（在长序列中按需切换子技能）的问题。
- **研究动机**: 现有的单策略微调（如标准LoRA）把所有新任务塞进共享的参数更新里，导致两个问题：一是新任务训练会覆盖旧技能参数，造成灾难性遗忘；二是长程任务缺乏参数级别的技能定位和切换机制，只能从头端到端拟合，无法复用已掌握的子技能。
- **本质改动**: 发现原子技能的LoRA更新在参数空间中占据独立且可区分的低维子空间（复合任务的LoRA更新约有56%的能量落在这个原子子空间里）。据此，将技能显式解耦为冻结的参数级“原语（Primitives）”，并通过基于上下文的路由器在推理时动态混合这些原语。
- **技术溯源**: 基于 $\pi_{0.5}$ VLA 模型（包含 SigLIP 视觉编码器、Gemma 语言模型和动作专家），以及 LoRA（低秩适配）技术。

**2. 技术拆解**
- **核心方法**: PRISM 框架包含三个核心组件：
  1. **原语库（Primitive Bank）**：为每个原子技能训练独立的动作专家LoRA。在复合任务训练时，冻结这些原语参数，并为每个原语附加一个可训练的低秩残差（Residual），以学习技能组合时的过渡动态。
  2. **前缀条件路由器（Prefix-conditioned Router）**：在每个动作块（action chunk）级别，读取VLM的前缀特征（融合了视觉和指令的上下文表示），输出一个混合权重分布，决定当前时刻调用哪些原语+残差分支。
  3. **确定性动作标签器（Deterministic action-derived labeler）**：利用夹爪开合等运动学事件生成每个动作块的技能伪标签，用来监督路由器的训练。
- **关键细节**: 
  - **输入输出**：输入为视觉图像和语言指令，输出为包含10个动作的动作块（每次执行前5个）。
  - **模型结构**：视觉编码器全量微调，语言模型使用共享LoRA（rank=16），动作专家注入技能专属LoRA（原语，rank=32）和残差（rank=10）。
  - **路由机制**：在激活空间（activation space）混合原语和残差的注意力贡献及完整的FFN输出，避免在参数空间混合LoRA因子带来的交叉项干扰。
- **训练/优化目标**: 
  - **Phase 1（原子训练）**：使用单热路由（one-hot routing）训练原语，优化目标是流匹配（Flow Matching）的动作预测损失。
  - **Phase 2（复合训练）**：冻结原语，训练残差、路由器和共享模块。优化目标为流匹配损失加上路由器分类交叉熵损失（权重0.05），在技能转换边界附近掩码交叉熵，允许策略在过渡期学习软混合。

**3. 实验结果**
- **实验设置**: 
  - **仿真数据集**：RoboCasa365（包含28个原子任务、3个技能族；4个长程复合任务）。
  - **真机环境**：AgileX PIPER 6-DoF 机械臂（2个原子任务，1个复合任务）。
  - **对比对象（Baseline）**：基于 $\pi_{0.5}$ 的 zero-shot、仅原子LoRA、两阶段顺序微调LoRA、以及带经验回放（replay）的两阶段LoRA。
- **评价指标**: 原子任务宏观平均成功率（Atomic SR）和复合任务宏观平均成功率（Composite SR）。
- **主要结果**: 
  - **仿真表现**：PRISM 原子成功率达 56.43%，复合成功率达 20.00%。相比之下，标准两阶段微调 $\pi_{0.5}$-LoRA 原子成功率暴跌至 17.86%（遗忘严重），复合为 17.50%；带 replay 的 baseline 原子 49.82%，复合仅 10.25%。PRISM 在保留原子技能的同时大幅提升了复合任务表现。
  - **真机表现**：PRISM 复合成功率达 55.0%，优于两阶段微调的 45.0%，且原子技能在复合训练后成功率不降反升（如 Doll->Plate 从 80% 升至 85%）。
  - **消融实验**：基于运动学的确定性标签器（20.00%）显著优于 VLM 标签器（11.25%）和 MLP 标签器（13.75%）；使用 VLM 前缀作为路由输入（20.00%）优于纯视觉（10.25%）或纯状态（7.50%）；在激活空间混合（20.00%）优于参数空间混合（15.50%）或动作空间混合（13.50%）。

### 8. 🔥 [Localizing and Editing the Goal Representation of a Vision-Language-Action Model] (定位与编辑视觉-语言-动作模型的目标表示)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.08895` | [点击跳转](https://arxiv.org/abs/2611.08895)

**0. 论文标题**
- **英文标题**: Localizing and Editing the Goal Representation of a Vision-Language-Action Model
- **中文标题**: 定位与编辑视觉-语言-动作模型的目标表示
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机制可解释性与机器人安全交叉领域的机制分析工作，通过因果追踪和激活编辑定位了 OpenVLA 中目标表示的层与 token 位置，发现模型会忽略否定指令并执行被禁任务，证明了在特定层干预或结合外部探针监控可有效提升机器人安全性。

**1. 整体逻辑**
- **研究任务**: [机制分析] 探究视觉-语言-动作模型（VLA）内部如何表示离散的执行目标，评估否定指令对目标执行的影响，尝试通过内部激活编辑来重定向目标，并评估目标读取（goal read-outs）作为安全监控器的效果。
- **研究动机**: VLA 在处理否定指令（如“不要做 X”）时存在目标错误泛化问题，依然会执行被禁止的任务。现有的失败检测器（failure detectors）只能预测任务是否失败，无法检测机器人是否在“成功”执行被禁止的任务，导致安全约束失效。
- **本质改动**: 将大语言模型中的机制可解释性方法（因果追踪、激活修补、表征引导）迁移到自回归 VLA 中，精确定位目标表示在模型层和 token 上的分布，并验证了通过编辑早期层或所有动作 token 可以改变 VLA 的执行目标。
- **技术溯源**: 基于 OpenVLA（底层为 Llama-2 架构），在 LIBERO-Goal 仿真环境上进行评估。结合了激活修补（activation patching）、线性探针（linear probes）、激活引导（activation steering）和共形预测（conformal prediction）等技术。

**2. 技术拆解**
- **核心方法**: 
  1. **目标读取与监控**：在 Llama-2 的残差流上训练线性探针（goal probe）预测当前执行目标。结合共形预测设定阈值，构建感知规范的监控器（计算允许集外与集内目标概率的对数差，并在时间窗口内去抖动）。
  2. **目标定位（因果追踪）**：通过激活修补替换不同指令下的残差流，计算归一化 logit 差和动作转移率，定位决定首个动作的指令 token 和决策 token 的临界层。
  3. **目标编辑**：使用固定向量引导（如类别均值、反事实均值）和预填充/解码流修补（prefill/decode-stream patching）干预内部表示，在闭环中重定向机器人目标。
- **关键细节**: 
  - **模型与数据**：OpenVLA-7B，在 LIBERO-Goal 的 10 个任务上测试（共享同一场景，仅靠指令区分目标）。
  - **探针结构**：目标探针是基于 256 个主成分投影后的 L2 正则化多项逻辑回归。
  - **定位发现**：12 层到 16 层间存在突变。12 层前主要由指令 token 决定动作，16 层后主要由决策 token（最后一个 prompt token）决定。
- **训练/优化目标**: 
  - **探针训练**：使用 L2 正则化的多项逻辑回归优化目标分类。
  - **监控器校准**：使用 split-conformal prediction 在保留的合规 rollouts 上校准阈值，控制假阳性率。
  - **编辑目标**：最大化动作维度向目标动作的转移率，在闭环中使机器人执行被重定向的任务。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：LIBERO-Goal 仿真环境，10 个任务。包含名义条件（plain tasks）、否定条件（5 种否定短语）和重定向条件（运行中改变指令）。
  - **对比对象（baseline）**：动作 token 熵、第 32 层成功探针、基于 DINOv2 和指令词袋的外部视觉+文本探针、特权对象和末端执行器位姿的线性探针、基于任务对和时间的先验（pair+time prior）。
- **评价指标**: 
  - 否定/重定向条件下的任务执行率（执行被禁任务比例、遵循重定向比例）。
  - 监控器指标：TPR（真阳性率）、FA（假阳性率）、AUROC（特别是 within-pair AUROC）。
  - 编辑效果：闭环中成功重定向的 rollout 比例，离线动作维度的转移率。
- **主要结果**: 
  - **否定指令无效**：在否定指令下，OpenVLA 在 79% 的 rollout 中依然执行了被禁任务（与 plain tasks 的 78% 无显著差异），目标探针在“not X”和“X”下的读取结果相似。
  - **目标定位**：12 层前指令 token 主导动作（ρ=0.94），16 层后决策 token 主导（ρ=0.77）。
  - **目标编辑**：在过渡期前（如第 8 层指令 token），固定引导向量可成功重定向 67%（12/18）的闭环 rollout；在 16 层后，只有解码流修补（修补每个解码的动作 token）能成功重定向 83%（15/18），仅修补决策 token 或中间层固定向量均无效（0/18）。
  - **监控效果**：对于否定指令，目标监控器不比简单的关键词规则好；但对于运行中重定向，第 32 层目标探针的 within-pair AUROC 达 0.88，显著优于成功探针（0.74）和熵（0.59），且与外部视觉+文本探针（0.87）性能相当，表明无需访问模型内部即可实现有效监控。

### 9. 🔥 [VICTR: Value-Informed In-Context Learning for Vision-Language-Action Models] (VICTR：基于价值信息的视觉-语言-动作模型上下文学习)
- **研究机构**: `NYU (New York University)`
- **Arxiv ID**: `2611.08698` | [点击跳转](https://arxiv.org/abs/2611.08698)

**0. 论文标题**
- **英文标题**: VICTR: Value-Informed In-Context Learning for Vision-Language-Action Models
- **中文标题**: VICTR：基于价值信息的视觉-语言-动作模型上下文学习
- **研究机构**: NYU (New York University)
- **一句话总结**: 提出用“任务相对进度”代替“视觉相似度”来检索上下文片段，通过参考完整演示视频估计当前状态进度，精准检索出对应执行阶段的演示来指导动作生成，大幅提升了VLA模型在未见任务（OOD）上的泛化成功率。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在未见任务上的零样本/少样本泛化能力，具体为基于检索的上下文学习（Retrieval-based ICL）在机器人操作任务中的应用。
- **研究动机**: 现有的检索式ICL方法（如RICL）依赖视觉相似度（如DINOv2特征）来检索演示片段。但视觉上相似的画面可能处于任务执行的不同阶段（例如起点和终点可能看起来很像），导致检索到的上下文对当前动作产生误导；此外，视觉相似度容易受环境中无关干扰物（如背景变化）的影响。
- **本质改动**: 引入“任务相对进度（task-relative progress）”作为核心检索信号。设计了一个上下文价值函数估计器（IC-VFE），利用参考演示视频来评估当前状态处于任务的哪个阶段，从而检索出执行阶段对齐的演示片段，而不是仅仅长得像的片段。
- **技术溯源**: 基于 $\pi_{0.5}$ (VLA策略基座), Gemma 3 (IC-VFE的视觉语言架构), DINOv2 (视觉特征提取), RECAP (进度/价值估计的灵感来源), Robo-Dopamine (用于生成离线进度伪标签), RICL (检索式ICL的对比基线)。

**2. 技术拆解**
- **核心方法**: 提出 VICTR 框架，包含两个核心模块：1) **IC-VFE**：输入当前观测、语言指令和参考演示视频，输出当前状态的任务进度估计值（0到1之间）；2) **进度对齐检索**：根据估计的进度值，从演示池中检索出进度最接近的演示片段（chunk），并将其作为上下文输入给 IC-VLA 策略生成动作。
- **关键细节**: 
  - **IC-VFE架构**：基于Gemma 3 4B的冻结视觉编码器和270M解码器。参考视频帧经过空间池化和patch-merging压缩为摘要token，当前观测保留细节token。采用混合注意力机制（Hybrid Attention），在特定层允许上下文块之间的因果注意力以聚合时间信息。输出201个离散bin的概率分布，映射为连续的进度值。
  - **检索机制**：演示池中的每个chunk以进度值和DINOv2特征为key。推理时计算当前观测与池中所有chunk的进度距离，检索距离最小的单个chunk（也可融合视觉距离，但实验证明纯进度效果更好）。
  - **IC-VLA输入**：将检索到的chunk（包含三视角视觉token、本体感觉token和FAST token化的动作序列）拼接到当前查询（当前观测+指令）之前，采用块因果注意力（block-causal attention）让查询块attend到演示块。
- **训练/优化目标**: 
  - **IC-VFE训练**：使用 Robo-Dopamine 生成的离线进度伪标签作为监督信号，最小化预测进度分布与真实进度bin之间的分类交叉熵损失（Categorical cross-entropy）。
  - **IC-VLA训练**：在 $\pi_{0.5}$ 基础上微调，使用 flow-matching loss 预测连续动作块。训练时检索上下文使用的是 oracle（真实）进度值，推理时使用 IC-VFE 的估计值。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自采真实机器人数据集（YOR双臂机器人），包含28个任务（8个in-domain，8个out-of-domain，涵盖新物体、技能组合、语义相似等分布偏移）。补充实验在 LIBERO-100 上进行。
  - **对比对象（Baseline）**：微调的 $\pi_{0.5}$ (无ICL), RICL-$\pi_{0.5}$ (基于DINOv2视觉相似度检索，去除了不稳定的动作插值层)。
- **评价指标**: 
  - 控制任务：Binary success rate (二元成功率), Task progress rate (任务进度率，基于人工定义的里程碑计算部分完成度)。
  - VFE评估：与人工标注进度曲线的 Kendall $\tau_b$ 和 Pearson $r$ 相关性。
- **主要结果**: 
  - **真实机器人OOD任务**：微调 $\pi_{0.5}$ 成功率仅 6.2%，进度率 28.9%；RICL（视觉检索）提升至 15.0% 和 42.1%；VICTR（进度检索）大幅提升至 23.8% 和 55.5%。进度率的大幅提升表明阶段对齐的上下文能引导策略走得更远。
  - **LIBERO-100 (OOD)**：VICTR (Top-1) 达到 45.87% 成功率，显著优于 $\pi_{0.5}$ baseline (37.8%) 和 RICL (41.2%)。
  - **VFE质量**：IC-VFE 与人工标注的 Kendall $\tau_b$ (0.52) 和 Pearson $r$ (0.65) 均显著优于 RECAP 和 Robometer。消融实验证明，引入参考上下文对提升估计准确度至关重要，且更好的进度估计直接转化为更高的控制任务进度率。

### 10. 🔥 [Meituan-Robotics-0: A Vision-Language-Action Foundation Model for Desktop Manipulation] (Meituan-Robotics-0：用于桌面操作的视觉-语言-动作基础模型)
- **研究机构**: `Meituan（美团）`
- **Arxiv ID**: `2611.08577` | [点击跳转](https://arxiv.org/abs/2611.08577)

**0. 论文标题**
- **英文标题**: Meituan-Robotics-0: A Vision-Language-Action Foundation Model for Desktop Manipulation
- **中文标题**: Meituan-Robotics-0：用于桌面操作的视觉-语言-动作基础模型
- **研究机构**: Meituan（美团）
- **一句话总结**: 提出一个面向桌面操作的VLA基础模型与具身Agent系统，通过大规模异构数据对齐、三阶段训练（含创新的Rollback纠错数据收集与CFG-DAgger后训练）及事件驱动的记忆机制，实现了跨实体迁移、错误恢复与长视野任务执行。

**1. 整体逻辑**
- **研究任务**: 通用桌面操作。要求具身系统能从异构数据获取行为先验、跨机器人实体迁移、从闭环执行错误中恢复，并在长视野中保持任务状态。
- **研究动机**: 现有VLA模型直接部署面临三大瓶颈：1) 异构数据集的动作空间和实体格式不一致，难以提供连贯监督；2) 仅在成功演示上训练的策略缺乏从自身闭环错误中恢复的能力；3) 仅依赖当前观察的纯反应式策略无法在观察窗外保留长视野任务信息。
- **本质改动**: 构建了一套完整的系统级解决方案：在数据端进行跨实体动作规范化，在算法端采用“离散预训练-连续中训练-真实世界后训练”三阶段范式并引入Rollback机制收集纠错数据，在系统端解耦底层高频运动控制与高层事件驱动Agent。
- **技术溯源**: 基于 Qwen3.5-4B（视觉语言骨干）、FAST（动作离散化）、MMDiT（连续动作头）、Flow Matching（流匹配）、DAgger/HG-DAgger、RECAP、StarVLA 等。

**2. 技术拆解**
- **核心方法**: 
  1. **数据对齐**：对1.5万小时机器人轨迹进行清洗，并将不同实体的动作统一规范化到以肩为中心的末端执行器坐标系（10维单臂/20维双臂）。
  2. **三阶段训练**：先用FAST将动作离散化进行多模态自回归预训练；再替换为MMDiT头，用流匹配进行连续动作中训练；最后在真实世界进行SFT和纠错后训练。
  3. **Rollback与CFG-DAgger**：提出Rollback数据收集机制，让人类操作员回退到历史锚点提供纠正，同时保留被替换的错误策略片段。利用这些正负片段直接训练条件策略（CFG-DAgger），免去价值网络学习。
  4. **事件驱动Agent**：将系统分为Monitor（视觉监控）、Memory Manager（事件记忆）和Planner（事件触发规划），底层VLA保持高频反应式控制，高层仅在任务状态改变时介入。
- **关键细节**: 
  - **数据规模**：1.47亿VLM样本 + 15060小时机器人轨迹（涵盖12种实体）。
  - **模型结构**：共享VLM骨干，预训练用离散Token头，中训练及以后用MMDiT连续动作头。
  - **异步执行**：采用异步动作块合并（Asynchronous action-chunk merging），在推理延迟下平滑融合新旧动作块，保证控制连续性。
- **训练/优化目标**: 
  - **预训练**：离散动作的交叉熵损失 + VLM的VQA交叉熵损失。
  - **中训练及后训练**：基于JiT参数化的流匹配（Flow Matching）均方误差损失（使用Masked MSE以适配不同实体的动作维度）。

**3. 实验结果**
- **实验设置**: 
  - **仿真**：RoboTwin 2.0（50个双臂桌面任务），RoboDojo（42个任务）。
  - **真机**：Letter-block placement（字母块放置）, Garment folding（衣服折叠）, Ethernet insertion（网线插入）。对比 Baseline 为 $\pi_{0.5}$。
- **评价指标**: 成功率（Success Rate, SR），进度得分（Progress Score, PS），RoboDojo的 Score。
- **主要结果**: 
  - **RoboTwin 2.0**：MR0 取得 93.6% 的平均成功率，在对比模型中排名第一。
  - **RoboDojo**：在仅使用约1.36万小时数据的情况下，平均成功率 14.63%，排名第五，展现出较好的数据利用效率。
  - **真机对比 $\pi_{0.5}$**：在匹配 HG-DAgger 后训练下，MR0 在三个任务上的平均成功率和进度得分均高于 $\pi_{0.5}$，在网线插入任务上提升尤为显著。
  - **Rollback/CFG-DAgger 效果**：在网线插入任务中，使用 Rollback 数据训练的 CFG-DAgger 达到 70% 成功率和 0.90 进度得分，显著优于 RECAP（60% SR, 0.67 PS），且无需进行价值学习和优势标签计算。
  - **Agent 定性评估**：成功展示了跨任务事件检索（找回被移走的物品）和条件恢复（等待物品放回后继续原任务）的能力。

### 11. 🔥 [Computer-Use Agents Are Embodied Generalists] (计算机使用智能体是具身通用智能体)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.09847` | [点击跳转](https://arxiv.org/abs/2611.09847)

**0. 论文标题**
- **英文标题**: Computer-Use Agents Are Embodied Generalists
- **中文标题**: 计算机使用智能体是具身通用智能体
- **研究机构**: 原文未提及
- **一句话总结**: 本文提出把具身任务转化为与数字软件界面的交互，通过为不同具身任务构建专属GUI软件，使单一的计算机使用智能体（CUA）无需针对具身任务微调即可在多个ECCV竞赛中取得顶尖成绩，并论证了具身AI未来将收敛于单一通用大模型。

**1. 整体逻辑**
- **研究任务**: 将多种具身AI任务（视觉语言导航、对话导航、3D分割、视频分割）转化为计算机使用智能体（CUA）与数字软件界面的交互任务。
- **研究动机**: 当前具身AI（如VLA模型）通常需要为连续动作设计专门的动作头或依赖特定API，而CUA在操作数字软件时已具备视觉定位、精确点击和环境探索能力。作者认为两者面临相似的底层挑战，CUA在软件交互中习得的技能可直接迁移至物理环境。
- **本质改动**: 不改变智能体模型本身，而是将物理环境封装为数字软件（渲染截图并提供键鼠控制），让通用的CUA通过操作这些软件界面来完成具身任务，实现智能体模型与具体具身任务的解耦。
- **技术溯源**: 基于计算机使用智能体（CUA）范式，底层直接调用现成的多模态大模型 Gemini 3.5 Flash 和 Gemini 3.6 Flash。

**2. 技术拆解**
- **核心方法**: 构建任务特定的软件应用（GUI），将物理环境的观察渲染为屏幕截图，并将物理动作映射为键盘和鼠标操作。CUA接收任务指令和截图，输出键鼠动作；软件执行动作后返回新截图，形成交互循环。底层感知（如点云分割、视频分割）由软件内部集成的专用模型（如SAM3、PinPoint3D）完成，CUA仅负责高层决策与交互。
- **关键细节**: 
  - **智能体设置**：使用 Gemini 3.5/3.6 Flash，固定系统提示和键鼠动作空间。支持单步或批量（最多16个）输入。上下文保留交互文本，截图超过20张时通过滑动窗口移除最旧的10张。
  - **软件设计（4个竞赛任务）**：
    1. **VLNVerse（3D导航）**：3D场景查看器，支持平移、旋转和视角调整，通过键盘或屏幕按钮控制相机位姿。
    2. **DialNav（对话导航）**：显示360度全景和出口编号，智能体通过打字与内置的Guide模型对话，并点击出口移动。
    3. **OpenSUN3D（3D分割）**：渲染Faro点云，提供自由相机和点选控制。内部集成PinPoint3D和微调的VOLT模型生成掩码，智能体通过输入正负点提示进行交互和筛选。
    4. **MeViSv2（视频分割）**：视频播放器，支持帧选择。内部使用SAM3进行分割和掩码传播，智能体通过点击和提示进行交互，审查并导出最终掩码。
- **训练/优化目标**: 本文为系统构建与观点验证，无新增训练目标或损失函数。核心机制是利用现成CUA的上下文学习（In-context learning）能力，在构建的GUI环境中进行零样本推理。

**3. 实验结果**
- **实验设置**: 
  - **数据集/竞赛**：ECCV 2026 的四个研讨会竞赛官方测试集：VLNVerse、DialNav、OpenSUN3D、MeViSv2-Text。
  - **对比对象**：各竞赛官方测试集上的其他最佳参赛队伍（Best other entry）。此外在验证集上对比了GUI交互与文本API交互的性能。
- **评价指标**: 
  - VLNVerse: Avg SR@3（平均成功率）, NDTW（归一化动态时间规整）。
  - DialNav: Endpoint success rate（终点成功率）, SPL（路径长度加权成功率）。
  - OpenSUN3D: AP50, AP25（平均精度）。
  - MeViSv2-Text: Final score（最终得分）, J&F（区域和边界平均精度）。
- **主要结果**: 
  - **竞赛成绩**：使用单一CUA且无针对竞赛的特定调优，获得 OpenSUN3D 第1名（AP50 25.88 vs 21.45，AP25 36.52 vs 26.50），MeViSv2-Text 第2名（Final 86.72 vs 90.81），DialNav 第3名（Endpoint success 65.26，Best other 原文未提及），VLNVerse 第6名（Avg SR@3 87.30 vs 90.70）。
  - **GUI vs API**：在验证集上，GUI交互与文本API交互的性能差距在4个点以内，且在4个任务中有2个GUI得分更高，证明GUI交互效率不亚于直接调用API。
  - **通用模型潜力验证**：在机器人仿真（Gym-Anything for Robotics）中，使用9B参数的普通VLM（Qwen3.5）不加动作头，仅将动作写成文本，在1000个未见实例上的成功率（56%）接近专门的机器人模型 $\pi_{0.5}$（59%），且单动作推理耗时仅约400ms。

### 12. 🔥 [Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents] (Flex-RSI：前沿智能体递归自我改进的基准测试)
- **研究机构**: `Texas A&M University`
- **Arxiv ID**: `2611.08946` | [点击跳转](https://arxiv.org/abs/2611.08946)

**0. 论文标题**
- **英文标题**: Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents
- **中文标题**: Flex-RSI：前沿智能体递归自我改进的基准测试
- **研究机构**: Texas A&M University
- **一句话总结**: 提出了Flex-RSI基准，评估大模型智能体在固定算力预算下，能否通过任务反馈不仅优化解答，还能递归修改自身运行环境（harness）以实现系统级的自我提升。

**1. 整体逻辑**
- **研究任务**: 构建一个基准测试，评估前沿大模型智能体在视觉和机器人任务上的递归自我改进（Recursive Self-Improvement, RSI）能力。
- **研究动机**: 现有基准通常固定智能体的运行环境（harness，包括提示词、工具、控制流等），只评估其最终生成的答案，或仅针对大规模模型训练。在实际部署中，智能体能否利用任务反馈来改进其“工作方式”（harness）而不仅仅是改进“答案”，缺乏有效的评估手段。
- **本质改动**: 设计了一个包含“执行者”和“改进者”交替工作的递归循环，允许智能体在固定预算内修改自身的提示词、工具和工作流，并在验证集上评估改进效果，将评估重点从“单次求解”转移到“系统级自我迭代”。
- **技术溯源**: 基于现有的前沿闭源和开源大语言模型（如 Claude Opus 5.5, GPT-6.1 Sol, Gemini 4 Argon, Qwen3.8 等），以及多个现有的视觉、机器人和推理数据集（如 RoboDojo, RoboCasa, ARC-AGI 等）。

**2. 技术拆解**
- **核心方法**: 将智能体的 harness 解耦为两个组件：执行者（Executor）负责修改任务解答并在开发集上实验；改进者（Improver）负责分析执行轨迹、诊断失败，并修改执行者的提示词/工具/工作流以及自身的指令。
- **关键细节**: 数据严格划分为开发集（dev）、验证集（val）和测试集（test）。Executor 在 dev 上修改解答，只有当候选解答在 val 上的得分超过当前解答加上噪声边际（$\delta$）时才被保留。Improver 根据所有历史轮次的轨迹更新 harness。所有运行从相同的通用 harness 和初始解答开始，受限于固定预算（限制 wall-clock time、GPU hours、token 使用量、验证评估次数和轮数），最终在隐藏的 test 集上评分。基准包含 24 个任务，涵盖感知、推理、机器人动作、3D 重建、视觉创作和基础设施 6 个领域。
- **训练/优化目标**: 非参数更新的学习任务。核心机制是基于验证集得分的接受/拒绝策略（确保改进在未见数据上有效）和基于历史轨迹的 harness 迭代更新。优化目标是在固定预算内，最大化最终解答在隐藏测试集上的得分。

**3. 实验结果**
- **实验设置**: 使用 24 个任务（如 RoboDojo, RoboCasa, ARC-AGI-1/2/3, 3D Tracking 等），对比了 18 个前沿大模型（11 个闭源模型如 Claude Opus 5.5、GPT-6.1 Sol 等，7 个开源模型如 Qwen3.8-Flash-Next、Qwen3.8-27B 等）。测试环境为固定预算限制，且所有模型从相同的初始 harness 启动。
- **评价指标**: 各任务的主指标（如 Success rate, Accuracy, T-mIoU 等，统一归一化到 0-100 分），以及模型在所有任务上的平均排名（Average rank）。同时对比了初始解答的验证集得分与运行期间达到的最佳验证集得分，以衡量自我改进的绝对幅度。
- **主要结果**: 
  1. 闭源模型整体表现显著优于开源模型（Claude Opus 5.5 综合得分最高达 91.6）。
  2. 自我改进在“智能体需要自己构建解决方案（如写代码、策略）”的任务中提升最大，而在“只需给出单一答案”的任务中提升较小。
  3. 反馈粒度影响显著：当评估器给出连续分数时，开源模型也能改进；当只记录成功/失败时，开源模型几乎无法改进，而闭源模型仍能提升。
  4. 在涉及物理稳定性或绝对正确性严格检查的任务中，开源模型落后闭源模型最多（即使输出表面看起来合理）。
  5. 配对实验证明，让 Improver 编辑 harness 本身对得分提升有实质性贡献（7 组配对中有 6 组测试得分提高，最高提升 40 分）。

### 13. 🔥 [Open-HumanWAM: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models] (Open-HumanWAM：用于扩展具身基础模型人类与机器人经验的开源配方)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.06817` | [点击跳转](https://arxiv.org/abs/2611.06817)

**0. 论文标题**
- **英文标题**: Open-HumanWAM: An Open Recipe for Scaling Human and Robot Experience for Embodied Foundation Models
- **中文标题**: Open-HumanWAM：用于扩展具身基础模型人类与机器人经验的开源配方
- **研究机构**: 原文未提及
- **一句话总结**: 本文开源了5万小时的第一人称人类视频预训练数据集及完整训练配方，验证了人类数据规模与机器人下游任务成功率的对数线性缩放规律，并提出了结合人类与机器人混合数据预训练的视觉目标条件世界-动作模型，在仿真和真机任务上达到SOTA。

**1. 整体逻辑**
- **研究任务**: 具身智能中的视觉-动作模型预训练与缩放规律研究。具体任务是利用大规模第一人称（egocentric）人类视频进行预训练，以提升下游机器人操作策略的泛化能力和样本效率。
- **研究动机**: 机器人基础模型需要多样化的操作经验，但通过遥操作收集机器人数据成本高昂。第一人称人类视频是极具扩展性（scalable）的数据源，但现有工作对如何有效对齐异构数据、数据规模与多样性对下游性能的具体影响，以及混合人类-机器人数据缩放对零样本和微调性能的作用，缺乏系统性的研究和开源配方。
- **本质改动**: 构建了统一的末端执行器（EEF）动作空间来对齐异构的人类和机器人数据，系统性地探究了纯人类数据以及“人类+机器人”混合数据在统一世界-动作模型（WAM）框架下的缩放规律，并引入视觉目标条件（visual-goal conditioning）以实现零样本部署和具身上下文学习。
- **技术溯源**: 基于世界-动作模型（World-Action Models, WAM）框架，使用了 Cosmos3-Nano-16B 作为预训练骨干网络（包含冻结的 Qwen3-VL 作为 Reasoner），以及 Wan VAE 进行视觉编码。

**2. 技术拆解**
- **核心方法**: 
  1. **数据构建与动作对齐**：从多个公开数据集中筛选并构建5万小时的 Open-HumanWAM-50K 语料库。通过统一相机坐标系、手腕坐标系和夹爪开合度，将异构人类动作映射到统一的16维双臂EEF空间。对于混合训练，进一步扩展为49维混合动作空间（包含关节、底盘和EEF）。
  2. **纯人类预训练（HumanWAM-Vanilla）**：使用逆动力学（IDM）注意力机制和绝对相机坐标系动作，在5万小时人类数据上预训练世界-动作模型。
  3. **混合数据与目标条件预训练（HumanWAM-Goal）**：结合人类与机器人数据进行联合预训练，引入视觉目标图像（goal image）作为条件，采用单阶段联合整流流（joint rectified-flow）采样同步去噪未来视频和动作，实现零样本部署。
- **关键细节**: 
  - **数据规模**：50,000小时人类视频（Open-HumanWAM-50K），约14,600小时机器人数据。
  - **动作表示**：纯人类预训练使用16维绝对相机坐标系EEF动作（3D位置、四元数方向、夹爪开合度）；混合预训练使用49维混合动作（23维关节+3维底盘+16维EEF+7维头部），采用基于当前观测的相对位移和度量夹爪孔径，以消除具身偏差。
  - **模型结构**：基于 Cosmos3-Nano-16B 骨干，共享视频-动作生成器（Generator），视频和动作token通过联合自注意力交互。动作chunk长度在纯人类预训练中为32步，混合预训练中为48步。
  - **训练超参**：纯人类预训练 batch size 8,192，100k steps；混合预训练 batch size 1,024，500k steps。
- **训练/优化目标**: 
  - 视频预测与动作去噪的联合损失。在 HumanWAM-Vanilla 中，训练时使用真实未来视频latent作为条件进行动作去噪（IDM attention）；在 HumanWAM-Goal 中，使用单阶段联合整流流（joint rectified-flow）同步预测未来视频和动作。动作损失使用维度级 z-score 标准化，并对无效维度（如人类数据中的关节和底盘）进行掩码（mask）处理。

**3. 实验结果**
- **实验设置**: 
  - **仿真基准**：RoboTwin 2.0（50个双臂桌面操作任务，包含Clean和Random设置），RoboDojo（42个任务）。
  - **真机实验**：Cobot Magic 双臂机器人（4个任务，评估分布内和视觉分布外泛化），以及20个真实世界零样本任务（10个简单，10个困难）。
  - **对比对象（Baselines）**：VLA 模型（如 $\pi_{0.5}$, X-VLA, Qwen-RobotManip-Context 等）和 WAM 模型（如 GO-3 Nano Preview, PICA-WAM, OpenWAM-$\alpha$ 等）。
- **评价指标**: 
  - **仿真**：任务成功率（Success rate），RoboDojo 额外使用进度得分（Progress score）。
  - **真机**：任务成功率，零样本任务覆盖率（Task coverage，成功率>=2%的任务数），以及基于里程碑的得分。
- **主要结果**: 
  - **缩放规律**：发现预训练数据小时数与下游机器人分布外（OOD）成功率之间存在经验对数线性缩放规律，且扩大任务和场景的多样性（而不仅仅是增加时长）能带来更陡的缩放曲线。
  - **HumanWAM-Vanilla（纯人类预训练）**：在 RoboTwin 2.0 上达到 92.08% (Clean) 和 68.88% (Random)。真机实验中，视觉分布外（改变桌布和光照）成功率从 2.5% 大幅提升至 67.5%。
  - **HumanWAM-Goal（混合预训练+视觉目标）**：零样本设置下，在 RoboTwin 2.0 达到 13.94% 平均成功率（远超其他基线的0%~4.7%）。后训练（Post-training）后，在 RoboTwin 2.0 达到 92.70% (Clean) 和 84.60% (Random)，平均 88.65%，刷新 SOTA。在真机20个零样本任务中，混合数据缩放将平均零样本成功率从 20.0% 提升至 30.5%，并展现出无需参数更新的具身上下文学习能力（通过改变视觉目标图像动态调整操作行为）。

### 14. 🔥 [Library of Hands: Fix the Hands, Not the World Model] (动作映射库：修正控制接口而非世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12678` | [点击跳转](https://arxiv.org/abs/2611.12678)

**0. 论文标题**
- **英文标题**: Library of Hands: Fix the Hands, Not the World Model
- **中文标题**: 动作映射库：修正控制接口而非世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种无需训练的方法（LoH），在保持世界模型冻结的情况下，通过反向推导和贝叶斯记忆库自动识别并补偿相机或控制器变化带来的动作映射偏差，使机器人规划成功率翻倍。

**1. 整体逻辑**
- **研究任务**: 解决基于冻结世界模型的机器人规划任务中，因相机移动或控制器改变导致动作映射（论文中称为“手”/Hand，即命令到实际物理动作的转换接口）发生变化，从而使规划失败的问题。
- **研究动机**: 潜在世界模型隐式假设动作遵循训练数据的约定。当相机视角改变或控制器增益/延迟变化时，同一命令会产生不同的物理动作（例如命令旋转90度，会导致冻结规划器的成功率从77.5%暴跌至7.8%）。现有修复方法（如测试时训练、上下文识别）需要重新训练、依赖训练数据，且在设置恢复时会遗忘之前的状态。
- **本质改动**: 不修改世界模型权重，而是将世界模型本身作为“传感器”，通过反向推导识别当前的动作映射（“手”），并将其存入记忆库，以便在物理设置重复时直接召回，而不是重新学习。
- **技术溯源**: 基于潜在世界模型（如 LeWM, DINO-WM, JEPA-WM, V-JEPA 2-AC）和交叉熵方法（CEM）规划器。

**2. 技术拆解**
- **核心方法**: Library of Hands (LoH) 框架，包含四个核心步骤：
  1. **Sense（感知）**：通过冻结模型反向求解最能解释连续图像变化的动作，并利用雅可比矩阵评估每次读取的可靠性。
  2. **Explain（解释）**：使用贝叶斯模型比较，在恒等、旋转缩放、镜像、线性、仿射等映射类及不同延迟中，选择证据最匹配的映射。
  3. **Remember（记忆）**：将识别出的映射存入无固定大小的库中，利用粘性先验优先召回历史映射。
  4. **Act（执行）**：在 CEM 规划器采样命令后，通过当前选定的映射进行转换，再输入给冻结的世界模型。
- **关键细节**: 输入为相机图像（及部分模型的关节状态），输出为动作块（包含5个控制步）。为处理物理执行器的饱和与裁剪问题，方法限制了映射矩阵的最大奇异值为1，并通过不动点迭代重新拟合。
- **训练/优化目标**: 无需训练。优化目标为最大化读取动作的精确贝叶斯证据（Exact Bayesian evidence），通过拉普拉斯近似计算协方差来权衡每次读取的可靠性，无需调节复杂度惩罚超参。

**3. 实验结果**
- **实验设置**: 
  - **数据集与任务**：三个模拟任务（PushT, Reacher, Two-Room），以及 RoboCasa 模拟厨房任务。
  - **世界模型**：LeWM，以及在真实机器人数据（DROID）上预训练的 DINO-WM, JEPA-WM, V-JEPA 2-AC。
  - **对比对象（Baseline）**：冻结规划器、ShiftWM-style、无记忆/单记忆方法、Fixed Share、MBCD-style、测试时训练（JEPA-TTT, AdaJEPA）、每集校准、以及增加搜索预算的冻结规划器。
- **评价指标**: 任务成功率（Success rate），具体分为所有剧集、动作映射返回后的前两集（after returns）、以及映射不变的情况（no change）。
- **主要结果**: 
  - 在三个模拟任务中，LoH 将冻结规划器的整体成功率从 28.6% 提升至 62.3%（翻倍以上）；在映射返回后的成功率提升了 33.9 个百分点。
  - 在映射不变的情况下，LoH 的成功率仅下降 0.6 个百分点，几乎无副作用。
  - 在 RoboCasa 中，对 DINO-WM 和 V-JEPA 2-AC 同样有效（例如 DINO-WM 在映射返回后的成功率从 7.8% 提升至 26.6%）。
  - 实验验证了增益大小与“传感器”质量（即冻结模型读取动作的 $R^2$）高度正相关，且 LoH 显著优于测试时训练和校准等 baseline，同时计算开销更低（因为减少了重新规划次数）。

### 15. 🔥 [VLA Adaptation with Real and Simulated Data: A Case Study on Robotic Chess] (结合真实与仿真数据的VLA模型微调：以机器人下棋为例)
- **研究机构**: `Charles University, VSB – Technical University of Ostrava`
- **Arxiv ID**: `2611.12676` | [点击跳转](https://arxiv.org/abs/2611.12676)

**0. 论文标题**
- **英文标题**: VLA Adaptation with Real and Simulated Data: A Case Study on Robotic Chess
- **中文标题**: 结合真实与仿真数据的VLA模型微调：以机器人下棋为例
- **研究机构**: Charles University, VSB – Technical University of Ostrava
- **一句话总结**: 本文通过机器人下棋任务，系统实证了VLA模型微调时的数据/算力Scaling规律、Checkpoint选择机制及Sim-to-Real迁移效果，并验证了多种基于自身轨迹的进阶微调方法在该设定下均无效。

**1. 整体逻辑**
- **研究任务**: [领域：具身智能/机器人学习；类型：实证分析与系统工程] 评估和优化视觉-语言-动作（VLA）模型在特定下游机器人操作任务（根据指令在棋盘上移动棋子）上的微调策略与数据需求。
- **研究动机**: VLA模型微调面临实际工程痛点：需要采集多少真实数据、训练多少步、如何挑选最佳Checkpoint、仿真数据能否降低成本。此外，真实机器人的闭环成功率评估成本极高，导致研究者常依赖不可靠的离线指标（如验证集Loss）。
- **本质改动**: 并非提出新模型架构，而是构建高保真仿真环境与标准化任务，对VLA微调的Scaling Law、Checkpoint稳定机制、仿真预训练收益以及多种进阶模仿学习/RL方法进行了详尽的闭环实证研究。
- **技术溯源**: 基于 $\pi_{0.5}$ (VLA基座模型), MuJoCo (物理仿真器), PaliGemma (视觉语言模型底座)。

**2. 技术拆解**
- **核心方法**: 
  1. 构建MuJoCo仿真环境，设计带随机扰动的脚本专家（Scripted Expert）生成仿真数据以模拟人类操作差异。
  2. 在仿真和真实环境中对 $\pi_{0.5}$ 进行行为克隆（BC）微调，系统扫描数据量（100至10k）和训练步数。
  3. 引入学习率冷却（Learning-rate cool-down）或随机权重平均（SWA）机制来稳定并挑选Checkpoint。
  4. 尝试多种基于策略自身Rollout的进阶训练方法（Filtered BC, RECAP优势条件生成, 自动教练纠正, 残差RL）。
- **关键细节**: 
  - **任务设定**: 低成本机械臂（SO-101）根据文本指令（如"e4 to a5"）移动国王。输入为双相机图像、关节状态、指令和当前阶段；输出为50个关节目标（15Hz）和阶段预测。
  - **模型规模**: 微调 $\pi_{0.5}$ 的动作专家和语言模型（共2.7B参数），冻结视觉编码器。
  - **数据规模**: 仿真集约11.4k条轨迹（成功率93%）；真实集259条遥操作轨迹。
- **训练/优化目标**: 
  - 基础方法采用行为克隆（Behavior Cloning）损失。
  - 进阶方法中，RECAP使用价值函数计算优势（Advantage）进行条件生成；残差RL使用PPO训练小网络输出关节偏移量。

**3. 实验结果**
- **实验设置**: 
  - **数据集**: 仿真环境生成的100至10k条轨迹；真实环境采集的32至256条遥操作轨迹。
  - **对比对象（Baseline）**: 仿真中对比不同数据量/步数的BC模型及未使用Cool-down的模型；真实环境中对比“未经仿真预训练的 $\pi_{0.5}$ 基础模型”与“经仿真预训练的模型”。
  - **测试环境**: MuJoCo仿真环境（每个模型跑1,000次闭环测试）；真实SO-101机械臂（每个模型跑25次测试）。
- **评价指标**: 闭环任务成功率（Success rate），以及细分的里程碑达成率（如触碰、抓取、抬起、放置）。
- **主要结果**: 
  1. **Scaling与训练策略**: 仿真中成功率随数据量和训练步数增加。学习率Cool-down对Checkpoint选择至关重要（未Cool-down的模型成功率比Cool-down低最多31个点）；验证集Loss和开环动作误差不可靠，不能用于选模型。
  2. **Sim-to-Real迁移**: 在真实数据稀缺时，仿真预训练帮助巨大。例如使用128条真实数据时，仿真预训练模型成功率达72%（18/25），而直接从基础模型微调的成功率仅8%（2/25）。
  3. **负面结果**: 在该设定下，Filtered BC、RECAP风格的优势条件生成、自动教练纠正、残差强化学习（PPO）等基于自身轨迹的进阶方法，均未能带来超越纯行为克隆的实质性提升。

### 16. 🔥 [Bridging Task Planning and Execution for Language-Conditioned Bimanual Manipulation] (桥接语言条件双臂操作的任务规划与执行)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12409` | [点击跳转](https://arxiv.org/abs/2611.12409)

**0. 论文标题**
- **英文标题**: Bridging Task Planning and Execution for Language-Conditioned Bimanual Manipulation
- **中文标题**: 桥接语言条件双臂操作的任务规划与执行
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种零样本视觉语言框架，通过把物理遮挡和机械臂可达性等约束显式融入场景表示，并结合分层验证机制，解决了双臂人形机器人在杂乱环境中的任务规划与失败恢复问题。

**1. 整体逻辑**
- **研究任务**: 让双臂人形机器人根据自然语言指令，在杂乱的桌面环境中完成目标抓取、障碍物清理等操作任务。
- **研究动机**: 现有的大模型驱动机器人方法要么只做高层语义推理，要么端到端学习底层动作，缺乏对“物理交互选择（如物体侧面遮挡、机械臂可达性）”的显式建模。这导致规划出的动作在物理上不可行，且执行失败时无法定位具体原因，只能盲目进行全局重规划，效率极低。
- **本质改动**: 把物理约束（侧面可接近性、运动学可达性）显式融入场景表示和任务规划中，并为每个执行阶段设定明确的前/后置条件，从而实现从“盲目试错”到“基于物理反馈的局部/全局分层恢复”。
- **技术溯源**: 基于视觉语言模型（VLM，如 Gemini Robotics-ER 1.6）、FoundationPose（用于6D位姿估计），以及作者前期的相关工作。

**2. 技术拆解**
- **核心方法**: 系统包含四个核心模块：1) 结构化场景表示（融合语义与几何物理约束）；2) 执行感知规划（VLM生成带物理参数的动作序列）；3) 并行执行调度（将兼容动作打包为双臂并行阶段）；4) 分层验证与恢复（基于条件评估的局部/全局恢复策略）。
- **关键细节**: 
  - **场景表示**：物体用带方向的边界框表示。结合 VLM 的语义关系和 FoundationPose 的位姿，计算物体六个面的“可接近性”（是否有足够空间让夹爪进入）和“可达性”（逆运动学是否可行）。
  - **动作表示**：每个动作包含操作原语（抓/放/推/释放）、目标、使用手臂（左/右/双）、是否用爪子、接触面。如果目标被挡，规划器会显式生成移开障碍物的动作。
  - **调度与条件**：将顺序动作分组为无冲突的并行阶段，每个阶段定义局部目标和符号化的前/后置条件。
  - **验证状态**：VLM 对条件评估输出三种状态：satisfied（满足）、uncertain（不确定）、violated（违反）。
- **训练/优化目标**: 这是一个零样本（Zero-shot）框架，无需任务特定训练或微调。核心机制是基于 VLM 的提示词工程与符号化条件评估，通过分层策略（Repeat/Modify/Replan）最小化执行失败带来的代价。

**3. 实验结果**
- **实验设置**: 
  - **硬件**：CENTAURO 混合轮腿人形机器人（双臂，Dagana 夹爪，RealSense D435 相机）。
  - **场景**：9个桌面操作场景（涵盖执行感知规划、场景动态变化、执行失败恢复），每个场景跑20次。
  - **Baseline**：1) 无执行感知+二值验证（Non-execution-aware & Binary validation）；2) 有执行感知+二值验证（Execution-aware & Binary validation）。
- **评价指标**: 任务成功率 (SR)，每次成功执行的平均 VLM 查询次数 (Queries)，以及各模块的准确率和延迟。
- **主要结果**: 
  - **执行感知规划优势**：在侧面遮挡场景（如 Boxes Aside, Fragile Box），无物理约束的 baseline 成功率为 0%，而本文方法通过识别并移开障碍物，成功率提升至 85% 和 70%。
  - **分层验证优势**：相比二值验证（失败就全局重规划，每次耗费3次查询），分层验证能根据失败原因选择局部恢复（如 Repeat 或 Modify）。在 Bottle Failure 等场景中，每次恢复决策平均只需 1.1 到 2.1 次查询，显著降低了 VLM 调用开销（如 Bottle Failure 的平均总查询次数从 10 次降至 8.1 次）。
  - **并行调度优势**：在 Bottles on Box 场景中，并行调度将纯机器人运动时间减少了 40%，执行阶段从 5 个减到 3 个。
  - **骨干网络敏感性**：Gemini Robotics-ER 1.6 和 GPT-o3 成功率相近（73.3% vs 80.0%），但 o3 延迟高出一倍多；GPT-5.2 成功率仅 5.0%，在长程规划中容易生成逻辑错误或参数不一致的动作序列。

### 17. 🔥 [Embodied First Exam] (具身首次考试)
- **研究机构**: `UC Berkeley`
- **Arxiv ID**: `2611.12177` | [点击跳转](https://arxiv.org/abs/2611.12177)

**0. 论文标题**
- **英文标题**: Embodied First Exam
- **中文标题**: 具身首次考试
- **研究机构**: UC Berkeley
- **一句话总结**: 提出了一个统一的评估框架，让代码智能体在三种不同物理约束设置下自主选择控制方式，全面测试其在1156个机器人任务上的能力边界。

**1. 整体逻辑**
- **研究任务**: 评估通用代码智能体（coding agents）在物理世界约束下控制多样化机器人的能力边界。
- **研究动机**: 现有的机器人基准测试主要面向视觉运动策略学习（visuomotor policy learning）构建，缺乏对代码智能体在真实物理约束（如部分观测、不可重置、实时性）下可靠控制机器人的系统评估。
- **本质改动**: 把评估对象从传统的端到端视觉运动策略模型换成了通用代码智能体，设计了三种递进的物理约束评估设置，并允许智能体自主选择控制范式（直接控制、写代码控制、训练策略）。
- **技术溯源**: 基于 Harbor 评估框架（Terminal-Bench 的底层框架）进行容器化隔离；任务集融合了 26 个现有机器人基准和 9 个全新构建的 suite；测试了 GPT-6 Astra、Claude Opus 5.5、Gemini 4 Argon 等主流代码智能体及其对应的 harness（如 Codex、Claude Code）。

**2. 技术拆解**
- **核心方法**: 构建了一个基于容器化的统一评估框架，将智能体工作区与模拟器/验证器严格隔离。设计了三种评估设置：Privileged（特权，可获取完整状态并无限制重置）、Standard（标准，仅传感器观测，默认不可重置，模拟器暂停等待推理）、Realtime（实时，同标准但模拟器实时运行不等待）。智能体可自主选择直接输出动作、编写控制程序或训练策略。
- **关键细节**: 
  - **规模**：包含 1156 个任务，分布在 35 个 suite 中，涉及 47 种机器人（9 种形态）。核心评估集筛选了 456 个困难任务。
  - **资源约束**：严格限制时间、token 预算、重置次数、步数以及 CPU/GPU/内存等计算资源。
  - **失败分析机制**：将任务分解为多个阶段（stages），通过外部验证器记录进度，并用另一个代码智能体对失败尝试进行阶段级错误打标。
- **训练/优化目标**: 本文是评估框架/系统工程类工作，无模型训练目标。核心机制是基于容器隔离的评估协议、多约束条件控制以及基于任务图（Task graph）的阶段级失败归因分析。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：自建的 9 个新 suite（涵盖空间谜题、灵巧操作、多机器人交互、sim-to-sim 工程等）和改编的 26 个现有 suite。核心集为 456 个困难任务。
  - **对比对象**：8 个代码智能体（如 GPT-6 Astra in Codex, Claude Opus 5.5, Gemini 4 Argon, Kimi 3.1 Pro 等）。
- **评价指标**: 任务成功率（Success rate），不同设置下的性能衰减，失败阶段集中度（Failure stage concentration）。
- **主要结果**: 
  - **物理约束影响巨大**：最强智能体 GPT-6 Astra 在 Privileged 设置下成功率达 77%，但在 Standard 设置下骤降至 33.6%（456 个核心任务）/ 30%（391 个双设置核心任务）。Realtime 设置更难，63% 的任务无智能体能解。
  - **性能衰减归因**：从 Privileged 到 Standard 的性能下降，主要因为缺乏“重置”和“精确状态”。其中“重置”对 GPT-6 Astra 的帮助大于“精确状态”；在需要高精度的阶段，重置有效，但仅靠精确状态无效。
  - **失败模式**：失败高度集中在任务的同一阶段（通常是第一阶段）。涉及改变材料或移动机器人身体的阶段失败率最高（分别达 66% 和 45%）。弱智能体更容易在发生物理接触前就失败。
  - **智能体与 Harness 差异**：三大强智能体（GPT-6 Astra, Claude Opus 5.5, Gemini 4 Argon）解决的测试集有差异，互补性强。更换 Harness（如把 GPT-6 Astra 从 Codex 换到 Claude Code）会导致成功率波动高达 12 个百分点。
  - **控制策略偏好**：Standard 下智能体多选择直接控制（61%），Privileged 和 Realtime 下多选择写代码控制（82% 和 97%）。在足球任务中，若提供 GPU，智能体会选择训练强化学习策略，且只有训练策略能赢。

### 18. 🔥 [GeoMind: A Benchmark for Spatial Understanding in Robotic Manipulation] (GeoMind：面向机器人操作空间理解的基准测试)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12175` | [点击跳转](https://arxiv.org/abs/2611.12175)

**0. 论文标题**
- **英文标题**: GeoMind: A Benchmark for Spatial Understanding in Robotic Manipulation
- **中文标题**: GeoMind：面向机器人操作空间理解的基准测试
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一个专门评估具身智能体空间推理与空间记忆能力的基准测试GeoMind，通过解耦空间约束和动态场景变化，揭示了现有主流VLA和模块化模型在复杂空间任务中的严重短板。

**1. 整体逻辑**
- **研究任务**: 构建一个系统性的基准测试（Benchmark），用于细粒度评估具身智能体在桌面操作任务中的空间理解能力。
- **研究动机**: 现有的具身基准测试往往依赖强烈的视觉线索，导致模型可以绕过空间推理直接“抄近道”；且多关注静态场景，无法评估智能体在场景动态变化时的空间记忆能力。此外，单纯的整体任务成功率无法区分失败是源于空间目标定位错误还是底层执行误差。
- **本质改动**: 将空间理解严格解耦为“空间推理”（Spatial Reasoning）和“空间记忆”（Spatial Memory）两个认知维度，设计了6个任务族，并开发了一套自动化的空间结构建模与验证Pipeline，生成具有确定性真值目标的基准任务，从而精准诊断模型的空间能力瓶颈。
- **技术溯源**: 仿真环境基于 Isaac Sim / IsaacLab，硬件为 Franka Research 3 (FR3) 机械臂。评估对象涵盖了主流通用VLA（OpenVLA, $\pi_0$, $\pi_{0.5}$）、空间增强VLA（SpatialVLA, InternVLA-M1, Spatial-Forcing）以及基于视觉语言模型的模块化智能体（COPA, MOKA，底层调用 GPT-4o, Gemini-2.5-Flash, Claude-Sonnet-4.6）。

**2. 技术拆解**
- **核心方法**: 
  1. **任务分类体系**：将任务划分为空间推理（目标识别、关系接地、约束组合、几何推理）和空间记忆（场景更新、身份追踪）6个任务族。
  2. **空间结构建模**：不依赖固定坐标，而是定义空间结构（如线性、网格、锚点关系、几何目标），通过结构保持采样（Structure-preserving sampling）生成多样但语义等价的场景。
  3. **自动化构建Pipeline**：利用LLM生成任务模板，将空间约束转化为可执行的接地代码（Grounding code）以计算确定性真值目标，并在仿真中进行闭环验证，剔除物理不可行或目标不一致的episode。
- **关键细节**: 
  - 包含54个评估任务变体，分为GeoMind-Base（20个基础变体，包含大量视觉相似物体以消除外观捷径）和GeoMind-Aug（34个增强变体，引入语义、视觉和执行扰动）。
  - 智能体输入为语言指令、两个224x224的RGB图像（桌面和腕部视角）及本体感觉，不暴露任何特权仿真信息（如物体位姿、掩码等）。
  - 物理仿真频率480Hz，策略控制频率24Hz。
- **训练/优化目标**: 本文非学习类工作，无模型训练与优化目标。核心机制为基于LLM辅助的任务模板生成、空间规则代码化解析以获取确定性真值目标，以及基于物理仿真的闭环验证过滤机制。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：GeoMind-Base 和 GeoMind-Aug。
  - **对比对象（Baseline）**：通用策略（OpenVLA, $\pi_0$, $\pi_{0.5}$），空间增强策略（SpatialVLA, InternVLA-M1, Spatial-Forcing），模块化智能体（COPA和MOKA搭配GPT-4o/Gemini-2.5-Flash/Claude-Sonnet-4.6），以及使用仿真器真值目标的Oracle baseline。
- **评价指标**: 
  - **任务成功率（Task Success Rate, SR）**：核心指标，衡量满足任务成功条件的episode比例。
  - **鲁棒性（$\Delta_{Aug}$）**：增强任务与对应基础任务的成功率差值。
  - **辅助诊断指标**：空间目标误差（SGE，最终状态与目标的距离）和目标追踪误差（TTE，末端执行器与目标的平均轨迹距离）。
- **主要结果**: 
  - **整体表现惨淡**：现有智能体在结构化空间任务上远未可靠。表现最好的学习策略 InternVLA-M1 平均成功率仅为 26.4%，远低于 Oracle 的 99.3%。模块化智能体成功率仅在 4.0%~16.9% 之间。
  - **鲁棒性极差**：语义增强导致平均成功率从 22.6% 骤降至 14.2%，说明现有模型的成功多依赖简单的指令匹配，而非真正的空间-语言理解。
  - **空间记忆与推理存在严重瓶颈**：在空间记忆方面，身份追踪（Identity Tracking）失败率高达 85.00%；在空间推理方面，关系接地（Relational Grounding）失败率高达 98.33%。这表明智能体不仅难以在场景变化后追踪物体身份，也难以将显式的空间关系约束转化为可执行的操作动作。

- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.11981` | [点击跳转](https://arxiv.org/abs/2611.11981)

**0. 论文标题**
- **英文标题**: Thermo-VLA: A Thermal-Aware Vision-Language-Action Model with Gated Residual Modulation for Robotic Manipulation
- **中文标题**: Thermo-VLA：一种用于机器人操作的具有门控残差调制的热感知视觉-语言-动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于具身智能领域的“方法创新与系统工程”工作，提出了Thermo-VLA模型，通过门控残差机制将热成像的冷/热属性特征自适应注入RGB表征中，解决了VLA模型在双臂机器人操作中缺乏温度感知与推理能力的问题，并构建了相应的真机基准。

**1. 整体逻辑**
- **研究任务**: 语言指令驱动的双臂机器人连续动作生成，特别是需要感知和推理温度等不可见物理属性的操作任务。
- **研究动机**: 现有VLA模型主要依赖RGB，无法感知温度；现有引入热成像的方法多将其作为普通视觉输入（如转伪彩色）直接拼接，缺乏对温度属性的关系推理能力，且简单拼接会干扰原有的RGB视觉表征，导致操作不稳定。
- **本质改动**: 摒弃直接拼接多模态特征的做法，将热图分解为冷/热属性，利用文本指令作为门控条件，通过残差连接将温度特征自适应地注入到RGB token中，实现属性增强而不破坏原有视觉表征。
- **技术溯源**: 基于 $\pi_{0.5}$ 模型（作为baseline和动作生成基座），视觉编码器采用 SigLIP，多模态骨干网络采用 Gemma，动作生成采用 Flow-matching。

**2. 技术拆解**
- **核心方法**: 提出 ThermoRes Encoder，包含双分支属性分解（Dual-Branch Attribute Decomposition）和门控残差注入（Gated Residual Injection）两个核心模块。
- **关键细节**: 
  - **输入输出**：输入为RGB图像、热图、语言指令和机器人状态；输出为连续动作块（Action chunk，维度16）。
  - **属性分解**：对热图进行背景校准后，根据与背景的偏差分解为强调低温的“冷属性”和强调高温的“热属性”两个分支视图，共享SigLIP编码器提取特征。
  - **门控注入**：以文本token为Query，冷/热token为Key/Value进行交叉注意力计算；将池化后的文本特征与注意力输出拼接，通过轻量级Gate MLP预测冷/热分支的动态权重；最后将加权后的冷热token以残差形式加到RGB的head token上。
  - **动作生成**：增强后的多模态token前缀输入Gemma骨干，结合Flow-matching机制生成连续动作。
- **训练/优化目标**: 基于专家演示的模仿学习，采用 Flow-matching 的损失函数（预测从噪声到真实动作的速度场）。

**3. 实验结果**
- **实验设置**: 在 Unitree G1 双臂机器人平台上构建了包含6个任务（4个热依赖，2个纯RGB）的真实世界数据集（共1307条专家演示）。对比基线包括纯RGB的 ACT 和 $\pi_{0.5}$，以及直接拼接热图的 $\pi_{0.5}$(RGBT) 和 ThermoAct。
- **评价指标**: 任务成功率（Success rate）。
- **主要结果**: 
  - 在4个热依赖任务上，Thermo-VLA平均成功率达0.86，比直接拼接热图的 $\pi_{0.5}$(RGBT) 高出18个百分点。
  - 在涉及相对温度推理和排除推理的复杂任务中优势显著，如Task VI（异常动物笼移除）成功率达1.00，而对比方法仅0.5左右。
  - 泛化性：在未见物体、属性重分配、光照变化和场景变化下，平均成功率保持在0.78，优于所有对比方法。
  - 扩展验证：将相同的残差机制迁移到RGB颜色属性（RGBRes Encoder），在仿真和真机的颜色条件任务中平均成功率从0.572提升至0.775，证明了该残差调制机制的通用性。

### 20. 🔥 [Flip Anything with Agentic Robotics Self-Learning] (基于智能体机器人自学习的任意物体翻转)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.11941` | [点击跳转](https://arxiv.org/abs/2611.11941)

**0. 论文标题**
- **英文标题**: Flip Anything with Agentic Robotics Self-Learning
- **中文标题**: 基于智能体机器人自学习的任意物体翻转
- **研究机构**: 原文未提及
- **一句话总结**: 提出一个让大模型作为编码智能体在物理仿真中通过“生成代码-仿真评估-分析失败-修改代码”的闭环迭代，自动生成图结构控制代码（Graph-as-Policy）的框架，使双臂机器人无需示教数据即可掌握多种物体翻转策略并零样本迁移至真实世界。

**1. 整体逻辑**
- **研究任务**: 解决双臂机器人利用夹爪在平面上翻转（180度）各种不同几何形状物体的操作任务。
- **研究动机**: 翻转不同几何形状的物体需要截然不同的操作策略（如双手交接、推倒、指尖推动等），传统的视觉运动策略或VLA模型难以用单一策略覆盖如此多样的动作模式和协调挑战，且通常需要大量示教数据。
- **本质改动**: 摒弃传统的基于梯度或示教数据的策略训练，改用大模型作为编码智能体（Coding Agent），在物理仿真中通过迭代试错，直接生成和优化可执行的图结构控制代码（Graph-as-Policy）。
- **技术溯源**: 基于 RoboSimStudio（仿真平台）、Newton/MuJoCo（物理求解器）、CoACD（凸分解）、GaP (Graph-as-Policy) harness（图策略框架）以及 Claude Fable 5.1（编码大模型）。

**2. 技术拆解**
- **核心方法**: 基于大模型的仿真自学习闭环（Agentic Self-Learning）。智能体根据任务描述、物体CAD和机械臂URDF生成初始控制图，在仿真中运行后，分析执行轨迹和失败模式（如抓取不可行、接触丢失、交接失败等），进而修改代码中的感知、抓取选择、运动原语、策略路由和恢复逻辑，不断迭代。
- **关键细节**: 
  - 输入：任务自然语言描述、24个物体的CAD模型、YAM双臂URDF。
  - 输出：基于图结构（Graph-as-Policy）的可执行代码，包含高层策略选择和底层反应控制。
  - 感知：使用RGB-D相机和机器人本体感受（不直接读取物体mesh）。
  - 规模：24个物体，每个物体15个评估episode，共360个episode/迭代。共迭代出36个版本的代码。
- **训练/优化目标**: 非传统梯度优化。优化目标是最大化仿真中的翻转成功率。智能体通过分析失败案例（failure census）和物理诊断来启发式地修改代码逻辑和参数。

**3. 实验结果**
- **实验设置**: 
  - 数据集/环境：RoboSimStudio物理仿真环境，24个不同几何形状的物体（如锤子、万用表、锁紧螺母等）。
  - 对比对象/Baseline：初始的仅包含双手交接（handover-only）策略的控制器。
  - 真实世界测试：3个仿真中未见过的物体（夹具、蓝胶带、折叠螺旋螺丝刀）。
- **评价指标**: 翻转任务的成功率（Success rate），即在360个episode中成功将物体翻转180度的比例。
- **主要结果**: 
  - 仿真中，初始交接策略成功率仅为24.7%（89/360）；加入推倒和推动策略后提升至80.6%（290/360）；经过多轮迭代优化抓取、几何推理和恢复逻辑后，最终最佳控制器成功率达到95.0%（342/360）。
  - 策略泛化：代码能根据物体几何自动路由到不同策略（如长柄物体用空中交接，紧凑物体用边缘推倒，宽物体用指尖推动，薄物体用 guarded-contact 抓取）。
  - 零样本迁移：在3个未见物体的真实世界测试中，夹具成功2/3，蓝胶带成功3/3，折叠螺丝刀成功1/3，证明了代码的泛化能力。

**1. 整体逻辑**
- **研究任务**: 提升机器人世界模型的空间泛化能力，使其在不同空间配置下仍能准确预测物理后果并规划动作。
- **研究动机**: 不同的坐标系可以描述相同的物理交互，但相似的动作在局部物理条件改变时会产生不同结果。现有研究对“动作表示中的空间描述差异如何影响模型预测”理解不足，导致模型在空间配置改变时泛化受限。
- **本质改动**: 不单纯追求最小化坐标变化，而是通过对比不同坐标系下的动作表示，揭示并强调必须保留决定物理后果的“动作-状态”内在物理关系。
- **技术溯源**: 原文未提及（仅提及宽泛的机器人世界模型概念，未指明具体基座或前人模型）

**2. 技术拆解**
- **核心方法**: 在受控的机器人剥离（peeling）任务中，设计并评估了三种匹配的动作表示（分别定义在世界坐标系、物体坐标系和表面坐标系中），并通过全局位姿和接触重定位实验来分析其泛化机制。
- **关键细节**: 
  - 输入/变量：剥离厚度（peel thickness）、接触几何、局部观察精度、坐标系定义。
  - 实验操作：改变全局位姿、重定位接触点、移除剥离厚度信息、对表面和工具进行联合中心化（Joint centering）。
  - 机制发现：缺失剥离厚度会导致不可约的预测歧义；表面坐标系高度依赖局部观察的准确性；联合中心化可消除对共同原点平移的敏感性。
- **训练/优化目标**: 原文未提及（摘要侧重于实验评估与机制分析，未说明具体的损失函数或训练细节）

**3. 实验结果**
- **实验设置**: 使用受控的机器人剥离（peeling）基准测试。对比了世界坐标系、物体坐标系和表面坐标系三种动作表示设置。
- **评价指标**: 物理后果预测的准确性、反事实动作选择的效果、对坐标系不确定性的鲁棒性，以及不同失败机制的表现。
- **主要结果**: 
  1. 在训练数据有限时，等效的物理交互如果采用不同的空间描述，会带来明显的性能代价。
  2. 移除剥离厚度信息会导致不可约的歧义（相同输入对应不同材料去除结果）。
  3. 表面坐标系在局部观察准确时能改善预测和动作选择，但模型仍对坐标系的不确定性很敏感。
  4. 表面与工具的联合中心化能消除对原点平移的敏感性；而错误的接触几何和实际执行偏差会引发不同的失败机制。
  5. 核心结论验证：有效的空间泛化取决于保留决定物理后果的动作与状态关系，而非单纯最小化坐标变化。

### 22. 🔥 [FlowEval: How Much Adaptation Does an Embodied Foundation Model Need at Deployment?] (FlowEval：具身基础模型在部署时需要多少适配数据？)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.11650` | [点击跳转](https://arxiv.org/abs/2611.11650)

**0. 论文标题**
- **英文标题**: FlowEval: How Much Adaptation Does an Embodied Foundation Model Need at Deployment?
- **中文标题**: FlowEval：具身基础模型在部署时需要多少适配数据？
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种免训练的评估指标 FlowEval，通过计算流匹配模型在纯噪声初始化下对少量目标演示的预测分歧，来诊断具身基础模型在部署前还需要多少微调数据。

**1. 整体逻辑**
- **研究任务**: 评估具身基础模型在特定下游部署环境中的适配难度，即预测模型需要收集多少目标域演示数据（demonstrations）进行微调才能达到期望性能。
- **研究动机**: 大规模预训练提升了模型的泛化能力，但无法保证其在所有下游部署中开箱即用。从业者面临的核心痛点是：零样本性能差并不能说明是需要少量数据还是海量数据；而盲目微调多个候选模型或收集大量数据的成本极高。需要在微调前，用极低成本探明“模型与目标部署的匹配度”以及“还需要多少适配数据”。
- **本质改动**: 现有的验证集 loss 在具身模型中往往不能反映真实成功率。本文改用流匹配（flow-matching）目标的特性，在免训练（training-free）状态下，通过计算模型对少量成功演示的预测速度场与参考速度场的分歧，来量化适配难度。
- **技术溯源**: 基于采用流匹配（flow-matching）作为动作预测目标的具身基础模型（如 Pi-0.5, MolmoAct2, GR00T, DreamZero）。

**2. 技术拆解**
- **核心方法**: 提出 FlowEval 指标。在评估时，把动作和未来目标轨迹的起点设为纯高斯噪声（而不是传统验证里用 ground-truth 插值加噪），然后计算模型预测的速度（velocity）与固定参考速度之间的误差。
- **关键细节**: 
  - **输入输出**：输入为视觉、语言、状态、时间等特征及纯噪声初始化的动作；输出为预测的速度场。
  - **计算效率**：实验证明，只需计算扩散过程的第一步（step 1）即可达到超过 90% 的最大区分度，无需跑完整个去噪过程，计算成本大幅降低。
  - **动作空间映射**：支持预训练模型与目标部署使用不同动作表示空间（如关节位置 vs 关节速度）时的语义映射评估。
- **训练/优化目标**: 本文为免训练评估方法，无新增训练目标。核心计算基于流匹配推导出的两个指标：速度误差（Velocity Error，预测速度与参考速度的 L2 距离）和余弦相似度（Cosine Similarity，两者方向的夹角余弦）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：DROID, RoboCasa365, LIBERO, RoboSet, MolmoAct2-Bimanual-YAM，以及自采的 Franka 和 OpenArm 数据集。
  - **对比模型**：Pi-0.5, GR00T (N1.5/N1.6), MolmoAct2, DreamZero。
  - **实验设计**：1) 区分 seen（预训练包含）和 unseen（预训练外）部署；2) 在 RoboCasa365 的 17 个任务上，使用 50/150/500 条演示对 Pi-0.5 和 GR00T 进行微调，观察性能随数据量的扩展。
- **评价指标**: 
  - **分布区分度**：使用单侧双样本 Kolmogorov-Smirnov (KS) 检验评估 seen 和 unseen 部署分布的分离显著性。
  - **适配效果预测**：使用线性回归模型，评估 FlowEval 初始分数与微调成功率随数据量增加的变化率（交互项系数）之间的相关性。
- **主要结果**: 
  - FlowEval 能够显著区分 seen 和 unseen 的部署分布（KS 检验 p < 0.001）。
  - 在发生部署偏移（unseen 设置）时，FlowEval 的初始分数与微调性能随数据量增加的缩放行为（scaling behavior）显著相关，即能在微调前预测出增加数据能带来多少性能提升。
  - 在无部署偏移的控制实验中，该相关性不显著，证明信号确实来源于部署偏移带来的适配需求，而非单纯的任务难度或数据量堆叠。
  - 相比于计算整个扩散过程的 Action MSE，FlowEval 仅计算第一步，计算效率大幅提升，且预测下游微调效果的能力相当。

- **研究任务**: 人形机器人的移动操作（loco-manipulation），即在移动中保持动态平衡并协调全身关节完成操作任务。
- **研究动机**: 现有的视觉-语言-动作模型（VLA）和世界动作模型（WAM）擅长任务理解和视觉动态预测，但缺乏对高维全身运动结构规律（如关节协调、重心控制）的捕捉，难以直接生成时空协调的全身运动。
- **本质改动**: 不把视觉语义或视频动态作为动作生成的唯一先验，而是直接将预训练的“运动生成模型”作为策略的主干网络，把全身运动结构作为预训练的直接目标，再通过轻量级模块注入视觉和任务条件。
- **技术溯源**: 基于预训练的运动生成模型 Kimodo (Kimodo-G1)，结合 DINOv3（视觉特征提取）、ControlNet（视觉条件注入）和 LLM2Vec（语言指令编码）。

**2. 技术拆解**
- **核心方法**: 提出 Kimodo-Policy，采用“根-身体-手”（Root-Body-Hand）三阶段分层生成架构。冻结预训练的 Kimodo 运动生成主干，使用基于 ControlNet 的轻量级视觉适配器注入第一人称视觉特征，并通过运动历史约束实现闭环重规划。
- **关键细节**: 
  - **输入输出**：输入语言指令、第一人称RGB图像、运动历史（最多100帧）和当前手部状态；输出未来50帧的动作块（包含根轨迹、身体关节运动、双手控制信号），每次执行15帧后重规划（控制频率30Hz）。
  - **模型结构**：Root阶段预测全局平移和朝向；Body阶段在Root条件下预测关节运动；HandNet结合Body特征和视觉预测手部开合。使用 Dual-Path Fusion（交叉注意力+MLP）融合视觉特征。各阶段间使用 stop-gradient 阻断梯度，防止互相干扰。
  - **规模**：总参数 678M，可训练参数 92M（仅包含 ControlNet 分支和 HandNet）。
- **训练/优化目标**: 监督去噪损失。包含带掩码的均方误差（MSE，用于Root、Body和Hand的重建）以及手部状态转换的 L1 损失。通过特征掩码将已执行的历史动作作为硬约束，预测未来动作块。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：419小时机器人交互数据（HIW-500, UniFoLM-WBT的14个子集, Humanoid Everyday）用于策略预训练。
  - **对比对象（Baseline）**：ACT, DP, FM, $\pi_{0.5}$, HuGe, GR00T N1.7, GigaWorld-Policy, $\Psi_0$ 等。
  - **测试环境**：HumanoidArena（7个任务）、SIMPLE（8个任务）、真实世界（8个任务，基于 Unitree G1 机器人）。
- **评价指标**: 成功率（SR, Success Rate）和平均摔倒率（AFR, Average Fall Rate）。
- **主要结果**: 
  - **HumanoidArena**：多任务联合训练下，整体SR达 72.14%（超越 GR00T N1.7 的 69.70%），AFR 降至约 4.3%。在场景交互（HSI）任务上优势显著。
  - **SIMPLE**：8个任务平均SR为 75.83%，与最强基线 $\Psi_0$ (75.42%) 持平略高。
  - **真实世界**：经过策略预训练后，8个任务平均SR达 60%，显著超越 GR00T N1.6 (31%) 和 $\Psi_0$ (35%)。
  - **消融实验**：证实冻结预训练运动主干（HOI任务SR 51.67%）远优于随机初始化（18.33%）或微调主干（31.67%），证明运动先验对下游控制的有效性。

### 24. 🔥 [Review the Episodes, Refine the Lessons: Simple Memory Evolution for Embodied Agents] (回顾片段，提炼教训：具身智能体的简单记忆演化)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.11509` | [点击跳转](https://arxiv.org/abs/2611.11509)

**0. 论文标题**
- **英文标题**: Review the Episodes, Refine the Lessons: Simple Memory Evolution for Embodied Agents
- **中文标题**: 回顾片段，提炼教训：具身智能体的简单记忆演化
- **研究机构**: 原文未提及
- **一句话总结**: 提出 SimplEvo 框架，让前沿多模态大模型在“直接控制”机器人时，仅通过跨 episode 反思和更新纯文本记忆，无需微调或外部策略，即可在具身操作基准上达到 SOTA。

**1. 整体逻辑**
- **研究任务**: 具身智能中的通用机器人操作任务（如桌面抓取、双臂协同、移动操作等），具体为在仿真环境中通过多模态大模型直接输出末端执行器坐标来控制机器人。
- **研究动机**: 现有具身 Agent 要么依赖后训练策略（post-trained policies），要么依赖复杂的自我改进循环（harness engineering），且常在测试集上自适应导致数据泄露。目前尚不清楚前沿多模态大模型在仅保留自身执行经验的“直接控制”模式下，不依赖外部感知模块或策略微调，其能力上限究竟在哪里。
- **本质改动**: 摒弃复杂的视觉历史或外部策略，仅让大模型在训练阶段通过自我反思，将跨 episode 的执行经验提炼为有大小限制的纯文本“工作记忆”，并在测试阶段冻结该记忆以指导新场景的操作。
- **技术溯源**: 基于前沿多模态大语言模型（如 GPT-6-Astra），在 EBench 和 RoboDojo 仿真基准上进行评估，对比了各类后训练 VLA/WAM 模型（如 $\pi_{0.5}$, InternW0-$\Delta$, PICA-WAM 等）及其他基于大模型的 Agent 系统。

**2. 技术拆解**
- **核心方法**: 提出 SimplEvo 两阶段文本记忆机制：1) **任务记忆（Task Memory）**：在首次尝试前，大模型看一次训练 demo，提取无坐标的阶段顺序和完成状态；2) **工作记忆（Working Memory）**：在每个训练 episode 结束后，大模型反思当前轨迹和结果，在固定大小（32KB）预算内全量重写记忆，提炼关于操作流程、完成判定和错误恢复的经验教训。
- **关键细节**: 
  - **输入输出**：输入仅为 RGB 图像和机器人本体感觉（无深度、相机参数等特权信息），输出为末端执行器的绝对位姿和夹爪状态（1-6 个 waypoints 的 chunk）。
  - **系统架构**：大模型处于闭环控制中（Direct Control），不调用后训练策略，每步执行后直接观察结果并进行闭环调整。
  - **规模/超参**：工作记忆大小严格限制为 32KB；每个任务最多进行 15 个 episode 的在线适应（EBench 中连续 3 次成功则早停）。
- **训练/优化目标**: 非参数化学习。核心机制是基于大模型的文本反思（Reflection）。优化目标是让大模型在每次 episode 后，根据执行轨迹和最终奖励（成功/分数），提取可复用的文本经验来更新工作记忆，从而在后续 episode 中提高成功率。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：EBench（510 个测试场景，包含单布局和多布局任务）和 RoboDojo（42 个任务，每个任务 50 个测试布局）。
  - **对比对象（Baseline）**：EBench 和 RoboDojo 排行榜上的后训练策略（如 PICA-WAM, $\pi_{0.5}$, InternW0-$\Delta$ 等），以及无工作记忆的 GPT-6-Astra 直接控制和带策略的 harness 系统。
- **评价指标**: 成功率（SR, Success Rate）、阶段完成得分（Score）、每次成功的 Token 消耗量（Tokens per success）。
- **主要结果**: 
  - 在 EBench 上，SimplEvo 将 GPT-6-Astra 的 SR 从 46.7% 提升至 81.7%，超越所有后训练策略（最高 61.4%）和带策略 harness（最高 56.0%），且每次成功消耗的 Token 更少（2.76M vs 8.12M）。
  - 在 RoboDojo 上，以 69.63% SR 和 75.32 分登顶排行榜。
  - 纯文本记忆达到了与包含视觉帧记忆相似的 SR，但 Token 消耗更低、控制时间更短。
  - 冻结的工作记忆能泛化到未见过的布局和随机场景配置，且在未见场景上的表现不降反升。
  - 跨模型迁移：GPT-6-Astra 生成的工作记忆可直接被较弱模型（如 Gemini 3.8 Flash, DeepSeek-V4.1-Flash）读取使用，显著提升它们的 SR，无需任何模型微调。

### 25. 🔥 [BAT-WAM: Bridging Action and Touch in World-Action Models for Dexterous Hands] (BAT-WAM：在灵巧手世界-动作模型中桥接动作与触觉)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.10967` | [点击跳转](https://arxiv.org/abs/2611.10967)

**0. 论文标题**
- **英文标题**: BAT-WAM: Bridging Action and Touch in World-Action Models for Dexterous Hands
- **中文标题**: BAT-WAM：在灵巧手世界-动作模型中桥接动作与触觉
- **研究机构**: 原文未提及
- **一句话总结**: 提出BAT-WAM多模态表征框架，通过独立的离散码本和连续潜在桥接模块，让灵巧手的关节状态与全手触觉在视觉条件下互相补全与预测，显著提升了缺失模态下的重建精度和真实机器人操作成功率。

**1. 整体逻辑**
- **研究任务**: 解决灵巧手操作中，当关节状态（本体感觉）或全手触觉观测部分/完全缺失时，如何利用RGB视觉上下文进行可靠恢复，并为世界-动作模型（WAMs）提供高质量的多模态表征。
- **研究动机**: 现有方法（如OpenWAM将本体感觉线性投影为单token，或仅将触觉作为连续特征）未能充分利用关节状态与触觉之间的物理耦合关系；且RGB图像存在歧义（如相似外观下接触状态不同），无法单独可靠恢复缺失的关节和触觉信息。
- **本质改动**: 为触觉和关节状态分别设计独立的离散量化码本与解码器以保留物理意义，并引入一个RGB条件化的连续Transformer桥接模块，实现两种模态在视觉上下文下的双向条件重建与时序预测。
- **技术溯源**: 基于 $\pi_{0.5}$ WAM backbone，使用冻结的 SigLIP 提取视觉特征，依托 HT-Bench/HandTouch 触觉表征设定，对比基线为 OpenWAM-$\alpha$ 及 HandTouch。

**2. 技术拆解**
- **核心方法**: 
  1. 模态特定Tokenizer：触觉（196 tokens）和关节状态（8 tokens）使用独立的Encoder、投影层、码本和物理Decoder进行离散化与重建；RGB使用冻结的SigLIP提取连续特征。
  2. 跨模态桥接（Cross-Modal Bridging）：将掩码后的触觉特征、可见的关节特征、RGB特征及任务提示拼接，输入共享的Bridge Transformer进行跨模态交互。
  3. 多模态时序预测：利用历史触觉、历史关节状态和目标时刻的RGB，预测目标时刻的触觉。
- **关键细节**: 
  - 输入输出：输入为RGB图像、历史/当前关节状态、历史/当前触觉；输出为补全的触觉/关节状态特征，作为额外token输入 $\pi_{0.5}$ backbone。
  - 模型结构：Bridge Transformer特征维度为256维，包含模态和视图身份嵌入（identity embeddings）以区分来源。
  - 规模：触觉编码为196个空间网格token，关节编码为8个token。
- **训练/优化目标**: 
  - 静态目标：单模态重建损失 + 跨模态掩码预测损失 + 潜在对齐损失（桥接表征与完整目标对齐） + 码本匹配与承诺损失。
  - 时序目标：条件预测目标时刻的触觉压力图。

**3. 实验结果**
- **实验设置**: 
  - 离线评估：HT-Bench 基准（结合自我中心视觉与全手触觉数据）。对比基线：HandTouch, OpenWAM-$\alpha$, OpenWAM-$\alpha$ + HandTouch。
  - 在线评估：6-DoF AgileX PiPER 机械臂 + Linker Hand L6 灵巧手 + 全手触觉手套。7个桌面操作任务（抓取、堆叠、推拉、长程操作）。
- **评价指标**: RMSE（均方根误差，衡量重建/预测误差），cIoU（连续交并比，衡量触觉压力图重叠度）。
- **主要结果**: 
  - 离线全掩码重建：相比 image-conditioned HandTouch，RMSE 降低 34.73%。
  - 离线局部掩码重建：相比 HandTouch，RMSE 降低 38.84%（正文表格计算为38.87%）。
  - 离线未来触觉预测：相比 HandTouch，RMSE 降低 25.59%（摘要提及相比 OpenWAM with HandTouch 降低 85.56%）。
  - 真实机器人操作：平均成功率 79.3%，显著优于 OpenWAM-$\alpha$ (66.4%) 和 OpenWAM-$\alpha$ + HandTouch (69.3%)，在擦白板等精细任务上优势明显（45% vs 15%/25%）。
  - 零样本泛化：在未见颜色、尺寸、形状、布局、位姿下平均成功率 54.5%，优于基线的 38.5% 和 42.0%。

### 26. 🔥 [REINS: A Self-Evolving Agent Harness for Real-Time Trajectory Planning] (REINS：一种用于实时轨迹规划的自进化智能体运行框架)
- **研究机构**: `Aalborg University`
- **Arxiv ID**: `2611.10748` | [点击跳转](https://arxiv.org/abs/2611.10748)

**0. 论文标题**
- **英文标题**: REINS: A Self-Evolving Agent Harness for Real-Time Trajectory Planning
- **中文标题**: REINS：一种用于实时轨迹规划的自进化智能体运行框架
- **研究机构**: Aalborg University
- **一句话总结**: 提出REINS框架，通过将LLM输出落地到动力学模型、进行前向推演验证并固化为图索引规则，在自动驾驶轨迹规划中实现毫秒级推理与免微调的持续自进化。

**1. 整体逻辑**
- **研究任务**: 自动驾驶战术决策层（tactical decision layer）的实时轨迹规划。
- **研究动机**: 现有基于LLM的规划方法要么在决策环中直接调用LLM导致延迟超标（秒级推理无法满足毫秒级控制预算），要么离线提取规则导致规划器静态且无法适应新场景。现有的混合方法缺乏对LLM输出的显式验证和固化复用机制。
- **本质改动**: 将软件工程中的Agent Harness（智能体运行框架）范式引入实时轨迹规划，设计了Grounding（落地）、Verification（验证）、Consolidation（固化）三个核心耦合机制，形成闭环，无需更新LLM权重即可实现系统的自进化。
- **技术溯源**: 基于预训练大语言模型（GPT-4o），结合图数据库（Neo4j）、岭回归（Ridge Regression）和Transformer架构。

**2. 技术拆解**
- **核心方法**: 
  1. **Grounding（落地）**：离线学习世界动力学模型。利用LLM提供先验，结合岭回归学习变量间的依赖图（DAG），再用Transformer预测每个物理变量的时序演化。
  2. **Verification（验证）**：将LLM生成的动作编译为带有数据驱动校准阈值（如z-score、分位数）的谓词。通过动力学模型进行多步前向推演（rollout），仅当预测轨迹满足所有安全守卫时才放行。
  3. **Consolidation（固化）**：将验证通过的规则存入Neo4j图数据库，以触发变量为键建立索引。运行时通过参数化图查询在 $\mathcal{O}(\log n)$ 时间内检索相关规则。
- **关键细节**: 
  - **输入**：事实化变量（如TTC, THW, DHW、自车/前车速度等15个周围车辆状态）。
  - **输出**：5个离散战术元动作（向左/右变道、加速、减速、保持）。
  - **模型规模与超参**：动力学模型采用2层Transformer（4个注意力头）；规划推演步长 $H=5$；规则检索数 $k=10$；时间滞后窗口 $L=6$。
- **训练/优化目标**: 
  - **动力学模型**：均方误差（MSE），用于预测下一时刻各变量的值。
  - **动作打分**：基于Transformer的打分器输出规则相关性和动作偏好，通过noisy-OR机制聚合多规则推荐。
  - **轨迹验证目标函数 $J$**：综合惩罚碰撞风险（基于TTC）、奖励行驶进度、惩罚加加速度（jerk）以保证舒适性。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：4个highway-env仿真场景（Highway, Merge, Roundabout, Intersection）和2个真实世界无人机采集数据集（highD, rounD）。
  - **Baseline**：经典规划器（MPC, MCTS），运行时调用LLM方法（DriveSpeak），离线提取方法（LLaDA, DriReg, Plan-R1），以及符号/混合方法（PDDL, SymAgent）。
- **评价指标**: 规则合规率（Compl.）、风险感知效率（RE）、碰撞率（CR）、规划延迟（PE）。
- **主要结果**: 
  - **性能提升**：相比最强基线Plan-R1，合规率提升2.4%-3.6%，碰撞率大幅降低49%-56%，规划延迟降至1.9-4.6 ms，完全满足实时控制预算。
  - **自进化验证**：在Highway场景部署1000个episode，规则库从88条增长至145条，LLM调用率从70%单调下降至12.81%，且碰撞率进一步降低，验证了免微调下的持续进化能力。

### 27. 🔥 [ReSkill: Selective Self-Improvement for Robot Manipulation] (ReSkill：面向机器人操作的选择性自我改进)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.10510` | [点击跳转](https://arxiv.org/abs/2611.10510)

**0. 论文标题**
- **英文标题**: ReSkill: Selective Self-Improvement for Robot Manipulation
- **中文标题**: ReSkill：面向机器人操作的选择性自我改进

- **一句话总结**: 提出一个基于代码智能体的机器人选择性自我改进框架，通过构建任务图定位能力缺口并进行局部代码修改，在运行时完全脱离大模型的情况下实现高成功率的组合式操作。

**1. 整体逻辑**
- **研究任务**: 领域为机器人操作（Robot Manipulation），类型为方法创新/系统工程。主要解决组合式机器人操作任务（compositional manipulation tasks）的策略构建与自我改进问题。
- **研究动机**: 现有方法（如端到端策略或Agent技能组合）通常将新任务视为统一的学习或适应问题，导致机器人重复学习已有能力，增加数据和计算成本；且缺乏对“能力缺口”具体发生位置的显式建模。
- **本质改动**: 将自我改进从“全局重学”转变为“选择性局部修补”。通过构建任务图定位失败节点，仅在任务级（修改流程）和技能级（修改底层代码）进行针对性修改，并通过严格评估保留有效代码，部署时冻结策略。
- **技术溯源**: 基于大语言模型代码智能体（Claude Opus 5.5）、SAM 3（视觉分割模型），以及 RoboDojo、MuJoCo、Isaac Sim 等仿真平台。

**2. 技术拆解**
- **核心方法**: 1) 构建以对象为中心的任务图（包含技能调用、对象角色、交接条件等）；2) 双尺度改进：任务级修改阶段组织、交接条件和恢复路线，技能级增强感知、运动、操作和验证四类底层技能；3) 多阶段评估与配对比较机制，决定代码修改是否被保留。
- **关键细节**: 输入为自然语言指令和可选的单次演示；运行时仅依赖RGB-D图像和关节状态，使用冻结的 SAM 3 进行分割，其余依赖几何计算和规则，无外部大模型调用；开发阶段使用 Claude Opus 5.5 作为编排智能体。
- **训练/优化目标**: 非传统梯度训练。核心机制是基于节点级执行失败证据（状态、原因、视觉轨迹）驱动代码迭代；优化目标为最大化全任务成功率（结合原生部分完成得分）。

**3. 实验结果**
- **实验设置**: 10个 RoboDojo 仿真任务（Isaac Sim 环境，双臂 ARX X5 机器人）和 8个真实世界任务（在 MuJoCo 重建后部署于 Xtrainer 真实机器人）；对比 Baseline 为 Agent-as-Policy (Astra) 和 $\pi_{0.5}$。
- **评价指标**: 全任务成功率（Full-task success rate）、运行时 API 调用成本、代码修改局部性（修改函数占比）、跨任务技能复用率。
- **主要结果**: 在 RoboDojo 上，初始成功率 30.0% 提升至最终保留程序的 83.6%（Baseline Astra 为 36.0%，$\pi_{0.5}$ 为 9.6%），且运行时 0 次 API 调用；在 8 个真实任务中，重建仿真成功率 90.0%（72/80），真实机器人成功率 77.5%（62/80）；中位数代码修改仅涉及 3 个函数（约 0.5% 代码量），后期任务中 39% 的函数直接复用已有实现。

### 28. 🔥 [Spatial Representation Distillation and Knowledge Routing for Vision-Language-Action Models] (面向视觉-语言-动作模型的空间表示蒸馏与知识路由)
- **研究机构**: `SeoulTech (首尔科技大) 等韩国研究机构`
- **Arxiv ID**: `2611.10443` | [点击跳转](https://arxiv.org/abs/2611.10443)

**0. 论文标题**
- **英文标题**: Spatial Representation Distillation and Knowledge Routing for Vision-Language-Action Models
- **中文标题**: 面向视觉-语言-动作模型的空间表示蒸馏与知识路由
- **研究机构**: SeoulTech (首尔科技大) 等韩国研究机构
- **一句话总结**: 提出 SPARK-VLA 框架，通过冻结原始视觉通路并并行蒸馏 3D 专家知识，结合动作梯度驱动的知识路由器，在仅使用 0.5B 语言模型和 53M 可训练参数的情况下，实现了无需显式 3D 输入的高性能机器人操作。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作模型（VLA）的 3D 空间理解能力，以完成需要精确几何感知的机器人操作任务（属于具身智能/机器人操作领域的方法创新）。
- **研究动机**: 现有 VLA 获取 3D 空间能力的方法存在两难：要么依赖推理时的显式 3D 输入（如深度图、点云，对硬件和传感器要求高）；要么在单一视觉通路中隐式注入空间知识，这会破坏预训练 VLM 原有的 2D 视觉-语义表征，导致“学了空间、丢了语义”。
- **本质改动**: 不改动原始视觉通路以保留通用语义，而是并行增加一个 LoRA 分支通过“注意力响应蒸馏”向 3D 专家学空间几何；同时设计一个轻量级路由器，利用动作损失的反向传播梯度作为监督信号，按需融合通用和空间视觉 token。
- **技术溯源**: 基于 OpenVLA-OFT 框架搭建，语言骨干采用 Qwen2.5-0.5B，视觉编码器采用 DINOv2，3D 教师模型采用 VGGT。

**2. 技术拆解**
- **核心方法**: 
  1. **空间表示蒸馏**：在冻结的原始视觉通路外，加一个 LoRA 适配的分支。训练时，让该分支的 Query 与冻结的 3D 专家（VGGT）的 Key/Value 计算注意力，通过 L1 损失对齐两者的注意力响应（Attention responses），从而让 LoRA 分支学会空间感知。
  2. **知识路由**：将双分支输出的 token 拼接，通过一个包含交叉注意力和 MLP 的轻量路由器，结合文本指令计算门控概率，Top-K 选择对当前动作有用的 token 送入 LLM。
- **关键细节**: 
  - **输入输出**：输入 RGB 图像和语言指令，输出机器人动作。
  - **模型规模**：语言骨干 0.5B，总可训练参数仅约 53M（包含 LLM LoRA、视觉 LoRA、投影层、路由器和动作头）。
  - **推理阶段**：完全抛弃 3D 专家，仅使用双分支视觉编码器和路由器，无需额外 3D 传感器输入。
- **训练/优化目标**: 
  - 总损失 = 动作损失 (L1 回归) + 注意力响应蒸馏损失 (L1) + 路由器损失。
  - **路由器训练机制**：没有人工标注的 token 重要性标签。作者计算动作损失对路由器门控概率的梯度，取负值并用 ReLU 激活作为“伪标签”（梯度为负说明增大该 token 概率能降低动作误差）。结合动量更新来稳定训练，并使用 Focal BCE 分类损失，辅以预算正则化（控制路由比例）和熵正则化（防止门控概率坍塌）。

**3. 实验结果**
- **实验设置**: 
  - **数据集**：LIBERO, LIBERO-Plus (包含光照、背景、噪声等多种视觉扰动), CALVIN, 以及真实世界操作（包含干净环境和复杂厨房环境）。
  - **对比对象 (Baseline)**：OpenVLA, OpenVLA-OFT, $\pi_0$, VLANeXt, VLA-Adapter, UniVLA 等不同规模的 SOTA VLA 模型。
- **评价指标**: 
  - LIBERO/LIBERO-Plus/真实世界：任务成功率 (Success Rate, SR)。
  - CALVIN：连续完成子任务的平均长度 (Avg. Len)。
- **主要结果**: 
  - **LIBERO**：平均成功率 98.5%。在 Tiny-scale（<1B）模型中表现最佳，参数量（53M）仅为同量级 VLA-Adapter 的 1/11，且超越了众多 2B 到 8B 级别的大模型。
  - **LIBERO-Plus**：平均成功率 78.6%。在光照、背景、噪声等扰动下鲁棒性极强，比同量级 VLA-Adapter 高出 19.6%，证明路由器能有效过滤干扰 token。
  - **CALVIN**：在 ABCD->D 设置下平均长度达 4.61，在更具挑战的 ABC->D (Zero-shot) 设置下达 4.42，性能媲美 7B/8B 参数的 UniVLA。
  - **真实世界**：6 个任务平均成功率 52.0%，显著优于 OpenVLA-7B (11.7%) 和 $\pi_0$-3B (45.0%)。在需要空间推理的复杂厨房场景中优势尤为明显。

### 29. 🔥 [SimDuoReal: Object-Centric Bimanual Policy for Emergent Dexterity] (SimDuoReal：面向涌现灵巧性的以物体为中心的双臂策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.10410` | [点击跳转](https://arxiv.org/abs/2611.10410)

**0. 论文标题**
- **英文标题**: SimDuoReal: Object-Centric Bimanual Policy for Emergent Dexterity
- **中文标题**: SimDuoReal：面向涌现灵巧性的以物体为中心的双臂策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出一种以物体位姿为目标的双臂强化学习框架，通过改变训练环境的目标采样让抓取、手内调整和交接等复杂行为自然涌现，并蒸馏为单一策略，在真实机器人上实现零样本的通用双臂灵巧操作。

**1. 整体逻辑**
- **研究任务**: 双臂灵巧手操作（Bimanual dexterous manipulation），即协调双臂和灵巧手完成物体的抓取、手内调整、交接和精确对齐等复杂任务。
- **研究动机**: 现有双臂系统通常依赖特定任务的奖励函数设计或动作序列编排来指定双手的协调（如谁去抓、何时交接），这导致策略难以复用到新任务，扩展到新行为需要反复进行人工工程调试。
- **本质改动**: 摒弃为每个具体行为（抓取、交接等）设计独立奖励或动作序列的做法，统一使用“以物体为中心”的位姿目标奖励，仅通过改变训练时的目标采样分布和工作空间约束，让复杂的双臂协调行为在训练中自然涌现。
- **技术溯源**: 基于 SimToolReal（单臂以物体为中心的操作）、GraspXL（手-物体位移特征）、EPO（非对称 Actor-Critic 强化学习算法）、DAgger（模仿学习/行为克隆）、FoundationPose（6D 位姿追踪）。

**2. 技术拆解**
- **核心方法**: 训练三个共享同一物体中心奖励的专家策略（左臂专家、右臂专家、双臂交接专家），通过不同的目标采样机制让其各自掌握工作空间内操作和跨空间交接；然后在过渡状态上微调这些专家，最后使用 DAgger 和 RL 将它们蒸馏成一个统一策略。部署时只需输入物体的目标位姿轨迹（来自 VR 或视频）。
- **关键细节**: 
  - **输入输出**: 输入为机器人本体感知、物体当前与目标位姿、以物体为中心的几何特征（手-物体位移、手-手位移）；输出为 58 维动作（手臂相对位移和手部绝对目标）。
  - **专家训练**: 左/右臂专家只在各自工作空间内采样目标，学习抓取和手内调整；交接专家初始状态为一手持有物体，目标在另一手空间，强制学习交接（包括交出前调整姿态以露出接收区域）。
  - **统一表示与奖励**: 共享角色条件（Role-Conditioned）的物体中心奖励，包含位姿进度、目标接触、非目标分离、成功奖励及速度惩罚。
  - **蒸馏**: 收集专家切换时的过渡状态微调专家，使用 DAgger 匹配教师动作，结合 RL 损失函数进行蒸馏。
- **训练/优化目标**: 强化学习使用 EPO 算法和非对称 Critic。蒸馏阶段的损失函数为 $\mathcal{L} = w_{\text{DAgger}}\mathcal{L}_{\text{DAgger}} + w_{\text{rl}}\mathcal{L}_{\text{rl}}$，即模仿教师动作的 DAgger 损失与共享物体中心奖励下的策略梯度 RL 损失之和。

**3. 实验结果**
- **实验设置**: 
  - **数据集与测试环境**: 仿真环境（使用程序化生成的基础物体）；真实硬件环境（2台 Franka Research 3 机械臂，22自由度 Sharpa Wave 灵巧手，3个 ZED RGB-D 相机，Meta Quest 3 VR）。
  - **对比对象 (Baseline)**: 端到端训练（End-to-End training）、无交接专家的链式专家（通过中间放置来转移物体）、无过渡状态微调的教师、无专家场景的学生、无 RL 损失的学生。
- **评价指标**: 仿真中评估成功率（SR）、任务进度（Prog.，到达的航点百分比）和完成时间（Time）；真实世界中评估四个任务（条码扫描、peg insertion、清洁、烹饪）的成功率（每任务 20 次试验）。
- **主要结果**: 
  - **真实世界**: 统一策略在 4 个任务中，使用未见过的物体且无任务特定微调，总成功率达到 76.3%（80 次试验中成功 61 次，具体为条码扫描 15/20，peg insertion 15/20，清洁 16/20，烹饪 15/20）。
  - **仿真对比**: 在条码扫描任务中，完整 SimDuoReal 策略成功率达 85.0%，显著优于无交接专家的 60.4%、无过渡微调的 79.4% 以及无 RL 损失的 81.6%。证明了交接专家、过渡状态微调和 RL 蒸馏的必要性。

### 30. 🔥 [World In-Context Learning for Agentic Robot Manipulation] (面向智能体机器人操作的世界上下文学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12885` | [点击跳转](https://arxiv.org/abs/2611.12885)

**0. 论文标题**
- **英文标题**: World In-Context Learning for Agentic Robot Manipulation
- **中文标题**: 面向智能体机器人操作的世界上下文学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出世界上下文学习（WICL）范式，让冻结的大模型在仿真环境中通过单条演示进行任务排练，将环境反馈写入上下文而非权重，从而在机器人操作任务上以零梯度更新超越了最强的传统训练策略。

**1. 整体逻辑**
- **研究任务**: 机器人操作（Robot Manipulation），即让具身智能体根据任务指令执行物理世界的交互与操作。
- **研究动机**: 传统训练的动作策略（如行为克隆）将技能写死在网络权重里，导致策略与训练数据分布强耦合，遇到分布偏移就拉胯；而现有的上下文学习（ICL）由于缺乏当前环境的实时反馈，性能始终无法匹敌训练策略。
- **本质改动**: 把“世界反馈”拉进上下文学习里。作者发现 Agent 在上下文中学习的是语义（任务步骤和物体角色）而非视觉外观，因此让模型在仿真世界中先“彩排”任务，把试错反馈和语义经验写回 Context，而不是去 update 权重。
- **技术溯源**: 基础大模型（Foundation model）与物理仿真器（Simulator），具体基座模型名称原文未提及。

**2. 技术拆解**
- **核心方法**: 提出世界上下文学习（WICL）范式，并开发了 RoboScript 模块化系统。模型从单条演示起手，在仿真环境中进行任务排练（Rehearsal）获取世界反馈，将学到的知识冻结为任务记忆（Task Memory）。部署时采用数据隔离机制，确保所有输入在真实机器人上均可获取。
- **关键细节**: 
  - 输入输出：输入为单条演示（Single demonstration）和当前场景状态，输出为操作动作/脚本。
  - 系统架构：RoboScript 包含仿真排练、任务记忆冻结与提取、数据隔离部署、反思（Reflection）优化以及跨具身记忆适配（Cross-embodiment memory adaptation）等模块。
  - 规模与超参：原文未提及具体模型参数量与关键超参。
- **训练/优化目标**: 零梯度更新（No gradient updates）。核心机制是通过在仿真世界中的交互排练获取环境反馈，并结合反思（Reflection）机制在上下文中迭代优化任务记忆。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：RoboTwin 2.0（包含 50 个任务，涵盖干净 clean 和随机化 randomized 设置）。
  - 对比对象：最强的训练动作策略（具体 baseline 名称原文未提及）。
  - 物理测试：迁移至物理双臂机器人（Physical dual-arm robot）。
- **评价指标**: 平均成功率（Mean success rate）。
- **主要结果**: 
  - 在 RoboTwin 2.0 的 50 个任务上，单条演示且无梯度更新的情况下，平均成功率达到 83.4%，比最强的训练动作策略高出 20 多个百分点。
  - 验证了该方法具备跨视觉分布泛化能力，通过反思机制能持续提升性能，且表现出 Scaling 特性（随基础模型规模提升而变好）。
  - 成功通过跨具身记忆适配，将仿真中学习的记忆迁移到了真实的物理双臂机器人上。

### 31. 🔥 [SWAM: Scaling World Action Models with Cross-Modal Alignment] (SWAM：通过跨模态对齐扩展世界动作模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12870` | [点击跳转](https://arxiv.org/abs/2611.12870)

**0. 论文标题**
- **英文标题**: SWAM: Scaling World Action Models with Cross-Modal Alignment
- **中文标题**: SWAM：通过跨模态对齐扩展世界动作模型
- **研究机构**: 原文未提及
- **一句话总结**: 构建了一个4.7万小时的多源数据池，通过细粒度语言标注和特定的双流架构设计，在保留视频生成先验的同时引入动作监督，大幅提升了世界动作模型在未见场景下的机器人控制泛化能力。

**1. 整体逻辑**
- **研究任务**: 语言条件下的机器人操作控制。具体来说，就是把预训练的视频生成模型改造成“世界动作模型（WAM）”，让它既能预测未来的视频画面变化，又能直接输出机器人的执行动作。
- **研究动机**: 现有的WAM在引入动作预测后，很容易把视频预训练阶段好不容易学好的“语言-视频”对齐先验给破坏掉。这种模态间的未对齐，导致模型在没见过的场景里泛化能力很差。
- **本质改动**: 搞了一个包含通用视频、第一人称视频、人类演示（UMI）和机器人演示的超大数据池，并设计了一套跨模态对齐的“配方”。核心在于：用细粒度的语言标注保住视频先验，用人类演示补齐动作监督，并在模型架构上让动作分支直接复用视频分支的语言理解能力，而不是自己重新学。
- **技术溯源**: 基于预训练视频生成模型 Wan (Wan2.2-TI2V-5B) 初始化视频分支，采用 MoT 架构，文本编码器使用 UMT5-XXL，视频 VAE 使用 Wan2.2 原生版本，数据格式基于 LeRobot 2.1。

**2. 技术拆解**
- **核心方法**: 
  1) **多源数据与语言标注**：整合4类数据，用VLM做子任务分割，并生成包含操作细节、场景和光照信息的多粒度文本描述，确保语言和视频内容精准对齐。
  2) **双流架构与条件传递**：视频分支和动作分支各自维护独立的残差流。视频分支保留文本交叉注意力，而动作分支**不加**文本交叉注意力，仅通过单向注意力从视频分支获取语言信息。这能避免动作分支重新学习语言对齐而干扰预训练先验。
  3) **联合训练策略**：所有样本都参与视频预测损失，只有带有效动作标签的样本才参与动作预测损失，让不同模态监督各司其职。
- **关键细节**: 
  - **数据规模**：总计约47,000小时（11,000h通用视频，11,000h第一人称视频，15,000h UMI人类演示，10,000h机器人演示）。
  - **输入输出**：输入为3个相机视角（头部、左右手腕）拼接的 256×320 图像及当前状态；输出为每个 chunk 包含 2个视频隐帧和 48步动作。
  - **动作表示**：16维双臂末端执行器位姿（3D位置 + 4D四元数 + 1D夹爪开合）。
- **训练/优化目标**: 联合 Flow Matching 损失。$\mathcal{L} = \mathcal{L}_{\text{video}} + \mathcal{L}_{\text{action}}$。视频分支在隐空间预测流速度，动作分支在动作空间预测流速度。

**3. 实验结果**
- **实验设置**: 
  - **仿真环境**：RoboTwin 2.0（50个操作任务）。
  - **真实环境**：双臂 Flexiv Rizon 4 平台（杯子堆叠、毛巾折叠、礼物入盒 3个任务）。
  - **Baseline**：VLA模型（StarVLA, $\pi_{0.5}$, Xiaomi Robotics-0, X-VLA）和 WAM模型（Fast-WAM, LingBot-VA, OpenWAM, X-WAM, 4D-WAM）。
  - **测试条件**：分 Easy（同场景 Clean-to-Clean）和 Hard（改变背景、光照、杂物、物体等 Clean-to-Random）。
- **评价指标**: SR（整体任务成功率）和 PSR（基于子任务完成比例的部分成功率）。
- **主要结果**: 
  - **仿真表现**：在 Hard 设置下，本文模型 SR 达到 61.56%，比最强 baseline OpenWAM (48.70%) 高出 12.86 个百分点；Easy 设置下为 88.10%。综合平均 SR 74.83%，位列所有对比方法第一。
  - **真机表现**：在 Hard 设置下，3个任务的平均 SR 达到 40.00%，比 OpenWAM (23.33%) 高出 16.67 个百分点；平均 PSR 达到 50.36%，比 $\pi_{0.5}$ (37.78%) 高出 12.58 个百分点。
  - **结论验证**：详细的子任务描述、UMI人类动作监督、以及特定的双流架构设计，均被证明能显著提升未见场景的泛化能力；且预训练数据量（视频小时数）越大，控制泛化性能越好，展现了明显的 Scaling 效应。

### 32. 🔥 [$Σ$-LeWM: Learning World Models via S-Information for Robot Control] ($\Sigma$-LeWM：通过 S-信息学习用于机器人控制的世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.12732` | [点击跳转](https://arxiv.org/abs/2611.12732)

**0. 论文标题**
- **英文标题**: $Σ$-LeWM: Learning World Models via S-Information for Robot Control
- **中文标题**: $\Sigma$-LeWM：通过 S-信息学习用于机器人控制的世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 在 LeWorldModel 基础上引入反向和逆动力学辅助任务，通过最大化信息论中的 S-信息来约束潜在空间结构，显著提升了机器人控制任务中的长视野规划性能和计算效率。

**1. 整体逻辑**
- **研究任务**: 学习用于机器人基于模型的控制（MPC）的无解码器潜在世界模型（Latent World Model），将高维观测映射到结构良好的潜在空间以进行高效规划。
- **研究动机**: 现有的无解码器世界模型（如 LeWM）仅靠前向动力学和熵正则化，潜在空间缺乏足够的控制相关结构（control-relevant structure），导致在长视野规划和复杂机器人任务中性能受限，且测试时的规划计算开销大。
- **本质改动**: 引入信息论视角，增加反向动力学和逆动力学两个辅助对比损失，最大化状态、动作和下一状态之间的 S-信息（Total Correlation + Dual Real Correlation），从而强制潜在嵌入具备更强的物理结构和可预测性。
- **技术溯源**: 基于 LeWorldModel (LeWM)，结合解耦对比损失（Decoupled Contrastive Loss, DCL）以及信息论中的 S-Information 理论。

**2. 技术拆解**
- **核心方法**: 在 LeWM 的前向预测和 SIGReg 正则化基础上，训练时增加两个辅助网络：1) 反向动力学预测器，用下一状态和动作预测当前状态；2) 逆动力学预测器，用当前和下一状态预测动作。两者均采用解耦对比损失（DCL）。推理时丢弃辅助网络，规划方式（CEM）与 LeWM 完全一致。
- **关键细节**: 输入为高维观测（如图像）和动作，输出为潜在特征。模型包含 Observation encoder, Action encoder, Forward/Backward/Inverse dynamics 网络。关键超参：多步前向预测最大步数 $m=5$，反向损失权重 $\lambda_{back}=0.1$，逆向损失权重 $\lambda_{inv}=0.05$，DCL 温度 0.1，Batch size 128。CEM 规划器每次采样 300 个动作序列，选 top 30 更新分布。
- **训练/优化目标**: 总损失为前向损失（多步 MSE + SIGReg）加上反向和逆向的 DCL 损失。理论上，这三个方向的互信息最大化等价于最大化当前状态、动作和下一状态三者联合分布的 S-信息（即 Total Correlation 与 Dual Real Correlation 之和）。

**3. 实验结果**
- **实验设置**: 数据集与环境包括标准世界模型基准（Push-T, TwoRoom, Reacher, OGBench-Cube, OGBench-Scene）以及基于 IsaacSim 的机器人操作任务（Gear-Assembly, Cube-Stacking）。对比 Baseline 包括 LeWM, Sub-JEPA, RC-aux, SMWM, AC-MTM。
- **评价指标**: 任务成功率（%）、规划计算效率（CEM 搜索预算/延迟）、潜在表示质量（通过线性探针评估物理量恢复的 $R^2$ 和 AUROC）。
- **主要结果**: 
  1. **性能提升**：在 OGBench-Scene 上成功率比 LeWM 提升 23 个点（80.7% vs 57.7%），Push-T 提升 4.5 个点（94.5% vs 90.0%）；在 Gear-Assembly 严格任务中成功率从 10.9% 大幅提升至 74.9%。
  2. **规划效率**：在 Push-T 上，仅需 8 次 CEM 迭代（算力减少 3.75 倍）即可超越 LeWM 30 次迭代的效果（91.2% vs 85.2%），长视野规划（horizon=15）表现也更稳定。
  3. **表示质量**：线性探针表明，多步前向任务提升了机器人末端执行器状态的表示，而反向和逆向任务有效恢复了物体位置等环境信息的表示，使潜在空间的物理意义更清晰、更易于下游规划器学习。

### 33. 🔥 [ForeAct: Geometry-Guided Action Learning from World Representations] (ForeAct：基于世界表示的几何引导动作学习)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2611.11500` | [点击跳转](https://arxiv.org/abs/2611.11500)

**0. 论文标题**
- **英文标题**: ForeAct: Geometry-Guided Action Learning from World Representations
- **中文标题**: ForeAct：基于世界表示的几何引导动作学习
- **研究机构**: 原文未提及
- **一句话总结**: 提出ForeAct，将预训练视频世界模型改造为单次前向传播的动作表示骨干，通过下一帧深度辅助监督注入几何感知能力，实现无需迭代去噪和额外几何模块的低延迟机器人操作。

**1. 整体逻辑**
- **研究任务**: 机器人操作。具体是根据单目RGB图像和语言指令预测动作序列（action chunk），不需要本体感觉（proprioceptive state）输入。
- **研究动机**: 现有的视频动作模型（WAMs）靠迭代扩散去噪来生成未来帧，计算开销大且缺乏显式的空间结构；而几何感知策略需要外挂几何骨干网络，增加参数量，且很难捕捉动作条件下的时空动态变化。
- **本质改动**: 不搞迭代生成未来帧，也不引入独立的几何骨干。直接把预训练的视频世界模型改成单次前向传播（single-pass）的表示骨干，通过引入可学习的几何token，并在训练时用下一帧的相对深度做辅助监督，把几何空间知识融进共享的视频表示里。推理时把几何解码器一删，直接出动作。
- **技术溯源**: 基于预训练视频世界模型 Cosmos-Predict2-2B Video2World，文本编码器使用 T5，视觉编码器使用视频 VAE，动作解码使用基于 Flow-matching 的 Action DiT，深度监督目标由 MoGe-3 离线生成。

**2. 技术拆解**
- **核心方法**: 
  1. 单次世界表示（Single-Step World Representation）：在扩散终点（$t_{diff}=0$）对当前观测的干净 latent 直接做一次前向传播，提取锚定当前场景的动作特征，省去迭代去噪和未来帧合成。
  2. 共享的未来感知几何特征（Shared Future-Aware Geometric Features）：插入少量可学习的几何 token，跟视觉 token 做双向自注意力交互。训练时，几何 token 被投影并解码成下一帧的相对深度，用这个深度预测任务来监督共享表示。推理时直接移除几何解码器。
- **关键细节**: 
  - 输入输出：输入是当前 RGB 观测和语言指令，输出是动作序列。不需要本体感觉输入。
  - 模型结构：共享的 Cosmos 视频 DiT 骨干。输出的视觉 token 喂给 16 层的 Action DiT（隐藏层维度 1024）来预测动作；几何 token（默认 8 个）通过几何读出头预测深度。
  - 规模：总参数量约 2.1B。
  - 关键超参：动作 horizon 在 LIBERO 设为 8，在 SimplerEnv 设为 16；几何辅助损失权重 $\lambda_{geo}=0.01$。
- **训练/优化目标**: 
  - 动作损失：基于条件流匹配（conditional flow matching），让动作专家回归传输速度。
  - 几何损失：在 latent 空间、像素空间和空间梯度空间，对预测的下一帧深度进行监督（target 由冻结的 VAE 和 MoGe-3 生成）。总损失是动作损失和几何损失的加权和。

**3. 实验结果**
- **实验设置**: 
  - 数据集：LIBERO（包含 Spatial, Object, Goal, Long 四个子集），SimplerEnv-Bridge（WidowX 机器人，4 个任务），以及 6 个真实世界桌面操作任务（Franka Emika Panda 机械臂）。
  - 对比对象（baseline）：OpenVLA, $\pi_0$, $\pi_0$-FAST, GR00T N1.5, DepthVLA, Fast-WAM, Cosmos Policy 等。
- **评价指标**: 任务成功率（Success rate），推理延迟（Inference latency，毫秒）。
- **主要结果**: 
  - LIBERO：平均成功率 96.6%，在没有额外大规模机器人动作预训练的 WAMs 里表现很好，接近 Fast-WAM (97.6%) 和 Cosmos Policy (98.5%)。
  - SimplerEnv-Bridge：平均成功率 63.5%，超过 GR00T N1.5 (61.9%)。
  - 真实世界：90 次 rollout 中成功 67 次（74.4%），优于 $\pi_0$ (57.8%) 和 FastWAM (64.4%)。
  - 延迟：在单张 H20 GPU 上推理延迟为 168 ms，大概是 Cosmos Policy 的三分之一，同时保住了高成功率。
