### 37. 🔥 [SimVLA: Zero-Shot Sim-to-Real VLA Learning for Mobile Manipulation] (SimVLA：用于移动操作的零样本仿真到现实VLA学习)
- **研究机构**: `原文未明确提及具体高校或研究机构名称，致谢中提及受韩国政府（MSIT）资助及LG Electronics提供硬件支持`
- **Arxiv ID**: `2610.11248` | [点击跳转](https://arxiv.org/abs/2610.11248)

**0. 论文标题**
- **英文标题**: SimVLA: Zero-Shot Sim-to-Real VLA Learning for Mobile Manipulation
- **中文标题**: SimVLA：用于移动操作的零样本仿真到现实VLA学习
- **研究机构**: 原文未明确提及具体高校或研究机构名称，致谢中提及受韩国政府（MSIT）资助及LG Electronics提供硬件支持
- **一句话总结**: 提出SimVLA框架，完全依赖合成仿真数据（结合动作轨迹、视觉语言监督和部署rollout数据）训练VLA模型，实现移动操作任务的零样本Sim-to-Real迁移，性能超越使用真实数据微调的基线。

**1. 整体逻辑**
- **研究任务**: 训练用于长序列移动操作（mobile manipulation）的视觉-语言-动作（VLA）模型，并实现零样本的仿真到现实（Sim-to-Real）迁移。
- **研究动机**: 真实世界机器人动作数据收集成本高且缺乏多样性，移动操作还面临部分可观测、高维动作空间及导航与操作耦合的挑战。现有基于仿真的方法多仅将仿真作为动作数据的生成器，未充分利用仿真中的特权信息（如空间、几何、子任务状态），导致策略在分布外（OOD）环境下泛化能力差。
- **本质改动**: 将仿真不仅作为动作轨迹的来源，还作为视觉-语言监督（SimVQA）和部署导向的rollout数据（SimDeploy）的来源，通过多模态互补监督进行两阶段VLA训练。
- **技术溯源**: 基于预训练的VLM（PaliGemma）和Flow-matching动作专家（参考 $\pi_{0.5}$ 架构），使用 Isaac Lab 仿真器，结合 cuRobo 进行运动规划，BODex 生成抓取姿态。

**2. 技术拆解**
- **核心方法**: 提出SimVLA框架，构建三个互补的仿真数据源：1) SimAction：通过组合原子技能API和运动规划生成的大规模合成动作数据；2) SimVQA：利用仿真特权状态生成的视觉问答数据，提供空间、几何和子任务级监督；3) SimDeploy：在多样化仿真环境中通过策略rollout收集的部署导向数据。训练分为预训练（SimAction + SimVQA，采用知识隔离冻结VLM骨干的动作梯度）和后训练（SimAction + SimDeploy混合，解冻骨干微调）。
- **关键细节**: 
  - 输入输出：输入为RGB图像（前视、左右腕）、语言指令和本体感觉；输出为23维连续动作（双臂末端执行器位姿+底盘速度）。
  - 模型结构：PaliGemma VLM骨干 + Flow-matching动作专家（类似 $\pi_{0.5}$ 架构）。
  - 规模：SimAction约20万条轨迹（2778小时），涵盖35个任务；SimVQA约100万条样本；SimDeploy 2.2万条轨迹（460小时）。
  - 关键机制：采用混合系统辨识（Hybrid System Identification）同时约束关节空间和末端执行器空间误差以减小Sim-to-Real动力学gap，并辅以广泛的域随机化（Domain Randomization）。
- **训练/优化目标**: 
  - 预训练：联合优化Flow-matching损失（连续动作）、自回归FAST-tokenized动作损失和SimVQA自回归损失。采用知识隔离机制，阻断动作头对VLM骨干的梯度以防破坏预训练表征。
  - 后训练：仅在SimAction和SimDeploy混合数据上优化Flow-matching损失，允许梯度更新VLM骨干以进行任务特定适应。

**3. 实验结果**
- **实验设置**: 
  - 数据集与对比对象：在真实环境（Mock kitchen, Pantry, Real home）中评估。对比基线包括 $\pi_{0.5}$（使用50或200个真实世界in-domain演示微调）和 MolmoB0T（现有零样本sim-to-real基线）。硬件平台为Anubis双臂移动操作机器人。
  - 评价指标：任务进度（Task progress，完成预定义子目标的百分比）和二元成功率（Binary success rate）。
- **主要结果**: 
  - 在真实世界Mock kitchen中，SimVLA（54.4%平均任务进度）超越了使用50个真实演示微调的 $\pi_{0.5}$。
  - 在OOD环境（OOD-pos, OOD-vis）以及Pantry和Real home中，$\pi_{0.5}$ 性能大幅下降（如在Real home中200-demos仅为35%和23%进度），而SimVLA保持鲁棒（达到60%和47%进度）。
  - 消融实验证明：SimVQA提供了关键的空间推理能力（3D位置误差降至0.06m）；SimDeploy在需要场景级泛化的任务（如放入水槽/抽屉）中带来显著提升；预训练阶段不可或缺。
  - 与MolmoB0T对比，SimVLA在未见过的仿真环境中保持高成功率（如Pick任务在SimVLA kitchens达91.2% vs 9.7%），并能处理部分可观测情况下的主动视觉搜索。

### 38. 🔥 [When Listening Becomes Easier: Scrubbing Visual Cues for Shortcut-Free VLAs] (当倾听变得更容易：为无捷径的VLA模型洗刷视觉线索)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.10912` | [点击跳转](https://arxiv.org/abs/2610.10912)

**0. 论文标题**
- **英文标题**: When Listening Becomes Easier: Scrubbing Visual Cues for Shortcut-Free VLAs
- **中文标题**: 当倾听变得更容易：为无捷径的VLA模型洗刷视觉线索
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种名为 Task Scrubbing 的对抗训练方法，通过破坏视觉特征中任务信息的稳定性，迫使 VLA 模型在预测动作时依赖语言指令，从而有效消除视觉捷径学习。

**1. 整体逻辑**
- **研究任务**: 解决视觉-语言-动作（VLA）模型在机器人操作任务中的视觉捷径学习问题，提升模型在分布外（OOD）条件下的泛化能力和鲁棒性。
- **研究动机**: VLA 模型在训练数据多样性有限时，容易把视角、背景等与任务无关的视觉特征当成捷径，用来替代语言指令。现有工作多认为这是数据不够丰富导致的，但没搞清楚不同 VLM 骨干网络对捷径的敏感度差异，也不清楚怎么在不丢失有用视觉信息的前提下把视觉捷径去掉。
- **本质改动**: 提出 Task Scrubbing（任务洗刷）这种领域对抗训练方法。它在视觉通路上加一个对抗分类器并反转梯度，让视觉特征里的任务信息在训练中变得不稳定，逼着模型去听语言指令；同时提出了 action margin 等表征级指标来量化和追踪捷径行为。
- **技术溯源**: 基于多种现有 VLA 架构（如 $\pi_0$, $\pi_{0.5}$, SmolVLA, MiniVLA）及不同的 VLM 骨干网络（如 SmolVLM1/2, PaliGemma, Qwen2.5-VL）。

**2. 技术拆解**
- **核心方法**: Task Scrubbing（任务洗刷）。在视觉 token 进入语言模型或动作骨干之前，接一个辅助任务分类器（均值池化 + LayerNorm + 两层 MLP）。这个分类器试图从视觉特征里预测任务标签，同时通过梯度反转层把梯度反传给视觉通路，让视觉通路去“欺骗”分类器，从而破坏视觉特征中任务身份信息的稳定性。
- **关键细节**: 
  - 输入输出：输入多视角的视觉 token，辅助分类器输出任务标签。
  - 模型结构：如果 ViT 是微调的，直接更新视觉通路；如果 VLM 骨干是冻结的（比如 SmolVLA），就在视觉投影层加一个可训练的残差适配器（residual adapter）来接收反转梯度，计算开销极小。
  - 关键超参：总损失是动作损失加上辅助对抗损失，辅助损失的权重 $w$ 需要根据具体模型和任务调参（比如在 LIBERO 中 SmolVLA 的 $w=2$）。
- **训练/优化目标**: 主目标是动作预测损失（$\mathcal{L}_{action}$），辅助目标是任务分类的交叉熵损失（$\mathcal{L}_{task}$）。前向传播时分类器正常预测，反向传播时分类器最小化 $\mathcal{L}_{task}$，而视觉通路通过梯度反转最大化 $\mathcal{L}_{task}$。

**3. 实验结果**
- **实验设置**: 
  - 数据集与环境：LIBERO Spatial（高视角差异设置）、RoboTwin 2.0 仿真器（Place-Block 任务，背景颜色作为捷径）、真实 ALOHA 机器人平台（杯子颜色及背景颜色作为捷径）。
  - 对比对象（baseline）：未使用 Task Scrubbing 的基线 VLA 模型（$\pi_0$, $\pi_{0.5}$, SmolVLA 及其变体 SmolVLA-V1, SmolVLA-VLM, MiniVLA），以及直接注意力正则化（Attention Regularization）方法。
- **评价指标**: 
  - 分布内成功率（ID Succ.）：训练分布内的任务成功率。
  - 分布外成功率（OOD Succ.）：视觉线索与语言指令交叉（不匹配）时的任务成功率。
  - 捷径率（SC, Shortcut Rate）：在 OOD 测试中，模型执行与视觉线索一致而非语言指令一致的任务的比例。
  - 表征级指标：Action margin（动作边际，衡量动作表征更靠近视觉线索还是语言任务）和 Language share（语言占比，衡量语言和视觉线索对动作表征在任务轴上的相对影响）。
- **主要结果**: 
  - Task Scrubbing 显著降低了捷径率（SC 降至 0% 或接近 0%），并大幅提升了 OOD 成功率。例如在 LIBERO 高视角差异下，$\pi_0$ 的 OOD 成功率从 0% 提升至 48%，SC 从 99% 降至 0%；SmolVLA 的 OOD 成功率从 10% 提升至 73%，SC 保持为 0%。
  - 在 RoboTwin 和真实 ALOHA 实验中，Task Scrubbing 同样有效消除了背景或物体颜色带来的视觉捷径。例如在真实机器人带背景干扰的条件下，SmolVLA 的 OOD 成功率从 0% 提升至 100%，SC 从 100% 降至 0%。
  - 机制分析表明，视觉捷径在早期层注入动作表征，而 Task Scrubbing 通过降低视觉特征的稳定性，成功将信息路由转移到语言指令上（Language share 显著提升）。
  - 对比实验显示，直接注意力正则化（Attention Regularization）在 $\pi$ 系列模型上失败（$\pi_0$ 仍保留 68% SC），证明单纯增加语言注意力比例不足以保证语言控制动作，Task Scrubbing 更有效。

### 39. 🔥 [Cross-Embodiment Robot Foundation World Models with Latent Actions] (基于潜在动作的跨具身机器人基础世界模型)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.10846` | [点击跳转](https://arxiv.org/abs/2610.10846)

**0. 论文标题**
- **英文标题**: Cross-Embodiment Robot Foundation World Models with Latent Actions
- **中文标题**: 基于潜在动作的跨具身机器人基础世界模型
- **研究机构**: 原文未提及
- **一句话总结**: 本文属于机器人学/世界模型领域的方法创新工作，提出通过逆动力学模型学习统一的潜在动作空间来替代显式动作编码，解决了异构动作空间导致的跨具身表征分离问题，使世界模型在预训练和微调时能高效跨具身迁移，且性能随预训练具身数量正向扩展。

**1. 整体逻辑**
- **研究任务**: 构建能泛化到不同机器人具身（跨具身）的基础世界模型，用于预测未来视觉状态，并辅助下游机器人（如VLA策略）进行动作规划与选择。
- **研究动机**: 机器人具身（形态、传感器、执行器）高度异构。现有直接使用显式动作标签（如末端位姿）条件化的世界模型（EAC-WM），会导致不同具身的动作表征在潜空间中相互分离（disjoint），严重限制了跨具身知识的迁移和对未见具身的适应能力。
- **本质改动**: 放弃直接编码显式动作，改为通过逆动力学模型（IDM）从连续图像观测中学习一个“统一的潜在动作空间”，并用辅助的动作解码器将其对齐到物理运动，从而在预训练阶段实现跨具身动作表征的隐式对齐。
- **技术溯源**: 基于 V-JEPA-2（视觉分词器）、Transformer 架构（构建 IDM/FDM），以及潜在动作模型（Latent Action Models, LAM）的思想（如引入 Nikulin 等人的辅助运动解码损失）。

**2. 技术拆解**
- **核心方法**: 提出 LAC-WM 框架。预训练时，IDM 从相邻两帧图像提取潜在动作 $z_t$ 条件化 FDM 预测下一帧；同时引入 Motion Decoder 将 $z_t$ 解码为显式运动标签（人手姿态、机器人末端动作、相机运动）以提供物理监督。推理/微调时，训练一个 Action Projector 将特定具身的原始动作映射到该统一潜在空间。
- **关键细节**: 
  - **模型结构**：视觉编码器采用冻结的 V-JEPA-2。IDM 包含 4 层因果注意力+交叉注意力；FDM 包含 8 层自注意力+交叉注意力；动作嵌入维度为 64。Action Projector 为 2 层 MLP。
  - **训练技巧**：采用 Cross-Augmentation（对前后帧独立增强）防止 IDM 走捷径（直接把未来图像特征塞进潜空间）；动作数据做 5-step chunking 降频。
  - **微调策略**：三阶段微调（1. LoRA 微调 IDM/FDM；2. 冻结 FDM 训练 Action Projector；3. LoRA 联合微调 Projector 和 FDM，rank 均为 2）。
- **训练/优化目标**: 联合优化图像潜在预测损失（$\mathcal{L}_{recon}$，MSE）和动作解码损失（$\mathcal{L}_{motion}$，MSE），即 $\mathcal{L} = \lambda_{recon}\mathcal{L}_{recon} + \lambda_{motion}\mathcal{L}_{motion}$。

**3. 实验结果**
- **实验设置**: 
  - **预训练数据集**：EgoDex（人手操作）、Agibot（双臂人形机器人）、Droid（单臂 Franka）。
  - **下游微调/测试**：BFA（双臂 Franka+Allegro 手，RoboCasa 仿真生成）和 modified LIBERO benchmark（使用 Cosmos tokenizer 和 $\pi_{0.5}$ VLA）。
  - **Baseline**：EAC-WM（显式动作编码，预训练+微调）、EAC-WM-S（从头训练）、VLA-mean/VLA-random（纯 VLA 策略基线）。
- **评价指标**: 
  - **视频生成**：PSNR, LPIPS, FID, FVD。
  - **下游规划（动作选择）**：任务成功率 (S.R.)、接触成功率 (S.R.C.)、抬起成功率 (S.R.L.)、子目标嵌入距离 ($\delta_f$, $\delta_{fg}$)。
- **主要结果**: 
  - **视频生成质量**：LAC-WM 在各项指标上全面优于 EAC-WM（如 FVD 从 30.349 降至 23.213），能更准确地捕捉机器人动力学细节。
  - **下游规划性能**：在 BFA 灵巧操作任务中，LAC-WM 引导的动作选择比 EAC-WM 平均成功率高出 46.7%；在 LIBERO 上平均成功率从 82.4% 提升至 92.0%。
  - **Scaling 特性**：LAC-WM 的下游性能随预训练具身数量增加而正向提升；而 EAC-WM 随具身增加性能反而下降，验证了统一潜空间对跨具身预训练的关键作用。
  - **消融实验**：去掉 Motion Decoder 和 Cross-Augmentation 会导致成功率相对下降 38%，证明两者对防止捷径学习和提取物理意义动作至关重要。

### 40. 🔥 [VersaCamVLA: Camera-Configurable VLA Policies for Robotic Manipulation] (VersaCamVLA：面向机器人操作的相机可配置VLA策略)
- **研究机构**: `原文未提及`
- **Arxiv ID**: `2610.12451` | [点击跳转](https://arxiv.org/abs/2610.12451)

**0. 论文标题**
- **英文标题**: VersaCamVLA: Camera-Configurable VLA Policies for Robotic Manipulation
- **中文标题**: VersaCamVLA：面向机器人操作的相机可配置VLA策略
- **研究机构**: 原文未提及
- **一句话总结**: 提出了一种相机可配置的VLA框架，通过解耦场景表示与动作学习，将任意数量和位姿的相机视图映射为固定大小的场景token，解决了现有VLA模型在部署时对固定相机配置极度敏感的问题。

**1. 整体逻辑**
- **研究任务**: 提升视觉-语言-动作（VLA）模型在机器人操作任务中对相机数量变化和位姿偏移的鲁棒性（即相机可配置的策略学习）。
- **研究动机**: 现有VLA模型在训练时绑定了固定的相机数量和位姿。部署时一旦相机增减或位姿改变，视觉token分布就会变化，导致策略性能断崖式下降。现有解法要么依赖昂贵的多视角数据采集/新视角合成，要么依赖显式的3D/深度信息，要么直接拼接多视角token导致输入长度随相机数线性膨胀。
- **本质改动**: 将“相机集表示学习”与“动作学习”解耦，引入一个统一的“场景token接口”，把任意非空的带位姿RGB视图集合压缩成固定大小的潜在场景token，作为补充视觉条件注入预训练VLA，从而让动作专家接收稳定的视觉输入。
- **技术溯源**: 基于预训练的VLA基座模型 $\pi_{0.5}$，场景编解码器初始化自 LVSM，真实数据语义分割使用 SAM3，对比基线中多视图编码使用了 SigLIP。

**2. 技术拆解**
- **核心方法**: 采用两阶段训练框架。Stage 1：训练场景编解码器，通过多信号目标视图预测和腕部相机位姿采样（WAPS）学习固定大小的场景token。Stage 2：丢弃解码器，冻结场景编码器，用轻量级空间编码器压缩场景token，作为辅助视觉条件与基座VLA联合微调。
- **关键细节**: 
  - **输入与编码**：输入任意数量 $N$ 的带内外参RGB图像。将RGB和Plücker射线嵌入拼接后patch化，与 $L$ 个可学习场景token拼接，通过12层Transformer聚合为固定大小（如 $3 \times 32 \times 32 = 3072$）的场景token。
  - **WAPS（腕部增强位姿采样）**：训练时随机采样静态和腕部相机子集作为输入，强制解码器重建所有可用视角。利用腕部相机随机械臂运动产生的自然位姿变化，零成本提供丰富的视角多样性。
  - **多信号监督**：解码器不仅预测目标视角的RGB，还预测语义图和边缘图，迫使场景token保留与操作相关的结构和边界信息。
  - **空间压缩与注入**：Stage 2 中，一个轻量级卷积空间编码器将3072个场景token压缩为192个（$3 \times 8 \times 8$，通道2048），作为补充视觉条件拼接到基座VLA的输入中。
- **训练/优化目标**: 
  - **Stage 1**：多信号目标视图预测损失（RGB的MSE+感知损失，语义和边缘的MSE损失）。
  - **Stage 2**：Flow-matching 动作回归损失（预测动作chunk）。此阶段场景编码器冻结，仅优化空间编码器和基座VLA参数，使空间编码器成为保留任务相关信息的瓶颈层。

**3. 实验结果**
- **实验设置**: 
  - **数据集与环境**：RoboTwin 2.0（双臂，Clean和DR设置），LIBERO（单臂，4个suite），真实机器人平台（Cobot Magic双臂，3个任务）。
  - **对比基线**：ACT, DP, DP3, OpenVLA-OFT, $\pi_{0.5}$（直接拼接多视图token）。
  - **测试环境**：除标准设置外，专门设计了相机位姿扰动（方位角、距离、俯仰角随机偏移）和相机数量变化（3到6个视图）的评估协议。
- **评价指标**: 任务成功率 (%)。
- **主要结果**: 
  - **标准性能**：在RoboTwin 2.0 Clean上平均成功率52.56%（$\pi_{0.5}$为35.88%），DR上23.00%；在LIBERO上平均95.9%，与 $\pi_{0.5}$（95.8%）持平，远超DP（72.4%）和OpenVLA-OFT（94.5%）。
  - **位姿鲁棒性**：在RoboTwin未见位姿下，$\pi_{0.5}$ 成功率暴跌16.0个百分点，而VersaCamVLA仅微降0.8个百分点（53.44% -> 52.63%）。真实机器人上，未见位姿下VersaCamVLA成功率58.33%，$\pi_{0.5}$ 仅为13.33%。
  - **数量灵活性与效率**：在3到6个相机输入下，VersaCamVLA成功率稳定在52.56%~55.63%之间；且推理时视图从4增加到6，VersaCamVLA延迟仅增加7.06ms，而直接拼接token的 $\pi_{0.5}$ 增加了29.47ms。
